version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Версия Playwright связана с образом в ci.yml, openspec — с правилами spec: обновляются вручную одним PR.
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "@fission-ai/openspec"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: monthly
    groups:
      bot:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
