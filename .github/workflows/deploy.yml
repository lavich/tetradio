name: Deploy to GitHub Pages

on:
  # Выкладка только после зелёного CI на main: прямой пуш в main иначе ушёл бы на сайт без проверок.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Ветку `main` в workflow_run задаёт и pull request из форка, поэтому проверяется и событие.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # База берётся из настроек Pages: `/tetradio/` на github.io, `/` после подключения своего домена.
      - id: pages
        uses: actions/configure-pages@v6
      - run: echo "BASE_PATH=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_ENV"
      # Имя бота и адрес приёма отчётов о сбоях попадают в публичный бандл; реквизиты загрузки карт кода — только в сборку.
      # Проверки pull request (ci.yml) собирают тот же бандл без реквизитов: карты не загружаются, сервис не вызывается.
      - run: npm run build
        env:
          # Production без мока Telegram: вне Telegram — только экран «Откройте в Telegram».
          VITE_TELEGRAM_MOCK: ""
          # В workflow_run GITHUB_SHA — вершина main на момент запуска, а не собранный коммит.
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      - run: npm run check:bundle
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
