name: CI

on:
  pull_request:
  # Прогон на main сохраняет кеш npm в ветке по умолчанию: кеш из refs/pull/N/merge другим PR недоступен.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Задачи независимы и идут параллельно: каждая сама ставит зависимости. Браузер нужен только e2e.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:config
      - run: npm run spec
      - run: npm run lexicon:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Тесты на больших объёмах (scale, sync-size) идут отдельной задачей: не удлиняют unit.
  unit-heavy:
    name: unit-heavy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:heavy

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Предел стартового графа мерится на бандле deploy: те же база, имя бота, адрес приёма и debug ID отчётов о сбоях.
    env:
      BASE_PATH: /tetradio/
      VITE_TELEGRAM_MOCK: ""
      VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT || 'TetradioBot' }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || 'https://00000000000000000000000000000000@o0000000.ingest.de.sentry.io/0000000000000000' }}
      SENTRY_DEBUG_IDS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle -- --json bundle-head.json
      # Метрики базы снимает скрипт из PR над `dist` базы: так сравнение работает и пока в базе нет `--json`. Отказ базы не валит задачу.
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git fetch --depth=1 origin "$BASE_SHA" &&
            git worktree add ../base "$BASE_SHA" &&
            npm --prefix ../base ci &&
            npm --prefix ../base run build; then
            node scripts/check-bundle.ts --dist ../base/dist --json bundle-base.json || true
          fi
          node scripts/bundle-diff.ts bundle-head.json bundle-base.json >> "$GITHUB_STEP_SUMMARY"

  # Lighthouse на mock-сборке (мобильный профиль, медиана трёх прогонов): пороги LCP, TBT и веса — scripts/lighthouse-report.ts.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version matches the container image
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "$PLAYWRIGHT_IMAGE_VERSION"
      - run: npm run build
        env:
          VITE_TELEGRAM_MOCK: "1"
      - run: npm run lighthouse -- --json lighthouse.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lighthouse.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Браузер и системные пакеты уже в образе: установка через apt на runner занимала от 15 с до 6 мин.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        shards: [3]
    steps:
      - uses: actions/checkout@v7
      # Node из образа не используется: версия та же, что в deploy.yml.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version matches the container image
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "$PLAYWRIGHT_IMAGE_VERSION"
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - if: always()
        run: npm run check:flaky -- test-results/e2e.json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e-course:
    name: e2e-course (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
    strategy:
      fail-fast: false
      matrix:
        config: [course, courses]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version matches the container image
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "$PLAYWRIGHT_IMAGE_VERSION"
      - run: npm run test:e2e:${{ matrix.config }}
      - if: always()
        run: npm run check:flaky -- test-results/e2e-${{ matrix.config }}.json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.config }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # Защита main требует проверку `checks`: итоговая задача проходит, только когда прошли все остальные.
  checks:
    name: checks
    if: always()
    needs: [static, unit, unit-heavy, build, lighthouse, e2e, e2e-course]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
