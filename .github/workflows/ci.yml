name: CI

on:
  pull_request:
  # Прогон на main сохраняет кеш npm в ветке по умолчанию: кеш из refs/pull/N/merge другим PR недоступен.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Браузер и системные пакеты уже в образе: установка через apt на runner занимала от 15 с до 6 мин.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v7
      # Node из образа не используется: версия та же, что в deploy.yml.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version matches the container image
        run: test "$(node -p "require('@playwright/test/package.json').version")" = "$PLAYWRIGHT_IMAGE_VERSION"

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run spec
      - run: npm run lexicon:check
      # Предел стартового графа мерится на бандле deploy: те же база, имя бота, адрес приёма и debug ID отчётов о сбоях.
      - run: npm run build
        env:
          BASE_PATH: /tetradio/
          VITE_TELEGRAM_MOCK: ""
          VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT || 'TetradioBot' }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || 'https://00000000000000000000000000000000@o0000000.ingest.de.sentry.io/0000000000000000' }}
          SENTRY_DEBUG_IDS: "1"
      - run: npm run check:bundle
        env:
          BASE_PATH: /tetradio/

      - run: npm run test:e2e
      - run: npm run test:e2e:course

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
