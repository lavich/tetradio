# Пилот 11.10.2026: доли знакомых слов без глосс текста, %. strict — сопоставление сборщика (marks),
# lenient — мягкий подсчёт пилотного скрипта (основа 4 буквы, без стоп-списка приставок).
# Реализованный подсчёт пересчитывает доли; «Анна» проходит порог 95 %, «Мария» и «Στο μάθημα» не проходят,
# пока их не перепишут лексикой до `after`.
- id: anna
  expected: { strict: 93.7, lenient: 97.7, glosses: 1.7, passes: true }
  title: Η Άννα στη Λεμεσό
  names: [Άννα, Αντρέι, Μαρία, Μόσχα, Λεμεσό]
  glosses: {κάθε μέρα: каждый день, σπίτι: дом}
  text: |-
    Γεια σας! Με λένε Άννα. Είμαι από τη Ρωσία, από τη Μόσχα. Τώρα μένω στην Κύπρο, στη Λεμεσό. Είμαι τριάντα πέντε χρονών. Είμαι παντρεμένη και έχω δύο παιδιά, έναν γιο και μία κόρη. Ο γιος μου είναι δέκα χρονών και η κόρη μου είναι έξι. Ο άντρας μου είναι ο Αντρέι. Είναι γιατρός και δουλεύει πολύ.

    Οι γονείς μου μένουν στη Ρωσία. Ο πατέρας μου είναι εξήντα οκτώ χρονών και η μητέρα μου εξήντα πέντε. Ο πατέρας μου είναι δάσκαλος. Έχω και έναν αδελφό. Ο αδελφός μου μένει στη Μόσχα με τη γυναίκα του και τα παιδιά τους.

    Στο σπίτι μιλάμε ρωσικά. Ο άντρας μου μιλάει και αγγλικά, αλλά δεν μιλάει ελληνικά. Εγώ μαθαίνω ελληνικά. Δεν μιλάω πολύ καλά, αλλά καταλαβαίνω λίγο. Γράφω λίγο ελληνικά κάθε μέρα.

    Οι φίλοι μου εδώ είναι Έλληνες και Ρώσοι. Με τους Έλληνες φίλους μου μιλάω ελληνικά, πολύ αργά. Η φίλη μου η Μαρία λέει: «Άννα, μιλάς πολύ καλά!» Εγώ λέω: «Όχι, μιλάω μόνο λίγο». Αλλά θέλω να μιλάω καλά ελληνικά, γιατί τώρα η Κύπρος είναι η χώρα μου.
- id: maria
  expected: { strict: 87.4, lenient: 93.2, glosses: 3.7, passes: false }
  title: Η οικογένεια της Μαρίας
  names: [Μαρία, Μαρίας, Άννας, Νίκος, Νίκο, Αθήνα, Γιώργος, Πέτρος, Ελένη, Πάφο, Λεμεσό, Λάρνακα]
  glosses: {κάθε: каждый, δασκάλα: учительница, Κυριακή: воскресенье, φαγητό: еда, ωραίο: вкусный, Αγγλία: Англия, Άγγλο: англичанина}
  text: |-
    Η Μαρία είναι η φίλη της Άννας. Είναι από την Κύπρο, από την Πάφο, αλλά τώρα μένει στη Λεμεσό με την οικογένειά της. Είναι σαράντα δύο χρονών και είναι δασκάλα. Ο άντρας της, ο Νίκος, είναι Έλληνας, από την Αθήνα. Είναι σαράντα πέντε χρονών και είναι γιατρός.

    Η Μαρία και ο Νίκος έχουν τρία παιδιά: δύο γιους και μία κόρη. Ο Γιώργος είναι δεκαπέντε χρονών, ο Πέτρος δώδεκα και η Ελένη οκτώ. Τα παιδιά μιλάνε ελληνικά και αγγλικά. Η Ελένη μαθαίνει και λίγα ρωσικά, γιατί η κόρη της Άννας είναι η φίλη της.

    Οι γονείς της Μαρίας μένουν στην Πάφο. Ο πατέρας της είναι εβδομήντα τριών χρονών και η μητέρα της εξήντα εννέα. Ο παππούς και η γιαγιά δεν μιλάνε αγγλικά, μόνο ελληνικά. Κάθε Κυριακή τα παιδιά πηγαίνουν στην Πάφο με τον Νίκο. Η γιαγιά κάνει πολύ ωραίο φαγητό.

    Η Μαρία έχει και δύο αδελφές. Η μία αδελφή της μένει στη Λάρνακα. Η άλλη μένει στην Αγγλία με τον άντρα της. Είναι παντρεμένη με έναν Άγγλο και έχει ένα παιδί. Το παιδί μιλάει αγγλικά, αλλά δεν καταλαβαίνει πολλά ελληνικά. «Δεν πειράζει», λέει η Μαρία. «Είναι μόνο τέσσερα χρονών. Θα μάθει.»
- id: lesson
  expected: { strict: 77.5, lenient: 87.4, glosses: 8.6, passes: false }
  title: Στο μάθημα
  names: [Άννα, Χριστίνα, Τζον, Όλγα, Λονδίνο]
  glosses: {γελάνε: смеются, Τρίτη: вторник, κυρία: госпожа, σήμερα: сегодня, μετά: потом, ρωτάει: спрашивает, νούμερα: числа, Πέμπτη: четверг, σπίτι: дом, σχολείο: школа, ελληνικό: греческий, μαθήματος: урока, τέλος: конец}
  text: |-
    Είναι Τρίτη και η Άννα είναι στο μάθημα. Η δασκάλα είναι η κυρία Χριστίνα. Στο μάθημα είναι οκτώ άνθρωποι από πολλές χώρες.

    — Καλησπέρα! Τι κάνετε; λέει η κυρία Χριστίνα.
    — Καλά, ευχαριστώ! λένε όλοι.
    — Σήμερα μιλάμε για την οικογένεια. Τζον, εσύ έχεις αδέλφια;
    — Ναι, έχω έναν αδελφό. Μένει στο Λονδίνο. Είναι είκοσι εννέα χρονών.
    — Πολύ καλά. Κι εσύ, Όλγα; Πόσων χρονών είναι τα παιδιά σου;
    — Συγγνώμη, δεν καταλαβαίνω. Πιο αργά, παρακαλώ.
    — Πόσων… χρονών… είναι… τα παιδιά σου;
    — Α! Ο γιος μου είναι δεκαεπτά χρονών και η κόρη μου είκοσι ενός.
    — Είκοσι ενός! Πολύ ωραία, Όλγα. Ξέρεις τα νούμερα πολύ καλά.

    Μετά μιλάει η Άννα:
    — Εγώ έχω δύο παιδιά. Ο γιος μου πηγαίνει σε ελληνικό σχολείο και μιλάει ελληνικά πολύ καλά. Είναι ο δάσκαλός μου στο σπίτι!

    Όλοι γελάνε. Ο Τζον ρωτάει:
    — Κυρία Χριστίνα, τι σημαίνει «χάρηκα»;
    — Χάρηκα πολύ! Τι λέμε, Άννα;
    — Επίσης!
    — Πολύ ωραία. Τα λέμε την Πέμπτη!
    — Γεια σας! λένε όλοι.
