# Голоса персонажей греческого курса (язык el): Google Cloud TTS, Chirp 3 HD (el-GR-Chirp3-HD-<голос>).
# Самым частым персонажам голоса даны вручную и не повторяются, остальным — детерминированно из пула их пола
# так, чтобы в одном диалоге не было двух одинаковых голосов. Число после # — реплик персонажа в курсе.
# Сборка проверяет, что у каждого говорящего есть голос и что голоса в диалоге разные.
# Озвучка: GOOGLE_TTS_KEY=… npm run voices -- <урок…> (docs/voices.md).
source: Синтез речи Google Cloud TTS, голос Chirp 3 HD {voice}
language: el-GR
prefix: el-GR-Chirp3-HD-
pools:
  female:
    - Aoede
    - Callirrhoe
    - Achernar
    - Autonoe
    - Despina
    - Erinome
    - Gacrux
    - Kore
    - Laomedeia
    - Leda
    - Sulafat
    - Vindemiatrix
    - Zephyr
  male:
    - Algenib
    - Algieba
    - Alnilam
    - Charon
    - Enceladus
    - Fenrir
    - Iapetus
    - Puck
    - Rasalgethi
    - Sadachbia
    - Sadaltager
    - Schedar
    - Umbriel
    - Zubenelgenubi
# Реплика без говорящего
narrator: Kore
