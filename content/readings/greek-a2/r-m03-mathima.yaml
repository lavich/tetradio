id: r-m03-mathima
title: Στο μάθημα
after: m03-3
series: anna
text: |-
  Η Άννα είναι στο μάθημα. Η δασκάλα της είναι η Χριστίνα. Στο μάθημα είναι οκτώ άνθρωποι από έξι χώρες.

  Η Χριστίνα λέει:
  — Καλησπέρα!
  Οι άνθρωποι λένε:
  — Καλησπέρα!
  — Μιλάμε για την οικογένεια. Τζον, έχεις αδέλφια;
  — Ναι, έχω έναν αδελφό. Μένει στο Λονδίνο. Είναι είκοσι εννέα χρονών.
  — Πολύ καλά. Κι εσύ, Όλγα; Πόσων χρονών είναι τα παιδιά σου;
  — Συγγνώμη, δεν καταλαβαίνω. Πιο αργά, παρακαλώ.
  — Πόσων… χρονών… είναι… τα παιδιά σου;
  — Α! Ο γιος μου είναι δώδεκα χρονών και η κόρη μου είκοσι.
  — Πολύ καλά, Όλγα!

  Η Άννα λέει:
  — Εγώ έχω δύο παιδιά. Ο γιος μου μιλάει ελληνικά πολύ καλά. Είναι ο δάσκαλός μου!

  Ο Τζον λέει:
  — Χριστίνα, τι σημαίνει «χάρηκα»;
  — Χάρηκα πολύ! Τι λέμε, Άννα;
  — Επίσης!
  — Πολύ καλά. Τα λέμε!
  Οι άνθρωποι λένε:
  — Γεια σας!
