title: Κυριακή πρωί στη θάλασσα
after: m09-test
series: anna
text: |-
  Αυτή την Κυριακή δεν μαγειρεύω. Πηγαίνουμε όλοι μαζί σε ένα μικρό μαγαζί κοντά στη θάλασσα: εγώ, ο Αντρέι, ο γιος μου ο Μάξιμ και η κόρη μου η Σόνια. Εκεί ο καφές είναι πολύ καλός και τα παιδιά τρώνε ομελέτα.

  Η σερβιτόρα, η κυρία Σοφία, λέει:
  — Καλημέρα σας! Ελάτε, διαλέξτε ένα τραπέζι.
  Διαλέγουμε ένα τραπέζι έξω, δίπλα στη θάλασσα. Ο Αντρέι δεν μιλάει ελληνικά, γι' αυτό παραγγέλνω εγώ για όλους. Εγώ λέω:
  — Θα θέλαμε δύο ομελέτες, ψωμί με τυρί και δύο χυμούς για τα παιδιά. Και δύο κυπριακούς καφέδες, έναν σκέτο και έναν μέτριο.
  — Αμέσως!

  Η κυρία Σοφία φέρνει τους καφέδες. Ο Αντρέι πίνει λίγο καφέ και λέει στα αγγλικά:
  — Άννα, ο καφές μου είναι πολύ γλυκός!
  Εγώ λέω:
  — Συγγνώμη, κυρία Σοφία, αλλά αυτός ο καφές είναι γλυκός. Ο άντρας μου θέλει σκέτο.
  — Α, συγγνώμη! Αμέσως!
  Μετά έρχονται οι ομελέτες. Ο Μάξιμ λέει:
  — Το πιρούνι μου δεν είναι καθαρό!
  Εγώ λέω:
  — Συγγνώμη, μπορείτε να μας φέρετε ένα άλλο πιρούνι; Και ένα κουτάλι για τη Σόνια, παρακαλώ.
  — Ναι, έρχομαι αμέσως!

  Τώρα όλα είναι καλά. Ο καφές του Αντρέι είναι σκέτος, και οι ομελέτες είναι πολύ νόστιμες. Τα παιδιά τρώνε όλο το φαγητό τους.

  Στο τέλος λέω:
  — Τον λογαριασμό, παρακαλώ.
  Η κυρία Σοφία φέρνει τον λογαριασμό. Εγώ λέω:
  — Συγγνώμη, αλλά ο λογαριασμός δεν είναι σωστός. Εδώ γράφει τρεις καφέδες, αλλά είναι μόνο δύο.
  — Α, ναι! Συγγνώμη. Και ένα γλυκό για τα παιδιά: κερνάει το μαγαζί!
  Ο Μάξιμ λέει:
  — Ευχαριστούμε!
  Πληρώνω και αφήνω φιλοδώρημα. Ο Αντρέι λέει στα αγγλικά:
  — Άννα, μιλάς πολύ καλά ελληνικά!
  — Όχι ακόμα. Αλλά παραπονιέμαι πολύ καλά!
