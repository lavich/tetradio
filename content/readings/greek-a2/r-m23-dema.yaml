id: r-m23-dema
title: Ένα δέμα για τη Μόσχα
after: m23-2
series: anna
text: |-
  Είναι Τρίτη πρωί. Την Τρίτη η Άννα δεν δουλεύει, και σήμερα έχει πολλές δουλειές. Πρώτα πηγαίνει στο ταχυδρομείο. Έχει μαζί της ένα δέμα για τη μητέρα της στη Μόσχα. Την άλλη εβδομάδα η μητέρα της έχει γενέθλια. Μέσα στο δέμα είναι ένα ωραίο μπλε φόρεμα, φωτογραφίες από τη θάλασσα και ένα γράμμα από τον Μάξιμ και τη Σόνια.

  Στο ταχυδρομείο περιμένουν πέντε άνθρωποι. Μετά από δέκα λεπτά ο υπάλληλος λέει:
  — Καλημέρα σας. Παρακαλώ;
  Η Άννα λέει:
  — Καλημέρα σας. Θα ήθελα να στείλω αυτό το δέμα στη Ρωσία, στη Μόσχα.
  — Βεβαίως. Είναι δύο κιλά. Θέλετε να φτάσει γρήγορα;
  — Ναι, αν γίνεται. Η μητέρα μου έχει γενέθλια την άλλη Πέμπτη.
  — Μπορεί να φτάσει σε πέντε μέρες. Κοστίζει τριάντα δύο ευρώ.
  — Τριάντα δύο ευρώ; Είναι ακριβό… Αλλά δεν πειράζει, είναι για τη μητέρα μου!
  — Συμπληρώστε αυτό το έντυπο, παρακαλώ. Πάνω γράφετε το όνομα και τη διεύθυνση του παραλήπτη και κάτω τα δικά σας, του αποστολέα. Με κεφαλαία γράμματα, παρακαλώ.

  Η Άννα συμπληρώνει το έντυπο. Πάνω γράφει το όνομα της μητέρας της και τη διεύθυνσή της στη Μόσχα. Κάτω γράφει το όνομά της, τη διεύθυνσή της στη Λεμεσό, τον ταχυδρομικό κώδικα και το τηλέφωνό της. Μετά δίνει το έντυπο στον υπάλληλο.
  — Ορίστε. Θα μπορούσατε να μου πείτε αν είναι όλα σωστά;
  — Ναι, όλα είναι σωστά. Υπογράψτε εδώ, παρακαλώ. Κάτι άλλο;
  — Ναι. Χθες ο ταχυδρόμος ήρθε με μια συστημένη επιστολή, αλλά δεν ήμουν στο σπίτι. Ήμουν στη δουλειά.
  — Την ταυτότητά σας, παρακαλώ.
  — Δεν έχω ταυτότητα. Έχω μόνο το διαβατήριό μου.
  — Δεν πειράζει. Ορίστε η επιστολή σας. Είναι από την υπηρεσία ρεύματος. Υπογράψτε κι εδώ, παρακαλώ.

  Η Άννα υπογράφει και ανοίγει τον φάκελο. Μέσα είναι ο λογαριασμός του ρεύματος για τον Απρίλιο. Η Άννα τον κοιτάζει και λέει:
  — Τετρακόσια είκοσι ευρώ; Τι; Τον Μάρτιο πληρώσαμε ενενήντα ευρώ!
  Ο υπάλληλος λέει:
  — Είναι η δική σας διεύθυνση;
  — Ναι, η διεύθυνση και το όνομα είναι σωστά. Αλλά τετρακόσια είκοσι ευρώ είναι πάρα πολλά για ένα διαμέρισμα! Πού μπορώ να πληρώσω τον λογαριασμό; Εδώ;
  — Ναι, μπορείτε να τον πληρώσετε εδώ. Αλλά αν ο λογαριασμός είναι λάθος, μην τον πληρώσετε ακόμα. Πρώτα κάντε ένα παράπονο στην υπηρεσία ρεύματος.
  — Και πώς κάνω παράπονο; Με τηλέφωνο;
  — Καλύτερα με μια επίσημη επιστολή ή με email. Επισυνάψτε και ένα αντίγραφο του λογαριασμού. Ποια είναι η προθεσμία;
  Η Άννα κοιτάζει πάλι τον λογαριασμό.
  — Η προθεσμία είναι μέχρι τις είκοσι οκτώ Μαΐου.
  — Ωραία, έχετε χρόνο. Στείλτε την επιστολή αυτή την εβδομάδα.
  — Μια επίσημη επιστολή στα ελληνικά… Δεν είναι εύκολο. Αλλά την Πέμπτη έχω μάθημα ελληνικών. Θα ρωτήσω τη δασκάλα μου!
  — Πολύ ωραία. Θέλετε κάτι άλλο;
  — Ναι, θα ήθελα και πέντε γραμματόσημα για τη Ρωσία. Τα παιδιά μου θέλουν να στείλουν κάρτες στη γιαγιά τους.
  — Τα γραμματόσημα κάνουν έξι ευρώ. Όλα μαζί, τριάντα οκτώ ευρώ.
  — Θα μπορούσα να πληρώσω με κάρτα;
  — Βεβαίως.
  Η Άννα πληρώνει και λέει:
  — Σας ευχαριστώ πολύ. Καλή σας μέρα!
  — Καλή σας μέρα.

  Έξω από το ταχυδρομείο η Άννα κοιτάζει πάλι τον λογαριασμό. Τετρακόσια είκοσι ευρώ… Και ο Αντρέι;
