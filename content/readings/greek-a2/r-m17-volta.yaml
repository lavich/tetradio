id: r-m17-volta
title: Μια βόλτα στην παραλία
after: m17-2
series: anna
text: |-
  Είναι Σάββατο, οκτώ το πρωί. Σήμερα η Άννα και η Μαρία δεν πάνε στη λαϊκή. Περπατάνε δίπλα στη θάλασσα. Μετά από είκοσι λεπτά η Μαρία λέει:
  — Άννα, συγγνώμη, πάμε λίγο πιο αργά; Με πονάνε τα πόδια μου.
  Η Άννα λέει:
  — Ναι, πάμε πιο αργά. Τι έχεις, Μαρία; Δεν νιώθεις καλά;
  — Είμαι πολύ κουρασμένη. Αυτή την εβδομάδα κοιμάμαι μόνο πέντε ώρες τη νύχτα.
  — Πέντε ώρες; Γιατί;
  — Έχω πολλή δουλειά στο σχολείο. Τα παιδιά γράφουν εξετάσεις, και εγώ διαβάζω τα τετράδιά τους το βράδυ, μέχρι τη μία. Και το πρωί σηκώνομαι στις έξι. Έχω πολύ άγχος, και τώρα με πονάει συχνά το κεφάλι μου.
  — Και τρως πρωινό;
  — Όχι, το πρωί δεν έχω χρόνο. Πίνω μόνο έναν καφέ. Και το μεσημέρι στο σχολείο ζαλίζομαι.
  — Μαρία! Χωρίς πρωινό όλοι ζαλίζονται!
  — Το ξέρω, το ξέρω. Ο Νίκος μού το λέει κάθε μέρα.
  — Και ο Νίκος; Πώς είναι;
  — Ο Νίκος είναι υγιής και δεν καπνίζει. Αλλά τώρα τρώει πολλά γλυκά και παχαίνει! Από τη Δευτέρα κάνει δίαιτα. Κι εσύ, Άννα; Εσύ είσαι πάντα καλά. Πώς το κάνεις;
  — Εγώ; Στη Μόσχα δεν ήμουν πάντα καλά! Δούλεψα δέκα χρόνια στην τράπεζα, με πολλές υπερωρίες και πολύ άγχος. Είχα συχνά πονοκέφαλο και πόνο στην πλάτη.
  — Και εδώ;
  — Εδώ είναι πιο εύκολα. Δουλεύω μόνο τρία πρωινά. Την Τρίτη και την Πέμπτη κάνω γυμναστική: περπατάω μία ώρα δίπλα στη θάλασσα. Και η διατροφή μας είναι υγιεινή: ψάρι, σαλάτες, πολλά λαχανικά.
  — Και τα παιδιά σου τρώνε σαλάτες;
  — Ο Μάξιμ ναι. Η Σόνια θέλει μόνο πατάτες και γλυκά!
  — Η Ελένη μου τρώει μόνο λαχανικά, και ο Γιώργος μόνο κρέας. Δύσκολα!
  Η Άννα λέει:
  — Ξέρεις τι, Μαρία; Έλα κι εσύ την Τρίτη. Περπατάμε μαζί.
  — Την Τρίτη το πρωί έχω μάθημα. Αλλά το Σάββατο μπορώ.
  — Ωραία! Από τώρα κάθε Σάββατο περπατάμε εδώ μία ώρα, και μετά πάμε στη λαϊκή.
  — Και μετά τρώμε ένα γλυκό στην καφετέρια;
  — Μαρία!
  — Ένα μικρό!

  Μετά από μία ώρα είναι σε μια καφετέρια δίπλα στη θάλασσα. Η Μαρία παραγγέλνει πρωινό: ψωμί, τυρί, ένα αυγό και έναν χυμό πορτοκάλι. Μετά λέει:
  — Ξέρεις κάτι, Άννα; Τώρα νιώθω πολύ καλά. Δεν με πονάει το κεφάλι μου.
  — Βλέπεις; Λίγη γυμναστική, ένα καλό πρωινό…
  — …και ένα μικρό γλυκό!
