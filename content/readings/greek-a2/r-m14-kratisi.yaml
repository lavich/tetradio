id: r-m14-kratisi
title: Ένα δωμάτιο στην Πάφο
after: m14-2
series: anna
text: |-
  Είναι Τρίτη πρωί. Η Άννα δεν δουλεύει σήμερα. Τον περασμένο μήνα η Άννα και ο Αντρέι δούλεψαν πολύ, και τώρα θέλουν ένα μικρό ταξίδι με τα παιδιά. Χθες το βράδυ η Μαρία έγραψε στην Άννα για ένα ξενοδοχείο στην Πάφο, κοντά στη θάλασσα. Οι γονείς της Μαρίας μένουν στην Πάφο, και η Μαρία ξέρει την πόλη πολύ καλά.

  Ο Αντρέι δεν μιλάει ελληνικά, και η Άννα παίρνει τηλέφωνο το ξενοδοχείο. Μια γυναίκα λέει:
  — Ξενοδοχείο, καλημέρα σας. Είμαι η Ρένα.
  Η Άννα λέει:
  — Καλημέρα σας. Έχετε ελεύθερα δωμάτια για δύο νύχτες, την Παρασκευή και το Σάββατο;
  — Μονόκλινα ή δίκλινα;
  — Δίκλινα. Είμαστε τέσσερις: εγώ, ο άντρας μου και τα δύο παιδιά μας. Θέλουμε δύο δωμάτια δίπλα δίπλα.
  — Ένα λεπτό, παρακαλώ… Ναι, έχουμε δύο δίκλινα στον πρώτο όροφο.
  — Έχουν θέα στη θάλασσα;
  — Όχι, τα δωμάτια στον πρώτο όροφο βλέπουν στον δρόμο. Στον τρίτο όροφο έχουμε δύο δίκλινα με θέα στη θάλασσα, αλλά είναι πιο ακριβά.
  — Πόσο κάνει το δωμάτιο τη νύχτα;
  — Στον πρώτο όροφο ογδόντα ευρώ, στον τρίτο εκατό.
  — Το πρωινό περιλαμβάνεται στην τιμή;
  — Ναι, περιλαμβάνεται. Το πρωινό είναι από τις επτά μέχρι τις δέκα.
  — Υπάρχει πισίνα; Τα παιδιά μου κολυμπάνε πολύ.
  — Ναι, έχουμε μεγάλη πισίνα. Και η παραλία είναι πολύ κοντά, πέντε λεπτά από το ξενοδοχείο.

  Η Άννα λέει στον Αντρέι στα αγγλικά:
  — Τα δωμάτια με θέα στη θάλασσα κάνουν εκατό ευρώ τη νύχτα. Τι λες;
  Ο Αντρέι λέει στα αγγλικά:
  — Θέλω θέα στη θάλασσα! Είναι οι διακοπές μας.
  Η Άννα λέει στη Ρένα:
  — Θα ήθελα να κλείσω τα δύο δίκλινα με θέα στη θάλασσα.
  — Πολύ ωραία. Σε ποιο όνομα;
  — Άννα.
  — Ευχαριστώ, κυρία Άννα. Στη ρεσεψιόν χρειαζόμαστε τα διαβατήριά σας.
  — Και κάτι ακόμα. Την Κυριακή φεύγουμε το απόγευμα. Μπορώ να αφήσω τις βαλίτσες μας στη ρεσεψιόν;
  — Ναι, μπορείτε. Αλλά τα δωμάτια πρέπει να είναι ελεύθερα μέχρι τις δώδεκα.
  — Ευχαριστώ πολύ!
  — Παρακαλώ. Σας περιμένουμε την Παρασκευή!

  Ο Αντρέι λέει στα αγγλικά:
  — Μίλησες πολύ καλά! Όλα εντάξει;
  Η Άννα λέει:
  — Ναι, όλα! Είναι η πρώτη μου κράτηση στα ελληνικά.
