title: Η Άννα μαθαίνει ελληνικά
after: m02-3
series: anna
text: |-
  Γεια σας! Με λένε Άννα. Είμαι από τη Ρωσία, αλλά τώρα μένω στην Κύπρο, στη Λεμεσό. Δουλεύω εδώ.
  Μιλάω ρωσικά και λίγο αγγλικά. Τώρα μαθαίνω ελληνικά, γιατί θέλω να μιλάω ελληνικά με τους φίλους μου.
  Ο φίλος μου ο Νίκος είναι Έλληνας. Μιλάει ελληνικά και αγγλικά. Η φίλη μου η Μαρία είναι από την Πάφο, αλλά μένει στη Λεμεσό. Μιλάει ελληνικά, αγγλικά και λίγο ρωσικά.
  Εγώ καταλαβαίνω λίγο ελληνικά. Ο Νίκος μιλάει πολύ, και εγώ λέω:
  — Δεν καταλαβαίνω. Πιο αργά, παρακαλώ.
  Ο Νίκος λέει:
  — Δεν πειράζει, Άννα!
  Η Μαρία ξέρει τρεις γλώσσες. Εγώ ρωτάω:
  — Τι σημαίνει αυτό;
  Η Μαρία μού λέει, και εγώ γράφω.
  Θέλω να μιλάω ελληνικά πολύ καλά, γιατί τώρα μένω εδώ. Μπορώ!
