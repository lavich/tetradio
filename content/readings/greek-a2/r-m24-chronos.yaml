id: r-m24-chronos
title: Ένας χρόνος στην Κύπρο
after: m24-test
series: anna
text: |-
  Σήμερα είναι Σάββατο. Την Πέμπτη είχαμε το τελευταίο μάθημα ελληνικών. Την περασμένη εβδομάδα ο ηλιακός μας είχε βλάβη, και το νερό ήταν κρύο. Τηλεφώνησα στον ιδιοκτήτη, και μετά από δύο μέρες ήρθε ο τεχνικός με καινούργιο ηλιακό. Μίλησα μαζί του μόνο στα ελληνικά!

  Πέρσι τον Ιούλιο ήρθα στη Λεμεσό από τη Μόσχα με την οικογένειά μου. Θυμάμαι πολύ καλά τους πρώτους μήνες. Δεν ήξερα κανέναν, και τα ελληνικά μου ήταν μόνο δύο λέξεις: γεια και ευχαριστώ. Στον φούρνο μπορούσα να πω μόνο: ένα ψωμί, παρακαλώ. Στο λεωφορείο δεν καταλάβαινα πού ήμουν. Τα παιδιά δεν ήξεραν ελληνικά, και ο Αντρέι δούλευε πολλές ώρες στο νοσοκομείο. Τα βράδια ήμουν συχνά στο μπαλκόνι και ήθελα να γυρίσω στη Μόσχα.

  Μετά όλα άλλαξαν. Γνώρισα τη Μαρία, και τώρα είναι η καλύτερη φίλη μου. Τον Σεπτέμβριο βρήκα δουλειά σε μια μικρή εταιρεία στο κέντρο και ξεκίνησα μαθήματα ελληνικών με τη Χριστίνα. Εκεί γνώρισα τον Τζον και την Όλγα.

  Τώρα ψωνίζω στη λαϊκή με τη Μαρία, μιλάω με την κυρία Ευτυχία για τις ντομάτες και με τον κυρ Κώστα για το ψωμί. Τον Νοέμβριο έκλεισα ένα ξενοδοχείο στην Πάφο στο τηλέφωνο. Το Πάσχα το κάναμε στην Πάφο, με την οικογένεια της Μαρίας. Και την περασμένη Κυριακή χορέψαμε στο πανηγύρι με τους γείτονές μας. Ο Μάξιμ έχει τώρα φίλους στο σχολείο, και η Σόνια λέει καλημέρα σε όλους.

  Στο μάθημα η Χριστίνα είπε:
  — Σήμερα είναι το τελευταίο μας μάθημα. Τι θα κάνετε τώρα;
  Ο Τζον είπε:
  — Θα μείνω στην Κύπρο. Μου αρέσουν η θάλασσα, ο ήλιος και το σπίτι μου. Και θα μαθαίνω ελληνικά κάθε μέρα!
  Η Όλγα είπε:
  — Εγώ θα μιλάω ελληνικά στη δουλειά, με τους τουρίστες. Και με την Ξένια, γιατί τα ελληνικά της είναι πιο καλά από τα δικά μου!
  Εγώ είπα:
  — Πριν από έναν χρόνο δεν ήξερα τίποτα. Τώρα μιλάω με τους γείτονες, με τον ιδιοκτήτη και με τον τεχνικό. Σε δύο εβδομάδες θα δώσω εξετάσεις για το A2. Και μετά θα συνεχίσω τα μαθήματα, γιατί θέλω να μιλάω καλά ελληνικά.
  Η Χριστίνα είπε:
  — Πολύ καλά! Είστε πολύ καλοί μαθητές.

  Απόψε κάνουμε ένα μικρό πάρτι στο σπίτι μας. Είναι εδώ η Μαρία με τον Νίκο και τα παιδιά τους, ο Τζον, η Όλγα, η Ξένια και η Χριστίνα. Όλοι μιλάνε ελληνικά, και εγώ καταλαβαίνω σχεδόν τα πάντα. Η Μαρία λέει:
  — Άννα, στην πρώτη μας βόλτα στη θάλασσα μιλήσαμε μόνο αγγλικά!
  — Το θυμάμαι! Και τώρα μιλάμε ελληνικά.
  Στο τέλος ο Αντρέι σηκώνει το ποτήρι του και λέει στα ελληνικά:
  — Στην υγειά μας!
  Η Σόνια λέει:
  — Μιλάς ελληνικά!
  Ο Αντρέι λέει στα αγγλικά:
  — Μόνο αυτό. Τα άλλα τα λέει η μητέρα σου.

  Είμαστε σχεδόν έναν χρόνο στην Κύπρο. Ο πρώτος χρόνος ήταν δύσκολος, αλλά και πολύ ωραίος. Και του χρόνου; Θα είμαστε εδώ, στη Λεμεσό, δίπλα στη θάλασσα.
