id: r-m07-kanapes
title: Ο μπλε καναπές
after: m07-3
series: anna
text: |-
  Το διαμέρισμά μας στη Λεμεσό δεν είναι μεγάλο, αλλά είναι ωραίο. Έχει τρία υπνοδωμάτια, ένα σαλόνι, μία κουζίνα και ένα μικρό μπάνιο. Υπάρχει και ένα μπαλκόνι με δύο πράσινες καρέκλες.

  Το διαμέρισμα δεν είναι δικό μας, το νοικιάζουμε. Ο καναπές στο σαλόνι είναι δικός μας, αλλά είναι πολύ παλιός. Είναι μικρός, κίτρινος και πολύ άσχημος. Τα παιδιά μου λένε ότι είναι βρώμικος. Δεν είναι βρώμικος, είναι παλιός! Κάθε Σάββατο καθαρίζω όλο το σπίτι, αλλά ο καναπές είναι πάντα άσχημος.

  Ένα βράδυ ο Αντρέι και εγώ μιλάμε για το σαλόνι. Εγώ λέω:
  — Θέλω έναν μεγάλο καναπέ για το σαλόνι.
  Ο Αντρέι λέει στα αγγλικά:
  — Κι εγώ. Αλλά οι καινούργιοι καναπέδες είναι πολύ ακριβοί.
  — Ψάχνουμε κάτι φτηνό!

  Την Τετάρτη η φίλη μου η Μαρία έρχεται στο σπίτι μας. Βλέπει το σαλόνι και λέει:
  — Άννα, ο καναπές σου είναι πολύ παλιός!
  — Ναι, ξέρω… Αλλά οι καινούργιοι είναι πολύ ακριβοί.
  — Ξέρεις κάτι; Στο σαλόνι μας υπάρχει τώρα καινούργιος καναπές, μεγάλος και άσπρος. Ο παλιός μας καναπές είναι στο μπαλκόνι.
  — Πώς είναι; Τι χρώμα είναι;
  — Είναι μπλε και πολύ μεγάλος. Είναι παλιός, αλλά σε πολύ καλή κατάσταση. Είναι καθαρός και δεν είναι χαλασμένος.
  — Πόσο κάνει;
  — Τίποτα! Είναι δικός σου, Άννα.
  — Ευχαριστώ, Μαρία! Είσαι πολύ καλή φίλη!

  Το Σάββατο ο μπλε καναπές έρχεται στο σπίτι μας. Ο Αντρέι και ο Νίκος παίρνουν τον καναπέ από το μπαλκόνι της Μαρίας. Δεν είναι εύκολο, είναι πολύ μεγάλος! Τώρα το σαλόνι μας είναι πολύ ωραίο. Ο καναπές είναι μεγάλος, και το βράδυ όλη η οικογένεια βλέπει τηλεόραση εκεί, όλοι μαζί.

  Και ο κίτρινος καναπές; Είναι τώρα στο μπαλκόνι μας. Ο Αντρέι λέει στα αγγλικά, και εγώ γράφω στα ελληνικά:
  — Πωλείται καναπές, κίτρινος, σε καλή κατάσταση. Πολύ φτηνός!
  Εγώ λέω:
  — Φτηνός; Ποιος θέλει έναν κίτρινο καναπέ; Αυτός ο καναπές είναι πολύ άσχημος!
