id: r-m21-parea
title: Η καινούργια μας παρέα
after: m21-test
series: anna
text: |-
  Όταν ήρθα στην Κύπρο, δεν είχα φίλους εδώ. Ο Αντρέι είχε τους συναδέλφους του στο νοσοκομείο, και τα παιδιά βρήκαν γρήγορα φίλους στο σχολείο. Αλλά εγώ ήμουν συχνά στο σπίτι, γιατί τα ελληνικά μου ήταν πολύ λίγα. Η πρώτη μου φίλη εδώ ήταν η Μαρία. Τη γνώρισα στο πάρκο απέναντι από το σπίτι μας, όταν η Σόνια και η Ελένη έπαιξαν μαζί για πρώτη φορά. Τώρα η Μαρία είναι η κολλητή μου. Μετά άρχισα μαθήματα ελληνικών και γνώρισα τον Τζον και την Όλγα. Έτσι τώρα έχω μια μικρή παρέα στη Λεμεσό.

  Την Τρίτη ρώτησα τον Τζον:
  — Μπορώ να φέρω και τη Μαρία στο πάρτι σου;
  — Σίγουρα! Θα χαρώ πολύ αν έρθει.
  Το βράδυ πήρα τηλέφωνο τη Μαρία:
  — Μαρία, θέλεις να έρθεις μαζί μας σε ένα πάρτι την Κυριακή, στο σπίτι του Τζον;
  — Την Κυριακή; Ναι, ευχαρίστως! Ο Νίκος μένει με τα παιδιά. Θέλω πολύ να γνωρίσω τους φίλους σου από το μάθημα.

  Την Κυριακή στις πέντε πήγαμε στο πάρτι με το αυτοκίνητο. Οδήγησε ο Αντρέι. Πρώτα περάσαμε από το σπίτι της Μαρίας. Ο Τζον μένει σε ένα μικρό διαμέρισμα στον πέμπτο όροφο, με μεγάλο μπαλκόνι και θέα στη θάλασσα. Η Όλγα ήταν ήδη εκεί, γιατί ο Τζον την πήρε από το ξενοδοχείο μετά τη βάρδια της. Λίγο μετά ήρθε και η Χριστίνα με ένα μεγάλο γλυκό.

  Δώσαμε στον Τζον ένα μικρό δώρο: ένα μπουκάλι κόκκινο κρασί. Ο Τζον είπε:
  — Ευχαριστώ πολύ! Το κόκκινο κρασί είναι το αγαπημένο μου!
  Μετά έδειξε το διαμέρισμα στον Αντρέι και στα παιδιά. Ο Τζον είδε τον Μάξιμ και είπε:
  — Μάξιμ, είσαι μόνο δέκα χρονών, αλλά είσαι σχεδόν τόσο ψηλός όσο εγώ!
  Η Σόνια βγήκε αμέσως στο μπαλκόνι και είπε:
  — Η θάλασσα είναι πολύ κοντά! Θέλω κι εγώ ένα σπίτι με θέα στη θάλασσα!

  Ο Τζον μαγείρεψε ψάρι με πατάτες και έκανε μια μεγάλη σαλάτα. Το φαγητό ήταν πολύ νόστιμο. Η Χριστίνα είπε:
  — Παιδιά, μην ξεχνάτε: σήμερα μιλάμε μόνο ελληνικά!
  Ο Αντρέι είπε στα αγγλικά:
  — Εγώ δεν μιλάω ελληνικά. Εγώ μόνο τρώω!
  Αλλά μετά ο Αντρέι και ο Τζον μίλησαν στα αγγλικά για ποδόσφαιρο.

  Η Μαρία και η Όλγα μίλησαν πολλή ώρα για τα παιδιά τους, για τη δουλειά και για τη Λεμεσό. Η Μαρία είπε:
  — Όλγα, πηγαίνουμε συχνά στη λαϊκή το Σάββατο το πρωί, η Άννα κι εγώ. Θέλεις να έρθεις μαζί μας;
  — Ναι, γιατί όχι; Αν δεν δουλεύω, έρχομαι σίγουρα!
  Η Μαρία πήρε το τηλέφωνο της Όλγας, για να κανονίσουν το Σάββατο.

  Στις εννέα τα παιδιά ήταν κουρασμένα, γι' αυτό φύγαμε. Στην πόρτα είπα:
  — Ευχαριστούμε για την πρόσκληση, Τζον! Περάσαμε πολύ ωραία. Την άλλη φορά το πάρτι είναι στο σπίτι μας. Θα χαρώ πολύ αν έρθετε όλοι.
  Η Χριστίνα είπε:
  — Το υπόσχομαι! Αλλά μόνο αν μιλάμε ελληνικά!

  Στο αυτοκίνητο η Μαρία είπε:
  — Άννα, οι φίλοι σου είναι πολύ καλοί άνθρωποι.
  Ναι, είναι. Η φιλία είναι σημαντική, όταν μένεις σε μια ξένη χώρα. Τώρα στη Λεμεσό δεν έχω μόνο γνωστούς. Έχω φίλους.
