id: r-m20-athlima
title: Ποιο άθλημα;
after: m20-2
series: anna
text: |-
  Είναι Σάββατο πρωί. Η Άννα και η Μαρία ψώνισαν στη λαϊκή, και τώρα πίνουν καφέ σε μια καφετέρια δίπλα στη θάλασσα. Η Μαρία λέει:
  — Άννα, αύριο ο Γιώργος και ο Πέτρος παίζουν σε έναν αγώνα. Θέλετε να έρθετε στο γήπεδο;
  Η Άννα λέει:
  — Αγώνα; Παίζουν ποδόσφαιρο;
  — Ναι, παίζουν και οι δύο στην ομάδα του σχολείου. Ο Γιώργος είναι ο καλύτερος παίκτης της ομάδας! Ο Πέτρος δεν παίζει τόσο καλά όσο ο αδελφός του, αλλά είναι πιο γρήγορος από όλους.
  — Τι ώρα είναι ο αγώνας;
  — Στις έντεκα. Θα έρθει και ο Νίκος. Ο Νίκος υποστηρίζει την ομάδα του σχολείου πιο πολύ από τα παιδιά!
  — Θα έρθουμε! Ο Μάξιμ αγαπάει το ποδόσφαιρο, αλλά δεν παίζει σε ομάδα.
  — Γιατί όχι; Ο Μάξιμ είναι πολύ ψηλός. Είναι πιο ψηλός από τον Γιώργο, και ο Γιώργος είναι δώδεκα χρονών!
  — Ναι, είναι ο πιο ψηλός στην τάξη του. Ο Αντρέι λέει ότι πρέπει να παίξει μπάσκετ.
  — Σωστά! Στο σχολείο μας υπάρχει μια ομάδα μπάσκετ για παιδιά. Παίζουν δύο φορές την εβδομάδα, την Τρίτη και την Πέμπτη το απόγευμα.
  — Ωραία! Θα το πω στον Μάξιμ σήμερα.

  Η Μαρία λέει:
  — Και η Σόνια; Της αρέσει ο αθλητισμός;
  — Όχι πολύ. Η Σόνια προτιμάει τον χορό. Χορεύει και τραγουδάει όλη μέρα στο σπίτι, με το αγαπημένο της φόρεμα!
  — Και η Ελένη μου αγαπάει τον χορό! Κάνει μαθήματα χορού κάθε Τετάρτη. Η Σόνια μπορεί να έρθει μαζί της.
  — Πολύ ωραία! Κι εσύ, Μαρία; Τι κάνεις στον ελεύθερο χρόνο σου;
  — Εγώ; Ελεύθερο χρόνο; Με τρία παιδιά και με τη δουλειά μου στο σχολείο; Αλλά όταν έχω λίγο χρόνο, διαβάζω. Το διάβασμα είναι το αγαπημένο μου χόμπι. Ο Νίκος ασχολείται με τη φωτογραφία. Εσύ;
  — Μου αρέσει να περπατάω δίπλα στη θάλασσα. Και κολυμπάω. Για μένα το κολύμπι είναι το καλύτερο άθλημα. Ο Αντρέι πάει στο γυμναστήριο, αλλά εγώ βαριέμαι εκεί.
  — Κι εγώ! Το γυμναστήριο είναι πολύ βαρετό. Και είναι πιο ακριβό από τη θάλασσα!

  Η Μαρία λέει:
  — Ξέρεις τι; Πάμε σινεμά απόψε; Μόνο εμείς οι δύο!
  — Τι ταινία παίζει;
  — Μια καινούργια ελληνική ταινία. Οι συνάδελφοί μου λένε ότι είναι πολύ καλή και οι ηθοποιοί είναι πολύ καλοί.
  — Στα ελληνικά; Θα καταλάβω μόνο λίγες λέξεις!
  — Δεν πειράζει. Είναι καλό μάθημα για σένα, καλύτερο από το βιβλίο!
  — Καλά, αλλά πρώτα θα ρωτήσω τον Αντρέι. Πρέπει να μείνει με τα παιδιά.
  — Ο Αντρέι δεν θα έχει πρόβλημα. Και ο Νίκος θα μείνει με τα δικά μας παιδιά. Το Σάββατο το βράδυ είναι δικό μας!
