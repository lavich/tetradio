id: r-m06-spiti
title: Το σπίτι μας
after: m06-test
series: anna
text: |-
  Εμείς μένουμε σε ένα διαμέρισμα στη Λεμεσό, κοντά στο σχολείο. Το διαμέρισμα έχει τρία υπνοδωμάτια, ένα σαλόνι, μία κουζίνα και ένα μπάνιο. Ο γιος μου έχει το δωμάτιό του, και η κόρη μου έχει το δωμάτιό της. Εγώ και ο Αντρέι κοιμόμαστε στο μεγάλο υπνοδωμάτιο.

  Το σαλόνι είναι δίπλα στην κουζίνα. Στο σαλόνι υπάρχουν ένα τραπέζι και μία τηλεόραση. Το βράδυ βλέπουμε τηλεόραση όλοι μαζί. Η κουζίνα είναι μικρή, αλλά έχει ένα μεγάλο παράθυρο. Κάτω από το παράθυρο υπάρχει ένα μικρό τραπέζι. Εκεί διαβάζω ελληνικά την Τρίτη και την Πέμπτη το πρωί, όταν τα παιδιά είναι στο σχολείο.

  Στο σπίτι μας υπάρχει μόνο ένα μπάνιο, και το πρωί είναι δύσκολο: στις επτά όλοι θέλουμε το μπάνιο! Ο Αντρέι λέει στα αγγλικά:
  — Θέλουμε σπίτι με δύο μπάνια.
  Εγώ λέω:
  — Ναι, αλλά δεν είναι εύκολο.

  Το Σάββατο έρχεται η φίλη μου η Μαρία με τα παιδιά της, τον Γιώργο, τον Πέτρο και την Ελένη. Η Μαρία είναι στην πόρτα και εγώ λέω:
  — Γεια σου, Μαρία! Έλα μέσα!
  — Γεια σου, Άννα! Πού είναι τα παιδιά σου;
  — Ο γιος μου είναι στο δωμάτιό του, και η κόρη μου είναι έξω, στο μπαλκόνι.

  Τα παιδιά πηγαίνουν στο μπαλκόνι, και εμείς πηγαίνουμε στην κουζίνα. Η Μαρία λέει:
  — Πολύ ωραία, Άννα! Πόσο είναι το ενοίκιο;
  — Χίλια ευρώ τον μήνα. Δεν είναι λίγα λεφτά, αλλά το σπίτι είναι κοντά στη δουλειά του Αντρέι.
  — Εμείς ψάχνουμε σπίτι με κήπο για τα τρία παιδιά. Αλλά είναι δύσκολο.
  — Δεν πειράζει, Μαρία. Ψάχνουμε μαζί!

  Το βράδυ η Μαρία και τα παιδιά της γυρίζουν σπίτι. Εγώ κλείνω την πόρτα και λέω:
  — Καληνύχτα! Τα λέμε!
