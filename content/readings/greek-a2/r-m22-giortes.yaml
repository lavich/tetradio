id: r-m22-giortes
title: Γιορτές στη λαϊκή
after: m22-2
series: anna
text: |-
  Είναι Σάββατο πρωί, είκοσι Μαρτίου. Η Άννα και η Μαρία είναι στη λαϊκή και αγοράζουν λαχανικά. Είναι άνοιξη, και κάνει ζέστη. Στη λαϊκή είναι πολλοί άνθρωποι. Η Μαρία λέει:
  — Άννα, την Πέμπτη, στις είκοσι πέντε Μαρτίου, είναι αργία. Τα σχολεία είναι κλειστά, αλλά το πρωί ο Γιώργος και ο Πέτρος κάνουν παρέλαση με το σχολείο τους.
  Η Άννα λέει:
  — Παρέλαση; Πού;
  — Στο κέντρο της Λεμεσού. Είναι μια μεγάλη γιορτή για την Κύπρο και την Ελλάδα. Όταν ήμουν μαθήτρια στην Πάφο, έκανα κι εγώ παρέλαση κάθε χρόνο. Η μητέρα μου ήταν στον δρόμο και με φωτογράφιζε. Ελάτε κι εσείς!
  — Ναι, θα έρθουμε όλοι! Την Πέμπτη το πρωί δεν δουλεύω. Και το βράδυ δεν έχουμε μάθημα, γιατί είναι αργία.
  — Ωραία! Μετά την παρέλαση πίνουμε καφέ όλοι μαζί.

  Η Μαρία πληρώνει τις ντομάτες και λέει:
  — Και το Πάσχα; Πού θα κάνετε Πάσχα;
  — Δεν ξέρω ακόμα. Πότε είναι φέτος;
  — Στις δύο Μαΐου. Είναι η πιο μεγάλη γιορτή στην Κύπρο. Εμείς κάνουμε πάντα Πάσχα στην Πάφο, στους γονείς μου. Η μητέρα μου βάφει κόκκινα αυγά και κάνει φλαούνες. Το Μεγάλο Σάββατο το βράδυ πηγαίνουμε στην εκκλησία, και στις δώδεκα λέμε: Χριστός ανέστη! Την Κυριακή ο πατέρας μου κάνει σούβλα στον κήπο. Το Πάσχα ελάτε μαζί μας!
  — Τι ωραία ιδέα! Ευχαριστούμε πολύ! Τα παιδιά σίγουρα θα χαρούν.
  — Εσείς πώς γιορτάζετε στη Ρωσία; Ποια είναι η μεγάλη γιορτή σας;
  — Η Πρωτοχρονιά! Στη Μόσχα τον Δεκέμβριο κάνει πολύ κρύο και έχει χιόνι. Στο σπίτι στολίζουμε το δέντρο. Την παραμονή της Πρωτοχρονιάς τρώμε όλοι μαζί, και στις δώδεκα η ώρα λέμε: Καλή χρονιά! Τα παιδιά βρίσκουν τα δώρα τους κάτω από το δέντρο.
  — Και τα Χριστούγεννα;
  — Στη Ρωσία τα Χριστούγεννα είναι στις επτά Ιανουαρίου. Είναι μια πιο μικρή γιορτή.
  — Ναι; Δεν το ήξερα!
  — Όταν ήμουν παιδί, κάθε Πρωτοχρονιά πηγαίναμε στη γιαγιά μου. Η γιαγιά έκανε πολλά φαγητά. Εμείς τρώγαμε, χορεύαμε και βλέπαμε τηλεόραση μέχρι το πρωί. Ήταν η αγαπημένη μου γιορτή. Φέτος κάναμε Πρωτοχρονιά εδώ, στη Λεμεσό, χωρίς χιόνι!
  — Και το Πάσχα στη Ρωσία;
  — Είναι την ίδια μέρα. Κι εμείς βάφουμε κόκκινα αυγά. Αλλά τι λέτε, όταν τσουγκρίζετε τα αυγά;
  — Ο ένας λέει: Χριστός ανέστη! Ο άλλος λέει: Αληθώς ανέστη! Ποιο αυγό δεν σπάει; Αυτό κερδίζει!
  — Η Σόνια σίγουρα θέλει να κερδίσει.
  Η Μαρία λέει:
  — Και ο Μάξιμ, και ο Πέτρος, και η Ελένη… Όλοι θέλουν να κερδίσουν!

  Στο τέλος η Άννα αγοράζει ένα μεγάλο μπουκάλι κρασί από έναν κύριο στη λαϊκή. Η Μαρία λέει:
  — Τι είναι αυτό;
  Η Άννα λέει:
  — Αυτό; Είναι για τους γονείς σου, για το γιορτινό τραπέζι του Πάσχα!
