id: r-m19-epoches
title: Η αγαπημένη μου εποχή
after: m19-test
series: anna
text: |-
  Την Κυριακή ξυπνήσαμε στις επτά. Μετά τη βροχή του Σαββάτου ο ουρανός ήταν καθαρός και ο αέρας δροσερός. Στις οκτώ ξεκινήσαμε για το Τρόοδος με δύο αυτοκίνητα. Ο Αντρέι οδήγησε το δικό μας, ο Νίκος το δικό τους.

  Στο Τρόοδος έκανε κρύο: μόνο έξι βαθμοί. Φορέσαμε τα πουλόβερ και τα μπουφάν μας. Η Σόνια φόρεσε το ροζ πουλόβερ της. Περπατήσαμε δύο ώρες στο δάσος, δίπλα σε ένα μικρό ποτάμι. Τα δέντρα ήταν πολύ ψηλά, και τα παιδιά έπαιξαν δίπλα στο ποτάμι. Ο Αντρέι φωτογράφισε τα βουνά, τα δέντρα και τα παιδιά.

  Το μεσημέρι φάγαμε σε μια ταβέρνα στο χωριό. Η Μαρία είπε:
  — Μου αρέσει πολύ η εξοχή. Αν βρούμε ένα σπίτι με κήπο, θα έχουμε δέντρα και λουλούδια, και τα παιδιά θα παίζουν έξω κάθε μέρα.
  Ο Νίκος είπε:
  — Και εγώ θα πίνω τον καφέ μου στον κήπο!
  Μετά ο Μάξιμ ρώτησε τον Νίκο:
  — Πότε χιονίζει εδώ;
  — Τον Ιανουάριο και τον Φεβρουάριο. Του χρόνου θα έρθουμε πάλι, με το χιόνι!

  Το απόγευμα έκανε πιο κρύο και είχε αέρα. Γυρίσαμε στη Λεμεσό στις έξι. Εκεί δεν έκανε κρύο: είχε είκοσι βαθμούς! Τα παιδιά ήταν πολύ κουρασμένα, και η Σόνια κοιμήθηκε στο αυτοκίνητο.

  Σήμερα είναι Τρίτη και είμαι στο μάθημα. Η Χριστίνα ρωτάει:
  — Ποια είναι η αγαπημένη σας εποχή; Τζον;
  Ο Τζον λέει:
  — Η άνοιξη. Στο Λονδίνο η άνοιξη είναι πολύ ωραία, έχει πολλά λουλούδια στα πάρκα. Αλλά βρέχει συχνά!
  — Και εσύ, Όλγα;
  Η Όλγα λέει:
  — Το καλοκαίρι. Μου αρέσει η ζέστη, και το καλοκαίρι κολυμπάω κάθε μέρα μετά τη δουλειά.
  — Άννα;
  Εγώ λέω:
  — Στη Μόσχα η αγαπημένη μου εποχή ήταν ο χειμώνας, με το χιόνι. Εδώ στην Κύπρο μου αρέσει το φθινόπωρο: δεν κάνει πολλή ζέστη, και η θάλασσα είναι ακόμα ζεστή. Το καλοκαίρι εδώ δεν μου αρέσει πολύ. Τον Αύγουστο έχει σαράντα βαθμούς και πολλή υγρασία, και εγώ ζεσταίνομαι όλη μέρα!
  Η Χριστίνα λέει:
  — Και τι θα κάνετε το καλοκαίρι;
  — Τον Ιούλιο, όταν θα κάνει πολλή ζέστη, θα πάμε πάλι στο Τρόοδος με τη Μαρία και τον Νίκο. Εκεί είναι πιο δροσερά, και τα παιδιά θα παίξουν στο ποτάμι. Και του χρόνου, τον Ιανουάριο, θα πάμε για το χιόνι!
  Ο Τζον λέει:
  — Χιόνι στην Κύπρο; Πού;
  Η Χριστίνα λέει:
  — Στο Τρόοδος, Τζον! Τον χειμώνα εκεί χιονίζει συχνά, και η θερμοκρασία είναι κάτω από το μηδέν. Θα πρέπει να πας κι εσύ!
