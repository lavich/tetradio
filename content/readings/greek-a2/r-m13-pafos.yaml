id: r-m13-pafos
title: Με το λεωφορείο στην Πάφο
after: m13-test
series: anna
text: |-
  Είναι Σάββατο. Η Μαρία, ο Νίκος και τα παιδιά τους είναι στην Πάφο, στους γονείς της Μαρίας. Σήμερα πηγαίνουν στην Πάφο και η Άννα, ο Αντρέι και τα παιδιά τους. Δεν πάνε με το αυτοκίνητο, αλλά με το υπεραστικό λεωφορείο. Στα παιδιά αρέσουν πολύ τα μεγάλα λεωφορεία.

  Στις εννέα παρά είκοσι είναι στον σταθμό λεωφορείων. Η Άννα πηγαίνει στο εκδοτήριο.
  — Καλημέρα σας! Παρακαλώ;
  — Καλημέρα. Τέσσερα εισιτήρια μετ' επιστροφής για την Πάφο, παρακαλώ. Δύο για μεγάλους και δύο για παιδιά.
  — Είκοσι ευρώ, παρακαλώ.
  — Ορίστε. Τι ώρα φεύγει το επόμενο λεωφορείο;
  — Στις εννέα, από τη στάση δύο.
  — Πόση ώρα κάνει μέχρι την Πάφο;
  — Είναι εβδομήντα χιλιόμετρα. Κάνει περίπου μία ώρα και δέκα λεπτά.
  — Και τι ώρα φεύγει το τελευταίο λεωφορείο από την Πάφο;
  — Στις είκοσι μία.
  — Ευχαριστώ πολύ!

  Στη στάση δύο περιμένουν και άλλοι επιβάτες. Η ώρα είναι εννέα, αλλά το λεωφορείο δεν είναι εκεί. Είναι εννέα και δέκα. Το λεωφορείο αργεί. Ο Αντρέι λέει στα αγγλικά:
  — Πού είναι το λεωφορείο μας;
  Η Άννα λέει:
  — Σήμερα έχει πολλή κίνηση. Έρχεται σε λίγο.

  Στις εννέα και είκοσι το λεωφορείο είναι εκεί. Ανεβαίνουν στο λεωφορείο από την μπροστινή πόρτα και η Άννα δείχνει τα εισιτήρια στον οδηγό. Το λεωφορείο ξεκινάει. Η Άννα γράφει στη Μαρία:
  — Καλημέρα! Το λεωφορείο έχει καθυστέρηση. Φτάνουμε στην Πάφο στις δέκα και μισή.
  Η Μαρία γράφει:
  — Κανένα πρόβλημα! Σας περιμένω στον σταθμό με την Ελένη.

  Μετά από δέκα λεπτά ο Μάξιμ, ο γιος της Άννας, λέει:
  — Σε πόση ώρα φτάνουμε;
  — Σε μία ώρα.
  Μετά από δέκα λεπτά η Σόνια, η κόρη της, λέει:
  — Σε πόση ώρα φτάνουμε;
  — Σε πενήντα λεπτά.
  Ο Αντρέι λέει στα αγγλικά:
  — Είναι μόνο εβδομήντα χιλιόμετρα, αλλά για τα παιδιά είναι πολύ μακριά!

  Ο δρόμος για την Πάφο είναι πολύ ωραίος. Αριστερά είναι η θάλασσα. Τα παιδιά κοιτάνε από το παράθυρο και δεν μιλάνε.

  Στις δέκα και μισή το λεωφορείο φτάνει στον σταθμό της Πάφου. Η Μαρία και η Ελένη περιμένουν στη στάση. Η Μαρία λέει:
  — Καλώς ήρθατε στην Πάφο! Όλα καλά με το λεωφορείο;
  Η Άννα λέει:
  — Ναι, η διαδρομή είναι πολύ ωραία! Αλλά για τα παιδιά είναι πολύ μεγάλη.
