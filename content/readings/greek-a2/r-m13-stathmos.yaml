id: r-m13-stathmos
title: Στον σταθμό λεωφορείων
after: m13-2
series: anna
text: |-
  Είναι Τρίτη πρωί. Την Τρίτη η Άννα δεν δουλεύει, και σήμερα είναι στον σταθμό λεωφορείων της Λεμεσού με τον Τζον. Ο αδελφός του Τζον έρχεται σήμερα από το Λονδίνο. Η πτήση του φτάνει στη Λάρνακα στις δώδεκα και μισή.

  Ο Τζον λέει:
  — Άννα, πού είναι τα δρομολόγια για τη Λάρνακα; Δεν καταλαβαίνω τίποτα εδώ.
  Η Άννα λέει:
  — Κι εγώ δεν καταλαβαίνω. Πάμε στις πληροφορίες.

  Στις πληροφορίες η Άννα λέει:
  — Καλημέρα σας. Θέλω μια πληροφορία, παρακαλώ. Τι ώρα φεύγει το επόμενο λεωφορείο για το αεροδρόμιο της Λάρνακας;
  Ο κύριος στις πληροφορίες λέει:
  — Το επόμενο υπεραστικό λεωφορείο φεύγει στις δέκα και μισή.
  Ο Τζον λέει:
  — Πόση ώρα κάνει η διαδρομή;
  — Κάνει περίπου μία ώρα. Αλλά σήμερα έχει πολλή κίνηση στον δρόμο.
  — Η πτήση του αδελφού μου φτάνει στις δώδεκα και μισή. Τι ώρα φτάνει το λεωφορείο στο αεροδρόμιο;
  — Στις έντεκα και μισή. Αλλά με την κίνηση, περίπου στις δώδεκα.
  Η Άννα λέει:
  — Και από πού φεύγει;
  — Από τη στάση τέσσερα, εκεί απέναντι, δεξιά από το εκδοτήριο.
  Ο Τζον λέει:
  — Κάθε πόση ώρα περνάει το λεωφορείο για τη Λάρνακα;
  — Κάθε δύο ώρες. Μετά, το επόμενο δρομολόγιο είναι στις δώδεκα και μισή.
  — Και το τελευταίο από το αεροδρόμιο για τη Λεμεσό;
  — Το τελευταίο φεύγει από το αεροδρόμιο στις είκοσι τρεις και τριάντα.
  — Ευχαριστώ πολύ!

  Η ώρα είναι δέκα και είκοσι. Ο Τζον βιάζεται.
  — Άννα, πάμε! Είναι δέκα και είκοσι!
  Η Άννα λέει:
  — Γιατί βιάζεσαι, Τζον; Το λεωφορείο φεύγει σε δέκα λεπτά.

  Στη στάση τέσσερα περιμένουν και άλλοι επιβάτες. Μετά από λίγο ακούνε:
  — Το υπεραστικό λεωφορείο για τη Λάρνακα έχει καθυστέρηση είκοσι λεπτά. Αναχώρηση στις δέκα και πενήντα.
  Ο Τζον λέει:
  — Καθυστέρηση! Και τώρα τι κάνουμε;
  Η Άννα λέει:
  — Τίποτα. Πίνουμε έναν καφέ. Η πτήση του αδελφού σου φτάνει στις δώδεκα και μισή, όχι τώρα!

  Στις δέκα και πενήντα ο Τζον ανεβαίνει στο λεωφορείο. Η Άννα γυρίζει στο σπίτι με τα πόδια. Σήμερα δεν βιάζεται.
