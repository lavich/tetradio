id: r-m18-giatroi
title: Τέσσερις γιατροί
after: m18-test
series: anna
text: |-
  Μετά από δύο μέρες η Σόνια ήταν πάλι καλά και πήγε στο σχολείο. Αλλά την Κυριακή το βράδυ αρρώστησα εγώ. Τη Δευτέρα το πρωί είχα πονοκέφαλο και πονόλαιμο. Μέτρησα τον πυρετό μου: τριάντα οκτώ. Ο Αντρέι ξεκίνησε τη δουλειά στις έξι και ήταν ήδη στο νοσοκομείο.

  Πήρα τηλέφωνο τη διευθύντριά μου, την κυρία Χρυσταλλένη. Της είπα ότι είμαι άρρωστη, και η κυρία Χρυσταλλένη είπε:
  — Άννα, μην έρθεις σήμερα στη δουλειά! Πρέπει να ξεκουραστείς. Αλλά για την εταιρεία χρειαζόμαστε μια ιατρική βεβαίωση.

  Μετά έγραψα ένα μήνυμα στον Αντρέι. Ο Αντρέι απάντησε στα αγγλικά:
  — Είμαι γιατρός, αλλά για τη βεβαίωση πρέπει να πας στον προσωπικό σου γιατρό. Και μην ανησυχείς!

  Η προσωπική μου γιατρός είναι η κυρία Ιωάννα. Το ιατρείο της είναι κοντά, στη λεωφόρο, δίπλα στο φαρμακείο. Έκλεισα ένα ραντεβού για τις δέκα. Η κυρία Ιωάννα με εξέτασε και μέτρησε την πίεσή μου. Μετά είπε:
  — Έχετε κρυολόγημα, κυρία Άννα. Δεν είναι κάτι σοβαρό, αλλά πρέπει να μείνετε στο σπίτι τρεις μέρες.
  Εγώ ρώτησα:
  — Χρειάζομαι αντιβίωση;
  — Όχι, για το κρυολόγημα δεν χρειάζεται αντιβίωση. Είστε αλλεργική σε κάποιο φάρμακο;
  — Όχι.
  — Ωραία. Σας γράφω χάπια για τον πυρετό. Παίρνετε ένα χάπι κάθε οκτώ ώρες, μετά το φαγητό. Πίνετε πολλά υγρά και ξαπλώνετε πολύ. Και μην πάτε στη δουλειά!
  — Χρειάζομαι μια ιατρική βεβαίωση για τη δουλειά μου.
  — Ναι, ορίστε, για τρεις μέρες. Η συνταγή είναι στο ΓεΣΥ. Να γίνετε γρήγορα καλά!

  Από το ιατρείο πήγα στο φαρμακείο. Ο φαρμακοποιός είπε:
  — Καλημέρα σας. Παρακαλώ;
  — Καλημέρα. Έχω μια συνταγή από την κυρία Ιωάννα.
  — Ένα λεπτό… Ναι, τη βρήκα. Ορίστε τα χάπια σας.
  — Καλύπτονται από το ΓεΣΥ;
  — Ναι. Πληρώνετε μόνο ένα ευρώ.
  — Και έχετε κάτι για τον λαιμό;
  — Ναι, αυτό το σιρόπι. Δεν χρειάζεται συνταγή, αλλά δεν καλύπτεται από το ΓεΣΥ. Κάνει έξι ευρώ. Παίρνετε μια δόση το πρωί και μια το βράδυ.
  — Ευχαριστώ πολύ.
  — Περαστικά! Και αν σε τρεις μέρες δεν είστε καλύτερα, πηγαίνετε πάλι στη γιατρό σας.

  Στο σπίτι ξάπλωσα στον καναπέ. Το απόγευμα με πήρε τηλέφωνο η Μαρία. Της τα είπα όλα, και η Μαρία είπε:
  — Περαστικά, Άννα! Ο Νίκος είναι εδώ και λέει: μην πίνεις καφέ, πίνε πολύ τσάι και ξάπλωσε! Θέλεις να σου φέρω φαγητό;
  — Ευχαριστώ, Μαρία, έχω φαγητό. Και ευχαριστώ πολύ τον Νίκο!

  Το βράδυ ο Αντρέι ήρθε από το νοσοκομείο. Είδε τα φάρμακα στο τραπέζι και ρώτησε στα αγγλικά:
  — Τι γράφουν οι οδηγίες;
  Ο γιατρός της οικογένειας δεν μπορεί να διαβάσει τις οδηγίες! Ο Αντρέι πήγε μόνο σε τρία μαθήματα ελληνικών και σταμάτησε, γιατί το Σάββατο δουλεύει συχνά. Τις διάβασα εγώ και του τις μετάφρασα στα αγγλικά. Ο Αντρέι είπε:
  — Πολύ καλά. Η γιατρός σου είναι πολύ καλή. Πάρε το χάπι τώρα και ξάπλωσε.
  Μετά ήρθε η Σόνια με ένα φλιτζάνι τσάι και είπε:
  — Μην ανησυχείς! Τώρα είμαι εγώ η γιατρός σου. Πίνε το τσάι σου!

  Σήμερα είχα τέσσερις γιατρούς: την κυρία Ιωάννα, τον Αντρέι, τον Νίκο στο τηλέφωνο και τη Σόνια. Και όλοι μού είπαν το ίδιο: πίνε πολλά υγρά και ξάπλωσε!
