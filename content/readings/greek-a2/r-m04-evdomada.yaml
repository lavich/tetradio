id: r-m04-evdomada
title: Η εβδομάδα μου
after: m04-2
series: anna
text: |-
  Σήμερα είναι Τρίτη, έξι Οκτωβρίου. Είναι επτά το πρωί. Ο άντρας μου ο Αντρέι δεν είναι εδώ. Είναι γιατρός και την Τρίτη δουλεύει από τις έξι το πρωί.

  Εγώ δουλεύω τη Δευτέρα, την Τετάρτη και την Παρασκευή. Την Τρίτη και την Πέμπτη έχω μαθήματα ελληνικών. Τα μαθήματα αρχίζουν στις έξι και μισή το απόγευμα και τελειώνουν στις οκτώ και μισή το βράδυ. Κάνουν εκατόν πενήντα ευρώ τον μήνα. Το Σάββατο και την Κυριακή είμαι με την οικογένειά μου.

  Το απόγευμα παίρνω το βιβλίο μου και πηγαίνω στο μάθημα. Η δασκάλα μας η Χριστίνα λέει:
  — Καλησπέρα! Τι μέρα είναι σήμερα;
  Εγώ λέω:
  — Σήμερα είναι Πέμπτη!
  Ο Τζον λέει:
  — Όχι, Άννα, σήμερα είναι Τρίτη! Αύριο είναι Τετάρτη.
  Εγώ λέω:
  — Συγγνώμη! Τρίτη, Τετάρτη, Πέμπτη… Τώρα καταλαβαίνω.

  Η Χριστίνα λέει:
  — Και τι ημερομηνία είναι σήμερα, Όλγα;
  — Έξι Οκτωβρίου.
  — Πολύ καλά!

  Στις οκτώ και μισή η Όλγα μού λέει:
  — Άννα, ποιο είναι το τηλέφωνό σου;
  — Ενενήντα εννέα, σαράντα επτά, είκοσι, εξήντα πέντε.
  — Πιο αργά, παρακαλώ!
  — Ενενήντα εννέα… σαράντα επτά… είκοσι… εξήντα πέντε.
  Η Όλγα γράφει το τηλέφωνό μου. Τα λέμε την Πέμπτη!
