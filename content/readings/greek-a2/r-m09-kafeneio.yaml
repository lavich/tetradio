id: r-m09-kafeneio
title: Στο καφενείο πριν από το μάθημα
after: m09-2
series: anna
text: |-
  Είναι Τρίτη απόγευμα. Το μάθημα αρχίζει στις έξι και μισή, αλλά η Άννα, ο Τζον και η Όλγα είναι ήδη στο καφενείο δίπλα στη σχολή. Το καφενείο είναι μικρό και παλιό, αλλά πολύ καθαρό.

  Ο σερβιτόρος, ο κύριος Στέλιος, έρχεται στο τραπέζι.
  — Καλησπέρα σας! Πείτε μου, τι θα πάρετε;
  Η Άννα λέει:
  — Καλησπέρα. Μπορείτε να μας φέρετε τον κατάλογο, παρακαλώ;
  — Ορίστε.
  Ο Τζον λέει:
  — Θα ήθελα έναν καφέ. Τι μας προτείνετε;
  — Εδώ όλοι πίνουν κυπριακό καφέ. Σκέτο, μέτριο ή γλυκό;
  — Δεν ξέρω… Τι είναι ο μέτριος;
  — Ο μέτριος είναι λίγο γλυκός.
  — Ωραία. Έναν κυπριακό μέτριο, παρακαλώ.
  Η Άννα λέει:
  — Εγώ θα ήθελα έναν σκέτο.
  Η Όλγα λέει:
  — Εγώ δεν πίνω καφέ το απόγευμα. Ένα τσάι σκέτο, παρακαλώ, και ένα ποτήρι νερό.
  — Θέλετε και κάτι για φαγητό;
  Ο Τζον λέει:
  — Ναι! Πεινάω πολύ. Μια μερίδα χαλλούμι ψητό, παρακαλώ.
  — Αμέσως!

  Ο κύριος Στέλιος φέρνει τους καφέδες σε μικρά φλιτζάνια, το τσάι και το χαλλούμι. Η Άννα πίνει λίγο καφέ και λέει:
  — Ο καφές μου είναι πολύ ωραίος. Τζον, σου αρέσει ο κυπριακός καφές;
  — Μου αρέσει πολύ! Αλλά το φλιτζάνι είναι πολύ μικρό!
  Η Όλγα λέει:
  — Στην Κύπρο ο κυπριακός καφές είναι πάντα σε μικρό φλιτζάνι, Τζον.

  Μετά μιλάνε για το μάθημα. Η Όλγα λέει:
  — Για την Πέμπτη η Χριστίνα θέλει μια κριτική για ένα καφενείο.
  Ο Τζον λέει:
  — Ωραία! Γράφουμε για τον κύριο Στέλιο! Το καφενείο είναι καθαρό, ο καφές νόστιμος και ο σερβιτόρος πολύ καλός.

  Είναι έξι και είκοσι. Η Άννα λέει:
  — Συγγνώμη! Τον λογαριασμό, παρακαλώ.
  — Μαζί ή χωριστά;
  Ο Τζον λέει:
  — Μαζί. Σήμερα εγώ κερνάω!
  — Έντεκα ευρώ.
  — Ορίστε δώδεκα. Κρατήστε τα ρέστα.
  — Ευχαριστώ πολύ! Καλό βράδυ!

  Οι τρεις φίλοι πηγαίνουν στο μάθημα. Ο Τζον γράφει ήδη την κριτική στο τετράδιό του.
