id: r-m06-diamerisma
title: Ο Τζον ψάχνει σπίτι
after: m06-2
series: anna
text: |-
  Ο Τζον είναι από το Λονδίνο, αλλά τώρα μένει στη Λεμεσό. Μαθαίνει ελληνικά με την Άννα και την Όλγα. Ψάχνει διαμέρισμα, γιατί το σπίτι του είναι πολύ μικρό και δεν είναι κοντά στη θάλασσα.

  Σήμερα, μετά το μάθημα, ο Τζον και η Άννα πηγαίνουν μαζί σε ένα διαμέρισμα. Η Άννα μιλάει λίγο ελληνικά, αλλά καταλαβαίνει πολλά. Το διαμέρισμα είναι του Χρήστου. Ο Χρήστος το νοικιάζει και περιμένει έξω από την πόρτα.

  Ο Χρήστος λέει:
  — Γεια σας! Καλώς ήρθατε!
  — Γεια σας! Με λένε Τζον. Αυτή είναι η φίλη μου η Άννα.
  — Χάρηκα πολύ. Τώρα δεν μένει κανένας εδώ.
  — Πόσα δωμάτια έχει το διαμέρισμα;
  — Δύο, ένα σαλόνι και ένα υπνοδωμάτιο. Η κουζίνα είναι δίπλα στο σαλόνι, και το μπάνιο είναι δίπλα στο υπνοδωμάτιο.

  Στο σαλόνι υπάρχουν δύο παράθυρα. Από το παράθυρο βλέπουν τη θάλασσα.
  — Άννα, η θάλασσα είναι εδώ, πολύ κοντά!
  — Ναι, πολύ ωραία!

  Στην κουζίνα υπάρχει ένα τραπέζι, αλλά δεν υπάρχει τίποτα άλλο.
  Η Άννα λέει:
  — Το διαμέρισμα είναι με έπιπλα;
  — Όχι, χωρίς έπιπλα. Υπάρχει μόνο το τραπέζι στην κουζίνα.
  — Δεν πειράζει. Έχω πολλά πράγματα. Πόσο είναι το ενοίκιο;
  — Πεντακόσια ευρώ τον μήνα.
  — Με το νερό;
  — Όχι, χωρίς το νερό.

  Μετά ο Τζον λέει στην Άννα:
  — Τι λες, Άννα;
  — Το σπίτι δεν είναι κακό και είναι κοντά στη θάλασσα. Αλλά πεντακόσια ευρώ είναι πολλά λεφτά.
  — Ναι, αλλά θέλω να ξυπνάω και να βλέπω τη θάλασσα κάθε πρωί!

  Και λέει στον Χρήστο:
  — Νοικιάζω το διαμέρισμα!
  — Πολύ καλά!

  Το Σάββατο οι φίλοι του από το μάθημα έρχονται στο καινούργιο του σπίτι. Ο Τζον ανοίγει την πόρτα και λέει:
  — Καλώς ήρθατε! Η θάλασσα είναι εκεί!
