id: r-m12-tachydromeio
title: Πού είναι το ταχυδρομείο;
after: m12-2
series: anna
text: |-
  Είναι Πέμπτη πρωί. Την Πέμπτη η Άννα δεν δουλεύει, και σήμερα είναι στο κέντρο της πόλης με την Όλγα, τη φίλη της από το μάθημα. Η Όλγα ψάχνει το ταχυδρομείο. Η Άννα ψάχνει μια τράπεζα. Το κέντρο της Λεμεσού δεν είναι μεγάλο, και οι δρόμοι εδώ είναι μικροί και στενοί.

  Η Όλγα λέει:
  — Άννα, ξέρεις πού είναι το ταχυδρομείο;
  Η Άννα λέει:
  — Όχι, δεν ξέρω. Έχω έναν χάρτη στο τηλέφωνο, αλλά δεν τον καταλαβαίνω!
  — Δεν πειράζει. Στη γωνία είναι ένας κύριος. Μιλάμε ελληνικά!

  Ο κύριος είναι με έναν μικρό σκύλο. Η Όλγα λέει:
  — Συγγνώμη, κύριε, πού είναι το ταχυδρομείο;
  Ο κύριος λέει:
  — Το ταχυδρομείο; Είναι κοντά. Πηγαίνετε ευθεία μέχρι το φανάρι. Στο φανάρι στρίψτε δεξιά. Μετά πάρτε τον δεύτερο δρόμο αριστερά. Το ταχυδρομείο είναι εκεί, απέναντι από την εκκλησία.
  Η Άννα λέει:
  — Πιο αργά, παρακαλώ. Μαθαίνουμε ελληνικά.
  — Καλά. Ευθεία μέχρι το φανάρι. Δεξιά. Ο δεύτερος δρόμος αριστερά. Απέναντι από την εκκλησία.
  Η Όλγα λέει:
  — Ευχαριστούμε πολύ! Υπάρχει και μια τράπεζα εκεί κοντά;
  — Ναι, η τράπεζα είναι δίπλα στο ταχυδρομείο. Είναι ανοιχτή μέχρι τις δύο.

  Οι δύο φίλες πηγαίνουν ευθεία μέχρι το φανάρι. Περνάνε τον δρόμο στη διάβαση και στρίβουν δεξιά. Εκεί η Όλγα λέει:
  — Ποιος δρόμος είναι ο δεύτερος; Αυτός ή εκείνος;
  Η Άννα λέει:
  — Αυτός είναι ο πρώτος και εκείνος είναι ο δεύτερος. Πάμε!

  Παίρνουν τον δεύτερο δρόμο αριστερά, αλλά δεν βλέπουν εκκλησία. Βλέπουν ένα πάρκο, ένα μουσείο και ένα φαρμακείο. Στην πόρτα του φαρμακείου είναι μια κυρία. Η Άννα λέει:
  — Συγγνώμη, κυρία, ψάχνουμε το ταχυδρομείο. Είναι απέναντι από την εκκλησία, αλλά πού είναι η εκκλησία;
  Η κυρία λέει:
  — Αυτός δεν είναι ο δεύτερος δρόμος, είναι ο τρίτος. Ο πρώτος δρόμος είναι πολύ μικρός, πίσω από το περίπτερο. Πηγαίνετε πίσω μέχρι τη γωνία, στρίψτε δεξιά και πάρτε τον πρώτο δρόμο δεξιά. Η εκκλησία είναι εκεί, και απέναντι είναι το ταχυδρομείο.
  Η Όλγα λέει:
  — Ευχαριστούμε πολύ, κυρία!

  Πέντε λεπτά μετά, οι φίλες είναι στο ταχυδρομείο. Είναι ανοιχτό! Και δίπλα είναι η τράπεζα. Η Άννα λέει:
  — Ωραία! Και μετά, ένας καφές;
  Η Όλγα λέει:
  — Ναι! Ξέρω ένα καλό καφενείο στην πλατεία.
  — Και πού είναι η πλατεία;
  — Δεν ξέρω… Ψάχνουμε πάλι!
