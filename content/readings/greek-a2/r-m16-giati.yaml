id: r-m16-giati
title: Γιατί μαθαίνω ελληνικά
after: m16-test
series: anna
text: |-
  Την Πέμπτη στο μάθημα η Χριστίνα είπε:
  — Για την Τρίτη πρέπει να γράψετε γιατί μαθαίνετε ελληνικά και τι θέλετε να κάνετε με τη γλώσσα.

  Την Κυριακή το απόγευμα πήρα το τετράδιό μου και το λεξικό και βγήκα στο μπαλκόνι. Γιατί μαθαίνω ελληνικά; Μένουμε στην Κύπρο, και θέλω να μιλάω με τους ανθρώπους εδώ: στον φούρνο του κυρ Κώστα, στο μανάβικο της κυρίας Ευτυχίας, στη λαϊκή με τη Μαρία. Στη δουλειά οι συνάδελφοί μου μιλάνε αγγλικά μαζί μου, αλλά στις συσκέψεις μιλάνε ελληνικά, και εγώ θέλω να καταλαβαίνω. Τα παιδιά μου πηγαίνουν σε σχολείο εδώ και μαθαίνουν ελληνικά κάθε μέρα. Πρέπει να μπορώ να μιλάω με τους δασκάλους τους. Και ο στόχος μου είναι να δώσω εξετάσεις για το πιστοποιητικό Α2 τον Ιούνιο.

  Έγραψα μία ώρα. Ο Μάξιμ ήρθε, διάβασε το τετράδιό μου και είπε:
  — Εδώ έχεις δύο λάθη. Θέλεις να σου εξηγήσω;
  — Ναι, παρακαλώ!
  Ο γιος μου είναι δέκα χρονών, αλλά ξέρει την ελληνική γραμματική πολύ καλά.

  Μετά ήρθε η Σόνια με το τετράδιό της και είπε:
  — Κι εγώ ξέρω να γράφω στα ελληνικά! Κοίτα: Σόνια!

  Το βράδυ ο Αντρέι γύρισε από το νοσοκομείο. Το Σάββατο είχε το πρώτο του μάθημα ελληνικών. Τον ρώτησα:
  — Πώς ήταν το μάθημα;
  Ο Αντρέι είπε στα αγγλικά:
  — Ωραίο, αλλά δύσκολο. Ξεχνάω τις λέξεις! Αλλά τώρα ξέρω να λέω δύο πράγματα.
  Και μετά είπε στα ελληνικά:
  — Με λένε Αντρέι. Είμαι γιατρός.
  Η προφορά του δεν είναι ακόμα καλή, αλλά εγώ είπα:
  — Πολύ καλά!

  Την Τρίτη διάβασα στην τάξη τι έγραψα. Η Χριστίνα είπε:
  — Πολύ καλά, Άννα! Μόνο ένα μικρό λάθος. Και η προφορά σου είναι πιο καλή τώρα.
  Ο Τζον είπε:
  — Εγώ μαθαίνω ελληνικά γιατί θέλω να μείνω στην Κύπρο, όχι στο Λονδίνο. Και θέλω να δώσω εξετάσεις μαζί σου τον Ιούνιο!
  Η Όλγα είπε:
  — Εγώ πρέπει να μάθω ελληνικά για τη δουλειά μου. Στο ξενοδοχείο έρχονται πελάτες από την Κύπρο και την Ελλάδα. Και η Ξένια μιλάει ελληνικά πιο καλά από τη μητέρα της. Δεν μου αρέσει αυτό!
  Η Χριστίνα είπε:
  — Ωραία! Τρεις μαθητές, τρεις στόχοι. Μέχρι τον Ιούνιο πρέπει να διαβάζετε λίγο κάθε μέρα και να μιλάτε ελληνικά και στο σπίτι, και στη δουλειά, και στα μαγαζιά.

  Τώρα στο σπίτι προσπαθώ να μιλάω ελληνικά με τα παιδιά. Ο Μάξιμ βρίσκει όλα τα λάθη μου. Και ο Αντρέι λέει κάθε βράδυ στα ελληνικά:
  — Καληνύχτα! Με λένε Αντρέι!
