id: r-m11-allagi
title: Το μπουφάν είναι μικρό
after: m11-test
series: anna
text: |-
  Ο γιος μου θέλει ένα καινούργιο μπουφάν για το σχολείο. Το παλιό του μπουφάν είναι πολύ μικρό. Ο γιος μου είναι μόνο δέκα χρονών, αλλά είναι πολύ ψηλός!

  Τη Δευτέρα μετά τη δουλειά πηγαίνω στο μαγαζί κοντά στο σπίτι μας και παίρνω ένα μπουφάν. Είναι σκούρο μπλε και πολύ ελαφρύ. Το βράδυ ο γιος μου το δοκιμάζει. Το μπουφάν είναι πολύ ωραίο, αλλά του είναι κοντό και στενό. Ο Αντρέι λέει στα αγγλικά:
  — Είναι πολύ μικρό. Δεν είναι για παιδί δέκα χρονών, είναι για παιδί έξι χρονών!
  Εγώ λέω:
  — Δεν πειράζει. Έχω την απόδειξη. Αύριο το αλλάζω.

  Την Τρίτη το πρωί δεν δουλεύω. Σηκώνομαι στις επτά, ντύνομαι και πίνω καφέ. Τα παιδιά πηγαίνουν στο σχολείο, και ο Αντρέι είναι στη δουλειά. Στις εννέα είμαι στο μαγαζί με το μπουφάν και την απόδειξη. Ο Μιχάλης, ο πωλητής, λέει:
  — Καλημέρα σας! Τι θέλετε;
  — Καλημέρα. Θα ήθελα να το αλλάξω. Ο γιος μου είναι πολύ ψηλός, και του είναι μικρό.
  — Έχετε την απόδειξη;
  — Ναι, ορίστε.
  — Θέλετε άλλο χρώμα ή άλλο νούμερο;
  — Πιο μεγάλο νούμερο. Το έχετε σε σκούρο μπλε;
  — Σε σκούρο μπλε όχι. Σε πιο μεγάλο νούμερο υπάρχει μόνο σε μαύρο και σε κόκκινο.
  — Το μαύρο, παρακαλώ. Ο γιος μου δεν φοράει κόκκινο.

  Το μαύρο μπουφάν είναι πιο μακρύ και πιο φαρδύ. Είναι και πέντε ευρώ πιο ακριβό. Δεν πειράζει. Μετά βλέπω ένα κόκκινο καπέλο για την κόρη μου και μια καφέ ζώνη για τον Αντρέι. Η ζώνη ταιριάζει με τα καφέ παπούτσια του. Ο Μιχάλης λέει:
  — Η ζώνη είναι σε έκπτωση. Κάνει μόνο δέκα ευρώ.
  — Ωραία! Την παίρνω. Πληρώνω με κάρτα.

  Το βράδυ ο γιος μου δοκιμάζει το μαύρο μπουφάν. Δεν είναι κοντό, δεν είναι στενό, είναι πολύ άνετο. Του πάει πολύ! Η κόρη μου φοράει το κόκκινο καπέλο. Της πάει πολύ το κόκκινο! Ο Αντρέι φοράει τη ζώνη και λέει στα αγγλικά:
  — Ωραία ζώνη! Ταιριάζει με τα παπούτσια μου.
  Εγώ λέω:
  — Και με το μαύρο παντελόνι σου!

  Μετά τρώμε. Στο τραπέζι ο γιος μου φοράει ακόμα το μπουφάν, και η κόρη μου το καπέλο. Εγώ λέω:
  — Παιδιά, στο σπίτι βγάζουμε το μπουφάν και το καπέλο!
