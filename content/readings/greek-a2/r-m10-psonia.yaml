id: r-m10-psonia
title: Τα ψώνια της Τρίτης
after: m10-test
series: anna
text: |-
  Την Τρίτη το πρωί δεν δουλεύω. Ο Αντρέι πάει στη δουλειά πολύ νωρίς, και τα παιδιά πάνε στο σχολείο στις επτά και μισή. Εγώ πίνω έναν καφέ και μετά ψωνίζω. Τα μαγαζιά κοντά στο σπίτι μας είναι μικρά, αλλά μου αρέσουν πολύ.

  Πρώτα πάω στον φούρνο του Κώστα. Το ψωμί του είναι πάντα φρέσκο και νόστιμο. Ο Κώστας λέει:
  — Καλημέρα, Άννα! Τι θέλεις σήμερα;
  — Καλημέρα! Ένα μεγάλο ψωμί, παρακαλώ.
  — Ορίστε. Ένα και είκοσι.

  Μετά πάω στο χασάπικο. Αγοράζω ένα κιλό κοτόπουλο για το βράδυ και μισό κιλό κρέας για σουβλάκια. Τα παιδιά μου αγαπάνε τα σουβλάκια!

  Το μανάβικο της Ευτυχίας είναι δίπλα. Η Ευτυχία πουλάει μόνο ντόπια φρούτα και λαχανικά. Η Ευτυχία λέει:
  — Καλημέρα, Άννα! Έχω φρέσκα πορτοκάλια σήμερα, από την Πάφο.
  — Πόσο κάνουν;
  — Δύο ευρώ το κιλό. Αλλά είναι σε προσφορά: δύο κιλά, τρία ευρώ.
  — Δύο κιλά, παρακαλώ. Και ένα κιλό καρότα.
  — Ορίστε. Τα καρότα κάνουν ένα ευρώ.
  — Ωραία. Τίποτα άλλο, ευχαριστώ.

  Στο σούπερ μάρκετ αγοράζω ένα κουτί γάλα, έξι αυγά, διακόσια γραμμάρια χαλλούμι και δύο μπουκάλια νερό. Στο ταμείο ο κύριος λέει:
  — Πληρώνετε με κάρτα ή μετρητά;
  — Με κάρτα.
  — Θέλετε σακούλα;
  — Όχι, ευχαριστώ. Έχω το καλάθι μου!

  Πριν από τις δώδεκα είμαι στο σπίτι. Το καλάθι μου είναι πολύ μικρό για δύο κιλά πορτοκάλια! Το ψωμί του Κώστα και τα πορτοκάλια της Ευτυχίας είναι πολύ νόστιμα. Μου αρέσει να ψωνίζω εδώ, στη Λεμεσό.

  Το βράδυ έχω μάθημα ελληνικών. Η Χριστίνα λέει:
  — Άννα, τι κάνεις την Τρίτη το πρωί;
  — Ψωνίζω! Πάω στον φούρνο, στο χασάπικο και στο μανάβικο. Και μιλάω μόνο ελληνικά!
  Η Χριστίνα λέει:
  — Πολύ ωραία, Άννα! Τα μαγαζιά είναι ένα πολύ καλό μάθημα.
