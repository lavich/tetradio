id: r-m01-tilefono
title: Το τηλέφωνο
after: m01-3
series: anna
text: |-
  — Καλησπέρα! Πώς σας λένε;
  — Καλησπέρα. Με λένε Άννα.
  — Καλώς ήρθατε, Άννα! Εγώ είμαι ο Νίκος. Από πού είστε;
  — Από τη Μόσχα. Κι εσείς;
  — Εγώ είμαι από την Κύπρο. Χάρηκα πολύ!
  — Επίσης. Συγγνώμη, Νίκο, ποιο είναι το τηλέφωνό σας;
  — Το τηλέφωνό μου; Ένα, δύο, τρία, τέσσερα, πέντε, έξι, επτά, οκτώ.
  — Ευχαριστώ! Το τηλέφωνό μου είναι εννέα, οκτώ, μηδέν, δύο, δέκα.
  — Δέκα; Όχι, Άννα: ένα, μηδέν!
  — Ναι, ναι. Δεν πειράζει!
  — Τα λέμε, Άννα!
  — Τα λέμε!
