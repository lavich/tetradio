id: r-m02-gnorimia
title: Μόνο ελληνικά!
after: m02-2
series: anna
text: |-
  — Καλησπέρα! Συγγνώμη, εδώ μαθαίνουμε ελληνικά;
  — Ναι, εδώ. Καλησπέρα! Με λένε Όλγα. Εσύ πώς σε λένε;
  — Με λένε Άννα. Χάρηκα πολύ, Όλγα.
  — Επίσης! Από ποια χώρα είσαι, Άννα;
  — Από τη Ρωσία, από τη Μόσχα. Αλλά τώρα μένω εδώ, στη Λεμεσό. Κι εσύ;
  — Κι εγώ είμαι από τη Ρωσία, από το Καζάν!
  — Από τη Ρωσία; Τι καλά! Μιλάμε ρωσικά;
  — Όχι, όχι! Εδώ μιλάμε μόνο ελληνικά.
  — Καλά… Πού δουλεύεις, Όλγα;
  — Δουλεύω εδώ, στη Λεμεσό. Στη δουλειά μιλάω αγγλικά. Ελληνικά ξέρω μόνο λίγο.
  — Κι εγώ ξέρω πολύ λίγο. Αλλά μαθαίνω, γιατί τώρα μένω εδώ.
  Ο Τζον λέει:
  — Γεια σας! Συγγνώμη… εδώ μαθαίνουμε ελληνικά;
  — Ναι! Καλησπέρα. Πώς σε λένε;
  — Με λένε Τζον. Είμαι από το Λονδίνο. Μιλάτε αγγλικά;
  — Ναι, λίγο. Εγώ είμαι η Άννα και αυτή είναι η Όλγα. Είμαστε από τη Ρωσία.
  — Χάρηκα πολύ! Κι εσείς μένετε στη Λεμεσό;
  — Ναι, μένουμε εδώ. Κι εσύ, Τζον; Πού μένεις;
  — Μένω και δουλεύω εδώ. Αλλά δεν ξέρω ελληνικά… μόνο «καλημέρα» και «ευχαριστώ»!
  Η Χριστίνα λέει:
  — Καλησπέρα! Είμαι η Χριστίνα. Καλώς ήρθατε!
  — Καλησπέρα!
  — Από πού είστε; Τι γλώσσες μιλάτε;
  — Εγώ είμαι από το Λονδίνο. Μιλάω αγγλικά.
  — Εμείς είμαστε από τη Ρωσία. Μιλάμε ρωσικά και λίγο αγγλικά.
  — Πολύ καλά. Αλλά εδώ μιλάμε μόνο ελληνικά!
  — Συγγνώμη… δεν καταλαβαίνω.
  — Εδώ… μόνο… ελληνικά!
  — Α! Ναι, ναι. Καταλαβαίνω. Μόνο ελληνικά!
