id: r-m24-iliakos
title: Κρύο νερό
after: m24-2
series: anna
text: |-
  Είναι Τρίτη, επτά η ώρα το πρωί. Η Άννα δεν δουλεύει σήμερα. Ο Αντρέι πηγαίνει στο μπάνιο, και μετά από ένα λεπτό ανοίγει την πόρτα. Ο Αντρέι λέει στα αγγλικά:
  — Άννα, το νερό είναι πολύ κρύο! Δεν μπορώ να κάνω μπάνιο!
  Η Άννα λέει:
  — Πάλι; Και χθες το βράδυ τα παιδιά έκαναν μπάνιο με κρύο νερό.

  Ο Αντρέι φεύγει για τη δουλειά, και η Άννα ανεβαίνει στην ταράτσα της πολυκατοικίας. Εκεί κάθε διαμέρισμα έχει τον ηλιακό του. Κάτω από τον ηλιακό τους υπάρχει πολύ νερό. Η Άννα καταλαβαίνει: ο ηλιακός έχει βλάβη. Κατεβαίνει στο διαμέρισμα και παίρνει τηλέφωνο τον ιδιοκτήτη, τον κύριο Σωτήρη. Ο κύριος Σωτήρης λέει:
  — Ναι, παρακαλώ;
  Η Άννα λέει:
  — Καλημέρα σας, κύριε Σωτήρη. Είμαι η Άννα, από το διαμέρισμά σας κοντά στη θάλασσα. Συγγνώμη για την ενόχληση, αλλά έχω ένα πρόβλημα με το νερό.
  — Καλημέρα, κυρία Άννα. Τι έγινε;
  — Από χθες το νερό μας είναι κρύο. Ανέβηκα πάνω, και κάτω από τον ηλιακό υπάρχει πολύ νερό.
  — Πάλι ο ηλιακός! Είναι πολύ παλιός. Πέρσι είχε την ίδια βλάβη.
  — Μπορείτε, σας παρακαλώ, να στείλετε έναν τεχνικό; Έχουμε δύο παιδιά, και ο άντρας μου ξυπνάει πολύ νωρίς για τη δουλειά.
  — Βέβαια. Θα τηλεφωνήσω τώρα στον τεχνικό μου. Σήμερα δουλεύει στη Λάρνακα, αλλά αύριο το πρωί μπορεί να έρθει. Θα είστε στο σπίτι;
  — Αύριο το πρωί δουλεύω, από τις οκτώ μέχρι τη μία. Μπορεί να έρθει την Πέμπτη; Την Πέμπτη το πρωί είμαι ελεύθερη.
  — Καλά, την Πέμπτη στις εννέα. Και ξέρετε κάτι; Θα αγοράσω καινούργιο ηλιακό. Ο παλιός είναι είκοσι χρονών!
  — Σας ευχαριστώ πολύ! Και κάτι άλλο: τα κοινόχρηστα τα πληρώνω πάλι στον διαχειριστή;
  — Ναι, στον διαχειριστή, όπως πάντα.
  — Ευχαριστώ. Καλή σας μέρα!

  Μετά από δέκα λεπτά κάποιος χτυπάει την πόρτα. Είναι η γειτόνισσα, η κυρία Δέσποινα, από το διαμέρισμα απέναντι. Η κυρία Δέσποινα λέει:
  — Καλημέρα, Άννα! Συγγνώμη για την ενόχληση. Το νερό σας είναι κρύο;
  Η Άννα λέει:
  — Ναι, ο ηλιακός μας έχει βλάβη. Ο τεχνικός θα έρθει την Πέμπτη στις εννέα.
  — Και ο δικός μας δεν δουλεύει! Μπορεί ο τεχνικός να έρθει και σε μας;
  — Βέβαια. Θα πω στον κύριο Σωτήρη.
  — Ευχαριστώ! Και κάτι ακόμα. Την Κυριακή έχει πανηγύρι στο χωριό μου, κοντά στη Λεμεσό. Θέλετε να έρθετε μαζί μας με τα παιδιά; Έχει μουσική, χορό και πολύ φαγητό!
  — Ευχαρίστως! Τι ώρα φεύγετε;
  — Στις πέντε το απόγευμα, με το αυτοκίνητό μας. Ο άντρας μου οδηγεί.

  Το βράδυ η Άννα τα λέει όλα στον Αντρέι. Ο Αντρέι λέει στα αγγλικά:
  — Πανηγύρι; Τι είναι αυτό;
  Η Άννα λέει:
  — Είναι μια γιορτή στο χωριό: μουσική, χορός, φαγητό και όλοι οι κάτοικοι στην πλατεία.
  Ο Αντρέι λέει στα αγγλικά:
  — Ωραία! Και μετά το πανηγύρι, πάλι κρύο μπάνιο;
