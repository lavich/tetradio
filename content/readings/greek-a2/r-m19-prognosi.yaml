id: r-m19-prognosi
title: Η πρόγνωση για το σαββατοκύριακο
after: m19-2
series: anna
text: |-
  Είναι Πέμπτη βράδυ. Η Άννα γυρίζει από το μάθημα ελληνικών. Έξω φυσάει και ο ουρανός είναι συννεφιασμένος. Στο σπίτι η Μαρία παίρνει τηλέφωνο την Άννα.
  — Γεια σου, Άννα! Τι κάνεις; Πώς ήταν το μάθημα;
  — Καλά, ευχαριστώ. Σήμερα μιλήσαμε για τον καιρό. Μάθαμε πολλές καινούργιες λέξεις: βροχή, χιόνι, σύννεφο, καταιγίδα…
  — Ωραία, γιατί θέλω να μιλήσουμε για τον καιρό! Θυμάσαι; Το Σάββατο σχεδιάζουμε να πάμε όλοι μαζί στο Τρόοδος.
  — Ναι, βέβαια. Τα παιδιά περιμένουν όλη την εβδομάδα.
  — Είδα την πρόγνωση στο ίντερνετ. Ο καιρός θα αλλάξει. Το Σάββατο θα έχει καταιγίδες σε όλη την Κύπρο.
  — Καταιγίδες; Και στο Τρόοδος;
  — Και στο Τρόοδος. Θα βρέχει όλη μέρα, και το πρωί θα έχει ομίχλη στα βουνά. Ο Νίκος δεν θέλει να οδηγήσει στο βουνό με ομίχλη.
  — Ο Αντρέι επίσης δεν θέλει. Και την Κυριακή;
  — Την Κυριακή θα είναι μια ηλιόλουστη μέρα. Στη Λεμεσό η θερμοκρασία θα φτάσει τους είκοσι βαθμούς, αλλά στο Τρόοδος θα κάνει κρύο, από τέσσερις μέχρι οκτώ βαθμούς.
  — Μόνο τέσσερις βαθμοί! Θα πρέπει να πάρουμε πουλόβερ.
  — Ναι, πουλόβερ και μπουφάν για όλους. Και καλά παπούτσια, γιατί θα περπατήσουμε πολύ.
  — Τι θα κάνουμε εκεί;
  — Πρώτα θα κάνουμε μια βόλτα στο δάσος. Υπάρχει ένας ωραίος δρόμος δίπλα σε ένα ποτάμι. Μετά θα φάμε σε μια ταβέρνα στο χωριό. Οι γονείς μου πηγαίνουν εκεί κάθε φθινόπωρο.
  — Τέλεια! Τι ώρα θα ξεκινήσουμε;
  — Νωρίς, στις οκτώ. Από τη Λεμεσό μέχρι το Τρόοδος είναι περίπου μία ώρα με το αυτοκίνητο. Θα πάμε με δύο αυτοκίνητα: εμείς είμαστε πέντε, εσείς τέσσερις.
  — Ωραία. Θα σου στείλω μήνυμα το Σάββατο το βράδυ.
  — Καληνύχτα, Άννα!
  — Καληνύχτα, Μαρία!

  Η Άννα λέει στον Αντρέι στα αγγλικά:
  — Το Σάββατο θα βρέχει. Θα πάμε στο Τρόοδος την Κυριακή.
  Ο Αντρέι λέει στα αγγλικά:
  — Την Κυριακή; Καλά. Το Σάββατο θα μείνω στο σπίτι και θα διαβάσω.
  Ο Μάξιμ λέει:
  — Θα χιονίσει στο Τρόοδος;
  Η Άννα λέει:
  — Όχι, Μάξιμ. Ο χειμώνας τελειώνει. Στο Τρόοδος χιονίζει τον Ιανουάριο και τον Φεβρουάριο.
  Η Σόνια λέει:
  — Θέλω χιόνι! Στη Μόσχα έχει πολύ χιόνι.
  — Ναι, αλλά στη Μόσχα κάνει και πολύ κρύο. Τώρα εκεί η θερμοκρασία είναι κάτω από το μηδέν.
  Ο Μάξιμ λέει:
  — Μου αρέσει το κρύο! Δεν μου αρέσει η ζέστη.
  — Ωραία, γιατί την Κυριακή στο Τρόοδος θα κάνει κρύο!
  Η Σόνια λέει:
  — Και εγώ θα φορέσω το ροζ πουλόβερ μου!
