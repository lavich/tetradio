id: r-m17-gripi
title: Όλοι στο κρεβάτι
after: m17-test
series: anna
text: |-
  Η περασμένη εβδομάδα ήταν πολύ δύσκολη. Τη Δευτέρα ο Μάξιμ γύρισε από το σχολείο πολύ κουρασμένος. Είπε:
  — Δεν νιώθω καλά. Με πονάει το κεφάλι μου και ο λαιμός μου.
  Τη νύχτα έβηξε πολύ. Ο Αντρέι είναι γιατρός. Το πρωί είδε τον Μάξιμ και μου είπε στα αγγλικά:
  — Έχει γρίπη. Πρέπει να μείνει στο κρεβάτι τρεις μέρες και να πίνει πολύ νερό.
  Την Τρίτη ο Μάξιμ δεν πήγε στο σχολείο. Έγραψα ένα μήνυμα στη δασκάλα του.

  Την Τετάρτη το πρωί ξύπνησε η Σόνια και ήρθε στο κρεβάτι μου.
  — Με πονάει η κοιλιά μου. Και το αυτί μου!
  Τώρα είχα δύο άρρωστα παιδιά. Στις επτά και μισή πήρα τηλέφωνο τη διευθύντριά μου.
  — Καλημέρα, κυρία Χρυσταλλένη. Συγγνώμη, σήμερα δεν μπορώ να έρθω. Τα παιδιά μου είναι άρρωστα.
  — Κανένα πρόβλημα, Άννα. Η Ξένια έρχεται στις εννέα. Περαστικά στα παιδιά!

  Όλη μέρα έκανα τσάι, καθάρισα την κουζίνα και διάβασα βιβλία στα παιδιά. Το βράδυ ήμουν πολύ κουρασμένη. Και την Πέμπτη το πρωί αρρώστησα κι εγώ: είχα πονόλαιμο, πονοκέφαλο και βήχα. Ο Αντρέι είπε στα αγγλικά:
  — Έχεις κι εσύ γρίπη! Πρέπει να ξεκουραστείς. Σήμερα δεν πας στο μάθημα.
  Δεν πήγα. Το βράδυ με πήρε τηλέφωνο η Όλγα.
  — Άννα, πού είσαι; Τι έπαθες;
  — Αρρώστησα, Όλγα. Έχω γρίπη, και τα παιδιά είναι άρρωστα.
  — Περαστικά! Ο Τζον και η Χριστίνα σού λένε περαστικά. Θέλεις να σου φέρω κάτι;
  — Όχι, ευχαριστώ. Ο Αντρέι είναι εδώ.

  Και ο Αντρέι ήταν πολύ καλός. Μαγείρεψε, καθάρισε την κουζίνα και διάβασε βιβλία στα παιδιά. Είπε στα αγγλικά:
  — Βλέπεις; Ο γιατρός δεν αρρωσταίνει ποτέ!

  Το Σάββατο ήρθε η Μαρία με ένα μεγάλο κουτί πορτοκάλια από τη λαϊκή.
  — Γεια σου, Άννα! Πώς νιώθεις;
  — Είμαι καλύτερα τώρα, ευχαριστώ. Και τα παιδιά είναι καλύτερα.
  — Ωραία! Αλλά πρέπει να ξεκουραστείς ακόμα. Πάρε με τηλέφωνο αν χρειάζεσαι κάτι!

  Την Κυριακή το πρωί όμως ο Αντρέι έμεινε στο κρεβάτι μέχρι τις δέκα. Μετά ήρθε στην κουζίνα και είπε στα αγγλικά:
  — Δεν νιώθω καλά. Με πονάει το κεφάλι μου… και ο λαιμός μου… και όλο το σώμα μου…
  Η Σόνια τον κοίταξε και είπε:
  — Έχεις γρίπη! Πρέπει να μείνεις στο κρεβάτι!
  Και ο Μάξιμ είπε:
  — Ο γιατρός δεν αρρωσταίνει ποτέ, σωστά;
  Αυτή την Κυριακή δεν πήγαμε για πρωινό στην καφετέρια δίπλα στη θάλασσα. Μείναμε στο σπίτι. Εγώ μαγείρεψα, και τα παιδιά έκαναν τσάι για τον Αντρέι.
