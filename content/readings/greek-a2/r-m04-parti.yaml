id: r-m04-parti
title: Ένα πάρτι το Σάββατο
after: m04-test
series: anna
text: |-
  Είναι Πέμπτη, είκοσι δύο Οκτωβρίου, εννέα το βράδυ. Η Μαρία παίρνει τηλέφωνο την Άννα.
  — Γεια σου, Άννα! Τι κάνεις;
  — Καλά, ευχαριστώ. Κι εσύ;
  — Καλά. Άννα, είσαι ελεύθερη το Σάββατο;
  — Το Σάββατο; Το πρωί είμαι με τα παιδιά, αλλά το απόγευμα είμαι ελεύθερη. Γιατί;
  — Τα γενέθλια του Νίκου είναι το Σάββατο, και κάνουμε πάρτι στο σπίτι μας. Έρχονται οι φίλοι μας και η οικογένειά μας.
  — Τι ωραία! Τι ώρα αρχίζει το πάρτι;
  — Στις έξι το απόγευμα.
  Ο Νίκος είναι εκεί και λέει:
  — Όχι, Μαρία, στις επτά!
  — Α, ναι, συγγνώμη. Στις επτά. Και ο Αντρέι; Μπορεί;
  — Ο Αντρέι δουλεύει το Σάββατο το απόγευμα. Εγώ και τα παιδιά πάμε στις επτά, και ο Αντρέι έρχεται στις οκτώ και μισή.
  — Δεν πειράζει! Ο Πέτρος και ο γιος σου είναι φίλοι: είναι και οι δύο δέκα χρονών.
  — Μαρία, το Σάββατο είναι είκοσι τρεις ή είκοσι τέσσερις Οκτωβρίου;
  — Είκοσι τέσσερις.
  — Πολύ καλά. Τα λέμε το Σάββατο στις επτά!
  — Τα λέμε! Γεια σου!
  Η Άννα γράφει στο τηλέφωνό της: Σάββατο, 24 Οκτωβρίου, 19:00, πάρτι.
