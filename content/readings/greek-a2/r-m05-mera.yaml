id: r-m05-mera
title: Τι κάνεις το πρωί;
after: m05-2
series: anna
text: |-
  Είναι Σάββατο απόγευμα. Η Άννα και η Μαρία κάνουν βόλτα μαζί στην παραλία. Μιλάνε ελληνικά, γιατί η Άννα μαθαίνει ελληνικά.

  Η Μαρία λέει:
  — Άννα, πώς είναι η μέρα σου; Τι κάνεις το πρωί;
  — Ξυπνάω στις έξι και μισή, αλλά σηκώνομαι στις επτά. Ο Αντρέι σηκώνεται πάντα πολύ νωρίς. Είναι γιατρός και μερικές φορές αρχίζει δουλειά στις έξι!
  — Και τα παιδιά;
  — Τα παιδιά ξυπνάνε, αλλά δεν σηκώνονται! Ξυπνάω τα παιδιά δύο, τρεις φορές. Μετά βγαίνουμε μαζί από το σπίτι, γιατί πρέπει να είναι στο σχολείο στις οκτώ παρά τέταρτο. Κι εσύ, Μαρία; Τι ώρα ξυπνάς;
  — Εγώ ξυπνάω στις έξι. Είμαι δασκάλα και τα μαθήματα αρχίζουν στις οκτώ παρά τέταρτο.
  — Και ο Νίκος;
  — Ο Νίκος δεν ξυπνάει κάθε μέρα την ίδια ώρα. Μερικές φορές δουλεύει τη νύχτα και κοιμάται το πρωί.
  — Ο Αντρέι δουλεύει τη νύχτα μόνο την Τετάρτη. Τι κάνεις το απόγευμα;
  — Γυρίζω σπίτι στις δύο με τα παιδιά. Κι εσύ;
  — Εγώ δουλεύω το πρωί. Γυρίζω σπίτι στις δύο και περιμένω τα παιδιά. Το απόγευμα διαβάζω ελληνικά με τον γιο μου. Είναι ο δάσκαλός μου! Η κόρη μου βλέπει τηλεόραση ή ακούει μουσική.
  — Στο σπίτι μας τα παιδιά δεν βλέπουν τηλεόραση το απόγευμα. Πρέπει να διαβάζουν! Ο Γιώργος διαβάζει πολύ, αλλά ο Πέτρος και η Ελένη θέλουν μόνο να κάνουν βόλτα.
  — Και το βράδυ; Τι ώρα κοιμάσαι;
  — Συνήθως κοιμάμαι στις έντεκα. Κι εσύ;
  — Εγώ κοιμάμαι αργά, στις δώδεκα. Όταν τα παιδιά κοιμούνται, διαβάζω πάλι ελληνικά.
  — Πολύ αργά, Άννα! Πρέπει να κοιμάσαι νωρίς.
  — Δεν μπορώ. Δεν έχω χρόνο!

  Η Μαρία λέει:
  — Αύριο είναι Κυριακή. Αύριο δεν ξυπνάς νωρίς!
  — Ναι! Την Κυριακή ξυπνάμε όλοι αργά.
