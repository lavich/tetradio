id: r-m01-gnorimia
title: Καλημέρα!
after: m01-2
series: anna
text: |-
  — Καλημέρα!
  — Καλημέρα! Συγγνώμη, πώς σε λένε;
  — Με λένε Άννα. Κι εσύ;
  — Εγώ είμαι η Μαρία. Από πού είσαι, Άννα;
  — Είμαι από τη Μόσχα. Κι εσύ; Είσαι από τη Μόσχα;
  — Όχι, είμαι από την Κύπρο.
  — Χάρηκα πολύ, Μαρία.
  — Επίσης! Αυτός είναι ο φίλος μου, ο Νίκος.
  — Γεια σου, Νίκο! Τι κάνεις;
  — Καλά, ευχαριστώ. Κι εσύ;
  — Καλά, ευχαριστώ. Νίκο, εσύ από πού είσαι;
  — Εγώ; Είμαι από την Κύπρο, όπως η Μαρία.
  — Κι η φίλη σου, Μαρία; Πώς τη λένε;
  — Τη λένε Ελένη. Τώρα είναι στη Μόσχα!
names: [Άννα, Μαρία, Νίκος, Νίκο, Κύπρο, Ελένη, Μόσχα]
glosses:
  - text: όπως
    russian: как
