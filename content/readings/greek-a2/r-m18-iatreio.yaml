id: r-m18-iatreio
title: Η Σόνια στο ιατρείο
after: m18-2
series: anna
text: |-
  Είναι Τρίτη, επτά η ώρα το πρωί. Η Σόνια δεν πάει σήμερα στο σχολείο. Από χθες το βράδυ έχει πυρετό και βήχα. Ο Αντρέι μέτρησε τον πυρετό της στις πέντε και μισή, πριν από τη δουλειά: τριάντα οκτώ και μισό. Μετά έφυγε για το νοσοκομείο, αλλά πρώτα είπε στην Άννα στα αγγλικά:
  — Είμαι γιατρός, αλλά δεν είμαι γιατρός για παιδιά. Πάρε τηλέφωνο την κλινική και κλείσε ένα ραντεβού. Και μην ανησυχείς, δεν είναι κάτι σοβαρό.

  Στις οκτώ η Άννα παίρνει τηλέφωνο την κλινική. Μια γυναίκα λέει:
  — Κλινική, καλημέρα σας.
  Η Άννα λέει:
  — Καλημέρα σας. Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό για την κόρη μου.
  — Τι έχει η κόρη σας;
  — Έχει πυρετό και βήχα. Και την πονάει ο λαιμός της.
  — Από πότε έχει αυτά τα συμπτώματα;
  — Από χθες το βράδυ. Σήμερα το πρωί είχε τριάντα οκτώ και μισό.
  — Πόσων χρονών είναι;
  — Έξι.
  — Ο γιατρός για τα παιδιά, ο κύριος Κυριάκος, είναι ελεύθερος σήμερα στις έντεκα. Μπορείτε να έρθετε;
  — Ναι, μπορώ. Ευχαριστώ!
  — Το όνομα της κόρης σας, παρακαλώ;
  — Σόνια.
  — Έχει η Σόνια κάποια αλλεργία;
  — Όχι, δεν έχει.
  — Ωραία, το γράφω. Μέχρι τις έντεκα, να πίνει πολλά υγρά.

  Στις έντεκα η Άννα και η Σόνια είναι στο ιατρείο. Ο γιατρός λέει:
  — Καλημέρα! Έλα, Σόνια. Πώς νιώθεις;
  Η Σόνια λέει:
  — Δεν νιώθω καλά. Με πονάει ο λαιμός μου.
  — Για να δω… Άνοιξε το στόμα σου, παρακαλώ. Πολύ ωραία!
  Ο γιατρός εξετάζει τη Σόνια και μετράει τον πυρετό με το θερμόμετρο. Μετά λέει στην Άννα:
  — Ο λαιμός της είναι λίγο κόκκινος, αλλά δεν είναι κάτι σοβαρό. Είναι ένα κρυολόγημα. Δεν χρειάζεται αντιβίωση.
  Η Άννα λέει:
  — Τι πρέπει να κάνουμε;
  — Σας γράφω ένα σιρόπι για τον βήχα. Δίνετε στη Σόνια το σιρόπι τρεις φορές την ημέρα, μετά το φαγητό, για πέντε ημέρες. Αν ο πυρετός ανέβει πάνω από τριάντα εννέα, πάρτε με τηλέφωνο.
  — Μπορεί να πάει στο σχολείο;
  — Όχι αύριο. Πρέπει να μείνει στο σπίτι δύο μέρες. Σόνια, πίνε πολύ νερό και τσάι. Και μην τρως γλυκά αυτή την εβδομάδα!
  Η Σόνια λέει:
  — Και το σιρόπι; Δεν είναι γλυκό;
  Ο γιατρός λέει:
  — Το σιρόπι είναι φάρμακο, Σόνια. Και είναι πολύ γλυκό!
  Η Άννα λέει:
  — Ευχαριστώ πολύ, γιατρέ. Ξέρετε, ο άντρας μου είναι γιατρός κι αυτός, αλλά δεν μιλάει ελληνικά.
  — Ναι; Και τι είπε για τη Σόνια;
  — Είπε ότι δεν είναι κάτι σοβαρό.
  — Πολύ σωστά! Να γίνεις γρήγορα καλά, Σόνια!

  Το βράδυ ο Αντρέι έρχεται από το νοσοκομείο. Βλέπει το σιρόπι στο τραπέζι και λέει στα αγγλικά:
  — Πώς είναι η Σόνια; Τι είπε ο γιατρός;
  Η Άννα λέει:
  — Είπε ότι δεν είναι κάτι σοβαρό. Αυτό είπες κι εσύ! Αλλά ο γιατρός τα είπε στα ελληνικά, και εγώ τα κατάλαβα όλα!
