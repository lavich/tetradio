id: r-m11-forema
title: Ένα φόρεμα για τη Μαρία
after: m11-2
series: anna
text: |-
  Είναι Σάββατο πρωί. Η Άννα και η Μαρία είναι σε ένα μαγαζί με ρούχα στη Λεμεσό. Το άλλο Σάββατο είναι τα γενέθλια της Μαρίας, και η Μαρία ψάχνει ένα καινούργιο φόρεμα. Η Δάφνη δουλεύει στο μαγαζί.

  Η Δάφνη λέει:
  — Καλημέρα σας! Τι ψάχνετε;
  Η Μαρία λέει:
  — Καλημέρα. Ψάχνω ένα φόρεμα, όχι πολύ ακριβό.
  — Τι νούμερο φοράτε;
  — Φοράω νούμερο σαράντα.
  — Το μαύρο φόρεμα εδώ είναι μακρύ και πολύ ελαφρύ. Το κόκκινο είναι πιο κοντό. Ποιο σας αρέσει περισσότερο;
  — Δεν ξέρω… Άννα, εσύ τι λες;
  Η Άννα λέει:
  — Μου αρέσει το κόκκινο. Είναι πολύ ωραίο χρώμα.
  Η Μαρία λέει:
  — Μπορώ να το δοκιμάσω; Πού είναι το δοκιμαστήριο;
  — Εκεί, δίπλα στο ταμείο.

  Η Μαρία δοκιμάζει το κόκκινο φόρεμα. Μετά λέει:
  — Μου είναι λίγο στενό. Το έχετε σε πιο μεγάλο νούμερο;
  Η Δάφνη λέει:
  — Όχι. Το κόκκινο είναι μόνο σε τριάντα οκτώ. Αλλά το μαύρο είναι σε σαράντα.

  Η Μαρία δοκιμάζει και το μαύρο φόρεμα. Η Άννα λέει:
  — Μαρία, σου πάει πολύ!
  — Ναι; Δεν είναι πολύ σκούρο;
  — Όχι, είναι πολύ ωραίο. Είναι άνετο;
  — Ναι, είναι πολύ άνετο. Πόσο κάνει;
  Η Δάφνη λέει:
  — Πενήντα πέντε ευρώ. Αλλά σήμερα έχει έκπτωση: κάνει σαράντα.
  Η Μαρία λέει:
  — Ωραία! Το παίρνω.

  Μετά η Άννα βλέπει τα παπούτσια για παιδιά. Η Άννα λέει:
  — Θέλω και μπότες για την κόρη μου. Φοράει νούμερο τριάντα.
  Η Δάφνη λέει:
  — Σε τριάντα υπάρχουν ροζ, άσπρες και μαύρες. Ποιες σας αρέσουν;
  — Τις ροζ, παρακαλώ. Η κόρη μου αγαπάει το ροζ! Είναι βαριές;
  — Όχι, είναι πολύ ελαφριές.

  Στο ταμείο η Μαρία λέει:
  — Και εσύ, Άννα; Τι φοράς στα γενέθλιά μου;
  — Εγώ; Το μπλε φόρεμά μου. Είναι παλιό, αλλά μου αρέσει πολύ.
  — Άννα, το μπλε φόρεμα το φοράς πάντα!
  Η Δάφνη λέει:
  — Ορίστε οι αποδείξεις σας. Η αλλαγή γίνεται μέσα σε δεκατέσσερις ημέρες. Καλή σας μέρα!
