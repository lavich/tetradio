id: r-m10-laiki
title: Στη λαϊκή
after: m10-2
series: anna
text: |-
  Είναι Σάββατο πρωί. Η Άννα και η Μαρία πάνε στη λαϊκή. Η λαϊκή είναι κάθε Σάββατο κοντά στο σπίτι της Μαρίας. Εκεί όλα είναι φρέσκα και δεν είναι ακριβά. Η Μαρία έχει ένα μεγάλο καλάθι.

  Ο κύριος Σάββας πουλάει ντομάτες, πατάτες, καρότα, πιπεριές και πορτοκάλια. Έχει πολλούς πελάτες, γιατί όλα είναι ντόπια.
  Ο κύριος Σάββας λέει:
  — Καλημέρα σας, κυρίες μου! Φρέσκα πορτοκάλια, ντόπιες ντομάτες!
  Η Μαρία λέει:
  — Καλημέρα, κύριε Σάββα! Θέλω πατάτες και καρότα για την Ελένη, την κόρη μου. Είναι χορτοφάγος.
  — Πόσο θέλετε;
  — Δύο κιλά πατάτες και ένα κιλό καρότα, παρακαλώ.
  Ο κύριος Σάββας ζυγίζει τις πατάτες και τα καρότα.
  — Ορίστε. Κάτι άλλο;
  — Τίποτα άλλο, ευχαριστώ. Πόσο κάνουν;
  — Τρία και πενήντα.

  Μετά η Άννα λέει:
  — Πόσο κάνουν οι ντομάτες;
  — Δύο ευρώ το κιλό. Είναι ντόπιες, από την Πάφο.
  Η Μαρία λέει:
  — Από την Πάφο; Οι γονείς μου μένουν στην Πάφο!
  Η Άννα λέει:
  — Ένα κιλό ντομάτες, παρακαλώ, και τρεις πιπεριές. Έχετε και φράουλες;
  — Φράουλες τώρα δεν έχω. Έχω πορτοκάλια. Είναι πολύ ώριμα και γλυκά.
  — Πόσο κοστίζουν;
  — Τρία ευρώ το κιλό.
  — Τρία ευρώ; Είναι λίγο ακριβά. Έχει έκπτωση;
  — Για σας, δύο ευρώ.
  — Ωραία! Ένα κιλό, παρακαλώ. Τα παιδιά μου αγαπάνε τα πορτοκάλια.
  — Ορίστε. Όλα μαζί κάνουν πέντε ευρώ.
  — Δεν έχω ψιλά, συγγνώμη. Ορίστε δέκα ευρώ.
  — Δεν πειράζει. Ορίστε τα ρέστα σας, πέντε ευρώ. Θέλετε σακούλα;
  — Ναι, μία, παρακαλώ. Δεν έχω καλάθι.

  Μετά η Άννα και η Μαρία πίνουν καφέ σε ένα καφενείο. Η Μαρία παραγγέλνει έναν κυπριακό καφέ μέτριο, και η Άννα έναν σκέτο. Η Άννα λέει:
  — Το άλλο Σάββατο έρχομαι πάλι στη λαϊκή. Αλλά με καλάθι!
