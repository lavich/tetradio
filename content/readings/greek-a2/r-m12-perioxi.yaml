id: r-m12-perioxi
title: Η περιοχή μου
after: m12-test
series: anna
text: |-
  Μένω στη Λεμεσό, σε μια ήσυχη περιοχή κοντά στη θάλασσα. Το διαμέρισμά μας είναι σε ένα άσπρο κτίριο, σε έναν μικρό δρόμο. Μου αρέσει πολύ η περιοχή μας.

  Στη γωνία του δρόμου μας υπάρχει ένας φούρνος. Κάθε πρωί παίρνω εκεί ψωμί. Δίπλα στον φούρνο είναι ένα περίπτερο και ένα μικρό σούπερ μάρκετ. Απέναντι από το κτίριό μας υπάρχει ένα πάρκο. Τα παιδιά μου αγαπάνε αυτό το πάρκο και το απόγευμα είναι συχνά εκεί. Η στάση του λεωφορείου είναι στη λεωφόρο, μπροστά στο φαρμακείο. Από εκεί πηγαίνω στο κέντρο της πόλης και στο μάθημα των ελληνικών. Η θάλασσα δεν είναι μακριά: κατεβαίνουμε τον δρόμο μας, περνάμε τη λεωφόρο στη διάβαση, και σε δέκα λεπτά είμαστε εκεί. Το Σάββατο και την Κυριακή κάνουμε βόλτα δίπλα στη θάλασσα.

  Αυτό το Σάββατο έρχεται στο σπίτι μας ο Τζον, ο φίλος μου από το μάθημα. Έρχεται για πρώτη φορά. Την Παρασκευή μιλάμε στο τηλέφωνο. Ο Τζον λέει:
  — Άννα, πώς πάω στο σπίτι σου;
  Εγώ λέω:
  — Από το κέντρο πάρε το λεωφορείο τριάντα και κατέβα στην πέμπτη στάση, μπροστά στο φαρμακείο. Μετά πέρασε τη λεωφόρο στη διάβαση και πάρε τον πρώτο δρόμο δεξιά. Στη γωνία υπάρχει ένας φούρνος. Το κτίριό μας είναι το δεύτερο αριστερά, απέναντι από το πάρκο.
  — Η πέμπτη στάση, ο πρώτος δρόμος δεξιά, το δεύτερο κτίριο. Εύκολο!

  Το Σάββατο περιμένουμε τον Τζον στις έξι. Είναι έξι και μισή, και ο Τζον δεν είναι εδώ. Στις επτά παρά τέταρτο ο Τζον με παίρνει τηλέφωνο:
  — Άννα, δεν ξέρω πού είμαι!
  — Πού είσαι, Τζον; Τι βλέπεις;
  — Είμαι στη στάση του λεωφορείου. Βλέπω μια μεγάλη εκκλησία, ένα μουσείο και ένα ζαχαροπλαστείο. Δεν βλέπω φαρμακείο.
  — Α, είσαι στην πλατεία της εκκλησίας! Αυτή είναι η τρίτη στάση, όχι η πέμπτη.
  — Είναι μακριά από εδώ;
  — Όχι, είναι δέκα λεπτά με τα πόδια.

  Ο Αντρέι λέει στα αγγλικά:
  — Ξέρω την πλατεία. Είναι κοντά. Πηγαίνω εγώ, γιατί ο Τζον δεν ξέρει την περιοχή.
  Εγώ λέω στο τηλέφωνο:
  — Τζον, ο Αντρέι έρχεται στη στάση. Σε πέντε λεπτά είναι εκεί!

  Είκοσι λεπτά μετά, τα παιδιά είναι στο μπαλκόνι. Ο Μάξιμ λέει:
  — Έρχονται! Και ο Τζον έχει ένα μεγάλο κουτί!
  Ο Τζον ανεβαίνει στο διαμέρισμα με ένα κουτί γλυκά και λέει:
  — Καλησπέρα! Τα γλυκά είναι από το ζαχαροπλαστείο της πλατείας. Τώρα ξέρω πού είναι!
  Εγώ λέω:
  — Καλώς ήρθες, Τζον! Έλα μέσα!
  Ο Αντρέι λέει στα αγγλικά:
  — Την άλλη φορά, Τζον, πάρε έναν χάρτη!
