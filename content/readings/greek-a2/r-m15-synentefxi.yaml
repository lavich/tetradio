id: r-m15-synentefxi
title: Η συνέντευξη της Ξένιας
after: m15-test
series: anna
text: |-
  Είμαι λογίστρια. Στη Μόσχα δούλεψα δέκα χρόνια σε μια μεγάλη τράπεζα, με πλήρες ωράριο. Η δουλειά μου ήταν ενδιαφέρουσα, αλλά πολύ κουραστική. Έκανα συχνά υπερωρίες και δεν είχα πολύ χρόνο για τα παιδιά μου.

  Όταν ήρθα στην Κύπρο με την οικογένειά μου, ο Αντρέι βρήκε αμέσως δουλειά σε ένα νοσοκομείο. Εγώ έστειλα το βιογραφικό μου σε πολλές εταιρείες. Μετά από δύο μήνες βρήκα αυτή τη θέση σε μια μικρή ιδιωτική εταιρεία στο κέντρο της Λεμεσού. Δουλεύω με μερική απασχόληση, τρία πρωινά την εβδομάδα. Ο μισθός μου δεν είναι μεγάλος, αλλά το απόγευμα είμαι με τα παιδιά.

  Την περασμένη εβδομάδα έδωσα στη διευθύντριά μου, την κυρία Χρυσταλλένη, το βιογραφικό της Ξένιας, της κόρης της Όλγας. Η εταιρεία μας ζητάει γραμματέα. Η κυρία Χρυσταλλένη είδε το βιογραφικό και είπε:
  — Ωραία! Η συνέντευξη είναι την Παρασκευή στις δέκα. Άννα, έλα κι εσύ!

  Την Παρασκευή η Ξένια ήρθε στις δέκα παρά τέταρτο, με ένα ωραίο μπλε φόρεμα. Η κυρία Χρυσταλλένη είπε:
  — Καλημέρα σας. Πού δουλέψατε πριν;
  Η Ξένια είπε:
  — Πέρσι το καλοκαίρι δούλεψα τρεις μήνες σε μια καφετέρια στην παραλία, ως σερβιτόρα. Ήταν κουραστικό, αλλά ήταν ωραίο, γιατί μου αρέσει να δουλεύω με ανθρώπους.
  — Τι γλώσσες μιλάτε;
  — Μιλάω ρωσικά, αγγλικά και ελληνικά.
  Μετά η κυρία Χρυσταλλένη και η Ξένια μίλησαν πολύ στα ελληνικά. Εγώ δεν είπα τίποτα: τα ελληνικά μου είναι ακόμα λίγα! Στο τέλος η διευθύντρια είπε:
  — Πότε μπορείτε να ξεκινήσετε;
  — Αμέσως! Από τη Δευτέρα.
  — Πολύ ωραία. Η θέση είναι δική σας. Καλώς ήρθατε!

  Η Ξένια είπε ευχαριστώ και έφυγε. Μετά πήρα τηλέφωνο την Όλγα. Η Όλγα είπε:
  — Το ξέρω, Άννα, το ξέρω! Η Ξένια μού τα είπε όλα. Την προσέλαβαν! Ευχαριστώ πολύ!

  Το βράδυ τα είπα όλα στον Αντρέι. Ο Αντρέι είπε στα αγγλικά:
  — Πολύ ωραία! Τώρα έχεις μια συνάδελφο από τη Ρωσία.
  Ναι, αλλά εγώ θέλω να μιλάω ελληνικά!

  Σήμερα είναι Δευτέρα. Στις εννέα η διευθύντρια οργανώνει μια σύσκεψη, και η Ξένια είναι εδώ. Πίνουμε μαζί καφέ πριν από τη σύσκεψη, και η Ξένια λέει:
  — Άννα, εδώ μιλάμε μόνο ελληνικά!
  Και εγώ λέω:
  — Ναι, Ξένια. Αλλά λίγο αργά, παρακαλώ!
