id: r-m23-parapono
title: Ένα παράπονο στα ελληνικά
after: m23-test
series: anna
text: |-
  Το βράδυ της Τρίτης έδειξα τον λογαριασμό του ρεύματος στον Αντρέι. Ο Αντρέι είπε στα αγγλικά:
  — Τετρακόσια είκοσι ευρώ για έναν μήνα; Αυτό είναι λάθος!
  Ναι, σίγουρα ήταν λάθος. Το διαμέρισμά μας δεν είναι μεγάλο, και τον Απρίλιο δεν ανοίγαμε καθόλου το κλιματιστικό. Αλλά ο Αντρέι δεν μιλάει ελληνικά, και η υπηρεσία ρεύματος δεν απαντάει στα ρωσικά. Έτσι, το παράπονο ήταν δική μου δουλειά.

  Την Πέμπτη πήγα στο μάθημα με τον λογαριασμό μαζί μου. Πριν από το μάθημα τον έδειξα στη Χριστίνα. Η Χριστίνα είπε:
  — Πολύ ωραία! Σήμερα μαθαίνουμε να γράφουμε επίσημες επιστολές. Το παράπονό σου είναι το θέμα μας!
  Ο Τζον είπε:
  — Κι εγώ έχω ένα παράπονο. Το ίντερνετ στο διαμέρισμά μου δεν δουλεύει καλά, και ο κύριος Χρήστος δεν απαντάει στο τηλέφωνο.
  Η Όλγα είπε:
  — Τζον, γράψε κι εσύ μια επιστολή!

  Έγραψα την επιστολή στο μάθημα. Πρώτα έγραψα Θέλω να ρωτήσω… Η Χριστίνα το είδε και είπε:
  — Άννα, έτσι γράφουμε σε φίλους. Σε μια υπηρεσία γράφουμε Θα ήθελα να ρωτήσω αν… Και όχι εσύ, μόνο εσείς: σας, μπορείτε, χρειάζεστε.
  Έγραψα την επιστολή τρεις φορές. Στο τέλος ήταν έτσι:

  Αξιότιμε κύριε / Αξιότιμη κυρία,

  Με λένε Άννα Ιβάνοβα και μένω στη Λεμεσό. Σας γράφω για τον λογαριασμό ρεύματος του Απριλίου. Ο λογαριασμός είναι τετρακόσια είκοσι ευρώ, αλλά τον Μάρτιο πληρώσαμε μόνο ενενήντα ευρώ. Το διαμέρισμά μας δεν είναι μεγάλο, και ίσως ο λογαριασμός είναι λάθος. Θα μπορούσατε να τον κοιτάξετε πάλι; Θα ήθελα επίσης να ρωτήσω αν πρέπει να πληρώσω τον λογαριασμό μέχρι την προθεσμία, στις είκοσι οκτώ Μαΐου, ή αν μπορώ να περιμένω την απάντησή σας. Επισυνάπτω αντίγραφο του λογαριασμού.

  Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

  Με εκτίμηση,
  Άννα Ιβάνοβα

  Η Χριστίνα διάβασε την επιστολή και είπε:
  — Πολύ καλά, Άννα! Τώρα είναι μια πραγματική επίσημη επιστολή.

  Την Παρασκευή, μετά τη δουλειά, πήγα πάλι στο ταχυδρομείο. Έστειλα την επιστολή συστημένη, γιατί είναι πιο σίγουρο. Ήταν πάλι ο ίδιος υπάλληλος. Είδε τον φάκελο και είπε:
  — Α, το παράπονο για το ρεύμα! Περιμένετε την απάντηση σε δύο εβδομάδες, περίπου.

  Μετά από δέκα μέρες ήρθε η απάντηση με email:

  Αξιότιμη κυρία Ιβάνοβα,

  Σας ευχαριστούμε για την επιστολή σας. Ο λογαριασμός για τον Απρίλιο ήταν λάθος. Ήταν ο λογαριασμός ενός άλλου διαμερίσματος. Ο καινούργιος λογαριασμός σας είναι ογδόντα πέντε ευρώ, και τον επισυνάπτουμε. Σας ζητάμε συγγνώμη. Μπορείτε να τον πληρώσετε στο ταχυδρομείο ή στην τράπεζα μέχρι τις είκοσι οκτώ Μαΐου.

  Με εκτίμηση,
  Υπηρεσία ρεύματος, Λεμεσός

  Το διάβασα δύο φορές. Ογδόντα πέντε ευρώ! Το βράδυ το είπα στον Αντρέι. Ο Αντρέι είπε στα αγγλικά:
  — Πολύ ωραία! Ένα παράπονο στα ελληνικά! Τώρα μιλάς ελληνικά πολύ καλύτερα από τον άντρα σου!
  Και εγώ του είπα:
  — Αντρέι, αυτό δεν είναι δύσκολο!
