id: r-m08-taverna
title: Στην ταβέρνα
after: m08-2
series: anna
text: |-
  Είναι Σάββατο βράδυ. Η Άννα και ο Αντρέι είναι σε μια ταβέρνα κοντά στη θάλασσα με τη Μαρία και τον Νίκο. Η ταβέρνα είναι μικρή, αλλά το φαγητό εδώ είναι πολύ καλό.

  Η Μαρία λέει:
  — Πεινάω πολύ! Τι τρώμε;
  Ο Νίκος λέει:
  — Εδώ το κλέφτικο είναι πολύ νόστιμο. Μου αρέσει πολύ.
  Ο Αντρέι λέει στα αγγλικά:
  — Τι είναι το κλέφτικο;
  — Είναι κρέας με πατάτες. Το μαγειρεύουν στον φούρνο πολλές ώρες.
  — Ωραία! Θέλω κι εγώ ένα κλέφτικο.
  Η Άννα λέει:
  — Εγώ δεν θέλω κρέας σήμερα. Προτιμώ ψάρι. Μαρία, σου αρέσει το ψάρι;
  — Ναι, μου αρέσει πολύ. Θέλω κι εγώ ψάρι. Και μια χωριάτικη σαλάτα για όλους.
  Ο Νίκος λέει:
  — Θέλουμε και μεζέδες: χαλλούμι, τζατζίκι και πατάτες τηγανητές.
  Η Άννα λέει:
  — Το τζατζίκι είναι καυτερό;
  — Όχι, δεν είναι καυτερό. Είναι πολύ νόστιμο με ψωμί.

  Μετά μιλάνε για τα ποτά. Ο Νίκος λέει:
  — Τι πίνουμε; Κρασί;
  Ο Αντρέι λέει στα αγγλικά:
  — Εγώ θέλω ένα ποτήρι κόκκινο κρασί.
  Η Μαρία λέει:
  — Εγώ προτιμώ το άσπρο.
  Η Άννα λέει:
  — Εγώ διψάω πολύ. Θέλω ένα ποτήρι νερό, παρακαλώ, και μετά λίγο άσπρο κρασί.

  Το φαγητό έρχεται. Το κλέφτικο είναι μεγάλο και πολύ νόστιμο. Ο Αντρέι λέει στα αγγλικά:
  — Νίκο, είναι πολύ ωραίο! Μου αρέσει πολύ το φαγητό εδώ.
  Η Άννα λέει:
  — Και το ψάρι είναι πολύ καλό. Λίγο αλμυρό, αλλά νόστιμο.

  Μετά η Μαρία θέλει κάτι γλυκό. Τρώνε όλοι μαζί γιαούρτι με μέλι. Είναι αργά, αλλά οι φίλοι είναι ακόμα εκεί και μιλάνε. Το βράδυ είναι πολύ ωραίο.
