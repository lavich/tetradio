id: r-m20-agonas
title: Ο αγώνας της Κυριακής
after: m20-test
series: anna
text: |-
  Το Σάββατο το βράδυ πήγα σινεμά με τη Μαρία. Η ταινία ήταν ελληνική, και κατάλαβα μόνο λίγες λέξεις. Αλλά οι ηθοποιοί ήταν πολύ καλοί, και η μουσική ήταν πολύ ωραία. Η Μαρία είπε ότι η ταινία ήταν για μένα καλύτερο μάθημα από το βιβλίο.

  Την Κυριακή δεν πήγαμε για πρωινό στην καφετέρια δίπλα στη θάλασσα. Ετοίμασα ένα γρήγορο πρωινό στο σπίτι, και στις έντεκα παρά τέταρτο ήμασταν στο γήπεδο του σχολείου. Ο καιρός ήταν ωραίος: είχε ήλιο, αλλά δεν έκανε πολλή ζέστη. Η Μαρία, ο Νίκος και η Ελένη ήταν ήδη εκεί.

  Η ομάδα του Γιώργου και του Πέτρου έπαιξε με μια ομάδα από ένα άλλο σχολείο. Οι παίκτες της άλλης ομάδας ήταν πιο μεγάλοι και πιο ψηλοί από τα δικά μας παιδιά. Τα πρώτα λεπτά η ομάδα μας δεν έπαιξε καλά, και ο Νίκος ανησύχησε πολύ. Η Μαρία μου είπε:
  — Βλέπεις; Ο Νίκος υποστηρίζει την ομάδα πιο πολύ από όλους τους γονείς!

  Ο Αντρέι σπάνια βλέπει ποδόσφαιρο, αλλά αυτός ο αγώνας του άρεσε πολύ. Ο Αντρέι είπε στα αγγλικά:
  — Ο Γιώργος παίζει καλύτερα από όλους. Και ο Πέτρος είναι ο πιο γρήγορος παίκτης στο γήπεδο!

  Στο τέλος η ομάδα μας κέρδισε, δύο ένα. Ο Γιώργος και ο Πέτρος ήρθαν κοντά μας, πολύ κουρασμένοι. Ο Γιώργος είπε:
  — Κερδίσαμε! Σας άρεσε ο αγώνας;
  Ο Μάξιμ είπε:
  — Ναι! Ήταν ο καλύτερος αγώνας! Θέλω κι εγώ να παίξω σε μια ομάδα!
  Ο Νίκος είπε:
  — Μάξιμ, εσύ είσαι πιο ψηλός από τον Γιώργο. Πρέπει να παίξεις μπάσκετ!
  Ο Μάξιμ είπε:
  — Ναι, ο πατέρας μου το είπε κι αυτός! Αλλά το μπάσκετ είναι τόσο ωραίο όσο το ποδόσφαιρο;
  Ο Πέτρος είπε:
  — Είναι πιο ωραίο! Εγώ παίζω και τα δύο.

  Μετά πήγαμε όλοι μαζί στην ταβέρνα δίπλα στη θάλασσα. Τα παιδιά μίλησαν μόνο για τον αγώνα. Η Σόνια βαρέθηκε, και η Ελένη της είπε:
  — Σόνια, το ποδόσφαιρο είναι βαρετό. Ο χορός είναι πιο ωραίος! Θα έρθεις μαζί μου την Τετάρτη;
  Η Σόνια είπε:
  — Ναι! Θα φορέσω το ροζ φόρεμά μου!

  Το απόγευμα ξεκουραστήκαμε στο σπίτι. Το βράδυ σχεδιάσαμε την εβδομάδα μας. Από την Τρίτη ο Μάξιμ θα παίζει σε μια ομάδα μπάσκετ για παιδιά, δύο φορές την εβδομάδα. Η Σόνια θα πηγαίνει στα μαθήματα χορού με την Ελένη κάθε Τετάρτη. Ο Αντρέι θα πηγαίνει στο γυμναστήριο, όταν έχει χρόνο.

  Και εγώ; Δεν μου αρέσει το γυμναστήριο, και δεν έχω πολύ ελεύθερο χρόνο. Αλλά την Τρίτη και την Πέμπτη το πρωί δεν δουλεύω. Αυτά τα πρωινά θα κολυμπάω στη θάλασσα. Για μένα το κολύμπι είναι το καλύτερο άθλημα, και η θάλασσα είναι δέκα λεπτά από το σπίτι μας!

  Πριν από τον ύπνο ο Αντρέι μου είπε στα αγγλικά:
  — Τώρα η οικογένειά μας είναι πιο αθλητική από την οικογένεια της Μαρίας!
  Και εγώ του είπα:
  — Όχι ακόμα. Ο Νίκος υποστηρίζει την ομάδα του σχολείου καλύτερα από όλους μας!
