id: r-m05-deftera
title: Η Τρίτη μου
after: m05-3
series: anna
text: |-
  Η Τρίτη μου αρχίζει νωρίς. Ξυπνάω στις έξι και μισή και σηκώνομαι στις επτά. Ο Αντρέι δεν είναι στο σπίτι: την Τρίτη αρχίζει δουλειά στις έξι και βγαίνει από το σπίτι πολύ νωρίς. Μετά ξυπνάω τα παιδιά. Ο γιος μου σηκώνεται, αλλά η κόρη μου κοιμάται ακόμα. Στις επτά και μισή βγαίνουμε μαζί από το σπίτι. Το σχολείο ανοίγει στις επτά και μισή και τα μαθήματα αρχίζουν στις οκτώ παρά τέταρτο.

  Την Τρίτη δεν δουλεύω. Το πρωί διαβάζω ελληνικά, γιατί κάθε Τρίτη και Πέμπτη στις έξι και μισή έχω μάθημα. Στις δύο περιμένω τα παιδιά.

  Στο μάθημα είμαστε οκτώ άνθρωποι. Η δασκάλα μας, η Χριστίνα, έρχεται πάντα νωρίς. Ο Τζον έρχεται συχνά αργά. Σήμερα έρχεται στις επτά παρά τέταρτο και λέει:
  — Συγγνώμη! Συγγνώμη!
  Η Χριστίνα λέει:
  — Δεν πειράζει, Τζον. Σήμερα μιλάμε για τη μέρα μας. Τι ώρα ξυπνάς;
  — Ξυπνάω στις οκτώ, αλλά σηκώνομαι στις εννέα!
  — Κι εσύ, Όλγα; Τι κάνεις τα σαββατοκύριακα;
  — Τα σαββατοκύριακα δεν δουλεύω. Το Σάββατο κάνω βόλτα με την οικογένειά μου στην παραλία. Την Κυριακή ξυπνάω αργά, στις δέκα, και το απόγευμα έρχονται οι φίλοι μας.
  — Πολύ καλά! Άννα, εσύ τι κάνεις το βράδυ;
  Εγώ λέω:
  — Το βράδυ διαβάζω ελληνικά ή βλέπω τηλεόραση στα ελληνικά. Αλλά καταλαβαίνω μόνο λίγο!
  — Δεν πειράζει, Άννα. Μαθαίνεις!

  Το μάθημα τελειώνει στις οκτώ και μισή. Γυρίζω σπίτι στις εννέα. Ο Αντρέι και τα παιδιά με περιμένουν. Το βράδυ ο γιος μου διαβάζει και η κόρη μου ακούει μουσική. Στις δέκα τα παιδιά πάνε για ύπνο.

  Ο Αντρέι πάει για ύπνο στις δέκα και μισή, γιατί ξυπνάει πολύ νωρίς. Δεν μιλάει ελληνικά, αλλά κάθε βράδυ μού λέει στα ελληνικά:
  — Καληνύχτα, Άννα!
  Εγώ διαβάζω λίγο ακόμα. Στις δώδεκα πάω για ύπνο.
