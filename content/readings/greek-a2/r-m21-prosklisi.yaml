id: r-m21-prosklisi
title: Μια πρόσκληση από τον Τζον
after: m21-2
series: anna
text: |-
  Είναι Πέμπτη, έξι και τέταρτο το απόγευμα. Το μάθημα ελληνικών αρχίζει στις έξι και μισή. Η Άννα, ο Τζον και η Όλγα πίνουν καφέ έξω από την τάξη. Ο Τζον λέει:
  — Τι κάνετε το Σάββατο;
  Η Όλγα λέει:
  — Γιατί ρωτάς;
  — Επειδή έχω μια πρόταση. Το Σάββατο το βράδυ κάνω ένα μικρό πάρτι στο σπίτι μου. Τώρα έχω και έπιπλα! Θέλετε να έρθετε;
  Η Άννα λέει:
  — Τι ωραία ιδέα! Ναι, ευχαρίστως! Αλλά πρέπει να ρωτήσω τον Αντρέι, γιατί κάποιος πρέπει να μείνει με τα παιδιά.
  — Έλα με τον Αντρέι και με τα παιδιά! Το μπαλκόνι μου είναι μεγάλο.
  — Καλά. Θα του τηλεφωνήσω μετά το μάθημα.
  Η Όλγα λέει:
  — Λυπάμαι, Τζον, αλλά δυστυχώς δεν μπορώ, γιατί δουλεύω. Αυτή την εβδομάδα έχω απογευματινή βάρδια, από τις τρεις μέχρι τις έντεκα το βράδυ.
  — Λυπάμαι πολύ, Όλγα!

  Η Χριστίνα έρχεται με ένα φλιτζάνι τσάι και λέει:
  — Τι κανονίζετε, παιδιά;
  Ο Τζον λέει:
  — Ένα πάρτι για την παρέα μας, το Σάββατο. Χριστίνα, θέλεις να έρθεις κι εσύ;
  — Ευχαριστώ πολύ για την πρόσκληση, Τζον! Όμως το Σάββατο πηγαίνω στη Λευκωσία, γιατί η αδελφή μου έχει γενέθλια. Ίσως άλλη φορά.
  Ο Τζον λέει:
  — Η Όλγα δουλεύει, η Χριστίνα είναι στη Λευκωσία… Γι' αυτό αναβάλλω το πάρτι! Τι λέτε για την άλλη Κυριακή;
  Η Όλγα λέει:
  — Την άλλη Κυριακή έχω πρωινή βάρδια, μέχρι τις τρεις. Μετά είμαι ελεύθερη.
  Η Χριστίνα λέει:
  — Κι εγώ σίγουρα είμαι εδώ.
  Η Άννα λέει:
  — Την Κυριακή το πρωί τρώμε πάντα πρωινό σε μια καφετέρια δίπλα στη θάλασσα. Αλλά το απόγευμα είμαστε ελεύθεροι.
  Ο Τζον λέει:
  — Τέλεια! Την άλλη Κυριακή, στις πέντε το απόγευμα. Όλγα, τι ώρα να περάσω να σε πάρω από το ξενοδοχείο;
  — Στις τρεις και τέταρτο. Ευχαριστώ, Τζον!
  Η Άννα λέει:
  — Τι να φέρουμε; Ένα γλυκό;
  — Όχι, τίποτα! Εγώ μαγειρεύω. Φέρε μόνο καλή διάθεση!
  Η Χριστίνα λέει:
  — Και στο πάρτι μιλάμε μόνο ελληνικά!
  Ο Τζον λέει:
  — Μόνο ελληνικά; Ωραία, αλλά θα μιλάει μόνο η Χριστίνα!
  Η Χριστίνα λέει:
  — Πάμε, παιδιά! Το μάθημα αρχίζει.

  Μετά το μάθημα η Άννα παίρνει τηλέφωνο τον Αντρέι, για να τον ρωτήσει για το πάρτι. Ο Αντρέι λέει στα αγγλικά:
  — Ένα πάρτι στα ελληνικά; Πήγα σε τρία μαθήματα, αλλά ξέρω μόνο λίγες λέξεις!
  Η Άννα λέει:
  — Δεν πειράζει. Ο Τζον μιλάει και αγγλικά. Και μάλλον η Σόνια θα μιλάει περισσότερο από όλους μας!
