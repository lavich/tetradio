id: r-m22-pascha
title: Το πρώτο μας Πάσχα στην Κύπρο
after: m22-test
series: anna
text: |-
  Σήμερα είναι Τρίτη, τέσσερις Μαΐου, και το βράδυ έχω μάθημα ελληνικών. Η Χριστίνα θέλει να γράψουμε για μια γιορτή. Εγώ γράφω για τις γιορτές μας αυτή την άνοιξη.

  Στις είκοσι πέντε Μαρτίου ήταν αργία. Ήταν Πέμπτη, και την Πέμπτη το πρωί δεν δουλεύω. Ο Αντρέι δούλευε στο νοσοκομείο, γι' αυτό πήγα με τα παιδιά στο κέντρο για την παρέλαση. Πρώτα πέρασαν οι μικροί μαθητές, έπειτα οι μεγάλοι. Ο Γιώργος και ο Πέτρος ήταν με το σχολείο τους. Η Μαρία τους φωτογράφιζε όλη την ώρα. Μετά την παρέλαση πήγαμε όλοι μαζί για καφέ σε μια καφετέρια δίπλα στη θάλασσα, και τα παιδιά έφαγαν γλυκά. Ο Μάξιμ είπε:
  — Μαμά, κι εγώ θέλω να κάνω παρέλαση! Είμαι ο πιο ψηλός!

  Φέτος το Πάσχα ήταν στις δύο Μαΐου. Το Μεγάλο Σάββατο το πρωί πήγαμε στην Πάφο, στους γονείς της Μαρίας. Οδήγησε ο Αντρέι. Η μητέρα της Μαρίας είχε ήδη κόκκινα αυγά και φλαούνες για όλους. Ο πατέρας της Μαρίας δεν μιλάει αγγλικά, αλλά με τον Αντρέι μιλούσαν με τα χέρια και γελούσαν.

  Το βράδυ πήγαμε όλοι μαζί στην εκκλησία. Κάθε παιδί είχε μια λαμπάδα. Η λαμπάδα της Σόνιας ήταν ροζ! Στην εκκλησία ήταν πολλοί άνθρωποι. Στις δώδεκα όλοι είπαν:
  — Χριστός ανέστη!
  Μετά γυρίσαμε στο σπίτι και τσουγκρίσαμε αυγά. Ο Νίκος είπε:
  — Χριστός ανέστη, Άννα!
  Εγώ είπα:
  — Αληθώς ανέστη!
  Το αυγό μου κέρδισε! Ο Αντρέι ξέρει μόνο λίγες λέξεις, αλλά όλο το βράδυ έλεγε: Χριστός ανέστη!

  Την Κυριακή ο πατέρας της Μαρίας έκανε σούβλα στον κήπο. Η μητέρα της Μαρίας ετοίμασε ένα μεγάλο γιορτινό τραπέζι: σαλάτες, χαλλούμι, σούβλα, φλαούνες και πολλά γλυκά. Η Ελένη δεν τρώει κρέας, και η γιαγιά της έκανε για εκείνη ένα ωραίο φαγητό με λαχανικά. Ήρθαν και οι γείτονες. Τα παιδιά έπαιζαν στον κήπο όλη τη μέρα.

  Στο τέλος ο πατέρας της Μαρίας έπαιζε κυπριακή μουσική και όλοι χόρευαν. Εγώ δεν ήξερα τους χορούς, αλλά η μητέρα της Μαρίας με βοήθησε. Ο Αντρέι δεν χόρευε. Είχε ένα ποτήρι κρασί στο χέρι και μας φωτογράφιζε. Μετά ο Αντρέι είπε στα αγγλικά:
  — Ελάτε! Τώρα χορεύω κι εγώ!
  Και χόρεψε με τον Νίκο! Ήταν ένα πραγματικό γλέντι.

  Το βράδυ μείναμε πάλι στην Πάφο. Τη Δευτέρα ήταν αργία, και γυρίσαμε στη Λεμεσό το απόγευμα. Στο αυτοκίνητο η Σόνια είπε:
  — Πότε έχει πάλι Πάσχα;
  Τώρα ξέρω δύο μεγάλες κυπριακές γιορτές. Και ξέρω και τι λέμε: Χριστός ανέστη!
