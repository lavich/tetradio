id: r-m07-kleidia
title: Πού είναι τα κλειδιά;
after: m07-2
series: anna
text: |-
  Είναι Δευτέρα πρωί. Η ώρα είναι επτά. Στο σπίτι της Μαρίας όλοι ψάχνουν κάτι.

  Η Μαρία λέει:
  — Νίκο, πού είναι τα κλειδιά μου; Αρχίζω δουλειά στις οκτώ παρά τέταρτο!
  Ο Νίκος λέει:
  — Δεν ξέρω. Είναι πάνω στο τραπέζι;
  — Όχι, δεν είναι εκεί.
  — Είναι στο υπνοδωμάτιο, κάτω από το κρεβάτι;
  — Όχι, και εκεί δεν είναι.

  Ο Γιώργος έρχεται από το μπαλκόνι. Έχει ένα μικρό κλειδί.
  — Ποιανού είναι αυτό το κλειδί;
  Η Μαρία λέει:
  — Δεν είναι δικό μου. Τα κλειδιά μου είναι μεγάλα.
  Ο Νίκος λέει:
  — Είναι δικό μου! Ευχαριστώ, Γιώργο.

  Μετά έρχεται ο Πέτρος.
  — Το ξυπνητήρι μου δεν δουλεύει! Ξυπνάω πολύ αργά κάθε μέρα.
  Η Μαρία λέει:
  — Είναι χαλασμένο, Πέτρο. Είναι πολύ παλιό.
  — Θέλω ένα καινούργιο. Ένα κίτρινο!
  — Καλά, το Σάββατο.

  Η Ελένη είναι στο μπάνιο.
  — Το ντους είναι πολύ βρώμικο!
  Ο Νίκος λέει:
  — Ναι, ξέρω. Το Σάββατο καθαρίζουμε όλο το σπίτι, όλοι μαζί.

  Η Μαρία ψάχνει στην κουζίνα. Ανοίγει τα ντουλάπια, ανοίγει το πλυντήριο. Τίποτα. Ο Νίκος ανοίγει το ψυγείο, γιατί θέλει λίγο νερό.
  — Μαρία! Τα κλειδιά σου είναι εδώ, μέσα στο ψυγείο!
  — Μέσα στο ψυγείο; Τι κάνουν εκεί;
  Η Ελένη λέει:
  — Συγγνώμη… Το πρωί παίρνω τα κλειδιά σου, γιατί είναι ωραία. Μετά ανοίγω το ψυγείο για νερό, και τα κλειδιά μένουν μέσα.
  Η Μαρία λέει:
  — Δεν πειράζει, Ελένη. Ευχαριστώ, Νίκο! Τα λέμε το απόγευμα!

  Είναι επτά και τέταρτο. Η Μαρία πηγαίνει στη δουλειά. Τώρα όλα είναι καλά… Ή όχι; Ο Νίκος ψάχνει πάλι το μικρό του κλειδί!
