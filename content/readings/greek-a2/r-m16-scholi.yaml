id: r-m16-scholi
title: Στη σχολή
after: m16-2
series: anna
text: |-
  Είναι Σάββατο πρωί. Η Άννα και ο Αντρέι είναι σε μια σχολή στο κέντρο της Λεμεσού. Ο Αντρέι θέλει να μάθει ελληνικά. Στο νοσοκομείο οι συνάδελφοί του μιλάνε αγγλικά, αλλά οι άνθρωποι που έρχονται εκεί μιλάνε συχνά μόνο ελληνικά.

  Μια γυναίκα στη ρεσεψιόν λέει:
  — Καλημέρα σας! Είμαι η Δήμητρα. Παρακαλώ;
  Η Άννα λέει:
  — Καλημέρα σας. Ο άντρας μου θέλει να γραφτεί σε ένα μάθημα ελληνικών.
  — Πολύ ωραία! Μιλάει λίγο ελληνικά;
  — Όχι, ξέρει μόνο δύο τρεις λέξεις.
  — Τότε είναι για το επίπεδο Α1. Υπάρχουν πρωινά και βραδινά τμήματα. Τα βραδινά είναι την Τρίτη και την Πέμπτη, από τις έξι και μισή μέχρι τις οκτώ και μισή.

  Η Άννα λέει στον Αντρέι στα αγγλικά:
  — Την Τρίτη και την Πέμπτη το βράδυ έχω κι εγώ μάθημα. Ποιος μένει με τα παιδιά;
  Ο Αντρέι λέει στα αγγλικά:
  — Και το πρωί δουλεύω. Και το Σάββατο;
  Η Άννα ρωτάει τη Δήμητρα:
  — Έχετε μαθήματα και το Σάββατο;
  — Ναι, το Σάββατο από τις δέκα μέχρι τις δώδεκα, για το επίπεδο Α1. Στην τάξη είναι έξι μαθητές. Η καθηγήτρια είναι πολύ καλή και εξηγεί τη γραμματική και στα αγγλικά.
  — Πόσο κοστίζουν τα δίδακτρα;
  — Ογδόντα ευρώ τον μήνα. Το βιβλίο κάνει είκοσι ευρώ.
  — Και πότε αρχίζουν τα μαθήματα;
  — Το άλλο Σάββατο. Ο άντρας σας μπορεί να γραφτεί τώρα. Χρειάζομαι μόνο το όνομά του και ένα τηλέφωνο.

  Ο Αντρέι γράφει το όνομά του και το τηλέφωνό του. Η Δήμητρα ρωτάει την Άννα:
  — Κι εσείς; Μιλάτε πολύ καλά ελληνικά. Πού μαθαίνετε;
  — Σε ένα φροντιστήριο, δύο φορές την εβδομάδα. Ο στόχος μου είναι να δώσω εξετάσεις για το πιστοποιητικό Α2. Αλλά η προφορά μου δεν είναι καλή, και κάνω συχνά λάθη.
  — Όλοι κάνουν λάθη! Οι εξετάσεις για το Α2 είναι τον Ιούνιο. Οι γραπτές δεν είναι δύσκολες. Για τις προφορικές πρέπει να μιλάτε πολύ.
  — Το ξέρω. Αλλά στο σπίτι μιλάμε ρωσικά. Ο άντρας μου δεν ξέρει ελληνικά!
  — Τώρα ο άντρας σας μαθαίνει. Μπορείτε να μιλάτε ελληνικά στο σπίτι!

  Ο Αντρέι ρωτάει στα αγγλικά:
  — Τι λέει;
  Η Άννα λέει:
  — Λέει ότι από σήμερα στο σπίτι μιλάμε μόνο ελληνικά!
  Ο Αντρέι λέει στα αγγλικά:
  — Μόνο ελληνικά; Ωραία. Από σήμερα δεν λέω τίποτα!
  Η Δήμητρα λέει:
  — Τα λέμε το Σάββατο, κύριε Αντρέι!
  Ο Αντρέι καταλαβαίνει και λέει στα ελληνικά:
  — Ευχαριστώ… πολύ!
