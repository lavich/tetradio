id: r-m08-kyriaki
title: Το τραπέζι της Κυριακής
after: m08-test
series: anna
text: |-
  Την Κυριακή συνήθως μαγειρεύω για όλη την οικογένεια. Αυτή την Κυριακή έρχονται και οι φίλοι μας, η Μαρία και ο Νίκος, με τα τρία παιδιά τους. Είμαστε εννέα άνθρωποι στο τραπέζι!

  Το πρωί πηγαίνω με τον Αντρέι στο σούπερ μάρκετ. Παίρνουμε κρέας, ψωμί, τυρί, χαλλούμι, ντομάτες, πατάτες, αυγά και γιαούρτι. Ο Αντρέι παίρνει και κρασί και χυμό για τα παιδιά.

  Ξέρω τι αρέσει σε όλους. Στον Αντρέι αρέσει πολύ το κρέας. Τα παιδιά μου αγαπάνε τα σουβλάκια. Στον Νίκο αρέσει ο μουσακάς. Η Ελένη, η κόρη της Μαρίας, δεν τρώει κρέας.

  Στο σπίτι μαγειρεύω όλο το πρωί. Κάνω έναν μεγάλο μουσακά στον φούρνο και πατάτες στην κατσαρόλα. Ο Αντρέι κάνει μια χωριάτικη σαλάτα. Για την Ελένη κάνω ομελέτα με ντομάτες και τυρί στο τηγάνι.

  Στις δύο έρχονται οι φίλοι μας. Η Μαρία λέει:
  — Γεια σας! Πεινάμε πολύ!
  Εγώ λέω:
  — Καλώς ήρθατε! Το φαγητό είναι στο τραπέζι.
  Ο Πέτρος λέει:
  — Έχεις σουβλάκια;
  — Όχι σήμερα, Πέτρο. Σήμερα έχω μουσακά.
  Ο Γιώργος λέει:
  — Μου αρέσει ο μουσακάς!
  Η Ελένη λέει:
  — Εγώ δεν τρώω κρέας. Είμαι χορτοφάγος.
  — Το ξέρω, Ελένη. Η ομελέτα είναι δική σου!

  Ο Αντρέι δίνει κρασί στους μεγάλους και χυμό στα παιδιά. Ο Νίκος λέει:
  — Στην υγειά μας!
  Όλοι λέμε:
  — Στην υγειά μας!
  Εγώ λέω:
  — Καλή όρεξη!

  Ο μουσακάς είναι πολύ νόστιμος. Ο Νίκος λέει:
  — Άννα, μαγειρεύεις πολύ καλά!
  Ο Αντρέι λέει στα αγγλικά:
  — Ναι, αλλά μαγειρεύει μόνο την Κυριακή!

  Μετά πίνουμε κυπριακό καφέ και τρώμε γιαούρτι με μέλι. Τα παιδιά βγαίνουν στο μπαλκόνι. Η Μαρία λέει:
  — Την άλλη Κυριακή είστε στο σπίτι μας. Μαγειρεύει ο Νίκος!
