id: r-m14-taxidi
title: Δύο μέρες στην Πάφο
after: m14-test
series: anna
text: |-
  Σήμερα είναι Τρίτη και είμαι στο μάθημα. Η Χριστίνα λέει:
  — Άννα, πώς ήταν το ταξίδι σου;
  Εγώ λέω:
  — Περάσαμε πολύ ωραία!

  Την περασμένη Παρασκευή ταξιδέψαμε στην Πάφο για δύο νύχτες. Την Πέμπτη μετά το μάθημα ετοίμασα τις βαλίτσες. Την Παρασκευή το απόγευμα ξεκινήσαμε με το αυτοκίνητο. Οδήγησε ο Αντρέι. Από τη Λεμεσό μέχρι την Πάφο είναι περίπου εβδομήντα χιλιόμετρα, και φτάσαμε στο ξενοδοχείο σε μία ώρα.

  Στη ρεσεψιόν δώσαμε τα διαβατήριά μας. Τα δύο δωμάτια ήταν στον τρίτο όροφο, με θέα στη θάλασσα. Ήταν μικρά, αλλά καθαρά και ωραία. Τα παιδιά κολύμπησαν στην πισίνα μέχρι το βράδυ.

  Το Σάββατο το πρωί επισκεφτήκαμε το κάστρο της Πάφου και το λιμάνι. Εκεί ήταν πολλοί τουρίστες. Ο Αντρέι φωτογράφισε το κάστρο, τη θάλασσα και τα παιδιά. Μετά περπατήσαμε στο ιστορικό κέντρο. Αγοράσαμε καπέλα για τα παιδιά και ένα μπουκάλι κρασί για τη Μαρία. Ξοδέψαμε λίγα λεφτά.

  Το απόγευμα χαλαρώσαμε στην παραλία. Εγώ κολύμπησα στη θάλασσα με τον γιο μου. Η κόρη μου δεν κολύμπησε στη θάλασσα. Εκείνη προτίμησε την πισίνα. Ο Αντρέι διάβασε ένα βιβλίο.

  Το βράδυ δοκιμάσαμε ψάρι σε μια ταβέρνα δίπλα στη θάλασσα. Ήταν πολύ νόστιμο. Πληρώσαμε ογδόντα ευρώ και αφήσαμε και φιλοδώρημα.

  Την Κυριακή ξυπνήσαμε αργά. Μετά το πρωινό ετοιμάσαμε τις βαλίτσες και τις αφήσαμε στη ρεσεψιόν. Κολυμπήσαμε ακόμα λίγο στην πισίνα. Το απόγευμα ξεκινήσαμε για τη Λεμεσό και γυρίσαμε στο σπίτι στις επτά.

  Στο μάθημα ο Τζον λέει:
  — Κολυμπήσατε στη θάλασσα τον Νοέμβριο; Δεν είναι κρύα;
  — Όχι! Η θάλασσα στην Κύπρο είναι ακόμα ωραία.
  Η Όλγα λέει:
  — Και το ξενοδοχείο; Ήταν ακριβό;
  — Λίγο ακριβό, αλλά με θέα στη θάλασσα. Και κλείσαμε τα δωμάτια στο τηλέφωνο, στα ελληνικά!
  Η Χριστίνα λέει:
  — Πολύ καλά, Άννα! Τώρα γράφουμε όλοι για ένα ταξίδι μας.
