id: r-m03-maria
title: Η οικογένεια της Μαρίας
after: m03-3
series: anna
text: |-
  Η Μαρία είναι η φίλη της Άννας. Είναι από την Κύπρο, από την Πάφο, αλλά τώρα μένει στη Λεμεσό με την οικογένειά της. Είναι σαράντα δύο χρονών και είναι δασκάλα. Ο άντρας της, ο Νίκος, είναι από την Κύπρο, από τη Λεμεσό. Είναι σαράντα πέντε χρονών και είναι γιατρός.

  Η Μαρία και ο Νίκος είναι παντρεμένοι, και τα παιδιά τους είναι τρία. Ο γιος τους ο Γιώργος είναι δώδεκα χρονών, ο άλλος γιος τους, ο Πέτρος, είναι δέκα, και η κόρη τους, η Ελένη, είναι οκτώ. Τα παιδιά μιλάνε ελληνικά και αγγλικά. Η Ελένη μαθαίνει και λίγα ρωσικά, γιατί η κόρη της Άννας είναι η φίλη της.

  Οι γονείς της Μαρίας μένουν στην Πάφο. Ο πατέρας της είναι εβδομήντα χρονών και η μητέρα της εξήντα εννέα. Ο παππούς και η γιαγιά δεν μιλάνε αγγλικά, μόνο ελληνικά. Τα παιδιά πηγαίνουν στην Πάφο με τον Νίκο.

  Οι αδελφές της Μαρίας είναι δύο. Η μία μένει στη Λάρνακα. Η άλλη μένει στην Αθήνα με τον άντρα της και το παιδί τους. Το παιδί μιλάει ελληνικά, αλλά δεν καταλαβαίνει ρωσικά. Η Μαρία λέει:
  — Δεν πειράζει. Είναι μόνο τέσσερα χρονών. Θα μάθει.
