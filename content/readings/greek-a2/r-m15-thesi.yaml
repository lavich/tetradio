id: r-m15-thesi
title: Μια θέση για την Ξένια
after: m15-2
series: anna
text: |-
  Είναι Τρίτη, έξι και μισή το απόγευμα. Η Άννα, ο Τζον και η Όλγα είναι στο μάθημα ελληνικών. Η Χριστίνα λέει:
  — Καλησπέρα σας! Σήμερα μιλάμε για τη δουλειά. Τζον, τι δουλειά κάνεις;
  Ο Τζον λέει:
  — Είμαι προγραμματιστής. Δουλεύω για μια εταιρεία στο Λονδίνο, αλλά δουλεύω από το σπίτι, εδώ στη Λεμεσό.
  — Και πριν;
  — Πριν από την Κύπρο, δούλεψα πέντε χρόνια σε μια τράπεζα στο Λονδίνο. Μετά ήρθα εδώ.
  — Πολύ ωραία! Άννα, εσύ;
  Η Άννα λέει:
  — Είμαι λογίστρια. Δουλεύω σε μια μικρή ιδιωτική εταιρεία στο κέντρο, με μερική απασχόληση: τη Δευτέρα, την Τετάρτη και την Παρασκευή, από τις οκτώ μέχρι τη μία.
  — Σου αρέσει η δουλειά σου;
  — Ναι, είναι ενδιαφέρουσα, και οι συνάδελφοί μου είναι πολύ καλοί. Μαζί μου μιλάνε αγγλικά, αλλά εγώ μιλάω και λίγο ελληνικά!
  Η Χριστίνα λέει:
  — Πολύ καλά! Και εσύ, Όλγα;
  Η Όλγα λέει:
  — Εγώ δουλεύω σε ένα ξενοδοχείο, στη ρεσεψιόν. Δουλεύω από Δευτέρα μέχρι Παρασκευή, πότε το πρωί και πότε το απόγευμα. Αυτή την εβδομάδα δουλεύω το πρωί. Αλλά έχω ένα πρόβλημα. Η κόρη μου, η Ξένια, είναι είκοσι χρονών και ψάχνει δουλειά. Είδε πολλές αγγελίες στο ίντερνετ και έστειλε το βιογραφικό της σε τρεις εταιρείες, αλλά δεν έχει ακόμα συνέντευξη.
  Η Άννα λέει:
  — Η Ξένια; Περίμενε! Η εταιρεία μου ζητάει γραμματέα. Η διευθύντριά μου, η κυρία Χρυσταλλένη, το είπε χθες.
  — Ναι; Τι ωράριο έχει;
  — Μερική απασχόληση, από τις εννέα μέχρι τη μία, από Δευτέρα μέχρι Παρασκευή. Ο μισθός είναι εννιακόσια ευρώ τον μήνα.
  Ο Τζον λέει:
  — Και χρειάζεται εμπειρία;
  — Όχι, δεν χρειάζεται. Αλλά η γραμματέας πρέπει να μιλάει αγγλικά και ελληνικά.
  Η Όλγα λέει:
  — Η Ξένια μιλάει πολύ καλά αγγλικά. Και τα ελληνικά της είναι πιο καλά από τα δικά μου! Έχει πολλές φίλες από την Κύπρο.
  Η Χριστίνα λέει:
  — Η Ξένια πρέπει να κάνει αίτηση!
  Η Άννα λέει:
  — Αύριο δουλεύω. Η Ξένια μού στέλνει το βιογραφικό της σήμερα το βράδυ, και εγώ το δίνω στη διευθύντρια το πρωί.
  Η Όλγα λέει:
  — Ευχαριστώ πολύ, Άννα!
  Η Χριστίνα λέει:
  — Ωραία! Τώρα ανοίγουμε τα βιβλία. Σήμερα μαθαίνουμε πώς γράφουμε ένα γράμμα σε έναν εργοδότη.

  Η Όλγα γράφει ένα μήνυμα στο τηλέφωνό της. Μετά από πέντε λεπτά λέει στην Άννα:
  — Η Ξένια λέει ευχαριστώ! Αλλά τι φοράει μια γραμματέας στη συνέντευξη;
