id: ph13-06
text: "Ναι, είμαι από την Λεμεσό."
translation: "Да, я из Лимассола."
provenance:
  sourceLabel: "Урок 3 (подготовка к экзамену)"
  operation: requested-transform
  locator: "Урок 3, с. 13, слайд «Разговорная часть: Откуда вы?»"
  excerpt: "Ναι, είμαι από την Αθήνα. / Όχι, είμαι από την Λεμεσό. Да, я из Афин / Нет, я из Лимассола."
  request: "оставить из пары ответов один утвердительный — про Лимассол, чтобы карточка проверяла одно предложение, а не два через дробь"
