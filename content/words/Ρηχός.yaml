id: w22-20
greek: Ρηχός
russian: мелкий
ipa: "/riˈxos/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: ρηχός.svg
reading:
  - text: "η"
    ipa: "i"
    explanation: "η читается как и — в греческом несколько букв для звука и"
  - text: "χ"
    ipa: "x"
    explanation: "χ перед α, ο, υ и согласной — глухой х, как в «хор»"
examples:
  - greek: "Ο ποταμός εδώ είναι ρηχός."
    russian: "Река здесь мелкая."
    target: "ρηχός"
