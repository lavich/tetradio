id: tw082
greek: "nauseous"
russian: "чувствующий тошноту"
ipa: /ˈnɔːziəs/
note: "в Британии в разговоре чаще I feel sick — меня тошнит; в США sick значит «болен», а «тошнит» — nauseous; be sick (BrE) — «вырвать»"
