id: w14-17
greek: το τηλέφωνο
russian: телефон
ipa: "/to tiˈlefono/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: το-τηλέφωνο.svg
reading:
  - text: "η"
    ipa: "i"
    explanation: "η читается как и — в греческом несколько букв для звука и"
  - text: "φ"
    ipa: "f"
    explanation: "φ — один звук ф, писать два знака не нужно"
  - text: "ω"
    ipa: "o"
    explanation: "ω читается точно так же, как ο"
examples:
  - greek: "Το τηλέφωνό μου χτυπάει."
    russian: "Мой телефон звонит."
    target: "τηλέφωνό"
    source: "Слова 4 (список слов преподавателя), с. 2"
