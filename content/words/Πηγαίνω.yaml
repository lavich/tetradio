id: w22-01
greek: Πηγαίνω
russian: идти
ipa: "/piˈʝeno/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: πηγαίνω.svg
reading:
  - text: "η"
    ipa: "i"
    explanation: "η читается как и — в греческом несколько букв для звука и"
  - text: "γαί"
    ipa: "ʝe"
    explanation: "γ перед αι звучит мягко, как й, а αι даёт е"
examples:
  - greek: "Πηγαίνω στο σχολείο κάθε μέρα."
    russian: "Я хожу в школу каждый день."
    target: "Πηγαίνω"
