id: ew469
greek: "memoisation"
russian: "мемоизация: хранение уже посчитанных результатов, чтобы не считать их заново"
ipa: /ˌmeməʊaɪˈzeɪʃn/
note: "американское написание — memoization; в отличие от a cache, хранит результаты функции по её аргументам"
source: "Лексикон курса «Английский для IT», модуль e14 (docs/curriculum-english-it.md)"
