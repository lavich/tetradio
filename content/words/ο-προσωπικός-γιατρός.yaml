id: w669
greek: ο προσωπικός γιατρός
russian: личный (семейный) врач
ipa: /o prosopiˈkos ʝaˈtros/
forms: мн. οι προσωπικοί γιατροί
note: "Кипр: в ΓεΣΥ (Γενικό Σύστημα Υγείας, общая система здравоохранения) каждый выбирает себе личного врача (τον προσωπικό γιατρό); к специалисту — обычно по его направлению"
source: Лексикон курса, модуль 18 (docs/course/lexicon/18.tsv)
