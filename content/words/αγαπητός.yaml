id: w13-16
greek: Αγαπητός
russian: любимый
ipa: "/aɣapiˈtos/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: αγαπητός.svg
reading:
  - text: "γ"
    ipa: "ɣ"
    explanation: "γ перед α — звонкий гортанный, как украинское «г»"
  - text: "η"
    ipa: "i"
    explanation: "η читается как и — в греческом несколько букв для звука и"
examples:
