id: w14-33
greek: το δάχτυλο
russian: палец
ipa: "/to ˈðaxtilo/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: το-δάχτυλο.svg
reading:
  - text: "δ"
    ipa: "ð"
    explanation: "δ — мягкое межзубное th, как в this"
  - text: "χτ"
    ipa: "xt"
    explanation: "χ перед τ — глухой х, как в «хор»"
  - text: "υ"
    ipa: "i"
    explanation: "υ читается как и, а не как русское у"
examples:
  - greek: "Το δάχτυλό μου είναι μακρύ."
    russian: "Мой палец длинный."
    target: "δάχτυλό"
