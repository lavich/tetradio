blocks:
  - type: explanation
    id: gender
    title: Род и артикль
    body: |-
      У каждого греческого существительного есть род — мужской, женский или средний. Род показывает **артикль**, короткое слово перед существительным. В русском артиклей нет, а по-гречески существительное почти всегда говорят с ним: **η** Κύπρος, **ο** φίλος μου, **το** όνομά μου. Учите каждое слово вместе с артиклем — так вы сразу запоминаете и род.

      Чаще всего род видно по окончанию:
      - мужской, артикль **ο**: -ος, -ας, -ης — ο φίλος, ο Έλληνας, ο Γιάννης;
      - женский, артикль **η**: -α, -η — η χώρα, η γλώσσα, η πόλη, η Άννα;
      - средний, артикль **το**: -ο, -ι, -μα — το τηλέφωνο, το τσάι (чай), το όνομα.

      Исключения есть: **η Κύπρος** — женского рода, хотя кончается на -ος. Названия стран чаще всего женского рода: η Ελλάδα, η Ρωσία, η Κύπρος (но есть и средний род: το Βέλγιο — Бельгия).

      Во множественном числе у мужского и женского рода один артикль — **οι** [и], у среднего — **τα**: οι φίλοι, οι χώρες, τα ονόματα.
    table:
      columns:
        - род
        - единственное число
        - множественное число
      rows:
        - - мужской
          - ο φίλος, ο Έλληνας
          - οι φίλοι, οι Έλληνες
        - - женский
          - η χώρα, η πόλη
          - οι χώρες, οι πόλεις
        - - средний
          - το όνομα, το τηλέφωνο
          - τα ονόματα, τα τηλέφωνα
  - type: explanation
    id: countries
    title: Страна, человек, язык
    body: |-
      Откуда человек, можно сказать двумя способами: **Είμαι από τη Ρωσία.** — «Я из России» или **Είμαι Ρώσος.** — «Я русский». Женщина скажет **Είμαι Ρωσίδα.** После είμαι национальность идёт без артикля.

      Названия языков — среднего рода и во множественном числе: **τα ελληνικά** — «греческий язык», τα ρωσικά, τα αγγλικά. После μιλάω и μαθαίνω артикль не ставят: **Μιλάω ελληνικά** — «Я говорю по-гречески», **Μαθαίνω ελληνικά** — «Я учу греческий».

      Чтобы спросить, откуда человек: **Από ποια χώρα είσαι;** — «Из какой ты страны?». Ποια — женская форма ποιος, потому что η χώρα — женского рода.
    table:
      columns:
        - страна
        - человек (м. / ж.)
        - язык
      rows:
        - - η Ελλάδα
          - ο Έλληνας / η Ελληνίδα
          - τα ελληνικά
        - - η Ρωσία
          - ο Ρώσος / η Ρωσίδα
          - τα ρωσικά
        - - η Κύπρος
          - ο Κύπριος / η Κύπρια
          - τα ελληνικά
        - - η Αγγλία
          - ο Άγγλος / η Αγγλίδα
          - τα αγγλικά
  - type: explanation
    id: verbs
    title: Глаголы на -ω — μένω, δουλεύω, μαθαίνω
    body: |-
      Инфинитива в греческом нет. Словарная форма глагола — это форма «я» настоящего времени: **μένω** — «я живу»; в словаре она значит «жить».

      Большинство глаголов кончаются на **-ω** и спрягаются одинаково: основа не меняется, меняется только окончание — **-ω, -εις, -ει, -ουμε, -ετε, -ουν**. Ударение остаётся на том же слоге: μαθ**αί**νω — μαθ**αί**νουμε.

      Как и с είμαι, местоимение обычно не нужно — лицо видно по окончанию: **Πού μένεις;** — «Где ты живёшь?» — **Μένω στη Λεμεσό.** — «Я живу в Лимасоле».

      Так же спрягается **καταλαβαίνω** — «понимаю»: καταλαβαίνεις, καταλαβαίνει…
    table:
      columns:
        - лицо
        - μένω — жить
        - δουλεύω — работать
        - μαθαίνω — учить
      rows:
        - - εγώ
          - μένω
          - δουλεύω
          - μαθαίνω
        - - εσύ
          - μένεις
          - δουλεύεις
          - μαθαίνεις
        - - αυτός, αυτή
          - μένει
          - δουλεύει
          - μαθαίνει
        - - εμείς
          - μένουμε
          - δουλεύουμε
          - μαθαίνουμε
        - - εσείς
          - μένετε
          - δουλεύετε
          - μαθαίνετε
        - - αυτοί, αυτές
          - μένουν
          - δουλεύουν
          - μαθαίνουν
  - type: explanation
    id: milao
    title: Глагол μιλάω — «говорить»
    body: |-
      Некоторые глаголы кончаются на ударное **-άω**. Ударение у них всегда на окончании, а окончания другие: **μιλάω, μιλάς, μιλάει, μιλάμε, μιλάτε, μιλάνε**. Весь этот тип мы разберём в модуле 05, а сейчас достаточно выучить μιλάω.

      В текстах и в речи вы встретите и краткие формы: **μιλώ** = μιλάω, **μιλά** = μιλάει, **μιλούν** = μιλάνε. Все они верны.

      О языках спрашивают так: **Τι γλώσσες μιλάς;** — «На каких языках ты говоришь?». Вежливо, на «вы»: **Τι γλώσσες μιλάτε;**
    table:
      columns:
        - лицо
        - форма
        - пример
      rows:
        - - εγώ
          - μιλάω (μιλώ)
          - Μιλάω ρωσικά.
        - - εσύ
          - μιλάς
          - Μιλάς αγγλικά;
        - - αυτός, αυτή
          - μιλάει (μιλά)
          - Η Άννα μιλάει ελληνικά.
        - - εμείς
          - μιλάμε
          - Μιλάμε ρωσικά.
        - - εσείς
          - μιλάτε
          - Τι γλώσσες μιλάτε;
        - - αυτοί, αυτές
          - μιλάνε (μιλούν)
          - Στην Κύπρο μιλάνε ελληνικά.
  - type: explanation
    id: den-se
    title: Отрицание δεν и «где» — στη, στην, στο
    body: |-
      **Δεν** — «не» — ставится прямо перед глаголом: **Δεν μιλάω αγγλικά.** — «Я не говорю по-английски». **Δεν καταλαβαίνω.** — «Я не понимаю». С είμαι так же: Δεν είμαι από την Αθήνα. В ответе «нет» часто звучат оба слова: — Μένεις στη Λάρνακα; — **Όχι, δεν** μένω στη Λάρνακα. (Перед некоторыми согласными иногда пишут δε — δε μιλάω; это тоже допустимо, но в курсе мы пишем δεν.)

      Где человек живёт или работает, говорят с предлогом **σε** — «в, на». Он сливается с артиклем: σε + τη(ν) = **στη(ν)**, σε + το = **στο**, σε + τον = **στον**. Буква ν ведёт себя так же, как у από την: **στην** перед гласной и перед κ, π, τ, ξ, ψ (и μπ, ντ, γκ, τσ, τζ) — στην Αθήνα, στην Κύπρο, στην Πάφο; **στη** перед остальными согласными — στη Ρωσία, στη Λάρνακα, στη Λεμεσό.

      Название города после στη(ν) может немного меняться: η Λεμεσός → στη Λεμεσό, η Πάφος → στην Πάφο. Это винительный падеж — его мы разберём в модуле 08, а пока запоминайте такие сочетания целиком.
    table:
      columns:
        - сочетание
        - примеры
      rows:
        - - σε + τη(ν) = στη(ν)
          - στη Ρωσία, στη Λεμεσό, στην Κύπρο, στην Αθήνα
        - - σε + το = στο
          - στο Λονδίνο (в Лондоне), στο Καζάν
        - - σε + τον = στον
          - στον Πειραιά (в Пирее)
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: articles
    title: Какой артикль
    instruction: Выберите артикль.
    format: choice
    items:
      - id: q1
        prompt: ___ χώρα (страна)
        options: [ο, η, το, οι, τα]
        answer: η
        explanation: Окончание -α — женский род.
      - id: q2
        prompt: ___ φίλος (друг)
        options: [ο, η, το, οι, τα]
        answer: ο
      - id: q3
        prompt: ___ όνομα (имя)
        options: [ο, η, το, οι, τα]
        answer: το
        explanation: Окончание -μα — средний род.
      - id: q4
        prompt: ___ Κύπρος (Кипр)
        options: [ο, η, το, οι, τα]
        answer: η
        explanation: Исключение — Κύπρος женского рода, хотя кончается на -ος. Названия стран чаще всего женского рода.
      - id: q5
        prompt: ___ πόλη (город)
        options: [ο, η, το, οι, τα]
        answer: η
      - id: q6
        prompt: ___ Έλληνας (грек)
        options: [ο, η, το, οι, τα]
        answer: ο
        explanation: Окончание -ας — мужской род.
      - id: q7
        prompt: ___ τηλέφωνο (телефон)
        options: [ο, η, το, οι, τα]
        answer: το
        explanation: Окончание -ο — средний род. Не путайте с -ος мужского рода.
      - id: q8
        prompt: ___ γλώσσες (языки)
        options: [ο, η, το, οι, τα]
        answer: οι
        explanation: Множественное число женского рода — οι.
      - id: q10
        prompt: ___ ελληνικά (греческий язык)
        options: [ο, η, το, οι, τα]
        answer: τα
        explanation: Названия языков — средний род, множественное число.
  - type: exercise
    id: people
    title: Кто он, кто она
    instruction: Выберите слово.
    format: choice
    items:
      - id: q1
        prompt: Ο Νίκος είναι από την Αθήνα. Είναι ___.
        options: [Έλληνας, Ελληνίδα, Ρώσος]
        answer: Έλληνας
      - id: q2
        prompt: Η Ελένη είναι από την Ελλάδα. Είναι ___.
        options: [Έλληνας, Ελληνίδα, Ρωσίδα]
        answer: Ελληνίδα
        explanation: Ελένη — женщина, поэтому Ελληνίδα.
      - id: q3
        prompt: Η Όλγα είναι από τη Μόσχα. Είναι ___.
        options: [Ρώσος, Ρωσίδα, Ελληνίδα]
        answer: Ρωσίδα
        explanation: Москва — в России, Ольга — женщина.
      - id: q4
        prompt: Ο Πάβελ και ο Ιγκόρ είναι από τη Ρωσία. Είναι ___.
        options: [Ρώσος, Ρώσοι, Ρωσίδα]
        answer: Ρώσοι
        explanation: Их двое — множественное число, οι Ρώσοι.
  - type: exercise
    id: verb-forms
    title: Формы глаголов
    instruction: Выберите форму глагола.
    format: choice
    items:
      - id: q1
        prompt: Εγώ ___ στη Λάρνακα.
        options: [μένω, μένεις, μένει]
        answer: μένω
      - id: q2
        prompt: Πού ___ εσύ;
        options: [μένω, μένεις, μένουμε]
        answer: μένεις
        explanation: "Εσύ — окончание -εις: μένεις."
      - id: q3
        prompt: Η Άννα ___ στη Λευκωσία.
        options: [δουλεύω, δουλεύει, δουλεύουν]
        answer: δουλεύει
      - id: q4
        prompt: Εμείς ___ ελληνικά.
        options: [μαθαίνουμε, μαθαίνετε, μαθαίνουν]
        answer: μαθαίνουμε
        explanation: "Εμείς — окончание -ουμε."
      - id: q5
        prompt: Κυρία Ελένη, ___ στην Πάφο;
        options: [μένετε, μένουμε, μένεις]
        answer: μένετε
        explanation: "Вежливое обращение (κυρία — госпожа) — форма «вы»: -ετε."
      - id: q6
        prompt: Ο Νίκος και η Μαρία ___ στη Λεμεσό.
        options: [δουλεύει, δουλεύουμε, δουλεύουν]
        answer: δουλεύουν
        explanation: "Никос и Мария — «они»: -ουν."
      - id: q7
        prompt: — ___ ελληνικά, Άννα; — Ναι, μαθαίνω.
        options: [Μαθαίνεις, Μαθαίνει, Μαθαίνετε]
        answer: Μαθαίνεις
        explanation: К Анне обращаются на «ты» — μαθαίνεις.
      - id: q8
        prompt: Συγγνώμη, δεν ___. (я не понимаю)
        options: [καταλαβαίνω, καταλαβαίνεις, καταλαβαίνει]
        answer: καταλαβαίνω
  - type: exercise
    id: milao-gap
    title: Формы μιλάω
    instruction: Вставьте форму глагола μιλάω.
    format: gap
    bank: [μιλάω, μιλάς, μιλάει, μιλάμε, μιλάτε, μιλάνε]
    items:
      - id: g1
        prompt: Εγώ ___ ρωσικά.
        answer: μιλάω
      - id: g2
        prompt: Εσύ ___ αγγλικά;
        answer: μιλάς
      - id: g3
        prompt: Ο Νίκος ___ ελληνικά και αγγλικά.
        answer: μιλάει
      - id: g4
        prompt: Εγώ και η Όλγα ___ ρωσικά.
        answer: μιλάμε
        explanation: «Я и Ольга» — это «мы».
      - id: g5
        prompt: Κύριε Παύλο, ___ αγγλικά;
        answer: μιλάτε
        explanation: Вежливое обращение — форма «вы».
      - id: g6
        prompt: Η Άννα και η Μαρία ___ ελληνικά.
        answer: μιλάνε
        explanation: Можно сказать и μιλούν — это та же форма «они».
  - type: exercise
    id: negation
    title: Скажите «нет»
    instruction: Сделайте предложение отрицательным — добавьте δεν.
    format: text
    items:
      - id: q1
        prompt: Μένω στη Λάρνακα.
        answer:
          - Δεν μένω στη Λάρνακα.
          - Δε μένω στη Λάρνακα.
      - id: q2
        prompt: Η Άννα μιλάει αγγλικά.
        answer:
          - Η Άννα δεν μιλάει αγγλικά.
          - Η Άννα δε μιλάει αγγλικά.
          - Η Άννα δεν μιλά αγγλικά.
        explanation: Δεν стоит прямо перед глаголом, а не перед именем.
      - id: q3
        prompt: Είμαι από την Ελλάδα.
        answer:
          - Δεν είμαι από την Ελλάδα.
        explanation: Перед гласной — только δεν.
      - id: q4
        prompt: Καταλαβαίνω.
        answer:
          - Δεν καταλαβαίνω.
      - id: q5
        prompt: Δουλεύουμε στην Πάφο.
        answer:
          - Δεν δουλεύουμε στην Πάφο.
          - Δε δουλεύουμε στην Πάφο.
  - type: exercise
    id: se-gap
    title: στη, στην или στο
    instruction: Вставьте σε с артиклем. Одно сочетание лишнее.
    format: gap
    bank: [στη, στην, στο, στον]
    items:
      - id: g1
        prompt: Μένω ___ Λεμεσό.
        answer: στη
      - id: g2
        prompt: Η Μαρία δουλεύει ___ Αθήνα.
        answer: στην
        explanation: Перед гласной ν остаётся — στην Αθήνα.
      - id: g3
        prompt: Ο Τζον μένει ___ Λονδίνο. (Λονδίνο — Лондон)
        answer: στο
        explanation: Το Λονδίνο — средний род, σε + το = στο.
      - id: g4
        prompt: Μαθαίνουμε ελληνικά ___ Κύπρο.
        answer: στην
        explanation: Перед κ ν остаётся — στην Κύπρο.
      - id: g5
        prompt: Η Όλγα μένει ___ Ρωσία.
        answer: στη
      - id: g6
        prompt: Δουλεύω ___ Πάφο.
        answer: στην
        explanation: Перед π ν остаётся — στην Πάφο.
  - type: exercise
    id: questions
    title: Вопрос и ответ
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Μένω στη Λάρνακα.
      - Είμαι από τη Ρωσία.
      - Μιλάω ρωσικά και αγγλικά.
      - Ναι, μαθαίνω ελληνικά.
      - Δουλεύω στη Λευκωσία.
      - Όχι, δεν καταλαβαίνω.
      - Είμαι η Άννα.
      - Είναι στην Πάφο.
    items:
      - id: m1
        prompt: Πού μένεις;
        answer: Μένω στη Λάρνακα.
      - id: m2
        prompt: Από ποια χώρα είσαι;
        answer: Είμαι από τη Ρωσία.
      - id: m3
        prompt: Τι γλώσσες μιλάς;
        answer: Μιλάω ρωσικά και αγγλικά.
      - id: m4
        prompt: Μαθαίνεις ελληνικά;
        answer: Ναι, μαθαίνω ελληνικά.
      - id: m5
        prompt: Πού δουλεύεις;
        answer: Δουλεύω στη Λευκωσία.
        explanation: Πού — «где?»; δουλεύεις — «ты работаешь».
      - id: m6
        prompt: Καταλαβαίνεις;
        answer: Όχι, δεν καταλαβαίνω.
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос.
    format: text
    items:
      - id: q1
        prompt: Где ты живёшь?
        answer:
          - Πού μένεις;
          - Εσύ πού μένεις;
      - id: q2
        prompt: Я живу в Лимасоле.
        answer:
          - Μένω στη Λεμεσό.
          - Εγώ μένω στη Λεμεσό.
        explanation: Λεμεσός после στη — Λεμεσό, без ς.
      - id: q3
        prompt: Я не говорю по-английски.
        answer:
          - Δεν μιλάω αγγλικά.
          - Δε μιλάω αγγλικά.
          - Δεν μιλώ αγγλικά.
          - Εγώ δεν μιλάω αγγλικά.
        explanation: Язык после μιλάω — без артикля.
      - id: q4
        prompt: Я учу греческий.
        answer:
          - Μαθαίνω ελληνικά.
          - Εγώ μαθαίνω ελληνικά.
      - id: q5
        prompt: Из какой ты страны?
        answer:
          - Από ποια χώρα είσαι;
        explanation: Η χώρα — женский род, поэтому ποια.
      - id: q6
        prompt: Она гречанка.
        answer:
          - Είναι Ελληνίδα.
          - Αυτή είναι Ελληνίδα.
      - id: q7
        prompt: На каких языках ты говоришь?
        answer:
          - Τι γλώσσες μιλάς;
          - Ποιες γλώσσες μιλάς;
