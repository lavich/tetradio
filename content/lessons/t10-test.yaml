      - id: q4
        prompt: "Последние заказы принимаются в одиннадцать."
        answer:
          - Last orders at eleven.
          - Last orders are at eleven.
          - Last orders at 11.
          - Last orders are at 11.
          - Last orders at eleven o'clock.
          - Last orders are at eleven o'clock.
          - Last orders are at eleven pm.
          - Last orders are at 11 pm.
          - Last orders at 11 pm.
        explanation: Last orders at eleven — устойчивая фраза бара.
