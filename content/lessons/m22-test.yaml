title: Контрольная модуля 22
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, два аудирования, грамматика и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Сообщение и шесть коротких рассказов звучат два раза. Во втором аудировании, как в первом задании экзамена, к каждому рассказу подберите картинку — здесь картинки описаны словами. Главное в грамматике — порядок событий (πρώτα, έπειτα, στο τέλος), аорист и узнавание παρατατικός; есть и повторение: να, θα, слабые местоимения.
  - type: reading
    id: name-day
    title: Η γιορτή της μαμάς
    text: |-
      Γεια σου, Ελπίδα!

      Χθες ήταν 21 Μαΐου και γιόρταζε η μητέρα μου, η Ελένη. Κάθε χρόνο κάνει μεγάλο τραπέζι στο σπίτι για τη γιορτή της. Πρώτα ήρθαν οι γείτονες με λουλούδια. Έπειτα ήρθαν οι συνάδελφοί της από τη δουλειά. Όλοι έλεγαν «Χρόνια πολλά! Να ζήσεις!» και το τηλέφωνο χτυπούσε όλη μέρα. Φάγαμε, ήπιαμε και στο τέλος ο αδελφός μου έπαιζε μουσική και όλοι τραγουδούσαν. Ήταν ένα ωραίο γλέντι!

      Εσύ πότε γιορτάζεις;

      Φιλιά,
      Χαρά
    glosses:
      - text: Μαΐου
        russian: мая
      - text: γείτονες
        russian: соседи
      - text: χτυπούσε
        russian: звонил (о телефоне)
      - text: κάνει μεγάλο τραπέζι
        russian: устраивает большое застолье
  - type: exercise
    id: name-day-tf
    about: name-day
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η μητέρα της Χαράς γιορτάζει στις 21 Μαΐου.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Имя Ελένη — именины 21 мая.
      - id: q2
        prompt: Η μητέρα κάνει τραπέζι για τη γιορτή της μόνο φέτος.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κάθε χρόνο — каждый год.
      - id: q3
        prompt: Πρώτα ήρθαν οι συνάδελφοι και μετά οι γείτονες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πρώτα οι γείτονες, έπειτα οι συνάδελφοι.
      - id: q4
        prompt: Πολλοί τηλεφωνούσαν στη μητέρα όλη μέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Το τηλέφωνο χτυπούσε όλη μέρα.
      - id: q5
        prompt: Η γιορτή ήταν σε μια ταβέρνα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Στο σπίτι.
  - type: listening
    id: new-year-message
    title: Ένα μήνυμα πριν από την Πρωτοχρονιά
    plays: 2
    transcript:
      - speaker: Δέσποινα
        text: Γεια σου, Μαρίνα, η Δέσποινα είμαι! Χρόνια πολλά! Πώς περάσατε τα Χριστούγεννα; Εμείς ήμασταν στο χωριό, στους γονείς μου. Την παραμονή τα παιδιά έλεγαν τα κάλαντα σε όλο το χωριό και γύρισαν με πολλά γλυκά!
      - speaker: Δέσποινα
        text: Για την Πρωτοχρονιά θα μείνουμε στη Λευκωσία. Την παραμονή κάνουμε ένα μικρό πάρτι στο σπίτι. Πρώτα θα φάμε, έπειτα θα κόψουμε τη βασιλόπιτα και στο τέλος θα πάμε όλοι μαζί στην πλατεία. Θέλεις να έρθεις κι εσύ με τον Γιάννη; Πάρε με τηλέφωνο! Καλή χρονιά!
  - type: exercise
    id: new-year-choice
    about: new-year-message
    graded: true
    title: Аудирование
    instruction: Прослушайте сообщение и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Где Деспина была на Рождество?
        options:
          - в деревне у родителей
          - в Лефкосии
          - у Марины
        answer: в деревне у родителей
      - id: q2
        prompt: Что делали дети в канун Рождества?
        options:
          - пели колядки
          - наряжали ёлку
          - резали пирог
        answer: пели колядки
        explanation: Τα παιδιά έλεγαν τα κάλαντα.
      - id: q3
        prompt: Что будет на празднике сразу после ужина?
        options:
          - разрежут василопиту
          - пойдут на площадь
          - споют колядки
        answer: разрежут василопиту
        explanation: Πρώτα θα φάμε, έπειτα θα κόψουμε τη βασιλόπιτα, στο τέλος — πλατεία.
      - id: q4
        prompt: Чего Деспина хочет от Марины?
        options:
          - чтобы она пришла с Яннисом и позвонила
          - чтобы она принесла сладости
          - чтобы она приехала в деревню
        answer: чтобы она пришла с Яннисом и позвонила
        explanation: Θέλεις να έρθεις κι εσύ με τον Γιάννη; Πάρε με τηλέφωνο!
  - type: listening
    id: six-holidays
    title: Έξι άνθρωποι και οι γιορτές τους
    plays: 2
    transcript:
      - speaker: Ξένια
        text: Είμαι η Ξένια. Την Καθαρά Δευτέρα πήγαμε στην εξοχή με τα παιδιά. Φυσούσε λίγο, και τα παιδιά πετούσαν τον χαρταετό τους όλο το πρωί.
      - speaker: Σάββας
        text: Με λένε Σάββα. Τον Αύγουστο ήμουν στο χωριό του παππού μου. Είχε γλέντι στην πλατεία, και όλοι χόρευαν μέχρι το πρωί.
      - speaker: Ηλέκτρα
        text: Είμαι η Ηλέκτρα. Τον Δεκέμβριο στολίσαμε το δέντρο στο σαλόνι, εγώ και η κόρη μου.
      - speaker: Παντελής
        text: Είμαι ο Παντελής. Στις 25 Μαρτίου ο γιος μου είχε παρέλαση με το σχολείο του. Εγώ ήμουν στον δρόμο και τον φωτογράφιζα.
      - speaker: Ρένα
        text: Με λένε Ρένα. Το Πάσχα, μετά την Ανάσταση, τσουγκρίσαμε κόκκινα αυγά έξω από την εκκλησία. Το δικό μου αυγό κέρδισε!
      - speaker: Μάρκος
        text: Είμαι ο Μάρκος. Την Πρωτοχρονιά όλη η οικογένεια ήταν στο σπίτι μας. Μετά το φαγητό κόψαμε τη βασιλόπιτα.
  - type: exercise
    id: six-holidays-match
    about: six-holidays
    graded: true
    title: Аудирование — картинки
    instruction: Прослушайте шесть человек. Какая картинка подходит к рассказу каждого? Две картинки лишние.
    format: match
    bank:
      - дети запускают воздушного змея за городом
      - люди танцуют на деревенской площади
      - мама с дочкой наряжают ёлку дома
      - школьники идут на параде, отец их фотографирует
      - люди бьются красными яйцами у церкви
      - семья за столом режет новогодний пирог
      - дети поют колядки у двери соседей
      - люди на берегу моря брызгают друг на друга водой
    items:
      - id: m1
        prompt: Ξένια
        answer: дети запускают воздушного змея за городом
        explanation: Πήγαμε στην εξοχή… τα παιδιά πετούσαν τον χαρταετό τους.
      - id: m2
        prompt: Σάββας
        answer: люди танцуют на деревенской площади
        explanation: Στο χωριό… γλέντι στην πλατεία, και όλοι χόρευαν.
      - id: m3
        prompt: Ηλέκτρα
        answer: мама с дочкой наряжают ёлку дома
        explanation: Στολίσαμε το δέντρο στο σαλόνι, εγώ και η κόρη μου. Про колядки она не говорит.
      - id: m4
        prompt: Παντελής
        answer: школьники идут на параде, отец их фотографирует
        explanation: Ο γιος μου είχε παρέλαση… τον φωτογράφιζα.
      - id: m5
        prompt: Ρένα
        answer: люди бьются красными яйцами у церкви
        explanation: Τσουγκρίσαμε κόκκινα αυγά έξω από την εκκλησία.
      - id: m6
        prompt: Μάρκος
        answer: семья за столом режет новогодний пирог
        explanation: Την Πρωτοχρονιά… κόψαμε τη βασιλόπιτα.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Όταν ήμασταν παιδιά, κάθε Πάσχα ___ στο χωριό.
        options:
          - πηγαίναμε
          - πάμε
          - θα πάμε
        answer: πηγαίναμε
        explanation: Όταν ήμασταν παιδιά, κάθε Πάσχα — привычка в прошлом, παρατατικός.
      - id: q2
        prompt: Πέρσι το Πάσχα πρώτα ___ αυγά και μετά φάγαμε σούβλα.
        options:
          - τσουγκρίσαμε
          - τσουγκρίζαμε
          - θα τσουγκρίσουμε
        answer: τσουγκρίσαμε
        explanation: Πέρσι, πρώτα… μετά φάγαμε — цепочка законченных событий, аорист. Τσουγκρίζαμε — παρατατικός (привычка, фон), θα τσουγκρίσουμε — будущее.
      - id: q3
        prompt: Στο γλέντι όλοι ___ μέχρι το πρωί.
        options:
          - χόρευαν
          - χόρευε
          - χορεύει
        answer: χόρευαν
        explanation: Όλοι — «они», окончание -αν.
      - id: q4
        prompt: Αύριο ___ τον Κατακλυσμό στη Λάρνακα.
        options:
          - θα γιορτάσουμε
          - γιορτάζαμε
          - γιορτάσαμε
        answer: θα γιορτάσουμε
        explanation: Αύριο — будущее с θα (модуль 19).
      - id: q7
        prompt: Θέλεις να ___ μαζί μας στην εκκλησία;
        options:
          - έρθεις
          - ήρθες
          - ερχόσουν
        answer: έρθεις
        explanation: После θέλω να — форма от основы аориста с окончаниями настоящего (модуль 16).
      - id: q8
        prompt: — Ποιος έβαψε τα αυγά; — ___ έβαψε η γιαγιά.
        options:
          - Τα
          - Τους
          - Τις
        answer: Τα
        explanation: Τα αυγά — средний род мн. ч., слабое местоимение τα (модуль 17).
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите глагол в παρατατικός — одно слово.
    format: text
    items:
      - id: q1
        prompt: Κάθε Χριστούγεννα τα παιδιά ___ τα κάλαντα. (λέω)
        answer:
          - έλεγαν
          - λέγανε
          - λέγαν
      - id: q2
        prompt: Όταν ήμουν μικρή, ___ στη Ρωσία. (μένω, εγώ)
        answer:
          - έμενα
      - id: q3
        prompt: Ο παππούς ___ πάντα παλιά τραγούδια. (τραγουδάω)
        answer:
          - τραγουδούσε
          - τραγούδαγε
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Страстная неделя, вы прощаетесь с соседкой до праздника.
        options:
          - Καλή Ανάσταση!
          - Χριστός ανέστη!
          - Καλή Σαρακοστή!
        answer: Καλή Ανάσταση!
        explanation: Χριστός ανέστη говорят только с пасхальной полуночи.
      - id: q2
        prompt: "Пасхальное воскресенье. Друг говорит: «Χριστός ανέστη!»"
        options:
          - Αληθώς ανέστη!
          - Καλή Ανάσταση!
          - Καλά Χριστούγεννα!
        answer: Αληθώς ανέστη!
      - id: q4
        prompt: Вы хотите спросить соседей, где они будут встречать Пасху.
        options:
          - Πού θα κάνετε Πάσχα;
          - Πώς γιορτάζετε τα Χριστούγεννα;
          - Πότε γιορτάζεις;
        answer: Πού θα κάνετε Πάσχα;
      - id: q5
        prompt: Подруга приглашает вас на свои именины. Вы с радостью соглашаетесь.
        options:
          - Ναι, ευχαρίστως!
          - Δυστυχώς δεν μπορώ, γιατί δουλεύω.
          - Ίσως άλλη φορά.
        answer: Ναι, ευχαρίστως!
        explanation: Повторение модуля 21 — принять приглашение.
