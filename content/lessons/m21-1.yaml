  - type: exercise
    id: verbs-gap
    title: Глаголы встречи
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - κάλεσε
      - συνάντησα
      - κανονίσαμε
      - συμφωνώ
      - δέχομαι
      - τηλεφώνησε
      - καλεσμένοι
      - προσκαλούμε
      - συναντάμε
    items:
      - id: g1
        prompt: Η Ελένη με ___ στο πάρτι της την Παρασκευή.
        answer: κάλεσε
        explanation: Καλώ + вин. п. (με — «меня»); аорист — κάλεσα, κάλεσε.
      - id: g2
        prompt: Χθες ___ τυχαία τον Νίκο στο σούπερ μάρκετ. (я; τυχαία — случайно)
        answer: συνάντησα
        explanation: Χθες — прошлое; συναντώ + вин. п. — встретить кого-то случайно.
      - id: g3
        prompt: Έχεις δίκιο, ___ μαζί σου. (έχεις δίκιο — ты прав)
        answer: συμφωνώ
        explanation: Συμφωνώ μαζί σου — «согласен с тобой».
      - id: g4
        prompt: Ευχαριστώ πολύ, ___ την πρόσκληση με χαρά! (με χαρά — с радостью)
        answer: δέχομαι
        explanation: Δέχομαι την πρόσκληση — «принимаю приглашение».
      - id: g5
        prompt: Χθες ___ με τη Μαρία να βρεθούμε στις οκτώ.
        answer: κανονίσαμε
        explanation: Договорились вчера мы с Марией — аорист, лицо «мы».
      - id: g6
        prompt: Η Άννα μου ___ χθες το βράδυ και μου είπε τα νέα της. (τα νέα — новости)
        answer: τηλεφώνησε
        explanation: Μου τηλεφώνησε — «позвонила мне»; с κάλεσε было бы με, а не μου.
      - id: g7
        prompt: Στο πάρτι ήρθαν τριάντα ___!
        answer: καλεσμένοι
  - type: explanation
    id: purpose
    title: Για να — «чтобы»
    body: |-
      Цель — «чтобы» — по-гречески **για να** + та же форма глагола, что после θέλω να: Πάω στον φούρνο **για να αγοράσω** ψωμί. **Σου τηλεφωνώ για να σε καλέσω** στα γενέθλιά μου. Одну такую фразу вы знаете с модуля 14: Σας γράφω για να κάνω μια κράτηση.

      **Какая форма.** Одно действие, результат — обычно форма от основы аориста: για να αγοράσω, για να σε καλέσω. Повторяющееся действие или процесс — форма настоящего: Μαθαίνω ελληνικά **για να μιλάω** με τους συναδέλφους μου — говорить с ними каждый день.

      **Лицо может быть другим.** Кто делает второе действие, показывает окончание: Σου στέλνω τον χάρτη **για να βρεις** το σπίτι — «чтобы ты нашёл». Слабые местоимения стоят между να и глаголом: για να **σε** καλέσω, για να **σου** πω.

      **Отрицание — μην**, как после θέλω να: Φεύγω νωρίς **για να μην** αργήσω. — «Ухожу рано, чтобы не опоздать».

      **После глаголов движения** (πάω, έρχομαι, βγαίνω, περνάω) цель часто выражают одним **να**, без για: **Πάμε να φάμε;** — «Пойдём поедим?». **Έλα να δεις!** — «Иди посмотри!». Фраза **Τι ώρα να περάσω να σε πάρω;** — «Во сколько за тобой заехать?» — устроена так: Τι ώρα να περάσω; — «Во сколько мне зайти?» (να в вопросе — «мне…?», «нам…?», как Τι να κάνω; — «Что мне делать?»), а να σε πάρω — цель, «чтобы тебя забрать». Περνάω здесь — «заходить, заезжать».
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Πάω στον φούρνο για να αγοράσω ψωμί.
          - Иду в пекарню, чтобы купить хлеб.
        - - Σου τηλεφωνώ για να σε καλέσω στο πάρτι.
          - Звоню тебе, чтобы пригласить тебя на вечеринку.
        - - Φεύγω νωρίς για να μην αργήσω.
          - Ухожу рано, чтобы не опоздать.
        - - Πάμε να φάμε;
          - Пойдём поедим?
        - - Τι ώρα να περάσω να σε πάρω;
          - Во сколько за тобой заехать?
  - type: exercise
    id: purpose-choice
    title: Για να и Θέλεις να
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Πάω στο περίπτερο για να ___ νερό.
        options:
          - αγοράσω
          - αγόρασα
          - αγοράζει
        answer: αγοράσω
        explanation: Одно действие — форма от основы аориста; лицо «я», как у πάω. Прошедшее αγόρασα после να здесь не ставят.
      - id: q2
        prompt: Σου τηλεφωνώ ___ σε καλέσω στο πάρτι μου.
        options:
          - για να
          - γιατί
          - ότι
        answer: για να
        explanation: Цель — για να. После γιατί и ότι нужна обычная форма (γιατί σε καλώ), а не καλέσω.
      - id: q3
        prompt: Μαθαίνω ελληνικά για να ___ με τους συναδέλφους μου κάθε μέρα.
        options:
          - μιλάω
          - μίλησα
          - μιλάει
        answer: μιλάω
        explanation: Κάθε μέρα — повтор, поэтому форма настоящего; лицо «я».
      - id: q4
        prompt: Έλα ___ δεις το καινούργιο μου σπίτι!
        options:
          - να
          - για
          - γιατί
        answer: να
        explanation: После глагола движения (έλα) цель — одним να.
      - id: q5
        prompt: Φεύγω τώρα για να ___ αργήσω στη συνάντηση.
        options:
          - μην
          - δεν
          - όχι
        answer: μην
        explanation: После να отрицание — μην (перед гласной — с ν).
      - id: q6
        prompt: Θέλεις να ___ μαζί στη συναυλία; (пойдём мы с тобой)
        options:
          - πάμε
          - πάει
          - πήγαμε
        answer: πάμε
        explanation: Идём мы вместе — лицо «мы»; να πάμε, как в Θέλεις να πάμε για καφέ;
      - id: q7
        prompt: Τι ώρα να ___ να σε πάρω;
        options:
          - περάσω
          - πέρασα
          - περνάει
        answer: περάσω
        explanation: Зайти должен «я» — να περάσω, форма от аориста πέρασα без прошедшего окончания.
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Друг предлагает «Πάμε για καφέ;», и вы согласны.
        options:
          - Καλή ιδέα!
          - Περαστικά!
          - Καλή όρεξη!
        answer: Καλή ιδέα!
      - id: q2
        prompt: Вы хотите узнать, свободна ли подруга сегодня вечером.
        options:
          - Είσαι ελεύθερη απόψε;
          - Είσαι παντρεμένη;
          - Είσαι κουρασμένη;
        answer: Είσαι ελεύθερη απόψε;
      - id: q3
        prompt: Коллега неожиданно предлагает пойти после работы на концерт. Вы не против — «почему бы и нет?».
        options:
          - Γιατί όχι;
          - Γιατί;
          - Πότε;
        answer: Γιατί όχι;
        explanation: Одно Γιατί; — «почему?», вопрос, а не согласие.
      - id: q4
        prompt: Вы договорились встретиться, но не знаете где.
        options:
          - Πού θα βρεθούμε;
          - Πού μένεις;
          - Από πού είσαι;
        answer: Πού θα βρεθούμε;
      - id: q5
        prompt: Вы хотите узнать планы друга на субботу.
        options:
          - Τι κάνεις το Σάββατο;
          - Τι κάνεις;
          - Τι δουλειά κάνεις;
        answer: Τι κάνεις το Σάββατο;
        explanation: Τι κάνεις; без слов о субботе — «Как дела?».
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Хочешь, сходим на кофе?
