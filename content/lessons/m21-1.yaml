blocks:
  - type: explanation
    id: invite
    title: Как пригласить и как согласиться
    body: |-
      Тема модуля — встречи с друзьями: пригласить, согласиться, отказаться и объяснить почему. На экзамене это ролевая игра (часть C устной речи), письмо-приглашение и телефонный разговор в аудировании.

      **Сначала узнайте, свободен ли человек.** **Τι κάνεις το Σάββατο;** — «Что делаешь в субботу?». Как и по-русски, о ближайших планах можно спросить настоящим временем; можно и будущим — Τι θα κάνεις το σαββατοκύριακο; (модуль 19). **Είσαι ελεύθερος απόψε;** — «Ты свободен сегодня вечером?», женщине — Είσαι ελεύθερη απόψε; (απόψε — «сегодня вечером», как в Πάμε σινεμά απόψε;).

      **Пригласите.** Самый частый вопрос — **Θέλεις να…;** — «Хочешь…?». После να — форма от основы аориста, как после θέλω να (модуль 16). Смотрите на лицо второго глагола: **Θέλεις να έρθεις;** — «Хочешь прийти?» (придёшь ты), а **Θέλεις να πάμε για καφέ;** — «Хочешь, сходим на кофе?» (пойдём мы вместе). В разговоре часто звучит короткое **θες**: Θες να πάμε;

      Ещё короче — **Πάμε…;**: **Πάμε μαζί;** — «Пойдём вместе?», Πάμε σινεμά απόψε; (модуль 20). Нескольким людям или на «вы» — **Θέλετε να…;**

      **Согласитесь.** **Ναι, ευχαρίστως!** — «Да, с удовольствием!» (ευχαρίστως — родственник ευχαριστώ, ударение на -ρί-). **Καλή ιδέα!** — «Хорошая идея!». **Γιατί όχι;** — «Почему бы и нет?» (γιατί здесь — «почему»). **Συμφωνώ!** — «Согласен!».

      **Договоритесь о месте и времени.** **Πού θα βρεθούμε;** — «Где встретимся?». Θα βρεθούμε — будущее от βρισκόμαστε, который вы знаете по фразе Πότε βρισκόμαστε; (модуль 04). И конечно — Τι ώρα;
    table:
      columns:
        - что сделать
        - по-гречески
        - по-русски
      rows:
        - - узнать о планах
          - Τι κάνεις το Σάββατο;
          - Что делаешь в субботу?
        - - узнать, свободен ли
          - Είσαι ελεύθερος / ελεύθερη απόψε;
          - Ты свободен / свободна сегодня вечером?
        - - пригласить
          - Θέλεις να πάμε για καφέ;
          - Хочешь, сходим на кофе?
        - - пригласить
          - Πάμε μαζί;
          - Пойдём вместе?
        - - согласиться
          - Ναι, ευχαρίστως! / Καλή ιδέα! / Γιατί όχι;
          - Да, с удовольствием! / Хорошая идея! / Почему бы и нет?
        - - договориться
          - Πού θα βρεθούμε; Τι ώρα;
          - Где встретимся? Во сколько?
  - type: explanation
    id: invite-words
    title: Приглашение, праздник, гости
    body: |-
      **Η πρόσκληση** — приглашение: и сама просьба прийти, и открытка или письмо (мн. ч. οι προσκλήσεις, как η λέξη — οι λέξεις). Пригласить — **καλώ** + винительный падеж: **Σε καλώ στο πάρτι μου.** — «Приглашаю тебя на мою вечеринку». Η Μαρία **με κάλεσε** στα γενέθλιά της. **Προσκαλώ** значит то же, но звучит официальнее — так пишут в печатных приглашениях: **Σας προσκαλούμε** στην εκδήλωση…

      Καλώ — ещё и «звать, вызывать» и «звонить», но о звонке другу в разговоре чаще говорят παίρνω τηλέφωνο (модуль 04) или τηλεφωνάω (ниже).

      **Ο καλεσμένος**, **η καλεσμένη** — гость, приглашённый (от καλώ): Στο πάρτι ήρθαν είκοσι καλεσμένοι.

      **Τα γενέθλια** — день рождения; слово есть только во мн. ч.: **Τα γενέθλιά μου είναι την Παρασκευή** (второй тонос — как το όνομά μου). **Το πάρτι** — вечеринка, не изменяется: δύο πάρτι. **Το δώρο** — подарок: ένα δώρο για τα γενέθλια. **Η έκπληξη** — сюрприз: Μην του πεις τίποτα, είναι έκπληξη! — «Не говори ему ничего, это сюрприз!» (мн. ч. οι εκπλήξεις).

      **Η παρέα** — компания друзей: Το Σάββατο βγαίνω με την παρέα μου. **Κάνω παρέα με** + вин. п. — «провожу время, дружу с»: Κάνω παρέα με τη Μαρία.

      **Η εκδήλωση** — мероприятие: концерт, праздник, вечер в культурном центре. **Η συνάντηση** — встреча, и дружеская, и деловая (совещание по работе — η σύσκεψη, модуль 15). **Η ιδέα** — идея, **η πρόταση** — предложение (Έχω μια πρόταση: …); в грамматике η πρόταση — ещё и «предложение» из слов.
