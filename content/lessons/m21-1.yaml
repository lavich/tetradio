  - type: explanation
    id: verbs
    title: Καλώ, συναντώ, κανονίζω, συμφωνώ, δέχομαι, τηλεφωνάω
    body: |-
      **Καλώ** и **προσκαλώ** спрягаются как μπορώ: καλώ, καλείς, καλεί… Аорист — **κάλεσα**, после να и θα — **καλέσω**: Θέλω να σε καλέσω στο πάρτι μου.

      **Συναντώ** + вин. п. — «встречаю (кого-то)», часто случайно: **Συνάντησα τη Φανή στο σούπερ μάρκετ.** Спрягается как μιλάω: συναντάς, συναντάει, συναντάμε. А «встречаемся» по договорённости — βρισκόμαστε: Βρισκόμαστε στις οκτώ.

      **Κανονίζω** — «договариваюсь, назначаю»: **Κανονίσαμε να βρεθούμε στις οκτώ.** — «Мы договорились встретиться в восемь». Να το κανονίσουμε για την Παρασκευή; — «Назначим на пятницу?».

      **Συμφωνώ** — «соглашаюсь, согласен», спрягается тоже как μπορώ: συμφωνείς, συμφωνεί. С кем — **με** + вин. п.; «с тобой» — **μαζί σου**: Συμφωνώ μαζί σου. Συμφωνώ με τη Μαρία.

      **Δέχομαι** — «принимаю»: **Δέχομαι την πρόσκληση.** Спрягается как έρχομαι (таблица ниже). Аорист — δέχτηκα, будущее — θα δεχτώ.

      **Τηλεφωνάω** (или τηλεφωνώ) — «звоню по телефону». Кому — **σε** + вин. п.: **Τηλεφώνησα στην Άννα.** С местоимением — μου, σου, του…, как с στέλνω (модуль 19): **Θα σου τηλεφωνήσω αύριο.** — «Я тебе позвоню завтра». Спрягается как μιλάω: τηλεφωνάς, τηλεφωνάει; аорист — τηλεφώνησα.
    table:
