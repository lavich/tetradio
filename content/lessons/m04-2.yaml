  - type: exercise
    id: dates-write
    title: Пишем дату
    instruction: Напишите дату по-гречески словами — число и месяц.
    format: text
    items:
      - id: q1
        prompt: 20/10
        answer:
          - είκοσι Οκτωβρίου
        explanation: Месяц в дате — в родительном падеже, на -ου.
      - id: q2
        prompt: 5/5
        answer:
          - πέντε Μαΐου
      - id: q3
        prompt: 1/3
        answer:
          - πρώτη Μαρτίου
        explanation: Первое число — πρώτη, остальные — обычные числа.
      - id: q4
        prompt: 15/8
        answer:
          - δεκαπέντε Αυγούστου
        explanation: Αύγουστος → Αυγούστου, ударение переходит на -γού-.
      - id: q5
        prompt: 25/12
        answer:
          - είκοσι πέντε Δεκεμβρίου
  - type: exercise
    id: dates-choice
    title: Какое число
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: «Сегодня 3 июня.»
        options:
          - Σήμερα είναι τρεις Ιουνίου.
          - Σήμερα είναι τρία Ιούνιος.
          - Σήμερα είναι τρίτη Ιουνίου.
        answer: Σήμερα είναι τρεις Ιουνίου.
        explanation: Число — количественное, в женском роде (τρεις); месяц — в родительном падеже.
      - id: q2
        prompt: «Сегодня 1 января.»
        options:
          - Σήμερα είναι μία Ιανουαρίου.
          - Σήμερα είναι πρώτη Ιανουαρίου.
          - Σήμερα είναι ένα Ιανουάριος.
        answer: Σήμερα είναι πρώτη Ιανουαρίου.
      - id: q3
        prompt: «Праздник десятого сентября.» (η γιορτή — праздник)
        options:
          - Η γιορτή είναι στις δέκα Σεπτεμβρίου.
          - Η γιορτή είναι τη δέκα Σεπτέμβριος.
          - Η γιορτή είναι στις Σεπτέμβριος δέκα.
        answer: Η γιορτή είναι στις δέκα Σεπτεμβρίου.
        explanation: «Какого числа» — στις + число + месяц в родительном падеже.
      - id: q4
        prompt: "«Τι ημερομηνία είναι σήμερα;» — вопрос о…"
        options:
          - числе
          - дне недели
          - времени
        answer: числе
        explanation: Η ημερομηνία — «дата». О дне недели спрашивают Τι μέρα…, о времени — Τι ώρα…
  - type: exercise
    id: words-gap
    title: Слова урока
    instruction: Вставьте слово. Одно лишнее.
    format: gap
    bank:
      - εβδομάδα
      - μήνας
      - μέρες
      - πρωί
      - απόγευμα
      - βράδυ
      - ακόμα
      - παίρνω
      - δίνεις
    items:
      - id: g1
        prompt: Η ___ έχει επτά μέρες.
        answer: εβδομάδα
      - id: g2
        prompt: Ένας ___ έχει τέσσερις εβδομάδες.
        answer: μήνας
        explanation: Ένας — мужской род; из слов банка мужского рода только ο μήνας.
      - id: g3
        prompt: Ο Φεβρουάριος έχει είκοσι οκτώ ___.
        answer: μέρες
      - id: g4
        prompt: Καλησπέρα! Είναι εννιά το ___.
        answer: βράδυ
        explanation: Καλησπέρα и девять часов — это вечер.
      - id: g5
        prompt: Καλημέρα! Είναι επτά το ___.
        answer: πρωί
      - id: g6
        prompt: — Είναι έξι; — Όχι ___, είναι πέντε και μισή.
        answer: ακόμα
        explanation: Όχι ακόμα — «ещё нет».
      - id: g7
        prompt: Εγώ ___ τηλέφωνο τη Μαρία.
        answer: παίρνω
        explanation: Παίρνω τηλέφωνο — «звоню».
      - id: g8
        prompt: Μου ___ το τηλέφωνό σου;
        answer: δίνεις
  - type: explanation
    id: prices-phone
    title: Цены и номера телефонов
    body: |-
      **Πόσο κάνει;** — «Сколько стоит?». Ответ: **Κάνει είκοσι ευρώ.** — «Стоит двадцать евро». Ευρώ — средний род, поэтому τρία ευρώ, διακόσια ευρώ. Центы — λεπτά: 2,50 € — δύο ευρώ και πενήντα λεπτά или просто δύο και πενήντα.

      **Ποιο είναι το τηλέφωνό σου;** — «Какой у тебя номер?», на «вы» — **Ποιο είναι το τηλέφωνό σας;**

      На Кипре номер телефона — 8 цифр. Мобильные начинаются с 9 (99, 96, 97), городские — с 2 (22 — Никосия, 24 — Ларнака, 25 — Лимасол, 26 — Пафос). В модуле 01 мы диктовали номер по одной цифре, но обычно его **читают парами**: 99 47 20 65 — ενενήντα εννιά, σαράντα επτά, είκοσι, εξήντα πέντε. Ноль в начале пары читают отдельно: 05 — μηδέν πέντε. Иногда говорят тройками: 22 345 678 — είκοσι δύο, τριακόσια σαράντα πέντε, εξακόσια εβδομήντα οκτώ.

      Когда записываете номер на слух, пишите цифры сразу, пара за парой, — не пытайтесь запомнить весь номер.
    table:
      columns:
        - номер
        - как читают
      rows:
        - - 99 47 20 65
          - ενενήντα εννιά, σαράντα επτά, είκοσι, εξήντα πέντε
        - - 96 05 13 88
          - ενενήντα έξι, μηδέν πέντε, δεκατρία, ογδόντα οκτώ
        - - 22 345 678
          - είκοσι δύο, τριακόσια σαράντα πέντε, εξακόσια εβδομήντα οκτώ
