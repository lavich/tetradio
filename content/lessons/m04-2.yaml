  - type: explanation
    id: listen-how
    title: Аудирование — заметки
    body: |-
      В четвёртой части экзамена по аудированию вы слушаете разговор и записываете короткие ответы — **заметки**: день, время, цену, номер телефона. Запись звучит два раза.

      Перед первым прослушиванием прочитайте пункты: вы будете знать, что ловить. Записывайте кратко:
      - время — цифрами (17:30) или словами (πέντε και μισή);
      - цены и номера — цифрами, номер можно писать слитно или парами;
      - дни — по-гречески (Τρίτη) или по-русски.

      В диалоге встретятся слова из объявления: **το μάθημα** — урок, занятие, **αρχίζουν** — начинаются. Ещё одно выражение: **σας παίρνει τηλέφωνο** — «позвонит вам». Во второй раз проверьте то, в чём не уверены.
  - type: listening
    id: call
    title: Στο τηλέφωνο
    plays: 2
    transcript:
      - speaker: Σοφία
        text: Σχολή «Άλφα», καλημέρα σας!
