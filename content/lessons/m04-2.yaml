blocks:
  - type: explanation
    id: dates
    title: Месяцы и даты
    body: |-
      Названия месяцев похожи на русские: Ιανουάριος — январь, Μάρτιος — март. Все они мужского рода.

      **В дате месяц стоит в родительном падеже** — окончание -ου, как в русском «двадцатое октября»: **Σήμερα είναι είκοσι Οκτωβρίου.** Ударение в родительном падеже часто переходит ближе к концу: Ιανουάριος → Ιανουαρίου, Αύγουστος → Αυγούστου. В Μαΐου две точки над ι показывают, что α и ι читаются раздельно: [маи́у].

      **Число — обычное количественное**: не «двадцатое», а «двадцать». Только первое число — **πρώτη**: πρώτη Μαΐου — 1 мая. Числа 3, 4, 13, 14, 21… в дате стоят в женском роде: τρεις Ιουνίου, είκοσι μία Μαρτίου.

      **Τι ημερομηνία είναι σήμερα;** — «Какое сегодня число?». **«Пятого мая»** — **στις** πέντε Μαΐου, как со временем. День и дата вместе: την Παρασκευή, πέντε Μαΐου. На письме дату пишут 5/5 или 5.5.2027 — сначала число, потом месяц.

      «В мае» — **τον Μάιο** (это пока просто запомните). В разговоре вы услышите и народные названия: ο Γενάρης, ο Φλεβάρης, ο Μάρτης, ο Μάης… — их достаточно узнавать.
    table:
      columns:
