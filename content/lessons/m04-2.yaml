  - type: explanation
    id: day-parts
    title: Утро, день, вечер и другие слова
    body: |-
      Части дня говорят с артиклем, без предлога: **το πρωί** — «утром», **το απόγευμα** — «днём, после обеда» (примерно с 15 до 19 часов), **το βράδυ** — «вечером». Στις οκτώ το πρωί — в восемь утра, στις εννιά το βράδυ — в девять вечера. Σήμερα το βράδυ — сегодня вечером, αύριο το πρωί — завтра утром.

      В расписаниях время пишут по 24 часа: 18:30. Вслух обычно говорят έξι και μισή (το απόγευμα); в объявлениях можно услышать и δεκαοκτώ και τριάντα.

      **Η μέρα** — день, **η εβδομάδα** — неделя, **ο μήνας** — месяц: Η εβδομάδα έχει επτά μέρες. **Ακόμα** — «ещё»: Είναι ακόμα επτά. — Ещё только семь. **Όχι ακόμα** — «ещё нет».

      **Παίρνω** — «брать» и **δίνω** — «давать» спрягаются как γράφω. **Παίρνω τηλέφωνο** — «звоню»: Παίρνω τηλέφωνο τη Μαρία. **Μου δίνεις το τηλέφωνό σου;** — «Дашь мне свой номер?».
    table:
      columns:
        - лицо
        - παίρνω — брать
        - δίνω — давать
      rows:
        - - εγώ
          - παίρνω
          - δίνω
        - - εσύ
          - παίρνεις
          - δίνεις
        - - αυτός, αυτή
          - παίρνει
          - δίνει
        - - εμείς
          - παίρνουμε
          - δίνουμε
        - - εσείς
          - παίρνετε
          - δίνετε
        - - αυτοί, αυτές
          - παίρνουν
          - δίνουν
