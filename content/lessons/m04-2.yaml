  - type: exercise
    id: school-choice
    about: school
    title: Выбор из четырёх
    instruction: Прочитайте объявление. Выберите правильный ответ — как на экзамене, из четырёх вариантов.
    format: choice
    items:
      - id: q1
        prompt: Τα νέα μαθήματα αρχίζουν…
        options:
          - τη Δευτέρα, 2 Νοεμβρίου.
          - την Παρασκευή, 18 Δεκεμβρίου.
          - την Τρίτη, 2 Νοεμβρίου.
          - τη Δευτέρα, 18 Δεκεμβρίου.
        answer: τη Δευτέρα, 2 Νοεμβρίου.
        explanation: 18 Δεκεμβρίου — день, когда занятия τελειώνουν, «заканчиваются».
      - id: q2
        prompt: Το τμήμα Α1 έχει μάθημα…
        options:
          - το πρωί.
          - το απόγευμα.
          - το βράδυ.
          - το Σάββατο.
        answer: το πρωί.
      - id: q3
        prompt: Ольга работает по будням с 8:00 до 17:00. Какая группа ей подходит?
        options:
          - Τμήμα Α1, Δευτέρα και Τετάρτη.
          - Τμήμα Α2, Τρίτη και Πέμπτη.
          - Δευτέρα και Τετάρτη, το απόγευμα.
          - Την Κυριακή.
        answer: Τμήμα Α2, Τρίτη και Πέμπτη.
        explanation: Группа А2 занимается с 18:30, после работы. Группа А1 — в 9:00, в рабочее время; по воскресеньям школа закрыта.
      - id: q4
        prompt: Сколько стоят занятия в группе за месяц?
        options:
          - 10 ευρώ
          - 25 ευρώ
          - 150 ευρώ
          - 175 ευρώ
        answer: 150 ευρώ
        explanation: 150 ευρώ τον μήνα. 25 — учебник, 10 — одно разговорное занятие.
      - id: q5
        prompt: Когда можно прийти в секретариат школы?
        options:
          - την Πέμπτη στις 17:00
          - την Τετάρτη στις 17:00
          - το Σάββατο στις 10:00
          - την Κυριακή στις 11:00
        answer: την Πέμπτη στις 17:00
        explanation: После обеда секретариат открыт только во вторник и четверг, 16:00–18:30. В среду — только до 13:00.
      - id: q6
        prompt: Ποιο είναι το τηλέφωνο της σχολής;
        options:
          - 24 65 31 80
          - 24 56 31 80
          - 24 65 13 80
          - 25 65 31 80
        answer: 24 65 31 80
        explanation: 24 — код Ларнаки; школа в Ларнаке.
