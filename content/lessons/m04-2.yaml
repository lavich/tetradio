  - type: reading
    id: school
    title: Σχολή γλωσσών «Άλφα»
    text: |-
      Σχολή γλωσσών «Άλφα», Λάρνακα
      Μαθήματα ελληνικών για ξένους

      Τα νέα μαθήματα αρχίζουν τη Δευτέρα, 2 Νοεμβρίου, και τελειώνουν την Παρασκευή, 18 Δεκεμβρίου.

      Τμήμα Α1: Δευτέρα και Τετάρτη, 9:00–10:30 το πρωί.
      Τμήμα Α2: Τρίτη και Πέμπτη, 18:30–20:00.
      Μάθημα συζήτησης για όλους: Σάββατο, 11:00–12:30.

      Τιμή: 150 ευρώ τον μήνα. Το μάθημα συζήτησης κάνει 10 ευρώ. Το βιβλίο κάνει 25 ευρώ.

      Η γραμματεία είναι ανοιχτή από Δευτέρα έως Παρασκευή, 9:00–13:00, και την Τρίτη και την Πέμπτη το απόγευμα, 16:00–18:30. Την Κυριακή η σχολή είναι κλειστή.

      Τηλέφωνο: 24 65 31 80
    glosses:
      - text: Σχολή γλωσσών
        russian: языковая школа
      - text: Μαθήματα ελληνικών
        russian: уроки греческого
      - text: μαθήματα
        russian: занятия
      - text: για ξένους
        russian: для иностранцев
