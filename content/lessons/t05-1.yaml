          - I want to return it.
      - id: q5
        prompt: Мне обязательно показывать чек?
        answer:
          - Do I have to show the receipt?
          - Do I have to show my receipt?
          - Do I have to show a receipt?
          - Do I need to show the receipt?
          - Do I need to show my receipt?
          - Do I need to show a receipt?
          - Do I have to show you the receipt?
          - Do I need to show you the receipt?
          - Do I have to show the receipt to you?
          - Do I have to show you my receipt?
          - Do I need to show you my receipt?
        explanation: "Вопрос с have to — через do: Do I have to…?"
