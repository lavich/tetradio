blocks:
  - type: explanation
    id: how-often
    title: Как часто и когда отдыхаю
    body: |-
      Чтобы рассказать о хобби, нужно сказать, **как часто** вы им занимаетесь. Вы знаете шкалу из модуля 05: πάντα — συνήθως — συχνά — μερικές φορές — ποτέ. Теперь добавьте **σπάνια** — «редко»: Πηγαίνω σπάνια στο θέατρο.

      Точнее — с числом: **Παίζω τένις δύο φορές την εβδομάδα.** Μία φορά τον μήνα. **Πάω στο γυμναστήριο κάθε πρωί.**

      **Ξεκουράζομαι** — отдыхать (от работы, от усталости). Спрягается как σηκώνομαι: ξεκουράζομαι, ξεκουράζεσαι, ξεκουράζεται, ξεκουραζόμαστε, ξεκουράζεστε, ξεκουράζονται. Будущее — **θα ξεκουραστώ**, как во фразе Πρέπει να ξεκουραστείς (модуль 17). А отдых в отпуске — διακοπές (модуль 14).

      Если свободного времени мало: **Δεν έχω πολύ ελεύθερο χρόνο.** — «У меня мало свободного времени».
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - σπάνια
          - редко
        - - δύο φορές την εβδομάδα
          - два раза в неделю
        - - κάθε πρωί
          - каждое утро
        - - Την Κυριακή ξεκουράζομαι.
          - В воскресенье я отдыхаю.
        - - Δεν έχω πολύ ελεύθερο χρόνο.
          - У меня мало свободного времени.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: how-often-choice
    title: Как часто
    instruction: Выберите подходящий вариант.
    format: choice
    items:
      - id: q1
        prompt: Πηγαίνω στο γυμναστήριο μόνο μία φορά τον μήνα. Δηλαδή πηγαίνω ___. (δηλαδή — то есть)
        options:
          - σπάνια
          - συχνά
          - πάντα
        answer: σπάνια
        explanation: Раз в месяц — редко.
      - id: q2
        prompt: Είμαι πολύ κουρασμένη. Το Σάββατο θα μείνω σπίτι και θα ___.
        options:
          - ξεκουραστώ
          - ξεκουράστηκα
          - ξεκουράζεσαι
        answer: ξεκουραστώ
        explanation: После θα — будущее от основы аориста (модуль 19), лицо «я».
      - id: q3
        prompt: Κάθε Κυριακή ___ στο σπίτι και δεν κάνω τίποτα.
        options:
          - ξεκουράζομαι
          - ξεκουράζεται
          - ξεκουραστώ
        answer: ξεκουράζομαι
        explanation: Κάθε Κυριακή — привычка, настоящее время; лицо «я» (κάνω).
  - type: explanation
    id: friendly-how
    title: Письмо другу — сравнить два хобби
    body: |-
      Задание A экзамена — дружеский текст 80–100 слов. Здесь друг просит совета: какое из двух занятий выбрать. Ваш ответ — сравнение.

      План из пяти шагов:

      1. Приветствие: Γεια σου, …! Τι κάνεις;
      2. Что вы делаете сами и как часто: Κάνω κολύμπι δύο φορές την εβδομάδα… Можно заниматься и тем, и другим — **και τα δύο**.
      3. Плюсы первого занятия: Το κολύμπι είναι πιο υγιεινό από…, είναι το καλύτερο άθλημα για…
      4. Плюсы второго — с αλλά: Αλλά ο χορός είναι πιο ενδιαφέρων… / δεν είναι τόσο ακριβός όσο…
      5. Совет, приглашение и прощание: Σου προτείνω…, γιατί… Θέλεις να έρθεις μαζί μου…; Τα λέμε!

      Покажите грамматику модуля: три-четыре сравнения (πιο … από, καλύτερος, ο πιο …, τόσο … όσο), слова частоты (σπάνια, κάθε…, δύο φορές την εβδομάδα) и хотя бы одно будущее с θα (модуль 19).

      Проверьте себя. После από — винительный падеж (από τον χορό, από το κολύμπι). Прилагательное согласуется со словом, о котором говорите: ο χορός — πιο ενδιαφέρων, το κολύμπι — πιο ενδιαφέρον. Никакого «πιο καλύτερος».
  - type: writing
    id: two-hobbies
    register: friendly
    prompt: "Ваша подруга Электра пишет: «Θέλω να αρχίσω ένα καινούργιο χόμπι. Τι μου προτείνεις — χορό ή κολύμπι; Εσύ τι κάνεις στον ελεύθερο χρόνο σου;» Ответьте ей письмом 80–100 слов: что вы делаете в свободное время и как часто, сравните два занятия (не меньше трёх сравнений), дайте совет и пригласите её куда-нибудь."
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Ηλέκτρα!

      Τι κάνεις; Εγώ κάνω και τα δύο! Κάνω κολύμπι δύο φορές την εβδομάδα και χορεύω κάθε Παρασκευή σε ένα πολιτιστικό κέντρο. Το κολύμπι είναι πιο υγιεινό από τον χορό και είναι το καλύτερο άθλημα για την πλάτη. Αλλά είναι λίγο βαρετό, γιατί δεν μιλάς με κανέναν. Ο χορός είναι πιο ενδιαφέρων και έχει μουσική! Και είναι πιο φτηνός: πληρώνω τριάντα ευρώ τον μήνα, και το κολύμπι κοστίζει πενήντα. Σου προτείνω τον χορό, γιατί σου αρέσει η μουσική. Θέλεις να έρθεις μαζί μου την Παρασκευή; Θα σου αρέσει!

      Τα λέμε!
      Ζωή
    criteria:
      - 80–100 слов; дружеское приветствие и прощание, всё письмо на «ты»
      - Сказано, что вы делаете в свободное время и как часто (κάθε…, δύο φορές την εβδομάδα, σπάνια)
      - "Не меньше трёх сравнений: πιο … από, καλύτερος, ο πιο …, τόσο … όσο"
      - Есть совет с объяснением (Σου προτείνω…, γιατί…)
      - Есть приглашение или вопрос подруге (Θέλεις να…;)
      - "После από — винительный падеж (από τον χορό); прилагательное согласовано (ο χορός — πιο ενδιαφέρων, το κολύμπι — πιο υγιεινό); нет «πιο καλύτερος»"
  - type: explanation
    id: formal-how
    title: Письмо в спортивный клуб
    body: |-
      Задание B — официальный текст 80–100 слов. Это как письмо в языковую школу (модуль 16), только теперь вы пишете в клуб: **ο σύλλογος** — клуб, общество (вин. п. τον σύλλογο); **αθλητικός σύλλογος** — спортивный клуб.

      План из пяти шагов:

      1. Обращение: **Αγαπητέ κύριε Κωνσταντίνου,** / Αγαπητή κυρία…,
      2. Зачем пишете: **Σας γράφω για** τα μαθήματα τένις. Είδα την αγγελία σας στο ίντερνετ (модуль 15).
      3. Кто вы и какой у вас уровень: Είμαι … χρονών, μένω…, παίζω τένις σπάνια…
      4. Два-три вопроса: **Θα ήθελα να μάθω αν** έχετε μαθήματα το βράδυ. Πόσο κοστίζουν τα μαθήματα; Πότε αρχίζουν;
      5. Концовка: Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας. Με εκτίμηση, — и вымышленная подпись.

      Полезно: **για αρχάριους** — для начинающих, **για ενήλικες** — для взрослых. Всё письмо — на «вы»: έχετε, μπορείτε, σας.
  - type: exercise
    id: formal-sentences
    title: Фразы для официального письма
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я пишу вам по поводу занятий теннисом.
        answer:
          - Σας γράφω για τα μαθήματα τένις.
          - Σας γράφω για τα μαθήματα του τένις.
      - id: q2
        prompt: Я хотел(а) бы узнать, есть ли у вас занятия вечером.
        answer:
          - Θα ήθελα να μάθω αν έχετε μαθήματα το βράδυ.
          - Θα ήθελα να μάθω αν έχετε βραδινά μαθήματα.
        explanation: "Μαθαίνω — ещё и «узнавать»; αν — «ли» (модуль 16)."
      - id: q3
        prompt: Сколько стоят занятия?
        answer:
          - Πόσο κοστίζουν τα μαθήματα;
          - Πόσο κάνουν τα μαθήματα;
        explanation: Τα μαθήματα — мн. ч., поэтому κοστίζουν.
      - id: q4
        prompt: Когда начинаются занятия?
        answer:
          - Πότε αρχίζουν τα μαθήματα;
          - Πότε ξεκινάνε τα μαθήματα;
          - Πότε ξεκινούν τα μαθήματα;
  - type: writing
    id: club-inquiry
    register: formal
    prompt: "Спортивный клуб «Ολυμπία» в Лимасоле (Αθλητικός Σύλλογος «Ολυμπία») пишет в интернете: «Μαθήματα τένις για ενήλικες — πρωινά και βραδινά τμήματα» (τμήματα — группы). Напишите письмо директору клуба, господину Константину (κύριος Κωνσταντίνου), 80–100 слов. Представьтесь, скажите, как часто вы играли и какой у вас уровень, когда вы можете заниматься, и задайте два-три вопроса (дни и время, цена, начало занятий). Попросите ответить."
    words:
      min: 80
      max: 100
    model: |-
      Αγαπητέ κύριε Κωνσταντίνου,

      Σας γράφω για τα μαθήματα τένις για ενήλικες στον σύλλογό σας. Είδα την αγγελία σας στο ίντερνετ. Είμαι σαράντα χρονών και μένω στη Λεμεσό, κοντά στον σύλλογο. Παίζω τένις σπάνια και το επίπεδό μου δεν είναι πολύ καλό. Θα ήθελα να μάθω αν έχετε μαθήματα για αρχάριους το βράδυ, γιατί δουλεύω μέχρι τις πέντε. Πόσες φορές την εβδομάδα είναι τα μαθήματα και πόσο κοστίζουν; Είναι πιο φτηνά αν πληρώσω για τρεις μήνες; Πότε αρχίζουν;

      Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

      Με εκτίμηση,
      Ιρίνα Σοκόλοβα
    criteria:
      - 80–100 слов; официальное обращение (Αγαπητέ κύριε…,) и концовка (Με εκτίμηση,)
      - Всё письмо на «вы» (έχετε, σας) — без форм на «ты»
      - Сказано, зачем вы пишете (Σας γράφω για…)
      - Сказано о себе и своём уровне (παίζω σπάνια, το επίπεδό μου…) и когда вы можете заниматься
      - Два-три вопроса (Θα ήθελα να μάθω αν…, Πόσο κοστίζουν…;, Πότε αρχίζουν…;)
      - Есть просьба ответить (Περιμένω την απάντησή σας.)
      - "Второй тонос: τον σύλλογό σας, το επίπεδό μου, την απάντησή σας; τα μαθήματα — κοστίζουν, αρχίζουν (мн. ч.)"
  - type: explanation
    id: speaking-how
    title: Монолог и ролевая игра
    body: |-
      **Монолог.** Во второй части устного экзамена могут спросить: **Τι κάνετε στον ελεύθερο χρόνο σας;** План: сколько у вас свободного времени; какой спорт и как часто; другие хобби (музыка, кино, чтение); что вы любите больше и почему — со сравнением; что вы будете делать в эти выходные или летом (θα…).

      **Ролевая игра.** В третьей части вы говорите с другим экзаменуемым. Здесь вы вместе выбираете, куда пойти. Нужно предложить (Πάμε…; Τι λες για…;), сравнить варианты (είναι πιο ακριβό, αλλά πιο ενδιαφέρον), вежливо не согласиться (Το ποδόσφαιρο δεν μου αρέσει πολύ…), выбрать и договориться о времени и месте (Τι ώρα; Πού βρισκόμαστε;).

      Полезно: **Τι λες;** — «Как думаешь?», **Πάμε καλύτερα…** — «Давай лучше пойдём…», **Συμφωνώ!** — «Согласен!». В образце монолога **μαθήματα χορού** — «уроки танцев» (χορού — родительный падеж, как μαθήματα ελληνικών).

      Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: free-time
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Τι κάνετε στον ελεύθερο χρόνο σας; Ποιο είναι το αγαπημένο σας χόμπι;»
      Говорите около минуты по плану, сравните хотя бы два занятия. Запишите ответ.
    seconds: 90
    model: Δεν έχω πολύ ελεύθερο χρόνο, γιατί δουλεύω πολύ. Αλλά τα σαββατοκύριακα ασχολούμαι με τα χόμπι μου. Πάω στο γυμναστήριο κάθε Σάββατο πρωί και την Κυριακή παίζω τένις με μια φίλη μου. Το τένις είναι το αγαπημένο μου άθλημα. Είναι πιο ενδιαφέρον από το γυμναστήριο, γιατί στο γυμναστήριο συχνά βαριέμαι. Το βράδυ μου αρέσει το διάβασμα και η μουσική. Πηγαίνω σινεμά σπάνια, μία φορά τον μήνα, γιατί προτιμώ το θέατρο από το σινεμά. Τον Σεπτέμβριο θα αρχίσω και μαθήματα χορού, γιατί ο χορός είναι τόσο καλός για την υγεία όσο το τένις.
    criteria:
      - Говорили около минуты, без долгих пауз
      - Назвали хотя бы два занятия и как часто вы ими занимаетесь (κάθε…, σπάνια, μία φορά τον μήνα)
      - "Сравнили занятия: πιο … από, ο καλύτερος / το αγαπημένο μου, τόσο … όσο, προτιμώ … από"
      - Объяснили почему (γιατί…)
      - Сказали о планах с θα (θα αρχίσω, θα πάω)
      - Ударение на своём месте (γυμναστήριο, ελεύθερο, ενδιαφέρον, διάβασμα); γ в γυμναστήριο — мягкий [й], а не русское [г]
  - type: speaking
    id: where-to-go
    part: roleplay
    prompt: |-
      Ролевая игра. Вы и друг выбираете, куда пойти в субботу вечером. Друг начинает: «Τι λες, πού πάμε το Σάββατο; Η ομάδα μας παίζει στο γήπεδο.»

      Ваша роль: футбол вам не очень нравится — вежливо откажитесь. Предложите кино, потом согласитесь на концерт в культурном центре. Сравните варианты (хотя бы два сравнения), узнайте время и цену, договоритесь, кто купит билеты и где вы встретитесь. Говорите на «ты», произнесите свои реплики вслух и запишите.
    seconds: 120
    model: |-
      — Τι λες, πού πάμε το Σάββατο; Η ομάδα μας παίζει στο γήπεδο.
      — Το ποδόσφαιρο δεν μου αρέσει πολύ, στο γήπεδο βαριέμαι. Πάμε καλύτερα σινεμά; Παίζει μια καινούργια ελληνική ταινία.
      — Το σινεμά είναι λίγο βαρετό για μένα. Και η συναυλία στο πολιτιστικό κέντρο;
      — Ωραία! Η συναυλία είναι πιο ακριβή από το σινεμά, αλλά είναι πιο ενδιαφέρουσα. Τι ώρα αρχίζει;
      — Στις οκτώ. Το εισιτήριο κάνει δώδεκα ευρώ.
      — Ωραία, δεν είναι τόσο ακριβό όσο το θέατρο. Θα αγοράσω εγώ τα εισιτήρια. Πού βρισκόμαστε;
      — Στην πλατεία, στις επτά και μισή;
      — Συμφωνώ! Τα λέμε στην πλατεία.
    criteria:
      - Вежливо отказались от одного варианта и объяснили почему (δεν μου αρέσει πολύ, βαριέμαι)
      - Предложили свой вариант (Πάμε καλύτερα…;, Τι λες για…;)
      - "Хотя бы два сравнения: πιο … από, τόσο … όσο, καλύτερος"
      - Спросили о времени и цене (Τι ώρα αρχίζει;, Πόσο κάνει το εισιτήριο;)
      - Договорились о билетах и месте встречи (Θα αγοράσω…, Πού βρισκόμαστε;)
      - Весь разговор на «ты»; ударение на своём месте (συναυλία, εισιτήριο, ταινία)
  - type: exercise
    id: review
    title: Повторение — модули 17–19
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - θα πάμε
      - πήγαμε
      - έρθεις
      - ήρθες
      - Τα
      - Μην
    items:
      - id: g1
        prompt: Αύριο ___ στο γήπεδο με τα παιδιά.
        answer: θα πάμε
        explanation: Αύριο — будущее время с θα.
      - id: g3
        prompt: Θέλεις να ___ μαζί μας στη συναυλία;
        answer: έρθεις
        explanation: После θέλω να — форма от основы аориста с окончаниями настоящего (να έρθεις); прошедшее ήρθες здесь не подходит (модуль 16).
      - id: g4
        prompt: — Πού είναι τα εισιτήρια; — ___ έχω εγώ.
        answer: Τα
        explanation: Τα — «их» (τα εισιτήρια), слабое местоимение перед глаголом (модуль 17).
      - id: g6
        prompt: ___ τρως πολύ πριν από το κολύμπι!
        answer: Μην
        explanation: Запрет — μην + глагол (модуль 18).
