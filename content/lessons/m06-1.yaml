blocks:
  - type: explanation
    id: rooms
    title: Дом, квартира, комнаты
    body: |-
      **Το σπίτι** — «дом» и вообще «жильё»: так говорят и о квартире. **Στο σπίτι** — «дома»: Είμαι στο σπίτι. **Το διαμέρισμα** — квартира в многоквартирном доме.

      **Το δωμάτιο** — любая комната. Комнаты по назначению: **το υπνοδωμάτιο** (спальня; ύπνος — сон), **το σαλόνι** (гостиная), **η κουζίνα** (кухня), **το μπάνιο** (ванная — на Кипре обычно вместе с туалетом). В объявлениях квартиру считают по спальням: διαμέρισμα **με δύο υπνοδωμάτια** — две спальни и ещё гостиная, то есть по-русски это скорее «трёхкомнатная».

      Почти все слова урока — среднего рода, с артиклем **το**. Женского рода — **η κουζίνα** и **η πόρτα**. Учите слово сразу с артиклем.
    table:
      columns:
        - по-гречески
        - по-русски
        - мн. ч.
      rows:
        - - το σπίτι
          - дом, жильё
          - τα σπίτια
        - - το διαμέρισμα
          - квартира
          - τα διαμερίσματα
        - - το δωμάτιο
          - комната
          - τα δωμάτια
        - - το υπνοδωμάτιο
          - спальня
          - τα υπνοδωμάτια
        - - το σαλόνι
          - гостиная
          - τα σαλόνια
        - - η κουζίνα
          - кухня
          - οι κουζίνες
        - - το μπάνιο
          - ванная
          - τα μπάνια
        - - η πόρτα
          - дверь
          - οι πόρτες
        - - το παράθυρο
          - окно
          - τα παράθυρα
        - - το τραπέζι
          - стол
          - τα τραπέζια
  - type: explanation
    id: plural
    title: Два окна, три комнаты — множественное число
    body: |-
      Чтобы сказать, сколько в квартире комнат, нужно множественное число. Подробно оно будет в модуле 07, а пока хватит трёх моделей — они покрывают все слова урока.

      Средний род: артикль **το → τα**. Окончание **-ο → -α** (δωμάτιο → δωμάτια), **-ι → -ια** (σπίτι → σπίτια), **-μα → -ματα** (διαμέρισμα → διαμερίσματα). Женский род на -α: артикль **η → οι**, окончание **-α → -ες** (πόρτα → πόρτες).

      Числа 3 и 4 в женском роде другие, как вы помните из модуля 04: **τρία** δωμάτια, но **τρεις** πόρτες; **τέσσερα** παράθυρα, но **τέσσερις** πόρτες. «Один» — ένα δωμάτιο, но **μία** (μια) κουζίνα.

      В διαμέρισμα ударение во множественном числе сдвигается на слог вправо: δια**μέ**ρισμα → διαμε**ρί**σματα — греческое ударение не может стоять дальше третьего слога от конца, а слово стало на слог длиннее. В остальных словах урока оно остаётся на месте.
    table:
      columns:
        - ед. ч.
        - мн. ч.
        - модель
      rows:
        - - το παράθυρο
          - τα παράθυρα
          - -ο → -α
        - - το τραπέζι
          - τα τραπέζια
          - -ι → -ια
        - - το διαμέρισμα
          - τα διαμερίσματα
          - -μα → -ματα
        - - η πόρτα
          - οι πόρτες
          - -α → -ες
  - type: explanation
    id: yparxei
    title: Υπάρχει, υπάρχουν — «есть, имеется»
    body: |-
      Чтобы сказать, что где-то что-то **есть**, по-гречески говорят **υπάρχει** (одна вещь) или **υπάρχουν** (несколько). Это формы глагола υπάρχω «существовать», но в быту нужны почти только они.

      **Στην κουζίνα υπάρχει τραπέζι.** — На кухне есть стол.
      **Στο διαμέρισμα υπάρχουν δύο μπάνια.** — В квартире две ванные.

      Существительное после υπάρχει обычно без артикля, как в русском «есть стол», или с ένα / μία: υπάρχει **ένα** τραπέζι. Отрицание — **δεν υπάρχει**, вопрос — той же фразой с интонацией: **Υπάρχει τραπέζι στην κουζίνα;** Ответ — Ναι, υπάρχει. / Όχι, δεν υπάρχει.

      Можно сказать и через έχω: **Το σπίτι έχει τρία δωμάτια** = **Στο σπίτι υπάρχουν τρία δωμάτια.** С έχει подлежащее — сам дом, с υπάρχουν — комнаты.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Υπάρχει μπάνιο.
          - Есть ванная.
        - - Υπάρχουν δύο μπάνια.
          - Есть две ванные.
        - - Δεν υπάρχει τραπέζι.
          - Стола нет.
        - - Υπάρχει τραπέζι στην κουζίνα;
          - На кухне есть стол?
        - - Το σπίτι έχει τρία δωμάτια.
          - В доме три комнаты.
  - type: explanation
    id: einai-place
    title: Είναι + место — «где находится»
    body: |-
      Когда вещь уже известна и мы спрашиваем, **где** она, нужен глагол **είναι** и существительное **с артиклем**:

      **Πού είναι η κουζίνα;** — Где кухня?
      **Η κουζίνα είναι δίπλα στο σαλόνι.** — Кухня рядом с гостиной.
      **Τα υπνοδωμάτια είναι πάνω.** — Спальни наверху.

      Сравните: **Υπάρχει μπάνιο;** — «Ванная (вообще) есть?» — и **Πού είναι το μπάνιο;** — «Где (эта) ванная?». В первом вопросе мы не знаем, есть ли вещь; во втором знаем и ищем место. Для нескольких вещей είναι то же самое: Τα παράθυρα είναι… — «Окна (находятся)…».
  - type: explanation
    id: sto
    title: Σε + артикль — στο, στη(ν), στον
    body: |-
      Предлог **σε** — «в, на» — сливается с определённым артиклем в одно слово: σε + το = **στο**. Отдельно σε остаётся перед ένα / μία: **σε ένα** διαμέρισμα — «в одной (какой-то) квартире».

      После σε артикль стоит в винительном падеже (подробно — в модуле 08). У среднего и женского рода он почти не меняется, у мужского **ο → τον**: ο δρόμος — «улица», **στον δρόμο** — «на улице».

      Буква ν у **στην** — по правилу, знакомому по την: она остаётся перед гласной и перед κ, π, τ, ξ, ψ (и μπ, ντ, γκ, τσ, τζ): **στην** κουζίνα, **στην** πόρτα, **στην** Πάφο; перед остальными согласными её нет: **στη** Λεμεσό, **στη** Λευκωσία. У **στον** ν не выпадает никогда.
    table:
      columns:
        - род
        - σε + артикль
        - пример
      rows:
        - - ср. (το)
          - στο
          - στο σαλόνι, στο μπάνιο, στο σπίτι
        - - ж. (η)
          - στη(ν)
          - στην κουζίνα, στη Λεμεσό
        - - м. (ο)
          - στον
          - στον δρόμο
        - - мн. ср. (τα)
          - στα
          - στα υπνοδωμάτια
        - - мн. ж. (οι)
          - στις
          - στις κουζίνες
  - type: explanation
    id: place
    title: Рядом, над, под, за — наречия места
    body: |-
      Наречия места работают и сами по себе, и с предметом. Одно: **Είμαι έξω.** — «Я на улице (снаружи)». **Τα υπνοδωμάτια είναι πάνω.** — «Спальни наверху». С предметом наречие соединяется через **σε** или **από** — какой из двух, нужно запомнить вместе с наречием:

      С **σε**: **δίπλα σε** — рядом с (δίπλα στο σαλόνι), **κοντά σε** — недалеко от (κοντά στη θάλασσα — у моря), **μέσα σε** — внутри (μέσα στο σπίτι).

      С **από**: **κάτω από** — под, **πίσω από** — за, **έξω από** — снаружи, у (έξω από την πόρτα — у двери, снаружи). После από артикль с ним не сливается: από το, από τη(ν), από τον.

      Внимание на **πάνω**: **πάνω σε** — «на» (касается: πάνω στο τραπέζι — на столе), **πάνω από** — «над» (πάνω από το τραπέζι — над столом). **Μπροστά** — «перед» — бывает с обоими: μπροστά στο σπίτι = μπροστά από το σπίτι.

      **Έλα μέσα!** — «Заходи!», дословно «иди внутрь». Έλα — «иди сюда, приходи»; на «вы» — **Ελάτε μέσα!**
    table:
      columns:
        - наречие
        - одно
        - с предметом
        - пример
      rows:
        - - δίπλα
          - рядом
          - δίπλα σε — рядом с
          - δίπλα στο σαλόνι
        - - κοντά
          - близко
          - κοντά σε — недалеко от
          - κοντά στη θάλασσα
        - - μέσα
          - внутри
          - μέσα σε — в, внутри
          - μέσα στο σπίτι
        - - έξω
          - снаружи, на улице
          - έξω από — у, снаружи
          - έξω από την πόρτα
        - - πάνω
          - наверху
          - πάνω σε — на; πάνω από — над
          - πάνω στο τραπέζι; πάνω από το τραπέζι
        - - κάτω
          - внизу
          - κάτω από — под
          - κάτω από το παράθυρο
        - - μπροστά
          - впереди
          - μπροστά σε / από — перед
          - μπροστά στο σπίτι
        - - πίσω
          - сзади
          - πίσω από — за
          - πίσω από την πόρτα
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: rooms-match
    title: Комнаты и вещи
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - η κουζίνα
      - το υπνοδωμάτιο
      - το σαλόνι
      - το μπάνιο
      - το παράθυρο
      - η πόρτα
      - το τραπέζι
      - το διαμέρισμα
      - το δωμάτιο
    items:
      - id: m1
        prompt: кухня
        answer: η κουζίνα
      - id: m2
        prompt: спальня
        answer: το υπνοδωμάτιο
        explanation: Υπνοδωμάτιο — «комната для сна»; просто «комната» — δωμάτιο.
      - id: m3
        prompt: гостиная
        answer: το σαλόνι
      - id: m4
        prompt: ванная
        answer: το μπάνιο
      - id: m5
        prompt: окно
        answer: το παράθυρο
      - id: m6
        prompt: дверь
        answer: η πόρτα
      - id: m7
        prompt: стол
        answer: το τραπέζι
  - type: exercise
    id: plural-write
    title: Множественное число
    instruction: Напишите множественное число с артиклем.
    format: text
    items:
      - id: q1
        prompt: το δωμάτιο
        answer:
          - τα δωμάτια
      - id: q3
        prompt: το παράθυρο
        answer:
          - τα παράθυρα
        explanation: "-ο → -α; ударение остаётся на месте: παράθυρα."
      - id: q4
        prompt: η πόρτα
        answer:
          - οι πόρτες
        explanation: "Женский род: η → οι, -α → -ες."
      - id: q5
        prompt: το διαμέρισμα
        answer:
          - τα διαμερίσματα
        explanation: "-μα → -ματα, и ударение сдвигается: διαμερίσματα."
  - type: exercise
    id: yparxei-forms
    title: Υπάρχει или υπάρχουν
    instruction: Выберите форму. Подсказка — одна вещь или несколько.
    format: choice
    items:
      - id: q1
        prompt: Στο σπίτι ___ δύο μπάνια.
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχουν
      - id: q2
        prompt: Στην κουζίνα ___ τραπέζι;
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχει
      - id: q3
        prompt: Στο διαμέρισμα ___ τρία δωμάτια.
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχουν
      - id: q4
        prompt: Στο σαλόνι δεν ___ τηλεόραση.
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχει
        explanation: Одна вещь — υπάρχει; отрицание δεν ставится перед глаголом.
      - id: q5
        prompt: Στο υπνοδωμάτιο ___ δύο παράθυρα.
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχουν
      - id: q8
        prompt: Στη Λεμεσό ___ πολλά σπίτια.
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχουν
        explanation: Σπίτια — множественное число (много домов), значит υπάρχουν.
  - type: exercise
    id: yparxei-einai
    title: Есть или находится
    instruction: Выберите υπάρχει или είναι.
    format: choice
    items:
      - id: q1
        prompt: Πού ___ η κουζίνα;
        options:
          - υπάρχει
          - είναι
        answer: είναι
        explanation: Спрашиваем, где известная вещь (η κουζίνα — с артиклем), значит είναι.
      - id: q2
        prompt: Στο διαμέρισμα ___ μπάνιο;
        options:
          - υπάρχει
          - είναι
        answer: υπάρχει
        explanation: Спрашиваем, есть ли ванная вообще, — υπάρχει, существительное без артикля.
      - id: q3
        prompt: Το σαλόνι ___ δίπλα στην κουζίνα.
        options:
          - υπάρχει
          - είναι
        answer: είναι
      - id: q4
        prompt: Στο σαλόνι ___ ένα τραπέζι.
        options:
          - υπάρχει
          - είναι
        answer: υπάρχει
        explanation: "Ένα τραπέζι — «(какой-то) стол», новая вещь: υπάρχει."
      - id: q5
        prompt: Το τραπέζι ___ στο σαλόνι.
        options:
          - υπάρχει
          - είναι
        answer: είναι
        explanation: Το τραπέζι — «этот стол», он уже известен; говорим, где он.
      - id: q6
        prompt: Στην κουζίνα δεν ___ πόρτα.
        options:
          - υπάρχει
          - είναι
        answer: υπάρχει
      - id: q7
        prompt: Η Άννα ___ στο μπάνιο.
        options:
          - υπάρχει
          - είναι
        answer: είναι
        explanation: О человеке, который где-то находится, — είναι.
  - type: exercise
    id: sto-gap
    title: Στο, στη, στην, στον, στα
    instruction: Вставьте σε + артикль.
    format: gap
    bank:
      - στο
      - στη
      - στην
      - στον
      - στα
    items:
      - id: g1
        prompt: Η Άννα είναι ___ κουζίνα.
        answer: στην
        explanation: Η κουζίνα — женский род; перед κ буква ν остаётся.
      - id: g2
        prompt: Το τραπέζι είναι ___ σαλόνι.
        answer: στο
      - id: g3
        prompt: Μένω ___ Λεμεσό.
        answer: στη
        explanation: Перед λ буква ν не пишется — στη Λεμεσό.
      - id: g4
        prompt: Ο Νίκος είναι ___ δρόμο. (ο δρόμος — улица)
        answer: στον
        explanation: "Мужской род: σε + τον = στον."
      - id: g5
        prompt: Υπάρχουν δύο παράθυρα ___ υπνοδωμάτια.
        answer: στα
        explanation: "Υπνοδωμάτια — мн. ч. среднего рода: σε + τα = στα."
      - id: g7
        prompt: Τώρα είμαι ___ Πάφο.
        answer: στην
        explanation: Перед π ν остаётся — στην Πάφο.
  - type: exercise
    id: place-gap
    title: Где это
    instruction: Вставьте наречие места. Подсказка — в скобках.
    format: gap
    bank:
      - δίπλα
      - κοντά
      - μέσα
      - έξω
      - πάνω
      - κάτω
      - μπροστά
      - πίσω
    items:
      - id: g1
        prompt: Το μπάνιο είναι ___ στην κουζίνα. (рядом с)
        answer: δίπλα
      - id: g2
        prompt: Ο Νίκος είναι ___ από την πόρτα. (снаружи, у)
        answer: έξω
      - id: g3
        prompt: Τα υπνοδωμάτια είναι ___. (наверху)
        answer: πάνω
      - id: g4
        prompt: Η κουζίνα και το σαλόνι είναι ___. (внизу)
        answer: κάτω
      - id: g5
        prompt: Υπάρχει ένα τραπέζι ___ από το σπίτι. (за)
        answer: πίσω
      - id: g6
        prompt: Η Μαρία είναι ___ στο σπίτι. (внутри)
        answer: μέσα
      - id: g7
        prompt: Το σπίτι είναι ___ στη θάλασσα. (недалеко от; η θάλασσα — море)
        answer: κοντά
      - id: g8
        prompt: Η Άννα είναι ___ στο παράθυρο. (перед)
        answer: μπροστά
  - type: exercise
    id: se-apo
    title: Σε или από
    instruction: Как сказать правильно? Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: под столом
        options:
          - κάτω από το τραπέζι
          - κάτω στο τραπέζι
        answer: κάτω από το τραπέζι
        explanation: κάτω — только с από.
      - id: q2
        prompt: на столе
        options:
          - πάνω στο τραπέζι
          - πάνω από το τραπέζι
        answer: πάνω στο τραπέζι
        explanation: "πάνω σε — «на» (касается), πάνω από — «над»."
      - id: q3
        prompt: над столом
        options:
          - πάνω στο τραπέζι
          - πάνω από το τραπέζι
        answer: πάνω από το τραπέζι
      - id: q4
        prompt: рядом с ванной
        options:
          - δίπλα στο μπάνιο
          - δίπλα το μπάνιο
        answer: δίπλα στο μπάνιο
        explanation: Без σε или από наречие с предметом не соединяется.
      - id: q5
        prompt: за дверью
        options:
          - πίσω από την πόρτα
          - πίσω στην πόρτα
        answer: πίσω από την πόρτα
      - id: q6
        prompt: в доме (внутри)
        options:
          - μέσα στο σπίτι
          - μέσα το σπίτι
        answer: μέσα στο σπίτι
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Где кухня?
        answer:
          - Πού είναι η κουζίνα;
      - id: q2
        prompt: На кухне есть стол?
        answer:
          - Υπάρχει τραπέζι στην κουζίνα;
          - Στην κουζίνα υπάρχει τραπέζι;
          - Υπάρχει ένα τραπέζι στην κουζίνα;
          - Στην κουζίνα υπάρχει ένα τραπέζι;
        explanation: Вопрос — той же фразой, что и утверждение, с «;» в конце.
      - id: q3
        prompt: В доме три комнаты.
        answer:
