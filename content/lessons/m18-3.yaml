blocks:
  - type: explanation
    id: gesy
    title: ΓεΣΥ — система здравоохранения Кипра
    body: |-
      **Το ΓεΣΥ** (Γενικό Σύστημα Υγείας — «Общая система здравоохранения», читается [йеси́]) работает на Кипре с 2019 года. Взносы в него удерживают из зарплаты и пенсии. Право на ΓεΣΥ есть у граждан Кипра и ЕС, живущих на острове; у граждан других стран оно зависит от вида на жительство и работы на Кипре — точные условия смотрите на официальном сайте ΓεΣΥ.

      **Προσωπικός γιατρός.** Каждый, кто зарегистрирован в ΓεΣΥ, выбирает себе **προσωπικό γιατρό** — личного (семейного) врача; в официальных текстах — προσωπικός ιατρός. Детям до 15 лет выбирают педиатра. С болезнью обычно идут сначала к нему: он осматривает, выписывает **συνταγή** и, если нужно, даёт направление к специалисту или на анализы. В неотложку (**τα επείγοντα**) можно идти сразу.

      В ΓεΣΥ работают и **δημόσια νοσοκομεία** — государственные больницы (**δημόσιος** — государственный, общественный), и многие частные клиники, врачи, аптеки и лаборатории. Бесплатно не всё: за визит, лекарство по рецепту или анализ пациент обычно доплачивает небольшую сумму — от одного до нескольких евро. Лекарство без рецепта ΓεΣΥ не оплачивает. Поэтому в аптеке и у врача часто спрашивают: **Καλύπτεται από το ΓεΣΥ;** — «Это покрывается ΓεΣΥ?».

      Кроме ΓεΣΥ, у многих есть частная **ασφάλεια υγείας** — медицинская страховка (**η ασφάλεια** — страховка). В частной клинике могут спросить: **Είστε ασφαλισμένος;** — «Вы застрахованы?» (**ασφαλισμένος, ασφαλισμένη** — застрахованный).

      **Ιατρικός** — медицинский (от ιατρός, как ιατρείο). Если вы болеете и не ходите на работу, врач даёт **ιατρική βεβαίωση** — медицинскую справку (**η βεβαίωση** — справка).

      В аптеке пригодятся ещё две фразы: **Έχετε κάτι για τον πονοκέφαλο;** — «У вас есть что-нибудь от головной боли?» и **Χρειάζεται συνταγή γι' αυτό το φάρμακο;** — «На это лекарство нужен рецепт?» (γι' αυτό = για αυτό).
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - ο προσωπικός γιατρός
          - личный (семейный) врач
        - - το δημόσιο νοσοκομείο
          - государственная больница
        - - Καλύπτεται από το ΓεΣΥ;
          - Это покрывается ΓεΣΥ?
        - - η ασφάλεια υγείας
          - медицинская страховка
        - - Είστε ασφαλισμένη;
          - Вы застрахованы? (женщине)
        - - η ιατρική βεβαίωση
          - медицинская справка
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: gesy-tf
    title: Как работает ΓεΣΥ
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Στο ΓεΣΥ διαλέγετε έναν προσωπικό γιατρό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Όταν είστε άρρωστος, πηγαίνετε πρώτα στον προσωπικό σας γιατρό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Обычно сначала — к личному врачу; сразу можно идти, например, в неотложку.
      - id: q3
        prompt: Στο ΓεΣΥ δουλεύουν μόνο τα δημόσια νοσοκομεία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: В ΓεΣΥ работают и многие частные клиники, врачи и аптеки.
      - id: q4
        prompt: Με το ΓεΣΥ δεν πληρώνετε ποτέ τίποτα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: За визит, лекарство или анализ обычно доплачивают небольшую сумму.
      - id: q5
        prompt: Ένα φάρμακο χωρίς συνταγή δεν καλύπτεται από το ΓεΣΥ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: В аптеке вы хотите узнать, нужен ли на лекарство рецепт.
        options:
          - Χρειάζεται συνταγή γι' αυτό το φάρμακο;
          - Καλύπτεται από το ΓεΣΥ;
          - Πόσες φορές την ημέρα;
        answer: Χρειάζεται συνταγή γι' αυτό το φάρμακο;
      - id: q2
        prompt: Вы хотите узнать, оплачивает ли ΓεΣΥ анализы.
        options:
          - Καλύπτεται από το ΓεΣΥ;
          - Είστε ασφαλισμένος;
          - Τι ώρα είναι ελεύθερος ο γιατρός;
        answer: Καλύπτεται από το ΓεΣΥ;
        explanation: Είστε ασφαλισμένος; — так спрашивают вас, а не вы.
      - id: q3
        prompt: У вас болит голова, вы в аптеке.
        options:
          - Έχετε κάτι για τον πονοκέφαλο;
          - Από πότε έχετε αυτά τα συμπτώματα;
          - Να γίνεις γρήγορα καλά!
        answer: Έχετε κάτι για τον πονοκέφαλο;
      - id: q5
        prompt: Вы три дня болели, и работодатель просит справку от врача. Что вы говорите врачу?
        options:
          - Χρειάζομαι μια ιατρική βεβαίωση για τη δουλειά μου.
          - Χρειάζομαι μια ασφάλεια υγείας για τη δουλειά μου.
          - Χρειάζομαι μια συνταγή για τη δουλειά μου.
        answer: Χρειάζομαι μια ιατρική βεβαίωση για τη δουλειά μου.
  - type: explanation
    id: friendly-how
    title: Письмо A — совет другу
    body: |-
      Как на экзамене, пишем **два текста** примерно по 80 слов: дружеский и официальный.

      Первый — сообщение заболевшей подруге. План из пяти шагов:

      1. Приветствие и сочувствие: Γεια σου, …! Περαστικά!
      2. Главный совет: Πρέπει να πας στον γιατρό…
      3. Ещё два-три совета — повелительным наклонением: μείνε στο κρεβάτι, πίνε πολλά υγρά, μέτρησε τον πυρετό.
      4. Один-два запрета с μην: μην πας στη δουλειά, μην ανησυχείς, μην πάρεις αντιβίωση χωρίς συνταγή.
      5. Предложите помощь и попрощайтесь: Θέλεις να σου φέρω…; Να γίνεις γρήγορα καλά! Φιλιά,

      Всё письмо — на «ты». Проверьте вид: один раз — πάρε, μείνε, μέτρησε; регулярно — πίνε, παίρνε; после μην — форма, как после να (μην πας, μην ανησυχείς). Советуйте только безопасное: отдых, питьё, врач — никаких доз «от себя».
  - type: writing
    id: friend-advice
    register: friendly
    prompt: "Ваша подруга Деспина пишет: «Είμαι άρρωστη από την Κυριακή — έχω πυρετό και βήχα και δεν μπορώ να πάω στη δουλειά. Τι να κάνω;» Ответьте ей сообщением около 80 слов: посочувствуйте, дайте три-четыре совета (πρέπει να, повелительное наклонение), один-два запрета с μην, предложите помощь и пожелайте поправиться."
    words:
      min: 70
      max: 100
    model: |-
      Γεια σου, Δέσποινα!

      Περαστικά! Πρέπει να πας στον γιατρό σου σήμερα ή αύριο, γιατί έχεις πυρετό από την Κυριακή. Μέχρι το ραντεβού, μείνε στο κρεβάτι και πίνε πολλά υγρά: νερό, τσάι και χυμό. Μέτρησε τον πυρετό το πρωί και το βράδυ. Μην πας στη δουλειά αυτή την εβδομάδα — πρέπει να ξεκουραστείς. Μην πάρεις αντιβίωση χωρίς συνταγή! Και μην ανησυχείς για τη δουλειά. Θέλεις να σου φέρω τα φάρμακα από το φαρμακείο; Μπορώ να έρθω αύριο μετά τη δουλειά.

      Να γίνεις γρήγορα καλά!
      Φιλιά,
      Ελπίδα
    criteria:
      - Около 80 слов (70–100); дружеское приветствие и прощание, всё письмо на «ты»
      - Есть сочувствие или пожелание (Περαστικά!, Να γίνεις γρήγορα καλά!)
      - Хотя бы один совет с πρέπει να в правильной форме (πρέπει να πας, πρέπει να ξεκουραστείς)
      - "Два-три совета в повелительном наклонении на «ты»; вид выбран верно: один раз — μείνε, μέτρησε; регулярно — πίνε"
      - "Хотя бы один запрет с μην + форма как после να (μην πας, μην ανησυχείς), а не «μην πήγαινε»"
      - Предложена помощь (Θέλεις να σου φέρω…;, Μπορώ να έρθω…)
      - Советы безопасные — без доз лекарств; тонос во всех словах из двух и больше слогов
  - type: explanation
    id: formal-how
    title: Письмо B — запись к врачу
    body: |-
      Второй текст — официальное письмо (e-mail) в кабинет врача. План:

      1. Обращение: **Αγαπητέ κύριε Χαραλάμπους,** (врачу-женщине — Αγαπητή κυρία Πετρίδου,).
      2. Кто вы и зачем пишете: Είμαι ασθενής σας… **Θα ήθελα να κλείσω ένα ραντεβού μαζί σας.**
      3. Что беспокоит и с какого времени: Εδώ και δύο εβδομάδες…, Από τη Δευτέρα έχω…
      4. Когда вы можете прийти: Μπορώ να έρθω τη Δευτέρα ή την Τετάρτη μετά τις πέντε, γιατί…
      5. Один-два вопроса: **Καλύπτεται από το ΓεΣΥ;** Πρέπει να έρθω νηστική; Πρέπει να φέρω κάτι μαζί μου;
      6. Концовка, как в модуле 16: **Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας. Με εκτίμηση,** — и вымышленное имя.

      Всё письмо — на «вы»: μαζί σας, την απάντησή σας. Повелительного наклонения врачу не пишут — вместо него вопросы: Μπορώ να…; Πρέπει να…;
  - type: exercise
    id: formal-sentences
    title: Фразы для письма врачу
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я хотел(а) бы записаться к врачу.
        answer:
          - Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό.
          - Θα ήθελα να κλείσω ραντεβού με τον γιατρό.
      - id: q2
        prompt: В какое время свободен врач?
        answer:
          - Τι ώρα είναι ελεύθερος ο γιατρός;
          - Τι ώρα είναι ο γιατρός ελεύθερος;
      - id: q3
        prompt: Это покрывается ΓεΣΥ?
        answer:
          - Καλύπτεται από το ΓεΣΥ;
      - id: q4
        prompt: Мне нужна медицинская справка для работы.
        answer:
          - Χρειάζομαι μια ιατρική βεβαίωση για τη δουλειά μου.
          - Χρειάζομαι μία ιατρική βεβαίωση για τη δουλειά μου.
          - Χρειάζομαι ιατρική βεβαίωση για τη δουλειά μου.
          - Χρειάζομαι μια ιατρική βεβαίωση για τη δουλειά.
          - Χρειάζομαι ιατρική βεβαίωση για τη δουλειά.
  - type: writing
    id: appointment
    register: formal
    prompt: "Ваш личный врач по ΓεΣΥ — доктор Харалампус (κύριος Χαραλάμπους). Уже две недели вы чувствуете сильную усталость, иногда кружится голова. Напишите письмо в его кабинет, около 80 слов: представьтесь, опишите, что беспокоит и с какого времени, попросите записать вас на приём, скажите, когда можете прийти, задайте два вопроса (например, об анализе крови: нужно ли прийти натощак и покрывает ли его ΓεΣΥ). Попросите ответить."
    words:
      min: 70
      max: 100
    model: |-
      Αγαπητέ κύριε Χαραλάμπους,

      Είμαι ασθενής σας και με λένε Ιρίνα Σεμιόνοβα. Θα ήθελα να κλείσω ένα ραντεβού μαζί σας. Εδώ και δύο εβδομάδες νιώθω πολύ κουρασμένη και μερικές φορές ζαλίζομαι. Τη νύχτα δεν κοιμάμαι καλά. Μπορώ να έρθω τη Δευτέρα ή την Τετάρτη μετά τις πέντε, γιατί το πρωί δουλεύω. Αν χρειάζεται να κάνω αναλύσεις αίματος, πρέπει να έρθω νηστική; Οι αναλύσεις καλύπτονται από το ΓεΣΥ;

      Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

      Με εκτίμηση,
      Ιρίνα Σεμιόνοβα
    criteria:
      - Около 80 слов (70–100); официальное обращение (Αγαπητέ κύριε…,) и концовка (Με εκτίμηση,)
      - Всё письмо на «вы» (μαζί σας, την απάντησή σας) — без форм на «ты» и без повелительного наклонения
      - Сказано, зачем вы пишете (Θα ήθελα να κλείσω ένα ραντεβού…)
      - Описано самочувствие и с какого времени (εδώ και…, από…)
      - Названы дни или время, когда вы можете прийти, и почему (γιατί…)
      - Два вопроса (Πρέπει να…;, Καλύπτεται / Καλύπτονται από το ΓεΣΥ;)
      - "Есть просьба ответить; второй тонос — την απάντησή σας; прилагательные в нужном роде (κουρασμένη, νηστική — о женщине)"
  - type: explanation
    id: roleplay-how
    title: Ролевая игра — в аптеке
    body: |-
      В третьей части устного экзамена вы разыгрываете сценку. Фармацевт говорит с вами на «вы», и вы с ним — тоже.

      Что нужно сделать: сказать, что болит и с какого времени; попросить лекарство (**Έχετε κάτι για…;**); ответить на вопросы фармацевта (об аллергии, о температуре); спросить, как принимать (**Πόσες φορές την ημέρα; Πριν ή μετά το φαγητό;**), нужен ли рецепт и покрывает ли его ΓεΣΥ; поблагодарить.

      Фармацевт может сказать: **Είστε αλλεργικός σε κάποιο φάρμακο;** — «У вас есть аллергия на какое-нибудь лекарство?», **Αν σε τρεις μέρες δεν είστε καλύτερα, πηγαίνετε στον γιατρό σας.** Держите в голове план, а не текст. Запишите себя и сверьте с образцом.
  - type: speaking
    id: pharmacy
    part: roleplay
    prompt: |-
      Ролевая игра. Вы в аптеке. С утра у вас болит голова и немного поднялась температура (37,5). У вас аллергия на пенициллин. Фармацевт начинает: «Καλησπέρα σας. Παρακαλώ;»

      Ваша роль: попросите что-нибудь от головной боли, ответьте на вопросы фармацевта, узнайте, сколько раз в день принимать лекарство и до или после еды, нужен ли рецепт и покрывает ли его ΓεΣΥ. Поблагодарите и попрощайтесь. Говорите на «вы», произнесите свои реплики вслух и запишите.
    seconds: 120
    model: |-
      — Καλησπέρα σας. Παρακαλώ;
      — Καλησπέρα. Έχετε κάτι για τον πονοκέφαλο;
      — Ναι. Έχετε και πυρετό;
      — Λίγο, τριάντα επτά και μισό, από σήμερα το πρωί.
      — Είστε αλλεργικός σε κάποιο φάρμακο;
      — Ναι, είμαι αλλεργικός στην πενικιλίνη.
      — Αυτά τα χάπια δεν έχουν πενικιλίνη. Είναι για τον πόνο και για τον πυρετό.
      — Πόσες φορές την ημέρα;
      — Ένα χάπι κάθε οκτώ ώρες, όχι πάνω από τρία την ημέρα.
      — Πριν ή μετά το φαγητό;
      — Μετά το φαγητό, με ένα ποτήρι νερό.
      — Χρειάζεται συνταγή γι' αυτό το φάρμακο;
      — Όχι, δεν χρειάζεται.
      — Καλύπτεται από το ΓεΣΥ;
      — Όχι, χωρίς συνταγή δεν καλύπτεται. Κάνει τέσσερα ευρώ.
      — Ορίστε. Ευχαριστώ πολύ!
      — Να γίνετε γρήγορα καλά! Αν σε τρεις μέρες δεν είστε καλύτερα, πηγαίνετε στον γιατρό σας.
      — Ευχαριστώ. Καλησπέρα σας.
    criteria:
      - Поздоровались и попрощались на «вы» (Καλησπέρα σας, Ευχαριστώ πολύ)
      - Попросили лекарство (Έχετε κάτι για τον πονοκέφαλο;)
      - Ответили про температуру и с какого времени (από σήμερα το πρωί)
      - "Сказали об аллергии в нужном роде: είμαι αλλεργικός / αλλεργική στην πενικιλίνη"
      - Спросили, как принимать (Πόσες φορές την ημέρα;, Πριν ή μετά το φαγητό;)
      - Спросили о рецепте и ΓεΣΥ (Χρειάζεται συνταγή…;, Καλύπτεται από το ΓεΣΥ;)
      - Ударение на своём месте (φάρμακο, συνταγή, πενικιλίνη, πονοκέφαλο); γ в γιατρό — [й], а не [г]
