  - type: exercise
    id: where-now-match
    about: where-now
    title: Аудирование 1 — описания и картинки
    instruction: Пять человек говорят по телефону, где они сейчас. Прослушайте два раза. Какая картинка подходит каждому? Две картинки лишние.
    format: match
    bank:
      - мужчина в очереди на почте
      - женщина на остановке под дождём
      - женщина в банке
      - мужчина в аэропорту с чашкой кофе
      - женщина в пекарне
      - мужчина с сыном купаются в море
      - мужчина с сыном гуляют у моря
    items:
      - id: m1
        prompt: Σάββας
        answer: мужчина в очереди на почте
        explanation: "Είμαι στο ταχυδρομείο… περιμένω ήδη είκοσι λεπτά, μπροστά μου… δέκα άνθρωποι — это очередь, хотя слова «очередь» в записи нет."
      - id: m2
        prompt: Ρένα
        answer: женщина на остановке под дождём
        explanation: "Είμαι στη στάση… Βρέχει. Ловушка: Μετά θα πάω στην τράπεζα — в банк она пойдёт потом (θα), а картинка — про «сейчас». Поэтому «женщина в банке» лишняя."
      - id: m3
        prompt: Λευτέρης
        answer: мужчина в аэропорту с чашкой кофе
        explanation: "Είμαι στο αεροδρόμιο… η πτήση έχει καθυστέρηση… πίνω έναν καφέ."
      - id: m4
        prompt: Ανθή
        answer: женщина в пекарне
        explanation: "Είμαι στον φούρνο… Παίρνω ψωμί — ο φούρνος здесь пекарня, а не духовка (модуль 07)."
      - id: m5
        prompt: Παντελής
        answer: мужчина с сыном гуляют у моря
        explanation: "Δεν κολυμπάμε… αλλά κάνουμε βόλτα δίπλα στη θάλασσα. Картинка «купаются» лишняя: она проверяет, услышали ли вы δεν. Отрицание меняет весь смысл."
  - type: listening
    id: gift
    title: Ένα δώρο για την Ελένη
    plays: 2
    transcript:
      - speaker: Νεκταρία
        text: Στάθη, ξέρεις ότι την Παρασκευή η Ελένη έχει γενέθλια; Της παίρνουμε ένα δώρο όλοι μαζί από το γραφείο;
        audio: m24-r1/gift-1.mp3
      - speaker: Στάθης
        text: Καλή ιδέα! Ένα βιβλίο;
        audio: m24-r1/gift-2.mp3
      - speaker: Νεκταρία
        text: Βιβλία έχει πολλά. Της αρέσει πολύ το θέατρο. Να πάρουμε δύο εισιτήρια για το θέατρο το Σάββατο;
        audio: m24-r1/gift-3.mp3
      - speaker: Στάθης
        text: Ωραία! Πόσο κάνει το εισιτήριο;
        audio: m24-r1/gift-4.mp3
      - speaker: Νεκταρία
        text: Είκοσι πέντε ευρώ, και τα δύο κάνουν πενήντα. Χωρίς την Ελένη στο γραφείο είμαστε δέκα, γι' αυτό κάθε συνάδελφος δίνει πέντε ευρώ.
        audio: m24-r1/gift-5.mp3
      - speaker: Στάθης
        text: Εντάξει. Εγώ όμως σήμερα δεν μπορώ να πάω για τα εισιτήρια, έχω σύσκεψη μέχρι τις έξι.
        audio: m24-r1/gift-6.mp3
      - speaker: Νεκταρία
        text: Δεν πειράζει, θα τα αγοράσω εγώ αύριο το μεσημέρι. Εσύ φέρε ένα γλυκό από το ζαχαροπλαστείο την Παρασκευή.
        audio: m24-r1/gift-7.mp3
      - speaker: Στάθης
        text: Σίγουρα! Και θα της τα δώσουμε στις έντεκα, με τον καφέ.
        audio: m24-r1/gift-8.mp3
  - type: exercise
    id: gift-choice
    about: gift
    title: Аудирование 2 — выбор из трёх
    instruction: Прослушайте разговор двух коллег два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Γιατί θέλουν να πάρουν ένα δώρο για την Ελένη;
        options:
          - Γιατί φεύγει από την εταιρεία.
          - Γιατί έχει γενέθλια.
          - Γιατί βρήκε καινούργια δουλειά.
        answer: Γιατί έχει γενέθλια.
        explanation: "Την Παρασκευή η Ελένη έχει γενέθλια. Про уход из фирмы и новую работу в разговоре нет ни слова."
      - id: q2
        prompt: Τι δώρο θα πάρουν;
        options:
          - Ένα βιβλίο.
          - Δύο εισιτήρια για το θέατρο.
          - Ένα γλυκό.
        answer: Δύο εισιτήρια για το θέατρο.
        explanation: "Книгу Стафис предлагает, но Нектария отвечает: Βιβλία έχει πολλά — и предлагает билеты; Стафис соглашается (Ωραία!). Первое предложение в диалоге часто отвергнуто. Сладкое — к кофе, это не подарок."
      - id: q3
        prompt: Πόσα λεφτά δίνει κάθε συνάδελφος;
        options:
          - Πέντε ευρώ.
          - Είκοσι πέντε ευρώ.
          - Πενήντα ευρώ.
        answer: Πέντε ευρώ.
        explanation: "В записи три числа: 25 — один билет, 50 — два билета, 5 — с каждого: κάθε συνάδελφος δίνει πέντε ευρώ. Ищите число, которое отвечает именно на вопрос."
      - id: q4
        prompt: Ποιος θα αγοράσει τα εισιτήρια;
        options:
          - Ο Στάθης.
          - Η Νεκταρία.
          - Η Ελένη.
        answer: Η Νεκταρία.
        explanation: "Стафис не может: Εγώ όμως σήμερα δεν μπορώ… Нектария: Δεν πειράζει, θα τα αγοράσω εγώ αύριο. Когда один говорит «не могу», делает другой."
      - id: q5
        prompt: Τι θα φέρει ο Στάθης την Παρασκευή;
        options:
          - Ένα γλυκό.
          - Καφέ.
          - Λουλούδια.
        answer: Ένα γλυκό.
        explanation: "Εσύ φέρε ένα γλυκό από το ζαχαροπλαστείο την Παρασκευή — Σίγουρα! Καφέ звучит в конце (με τον καφέ — «за кофе»), но его никто не приносит. Цветов в разговоре нет."
  - type: listening
    id: supermarket
    title: Μια ανακοίνωση στο σούπερ μάρκετ
    plays: 2
    transcript:
      - speaker: Υπάλληλος
        text: Αγαπητοί πελάτες, καλησπέρα σας! Σήμερα στο σούπερ μάρκετ «Ο Ήλιος» έχουμε μεγάλες προσφορές. Το χαλλούμι κοστίζει μόνο έξι ευρώ το κιλό. Οι φράουλες από την Πάφο κάνουν σήμερα δύο ευρώ το κιλό — χθες έκαναν τέσσερα! Το ψωμί είναι από τον φούρνο μας, φρέσκο κάθε πρωί. Στο ταμείο μπορείτε να πληρώσετε με μετρητά ή με κάρτα. Το σούπερ μάρκετ κλείνει σε μισή ώρα, στις εννέα. Από την επόμενη εβδομάδα θα είμαστε ανοιχτοί και την Κυριακή, από τις δέκα το πρωί μέχρι τις έξι το απόγευμα. Ευχαριστούμε πολύ!
        audio: m24-r1/supermarket-1.mp3
  - type: exercise
    id: supermarket-tf
    about: supermarket
    title: Аудирование 3 — верно или неверно
    instruction: Прослушайте объявление два раза. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Σήμερα το χαλλούμι είναι σε προσφορά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Σήμερα… έχουμε μεγάλες προσφορές. Το χαλλούμι κοστίζει μόνο έξι ευρώ — μόνο подсказывает, что цена сниженная."
      - id: q2
        prompt: Σήμερα οι φράουλες κάνουν τέσσερα ευρώ το κιλό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Сегодня — δύο ευρώ; τέσσερα — это вчерашняя цена (χθες έκαναν τέσσερα). Две цены — смотрите, к какому дню каждая."
      - id: q3
        prompt: Το σούπερ μάρκετ κλείνει στις εννέα και μισή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Κλείνει σε μισή ώρα, στις εννέα — закрывается через полчаса, в девять. Слово μισή звучит, но относится к «через сколько» (σε μισή ώρα), а не ко времени закрытия."
      - id: q4
        prompt: Αυτή την Κυριακή το σούπερ μάρκετ θα είναι ανοιχτό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Από την επόμενη εβδομάδα θα είμαστε ανοιχτοί και την Κυριακή — по воскресеньям откроются только со следующей недели. В это воскресенье — нет."
      - id: q5
        prompt: Την Κυριακή το σούπερ μάρκετ θα κλείνει στις έξι το απόγευμα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "…την Κυριακή, από τις δέκα το πρωί μέχρι τις έξι το απόγευμα. Θα κλείνει — будет закрываться каждое воскресенье (повторяющееся действие в будущем, модуль 19)."
