  - type: explanation
    id: after
    title: Что дальше
    body: |-
      Посчитайте ошибки по типам заданий, а не только общий балл. Если ошибки собрались в одном типе — например, в заметках или в пропусках, — прочитайте ещё раз стратегию этого типа и сделайте такие же задания в M1 и M2: тексты и записи вы, скорее всего, уже забыли, а ловушки там те же. Список уроков курса с заданиями каждого навыка — в последнем блоке пробника M3.

      Следующее, последнее занятие — письмо и речь.
