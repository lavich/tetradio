title: "Слабый навык: чтение и аудирование"
kind: lesson
items: []
blocks:
  - type: explanation
    id: results
    title: Ваши результаты и план занятия
    body: |-
      Это первое из двух последних занятий курса. Они идут после пробника M3, и новых тем в них нет. Сегодня — чтение и аудирование, в следующий раз — письмо и речь.

      **Как читать результаты.** Выпишите баллы M1, M2 и M3 по чтению и по аудированию. В каждом навыке 25 пунктов, порог — 60 %, то есть **15 из 25**, и считается он в каждом навыке отдельно: 15 — сдано, 14 — нет. На экзамене провал одного навыка — провал всего экзамена, поэтому смотрите на самый слабый навык, а не на сумму. Важен и рост: если навык от M1 к M3 не вырос, он слабее, чем кажется по одному числу.

      **Если чтение или аудирование — ваш слабый навык** (в M3 меньше 17 из 25), проходите занятие медленно. Сначала 10 минут разберите ошибки M3 в этом навыке: откройте пояснения, найдите в тексте или транскрипте слова, которые давали ответ, и назовите ловушку — другой день, другой человек, пропущенное δεν, неподходящий род. Потом прочитайте стратегию типа задания и сделайте задание. После ответа откройте пояснения ко **всем** пунктам, и к верным тоже: важно понять, почему верный ответ верный.

      **Если оба навыка в порядке** (17 и больше), сделайте занятие как быструю репетицию экзамена: стратегии только пролистайте, задания — подряд и с таймером, 12 минут на чтение и 12 на аудирование. Пояснения открывайте только к ошибкам. Сэкономленное время отдайте письму и речи.

      Задания здесь короче экзаменационных: 5 пунктов вместо 6–7, тексты по 85–125 слов вместо 120–140. Это тренировка, а не новый пробник: результат не сравнивайте с M1–M3. Медленный маршрут занимает около 60–65 минут, быстрый — около 40.
    table:
      columns:
        - результат в M3
        - что это значит
        - как проходить занятие
      rows:
        - - меньше 15 из 25
          - навык ниже порога
          - медленно, со стратегиями и всеми пояснениями
        - - 15–16 из 25
          - на пороге — одна-две ошибки, и навык не сдан
          - тоже медленно
        - - 17 из 25 и больше
          - запас есть
          - быстрая репетиция по таймеру
  - type: explanation
    id: reading-how
    title: Чтение — четыре типа заданий
    body: |-
      На экзамене 30 минут на четыре текста — примерно 7 минут на текст. Общие правила:

      - **Сначала задание, потом текст.** Прочитайте утверждения или вопросы и подчеркните главное: кто, когда, где, сколько, есть ли δεν.
      - **Ответ — в тексте**, а не в вашем опыте. Даже если «в жизни обычно так», считается только то, что написано.
      - **Не переводите каждое слово.** Незнакомое слово часто не нужно для ответа. Если нужно — догадайтесь по соседним словам или по похожему слову из курса.
      - **Пункты обычно идут по порядку текста** (в пропусках порядок задан самим текстом). Если ответ на пункт 3 нашёлся раньше ответа на пункт 2, проверьте себя ещё раз.
      - Не оставляйте пустых ответов: за ошибку баллы не снимают.
    table:
      columns:
        - задание
        - как делать
        - типичная ловушка
      rows:
        - - Верно / неверно (Σωστό / Λάθος)
          - Найдите в тексте место, о котором утверждение, и сравните каждую деталь. Λάθος — если не совпадает хоть одна деталь
          - Те же слова, что в тексте, но другой день, другой человек, другое число; πάντα вместо μερικές φορές; πιο ακριβά вместо πιο φτηνά
        - - Части предложений (есть лишние окончания)
          - Сначала смысл по тексту, потом грамматика — род, число, падеж, время. Начинайте с уверенных пар
          - Лишнее окончание тоже взято из текста, но говорит о другом; оно грамматически подходит к началу, а по тексту неверно
        - - Выбор из четырёх
          - Найдите в тексте ответ на вопрос и только потом читайте варианты. Неверные варианты вычёркивайте
          - Верный вариант пересказан другими словами, а неверный повторяет слова текста о другом — первое действие вместо второго, прошлое вместо нынешнего
        - - Пропуски (есть лишние слова)
          - Прочитайте весь текст. Для пропуска определите, какое нужно слово — по артиклю, предлогу, να или θα перед ним. Потом смысл. Вычёркивайте использованные слова
          - Слово-«близнец» — то же слово в другом роде или числе (ανοιχτός / ανοιχτή, τρεις / τρία)
  - type: reading
    id: market
    title: Κάθε Τετάρτη στη λαϊκή
    text: |-
      Κάθε Τετάρτη το πρωί πηγαίνω στη λαϊκή της γειτονιάς μου. Δεν είναι μακριά, γι' αυτό πηγαίνω με τα πόδια. Συνήθως πηγαίνω μαζί με τη γειτόνισσά μου, την κυρία Ανδρούλα. Εκείνη ψωνίζει πάντα από τον ίδιο πωλητή, αλλά εγώ προτιμώ να κάνω πρώτα μια βόλτα και να δω τις τιμές.

      Τα φρούτα και τα λαχανικά στη λαϊκή είναι πιο φρέσκα και πιο φτηνά από το σούπερ μάρκετ. Την περασμένη Τετάρτη αγόρασα δύο κιλά ντομάτες, ένα καρπούζι και μισό κιλό φράουλες, και πλήρωσα μόνο εννέα ευρώ! Στη λαϊκή πληρώνεις μόνο με μετρητά, γι' αυτό παίρνω πάντα ψιλά μαζί μου.

      Ροδάνθη
    glosses:
      - text: λαχανικά
        russian: овощи
  - type: exercise
    id: market-tf
    about: market
    title: Чтение 1 — верно или неверно
    instruction: Прочитайте текст. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η λαϊκή είναι κοντά στο σπίτι της Ροδάνθης.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "В тексте нет слова κοντά, но сказано то же другими словами: Δεν είναι μακριά, γι' αυτό πηγαίνω με τα πόδια. Верное утверждение часто пересказывает текст, а не повторяет его."
      - id: q2
        prompt: Η κυρία Ανδρούλα ψωνίζει από πολλούς πωλητές.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Εκείνη ψωνίζει πάντα από τον ίδιο πωλητή — всегда у одного продавца. Ходит и смотрит цены сама Роданфи (εγώ προτιμώ…). Ловушка — другой человек: проверяйте, о ком утверждение."
      - id: q3
        prompt: Στη λαϊκή τα φρούτα είναι πιο ακριβά από το σούπερ μάρκετ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Πιο φρέσκα και πιο φτηνά από το σούπερ μάρκετ — свежее и дешевле. В утверждении то же сравнение πιο … από, но с противоположным словом (ακριβός / φτηνός)."
      - id: q4
        prompt: Την περασμένη Τετάρτη η Ροδάνθη πλήρωσε εννέα ευρώ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "…και πλήρωσα μόνο εννέα ευρώ. Сравните все детали: день (την περασμένη Τετάρτη), сумма (εννέα) — совпадают."
      - id: q5
        prompt: Στη λαϊκή μπορείς να πληρώσεις με κάρτα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Πληρώνεις μόνο με μετρητά — только наличными. Слово μόνο исключает карту; поэтому она и берёт с собой мелочь (ψιλά)."
  - type: reading
    id: museum
    title: Μουσείο της Πόλης — πληροφορίες
    text: |-
      Το μουσείο είναι ανοιχτό κάθε μέρα εκτός από τη Δευτέρα, από τις εννέα το πρωί μέχρι τις πέντε το απόγευμα. Την Κυριακή κλείνει στη μία το μεσημέρι.

      Το εισιτήριο κοστίζει πέντε ευρώ. Για φοιτητές και συνταξιούχους κοστίζει τρία ευρώ, και για παιδιά είναι δωρεάν.

      Στον πρώτο όροφο υπάρχουν παλιά ρούχα και φωτογραφίες της πόλης, και στον δεύτερο όροφο έπιπλα από παλιά σπίτια.

      Κάθε Σάββατο στις έντεκα το πρωί έχουμε ξενάγηση στα ελληνικά και στα αγγλικά.

      Μπορείτε να φωτογραφίζετε, αλλά μην τρώτε και μην πίνετε μέσα στο μουσείο.
    glosses:
      - text: εκτός από
        russian: кроме
      - text: δωρεάν
        russian: бесплатно
      - text: έπιπλα
        russian: мебель
  - type: exercise
    id: museum-match
    about: museum
    title: Чтение 2 — части предложений
    instruction: Прочитайте информацию музея. Закончите каждое предложение по тексту. Два окончания лишние.
    format: match
    bank:
      - είναι κλειστό.
      - στη μία το μεσημέρι.
      - στις πέντε το απόγευμα.
      - τρία ευρώ.
      - πέντε ευρώ.
      - στον πρώτο όροφο.
      - κάθε Σάββατο στις έντεκα.
    items:
      - id: m1
        prompt: Τη Δευτέρα το μουσείο…
        answer: είναι κλειστό.
        explanation: "Ανοιχτό κάθε μέρα εκτός από τη Δευτέρα — открыт каждый день, кроме понедельника, значит, в понедельник закрыт. Слова κλειστό в тексте нет: ответ надо вывести."
      - id: m2
        prompt: Την Κυριακή το μουσείο κλείνει…
        answer: στη μία το μεσημέρι.
        explanation: "Την Κυριακή κλείνει στη μία το μεσημέρι. Лишнее «στις πέντε το απόγευμα» — время закрытия в остальные дни: оно из текста и грамматически подходит, но говорит о других днях."
      - id: m3
        prompt: Για έναν φοιτητή το εισιτήριο κοστίζει…
        answer: τρία ευρώ.
        explanation: "Για φοιτητές… τρία ευρώ. Лишнее «πέντε ευρώ» — обычный билет. Когда в тексте две цены, ищите, к кому относится каждая."
      - id: m4
        prompt: Τα παλιά ρούχα είναι…
        answer: στον πρώτο όροφο.
        explanation: "Στον πρώτο όροφο υπάρχουν παλιά ρούχα — по-русски это второй этаж. На втором греческом этаже (στον δεύτερο όροφο) — мебель."
      - id: m5
        prompt: Η ξενάγηση είναι…
        answer: κάθε Σάββατο στις έντεκα.
        explanation: "Κάθε Σάββατο στις έντεκα το πρωί έχουμε ξενάγηση. «Στη μία το μεσημέρι» и «στις πέντε το απόγευμα» грамматически тоже встают после «Η ξενάγηση είναι…», но в тексте эти часы — о закрытии музея, а не об экскурсии. Отвечает только текст, а не грамматика."
  - type: reading
    id: bike
    title: Με το ποδήλατο στη δουλειά
    text: |-
      Μένω στη Λάρνακα και δουλεύω σε ένα γραφείο στο κέντρο. Μέχρι πέρσι πήγαινα στη δουλειά με το αυτοκίνητο, αλλά το πρωί έχει πολλή κίνηση, και η διαδρομή έκανε σχεδόν μισή ώρα. Τον Σεπτέμβριο αγόρασα ένα παλιό ποδήλατο από έναν συνάδελφο, για ογδόντα ευρώ. Τώρα φτάνω στη δουλειά σε δεκαπέντε λεπτά, και δεν ψάχνω θέση για το αυτοκίνητο.

      Το καλοκαίρι είναι λίγο δύσκολο, γιατί κάνει ζέστη, γι' αυτό παίρνω μαζί μου ένα καθαρό μπλουζάκι. Όταν βρέχει, πηγαίνω με το λεωφορείο. Η γυναίκα μου λέει ότι τώρα είμαι πιο υγιής, και έχασα και τρία κιλά!

      Μάριος
    glosses:
      - text: σχεδόν
        russian: почти
  - type: exercise
    id: bike-choice
    about: bike
    title: Чтение 3 — выбор из четырёх
    instruction: Прочитайте текст и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Γιατί ο Μάριος δεν πηγαίνει τώρα με το αυτοκίνητο στη δουλειά;
        options:
          - Γιατί το αυτοκίνητό του είναι χαλασμένο.
          - Γιατί το πρωί έχει πολλή κίνηση.
          - Γιατί το γραφείο είναι κοντά στο σπίτι του.
          - Γιατί η γυναίκα του παίρνει το αυτοκίνητο.
        answer: Γιατί το πρωί έχει πολλή κίνηση.
        explanation: "…αλλά το πρωί έχει πολλή κίνηση. Остальные варианты звучат правдоподобно, но в тексте их нет: про поломку и про жену с машиной не сказано ничего. Нет в тексте — неверно."
      - id: q2
        prompt: Από ποιον αγόρασε ο Μάριος το ποδήλατο;
        options:
          - Από ένα μαγαζί στο κέντρο.
          - Από τον γείτονά του.
          - Από έναν συνάδελφο.
          - Από τη γυναίκα του.
        answer: Από έναν συνάδελφο.
        explanation: "Αγόρασα ένα παλιό ποδήλατο από έναν συνάδελφο. Ловушка «στο κέντρο»: в центре его офис, а не магазин."
      - id: q3
        prompt: Πόση ώρα κάνει τώρα η διαδρομή με το ποδήλατο;
        options:
          - Πέντε λεπτά.
          - Δεκαπέντε λεπτά.
          - Μισή ώρα.
          - Μία ώρα.
        answer: Δεκαπέντε λεπτά.
        explanation: "Τώρα φτάνω στη δουλειά σε δεκαπέντε λεπτά. Μισή ώρα — так было раньше, на машине (έκανε — прошедшее время). Когда в тексте два числа, смотрите на время глагола: τώρα или πριν."
      - id: q4
        prompt: Τι κάνει ο Μάριος, όταν βρέχει;
        options:
          - Μένει στο σπίτι.
          - Πηγαίνει με το αυτοκίνητο.
          - Πηγαίνει με τα πόδια.
          - Παίρνει το λεωφορείο.
        answer: Παίρνει το λεωφορείο.
        explanation: "Όταν βρέχει, πηγαίνω με το λεωφορείο. Верный вариант пересказан: πηγαίνω με το λεωφορείο = παίρνω το λεωφορείο (παίρνω — садиться на транспорт, модуль 13)."
      - id: q5
        prompt: Τι λέει η γυναίκα του Μάριου;
        options:
          - Ότι το ποδήλατο ήταν ακριβό.
          - Ότι το καλοκαίρι είναι δύσκολο.
          - Ότι τώρα είναι πιο υγιής.
          - Ότι πρέπει να αγοράσει καινούργιο ποδήλατο.
        answer: Ότι τώρα είναι πιο υγιής.
        explanation: "Η γυναίκα μου λέει ότι τώρα είμαι πιο υγιής. «Το καλοκαίρι είναι δύσκολο» тоже есть в тексте, но это говорит сам Марьос, а не жена. Ловушка — верные слова, другой человек."
  - type: reading
    id: dentist
    title: Το ραντεβού σας με τον οδοντίατρο
    text: |-
      Αγαπητή κυρία Σολομωνίδου,

      Σας γράφουμε για το (1) ___ σας με τον οδοντίατρο, τον κύριο Πετρίδη, την Πέμπτη δέκα Ιουνίου, στις (2) ___ και μισή το απόγευμα. Το ιατρείο είναι στην οδό Ιφιγένειας δεκατέσσερα, στον δεύτερο όροφο. Παρακαλούμε να έρθετε δέκα λεπτά πριν από την ώρα σας.

      Είναι η πρώτη σας φορά στο ιατρείο μας, γι' αυτό μην ξεχάσετε να φέρετε την (3) ___ σας.

      (4) ___ δεν μπορείτε να έρθετε, πάρτε μας τηλέφωνο μέχρι την Τρίτη, για να δώσουμε την ώρα σας σε έναν άλλο (5) ___.

      Με εκτίμηση,
      Λουκία Ζαχαρίου, γραμματέας
  - type: exercise
    id: dentist-gap
    about: dentist
    title: Чтение 4 — пропуски
    instruction: Прочитайте письмо и вставьте слова. Каждое слово — один раз; три слова лишние.
    format: gap
    bank:
      - ραντεβού
      - τέσσερις
      - τέσσερα
      - ταυτότητα
      - ταυτότητες
      - Αν
      - ασθενή
      - ασθενείς
    items:
      - id: g1
        prompt: (1) Σας γράφουμε για το ___ σας με τον οδοντίατρο.
        answer: ραντεβού
        explanation: "Το ραντεβού — запись на приём (модуль 18). Перед пропуском το — нужно слово среднего рода в единственном числе; из банка подходит только ραντεβού."
      - id: g2
        prompt: (2) …την Πέμπτη δέκα Ιουνίου, στις ___ και μισή το απόγευμα.
        answer: τέσσερις
        explanation: "О времени — женский род (η ώρα): στις τέσσερις. Τέσσερα — средний род: τέσσερα ευρώ, τέσσερα παιδιά (модуль 04). Перед пропуском στις — это и есть подсказка."
      - id: g3
        prompt: (3) …γι' αυτό μην ξεχάσετε να φέρετε την ___ σας.
        answer: ταυτότητα
        explanation: "Την — единственное число, поэтому ταυτότητα, а не ταυτότητες (мн. ч. — τις ταυτότητες). Близнецы в банке проверяются по артиклю."
      - id: g4
        prompt: (4) ___ δεν μπορείτε να έρθετε, πάρτε μας τηλέφωνο μέχρι την Τρίτη.
        answer: Αν
        explanation: "Условие «если» — αν: Αν δεν μπορείτε…, πάρτε μας τηλέφωνο (модули 10, 21). Заглавная буква в банке — тоже подсказка: слово стоит в начале предложения."
      - id: g5
        prompt: (5) …για να δώσουμε την ώρα σας σε έναν άλλο ___.
        answer: ασθενή
        explanation: "Έναν άλλο — один, мужской род, винительный падеж: σε έναν άλλο ασθενή (ο ασθενής → τον ασθενή, как ο πελάτης → τον πελάτη). Ασθενείς — множественное число, после έναν не подходит."
  - type: explanation
    id: listening-how
    title: Аудирование — четыре типа заданий
    body: |-
      Каждая запись звучит два раза. Общие правила:

      - **До записи прочитайте все пункты** и угадайте, что придётся услышать: число, день, время, место, человека. Тогда ухо ждёт нужное слово.
      - **Первое прослушивание** — отметьте ответы, даже неуверенные. **Второе** — проверяйте только сомнительные.
      - **Не застревайте на незнакомом слове**: запись не остановится. Пропустите его и слушайте дальше — ответ часто звучит через фразу.
      - **Числа и время** записывайте сразу цифрами, прямо во время записи.
      - В записи почти всегда звучат **два варианта** — два дня, две цены, сначала одно предложение, потом другое. Верный — тот, на котором говорящие остановились.
    table:
      columns:
        - задание
        - как делать
        - типичная ловушка
      rows:
        - - Описания и картинки (есть лишние)
          - До записи назовите про себя по-гречески, что на каждой картинке — место, погода, одежда, действие
          - Человек упоминает и то, что на лишней картинке, — но это было вчера, будет потом или у другого. Нужно то, что происходит сейчас
        - - Выбор из трёх (диалог)
          - Следите, кто что говорит и на чём договорились. Ответ часто в последних репликах
          - Первое предложение отвергнуто («Όχι…», «Δυστυχώς…»); один говорит «не могу», и делает другой
        - - Верно / неверно (монолог)
          - Пункты идут по порядку записи. Слушайте детали — день, час, цену, δεν, μόνο, όλοι
          - Звучит то же слово, но с другой деталью — «σε μισή ώρα» вместо «и половина»; «со следующей недели» вместо «в это воскресенье»
        - - Заметки (формальный диалог)
          - По подписи пункта решите, что писать — город, цвет, время, телефон. Пишите коротко, числа цифрами. В курсе можно отвечать и по-русски, на экзамене — только по-гречески или цифрами
          - Сведения уточняются или исправляются в конце разговора — записывайте последний вариант
  - type: listening
