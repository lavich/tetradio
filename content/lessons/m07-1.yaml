    items:
      - id: q1
        prompt: — Πού είναι τα κλειδιά μου; —
        options:
          - Είναι πάνω στο τραπέζι.
          - Είναι μαύρο.
          - Είναι καινούργιο.
        answer: Είναι πάνω στο τραπέζι.
        explanation: Πού — «где?», поэтому ответ — место.
      - id: q2
        prompt: — Τι χρώμα είναι ο καναπές; —
        options:
          - Είναι μεγάλος.
          - Είναι μπλε.
          - Είναι στο σαλόνι.
        answer: Είναι μπλε.
      - id: q3
        prompt: — Είναι καινούργιο ή παλιό; —
        options:
          - Είναι πράσινο.
          - Είναι παλιό.
          - Είναι στην κουζίνα.
        answer: Είναι παλιό.
      - id: q4
        prompt: — Τι χρώμα είναι η ντουλάπα; —
        options:
          - Είναι άσπρος.
          - Είναι άσπρη.
          - Είναι άσπρο.
        answer: Είναι άσπρη.
        explanation: Цвет согласуется с вещью — η ντουλάπα, значит άσπρη.
  - type: exercise
