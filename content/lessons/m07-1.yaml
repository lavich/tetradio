        explanation: Το κλειδί — средний род; артикль после αυτό нужен.
      - id: q4
        prompt: «тот диван»
        options:
          - εκείνος ο καναπές
          - εκείνο ο καναπές
          - εκείνος καναπές
        answer: εκείνος ο καναπές
  - type: exercise
    id: phrases-choice
    title: Вопрос и ответ
