          - παλιά
          - παλιό
        - - мн. ч.
          - παλιοί
          - παλιές
          - παλιά
  - type: explanation
    id: colors
    title: Цвета
    body: |-
      Цвет — тоже прилагательное и согласуется с вещью: ο καναπές είναι **άσπρος**, η καρέκλα είναι **άσπρη**, το ψυγείο είναι **άσπρο**, οι καρέκλες είναι **άσπρες**.

      Вопрос о цвете — **Τι χρώμα είναι;** («Какого это цвета?», дословно «Какой цвет есть?»). Можно добавить вещь: Τι χρώμα είναι ο καναπές; Ответ согласуйте с вещью: — Τι χρώμα είναι η ντουλάπα; — Είναι **μαύρη**.

      **Είναι καινούργιο ή παλιό;** — «Это новое или старое?». Прилагательное здесь среднего рода, потому что имеется в виду «это» (αυτό). О диване спросят: Είναι καινούργιος ή παλιός;
    table:
      columns:
