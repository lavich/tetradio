  - type: explanation
    id: adjectives
    title: Прилагательные -ος/-η/-ο и согласование
    body: |-
      Прилагательное согласуется с существительным в роде и числе — как в русском: большой диван, большая кровать. Но греческий род слова часто не совпадает с русским: **το** κρεβάτι (кровать) — средний род, **η** ντουλάπα (шкаф) — женский. Поэтому смотрите на греческий артикль.

      Основной тип — **-ος / -η / -ο**: ο καναπές είναι **μεγάλος**, η ντουλάπα είναι **μεγάλη**, το κρεβάτι είναι **μεγάλο**. Во множественном числе — **-οι / -ες / -α**: οι καναπέδες είναι μεγάλοι, οι ντουλάπες είναι μεγάλες, τα κρεβάτια είναι μεγάλα. Окончания почти такие же, как у существительных.

      После гласной и в словах на **-ιος** в женском роде вместо -η пишется **-α**: καινούργιος → **καινούργια**, παλιός → **παλιά**, ωραίος → **ωραία**. Не путайте: καινούργια — это и «новая» (ж. р. ед. ч.), и «новые» (ср. р. мн. ч.): η καινούργια ντουλάπα, τα καινούργια κρεβάτια.

      Слово **μπλε** (синий) не изменяется совсем: ο μπλε καναπές, η μπλε ντουλάπα, τα μπλε κρεβάτια.

      Прилагательное стоит **между артиклем и существительным**: ο **μεγάλος** καναπές — «большой диван», или после είναι: ο καναπές είναι μεγάλος — «диван большой». Если прилагательных два, между ними ставят και: ένα μεγάλο και άσπρο ψυγείο.
    table:
      columns:
        - число
        - м. р.
        - ж. р.
        - ср. р.
      rows:
        - - ед. ч.
          - μεγάλος
          - μεγάλη
          - μεγάλο
        - - мн. ч.
          - μεγάλοι
          - μεγάλες
          - μεγάλα
        - - ед. ч.
