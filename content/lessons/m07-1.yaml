blocks:
  - type: explanation
    id: plural
    title: Множественное число существительных
    body: |-
      В модуле 06 вы описывали квартиру: το δωμάτιο, η κουζίνα, το τραπέζι. Теперь вещей в доме становится много — нужно множественное число.

      **Артикль.** Во множественном числе у мужского и женского рода один артикль — **οι** [и], у среднего — **τα**: ο καναπές → **οι** καναπέδες, η καρέκλα → **οι** καρέκλες, το κλειδί → **τα** κλειδιά.

      **Окончание** зависит от рода и окончания в единственном числе. Для A2 хватает шести основных типов — они в таблице. Самое частое правило: мужской род **-ος → -οι**, женский **-α, -η → -ες**, средний **-ο → -α**, **-ι → -ια**, **-μα → -ματα**.

      **Чтение.** В окончании -ια звук [и] сливается со следующей гласной в один слог: κρεβάτια [крэва́тья], κλειδιά [клиðья́], σπίτια [спи́тья].

      **Ударение** обычно остаётся на том же слоге: η ντουλάπα → οι ντουλάπες, το ψυγείο → τα ψυγεία. Но ударение не может стоять дальше третьего слога от конца, поэтому в длинной форме оно сдвигается вправо: το όνομα → τα ονόματα, το διαμέρισμα → τα διαμερίσματα.

      Запомните два особых случая: ο καναπές → οι **καναπέδες** (мужской род на ударное -ές получает -έδες) и **η πόλη → οι πόλεις**. Слово **το ντους** не изменяется: τα ντους.
    table:
      columns:
        - единственное число
        - множественное число
        - тип
      rows:
        - - ο φίλος, ο φούρνος
          - οι φίλοι, οι φούρνοι
          - м. р. -ος → -οι
        - - ο άντρας, ο πατέρας
          - οι άντρες, οι πατέρες
          - м. р. -ας → -ες
        - - η καρέκλα, η ντουλάπα, η φίλη
          - οι καρέκλες, οι ντουλάπες, οι φίλες
          - ж. р. -α, -η → -ες
        - - το ψυγείο, το πλυντήριο, το δωμάτιο
          - τα ψυγεία, τα πλυντήρια, τα δωμάτια
          - ср. р. -ο → -α
        - - το κλειδί, το κρεβάτι, το σπίτι
          - τα κλειδιά, τα κρεβάτια, τα σπίτια
          - ср. р. -ι → -ια
        - - το χρώμα, το όνομα
          - τα χρώματα, τα ονόματα
          - ср. р. -μα → -ματα
        - - ο καναπές
          - οι καναπέδες
          - м. р. -ές → -έδες
  - type: exercise
    id: plural-choice
    title: Одна вещь — много вещей
    instruction: Выберите форму множественного числа.
    format: choice
    items:
      - id: q1
        prompt: η καρέκλα (стул)
        options:
          - οι καρέκλοι
          - οι καρέκλες
          - τα καρέκλα
        answer: οι καρέκλες
        explanation: Женский род на -α → -ες, артикль οι.
      - id: q2
        prompt: το ψυγείο (холодильник)
        options:
          - τα ψυγεία
          - οι ψυγείοι
          - τα ψυγείες
        answer: τα ψυγεία
        explanation: Средний род на -ο → -α, артикль τα.
      - id: q3
        prompt: το κρεβάτι (кровать)
        options:
          - τα κρεβάτα
          - οι κρεβάτιες
          - τα κρεβάτια
        answer: τα κρεβάτια
        explanation: Средний род на -ι → -ια. Слово κρεβάτι среднего рода, хотя русская «кровать» — женского.
      - id: q4
        prompt: ο φούρνος (духовка)
        options:
          - οι φούρνες
          - οι φούρνοι
          - τα φούρνα
        answer: οι φούρνοι
        explanation: Мужской род на -ος → -οι.
      - id: q5
        prompt: ο καναπές (диван)
        options:
          - οι καναπέδες
          - οι καναπέοι
          - οι καναπές
        answer: οι καναπέδες
        explanation: Особый тип -ές → -έδες.
      - id: q6
        prompt: το χρώμα (цвет)
        options:
          - τα χρώμα
          - τα χρώμες
          - τα χρώματα
        answer: τα χρώματα
        explanation: Средний род на -μα → -ματα.
      - id: q7
        prompt: η ντουλάπα (шкаф)
        options:
          - οι ντουλάπες
          - οι ντουλάποι
          - τα ντουλάπια
        answer: οι ντουλάπες
        explanation: Η ντουλάπα — женского рода, хотя «шкаф» по-русски мужского. Смотрите на артикль, а не на русский перевод.
      - id: q8
        prompt: το κλειδί (ключ)
        options:
          - τα κλειδά
          - τα κλειδιά
          - οι κλειδοί
        answer: τα κλειδιά
        explanation: -ι → -ια; ударение остаётся на конце — κλειδιά [клиðья́].
      - id: q9
        prompt: ο άντρας (мужчина)
        options:
          - οι άντροι
          - οι άντρες
          - τα άντρα
        answer: οι άντρες
        explanation: Мужской род на -ας → -ες.
