  - type: explanation
    id: aftos
    title: Αυτός, αυτή, αυτό — «этот»; εκείνος — «тот»
    body: |-
      Вы уже знаете αυτός, αυτή, αυτό как «он, она, оно». Перед существительным они значат **«этот, эта, это»**, и тогда **артикль остаётся**: **αυτός ο** καναπές — «этот диван», **αυτή η** καρέκλα — «этот стул», **αυτό το** κλειδί — «этот ключ». Без артикля (αυτός καναπές) сказать нельзя.

      Во множественном числе: **αυτοί οι** καναπέδες, **αυτές οι** καρέκλες, **αυτά τα** κλειδιά — «эти».

      **Εκείνος, εκείνη, εκείνο** — «тот, та, то» — о том, что дальше; изменяется так же и тоже с артиклем: εκείνη η ντουλάπα — «тот шкаф», εκείνα τα κρεβάτια — «те кровати».

      Русское «это» в начале предложения — **αυτό**, а о нескольких вещах — **αυτά**: **Τι είναι αυτό;** — Είναι ένα κλειδί. **Αυτά είναι τα κλειδιά μου.** — «Это мои ключи».

      Где вещи? **Πού είναι τα κλειδιά μου;** — «Где мои ключи?» — **Είναι πάνω στο τραπέζι.** — «Они на столе». Είναι здесь значит «они есть»: форма та же, что для «он/она».
    table:
      columns:
        - род
        - ед. ч.
        - мн. ч.
      rows:
        - - м. р.
          - αυτός ο καναπές / εκείνος ο καναπές
          - αυτοί οι καναπέδες / εκείνοι οι καναπέδες
        - - ж. р.
          - αυτή η καρέκλα / εκείνη η καρέκλα
          - αυτές οι καρέκλες / εκείνες οι καρέκλες
        - - ср. р.
          - αυτό το κλειδί / εκείνο το κλειδί
          - αυτά τα κλειδιά / εκείνα τα κλειδιά
