title: Контрольная модуля 15
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, прошедшее время, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. После модуля 15 будет первый полный пробный экзамен M1 — пояснения после ответа подскажут, что повторить.
  - type: reading
    id: alexandra
    title: Η δουλειά μου
    text: |-
      Με λένε Αλεξάνδρα και είμαι κομμώτρια. Πριν από δέκα χρόνια πήγα στην Αθήνα και δούλεψα εκεί τρία χρόνια σε ένα μεγάλο κομμωτήριο. Μετά γύρισα στη Λεμεσό. Πέρσι έκανα κάτι καινούργιο: άνοιξα το δικό μου μαγαζί.

      Τώρα δουλεύω από τις εννέα μέχρι τις επτά, και το Σάββατο μέχρι τις τρεις. Την Κυριακή δεν δουλεύω. Στο μαγαζί δουλεύουν και δύο συνάδελφοι, η Ρένα και ο Άρης. Η δουλειά μου είναι κουραστική, αλλά πολύ ενδιαφέρουσα. Χθες είχα δώδεκα πελάτες και δεν έφαγα μεσημεριανό!

      Τον Αύγουστο έκλεισα το μαγαζί για μια εβδομάδα και πήγαμε με την οικογένειά μου στην Πάφο.
    glosses:
      - text: κομμωτήριο
        russian: парикмахерская
      - text: άνοιξα
        russian: открыла (ανοίγω → άνοιξα)
      - text: έκλεισα
        russian: закрыла (κλείνω → έκλεισα)
  - type: exercise
    id: alexandra-tf
    about: alexandra
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Αλεξάνδρα δούλεψε τρία χρόνια στην Αθήνα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Η Αλεξάνδρα έχει το δικό της μαγαζί εδώ και δέκα χρόνια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Десять лет назад она уехала в Афины, а свою парикмахерскую открыла в прошлом году (πέρσι).
      - id: q3
        prompt: Το Σάββατο δουλεύει μέχρι τις επτά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: До семи — в будни; в субботу — μέχρι τις τρεις.
      - id: q4
        prompt: Η Αλεξάνδρα έχει δύο συναδέλφους στο μαγαζί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Η Ρένα και ο Άρης.
      - id: q5
        prompt: Για την Αλεξάνδρα η δουλειά είναι εύκολη.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η δουλειά μου είναι κουραστική — утомительная.
      - id: q6
        prompt: Χθες η Αλεξάνδρα έφαγε μεσημεριανό με τους πελάτες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν έφαγα μεσημεριανό — она вообще не обедала.
      - id: q7
        prompt: Τον Αύγουστο το μαγαζί ήταν κλειστό μια εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: listening
    id: new-job
    title: Η καινούργια δουλειά
    plays: 2
    transcript:
      - speaker: Κατερίνα
        text: Γεια σου, Άρη! Τι κάνεις; Πώς ήταν η συνέντευξη;
      - speaker: Άρης
        text: Γεια σου, Κατερίνα! Πολύ καλά. Με προσέλαβαν!
      - speaker: Κατερίνα
        text: Μπράβο! Πού;
      - speaker: Άρης
        text: Σε ένα εργοστάσιο στη Λευκωσία. Είμαι ηλεκτρολόγος εκεί.
      - speaker: Κατερίνα
        text: Και πότε ξεκινάς;
      - speaker: Άρης
        text: Ξεκίνησα χθες! Η πρώτη μέρα ήταν λίγο κουραστική, αλλά οι συνάδελφοι είναι πολύ καλοί.
      - speaker: Κατερίνα
        text: Και το ωράριο;
      - speaker: Άρης
        text: Δουλεύω βάρδιες. Αυτή την εβδομάδα έχω πρωινή βάρδια, από τις έξι μέχρι τις δύο.
      - speaker: Κατερίνα
        text: Από τις έξι; Πολύ νωρίς!
      - speaker: Άρης
        text: Ναι, αλλά στις δύο και μισή είμαι στο σπίτι. Και ο μισθός είναι καλός, χίλια εξακόσια ευρώ.
      - speaker: Κατερίνα
        text: Ωραία! Το Σάββατο πάμε για καφέ;
      - speaker: Άρης
        text: Το Σάββατο δουλεύω. Την Κυριακή;
      - speaker: Κατερίνα
        text: Ναι, την Κυριακή!
  - type: exercise
    id: new-job-choice
    about: new-job
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Чем закончилось собеседование Ариса?
        options:
          - Его взяли на работу.
          - Ему отказали.
          - Собеседование будет завтра.
        answer: Его взяли на работу.
        explanation: Με προσέλαβαν! — «Меня взяли!»
      - id: q2
        prompt: Τι δουλειά κάνει ο Άρης;
        options:
          - Είναι ηλεκτρολόγος.
          - Είναι μηχανικός.
          - Είναι λογιστής.
        answer: Είναι ηλεκτρολόγος.
      - id: q3
        prompt: Πότε ξεκίνησε ο Άρης τη δουλειά;
        options:
          - Χθες.
          - Σήμερα.
          - Αύριο.
        answer: Χθες.
      - id: q4
        prompt: Τι ώρα τελειώνει η πρωινή βάρδια;
        options:
          - Στις δύο.
          - Στις δύο και μισή.
          - Στις έξι.
        answer: Στις δύο.
        explanation: "Смена — από τις έξι μέχρι τις δύο. Ловушка: в половине третьего Арис уже дома."
      - id: q5
        prompt: Когда друзья встретятся?
        options:
          - в субботу
          - в воскресенье
          - сегодня вечером
        answer: в воскресенье
        explanation: В субботу Арис работает, поэтому — την Κυριακή.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Χθες (εγώ) ___ στη δουλειά με ταξί.
        options:
          - πήγα
          - πηγαίνω
          - πήγε
        answer: πήγα
      - id: q2
        prompt: Πέρσι η Ελένη ___ άνεργη.
        options:
          - ήταν
          - ήμουν
          - είναι
        answer: ήταν
      - id: q3
        prompt: — Τι ___ (εσύ) χθες; — Τίποτα.
        options:
          - έκανες
          - κάνεις
          - έκανε
        answer: έκανες
      - id: q4
        prompt: Οι συνάδελφοί μου ___ στην Κύπρο πριν από ένα χρόνο.
        options:
          - ήρθαν
          - ήρθε
          - έρχονται
        answer: ήρθαν
      - id: q5
        prompt: Η Μαρία είναι ___ σε μια εταιρεία.
        options:
          - λογίστρια
          - λογιστής
          - λογιστές
        answer: λογίστρια
      - id: q6
        prompt: Δουλεύω σε αυτή την εταιρεία ___ τρία χρόνια (и работаю сейчас).
        options:
          - εδώ και
          - πριν από
        answer: εδώ και
        explanation: Εδώ και + настоящее — «уже три года». Πριν από — «три года назад».
      - id: q7
        prompt: Χθες (εγώ) ___ το βιογραφικό μου στην εταιρεία.
        options:
          - έστειλα
          - στέλνω
          - έστειλε
        answer: έστειλα
  - type: exercise
    id: past-write
    graded: true
    title: Прошедшее время
    instruction: Поставьте глагол в скобках в прошедшее время.
    format: text
    items:
      - id: q1
        prompt: Χθες (εγώ) ___ τον διευθυντή. (βλέπω)
        answer:
          - είδα
      - id: q2
        prompt: Πέρσι ο Νίκος ___ δουλειά. (βρίσκω)
        answer:
          - βρήκε
      - id: q3
        prompt: Χθες (εμείς) ___ στην ταβέρνα. (τρώω)
        answer:
          - φάγαμε
        explanation: В форме «мы» έ- исчезает — φάγαμε.
      - id: q4
        prompt: Η Άννα ___ «όχι». (λέω)
        answer:
          - είπε
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - ο μισθός
      - η βάρδια
      - η συνέντευξη
      - το βιογραφικό
      - ο συνάδελφος
      - η σύσκεψη
      - η άδεια
      - η εμπειρία
      - το ωράριο
      - ο εργοδότης
    items:
      - id: m1
        prompt: зарплата
        answer: ο μισθός
      - id: m2
        prompt: смена
        answer: η βάρδια
      - id: m3
        prompt: собеседование
        answer: η συνέντευξη
      - id: m4
        prompt: резюме
        answer: το βιογραφικό
      - id: m5
        prompt: коллега
        answer: ο συνάδελφος
      - id: m6
        prompt: совещание
        answer: η σύσκεψη
      - id: m7
        prompt: отпуск
        answer: η άδεια
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: На собеседовании вас спрашивают об опыте работы.
        options:
          - Έχω τρία χρόνια εμπειρία στις πωλήσεις.
          - Πόσα χρόνια εμπειρία έχετε;
          - Πόσος είναι ο μισθός;
        answer: Έχω τρία χρόνια εμπειρία στις πωλήσεις.
      - id: q2
        prompt: Вы хотите узнать, какая будет зарплата.
        options:
          - Πόσος είναι ο μισθός;
          - Πότε μπορείτε να ξεκινήσετε;
          - Τι δουλειά κάνετε;
        answer: Πόσος είναι ο μισθός;
      - id: q3
        prompt: В письме работодателю вы прикладываете резюме.
        options:
          - Σας στέλνω το βιογραφικό μου.
          - Πήρα άδεια για μια εβδομάδα.
          - Μου αρέσουν οι συνάδελφοί μου.
        answer: Σας στέλνω το βιογραφικό μου.
      - id: q4
        prompt: Вы работаете четыре часа в день.
        options:
          - Δουλεύω με μερική απασχόληση.
          - Δουλεύω με πλήρες ωράριο.
          - Είμαι συνταξιούχος.
        answer: Δουλεύω με μερική απασχόληση.
      - id: q5
        prompt: Работодатель спрашивает, когда вы можете выйти на работу.
        options:
          - Πότε μπορείτε να ξεκινήσετε;
          - Πόσα χρόνια εμπειρία έχετε;
          - Είδα την αγγελία σας στο ίντερνετ.
        answer: Πότε μπορείτε να ξεκινήσετε;
