blocks:
  - type: explanation
    id: meeting
    title: Как договориться о встрече
    body: |-
      **Είσαι ελεύθερος το Σάββατο;** — «Ты свободен в субботу?». Женщине — **ελεύθερη**: Είσαι ελεύθερη την Παρασκευή; На «вы» — Είστε ελεύθερος / ελεύθερη;

      **Πότε βρισκόμαστε;** — «Когда встречаемся?», **Πού βρισκόμαστε;** — «Где встречаемся?». Предложить время можно тем же глаголом: **Βρισκόμαστε στις έξι;** — «Встречаемся в шесть?».

      Отказаться вежливо: **Δεν μπορώ την Τρίτη.** — «Во вторник я не могу». Сразу предложите другое: Μπορώ την Τετάρτη. Согласиться: **Ναι, μπορώ.** или **Εντάξει!** — «Хорошо, договорились!». Попрощаться: **Τα λέμε αύριο στις έξι.** — «Увидимся завтра в шесть».

      О планах на ближайшие дни греки, как и мы, говорят в настоящем времени: **Αύριο δουλεύω.** — «Завтра я работаю». **Πάμε** — «пойдём», форма от πάω (πηγαίνω): **Πάμε για καφέ;** — «Пойдём на кофе?».
    table:
      columns:
        - вопрос
        - ответ
      rows:
        - - Είσαι ελεύθερη το Σάββατο;
          - Ναι, είμαι ελεύθερη. / Όχι, δουλεύω.
        - - Πότε βρισκόμαστε;
          - Την Κυριακή στις πέντε.
        - - Πού βρισκόμαστε;
          - Στο καφέ «Λέμον».
        - - Βρισκόμαστε την Τρίτη;
          - Δεν μπορώ την Τρίτη. Μπορώ την Τετάρτη.
        - - Στις επτά, εντάξει;
          - Εντάξει! Τα λέμε αύριο στις επτά.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: meeting-match
    title: Вопрос и ответ
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Ναι, είμαι ελεύθερος.
      - Την Πέμπτη στις οκτώ.
      - Στο καφέ «Λέμον».
      - Είναι έξι και μισή.
      - Κάνει δέκα ευρώ.
      - Σήμερα είναι Δευτέρα.
      - Είκοσι Οκτωβρίου.
      - Με λένε Νίκο.
    items:
      - id: m1
        prompt: Είσαι ελεύθερος το Σάββατο;
        answer: Ναι, είμαι ελεύθερος.
      - id: m2
        prompt: Πότε βρισκόμαστε;
        answer: Την Πέμπτη στις οκτώ.
        explanation: "Πότε — «когда?»: в ответе день и время."
      - id: m3
        prompt: Πού βρισκόμαστε;
        answer: Στο καφέ «Λέμον».
      - id: m4
        prompt: Τι ώρα είναι;
        answer: Είναι έξι και μισή.
      - id: m5
        prompt: Πόσο κάνει;
        answer: Κάνει δέκα ευρώ.
      - id: m6
        prompt: Τι ημερομηνία είναι σήμερα;
        answer: Είκοσι Οκτωβρίου.
        explanation: Ημερομηνία — дата, число. О дне недели спрашивают Τι μέρα είναι σήμερα;
  - type: exercise
    id: meeting-dialogue
    title: Диалог по телефону
    instruction: Дополните диалог. Две реплики лишние.
    format: gap
    bank:
      - Είσαι ελεύθερη
      - Δεν μπορώ
      - Πότε βρισκόμαστε
      - Πού βρισκόμαστε
      - Τα λέμε
      - Πόσο κάνει
      - Τι ώρα είναι
    items:
      - id: g1
        prompt: "Αντρέας: Γεια σου, Ελένη! ___ την Πέμπτη το βράδυ;"
        answer: Είσαι ελεύθερη
        explanation: Ελένη — женщина, поэтому ελεύθερη.
      - id: g2
        prompt: "Ελένη: ___ την Πέμπτη, δουλεύω. Αλλά την Παρασκευή είμαι ελεύθερη."
        answer: Δεν μπορώ
      - id: g3
        prompt: "Αντρέας: Ωραία! ___; — Ελένη: Στις οκτώ;"
        answer: Πότε βρισκόμαστε
      - id: g4
        prompt: "Αντρέας: Εντάξει. ___; — Ελένη: Στο καφέ «Λέμον»."
        answer: Πού βρισκόμαστε
      - id: g5
        prompt: "Αντρέας: ___ την Παρασκευή στις οκτώ!"
        answer: Τα λέμε
  - type: explanation
    id: writing-how
    title: Как написать сообщение о встрече
    body: |-
      На экзамене письменная часть начинается с дружеского текста — письма, сообщения, приглашения. Сейчас мы пишем 3–5 предложений; к модулю 05 текст вырастет до 40–60 слов.

      Хорошее сообщение о встрече отвечает на три вопроса: **когда** (день и время), **где**, **что делаем**. Схема: приветствие → предложение или ответ → день и время → место → прощание.

      Помните правила из модуля 01: печатные буквы, не целиком заглавными, тонос, вопросительный знак «;», придуманное имя вместо своего. Время пишите словами (στις έξι) или цифрами (στις 18:00) — оба варианта нормальны в сообщении.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - поздороваться
          - Γεια σου, Μαρία! / Γεια σου, Νίκο!
        - - спросить, свободен ли
          - Είσαι ελεύθερη / ελεύθερος το Σάββατο;
        - - отказаться
          - Δεν μπορώ την Τρίτη, γιατί δουλεύω.
        - - предложить
          - Πάμε για καφέ; / Βρισκόμαστε την Κυριακή;
        - - время и место
          - Στις πέντε το απόγευμα, στο καφέ «Λέμον».
        - - попрощаться
          - Τα λέμε! / Τα λέμε την Κυριακή!
  - type: exercise
    id: message-sentences
    title: Предложения для сообщения
    instruction: Напишите по-гречески.
    format: text
    items:
      - id: q1
        prompt: Ты свободна в пятницу? (женщине)
        answer:
          - Είσαι ελεύθερη την Παρασκευή;
          - Την Παρασκευή είσαι ελεύθερη;
      - id: q2
        prompt: В понедельник я не могу.
        answer:
          - Δεν μπορώ τη Δευτέρα.
          - Τη Δευτέρα δεν μπορώ.
        explanation: Перед δ артикль без ν — τη Δευτέρα.
      - id: q3
        prompt: Когда встречаемся?
        answer:
          - Πότε βρισκόμαστε;
      - id: q4
        prompt: Увидимся завтра в шесть.
        answer:
          - Τα λέμε αύριο στις έξι.
          - Τα λέμε στις έξι αύριο.
          - Αύριο στις έξι, τα λέμε.
      - id: q5
        prompt: В воскресенье в пять вечера. (о времени — «после обеда»)
        answer:
          - Την Κυριακή στις πέντε το απόγευμα.
          - Στις πέντε το απόγευμα την Κυριακή.
        explanation: 17:00 — это το απόγευμα; το βράδυ начинается примерно с 19–20 часов.
  - type: writing
    id: message
    register: friendly
    prompt: |-
      Ваш друг Νίκος пишет вам: «Γεια! Είσαι ελεύθερος / ελεύθερη το Σάββατο; Πάμε για καφέ;»

      Ответьте ему, 3–5 предложений: поздоровайтесь; скажите, что в субботу вы не можете, и почему (например, работаете); предложите другой день и время; назовите место; попрощайтесь.
    words:
      min: 15
      max: 50
    model: Γεια σου, Νίκο! Δεν μπορώ το Σάββατο, γιατί δουλεύω. Είσαι ελεύθερος την Κυριακή; Βρισκόμαστε στις πέντε το απόγευμα στο καφέ «Λέμον», στη Λάρνακα. Τα λέμε!
    criteria:
      - Есть дружеское приветствие (Γεια σου, Νίκο!) и прощание (Τα λέμε!)
      - "Сказано, что в субботу вы не можете: Δεν μπορώ το Σάββατο"
      - "Предложен другой день с артиклем: την Κυριακή, την Παρασκευή…"
      - "Названо время: στις + число (στις πέντε, στις έξι και μισή)"
      - Названо место встречи
      - Есть вопрос со знаком «;»; во всех словах из двух и больше слогов стоит тонос
      - Все формы на «ты» (είσαι, μπορείς), имена — придуманные
  - type: explanation
    id: speaking-how
    title: Вопросы экзаменатора о времени и датах
    body: |-
      В первой части устного экзамена спрашивают не только об имени и семье, но и о повседневном: какой сегодня день, во сколько вы встаёте, когда у вас день рождения. Экзаменатор говорит на «вы».

      Отвечайте полным предложением и повторяйте слово из вопроса: **Τι μέρα είναι σήμερα;** → **Σήμερα είναι Τετάρτη.** **Πότε έχετε γενέθλια;** («Когда у вас день рождения?») → **Έχω γενέθλια στις δώδεκα Μαΐου.**

      Номер телефона диктуйте парами — медленно и чётко. Номер, как и имя, можно придумать.
    table:
      columns:
        - вопрос
        - как ответить
      rows:
        - - Τι μέρα είναι σήμερα;
          - Σήμερα είναι …
        - - Τι ημερομηνία είναι σήμερα;
          - Σήμερα είναι … (число + месяц на -ου)
        - - Τι ώρα είναι τώρα;
          - Τώρα είναι …
        - - Πότε έχετε γενέθλια;
          - Έχω γενέθλια στις … (число + месяц на -ου)
        - - Ποιο είναι το τηλέφωνό σας;
          - Το τηλέφωνό μου είναι …
  - type: speaking
    id: interview
    part: interview
    prompt: |-
      Экзаменатор задаёт вопросы. Прочитайте каждый вопрос вслух и ответьте без подготовки, запишите ответы (γενέθλια — день рождения):
      Τι μέρα είναι σήμερα; Τι ημερομηνία είναι σήμερα; Τι ώρα είναι τώρα; Πότε έχετε γενέθλια; Ποιο είναι το τηλέφωνό σας;
    seconds: 60
    model: Σήμερα είναι Τετάρτη. Σήμερα είναι δεκατέσσερις Οκτωβρίου. Τώρα είναι έξι και τέταρτο. Έχω γενέθλια στις είκοσι τρεις Μαρτίου. Το τηλέφωνό μου είναι ενενήντα έξι, πενήντα δύο, δεκαοκτώ, σαράντα τρία.
    criteria:
      - Ответили на все пять вопросов полными предложениями
      - День недели и дата названы верно, месяц — в форме на -ου (Οκτωβρίου, Μαρτίου)
      - Время — в женском роде (μία, τρεις, τέσσερις), с και / παρά
      - Номер телефона продиктован парами, без долгих пауз
      - Ударение на своём месте (Τετάρτη, Οκτωβρίου, τέταρτο), δ в δεκατέσσερις — [ð]
  - type: speaking
    id: arrange
    part: interview
    prompt: |-
      Подруга звонит вам и задаёт вопросы. Ответьте на каждый полным предложением и запишите ответы. В субботу вы заняты, в воскресенье свободны.
      Είσαι ελεύθερος / ελεύθερη το Σάββατο; Και την Κυριακή; Τι ώρα μπορείς; Πού βρισκόμαστε;
    seconds: 45
    model: Όχι, το Σάββατο δεν μπορώ, δουλεύω. Την Κυριακή είμαι ελεύθερη. Μπορώ στις πέντε το απόγευμα. Βρισκόμαστε στο καφέ «Λέμον», στη Λάρνακα. Τα λέμε την Κυριακή!
    criteria:
      - "Отказ на субботу с причиной: Δεν μπορώ το Σάββατο, δουλεύω"
      - Сказали, что свободны в воскресенье (ελεύθερος — мужчина, ελεύθερη — женщина)
      - "Назвали время: στις + число, с частью дня (το πρωί, το απόγευμα, το βράδυ)"
      - Назвали место и попрощались (Τα λέμε…)
      - Интонация и темп спокойные, каждое предложение с глаголом
  - type: exercise
    id: review-time
    title: Повторение — время
    instruction: Который час? Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: "10:30"
        options:
          - δέκα και μισή
          - έντεκα και μισή
          - δέκα και τέταρτο
        answer: δέκα και μισή
        explanation: Греки называют текущий час — «десять и половина».
      - id: q2
        prompt: "4:45"
        options:
          - τέσσερις παρά τέταρτο
          - πέντε παρά τέταρτο
          - τέσσερις και τέταρτο
        answer: πέντε παρά τέταρτο
      - id: q3
        prompt: "1:10"
        options:
          - μία και δέκα
          - ένα και δέκα
          - ένας και δέκα
        answer: μία και δέκα
        explanation: Η ώρα — женский род, поэтому μία.
      - id: q4
        prompt: "20:00"
        options:
          - οκτώ το βράδυ
          - οκτώ το πρωί
          - οκτώ το απόγευμα
        answer: οκτώ το βράδυ
  - type: exercise
    id: review-numbers
    title: Повторение — числа
    instruction: Вставьте число. Два варианта лишние.
    format: gap
    bank:
      - ένας
      - μία
      - τρεις
      - τρία
      - εκατόν
      - εκατό
      - χίλια
    items:
      - id: g1
        prompt: Έχω ___ παιδιά. (3)
        answer: τρία
      - id: g2
        prompt: Ο Νίκος είναι ___ φίλος μου. (1)
        answer: ένας
      - id: g3
        prompt: Κάνει ___ ευρώ. (100)
        answer: εκατό
      - id: g4
        prompt: Κάνει ___ πενήντα ευρώ. (150)
        answer: εκατόν
        explanation: Перед другим числом — εκατόν.
      - id: g5
        prompt: Κάνει ___ ευρώ. (1000)
        answer: χίλια
  - type: exercise
    id: review-dates
    title: Повторение — дни и даты
    instruction: Напишите по-гречески.
    format: text
    items:
      - id: q1
        prompt: Сегодня четверг.
        answer:
          - Σήμερα είναι Πέμπτη.
          - Είναι Πέμπτη σήμερα.
        explanation: Четверг — Πέμπτη, а не Παρασκευή.
      - id: q2
        prompt: Сегодня двадцатое октября.
        answer:
          - Σήμερα είναι είκοσι Οκτωβρίου.
          - Είναι είκοσι Οκτωβρίου σήμερα.
      - id: q3
        prompt: Какое сегодня число?
        answer:
          - Τι ημερομηνία είναι σήμερα;
          - Τι ημερομηνία έχουμε σήμερα;
      - id: q4
        prompt: Какой у тебя номер телефона?
        answer:
          - Ποιο είναι το τηλέφωνό σου;
        explanation: В τηλέφωνό σου — второй тонос, потому что ударение в τηλέφωνο на третьем слоге от конца.
