blocks:
  - type: explanation
    id: passive-present
    title: Passive в настоящем времени
    body: |-
      Когда вы объясняете устройство системы, на первом месте стоит то, что происходит с данными, а кто это делает, остаётся за кадром. Для этого служит пассивный залог (passive): **The request is sent to the API gateway.** Исполнитель не назван: систему обслуживают сервисы, а слушателю нужен путь запроса.

      Форма в настоящем времени — **am / is / are + третья форма глагола (V3)**. В единственном числе стоит **is**, во множественном — **are**: **The data is stored in PostgreSQL. Messages are processed asynchronously.** У правильных глаголов V3 совпадает с формой прошедшего времени (*validated, cached*). Формы неправильных глаголов запоминаются: *send — sent, build — built, write — written, run — run*; V3 и прошедшая форма у них совпадают не всегда.

      Вопрос строится перестановкой: **Is the result cached? Where is the data stored?** Отрицание — **is not / are not**: **The password is not stored in plain text.** Слова *never* и *always* стоят между **is** и V3: *Secrets are never stored in the repository.*

      Типичная ошибка русскоговорящих — перевод «хранится, отправляется» одним словом: *The data stores in PostgreSQL*. Русское окончание «-ся» в английском передаёт связка **is / are** и V3: **is stored, is sent**.
    table:
      columns:
        - форма
        - схема
        - пример
      rows:
        - - утверждение
          - is / are + V3
          - The data is stored in PostgreSQL.
        - - множественное число
          - are + V3
          - Messages are processed asynchronously.
        - - вопрос
          - is / are + подлежащее + V3
          - Where is the data stored?
        - - отрицание
          - is / are + not + V3
          - The password is not stored in plain text.
        - - первое лицо
          - am + V3
          - I am assigned to the payment team.
        - - наречие частоты
          - is / are + never + V3
          - Secrets are never stored in the repository.
  - type: explanation
    id: passive-past
    title: Passive в прошедшем времени
    body: |-
      История системы рассказывается в прошедшем времени: **was / were + V3**. **The service was designed to handle peak traffic. The data was migrated without downtime. The old servers were replaced last year.** Время передают слова *last year, in 2022, two months ago*.

      Исполнитель вводится словом **by**, когда он несёт новую информацию: **The first version was built by two engineers.** В описании архитектуры его обычно опускают, а в рассказе о своей роли используют active: **We replaced the old system last year** говорит о вас, **The old system was replaced last year** говорит о системе.

      Типичная ошибка — вторая форма вместо третьей у неправильных глаголов и пропуск **-ed**: *was build, was replace*. После **was / were** нужна третья форма: **was built, was replaced**.
    table:
      columns:
        - форма
        - схема
        - пример
      rows:
        - - утверждение
          - was / were + V3
          - The first version was built in two months.
        - - множественное число
          - were + V3
          - The old servers were replaced last year.
        - - исполнитель
          - by + кто или что
          - The report was generated by a nightly job.
        - - вопрос
          - was / were + подлежащее + V3
          - When was the system migrated?
        - - отрицание
          - was / were + not + V3
          - The data was not lost.
  - type: explanation
    id: sequence
    title: Связки последовательности
    body: |-
      Путь запроса описывается цепочкой шагов, и связки показывают порядок. Начинает цепочку **First** или **First of all**, продолжают **Then, Next, After that**, заканчивает **Finally** или **Lastly**: **First, the user is authenticated. After that, the request is routed to the service. Finally, the response is sent back.**

      После связки в начале предложения ставится запятая (**First,** **After that,**), а **Then** часто идёт без запятой. Для двух событий в одном предложении служат **once**, **after** и **before** с придаточной частью: **Once the request is validated, it is saved.** Здесь после **once** идёт целое предложение со своим подлежащим, а **After that** стоит отдельно: *After the request is validated, it is saved* и *After that, it is saved*.

      Типичная ошибка — **At the end** вместо **Finally**: *at the end* означает «в конце чего-либо», а *in the end* — «в итоге». Последний шаг цепочки вводится словом **Finally**.
    table:
      columns:
        - место в цепочке
        - связка
        - пример
      rows:
        - - начало
          - First, / First of all,
          - First, the request is sent to the gateway.
        - - продолжение
          - Then / Next, / After that,
          - After that, the request is routed to the service.
        - - два события в одном предложении
          - once / after / before + предложение
          - Once the request is validated, it is saved.
        - - последний шаг
          - Finally, / Lastly,
          - Finally, the response is sent back to the client.
  - type: explanation
    id: architecture-words
    title: Слова для разговора об архитектуре
    body: |-
      Слова урока образуют четыре группы.

      **Вход и маршрут.** **A gateway** — единая точка входа для запросов извне, **a load balancer** — распределяет запросы между одинаковыми серверами, **an endpoint** — адрес, по которому API принимает запросы, **a payload** — данные, которые запрос передаёт серверу, **a timeout** — время ожидания, после которого вызов считается неудачным.

      **Данные.** **A schema** описывает таблицы и поля, **persist** — сохранить данные надолго, **retrieve** — получить данные, **a cache** — быстрое хранилище для часто нужных данных, **a replica** — копия базы для чтения, **a message queue** — очередь сообщений, ожидающих обработки.

      **Обработка.** **Validate** — проверить формат и поля, **authenticate** — подтвердить личность пользователя, **asynchronous** — вызывающий не ждёт результата, **a webhook** — внешний сервис вызывает ваш адрес при событии, **a pipeline** — цепочка этапов обработки.

      **Качество.** **Latency** — время между запросом и ответом, **a bottleneck** — часть системы, которая ограничивает скорость целого.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: passive-choice
    title: "Passive, форма"
    instruction: Выберите форму. Пояснение в скобках показывает смысл.
    format: choice
    items:
      - id: q1
        prompt: "The data ___ in PostgreSQL. (хранятся)"
        options: [is stored, stores, is store]
        answer: is stored
        explanation: Подлежащее data в единственном числе, поэтому is, затем V3 — stored.
      - id: q2
        prompt: "The results ___ for ten minutes. (кешируются)"
        options: [are cached, is cached, cached]
        answer: are cached
        explanation: Results — множественное число, поэтому are, затем V3.
      - id: q3
        prompt: "The service ___ to handle peak traffic. (был разработан раньше)"
        options: [was designed, is designed, were designed]
        answer: was designed
        explanation: Прошедшее время и единственное число — was и V3.
      - id: q4
        prompt: "The old servers ___ last year. (были заменены)"
        options: [were replaced, was replaced, are replaced]
        answer: were replaced
        explanation: Servers — множественное число, last year — прошедшее время, поэтому were replaced.
      - id: q5
        prompt: "Alerts ___ to the on-call engineer. (отправляются)"
        options: [are sent, are send, is sent]
        answer: are sent
        explanation: Alerts — множественное число; V3 от send — sent.
      - id: q6
        prompt: "The first version ___ in two months. (был создан)"
        options: [was built, was build, were built]
        answer: was built
        explanation: V3 от build — built.
  - type: exercise
    id: passive-forms
    title: Вопросы и отрицания
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: Какой вопрос построен верно?
        options:
          - Where is the data stored?
          - Where the data is stored?
        answer: Where is the data stored?
        explanation: В прямом вопросе is стоит перед подлежащим.
      - id: q2
        prompt: Какое предложение верно?
        options:
          - The password is not stored in plain text.
          - The password not is stored in plain text.
        answer: The password is not stored in plain text.
        explanation: Not стоит после is.
      - id: q3
        prompt: Как сказать «Запрос был проверен»?
        options:
          - The request was validated.
          - The request validated.
          - The request was validate.
        answer: The request was validated.
        explanation: Was и V3 — validated.
      - id: q4
        prompt: "The config file ___ by the deploy script. (записывается)"
        options: [is written, is wrote, is writing]
        answer: is written
        explanation: V3 от write — written.
      - id: q5
        prompt: "Что означает by в предложении «The report is generated by a nightly job»?"
        options:
          - кто выполняет действие
          - когда выполняется действие
          - где выполняется действие
        answer: кто выполняет действие
        explanation: После by называется исполнитель — здесь ночное задание.
  - type: exercise
    id: sequence-choice
    title: Связки последовательности
    instruction: Выберите связку.
    format: choice
    items:
      - id: q1
        prompt: "___, the user is authenticated. After that, the request is routed. (начало цепочки)"
        options: [First, Finally, At the end]
        answer: First
        explanation: Цепочку начинает First.
      - id: q2
        prompt: "___, the response is sent back to the client. (последний шаг цепочки)"
        options: [Finally, First, Before that]
        answer: Finally
        explanation: Последний шаг вводит Finally.
      - id: q3
        prompt: "The request is validated. ___, it is saved to the database. (следующий шаг)"
        options: [After that, At first, In the end]
        answer: After that
        explanation: Следующий шаг цепочки — After that.
      - id: q4
        prompt: "___ the request is validated, it is saved. (после того как)"
        options: [Once, Next, Finally]
        answer: Once
        explanation: Once вводит придаточную часть с подлежащим и сказуемым.
      - id: q5
        prompt: Какая связка начинает рассказ о системе?
        options: [First of all, Finally, Afterwards]
        answer: First of all
        explanation: First of all начинает цепочку; Afterwards ставится после первого шага, Finally — в конце.
      - id: q6
        prompt: Какой фрагмент построен верно?
        options:
          - First, the file is uploaded. Then it is scanned.
          - First, the file uploaded. Then scanned it.
        answer: First, the file is uploaded. Then it is scanned.
        explanation: В каждом шаге нужны is и V3.
  - type: exercise
    id: words-match
    title: Слова урока
    instruction: Соедините определение с английским словом. Два английских слова лишние.
    format: match
    bank:
      - a load balancer
      - a gateway
      - an endpoint
      - a payload
      - latency
      - a replica
      - a schema
      - a bottleneck
      - a cache
      - a timeout
    items:
      - { id: m1, prompt: "распределяет запросы между несколькими одинаковыми серверами", answer: a load balancer }
      - { id: m2, prompt: "единая точка входа, которая направляет запросы в нужные сервисы", answer: a gateway }
      - { id: m3, prompt: "адрес, по которому API принимает запросы", answer: an endpoint }
      - { id: m4, prompt: "данные, которые запрос передаёт серверу", answer: a payload }
      - { id: m5, prompt: "время между запросом и ответом", answer: latency }
      - { id: m6, prompt: "копия базы данных, которую используют для чтения", answer: a replica }
      - { id: m7, prompt: "описание таблиц и полей базы данных", answer: a schema }
      - { id: m8, prompt: "часть системы, которая ограничивает скорость всей системы", answer: a bottleneck }
  - type: exercise
    id: words-gap
    title: Данные и обработка
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - persist
      - retrieve
      - validate
      - authenticate
      - asynchronous
      - webhook
      - pipeline
      - timeout
      - schema
      - latency
    items:
      - id: g1
        prompt: The login service will ___ you with a password and a code. (подтвердить личность)
        answer: authenticate
      - id: g2
        prompt: The service must ___ the input before saving it, so that empty fields are rejected. (проверить корректность)
        answer: validate
      - id: g3
        prompt: The service must ___ the data to disk, so that it is still there after a restart. (сохранить надолго)
        answer: persist
      - id: g4
        prompt: The service will ___ the user's profile from the database. (получить)
        answer: retrieve
      - id: g5
        prompt: The client does not wait for the result, so the call is ___. (асинхронный)
        answer: asynchronous
      - id: g6
        prompt: The payment provider calls our ___ when the payment is complete. (вебхук)
        answer: webhook
      - id: g7
        prompt: Build, test and deploy run as one automated ___. (конвейер)
        answer: pipeline
      - id: g8
        prompt: The call failed because the ___ expired after thirty seconds. (время ожидания)
        answer: timeout
