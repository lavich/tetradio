title: Контрольная A1
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как устроена контрольная
    body: |-
      Это контрольная A1 по модулям 01–08 в сокращённом формате экзамена КΕΓ: все четыре навыка, около 60 минут. Делайте её за один раз, без словаря, таблиц и карточек — результат должен показать, что уже усвоено, а не что можно найти.

      **Чтение и аудирование** проверяются автоматически. Для каждого навыка считается доля правильных ответов и сравнивается с порогом **60 %** — как на экзамене, где нужно набрать не меньше 60 % в каждом навыке, а провал одного навыка означает провал всего экзамена. Каждый диалог звучит два раза; транскрипт откроется после ответа.

      **Письмо и речь** — самопроверка: в итог они не входят. Сначала напишите текст и запишите ответ сами, только потом откройте образец и честно отметьте, какие критерии выполнены. Если выполнено меньше 60 % критериев, считайте навык пока не сданным.

      Навык ниже порога — повод повторить модули, которые названы в пояснениях к ошибкам, до начала модуля 09.
    table:
      columns:
        - часть
        - задания
        - время
      rows:
        - - Чтение
          - верно/неверно, объявления, пропуски
          - 20 мин
        - - Аудирование
          - выбор из трёх, заметки
          - 12 мин
        - - Письмо
          - сообщение другу, 50–60 слов
          - 15 мин
        - - Речь
          - вопросы о себе, монолог
          - 10 мин
  - type: reading
    id: zoi
    title: Η Ζωή
    text: |-
      Γεια σας! Με λένε Ζωή και είμαι από τη Θεσσαλονίκη. Τώρα μένω στη Λεμεσό με τον άντρα μου, τον Άρη, και την κόρη μας, τη Μυρτώ. Ο Άρης είναι Κύπριος. Η Μυρτώ είναι επτά χρονών.

      Μένουμε σε ένα διαμέρισμα κοντά στη θάλασσα. Έχει δύο υπνοδωμάτια, μια κουζίνα και ένα μεγάλο μπαλκόνι, αλλά το σαλόνι είναι μικρό.

      Είμαι δασκάλα. Αρχίζω δουλειά στις οκτώ και γυρίζω σπίτι στις τρεις. Δύο φορές την εβδομάδα μαθαίνω ρωσικά, γιατί έχω πολλές φίλες από τη Ρωσία.

      Το Σάββατο δεν δουλεύω. Το πρωί κάνουμε βόλτα και το βράδυ μαγειρεύει ο Άρης. Του αρέσει πολύ το ψάρι, αλλά εγώ προτιμώ το κοτόπουλο.
    glosses:
      - text: Θεσσαλονίκη
        russian: Салоники
      - text: Κύπριος
        russian: киприот
      - text: Δύο φορές την εβδομάδα
        russian: два раза в неделю
  - type: exercise
    id: zoi-tf
    about: zoi
    graded: true
    title: Чтение 1 — верно или неверно
    instruction: Прочитайте текст. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Ζωή είναι από την Κύπρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είμαι από τη Θεσσαλονίκη — она из Греции, а в Лимасоле только живёт. Είμαι από… — откуда человек, μένω σε… — где живёт (модули 01–02).
      - id: q2
        prompt: Το διαμέρισμα είναι κοντά στη θάλασσα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Το σαλόνι είναι μεγάλο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Большой — балкон (ένα μεγάλο μπαλκόνι), а το σαλόνι είναι μικρό. Прилагательное относится к слову рядом с ним (модуль 07).
      - id: q4
        prompt: Η Ζωή αρχίζει δουλειά στις οκτώ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Η Ζωή μαθαίνει ρωσικά, γιατί ο άντρας της είναι Ρώσος.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Άρης — киприот. Русский она учит, γιατί έχω πολλές φίλες από τη Ρωσία — из-за подруг.
      - id: q6
        prompt: Το Σάββατο η Ζωή δεν δουλεύει.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Το Σάββατο το βράδυ μαγειρεύει η Ζωή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το βράδυ μαγειρεύει ο Άρης — подлежащее стоит после глагола, смотрите на артикль ο (модуль 02).
  - type: reading
    id: ads
    title: Αγγελίες
    text: |-
      Α. Νοικιάζεται διαμέρισμα στη Λεμεσό, κοντά στη θάλασσα. Δύο υπνοδωμάτια και μεγάλο μπαλκόνι. Ενοίκιο: 900 ευρώ.

      Β. Νοικιάζεται μικρό διαμέρισμα στη Λευκωσία: ένα υπνοδωμάτιο, κουζίνα και μπάνιο. Ενοίκιο: 500 ευρώ.

      Γ. Πωλείται μεγάλο άσπρο ψυγείο σε καλή κατάσταση. Μόνο 150 ευρώ!

      Δ. Πωλείται καινούργιο πλυντήριο. Δεν είναι φτηνό: 400 ευρώ.

      Ε. Πωλείται μαύρος καναπές για το σαλόνι, παλιός αλλά καθαρός. Μόνο 80 ευρώ!

      Ζ. Πωλούνται ένα τραπέζι και τέσσερις καρέκλες για την κουζίνα. 120 ευρώ.

      Η. Νοικιάζεται σπίτι στην Πάφο με τρία υπνοδωμάτια. Ενοίκιο: 1.100 ευρώ.

      Θ. Πωλείται κόκκινη ντουλάπα για το υπνοδωμάτιο. 60 ευρώ.
  - type: exercise
    id: ads-match
    about: ads
    graded: true
    title: Чтение 2 — объявления
    instruction: Прочитайте объявления Α–Θ. Какое объявление нужно каждому человеку? Два объявления лишние.
    format: match
    bank:
      - Α
      - Β
      - Γ
      - Δ
      - Ε
      - Ζ
      - Η
      - Θ
    items:
      - id: m1
        prompt: Ο Νίκος μένει στη Λευκωσία και ψάχνει ένα μικρό διαμέρισμα.
        answer: Β
        explanation: Единственная квартира в Никосии — Β.
      - id: m2
        prompt: Η Ελπίδα και ο άντρας της έχουν τρία παιδιά. Ψάχνουν σπίτι στην Πάφο.
        answer: Η
        explanation: Пафос и три спальни — объявление Η.
      - id: m3
        prompt: Ο Μάριος ψάχνει ψυγείο, γιατί το ψυγείο του είναι χαλασμένο.
        answer: Γ
        explanation: "Ψυγείο — холодильник (Γ). Πλυντήριο (Δ) — стиральная машина: не путайте."
      - id: m4
        prompt: Ο Στάθης θέλει έναν καναπέ, αλλά δεν έχει πολλά λεφτά.
        answer: Ε
        explanation: Диван только в Ε, и он дешёвый — 80 ευρώ.
      - id: m5
        prompt: Η Λίνα έχει μεγάλη κουζίνα, αλλά εκεί δεν υπάρχει τραπέζι.
        answer: Ζ
        explanation: Стол и стулья για την κουζίνα — объявление Ζ.
      - id: m6
        prompt: Ο Θωμάς δουλεύει στη Λεμεσό και ψάχνει διαμέρισμα με δύο υπνοδωμάτια.
        answer: Α
        explanation: Лимасол и две спальни — Α.
  - type: reading
    id: sofia
    title: Ένα μήνυμα από τη Σοφία
    text: |-
      Γεια σου, Λουκία!

      Πώς είσαι; Την Κυριακή (1) ___ οι γονείς μου από τη Λάρνακα και τρώμε όλοι μαζί στο σπίτι μου. Έλα κι εσύ! Η μητέρα μου μαγειρεύει κλέφτικο — είναι πολύ (2) ___! Εγώ κάνω μια μεγάλη σαλάτα με ντομάτα και χαλλούμι. Ξέρω ότι δεν τρως κρέας, (3) ___ έχουμε και ψάρι με πατάτες. Μετά πίνουμε (4) ___ και τρώμε γλυκά.

      Τρώμε στη (5) ___, αλλά έλα λίγο νωρίς. Το σπίτι μου είναι (6) ___ στη θάλασσα, δίπλα στην ταβέρνα «Γαλήνη».

      Τα λέμε!
      Σοφία
  - type: exercise
    id: sofia-gap
    about: sofia
    graded: true
    title: Чтение 3 — пропуски
    instruction: Прочитайте сообщение и вставьте слова. Три слова лишние.
    format: gap
    bank:
      - έρχονται
      - έρχεται
      - νόστιμο
      - νόστιμη
      - αλλά
      - καφέ
      - ο καφές
      - μία
      - κοντά
    items:
      - id: g1
        prompt: (1) Την Κυριακή ___ οι γονείς μου από τη Λάρνακα.
        answer: έρχονται
        explanation: "Подлежащее — οι γονείς μου, «они»: έρχονται. Έρχεται — «он, она» (модуль 05)."
      - id: g2
        prompt: (2) Η μητέρα μου μαγειρεύει κλέφτικο — είναι πολύ ___!
        answer: νόστιμο
        explanation: "Το κλέφτικο — средний род, поэтому νόστιμο. Νόστιμη — для женского рода: η σαλάτα είναι νόστιμη (модуль 07)."
      - id: g3
        prompt: (3) Ξέρω ότι δεν τρως κρέας, ___ έχουμε και ψάρι με πατάτες.
        answer: αλλά
        explanation: Противопоставление «ты не ешь мясо, но есть рыба» — αλλά.
      - id: g4
        prompt: (4) Μετά πίνουμε ___ και τρώμε γλυκά.
        answer: καφέ
        explanation: "После πίνω — винительный падеж: καφέ без ς. Ο καφές — именительный, так говорят после μου αρέσει (модуль 08)."
      - id: g5
        prompt: (5) Τρώμε στη ___, αλλά έλα λίγο νωρίς.
        answer: μία
        explanation: "Στη μία — «в час»: η ώρα женского рода, поэтому μία (модуль 04)."
      - id: g6
        prompt: (6) Το σπίτι μου είναι ___ στη θάλασσα.
        answer: κοντά
        explanation: Κοντά σε — «недалеко от», κοντά στη θάλασσα (модуль 06).
  - type: listening
    id: new-flat
    title: Το καινούργιο διαμέρισμα
    plays: 2
    transcript:
      - speaker: Ορέστης
        text: Γεια σου, Ηλέκτρα! Τι κάνεις;
      - speaker: Ηλέκτρα
        text: Καλά, Ορέστη, ευχαριστώ. Κι εσύ;
      - speaker: Ορέστης
        text: Καλά. Μένεις ακόμα στη Λεμεσό;
      - speaker: Ηλέκτρα
        text: Όχι, τώρα μένω στη Λάρνακα, σε ένα καινούργιο διαμέρισμα.
      - speaker: Ορέστης
        text: Ωραία! Πώς είναι;
      - speaker: Ηλέκτρα
        text: Είναι μικρό, αλλά έχει ένα μεγάλο μπαλκόνι. Και είναι κοντά στη θάλασσα.
      - speaker: Ορέστης
        text: Πόσο είναι το ενοίκιο;
      - speaker: Ηλέκτρα
        text: Εξακόσια ευρώ. Δεν είναι ακριβό. Είσαι ελεύθερος το Σάββατο; Έλα για φαγητό!
      - speaker: Ορέστης
        text: Το Σάββατο το πρωί δουλεύω, αλλά το βράδυ είμαι ελεύθερος.
      - speaker: Ηλέκτρα
        text: Ωραία! Έλα στις οκτώ. Μαγειρεύω ψάρι. Σου αρέσει;
      - speaker: Ορέστης
        text: Όχι πολύ, συγγνώμη. Προτιμώ το κρέας.
      - speaker: Ηλέκτρα
        text: Δεν πειράζει. Μαγειρεύω κοτόπουλο με πατάτες.
      - speaker: Ορέστης
        text: Ωραία! Τα λέμε το Σάββατο!
  - type: exercise
    id: new-flat-choice
    about: new-flat
    graded: true
    title: Аудирование 1 — выбор
    instruction: Прослушайте диалог два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού μένει τώρα η Ηλέκτρα;
        options:
          - Στη Λάρνακα.
          - Στη Λεμεσό.
          - Στην Πάφο.
        answer: Στη Λάρνακα.
        explanation: "Ловушка: Λεμεσό звучит в вопросе Ореста, но Электра отвечает: Όχι, τώρα μένω στη Λάρνακα."
      - id: q2
        prompt: Πώς είναι το διαμέρισμα;
        options:
          - Μικρό, με μεγάλο μπαλκόνι.
          - Μεγάλο, με μικρό μπαλκόνι.
          - Μικρό, χωρίς μπαλκόνι.
        answer: Μικρό, με μεγάλο μπαλκόνι.
        explanation: Είναι μικρό, αλλά έχει ένα μεγάλο μπαλκόνι.
      - id: q3
        prompt: Πόσο είναι το ενοίκιο;
        options:
          - 600 ευρώ.
          - 700 ευρώ.
          - 900 ευρώ.
        answer: 600 ευρώ.
        explanation: Εξακόσια — 600, επτακόσια — 700, εννιακόσια — 900 (модуль 04).
      - id: q4
        prompt: Πότε είναι ελεύθερος ο Ορέστης;
        options:
          - Το Σάββατο το βράδυ.
          - Το Σάββατο το πρωί.
          - Την Κυριακή.
        answer: Το Σάββατο το βράδυ.
        explanation: Το Σάββατο το πρωί δουλεύω, αλλά το βράδυ είμαι ελεύθερος.
      - id: q5
        prompt: Τι μαγειρεύει η Ηλέκτρα για τον Ορέστη;
        options:
          - Κοτόπουλο με πατάτες.
          - Ψάρι.
          - Σουβλάκια.
        answer: Κοτόπουλο με πατάτες.
        explanation: "Ловушка: сначала она собиралась готовить рыбу, но Орест рыбу не очень любит — Δεν πειράζει. Μαγειρεύω κοτόπουλο με πατάτες."
  - type: listening
    id: rent-call
    title: Ένα τηλεφώνημα
    plays: 2
    transcript:
      - speaker: Θεοπίστη
        text: Ναι, παρακαλώ;
      - speaker: Λάμπρος
        text: Καλημέρα σας. Με λένε Λάμπρο Σαββίδη. Νοικιάζετε ένα διαμέρισμα;
      - speaker: Θεοπίστη
        text: Καλημέρα σας. Ναι, στη Λευκωσία.
      - speaker: Λάμπρος
        text: Πόσα υπνοδωμάτια έχει;
      - speaker: Θεοπίστη
        text: Δύο υπνοδωμάτια. Έχει και σαλόνι, κουζίνα και μπάνιο.
      - speaker: Λάμπρος
        text: Υπάρχει πλυντήριο;
      - speaker: Θεοπίστη
        text: Ναι, υπάρχει πλυντήριο και καινούργιο ψυγείο. Κλιματιστικό υπάρχει μόνο στο σαλόνι.
      - speaker: Λάμπρος
        text: Και πόσο είναι το ενοίκιο;
      - speaker: Θεοπίστη
        text: Επτακόσια πενήντα ευρώ.
      - speaker: Λάμπρος
        text: Μπορώ να δω το σπίτι αύριο;
      - speaker: Θεοπίστη
        text: Αύριο δεν μπορώ. Την Πέμπτη;
      - speaker: Λάμπρος
        text: Ναι, την Πέμπτη είμαι ελεύθερος. Τι ώρα;
      - speaker: Θεοπίστη
        text: Στις πέντε και μισή το απόγευμα. Ποιο είναι το τηλέφωνό σας;
      - speaker: Λάμπρος
        text: Ενενήντα έξι, τριάντα ένα, πενήντα οκτώ, μηδέν δύο.
      - speaker: Θεοπίστη
        text: Ενενήντα έξι, τριάντα ένα, πενήντα οκτώ, μηδέν δύο. Ευχαριστώ, κύριε Σαββίδη.
      - speaker: Λάμπρος
        text: Κι εγώ ευχαριστώ. Γεια σας!
  - type: exercise
    id: rent-call-notes
    about: rent-call
    graded: true
    title: Аудирование 2 — заметки
    instruction: Прослушайте разговор два раза и запишите коротко — по-гречески или по-русски. Числа, время и телефон пишите цифрами.
    format: text
    items:
      - id: n1
        prompt: Город, где квартира
        answer:
          - Λευκωσία
          - στη Λευκωσία
          - Никосия
          - в Никосии
      - id: n2
        prompt: Сколько спален
        answer:
          - "2"
          - δύο
          - два
          - две
      - id: n3
        prompt: Где есть кондиционер
        answer:
          - σαλόνι
          - στο σαλόνι
          - το σαλόνι
          - гостиная
          - в гостиной
        explanation: Κλιματιστικό υπάρχει μόνο στο σαλόνι — только в гостиной.
      - id: n4
        prompt: Аренда, евро
        answer:
          - "750"
          - 750 ευρώ
          - 750 €
          - 750€
          - επτακόσια πενήντα
          - εφτακόσια πενήντα
          - επτακόσια πενήντα ευρώ
        explanation: Επτακόσια πενήντα — 700 + 50 (модуль 04).
      - id: n5
        prompt: День просмотра
        answer:
          - Πέμπτη
          - την Πέμπτη
          - четверг
          - в четверг
        explanation: "Αύριο δεν μπορώ. Την Πέμπτη; Η Πέμπτη — четверг, η Τρίτη — вторник: не путайте."
      - id: n6
        prompt: Время просмотра
        answer:
          - "17:30"
          - "5:30"
          - "17.30"
          - "5.30"
          - πέντε και μισή
          - στις πέντε και μισή
        explanation: Στις πέντε και μισή το απόγευμα — 17:30.
      - id: n7
        prompt: Телефон Ламброса
        answer:
          - "96315802"
          - 96 31 58 02
        explanation: Ενενήντα έξι 96, τριάντα ένα 31, πενήντα οκτώ 58, μηδέν δύο 02.
  - type: writing
    id: new-home
    register: friendly
    prompt: "Ваша подруга-гречанка Фотини пишет: «Πώς είναι το καινούργιο σου σπίτι;» Ответьте ей сообщением 50–60 слов: где ваше новое жильё, какие в нём комнаты и какие они, что вам нравится и почему; пригласите её в гости — назовите день и время и напишите, что вы приготовите."
    words:
      min: 50
      max: 60
    model: Γεια σου, Φωτεινή! Πώς είσαι; Το καινούργιο μου διαμέρισμα είναι στη Λεμεσό, κοντά στη θάλασσα. Έχει δύο δωμάτια, μια μικρή κουζίνα και ένα μεγάλο μπαλκόνι. Το σαλόνι δεν είναι μεγάλο, αλλά είναι πολύ ωραίο. Μου αρέσει πολύ το μπαλκόνι, γιατί βλέπω τη θάλασσα. Είσαι ελεύθερη το Σάββατο; Έλα για φαγητό στις οκτώ! Μαγειρεύω κοτόπουλο με πατάτες. Τα λέμε!
    criteria:
      - 50–60 слов; дружеское приветствие и прощание на «ты» (Γεια σου, … ! … Τα λέμε!)
      - "Сказано, где жильё: σε + артикль (στη Λεμεσό, κοντά στη θάλασσα)"
      - "Названы хотя бы две комнаты или вещи с έχει или υπάρχει/υπάρχουν"
      - "Прилагательные согласованы: μια μικρή κουζίνα, ένα μεγάλο μπαλκόνι, το σαλόνι είναι ωραίο"
      - Сказано, что нравится, и почему — μου αρέσει … γιατί …
      - "Приглашение с днём и временем: το Σάββατο, στις οκτώ"
      - "Что вы приготовите — винительный падеж после μαγειρεύω: κοτόπουλο, τον μουσακά, μια σαλάτα"
      - Тонос во всех словах из двух и больше слогов; предложения связаны (και, αλλά, γιατί)
  - type: speaking
    id: about-me
    part: interview
    prompt: |-
      Экзаменатор задаёт вопросы на «вы». Прочитайте каждый вопрос вслух, ответьте без подготовки и запишите ответы:
      Πώς σας λένε; Από πού είστε; Πού μένετε τώρα; Τι γλώσσες μιλάτε; Έχετε οικογένεια; Τι δουλειά κάνετε;
    seconds: 90
    model: Με λένε Βέρα. Είμαι από τη Ρωσία, από τη Μόσχα. Τώρα μένω στη Λεμεσό, σε ένα διαμέρισμα κοντά στη θάλασσα. Μιλάω ρωσικά, αγγλικά και λίγο ελληνικά. Είμαι παντρεμένη και έχω έναν γιο και μία κόρη. Ο γιος μου είναι δέκα χρονών. Είμαι γιατρός, αλλά τώρα δουλεύω από το σπίτι.
    criteria:
      - Ответили на все шесть вопросов полными предложениями
      - "Формы о себе: είμαι, μένω, μιλάω, έχω, δουλεύω — а не είστε, μένετε, μιλάτε"
      - "Предлоги с артиклем: από τη Ρωσία, στη Λεμεσό"
      - "Языки без артикля после μιλάω: μιλάω ρωσικά και λίγο ελληνικά"
      - "После έχω — винительный падеж: έναν γιο, μία κόρη; παντρεμένος или παντρεμένη — по своему роду"
      - Профессия без артикля (Είμαι γιατρός); ударение на своём месте (οικογένεια, παντρεμένη, ελληνικά)
  - type: speaking
    id: saturday
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Μιλήστε μας για το Σάββατό σας. Τι κάνετε συνήθως το Σάββατο;» (Μιλήστε μας — «расскажите нам».)
      Говорите около минуты: утро, день, вечер — что вы делаете, с кем, что едите и пьёте. Запишите ответ.
    seconds: 90
    model: Το Σάββατο δεν δουλεύω. Ξυπνάω αργά, στις εννέα. Για πρωινό πίνω καφέ με γάλα και τρώω ψωμί με τυρί. Μετά καθαρίζω το διαμέρισμα, γιατί τις άλλες μέρες δεν έχω χρόνο. Το απόγευμα κάνω βόλτα κοντά στη θάλασσα με τον άντρα μου. Το βράδυ συνήθως τρώμε σε μια ταβέρνα με τους φίλους μας. Μου αρέσουν πολύ οι μεζέδες και το χαλλούμι. Γυρίζουμε σπίτι αργά και βλέπουμε λίγο τηλεόραση.
    criteria:
      - Говорили около минуты, без долгих пауз
      - "Рассказали об утре, дне и вечере: το πρωί, το απόγευμα, το βράδυ; время — στις + число"
      - Есть хотя бы одно наречие частоты (συνήθως, πάντα, μερικές φορές, ποτέ)
      - "Глаголы в нужном лице: о себе — ξυπνάω, τρώω, πίνω; о «мы» — τρώμε, γυρίζουμε"
      - "Еда и напитки: после τρώω, πίνω — винительный падеж (καφέ, τον μουσακά); μου αρέσει + одна вещь, μου αρέσουν + несколько"
      - Предложения связаны (και, αλλά, γιατί, μετά); ударение на своём месте (Σάββατο, πρωινό, ταβέρνα)
