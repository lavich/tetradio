blocks:
  - type: explanation
    id: invite-more
    title: Ещё слова и фразы приглашений
    body: |-
      В письменном приглашении обычно указаны день, время, адрес и условия. **RSVP** — просьба подтвердить, придёте ли: **RSVP to Leo by Thursday.** **BYOB** — приносите напитки с собой, в том числе безалкогольные. **A dress code** — требования к одежде: smart casual означает аккуратную одежду без костюма. **A housewarming** — вечеринка по случаю новоселья.

      **Pre-drinks** — встреча у друзей перед выходом на вечеринку или в бар, **a nightcap** — последний напиток вечера, им может быть и чай. **A no-show** — человек, который обещал прийти и не пришёл. Американская пара к pre-drinks — pregame.

      Организация встречи: **Could you send me the address?** **What time does it kick off?** **I'll let you know by Thursday.** — не позже четверга. **Text me when you get there.** — сообщение, что вы на месте.

      Обмен контактами идёт по желанию обеих сторон. **Are you on Instagram?** — **I'll add you.** Номер телефона можно попросить: **Can I get your number?** Собеседник вправе предложить другой способ, например *I'd rather stick to Instagram*, и такой ответ принимается как есть.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: explanation
    id: invitation-how
    title: Приглашение и чат вечеринки
    body: |-
      Сначала прочитайте приглашение и чат целиком: найдите день, время, условия (еда, напитки, одежда) и срок ответа. Затем отвечайте на вопросы. В чате люди пишут коротко, часто без точки в конце.
  - type: reading
    id: invitation
    title: Leo's housewarming — invitation and chat
    text: |-
      LEO'S HOUSEWARMING
      Saturday 13 June, from 7 pm
      Flat 3, 18 Mill Lane, Bristol
      Food is provided. BYOB: bring a bottle or a soft drink.
      Dress code: smart casual.
      Plus-ones are welcome, but tell me first.
      RSVP to Leo by Thursday.

      HOUSEWARMING — GROUP CHAT

      Tess: Are you up for Leo's housewarming on Saturday?
      Zoe: Count me in. Can I bring a plus-one?
      Tess: Ask Leo. He wants to know by Thursday
      Zoe: OK, I'll text him. What time does it kick off?
      Tess: Seven. I'll text you when I get there
      Zoe: Great. I'll bring lemonade
      Jack: I'll try to make it. I'm at a gig until nine, so I'll turn up late
      Tess: No problem. Text me when you get there
    glosses:
      - { text: housewarming, russian: новоселье }
      - { text: provided, russian: "обеспечена, за счёт хозяев" }
      - { text: tell me first, russian: "сначала сообщите мне" }
  - type: exercise
    id: invitation-q
    about: invitation
    title: Чтение
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What is the party for?
        options:
          - a new flat
          - a birthday
          - a concert
        answer: a new flat
        explanation: Housewarming — вечеринка по случаю новоселья.
      - id: q2
        prompt: What should guests bring?
        options:
          - a bottle or a soft drink
          - only food
          - nothing
        answer: a bottle or a soft drink
        explanation: "BYOB: bring a bottle or a soft drink. Еда у хозяев."
      - id: q3
        prompt: When must guests reply to Leo?
        options:
          - by Thursday
          - on Saturday
          - by Friday
        answer: by Thursday
        explanation: RSVP to Leo by Thursday.
      - id: q4
        prompt: What does Zoe ask about bringing a guest?
        options:
          - if she can bring a plus-one
          - if there is a dress code
          - if she can stay the night
        answer: if she can bring a plus-one
        explanation: Can I bring a plus-one?
      - id: q5
        prompt: What time does the party start?
        options:
          - at seven
          - at eight
          - at nine
        answer: at seven
        explanation: Seven.
      - id: q6
        prompt: What does Zoe say she will bring?
        options:
          - lemonade
          - a cake
          - sparkling water
        answer: lemonade
        explanation: I'll bring lemonade.
      - id: q7
        prompt: Why will Jack be late?
        options:
          - He is at a gig until nine.
          - He is working.
          - He has no invitation.
        answer: He is at a gig until nine.
        explanation: I'm at a gig until nine, so I'll turn up late.
  - type: explanation
    id: voice-how
    title: Голосовое сообщение с приглашением
    body: |-
      Теперь два голосовых сообщения: Лео приглашает Тесс на концерт, Тесс отвечает. Слушайте дни, время, число билетов и срок ответа. Звучит два раза, транскрипт откроется после ответа.

      В записи **a venue** — место проведения, **doors open** — двери открываются, **on at nine** — группа выходит на сцену в девять.
  - type: listening
    id: voice
    title: Voice messages — a gig on Friday
    plays: 2
    transcript:
      - { speaker: Leo, text: "Hi Tess, it's Leo. Are you up for a gig on Friday? My cousin's band is playing at the Fleece, on Park Street. Doors open at eight, and the band is on at nine.", audio: t11-2/voice-1.mp3 }
      - { speaker: Leo, text: "I've got two spare tickets, so you can bring a plus-one. Let me know by Wednesday, because I collect the tickets on Thursday.", audio: t11-2/voice-2.mp3 }
      - { speaker: Tess, text: "Hi Leo, thanks for asking. Count me in, and I'll bring Zoe. Shall we say half past eight outside the venue?", audio: t11-2/voice-3.mp3 }
      - { speaker: Leo, text: "Half past eight is fine. It might be loud inside, so text me when you get there.", audio: t11-2/voice-4.mp3 }
      - { speaker: Tess, text: "Will do. Could you send me the address?", audio: t11-2/voice-5.mp3 }
      - { speaker: Leo, text: "Sure, I'll send it now. See you on Friday.", audio: t11-2/voice-6.mp3 }
  - type: exercise
    id: voice-q
    about: voice
    title: Аудирование — голосовое с приглашением
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What is Leo inviting Tess to?
        options:
          - a gig
          - a housewarming
          - a quiz night
        answer: a gig
        explanation: Are you up for a gig on Friday?
      - id: q2
        prompt: Whose band is playing?
        options:
          - Leo's cousin's
          - Tess's
          - Zoe's
        answer: Leo's cousin's
        explanation: My cousin's band is playing at the Fleece.
      - id: q3
        prompt: How many spare tickets does Leo have?
        options:
          - two
          - one
          - three
        answer: two
        explanation: I've got two spare tickets.
      - id: q4
        prompt: When must Tess answer?
        options:
          - by Wednesday
          - by Thursday
          - on Friday
        answer: by Wednesday
        explanation: "Let me know by Wednesday. В четверг Лео забирает билеты."
      - id: q5
        prompt: Who will Tess bring?
        options:
          - Zoe
          - Jack
          - Leo's cousin
        answer: Zoe
        explanation: I'll bring Zoe.
      - id: q6
        prompt: Where will they meet, and when?
        options:
          - outside the venue at half past eight
          - at the bar at nine
          - at Leo's flat at eight
        answer: outside the venue at half past eight
        explanation: Shall we say half past eight outside the venue? — Half past eight is fine.
      - id: q7
        prompt: What does Leo ask Tess to do when she arrives?
        options:
          - text him
          - call him
          - wait for Zoe
        answer: text him
        explanation: Text me when you get there.
  - type: explanation
    id: party-how
    title: Разговор на вечеринке
    body: |-
      Второй диалог — в прихожей на новоселье. Лео встречает Тесс, потом приходит Зоя. Говорят быстро, на ходу. Слушайте, почему Зои нет, что принесла Тесс и какой на вечере дресс-код. Звучит два раза, транскрипт откроется после ответа.

      Слова **bailed on me** означают, что человек отменил встречу в последний момент.
  - type: listening
    id: party
    title: At the housewarming
    plays: 2
    transcript:
      - { speaker: Leo, text: "Tess! You made it. Come in. Is Zoe with you?", audio: t11-2/party-1.mp3 }
      - { speaker: Tess, text: "Not yet. She's running a bit late, but she'll turn up around eight.", audio: t11-2/party-2.mp3 }
      - { speaker: Leo, text: "No problem. There are soft drinks in the kitchen, and tea if you'd like some.", audio: t11-2/party-3.mp3 }
      - { speaker: Tess, text: "Thanks. I brought sparkling water, since it's BYOB. Where shall I put it?", audio: t11-2/party-4.mp3 }
      - { speaker: Leo, text: "In the fridge, please. Jack bailed on me this afternoon, so we're one person short.", audio: t11-2/party-5.mp3 }
      - { speaker: Tess, text: "That's a shame. Is it smart casual, like the invitation says? I wasn't sure about these shoes.", audio: t11-2/party-6.mp3 }
      - { speaker: Leo, text: "Yes, smart casual, and your shoes are fine.", audio: t11-2/party-7.mp3 }
      - { speaker: Zoe, text: "Hi, sorry I'm late. Leo, this is for the new flat.", audio: t11-2/party-8.mp3 }
      - { speaker: Leo, text: "Thank you, Zoe. You didn't have to.", audio: t11-2/party-9.mp3 }
  - type: exercise
