  - type: exercise
    id: words-gap
    title: Слова урока
    instruction: Вставьте слово или оборот. Два варианта лишние.
    format: gap
    bank: [RSVP, BYOB, pre-drinks, a nightcap, a dress code, a no-show, a housewarming, a plus-one, a rain check]
    items:
      - { id: g1, prompt: "Please ___ to Leo by Thursday, so he knows how many people are coming.", answer: RSVP }
      - { id: g2, prompt: "The invitation says ___, so I'll bring my own bottle of juice.", answer: BYOB }
      - { id: g3, prompt: "Come to mine at six for ___ before we go out: a few drinks at home, and then we'll walk to the concert together.", answer: pre-drinks }
      - { id: g4, prompt: "Before the guests left, Leo made everyone a cup of tea as ___.", answer: a nightcap }
      - { id: g5, prompt: "Smart casual is ___ for this party: nobody wears sportswear.", answer: a dress code }
      - { id: g6, prompt: "He said he'd come, but he was ___: he never even called.", answer: a no-show }
      - { id: g7, prompt: "We're throwing ___ on Saturday to celebrate our new flat.", answer: a housewarming }
  - type: exercise
    id: translate
    title: Скажите по-английски
    instruction: Переведите на английский. Сокращения (I'll, you're) можно писать и полностью.
    format: text
    items:
      - id: q1
        prompt: "Ты есть в Instagram? (вопрос при обмене контактами)"
        answer:
          - Are you on Instagram?
          - Are you on Insta?
          - Have you got Instagram?
          - Do you have Instagram?
          - Are you on Instagram too?
          - Do you have an Instagram account?
          - Have you got an Instagram account?
          - Have you got an Instagram?
        explanation: Are you on Instagram? — вопрос при обмене контактами.
      - id: q2
        prompt: "Во сколько это начинается? (о вечеринке)"
        answer:
          - What time does it kick off?
          - What time does it start?
          - What time does it begin?
          - What time does the party kick off?
          - What time does the party start?
          - What time does the party begin?
          - What time does it start at?
          - What time is the start?
          - When does it kick off?
          - When does it start?
          - When does it begin?
        explanation: What time does it kick off? — kick off значит начаться.
      - id: q3
