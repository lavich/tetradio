blocks:
  - type: explanation
    id: decision-words
    title: Слова о риске, выпуске и инциденте
    body: |-
      Тексты урока описывают, как команда решает, выпускать ли изменение и что делать при сбое. Слова урока образуют три группы.

      **Оценка и решение.** **A risk assessment** — оценка рисков: что может пойти не так, насколько вероятно и насколько тяжело. **Likelihood** — вероятность. **A cost-benefit analysis** — сопоставление затрат и выгод варианта. **A rule of thumb** — практическое правило, которое работает в большинстве случаев. **A tie-breaker** — довод, который решает выбор между равными вариантами. **The bottom line** — главный итог, сказанный одной фразой.

      **Выпуск и сроки.** **A phased rollout** — постепенный выпуск: сначала часть пользователей, затем остальные. **A go/no-go decision** — решение «выпускаем или нет» перед релизом. **A release window** — время, в которое разрешено выпускать изменения. **A change request** — оформленный запрос на изменение. **An error budget** — допустимый объём сбоев за период. **An SLA** — соглашение об уровне сервиса, обещание клиенту, например по доступности. **Cut back** — сократить объём.

      **Инцидент.** **A war room** — временная группа или канал, где команда решает серьёзный инцидент. **Page someone** — вызвать дежурного инженера через систему оповещений. **Stand down** — завершить режим тревоги и вернуться к обычной работе. **A game day** — учения, на которых команда намеренно моделирует сбой.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: assess-match
    title: Оценка и решение
