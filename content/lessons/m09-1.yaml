blocks:
  - type: explanation
    id: vy
    title: Обращение на «вы»
    body: |-
      С официантом, продавцом, незнакомым или старшим человеком по-гречески говорят на **«вы»** — так же, как по-русски. Вы уже знаете все нужные формы: глагол в форме **εσείς** (θέλετε, μπορείτε, μιλάτε, έχετε) и слово **σας** — «вас, вам, ваш»: **Γεια σας!**, **Καλησπέρα σας!**, **Πώς σας λένε;**

      **Κύριε и κυρία.** Вежливо обратиться к человеку — **κύριε** («господин») или **κυρία** («госпожа») + имя. Когда мы зовём человека, мужское слово меняет окончание: ο κύριος → **Κύριε!**, а имена на -ος обычно теряют ς: ο Νίκος → **Κύριε Νίκο!**, ο Γιώργος → **Κύριε Γιώργο!** Женское слово и женские имена не меняются: **Κυρία Ελένη!** Когда о человеке говорят, форма обычная: **Ο κύριος Νίκος** είναι σερβιτόρος.

      **Как позвать официанта.** Достаточно сказать **Συγγνώμη!** или **Παρακαλώ!** — «Извините!», «Будьте добры!». Официант (ο σερβιτόρος, η σερβιτόρα) подойдёт и спросит: **Τι θα πάρετε;** — «Что будете заказывать?» (дословно «Что возьмёте?»). Θα πάρετε — будущее время от παίρνω; эту грамматику вы пройдёте позже, а сейчас учите вопрос целиком. Ответить можно так же: **Θα πάρω** έναν μουσακά — «Я возьму мусаку».

      На Кипре в кафе и тавернах часто быстро переходят на «ты», особенно с молодыми. Но начинать разговор на «вы» — всегда правильно, и так же говорят на экзамене.
    table:
      columns:
        - на «ты»
        - на «вы»
      rows:
        - - Γεια σου!
          - Γεια σας!
        - - Θέλεις καφέ;
          - Θέλετε καφέ;
        - - Μιλάς αγγλικά;
          - Μιλάτε αγγλικά;
        - - Τι θα πάρεις;
          - Τι θα πάρετε;
        - - Νίκο, …
          - Κύριε Νίκο, …
        - - Ελένη, …
          - Κυρία Ελένη, …
  - type: explanation
    id: polite
    title: Θα ήθελα и Μπορώ να έχω…;
    body: |-
      **Θέλω έναν καφέ** — грамматически правильно, но звучит прямо: «Хочу кофе». В кафе мягче сказать **Θα ήθελα έναν καφέ** — «Я бы хотел(а) кофе». **Θα ήθελα** — вежливая форма от θέλω, как русское «я бы хотел». Учите её как готовый блок: она одна для мужчин и женщин. Для «мы» — **θα θέλαμε**: Θα θέλαμε δύο καφέδες. После θα ήθελα, как после θέλω, — винительный падеж: έναν καφέ, μια σαλάτα, ένα τσάι.

      **Μπορώ να έχω…;** — «Можно мне…?» (дословно «Могу я иметь…?»). Тоже готовый блок: **Μπορώ να έχω ένα ποτήρι νερό;** Для «мы» — **Μπορούμε να έχουμε…;** После να глагол έχω не меняется.

      **Μπορείτε να μας φέρετε…;** — «Можете принести нам…?» Φέρετε — особая форма глагола φέρνω («приносить»): после να она звучит так. Здесь тоже не разбирайте грамматику — выучите фразу целиком: **Μπορείτε να μας φέρετε τον κατάλογο, παρακαλώ;** Короткое слово **μας** перед глаголом значит «нам», как в Μας αρέσει (модуль 08). Так же устроен вопрос **Τι μας προτείνετε;** — «Что вы нам посоветуете?».

      Часто глагол вообще не нужен — хватает слова и παρακαλώ: **Ένα τραπέζι για δύο, παρακαλώ.** **Έναν καφέ, παρακαλώ.** Когда входите: **Είναι ελεύθερο αυτό το τραπέζι;** — «Этот столик свободен?» (το τραπέζι — средний род, поэтому ελεύθερο).
    table:
      columns:
        - как сказать
        - перевод
      rows:
        - - Θα ήθελα μια σαλάτα.
          - Я бы хотел(а) салат.
        - - Θα θέλαμε δύο τσάγια.
          - Мы бы хотели два чая.
        - - Μπορώ να έχω έναν χυμό;
          - Можно мне сок?
        - - Μπορούμε να έχουμε λίγο νερό;
          - Можно нам немного воды?
        - - Μπορείτε να μας φέρετε τον κατάλογο;
          - Можете принести нам меню?
        - - Τι μας προτείνετε;
          - Что вы нам посоветуете?
        - - Θα πάρω το κλέφτικο.
          - Я возьму клефтико.
  - type: explanation
    id: menu-words
    title: Меню и кипрский кофе
    body: |-
      **Ο κατάλογος** — меню (говорят и **το μενού**, это слово не меняется). В меню есть разделы: **τα ορεκτικά** — закуски, **τα κυρίως πιάτα** — основные блюда, **τα επιδόρπια** — десерты. Слово κυρίως никогда не меняется: το κυρίως πιάτο, τα κυρίως πιάτα. **Η μερίδα** — порция: μια μερίδα πατάτες (без артикля и предлога, как ένα ποτήρι νερό). **Η ποικιλία** — ассорти, тарелка «всего понемногу». Раздел меню часто пишут **Ποικιλία ορεκτικών** — «ассорти закусок»: ορεκτικών — форма «чего?», её вы пройдёте позже.

      Три новых глагола — обычные, как γράφω: **παραγγέλνω** — заказывать, **προτείνω** — советовать, **διαλέγω** — выбирать. Η παραγγελία — заказ.

      **Κυπριακός καφές.** Кипрский кофе варят в маленькой джезве — **το μπρίκι** — и подают в маленькой чашке — **το φλιτζάνι** — со стаканом воды. Сахар кладут при варке, поэтому сразу говорят, какой кофе нужен: **σκέτος** — без сахара, **μέτριος** — средний (около одной ложки), **γλυκός** — сладкий (около двух ложек). Прилагательное согласуется с καφές — мужской род, а не с тем, кто заказывает: женщина тоже говорит **Θα ήθελα έναν κυπριακό καφέ μέτριο.** После θα ήθελα — винительный падеж, поэтому σκέτο, μέτριο, γλυκό — без ς. Слово καφέ можно пропустить: **Έναν κυπριακό σκέτο, παρακαλώ.** Два кофе: **δύο κυπριακούς, έναν σκέτο και έναν γλυκό.** Про чай без сахара говорят **τσάι σκέτο** — средний род, как το τσάι.

      **Το καφενείο** — традиционная кипрская кофейня: в каждой деревне есть хотя бы одно, там пьют кофе, играют в нарды и обсуждают новости. **Η ταβέρνα** — таверна, ресторан с домашней кухней.
    table:
      columns:
        - какой кофе
        - именительный
        - заказ (винительный)
      rows:
        - - без сахара
          - ο καφές είναι σκέτος
          - έναν σκέτο
        - - средний
          - ο καφές είναι μέτριος
          - έναν μέτριο
        - - сладкий
          - ο καφές είναι γλυκός
          - έναν γλυκό
        - - чай без сахара
          - το τσάι είναι σκέτο
          - ένα τσάι σκέτο
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: vy-choice
    title: На «вы»
    instruction: Выберите вариант, который подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы спрашиваете пожилого соседа, хочет ли он кофе.
        options:
          - Θέλεις καφέ;
          - Θέλετε καφέ;
          - Θέλουν καφέ;
        answer: Θέλετε καφέ;
        explanation: С незнакомым или старшим человеком — на «вы», форма εσείς — θέλετε.
      - id: q2
        prompt: Вы зовёте господина Никоса.
        options:
          - Κύριε Νίκο!
          - Κύριος Νίκος!
          - Κύριε Νίκος!
        answer: Κύριε Νίκο!
        explanation: Когда зовут человека, κύριος → κύριε, а Νίκος → Νίκο.
      - id: q3
        prompt: Вы зовёте госпожу Елени.
        options:
          - Κυρία Ελένη!
          - Κύριε Ελένη!
          - Κυρίε Ελένη!
        answer: Κυρία Ελένη!
        explanation: Женское слово κυρία и имя Ελένη не меняются.
      - id: q4
        prompt: "Официант подходит к столику: «Τι θα πάρετε;». Что он спрашивает?"
        options:
          - Что вы будете заказывать?
          - Сколько вы заплатите?
          - Откуда вы?
        answer: Что вы будете заказывать?
      - id: q5
        prompt: Вечер. Официант здоровается с гостем.
        options:
          - Καλησπέρα σας!
          - Γεια σου!
          - Καληνύχτα!
        answer: Καλησπέρα σας!
        explanation: Гость — незнакомый человек, поэтому σας. Καληνύχτα говорят на прощание перед сном.
      - id: q6
        prompt: Вы спрашиваете официанта, говорит ли он по-английски.
        options:
          - Μιλάς αγγλικά;
          - Μιλάτε αγγλικά;
          - Μιλάνε αγγλικά;
        answer: Μιλάτε αγγλικά;
        explanation: "Μιλάνε — «они говорят». Официанту — на «вы»: μιλάτε."
  - type: exercise
    id: polite-choice
    title: Вежливая просьба
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы вежливо заказываете кофе.
        options:
          - Θα ήθελα έναν καφέ, παρακαλώ.
          - Θα ήθελα ένας καφές, παρακαλώ.
          - Θα ήθελα τον καφές, παρακαλώ.
        answer: Θα ήθελα έναν καφέ, παρακαλώ.
        explanation: "После θα ήθελα, как после θέλω, — винительный падеж: έναν καφέ."
      - id: q2
        prompt: Можно мне стакан воды?
        options:
          - Μπορώ να έχω ένα ποτήρι νερό;
          - Μπορείς να έχω ένα ποτήρι νερό;
          - Μπορώ να έχεις ένα ποτήρι νερό;
        answer: Μπορώ να έχω ένα ποτήρι νερό;
        explanation: "Оба глагола — в форме «я»: μπορώ να έχω."
      - id: q3
        prompt: Μπορείτε να μας ___ τον κατάλογο, παρακαλώ;
        options:
          - φέρετε
          - φέρω
          - φέρει
        answer: φέρετε
        explanation: Вы просите официанта, поэтому форма «вы» — φέρετε. Φέρω — «я», φέρει — «он».
      - id: q4
        prompt: Мы бы хотели два кофе.
        options:
          - Θα θέλαμε δύο καφέδες.
          - Θα θέλαμε δύο καφές.
          - Θα ήθελε δύο καφέδες.
        answer: Θα θέλαμε δύο καφέδες.
        explanation: "«Мы» — θα θέλαμε (θα ήθελε — «он бы хотел»). Два — мн. ч.: οι καφέδες, в винительном та же форма."
      - id: q5
        prompt: Вы входите в таверну вдвоём с подругой.
        options:
          - Ένα τραπέζι για δύο, παρακαλώ.
          - Ένα τραπέζι για δύο ευρώ, παρακαλώ.
          - Δύο τραπέζια, παρακαλώ.
        answer: Ένα τραπέζι για δύο, παρακαλώ.
      - id: q6
        prompt: Вы не знаете, что выбрать, и спрашиваете совета у официанта.
        options:
          - Τι μας προτείνετε;
          - Τι θα πάρετε;
          - Τι κάνετε;
        answer: Τι μας προτείνετε;
        explanation: Τι θα πάρετε; — вопрос официанта, а не гостя. Τι κάνετε; — «Как дела?».
  - type: exercise
    id: coffee-choice
    title: Какой кофе
    instruction: Выберите форму прилагательного.
    format: choice
    items:
      - id: q1
        prompt: Θα ήθελα έναν κυπριακό καφέ ___. (без сахара)
        options:
          - σκέτο
          - σκέτος
          - σκέτη
        answer: σκέτο
        explanation: После θα ήθελα — винительный падеж мужского рода, как έναν καφέ.
      - id: q2
        prompt: Ο καφές μου είναι ___. (средней сладости)
        options:
          - μέτριο
          - μέτριος
          - μέτρια
        answer: μέτριος
        explanation: Здесь ο καφές — подлежащее, поэтому именительный падеж — μέτριος.
      - id: q3
        prompt: Ένα τσάι ___, παρακαλώ. (без сахара)
        options:
          - σκέτο
          - σκέτος
          - σκέτη
        answer: σκέτο
        explanation: "το τσάι — средний род: σκέτο."
      - id: q4
        prompt: Какой кофе заказывают, если любят сладкий — примерно с двумя ложками сахара?
        options:
          - γλυκό
          - μέτριο
          - σκέτο
        answer: γλυκό
        explanation: Σκέτος — без сахара, μέτριος — около ложки, γλυκός — около двух.
      - id: q5
        prompt: "Мария (о себе): Εγώ θα ήθελα έναν κυπριακό ___. (средней сладости)"
        options:
          - μέτριο
          - μέτρια
          - μέτριος
        answer: μέτριο
        explanation: Прилагательное согласуется с кофе (мужской род, винительный), а не с Марией.
  - type: exercise
    id: words-match
    title: Слова урока
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - ο κατάλογος
      - η παραγγελία
      - τα ορεκτικά
      - το επιδόρπιο
      - η μερίδα
      - η σερβιτόρα
      - η ποικιλία
      - το μπρίκι
      - το φλιτζάνι
      - το καφενείο
    items:
      - id: m1
        prompt: меню
        answer: ο κατάλογος
      - id: m2
        prompt: заказ
        answer: η παραγγελία
      - id: m3
        prompt: закуски
        answer: τα ορεκτικά
      - id: m4
        prompt: десерт
        answer: το επιδόρπιο
      - id: m5
        prompt: порция
        answer: η μερίδα
      - id: m6
        prompt: официантка
        answer: η σερβιτόρα
      - id: m7
        prompt: джезва, турка
        answer: το μπρίκι
        explanation: В μπρίκι варят кофе, а пьют его из φλιτζάνι — чашки.
      - id: m8
        prompt: ассорти
        answer: η ποικιλία
  - type: exercise
    id: taverna-gap
    title: В таверне
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - ελεύθερο
      - κατάλογο
      - ορεκτικό
      - επιδόρπιο
      - μερίδα
      - σερβιτόρα
      - προτείνετε
      - διαλέγω
      - φλιτζάνι
      - παραγγελία
    items:
      - id: g1
        prompt: — Καλησπέρα! Είναι ___ αυτό το τραπέζι; — Ναι, παρακαλώ.
        answer: ελεύθερο
        explanation: "το τραπέζι — средний род: ελεύθερο."
      - id: g2
        prompt: Μπορείτε να μας φέρετε τον ___, παρακαλώ;
        answer: κατάλογο
        explanation: "τον — мужской род, винительный падеж: ο κατάλογος → τον κατάλογο."
      - id: g3
        prompt: Πρώτα θα ήθελα ένα ___ και μετά ένα κυρίως πιάτο. (πρώτα — сначала)
        answer: ορεκτικό
        explanation: Перед основным блюдом едят закуску — ορεκτικό.
      - id: g4
        prompt: Η Άννα δουλεύει ___ σε μια ταβέρνα στη Λάρνακα.
        answer: σερβιτόρα
      - id: g5
        prompt: Μια ___ πατάτες, παρακαλώ.
        answer: μερίδα
        explanation: μια μερίδα πατάτες — «порция картошки», без артикля и предлога.
      - id: g6
        prompt: — Τι μας ___; — Το κλέφτικο είναι πολύ νόστιμο!
        answer: προτείνετε
      - id: g7
        prompt: Δεν τρώω κρέας, γι' αυτό πάντα ___ ψάρι ή σαλάτα. (γι' αυτό — поэтому)
        answer: διαλέγω
      - id: g8
        prompt: Μετά το κυρίως πιάτο θέλουμε ένα ___ — γιαούρτι με μέλι. (μέλι — мёд)
        answer: επιδόρπιο
        explanation: После основного блюда — десерт, το επιδόρπιο.
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я бы хотел(а) кипрский кофе средней сладости.
        answer:
          - Θα ήθελα έναν κυπριακό καφέ μέτριο.
          - Θα ήθελα έναν μέτριο κυπριακό καφέ.
          - Θα ήθελα έναν κυπριακό μέτριο.
          - Θα ήθελα έναν μέτριο κυπριακό.
        explanation: "Винительный падеж: έναν κυπριακό καφέ μέτριο — все слова без ς."
      - id: q2
        prompt: Столик на двоих, пожалуйста.
        answer:
          - Ένα τραπέζι για δύο, παρακαλώ.
          - Ένα τραπέζι για δύο παρακαλώ.
          - Ένα τραπέζι για δυο, παρακαλώ.
          - Ένα τραπέζι για δυο παρακαλώ.
      - id: q3
        prompt: Этот столик свободен?
        answer:
          - Είναι ελεύθερο αυτό το τραπέζι;
          - Αυτό το τραπέζι είναι ελεύθερο;
          - Είναι αυτό το τραπέζι ελεύθερο;
      - id: q4
        prompt: Можно мне стакан воды?
        answer:
          - Μπορώ να έχω ένα ποτήρι νερό;
      - id: q5
        prompt: Что вы нам посоветуете?
        answer:
          - Τι μας προτείνετε;
      - id: q6
        prompt: Можно нам меню, пожалуйста? (Можете принести нам меню?)
        answer:
          - Μπορείτε να μας φέρετε τον κατάλογο, παρακαλώ;
          - Μπορείτε να μας φέρετε τον κατάλογο παρακαλώ;
          - Μπορείτε να μας φέρετε το μενού, παρακαλώ;
          - Μπορείτε να μας φέρετε το μενού παρακαλώ;
      - id: q7
        prompt: Господин Никос, вы говорите по-английски?
        answer:
          - Κύριε Νίκο, μιλάτε αγγλικά;
          - Κύριε Νίκο μιλάτε αγγλικά;
        explanation: При обращении — Κύριε Νίκο, и глагол на «вы» — μιλάτε.
