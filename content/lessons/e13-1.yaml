blocks:
  - type: explanation
    id: defining
    title: Определительные придаточные — кто или что именно
    body: |-
      Когда вам ставят задачу, вы уточняете, о каких пользователях, сервисах и ограничениях идёт речь. Для этого нужны придаточные определительные (relative clauses): они описывают существительное и начинаются со слов **who**, **which**, **that**, **whose**, **where**.

      **Defining relative clause** отвечает на вопрос «какой именно?». Без него неясно, о ком или о чём речь, поэтому его не отделяют запятыми: **Users who forget their password can reset it by email.** Речь только о тех пользователях, которые забыли пароль.

      **Who** — для людей, **which** — для вещей, **that** — и для людей, и для вещей (в определительных придаточных). **Whose** показывает принадлежность: **a team whose service is slow**. **Where** относится к месту или системе: **a system where consistency matters more than speed**.

      **Опущение.** Если слово who, which или that — дополнение внутри придаточного, его можно опустить: **The requirement (that) we agreed on is fixed.** Если оно подлежащее, его опустить нельзя: **a service that sends emails** (в *a service sends emails* придаточного нет, и смысл другой).
    table:
      columns:
        - слово
        - к чему относится
        - пример
      rows:
        - - who
          - человек
          - "a user who forgets the password"
        - - which
          - вещь, сервис, система
          - "a service which stores the data"
        - - that
          - человек или вещь
          - "a service that sends emails"
        - - whose
          - принадлежность
          - "a team whose service is slow"
        - - where
          - место, система, ситуация
          - "a system where consistency matters more than speed"
        - - "опущено"
          - слово — дополнение придаточного
          - "The requirement we agreed on is fixed."
  - type: explanation
    id: non-defining
    title: Дополнительные сведения — non-defining и запятые
    body: |-
      **Non-defining relative clause** добавляет сведения о существительном, которое и без них понятно. Придаточное отделяют запятыми с двух сторон; если оно стоит в конце, запятая стоит перед ним. Из предложения его можно убрать, смысл основной части сохранится: **The notification service, which sends about ten thousand emails a day, must stay online.**

      В non-defining используют **who** (люди) и **which** (вещи), **whose** и **where**. **That** здесь не ставят, и опустить слово нельзя: *The service, that sends emails, is slow* — ошибка, верно **The service, which sends emails, is slow.**

      **Which** может относиться ко всей главной части: **The files are stored twice, which is why they are safe.** Запятая перед ним обязательна.

      Запятые меняют смысл. **The engineers who work on the API are in Berlin.** — в Берлине только те инженеры, которые работают над API. **The engineers, who work on the API, are in Berlin.** — все инженеры (о которых речь) в Берлине, а работа над API — дополнительное сведение.
    table:
      columns:
        - признак
        - defining
        - non-defining
      rows:
        - - запятые
          - нет
          - "есть: с двух сторон или перед придаточным в конце"
        - - слова
          - who, which, that, whose, where
          - "who, which, whose, where; that нельзя"
        - - опустить слово
          - можно, если оно дополнение
          - нельзя
        - - роль
          - называет, о ком или о чём речь
          - добавляет сведение
        - - пример
          - "A user who forgets the password can reset it."
          - "The service, which runs on two servers, is stable."
  - type: explanation
    id: relative-mistakes
    title: Типичные ошибки русскоговорящих
    body: |-
      **Запятая перед придаточным.** По-русски запятая перед «который» обязательна, в английском определительное придаточное без запятых: *Users, who forget the password, can reset it* означает, что все пользователи забывают пароль. Если речь о части пользователей, запятых нет: **Users who forget the password can reset it.**

      **That с запятыми.** В non-defining вместо **that** нужно **which** или **who**: **The report, which Anders wrote, is short.**

      **Повторное местоимение.** Русское «сервис, который он отправляет» не переносится: слово who или which уже заменяет существительное. *The service that it sends emails* и *the user who he forgot the password* — ошибки. Верно: **the service that sends emails**, **the user who forgot the password**.

      **What вместо that.** **What** не вводит определительное придаточное: *the requirements what we agreed* ошибочно, верно **the requirements that we agreed on** или **the requirements we agreed on.**

      **Which о человеке.** Для людей используют **who** или **that**: *a user which forgets the password* ошибочно.

      **Whose.** Русское «чей» передаёт **whose**: *a team that its service is slow* — ошибка, верно **a team whose service is slow.**
    table:
      columns:
        - ошибка
        - верно
        - правило
      rows:
        - - "Users, who forget the password, can reset it. (речь о части пользователей)"
          - Users who forget the password can reset it.
          - defining — без запятых
        - - "The service, that sends emails, is slow."
          - "The service, which sends emails, is slow."
          - в non-defining нет that
        - - The service that it sends emails is slow.
          - The service that sends emails is slow.
          - местоимение не повторяют
        - - The requirements what we agreed are fixed.
          - The requirements that we agreed on are fixed.
          - what не вводит определительное придаточное
        - - A user which forgets the password can reset it.
          - A user who forgets the password can reset it.
          - для людей — who или that
        - - A team that its service is slow needs help.
          - A team whose service is slow needs help.
          - принадлежность — whose
  - type: explanation
    id: requirements-words
    title: Слова урока — требования, нагрузка, данные
    body: |-
      Слова урока образуют три группы.

      **Требования и ограничения.** **A requirement** — требование: условие, которому должна отвечать система. **A constraint** — ограничение извне: срок, бюджет, технология, закон. **A non-goal** — то, что проект сознательно не делает. **A user story** — пользовательская история, **acceptance criteria** — критерии приёмки. **An assumption** — допущение, которое записывают, пока оно не подтверждено. **An API contract** — договорённость о формате запросов и ответов.

      **Сценарии.** **A happy path** — основной сценарий без ошибок, **an edge case** — крайний случай: пустой список, очень длинное имя, одновременные запросы. **A stress test** проверяет систему под нагрузкой выше ожидаемой.

      **Нагрузка и данные.** **Peak load** — пиковая нагрузка, **concurrent users** — те, кто работает с системой в один и тот же момент. **Load shedding** — сознательный отказ от части запросов при перегрузке. **Read-heavy** и **write-heavy** — системы, где данные чаще читают или чаще записывают. **Data volume** — объём данных, **a retention period** — срок их хранения. **A ballpark figure** — прикидочное число без точного расчёта.
