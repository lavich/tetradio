    id: words
    title: Слова и фразы урока
  - type: exercise
    id: pronoun-choice
    title: Who, which, that, whose, where
    instruction: Выберите слово для пропуска.
    format: choice
    items:
      - id: q1
        prompt: A user ___ forgets the password can reset it by email.
        options: [who, whose, where]
        answer: who
        explanation: Для человека в определительном придаточном стоит who; whose показывает принадлежность, where — место.
      - id: q2
        prompt: The service ___ stores the data runs on two servers.
        options: [which, who, whose]
        answer: which
        explanation: Для вещи стоит which (или that); who относится к людям.
      - id: q3
        prompt: We need a system ___ users can work offline.
        options: [where, who, which]
        answer: where
        explanation: Where относится к системе как к месту, в котором что-то происходит.
      - id: q4
        prompt: The team ___ service is slow needs help.
        options: [whose, who, which]
        answer: whose
        explanation: Whose показывает принадлежность — «чей сервис».
      - id: q5
        prompt: The requirement ___ we agreed on is fixed.
        options: [that, who, whose]
        answer: that
        explanation: Для вещи в defining подходит that (который можно опустить); who относится к людям, whose — к принадлежности.
      - id: q6
        prompt: Users ___ phone is offline can still read their messages.
        options: [whose, who, that]
        answer: whose
        explanation: Whose показывает принадлежность — «чей телефон».
  - type: exercise
    id: commas-choice
    title: Запятые и смысл
    instruction: Выберите предложение, которое подходит к описанию.
    format: choice
    items:
      - id: q1
        prompt: Только часть пользователей работает без сети, и локальная копия нужна именно им.
        options:
          - The users who work offline need a local copy.
          - The users, who work offline need a local copy.
          - The users, who work offline, need a local copy.
        answer: The users who work offline need a local copy.
        explanation: Defining — без запятых; одна запятая ошибочна, две запятые превращают придаточное в дополнительное сведение.
      - id: q2
        prompt: Все пользователи этого приложения работают без сети; это дополнительное сведение.
        options:
          - The users, who work offline, need a local copy.
          - The users who work offline need a local copy.
          - The users, that work offline, need a local copy.
        answer: The users, who work offline, need a local copy.
        explanation: Non-defining — запятые с двух сторон, и that здесь не ставят.
      - id: q3
        prompt: "Выберите верное предложение: придаточное добавляет сведение о сервисе."
        options:
          - The notification service, which sends emails and push messages, is stable.
          - The notification service, that sends emails and push messages, is stable.
          - The notification service, sends emails and push messages, is stable.
        answer: The notification service, which sends emails and push messages, is stable.
        explanation: В non-defining нужны запятые и слово which; that здесь не ставят, нужно which.
      - id: q4
        prompt: "Выберите верное предложение: придаточное называет, о каком ограничении идёт речь."
        options:
          - The constraint we discussed is the deadline.
          - The constraint what we discussed is the deadline.
          - The constraint it we discussed is the deadline.
        answer: The constraint we discussed is the deadline.
        explanation: Слово that можно опустить, потому что оно дополнение; what не вводит определительное придаточное, повтор местоимения it ошибочен.
      - id: q5
        prompt: Клиент один, придаточное добавляет сведение о его системе.
        options:
          - Our client, whose system handles payments, wants a report.
          - Our client whose system handles payments, wants a report.
          - Our client, who system handles payments, wants a report.
        answer: Our client, whose system handles payments, wants a report.
        explanation: Whose показывает принадлежность, запятые стоят с двух сторон; who не принимает существительное после себя.
      - id: q6
        prompt: Письмо получает только тот пользователь, который забыл пароль.
        options:
          - A user who forgets the password gets an email.
          - A user, who forgets the password, gets an email.
          - A user who he forgets the password gets an email.
        answer: A user who forgets the password gets an email.
        explanation: Defining — без запятых; повтор местоимения he ошибочен.
  - type: exercise
    id: scenarios-match
    title: Сценарии и нагрузка
    instruction: Соедините определение с английским словом или выражением. Два варианта лишние.
    format: match
    bank:
      - an edge case
      - a happy path
      - acceptance criteria
      - a non-goal
      - a user story
      - peak load
      - concurrent users
      - a stress test
      - a retention period
    items:
      - { id: m1, prompt: "редкая или предельная ситуация, в которой система может повести себя неожиданно", answer: an edge case }
      - { id: m2, prompt: "основной сценарий, в котором всё идёт как задумано", answer: a happy path }
      - { id: m3, prompt: "условия, по которым проверяют, что задача выполнена", answer: acceptance criteria }
      - { id: m4, prompt: "то, что проект сознательно не делает и что записано в документе", answer: a non-goal }
      - { id: m5, prompt: "короткое описание нужной возможности от лица пользователя", answer: a user story }
      - { id: m6, prompt: "наибольший поток запросов за короткий период", answer: peak load }
      - { id: m7, prompt: "те, кто работает с системой в один и тот же момент", answer: concurrent users }
  - type: exercise
    id: load-gap
    title: Нагрузка и данные
    instruction: Вставьте слово или выражение. Два варианта лишние.
    format: gap
    bank:
      - read-heavy
      - write-heavy
      - data volume
      - a retention period
      - a ballpark figure
      - load shedding
      - an assumption
      - a stress test
      - a non-goal
    items:
      - id: g1
        prompt: Millions of people read the articles on the news site, but editors publish only a few a day, so the site is ___. (с преобладанием чтения)
        answer: read-heavy
      - id: g2
        prompt: A logging service receives thousands of events every second and rarely reads them back, so it is ___. (с преобладанием записи)
        answer: write-heavy
      - id: g3
        prompt: The system stores ten gigabytes of new data every day, so the ___ grows quickly. (объём данных)
        answer: data volume
      - id: g4
        prompt: "Server logs are deleted after thirty days: that is ___ for logs. (срок хранения)"
        answer: a retention period
      - id: g5
        prompt: "I do not know the exact traffic, but I can give you ___: about five thousand requests a second. (прикидочное число)"
        answer: a ballpark figure
      - id: g6
        prompt: When the servers are overloaded, the system refuses some requests on purpose so that the rest can be served. This is called ___. (сброс нагрузки)
        answer: load shedding
      - id: g7
        prompt: "The team recorded ___: the users are mostly in Europe, although nobody has checked it yet. (допущение)"
        answer: an assumption
