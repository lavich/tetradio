blocks:
  - type: explanation
    id: linking
    title: Связываем предложения — που, ότι, όλος
    body: |-
      Чтобы рассказ о семье звучал связно, соединяйте короткие предложения. **Και** — «и», **αλλά** — «но» (модуль 02): Ο αδελφός μου είναι παντρεμένος, αλλά δεν έχει παιδιά.

      **Που** без тоноса — «который, которая, которые». Оно не меняется по роду и числу: ο αδελφός μου **που** μένει στη Λεμεσό — «мой брат, который живёт в Лимасоле»; η φίλη μου **που** είναι γιατρός; οι γονείς μου **που** μένουν στη Ρωσία. С тоносом **πού** — вопрос «где?».

      **Ότι** — «что» после «говорить, писать, знать»: Η μητέρα μου λέει **ότι** η Κύπρος είναι ωραία. Ο Νίκος γράφει **ότι** έχει δύο παιδιά. Не путайте с **τι** — «что?» в вопросе: Τι κάνεις;

      **Όλος** — «весь», **όλοι** — «все»; с ним нужен артикль: **όλη η οικογένεια** — «вся семья», **όλοι οι φίλοι μου** — «все мои друзья», **όλα τα παιδιά** — «все дети».

      Как спросить имя родственника: **Πώς λένε τον αδελφό σου;** — «Как зовут твоего брата?», дословно «как называют твоего брата». После λένε мужской род теряет -ς, как после έχω: τον αδελφό σου, τον πατέρα σου; женский не меняется: Πώς λένε την αδελφή σου; Ответ: **Τον λένε Πέτρο.** — «Его зовут Петрос»; **Τη λένε Μαρία.** — «Её зовут Мария».
    table:
      columns:
        - слово
        - значение
        - пример
      rows:
        - - και
          - и
          - Έχω έναν γιο και μία κόρη.
        - - αλλά
          - но
          - Είμαι παντρεμένη, αλλά δεν έχω παιδιά.
        - - που
          - который
          - η φίλη μου που μένει στην Πάφο
        - - ότι
          - что (союз)
          - Λέει ότι είναι γιατρός.
        - - όλος, όλη, όλο
          - весь
          - όλη η οικογένεια
        - - όλοι, όλες, όλα
          - все
          - όλοι οι φίλοι μου
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: linking-gap
    title: Соединяем предложения
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - που
      - πού
      - ότι
      - τι
      - αλλά
      - όλη
      - όλοι
    items:
      - id: g1
        prompt: Η φίλη μου ___ μένει στην Πάφο είναι δασκάλα.
        answer: που
        explanation: Που без тоноса — «которая».
      - id: g2
        prompt: Ο Νίκος λέει ___ η γυναίκα του είναι από τη Ρωσία.
        answer: ότι
        explanation: После λέει — ότι, «что».
      - id: g3
        prompt: Ο αδελφός μου είναι παντρεμένος, ___ δεν έχει παιδιά.
        answer: αλλά
      - id: g4
        prompt: Τώρα ___ η οικογένειά μου μένει στη Λάρνακα.
        answer: όλη
        explanation: Η οικογένεια — женский род, ед. ч., поэтому όλη.
      - id: g5
        prompt: Στο πάρτι είναι ___ οι φίλοι μου.
        answer: όλοι
        explanation: Οι φίλοι — мужской род, мн. ч., поэтому όλοι.
      - id: g6
        prompt: — Και ___ μένει ο αδελφός σου; — Στη Λεμεσό.
        answer: πού
        explanation: Вопрос «где?» — с тоносом, πού. Без тоноса που — «который».
  - type: exercise
    id: family-questions
    title: Вопросы экзаменатора
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Ναι, έχω έναν αδελφό.
      - Τον λένε Πέτρο.
      - Είναι σαράντα χρονών.
      - Όχι, δεν είμαι παντρεμένη.
      - Μένουν στη Ρωσία.
      - Είναι δασκάλα.
      - Ναι, έχω δύο παιδιά.
      - Είμαι από τη Μόσχα.
    items:
      - id: m1
        prompt: Έχετε αδέλφια;
        answer: Ναι, έχω έναν αδελφό.
        explanation: Αδέλφια — «братья и сёстры»; о детях спрашивают Έχετε παιδιά;
      - id: m2
        prompt: Πώς λένε τον αδελφό σας;
        answer: Τον λένε Πέτρο.
      - id: m3
        prompt: Πόσων χρονών είναι;
        answer: Είναι σαράντα χρονών.
      - id: m4
        prompt: Είστε παντρεμένη;
        answer: Όχι, δεν είμαι παντρεμένη.
      - id: m5
        prompt: Πού μένουν οι γονείς σας;
        answer: Μένουν στη Ρωσία.
      - id: m6
        prompt: Τι δουλειά κάνει η μητέρα σας;
        answer: Είναι δασκάλα.
        explanation: Τι δουλειά κάνει; — «Кем работает?». Профессия — без артикля.
  - type: explanation
    id: writing-how
    title: Как написать о семье
    body: |-
      Первое задание письменного экзамена — дружеский текст. В этом модуле пишем около пяти предложений о семье по схеме ниже. Каждое предложение, кроме приветствия и прощания, — с глаголом: είμαι, έχω, μένει, είναι.

      Правила экзамена прежние: печатные буквы, не целиком ЗАГЛАВНЫЕ; тонос на месте; настоящее имя не пишем — ни своё, ни родственников, придумайте другие.

      Проверьте себя после письма: артикль перед словом с μου (ο γιος μου, а не γιος μου); второй тонос (η οικογένειά μου); возраст — είναι … χρονών, а не έχει; παντρεμένος о мужчине, παντρεμένη о женщине.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - поздороваться
          - Γεια σου, Αντρέα!
        - - семейное положение
          - Είμαι παντρεμένη. / Δεν είμαι παντρεμένος.
        - - дети, братья и сёстры
          - Έχω δύο παιδιά. / Έχω έναν αδελφό. / Δεν έχω αδέλφια.
        - - возраст
          - Ο γιος μου είναι δέκα χρονών.
        - - где живут
          - Οι γονείς μου μένουν στη Ρωσία.
        - - профессия
          - Η αδελφή μου είναι γιατρός.
        - - попрощаться
          - Τα λέμε! / Γράψε μου! (напиши мне)
  - type: exercise
    id: sentences
    title: Предложения о семье
    instruction: Напишите по-гречески. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: У меня один брат.
        answer:
          - Έχω έναν αδελφό.
          - Έχω έναν αδερφό.
          - Έχω μόνο έναν αδελφό.
          - Έχω μόνο έναν αδερφό.
        explanation: После έχω — έναν αδελφό, без -ς.
      - id: q2
        prompt: Моей сестре тридцать лет.
        answer:
          - Η αδελφή μου είναι τριάντα χρονών.
          - Η αδερφή μου είναι τριάντα χρονών.
        explanation: Возраст — с είναι и χρονών. «Моей сестре» — просто η αδελφή μου.
      - id: q3
        prompt: Мои родители живут в России.
        answer:
          - Οι γονείς μου μένουν στη Ρωσία.
      - id: q4
        prompt: Мой муж — врач.
        answer:
          - Ο άντρας μου είναι γιατρός.
        explanation: Профессия после είναι — без артикля.
      - id: q5
        prompt: Я не замужем.
        answer:
          - Δεν είμαι παντρεμένη.
          - Εγώ δεν είμαι παντρεμένη.
      - id: q6
        prompt: Как зовут твоего брата?
        answer:
          - Πώς λένε τον αδελφό σου;
          - Πώς λένε τον αδερφό σου;
      - id: q7
        prompt: Вся моя семья в Москве.
        answer:
          - Όλη η οικογένειά μου είναι στη Μόσχα.
          - Όλη η οικογένειά μου μένει στη Μόσχα.
        explanation: Όλη стоит перед артиклем; οικογένειά μου — со вторым тоносом.
  - type: writing
    id: my-family
    register: friendly
    prompt: "Ваш новый друг с Кипра, Андреас (Αντρέας), просит рассказать о вашей семье. Напишите ему сообщение — около пяти предложений: поздоровайтесь; скажите, женаты вы (замужем) или нет и есть ли у вас дети, братья или сёстры; назовите возраст одного-двух родственников; скажите, где живут ваши родители и кем работает кто-то из семьи; попрощайтесь. Имена придумайте."
    words:
      min: 25
      max: 60
    model: Γεια σου, Αντρέα! Είμαι παντρεμένη και έχω δύο παιδιά, έναν γιο και μία κόρη. Ο γιος μου είναι δέκα χρονών και η κόρη μου είναι έξι. Ο άντρας μου ο Ιγκόρ είναι γιατρός. Οι γονείς μου μένουν στη Ρωσία, στη Σαμάρα. Η αδελφή μου η Όλγα είναι δασκάλα στη Μόσχα. Τα λέμε!
    criteria:
      - Есть приветствие по имени (Γεια σου, Αντρέα!) и дружеское прощание (Τα λέμε! / Γεια σου!)
      - "Сказано о семейном положении и о детях, братьях или сёстрах: Είμαι παντρεμένη… / Έχω… / Δεν έχω…"
      - Назван возраст хотя бы одного родственника — είναι … χρονών, а не έχει
      - Сказано, где живут родители или другие родственники (μένουν στη…), и названа хотя бы одна профессия
      - Притяжательные стоят после слова, перед словом — артикль (ο γιος μου, η μητέρα μου)
      - Второй тонос там, где нужен (η οικογένειά μου), тонос во всех словах из двух и больше слогов
      - Не меньше пяти предложений с глаголом; печатные буквы, не целиком заглавные; имена не настоящие
  - type: explanation
    id: speaking-how
    title: Вопросы о семье на экзамене
    body: |-
      В первой части устного экзамена часто спрашивают о семье. Экзаменатор говорит на «вы», вы отвечаете о себе: **Έχετε αδέλφια;** → **Ναι, έχω…** / **Όχι, δεν έχω αδέλφια.**; **Είστε παντρεμένη;** → **Ναι, είμαι παντρεμένη.**

      Отвечайте полным предложением и добавляйте одну деталь: не просто «Ναι», а «Ναι, έχω μία αδελφή. Τη λένε Ίρα».

      Если экзаменатор показывает фотографию, называйте людей по очереди: **Αυτός είναι…**, **Αυτή είναι…**, **Αυτοί είναι οι γονείς μου**, **Αυτά είναι τα παιδιά μας**. Возраст на фото можно предположить — просто назовите число.
    table:
      columns:
        - вопрос
        - как ответить
      rows:
        - - Έχετε αδέλφια;
          - Ναι, έχω έναν αδελφό. / Όχι, δεν έχω αδέλφια.
        - - Πώς λένε τον αδελφό σας;
          - Τον λένε … / Τη λένε …
        - - Είστε παντρεμένος; / Είστε παντρεμένη;
          - Ναι, είμαι παντρεμένος (παντρεμένη). / Όχι, δεν είμαι.
        - - Έχετε παιδιά;
          - Ναι, έχω έναν γιο. / Όχι, δεν έχω παιδιά.
        - - Πόσων χρονών είναι;
          - Είναι … χρονών.
        - - Πού μένουν οι γονείς σας;
          - Οι γονείς μου μένουν στη …
  - type: speaking
    id: interview
    part: interview
    prompt: |-
      Экзаменатор задаёт вопросы о семье. Прочитайте каждый вопрос вслух, затем ответьте без подготовки и запишите ответы:
      Έχετε αδέλφια; Πώς λένε τον αδελφό σας ή την αδελφή σας; Είστε παντρεμένος ή παντρεμένη; Έχετε παιδιά; Πού μένουν οι γονείς σας;
    seconds: 90
    model: Ναι, έχω μία αδελφή. Τη λένε Ίρα. Ναι, είμαι παντρεμένη. Έχω έναν γιο, είναι οκτώ χρονών. Οι γονείς μου μένουν στη Ρωσία, στη Σαμάρα.
    criteria:
      - Ответили на все пять вопросов полными предложениями
      - "Формы о себе: έχω, δεν έχω, είμαι (а не έχετε, είστε)"
      - Παντρεμένος или παντρεμένη — по своему роду
      - Возраст назван с είναι … χρονών
      - "Притяжательное после слова: η αδελφή μου, οι γονείς μου"
      - Ударение на своём месте (παντρεμένη, αδελφή, παιδιά), δ в αδελφή — [ð], а не [д]
  - type: speaking
    id: photo-talk
    part: interview
    prompt: |-
      Экзаменатор показывает фотографию и просит: «Περιγράψτε τη φωτογραφία» — «Опишите фотографию». Представьте, что это ваша семья, а вы — женщина или мужчина в центре.
      На фото: слева пожилая пара — ваши родители (70 и 68 лет); в центре — вы и ваш муж или жена; справа двое детей — мальчик лет десяти и девочка лет пяти. Скажите, кто есть кто, сколько им лет, и назовите одну-две профессии (придумайте). Говорите 45–60 секунд и запишите ответ.
    seconds: 60
    model: Αυτή είναι η οικογένειά μου. Αυτοί είναι οι γονείς μου. Ο πατέρας μου είναι εβδομήντα χρονών και η μητέρα μου είναι εξήντα οκτώ. Αυτός είναι ο άντρας μου ο Μαξίμ. Είναι δάσκαλος. Αυτά είναι τα παιδιά μας. Ο γιος μας είναι δέκα χρονών και η κόρη μας είναι πέντε.
    criteria:
      - Назвали всех на фото — Αυτός είναι…, Αυτή είναι…, Αυτοί/Αυτά είναι…
      - Возраст хотя бы троих — είναι … χρονών; εβδομήντα и εξήντα не перепутаны
      - "Правильные притяжательные: μου — мои родители, μας — наши общие дети"
      - Названа хотя бы одна профессия, без артикля (Είναι δάσκαλος)
      - Говорили 45–60 секунд без долгих пауз
  - type: exercise
    id: review-numbers
    title: Повторение — числа
    instruction: Какое это число?
    format: choice
    items:
      - id: q1
        prompt: εβδομήντα οκτώ
        options:
          - "78"
          - "68"
          - "88"
        answer: "78"
      - id: q2
        prompt: σαράντα έξι
        options:
          - "46"
          - "64"
          - "36"
        answer: "46"
        explanation: Сначала десятки (σαράντα — 40), потом единицы (έξι — 6).
      - id: q3
        prompt: ενενήντα εννέα
        options:
          - "99"
          - "19"
          - "90"
        answer: "99"
      - id: q4
        prompt: δώδεκα
        options:
          - "12"
          - "2"
          - "20"
        answer: "12"
        explanation: Δώδεκα — 12, δύο — 2, είκοσι — 20.
      - id: q5
        prompt: πενήντα πέντε
        options:
          - "55"
          - "15"
          - "65"
        answer: "55"
        explanation: 15 — δεκαπέντε, 65 — εξήντα πέντε.
  - type: exercise
    id: review-possessive
    title: Повторение — мой, твой, его
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: её сын
        options:
          - ο γιος της
          - ο γιος του
          - ο γιος τους
        answer: ο γιος της
        explanation: Της — «её», του — «его», τους — «их».
      - id: q2
        prompt: наши дети
        options:
          - τα παιδιά μας
          - τα μας παιδιά
          - τα παιδιά σας
        answer: τα παιδιά μας
        explanation: Μας стоит после существительного; σας — «ваши».
      - id: q3
        prompt: ваша семья
        options:
          - η οικογένειά σας
          - η οικογένεια σας
          - η σας οικογένεια
        answer: η οικογένειά σας
      - id: q4
        prompt: их бабушка
        options:
          - η γιαγιά τους
          - η γιαγιά της
          - γιαγιά τους
        answer: η γιαγιά τους
        explanation: Перед существительным с τους всё равно нужен артикль — η γιαγιά τους.
      - id: q5
        prompt: Мне сорок лет.
        options:
          - Είμαι σαράντα χρονών.
          - Έχω σαράντα χρονών.
          - Είμαι σαράντα χρόνια.
        answer: Είμαι σαράντα χρονών.
        explanation: Возраст — είμαι … χρονών.
  - type: exercise
    id: review-phrases
    title: Повторение — фразы
    instruction: Соедините русскую фразу с греческой. Две греческие фразы лишние.
    format: match
    bank:
      - Πόσων χρονών είσαι;
      - Δεν έχω παιδιά.
      - Είσαι παντρεμένος;
      - Αυτή είναι η οικογένειά μου.
      - Είμαι διαζευγμένος.
      - Έχεις αδέλφια;
      - Αυτός είναι ο άντρας μου.
      - Πώς λένε τον αδελφό σου;
    items:
      - id: m1
        prompt: Сколько тебе лет?
        answer: Πόσων χρονών είσαι;
      - id: m2
        prompt: У меня нет детей.
        answer: Δεν έχω παιδιά.
      - id: m3
        prompt: Ты женат?
        answer: Είσαι παντρεμένος;
      - id: m4
        prompt: Это моя семья.
        answer: Αυτή είναι η οικογένειά μου.
      - id: m5
        prompt: Я разведён.
        answer: Είμαι διαζευγμένος.
      - id: m6
        prompt: У тебя есть братья или сёстры?
        answer: Έχεις αδέλφια;
