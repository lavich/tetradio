title: Контрольная модуля 24
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Последняя контрольная курса — 13–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Объявление звучит два раза. В грамматике — всё вперемешку: времена, να и θα, падежи, слабые местоимения.

      Το σημείωμα — записка. В объявлении вы услышите: **ενημερώνει** — сообщает, **θα γίνει** — пройдёт, состоится, **το γραφείο** — офис.
  - type: reading
    id: neighbour-note
    title: Ένα σημείωμα από τη γειτόνισσα
    text: |-
      Καλησπέρα, κυρία Άννα!

      Είμαι η Χρυσάνθη από τον πρώτο όροφο. Αύριο, Σάββατο, φεύγουμε για το χωριό, γιατί έχει πανηγύρι, και θα γυρίσουμε την Τρίτη. Μπορείτε να ποτίζετε τα λουλούδια στο μπαλκόνι μας; Το κλειδί θα το αφήσω στον διαχειριστή, τον κύριο Σάββα. Επίσης, τη Δευτέρα θα έχουμε διακοπή νερού από τις δέκα μέχρι τις δύο — γεμίστε μερικά μπουκάλια με νερό! Αν χρειαστείτε κάτι, πάρτε με τηλέφωνο στο 99 870 215.

      Σας ευχαριστώ πολύ και συγγνώμη για την ενόχληση!
      Χρυσάνθη
    glosses:
      - text: να ποτίζετε
        russian: поливать (ποτίζω)
      - text: γεμίστε
        russian: наполните (γεμίζω)
      - text: Αν χρειαστείτε κάτι
        russian: если вам что-то понадобится
  - type: exercise
    id: note-choice
    about: neighbour-note
    graded: true
    title: Чтение
    instruction: Прочитайте записку и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Γιατί φεύγει η Χρυσάνθη;
        options:
          - Έχει πανηγύρι στο χωριό.
          - Έχει διακοπή νερού στο σπίτι.
          - Πάει διακοπές στην Ελλάδα.
          - Έχει βλάβη ο ανελκυστήρας.
        answer: Έχει πανηγύρι στο χωριό.
        explanation: Φεύγουμε για το χωριό, γιατί έχει πανηγύρι. Отключение воды будет в понедельник, но уезжают не из-за него.
      - id: q2
        prompt: Πότε θα γυρίσει η Χρυσάνθη;
        options:
          - Την Τρίτη.
          - Το Σάββατο.
          - Τη Δευτέρα.
          - Την Κυριακή.
        answer: Την Τρίτη.
      - id: q3
        prompt: Τι ζητάει η Χρυσάνθη από την Άννα;
        options:
          - Να ποτίζει τα λουλούδια.
          - Να πληρώσει τα κοινόχρηστα.
          - Να τηλεφωνήσει στον διαχειριστή.
          - Να έρθει στο πανηγύρι.
        answer: Να ποτίζει τα λουλούδια.
      - id: q4
        prompt: Πού θα βρει η Άννα το κλειδί;
        options:
          - Στον διαχειριστή.
          - Στο μπαλκόνι.
          - Κάτω από την πόρτα.
          - Στο χωριό.
        answer: Στον διαχειριστή.
      - id: q5
        prompt: Что Хрисанфи советует сделать до понедельника?
        options:
          - Να γεμίσει μπουκάλια με νερό.
          - Να τηλεφωνήσει στον δήμο.
          - Να μείνει στο σπίτι.
          - Να πάει στο χωριό.
        answer: Να γεμίσει μπουκάλια με νερό.
        explanation: Τη Δευτέρα θα έχουμε διακοπή νερού — γεμίστε μερικά μπουκάλια.
  - type: listening
    id: village-notice
    title: Ανακοίνωση της κοινότητας
    plays: 2
    transcript:
      - speaker: Ανακοίνωση
        text: Η κοινότητα ενημερώνει τους κατοίκους. Το πανηγύρι του χωριού θα γίνει φέτος στις δεκατέσσερις και δεκαπέντε Αυγούστου, στην πλατεία, δίπλα στην εκκλησία. Θα έχει μουσική, χορούς και παραδοσιακά φαγητά.
      - speaker: Ανακοίνωση
        text: Την πρώτη μέρα, από τις πέντε το απόγευμα, απαγορεύεται η στάθμευση στην πλατεία. Αφήστε τα αυτοκίνητά σας στο γήπεδο του σχολείου. Τα σκουπίδια της Παρασκευής θα τα μαζέψουμε το Σάββατο το πρωί.
      - speaker: Ανακοίνωση
        text: Για πληροφορίες, τηλεφωνήστε στο γραφείο της κοινότητας, από τις οκτώ μέχρι τις δύο. Σας περιμένουμε όλους!
  - type: exercise
    id: notice-tf
    about: village-notice
    graded: true
    title: Аудирование
    instruction: Прослушайте объявление. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το πανηγύρι θα γίνει δίπλα στην εκκλησία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Το πανηγύρι είναι μόνο μία μέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: 14 и 15 августа — два дня.
      - id: q3
        prompt: Την πρώτη μέρα, το βράδυ, δεν μπορείτε να αφήσετε το αυτοκίνητο στην πλατεία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Από τις πέντε το απόγευμα απαγορεύεται η στάθμευση στην πλατεία.
      - id: q4
        prompt: Τα σκουπίδια της Παρασκευής θα τα μαζέψουν την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το Σάββατο το πρωί.
      - id: q5
        prompt: Μπορείτε να τηλεφωνήσετε στο γραφείο της κοινότητας στις έξι το απόγευμα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Офис работает с восьми до двух.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Πέρσι ___ σε μια μονοκατοικία στην Πάφο.
        options:
          - μέναμε
          - θα μείνουμε
          - μένουμε
        answer: μέναμε
        explanation: Πέρσι — прошлое; из вариантов только μέναμε — прошедшая форма.
      - id: q2
        prompt: Αύριο ο διαχειριστής ___ με τον τεχνικό για τον ανελκυστήρα.
        options:
          - θα μιλήσει
          - μίλησε
          - μιλούσε
        answer: θα μιλήσει
        explanation: Αύριο — будущее с θα.
      - id: q3
        prompt: Μπορείτε να ___ τα σκουπίδια μετά τις οκτώ το βράδυ;
        options:
          - βγάλετε
          - βγάλατε
          - βγάζατε
        answer: βγάλετε
        explanation: После μπορώ να — форма от основы аориста с окончаниями настоящего (να βγάλετε); βγάλατε и βγάζατε — прошедшие формы.
      - id: q4
        prompt: Ο θόρυβος ___ ενοχλεί κάθε βράδυ. (нас)
        options:
          - μας
          - εμείς
          - τους
        answer: μας
        explanation: Слабое местоимение перед глаголом — μας.
      - id: q5
        prompt: Πού είναι ο κάδος ___;
        options:
          - ανακύκλωσης
          - ανακύκλωση
          - την ανακύκλωση
        answer: ανακύκλωσης
        explanation: «Бак (для) чего» — родительный падеж, η ανακύκλωση → ανακύκλωσης.
      - id: q6
        prompt: Απαγορεύεται ___ στάθμευση μπροστά στην πόρτα.
        options:
          - η
          - την
          - της
        answer: η
        explanation: После απαγορεύεται — именительный падеж, как в Απαγορεύεται το κάπνισμα.
      - id: q7
        prompt: — Πλήρωσες τα κοινόχρηστα; — Ναι, ___ πλήρωσα χθες.
        options:
          - τα
          - τις
          - το
        answer: τα
        explanation: Τα κοινόχρηστα — средний род мн. ч.
      - id: q8
        prompt: Όταν ήμουν παιδί, ___ με τα παιδιά των γειτόνων στην αυλή κάθε απόγευμα.
        options:
          - παίζαμε
          - θα παίξουμε
          - παίζουμε
        answer: παίζαμε
        explanation: Όταν ήμουν παιδί… κάθε απόγευμα — привычка в прошлом, παρατατικός.
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите глагол в нужной форме — по подсказке в скобках.
    format: text
    items:
      - id: q1
        prompt: Χθες ___ τα παλιά ρούχα στον κάδο. (πετάω, εγώ)
        answer:
          - πέταξα
      - id: q2
        prompt: Αύριο ___ τα κοινόχρηστα. (πληρώνω, εγώ — будущее, два слова)
        answer:
          - θα πληρώσω
      - id: q3
        prompt: Συγγνώμη, δεν θέλω να σας ___. (ενοχλώ)
        answer:
          - ενοχλήσω
          - ενοχλώ
        explanation: Δεν θέλω να σας ενοχλήσω — «не хочу вас побеспокоить» (один раз); δεν θέλω να σας ενοχλώ — тоже верно («беспокоить», вообще).
      - id: q4
        prompt: Παλιά στη γειτονιά όλοι ___ ο ένας τον άλλον. (ξέρω, παρατατικός; ο ένας τον άλλον — друг друга)
        answer:
          - ήξεραν
          - ξέρανε
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - ο γείτονας
      - ο δήμος
      - το πρόστιμο
      - ο ιδιοκτήτης
      - η βλάβη
      - το πανηγύρι
      - ο κάτοικος
      - η αγγελία
    items:
      - id: m1
        prompt: сосед
        answer: ο γείτονας
      - id: m2
        prompt: муниципалитет
        answer: ο δήμος
      - id: m3
        prompt: штраф
        answer: το πρόστιμο
      - id: m4
        prompt: хозяин квартиры
        answer: ο ιδιοκτήτης
      - id: m5
        prompt: поломка
        answer: η βλάβη
      - id: m6
        prompt: сельский праздник
        answer: το πανηγύρι
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы хотите узнать у соседки, когда вывозят мусор.
        options:
          - Πότε μαζεύουν τα σκουπίδια;
          - Πού είναι ο κάδος ανακύκλωσης;
          - Πόσα είναι τα κοινόχρηστα;
        answer: Πότε μαζεύουν τα σκουπίδια;
      - id: q2
        prompt: В квартиру напротив въехала новая семья. Вы их приветствуете.
        options:
          - Καλώς ήρθατε στη γειτονιά!
          - Συγγνώμη για την ενόχληση.
          - Καλή χρονιά!
        answer: Καλώς ήρθατε στη γειτονιά!
      - id: q3
        prompt: В 23:30 у соседей громкая музыка. Вы вежливо просите сделать потише.
        options:
          - Μπορείτε να κάνετε λίγη ησυχία, παρακαλώ;
          - Απαγορεύεται το κάπνισμα.
          - Έχουμε διακοπή ρεύματος.
        answer: Μπορείτε να κάνετε λίγη ησυχία, παρακαλώ;
      - id: q4
        prompt: Вы звоните управляющему — во всей квартире погас свет.
        options:
          - Έχουμε διακοπή ρεύματος.
          - Έχω ένα πρόβλημα με το νερό.
          - Ο ανελκυστήρας δεν λειτουργεί.
        answer: Έχουμε διακοπή ρεύματος.
      - id: q5
        prompt: Вы звоните в дверь соседке поздно вечером, чтобы попросить соль. С чего начать?
        options:
          - Συγγνώμη για την ενόχληση.
          - Καλώς ήρθατε στη γειτονιά!
          - Απαγορεύεται η στάθμευση.
        answer: Συγγνώμη για την ενόχληση.
