title: Отзыв, ролевая игра и повторение
kind: lesson
items:
  - kind: word
    id: w332
  - kind: phrase
    id: p118
blocks:
  - type: explanation
    id: complain
    title: Вежливая жалоба
    body: |-
      Жалуются по-гречески так же, как по-русски: сначала извинение, потом проблема, потом просьба. Схема: **Συγγνώμη, αλλά…** + что не так + **Μπορείτε να μου φέρετε…;** Например: **Συγγνώμη, αλλά το φαγητό είναι κρύο.** — «Извините, но еда холодная». **Κρύος** — холодный (κρύος, κρύα, κρύο), противоположное — **ζεστός** — горячий.

      Другие частые проблемы: **Ο καφές μου είναι γλυκός, αλλά θα ήθελα σκέτο.** **Το πιρούνι δεν είναι καθαρό.** **Ο λογαριασμός δεν είναι σωστός** (σωστός — правильный; вы знаете его по ответу Σωστό). **Περιμένουμε πολύ.** Если нужна замена, попросите «другой»: **Μπορείτε να μου φέρετε ένα άλλο πιρούνι;**

      Официант обычно отвечает **Συγγνώμη!** и **Αμέσως!**, а иногда в знак извинения **Κερνάει το μαγαζί.** Гость в ответ на извинение говорит **Δεν πειράζει.** — «Ничего страшного» (модуль 01).

      **Παραπονιέμαι** — «жаловаться», глагол на -μαι (формы — в таблице). Официанту так не говорят — этим словом рассказывают о жалобе: **Η Άννα παραπονιέται για την εξυπηρέτηση.** После για — винительный падеж.
    table:
      columns:
        - лицо
        - παραπονιέμαι
      rows:
        - - εγώ
          - παραπονιέμαι
        - - εσύ
          - παραπονιέσαι
        - - αυτός, αυτή
          - παραπονιέται
        - - εμείς
          - παραπονιόμαστε
        - - εσείς
          - παραπονιέστε
        - - αυτοί, αυτές
          - παραπονιούνται
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: complain-choice
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вам принесли еду, но она холодная.
        options:
          - Συγγνώμη, αλλά το φαγητό είναι κρύο.
          - Το φαγητό είναι πολύ νόστιμο!
          - Κερνάει το μαγαζί.
        answer: Συγγνώμη, αλλά το φαγητό είναι κρύο.
      - id: q2
        prompt: Вы заказали кофе без сахара, а он сладкий.
        options:
          - Συγγνώμη, αλλά ο καφές μου είναι γλυκός. Θα ήθελα σκέτο.
          - Θα ήθελα έναν γλυκό, παρακαλώ.
          - Ο καφές είναι πολύ ωραίος!
        answer: Συγγνώμη, αλλά ο καφές μου είναι γλυκός. Θα ήθελα σκέτο.
      - id: q3
        prompt: Вилка грязная. Вежливо попросите другую.
        options:
          - Συγγνώμη, αλλά το πιρούνι δεν είναι καθαρό. Μπορείτε να μου φέρετε ένα άλλο;
          - Φέρε μου ένα μαχαίρι!
          - Το πιρούνι είναι καινούργιο.
        answer: Συγγνώμη, αλλά το πιρούνι δεν είναι καθαρό. Μπορείτε να μου φέρετε ένα άλλο;
      - id: q4
        prompt: Официант извиняется и приносит десерт бесплатно. Что он говорит?
        options:
          - Κερνάει το μαγαζί.
          - Κρατήστε τα ρέστα.
          - Μαζί ή χωριστά;
        answer: Κερνάει το μαγαζί.
        explanation: Κρατήστε τα ρέστα говорит гость, когда оставляет сдачу.
      - id: q5
        prompt: В счёте ошибка.
        options:
          - Συγγνώμη, αλλά ο λογαριασμός δεν είναι σωστός.
          - Τον λογαριασμό, παρακαλώ.
          - Κρατήστε τα ρέστα.
        answer: Συγγνώμη, αλλά ο λογαριασμός δεν είναι σωστός.
        explanation: Τον λογαριασμό, παρακαλώ — просьба принести счёт, а не жалоба.
      - id: q6
        prompt: Η Άννα ___ για το φαγητό.
        options:
          - παραπονιέται
          - παραπονιέμαι
          - παραπονιούνται
        answer: παραπονιέται
        explanation: "Η Άννα — «она»: παραπονιέται, как έρχεται."
  - type: explanation
    id: writing-how
    title: Как написать отзыв о кафе
    body: |-
      Сегодня текст — отзыв на сайте или в приложении, около 60 слов (50–70): чуть больше, чем в модулях 05–08. Читатели — незнакомые люди, поэтому к ним обращаются на «вы»: **Σας προτείνω…** — «Советую вам…». Приветствие и прощание, как в письме другу, не нужны.

      План из пяти шагов. 1) Где кафе и какое оно: Το καφενείο «…» στη Λάρνακα είναι μικρό και παλιό. 2) Когда и с кем вы туда ходите: Πηγαίνω εκεί το Σάββατο με τους φίλους μου. 3) Что вы берёте и что советуете: Πίνω πάντα έναν κυπριακό μέτριο. Σας προτείνω το ψητό χαλλούμι. 4) Что хорошо и что плохо — обслуживание, цены: Η εξυπηρέτηση είναι καλή, αλλά… 5) Итог одной фразой.

      Пишите в настоящем времени, как в отзыве из урока 2. Проверьте себя после письма. После **πίνω, παραγγέλνω, προτείνω, διαλέγω** — винительный падеж: τον καφέ, έναν σκέτο, την ποικιλία. Прилагательное — в роде существительного: το φαγητό νόστιμο, η εξυπηρέτηση καλή, ο λογαριασμός φτηνός. Тонос — в каждом слове из двух и больше слогов.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - какое кафе
          - Είναι μικρό / μεγάλο / παλιό / καθαρό.
        - - что вы берёте
          - Πίνω … / Παραγγέλνω συνήθως …
        - - совет читателям
          - Σας προτείνω τον / την / το …
        - - плюс
          - Το φαγητό είναι νόστιμο. Η εξυπηρέτηση είναι καλή.
        - - минус
          - …, αλλά … / Το μόνο κακό είναι ότι …
        - - цены
          - Ο λογαριασμός είναι φτηνός / ακριβός.
  - type: exercise
    id: sentences
    title: Предложения для отзыва
    instruction: Напишите по-гречески. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Кафенио маленькое, но очень чистое.
        answer:
          - Το καφενείο είναι μικρό, αλλά πολύ καθαρό.
          - Το καφενείο είναι μικρό αλλά πολύ καθαρό.
          - Το καφενείο είναι μικρό, αλλά είναι πολύ καθαρό.
          - Το καφενείο είναι μικρό αλλά είναι πολύ καθαρό.
      - id: q2
        prompt: Советую вам рыбу на гриле.
        answer:
          - Σας προτείνω το ψητό ψάρι.
          - Σας προτείνω ψητό ψάρι.
          - Σας προτείνω το ψάρι ψητό.
      - id: q3
        prompt: Обслуживание очень хорошее.
        answer:
          - Η εξυπηρέτηση είναι πολύ καλή.
      - id: q4
        prompt: Порции большие.
        answer:
          - Οι μερίδες είναι μεγάλες.
        explanation: η μερίδα → οι μερίδες; прилагательное тоже во мн. ч. женского рода — μεγάλες.
      - id: q5
        prompt: Мы всегда оставляем чаевые.
        answer:
          - Αφήνουμε πάντα φιλοδώρημα.
          - Πάντα αφήνουμε φιλοδώρημα.
          - Εμείς αφήνουμε πάντα φιλοδώρημα.
          - Εμείς πάντα αφήνουμε φιλοδώρημα.
      - id: q6
        prompt: Я пью кофе без сахара.
        answer:
          - Πίνω τον καφέ σκέτο.
          - Πίνω καφέ σκέτο.
          - Πίνω σκέτο καφέ.
          - Εγώ πίνω τον καφέ σκέτο.
          - Εγώ πίνω καφέ σκέτο.
          - Εγώ πίνω σκέτο καφέ.
        explanation: "После πίνω — винительный падеж: καφέ и σκέτο без ς."
  - type: writing
    id: cafe-review
    register: friendly
    prompt: "Сайт о кафе Кипра просит посетителей оставить отзыв. Напишите отзыв (50–70 слов) о кафе, кафенио или таверне, где вы бываете: где оно и какое, когда и с кем вы туда ходите, что вы заказываете и что советуете читателям (Σας προτείνω…), что хорошо и что плохо — обслуживание, цены."
    words:
      min: 50
      max: 70
    model: Το καφενείο «Μιχάλης» στη Λάρνακα είναι μικρό και παλιό, αλλά πολύ καθαρό. Πηγαίνω εκεί την Κυριακή το πρωί με τον άντρα μου. Ο κύριος Μιχάλης κάνει τον κυπριακό καφέ στο μπρίκι. Εγώ πίνω πάντα έναν μέτριο και ο άντρας μου έναν σκέτο. Σας προτείνω και το χαλλούμι ψητό — είναι πολύ νόστιμο! Η εξυπηρέτηση είναι καλή και ο λογαριασμός φτηνός. Το μόνο κακό είναι ότι δεν έχει πολλά τραπέζια έξω.
    criteria:
      - 50–70 слов; это отзыв для читателей, а не письмо другу — без Γεια σου и Τα λέμε
      - Сказано, где кафе и какое оно; прилагательные согласованы с существительным (το καφενείο μικρό, η εξυπηρέτηση καλή)
      - "Сказано, что вы заказываете; после πίνω, παραγγέλνω, προτείνω — винительный падеж (τον καφέ, έναν μέτριο, το χαλλούμι)"
      - Есть совет читателям на «вы» — Σας προτείνω…
      - Есть и плюс, и минус, связанные αλλά или Το μόνο κακό είναι ότι…
      - Упомянуты обслуживание или цены (η εξυπηρέτηση, ο λογαριασμός, φτηνός / ακριβός)
      - Настоящее время; тонос во всех словах из двух и больше слогов
  - type: explanation
    id: roleplay-how
    title: Ролевая игра по карточке
    body: |-
      В третьей части устного экзамена двое экзаменуемых разыгрывают ситуацию. Каждый получает карточку со своей ролью, около двух минут читает её — и сразу начинается разговор, без подготовки. Оценивают, выполнили ли вы задачу роли, понятно ли вас и реагируете ли вы на партнёра.

      Сегодня ситуация «официант — гость». Лучше играть с партнёром. Если его нет, сыграйте обе роли сами: гостя — обычным голосом, официанта — чуть другим, с короткой паузой перед каждой репликой. Запишите разговор, сверьте с образцом и критериями, потом поменяйтесь ролями или сыграйте ещё раз с другим заказом.

      Опирайтесь на готовые блоки модуля. **Гость:** Ένα τραπέζι για δύο, παρακαλώ. Μπορείτε να μας φέρετε τον κατάλογο; Τι μας προτείνετε; Θα ήθελα… / Θα θέλαμε… Μπορείτε να μου φέρετε…; Συγγνώμη, αλλά… Τον λογαριασμό, παρακαλώ. **Официант:** Καλησπέρα σας! Ελάτε! Τι θα πάρετε; Τι θα πιείτε; Αμέσως! Μαζί ή χωριστά; Κερνάει το μαγαζί.

      Реагируйте на реплики партнёра: **Ωραία!**, **Ευχαριστώ!**, **Δεν πειράζει.** Если не поняли — **Άλλη μια φορά, παρακαλώ.** (модуль 02). Короткий ответ без глагола — нормально: Μαζί. Για πακέτο.
  - type: speaking
    id: taverna
    part: roleplay
    prompt: |-
      Ролевая игра «официант — гость». Вечер, таверна в Пафосе.
      Роль A — гость. Вы пришли вдвоём с другом. Попросите столик на двоих и меню, спросите совета официанта, закажите закуску, основное блюдо и напитки. Потом вежливо пожалуйтесь: еда холодная. В конце попросите счёт и расплатитесь.
      Роль B — официант. Поздоровайтесь на «вы», проводите к столику и дайте меню, посоветуйте блюдо, примите заказ (что будут есть и пить), извинитесь в ответ на жалобу, принесите счёт и спросите, вместе или раздельно.
      Сыграйте с партнёром или обе роли сами и запишите разговор; потом поменяйтесь ролями.
    seconds: 180
    model: "Гость: Καλησπέρα σας! Ένα τραπέζι για δύο, παρακαλώ. — Официант: Καλησπέρα σας! Ελάτε, αυτό το τραπέζι είναι ελεύθερο. Ορίστε ο κατάλογος. — Гость: Ευχαριστώ. Τι μας προτείνετε; — Официант: Το κλέφτικο είναι πολύ νόστιμο σήμερα. Τι θα πάρετε; — Гость: Θα θέλαμε ένα κλέφτικο, ένα ψάρι ψητό και για ορεκτικό μια ποικιλία, παρακαλώ. — Официант: Και τι θα πιείτε; — Гость: Μια κανάτα νερό και δύο ποτήρια κρασί. — Официант: Αμέσως! — Гость: Συγγνώμη, αλλά το φαγητό είναι κρύο. — Официант: Συγγνώμη! Σας φέρνω αμέσως ένα άλλο. — Гость: Δεν πειράζει. … Τον λογαριασμό, παρακαλώ. — Официант: Ορίστε. Μαζί ή χωριστά; — Гость: Μαζί. Κρατήστε τα ρέστα. — Официант: Ευχαριστώ πολύ! Καλό βράδυ!"
    criteria:
      - Обе роли говорят на «вы» (Καλησπέρα σας, μπορείτε, προτείνετε, σας)
      - "Гость использует хотя бы одну вежливую форму — Θα ήθελα…, Θα θέλαμε… или Μπορείτε να μας φέρετε…; — и παρακαλώ"
      - "Заказ — в винительном падеже: ένα κλέφτικο, μια ποικιλία, έναν καφέ, τον λογαριασμό"
      - "Есть вежливая жалоба по схеме Συγγνώμη, αλλά… и ответ официанта (Συγγνώμη! Αμέσως!)"
      - "Официант спрашивает, что будут есть и пить (Τι θα πάρετε; Τι θα πιείτε;), советует блюдо и спрашивает Μαζί ή χωριστά;"
      - Гость просит счёт и расплачивается (Τον λογαριασμό, παρακαλώ; Μαζί / Χωριστά; Κρατήστε τα ρέστα)
      - Реплики связаны — каждый реагирует на партнёра (Ευχαριστώ, Ωραία, Δεν πειράζει), без долгих пауз; вопросы звучат с вопросительной интонацией
  - type: exercise
    id: review-mixed
    title: Повторение — модули 06–09
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Μου αρέσει ___ καφές.
        options:
          - ο
          - τον
        answer: ο
        explanation: После αρέσει — именительный падеж.
      - id: q2
        prompt: Θα ήθελα ___, παρακαλώ.
        options:
          - μια σαλάτα
          - ένας χυμός
          - ο καφές
        answer: μια σαλάτα
        explanation: После θα ήθελα — винительный падеж. Ένας χυμός и ο καφές — именительный.
      - id: q3
        prompt: Στο σαλόνι ___ δύο καναπέδες.
        options:
          - υπάρχει
          - υπάρχουν
        answer: υπάρχουν
        explanation: Несколько вещей — υπάρχουν.
      - id: q4
        prompt: Οι φίλοι μου ___ στην Πάφο.
        options:
          - μένει
          - μένουν
          - μένουμε
        answer: μένουν
      - id: q5
        prompt: Το τραπέζι είναι ___.
        options:
          - ελεύθερος
          - ελεύθερη
          - ελεύθερο
        answer: ελεύθερο
        explanation: το τραπέζι — средний род.
      - id: q6
        prompt: Κύριε ___, τι θα πάρετε;
        options:
          - Γιώργο
          - Γιώργος
          - Γιώργου
        answer: Γιώργο
        explanation: При обращении ο Γιώργος → Γιώργο, как Νίκος → Νίκο. Γιώργου — «Георгия» (форма «чей?»), для обращения не подходит.
      - id: q7
        prompt: Τρώμε ___ πατάτες τηγανητές.
        options:
          - τις
          - τους
          - οι
        answer: τις
        explanation: "οι πατάτες — женский род, мн. ч.; после τρώμε — винительный: τις πατάτες."
