          - τον χυμό
          - οι χυμοί
          - τους χυμούς
        - - ο φίλος
          - τον φίλο
          - οι φίλοι
          - τους φίλους
        - - ο πατέρας
          - τον πατέρα
          - οι πατέρες
          - τους πατέρες
        - - ο καφές
          - τον καφέ
          - οι καφέδες
          - τους καφέδες
        - - η σαλάτα
          - τη σαλάτα
          - οι σαλάτες
          - τις σαλάτες
        - - η φίλη
          - τη φίλη
          - οι φίλες
          - τις φίλες
        - - το ψωμί
          - το ψωμί
          - τα ψωμιά
          - τα ψωμιά
        - - το κρέας
          - το κρέας
          - τα κρέατα
          - τα κρέατα
  - type: explanation
    id: troo-pino
    title: Глаголы τρώω и πίνω
    body: |-
      **Πίνω** — «пить» — спрягается как обычный глагол на -ω (μένω, γράφω). **Τρώω** — «есть» — неправильный, но знакомый по образцу: так же спрягаются λέω (λες, λέει…) и ακούω. Ударение всегда на ώ, в формах нет ι: τρως, τρώει.

      После обоих глаголов — винительный падеж: Τι τρως; — Τρώω **μια σαλάτα**. Τι πίνεις; — Πίνω **έναν χυμό**.

      **Δεν τρώω κρέας.** — «Я не ем мясо». Для «они» у πίνω есть и разговорная форма πίνουνε, у τρώω основная форма — τρώνε.
    table:
      columns:
        - лицо
        - τρώω — есть
        - πίνω — пить
      rows:
        - - εγώ
          - τρώω
          - πίνω
        - - εσύ
          - τρως
          - πίνεις
        - - αυτός, αυτή
          - τρώει
          - πίνει
        - - εμείς
          - τρώμε
          - πίνουμε
        - - εσείς
          - τρώτε
          - πίνετε
        - - αυτοί, αυτές
          - τρώνε
          - πίνουν
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: articles
    title: Какой артикль
    instruction: Выберите артикль винительного падежа.
    format: choice
    items:
      - id: q1
        prompt: Πίνω ___ χυμό.
        options:
          - τον
          - τη
          - το
        answer: τον
        explanation: ο χυμός — мужской род, поэтому τον χυμό.
      - id: q2
        prompt: Τρώω ___ σαλάτα.
        options:
          - τον
          - τη
          - το
        answer: τη
        explanation: η σαλάτα — женский род. Перед σ буква ν выпадает — τη σαλάτα.
      - id: q3
        prompt: Θέλεις ___ ψωμί;
        options:
          - τον
          - τη
          - το
        answer: το
        explanation: Средний род в винительном падеже не меняется — το ψωμί.
      - id: q4
        prompt: Η Άννα πίνει ___ γάλα.
        options:
          - τον
          - τη
          - το
        answer: το
      - id: q5
        prompt: Πίνετε ___ καφέ;
        options:
          - τον
          - τη
          - το
        answer: τον
        explanation: ο καφές → τον καφέ. Окончание καφέ без ς тоже подсказывает мужской род в винительном.
      - id: q6
        prompt: Τρώμε ___ αυγά.
        options:
          - τους
          - τις
          - τα
        answer: τα
        explanation: τα αυγά — средний род, форма та же, что в именительном.
      - id: q7
        prompt: Περιμένω ___ φίλες μου.
        options:
          - τους
          - τις
          - τα
        answer: τις
        explanation: "οι φίλες — женский род, мн. ч.: τις φίλες."
      - id: q8
        prompt: Ψάχνω ___ φίλους μου.
        options:
          - τους
          - τις
          - τα
        answer: τους
        explanation: οι φίλοι → τους φίλους — меняются и артикль, и окончание.
      - id: q9
        prompt: Δίνω ___ τυρί στη Μαρία.
        options:
          - τον
          - τη
          - το
        answer: το
  - type: exercise
    id: forms
    title: Какая форма слова
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Πίνω έναν ___.
        options:
          - χυμός
          - χυμό
          - χυμοί
        answer: χυμό
        explanation: "После πίνω — винительный падеж: έναν χυμό, без ς."
      - id: q2
        prompt: Θέλουμε δύο ___, παρακαλώ.
        options:
          - καφές
          - καφέ
          - καφέδες
        answer: καφέδες
        explanation: Два — множественное число. У ο καφές мн. ч. οι καφέδες, в винительном та же форма.
      - id: q3
        prompt: Περιμένω τον ___ μου.
        options:
          - φίλος
          - φίλο
          - φίλους
        answer: φίλο
      - id: q4
        prompt: Τρώμε με τους ___ μας.
        options:
          - φίλοι
          - φίλο
          - φίλους
        answer: φίλους
        explanation: После με — винительный падеж. Мн. ч. на -οι → -ους.
      - id: q5
        prompt: Αγαπάω τον ___ μου.
        options:
          - πατέρας
          - πατέρα
        answer: πατέρα
      - id: q6
        prompt: Πίνεις ___; (кофе, без артикля)
        options:
          - καφές
          - καφέ
        answer: καφέ
        explanation: И без артикля дополнение стоит в винительном падеже — καφέ.
      - id: q7
        prompt: Θέλω έναν ___ καναπέ.
        options:
          - μεγάλος
          - μεγάλο
        answer: μεγάλο
        explanation: Прилагательное тоже теряет ς — έναν μεγάλο καναπέ.
      - id: q8
        prompt: Η Ελένη τρώει δύο ___.
        options:
          - σουβλάκι
          - σουβλάκια
        answer: σουβλάκια
        explanation: "Средний род на -ι во мн. ч. — -ια: τα σουβλάκια."
  - type: explanation
    id: aresei
    title: Μου αρέσει, μου αρέσουν — «мне нравится»
    body: |-
      По-гречески говорят не «я люблю кофе», а «мне нравится кофе»: **Μου αρέσει ο καφές.** Тот, кому нравится, — короткое слово μου, σου, του, της, μας, σας, τους. Вы знаете их как «мой, твой, его…» (модуль 03), а перед αρέσει они значат «мне, тебе, ему…».

      То, что нравится, — это **подлежащее**, поэтому оно стоит в **именительном** падеже: Μου αρέσει **ο** καφές (не τον καφέ!). Сравните: Πίνω **τον καφέ**, но Μου αρέσει **ο καφές**.

      Глагол согласуется с тем, что нравится: одна вещь — **αρέσει**, несколько — **αρέσουν**: Μου αρέσει το τυρί. Μου αρέσουν τα αυγά. Если нравится действие, после αρέσει идёт **να** и глагол в настоящем времени: Μου αρέσει να πίνω τσάι.

      Отрицание — δεν в начале: **Δεν μου αρέσει** το ψάρι. Вопрос — интонацией: **Σου αρέσει** το χαλλούμι;

      Можно назвать человека: **Στη Μαρία** αρέσει το κρασί — «Марии нравится вино», **Στον Νίκο** αρέσουν τα σουβλάκια (σε + вин. п.). О еде «люблю» по-гречески почти всегда μου αρέσει; αγαπάω звучит как «обожаю».
    table:
      columns:
        - кому
        - одна вещь
        - несколько вещей
      rows:
        - - μου — мне
          - Μου αρέσει ο καφές.
          - Μου αρέσουν τα σουβλάκια.
        - - σου — тебе
          - Σου αρέσει το χαλλούμι;
          - Σου αρέσουν τα αυγά;
        - - του / της — ему / ей
          - Της αρέσει η σαλάτα.
          - Του αρέσουν οι σαλάτες.
        - - μας — нам
          - Μας αρέσει το ψάρι.
          - Μας αρέσουν τα ψάρια.
        - - σας — вам, Вам
          - Σας αρέσει το κρασί;
          - Σας αρέσουν τα σουβλάκια;
        - - τους — им
          - Δεν τους αρέσει το γάλα.
          - Δεν τους αρέσουν τα αυγά.
  - type: exercise
    id: aresei-number
    title: Αρέσει или αρέσουν
    instruction: Выберите форму глагола.
    format: choice
    items:
      - id: q1
        prompt: Μου ___ το τυρί.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσει
      - id: q2
        prompt: Σου ___ τα αυγά;
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσουν
        explanation: τα αυγά — несколько, поэтому αρέσουν.
      - id: q3
        prompt: Δεν μου ___ το κρασί.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσει
      - id: q4
        prompt: Της ___ τα σουβλάκια.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσουν
        explanation: Важно не «ей» (одна), а то, что нравится, — τα σουβλάκια, мн. ч.
      - id: q5
        prompt: Μας ___ να τρώμε ψάρι.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσει
        explanation: Нравится действие (να τρώμε) — всегда αρέσει.
      - id: q6
        prompt: Στον Νίκο ___ οι σαλάτες.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσουν
  - type: exercise
    id: nom-acc
    title: Подлежащее или дополнение
    instruction: Выберите артикль. Помните — после αρέσει стоит именительный падеж, после τρώω, πίνω, θέλω — винительный.
    format: choice
    items:
      - id: q1
        prompt: Μου αρέσει ___ χυμός.
        options:
          - ο
          - τον
        answer: ο
        explanation: "Сок — то, что нравится, подлежащее: ο χυμός."
      - id: q2
        prompt: Πίνω ___ χυμό.
        options:
          - ο
          - τον
        answer: τον
        explanation: "Сок — то, что я пью, дополнение: τον χυμό."
      - id: q3
        prompt: Δεν μου αρέσει ___ σαλάτα.
        options:
          - η
          - τη
        answer: η
      - id: q4
        prompt: Θέλω ___ σαλάτα με τυρί.
        options:
          - η
          - τη
        answer: τη
      - id: q5
        prompt: Σου αρέσουν ___ φίλοι μου;
        options:
          - οι
          - τους
        answer: οι
        explanation: "Друзья — те, кто нравится, подлежащее: οι φίλοι."
      - id: q6
        prompt: Περιμένω ___ φίλους μου.
        options:
          - οι
          - τους
        answer: τους
  - type: exercise
    id: who-likes
    title: Кому нравится
    instruction: Выберите перевод.
    format: choice
    items:
      - id: q1
        prompt: Ей нравится рыба.
        options:
          - Της αρέσει το ψάρι.
          - Του αρέσει το ψάρι.
          - Της αρέσουν το ψάρι.
        answer: Της αρέσει το ψάρι.
        explanation: της — «ей», του — «ему».
      - id: q2
        prompt: Нам нравятся сувлаки.
        options:
          - Μας αρέσουν τα σουβλάκια.
          - Μας αρέσει τα σουβλάκια.
          - Σας αρέσουν τα σουβλάκια.
        answer: Μας αρέσουν τα σουβλάκια.
      - id: q3
        prompt: Вам нравится вино?
        options:
          - Σας αρέσει το κρασί;
          - Σου αρέσει το κρασί;
          - Σας αρέσουν το κρασί;
        answer: Σας αρέσει το κρασί;
        explanation: «Вам» — σας; σου — «тебе».
      - id: q4
        prompt: Им не нравится молоко.
        options:
          - Δεν τους αρέσει το γάλα.
          - Δεν του αρέσει το γάλα.
          - Δεν τους αρέσουν το γάλα.
        answer: Δεν τους αρέσει το γάλα.
  - type: explanation
    id: thelo
    title: Θέλω + винительный падеж
    body: |-
      **Θέλω** (модуль 02) — «хочу»; в кафе и в гостях так просят и заказывают: **Θέλω έναν καφέ.** — «Мне кофе». То, что хотите, — в винительном падеже: **έναν** καφέ, **μία (μια)** σαλάτα, **ένα** τσάι. Вежливее добавить παρακαλώ: **Θέλω ένα ποτήρι νερό, παρακαλώ.** — «Мне стакан воды, пожалуйста».

      После ποτήρι напиток идёт без артикля и без предлога: ένα ποτήρι νερό, ένα ποτήρι κρασί, ένα ποτήρι γάλα.

      После числа от двух — множественное число, тоже в винительном: δύο καφέδες, τρία σουβλάκια, δύο χυμούς.

      Спросить: **Τι θέλεις;** — «Что ты хочешь?», вежливо **Τι θέλετε;** Короткий вопрос: **Θέλεις καφέ;** — «Хочешь кофе?».
    table:
      columns:
        - именительный (подлежащее)
        - винительный (дополнение)
      rows:
        - - Μου αρέσει ο καφές.
          - Θέλω έναν καφέ.
        - - Ο χυμός είναι φτηνός.
          - Πίνω τον χυμό.
        - - Η σαλάτα είναι μεγάλη.
          - Τρώω τη σαλάτα.
        - - Οι φίλοι μου τρώνε ψάρι.
          - Περιμένω τους φίλους μου.
  - type: exercise
    id: verbs
    title: Τρώω или πίνω
    instruction: Вставьте форму глагола τρώω или πίνω. Два слова лишние.
    format: gap
    bank:
      - τρώω
      - τρως
      - τρώει
      - τρώμε
      - τρώνε
      - πίνω
      - πίνεις
      - πίνει
      - πίνουμε
      - πίνουν
    items:
      - id: g1
        prompt: — Τι ___ το πρωί; — Τρώω ψωμί με τυρί.
        answer: τρως
      - id: g2
        prompt: Η Μαρία ___ τσάι με γάλα.
        answer: πίνει
      - id: g3
        prompt: Εμείς ___ ψάρι την Παρασκευή.
        answer: τρώμε
      - id: g4
        prompt: Οι φίλοι μου ___ πολύ καφέ.
        answer: πίνουν
      - id: g5
        prompt: Εγώ δεν ___ κρέας.
        answer: τρώω
      - id: g6
        prompt: Εσύ ___ κρασί;
        answer: πίνεις
      - id: g7
        prompt: Τα παιδιά ___ κοτόπουλο με σαλάτα.
        answer: τρώνε
        explanation: "Τα παιδιά — «они»: τρώνε."
      - id: g8
        prompt: Ο Νίκος ___ ένα σουβλάκι.
        answer: τρώει
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я люблю кофе.
        answer:
          - Μου αρέσει ο καφές.
        explanation: "После αρέσει — именительный падеж: ο καφές."
      - id: q2
        prompt: Я не люблю рыбу.
        answer:
          - Δεν μου αρέσει το ψάρι.
      - id: q3
        prompt: Тебе нравится халлуми?
        answer:
          - Σου αρέσει το χαλλούμι;
          - Σου αρέσει το χαλούμι;
      - id: q4
        prompt: Мы любим сувлаки.
        answer:
          - Μας αρέσουν τα σουβλάκια.
        explanation: τα σουβλάκια — мн. ч., поэтому αρέσουν.
      - id: q5
        prompt: Я не ем мясо.
        answer:
          - Δεν τρώω κρέας.
          - Εγώ δεν τρώω κρέας.
      - id: q6
        prompt: Я пью чай с молоком.
        answer:
          - Πίνω τσάι με γάλα.
          - Εγώ πίνω τσάι με γάλα.
      - id: q7
        prompt: Мне стакан воды, пожалуйста.
