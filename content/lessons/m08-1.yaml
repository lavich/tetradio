blocks:
  - type: explanation
    id: accusative
    title: Винительный падеж — «кого? что?»
    body: |-
      До сих пор существительные стояли в именительном падеже — как подлежащее: **Ο καφές** είναι ωραίος. Но когда слово — дополнение, оно переходит в винительный падеж (η αιτιατική): Πίνω **τον καφέ** — «Я пью кофе».

      Винительный падеж нужен в трёх случаях. Первый — после глагола с прямым дополнением: τρώω, πίνω, θέλω, έχω, αγαπάω, βλέπω, ψάχνω, περιμένω… — **Τρώω το ψωμί**, **Περιμένω τον φίλο μου**. Второй — после предлогов σε, με, για, από, χωρίς: **με τον φίλο μου**, **για τη Μαρία**, **στον φούρνο** (στον = σε + τον). Третий — в выражениях времени: **την Τρίτη**, **το πρωί**.

      Вы уже встречали его во фразах: Πώς λένε **τον** αδελφό σου; Έχω **έναν** αδελφό. Δεν μπορώ **την** Τρίτη.

      Главное — артикль. У среднего рода (το, τα) ничего не меняется. У женского меняется только артикль: η → τη(ν), οι → τις. У мужского меняются и артикль, и окончание: ο φίλος → τον φίλο.

      У **τον** и **έναν** буква ν сейчас пишется всегда — так мужской род отличается от среднего το, ένα. У **την** действует правило модуля 01: ν остаётся перед гласной и перед κ, π, τ, ξ, ψ (и μπ, ντ, γκ, τσ, τζ) — την Κύπρο, την Άννα, но τη σαλάτα, τη Μαρία.
    table:
      columns:
        - род
        - им. п. ед.
        - вин. п. ед.
        - им. п. мн.
        - вин. п. мн.
      rows:
        - - мужской
          - ο
          - τον
          - οι
          - τους
