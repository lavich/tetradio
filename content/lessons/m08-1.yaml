  - type: explanation
    id: acc-nouns
    title: Окончания существительных
    body: |-
      **Мужской род.** В единственном числе конечная **-ς** исчезает: ο χυμός → τον χυμό, ο πατέρας → τον πατέρα, ο καφές → τον καφέ. Во множественном у слов на -ος окончание -οι меняется на **-ους**: οι φίλοι → τους φίλους, οι χυμοί → τους χυμούς. У остальных мужских слов множественное число не меняется: οι καφέδες → τους καφέδες.

      **Женский и средний род.** Само слово не меняется ни в единственном, ни во множественном числе: τη σαλάτα, τις σαλάτες; το ψωμί, τα αυγά.

      Прилагательное меняется вместе с существительным: Θέλω **έναν μεγάλο καναπέ** (модуль 07).

      **Частая ошибка.** О еде и напитках «вообще» артикль часто опускают, как в русском: Πίνω **καφέ** — «Я пью кофе», Θέλω **χυμό** — «Хочу сок». Но слово всё равно в винительном падеже: καφέ, χυμό — без ς.
    table:
      columns:
        - им. п. ед.
        - вин. п. ед.
        - им. п. мн.
        - вин. п. мн.
      rows:
