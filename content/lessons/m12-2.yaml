  - type: exercise
    id: places-match
    title: Куда пойти
    instruction: Куда вы пойдёте? Соедините ситуацию с местом. Два места лишние.
    format: match
    bank:
      - το ταχυδρομείο
      - η τράπεζα
      - το φαρμακείο
      - η αστυνομία
      - το νοσοκομείο
      - το μουσείο
      - το δημαρχείο
      - το πάρκο
      - η εκκλησία
      - ο κυκλικός κόμβος
    items:
      - id: m1
        prompt: Нужно отправить посылку в Россию.
        answer: το ταχυδρομείο
      - id: m2
        prompt: Нужно открыть счёт и получить карту.
        answer: η τράπεζα
      - id: m3
        prompt: Болит голова, нужно лекарство.
        answer: το φαρμακείο
      - id: m4
        prompt: У вас украли сумку.
        answer: η αστυνομία
      - id: m5
        prompt: Друг упал и, кажется, сломал ногу.
        answer: το νοσοκομείο
      - id: m6
        prompt: Хотите посмотреть древние вазы и монеты.
        answer: το μουσείο
      - id: m7
        prompt: Нужно оплатить городской сбор за вывоз мусора.
        answer: το δημαρχείο
      - id: m8
        prompt: Хотите погулять с детьми под деревьями.
        answer: το πάρκο
  - type: exercise
    id: open-closed
    title: Открыто или закрыто
    instruction: Выберите форму прилагательного.
    format: choice
    items:
      - id: q1
        prompt: Η τράπεζα είναι ___ την Κυριακή.
        options:
          - κλειστός
          - κλειστή
          - κλειστό
        answer: κλειστή
      - id: q2
        prompt: Το φαρμακείο είναι ___ μέχρι τις εννέα.
        options:
          - ανοιχτός
          - ανοιχτή
          - ανοιχτό
        answer: ανοιχτό
      - id: q3
        prompt: Τα μουσεία είναι ___ τη Δευτέρα.
        options:
          - κλειστά
          - κλειστές
          - κλειστοί
        answer: κλειστά
        explanation: "τα μουσεία — средний род, мн. ч.: κλειστά."
      - id: q4
        prompt: Ο δρόμος είναι ___ σήμερα.
        options:
          - κλειστός
          - κλειστή
          - κλειστό
        answer: κλειστός
  - type: exercise
    id: gen-places
    title: Родительный падеж — места
    instruction: Поставьте слово в скобках в родительный падеж с артиклем.
    format: text
    items:
      - id: q1
        prompt: Η πόρτα ___ είναι κλειστή. (η τράπεζα)
        answer:
          - της τράπεζας
      - id: q2
        prompt: Περιμένω μπροστά στο κτίριο ___. (το ταχυδρομείο)
        answer:
          - του ταχυδρομείου
      - id: q3
        prompt: Το πάρκο είναι πίσω από το κτίριο ___. (το νοσοκομείο)
        answer:
          - του νοσοκομείου
      - id: q4
        prompt: Ο παππούς μου μένει κοντά στο κτίριο ___. (η αστυνομία)
        answer:
          - της αστυνομίας
      - id: q5
        prompt: Η στάση είναι στη γωνία ___. (η λεωφόρος)
        answer:
          - της λεωφόρου
        explanation: Η λεωφόρος — женский род на -ος, склоняется как ο δρόμος — της λεωφόρου.
      - id: q6
        prompt: Η πόρτα ___ είναι μεγάλη. (το κτίριο)
        answer:
          - του κτιρίου
        explanation: В родительном ударение сдвигается — του κτιρίου, как του δωματίου.
  - type: explanation
    id: signs-how
    title: Как читать вывески
    body: |-
      На экзамене часто дают короткие надписи: вывески, объявления на дверях, указатели. Не нужно понимать каждое слово. Сначала найдите, **что** это за место, потом — **когда** оно работает и **где** находится. Слова ανοιχτό / κλειστό, дни недели и часы вы уже знаете.

      Запомните два частых сокращения: **μ.** — метров, **χλμ.** — километров. Стрелка ← или → показывает направление.
  - type: reading
    id: signs
    title: Στον δρόμο
    text: |-
      Α. ΦΑΡΜΑΚΕΙΟ Κ. ΧΑΤΖΗΑΝΤΩΝΙΟΥ
      Ανοιχτό: Δευτέρα – Παρασκευή 8:00–13:00 και 16:00–19:00
      Σάββατο 8:00–13:00
      Κυριακή: κλειστό

      Β. ΤΑΧΥΔΡΟΜΕΙΟ ΠΛΑΤΕΙΑΣ
      Σήμερα το ταχυδρομείο είναι κλειστό.
      Πηγαίνετε στο ταχυδρομείο της Λεωφόρου Μακαρίου 25, απέναντι από το δημαρχείο.

      Γ. ← ΜΟΥΣΕΙΟ ΤΗΣ ΠΟΛΗΣ 200 μ.
      Είσοδος: 3 € · Παιδιά: δωρεάν

      Δ. ΤΡΑΠΕΖΑ
      ATM 24 ώρες

      Ε. ΝΟΣΟΚΟΜΕΙΟ → 2 χλμ.
      Στον κυκλικό κόμβο: 2η έξοδος

      ΣΤ. ΠΡΟΣΟΧΗ! Διάβαση πεζών. Κοιτάξτε δεξιά.
    glosses:
      - text: Κ. ΧΑΤΖΗΑΝΤΩΝΙΟΥ
        russian: К. Хадзиантониу (фамилия фармацевта)
      - text: Είσοδος
        russian: вход
      - text: δωρεάν
        russian: бесплатно
      - text: ATM
        russian: банкомат
      - text: ΠΡΟΣΟΧΗ
        russian: внимание
      - text: πεζών
        russian: пешеходов
      - text: Κοιτάξτε
        russian: посмотрите
  - type: exercise
    id: signs-tf
    about: signs
    title: Верно или неверно
    instruction: Прочитайте надписи. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το φαρμακείο είναι ανοιχτό την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
      - id: q2
        prompt: Το Σάββατο το φαρμακείο κλείνει στη μία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Σάββατο 8:00–13:00 — в 13:00, то есть в час дня.
      - id: q3
        prompt: Σήμερα μπορείτε να πάτε στο ταχυδρομείο της πλατείας.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Σήμερα το ταχυδρομείο είναι κλειστό.
      - id: q4
        prompt: Το άλλο ταχυδρομείο είναι απέναντι από το δημαρχείο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Τα παιδιά πληρώνουν τρία ευρώ στο μουσείο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Παιδιά: δωρεάν — для детей бесплатно; 3 € платят взрослые."
      - id: q6
        prompt: Το ATM της τράπεζας δουλεύει και το βράδυ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: ATM 24 ώρες — круглосуточно.
      - id: q7
        prompt: Για το νοσοκομείο παίρνουμε την τρίτη έξοδο στον κυκλικό κόμβο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: 2η έξοδος — вторая, а не третья.
  - type: reading
    id: area
    title: Η περιοχή μου
    text: |-
      Με λένε Ελπίδα και μένω στη Λάρνακα, σε μια ήσυχη περιοχή κοντά στο κέντρο.

      Στη μέση της περιοχής υπάρχει μια μικρή πλατεία με μια παλιά εκκλησία. Απέναντι από την εκκλησία είναι το ταχυδρομείο. Δίπλα στην εκκλησία, στα αριστερά, υπάρχει ένα φαρμακείο. Στη γωνία της πλατείας υπάρχουν μια τράπεζα και ένα καφενείο — εκεί πίνω καφέ το πρωί.

      Στα δεξιά της πλατείας είναι η Λεωφόρος Ειρήνης. Εκεί είναι το δημαρχείο, ένα μεγάλο άσπρο κτίριο. Ανάμεσα στο δημαρχείο και την αστυνομία υπάρχει ένα μικρό μουσείο. Είναι ανοιχτό κάθε μέρα εκτός από τη Δευτέρα.

      Αν πάτε ευθεία στη λεωφόρο, μετά από πέντε λεπτά υπάρχει ένας κυκλικός κόμβος. Εκεί πάρτε την πρώτη έξοδο για το νοσοκομείο ή τη δεύτερη για τη θάλασσα.

      Το πάρκο της περιοχής είναι πίσω από την εκκλησία. Εκεί περπατάω κάθε απόγευμα με τον σκύλο μου. Μου αρέσει η περιοχή μου, γιατί δεν είναι μακριά από τη θάλασσα!
    glosses:
      - text: ήσυχη
        russian: тихий
      - text: Στη μέση
        russian: в середине
      - text: Ειρήνης
        russian: Мира (название проспекта)
      - text: εκτός από
        russian: кроме
      - text: Αν πάτε
        russian: если вы пойдёте
      - text: μετά από πέντε λεπτά
        russian: через пять минут
      - text: σκύλο
        russian: собака
  - type: exercise
    id: area-match
    about: area
    title: Что где
    instruction: Прочитайте текст и соедините начало и конец предложения. Два окончания лишние.
    format: match
    bank:
      - είναι το ταχυδρομείο.
      - υπάρχει ένα φαρμακείο.
      - υπάρχουν μια τράπεζα και ένα καφενείο.
      - ανάμεσα στο δημαρχείο και την αστυνομία.
      - πηγαίνει στο νοσοκομείο.
      - πίσω από την εκκλησία.
      - απέναντι από την αστυνομία.
      - κλειστό την Κυριακή.
    items:
      - id: m1
        prompt: Απέναντι από την εκκλησία…
        answer: είναι το ταχυδρομείο.
      - id: m2
        prompt: Δίπλα στην εκκλησία…
        answer: υπάρχει ένα φαρμακείο.
      - id: m3
        prompt: Στη γωνία της πλατείας…
        answer: υπάρχουν μια τράπεζα και ένα καφενείο.
      - id: m4
        prompt: Το μουσείο είναι…
        answer: ανάμεσα στο δημαρχείο και την αστυνομία.
        explanation: Музей закрыт в понедельник, а не в воскресенье — поэтому «κλειστό την Κυριακή» не подходит.
      - id: m5
        prompt: Η πρώτη έξοδος του κυκλικού κόμβου…
        answer: πηγαίνει στο νοσοκομείο.
      - id: m6
        prompt: Το πάρκο είναι…
        answer: πίσω από την εκκλησία.
  - type: exercise
    id: area-choice
    about: area
    title: Выберите ответ
    instruction: Прочитайте текст ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Τι είναι το μεγάλο άσπρο κτίριο;
        options:
          - Το δημαρχείο.
          - Το μουσείο.
          - Η αστυνομία.
          - Η τράπεζα.
        answer: Το δημαρχείο.
      - id: q2
        prompt: Πώς πάμε στη θάλασσα από τον κυκλικό κόμβο;
        options:
          - Από την πρώτη έξοδο.
          - Από τη δεύτερη έξοδο.
          - Από την τρίτη έξοδο.
          - Στρίβουμε αριστερά στο πάρκο.
        answer: Από τη δεύτερη έξοδο.
      - id: q3
        prompt: Τι κάνει η Ελπίδα στο καφενείο;
        options:
          - Πίνει καφέ το πρωί.
          - Τρώει το μεσημέρι.
          - Δουλεύει.
          - Περιμένει τις φίλες της το βράδυ.
        answer: Πίνει καφέ το πρωί.
      - id: q4
        prompt: Γιατί αρέσει στην Ελπίδα η περιοχή της;
        options:
          - Είναι κοντά στη θάλασσα.
          - Είναι στο κέντρο της πόλης.
          - Έχει πολλά μουσεία.
          - Έχει μεγάλα κτίρια.
        answer: Είναι κοντά στη θάλασσα.
        explanation: "Δεν είναι μακριά από τη θάλασσα — «недалеко от моря». Район рядом с центром, но не в центре."
  - type: explanation
    id: listen-how
    title: Как слушать объяснение дороги
    body: |-
      В первом задании экзаменационного аудирования к описанию нужно подобрать картинки. В приложении картинки заменены короткими описаниями по-русски. Здесь вы услышите объяснение дороги и расставите шаги по порядку, как на картинках.

      Перед прослушиванием прочитайте все описания: две картинки лишние, и они похожи на верные — налево вместо направо, первая улица вместо второй. В первый раз слушайте глаголы — πηγαίνετε, στρίψτε, περάστε, πάρτε, ανεβείτε, — во второй раз направления и числительные.

      Два полезных выражения: **λεπτά** — минуты, **με τα πόδια** — пешком: Είναι δέκα λεπτά με τα πόδια. И ещё: в живой речи дорогу часто объясняют настоящим временем: **Πας ευθεία, στρίβεις δεξιά…** — «Идёшь прямо, поворачиваешь направо…». Это то же указание.
  - type: listening
    id: way
    title: Πού είναι το μουσείο;
    plays: 2
    transcript:
      - speaker: Μαρίνα
        text: Συγγνώμη, κύριε! Πού είναι το μουσείο της πόλης;
      - speaker: Πέτρος
        text: Το μουσείο; Δεν είναι μακριά. Είναι δέκα λεπτά με τα πόδια.
      - speaker: Μαρίνα
        text: Ωραία! Πώς πάω;
      - speaker: Πέτρος
        text: Πηγαίνετε ευθεία μέχρι το φανάρι.
      - speaker: Μαρίνα
        text: Μέχρι το φανάρι. Και μετά;
      - speaker: Πέτρος
        text: Στο φανάρι περάστε τον δρόμο και στρίψτε αριστερά. Συνεχίστε μέχρι μια μικρή πλατεία. Εκεί υπάρχει μια μεγάλη εκκλησία.
      - speaker: Μαρίνα
        text: Και στην πλατεία, πάλι αριστερά;
      - speaker: Πέτρος
        text: Όχι, στην πλατεία πάρτε τον δεύτερο δρόμο δεξιά. Όχι τον πρώτο — ο πρώτος πηγαίνει στο νοσοκομείο.
      - speaker: Μαρίνα
        text: Τον δεύτερο δρόμο δεξιά. Εντάξει.
      - speaker: Πέτρος
        text: Μετά ανεβείτε τον δρόμο μέχρι την τράπεζα. Το μουσείο είναι απέναντι από την τράπεζα, δίπλα σε ένα μικρό πάρκο.
      - speaker: Μαρίνα
        text: Ευχαριστώ πολύ! Είναι ανοιχτό σήμερα;
      - speaker: Πέτρος
        text: Ναι, σήμερα είναι ανοιχτό μέχρι τις πέντε. Μόνο τη Δευτέρα είναι κλειστό.
      - speaker: Μαρίνα
        text: Ευχαριστώ, καλή σας μέρα!
      - speaker: Πέτρος
        text: Παρακαλώ! Καλή βόλτα!
  - type: exercise
    id: way-order
    about: way
    title: Шаги по порядку
    instruction: Прослушайте диалог. Какая картинка подходит к каждому шагу? Две картинки лишние.
    format: match
    bank:
      - женщина идёт прямо по улице к светофору
      - женщина переходит улицу на светофоре и поворачивает налево
      - женщина поворачивает на светофоре направо
      - маленькая площадь с большой церковью
      - на площади стрелка показывает на вторую улицу справа
      - на площади стрелка показывает на первую улицу слева
      - женщина поднимается по улице к банку
      - музей напротив банка, рядом с маленьким парком
    items:
      - id: m1
        prompt: Шаг 1
