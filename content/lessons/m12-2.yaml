blocks:
  - type: explanation
    id: places
    title: Места и учреждения
    body: |-
      **Η τράπεζα** — банк, **το ταχυδρομείο** — почта, **το φαρμακείο** — аптека, **το νοσοκομείο** — больница, **η αστυνομία** — полиция, **το δημαρχείο** — мэрия (муниципалитет), **η εκκλησία** — церковь, **το μουσείο** — музей, **το πάρκο** — парк. Многие названия учреждений среднего рода кончаются на **-είο**: ταχυδρομείο, φαρμακείο, νοσοκομείο, δημαρχείο, μουσείο — и καφενείο (модуль 09).

      **Το κέντρο** — центр: **στο κέντρο της πόλης**. **Η περιοχή** — район: Μένω σε μια ωραία περιοχή. **Το κτίριο** — здание. **Ο χάρτης** — карта. **Η διάβαση** — пешеходный переход (полностью η διάβαση πεζών).

      **Η λεωφόρος** — проспект. Слово женского рода, хотя кончается на -ος: **η** Λεωφόρος Μακαρίου, **στη** λεωφόρο. Проспект Макариоса есть во многих городах Кипра. **Ο κυκλικός κόμβος** — круговая развязка; на Кипре их очень много. Съезд с неё — **η έξοδος**: **Στον κυκλικό κόμβο πάρτε την τρίτη έξοδο.**

      **Ανάμεσα σε … και …** — «между»: Το φαρμακείο είναι **ανάμεσα στην τράπεζα και στο ταχυδρομείο** (второе σε можно опустить: … και το ταχυδρομείο).

      **Ανοιχτός** — открытый, **κλειστός** — закрытый. Прилагательное согласуется с местом: **η** τράπεζα είναι **κλειστή**, **το** φαρμακείο είναι **ανοιχτό**. В официальных надписях встречается и написание ανοικτός.

      **Вывески.** Надписи заглавными буквами обычно пишут без тоноса: ΦΑΡΜΑΚΕΙΟ = φαρμακείο, ΤΑΧΥΔΡΟΜΕΙΟ = ταχυδρομείο. На Кипре движение левостороннее: на переходе сначала смотрите направо.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Συγγνώμη, πού είναι η τράπεζα;
          - Извините, где банк?
        - - Είναι απέναντι από το ταχυδρομείο.
          - Это напротив почты.
        - - Είναι στη γωνία, δίπλα στην εκκλησία.
          - Это на углу, рядом с церковью.
        - - Είναι ανάμεσα στο πάρκο και στο μουσείο.
          - Это между парком и музеем.
        - - Στον κυκλικό κόμβο πάρτε την τρίτη έξοδο.
          - На круговой развязке сверните на третий съезд.
