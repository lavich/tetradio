          - Χρόνια πολλά!
          - Χρόνια πολλά! / Επίσης! (имениннику — Ευχαριστώ!)
        - - Рождество
          - Καλά Χριστούγεννα!
          - Επίσης! Καλά Χριστούγεννα!
        - - Новый год
