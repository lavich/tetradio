  - type: explanation
    id: wishes
    title: Как поздравить
    body: |-
      **Χρόνια πολλά!** — универсальное поздравление: с любым праздником, с днём рождения, с именинами. На общий праздник отвечают тем же — Χρόνια πολλά! — или **Επίσης!** («И вас тоже!»). Имениннику отвечать «Επίσης» не нужно: он говорит **Ευχαριστώ!**

      Для дня рождения и именин есть ещё **Να ζήσεις!** — «Многая лета!», а в день рождения — **Να τα εκατοστήσεις!** — «Живи до ста лет!» (εκατό — сто).

      **Εύχομαι** — желать, поздравлять. Кому — σε + вин. п. или слабое местоимение (модуль 17), что — вин. п.: **Σου εύχομαι χρόνια πολλά!** — «Поздравляю тебя!». **Εύχομαι σε όλους καλή χρονιά!** — «Желаю всем хорошего года!». Это глагол на -ομαι, как έρχομαι: εύχομαι, εύχεσαι, εύχεται, ευχόμαστε, εύχεστε, εύχονται. Аорист — **ευχήθηκα**: Ευχήθηκα στη Μαρία χρόνια πολλά.

      **Η ευχή** — пожелание, поздравление: **Ευχαριστώ για τις ευχές!** — «Спасибо за поздравления!».
    table:
      columns:
