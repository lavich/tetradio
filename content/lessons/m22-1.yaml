  - type: exercise
    id: imperfect-choice
    title: Событие или привычка
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Όταν ήμουν παιδί, κάθε Χριστούγεννα ___ τα κάλαντα με τον αδελφό μου.
        options:
          - λέγαμε
          - είπαμε
          - λέμε
        answer: λέγαμε
        explanation: Κάθε Χριστούγεννα, όταν ήμουν παιδί — привычка в прошлом, παρατατικός. «Я с братом» — «мы».
      - id: q2
        prompt: Πρώτα ___ το δέντρο και μετά φάγαμε.
        options:
          - στολίσαμε
          - στολίζαμε
          - στολίζουμε
        answer: στολίσαμε
        explanation: Πρώτα… μετά… — цепочка законченных событий, аорист.
      - id: q3
        prompt: Όταν ήμουν μικρή, τα Χριστούγεννα η γιαγιά μου ___ πάντα για όλη την οικογένεια.
        options:
          - μαγείρευε
          - μαγειρεύει
          - θα μαγειρέψει
        answer: μαγείρευε
        explanation: Όταν ήμουν μικρή… πάντα — привычка в прошлом. Μαγειρεύει — настоящее, θα μαγειρέψει — будущее.
      - id: q4
        prompt: Στο πάρτι όλοι ___ και χόρευαν μέχρι τις τρεις το πρωί.
        options:
          - τραγουδούσαν
          - τραγουδούσε
          - τραγουδάνε
        answer: τραγουδούσαν
        explanation: Όλοι — «они»; рядом χόρευαν — тоже παρατατικός. Τραγουδούσε — «он, она», τραγουδάνε — настоящее.
      - id: q5
        prompt: Εσύ τι ___ τα Χριστούγεννα, όταν ήσουν μικρός;
        options:
          - έκανες
          - έκανα
          - κάνεις
        answer: έκανες
        explanation: Εσύ — окончание -ες. Κάνεις — настоящее, а речь о детстве (ήσουν — «ты был»).
  - type: exercise
    id: imperfect-write
