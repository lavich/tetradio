blocks:
  - type: explanation
    id: calendar
    title: Праздничный год на Кипре и в Греции
    body: |-
      **Η γιορτή** — праздник (мн. ч. οι γιορτές). **Γιορτάζω** — праздновать: Πώς γιορτάζετε τα Χριστούγεννα; Церковные праздники на Кипре и в Греции одни и те же — по православному календарю; национальные дни у каждой страны частично свои.

      **Τα Χριστούγεννα** — Рождество, 25 декабря. Слово только во множественном числе: Τα Χριστούγεννα είναι στις 25 Δεκεμβρίου. «На Рождество» — без предлога, как «в субботу» (το Σάββατο): **Τα Χριστούγεννα** μένουμε στο σπίτι. Перед праздником **στολίζουμε το δέντρο** — наряжаем ёлку. **Η παραμονή** — канун: **την παραμονή των Χριστουγέννων** (των Χριστουγέννων — родительный падеж, запомните целиком) дети ходят по домам и поют **τα κάλαντα** — колядки. Это тоже слово только во мн. ч.: **λέω τα κάλαντα**. Перед Рождеством многие верующие соблюдают **νηστεία** — пост: не едят мяса.

      **Η Πρωτοχρονιά** — Новый год, 1 января. Семья режет (**κόβουμε**) **βασιλόπιτα** — новогодний пирог с монетой внутри (**το φλουρί**). Кому досталась монета, тому весь год повезёт. Традиционно подарки детям приносит Άγιος Βασίλης — святой Василий, в новогоднюю ночь; сейчас многие дарят подарки и на Рождество.

      **Οι Απόκριες** — Масленица, карнавал перед Великим постом (обычно во мн. ч.). На Кипре самый известный карнавал — в Лимасоле.

      **Η Καθαρά Δευτέρα** — Чистый понедельник, первый день Великого поста (**η Σαρακοστή**). Это выходной: семьи и друзья едут за город, едят постную еду без мяса, дети запускают **χαρταετό** — воздушного змея. Дата каждый год своя: примерно за семь недель до Пасхи.

      **Το Πάσχα** — Пасха, главный праздник года. Слово не изменяется: το Πάσχα, για το Πάσχα. Дата каждый год разная — весной, обычно в апреле. Подробнее — во втором уроке, там же о кипрском празднике у моря **ο Κατακλυσμός**.

      **Η ονομαστική γιορτή** — именины, день святого, чьё имя вы носите. Часто говорят просто **η γιορτή**: Σήμερα είναι η γιορτή μου. **Σήμερα γιορτάζω!** — «У меня сегодня именины!». В Греции и на Кипре именины отмечают не меньше, чем день рождения (τα γενέθλια): звонят, поздравляют, приходят в гости. Спросить: **Πότε γιορτάζεις;** Например, Μαρία празднует 15 августа, Νίκος — 6 декабря, Βασίλης — 1 января, Κωνσταντίνος и Ελένη — 21 мая.
