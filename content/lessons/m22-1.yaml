  - type: exercise
    id: holiday-gap
    title: Праздничные обычаи
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - παραμονή
      - βασιλόπιτα
      - χαρταετό
      - στολίζουμε
      - γιορτάζει
      - νηστεία
      - κάλαντα
      - Απόκριες
    items:
      - id: g1
        prompt: Την ___ των Χριστουγέννων τα παιδιά λένε τα κάλαντα.
        answer: παραμονή
        explanation: Η παραμονή — канун; την παραμονή — «в канун» (вин. п. без предлога, как την Κυριακή).
      - id: g2
        prompt: Την Πρωτοχρονιά κόβουμε τη ___ — μέσα έχει ένα φλουρί. (κόβουμε — режем; το φλουρί — монета)
        answer: βασιλόπιτα
      - id: g3
        prompt: Την Καθαρά Δευτέρα τα παιδιά πετάνε ___ στην εξοχή. (πετάνε — запускают)
        answer: χαρταετό
        explanation: "Что запускают — винительный падеж: ο χαρταετός → τον χαρταετό."
      - id: g4
        prompt: Πριν από τα Χριστούγεννα ___ το δέντρο με τα παιδιά.
        answer: στολίζουμε
      - id: g5
        prompt: Σήμερα είναι 15 Αυγούστου και η Μαρία ___. Της λέω «Χρόνια πολλά!». (Αυγούστου — августа)
        answer: γιορτάζει
        explanation: 15 августа — именины всех Марий.
      - id: g6
        prompt: Πολλοί κάνουν ___ πριν από το Πάσχα και δεν τρώνε κρέας.
        answer: νηστεία
  - type: exercise
    id: wishes-choice
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: 23 декабря вы прощаетесь с коллегой до праздников.
        options:
          - Καλά Χριστούγεννα!
          - Καλή Σαρακοστή!
          - Να τα εκατοστήσεις!
        answer: Καλά Χριστούγεννα!
      - id: q2
        prompt: 31 декабря вы встречаете соседа на лестнице.
        options:
          - Καλή χρονιά!
          - Καλή Σαρακοστή!
          - Να τα εκατοστήσεις!
        answer: Καλή χρονιά!
      - id: q3
        prompt: Чистый понедельник, вы с друзьями на пикнике за городом.
        options:
          - Καλή Σαρακοστή!
          - Καλά Χριστούγεννα!
          - Να τα εκατοστήσεις!
        answer: Καλή Σαρακοστή!
      - id: q4
        prompt: У подруги день рождения, ей сегодня 30 лет.
        options:
          - Να τα εκατοστήσεις!
          - Καλή Σαρακοστή!
          - Καλά Χριστούγεννα!
        answer: Να τα εκατοστήσεις!
      - id: q5
        prompt: "Коллега Никос говорит: «Σήμερα γιορτάζω!»"
        options:
          - Χρόνια πολλά!
          - Καλή Σαρακοστή!
          - Επίσης!
        answer: Χρόνια πολλά!
        explanation: У Никоса именины — поздравляем. «Επίσης» — ответ на поздравление, а не поздравление.
      - id: q6
        prompt: Вам говорят «Καλά Χριστούγεννα!». Что ответить?
        options:
          - Επίσης!
          - Να ζήσεις!
          - Καλή Σαρακοστή!
        answer: Επίσης!
      - id: q7
        prompt: Вы хотите узнать, когда у подруги именины.
        options:
          - Πότε γιορτάζεις;
          - Πότε έχεις γενέθλια;
          - Πώς γιορτάζετε τα Χριστούγεννα;
        answer: Πότε γιορτάζεις;
        explanation: Πότε έχεις γενέθλια; — вопрос о дне рождения.
  - type: explanation
    id: sequence
    title: Сначала, потом, в конце
    body: |-
      Чтобы рассказать о празднике по порядку, нужны три слова: **πρώτα** — сначала, **μετά** или **έπειτα** — потом, затем (έπειτα значит то же, что μετά), **στο τέλος** — в конце.

      **Πρώτα πήγαμε στην εκκλησία και μετά φάγαμε όλοι μαζί. Έπειτα ανοίξαμε τα δώρα. Στο τέλος όλοι χορεύαμε.**

      События рассказа — в аористе (модули 14–15): что случилось и закончилось. Повторите частые формы:
