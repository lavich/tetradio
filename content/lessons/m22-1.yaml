  - type: exercise
    id: sequence-choice
    title: По порядку
    instruction: Выберите подходящее слово.
    format: choice
    items:
      - id: q1
        prompt: ___ ξυπνήσαμε νωρίς και μετά πήγαμε στην εκκλησία.
        options:
          - Πρώτα
          - Στο τέλος
          - Αύριο
        answer: Πρώτα
        explanation: Первое событие — πρώτα. Αύριο — «завтра», а глаголы в прошедшем.
      - id: q2
        prompt: Πρώτα φάγαμε, μετά ανοίξαμε τα δώρα και ___ χορέψαμε όλοι μαζί.
        options:
          - στο τέλος
          - πρώτα
          - αύριο
        answer: στο τέλος
      - id: q3
        prompt: Πρώτα στολίσαμε το δέντρο και ___ ήπιαμε ένα τσάι.
        options:
          - έπειτα
          - πρώτα
          - αύριο
        answer: έπειτα
        explanation: Έπειτα = μετά, «потом».
  - type: exercise
    id: sequence-translate
    title: Расскажите по порядку
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Сначала мы пошли в церковь.
        answer:
          - Πρώτα πήγαμε στην εκκλησία.
          - Πρώτα πήγαμε εκκλησία.
      - id: q2
        prompt: Потом мы все вместе поели.
        answer:
          - Μετά φάγαμε όλοι μαζί.
          - Έπειτα φάγαμε όλοι μαζί.
          - Μετά όλοι μαζί φάγαμε.
          - Έπειτα όλοι μαζί φάγαμε.
        explanation: Μετά и έπειτα — оба верны. «Поели» — законченное событие, аорист φάγαμε.
      - id: q3
        prompt: В конце мы танцевали.
        answer:
          - Στο τέλος χορεύαμε.
          - Στο τέλος χορέψαμε.
        explanation: «Танцевали» как процесс — χορεύαμε (παρατατικός, см. дальше); «потанцевали» — χορέψαμε. Оба варианта верны.
  - type: explanation
    id: imperfect
    title: Παρατατικός — прошедшее длительное
    body: |-
      Аорист рассказывает о прошлом как о **событии**: случилось и закончилось. **Χθες πήγαμε στην εκκλησία.**

      У греческого есть второе прошедшее время — **παρατατικός**. Оно рассказывает о прошлом как о **процессе или привычке**:

      - что повторялось: **Κάθε Χριστούγεννα πηγαίναμε στη γιαγιά.** — «Каждое Рождество мы ездили к бабушке»;
      - что длилось, было фоном: **Στο τέλος όλοι χορεύαμε.** — «В конце все танцевали»;
      - как было раньше: **Όταν ήμουν παιδί, μέναμε σε ένα χωριό.** — «Когда я был ребёнком, мы жили в деревне».

      Сравните: **Χθες χορέψαμε.** — «Вчера мы потанцевали» (событие). **Χορεύαμε όλη τη νύχτα.** — «Мы танцевали всю ночь» (процесс).

      Хороший ориентир — русский вид: аорист чаще переводится совершенным видом (пошёл, съел, потанцевал), παρατατικός — несовершенным (ходил, ел, танцевал). Но совпадает не всегда: если время действия ограничено, греки обычно берут аорист — **Χορέψαμε δύο ώρες.** «Мы танцевали два часа».

      Два παρατατικός вы уже знаете: **ήμουν** и **είχα** (модуль 15). У είμαι и έχω нет аориста, поэтому это их единственное прошедшее время. Так же у **ξέρω** — **ήξερα** («знал»). И у **θέλω** главное прошедшее — **ήθελα** («хотел»).

      В этом модуле παρατατικός нужно прежде всего **узнавать** в тексте и на слух. Самим — употреблять частые формы из таблицы.
