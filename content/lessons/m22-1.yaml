  - type: explanation
    id: imperfect-forms
    title: Как образуется παρατατικός
    body: |-
      **Глаголы с ударением на основе** (πηγαίνω, χορεύω, γράφω, μένω): основа настоящего времени + окончания **-α, -ες, -ε, -αμε, -ατε, -αν**. Ударение — на третьем слоге от конца: χόρευα, πήγαινα, χορεύαμε, πηγαίναμε. Если в форме всего два слога, впереди появляется **έ-**, как в аористе έγραψα: γράφω → **έγραφα**, πίνω → **έπινα**, μένω → **έμενα**. В формах «мы» и «вы» слогов хватает, и έ- нет: γράφαμε, πίναμε, μέναμε.

      У **τρώω** и **λέω** появляется γ: **έτρωγα, έλεγα** — τρώγαμε, λέγαμε.

      **Глаголы на -άω / -ώ** (μιλάω, τραγουδάω, μπορώ): окончания **-ούσα, -ούσες, -ούσε, -ούσαμε, -ούσατε, -ούσαν**, ударение всегда на -ού-: μιλούσα, μπορούσαμε.

      **Κάνω**: у него παρατατικός и аорист совпадают — έκανα; смысл понятен из предложения.

      Обратите внимание: **πήγαινε** — и «он ходил» (παρατατικός), и «иди!» (повелительное). Различайте по смыслу. В разговоре форма «они» часто длиннее: χορεύανε, πηγαίνανε, μιλούσανε — это те же формы.
