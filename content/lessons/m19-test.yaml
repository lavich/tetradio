title: Контрольная модуля 19
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика и слова. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Главное в грамматике — будущее время: θα + форма от аориста для одного действия, θα + настоящее для повтора; после αν θα не ставится.
  - type: reading
    id: katerina
    title: Ένα μήνυμα από την Κατερίνα
    text: |-
      Γεια σου, Λένα!

      Τι θα κάνεις το σαββατοκύριακο; Εμείς θα πάμε στο Τρόοδος με τον Αντρέα. Η πρόγνωση λέει ότι το Σάββατο θα έχει ήλιο, αλλά θα κάνει κρύο — μόνο οκτώ βαθμούς. Την Κυριακή θα χιονίσει!

      Το Σάββατο το πρωί θα κάνουμε περίπατο στο δάσος και το μεσημέρι θα φάμε σε μια ταβέρνα στο χωριό. Αν χιονίσει την Κυριακή, θα μείνουμε στο ξενοδοχείο και θα διαβάζουμε όλη μέρα δίπλα στο τζάκι.

      Θέλεις να έρθεις κι εσύ; Θα πρέπει να πάρεις ένα μπουφάν και ένα πουλόβερ! Γράψε μου μέχρι την Πέμπτη.

      Φιλιά,
      Κατερίνα
    glosses:
      - text: τζάκι
        russian: камин
  - type: exercise
    id: katerina-tf
    about: katerina
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Κατερίνα θα πάει στο Τρόοδος το σαββατοκύριακο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Το Σάββατο θα βρέξει.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το Σάββατο θα έχει ήλιο.
      - id: q3
        prompt: Το Σάββατο θα κάνει ζέστη.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Θα κάνει κρύο — μόνο οκτώ βαθμούς.
      - id: q4
        prompt: Το Σάββατο το μεσημέρι θα φάνε στο ξενοδοχείο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Σε μια ταβέρνα στο χωριό. В гостинице они останутся в воскресенье, если пойдёт снег.
      - id: q5
        prompt: Αν χιονίσει, θα μείνουν στο ξενοδοχείο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Η Λένα πρέπει να απαντήσει μέχρι την Πέμπτη.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Γράψε μου μέχρι την Πέμπτη.
  - type: listening
    id: beach
    title: Την Κυριακή στη θάλασσα
    plays: 2
    transcript:
      - speaker: Σωτήρης
        text: Γεια σου, Άντρη! Τι θα κάνεις την Κυριακή;
        audio: m19-test/beach-1.mp3
      - speaker: Άντρη
        text: Δεν ξέρω ακόμα. Γιατί;
        audio: m19-test/beach-2.mp3
      - speaker: Σωτήρης
        text: Σχεδιάζουμε να πάμε στη θάλασσα, στην Αγία Νάπα. Θέλεις να έρθεις;
        audio: m19-test/beach-3.mp3
      - speaker: Άντρη
        text: Ναι, θέλω! Αλλά τι καιρό θα κάνει;
        audio: m19-test/beach-4.mp3
      - speaker: Σωτήρης
        text: Η πρόγνωση λέει ότι θα έχει ήλιο και θα κάνει ζέστη, τριάντα βαθμούς.
        audio: m19-test/beach-5.mp3
      - speaker: Άντρη
        text: Και γιατί όχι το Σάββατο;
        audio: m19-test/beach-6.mp3
      - speaker: Σωτήρης
        text: Το Σάββατο θα φυσάει πολύ. Γι' αυτό πάμε την Κυριακή.
        audio: m19-test/beach-7.mp3
      - speaker: Άντρη
        text: Εντάξει. Τι ώρα θα φύγουμε;
        audio: m19-test/beach-8.mp3
      - speaker: Σωτήρης
        text: Στις εννιά. Θα περάσω από το σπίτι σου με το αυτοκίνητο.
        audio: m19-test/beach-9.mp3
      - speaker: Άντρη
        text: Ωραία! Θα φέρω εγώ φρούτα και νερό.
        audio: m19-test/beach-10.mp3
      - speaker: Σωτήρης
        text: Και πάρε καπέλο. Θα έχει πολύ ήλιο!
        audio: m19-test/beach-11.mp3
      - speaker: Άντρη
        text: Εντάξει. Τα λέμε την Κυριακή!
        audio: m19-test/beach-12.mp3
  - type: exercise
    id: beach-choice
    about: beach
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Куда Сотирис зовёт Андри?
        options:
          - на море
          - в горы
          - в деревню
        answer: на море
      - id: q2
        prompt: Какая погода будет в воскресенье?
        options:
          - солнечно и жарко
          - ветрено
          - дождливо
        answer: солнечно и жарко
      - id: q3
        prompt: Почему они не поедут в субботу?
        options:
          - будет сильный ветер
          - Андри работает
          - будет дождь
        answer: будет сильный ветер
        explanation: Το Σάββατο θα φυσάει πολύ.
      - id: q4
        prompt: Что возьмёт Андри?
        options:
          - фрукты и воду
          - только шляпу
          - машину
        answer: фрукты и воду
        explanation: Шляпу (καπέλο) ей советует взять Сотирис, а на машине приедет он сам.
  - type: exercise
    id: beach-notes
    about: beach
    graded: true
    title: Аудирование — цифры
    instruction: Напишите ответ цифрами или словами.
    format: text
    items:
      - id: n1
        prompt: Сколько градусов будет в воскресенье?
        answer:
          - "30"
          - 30 βαθμούς
          - 30 βαθμοί
          - τριάντα
          - τριάντα βαθμούς
          - τριάντα βαθμοί
          - 30 градусов
          - тридцать
          - тридцать градусов
      - id: n2
        prompt: Во сколько они выедут?
        answer:
          - "9"
          - "9:00"
          - "09:00"
          - στις 9:00
          - в 9:00
          - στις 9
          - στις εννιά
          - εννιά
          - στις εννέα
          - εννέα
          - в 9
          - в девять
          - девять
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Αύριο θα ___ στην Πάφο. (εμείς)
        options:
          - πάμε
          - πήγαμε
          - πάει
        answer: πάμε
        explanation: Для будущего после θα не ставят прошедшую форму (πήγαμε); «мы» — πάμε.
      - id: q2
        prompt: Από τον Σεπτέμβριο θα ___ ελληνικά κάθε μέρα.
        options:
          - διαβάζω
          - διαβάσω
          - διάβασα
        answer: διαβάζω
        explanation: Κάθε μέρα — повтор, поэтому θα + настоящее время.
      - id: q3
        prompt: — Θα έρθεις αύριο; — Όχι, ___.
        options:
          - δεν θα έρθω
          - θα δεν έρθω
          - δεν ήρθα
        answer: δεν θα έρθω
      - id: q4
        prompt: Αν ___, θα μείνουμε σπίτι.
        options:
          - βρέξει
          - θα βρέξει
          - έβρεξε
        answer: βρέξει
        explanation: В части с αν θα не ставится.
      - id: q5
        prompt: Θα κάνει κρύο. Θα πρέπει να ___ παλτό. (εσύ)
        options:
          - φορέσεις
          - φορέσει
          - φόρεσες
        answer: φορέσεις
        explanation: Πρέπει не изменяется; лицо показывает второй глагол. Φόρεσες — прошлое.
      - id: q6
        prompt: Τον Αύγουστο στη Λευκωσία κάνει ___ ζέστη.
        options:
          - πολλή
          - πολύ
          - πολλά
        answer: πολλή
        explanation: Η ζέστη — женский род, поэтому πολλή.
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите глагол в будущем времени — с θα. Подумайте, одно это действие или повтор.
    format: text
    items:
      - id: q1
        prompt: Αύριο ___ στο Τρόοδος. (χιονίζει)
        answer:
          - θα χιονίσει
          - θα χιονίζει
        explanation: Обычно — θα χιονίσει. Θα χιονίζει — «будет идти (долго, весь день)» — тоже верно.
      - id: q2
        prompt: Το Σάββατο ___ τους φίλους μου. (εγώ · βλέπω)
        answer:
          - θα δω
      - id: q3
        prompt: Πότε ___ για την Αθήνα; (εσείς · φεύγω)
        answer:
          - θα φύγετε
      - id: q4
        prompt: Το καλοκαίρι ___ κάθε πρωί στη θάλασσα. (εγώ · κολυμπάω)
        answer:
          - θα κολυμπάω
          - θα κολυμπώ
        explanation: Κάθε πρωί — повтор, поэтому θα + настоящее время.
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - η άνοιξη
      - ο χειμώνας
      - το φθινόπωρο
      - η ομίχλη
      - το δάσος
      - η πρόγνωση
      - η βροχή
      - ο ουρανός
      - η λίμνη
    items:
      - id: m1
        prompt: весна
        answer: η άνοιξη
      - id: m2
        prompt: зима
        answer: ο χειμώνας
      - id: m3
        prompt: осень
        answer: το φθινόπωρο
      - id: m4
        prompt: туман
        answer: η ομίχλη
      - id: m5
        prompt: лес
        answer: το δάσος
      - id: m6
        prompt: прогноз
        answer: η πρόγνωση
