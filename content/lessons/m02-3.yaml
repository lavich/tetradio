title: Письмо, речь и повторение
kind: lesson
items:
  - kind: phrase
    id: p022 # Δεν καταλαβαίνω.
  - kind: phrase
    id: p023 # Πιο αργά, παρακαλώ.
  - kind: phrase
    id: p024 # Άλλη μια φορά, παρακαλώ.
  - kind: phrase
    id: p025 # Πώς λέγεται αυτό στα ελληνικά;
  - kind: phrase
    id: p026 # Τι σημαίνει αυτό;
blocks:
  - type: explanation
    id: class-phrases
    title: Фразы для урока и экзамена
    body: |-
      Эти фразы выручают, когда вы не поняли собеседника, — на уроке, на улице и на устном экзамене. Попросить экзаменатора повторить вопрос — нормально: лучше переспросить, чем ответить не на тот вопрос.

      **Δεν καταλαβαίνω.** — «Я не понимаю». **Πιο αργά, παρακαλώ.** — «Помедленнее, пожалуйста» (πιο — «более», αργά — «медленно»). **Άλλη μια φορά, παρακαλώ.** — «Ещё раз, пожалуйста».

      Если не знаете слово: **Πώς λέγεται αυτό στα ελληνικά;** — «Как это по-гречески?» (показываете на предмет). Если услышали незнакомое слово: **Τι σημαίνει αυτό;** — «Что это значит?» или Τι σημαίνει «…»;

      Обратите внимание: **στα ελληνικά** — «по-гречески, на греческом» (в каком языке), а после μιλάω — просто ελληνικά, без στα.
    table:
      columns:
        - по-гречески
        - по-русски
        - когда
      rows:
        - - Δεν καταλαβαίνω.
          - Я не понимаю.
          - не поняли совсем
        - - Πιο αργά, παρακαλώ.
          - Помедленнее, пожалуйста.
          - говорят слишком быстро
        - - Άλλη μια φορά, παρακαλώ.
          - Ещё раз, пожалуйста.
          - не расслышали
        - - Πώς λέγεται αυτό στα ελληνικά;
          - Как это по-гречески?
          - не знаете слово
        - - Τι σημαίνει αυτό;
          - Что это значит?
          - услышали новое слово
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrases-choice
    title: Что сказать
    instruction: Выберите подходящую фразу.
    format: choice
    items:
      - id: q1
        prompt: Экзаменатор говорит очень быстро.
        options:
          - Πιο αργά, παρακαλώ.
          - Τι σημαίνει αυτό;
          - Δεν πειράζει.
        answer: Πιο αργά, παρακαλώ.
      - id: q2
        prompt: Вы не расслышали вопрос.
        options:
          - Άλλη μια φορά, παρακαλώ.
          - Τα λέμε!
          - Πώς σε λένε;
        answer: Άλλη μια φορά, παρακαλώ.
      - id: q3
        prompt: Вы показываете на предмет и не знаете, как он называется.
        options:
          - Πώς λέγεται αυτό στα ελληνικά;
          - Τι γλώσσες μιλάς;
          - Τι σημαίνει αυτό;
        answer: Πώς λέγεται αυτό στα ελληνικά;
        explanation: Τι σημαίνει αυτό; — спрашивают о значении слова, которое вы услышали или прочитали.
      - id: q4
        prompt: В тексте незнакомое слово. Вы спрашиваете преподавателя.
        options:
          - Τι σημαίνει αυτό;
          - Πώς λέγεται αυτό στα ελληνικά;
          - Μιλάτε αγγλικά;
        answer: Τι σημαίνει αυτό;
      - id: q5
        prompt: Вам что-то быстро сказали по-гречески, и вы совсем ничего не поняли.
        options:
          - Συγγνώμη, δεν καταλαβαίνω.
          - Χάρηκα πολύ.
          - Είμαι από τη Ρωσία.
        answer: Συγγνώμη, δεν καταλαβαίνω.
  - type: explanation
    id: writing-how
    title: Анкета и несколько слов о себе
    body: |-
      На курсах, в банке, у врача вам дадут **анкету** (η αίτηση). Поля в ней обычно такие: **Όνομα** — имя, **Επώνυμο** — фамилия, **Χώρα** — страна, **Πόλη** — город, **Γλώσσες** — языки. В полях пишут одно-два слова, в именительном падеже: Πόλη — Λεμεσός, а не Λεμεσό.

      Часто в анкете есть поле **Λίγα λόγια για σας** — «Несколько слов о себе». Здесь пишут 4–5 коротких предложений, каждое с глаголом: είμαι, μένω, δουλεύω, μιλάω, μαθαίνω. Связывайте их словами **και** («и»), **αλλά** («но»), **γιατί** («потому что»): Μαθαίνω ελληνικά, γιατί μένω στην Κύπρο.

      Как и в модуле 01: печатными буквами, не целиком заглавными, с тоносом; настоящее имя не пишите — придумайте другое.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - откуда вы
          - Είμαι από τη Ρωσία, από τη Μόσχα. / Είμαι Ρώσος (Ρωσίδα).
        - - где живёте
          - Μένω στην Κύπρο, στη Λάρνακα.
        - - где работаете
          - Δουλεύω στη Λευκωσία. / Δουλεύω εδώ, στη Λάρνακα.
        - - какие языки знаете
          - Μιλάω ρωσικά, αγγλικά και λίγο ελληνικά.
        - - почему учите греческий
          - Μαθαίνω ελληνικά, γιατί μένω στην Κύπρο.
  - type: exercise
    id: sentences
    title: Предложения о себе
    instruction: Напишите по-гречески.
    format: text
    items:
      - id: q1
        prompt: Я живу в Ларнаке.
        answer:
          - Μένω στη Λάρνακα.
          - Εγώ μένω στη Λάρνακα.
      - id: q2
        prompt: Я работаю в Никосии. (Никосия — Λευκωσία)
        answer:
          - Δουλεύω στη Λευκωσία.
          - Εγώ δουλεύω στη Λευκωσία.
        explanation: Перед λ — στη, без ν.
      - id: q3
        prompt: Я говорю по-русски и по-английски.
        answer:
          - Μιλάω ρωσικά και αγγλικά.
          - Μιλώ ρωσικά και αγγλικά.
          - Εγώ μιλάω ρωσικά και αγγλικά.
        explanation: Названия языков после μιλάω — без артикля.
      - id: q4
        prompt: Я немного понимаю по-гречески.
        answer:
          - Καταλαβαίνω λίγο ελληνικά.
          - Καταλαβαίνω λίγα ελληνικά.
          - Εγώ καταλαβαίνω λίγο ελληνικά.
      - id: q5
        prompt: Я учу греческий, потому что живу на Кипре.
        answer:
          - Μαθαίνω ελληνικά, γιατί μένω στην Κύπρο.
          - Μαθαίνω ελληνικά γιατί μένω στην Κύπρο.
        explanation: «Потому что» — γιατί; перед κ — στην Κύπρο.
  - type: writing
    id: form
    register: friendly
    prompt: |-
      Вы записываетесь на курс греческого в языковой школе в Ларнаке. Заполните анкету (придуманные данные):
      Όνομα: … Χώρα: … Πόλη: … Γλώσσες: …
      Затем в поле «Λίγα λόγια για σας» напишите 4–5 предложений: откуда вы, где живёте, где работаете, на каких языках говорите и почему учите греческий.
    words:
      min: 20
      max: 55
    model: |-
      Όνομα: Βέρα
      Χώρα: Ρωσία
      Πόλη: Λάρνακα
      Γλώσσες: ρωσικά, αγγλικά, λίγο ελληνικά

      Λίγα λόγια για σας:
      Είμαι από τη Ρωσία, από τη Μόσχα. Τώρα μένω στην Κύπρο, στη Λάρνακα. Δουλεύω στη Λευκωσία. Μιλάω ρωσικά και αγγλικά, αλλά ελληνικά μιλάω μόνο λίγο. Μαθαίνω ελληνικά, γιατί μένω στην Κύπρο.
    criteria:
      - Заполнены все четыре поля анкеты, город и страна — в именительном падеже (Λάρνακα, Ρωσία, Λεμεσός)
      - "4–5 предложений: откуда вы, где живёте, где работаете, какие языки знаете, почему учите греческий"
      - В каждом предложении есть глагол в форме «я» — είμαι, μένω, δουλεύω, μιλάω, μαθαίνω
      - "σε + артикль: στη Λάρνακα, στην Κύπρο (ν перед гласной и κ, π, τ)"
      - Названия языков после μιλάω — без артикля (μιλάω ρωσικά)
      - Есть хотя бы одно из слов αλλά, και, γιατί
      - Тонос во всех словах из двух и больше слогов; печатные буквы, не целиком заглавные; имя не настоящее
  - type: explanation
    id: speaking-how
    title: Вопросы экзаменатора о себе
    body: |-
      В первой части устного экзамена спрашивают, где вы живёте, работаете и какие языки знаете. Экзаменатор говорит на «вы» — **μένετε, δουλεύετε, μιλάτε**, а вы отвечаете о себе, в форме «я» — **μένω, δουλεύω, μιλάω**. Окончание -ετε в вопросе — сигнал ответить на -ω.

      Отвечайте полным предложением и, если можете, добавьте деталь: не просто «Μένω στη Λεμεσό», а «Μένω στη Λεμεσό, αλλά δουλεύω στη Λευκωσία».

      Не поняли вопрос — скажите **Άλλη μια φορά, παρακαλώ** или **Πιο αργά, παρακαλώ**. Запишите ответы, послушайте и сверьте с образцом и критериями.
    table:
      columns:
        - вопрос
        - как ответить
      rows:
        - - Από ποια χώρα είστε;
          - Είμαι από τη Ρωσία.
        - - Πού μένετε;
          - Μένω στην Κύπρο, στη …
        - - Πού δουλεύετε;
          - Δουλεύω στη(ν) …
        - - Τι γλώσσες μιλάτε;
          - Μιλάω ρωσικά και …
        - - Γιατί μαθαίνετε ελληνικά;
          - Μαθαίνω ελληνικά, γιατί …
  - type: speaking
    id: interview
    part: interview
    prompt: |-
      Экзаменатор задаёт вопросы. Прочитайте каждый вопрос вслух, затем ответьте без подготовки и запишите ответы:
      Καλημέρα σας! Πώς σας λένε; Από ποια χώρα είστε; Πού μένετε; Πού δουλεύετε;
    seconds: 60
    model: Καλημέρα σας! Με λένε Βέρα. Είμαι από τη Ρωσία, από τη Μόσχα. Μένω στην Κύπρο, στη Λάρνακα. Δουλεύω στη Λευκωσία.
    criteria:
      - Ответили на все вопросы полными предложениями с глаголом
      - Формы о себе — είμαι, μένω, δουλεύω (а не είστε, μένετε, δουλεύετε)
      - "Правильно στη / στην: στη Λάρνακα, στην Κύπρο"
      - Ударение на своём месте (Ρωσία, Λάρνακα, Λευκωσία, δουλεύω), ευ в δουλεύω — [эв]
  - type: speaking
    id: languages
    part: interview
    prompt: |-
      Экзаменатор продолжает. Ответьте на вопросы и запишите ответы. Если вопрос непонятен, попросите повторить по-гречески:
      Τι γλώσσες μιλάτε; Μιλάτε ελληνικά; Γιατί μαθαίνετε ελληνικά;
    seconds: 45
    model: Μιλάω ρωσικά και αγγλικά. Ελληνικά μιλάω λίγο — τώρα μαθαίνω. Μαθαίνω ελληνικά, γιατί μένω στην Κύπρο.
    criteria:
      - Назвали минимум два языка — без артикля (μιλάω ρωσικά και αγγλικά)
      - Сказали, насколько знаете греческий — λίγο, πολύ καλά, μόνο λίγο
      - Объяснили причину со словом γιατί
      - μιλάω звучит с ударением на -λά- [мила́о], δ и γ не звучат как русские [д] и [г] (αγγλικά [англика́])
  - type: exercise
    id: review-grammar
    title: Повторение — грамматика
    instruction: Вставьте слово. Три слова лишние.
    format: gap
    bank: [μένει, μιλάνε, δουλεύουμε, ξέρεις, δεν, στην, στο, το, η]
    items:
      - id: g1
        prompt: Η Μαρία ___ στη Λάρνακα.
        answer: μένει
      - id: g2
        prompt: Η Άννα και ο Νίκος ___ ελληνικά και αγγλικά.
        answer: μιλάνε
      - id: g3
        prompt: Εγώ και η Όλγα ___ στη Λευκωσία.
        answer: δουλεύουμε
        explanation: «Я и Ольга» — «мы», окончание -ουμε.
      - id: g4
        prompt: Συγγνώμη, ___ καταλαβαίνω.
        answer: δεν
      - id: g5
        prompt: Μένουμε ___ Πάφο.
        answer: στην
        explanation: Перед π ν остаётся.
      - id: g6
        prompt: Η Όλγα είναι από ___ Καζάν. (Καζάν — Казань, средний род)
        answer: το
  - type: exercise
    id: review-read
    title: Повторение — чтение
    instruction: Как читается слово?
    format: choice
    items:
      - id: q1
        prompt: ΚΥΠΡΟΣ (табличка)
        options:
          - "[кипро́с]"
          - "[ки́прос]"
          - "[кюпрос]"
        answer: "[ки́прос]"
        explanation: На табличке тоноса нет; строчными — Κύπρος, ударение на первом слоге. υ — [и].
      - id: q2
        prompt: αγγλικά (английский язык)
        options:
          - "[агглика́]"
          - "[англика́]"
          - "[аглики́]"
        answer: "[англика́]"
        explanation: γγ — [нг].
      - id: q3
        prompt: καταλαβαίνω (понимаю)
        options:
          - "[каталава́ино]"
          - "[каталавэ́но]"
          - "[каталабэ́но]"
        answer: "[каталавэ́но]"
        explanation: β — [в], αι — [э], ударение над ί — на этом слоге.
      - id: q4
        prompt: Ελλάδα (Греция)
        options:
          - "[элла́да]"
          - "[эла́ða]"
          - "[э́лаða]"
        answer: "[эла́ða]"
        explanation: λλ — одна [л], δ — [ð].
      - id: q5
        prompt: γλώσσα (язык)
        options:
          - "[ɣло́са]"
          - "[гло́сса]"
          - "[йло́са]"
        answer: "[ɣло́са]"
        explanation: γ перед согласной — фрикативное [ɣ], σσ — одна [с].
