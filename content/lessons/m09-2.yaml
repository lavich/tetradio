  - type: exercise
    id: imperative-choice
    title: Узнаём просьбы
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: "«Φέρε μου ένα πιρούνι, σε παρακαλώ.» Кому так говорят?"
        options:
          - другу, на «ты»
          - официанту, на «вы»
          - о себе
        answer: другу, на «ты»
        explanation: Φέρε — форма для «ты» (на -ε), и σε παρακαλώ — «пожалуйста» на «ты».
      - id: q2
        prompt: "Официант: «Ελάτε, διαλέξτε ένα τραπέζι!» Что он предлагает?"
        options:
          - пройти и выбрать столик
          - заплатить за столик
          - подождать на улице
        answer: пройти и выбрать столик
        explanation: Ελάτε — «проходите», διαλέξτε — «выберите» (от διαλέγω).
      - id: q3
        prompt: Вы просите официанта на «вы». ___ μας λίγο νερό, παρακαλώ.
        options:
          - Φέρτε
          - Φέρε
          - Φέρνω
        answer: Φέρτε
        explanation: Φέρτε — для «вы», φέρε — для «ты», φέρνω — «я приношу».
      - id: q4
        prompt: Как вежливее всего попросить официанта принести воды?
        options:
          - Μας φέρνετε λίγο νερό, παρακαλώ;
          - Φέρε μας νερό!
          - Νερό!
        answer: Μας φέρνετε λίγο νερό, παρακαλώ;
        explanation: Просьба-вопрос на «вы» с παρακαλώ — самый вежливый вариант.
      - id: q5
        prompt: Вы отдаёте деньги и говорите «Κρατήστε τα ρέστα». Что это значит?
        options:
          - Сдачи не надо.
          - Дайте мне сдачу.
          - Принесите счёт.
        answer: Сдачи не надо.
      - id: q6
        prompt: "Официант подходит к столику: «Πείτε μου!» Что он говорит?"
        options:
          - Слушаю вас!
          - Принесите мне!
          - Подождите!
        answer: Слушаю вас!
        explanation: Πείτε — «скажите» (от λέω), πείτε μου — «скажите мне», то есть «слушаю вас».
