  - type: explanation
    id: menu-how
    title: Меню и отзыв
    body: |-
      Сейчас два текста: меню кафе и отзыв о таверне. В меню ищите раздел, название и цену — не нужно понимать каждое слово. Отзыв читайте дважды: сначала целиком, потом — с утверждениями. В отзывах почти всегда есть «что хорошо» и «что плохо»; слова-сигналы — **αλλά**, **όμως** («однако») и **το μόνο πρόβλημα** («единственная проблема»). Незнакомые слова переведены под текстом.
  - type: reading
    id: menu
    title: Καφενείο «Ο Πλάτανος»
    text: |-
      Καφενείο «Ο Πλάτανος» — Λάρνακα
      Σερβίρουμε κάθε μέρα 8:00–22:00

      Καφέδες
      Κυπριακός καφές (σκέτος, μέτριος, γλυκός) — 2 €
      Διπλός κυπριακός — 3 €
      Φραπές — 3,50 €
      Τσάι — 2 €

      Ορεκτικά
      Χαλλούμι ψητό — 5 €
      Πατάτες τηγανητές (μερίδα) — 4 €
      Ποικιλία ορεκτικών (για δύο) — 12 €

      Κυρίως πιάτα
      Σουβλάκι χοιρινό με πατάτες — 10 €
      Κοτόπουλο ψητό με πατάτες — 11 €
      Ψάρι ψητό με σαλάτα — 14 €

      Επιδόρπια
      Γλυκό του κουταλιού — 3 €
      Γιαούρτι με μέλι — 4 €

      Όλα τα πιάτα και για πακέτο.
      Κυριακή πρωί: ο πρώτος καφές — κερνάει το μαγαζί!
    glosses:
      - text: Ο Πλάτανος
        russian: «Платан» (дерево)
      - text: Διπλός
        russian: двойной
      - text: Φραπές
        russian: фраппе (холодный взбитый кофе)
      - text: Ποικιλία ορεκτικών
        russian: ассорти закусок
      - text: χοιρινό
        russian: из свинины
      - text: Γλυκό του κουταλιού
        russian: «сладость на ложечке» — кипрское варенье из целых фруктов
      - text: μέλι
        russian: мёд
      - text: Όλα τα πιάτα
        russian: все блюда
      - text: ο πρώτος καφές
        russian: первый кофе
  - type: exercise
    id: menu-choice
    about: menu
    title: Читаем меню
    instruction: Прочитайте меню и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Сколько стоит кипрский кофе средней сладости?
        options:
          - 2 €
          - 3 €
          - 3,50 €
          - 4 €
        answer: 2 €
        explanation: Κυπριακός καφές (σκέτος, μέτριος, γλυκός) — 2 €. 3 € стоит двойной.
      - id: q2
        prompt: В каком разделе меню картофель фри?
        options:
          - Καφέδες
          - Ορεκτικά
          - Κυρίως πιάτα
          - Επιδόρπια
        answer: Ορεκτικά
        explanation: Πατάτες τηγανητές (μερίδα) — в закусках. В основных блюдах картофель только как гарнир.
      - id: q3
        prompt: Что можно взять с собой?
        options:
          - все блюда
          - только кофе
          - только десерты
          - ничего
        answer: все блюда
        explanation: Όλα τα πιάτα και για πακέτο — все блюда можно и с собой.
      - id: q4
        prompt: Вы с другом берёте ассорти закусок на двоих и два кипрских кофе. Сколько вы платите вместе?
        options:
          - 14 €
          - 16 €
          - 18 €
          - 28 €
        answer: 16 €
        explanation: Ποικιλία ορεκτικών (για δύο) — 12 € сразу на двоих, плюс 2 × 2 € за кофе.
      - id: q5
        prompt: Что кафе предлагает в воскресенье утром?
        options:
          - первый кофе бесплатно
          - бесплатный десерт
          - кафе закрыто
          - двойной кофе по цене простого
        answer: первый кофе бесплатно
        explanation: "Κυριακή πρωί: ο πρώτος καφές — κερνάει το μαγαζί: первый кофе за счёт заведения. Кафе открыто каждый день."
  - type: reading
    id: review
    title: "Κριτική: Ταβέρνα «Η Θάλασσα»"
    text: |-
      Έρχομαι στην ταβέρνα «Η Θάλασσα» συχνά με την οικογένειά μου. Είναι στη Λεμεσό, κοντά στη θάλασσα, και έχει ένα μεγάλο μπαλκόνι. Ο κατάλογος δεν είναι μεγάλος, αλλά τα φαγητά είναι νόστιμα. Σας προτείνω την ποικιλία ορεκτικών και το ψητό ψάρι. Οι πατάτες τηγανητές όμως δεν είναι πολύ καλές. Οι μερίδες είναι μεγάλες και οι τιμές καλές: για δύο άτομα πληρώνουμε περίπου σαράντα ευρώ.

      Το μόνο πρόβλημα είναι η εξυπηρέτηση. Το Σάββατο το βράδυ υπάρχουν μόνο δύο σερβιτόροι και περιμένουμε πολύ το φαγητό και τον λογαριασμό. Αλλά οι σερβιτόροι είναι πάντα ευγενικοί, και στο τέλος κερνάει το μαγαζί ένα γλυκό. Αφήνουμε πάντα φιλοδώρημα. Αν θέλετε ησυχία, πηγαίνετε την Κυριακή το μεσημέρι!
    glosses:
      - text: Η Θάλασσα
        russian: «Море»
      - text: ποικιλία ορεκτικών
        russian: ассорти закусок
      - text: όμως
        russian: однако
      - text: οι τιμές
        russian: цены
      - text: για δύο άτομα
        russian: за двоих
      - text: περίπου
        russian: примерно
      - text: Το μόνο πρόβλημα
        russian: единственная проблема
      - text: ευγενικοί
        russian: вежливые
      - text: στο τέλος
        russian: в конце
      - text: Αν
        russian: если
      - text: ησυχία
        russian: тишина, покой
      - text: το μεσημέρι
        russian: в обед, днём
  - type: exercise
    id: review-tf
    about: review
    title: Верно или неверно
    instruction: Прочитайте отзыв. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η ταβέρνα έχει μεγάλο κατάλογο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ο κατάλογος δεν είναι μεγάλος — меню небольшое.
      - id: q2
        prompt: Η κριτική προτείνει το ψητό ψάρι.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Σας προτείνω την ποικιλία ορεκτικών και το ψητό ψάρι.
      - id: q3
        prompt: Οι πατάτες τηγανητές είναι πολύ νόστιμες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Οι πατάτες τηγανητές όμως δεν είναι πολύ καλές.
      - id: q4
        prompt: Το Σάββατο το βράδυ περιμένουν πολύ τον λογαριασμό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Официантов только двое, поэтому долго ждут и еду, и счёт.
      - id: q5
        prompt: Οι σερβιτόροι δεν είναι ευγενικοί.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Οι σερβιτόροι είναι πάντα ευγενικοί — обслуживание медленное, но официанты вежливые.
      - id: q6
        prompt: Στο τέλος πληρώνουν και το γλυκό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κερνάει το μαγαζί — десерт за счёт заведения.
      - id: q7
        prompt: Αφήνουν πάντα φιλοδώρημα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Диалог в таверне звучит два раза. В первый раз поймите ситуацию: кто говорит и что происходит — заказ, просьба, счёт. Перед вторым прослушиванием прочитайте вопросы: в каждом три варианта, верен один.

      Официант говорит на «вы». Вы услышите **Πείτε μου** — «Слушаю вас», **Τι θα πιείτε;** — «Что будете пить?» (πιείτε — форма от πίνω, как в Θέλεις κάτι να πιεις;) и в конце **Καλό βράδυ!** — «Хорошего вечера!». Το τζατζίκι — цацики, закуска из йогурта с огурцом (это слово вы читали в модуле 01).

      Ловушки такие же, как на экзамене: официант предлагает одно, а гость выбирает другое; гость просит блюдо, а его сегодня нет. Отвечайте по тому, что человек в итоге **берёт**.
  - type: listening
    id: order
    title: Στην ταβέρνα
    plays: 2
