          - 5 €
          - нисколько
        answer: 3 €
        explanation: Счёт — 22 €, она даёт 25 € и говорит «κρατήστε τα ρέστα» — сдача 3 € остаётся официанту.
      - id: q7
        prompt: Какой кофе пьёт Деспина?
        options:
