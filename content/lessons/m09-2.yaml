    items:
      - id: q1
        prompt: Τι προτείνει ο σερβιτόρος;
        options:
          - Ψητό ψάρι με σαλάτα.
          - Κλέφτικο.
          - Χαλλούμι ψητό.
        answer: Ψητό ψάρι με σαλάτα.
        explanation: Σήμερα έχουμε πολύ ωραίο ψάρι, ψητό, με σαλάτα.
      - id: q2
        prompt: Τι κυρίως πιάτο παραγγέλνει η Δέσποινα;
        options:
          - Κλέφτικο.
          - Ψάρι.
          - Σουβλάκι.
        answer: Κλέφτικο.
        explanation: "Ловушка: рыбу советует официант, но Деспина отказывается — Ψάρι δεν θέλω."
      - id: q3
        prompt: Γιατί η Δέσποινα δεν τρώει χαλλούμι;
        options:
          - Δεν έχουν χαλλούμι σήμερα.
          - Δεν της αρέσει.
          - Είναι ακριβό.
        answer: Δεν έχουν χαλλούμι σήμερα.
        explanation: Συγγνώμη, χαλλούμι δεν έχουμε σήμερα — поэтому она берёт картофель.
