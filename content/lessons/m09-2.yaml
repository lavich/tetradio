blocks:
  - type: explanation
    id: imperative
    title: Φέρε μου — повелительное наклонение
    body: |-
      Повелительное наклонение — это просьба или приказ: «принеси», «выберите», «заходи». Сами строить эти формы вы будете позже (модули 12 и 18), а сейчас их нужно **узнавать**: официант, друзья и вывески говорят так постоянно. Вы уже знаете одну такую форму — **Έλα μέσα!** «Заходи!» (модуль 06).

      Два признака. Форма для «ты» обычно кончается на **-ε**: **φέρε** — «принеси», **άφησε** — «оставь», **διάλεξε** — «выбери». Форма для «вы» — на **-τε**: **φέρτε** — «принесите», **αφήστε**, **διαλέξτε**. Сама основа часто не такая, как в настоящем времени (αφήνω → άφησε), поэтому смотрите на начало слова и на окончание.

      Короткое μου или μας стоит **после** повелительной формы: **Φέρε μου** ένα πιρούνι — «Принеси мне вилку», **Φέρτε μας** τον λογαριασμό — «Принесите нам счёт». В остальных случаях — перед глаголом, как вы видели: Τι **μας** προτείνετε;

      **Вежливость.** Между друзьями просьба в повелительной форме — нормально, особенно с **σε παρακαλώ** («пожалуйста» на «ты»): **Φέρε μου ένα πιρούνι, σε παρακαλώ.** Официанту вежливее сказать вопросом: **Μας φέρνετε λίγο νερό, παρακαλώ;** — дословно «Вы нам принесёте немного воды?» — или Μπορείτε να μας φέρετε…; из урока 1.
    table:
      columns:
        - глагол
        - на «ты»
        - на «вы»
        - перевод
      rows:
        - - φέρνω
          - φέρε
          - φέρτε
          - принеси(те)
        - - δίνω
          - δώσε
          - δώστε
          - дай(те)
        - - αφήνω
          - άφησε
          - αφήστε
          - оставь(те)
        - - διαλέγω
          - διάλεξε
          - διαλέξτε
          - выбери(те)
        - - λέω
          - πες
          - πείτε
          - скажи(те)
        - - έρχομαι
          - έλα
          - ελάτε
          - иди(те) сюда, заходи(те)
  - type: explanation
    id: bill
    title: Счёт, чаевые и «с собой»
    body: |-
      **Τον λογαριασμό, παρακαλώ.** — «Счёт, пожалуйста». Ο λογαριασμός — мужской род; здесь подразумевается «принесите», поэтому винительный падеж: τον λογαριασμό. Если вы не одни, официант спросит: **Μαζί ή χωριστά;** — «Вместе или раздельно?». Ответ: **Μαζί.** или **Χωριστά, παρακαλώ.**

      **Το φιλοδώρημα** — чаевые. На Кипре обычно оставляют около 5–10 % или просто округляют сумму. Часто плата за обслуживание уже входит в цены или в счёт — тогда чаевые только по желанию, если вам понравилось. «Оставлять» — **αφήνω**: Αφήνω φιλοδώρημα. Отдавая деньги, можно сказать **Κρατήστε τα ρέστα.** — «Сдачи не надо» (τα ρέστα — сдача, κρατήστε — «оставьте себе»). Протягивая деньги или вещь, говорят **Ορίστε** — «Вот, пожалуйста».

      **Κερνάει το μαγαζί.** — «За счёт заведения» (το μαγαζί — заведение, магазин). **Κερνάω** — «угощать» — спрягается как μιλάω: κερνάς, κερνάει… На Кипре в конце ужина часто приносят бесплатно фрукты или десерт. Среди друзей: **Εγώ κερνάω!** — «Я угощаю!».

      В кафе с кофе навынос спрашивают: **Για εδώ ή για πακέτο;** — «Здесь или с собой?». Το πακέτο — «пакет, упаковка», а **για πακέτο** — «с собой».

      Ещё два слова, которые часто слышно в кафе: **αμέσως** — «сейчас же, сразу»: **Έρχομαι αμέσως!** — «Сейчас подойду!»; **ήδη** — «уже»: Ο φίλος μου είναι ήδη εδώ.
    table:
      columns:
        - гость
        - официант
      rows:
        - - Συγγνώμη! Τον λογαριασμό, παρακαλώ.
          - Αμέσως! Μαζί ή χωριστά;
        - - Χωριστά, παρακαλώ.
          - Εσείς πληρώνετε δεκαοχτώ ευρώ.
        - - Ορίστε είκοσι. Κρατήστε τα ρέστα.
          - Ευχαριστώ πολύ!
        - - Έναν καφέ σκέτο, παρακαλώ.
          - Για εδώ ή για πακέτο;
  - type: explanation
    id: table
    title: На столе и на кухне
    body: |-
      Приборы и посуда: **το πιρούνι** — вилка, **το μαχαίρι** — нож, **το κουτάλι** — ложка, **το φλιτζάνι** — чашка (урок 1), **το ποτήρι** — стакан (модуль 08), **η κανάτα** — кувшин, графин. После κανάτα, как после ποτήρι и μερίδα, напиток идёт без артикля: **μια κανάτα νερό**, μια κανάτα κρασί.

      Как приготовлено: **ψητός** — на гриле или запечённый: ψητό ψάρι, ψητό χαλλούμι; **τηγανητός** — жаренный на сковороде (το τηγάνι): **πατάτες τηγανητές** — картофель фри. В меню прилагательное часто стоит после слова: Κοτόπουλο ψητό, Πατάτες τηγανητές. Оно согласуется в роде и числе: η πατάτα → οι πατάτες τηγανητές, το ψάρι → ψάρι ψητό.

      Глаголы: **φέρνω** — приносить, **σερβίρω** — подавать (еду), обслуживать: Σερβίρουμε από τις δώδεκα — «Мы подаём еду с двенадцати». Оба обычные, как γράφω.

      **Η κριτική** — отзыв (на сайте, в приложении): **γράφω κριτική**. В отзывах часто пишут про **εξυπηρέτηση** — обслуживание: Η εξυπηρέτηση είναι πολύ καλή.
    table:
      columns:
        - м. р.
        - ж. р.
        - ср. р.
        - перевод
      rows:
        - - ψητός
          - ψητή
          - ψητό
          - на гриле, запечённый
        - - τηγανητός
          - τηγανητή
          - τηγανητό
          - жаренный на сковороде
