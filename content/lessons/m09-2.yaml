      - speaker: Κώστας
        text: Καλησπέρα σας! Πείτε μου, τι θα πάρετε;
      - speaker: Δέσποινα
        text: Καλησπέρα. Δεν ξέρω ακόμα. Τι μου προτείνετε;
      - speaker: Κώστας
        text: Σήμερα έχουμε πολύ ωραίο ψάρι, ψητό, με σαλάτα.
      - speaker: Δέσποινα
        text: Ψάρι δεν θέλω, ευχαριστώ. Θα ήθελα το κλέφτικο. Είναι μεγάλη η μερίδα;
      - speaker: Κώστας
        text: Ναι, πολύ μεγάλη.
      - speaker: Δέσποινα
        text: Ωραία. Και για ορεκτικό ένα χαλλούμι ψητό, παρακαλώ.
      - speaker: Κώστας
        text: Συγγνώμη, χαλλούμι δεν έχουμε σήμερα. Έχουμε πατάτες τηγανητές ή τζατζίκι.
      - speaker: Δέσποινα
        text: Μια μερίδα πατάτες, παρακαλώ.
      - speaker: Κώστας
        text: Και τι θα πιείτε;
      - speaker: Δέσποινα
        text: Μια κανάτα νερό και ένα ποτήρι κόκκινο κρασί.
      - speaker: Κώστας
        text: Αμέσως!
      - speaker: Δέσποινα
        text: Συγγνώμη! Μπορείτε να μου φέρετε ένα πιρούνι;
      - speaker: Κώστας
        text: Ναι, έρχομαι αμέσως!
      - speaker: Δέσποινα
        text: Και τον λογαριασμό, παρακαλώ.
      - speaker: Κώστας
        text: Είκοσι δύο ευρώ. Θέλετε και έναν κυπριακό καφέ; Κερνάει το μαγαζί.
      - speaker: Δέσποινα
