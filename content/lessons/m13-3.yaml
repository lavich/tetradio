blocks:
  - type: explanation
    id: ticket
    title: На кассе и в такси
    body: |-
      **Ένα εισιτήριο για τη Λεμεσό, παρακαλώ.** — «Один билет до Лимасола, пожалуйста». Куда — **για** + винительный падеж: για την Πάφο, για το αεροδρόμιο. Несколько билетов: **Δύο εισιτήρια** για τη Λάρνακα.

      Кассир обычно спрашивает: **Απλό ή μετ' επιστροφής;** — «В одну сторону или туда и обратно?». **Απλό** — буквально «простой», то есть в одну сторону; **μετ' επιστροφής** — «с возвращением», туда и обратно. Ответ: **Ένα εισιτήριο μετ' επιστροφής, παρακαλώ.** или просто Απλό, παρακαλώ. Если билетов несколько — Δύο απλά.

      Вежливее попросить так, как в кафе (модуль 09): **Θα ήθελα** ένα εισιτήριο για την Πάφο. Узнать остальное помогут фразы урока 2: Πόσο κάνει; Τι ώρα φεύγει το επόμενο λεωφορείο; Από πού φεύγει;

      В такси назовите место: **Στο αεροδρόμιο, παρακαλώ.** Στον σταθμό λεωφορείων, παρακαλώ. Цену лучше спросить заранее: **Πόσο κάνει μέχρι το αεροδρόμιο;**
    table:
      columns:
        - кассир
        - вы
      rows:
        - - Καλημέρα σας! Παρακαλώ;
          - Ένα εισιτήριο για τη Λεμεσό, παρακαλώ.
        - - Απλό ή μετ' επιστροφής;
          - Μετ' επιστροφής, παρακαλώ.
        - - Οκτώ ευρώ.
          - Ορίστε. Τι ώρα φεύγει το επόμενο λεωφορείο;
        - - Στις δέκα και μισή.
          - Και από πού φεύγει;
        - - Από τη στάση τρία.
          - Ευχαριστώ πολύ!
  - type: explanation
    id: late
    title: Если вы опаздываете
    body: |-
      **Αργώ** — «опаздывать, задерживаться» — спрягается как μπορώ: αργείς, αργεί. Αργώ λίγο, συγγνώμη! **Το λεωφορείο αργεί** — «Автобус опаздывает, его всё нет». О людях обычно говорят αργώ, в объявлениях — καθυστερεί, έχει καθυστέρηση (урок 2).

      **Θα αργήσω δέκα λεπτά.** — «Я опоздаю на десять минут». Θα αργήσω — будущее время, его вы разберёте в модуле 19; пока учите фразу целиком и меняйте только время: Θα αργήσω μισή ώρα. Θα αργήσω λίγο. Обратите внимание: «на десять минут» — без предлога.

      **Χάνω** — «терять»; о транспорте — «опоздать на»: **Έχασα το λεωφορείο.** — «Я опоздал(а) на автобус» (буквально «потерял автобус»). Έχασα — прошедшее время, его система — в модуле 14. Не путайте: αργώ — «прихожу позже», έχασα το λεωφορείο — «автобус ушёл без меня».

      Что сказать дальше — настоящим временем, как о планах (модуль 04): Παίρνω ένα ταξί. Έρχομαι με το επόμενο λεωφορείο. Φτάνω στις οκτώ. **Σε λίγο** — «скоро, через немного»: Είμαι εκεί σε λίγο.
    table:
      columns:
        - что случилось
        - что дальше
      rows:
        - - Έχασα το λεωφορείο.
          - Παίρνω ένα ταξί.
        - - Το λεωφορείο αργεί.
          - Θα αργήσω δέκα λεπτά.
        - - Το λεωφορείο έχει καθυστέρηση.
          - Φτάνω στις οκτώ και μισή.
        - - Έχει πολλή κίνηση.
          - Είμαι εκεί σε λίγο.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: "Кассир спрашивает: «Απλό ή μετ' επιστροφής;» Вы возвращаетесь завтра."
        options:
          - Μετ' επιστροφής, παρακαλώ.
          - Απλό, παρακαλώ.
          - Στο αεροδρόμιο, παρακαλώ.
        answer: Μετ' επιστροφής, παρακαλώ.
      - id: q2
        prompt: Вы у кассы, вам нужен один билет до Лимасола.
        options:
          - Ένα εισιτήριο για τη Λεμεσό, παρακαλώ.
          - Αυτό το λεωφορείο πάει στη Λεμεσό;
          - Πόση ώρα κάνει μέχρι τη Λεμεσό;
        answer: Ένα εισιτήριο για τη Λεμεσό, παρακαλώ.
      - id: q3
        prompt: Вы пришли на остановку, а автобус только что ушёл. Вы пишете другу.
        options:
          - Έχασα το λεωφορείο.
          - Το λεωφορείο έχει καθυστέρηση.
          - Ανεβαίνω στο λεωφορείο.
        answer: Έχασα το λεωφορείο.
      - id: q4
        prompt: Вы садитесь в такси, вам нужно в аэропорт.
        options:
          - Στο αεροδρόμιο, παρακαλώ.
          - Πού πρέπει να κατέβω;
          - Από πού φεύγει το λεωφορείο;
        answer: Στο αεροδρόμιο, παρακαλώ.
      - id: q5
        prompt: Вы придёте на встречу на пятнадцать минут позже.
        options:
          - Θα αργήσω δεκαπέντε λεπτά.
          - Κάνει δεκαπέντε λεπτά.
          - Κάθε δεκαπέντε λεπτά.
        answer: Θα αργήσω δεκαπέντε λεπτά.
      - id: q6
        prompt: "Подруга пишет: «Αργείς;» Вы уже почти на месте — будете через пять минут."
        options:
          - Λίγο! Φτάνω σε πέντε λεπτά.
          - Ναι, έχασα το λεωφορείο.
          - Ναι, θα αργήσω μία ώρα.
        answer: Λίγο! Φτάνω σε πέντε λεπτά.
  - type: explanation
    id: writing-how
    title: Как написать об опоздании
    body: |-
      Как и в модулях 11–12, это 60–80 слов — сообщение другу. Такие короткие письма и сообщения — первая часть письменного экзамена. План из шести шагов:
      - приветствие и извинение: Γεια σου, …! Συγγνώμη, αλλά αργώ. / Θα αργήσω.
      - где вы сейчас: Είμαι στο λεωφορείο / στη στάση / στον σταθμό.
      - что случилось: Έχασα το λεωφορείο. Το λεωφορείο έχει καθυστέρηση. Έχει πολλή κίνηση.
      - когда и как вы приедете: Φτάνω στις… Παίρνω ένα ταξί. Θα αργήσω μισή ώρα.
      - вопрос другу: Εσύ πού είσαι; Είσαι ήδη εκεί;
      - прощание: Τα λέμε σε λίγο! Συγγνώμη πάλι!

      Связывайте предложения: **και**, **αλλά**, **γιατί**, **μετά**, **συνήθως**. Проверьте себя после письма: куда — **σε** (στη Λάρνακα, στον σταθμό), откуда — **από**, на чём — **με** (με το λεωφορείο), «через» — **σε** + время (σε δέκα λεπτά), «на десять минут» после αργήσω — без предлога. Города: στη Λεμεσό, στην Πάφο, στη Λευκωσία. Тонос — во всех словах из двух и больше слогов; вопрос — со знаком «;».
  - type: exercise
    id: sentences
    title: Предложения для сообщения
    instruction: Напишите по-гречески. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Извини, я опоздаю на двадцать минут.
        answer:
          - Συγγνώμη, θα αργήσω είκοσι λεπτά.
          - Συγγνώμη θα αργήσω είκοσι λεπτά.
          - Συγγνώμη, αλλά θα αργήσω είκοσι λεπτά.
        explanation: "«На двадцать минут» — без предлога: θα αργήσω είκοσι λεπτά."
      - id: q2
        prompt: Я опоздал на автобус.
        answer:
          - Έχασα το λεωφορείο.
      - id: q3
        prompt: Автобус задерживается, потому что пробки.
        answer:
          - Το λεωφορείο έχει καθυστέρηση, γιατί έχει κίνηση.
          - Το λεωφορείο έχει καθυστέρηση γιατί έχει κίνηση.
          - Το λεωφορείο έχει καθυστέρηση, γιατί έχει πολλή κίνηση.
          - Το λεωφορείο έχει καθυστέρηση γιατί έχει πολλή κίνηση.
          - Το λεωφορείο καθυστερεί, γιατί έχει κίνηση.
          - Το λεωφορείο καθυστερεί γιατί έχει κίνηση.
          - Το λεωφορείο καθυστερεί, γιατί έχει πολλή κίνηση.
          - Το λεωφορείο καθυστερεί γιατί έχει πολλή κίνηση.
          - Το λεωφορείο αργεί, γιατί έχει κίνηση.
          - Το λεωφορείο αργεί γιατί έχει κίνηση.
          - Το λεωφορείο αργεί, γιατί έχει πολλή κίνηση.
          - Το λεωφορείο αργεί γιατί έχει πολλή κίνηση.
      - id: q4
        prompt: Я беру такси.
        answer:
          - Παίρνω ένα ταξί.
          - Παίρνω ταξί.
          - Εγώ παίρνω ένα ταξί.
          - Εγώ παίρνω ταξί.
      - id: q5
        prompt: Я приеду в восемь.
        answer:
          - Φτάνω στις οκτώ.
          - Θα φτάσω στις οκτώ.
          - Έρχομαι στις οκτώ.
          - Είμαι εκεί στις οκτώ.
        explanation: О скором будущем можно сказать настоящим временем — Φτάνω στις οκτώ.
      - id: q6
        prompt: Ты уже в таверне?
        answer:
          - Είσαι ήδη στην ταβέρνα;
          - Είσαι στην ταβέρνα ήδη;
          - Εσύ είσαι ήδη στην ταβέρνα;
        explanation: ήδη — «уже» (модуль 09). Перед τ буква ν у την остаётся — στην ταβέρνα.
  - type: writing
    id: late-message
    register: friendly
    prompt: |-
      Вы договорились поужинать с подругой Στέλλα в таверне в Ларнаке в 20:00. Вы едете из Никосии на междугороднем автобусе, на дороге пробки, и автобус задерживается.

      Напишите ей сообщение 60–80 слов: извинитесь; скажите, где вы и что случилось; когда вы приедете и как доберётесь от автовокзала до таверны; задайте ей вопрос и попрощайтесь.
    words:
      min: 60
      max: 80
    model: Γεια σου, Στέλλα! Συγγνώμη, αλλά αργώ. Είμαι στο λεωφορείο από τη Λευκωσία για τη Λάρνακα. Σήμερα έχει πολλή κίνηση στον δρόμο και το λεωφορείο έχει καθυστέρηση. Συνήθως η διαδρομή κάνει σαράντα πέντε λεπτά. Φτάνουμε στον σταθμό στις οκτώ και είκοσι. Μετά παίρνω ένα ταξί μέχρι την ταβέρνα, γιατί βιάζομαι. Θα αργήσω περίπου μισή ώρα. Εσύ είσαι ήδη στην ταβέρνα; Συγγνώμη πάλι! Τα λέμε σε λίγο!
    criteria:
      - 60–80 слов; дружеское приветствие и прощание на «ты» (Γεια σου, Στέλλα! … Τα λέμε!)
      - Есть извинение (Συγγνώμη…) и сказано, что вы опаздываете (αργώ / θα αργήσω + время без предлога)
      - "Сказано, где вы и что случилось: είμαι στο λεωφορείο…, έχει κίνηση, έχει καθυστέρηση"
      - "Названо время прибытия (στις + час или σε + минуты) и способ добраться (παίρνω ταξί, με τα πόδια, με το λεωφορείο)"
      - "Предлоги верны: σε (στη Λάρνακα, στον σταθμό), από, με, μέχρι + винительный падеж"
      - Есть вопрос подруге со знаком «;»
      - Предложения связаны (και, αλλά, γιατί, μετά); тонос во всех словах из двух и больше слогов; имена — придуманные
  - type: explanation
    id: speaking-how
    title: Ролевая игра «На кассе»
    body: |-
      Третья часть устного экзамена — ролевая игра двух экзаменуемых. Каждый получает карточку со своей ролью: кто вы, где вы и что нужно узнать или сделать. На чтение карточки дают около двух минут, дальше — разговор без подготовки.

      Здесь вы играете пассажира. Реплики кассира придумайте сами или попросите кого-нибудь их прочитать; после записи сравните себя с образцом. С кассиром говорят на «вы»: Καλημέρα σας, Γεια σας, Θα ήθελα…

      План: поздороваться → попросить билеты (сколько, куда) → ответить на вопрос «Απλό ή μετ' επιστροφής;» → спросить цену (Πόσο κάνει; — за несколько билетов Πόσο κάνουν;) → время следующего автобуса → сколько ехать → откуда он отправляется → поблагодарить и попрощаться. Если не поняли ответ: **Άλλη μια φορά, παρακαλώ.** или **Πιο αργά, παρακαλώ.** (модуль 02).
  - type: speaking
    id: ticket-office
    part: roleplay
    prompt: |-
      Ролевая игра. Вы на автовокзале в Лимасоле, у кассы (το εκδοτήριο). Кассир начинает: «Καλημέρα σας! Παρακαλώ;»

      Ваша роль: вам нужны два билета в Пафос, в воскресенье вы возвращаетесь. Узнайте цену, время следующего автобуса, сколько он едет и откуда отправляется. Поблагодарите и попрощайтесь. Говорите на «вы», произнесите свои реплики вслух и запишите.
    seconds: 90
    model: |-
      — Καλημέρα σας! Παρακαλώ;
      — Καλημέρα σας. Θα ήθελα δύο εισιτήρια για την Πάφο, παρακαλώ.
      — Απλά ή μετ' επιστροφής;
      — Μετ' επιστροφής, γιατί γυρίζουμε την Κυριακή. Πόσο κάνουν;
      — Δεκαέξι ευρώ.
      — Ορίστε. Τι ώρα φεύγει το επόμενο λεωφορείο;
      — Στις δέκα και μισή.
      — Και πόση ώρα κάνει μέχρι την Πάφο;
      — Περίπου μία ώρα.
      — Από πού φεύγει;
      — Από τη στάση τρία, απέναντι.
      — Ευχαριστώ πολύ! Γεια σας.
    criteria:
      - Поздоровались и попрощались на «вы» (Καλημέρα σας! … Γεια σας.)
      - "Попросили билеты: δύο εισιτήρια για την Πάφο (για + винительный падеж, ν перед π)"
      - Ответили на вопрос кассира (μετ' επιστροφής) и объяснили почему (γιατί γυρίζουμε την Κυριακή)
      - "Задали вопросы о цене, времени, продолжительности и месте: Πόσο κάνουν; Τι ώρα φεύγει…; Πόση ώρα κάνει…; Από πού φεύγει;"
      - Вежливые слова на месте (παρακαλώ, ευχαριστώ, θα ήθελα)
      - Ударение на своём месте (εισιτήρια, λεωφορείο, επόμενο); ευ в ευχαριστώ — [эф]
  - type: exercise
    id: review-time
    title: Повторение — время и маршрут
    instruction: Вставьте слово. Каждое слово — один раз, два слова лишние.
    format: gap
    bank:
      - κάθε
      - σε
      - κάνει
      - μέχρι
      - στις
      - περίπου
      - πόση
      - για
    items:
      - id: g1
        prompt: Το λεωφορείο περνάει ___ δέκα λεπτά.
        answer: κάθε
      - id: g2
        prompt: Είμαστε κοντά, φτάνουμε ___ πέντε λεπτά.
        answer: σε
      - id: g3
        prompt: Η διαδρομή ___ μία ώρα.
        answer: κάνει
      - id: g4
        prompt: Το εκδοτήριο είναι ανοιχτό από τις επτά ___ τις εννιά.
        answer: μέχρι
      - id: g5
        prompt: Το αεροπλάνο φτάνει ___ τρεις και μισή.
        answer: στις
      - id: g6
        prompt: Δεν ξέρω ακριβώς, αλλά η Πάφος είναι ___ εβδομήντα χιλιόμετρα από εδώ. (ακριβώς — точно)
        answer: περίπου
  - type: exercise
    id: review-mixed
    title: Повторение — модули 04–12
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Πού είναι η στάση ___ λεωφορείου;
        options:
          - του
          - το
          - τον
        answer: του
        explanation: Родительный падеж (модуль 12) — η στάση του λεωφορείου, «остановка автобуса».
      - id: q2
        prompt: ___ δεξιά στο φανάρι. (вежливо, на «вы»)
        options:
          - Στρίψτε
          - Στρίβω
          - Στρίβουν
        answer: Στρίψτε
      - id: q3
        prompt: Το μάθημα αρχίζει ___ μία.
        options:
          - στη
          - στις
          - στο
        answer: στη
        explanation: "В час — στη μία (μία ώρα — одна); с двух — στις: στις δύο."
      - id: q4
        prompt: Θέλω ___ καφέ, παρακαλώ.
        options:
          - έναν
          - ένας
          - ένα
        answer: έναν
      - id: q5
        prompt: Περιμένω ___ φίλους μου στον σταθμό.
        options:
          - τους
          - οι
          - τις
        answer: τους
      - id: q6
        prompt: Η Λεμεσός είναι μια ___ πόλη.
        options:
          - μεγάλη
          - μεγάλος
          - μεγάλο
        answer: μεγάλη
        explanation: Λεμεσός — женского рода, несмотря на -ος, поэтому μεγάλη.
