      - το επίπεδο
      - ο στόχος
      - η τάξη
      - ο βαθμός
    items:
      - id: m1
        prompt: школа (для детей)
        answer: το σχολείο
      - id: m2
        prompt: университет
        answer: το πανεπιστήμιο
      - id: m3
        prompt: диплом (вуза)
        answer: το πτυχίο
      - id: m4
        prompt: сертификат
        answer: το πιστοποιητικό
      - id: m5
        prompt: плата за обучение
        answer: τα δίδακτρα
