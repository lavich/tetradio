  - type: exercise
    id: edu-gap
    title: Учёба
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - μαθητής
      - φοιτήτρια
      - φροντιστήριο
      - βαθμό
      - γραπτές
      - εδώ και
      - γραφτώ
      - προφορικές
      - πτυχίο
    items:
      - id: g1
        prompt: Ο Πέτρος είναι δώδεκα χρονών, είναι ___.
        answer: μαθητής
        explanation: В двенадцать лет ходят в школу — ο μαθητής.
      - id: g2
        prompt: Η Δανάη είναι ___ — σπουδάζει στο πανεπιστήμιο.
        answer: φοιτήτρια
      - id: g3
        prompt: Το απόγευμα, μετά το σχολείο, τα παιδιά πηγαίνουν σε ένα ___ για αγγλικά.
        answer: φροντιστήριο
      - id: g4
        prompt: Πέρασα τις εξετάσεις με πολύ καλό ___!
        answer: βαθμό
        explanation: "После με — винительный падеж: ο βαθμός → τον βαθμό, καλό βαθμό."
      - id: g5
        prompt: Αύριο δίνουμε ___ εξετάσεις — γράφουμε δύο ώρες.
        answer: γραπτές
        explanation: Пишем два часа — значит, экзамен письменный.
      - id: g6
        prompt: Μαθαίνω ελληνικά ___ δύο χρόνια.
        answer: εδώ και
      - id: g7
        prompt: Θέλω να ___ σε ένα μάθημα ελληνικών.
        answer: γραφτώ
        explanation: "Γράφομαι — глагол на -μαι: να γραφτώ."
  - type: explanation
    id: ad-how
    title: Как читать объявление школы
    body: |-
      В объявлении языковой школы ищите пять вещей: для каких уровней занятия, в какие дни и часы, сколько человек в группе, сколько стоит и когда запись. Задания обычно спрашивают именно об этом.

      Слово **το τμήμα** в таких объявлениях — «группа» (οι μαθητές одного уровня и расписания). **Πρωινά** и **βραδινά** τμήματα — утренние и вечерние группы (вы знаете το πρωινό и το βραδινό из модуля 08). Незнакомые слова переведены под текстом.
  - type: reading
    id: ad
    title: Σχολή Ξένων Γλωσσών «Αλφάβητο»
    text: |-
      Σχολή Ξένων Γλωσσών «Αλφάβητο» — Λάρνακα
      Τηλ. 24 665 310

      ΕΛΛΗΝΙΚΑ ΓΙΑ ΞΕΝΟΥΣ

      Θέλετε να μιλάτε ελληνικά στη δουλειά και στην καθημερινή ζωή; Θέλετε να δώσετε εξετάσεις για το πιστοποιητικό ελληνομάθειας; Ελάτε στη σχολή μας!

      Τμήματα για όλα τα επίπεδα, από Α1 μέχρι Β2. Σε κάθε τάξη υπάρχουν μέχρι οκτώ μαθητές.
      Πρωινά τμήματα: Δευτέρα και Τετάρτη, 10:00–12:00.
      Βραδινά τμήματα: Τρίτη και Πέμπτη, 18:30–20:30.
      Μάθημα συζήτησης: κάθε Σάββατο, 11:00–12:30. Εδώ δεν κάνουμε γραμματική — μόνο μιλάμε!

      Οι καθηγητές μας έχουν πτυχίο και πολλά χρόνια εμπειρία.

      Δίδακτρα: 140 € τον μήνα. Το μάθημα συζήτησης κοστίζει 40 € τον μήνα. Τα βιβλία είναι δωρεάν. Οι φοιτητές έχουν έκπτωση 20 %.

      Εγγραφές: 1–20 Σεπτεμβρίου, κάθε μέρα 9:00–17:00. Τα μαθήματα αρχίζουν στις 5 Οκτωβρίου. Πριν από την εγγραφή γράφετε ένα μικρό τεστ, για να βρούμε το επίπεδό σας.
    glosses:
      - text: Αλφάβητο
        russian: «Алфавит» (название школы)
      - text: ΞΕΝΟΥΣ
        russian: иностранцев
      - text: καθημερινή ζωή
        russian: повседневная жизнь
      - text: ελληνομάθειας
        russian: владения греческим языком
      - text: Ελάτε
        russian: приходите
      - text: Τμήματα
        russian: группы
      - text: Μάθημα συζήτησης
        russian: разговорное занятие
      - text: δωρεάν
        russian: бесплатно
      - text: τεστ
        russian: тест
      - text: για να βρούμε
        russian: чтобы определить
  - type: exercise
    id: ad-tf
    about: ad
    title: Верно или неверно
    instruction: Прочитайте объявление. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Στη σχολή υπάρχουν τμήματα μόνο για το επίπεδο Α1.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Από Α1 μέχρι Β2 — для всех уровней от A1 до B2.
      - id: q2
        prompt: Σε μια τάξη υπάρχουν μέχρι δώδεκα μαθητές.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μέχρι οκτώ μαθητές — не больше восьми.
      - id: q3
        prompt: Τα πρωινά τμήματα έχουν μάθημα δύο φορές την εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Δευτέρα και Τετάρτη — два раза в неделю.
      - id: q4
        prompt: Στο μάθημα συζήτησης οι μαθητές κάνουν ασκήσεις γραμματικής.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Εδώ δεν κάνουμε γραμματική — μόνο μιλάμε!
      - id: q5
        prompt: Για τα βιβλία δεν πληρώνετε.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Τα βιβλία είναι δωρεάν.
      - id: q6
        prompt: Μπορείτε να γραφτείτε στη σχολή τον Οκτώβριο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Запись — с 1 по 20 сентября. В октябре начинаются занятия.
      - id: q7
        prompt: Πριν από την εγγραφή πρέπει να γράψετε ένα τεστ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: exercise
    id: ad-choice
    about: ad
    title: Выберите ответ
    instruction: Прочитайте объявление ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Вы работаете с понедельника по пятницу с 8:00 до 16:00 и хотите учить грамматику. Что вам подходит?
        options:
          - Πρωινά τμήματα
          - Βραδινά τμήματα
          - Μάθημα συζήτησης
          - Ничего не подходит
        answer: Βραδινά τμήματα
        explanation: Вечерние группы — вторник и четверг с 18:30, после работы. В субботу грамматики нет.
      - id: q2
        prompt: Вы студентка и ходите в вечернюю группу. Сколько вы платите в месяц?
        options:
          - 112 €
          - 120 €
          - 140 €
          - 180 €
        answer: 112 €
        explanation: Скидка для студентов 20 % от 140 € — это 28 €. 140 − 28 = 112 €.
      - id: q3
        prompt: Зачем нужен тест перед записью?
        options:
          - чтобы определить ваш уровень
          - чтобы получить скидку
          - чтобы получить сертификат
          - чтобы выбрать преподавателя
        answer: чтобы определить ваш уровень
        explanation: Για να βρούμε το επίπεδό σας.
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Диалог звучит два раза. В первый раз поймите ситуацию: кто говорит, о каком курсе. Перед вторым прослушиванием прочитайте вопросы и слушайте детали: дни, время, цены.

      Вы услышите **Γράφτηκα** — «я записалась» (аорист от γράφομαι) и пожелание **Καλό μάθημα!** — «Хорошего занятия!». Будьте внимательны к ловушкам: в разговоре звучат две суммы, но только одна — плата за курс; а о произношении и о письме сказано разное.
  - type: listening
    id: courses
    title: Ένα μάθημα ελληνικών
    plays: 2
    transcript:
      - speaker: Γιώργος
        text: Γεια σου, Μαρίνα! Πού πας με αυτά τα βιβλία;
      - speaker: Μαρίνα
        text: Γεια σου, Γιώργο! Πάω στο μάθημα. Γράφτηκα σε μια σχολή ξένων γλωσσών.
      - speaker: Γιώργος
        text: Ωραία! Σε ποιο επίπεδο είσαι;
      - speaker: Μαρίνα
        text: Στο Α2. Μαθαίνω ελληνικά εδώ και έναν χρόνο. Ο στόχος μου είναι να δώσω εξετάσεις τον Μάιο.
      - speaker: Γιώργος
        text: Πόσες φορές την εβδομάδα έχεις μάθημα;
      - speaker: Μαρίνα
        text: Δύο φορές, την Τρίτη και την Πέμπτη το βράδυ. Το πρωί δεν μπορώ, γιατί δουλεύω.
      - speaker: Γιώργος
        text: Και πώς είναι ο καθηγητής σας;
      - speaker: Μαρίνα
        text: Είναι καθηγήτρια, η κυρία Ελένη. Είναι πολύ καλή! Εξηγεί πολύ καλά τη γραμματική και απαντάει σε όλες τις ερωτήσεις μας.
      - speaker: Γιώργος
        text: Και τι είναι δύσκολο;
      - speaker: Μαρίνα
        text: Η προφορά δεν είναι δύσκολη. Αλλά όταν γράφω, κάνω πολλά λάθη. Πρέπει να γράφω κάθε μέρα.
      - speaker: Γιώργος
        text: Αν θέλεις, μπορούμε να μιλάμε μόνο ελληνικά στη δουλειά.
      - speaker: Μαρίνα
        text: Ναι, ευχαριστώ πολύ!
      - speaker: Γιώργος
        text: Πόσο κοστίζουν τα δίδακτρα;
      - speaker: Μαρίνα
        text: Εκατόν είκοσι ευρώ τον μήνα. Και τα βιβλία κοστίζουν είκοσι ευρώ.
      - speaker: Γιώργος
        text: Δεν είναι ακριβά. Καλό μάθημα! Τα λέμε αύριο στη δουλειά.
      - speaker: Μαρίνα
        text: Τα λέμε!
  - type: exercise
    id: courses-choice
    about: courses
    title: Выберите ответ
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού πηγαίνει η Μαρίνα;
        options:
          - Στο μάθημα ελληνικών.
          - Στη δουλειά.
          - Στο πανεπιστήμιο.
        answer: Στο μάθημα ελληνικών.
      - id: q2
        prompt: Сколько Марина уже учит греческий?
        options:
          - год
          - два года
          - с мая
        answer: год
        explanation: Μαθαίνω ελληνικά εδώ και έναν χρόνο. Май — это когда она хочет сдавать экзамены.
      - id: q3
        prompt: Когда у Марины занятия?
        options:
          - во вторник и четверг вечером
          - в понедельник и среду утром
          - в субботу утром
        answer: во вторник и четверг вечером
      - id: q4
        prompt: Почему Марина не ходит на занятия утром?
        options:
          - утром она работает
          - утром нет группы A2
          - утренние занятия дороже
        answer: утром она работает
        explanation: Το πρωί δεν μπορώ, γιατί δουλεύω.
      - id: q5
        prompt: Что трудно для Марины?
        options:
          - писать без ошибок
          - произношение
          - понимать преподавательницу
        answer: писать без ошибок
        explanation: "Η προφορά δεν είναι δύσκολη. Αλλά όταν γράφω, κάνω πολλά λάθη. Ловушка: произношение названо, но оно не трудное."
      - id: q6
        prompt: Что предлагает Йоргос?
        options:
          - говорить на работе только по-гречески
          - ходить на курс вместе
          - купить ей книги
        answer: говорить на работе только по-гречески
        explanation: Μπορούμε να μιλάμε μόνο ελληνικά στη δουλειά.
      - id: q7
        prompt: Сколько Марина платит за курс в месяц?
        options:
          - 120 €
          - 20 €
          - 140 €
        answer: 120 €
        explanation: Εκατόν είκοσι ευρώ τον μήνα. 20 € стоят книги.
