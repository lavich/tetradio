blocks:
  - type: explanation
    id: education
    title: Где учатся
    body: |-
      **Το σχολείο** — школа для детей; тот, кто там учится, — **ο μαθητής**, **η μαθήτρια** (так называют и учеников на курсах). **Το πανεπιστήμιο** — университет; там учатся **ο φοιτητής**, **η φοιτήτρια**, а в конце получают **το πτυχίο** — диплом.

      **Η σχολή** — школа в смысле «курсы, учебное заведение» (σχολή ξένων γλωσσών — школа иностранных языков), а также факультет университета. **Το φροντιστήριο** — частный учебный центр: после школы дети ходят туда на английский или готовятся к экзаменам. На Кипре и в Греции φροντιστήριο — обычное место, где учат и греческий для иностранцев.

      **Ο καθηγητής**, **η καθηγήτρια** — преподаватель на курсах, в средней школе и в университете. **Ο δάσκαλος** (модуль 03) — учитель начальной школы; в разговоре так говорят и об учителе языка.

      **Η τάξη** — класс: и группа учеников (Στην τάξη μας είμαστε οκτώ), и комната. **Ξένος** — иностранный, чужой: μια ξένη γλώσσα, οι ξένοι — иностранцы. В названии **Σχολή Ξένων Γλωσσών** слова стоят в родительном падеже мн. ч. — запомните это название целиком.

      Мужские слова на -ής (μαθητής, φοιτητής, καθηγητής) в винительном ед. ч. теряют ς, во мн. ч. получают -ές: τον καθηγητή, οι καθηγητές.
    table:
      columns:
        - им. п.
        - вин. п.
        - мн. ч.
        - женский род
      rows:
        - - ο μαθητής
          - τον μαθητή
          - οι μαθητές
          - η μαθήτρια
        - - ο φοιτητής
          - τον φοιτητή
          - οι φοιτητές
          - η φοιτήτρια
        - - ο καθηγητής
          - τον καθηγητή
          - οι καθηγητές
          - η καθηγήτρια
  - type: explanation
    id: exams
    title: Экзамены, цели и запись на курс
    body: |-
      **Η εξέταση** — экзамен; обычно говорят во мн. ч. **οι εξετάσεις**. Будьте внимательны с русским «сдавать»:

      — **δίνω εξετάσεις** — сдавать, то есть идти на экзамен: Θέλω να δώσω εξετάσεις για το επίπεδο Α2.

      — **περνάω τις εξετάσεις** — сдать, то есть успешно пройти: **Πέρασα τις εξετάσεις!** (περνάω, аор. πέρασα — модуль 12).

      Экзамен бывает **γραπτός** — письменный и **προφορικός** — устный: οι γραπτές εξετάσεις, οι προφορικές εξετάσεις. За экзамен получают **βαθμό** — оценку, балл: Πήρα καλό βαθμό. В конце — **το πιστοποιητικό** — сертификат; сертификат КЕГ, к которому вы готовитесь, называется **πιστοποιητικό ελληνομάθειας** — «сертификат владения греческим». **Το επίπεδο** — уровень: το επίπεδο Α2 (читается «άλφα δύο»).

      **Ο στόχος** — цель. После неё удобно ставить να: **Ο στόχος μου είναι να** περάσω τις εξετάσεις — «Моя цель — сдать экзамены».

      **Γράφομαι σε** — записываться (на курс): Γράφτηκα σε ένα μάθημα ελληνικών — «Я записался (записалась) на курс греческого». Θέλω να γραφτώ. **Η εγγραφή** — запись, регистрация: οι εγγραφές αρχίζουν τον Σεπτέμβριο. **Τα δίδακτρα** — плата за обучение, слово есть только во мн. ч.: **Πόσο κοστίζουν τα δίδακτρα;**

      **Εδώ και** + срок — «уже столько-то (и сейчас тоже)»: **Μαθαίνω ελληνικά εδώ και έναν χρόνο** — «Я учу греческий уже год». Глагол — в настоящем времени, как и в русском.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - δίνω εξετάσεις
          - сдавать экзамены (идти на экзамен)
        - - περνάω τις εξετάσεις
          - сдать экзамены (успешно)
        - - παίρνω καλό βαθμό
          - получаю хорошую оценку
        - - γράφομαι σε ένα μάθημα
          - записываюсь на курс
        - - ο στόχος μου είναι να …
          - моя цель — …
        - - εδώ και έναν χρόνο
          - уже год
