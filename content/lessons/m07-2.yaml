blocks:
  - type: explanation
    id: quality
    title: Какая вещь — качество и состояние
    body: |-
      Большинство прилагательных этого урока изменяются так же, как μεγάλος: ακριβός, ακριβή, ακριβό; βρώμικος, βρώμικη, βρώμικο. У **ωραίος** в женском роде -α, потому что перед окончанием гласная: ωραίος, **ωραία**, ωραίο.

      Прилагательные удобно учить парами: καλός — κακός (хороший — плохой), ωραίος — άσχημος (красивый — некрасивый), ακριβός — φτηνός (дорогой — дешёвый), καθαρός — βρώμικος (чистый — грязный), καινούργιος — παλιός (новый — старый).

      **Χαλασμένος** — «сломанный, неисправный» (о технике), а о еде — «испорченный». То же самое можно сказать глаголом: **Το πλυντήριο δεν δουλεύει.** — «Стиральная машина не работает». Δουλεύω — «работать» и о человеке, и о приборе.

      **Αυτό είναι πολύ ακριβό.** — «Это очень дорого». По-русски здесь наречие («дорого»), по-гречески — прилагательное среднего рода, согласованное с αυτό.

      **Καθαρίζω** — «убирать, чистить» — спрягается как γράφω: καθαρίζω, καθαρίζεις, καθαρίζει, καθαρίζουμε, καθαρίζετε, καθαρίζουν. «Принимать душ» — **κάνω ντους**: Κάθε πρωί κάνω ντους.
    table:
