  - type: exercise
    id: dikos-gap
    title: Чьё это?
    instruction: Вставьте форму δικός. Смотрите на вещь, а не на хозяина.
    format: gap
    bank:
      - δικός
      - δική
      - δικό
      - δικοί
      - δικές
      - δικά
    items:
      - id: g1
        prompt: — Ποιανού είναι αυτή η καρέκλα; — Είναι ___ μου.
        answer: δική
      - id: g2
        prompt: — Ποιανού είναι αυτό το ξυπνητήρι; — Είναι ___ μου.
        answer: δικό
      - id: g3
        prompt: Αυτά τα κλειδιά είναι ___ σου;
        answer: δικά
      - id: g4
        prompt: Ο καναπές δεν είναι ___ μας.
        answer: δικός
      - id: g5
        prompt: Οι ντουλάπες είναι ___ τους.
        answer: δικές
        explanation: "Ντουλάπες — женский род, мн. ч.: δικές."
      - id: g6
        prompt: Η Άννα λέει ότι οι δύο καναπέδες είναι ___ της.
        answer: δικοί
        explanation: Хозяйка — женщина (της), но δικός согласуется с вещью — καναπέδες, м. р. мн. ч.
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую фразу.
    format: choice
    items:
      - id: q1
        prompt: Вы включаете стиральную машину, а она не работает. Вы звоните хозяину квартиры.
        options:
          - Το πλυντήριο δεν δουλεύει.
          - Το πλυντήριο είναι καθαρό.
          - Αυτό είναι πολύ ακριβό.
        answer: Το πλυντήριο δεν δουλεύει.
      - id: q2
        prompt: В магазине диван стоит 3000 евро.
        options:
          - Είναι δικό μου.
          - Αυτό είναι πολύ ακριβό.
          - Αυτό είναι πολύ φτηνό.
        answer: Αυτό είναι πολύ ακριβό.
      - id: q3
        prompt: "Сосед спрашивает: «Ποιανού είναι αυτό το κλειδί;» Ключ ваш."
        options:
          - Είναι δικό μου.
          - Είναι δική μου.
          - Είναι δικός μου.
        answer: Είναι δικό μου.
        explanation: Το κλειδί — средний род, поэтому δικό.
      - id: q4
        prompt: Вы в мебельном магазине и объясняете, что ищете.
        options:
          - Θέλω έναν μεγάλο καναπέ για το σαλόνι.
          - Ο καναπές είναι χαλασμένος.
          - Ποιανού είναι ο καναπές;
        answer: Θέλω έναν μεγάλο καναπέ για το σαλόνι.
