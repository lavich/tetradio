  - type: explanation
    id: read-how
    title: Как читать список и текст
    body: |-
      В тексте ниже есть список покупок. В таких списках вещь пишут без артикля и без глагола: «ένα ψυγείο», «δύο κρεβάτια». Слова вне модуля переведены — нажмите на подчёркнутое слово.

      Сначала прочитайте текст целиком, потом задания. В заданиях «верно/неверно» ищите в тексте именно то прилагательное, о котором спрашивают: παλιό или καινούργιο, μικρά или μεγάλα.
  - type: reading
    id: sofia
    title: Ένα καινούργιο σπίτι
    text: |-
      Η Σοφία και ο Αλέξης μένουν τώρα σε ένα καινούργιο διαμέρισμα στη Λάρνακα. Το διαμέρισμα έχει δύο υπνοδωμάτια, ένα σαλόνι, μία μικρή κουζίνα και ένα μπάνιο με ντους. Υπάρχει και ένα μεγάλο μπαλκόνι.

      Στην κουζίνα υπάρχει ένα ψυγείο, αλλά είναι πολύ παλιό και δεν δουλεύει καλά. Ο φούρνος είναι καινούργιος και καθαρός. Το πλυντήριο στο μπάνιο είναι χαλασμένο. Στο σαλόνι υπάρχει ένας μεγάλος καναπές. Είναι κίτρινος και πολύ άσχημος, αλλά δεν είναι δικός τους: είναι του ιδιοκτήτη. Τα υπνοδωμάτια είναι μικρά αλλά ωραία, και το κλιματιστικό δουλεύει.

      Το Σάββατο η Σοφία και ο Αλέξης καθαρίζουν το σπίτι. Μετά πηγαίνουν για ψώνια. Η Σοφία γράφει μία λίστα:

      – ένα ψυγείο (καλό, αλλά όχι ακριβό!)
      – ένα πλυντήριο
      – μία ντουλάπα για το μικρό υπνοδωμάτιο
      – τέσσερις καρέκλες για την κουζίνα
      – ένα ξυπνητήρι (το παλιό είναι χαλασμένο)
      – τρία κλειδιά για την πόρτα

      Ένα καινούργιο ψυγείο κάνει πεντακόσια ευρώ, ένα φτηνό κάνει τριακόσια. Ο Αλέξης λέει: «Το φτηνό ψυγείο δεν είναι καλό. Θέλω ένα καλό ψυγείο!»
    glosses:
      - text: του ιδιοκτήτη
        russian: хозяина квартиры
      - text: πηγαίνουν για ψώνια
        russian: идут за покупками
      - text: μία λίστα
        russian: список
      - text: το παλιό
        russian: старый (будильник)
      - text: ένα φτηνό
        russian: дешёвый (холодильник)
  - type: exercise
    id: sofia-tf
    about: sofia
    title: Верно или неверно
    instruction: Прочитайте текст. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το διαμέρισμα είναι στη Λάρνακα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Το ψυγείο είναι καινούργιο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είναι πολύ παλιό — холодильник очень старый. Новая — духовка.
      - id: q3
        prompt: Ο φούρνος είναι καθαρός.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Το πλυντήριο δεν δουλεύει.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Το πλυντήριο είναι χαλασμένο — «сломана» и «не работает» значат одно и то же.
      - id: q5
        prompt: Ο καναπές είναι δικός τους.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν είναι δικός τους — диван принадлежит хозяину квартиры.
      - id: q6
        prompt: Τα υπνοδωμάτια είναι μεγάλα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τα υπνοδωμάτια είναι μικρά αλλά ωραία.
      - id: q7
        prompt: Ο Αλέξης θέλει ένα φτηνό ψυγείο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το φτηνό ψυγείο δεν είναι καλό. Θέλω ένα καλό ψυγείο! — Алексис хочет хороший, а не дешёвый.
  - type: exercise
    id: sofia-choice
    about: sofia
    title: Выберите ответ
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Για ποιο δωμάτιο είναι η ντουλάπα;
        options:
          - Για το σαλόνι.
          - Για το μικρό υπνοδωμάτιο.
          - Για την κουζίνα.
          - Για το μπαλκόνι.
        answer: Για το μικρό υπνοδωμάτιο.
        explanation: μία ντουλάπα για το μικρό υπνοδωμάτιο.
      - id: q2
        prompt: Γιατί θέλουν ένα ξυπνητήρι;
        options:
          - Το παλιό είναι χαλασμένο.
          - Το παλιό είναι άσχημο.
          - Δεν έχουν ξυπνητήρι.
          - Το παλιό είναι πολύ βρώμικο.
        answer: Το παλιό είναι χαλασμένο.
        explanation: το παλιό είναι χαλασμένο — «старый сломан».
      - id: q3
        prompt: Πόσο κάνει ένα φτηνό ψυγείο;
        options:
          - 200 ευρώ
          - 300 ευρώ
          - 400 ευρώ
          - 500 ευρώ
        answer: 300 ευρώ
        explanation: Ένα φτηνό κάνει τριακόσια. 500 евро — новый хороший холодильник.
      - id: q4
        prompt: Το Σάββατο καθαρίζουν το σπίτι. Τι κάνουν μετά;
        options:
          - Βλέπουν τηλεόραση.
          - Πηγαίνουν για ψώνια.
          - Πηγαίνουν στη θάλασσα.
          - Καθαρίζουν το ψυγείο.
        answer: Πηγαίνουν για ψώνια.
        explanation: Το Σάββατο… καθαρίζουν το σπίτι. Μετά πηγαίνουν για ψώνια — «потом идут за покупками».
      - id: q5
        prompt: Πόσες καρέκλες θέλουν για την κουζίνα;
        options:
          - Δύο.
          - Τρεις.
          - Τέσσερις.
          - Έξι.
        answer: Τέσσερις.
        explanation: τέσσερις καρέκλες — τέσσερις, потому что καρέκλα женского рода.
  - type: explanation
    id: listen-how
    title: Как слушать описание
    body: |-
      В первой части экзаменационного аудирования звучат короткие описания, а к ним нужно подобрать картинки; две картинки лишние. В приложении картинки заменены короткими описаниями по-русски.

      Лишние картинки обычно похожи на верные: те же вещи, но другой цвет или размер. Поэтому в первый раз слушайте, о какой комнате речь, а во второй — прилагательные: какого цвета, большой или маленький, новый или старый.
  - type: listening
    id: eleni
    title: Το καινούργιο μου σπίτι
    plays: 2
    transcript:
      - speaker: Ελένη
        text: "Γεια σου, Μαρία! Έλα μέσα! Αυτό είναι το καινούργιο μου σπίτι."
        audio: m07-2/eleni-1.mp3
      - speaker: Ελένη
        text: "Αυτό είναι το σαλόνι. Ο καναπές είναι μεγάλος και άσπρος. Μπροστά υπάρχει ένα μικρό μαύρο τραπέζι."
        audio: m07-2/eleni-2.mp3
      - speaker: Ελένη
        text: "Αυτή είναι η κουζίνα. Είναι μικρή αλλά καθαρή. Το ψυγείο είναι κόκκινο και ο φούρνος είναι καινούργιος."
        audio: m07-2/eleni-3.mp3
      - speaker: Ελένη
        text: "Εδώ είναι το υπνοδωμάτιό μου. Το κρεβάτι είναι μπλε και δίπλα στο κρεβάτι υπάρχει μία μεγάλη άσπρη ντουλάπα."
        audio: m07-2/eleni-4.mp3
      - speaker: Ελένη
        text: "Αυτό είναι το μπάνιο. Δεν είναι μεγάλο. Έχει ένα ντους και ένα πλυντήριο. Το πλυντήριο είναι παλιό, αλλά δουλεύει."
        audio: m07-2/eleni-5.mp3
      - speaker: Ελένη
        text: "Αυτό είναι το δωμάτιο για τα παιδιά. Υπάρχουν δύο μικρά κρεβάτια, ένα κόκκινο και ένα κίτρινο."
        audio: m07-2/eleni-6.mp3
      - speaker: Ελένη
        text: "Και αυτό είναι το μπαλκόνι. Εδώ υπάρχουν δύο πράσινες καρέκλες και ένα μικρό τραπέζι. Το απόγευμα διαβάζω εδώ."
        audio: m07-2/eleni-7.mp3
      - speaker: Μαρία
        text: "Ελένη, το σπίτι σου είναι πολύ ωραίο!"
        audio: m07-2/eleni-8.mp3
  - type: exercise
    id: eleni-match
    about: eleni
    title: Комната и картинка
    instruction: Елена показывает подруге квартиру. Подберите к каждой комнате картинку (по порядку, как их показывает Елена). Три картинки лишние.
    format: match
    bank:
      - большой белый диван, перед ним маленький чёрный столик
      - маленький чёрный диван, перед ним большой белый стол
      - красный холодильник и новая духовка
      - синяя кровать, рядом большой белый шкаф
      - белая кровать, рядом большой синий шкаф
      - душ и старая стиральная машина
      - две маленькие кровати — красная и жёлтая
      - два зелёных стула и маленький столик
      - два красных стула и большой стол
    items:
      - id: m1
        prompt: Комната 1
        answer: большой белый диван, перед ним маленький чёрный столик
