  - type: explanation
    id: dikos
    title: Чей? — Ποιανού; — δικός μου
    body: |-
      **Ποιανού είναι;** [пьяну́] — «Чей это? Чья? Чьё?». Слово не изменяется, о какой бы вещи ни спрашивали: Ποιανού είναι αυτό το κλειδί; Ποιανού είναι αυτή η καρέκλα; — вопрос один. Если заранее ясно, что хозяйка — женщина, можно спросить **ποιανής**. Часто говорят и **Τίνος είναι;** — то же самое. Ποιανής и τίνος достаточно узнавать.

      Отвечают словом **δικός** + μου, σου, του, της, μας, σας, τους: **Είναι δικό μου.** — «Это моё». Δικός изменяется как прилагательное и согласуется с **вещью**, а не с хозяином: о ключе (το κλειδί) — δικό μου, о стуле (η καρέκλα) — δική μου, о диване (ο καναπές) — δικός μου, о ключах (τα κλειδιά) — δικά μου.

      Δικός подчёркивает «свой, собственный»: Το σπίτι δεν είναι δικό μας, το νοικιάζουμε. — «Дом не наш, мы его снимаем».

      **Θέλω έναν μεγάλο καναπέ για το σαλόνι.** — «Я хочу большой диван для гостиной». После θέλω у мужского рода окончание меняется: ένας μεγάλος καναπές → **έναν μεγάλο καναπέ**. Это винительный падеж, его разберём в модуле 08, а пока запомните фразу целиком. У женского и среднего рода с ένα/μία форма та же: Θέλω μία μεγάλη ντουλάπα. Θέλω ένα καινούργιο ψυγείο.
    table:
      columns:
        - вещь
        - чья
      rows:
        - - ο καναπές
          - Είναι δικός μου.
        - - η καρέκλα
          - Είναι δική σου.
        - - το κλειδί
          - Είναι δικό του.
        - - οι καναπέδες
          - Είναι δικοί της.
        - - οι καρέκλες
          - Είναι δικές μας.
        - - τα κλειδιά
          - Είναι δικά τους.
