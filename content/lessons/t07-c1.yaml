title: День поездки
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как устроена контрольная точка
    body: |-
      Это контрольная точка первой ступени курса — модули t01–t07. Один день поездки в Эдинбург подряд: прилёт и паспортный контроль, дорога до квартиры, заезд и проблема в квартире, ужин со счётом, аптека, а в конце — жалоба. Около 60 минут. Делайте её за один раз, без словаря, таблиц и карточек: результат должен показать, что уже усвоено, а не что можно найти. Новых карточек здесь нет — только пройденное в модулях; редкие слова в текстах подписаны, а в аудио для ответа они не нужны.

      **Чтение и аудирование** проверяются автоматически. Для каждого навыка считается доля правильных ответов и сравнивается с порогом **60 %** — по нему курс считает навык сданным. Каждое аудио звучит два раза. В заданиях на аудирование открывайте текст кнопкой «Открыть текст» только после ответов, иначе результат ничего не покажет; реплики перед ролевыми сценами, наоборот, открывайте после двух прослушиваний и держите перед глазами. В вопросах с выбором верен один вариант.

      **Ролевые сцены.** Сцен пять, в каждой сначала звучат только реплики собеседника, по порядку. Послушайте их два раза, откройте текст и держите перед глазами. Затем запишите свою часть: прочитайте реплику, ответьте на неё одной-двумя фразами, переходите к следующей.

      **Письмо и речь** — самопроверка: в итог они не входят. Сначала напишите текст и запишите ответ сами, только потом откройте образец и честно отметьте, какие критерии выполнены. Если выполнено меньше 60 % критериев, считайте навык пока не сданным.

      **Навык ниже порога** — повод повторить модули, которые названы в пояснениях к ошибкам: чтение — t02, t03 и t06 (указатели, сообщение хоста, инструкция к лекарству), аудирование — t01, t03 и t04 (объявления, голосовое хоста, разговор в ресторане), письмо — t03 и t07, речь — сцены из t05–t07 и банки фраз третьих уроков. Повторите их до второй ступени.

      **Темп.** Программа рассчитана на одно занятие в неделю. Если все навыки не ниже порога и занятия даются легко, вторую ступень можно проходить быстрее — по два занятия в неделю (программа предлагает это после экзамена по греческому, в мае 2027). Если навык ниже порога, сначала повторите его модули и оставьте прежний темп.
    table:
      columns:
        - часть
        - задания
        - время
      rows:
        - - Прилёт
          - объявления в аэропорту, паспортный контроль
          - 8 мин
        - - Дорога
          - указатель в аэропорту, такси
          - 8 мин
        - - Заезд
          - сообщение и голосовое хоста, письмо хосту, звонок
          - 15 мин
        - - Ужин
          - разговор за столом, заказ и счёт
          - 10 мин
        - - Аптека
          - разговор с фармацевтом, инструкция к лекарству
          - 8 мин
        - - Жалоба и язык
          - жалоба 80–100 слов, грамматика ступени
          - 11 мин
  - type: listening
    id: arrival
    title: Сцена 1 · Прилёт — объявления в аэропорту
    plays: 2
    transcript:
      - { text: "Welcome to Edinburgh Airport. Baggage from the Istanbul flight will arrive on belt 4. Baggage from the Amsterdam flight is now on belt 2." }
      - { text: "We are sorry to inform you that, because of a power failure, trams between the airport and the city centre are not running this morning. The Airlink 100 bus to Waverley Bridge is running as normal from stop A, directly outside the terminal." }
      - { text: "If you have left something on your plane, please go to your airline's desk in the arrivals hall before you leave the airport." }
      - { text: "The 11:45 coach to Glasgow is running twenty minutes late. It will now leave at 12:05 from stand 3." }
  - type: exercise
    id: arrival-q
    about: arrival
    graded: true
    title: Аудирование — объявления
    instruction: Прослушайте объявления два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Where will the bags from the Istanbul flight arrive?
        options: [on belt 4, on belt 2, on belt 3]
        answer: on belt 4
        explanation: "Baggage from the Istanbul flight will arrive on belt 4; belt 2 — у рейса из Амстердама, 3 — номер платформы автобуса. Объявления в зале прилёта — модуль t01."
      - id: q2
        prompt: How can passengers get to the city centre this morning?
        options:
          - by bus from stop A
          - by tram from the tram stop
          - by coach from stand 3
        answer: by bus from stop A
        explanation: "Trams… are not running this morning (не ходят), а автобус Airlink 100 is running as normal from stop A. С платформы 3 уходит автобус в Глазго (модули t01–t02)."
      - id: q3
        prompt: You have left your scarf on the plane. What should you do?
        options:
          - go to your airline's desk before you leave the airport
          - call the airport's lost property office tomorrow
          - go back to the gate
        answer: go to your airline's desk before you leave the airport
        explanation: "Please go to your airline's desk in the arrivals hall before you leave the airport — к стойке авиакомпании, пока вы ещё в аэропорту (модуль t01)."
      - id: q4
        prompt: When does the coach to Glasgow leave now?
        options: ["at 12:05", "at 11:45", "at 12:25"]
        answer: "at 12:05"
        explanation: "The 11:45 coach… is running twenty minutes late. It will now leave at 12:05: 11:45 — время по расписанию, will now leave — новое (модуль t01)."
  - type: listening
    id: border-lines
    title: Сцена 1 · Реплики собеседника — паспортный контроль
    plays: 2
    transcript:
      - { speaker: Joanne, text: "Good morning. Can I see your passport, please?" }
      - { speaker: Joanne, text: "Thank you. What's the purpose of your visit?" }
      - { speaker: Joanne, text: "And how long are you staying?" }
      - { speaker: Joanne, text: "Where are you staying?" }
      - { speaker: Joanne, text: "Is anyone travelling with you?" }
      - { speaker: Joanne, text: "Have you got a return ticket?" }
  - type: speaking
    id: border
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Ольга, прилетели в Эдинбург из Стамбула. Сегодня четверг, 18 июня. Говорит Джоанн, офицер пограничной службы (Border Force). Вы в отпуске до понедельника, 22 июня. Живёте в квартире в районе Марчмонт, рядом с парком Медоуз: её сдаёт Оливер — тот же хост, у которого вы жили в Бристоле (модуль t03), теперь у него квартира и в Эдинбурге. Летите одна, но сегодня вечером ужинаете с подругой из Бразилии. Обратный рейс — в понедельник в 18:10, билет в телефоне. Отвечайте коротко и вежливо. 6 реплик, вся ваша часть — 30–60 секунд.
    seconds: 60
    model: |-
      Officer: Good morning. Can I see your passport, please?
      You: Good morning. Yes, here you are.
      Officer: Thank you. What's the purpose of your visit?
      You: I'm here on holiday.
      Officer: And how long are you staying?
      You: For four nights, until Monday.
      Officer: Where are you staying?
      You: In a flat in Marchmont, near the Meadows. I've got the booking on my phone.
      Officer: Is anyone travelling with you?
      You: No, I'm travelling alone. But I'm meeting a friend from Brazil for dinner tonight.
      Officer: Have you got a return ticket?
      You: Yes, it's on my phone. My flight back leaves on Monday at ten past six in the evening.
    criteria:
      - Ответили на все шесть вопросов по порядку, коротко — одна-две фразы
      - "Цель — on holiday (не for holiday); срок — for four nights / until Monday (не on four nights)"
      - "Где живёте — in a flat / at a hotel + где; один — I'm travelling alone"
      - "Рейс по расписанию — present simple: My flight back leaves on Monday at…"
      - Вежливо и спокойно, без долгих пауз
  - type: reading
    id: transport
    title: Сцена 2 · Дорога — указатель в аэропорту
    text: |-
      EDINBURGH AIRPORT — GETTING INTO THE CITY

      TRAM — follow the signs to the tram stop, 2 minutes' walk.
      Every 7 minutes, 05:30–23:30. To Princes Street: about 35 minutes.
      Buy your ticket from the machine at the stop or in the app, or tap your contactless card on the reader at the stop, before you get on. Airport single £7.90. Tickets are checked on board: passengers without a valid ticket pay a £10 penalty fare.

      AIRLINK 100 BUS — stop A, directly outside the terminal.
      Every 10 minutes during the day, every 30 minutes at night. To Waverley Bridge: about 30 minutes. Single £6.00, return £8.50.
      Tap your contactless card on the reader when you get on, or pay the driver in cash. If you pay in cash, please have the exact fare ready: drivers may not have change.

      TAXIS — official taxi rank outside the arrivals hall, turn right. All taxis use a meter.
      App taxis and pre-booked cars: the pick-up point is on the ground floor of the multi-storey car park, 5 minutes' walk.
    glosses:
      - { text: on board, russian: в вагоне }
      - { text: valid, russian: действительный }
      - { text: penalty fare, russian: штраф за проезд без билета }
      - { text: the exact fare, russian: точная сумма за проезд }
      - { text: a meter, russian: счётчик }
      - { text: pre-booked, russian: заказанный заранее }
      - { text: multi-storey car park, russian: многоэтажная парковка }
  - type: exercise
    id: transport-q
    about: transport
    graded: true
    title: Чтение — указатель
    instruction: Прочитайте указатель и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Where can you buy a tram ticket?
        options:
          - at the stop or in the app, before you get on
          - from the driver when you get on
          - from the inspector on the tram
        answer: at the stop or in the app, before you get on
        explanation: "Билет покупают до посадки: в автомате или приложении, или прикладывают карту к валидатору на остановке; on board билеты только проверяют (модуль t02)."
      - id: q2
        prompt: What happens if you travel on the tram without a ticket?
        options:
          - You have to pay £10.
          - You have to get off at the next stop.
          - You can buy a single on board for £7.90.
        answer: You have to pay £10.
        explanation: "Passengers without a valid ticket pay a £10 penalty fare — штраф 10 фунтов (модуль t02)."
      - id: q3
        prompt: You want to pay for the bus with a £20 note. What is the problem?
        options:
          - The driver may not have change.
          - The bus does not take cash.
          - You can only buy a return.
        answer: The driver may not have change.
        explanation: "Наличными можно, но have the exact fare ready: drivers may not have change — сдачи может не быть (модуль t02)."
      - id: q4
        prompt: You have booked a car in an app. Where do you meet it?
        options:
          - in the multi-storey car park
          - at the taxi rank outside arrivals
          - at stop A outside the terminal
        answer: in the multi-storey car park
        explanation: "App taxis and pre-booked cars: the pick-up point is on the ground floor of the multi-storey car park; у зала прилёта — стоянка обычных такси со счётчиком (модуль t02)."
  - type: listening
    id: taxi-lines
    title: Сцена 2 · Реплики собеседника — такси
    plays: 2
    transcript:
      - { speaker: Kwame, text: "Hello there. Where to?" }
      - { speaker: Kwame, text: "Marchmont, no problem. Let me give you a hand with your case." }
      - { speaker: Kwame, text: "About thirty-five minutes. The trams aren't running this morning, so the roads are busy." }
      - { speaker: Kwame, text: "It's on the meter — usually about thirty pounds to Marchmont. Card or cash is fine." }
      - { speaker: Kwame, text: "Right, this is Warrender Park Road. What number is it?" }
      - { speaker: Kwame, text: "Here you go. That's thirty-two eighty, please." }
  - type: speaking
    id: taxi
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Трамваи не ходят, чемодан тяжёлый — вы берёте такси на стоянке у зала прилёта. Водитель — Кваме. Адрес: 12 Warrender Park Road, район Марчмонт. Спросите, сколько ехать и сколько это будет стоить; попросите сказать, когда подъедете к улице, — района вы не знаете; попросите высадить вас у синей двери; заплатите наличными 35 фунтов и оставьте сдачу. 6 реплик, вся ваша часть — 30–60 секунд.
    seconds: 60
    model: |-
      Driver: Hello there. Where to?
      You: Hello. Twelve Warrender Park Road, in Marchmont, please.
      Driver: Marchmont, no problem. Let me give you a hand with your case.
      You: Yes, please, it's quite heavy. How long does it take to get there?
      Driver: About thirty-five minutes. The trams aren't running this morning, so the roads are busy.
      You: OK. Roughly how much will it be?
      Driver: It's on the meter — usually about thirty pounds to Marchmont. Card or cash is fine.
      You: Great. Could you let me know when we get to Warrender Park Road? I don't know the area.
      Driver: Right, this is Warrender Park Road. What number is it?
      You: Number twelve. Can you drop me off by the blue door, please?
      Driver: Here you go. That's thirty-two eighty, please.
      You: Here's thirty-five. Keep the change. Thanks for your help!
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-две фразы
      - "Адрес — номер дома, улица, район и please"
      - "Вопросы — How long does it take…? / How much will it be?"
      - "Просьбы — Could you let me know when…? / Can you drop me off…?"
      - "Оплата — Here's… Keep the change; спасибо в конце"
  - type: reading
    id: host-message
    title: Сцена 3 · Заезд — сообщение хоста
    text: |-
      Hi Olga, great to have you back — this time in my Edinburgh flat! Here's everything you need for your stay (18–22 June).

      CHECK-IN: from 3 pm. If you arrive early, you can leave your bags at the café on the corner, The Meadows Kitchen — they know you're coming.

      KEYS: the lockbox is on the wall to the left of the main door. Code: 2580. The flat is 2F1 — second floor, first door on the left.

      WI-FI: the network name and password are on the fridge.

      WINDOWS: the windows are old and a bit stiff. To close the bedroom window, lift it a little, then push it down slowly. If it still won't close, message me — please don't push it hard, as the glass is old.

      HOUSE RULES: no smoking in the flat or on the stairs. Quiet after 10 pm, please — the neighbours have small children. Recycling goes in the green bins on the street, glass in the purple one.

      CHECK-OUT: by 11 am. Leave the keys on the kitchen table and close the door behind you.

      Oliver
    glosses:
      - { text: neighbours, russian: соседи }
      - { text: Recycling, russian: "вторсырьё (бумага, пластик, банки)" }
      - { text: bins, russian: мусорные баки }
  - type: exercise
    id: host-message-q
    about: host-message
    graded: true
    title: Чтение — сообщение хоста
    instruction: Прочитайте сообщение и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: You get to Marchmont at 12:30. What can you do?
        options:
          - leave your bags at the café on the corner
          - check in early with the lockbox code
          - leave your bags by the door of the flat
        answer: leave your bags at the café on the corner
        explanation: "Check-in from 3 pm, а до этого — you can leave your bags at the café on the corner (модуль t03)."
      - id: q2
        prompt: According to the message, where is the lockbox?
        options:
          - on the wall next to the main door
          - next to the door of flat 2F1
          - in the café on the corner
        answer: on the wall next to the main door
        explanation: "The lockbox is on the wall to the left of the main door — у входной двери дома; 2F1 — номер квартиры, а в кафе по сообщению оставляют только сумки (модуль t03)."
      - id: q3
        prompt: You lifted the bedroom window and pushed it down slowly, but it still won't close. What should you do?
        options:
          - send Oliver a message
          - push it down harder
          - call someone to fix it
        answer: send Oliver a message
        explanation: "If it still won't close, message me — please don't push it hard: не давить сильнее, а написать хосту (модуль t03)."
      - id: q4
        prompt: Where do empty wine bottles go?
        options:
          - in the purple bin on the street
          - in the green bins on the street
          - in the bin in the kitchen
        answer: in the purple bin on the street
        explanation: "Recycling goes in the green bins…, glass in the purple one: бутылки — стекло, значит в фиолетовый бак (модуль t03)."
  - type: listening
    id: lock-voice
    title: Сцена 3 · Голосовое хоста
    plays: 2
    transcript:
      - { speaker: Oliver, text: "Hi Olga, it's Oliver, your host. Sorry, change of plan: the lockbox is broken — it won't open. So this morning the cleaner left your keys at the café on the corner. Just ask at the counter and give them your name." }
      - { speaker: Oliver, text: "And the main door downstairs is a bit stiff: turn the key, then push the door hard. The flat's on the second floor, and I'm afraid there's no lift." }
      - { speaker: Oliver, text: "I'm in Glasgow until tomorrow, so I can't come over, but text me if there's a problem and I'll reply quickly. Enjoy Edinburgh!" }
  - type: exercise
    id: lock-voice-q
    about: lock-voice
    graded: true
    title: Аудирование — голосовое хоста
    instruction: Прослушайте голосовое сообщение два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Where are the keys now?
        options:
          - at the café on the corner
          - in the lockbox by the main door
          - with the cleaner
        answer: at the café on the corner
        explanation: "The cleaner left your keys at the café on the corner — ключи в кафе, а не у уборщицы и не в ящике (модуль t03)."
      - id: q2
        prompt: What's the problem with the lockbox?
        options:
          - It won't open.
          - The code has changed.
          - Someone has stolen it.
        answer: It won't open.
        explanation: "The lockbox is broken — it won't open: ящик сломан и не открывается (модуль t03)."
      - id: q3
        prompt: How do you open the main door?
        options:
          - Turn the key and push the door hard.
          - Pull the door towards you and turn the key.
          - Ring the bell for flat 2F1.
        answer: Turn the key and push the door hard.
        explanation: "The main door is a bit stiff (туго открывается): turn the key, then push the door hard (модуль t03)."
      - id: q4
        prompt: Why can't Oliver come to the flat today?
        options:
          - He's in Glasgow until tomorrow.
          - He's working all day.
          - He's waiting for a delivery.
        answer: He's in Glasgow until tomorrow.
        explanation: "I'm in Glasgow until tomorrow, so I can't come over — до завтра его нет в городе (модуль t03)."
  - type: writing
    id: host-problem
    register: friendly
    prompt: "Вы забрали ключи в кафе и зашли в квартиру. Окно в спальне не закрывается: оно открыто сантиметров на десять, с улицы шумно и холодно. Вы приподняли раму и медленно опустили её, как написано в сообщении, — не помогло. Напишите Оливеру сообщение (60–80 слов): поблагодарите за помощь с ключами, опишите проблему и что вы уже сделали, попросите прислать мастера и скажите, когда вас не будет дома: в 19:00 вы уходите ужинать, вернётесь к 21:30."
    words: { min: 60, max: 80 }
    model: |-
      Hi Oliver,
      Thanks for sorting out the keys — the flat is lovely! But there's a problem: the bedroom window won't close. It's open about ten centimetres, so the room is noisy and cold. I've lifted it and pushed it down slowly, as your message says, but it's still stuck. Could you send someone to have a look? I'm going out for dinner at seven, but I'll be back by half past nine.
      Thanks,
      Olga
    criteria:
      - "60–80 слов; дружеское начало и конец (Hi Oliver, … Thanks, имя)"
      - "Проблема — the window won't close / doesn't close, и чем это плохо"
      - "Что уже сделали — present perfect: I've lifted it… / I've tried…"
      - "Просьба — вопросом: Could you send someone to have a look?"
      - "Когда вас нет — I'm going out at…, I'll be back by…"
  - type: listening
    id: call-lines
    title: Сцена 3 · Реплики собеседника — звонок хоста
    plays: 2
    transcript:
      - { speaker: Oliver, text: "Hi Olga, it's Oliver. I've just seen your message — I'm so sorry! So the window won't close at all?" }
      - { speaker: Oliver, text: "Right. Can you see anything in the way? Sometimes the curtain gets caught at the bottom." }
      - { speaker: Oliver, text: "OK, I'll call the man who does my repairs. I'm afraid he can't come until tomorrow afternoon." }
      - { speaker: Oliver, text: "I'll try, but it's very short notice. In the meantime, there's an electric heater and some earplugs in the hall cupboard." }
      - { speaker: Oliver, text: "I'm afraid I can't change the price myself — you'd need to contact the booking platform about that. Is there anything else?" }
      - { speaker: Oliver, text: "Of course. I'll text you as soon as I hear from him. Sorry again!" }
  - type: speaking
    id: call
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Оливер перезванивает после вашего сообщения. Подтвердите, что окно в спальне совсем не закрывается и в комнате шумно; скажите, что штора не мешает — вы проверили — и что вы уже пробовали приподнять раму. Мастер может прийти только завтра днём — вежливо спросите, нельзя ли сегодня вечером (I was wondering if…). Спросите о скидке за эту ночь с открытым окном. В конце попросите написать вам, когда станет известно время прихода мастера. 6 реплик, вся ваша часть — 60–90 секунд.
    seconds: 90
    model: |-
      Oliver: Hi Olga, it's Oliver. I've just seen your message — I'm so sorry! So the window won't close at all?
      You: Hi Oliver, thanks for calling. No, it won't. It's still open about ten centimetres, and it's really noisy.
      Oliver: Right. Can you see anything in the way? Sometimes the curtain gets caught at the bottom.
      You: No, I've checked the curtain. I've already tried lifting the window, but it hasn't helped.
      Oliver: OK, I'll call the man who does my repairs. I'm afraid he can't come until tomorrow afternoon.
      You: Tomorrow afternoon? That's quite late. I was wondering if someone could come this evening.
      Oliver: I'll try, but it's very short notice. In the meantime, there's an electric heater and some earplugs in the hall cupboard.
      You: Thank you. But I can't sleep with the window open. Could you give me a discount for tonight?
      Oliver: I'm afraid I can't change the price myself — you'd need to contact the booking platform about that. Is there anything else?
      You: Yes. Could you text me when you know what time he's coming?
      Oliver: Of course. I'll text you as soon as I hear from him. Sorry again!
      You: Thanks, Oliver. Speak soon.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-две фразы
      - "Проблема — it won't close / it's still open; что сделали — I've checked… / I've already tried…"
      - "Мягкая просьба — I was wondering if someone could come this evening"
      - "Просьбы — Could you give me a discount…? / Could you text me when…?"
      - Вежливо и спокойно, без You must…
