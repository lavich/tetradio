  - type: speaking
    id: pharmacy
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      После ужина вы заходите в аптеку, которая работает допоздна. Фармацевт — Бриджет. С четырёх часов дня у вас сыпь на руках и шее, она чешется (itchy). Вы думаете, что это из-за постельного белья в квартире. Отёка и проблем с дыханием нет. Переспросите, как часто наносить крем; спросите о побочных эффектах таблеток; в конце поблагодарите и попросите чек для страховой. 6 реплик, вся ваша часть — 60–90 секунд.
    seconds: 90
    model: |-
      Pharmacist: Hello, what can I do for you?
      You: Hello. I've got a rash on my arms and my neck, and it's really itchy.
      Pharmacist: Oh dear. How long have you had it?
      You: Since about four o'clock this afternoon. I think it's the bedding in my flat.
      Pharmacist: Have you got any swelling around your lips or eyes? Any trouble breathing?
      You: No, nothing like that. Just the rash.
      Pharmacist: That's good. I'd recommend these antihistamine tablets — one a day — and this cream for the rash.
      You: Sorry, how often should I use the cream?
      Pharmacist: Put a thin layer on the rash twice a day, but not on your face, and not for more than a week.
      You: OK, twice a day, not on my face. Are there any side effects with the tablets?
      Pharmacist: They can make some people a bit sleepy, so don't drive if they do. And if your lips or face start to swell, call 999 straight away.
      You: I see. Thank you very much. Could I have a receipt, please? It's for my insurance.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-две фразы
      - "Симптом — I've got a rash on…; как давно — since + время (не from four o'clock)"
      - "Переспросили дозировку — Sorry, how often should I use…? — и повторили ответ"
      - "Вопрос о побочных эффектах — Are there any side effects?"
      - "В конце — спасибо и просьба о чеке: Could I have a receipt, please?"
  - type: reading
    id: leaflet
    title: Сцена 5 · Инструкция к таблеткам
    text: |-
      CETIRIZINE 10 MG TABLETS — antihistamine
      For hay fever, itchy skin rashes and other allergies.

      HOW TO TAKE: adults and children over 12 — one tablet once a day. Do not take more than one tablet in 24 hours. Swallow the tablet whole with a glass of water. You can take it with or without food.

      BEFORE YOU TAKE IT: talk to your pharmacist or doctor if you are pregnant or breastfeeding, or if you have kidney problems.

      WHILE YOU TAKE IT: some people feel drowsy. If this happens, do not drive or use machines. Avoid alcohol.

      POSSIBLE SIDE EFFECTS: tiredness, a dry mouth, a headache. These are usually mild.

      GET HELP: stop taking the tablets and call 999 or go to A&E straight away if your face, lips or tongue start to swell, or if you find it hard to breathe.

      If your rash is not better after 3 days, talk to a pharmacist or a doctor.
    glosses:
      - { text: hay fever, russian: аллергия на пыльцу }
      - { text: itchy, russian: зудящий }
      - { text: Swallow, russian: проглотите }
      - { text: whole, russian: целиком }
      - { text: pregnant or breastfeeding, russian: беременны или кормите грудью }
      - { text: kidney, russian: почки }
      - { text: drowsy, russian: сонный }
      - { text: tongue, russian: язык }
