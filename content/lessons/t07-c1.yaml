  - type: explanation
    id: complaint-how
    title: Жалоба платформе бронирования
    body: |-
      Мастер на следующий день так и не пришёл, окно починили только утром 21 июня, а хост сказал, что цену сам изменить не может. После поездки напишите жалобу платформе, через которую бронировали квартиру. Схема — как у жалобы авиакомпании в модуле t07: **I am writing to complain about…** + где, даты, номер брони → что случилось, по порядку, в past simple и passive → что вы сделали и что ответил хост → чего вы хотите → **I look forward to hearing from you.**
  - type: writing
    id: complaint
    register: formal
    prompt: "Напишите жалобу платформе бронирования (80–100 слов). Квартира Оливера в Марчмонте, Эдинбург, 18–22 июня, номер брони HX52QT. Окно в спальне не закрывалось с первого дня; вы написали хосту в тот же день, он обещал мастера на следующий день, но никто не пришёл, и окно починили только 21 июня. Хост сказал, что цену изменить не может. Попросите вернуть деньги за три ночи."
    words: { min: 80, max: 100 }
    model: |-
      Dear Sir or Madam,
      I am writing to complain about my stay in Oliver's flat in Edinburgh from 18 to 22 June, booking reference HX52QT. When I arrived, the bedroom window would not close. I messaged the host that day, and he promised someone would come the next afternoon. However, nobody came, and the window was not repaired until 21 June. For three nights the room was cold and noisy. The host said he could not change the price. I would like a refund for three nights.
      I look forward to hearing from you.
      Yours faithfully,
      Olga Ivanova
    criteria:
      - 80–100 слов; есть место, даты, номер брони, что случилось и чего вы хотите
      - "Формально: Dear Sir or Madam, Yours faithfully, полные формы (I am, was not), без восклицаний"
      - "События по порядку — past simple и passive: I messaged, he promised, nobody came, was not repaired"
      - "Требование — спокойно: I would like a refund for…"
      - "В конце — I look forward to hearing from you и имя с фамилией"
  - type: exercise
    id: grammar
    graded: true
    title: Язык ступени
    instruction: Вставьте слово. Три слова лишние.
    format: gap
    bank: [has, any, wondering, enough, than, have, since, better, when, was, for, were, too]
    items:
      - id: g1
        prompt: "The Wi-Fi ___ stopped working, so I can't check my email."
        answer: has
        explanation: "Сломалось и не работает сейчас — present perfect: has stopped (модуль t03)."
      - id: g2
        prompt: "I was ___ if I could leave my case here until three."
        answer: wondering
        explanation: "I was wondering if… — мягкая просьба (модуль t03)."
      - id: g3
        prompt: "Sorry, this soup isn't hot ___. Could you warm it up?"
        answer: enough
        explanation: "Недостаточно — not + прилагательное + enough: not hot enough; too — «слишком», too hot (модуль t04)."
      - id: g4
        prompt: "The bus is cheaper ___ the tram, but it's a bit slower."
        answer: than
        explanation: "Сравнение — cheaper than: после сравнительной степени всегда than (модуль t05)."
      - id: g5
        prompt: "You don't ___ to print your ticket — you can show it on your phone."
        answer: have
        explanation: "Don't have to — «не обязательно»; после don't — have без -s (модуль t05)."
      - id: g6
        prompt: "I've had this rash ___ four o'clock."
        answer: since
        explanation: "С момента — since four o'clock; for — про срок: for two hours (модуль t06)."
      - id: g7
        prompt: "You'd ___ see a doctor if it gets worse."
        answer: better
        explanation: "You'd better + глагол без to — настойчивый совет (модуль t06)."
      - id: g8
        prompt: "I was walking to the bus stop ___ it started to rain."
        answer: when
        explanation: "Фон — past continuous (I was walking), событие — past simple, связка when (модуль t07)."
      - id: g9
        prompt: "Our flight ___ cancelled because of the storm."
        answer: was
        explanation: "Один рейс — was + cancelled; несколько — were cancelled (модуль t07)."
      - id: g10
        prompt: "Are there ___ side effects?"
        answer: any
        explanation: "В вопросе — any: Are there any side effects? (модули t03 и t06)."
