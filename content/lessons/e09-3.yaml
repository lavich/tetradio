blocks:
  - type: explanation
    id: scheme
    title: Ответ на поведенческий вопрос в шести шагах
    body: |-
      На поведенческий вопрос отвечают по схеме STAR и укладываются примерно в две минуты. Рассказ идёт по шагам, и на каждом хватает одной-трёх фраз.

      **1. Вступление.** Скажите, что приведёте пример: **Let me give you an example.** Если случай связан с конкретной темой, назовите её: **I'd like to share a time when we faced a tight deadline.**

      **2. Ситуация.** Назовите место и время и опишите обстановку одним-двумя предложениями: **At my previous company, we had a very tight deadline. This was in the spring of last year.** Для фона подходит past continuous, для предыстории — past perfect.

      **3. Задача.** Скажите, за что отвечали вы: **My task was to get the release out on time. I had to coordinate the work across both teams.**

      **4. Действия.** Это самая длинная часть, примерно половина ответа. Описывайте шаги по порядку и говорите **I**: **The first thing I did was talk to everyone involved. Then I decided to split the work into smaller tasks.**

      **5. Результат.** Назовите итог одной фразой, с числом или фактом, и скажите, что вы вынесли. Числа задачи и срока допустимы, выручка, потери и объёмы компании не называются: **As a result, we shipped on time. What I learned from it is to raise problems early.** Результат команды передаёт **we**.

      **6. Завершение.** Предложите продолжить, если интервьюеру нужно больше: **I have another example if that would help. I can give you more background on the team if you like.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - вступление
          - 5 секунд
          - Let me give you an example.
        - - ситуация и задача
          - 25–30 секунд
          - At my previous company, we had a very tight deadline. My task was to…
        - - действия
          - 60 секунд
          - The first thing I did was… I decided to…
        - - результат и вывод
          - 25–30 секунд
          - As a result, we shipped on time. What I learned from it is…
        - - завершение
          - 5 секунд
          - I have another example if that would help.
  - type: explanation
    id: safe-story
    title: Что оставить за скобками
    body: |-
      Пример для собеседования описывает работу в общих чертах. В нём нет названий клиентов и прежних работодателей, внутренних цифр и сведений, которые вы обязались не раскрывать. Интервьюеру достаточно размера задачи и результата: **a large retail client**, **a team of six**, **three weeks to one**.

      Вместо людей в рассказе действуют процессы: **Nobody owned the problem** вместо обвинения в адрес руководителя или коллеги. Свою долю ответственности называйте прямо, а решения команды приписывайте **we**.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - название клиента
          - a large retail client
          - название принадлежит клиенту
        - - внутренняя цифра выручки или потерь
          - it affected a large part of our users
          - цифры компании не раскрывают
        - - «my manager ignored the problem»
          - nobody owned the problem
          - говорят о процессе
        - - «I did everything myself»
          - I led the plan, and the team built it
          - вклад команды виден в рассказе
