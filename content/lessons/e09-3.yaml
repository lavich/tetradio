  - type: writing
    id: story
    register: formal
    prompt: "Подготовьте письменную версию истории по схеме STAR для собеседования (80–120 слов): ситуация, задача, действия, результат и вывод. Опишите работу в общих чертах, без названий клиентов и внутренних цифр."
    words: { min: 80, max: 120 }
    model: |-
      Last spring, my team was preparing a release when a large client asked for an extra feature. We had already planned the work for the whole sprint, and nobody was sure who should decide. My task was to keep the release on schedule and to coordinate the work with the product team. I talked to everyone involved, and I asked the product owner to rank the requests. Then I split the new feature into two parts and offered to take the smaller one. As a result, we shipped the main release on time, and the client received the extra feature two weeks later. What I learned from it is to ask about priorities early.
    criteria:
      - 80–120 слов, есть все четыре части STAR
      - Ситуация описана в past continuous или past perfect, действия — в past simple
      - Свои действия названы с I, результат команды — с we
      - Нет названий клиентов, внутренних цифр и обвинений коллег
      - Формальный стиль без сокращений
      - В конце есть вывод
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Девятый ответ вашего **банка ответов** — вопрос о трудности: **Tell me about a time you faced a challenge.** К нему добавляется уточнение интервьюера: **What was your role in it?** Первый ответ занимает до двух минут, второй — до 30 секунд.

      1) Выберите один случай и разложите его по частям STAR: две-три фразы на ситуацию и задачу, четыре-пять на действия, две на результат. 2) Запишите ответ вслух и уложитесь в время. 3) Переслушайте и сверьте с образцом и критериями: порядок частей, время глаголов, местоимения I и we. 4) Для второго вопроса назовите свою роль и вклад команды, не пересказывая всю историю.

      Сцена в конце урока повторяет начало интервью. Реплики интервьюера записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: challenge
    part: interview
    prompt: "Интервьюер спрашивает: «Tell me about a time you faced a challenge.» Ответьте за 120 секунд по схеме STAR: ситуация, задача, действия, результат и вывод."
    seconds: 120
    model: "Let me give you an example. At my previous company, I was working on a reporting feature when the requirements changed twice in one week. The situation was that the product owner and the customer's team wanted different things, and the deadline was close. My task was to deliver the feature on time. The first thing I did was talk to both sides, and I wrote a one-page summary of what each of them needed. Then I took the initiative and set up a short call to agree on the scope. I explained the trade-offs, and I suggested a smaller first version, so both sides could compromise. I also kept the team in the loop, because they had already started the work. In the end, both sides agreed on a plan. As a result, we shipped on time, and the customer asked for the rest in the next release. What I learned from it is to confirm requirements in writing. Since then, I have done that at the start of every project."
    criteria:
      - Есть все четыре части STAR в правильном порядке
      - Фон и предыстория переданы в past continuous или past perfect
      - Свои действия названы с I, результат команды — с we
      - Использованы не меньше трёх фраз урока
      - В конце есть вывод
      - Нет названий клиентов и внутренних цифр
      - Ответ укладывается в 120 секунд
  - type: speaking
    id: role
    part: monologue
    prompt: "Интервьюер уточняет: «What was your role in it?» Ответьте за 30 секунд: ваш вклад и то, что сделала команда."
    seconds: 30
    model: "My role was to coordinate the work between the two sides. I did not write all the code myself. I wrote the summary, set up the call and tracked the open questions, and two colleagues built the feature. I was responsible for keeping everyone informed."
    criteria:
      - Назван собственный вклад с I
      - Названо, что сделали коллеги
      - Нет пересказа всей истории
      - Ответ укладывается в 30 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
    transcript:
      - { speaker: Ingrid, text: "Thanks for joining. Let's start with a behavioral question. Tell me about a time you faced a challenge at work.", audio: e09-3/scene-lines-1.mp3 }
      - { speaker: Ingrid, text: "Mm-hm. What was your role in it?", audio: e09-3/scene-lines-2.mp3 }
      - { speaker: Ingrid, text: "I see. How did it end, and what did you learn from it?", audio: e09-3/scene-lines-3.mp3 }
      - { speaker: Ingrid, text: "Thank you. That was a clear example.", audio: e09-3/scene-lines-4.mp3 }
  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании, вопросы задаёт Ingrid, руководитель разработки. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику расскажите о ситуации и задаче. На вторую назовите свою роль и действия. На третью скажите, чем всё закончилось и что вы вынесли. На последнюю поблагодарите и предложите второй пример. Вся ваша часть — 120 секунд, каждая реплика — две-четыре фразы.
    seconds: 120
    model: |-
      Ingrid: Thanks for joining. Let's start with a behavioral question. Tell me about a time you faced a challenge at work.
      You: Let me give you an example. At my previous company, we were running two releases when the schedule changed, and two teams needed the same engineer. My task was to get the release out on time.
      Ingrid: Mm-hm. What was your role in it?
      You: I had to coordinate the work across both teams. The first thing I did was talk to everyone involved. Then I wrote a short plan and set up a daily call so that nobody was out of sync.
      Ingrid: I see. How did it end, and what did you learn from it?
      You: As a result, we shipped on time. What I learned from it is to raise problems early. Since then, we have used the same process for every release.
      Ingrid: Thank you. That was a clear example.
      You: Thank you. I have another example if that would help.
    criteria:
      - Ответили на все четыре реплики по порядку, каждая — две-четыре фразы
      - Ситуация и задача названы в первой реплике
      - Роль названа с I, действия идут по порядку
      - Результат и вывод названы в третьей реплике
      - В конце есть благодарность и предложение второго примера
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "Could you tell me where the interview ___?"
        options: [is, is it, does it be]
        answer: is
        explanation: В косвенном вопросе порядок слов как в утверждении.
      - id: q2
        prompt: "The offer letter ___ to every candidate by the HR team. (отправляется)"
        options: [is sent, sends, is sending]
        answer: is sent
        explanation: Действие совершается над письмом, поэтому нужен passive.
      - id: q3
        prompt: "I ___ in this role for two years. (до сих пор)"
        options: [have been, am, was]
        answer: have been
        explanation: Срок for two years и связь с настоящим — present perfect.
      - id: q4
        prompt: "Our new service is ___ than the old one. (быстрее)"
        options: [faster, more fast, fastest]
        answer: faster
        explanation: Односложное прилагательное образует сравнительную степень с -er.
      - id: q5
        prompt: "You ___ read the offer letter carefully before you sign. (совет)"
        options: [should, to should, would to]
        answer: should
        explanation: Совет выражается глаголом should; после него нет to.
      - id: q6
        prompt: "I ___ a course on distributed systems in October. (договорённость)"
        options: [am starting, might to start, will to start]
        answer: am starting
        explanation: План с датой — present continuous.
