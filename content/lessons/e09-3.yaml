  - type: exercise
    id: good-structure
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: "Вы начинаете ответ на вопрос «Tell me about a time you faced a challenge». Какая фраза подходит?"
        options:
          - Let me give you an example.
          - As a result, we shipped on time.
          - Since then, we've used the same process for every release.
        answer: Let me give you an example.
        explanation: Рассказ открывает фраза-вступление.
      - id: q2
        prompt: Вы называете свою задачу в рассказе. Какая фраза подходит?
        options:
          - My task was to get the release out on time.
          - It turned out better than we expected.
          - This was in the spring of last year.
        answer: My task was to get the release out on time.
        explanation: Часть Task начинается словами My task was…
      - id: q3
        prompt: Вы заканчиваете историю выводом. Какая фраза подходит?
        options:
          - What I learned from it is to raise problems early.
          - I stepped in and offered to take the hardest part.
          - At my previous company, we had a very tight deadline.
        answer: What I learned from it is to raise problems early.
        explanation: Вывод из случая вводит фраза What I learned from it is…
      - id: q4
        prompt: Вы хотите предложить второй пример из другого проекта. Какая фраза подходит?
        options:
          - I have another example if that would help.
          - I decided to split the work into smaller tasks.
          - I can give you more background on the team if you like.
        answer: I have another example if that would help.
        explanation: Второй пример предлагает фраза I have another example…
      - id: q5
        prompt: Вы хотите предложить рассказать подробнее о команде. Какая фраза подходит?
        options:
          - I can give you more background on the team if you like.
          - I have another example if that would help.
          - This was in the spring of last year.
        answer: I can give you more background on the team if you like.
        explanation: Предложение рассказать больше о команде — I can give you more background…
