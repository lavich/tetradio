blocks:
  - type: explanation
    id: sports
    title: Спорт — παίζω и κάνω
    body: |-
      **Ο αθλητισμός** — спорт вообще: Ο αθλητισμός είναι καλός για την υγεία. Отдельный вид спорта — **το άθλημα** (мн. ч. τα αθλήματα): Ποιο είναι το αγαπημένο σου άθλημα; — «Какой твой любимый вид спорта?».

      В игры **играют** — **παίζω**, и название игры идёт без артикля и без предлога (по-русски «в теннис», по-гречески просто τένις): **Παίζω ποδόσφαιρο**, **Παίζει μπάσκετ**, **Παίζουμε τένις δύο φορές την εβδομάδα**. Слова το μπάσκετ и το τένις не изменяются. Аорист — **έπαιξα**: Χθες έπαιξα τένις.

      Остальным спортом **занимаются** — **κάνω**: κάνω κολύμπι, κάνω τρέξιμο, κάνω γυμναστική (модуль 17). **Η κολύμβηση** — плавание как вид спорта (так пишут в расписаниях и объявлениях), в разговоре говорят **το κολύμπι**; глагол — κολυμπάω (модуль 14). **Το τρέξιμο** — бег. В спортзал ходят: **Πάω στο γυμναστήριο κάθε πρωί.**

      **Η ομάδα** — команда, в ней играют **οι παίκτες** (ο παίκτης, η παίκτρια). **Ο αγώνας** — матч, соревнование (мн. ч. οι αγώνες, вин. п. τον αγώνα), а проходит он **στο γήπεδο** — на стадионе или площадке.

      Болеть за команду — **υποστηρίζω** + винительный падеж: **Ποια ομάδα υποστηρίζεις;** — Υποστηρίζω **τον Ποσειδώνα** (придуманная команда: ο Ποσειδώνας → τον Ποσειδώνα, как ο αγώνας → τον αγώνα).

      Два знакомых глагола получают новое значение. **Κερδίζω** (модуль 15 — «зарабатываю») — ещё и «выигрываю»: **Ποιος κέρδισε;** — «Кто выиграл?». **Χάνω** (модуль 13 — «теряю, опаздываю») — ещё и «проигрываю»: **Η ομάδα μας έχασε χθες.**
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - παίζω ποδόσφαιρο / μπάσκετ / τένις
          - играю в футбол / баскетбол / теннис
        - - κάνω κολύμπι / τρέξιμο / γυμναστική
          - занимаюсь плаванием / бегом / физкультурой
        - - πάω στο γυμναστήριο
          - хожу в спортзал
        - - υποστηρίζω τον Ποσειδώνα
          - болею за «Посейдон»
        - - Ποιος κέρδισε;
          - Кто выиграл?
        - - Η ομάδα μας έχασε.
          - Наша команда проиграла.
