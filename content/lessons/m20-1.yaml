  - type: exercise
    id: sports-gap
    title: Матч и команда
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - παίζει
      - παίζω
      - υποστηρίζεις
      - κέρδισε
      - έχασε
      - παίκτης
      - γήπεδο
      - γυμναστήριο
      - μπάσκετ
    items:
      - id: g1
        prompt: Ο Άρης ___ τένις κάθε Σάββατο.
        answer: παίζει
        explanation: Ο Άρης — «он», поэтому παίζει; τένις — без артикля.
      - id: g2
        prompt: — Ποια ομάδα ___; — Τον Ποσειδώνα!
        answer: υποστηρίζεις
        explanation: Ответ в винительном падеже (τον Ποσειδώνα) — после υποστηρίζω.
      - id: g3
        prompt: Η ομάδα μας ___ χθες και τώρα είμαστε πρώτοι!
        answer: κέρδισε
        explanation: Теперь мы первые — значит, команда выиграла.
      - id: g4
        prompt: Δεν ήταν καλή μέρα — η ομάδα μας ___ τρία μηδέν.
        answer: έχασε
      - id: g5
        prompt: Ο Μάριος είναι ο καλύτερος ___ της ομάδας.
        answer: παίκτης
      - id: g6
        prompt: Το Σάββατο πάμε στο ___ να δούμε τον αγώνα.
        answer: γήπεδο
        explanation: Матч смотрят на стадионе — στο γήπεδο.
      - id: g7
        prompt: Ο γιος μου είναι πολύ ψηλός και παίζει ___ στο σχολείο.
        answer: μπάσκετ
  - type: explanation
    id: comparative
    title: Πιο … από — «более …, чем»
    body: |-
      Чтобы сказать «выше», «дороже», «интереснее», перед прилагательным ставят **πιο** — «более»: ψηλός → **πιο ψηλός**. Прилагательное согласуется с тем, о ком или о чём говорят, как обычно (модуль 07): Ο Νίκος είναι πιο ψηλ**ός**. Η Μαρία είναι πιο ψηλ**ή**. Τα ελληνικά είναι πιο δύσκολ**α**.

      «Чем» — **από** + **винительный падеж**, как после любого предлога (модуль 08): πιο ψηλή από **τον Νίκο**, από **τη Μαρία**, από **το λεωφορείο**, από **τους φίλους μου**. Частая ошибка — оставить второе слово в именительном: «από ο Νίκος» — неправильно. С местоимениями говорят **από μένα** — «чем я», **από σένα** — «чем ты».

      **Πιο** ставят и перед наречиями — вы уже знаете Πιο αργά, παρακαλώ (модуль 02) и Το έχετε σε πιο μεγάλο νούμερο; (модуль 11). Так же πιο συχνά — «чаще», πιο νωρίς — «раньше».

      У некоторых прилагательных есть и форма одним словом: **μεγαλύτερος** = πιο μεγάλος — «больше, старше», **μικρότερος** = πιο μικρός — «меньше, младше» (ο μεγαλύτερος αδελφός μου — мой старший брат). Их достаточно узнавать: форма с πιο всегда правильна.
    table:
      columns:
        - прилагательное
        - «более …»
        - пример
      rows:
        - - ψηλός
          - πιο ψηλός, πιο ψηλή, πιο ψηλό
          - Η Μαρία είναι πιο ψηλή από τον Νίκο.
        - - ακριβός
          - πιο ακριβός, πιο ακριβή, πιο ακριβό
          - Το ταξί είναι πιο ακριβό από το λεωφορείο.
        - - ενδιαφέρων
          - πιο ενδιαφέρων, πιο ενδιαφέρουσα, πιο ενδιαφέρον
          - Το τένις είναι πιο ενδιαφέρον από το ποδόσφαιρο.
        - - δύσκολος
          - πιο δύσκολος, πιο δύσκολη, πιο δύσκολο
          - Τα ελληνικά είναι πιο δύσκολα από τα αγγλικά.
  - type: exercise
    id: comp-choice
    title: Πιο … από
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Η Μαρία είναι πιο ___ από τον αδελφό της.
        options:
          - ψηλός
          - ψηλή
          - ψηλό
        answer: ψηλή
        explanation: Речь о Марии — женский род, πιο ψηλή.
      - id: q2
        prompt: Το τένις είναι πιο ___ από το ποδόσφαιρο.
        options:
          - ενδιαφέρων
          - ενδιαφέρουσα
          - ενδιαφέρον
        answer: ενδιαφέρον
        explanation: Το τένις — средний род, ενδιαφέρον (модуль 15).
      - id: q3
        prompt: Το ταξί είναι πιο ακριβό ___ λεωφορείο.
        options:
          - από τον
          - από την
          - από το
        answer: από το
        explanation: Το λεωφορείο — средний род, από το λεωφορείο.
      - id: q4
        prompt: Ο Νίκος είναι πιο μικρός από ___.
        options:
          - η Ελένη
          - την Ελένη
          - της Ελένης
        answer: την Ελένη
        explanation: После από — винительный падеж. Перед гласной ν остаётся — την Ελένη.
      - id: q5
        prompt: Αυτά τα παπούτσια είναι πιο ___ από τα άλλα.
        options:
          - άνετος
          - άνετες
          - άνετα
        answer: άνετα
        explanation: Τα παπούτσια — средний род, мн. ч.
      - id: q6
        prompt: Οι φίλες μου είναι πιο ___ από μένα.
        options:
          - ψηλοί
          - ψηλές
          - ψηλά
        answer: ψηλές
        explanation: Οι φίλες — женский род, мн. ч.
      - id: q7
        prompt: Ο Γιώργος είναι πιο ψηλός από ___.
        options:
          - ο Πέτρος
          - τον Πέτρο
          - του Πέτρου
        answer: τον Πέτρο
      - id: q8
        prompt: Το λεωφορείο είναι πιο φτηνό ___ το ταξί.
        options:
          - από
          - όσο
          - πιο
        answer: από
  - type: explanation
    id: irregular
    title: Καλύτερος, χειρότερος, περισσότερο, λιγότερο
    body: |-
      Два самых частых прилагательных сравниваются по-особому. **Καλός** → **καλύτερος** — «лучше», **κακός** → **χειρότερος** — «хуже». Они изменяются, как καλός: καλύτερος, καλύτερη, καλύτερο; мн. ч. καλύτεροι, καλύτερες, καλύτερα. **Αυτό το γυμναστήριο είναι καλύτερο από το άλλο.**

      Καλύτερος уже значит «лучше», поэтому **πιο καλύτερος** — ошибка. А πιο καλός тоже правильно и значит то же самое, что καλύτερος.

      Если «лучше» относится к глаголу — это наречие **καλύτερα**, «хуже» — **χειρότερα**: Ο Άρης παίζει τένις **καλύτερα** από μένα. Вы знаете фразу **Είμαι καλύτερα τώρα** — «Мне уже лучше» (модуль 17).

      «Больше» и «меньше» при глаголе — **περισσότερο** и **λιγότερο** (от πολύ и λίγο; можно сказать и πιο πολύ, πιο λίγο): **Μου αρέσει περισσότερο το τένις.** Δουλεύω **λιγότερο** από τον άντρα μου.
    table:
      columns:
        - обычная форма
        - «более»
        - пример
      rows:
        - - καλός — хороший
          - καλύτερος, -η, -ο — лучше
          - Η ομάδα μας είναι καλύτερη.
        - - κακός — плохой
          - χειρότερος, -η, -ο — хуже
          - Ο καιρός είναι χειρότερος σήμερα.
        - - καλά — хорошо
          - καλύτερα — лучше
          - Παίζεις καλύτερα από μένα.
        - - πολύ — много
          - περισσότερο — больше
          - Μου αρέσει περισσότερο το μπάσκετ.
        - - λίγο — мало
          - λιγότερο — меньше
          - Διαβάζω λιγότερο από σένα.
  - type: exercise
    id: irregular-choice
    title: Лучше, хуже, больше, меньше
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Αυτό το γήπεδο είναι ___ από το παλιό. (лучше)
        options:
          - καλύτερο
          - καλύτερος
          - πιο καλύτερο
        answer: καλύτερο
        explanation: Το γήπεδο — средний род. «Πιο καλύτερο» — ошибка, καλύτερο уже значит «лучше».
      - id: q2
        prompt: Το φαγητό σε αυτή την ταβέρνα είναι ___ από το φαγητό στο σπίτι. (хуже)
        options:
          - χειρότερος
          - χειρότερη
          - χειρότερο
        answer: χειρότερο
      - id: q3
        prompt: Είμαι ___ τώρα, ευχαριστώ. (Мне уже лучше.)
        options:
          - καλύτερα
          - καλύτερος
          - πιο καλύτερα
        answer: καλύτερα
        explanation: О самочувствии — наречие καλύτερα, как во фразе Είμαι καλύτερα τώρα.
      - id: q4
        prompt: Μου αρέσει ___ το τένις από το ποδόσφαιρο. (больше)
        options:
          - περισσότερο
          - πιο
          - καλύτερος
        answer: περισσότερο
        explanation: Πιο не стоит одно — нужно πιο πολύ или περισσότερο.
      - id: q5
        prompt: Ο Γιάννης παίζει τένις ___ από μένα. (хуже)
        options:
          - χειρότερα
          - χειρότερος
          - πιο κακός
        answer: χειρότερα
        explanation: «Хуже» относится к глаголу παίζει — нужно наречие χειρότερα.
      - id: q6
        prompt: Δουλεύω ___ από τον άντρα μου — μόνο τέσσερις ώρες τη μέρα. (меньше)
        options:
          - λιγότερο
          - περισσότερο
          - λιγότερος
        answer: λιγότερο
  - type: explanation
    id: superlative
    title: Ο πιο …, ο καλύτερος и τόσο … όσο
    body: |-
      **Самый.** Перед сравнительной формой ставят артикль: **ο πιο ψηλός** — «самый высокий», **η πιο ακριβή** — «самая дорогая», **ο καλύτερος** — «самый лучший», **ο χειρότερος** — «самый плохой». Артикль согласуется с существительным: **η πιο ενδιαφέρουσα** ομάδα, **το καλύτερο** άθλημα.

      Без артикля получится просто «выше, лучше»: Ο Νίκος είναι πιο ψηλός — «Никос выше»; Ο Νίκος είναι **ο** πιο ψηλός — «Никос самый высокий».

      «Самый … из всех» — **από όλους** (από όλες, από όλα): Ο Νίκος είναι ο πιο ψηλός από όλους. «Самый … в команде» — **της ομάδας** (это родительный падеж — запомните как готовое выражение): **Είναι ο καλύτερος παίκτης της ομάδας.** Можно и с σε: ο καλύτερος παίκτης στην ομάδα.

      **Τόσο … όσο** — «такой же …, как»: **Το κολύμπι είναι τόσο καλό όσο το τρέξιμο.** — «Плавание так же хорошо, как бег». С отрицанием — «не такой …, как»: Το τένις **δεν** είναι **τόσο** ακριβό **όσο** το γυμναστήριο.

      Внимание к падежу: после από — винительный, а после όσο слово стоит в том же падеже, что и первое, обычно в именительном: πιο ψηλός **από τον** Νίκο, но τόσο ψηλός **όσο ο** Νίκος. С местоимением так же: πιο ψηλός **από σένα**, но τόσο ψηλός **όσο εσύ**.
    table:
      columns:
        - что сказать
        - по-гречески
      rows:
        - - выше, чем Никос
          - πιο ψηλός από τον Νίκο
        - - самый высокий
          - ο πιο ψηλός
        - - самый лучший игрок команды
          - ο καλύτερος παίκτης της ομάδας
        - - такой же высокий, как Никос
          - τόσο ψηλός όσο ο Νίκος
        - - не такой дорогой, как…
          - δεν είναι τόσο ακριβός όσο…
  - type: exercise
    id: superlative-choice
    title: Самый и такой же
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Ο Άρης είναι ___ παίκτης της ομάδας. (самый высокий)
        options:
          - ο πιο ψηλός
          - πιο ψηλός
          - ο πιο ψηλή
        answer: ο πιο ψηλός
        explanation: «Самый» — с артиклем; ο παίκτης — мужской род.
      - id: q2
        prompt: Για μένα, το ποδόσφαιρο είναι ___ άθλημα. (самый лучший)
        options:
          - το καλύτερο
          - το πιο καλύτερο
          - καλύτερο
        answer: το καλύτερο
      - id: q3
        prompt: Το κολύμπι είναι τόσο καλό ___ το τρέξιμο.
        options:
          - όσο
          - από
          - πιο
        answer: όσο
        explanation: Τόσο … όσο — пара, как русское «так же …, как».
      - id: q4
        prompt: Ο Νίκος είναι τόσο ψηλός όσο ___.
        options:
          - ο αδελφός του
          - τον αδελφό του
        answer: ο αδελφός του
        explanation: После όσο — тот же падеж, что у Ο Νίκος, то есть именительный. Сравните — πιο ψηλός από τον αδελφό του.
      - id: q5
        prompt: Η Άννα είναι ___ μαθήτρια στην τάξη. (самая младшая)
        options:
          - η πιο μικρή
          - πιο μικρή
          - ο πιο μικρός
        answer: η πιο μικρή
      - id: q6
        prompt: Το μπάσκετ είναι ___ ενδιαφέρον άθλημα για μένα. (самый интересный)
        options:
          - το πιο
          - ο πιο
          - πιο
        answer: το πιο
        explanation: Το άθλημα — средний род, поэтому το πιο ενδιαφέρον. Без артикля было бы «более интересный».
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Теннис интереснее футбола.
        answer:
          - Το τένις είναι πιο ενδιαφέρον από το ποδόσφαιρο.
      - id: q2
        prompt: Мария выше Никоса.
        answer:
          - Η Μαρία είναι πιο ψηλή από τον Νίκο.
          - Η Μαρία είναι ψηλότερη από τον Νίκο.
          - Η Μαρία είναι πιο ψηλή από το Νίκο.
          - Η Μαρία είναι ψηλότερη από το Νίκο.
        explanation: "После από — винительный падеж: τον Νίκο."
      - id: q3
        prompt: Он лучший игрок команды.
        answer:
          - Είναι ο καλύτερος παίκτης της ομάδας.
          - Αυτός είναι ο καλύτερος παίκτης της ομάδας.
          - Είναι ο καλύτερος παίκτης στην ομάδα.
          - Αυτός είναι ο καλύτερος παίκτης στην ομάδα.
          - Είναι ο πιο καλός παίκτης της ομάδας.
          - Είναι ο πιο καλός παίκτης στην ομάδα.
