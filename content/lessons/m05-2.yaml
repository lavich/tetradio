  - type: explanation
    id: linking
    title: Как рассказать о дне
    body: |-
      Чтобы рассказ был связным, нужны слова порядка и времени: **μετά** — «потом», **όταν** — «когда» (Όταν γυρίζω σπίτι, διαβάζω), **πάλι** — «снова», **μαζί** — «вместе» (**μαζί με** τη φίλη μου — «вместе с подругой»).

      **Όταν** — не вопрос. Вопрос «когда?» — **πότε;** (модуль 04): Πότε γυρίζεις; — Γυρίζω όταν τελειώνω.

      **Πρέπει** — «надо, нужно» — не меняется. После него — **να** и глагол в обычной форме настоящего времени: **Πρέπει να** ξυπνάω νωρίς. — «Мне надо рано просыпаться». Πρέπει να ξυπνάς νωρίς. — «Тебе надо…». Меняется только второй глагол.

      **Ο χρόνος** — «время» (которого хватает или нет): Δεν έχω χρόνο. **Η ώρα** — «час, время по часам»: Τι ώρα είναι; **Ίδιος** — «тот же»: την ίδια ώρα — «в то же время». **Αργά** — «поздно» (и «медленно»: Πιο αργά, παρακαλώ).
    table:
      columns:
        - слово
        - значение
        - пример
      rows:
        - - μετά
          - потом
          - Σηκώνομαι. Μετά βγαίνω από το σπίτι.
        - - όταν
          - когда (не вопрос)
          - Όταν γυρίζω σπίτι, διαβάζω.
        - - μαζί
          - вместе
          - Κάνουμε βόλτα μαζί.
        - - πάλι
          - снова
          - Το βράδυ διαβάζω πάλι.
        - - πρέπει να
          - надо
          - Πρέπει να ξυπνάω νωρίς.
        - - η δουλειά
          - работа
          - Αρχίζω δουλειά στις εννέα.
        - - η βόλτα
          - прогулка
          - Το απόγευμα κάνω βόλτα.
        - - η νύχτα
          - ночь
          - Δουλεύει τη νύχτα. Καληνύχτα!
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: mai-gap
    title: Глаголы на -μαι
    instruction: Вставьте глагол. Подсказка — в скобках. Одна форма лишняя.
    format: gap
    bank:
      - σηκώνομαι
      - σηκώνεσαι
      - κοιμάμαι
      - κοιμάται
      - έρχεται
      - έρχονται
      - χρειάζομαι
    items:
      - id: g1
        prompt: Εγώ ___ στις επτά. (вставать)
        answer: σηκώνομαι
      - id: g2
        prompt: Τι ώρα ___ εσύ; (вставать)
        answer: σηκώνεσαι
        explanation: "«Ты» — окончание -σαι: σηκώνεσαι."
      - id: g3
        prompt: Ο Νίκος ___ στις έντεκα. (засыпать)
        answer: κοιμάται
        explanation: "«Он» — κοιμάται; κοιμάμαι — это «я»."
      - id: g4
        prompt: Η Μαρία ___ αύριο. (приходить)
        answer: έρχεται
      - id: g5
        prompt: Οι φίλοι μας ___ το Σάββατο. (приходить)
        answer: έρχονται
        explanation: "Друзья — «они»: έρχονται."
      - id: g6
        prompt: ___ πολύ καφέ το πρωί. (нуждаться; καφέ — кофе)
        answer: χρειάζομαι
  - type: exercise
    id: words-gap
    title: Слова урока
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - μετά
      - όταν
      - μαζί
      - χρόνο
      - ίδια
      - πρέπει
      - αργά
      - βόλτα
      - νωρίς
    items:
      - id: g1
        prompt: Σηκώνομαι στις επτά. ___ βγαίνω από το σπίτι.
        answer: μετά
      - id: g2
        prompt: Ακούω μουσική ___ διαβάζω. (μουσική — музыка)
        answer: όταν
        explanation: "Όταν — «когда» в середине предложения: «Я слушаю музыку, когда читаю»."
      - id: g3
        prompt: Η Άννα και η Όλγα κάνουν βόλτα ___.
        answer: μαζί
      - id: g4
        prompt: Συγγνώμη, δεν έχω ___ σήμερα.
        answer: χρόνο
        explanation: Δεν έχω χρόνο — «У меня нет времени». Ώρα здесь не подходит.
      - id: g5
        prompt: Ξυπνάμε κάθε μέρα την ___ ώρα.
        answer: ίδια
      - id: g6
        prompt: Ο Κώστας ___ να είναι στη δουλειά στις οκτώ.
        answer: πρέπει
      - id: g7
        prompt: Δεν κοιμάμαι νωρίς, κοιμάμαι ___.
        answer: αργά
      - id: g8
        prompt: Το απόγευμα κάνω ___ με τη φίλη μου.
        answer: βόλτα
        explanation: Κάνω βόλτα — «гуляю», дословно «делаю прогулку».
  - type: exercise
    id: phrases-match
    title: Фразы урока
    instruction: Соедините русскую фразу с греческой. Две греческие фразы лишние.
    format: match
    bank:
      - Τι κάνεις συνήθως το πρωί;
      - Αρχίζω δουλειά στις εννέα.
      - Βγαίνω από το σπίτι στις οκτώ.
      - Γυρίζω σπίτι στις έξι το απόγευμα.
      - Το απόγευμα κάνω βόλτα.
      - Τι ώρα ξυπνάς;
      - Το βράδυ βλέπω τηλεόραση.
    items:
      - id: m1
        prompt: Что ты обычно делаешь утром?
        answer: Τι κάνεις συνήθως το πρωί;
      - id: m2
        prompt: Я начинаю работу в девять.
        answer: Αρχίζω δουλειά στις εννέα.
      - id: m3
        prompt: Я выхожу из дома в восемь.
        answer: Βγαίνω από το σπίτι στις οκτώ.
      - id: m4
        prompt: Я возвращаюсь домой в шесть вечера.
        answer: Γυρίζω σπίτι στις έξι το απόγευμα.
        explanation: Шесть часов по-гречески — ещё απόγευμα (примерно 15–19 ч), а не βράδυ.
      - id: m5
        prompt: Днём я гуляю.
        answer: Το απόγευμα κάνω βόλτα.
  - type: reading
    id: stelios
    title: Η μέρα του Στέλιου
    text: |-
      Ο Στέλιος μένει στη Λεμεσό με τη γυναίκα του, την Άντρια, και τα δύο παιδιά τους. Είναι δάσκαλος.

      Κάθε μέρα ξυπνάει στις έξι και μισή, αλλά σηκώνεται στις επτά. Μετά βγαίνει από το σπίτι μαζί με τα παιδιά, γιατί πρέπει να είναι στο σχολείο στις οκτώ παρά τέταρτο. Τα μαθήματα αρχίζουν στις οκτώ και τελειώνουν στις δύο. Το απόγευμα ο Στέλιος γυρίζει σπίτι, διαβάζει και ακούει μουσική.

      Η Άντρια είναι γιατρός. Δεν ξυπνάει κάθε μέρα την ίδια ώρα και μερικές φορές δουλεύει τη νύχτα. Συχνά γυρίζει αργά. Αλλά όταν είναι ελεύθερη, κάνουν όλοι μαζί βόλτα στην παραλία.

      Το βράδυ βλέπουν τηλεόραση. Ο Στέλιος δεν κοιμάται ποτέ αργά: στις έντεκα λέει «Καληνύχτα!» και πάει για ύπνο. Την Κυριακή δεν ξυπνάνε νωρίς.
    glosses:
      - text: με τη γυναίκα του
        russian: со своей женой
      - text: τα δύο παιδιά τους
        russian: их двое детей
      - text: από το σπίτι
        russian: из дома
      - text: στο σχολείο
        russian: в школе
      - text: Τα μαθήματα
        russian: уроки
      - text: μουσική
        russian: музыку
      - text: ελεύθερη
        russian: свободна
      - text: όλοι
        russian: все
      - text: στην παραλία
        russian: по набережной, у моря
      - text: πάει για ύπνο
        russian: ложится спать
  - type: exercise
    id: stelios-tf
    about: stelios
    title: Верно или неверно
    instruction: Прочитайте текст. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Ο Στέλιος σηκώνεται στις έξι και μισή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: В шесть тридцать он просыпается (ξυπνάει), а встаёт (σηκώνεται) в семь.
      - id: q2
        prompt: Ο Στέλιος βγαίνει από το σπίτι με τα παιδιά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Βγαίνει από το σπίτι μαζί με τα παιδιά.
      - id: q3
        prompt: Τα μαθήματα τελειώνουν στις οκτώ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: В восемь уроки начинаются (αρχίζουν), заканчиваются — в два.
      - id: q4
        prompt: Η Άντρια ξυπνάει πάντα την ίδια ώρα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν ξυπνάει κάθε μέρα την ίδια ώρα — «просыпается не каждый день в одно и то же время».
      - id: q5
        prompt: Η Άντρια μερικές φορές δουλεύει τη νύχτα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Ο Στέλιος συνήθως κοιμάται αργά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν κοιμάται ποτέ αργά — «никогда не ложится поздно».
      - id: q7
        prompt: Την Κυριακή η οικογένεια ξυπνάει αργά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Δεν ξυπνάνε νωρίς — «не просыпаются рано», значит, просыпаются поздно. Такие перефразы на экзамене встречаются часто.
  - type: exercise
    id: stelios-choice
    about: stelios
    title: Выберите ответ
    instruction: Выберите правильный ответ по тексту.
    format: choice
    items:
      - id: q1
        prompt: Τι κάνει ο Στέλιος το απόγευμα;
        options:
          - Διαβάζει και ακούει μουσική.
          - Βλέπει τηλεόραση.
          - Δουλεύει τη νύχτα.
          - Πάει στο σχολείο.
        answer: Διαβάζει και ακούει μουσική.
      - id: q2
        prompt: Почему Стелиос выходит из дома рано?
        options:
          - Он должен быть в школе без четверти восемь.
          - Уроки начинаются в два.
          - Он гуляет с детьми.
          - Андрия работает ночью.
        answer: Он должен быть в школе без четверти восемь.
        explanation: Γιατί πρέπει να είναι στο σχολείο στις οκτώ παρά τέταρτο.
      - id: q3
        prompt: Когда вся семья гуляет вместе?
        options:
          - Когда Андрия свободна.
          - Каждое утро.
          - В воскресенье утром.
          - Поздно ночью.
        answer: Когда Андрия свободна.
        explanation: Όταν είναι ελεύθερη, κάνουν όλοι μαζί βόλτα — όταν здесь «когда».
  - type: explanation
    id: listen-how
    title: Монолог — верно или неверно
    body: |-
      На экзамене есть задание: один человек рассказывает о себе, а вы отмечаете, верны ли утверждения. Запись звучит два раза.

      Перед первым прослушиванием прочитайте утверждения и найдите в них ключевые слова: время, дни, наречия частоты. Ловушки обычно здесь: в записи «иногда» (μερικές φορές), а в утверждении «всегда» (πάντα); в записи «просыпается», а в утверждении «встаёт».
  - type: listening
    id: svetlana
    title: Η μέρα της Σβετλάνας
    plays: 2
    transcript:
      - speaker: Σβετλάνα
        text: Γεια σας! Με λένε Σβετλάνα. Είμαι από τη Ρωσία, αλλά τώρα μένω στη Λάρνακα με την οικογένειά μου.
      - speaker: Σβετλάνα
        text: Ο άντρας μου δουλεύει πολύ. Ξυπνάει πάντα στις έξι και βγαίνει από το σπίτι στις επτά.
      - speaker: Σβετλάνα
        text: Εγώ δεν ξυπνάω νωρίς. Συνήθως σηκώνομαι στις οκτώ. Κάθε πρωί διαβάζω ελληνικά, γιατί τώρα μένω στην Κύπρο.
      - speaker: Σβετλάνα
        text: Το απόγευμα κάνω βόλτα με τη φίλη μου την Ιρίνα. Μερικές φορές μιλάμε ελληνικά, αλλά συνήθως μιλάμε ρωσικά.
      - speaker: Σβετλάνα
        text: Ο άντρας μου γυρίζει σπίτι στις έξι. Το βράδυ βλέπουμε μαζί τηλεόραση. Το Σάββατο έρχονται οι φίλοι μας, ο Κώστας και η Μαρία.
      - speaker: Σβετλάνα
        text: Ο άντρας μου κοιμάται νωρίς, στις δέκα. Εγώ κοιμάμαι αργά, στις δώδεκα.
  - type: exercise
    id: svetlana-tf
    about: svetlana
    title: Верно или неверно
    instruction: Прослушайте монолог. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Σβετλάνα μένει στη Λάρνακα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Ο άντρας της ξυπνάει στις επτά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Он просыпается в шесть (στις έξι), а в семь выходит из дома.
      - id: q3
        prompt: Η Σβετλάνα σηκώνεται νωρίς.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Εγώ δεν ξυπνάω νωρίς. Συνήθως σηκώνομαι στις οκτώ.
      - id: q4
        prompt: Η Σβετλάνα μαθαίνει ελληνικά κάθε πρωί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Κάθε πρωί διαβάζω ελληνικά — в утверждении другое слово (μαθαίνει), но смысл тот же.
      - id: q5
        prompt: Η Σβετλάνα και η Ιρίνα μιλάνε πάντα ελληνικά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μερικές φορές μιλάμε ελληνικά, αλλά συνήθως μιλάμε ρωσικά — «иногда», а не «всегда».
      - id: q6
        prompt: Το βράδυ η Σβετλάνα και ο άντρας της βλέπουν τηλεόραση.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Ο άντρας της Σβετλάνας κοιμάται αργά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Муж засыпает рано, в десять; поздно, в двенадцать, — сама Светлана.
  - type: exercise
    id: svetlana-time
    about: svetlana
    title: Во сколько
    instruction: Запишите время цифрами, например 9.
    format: text
    items:
      - id: q1
        prompt: Во сколько встаёт Светлана?
        answer:
          - "8"
          - "8:00"
          - "08:00"
        explanation: Συνήθως σηκώνομαι στις οκτώ.
      - id: q2
        prompt: Во сколько муж Светланы возвращается домой?
        answer:
          - "6"
          - "6:00"
          - "06:00"
          - "18:00"
          - "18"
        explanation: Ο άντρας μου γυρίζει σπίτι στις έξι.
      - id: q3
        prompt: Во сколько засыпает Светлана?
        answer:
          - "12"
          - "12:00"
          - "24:00"
          - "0:00"
          - "00:00"
        explanation: Εγώ κοιμάμαι αργά, στις δώδεκα.
