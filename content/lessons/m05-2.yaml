blocks:
  - type: explanation
    id: mai-verbs
    title: Глаголы на -μαι
    body: |-
      Несколько частых глаголов в форме «я» кончаются на **-μαι**: **σηκώνομαι** — «вставать», **έρχομαι** — «приходить, приезжать», **κοιμάμαι** [кима́мэ] — «спать, засыпать», **χρειάζομαι** — «нуждаться». У них свои окончания. Систему разберём позже, а пока учите эти глаголы как слова — чаще всего нужны формы «я», «ты» и «он/она».

      Различайте: **ξυπνάω** — «просыпаюсь» (открыл глаза), **σηκώνομαι** — «встаю» (с кровати). Ξυπνάω στις έξι, αλλά σηκώνομαι στις επτά.

      **Χρειάζομαι** + что: Χρειάζομαι καφέ. — «Мне нужен кофе». Безлично — **χρειάζεται**: «нужно».

      Ещё два глагола — обычные, группы A: **βγαίνω** — «выходить» (βγαίνω **από** το σπίτι — «выхожу из дома») и **γυρίζω** — «возвращаться». Запомните: γυρίζω **σπίτι** — «возвращаюсь домой», без предлога. Το σπίτι — «дом»; это слово модуля 06, но во фразах оно нужно уже сейчас.
    table:
      columns:
        - лицо
        - σηκώνομαι
        - έρχομαι
        - κοιμάμαι
      rows:
        - - εγώ
          - σηκώνομαι
