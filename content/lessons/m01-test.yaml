title: Контрольная модуля 01
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 10–15 минут: чтение, аудирование, грамматика и слова. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Ошибки не страшны: пояснения после ответа подскажут, что повторить.
  - type: reading
    id: natasa
    title: Στο μάθημα
    text: |-
      Καλημέρα! Είμαι η Νατάσα. Είμαι από τη Ρωσία, από το Καζάν, αλλά τώρα είμαι στη Λευκωσία. Η φίλη μου η Χριστίνα είναι από τη Λευκωσία.

      Ο Γιάννης και ο Πάβελ είναι φίλοι μου. Ο Γιάννης είναι από την Ελλάδα και ο Πάβελ είναι από τη Μόσχα. Εμείς είμαστε τώρα στο μάθημα.

      Το τηλέφωνό μου: εννέα, έξι, ένα, οκτώ, τρία, τρία, μηδέν, επτά.
    glosses:
      - text: στο μάθημα
        russian: на уроке
      - text: από το Καζάν
        russian: из Казани
      - text: αλλά
        russian: но
      - text: στη Λευκωσία
        russian: в Никосии
      - text: φίλοι μου
        russian: мои друзья
      - text: Το τηλέφωνό μου
        russian: мой телефон
  - type: exercise
    id: natasa-tf
    about: natasa
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Νατάσα είναι από τη Ρωσία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Τώρα η Νατάσα είναι στο Καζάν.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Αλλά τώρα είμαι στη Λευκωσία — сейчас она в Никосии.
      - id: q3
        prompt: Η Χριστίνα είναι από την Κύπρο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Кристина из Никосии, а Никосия — столица Кипра.
      - id: q4
        prompt: Ο Πάβελ είναι από την Ελλάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Из Греции — Яннис, Павел — из Москвы.
      - id: q5
        prompt: Ο Γιάννης είναι φίλος της Νατάσας. (της Νατάσας — Наташи)
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ο Γιάννης και ο Πάβελ είναι φίλοι μου — говорит Наташа.
      - id: q6
        prompt: Телефон Наташи —
        options:
          - "96183307"
          - "96183370"
          - "69183307"
        answer: "96183307"
        explanation: εννέα 9, έξι 6, ένα 1, οκτώ 8, τρία 3, τρία 3, μηδέν 0, επτά 7.
  - type: listening
    id: school
    title: Στη σχολή
    plays: 2
    transcript:
      - speaker: Βαλεντίνα
        text: Καλημέρα σας!
      - speaker: Γιώργος
        text: Καλημέρα! Πώς σας λένε;
      - speaker: Βαλεντίνα
        text: Με λένε Βαλεντίνα.
      - speaker: Γιώργος
        text: Από πού είστε;
      - speaker: Βαλεντίνα
        text: Είμαι από τη Ρωσία
        από τη Μόσχα.: null
      - speaker: Γιώργος
        text: Και τώρα πού είστε; Στη Λάρνακα;
      - speaker: Βαλεντίνα
        text: Όχι
        τώρα είμαι στη Λεμεσό.: null
      - speaker: Γιώργος
        text: Το τηλέφωνό σας;
      - speaker: Βαλεντίνα
        text: Εννέα, επτά, πέντε, δύο, μηδέν, οκτώ, τέσσερα, ένα.
      - speaker: Γιώργος
        text: Ευχαριστώ πολύ! Γεια σας!
  - type: exercise
    id: school-choice
    about: school
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Από πού είναι η Βαλεντίνα;
        options:
          - Από τη Μόσχα.
          - Από τη Λάρνακα.
          - Από τη Λεμεσό.
        answer: Από τη Μόσχα.
      - id: q2
        prompt: Πού είναι τώρα η Βαλεντίνα;
        options:
          - Στη Λάρνακα.
          - Στη Λεμεσό.
          - Στη Μόσχα.
        answer: Στη Λεμεσό.
        explanation: "Στη Λάρνακα; — Όχι, τώρα είμαι στη Λεμεσό. Ловушка: Ларнаку называет Йоргос, а Валентина отвечает «нет»."
      - id: q3
        prompt: Как Йоргос и Валентина говорят друг с другом?
        options:
          - на «ты»
          - на «вы»
        answer: на «вы»
        explanation: Πώς σας λένε; Από πού είστε; Γεια σας! — вежливые формы.
      - id: q4
        prompt: Телефон Валентины —
        options:
          - "97520841"
          - "97520814"
          - "79520841"
        answer: "97520841"
        explanation: εννέα 9, επτά 7, πέντε 5, δύο 2, μηδέν 0, οκτώ 8, τέσσερα 4, ένα 1.
  - type: exercise
    id: grammar-gap
    graded: true
    title: Грамматика
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - είμαι
      - είσαι
      - είναι
      - είμαστε
      - είστε
      - Ποιος
      - Πού
    items:
      - id: g1
        prompt: Εγώ ___ από την Κύπρο.
        answer: είμαι
      - id: g2
        prompt: Εσύ ___ ο Νίκος;
        answer: είσαι
      - id: g3
        prompt: Εμείς ___ φίλοι.
        answer: είμαστε
      - id: g4
        prompt: Ο Γιάννης και η Άννα ___ από την Αθήνα.
        answer: είναι
        explanation: Двое — «они», форма είναι.
      - id: g5
        prompt: — ___ είναι αυτός; — Ο Πέτρος.
        answer: Ποιος
      - id: g6
        prompt: — ___ είστε τώρα; — Στην Πάφο.
        answer: Πού
        explanation: Ответ — место, поэтому вопрос «где?» — πού.
  - type: exercise
    id: vocab-choice
    graded: true
    title: Слова и фразы
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: — Τι κάνεις; —
        options:
          - Καλά, ευχαριστώ.
          - Με λένε Όλγα.
          - Είμαι από την Πάφο.
        answer: Καλά, ευχαριστώ.
      - id: q2
        prompt: — Χάρηκα πολύ! —
        options:
          - Επίσης!
          - Παρακαλώ!
          - Καλώς ήρθες!
        answer: Επίσης!
      - id: q3
        prompt: — Συγγνώμη! —
        options:
          - Δεν πειράζει.
          - Τα λέμε!
          - Επίσης.
        answer: Δεν πειράζει.
      - id: q4
        prompt: Вечером вы входите в кафе.
        options:
          - Καλησπέρα!
          - Καλημέρα!
          - Τα λέμε!
        answer: Καλησπέρα!
      - id: q5
        prompt: Вопрос «Είσαι από τη Ρωσία;» означает…
        options:
          - Ты из России?
          - Я из России.
          - Вы из России?
        answer: Ты из России?
        explanation: είσαι — «ты», знак «;» — вопрос.
      - id: q6
        prompt: Όχι значит…
        options:
          - нет
          - да
        answer: нет
        explanation: Όχι — «нет», ναι — «да».
      - id: q7
        prompt: Как спросить имя у незнакомого взрослого?
        options:
          - Πώς σας λένε;
          - Πώς σε λένε;
          - Από πού είστε;
        answer: Πώς σας λένε;
  - type: exercise
    id: reading-rules
    graded: true
    title: Чтение новых слов
    instruction: Эти слова вам не встречались. Как они читаются?
    format: choice
    items:
      - id: q1
        prompt: μπύρα (пиво)
        options:
          - "[мпи́ра]"
          - "[би́ра]"
          - "[пи́ра]"
        answer: "[би́ра]"
        explanation: μπ в начале слова — [б]; υ — [и].
      - id: q2
        prompt: αυτοκίνητο (машина)
        options:
          - "[аутоки́нито]"
          - "[автоки́нито]"
          - "[афтоки́нито]"
        answer: "[афтоки́нито]"
        explanation: После αυ стоит глухая τ, поэтому [аф].
      - id: q3
        prompt: Δήμητρα (имя)
        options:
          - "[ди́митра]"
          - "[ðи́митра]"
          - "[ðими́тра]"
        answer: "[ðи́митра]"
        explanation: δ — [ð], как th в английском this; ударение по тоносу — на первом слоге.
      - id: q4
        prompt: θάλασσα (море)
        options:
          - "[θа́ласа]"
          - "[θала́са]"
          - "[θаласа́]"
        answer: "[θа́ласа]"
        explanation: Тонос над первой α; σσ читается как одна [с].
  - type: exercise
    id: numbers-match
    graded: true
    title: Числа
    instruction: Соедините цифру и слово. Два слова лишние.
    format: match
    bank:
      - δύο
      - πέντε
      - έξι
      - οκτώ
      - δέκα
      - τρία
      - τέσσερα
    items:
      - id: m1
        prompt: "8"
        answer: οκτώ
      - id: m2
        prompt: "2"
        answer: δύο
      - id: m3
        prompt: "10"
        answer: δέκα
      - id: m4
        prompt: "6"
        answer: έξι
      - id: m5
        prompt: "4"
        answer: τέσσερα
