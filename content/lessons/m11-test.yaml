title: Контрольная модуля 11
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: sofia
    title: Στο μαγαζί
    text: |-
      Γεια σου, Κατερίνα!

      Είμαι στη Λευκωσία, σε ένα μαγαζί με ρούχα. Σήμερα έχει μεγάλες εκπτώσεις! Ψάχνω ρούχα για τη δουλειά. Βρίσκω ένα ωραίο σκούρο μπλε σακάκι — κοστίζει μόνο εξήντα ευρώ. Το δοκιμάζω στο δοκιμαστήριο, αλλά μου είναι λίγο φαρδύ. Η πωλήτρια φέρνει ένα πιο μικρό νούμερο, το τριάντα έξι, και είναι τέλειο!

      Υπάρχει και μια γκρι φούστα, αλλά είναι πολύ κοντή. Δεν μου αρέσουν οι κοντές φούστες. Παίρνω το σακάκι και ένα άσπρο πουκάμισο. Τα παπούτσια εδώ είναι πολύ ακριβά, γι' αυτό δεν παίρνω τίποτα άλλο.

      Αν το σακάκι δεν ταιριάζει με το μαύρο μου παντελόνι, η αλλαγή γίνεται μέσα σε δεκατέσσερις ημέρες. Έχω την απόδειξη!

      Τα λέμε αύριο,
      Σοφία
    glosses:
      - text: εκπτώσεις
        russian: скидки
      - text: πωλήτρια
        russian: продавщица
      - text: τέλειο
        russian: идеально
      - text: γι' αυτό
        russian: поэтому
  - type: exercise
    id: sofia-tf
    about: sofia
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Σοφία ψάχνει ρούχα για τη δουλειά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Το σακάκι είναι πολύ ακριβό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κοστίζει μόνο εξήντα ευρώ — «только шестьдесят», сегодня скидки. Дорогие здесь туфли.
      - id: q3
        prompt: Στο δοκιμαστήριο το σακάκι είναι στενό για τη Σοφία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μου είναι λίγο φαρδύ — пиджак ей великоват, а не тесен.
      - id: q4
        prompt: Η Σοφία παίρνει το σακάκι σε νούμερο τριάντα έξι.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Η Σοφία παίρνει την γκρι φούστα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Юбка слишком короткая, а короткие юбки Софии не нравятся.
      - id: q6
        prompt: Η Σοφία αγοράζει και παπούτσια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τα παπούτσια είναι πολύ ακριβά, γι' αυτό δεν παίρνω τίποτα άλλο.
      - id: q7
        prompt: Η Σοφία μπορεί να αλλάξει το σακάκι.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Обмен — в течение 14 дней, и чек у неё есть.
  - type: listening
    id: jacket
    title: Ποιο μπουφάν;
    plays: 2
    transcript:
      - speaker: Άρης
        text: Στέλλα, ποιο μπουφάν μου πάει; Το μαύρο ή το πράσινο;
      - speaker: Στέλλα
        text: Το πράσινο σου πάει πολύ! Αλλά είναι λίγο βαρύ, δεν είναι;
      - speaker: Άρης
        text: Ναι, είναι βαρύ. Το μαύρο είναι πιο ελαφρύ.
      - speaker: Στέλλα
        text: Και πόσο κάνουν;
      - speaker: Άρης
        text: Το πράσινο κοστίζει ογδόντα ευρώ και το μαύρο εξήντα.
      - speaker: Στέλλα
        text: Δοκιμάζεις και το μαύρο;
      - speaker: Άρης
        text: Εντάξει… Όχι, μου είναι στενό. Εδώ έχει ένα πιο μεγάλο νούμερο.
      - speaker: Στέλλα
        text: Και αυτό;
      - speaker: Άρης
        text: Αυτό είναι πολύ άνετο! Παίρνω το μαύρο.
      - speaker: Στέλλα
        text: Ωραία. Εγώ θέλω αυτές τις μπότες, αλλά είναι πολύ ακριβές.
      - speaker: Άρης
        text: Πόσο κάνουν;
      - speaker: Στέλλα
        text: Εκατόν είκοσι ευρώ, και δεν έχουν έκπτωση.
      - speaker: Άρης
        text: Πολύ ακριβές! Και τι παίρνεις;
      - speaker: Στέλλα
        text: Σήμερα μόνο αυτές τις κόκκινες κάλτσες. Κάνουν πέντε ευρώ.
  - type: exercise
    id: jacket-choice
    about: jacket
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Какая куртка, по словам Стеллы, очень идёт Арису?
        options:
          - зелёная
          - чёрная
          - серая
        answer: зелёная
        explanation: Το πράσινο σου πάει πολύ!
      - id: q2
        prompt: Ποιο μπουφάν είναι πιο φτηνό;
        options:
          - Το μαύρο.
          - Το πράσινο.
          - Κοστίζουν το ίδιο.
        answer: Το μαύρο.
        explanation: Зелёная — 80 €, чёрная — 60 €.
      - id: q3
        prompt: Что не так с первой чёрной курткой, которую меряет Арис?
        options:
          - Она тесная.
          - Она тяжёлая.
          - Она дорогая.
        answer: Она тесная.
        explanation: Μου είναι στενό — поэтому он берёт размер больше.
      - id: q4
        prompt: Τι παίρνει ο Άρης;
        options:
          - Το μαύρο μπουφάν.
          - Το πράσινο μπουφάν.
          - Τίποτα.
        answer: Το μαύρο μπουφάν.
      - id: q5
        prompt: Что покупает Стелла?
        options:
          - носки
          - сапоги
          - куртку
        answer: носки
        explanation: "Ловушка: сапоги ей нравятся, но они дорогие, без скидки. Она берёт только носки (κάλτσες)."
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Το φόρεμα είναι πολύ ___.
        options:
          - μακρύς
          - μακριά
          - μακρύ
        answer: μακρύ
      - id: q2
        prompt: Η μπλούζα είναι ___.
        options:
          - φαρδύς
          - φαρδιά
          - φαρδύ
        answer: φαρδιά
      - id: q3
        prompt: Τα μπουφάν είναι ___.
        options:
          - βαριοί
          - βαριές
          - βαριά
        answer: βαριά
        explanation: "Μπουφάν не изменяется, но это средний род: τα μπουφάν είναι βαριά."
      - id: q4
        prompt: Φοράω ___ φούστα. (серую)
        options:
          - μια γκρι
          - ένα γκρι
          - έναν γκρι
        answer: μια γκρι
        explanation: "Η φούστα — женский род, поэтому μια; γκρι не изменяется: μια γκρι φούστα, ένα γκρι πουκάμισο."
      - id: q5
        prompt: ___ πουκάμισο θέλετε;
        options:
          - Ποιος
          - Ποια
          - Ποιο
        answer: Ποιο
      - id: q6
        prompt: ___ μπότες σου αρέσουν;
        options:
          - Ποιοι
          - Ποιες
          - Ποια
        answer: Ποιες
      - id: q7
        prompt: Το έχετε σε ___ μικρό νούμερο;
        options:
          - πιο
          - ποιο
        answer: πιο
      - id: q8
        prompt: Οι φίλοι μου ___ πάντα τζιν.
        options:
          - φοράει
          - φοράμε
          - φοράνε
        answer: φοράνε
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το πουκάμισο
      - η φούστα
      - το παντελόνι
      - το παλτό
      - η ζώνη
      - το καπέλο
      - η απόδειξη
      - το δοκιμαστήριο
      - το σακάκι
      - η κάλτσα
    items:
      - id: m1
        prompt: рубашка
        answer: το πουκάμισο
      - id: m2
        prompt: брюки
        answer: το παντελόνι
      - id: m3
        prompt: пальто
        answer: το παλτό
      - id: m4
        prompt: ремень
        answer: η ζώνη
      - id: m5
        prompt: шляпа
        answer: το καπέλο
      - id: m6
        prompt: чек
        answer: η απόδειξη
      - id: m7
        prompt: примерочная
        answer: το δοκιμαστήριο
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы хотите примерить платье.
        options:
          - Μπορώ να το δοκιμάσω;
          - Μπορώ να το επιστρέψω;
          - Σου πάει πολύ!
        answer: Μπορώ να το δοκιμάσω;
      - id: q2
        prompt: Продавец спрашивает ваш размер обуви. Вы носите сороковой.
        options:
          - Φοράω νούμερο σαράντα.
          - Είμαι σαράντα χρονών.
          - Κάνει σαράντα ευρώ.
        answer: Φοράω νούμερο σαράντα.
      - id: q3
        prompt: Дома вы поняли, что куртка вам не нравится, и хотите вернуть её и получить деньги.
        options:
          - Μπορώ να το επιστρέψω;
          - Μπορώ να το δοκιμάσω;
          - Πού είναι το δοκιμαστήριο;
        answer: Μπορώ να το επιστρέψω;
      - id: q4
        prompt: Друг в новом пиджаке, и пиджак ему очень идёт.
        options:
          - Σου πάει πολύ!
          - Μου είναι λίγο στενό.
          - Έχετε την απόδειξη;
        answer: Σου πάει πολύ!
