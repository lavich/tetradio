blocks:
  - type: explanation
    id: clothes
    title: Одежда и глагол φοράω
    body: |-
      **Τα ρούχα** — «одежда». Это множественное число от **το ρούχο** — «вещь, предмет одежды»; об одежде вообще говорят во множественном: Μου αρέσουν τα ελληνικά ρούχα.

      Несколько слов по-гречески стоят в **единственном** числе, хотя по-русски — во множественном. «Брюки» — **το παντελόνι**, «джинсы» — **το τζιν**: Φοράω **ένα** μαύρο παντελόνι. — «На мне чёрные брюки». Αυτό το τζιν είναι καινούργιο. — «Эти джинсы новые». Τα παντελόνια — это уже несколько пар брюк.

      Слова **το τζιν**, **το μπουφάν** (куртка) и **το πουλόβερ** (свитер) пришли из других языков и не изменяются: ένα μπουφάν — δύο μπουφάν, ένα πουλόβερ — τρία πουλόβερ. У **το παλτό** (пальто) множественное число обычное: τα παλτά. **Η μπλούζα** — блузка или кофта, а **το μπλουζάκι** — футболка (суффикс -άκι — «маленький», как в σουβλάκι).

      **Φοράω** — «носить (на себе), быть одетым в…». Спрягается как μιλάω (модуль 02). После него — винительный падеж (модуль 08): Φοράω **τη** μαύρη φούστα. Вопрос: **Τι φοράς σήμερα;** — «Во что ты сегодня одет(а)?». Встречается и форма φορώ — это то же слово.

      **Σου πάει πολύ!** — «Тебе очень идёт!» (πάει — от πάω, «идти»). Вежливо — **Σας πάει πολύ!** Спросить: **Μου πάει;** — «Мне идёт?». Если вещей несколько — πάνε: Σου πάνε πολύ τα καινούργια ρούχα!
    table:
      columns:
        - лицо
        - φοράω — носить
      rows:
        - - εγώ
          - φοράω
        - - εσύ
