  - type: exercise
    id: clothes-match
    title: Одежда
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - το πουκάμισο
      - η φούστα
      - το φόρεμα
      - το σακάκι
      - το μπουφάν
      - το παλτό
      - το πουλόβερ
      - το μπλουζάκι
      - η μπλούζα
      - το παντελόνι
    items:
      - id: m1
        prompt: рубашка
        answer: το πουκάμισο
      - id: m2
        prompt: юбка
        answer: η φούστα
      - id: m3
        prompt: платье
        answer: το φόρεμα
      - id: m4
        prompt: пиджак
        answer: το σακάκι
      - id: m5
        prompt: куртка
        answer: το μπουφάν
      - id: m6
        prompt: пальто
        answer: το παλτό
      - id: m7
        prompt: свитер
        answer: το πουλόβερ
      - id: m8
        prompt: футболка
        answer: το μπλουζάκι
        explanation: το μπλουζάκι — футболка, η μπλούζα — блузка или кофта.
  - type: exercise
    id: number
    title: Одна вещь или несколько
    instruction: Выберите правильную форму. Подсказка — в скобках.
    format: choice
    items:
      - id: q1
        prompt: Φοράω ένα μαύρο ___. (брюки)
        options:
          - παντελόνι
          - παντελόνια
        answer: παντελόνι
        explanation: Брюки — одна вещь, по-гречески единственное число.
      - id: q2
        prompt: Στην ντουλάπα έχω τρία ___. (пальто)
        options:
          - παλτό
          - παλτά
        answer: παλτά
        explanation: У το παλτό обычное множественное число — τα παλτά.
      - id: q3
        prompt: Έχω δύο ___. (куртки)
        options:
          - μπουφάν
          - μπουφάνια
        answer: μπουφάν
        explanation: Μπουφάν не изменяется — δύο μπουφάν.
      - id: q4
        prompt: Αγοράζω δύο ___. (футболки)
        options:
          - μπλουζάκι
          - μπλουζάκια
        answer: μπλουζάκια
        explanation: "Средний род на -ι во мн. ч. — -ια, как σουβλάκι → σουβλάκια."
  - type: exercise
    id: forao
    title: Глагол φοράω
    instruction: Вставьте форму глагола φοράω. Одна форма лишняя.
    format: gap
    bank:
      - φοράω
      - φοράς
      - φοράει
      - φοράμε
      - φοράτε
      - φοράνε
    items:
      - id: g1
        prompt: — Τι ___ σήμερα, Άννα; — Ένα τζιν και ένα άσπρο μπλουζάκι.
        answer: φοράς
      - id: g2
        prompt: Ο Νίκος ___ πάντα ένα σακάκι στη δουλειά.
        answer: φοράει
      - id: g3
        prompt: Εγώ δεν ___ ποτέ φούστα.
        answer: φοράω
      - id: g4
        prompt: Τα παιδιά ___ μπουφάν, γιατί είναι βράδυ.
        answer: φοράνε
        explanation: "Τα παιδιά — «они»: φοράνε."
      - id: g5
        prompt: Κυρία Ελένη, τι ___ στη δουλειά;
        answer: φοράτε
        explanation: Вежливое обращение на «вы» — φοράτε.
  - type: exercise
    id: ys-choice
    title: Широкий, длинный, тяжёлый, лёгкий
    instruction: Выберите форму прилагательного.
    format: choice
    items:
      - id: q1
        prompt: Το παντελόνι είναι πολύ ___.
        options:
          - φαρδύς
          - φαρδιά
          - φαρδύ
        answer: φαρδύ
        explanation: το παντελόνι — средний род, поэтому φαρδύ.
      - id: q2
        prompt: Η φούστα είναι ___.
        options:
          - μακρύς
          - μακριά
          - μακρύ
        answer: μακριά
      - id: q3
        prompt: Ο καναπές είναι πολύ ___.
        options:
          - βαρύς
          - βαριά
          - βαρύ
        answer: βαρύς
      - id: q4
        prompt: Οι μπλούζες είναι ___.
        options:
          - ελαφριοί
          - ελαφριές
          - ελαφριά
        answer: ελαφριές
        explanation: "οι μπλούζες — женский род, мн. ч.: -ιές."
      - id: q5
        prompt: Τα φορέματα είναι ___.
        options:
          - μακριοί
          - μακριές
          - μακριά
        answer: μακριά
        explanation: "τα φορέματα — средний род, мн. ч.: -ιά."
      - id: q6
        prompt: Θέλω ένα ___ πουλόβερ.
        options:
          - ελαφρύς
          - ελαφριά
          - ελαφρύ
        answer: ελαφρύ
        explanation: Πουλόβερ не изменяется, но род у него есть — средний (το πουλόβερ).
      - id: q7
        prompt: Φοράω μια ___ φούστα.
        options:
          - φαρδύ
          - φαρδιά
          - φαρδιές
        answer: φαρδιά
  - type: exercise
    id: adj-write
    title: Какая одежда
    instruction: Напишите прилагательное в нужной форме. Подсказка — в скобках.
    format: text
    items:
      - id: q1
        prompt: Η μπλούζα είναι ___. (лёгкий)
        answer:
          - ελαφριά
      - id: q2
        prompt: Τα παλτά είναι ___. (тяжёлый)
        answer:
          - βαριά
        explanation: "τα παλτά — средний род, мн. ч.: βαριά."
      - id: q3
        prompt: Το φόρεμα είναι ___. (длинный)
        answer:
          - μακρύ
      - id: q4
        prompt: Οι φούστες είναι ___. (широкий)
        answer:
          - φαρδιές
      - id: q5
        prompt: Το σακάκι μου είναι ___. (узкий)
        answer:
          - στενό
      - id: q6
        prompt: Η φούστα είναι πολύ ___. (короткий)
        answer:
          - κοντή
  - type: exercise
    id: colors-choice
    title: Цвета
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Μου αρέσουν ___ σακάκια. (коричневые)
        options:
          - τα καφέ
          - τα καφέδες
          - τα καφέα
        answer: τα καφέ
        explanation: Цвет καφέ не изменяется. Οι καφέδες — это чашки кофе.
      - id: q2
        prompt: Θέλω μια ___ φούστα. (чёрная)
        options:
          - μαύρος
          - μαύρη
          - μαύρο
        answer: μαύρη
        explanation: Μαύρος изменяется, как все прилагательные на -ος.
      - id: q3
        prompt: Οι μπλούζες μου είναι ___. (серые)
        options:
          - γκρι
          - γκριές
          - γκρίδες
        answer: γκρι
      - id: q4
        prompt: Το σακάκι είναι ___ μπλε. (тёмно-синий)
        options:
          - σκούρος
          - σκούρα
          - σκούρο
        answer: σκούρο
      - id: q5
        prompt: Τα φορέματα είναι ___. (красные)
        options:
          - κόκκινοι
          - κόκκινες
          - κόκκινα
        answer: κόκκινα
      - id: q6
        prompt: Η Μαρία φοράει ένα ___ φόρεμα. (розовое)
        options:
          - ροζ
          - ρόζο
          - ροζό
        answer: ροζ
  - type: explanation
    id: poios
    title: Ποιος, ποια, ποιο — «какой, который»
    body: |-
      **Ποιος** вы знаете как «кто» (модуль 01). Перед существительным он значит «какой, который (из нескольких)» и изменяется, как прилагательное, в роде вещи: **Ποιο** φόρεμα; **Ποια** φούστα; **Ποιον** καναπέ θέλετε; (ο καναπές, вин. п.).

      Без существительного, когда вещь понятна: **Ποιο σας αρέσει περισσότερο;** — «Какое (из них) вам больше нравится?» (περισσότερο — «больше»). Ответ: **Το μπλε.** — «Синее».

      **Τι или ποιο?** Τι — «что, какой» вообще, без выбора: **Τι** φοράς σήμερα; **Ποιο** — выбор из того, что перед глазами: **Ποιο** φόρεμα φοράς, το μαύρο ή το κόκκινο; И ещё: цвет спрашивают через τι — **Τι χρώμα είναι;**

      Произношение: ποιος [пьос], ποια [пья], ποιο [пьо] — один слог.
