  - type: exercise
    id: poios-choice
    title: Какой из них
    instruction: Выберите правильное слово.
    format: choice
    items:
      - id: q1
        prompt: ___ φόρεμα σου αρέσει;
        options:
          - Ποιος
          - Ποια
          - Ποιο
        answer: Ποιο
        explanation: το φόρεμα — средний род.
      - id: q2
        prompt: ___ φούστα θέλεις, τη μαύρη ή την άσπρη;
        options:
          - Ποιος
          - Ποια
          - Ποιο
        answer: Ποια
      - id: q3
        prompt: ___ μπλούζες σου αρέσουν;
        options:
          - Ποιοι
          - Ποιες
          - Ποια
        answer: Ποιες
      - id: q4
        prompt: ___ πουκάμισα είναι δικά σου;
        options:
          - Ποιοι
          - Ποιες
          - Ποια
        answer: Ποια
        explanation: "τα πουκάμισα — средний род, мн. ч.: ποια."
      - id: q5
        prompt: ___ καναπέ θέλετε;
        options:
          - Ποιος
          - Ποιον
          - Ποιο
        answer: Ποιον
        explanation: "Καναπέ — винительный падеж мужского рода (θέλετε + вин. п.), поэтому ποιον."
      - id: q6
        prompt: — ___ φοράς σήμερα; — Ένα τζιν και ένα μπλουζάκι.
        options:
          - Τι
          - Ποιο
        answer: Τι
        explanation: Вопрос вообще, без выбора из нескольких вещей, — τι.
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Подруга примерила новое платье, и оно ей очень идёт.
        options:
          - Σου πάει πολύ!
          - Καλή όρεξη!
          - Δεν πειράζει.
        answer: Σου πάει πολύ!
      - id: q2
        prompt: Вы продавец. Покупательница смотрит на два платья. Спросите, какое ей больше нравится.
        options:
          - Ποιο σας αρέσει περισσότερο;
          - Τι χρώμα είναι;
          - Ποιανού είναι αυτό;
        answer: Ποιο σας αρέσει περισσότερο;
      - id: q3
        prompt: Рубашка вам нравится, но не нравится её цвет.
        options:
          - Το έχετε σε άλλο χρώμα;
          - Τι χρώμα είναι;
          - Είναι καινούργιο ή παλιό;
        answer: Το έχετε σε άλλο χρώμα;
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Во что ты сегодня одет(а)? (Что ты носишь сегодня?)
        answer:
          - Τι φοράς σήμερα;
          - Σήμερα τι φοράς;
      - id: q2
        prompt: На мне чёрные брюки.
        answer:
          - Φοράω ένα μαύρο παντελόνι.
          - Φοράω μαύρο παντελόνι.
          - Εγώ φοράω ένα μαύρο παντελόνι.
          - Φορώ ένα μαύρο παντελόνι.
          - Φορώ μαύρο παντελόνι.
        explanation: Брюки — το παντελόνι, единственное число.
      - id: q3
        prompt: Платье очень длинное.
        answer:
          - Το φόρεμα είναι πολύ μακρύ.
      - id: q4
