  - type: explanation
    id: adj-ys
    title: Прилагательные на -ύς, -ιά, -ύ
    body: |-
      Вы знаете прилагательные на -ος/-η/-ο (модуль 07). Есть небольшая группа с ударным **-ύς** в мужском роде: **φαρδύς** — широкий, свободный; **μακρύς** — длинный; **βαρύς** — тяжёлый; **ελαφρύς** — лёгкий (по весу). В женском роде у них **-ιά**, в среднем — **-ύ**: ο καναπές είναι βαρύς, η φούστα είναι μακριά, το παλτό είναι βαρύ.

      Во множественном числе перед окончанием появляется **ι**: οι φαρδιοί, οι φαρδιές, τα φαρδιά. Ударение всегда на окончании. Сочетание ιά читается как один слог: φαρ-διά, μα-κριά, βα-ριά.

      Самые частые формы — средний род, потому что большинство названий одежды среднего рода: Το παντελόνι είναι **φαρδύ**. Τα παλτά είναι **βαριά**. Το πουλόβερ είναι **ελαφρύ**.

      **Не путайте:** μακριά — это и «длинная» (η φούστα είναι μακριά), и наречие «далеко». Пишутся одинаково, смысл понятен из контекста.

      Остальные прилагательные урока — обычные, на -ος/-η/-ο: **στενός** — узкий, тесный; **κοντός** — короткий, а о людях — невысокий; **σκούρος** — тёмный (о цвете). У σκούρος женский род — **σκούρα**, не «σκούρη»: μια σκούρα μπλούζα.
    table:
      columns:
        - форма
        - м. р.
        - ж. р.
        - ср. р.
      rows:
        - - ед. ч., им. п.
          - φαρδύς
          - φαρδιά
          - φαρδύ
        - - ед. ч., вин. п.
          - φαρδύ
          - φαρδιά
          - φαρδύ
        - - мн. ч., им. п.
          - φαρδιοί
          - φαρδιές
          - φαρδιά
        - - мн. ч., вин. п.
          - φαρδιούς
          - φαρδιές
          - φαρδιά
        - - так же
          - μακρύς, βαρύς, ελαφρύς
          - μακριά, βαριά, ελαφριά
          - μακρύ, βαρύ, ελαφρύ
  - type: explanation
    id: colors
    title: Цвета, которые не изменяются
    body: |-
      Цвета из модуля 07 — **άσπρος, μαύρος, κόκκινος, πράσινος, κίτρινος** — согласуются с вещью: η άσπρη μπλούζα, τα άσπρα πουκάμισα. А **μπλε** не изменяется совсем.

      Так же, как μπλε, не изменяются и другие цвета, пришедшие из других языков: **γκρι** — серый, **καφέ** — коричневый (как кофе), **ροζ** — розовый, **μωβ** — фиолетовый, **μπεζ** — бежевый. Ένα γκρι παντελόνι, μια γκρι φούστα, τα γκρι πουλόβερ — форма одна. Не путайте: οι καφέδες — это чашки кофе, а цвет всегда καφέ.

      Оттенок: **σκούρο μπλε** — тёмно-синий, **ανοιχτό μπλε** — светло-синий, голубой (ανοιχτός — «светлый» и «открытый»). Ένα σκούρο μπλε σακάκι.

      Сам цвет как слово — среднего рода: **το μαύρο** — чёрный цвет, **το γκρι** — серый. Μου αρέσει το μαύρο. **Το έχετε σε άλλο χρώμα;** — «Есть это в другом цвете?». Ответ: Το έχουμε σε μαύρο και σε γκρι. — «Есть в чёрном и в сером».
    table:
      columns:
        - цвет
        - по-русски
        - пример
      rows:
        - - μπλε
          - синий
          - η μπλε φούστα
        - - γκρι
          - серый
          - τα γκρι παντελόνια
        - - καφέ
          - коричневый
          - τα καφέ σακάκια
        - - ροζ
          - розовый
          - ένα ροζ φόρεμα
        - - σκούρο μπλε
          - тёмно-синий
          - ένα σκούρο μπλε σακάκι
        - - ανοιχτό μπλε
          - светло-синий, голубой
          - ένα ανοιχτό μπλε πουκάμισο
