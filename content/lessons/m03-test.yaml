title: Контрольная модуля 03
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, числа и фразы. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Разговор звучит два раза. Ошибки не страшны: пояснения после ответа подскажут, что повторить.
  - type: reading
    id: marios
    title: Ο Μάριος και η οικογένειά του
    text: |-
      Με λένε Μάριο. Είμαι σαράντα πέντε χρονών και μένω στην Πάφο. Είμαι διαζευγμένος και έχω μία κόρη, τη Ζωή. Η Ζωή είναι δεκαέξι χρονών και μένει με τη μητέρα της στη Λεμεσό.

      Οι γονείς μου μένουν εδώ, στην Πάφο. Ο πατέρας μου είναι εβδομήντα οκτώ χρονών και η μητέρα μου εβδομήντα πέντε.

      Έχω και δύο αδελφές. Η Χαρά είναι γιατρός στη Λευκωσία. Είναι παντρεμένη και έχει τρία παιδιά. Η άλλη αδελφή μου, η Νεφέλη, μένει στην Αθήνα και δεν έχει παιδιά.
    glosses:
      - text: με τη μητέρα της
        russian: со своей мамой
  - type: exercise
    id: marios-tf
    about: marios
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Ο Μάριος μένει στην Πάφο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Ο Μάριος είναι παντρεμένος.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είμαι διαζευγμένος — «я разведён».
      - id: q3
        prompt: Η κόρη του μένει στη Λεμεσό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Зои живёт с мамой в Лимасоле, а сам Мариос — в Пафосе.
      - id: q4
        prompt: Ο πατέρας του είναι εβδομήντα πέντε χρονών.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Отцу 78 (εβδομήντα οκτώ), 75 — маме.
      - id: q5
        prompt: Η Χαρά έχει τρία παιδιά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Ο Μάριος έχει έναν αδελφό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Έχω και δύο αδελφές — у него две сестры, брата нет.
      - id: q7
        prompt: Η Ζωή είναι έξι χρονών.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η Ζωή είναι δεκαέξι χρονών — 16, а не 6 (έξι).
  - type: listening
    id: neighbours
    title: Η Σοφία και ο Μιχάλης
    plays: 2
    transcript:
      - speaker: Μιχάλης
        text: Καλημέρα, Σοφία! Ποια είναι αυτή;
        audio: m03-test/neighbours-1.mp3
      - speaker: Σοφία
        text: Καλημέρα, Μιχάλη! Είναι η κόρη μου, η Μελίνα.
        audio: m03-test/neighbours-2.mp3
      - speaker: Μιχάλης
        text: Η κόρη σου; Πόσων χρονών είναι;
        audio: m03-test/neighbours-3.mp3
      - speaker: Σοφία
        text: Είναι δεκαοκτώ χρονών. Είναι εδώ τώρα, αλλά μένει στην Αθήνα.
        audio: m03-test/neighbours-4.mp3
      - speaker: Μιχάλης
        text: Έχεις και άλλα παιδιά;
        audio: m03-test/neighbours-5.mp3
      - speaker: Σοφία
        text: Ναι, έχω και έναν γιο, τον Άρη. Είναι είκοσι πέντε χρονών και είναι γιατρός. Κι εσύ, Μιχάλη; Είσαι παντρεμένος;
        audio: m03-test/neighbours-6.mp3
      - speaker: Μιχάλης
        text: Ναι. Η γυναίκα μου είναι από τη Ρωσία. Έχουμε δύο παιδιά, πέντε και οκτώ χρονών.
        audio: m03-test/neighbours-7.mp3
      - speaker: Σοφία
        text: Ωραία! Και οι γονείς σου;
        audio: m03-test/neighbours-8.mp3
      - speaker: Μιχάλης
        text: Μένουν στη Λάρνακα, με τη γιαγιά μου. Η γιαγιά μου είναι ενενήντα χρονών!
        audio: m03-test/neighbours-9.mp3
      - speaker: Σοφία
        text: Ενενήντα; Πολύ ωραία!
        audio: m03-test/neighbours-10.mp3
  - type: exercise
    id: neighbours-choice
    about: neighbours
    graded: true
    title: Аудирование
    instruction: Прослушайте разговор и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πόσων χρονών είναι η Μελίνα;
        options:
          - "8"
          - "18"
          - "80"
        answer: "18"
        explanation: Δεκαοκτώ — 18. 8 — οκτώ, 80 — ογδόντα.
      - id: q2
        prompt: Πού μένει η Μελίνα;
        options:
          - Στην Αθήνα.
          - Στη Λάρνακα.
          - Στη Ρωσία.
        answer: Στην Αθήνα.
        explanation: Είναι εδώ τώρα, αλλά μένει στην Αθήνα — сейчас она здесь, но живёт в Афинах. Λάρνακα — город родителей Михалиса.
      - id: q3
        prompt: Τι δουλειά κάνει ο Άρης;
        options:
          - Είναι δάσκαλος.
          - Είναι γιατρός.
          - Δεν δουλεύει.
        answer: Είναι γιατρός.
      - id: q4
        prompt: Сколько детей у Михалиса?
        options:
          - один
          - двое
          - трое
        answer: двое
        explanation: Έχουμε δύο παιδιά, πέντε και οκτώ χρονών — двое, им 5 и 8 лет.
      - id: q5
        prompt: Откуда жена Михалиса?
        options:
          - с Кипра
          - из России
          - из Греции
        answer: из России
      - id: q6
        prompt: Сколько лет бабушке Михалиса?
        options:
          - "19"
          - "90"
          - "99"
        answer: "90"
        explanation: Ενενήντα — 90. 19 — δεκαεννέα, 99 — ενενήντα εννέα.
  - type: exercise
    id: grammar-gap
    graded: true
    title: Грамматика
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - έχω
      - έχει
      - έχουμε
      - έχετε
      - σου
      - του
      - της
      - τους
      - χρονών
    items:
      - id: g1
        prompt: Εγώ ___ δύο αδελφές.
        answer: έχω
      - id: g2
        prompt: Η Μαρία δεν ___ παιδιά.
        answer: έχει
      - id: g3
        prompt: Εμείς ___ έναν γιο.
        answer: έχουμε
      - id: g4
        prompt: — Ο Νίκος είναι ο αδελφός ___; — Ναι, είναι ο αδελφός μου.
        answer: σου
        explanation: Ответ «мой брат» — значит, спрашивали «твой брат?», σου.
      - id: g5
        prompt: Η Ελένη μένει με τη μητέρα ___. (со своей мамой)
        answer: της
        explanation: "Мама Елени — «её мама»: της. Русскому «свой» соответствует слово того же лица."
      - id: g6
        prompt: Ο Πέτρος και η Άννα είναι εδώ, αλλά τα παιδιά ___ είναι στη Λεμεσό.
        answer: τους
      - id: g7
        prompt: Η γιαγιά μου είναι ογδόντα ___.
        answer: χρονών
  - type: exercise
    id: accent-choice
    graded: true
    title: Второй тонос
    instruction: Выберите правильное написание.
    format: choice
    items:
      - id: q1
        prompt: моя семья
        options:
          - η οικογένεια μου
          - η οικογένειά μου
        answer: η οικογένειά μου
      - id: q2
        prompt: его имя
        options:
          - το όνομα του
          - το όνομά του
        answer: το όνομά του
      - id: q3
        prompt: твоя мама
        options:
          - η μητέρα σου
          - η μητέρά σου
        answer: η μητέρα σου
        explanation: Ударение в μητέρα на предпоследнем слоге — второй тонос не нужен.
      - id: q4
        prompt: наш учитель
        options:
          - ο δάσκαλος μας
          - ο δάσκαλός μας
        answer: ο δάσκαλός μας
  - type: exercise
    id: numbers-match
    graded: true
    title: Числа
    instruction: Соедините число и слово. Три слова лишние.
    format: match
    bank:
      - δεκαπέντε
      - δώδεκα
      - είκοσι
      - σαράντα
      - πενήντα
      - εξήντα
      - εβδομήντα
      - ογδόντα
      - ενενήντα
    items:
      - id: m1
        prompt: "15"
        answer: δεκαπέντε
      - id: m2
        prompt: "50"
        answer: πενήντα
      - id: m3
        prompt: "70"
        answer: εβδομήντα
      - id: m4
        prompt: "40"
        answer: σαράντα
      - id: m5
        prompt: "90"
        answer: ενενήντα
      - id: m6
        prompt: "12"
        answer: δώδεκα
  - type: exercise
    id: vocab-choice
    graded: true
    title: Слова и фразы
    instruction: Выберите подходящий вариант.
    format: choice
    items:
      - id: q1
        prompt: — Πόσων χρονών είσαι; —
        options:
          - Είμαι τριάντα χρονών.
          - Έχω τριάντα χρόνια.
          - Είμαι από τη Λάρνακα.
        answer: Είμαι τριάντα χρονών.
        explanation: Возраст — είμαι … χρονών.
      - id: q2
        prompt: — Έχεις αδέλφια; —
        options:
          - Ναι, έχω μία αδελφή.
          - Ναι, είμαι παντρεμένη.
          - Όχι, δεν έχω παιδιά.
        answer: Ναι, έχω μία αδελφή.
        explanation: Αδέλφια — «братья и сёстры», а не «дети».
      - id: q3
        prompt: Папа вашей мамы — это ваш…
        options:
          - ο παππούς
          - ο αδελφός
          - ο γιος
        answer: ο παππούς
      - id: q4
        prompt: Η γυναίκα μου значит…
        options:
          - моя жена
          - моя сестра
          - моя дочь
        answer: моя жена
      - id: q5
        prompt: "Женщина говорит «Я замужем»:"
        options:
          - Είμαι παντρεμένη.
          - Είμαι παντρεμένος.
          - Είμαι διαζευγμένη.
        answer: Είμαι παντρεμένη.
        explanation: Παντρεμένος — о мужчине; διαζευγμένη — «разведена».
