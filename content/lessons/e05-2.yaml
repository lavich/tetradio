blocks:
  - type: explanation
    id: interview-words
    title: Язык вопросов собеседования
    body: |-
      Интервьюер задаёт один и тот же вопрос по-разному, и слова урока описывают эти формы и реакцию на них.

      **Виды вопросов.** **Open-ended** — вопрос, на который отвечают развёрнуто, **a scenario** — описанная ситуация, в которой нужно решить задачу, **a case study** — разбор конкретного случая из практики, **a trick question** — вопрос с подвохом, **a curveball** — неожиданный вопрос, **a prompt** — исходная формулировка задания (в IT — ещё и запрос к языковой модели).

      **Ход разговора.** **Probe** — расспрашивать глубже, **a steer** — подсказка, куда двигаться (британское слово), **a tangent** — уход в побочную тему, **interrupt** — перебить, **put on the spot** — застать врасплох, **hesitate** — колебаться, **articulate** — чётко выразить мысль, **the gist** — общий смысл без деталей.

      **Связь и слух.** **A screen share** — показ экрана в видеозвонке, **inaudible** — неразборчивый, **mishear** — ослышаться (*misheard* — форма прошедшего времени и причастия).
  - type: explanation
    id: buy-time
    title: Выиграть время и уточнить задачу
    body: |-
      Пауза перед ответом принята, если её объяснить: **Let me think about it for a second. That's a good question.** Если ответ потребует времени, можно отложить его: **Could I come back to that in a moment?** Слова **Let me rephrase that** показывают, что вы поправляете свою формулировку.

      Прежде чем отвечать на широкий вопрос, уточните задачу: **Should I focus on the technical side?** Если вы могли ослышаться, проверьте слово: **Did you say Kubernetes or Kafka?** Ответ начинается с главного: **Let me start with the main point.** Если подробностей не хватает вам, попросите: **Could you elaborate on that?**

      Фразы идут в порядке разговора: сначала время, затем уточнение задачи, затем ответ. Одна фраза из списка занимает три секунды и оставляет время подумать.
