blocks:
  - type: explanation
    id: process-words
    title: Слова о найме и предложении
    body: |-
      Письмо рекрутера и страница о найме описывают один и тот же путь кандидата. Слова урока образуют три группы.

      **Этапы.** **A hiring process** — все этапы от отклика до предложения, **a screening call** — первый короткий звонок, **a take-home task** — тестовое задание, которое выполняют дома, **a technical round** — разговор с инженерами о коде и проектировании, **a panel interview** — собеседование с несколькими интервьюерами сразу, **a background check** — проверка биографии, **be shortlisted** — остаться среди кандидатов, которых зовут дальше.

      **Люди.** **A hiring manager** — руководитель, для чьей команды ищут сотрудника, **a headhunter** — специалист, который сам ищет кандидатов для компаний, **a referral** — рекомендация сотрудника, **headcount** — число штатных мест, утверждённое компанией. Глагол **reach out** — написать или позвонить первым: **A recruiter reached out to me.**

      **Предложение.** **An offer letter** — письмо с предложением работы, **a counteroffer** — ответ с вашими условиями, **a probation period** — первые месяцы работы с оценкой обеих сторон, **a perk** — льгота сверх зарплаты, **a competitive salary** — зарплата не ниже рыночной.
