  - type: exercise
    id: words-gap
    title: Предложение и условия
    instruction: Вставьте слово или выражение. Два варианта лишние.
    format: gap
    bank:
      - an offer letter
      - a counteroffer
      - a probation period
      - a perk
      - a competitive salary
      - a background check
      - a hiring process
      - a referral
      - reach out
      - a work permit
    items:
      - id: g1
        prompt: The company sent me ___ with the salary, the title and the start date. (письмо с предложением)
        answer: an offer letter
      - id: g2
        prompt: I asked for more stock options and sent ___. (встречное предложение)
        answer: a counteroffer
      - id: g3
        prompt: The first three months are ___, and then the contract becomes permanent. (испытательный срок)
        answer: a probation period
      - id: g4
        prompt: Private health insurance is ___ that the company gives to every employee. (льгота)
        answer: a perk
      - id: g5
        prompt: The ad promises ___, which means it is not lower than the market average. (конкурентная зарплата)
        answer: a competitive salary
      - id: g6
        prompt: Before the first day, the company checks my employment history. This is ___. (проверка биографии)
        answer: a background check
      - id: g7
        prompt: The company has four steps from the first call to the offer. That is ___. (процесс найма)
        answer: a hiring process
      - id: g8
        prompt: Thank you for choosing to ___ to me about this role. (написать первым)
        answer: reach out
  - type: explanation
    id: reading-how
    title: Как читать письмо рекрутера
    body: |-
      Письмо рекрутера состоит из трёх частей: цель письма и роль, условия (деньги, договор, формат работы) и следующий шаг с просьбой. В конце письма обычно стоит вопрос, на который нужно ответить: **Could you let me know your notice period? Would you be available for a short call?**

      В условиях часто встречаются модальные глаголы. **You would need a work permit** — необходимое условие, если случится определённая ситуация. **You would have to relocate** — обязанность, которую ставит работодатель. **You do not have to move before you sign** — переезд не обязателен. **The salary would be reviewed once a year** — условие, которое действует при выходе на работу. Форма **would** делает формулировку осторожнее: предложение ещё не стало договором.

      Суммы часто даны вилкой и с пометкой **gross** или **net**. Читая, проверяйте, о какой сумме идёт речь: до вычета налогов или после. Слова вне списков переведены под текстом.
  - type: reading
    id: email
    title: "Senior Backend Engineer at Fennel Systems"
    text: |-
      Subject: Senior Backend Engineer at Fennel Systems

      Dear Daniel,

      Thank you for your interest in the Senior Backend Engineer role at Fennel Systems. I work on the hiring team, and I would like to share the main conditions before we speak.

      The role is a permanent position in the Platform team. The salary range is 85,000 to 100,000 euros gross per year, depending on experience, and the base salary is reviewed once a year. You would also receive stock options and a learning budget.

      We work in a hybrid format: two days a week in our Berlin office and the rest from home. Core hours are 10:00 to 15:00 Berlin time, so the whole team has an overlap of at least five hours. If you do not live in Berlin, you would have to relocate within three months of your start date. If you live outside the European Union, you would also need a valid work permit.

      The hiring process has four steps: a screening call with me, a take-home task, a technical round and a panel interview with the hiring manager and two engineers. After the last step, we run a background check. The first three months of the contract are a probation period.

      Could you let me know your notice period and your salary expectations? Would you be available for a short call on Thursday or Friday?

      Kind regards,
      Katarina Lind
      Recruiter, Fennel Systems
    glosses:
      - { text: depending on, russian: "в зависимости от" }
      - { text: reviewed, russian: пересматривается }
      - { text: learning budget, russian: "бюджет на обучение" }
      - { text: the European Union, russian: "Европейский союз" }
      - { text: valid, russian: действующее }
      - { text: expectations, russian: ожидания }
