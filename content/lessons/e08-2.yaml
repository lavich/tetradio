  - type: explanation
    id: listening-how
    title: Звонок рекрутера на слух
    body: |-
      В звонке рекрутер идёт по плану: проверяет, удобно ли говорить, спрашивает о сроках и деньгах, рассказывает об условиях и назначает следующий шаг. Числа и сроки звучат быстро, поэтому слушайте, к чему относится число: к вилке, сроку предупреждения или часам доступности.

      Послушайте, как Katarina звонит кандидату Daniel. Сначала целиком, затем ответьте на вопросы и проверьте себя при втором прослушивании. Транскрипт открывается после ответа.
  - type: listening
    id: call
    title: A call from a recruiter
    plays: 2
    transcript:
      - { speaker: Katarina, text: "Hello Daniel, this is Katarina Lind from Fennel Systems. Thanks for taking my call. Is now a good time to talk?" }
      - { speaker: Daniel, text: "Hello Katarina. Yes, I have about twenty minutes before my next meeting." }
      - { speaker: Katarina, text: "Great. Would you mind telling me about your notice period?" }
      - { speaker: Daniel, text: "Not at all. My notice period is two months, but I think I can negotiate an earlier start with my employer. I could start in early March." }
      - { speaker: Katarina, text: "That works well for us. Now, the salary. What salary range are you looking for?" }
      - { speaker: Daniel, text: "I'm looking for something in the range of ninety to a hundred thousand euros gross. Is that realistic for this role?" }
      - { speaker: Katarina, text: "It is. Our range is eighty-five to a hundred thousand, and the base salary is negotiable, depending on experience. You would also receive stock options. The role is hybrid, with two days a week in our Berlin office. Our core hours are ten to three, Berlin time. Where do you live now?" }
      - { speaker: Daniel, text: "In Manchester, so we are one hour apart and the overlap is not a problem. I suppose I would need a work permit?" }
      - { speaker: Katarina, text: "Yes, and we would help you with it. You would also have to relocate to Berlin within three months of your start date." }
      - { speaker: Daniel, text: "That is fine. I have to discuss it with my partner first, though." }
      - { speaker: Katarina, text: "Of course. The next steps are a take-home task and two interviews. Could we schedule a call for early next week to talk about them?" }
      - { speaker: Daniel, text: "I should be available on Tuesday afternoon. I have to check my calendar first, and then I'll confirm by email." }
  - type: exercise
    id: call-q
    about: call
    title: Что сказали в разговоре
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What does Daniel say about his notice period?
        options:
          - It is two months, but he may be able to start earlier.
          - It is one month.
          - He has no notice period.
        answer: It is two months, but he may be able to start earlier.
      - id: q2
        prompt: When could Daniel probably start?
        options: [in early March, in September, in early January]
        answer: in early March
      - id: q3
        prompt: What salary range is Daniel looking for?
        options:
          - ninety to a hundred thousand euros gross
          - eighty-five to a hundred thousand euros net
          - a hundred to a hundred and ten thousand euros gross
        answer: ninety to a hundred thousand euros gross
      - id: q4
        prompt: What does Katarina say about the base salary?
        options:
          - It is negotiable, depending on experience.
          - It is fixed.
          - It is paid only in stock options.
        answer: It is negotiable, depending on experience.
        explanation: The base salary is negotiable, depending on experience — оклад обсуждается с учётом опыта.
      - id: q5
        prompt: Where does Daniel live?
        options: [in Manchester, in Lisbon, in Berlin]
        answer: in Manchester
      - id: q6
        prompt: What would Daniel have to do if he joins the company?
        options:
          - relocate to Berlin within three months
          - work only from home
          - move to Lisbon
        answer: relocate to Berlin within three months
        explanation: You would also have to relocate to Berlin within three months of your start date.
      - id: q7
        prompt: When should Daniel be available for the next call?
        options: [on Tuesday afternoon, on Friday morning, on Monday evening]
        answer: on Tuesday afternoon
  - type: exercise
    id: call-phrases
    about: call
    title: Фразы из разговора
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - notice
      - negotiate
      - range
      - negotiable
      - relocate
      - schedule
      - overlap
      - shortlisted
    items:
      - { id: g1, prompt: "My ___ period is two months. (предупреждения)", answer: notice }
      - { id: g2, prompt: "I can ___ an earlier start with my employer. (договориться)", answer: negotiate }
      - { id: g3, prompt: "What salary ___ are you looking for? (вилка)", answer: range }
      - { id: g4, prompt: "The base salary is ___, depending on experience. (обсуждаемый)", answer: negotiable }
      - { id: g5, prompt: "You would have to ___ to Berlin within three months. (переехать)", answer: relocate }
      - { id: g6, prompt: "Could we ___ a call for early next week? (назначить)", answer: schedule }
