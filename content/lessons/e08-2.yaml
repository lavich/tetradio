      - { id: m4, prompt: "собеседование, на котором с кандидатом одновременно беседуют несколько интервьюеров: менеджер, инженер и продакт-менеджер", answer: a panel interview }
      - { id: m5, prompt: "руководитель, в чью команду ищут нового сотрудника", answer: a hiring manager }
      - { id: m6, prompt: "остаться среди кандидатов, которых приглашают на следующий этап", answer: be shortlisted }
      - { id: m7, prompt: "специалист, который сам ищет кандидатов для компаний", answer: a headhunter }
