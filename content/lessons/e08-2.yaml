  - type: exercise
    id: email-grammar
    about: email
    title: Модальные глаголы в письме
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "«You would need a valid work permit.» Что выражает would need?"
        options:
          - необходимое условие в определённой ситуации
          - совет
          - возможность в прошлом
        answer: необходимое условие в определённой ситуации
        explanation: Would need передаёт условие, которое действует, если кандидат живёт вне Европейского союза.
      - id: q2
        prompt: "«You would have to relocate within three months of your start date.» Что выражает have to?"
        options:
          - обязанность, которую ставит работодатель
          - вежливую просьбу
          - случайную возможность
        answer: обязанность, которую ставит работодатель
        explanation: Have to передаёт обязанность из условий работы.
      - id: q3
        prompt: "«Could you let me know your notice period?» Что это?"
        options:
          - вежливая просьба
          - обязанность
          - прогноз
        answer: вежливая просьба
        explanation: Could you… — вежливая просьба.
      - id: q4
        prompt: Какая фраза близка по смыслу к «You would have to relocate»?
        options:
          - You would need to relocate.
          - You would mind relocating.
          - You would could relocate.
        answer: You would need to relocate.
        explanation: Would need to и would have to передают необходимость; две другие формы ошибочны.
  - type: reading
    id: process
    title: "How we hire at Halden Labs"
    text: |-
      How we hire at Halden Labs

      Step 1. Screening call (30 minutes)
      A recruiter asks about your experience, when you could start and what salary you expect. You do not need to prepare anything.

      Step 2. Take-home task (3 hours)
      You receive a small task and three days to send us your solution. Candidates who are shortlisted after this step are invited to the technical round.

      Step 3. Technical round (90 minutes)
      You discuss your solution with two engineers and work on a short design problem.

      Step 4. Panel interview (60 minutes)
      You meet the hiring manager, an engineer from another team and a product manager. They ask about teamwork and motivation.

      After the interview
      We call every candidate within five working days. If we make an offer, we send an offer letter. You can reply with a counteroffer, and we are open to talking about the salary and the start date. The last step is a background check, and the contract starts with a probation period of six months.

      Good to know
      Every open role has approved headcount, so we only post vacancies that we can fill. Our perks include a learning budget, private health insurance and 28 days of holiday.
    glosses:
      - { text: expect, russian: ожидаете }
      - { text: solution, russian: решение }
      - { text: working days, russian: рабочих дней }
      - { text: approved, russian: утверждённые }
      - { text: vacancies, russian: вакансии }
      - { text: post, russian: публиковать }
      - { text: fill, russian: закрыть }
      - { text: private health insurance, russian: "частная медицинская страховка" }
