title: Описание квартиры — письмо, речь, повторение
kind: lesson
items:
  - kind: phrase
    id: p067
  - kind: phrase
    id: p070
blocks:
  - type: explanation
    id: phrases
    title: Где я живу
    body: |-
      **Μένω σε ένα μικρό διαμέρισμα.** — «Я живу в маленькой квартире». Перед ένα предлог σε не сливается: **σε ένα** διαμέρισμα, **σε μία** πόλη. Μικρό — «маленький» (м. μικρός, ж. μικρή, ср. μικρό); противоположное — **μεγάλο**, «большой». Эти прилагательные подробно — в модуле 07, для описания квартиры хватит среднего рода: μικρό / μεγάλο διαμέρισμα, σπίτι, δωμάτιο.

      **Στο δωμάτιο δεν υπάρχει τίποτα.** — «В комнате ничего нет»: δεν + υπάρχει + τίποτα, двойное отрицание, как в русском.

      Порядок слов в описании свободный. Удобно начинать с места — **Στο σαλόνι υπάρχει…**, **Δίπλα στην κουζίνα είναι…** — тогда предложения связываются друг с другом и текст не звучит как список.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - где жильё
          - Μένω σε ένα διαμέρισμα στη Λεμεσό. Είναι κοντά στη θάλασσα.
        - - сколько комнат
          - Το διαμέρισμα έχει δύο υπνοδωμάτια, σαλόνι, κουζίνα και μπάνιο.
        - - что где
          - Η κουζίνα είναι δίπλα στο σαλόνι. Το μπάνιο είναι πίσω από την κουζίνα.
        - - что есть и чего нет
          - Στο σαλόνι υπάρχει ένα τραπέζι. Στο υπνοδωμάτιο δεν υπάρχει τίποτα.
        - - аренда
          - Το ενοίκιο είναι εξακόσια ευρώ τον μήνα.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: sentences
    title: Предложения для описания
    instruction: Напишите по-гречески. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я живу в маленькой квартире.
        answer:
          - Μένω σε ένα μικρό διαμέρισμα.
          - Μένω σε μικρό διαμέρισμα.
          - Εγώ μένω σε ένα μικρό διαμέρισμα.
      - id: q2
        prompt: В квартире две спальни.
        answer:
          - Το διαμέρισμα έχει δύο υπνοδωμάτια.
          - Στο διαμέρισμα υπάρχουν δύο υπνοδωμάτια.
          - Υπάρχουν δύο υπνοδωμάτια στο διαμέρισμα.
      - id: q3
        prompt: Кухня рядом с гостиной.
        answer:
          - Η κουζίνα είναι δίπλα στο σαλόνι.
      - id: q4
        prompt: В гостиной есть стол.
        answer:
          - Στο σαλόνι υπάρχει τραπέζι.
          - Στο σαλόνι υπάρχει ένα τραπέζι.
          - Υπάρχει τραπέζι στο σαλόνι.
          - Υπάρχει ένα τραπέζι στο σαλόνι.
      - id: q5
        prompt: В комнате ничего нет.
        answer:
          - Στο δωμάτιο δεν υπάρχει τίποτα.
          - Δεν υπάρχει τίποτα στο δωμάτιο.
        explanation: Не забудьте δεν — без него фраза неполная.
      - id: q6
        prompt: Аренда — пятьсот евро в месяц.
        answer:
          - Το ενοίκιο είναι πεντακόσια ευρώ τον μήνα.
          - Το ενοίκιο είναι πεντακόσια ευρώ το μήνα.
          - Το ενοίκιο είναι πεντακόσια ευρώ κάθε μήνα.
          - Το ενοίκιο είναι 500 ευρώ τον μήνα.
          - Το ενοίκιο είναι 500 ευρώ το μήνα.
        explanation: «В месяц» — τον μήνα (в разговоре часто το μήνα) или κάθε μήνα.
  - type: explanation
    id: writing-how
    title: Как описать квартиру
    body: |-
      Письменное задание модуля — описание жилья, **40–60 слов**. Это первый тип письма экзамена: дружеский текст или описание. Пишите другу — на «ты»: Γεια σου…, Έλα…, Τα λέμε!

      План: 1) приветствие; 2) где квартира и что рядом (κοντά σε…); 3) сколько и какие комнаты (έχει… / υπάρχουν…); 4) что где находится — два-три предложения с δίπλα σε, πάνω, κάτω, πίσω από; 5) что есть и чего нет; 6) аренда; 7) приглашение и прощание.

      Проверьте себя: в каждом предложении, кроме приветствия, есть глагол (είναι, έχει, υπάρχει, μένω); υπάρχει — при одной вещи, υπάρχουν — при нескольких; στο / στη(ν) — по роду слова; тонос во всех словах из двух и больше слогов. Пишите печатными буквами, не целиком заглавными; имена — придуманные.
  - type: writing
    id: my-flat
    register: friendly
    prompt: "Вы сняли квартиру на Кипре. Напишите сообщение другу или подруге (40–60 слов): где квартира и что рядом, сколько в ней комнат, что где находится, что там есть и чего нет, сколько стоит аренда. Пригласите друга в гости и попрощайтесь."
    words:
      min: 40
      max: 60
    model: Γεια σου, Μαρία! Τώρα μένω σε ένα διαμέρισμα στη Λεμεσό. Είναι κοντά στη θάλασσα. Το διαμέρισμα έχει δύο υπνοδωμάτια, σαλόνι, κουζίνα και μπάνιο. Η κουζίνα είναι δίπλα στο σαλόνι. Το μπάνιο είναι πίσω από την κουζίνα. Στην κουζίνα υπάρχει ένα τραπέζι, αλλά στο σαλόνι δεν υπάρχει τίποτα. Το ενοίκιο είναι εξακόσια ευρώ τον μήνα. Έλα αύριο! Τα λέμε!
    criteria:
      - 40–60 слов; есть приветствие и дружеское прощание (Γεια σου! / Τα λέμε!), обращение на «ты»
      - "Сказано, где квартира: Μένω σε ένα διαμέρισμα στη(ν) … / Είναι κοντά σε …"
      - "Названы комнаты: έχει … или υπάρχουν … (мн. ч.: δύο υπνοδωμάτια)"
      - Не меньше двух предложений о том, что где (δίπλα σε, πάνω, κάτω, πίσω από, μπροστά σε)
      - υπάρχει при одной вещи, υπάρχουν при нескольких; δεν υπάρχει τίποτα — с δεν
      - "σε + артикль по роду: στο σαλόνι, στην κουζίνα, στη Λεμεσό"
      - Тонос во всех словах из двух и больше слогов; печатные буквы, не заглавные; имена придуманные
  - type: explanation
    id: plan
    title: План квартиры
    body: |-
      Это план квартиры Элени (η Ελένη). Верхний ряд — задняя часть квартиры (окна на море), нижний — передняя, со входной дверью. Посмотрите на план и подготовьтесь описать его вслух: какие комнаты есть и что рядом с чем.

      Для монолога пригодятся: **δίπλα σε** (рядом с), **πίσω από** (за), **μπροστά σε / από** (перед), **ανάμεσα σε** (между: ανάμεσα στο σαλόνι και την κουζίνα).
    table:
      columns:
        - часть квартиры
        - слева
        - посередине
        - справа
      rows:
        - - сзади, окна на море
          - υπνοδωμάτιο (τραπέζι κάτω από το παράθυρο)
          - μπάνιο
          - υπνοδωμάτιο (τίποτα)
        - - спереди, вход
          - κουζίνα (τραπέζι)
          - σαλόνι (τηλεόραση)
          - πόρτα
  - type: explanation
    id: speaking-how
    title: Как говорить монолог
    body: |-
      Вторая часть устного экзамена — короткий монолог. Экзаменатор даёт тему или картинку, вы говорите около минуты без подготовки. Главное — не останавливаться: простые предложения лучше, чем паузы в поисках сложного.

      Схема «от общего к частному»: 1) что это — **Αυτό είναι το διαμέρισμα της Ελένης** («Это квартира Элени»; της Ελένης — родительный падеж имени, подробно в модуле 10, пока запомните целиком); 2) сколько комнат — **Έχει…**; 3) обойдите план по порядку, от двери: **Δίπλα στην πόρτα είναι… Πίσω από το σαλόνι είναι…**; 4) что в комнатах есть и чего нет; 5) общее впечатление или где квартира — **Είναι κοντά στη θάλασσα.**

      Запишите монолог, прослушайте и сверьте с критериями. Если споткнулись — запишите ещё раз.
  - type: speaking
    id: plan-monologue
    part: monologue
    prompt: "Опишите план квартиры Элени из блока выше: сколько в ней комнат, какие они, что рядом с чем, что есть в комнатах и чего нет. Говорите около минуты, без подготовки, и запишите ответ."
    seconds: 75
    model: Αυτό είναι το διαμέρισμα της Ελένης. Έχει δύο υπνοδωμάτια, σαλόνι, κουζίνα και μπάνιο. Η πόρτα είναι δίπλα στο σαλόνι. Στο σαλόνι υπάρχει τηλεόραση. Δίπλα στο σαλόνι είναι η κουζίνα, και στην κουζίνα υπάρχει ένα τραπέζι. Πίσω από το σαλόνι είναι το μπάνιο. Το μπάνιο είναι ανάμεσα στα δύο υπνοδωμάτια. Στο ένα υπνοδωμάτιο υπάρχει ένα τραπέζι κάτω από το παράθυρο. Στο άλλο υπνοδωμάτιο δεν υπάρχει τίποτα. Το διαμέρισμα είναι κοντά στη θάλασσα.
    criteria:
      - Говорили около минуты, без долгих пауз
      - "Назвали все комнаты: δύο υπνοδωμάτια, σαλόνι, κουζίνα, μπάνιο"
      - Не меньше трёх предложений о том, что где (δίπλα σε, πίσω από, μπροστά σε, ανάμεσα σε)
      - "Сказали, что есть и чего нет: υπάρχει …, δεν υπάρχει τίποτα"
      - Верные στο / στην по роду (στο σαλόνι, στην κουζίνα); υπάρχει / υπάρχουν по числу
      - Ударение на своём месте (υπνοδωμάτιο, σαλόνι, κουζίνα), μπ в μπάνιο звучит [б]
  - type: exercise
    id: review-yparxei
    title: Повторение — есть, находится, στο
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - υπάρχει
      - υπάρχουν
      - είναι
      - στο
      - στην
      - στη
      - από
      - σε
      - στον
      - τίποτα
    items:
      - id: g1
        prompt: Στο διαμέρισμα ___ δύο μπάνια.
        answer: υπάρχουν
      - id: g2
        prompt: Πού ___ το μπάνιο;
        answer: είναι
      - id: g3
        prompt: Η Άννα είναι ___ κουζίνα.
        answer: στην
      - id: g4
        prompt: Το τραπέζι είναι κάτω ___ το παράθυρο.
        answer: από
      - id: g5
        prompt: Μένω ___ ένα μικρό διαμέρισμα.
        answer: σε
        explanation: Перед ένα — σε отдельно, без артикля.
      - id: g6
        prompt: Στο δωμάτιο δεν υπάρχει ___.
        answer: τίποτα
      - id: g7
        prompt: Η κουζίνα είναι δίπλα ___ σαλόνι.
        answer: στο
      - id: g8
        prompt: Στο σαλόνι ___ μία τηλεόραση.
        answer: υπάρχει
  - type: exercise
    id: review-phrases
    title: Повторение — что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы видите объявление о квартире и звоните хозяину. Как спросить цену?
        options:
          - Πόσο είναι το ενοίκιο;
          - Πού είναι το ενοίκιο;
          - Υπάρχει ενοίκιο;
        answer: Πόσο είναι το ενοίκιο;
      - id: q2
        prompt: Вы хотите посмотреть квартиру.
        options:
          - Μπορώ να δω το σπίτι;
          - Έλα μέσα!
          - Ψάχνω το σπίτι.
        answer: Μπορώ να δω το σπίτι;
      - id: q3
        prompt: Друг пришёл к вам и стоит у двери.
        options:
          - Έλα μέσα!
          - Είναι μέσα.
          - Νοικιάζεται.
        answer: Έλα μέσα!
      - id: q4
        prompt: Вы хотите узнать, где ванная.
        options:
          - Πού είναι το μπάνιο;
          - Υπάρχουν μπάνια;
          - Το μπάνιο είναι δίπλα.
        answer: Πού είναι το μπάνιο;
      - id: q5
        prompt: "Хозяин спрашивает: «Τι ψάχνετε;»"
        options:
          - Ψάχνω ένα διαμέρισμα με δύο δωμάτια.
          - Πληρώνω το ενοίκιο κάθε μήνα.
          - Στο δωμάτιο δεν υπάρχει τίποτα.
        answer: Ψάχνω ένα διαμέρισμα με δύο δωμάτια.
  - type: exercise
    id: review-match
    title: Повторение — где что
    instruction: Соедините русское выражение с греческим. Два греческих лишние.
    format: match
    bank:
      - δίπλα στο σαλόνι
      - κοντά στη θάλασσα
      - πάνω από το τραπέζι
      - πάνω στο τραπέζι
      - πίσω από την πόρτα
      - έξω από το σπίτι
      - μέσα στο σπίτι
      - μπροστά στο παράθυρο
    items:
      - id: m1
        prompt: рядом с гостиной
        answer: δίπλα στο σαλόνι
      - id: m2
        prompt: недалеко от моря
        answer: κοντά στη θάλασσα
      - id: m3
        prompt: на столе
        answer: πάνω στο τραπέζι
      - id: m4
        prompt: над столом
        answer: πάνω από το τραπέζι
      - id: m5
        prompt: за дверью
        answer: πίσω από την πόρτα
      - id: m6
        prompt: снаружи, у дома
        answer: έξω από το σπίτι
