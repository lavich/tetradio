blocks:
  - type: explanation
    id: market
    title: Στη λαϊκή — на рынке
    body: |-
      **Η λαϊκή** (полностью η λαϊκή αγορά) — рынок под открытым небом. Раз в неделю на одной улице ставят прилавки, и крестьяне и торговцы продают фрукты, овощи, яйца, сыр. Там дешевле, чем в супермаркете, и всё свежее. Покупатели часто приходят со своей корзиной — **το καλάθι**.

      **Ο πωλητής** — продавец (женщина — η πωλήτρια), **ο πελάτης** — покупатель, клиент (η πελάτισσα). Продавец **πουλάει** — глагол πουλάω спрягается как μιλάω: πουλάω, πουλάς, πουλάει, πουλάμε, πουλάτε, πουλάνε. Он **ζυγίζει** товар — взвешивает (ζυγίζω, как γράφω).

      Три прилагательных о продуктах: **φρέσκος** — свежий, **ντόπιος** — местный, **ώριμος** — спелый. Они согласуются с существительным (модуль 07): φρέσκο ψωμί, ντόπιες ντομάτες, ώριμο καρπούζι. У φρέσκος в женском роде две формы — φρέσκια и φρέσκη, обе правильные; во мн. ч. — φρέσκες. Мн. ч. среднего рода: **φρέσκα φρούτα**, **ντόπια λαχανικά**.

      Продавец спрашивает: **Κάτι άλλο;** — «Что-нибудь ещё?». Вы отвечаете, что ещё нужно, или **Τίποτα άλλο, ευχαριστώ.** — «Больше ничего, спасибо». Когда что-то подают или дают деньги, говорят **Ορίστε.** — «Вот, пожалуйста».
