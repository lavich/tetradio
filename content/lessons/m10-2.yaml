        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ντόπιες ντομάτες — местные, а супермаркет в Ларнаке.
      - id: q2
        prompt: Οι προσφορές είναι για έναν μήνα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Προσφορές της εβδομάδας — от понедельника до субботы.
      - id: q3
        prompt: Οι φράουλες είναι σε κουτί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Το καρπούζι κάνει πενήντα λεπτά το κιλό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Στο σούπερ μάρκετ πληρώνετε μόνο μετρητά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Με μετρητά ή με κάρτα — можно и так, и так.
      - id: q6
        prompt: Για αγορές πάνω από 40 € παίρνετε ένα μπουκάλι κρασί δώρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: В подарок — большая сумка для покупок (σακούλα), а не вино.
  - type: exercise
    id: pay-match
    title: Вопрос и ответ
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Τίποτα άλλο, ευχαριστώ.
      - Με κάρτα.
      - Ναι, είναι σε προσφορά.
      - Τρία ευρώ το κουτί.
      - Ναι, είναι πολύ γλυκό.
      - Εκεί, δίπλα στην πόρτα.
      - Μένω στη Λάρνακα.
      - Στις οκτώ το πρωί.
    items:
      - id: m1
        prompt: Κάτι άλλο;
        answer: Τίποτα άλλο, ευχαριστώ.
      - id: m2
        prompt: Πληρώνετε με κάρτα ή μετρητά;
        answer: Με κάρτα.
      - id: m3
        prompt: Έχει έκπτωση;
        answer: Ναι, είναι σε προσφορά.
      - id: m4
        prompt: Πόσο κάνουν οι φράουλες;
        answer: Τρία ευρώ το κουτί.
      - id: m5
        prompt: Είναι ώριμο το πεπόνι;
        answer: Ναι, είναι πολύ γλυκό.
      - id: m6
        prompt: Πού είναι το ταμείο;
        answer: Εκεί, δίπλα στην πόρτα.
  - type: explanation
    id: listen-how
    title: Как слушать и делать заметки
    body: |-
      Это задание — как четвёртая часть экзамена по аудированию: вы слушаете разговор и записываете **короткие заметки** — число, цену, одно слово. Полные предложения не нужны. Цены можно писать цифрами (1,80) или словами.

      Перед первым прослушиванием прочитайте все вопросы и подумайте, что вы услышите: цена — ищите ευρώ и λεπτά, количество — κιλό, κιλά. В первый раз поймите ситуацию, во второй — проверьте ответы.

      Продавец и покупательница говорят на «вы». Продавец обращается к ней **κυρία μου** — вежливо, как «сударыня», так часто говорят на рынке. Ловушка: иногда человек называет товар, а потом выясняется, что его нет или покупают другой.
  - type: listening
    id: at-market
    title: Στη λαϊκή
    plays: 2
    transcript:
      - speaker: Σάββας
        text: Καλημέρα σας! Φρέσκα φρούτα, ντόπια λαχανικά! Τι θέλετε, κυρία μου;
      - speaker: Ρένα
        text: Καλημέρα. Πόσο κάνουν οι ντομάτες;
      - speaker: Σάββας
        text: Ένα και ογδόντα το κιλό. Είναι ντόπιες, από την Πάφο.
      - speaker: Ρένα
        text: Ωραία. Ένα κιλό ντομάτες, παρακαλώ. Και δύο πιπεριές.
      - speaker: Σάββας
        text: Ορίστε. Οι πιπεριές κάνουν ένα ευρώ. Κάτι άλλο;
      - speaker: Ρένα
        text: Έχετε φράουλες;
      - speaker: Σάββας
        text: Φράουλες δεν έχω σήμερα, αλλά έχω πολύ ωραία σταφύλια. Κάνουν τρία ευρώ το κιλό.
      - speaker: Ρένα
        text: Τρία ευρώ; Είναι πολύ ακριβά. Έχει έκπτωση;
      - speaker: Σάββας
        text: Για σας, δύο κιλά πέντε ευρώ.
      - speaker: Ρένα
        text: Εντάξει, δύο κιλά. Και ένα καρπούζι. Είναι ώριμο;
      - speaker: Σάββας
        text: Πολύ ώριμο και γλυκό! Αυτό εδώ κάνει δύο ευρώ.
      - speaker: Ρένα
        text: Ωραία. Τίποτα άλλο, ευχαριστώ. Πόσο κάνουν όλα μαζί;
      - speaker: Σάββας
        text: Εννιά και ογδόντα.
      - speaker: Ρένα
        text: Δεν έχω ψιλά. Ορίστε δέκα ευρώ.
      - speaker: Σάββας
        text: Ορίστε τα ρέστα σας, είκοσι λεπτά. Θέλετε σακούλα;
      - speaker: Ρένα
        text: Όχι, ευχαριστώ. Έχω το καλάθι μου.
      - speaker: Σάββας
        text: Ευχαριστώ, κυρία μου! Γεια σας!
  - type: exercise
