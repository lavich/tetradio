  - type: exercise
    id: ad-choice
    about: ad
    title: Покупки по рекламе
    instruction: Прочитайте рекламу и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Сколько на этой неделе стоит килограмм винограда?
        options:
          - 2,40 €
          - 3 €
          - 1,60 €
          - 2,90 €
        answer: 2,40 €
        explanation: 2,40 € το κιλό αντί 3 € — 3 € было раньше.
      - id: q2
        prompt: Какой товар продают «1+1 δώρο»?
        options:
          - йогурт
          - молоко
          - халлуми
          - воду
        answer: йогурт
        explanation: Γιαούρτι, κουτί 1 κιλό — 1+1 δώρο. Берёте две коробки, платите за одну.
      - id: q3
        prompt: Сколько стоит халлуми на этой неделе?
        options:
          - 2,80 €
          - 4 €
          - 2,50 €
          - 6,80 €
        answer: 2,80 €
      - id: q4
        prompt: Вы покупаете 2 кг помидоров и один пакет картошки. Сколько вы платите?
        options:
          - 5,10 €
          - 6,70 €
          - 7,20 €
          - 3,20 €
        answer: 6,70 €
        explanation: Ντομάτες 2 × 1,60 € = 3,20 €, пакет картошки — 3,50 €. Вместе 6,70 €.
      - id: q5
        prompt: Когда супермаркет закрыт?
        options:
          - в воскресенье
          - в субботу
          - в понедельник утром
          - каждый день после 20:00
        answer: в воскресенье
        explanation: Την Κυριακή είμαστε κλειστά. В остальные дни — до 21:00.
  - type: exercise
    id: ad-tf
    about: ad
    title: Верно или неверно
    instruction: Прочитайте рекламу. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
