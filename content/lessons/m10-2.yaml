  - type: explanation
    id: paying
    title: Касса, карта, сдача
    body: |-
      **Το ταμείο** — касса. Кассир спрашивает: **Πληρώνετε με κάρτα ή μετρητά;** — «Вы платите картой или наличными?». Ответ: **Με κάρτα.** или **Μετρητά.** Слово **τα μετρητά** — «наличные» — бывает только во множественном числе и после πληρώνω обычно идёт без предлога: Πληρώνω μετρητά. С картой нужен με: πληρώνω **με** κάρτα.

      Ещё два слова — только во множественном числе: **τα ρέστα** — сдача (Ορίστε τα ρέστα σας. — «Вот ваша сдача») и **τα ψιλά** — мелочь, мелкие деньги (Δεν έχω ψιλά. — «У меня нет мелочи»). Фразу **Κρατήστε τα ρέστα** — «Сдачи не надо» — вы знаете из модуля 09.

      **Η σακούλα** — пакет для покупок; в супермаркете за него обычно платят несколько центов, поэтому кассир спрашивает: Θέλετε σακούλα;
  - type: explanation
    id: ad-how
    title: Как читать рекламу
    body: |-
      **Η τιμή** — цена. **Η έκπτωση** — скидка: έκπτωση 20 % (читается είκοσι τοις εκατό — «двадцать процентов»). Во мн. ч. **οι εκπτώσεις** — ещё и сезон распродаж. **Η προσφορά** — акция, спецпредложение: **Είναι σε προσφορά.** — «Это по акции». Спросить о скидке: **Έχει έκπτωση;** — «Есть скидка?» (έχει здесь значит «есть, имеется», как υπάρχει).

      В рекламе часто пишут **1+1 δώρο** — «второй в подарок» (το δώρο — подарок) и **αντί** — «вместо»: 2 € αντί 3 € — «2 евро вместо 3», то есть старая цена была 3 €.

      Реклама — не рассказ: здесь нет длинных предложений, только названия, меры и цены. Сначала посмотрите на заголовки разделов, потом ищите в них нужный товар. Цена «за килограмм» — **το κιλό**; если товар продают упаковкой, мера стоит рядом: σακούλα 5 κιλά, κουτί 500 γραμμάρια.
  - type: reading
    id: ad
    title: Σούπερ μάρκετ «Ο Κήπος»
    text: |-
      Σούπερ μάρκετ «Ο Κήπος» — Λάρνακα
      Προσφορές της εβδομάδας: από Δευτέρα 12 έως Σάββατο 17 Οκτωβρίου

      Φρούτα και λαχανικά
      Ντόπιες ντομάτες — 1,60 € το κιλό
      Πατάτες Κύπρου, σακούλα 5 κιλά — 3,50 €
      Φρέσκες φράουλες, κουτί 500 γραμμάρια — 2,90 €
      Καρπούζι — 0,50 € το κιλό
      Σταφύλια — 2,40 € το κιλό αντί 3 €

      Γαλακτοκομικά
      Φρέσκο γάλα, 1 λίτρο — 1,40 €
      Γιαούρτι, κουτί 1 κιλό — 1+1 δώρο
      Χαλλούμι, 250 γραμμάρια — 2,80 € αντί 4 €

      Ποτά
      Νερό, 6 μπουκάλια του ενός λίτρου — 2,40 €
      Ντόπιο κρασί, μπουκάλι — 6,50 €

      Για αγορές πάνω από 40 €: δώρο μια μεγάλη σακούλα για τα ψώνια!
      Πληρώνετε με μετρητά ή με κάρτα.
      Ανοιχτά Δευτέρα – Σάββατο, 8:00 – 21:00. Την Κυριακή είμαστε κλειστά.

      «Ο Κήπος» — το σούπερ μάρκετ της γειτονιάς σας!
    glosses:
      - text: Ο Κήπος
        russian: «Сад» (название магазина)
      - text: έως
        russian: до, по
      - text: Πατάτες Κύπρου
        russian: кипрский картофель (Κύπρου — родительный падеж, «Кипра»)
      - text: Γαλακτοκομικά
        russian: молочные продукты
      - text: 1+1 δώρο
        russian: второй в подарок
      - text: Ποτά
        russian: напитки
      - text: του ενός λίτρου
        russian: по одному литру
      - text: αγορές
