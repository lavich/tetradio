  - type: explanation
    id: listening-how
    title: Ответы о мотивации на слух
    body: |-
      Когда кандидатов спрашивают о мотивации, они называют причину, а затем планы. Причины звучат после слов вроде **What drew me to you is…**, **Your mission resonates with me**, **because**; планы — после **I'm going to…**, **I'm starting… in…**, **I might…**. Слушайте, какую форму выбирает говорящий: она показывает, насколько план твёрдый.

      Послушайте, как Sarah разговаривает с двумя кандидатами, Nadia и Ethan, в конце дня собеседований. Сначала целиком, затем ответьте на вопросы, проверяя себя при втором прослушивании. Транскрипт открывается после ответа.
  - type: listening
    id: motivation
    title: Two candidates, one question
    plays: 2
    transcript:
      - { speaker: Sarah, text: "Thank you both for staying until the end of the day. I have a few questions for each of you. Nadia, why do you want to join Brightlane?" }
      - { speaker: Nadia, text: "Honestly, the product is what drew me to you. I've used it for two years in my brother's shop, and I'd like to work on something with real impact. I'm also looking for a team that invests in its engineers." }
      - { speaker: Sarah, text: "Thank you. Ethan, the same question." }
      - { speaker: Ethan, text: "Your mission resonates with me. I'm leaving my current company because I've outgrown my role, but I'm leaving on good terms. At Brightlane, I'm going to learn a lot from the senior engineers, and I think I'd be a good fit for the team." }
      - { speaker: Sarah, text: "Nadia, where do you see yourself in five years?" }
      - { speaker: Nadia, text: "In five years, I see myself as a tech lead. Next year, I'm going to focus on system design, and I'm starting a part-time master's degree in September. I might consider a management track later, but I'm not sure yet." }
      - { speaker: Sarah, text: "And you, Ethan?" }
      - { speaker: Ethan, text: "I'm planning to move into a lead role too, but I might also try data engineering. It depends on the projects. This autumn, I'm taking a course on distributed systems, so I'll have a good base." }
      - { speaker: Sarah, text: "What are you going to do in your first month?" }
      - { speaker: Nadia, text: "I'll read the code and ask a lot of questions. I'll also try to ship a small change in my first week." }
      - { speaker: Ethan, text: "I'm going to meet the whole team first. After that, I'll choose a small task together with my manager." }
      - { speaker: Sarah, text: "Thank you both. We will send you our decision by Friday." }
  - type: exercise
    id: motivation-q
    about: motivation
    title: Что рассказали кандидаты
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What drew Nadia to Brightlane?
        options: [the product, the salary, the office]
        answer: the product
      - id: q2
        prompt: Why is Ethan leaving his current company?
        options:
          - He has outgrown his role.
          - The company is closing.
          - He was laid off.
        answer: He has outgrown his role.
        explanation: I've outgrown my role — Ethan перерос свою роль и уходит в хороших отношениях.
      - id: q3
        prompt: What is Nadia starting in September?
        options:
          - a part-time master's degree
          - a new job at Brightlane
          - a course on distributed systems
        answer: a part-time master's degree
      - id: q4
        prompt: What is Ethan taking this autumn?
        options:
          - a course on distributed systems
          - a part-time master's degree
          - a course on management
        answer: a course on distributed systems
      - id: q5
        prompt: What does Nadia say about a management track?
        options:
          - She might consider it later.
          - She is going to start it next year.
          - She has already decided against it.
        answer: She might consider it later.
        explanation: I might consider a management track later, but I'm not sure yet — решение не принято.
      - id: q6
        prompt: What is Ethan going to do first at Brightlane?
        options: [meet the whole team, read the code, ship a small change]
        answer: meet the whole team
      - id: q7
        prompt: When will the candidates get the decision?
        options: [by Friday, on Monday, in September]
        answer: by Friday
