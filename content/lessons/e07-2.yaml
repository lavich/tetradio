blocks:
  - type: explanation
    id: company-words
    title: Слова о культуре и продукте компании
    body: |-
      Страница о компании и вакансия описывают одно и то же с разных сторон. Слова урока образуют три группы.

      **Культура.** **Transparent** — компания делится информацией и решениями, **inclusive** — людям с разным опытом комфортно работать, **supportive** — руководитель и команда помогают, **a flat hierarchy** — между сотрудником и руководством мало уровней, **bureaucratic** — много согласований и формальностей, **a blameless culture** — после сбоя разбирают причины и не ищут виновного, **a core value** — принцип, на котором компания строит решения, **work-life balance** — хватает времени и на работу, и на личную жизнь.

      **Продукт и роль.** **Product-led** — решения исходят из продукта и его пользователей, **customer-facing** — роль с прямым общением с клиентами, **greenfield** — новый проект без старого кода, **a nice-to-have** — желательное, но не обязательное требование, **hands-on** — практический опыт, **well-established** — компания с долгой историей, **mission-driven** — компания работает ради миссии.

      **Ваша мотивация.** **Make an impact** — давать заметный результат, **resonate with** — идеи компании находят у вас отклик, **be drawn to** — компания вас привлекает.
