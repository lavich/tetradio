  - type: explanation
    id: reading-how
    title: Как читать вакансию и страницу о компании
    body: |-
      Вакансия отвечает на три вопроса: чем вы будете заниматься, что нужно уметь и что компания предлагает. Страница о компании отвечает на другие: зачем она существует, как работает команда и куда движется. Читая, отмечайте слова, которые повторяются в обоих текстах, потому что на собеседовании по ним проверяют, совпадают ли ваши цели с целями компании.

      Планы компании записывают теми же формами, что и ваши: **We are starting a new service in September** (договорённость со временем), **We are going to hire twenty engineers** (решённый план), **We will invite selected candidates to a call** (обещание). Требования часто идут списком без глаголов: **Five or more years of backend experience.** Слово **preferably** означает «желательно».

      Названия технологий (*Go, Kotlin*) не переводятся. Слова вне списков переведены под текстом.
  - type: reading
    id: job
    title: "Senior Backend Engineer, Brightlane"
    text: |-
      Senior Backend Engineer, Brightlane

      About us

      Brightlane builds payment software for small online shops. Our product is used by more than 20,000 merchants in Europe. We are a product-led company with a flat hierarchy, and our engineers talk to customers every month.

      The role

      You will join the Payments team of eight engineers. You are going to design and build new features for our API and work closely with product managers. This is a greenfield project: we are starting a new service for recurring payments in September.

      What we are looking for

      - Five or more years of backend experience, preferably in Go or Kotlin
      - Hands-on experience with distributed systems and message queues
      - Clear communication in English
      - Nice-to-have: experience with payment providers

      What we offer

      - A growth path from senior engineer to tech lead or staff engineer, with a performance review every six months
      - Internal mobility: you can move to another team after two years
      - Hybrid work: two days a week in the office in Lisbon
      - 25 days of holiday and a learning budget of 1,500 euros a year

      How to apply

      Send your CV and a short cover letter by 15 June. We will invite selected candidates to a first call in the following week.
    glosses:
      - { text: merchants, russian: "продавцы, владельцы магазинов" }
      - { text: recurring payments, russian: "регулярные платежи по подписке" }
      - { text: preferably, russian: желательно }
      - { text: staff engineer, russian: "инженер уровня выше senior" }
      - { text: Hybrid, russian: "гибридный график: часть дней в офисе" }
      - { text: holiday, russian: отпуск }
      - { text: learning budget, russian: "бюджет на обучение" }
      - { text: selected, russian: отобранных }
  - type: exercise
