      - id: q2
        prompt: The Payments team has twelve engineers.
        options: ["True", "False"]
        answer: "False"
        explanation: You will join the Payments team of eight engineers — в команде восемь инженеров.
      - id: q3
        prompt: The new service for recurring payments is a greenfield project.
        options: ["True", "False"]
        answer: "True"
      - id: q4
        prompt: Experience with payment providers is required.
        options: ["True", "False"]
        answer: "False"
        explanation: Nice-to-have — желательное, но не обязательное требование.
      - id: q5
        prompt: There is a performance review every year.
        options: ["True", "False"]
        answer: "False"
        explanation: A performance review every six months — оценка раз в полгода.
      - id: q6
        prompt: Engineers can move to another team after two years.
        options: ["True", "False"]
        answer: "True"
  - type: exercise
    id: job-find
    about: job
    title: Где это сказано
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What will the engineer work on?
        options:
          - a new service for recurring payments
          - the mobile app
          - the office network
        answer: a new service for recurring payments
      - id: q2
        prompt: Which programming languages does the ad prefer?
        options: [Go or Kotlin, Python or Ruby, Java or C#]
        answer: Go or Kotlin
        explanation: Слово preferably означает «желательно».
      - id: q3
        prompt: How many days a week do employees work in the office?
        options: [two, three, five]
        answer: two
      - id: q4
        prompt: How big is the learning budget?
        options: ["1,500 euros a year", "25 euros a day", "1,500 euros a month"]
        answer: 1,500 euros a year
      - id: q5
        prompt: What is the deadline to send the CV?
        options: [15 June, 15 September, the following week]
        answer: 15 June
      - id: q6
        prompt: What should candidates send?
        options:
          - a CV and a short cover letter
          - a CV and a code sample
          - a portfolio only
        answer: a CV and a short cover letter
  - type: exercise
    id: job-grammar
    about: job
    title: Будущее в тексте
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "«We are starting a new service for recurring payments in September.» Какой формой выражено будущее?"
        options: [present continuous, will, might]
        answer: present continuous
        explanation: Are starting и время in September — договорённость со временем.
      - id: q2
        prompt: "«You are going to design and build new features.» Что выражает going to?"
        options:
          - запланированную работу
          - возможность
          - обещание кандидату
        answer: запланированную работу
        explanation: Going to передаёт решённый план.
      - id: q3
        prompt: Какое предложение из вакансии говорит о будущем?
        options:
          - We are starting a new service in September.
          - Brightlane builds payment software for small online shops.
          - Our product is used by more than 20,000 merchants in Europe.
        answer: We are starting a new service in September.
        explanation: Остальные предложения описывают настоящее.
      - id: q4
        prompt: Как переписать «You will join the Payments team» с going to?
        options:
          - You are going to join the Payments team.
          - You are going join the Payments team.
          - You will going to join the Payments team.
        answer: You are going to join the Payments team.
        explanation: Нужны форма be и to после going.
  - type: reading
    id: about
    title: "Why Brightlane"
    text: |-
      Why Brightlane

      Our mission

      We help small shops get paid without friction. Every decision starts with one question: does this make life easier for a shopkeeper?

      How we work

      We are transparent: salaries, the roadmap and incident reports are open to everybody in the company. Our team is inclusive and supportive, and when something goes wrong, we hold a blameless review. Releases are small and frequent, so most engineers ship to production in their first week.

      Where we are going

      Brightlane is a well-established company with 120 employees. Next year, we are going to open a second office and start a new product for invoices. Our staff turnover is below 8%, which says a lot about how people feel here.

      What people say

      "I joined Brightlane because I wanted to see the result of my work every day." — Paulo, backend engineer

      "The work is demanding, but I have a lot of autonomy." — Hanna, platform engineer
    glosses:
      - { text: without friction, russian: "без лишних сложностей" }
      - { text: shopkeeper, russian: "владелец магазина" }
      - { text: incident reports, russian: "отчёты о сбоях" }
      - { text: a blameless review, russian: "разбор без поиска виноватых" }
      - { text: ship to production, russian: "выпускать изменения в рабочую систему" }
      - { text: invoices, russian: счета }
