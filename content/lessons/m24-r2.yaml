title: "Слабый навык: письмо и речь"
kind: lesson
items: []
blocks:
  - type: explanation
    id: self-check
    title: Как проверять себя без преподавателя
    body: |-
      Это последнее занятие курса — письмо и речь. Новых тем нет.

      **Это самопроверка, а не оценка экзаменатора.** На экзамене письмо и речь оценивают экзаменаторы ΚΕΓ по своей шкале (письмо: часть A — 12 баллов, часть B — 13). Критерии курса — ориентир: выполнены ли все пункты задания, объём, обращение и регистр, грамматика, орфография. Ниже 60 % критериев — навык под угрозой. Если есть возможность, покажите письма и записи речи преподавателю или носителю языка.

      **Как проверять письмо.** Сначала напишите текст целиком, не заглядывая в образец. Посчитайте слова (приложение считает по пробелам). Потом откройте критерии и отмечайте только то, что выполнено полностью: если в задании пять пунктов, а в письме четыре, критерий «все пункты» не выполнен. Подчеркните каждую ошибку и найдите её в таблице типичных ошибок ниже. Образец читайте последним — как один из возможных ответов, а не как единственно верный.

      **Как проверять речь.** Запишите ответ без подготовки, как на экзамене. Прослушайте запись один раз целиком, потом с критериями. Отметьте паузы длиннее 3–4 секунд и места, где вы перешли на русский или замолчали. Потом запишите тот же ответ второй раз — вторая запись почти всегда лучше, и это тоже тренировка.

      **Как пройти занятие.** Всё в одно занятие не помещается, поэтому выберите маршрут по своим результатам M1–M3:

      - **слабое письмо** — объяснения, упражнение на ошибки, оба письма подряд за 45 минут, как на экзамене; из речи — по одной записи каждой части;
      - **слабая речь** — объяснения, упражнение, одно письмо (часть B) за 20 минут; потом все три части речи, каждую дважды: запись, проверка, вторая запись;
      - **оба навыка в порядке** — быстрая репетиция: упражнение, одно письмо за 20 минут и три части речи по одной записи.
  - type: explanation
    id: errors
    title: Типичные ошибки русскоговорящих на A2
    body: |-
      Эти ошибки повторяются в письмах и в речи чаще всего. Проверяйте по этому списку каждый свой текст.

      - **Артикль.** В русском артиклей нет, поэтому их пропускают. В греческом артикль есть почти всегда, даже с именами и городами: ο Νίκος, η Κύπρος, στη Λεμεσό, κοντά στη θάλασσα.
      - **Буква ν у την.** Остаётся перед гласной и перед κ, π, τ, ξ, ψ (и μπ, ντ, γκ, τσ, τζ): την Άννα, την Κυριακή, την Τρίτη. Перед остальными согласными не пишется: τη Μαρία, στη Λεμεσό. У **τον** и **έναν** в курсе пишем ν всегда: τον φίλο, έναν καφέ. Традиционное написание без ν перед остальными согласными (το φίλο, ένα γιο) тоже правильное и тоже засчитывается.
      - **Ударение.** Тонос ставится в каждом слове из двух и больше слогов: καλημέρα, είναι, ευχαριστώ. Односложные слова — без тоноса (και, να, θα, για, με), кроме ή («или») и вопросительных πού и πώς: Πού μένεις; — но Μένω στο σπίτι που… Второй тонос — когда ударение на третьем слоге от конца и после слова идёт μου, σου, του…: το όνομά μου, η διεύθυνσή σας.
      - **Конечное ς.** В именительном падеже мужского рода ς есть, в винительном — нет: ο φίλος — τον φίλο, ο καφές — τον καφέ. В конце слова пишется ς, внутри — σ.
      - **Окончание глагола.** Окончание показывает лицо, и местоимение часто не нужно: θέλω, θέλεις, θέλει, θέλουμε. После να — то же лицо, что у главного глагола: θέλω να πάω (я хочу пойти), а не θέλω να πάει (я хочу, чтобы он пошёл). Время — по слову рядом: χθες — аорист, αύριο — θα.
      - **Регистр.** Другу — на «ты» (εσύ): Τι κάνεις; Μπορείς; Официальное письмо и незнакомый человек — на «вы» (εσείς): Τι κάνετε; Μπορείτε; Θα μπορούσατε…; Не смешивайте в одном тексте: если начали с σας, то до конца σας.
      - **Обращение и прощание.** Другу: Γεια σου, Νίκο! / Αγαπητή Μαρία, … Φιλιά, / Τα λέμε, + имя. Официально: Αξιότιμε κύριε Γεωργίου, / Αξιότιμη κυρία Πέτρου, … Με εκτίμηση, + имя и фамилия. Обращение — в звательном падеже: κύριε Χαραλαμπίδη (ο Χαραλαμπίδης), κύριε Παπαδόπουλε (ο Παπαδόπουλος); фамилии на -ου не меняются.
    table:
      columns:
        - ошибка
        - неверно
        - верно
      rows:
        - - нет артикля
          - Μένω κοντά σε θάλασσα.
          - Μένω κοντά στη θάλασσα.
        - - нет ν перед гласной
          - Είδα τη Άννα.
          - Είδα την Άννα.
        - - нет ς / лишнее ς
          - Ο φίλο μου περιμένει τον Νίκος.
          - Ο φίλος μου περιμένει τον Νίκο.
        - - не то лицо после να
          - Θέλω να πάει στην Πάφο. (о себе)
          - Θέλω να πάω στην Πάφο.
        - - смешан регистр
          - Αξιότιμε κύριε Γεωργίου, … Πώς είσαι;
          - Αξιότιμε κύριε Γεωργίου, … Πώς είστε;
  - type: exercise
    id: errors-choice
    title: Найдите правильный вариант
    instruction: Выберите вариант без ошибки.
    format: choice
    items:
      - id: q1
        prompt: Письмо директору фирмы, господину Андреу. Начало письма —
        options:
          - Γεια σου, κύριε Ανδρέου!
          - Αξιότιμε κύριε Ανδρέου,
          - Αξιότιμη κύριε Ανδρέου,
        answer: Αξιότιμε κύριε Ανδρέου,
        explanation: "Официальное письмо мужчине — Αξιότιμε κύριε…, с запятой. Αξιότιμη — женская форма, для κυρία. Γεια σου — на «ты», в официальном письме не подходит."
      - id: q2
        prompt: Το Σάββατο θα δω ___ Άννα.
        options:
          - την
          - τη
          - τον
        answer: την
        explanation: "Перед гласной ν остаётся: την Άννα. Τον — мужской род, а Άννα — женское имя."
      - id: q3
        prompt: Θα σε δω ___ Τρίτη στις έξι.
        options:
          - τη
          - την
          - το
        answer: την
        explanation: "Перед τ буква ν остаётся: την Τρίτη, как и την Κυριακή, την Πέμπτη. Без ν — τη Δευτέρα, τη Μαρία."
      - id: q4
        prompt: Χθες είδα ___ στο κέντρο.
        options:
          - τον Πέτρος
          - τον Πέτρο
          - ο Πέτρος
        answer: τον Πέτρο
        explanation: "После είδα — винительный падеж: τον Πέτρο, без ς. Ο Πέτρος — именительный: Ο Πέτρος είναι εδώ."
      - id: q5
        prompt: Αύριο εγώ και η Μαρία ___ στην Πάφο.
        options:
          - θα πάει
          - θα πάνε
          - θα πάμε
        answer: θα πάμε
        explanation: "Εγώ και η Μαρία — это «мы», значит, окончание -με: θα πάμε. Θα πάει — он или она, θα πάνε — они."
      - id: q6
        prompt: Χθες το βράδυ ___ μια ωραία ταινία.
        options:
          - βλέπω
          - είδα
          - θα δω
        answer: είδα
        explanation: "Χθες — одно законченное действие в прошлом, аорист: είδα (βλέπω → είδα, модуль 15)."
      - id: q7
        prompt: Письмо в банк. Просьба —
        options:
          - Θα μπορούσατε να μου στείλετε το έντυπο;
          - Μπορείς να μου στείλεις το έντυπο;
          - Στείλε μου το έντυπο.
        answer: Θα μπορούσατε να μου στείλετε το έντυπο;
        explanation: "В официальном письме — на «вы» и вежливо: Θα μπορούσατε να…; (модуль 23). Μπορείς — на «ты», Στείλε μου — повелительное наклонение на «ты», так пишут другу."
      - id: q8
        prompt: Конец письма на «вы» —
        options:
          - Σε ευχαριστώ για την απάντησή σας.
          - Σας ευχαριστώ για την απάντησή σου.
          - Σας ευχαριστώ για την απάντησή σας.
        answer: Σας ευχαριστώ για την απάντησή σας.
        explanation: "В одной фразе один регистр: σας… σας. В двух других вариантах «ты» и «вы» смешаны (σε… σας, σας… σου)."
      - id: q9
        prompt: Конец письма подруге —
        options:
          - Με εκτίμηση, Λένα
          - Φιλιά, Λένα
          - Σας ευχαριστώ εκ των προτέρων. Λένα
        answer: Φιλιά, Λένα
        explanation: "Подруге — Φιλιά, или Τα λέμε,. Με εκτίμηση и Σας ευχαριστώ εκ των προτέρων — концовки официального письма на «вы»."
  - type: explanation
    id: writing-time
    title: Письмо — план на 45 минут
    body: |-
      На экзамене два текста по 80–100 слов за 45 минут: A — дружеский, B — менее дружеский, ближе к официальному. Время распределяйте заранее, иначе второе письмо останется недописанным, а ненаписанный текст — это ноль баллов. Лучше два письма по 80 слов, чем одно идеальное.

      **Перед каждым письмом — 3 минуты на план.** Подчеркните в задании каждый пункт и пронумеруйте их: обычно их 4–6, и каждый должен быть в письме. Решите регистр: кому пишете — на «ты» или на «вы». Выпишите для каждого пункта 2–3 греческих слова и глаголы в нужном времени. Пишите только тем, что знаете: простое верное предложение лучше сложного с ошибками.

      **Объём.** Меньше 80 слов — не все пункты раскрыты; намного больше 100 — больше места для ошибок. Строка от руки — примерно 8–10 слов: посчитайте строки, не каждое слово.

      **Последние 2 минуты — проверка по списку:** все пункты на месте; обращение и прощание; один регистр; артикли и ν; ς в конце; тонос; окончания глаголов. Подпишитесь вымышленным именем и пишите строчными печатными буквами, как требует экзамен.
    table:
      columns:
        - минуты
        - что делать
      rows:
        - - 0–2
          - прочитать оба задания, подчеркнуть пункты
        - - 2–20
          - "письмо A: план 3 мин, текст 12 мин, проверка 3 мин"
        - - 20–43
          - "письмо B: план 3 мин, текст 16 мин, проверка 4 мин (оно стоит 13 баллов)"
        - - 43–45
          - "общая проверка: подписи, объём, ν, ς, тонос"
  - type: writing
    id: new-city
    register: friendly
    prompt: |-
      Письмо, часть A (дружеский текст). Ваш друг Ставрос (Σταύρος) из Греции пишет: «Βρήκα δουλειά στη Λεμεσό, και τον Σεπτέμβριο έρχομαι στην Κύπρο! Ψάχνω διαμέρισμα. Ποια περιοχή μου προτείνεις; Πώς θα πηγαίνω στη δουλειά χωρίς αυτοκίνητο;»

      Ответьте ему, 80–100 слов: порадуйтесь за него; посоветуйте район и назовите две причины; сколько примерно стоит аренда; как добираться без машины — два совета в повелительном наклонении и одно сравнение; предложите помощь и назовите день; спросите, когда он приезжает.
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Σταύρο!

      Μπράβο για την καινούργια σου δουλειά! Θα χαρώ πολύ αν έρθεις στη Λεμεσό. Σου προτείνω να ψάξεις διαμέρισμα κοντά στη θάλασσα. Η περιοχή είναι ήσυχη, και υπάρχουν πολλά μαγαζιά και ένα μεγάλο πάρκο. Το ενοίκιο για ένα μικρό διαμέρισμα είναι περίπου επτακόσια ευρώ τον μήνα. Χωρίς αυτοκίνητο δεν είναι δύσκολο: πάρε το λεωφορείο ή αγόρασε ένα ποδήλατο. Με το ποδήλατο πας πιο γρήγορα, γιατί το πρωί έχει πολλή κίνηση. Αν θέλεις, το πρώτο Σάββατο θα έρθω μαζί σου να δούμε διαμερίσματα. Πότε φτάνεις;

      Τα λέμε,
      Νατάσα
    criteria:
      - 80–100 слов; обращение и прощание на «ты» (Γεια σου, Σταύρο! … Τα λέμε,), подпись вымышленным именем
      - "Все шесть пунктов задания: радость, район и две причины, аренда, транспорт, помощь с днём, вопрос о приезде"
      - "Совет — να + форма от аориста: Σου προτείνω να ψάξεις… (модуль 16); два повелительных: πάρε, αγόρασε (модули 12, 18)"
      - "Υπάρχουν + множественное число: υπάρχουν πολλά μαγαζιά (модуль 06)"
      - "Сравнение и причина: πιο γρήγορα, γιατί… (модули 20, 21)"
      - "Условие и будущее: Αν θέλεις, … θα έρθω (модули 19, 21)"
      - "Цена без ошибок: επτακόσια ευρώ τον μήνα (или 700 ευρώ)"
      - Артикли (στη θάλασσα, το λεωφορείο), конечное ς, тонос во всех словах из двух и больше слогов
  - type: writing
    id: leave-request
    register: formal
    prompt: |-
      Письмо, часть B (менее дружеский, ближе к официальному текст). Вы работаете бухгалтером в фирме. В июне к вам впервые приезжают родители из России, и вы хотите взять неделю отпуска — с 15 по 19 июня.

      Напишите директору, господину Хараламбидису (ο κύριος Χαραλαμπίδης), 80–100 слов: зачем вы пишете и на какие даты; причина; что вы сделаете с работой до отпуска; кто из коллег поможет в эти дни; что вы предлагаете, если эта неделя неудобна для фирмы; поблагодарите и попросите ответить. Обращение и прощание — как в официальном письме. Подпишитесь вымышленным именем.
    words:
      min: 80
      max: 100
    model: |-
      Αξιότιμε κύριε Χαραλαμπίδη,

      Σας γράφω για να ρωτήσω αν μπορώ να πάρω άδεια μία εβδομάδα τον Ιούνιο, από τις δεκαπέντε μέχρι τις δεκαεννέα Ιουνίου. Οι γονείς μου θα έρθουν από τη Ρωσία για πρώτη φορά, και θα ήθελα να τους δείξω την Κύπρο. Πριν από την άδεια θα τελειώσω όλη τη δουλειά μου. Εκείνη την εβδομάδα η συνάδελφός μου, η κυρία Νικολάου, μπορεί να απαντάει στα email μου. Αν αυτή η εβδομάδα δεν είναι καλή για την εταιρεία, μπορώ να πάρω άδεια τον Ιούλιο. Σας ευχαριστώ εκ των προτέρων και περιμένω την απάντησή σας.

      Με εκτίμηση,
      Όλγα Μιρόνοβα
    criteria:
      - "80–100 слов; официальное обращение с запятой — Αξιότιμε κύριε Χαραλαμπίδη, (у фамилии на -ης звательная форма на -η) — и прощание Με εκτίμηση,"
      - Всё письмо на «вы» (Σας γράφω, Σας ευχαριστώ, την απάντησή σας) — ни одного σου или Γεια σου
      - "Цель в первом предложении: Σας γράφω για να ρωτήσω αν… (модуль 23); даты: από τις δεκαπέντε μέχρι τις δεκαεννέα Ιουνίου (месяц в родительном падеже)"
      - "Причина в будущем: θα έρθουν…, και θα ήθελα να τους δείξω… (слабое местоимение τους — модуль 17)"
      - "Однократное и повторяющееся: θα τελειώσω (один раз), μπορεί να απαντάει (регулярно — от основы настоящего, модули 16, 19)"
      - "Запасной вариант с αν: Αν αυτή η εβδομάδα δεν είναι καλή…, μπορώ να… (модуль 21)"
      - "Концовка: Σας ευχαριστώ εκ των προτέρων και περιμένω την απάντησή σας (модуль 16)"
      - Подпись вымышленным именем; артикли (τη Ρωσία, την Κύπρο, τον Ιούνιο), тонос во всех словах из двух и больше слогов
  - type: explanation
    id: speaking-how
    title: Речь — как не замолчать
    body: |-
      Устный экзамен идёт около 12 минут на пару кандидатов и записывается. Подготовки нет; только в части C есть примерно 2 минуты, чтобы прочитать роль.

      - **Часть A — вопросы о себе.** Отвечайте двумя-тремя предложениями, не одним словом: ответ + подробность (когда, с кем, где) + причина (γιατί…). Экзаменатор спрашивает на «вы» (Πού μένετε;), а вы отвечаете о себе: Μένω…
      - **Часть B — монолог.** Держите в голове простой план: что и где сейчас → как было раньше (παρατατικός или аорист) → что нравится и почему → сравнение (πιο … από) → планы (θα). Пять шагов по 2–3 предложения — это и есть полторы минуты.
      - **Часть C — ролевая игра.** Поздоровайтесь, задайте свои 2–3 вопроса, отвечайте на реплики партнёра, попрощайтесь. Слушайте партнёра: ответ на его вопрос важнее, чем ваш заготовленный текст.

      **Если пауза.** Молчание хуже простой фразы. Выиграть секунду помогают слова-«заполнители»: Λοιπόν… (итак, ну…), Να σας πω… (скажу вам…), Ένα λεπτό… (минутку). Забыли слово — не останавливайтесь и скажите иначе: «το πράγμα για…» (вещь для…), «σαν…» (как…), «δεν θυμάμαι τη λέξη, αλλά…». Не поняли вопрос — это нормально и не стоит баллов: Μπορείτε να το επαναλάβετε, παρακαλώ; Πιο αργά, παρακαλώ. Τι σημαίνει…;

      **Не переходите на русский и английский** и не переводите в голове длинную русскую фразу: начните с того, что можете сказать по-гречески.
  - type: speaking
    id: interview
    part: interview
    prompt: |-
      Речь, часть A. Экзаменатор задаёт вопросы на «вы». Прочитайте каждый вопрос вслух, ответьте без подготовки двумя-тремя предложениями и запишите ответы:
      Μιλάτε και άλλες ξένες γλώσσες; Έχετε αδέλφια; Πού μένουν; Τι κάνατε χθες το βράδυ; Πού ψωνίζετε συνήθως; Ποια πόλη της Κύπρου σας αρέσει περισσότερο και γιατί; Τι θα κάνετε την επόμενη Κυριακή;
    seconds: 120
    model: Μιλάω ρωσικά, αγγλικά και λίγο ελληνικά. Τα αγγλικά τα έμαθα στο σχολείο. Έχω έναν αδελφό. Είναι μηχανικός και μένει στη Μόσχα με τη γυναίκα του και τα δύο παιδιά τους. Χθες το βράδυ μαγείρεψα, φάγαμε με τον άντρα μου και μετά είδαμε μια ταινία. Συνήθως ψωνίζω στο σούπερ μάρκετ κοντά στο σπίτι, αλλά φρούτα αγοράζω στη λαϊκή, γιατί είναι πιο φτηνά. Μου αρέσει περισσότερο η Πάφος, γιατί έχει ωραίες παραλίες και πολλά αξιοθέατα. Την επόμενη Κυριακή θα πάμε με φίλους στο βουνό, αν κάνει καλό καιρό.
    criteria:
      - Ответили на все семь вопросов, каждый — двумя-тремя предложениями, с подробностью (с кем, где, когда)
      - "Формы о себе: μιλάω, έχω, ψωνίζω, μαγείρεψα, θα πάμε — а не μιλάτε, κάνατε (так спрашивает экзаменатор)"
      - "Время по вопросу: аорист о вчерашнем вечере (μαγείρεψα, φάγαμε, είδαμε — модули 14, 15), будущее о воскресенье (θα πάμε — модуль 19), настоящее о привычках"
      - "Причина и сравнение: γιατί είναι πιο φτηνά, μου αρέσει περισσότερο (модуль 20)"
      - "Падежи: έχω έναν αδελφό, με τη γυναίκα του (винительный после έχω и με)"
      - Без пауз дольше 3–4 секунд; если слово забылось — сказали иначе, не по-русски
  - type: speaking
    id: good-friend
    part: monologue
    prompt: |-
      Речь, часть B. Экзаменатор говорит: «Μιλήστε μας για έναν καλό φίλο ή μια καλή φίλη σας.» (Μιλήστε μας — «расскажите нам».)
      Говорите около полутора минут без подготовки: кто это и как давно вы знакомы; как было раньше — два-три предложения в παρατατικός; где этот человек живёт и что делает сейчас; что вы делаете вместе; одно сравнение (πιο … από); почему это хороший друг. Запишите ответ.
    seconds: 90
    model: Η καλύτερη φίλη μου λέγεται Κάτια. Είμαστε φίλες από το σχολείο, εδώ και είκοσι χρόνια. Τότε μέναμε στον ίδιο δρόμο στη Μόσχα, και κάθε πρωί πηγαίναμε μαζί στο σχολείο. Το καλοκαίρι παίζαμε όλη μέρα στο πάρκο. Τώρα η Κάτια μένει στη Λευκωσία και δουλεύει σε ένα ξενοδοχείο. Είναι πιο ήσυχη από μένα, αλλά είναι πολύ φιλική με όλους. Βρισκόμαστε κάθε Σάββατο για καφέ, και μερικές φορές πάμε μαζί στη θάλασσα. Πέρσι ταξιδέψαμε μαζί στην Κρήτη. Είναι πολύ καλή φίλη, γιατί πάντα με ακούει, όταν έχω ένα πρόβλημα.
    criteria:
      - Говорили около полутора минут, без долгих пауз; прошли все пункты плана
      - "Как давно — εδώ και + настоящее время: Είμαστε φίλες… εδώ και είκοσι χρόνια (модуль 16)"
      - "Прошлое как привычка и фон — παρατατικός: μέναμε, πηγαίναμε, παίζαμε (модуль 22); одно событие — аорист: ταξιδέψαμε (модуль 14)"
      - "Сравнение: πιο ήσυχη από μένα (πιο … από, модуль 20)"
      - "Как часто: κάθε Σάββατο, μερικές φορές, πάντα (модуль 05)"
      - "Причина и слабое местоимение: γιατί πάντα με ακούει (модули 17, 21)"
  - type: speaking
    id: taxi
    part: roleplay
    prompt: |-
      Речь, часть C — ролевая игра. На экзамене её играют два кандидата; у вас есть около 2 минут, чтобы прочитать роль. Прочитайте обе роли. Сыграйте вслух сначала роль А, произнося и реплики Б, потом поменяйтесь ролями: сыграйте роль Б, а реплики пассажира скажите по-своему, другими словами. Говорите на «вы» и запишите обе версии.

      Роль А — пассажир. Вы прилетели в аэропорт Ларнаки, у вас два чемодана. Вам нужно в Лимасол, в гостиницу «Γαλήνη» в центре. Спросите, сколько ехать и сколько это стоит. В машине жарко — вежливо попросите включить кондиционер. Узнайте, можно ли заплатить картой. В конце попросите чек, поблагодарите и попрощайтесь.

      Роль Б — таксист. Поздоровайтесь и спросите, куда ехать. Помогите с чемоданами. Ехать около 50 минут, сейчас небольшие пробки. Цена — 70 евро. Картой можно. Скажите, что приехали, дайте чек и пожелайте хорошего отдыха.
    seconds: 120
    model: |-
      Б: Καλησπέρα σας! Πού πάμε;
      А: Καλησπέρα. Στη Λεμεσό, παρακαλώ, στο ξενοδοχείο «Γαλήνη», στο κέντρο.
      Б: Βεβαίως. Δώστε μου τις βαλίτσες σας.
      А: Ευχαριστώ. Πόση ώρα κάνει μέχρι εκεί;
      Б: Περίπου πενήντα λεπτά. Τώρα έχει λίγη κίνηση.
      А: Και πόσο κάνει;
      Б: Εβδομήντα ευρώ.
      А: Μπορώ να πληρώσω με κάρτα;
      Б: Ναι, βέβαια.
      А: Κάνει πολλή ζέστη. Μπορείτε να ανοίξετε το κλιματιστικό, παρακαλώ;
      Б: Αμέσως. … Φτάσαμε! Αυτό είναι το ξενοδοχείο σας.
      А: Ορίστε η κάρτα μου. Μου δίνετε και μια απόδειξη;
      Б: Ορίστε. Καλές διακοπές!
      А: Ευχαριστώ πολύ. Καλό βράδυ!
    criteria:
      - "Поздоровались и попрощались на «вы» (Καλησπέρα σας! … Καλό βράδυ!), реплики таксиста тоже на «вы»"
      - "Куда — σε + винительный падеж: Στη Λεμεσό, στο ξενοδοχείο… στο κέντρο (модули 06, 13)"
      - "Два вопроса о главном: Πόση ώρα κάνει μέχρι εκεί; Πόσο κάνει; — и в роли Б ответили числами (50 минут, 70 евро)"
      - "Вежливая просьба: Μπορείτε να ανοίξετε το κλιματιστικό, παρακαλώ; (модули 09, 16)"
      - "Оплата и чек: Μπορώ να πληρώσω με κάρτα; Μου δίνετε μια απόδειξη; (модули 10, 11)"
      - В роли Б — повелительное на «вы» (Δώστε μου…), Φτάσαμε, пожелание (Καλές διακοπές!); диалог ни разу не оборвался
  - type: explanation
    id: before-exam
    title: До экзамена
    body: |-
      Курс пройден. Дальше — только повторение, без нового материала.

      **Последняя неделя (3–10 мая).** Каждый день карточки — 15–20 минут, без пропусков. Ни новых слов, ни новых тем. Если есть силы, каждый день делайте одно короткое задание слабого навыка: один текст, одно аудирование, одно письмо или одну запись речи. Если нужно больше практики, заново сделайте задания из уроков, перечисленных в последнем блоке пробника M3.

      **10 мая — отдых:** только карточки и ранний сон. Приготовьте документы, которые требует экзаменационный центр (удостоверение личности с фотографией), и ручку.

      **11 мая — экзамен.** Приходите заранее. В письменной части следите за временем каждой части, в устной — говорите, даже если не уверены: простая верная фраза лучше молчания.

      Καλή επιτυχία! — Удачи!
