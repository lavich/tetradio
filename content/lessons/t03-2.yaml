          - Can you send me the check-in instructions, please?
          - Could you send us the check-in instructions?
          - Could you send us the check-in instructions, please?
          - Can you send us the check-in instructions?
          - Could you please send me the check-in instructions?
          - Could you please send us the check-in instructions?
