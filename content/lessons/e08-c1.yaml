    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Четыре года в платёжной компании: пришли разработчиком, с прошлой весны — тимлид команды карт; до этого два года в стартапе. За год команда выросла с пяти до семи человек, запустили два новых продукта. Проект, которым вы гордитесь: перенос карточных платежей на новую платформу без простоя. Вы тогда работали в команде карт, когда CTO попросил начать проект. Вы спроектировали модель данных, разбили релиз на небольшие шаги и вели еженедельные встречи команды. Закончили на две недели раньше срока, без простоя, среднее время платежа снизилось на тридцать процентов. 6 реплик, вся ваша часть — 90–120 секунд.
    seconds: 120
    model: |-
      Katarina: Let's go through your experience. Could you walk me through your CV, starting with your current role?
      You: Sure. I've worked at a payments company for four years. I joined as a backend developer, and last spring I became the tech lead of the cards team. Before that, I spent two years at a start-up.
      Katarina: You said you joined as a developer. How long have you been in your current role, and what has changed since you started?
      You: I've been the tech lead for a year. The team has grown from five to seven developers, and we've launched two new products.
      Katarina: Thank you. Now, tell me about a project you're proud of.
      You: Let me tell you about a migration. The goal was to move our card payments to a new platform without downtime. I was working on the cards team when the CTO asked us to start the project.
      Katarina: And what was your personal contribution to it?
      You: I was responsible for the design. I designed the data model, planned the release in small steps and led the weekly check-ins with the team.
      Katarina: What was the result? Do you have any numbers?
      You: We finished two weeks early, with no downtime. Since the migration, the average payment time has dropped by thirty percent.
      Katarina: Thanks, that's clear.
      You: Thank you. I'd be happy to go into more detail.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - "Опыт — present perfect со сроком: I've worked… for four years; I've been the tech lead for a year"
      - "Проект — past simple и past continuous со связкой when: I was working on… when the CTO asked…"
      - "Личный вклад — I was responsible for…, I designed… (что сделали именно вы)"
      - "Результат — с числом и сроком: two weeks early, by thirty percent"
  - type: reading
    id: thread
    title: "Тред с менеджером команды"
    text: |-
      Mark Reed (engineering manager): Hi Nadia, Mark again, from the call. Before the technical round, could you tell me which databases you have used in production?

      Nadia Volkova: Hi Mark. I've used PostgreSQL for four years and Redis for caching. I haven't worked with Kafka in production, but I've used it in a side project for a year.

      Mark Reed: Thanks. Could you also describe how a payment goes through your service? We'll talk about it in more detail in the technical round.

      Nadia Volkova: Sure. First, a request is sent to the gateway, where the user is authenticated. After that, it is passed to the payment service, which writes to the database and sends an event to a queue. Finally, a notification is sent to the user.

      Mark Reed: Clear, thanks. One more question: why did you choose PostgreSQL over MongoDB?

      Nadia Volkova: Our data is relational, and we needed strict transactions. MongoDB was faster to start with, but we would need to write the consistency checks ourselves.

      Mark Reed: That's what I wanted to know. Speak soon.
    glosses:
      - { text: caching, russian: кеширование }
      - { text: a side project, russian: личный проект вне работы }
      - { text: authenticated, russian: проходит аутентификацию }
