  - type: reading
    id: vacancy
    title: "Senior Backend Engineer — Payments Platform"
    text: |-
      Senior Backend Engineer — Payments Platform
      Tidewell Software · remote-first, Europe · permanent role

      ABOUT THE ROLE
      You will own the transaction service, which processes about two million payments a day. You will design APIs, review code and mentor two mid-level engineers. You will work closely with the product manager and the security team.

      WHAT WE EXPECT
      - At least five years of backend experience, preferably with payments or other systems where a failure is costly.
      - Strong Python; Go is a plus.
      - Experience with PostgreSQL and message queues (we use Kafka).
      - Clear written and spoken English: you will present technical decisions to the team.

      WHAT WE OFFER
      - A salary of 80,000 to 95,000 euros gross per year, depending on experience.
      - Stock options and a learning budget of 1,500 euros a year.
      - Work from home anywhere in Europe. Core hours: 10:00 to 14:00 Central European Time.
      - 27 days of holiday.

      HIRING PROCESS
      Screening call, take-home task (about three hours), technical round, final interview.
    glosses:
      - { text: processes, russian: обрабатывает }
      - { text: mid-level, russian: среднего уровня }
      - { text: a failure, russian: сбой }
      - { text: costly, russian: дорогостоящий }
      - { text: a plus, russian: преимущество }
      - { text: message queues, russian: очереди сообщений }
