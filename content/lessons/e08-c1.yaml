    id: motivation
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Почему Tidewell: продукт и инженерная культура; вы давно читаете их инженерный блог и разборы инцидентов, хотите работать над тем, что даёт реальный результат. О продукте вы знаете из письма: платежи для интернет-магазинов в тридцати странах, команда Payments Platform отвечает за сервис транзакций. Через пять лет вы видите себя ведущим инженером (staff engineer); в следующем году собираетесь заняться проектированием систем, а переход к управлению людьми не исключаете, но пока не уверены. Хотите узнать больше о высоконагруженных системах и Go и делиться с коллегами опытом в платежах. Роль не тимлида вас устраивает: вас интересуют архитектура и наставничество. 6 реплик, вся ваша часть — 90–120 секунд.
    seconds: 120
    model: |-
      Katarina: Let's talk about motivation. Why do you want to join Tidewell?
      You: Honestly, it's the product and the engineering culture. I've followed your engineering blog for a while, and I liked your public postmortems. I'd like to work on something with real impact.
      Katarina: Thanks. What do you know about our product?
      You: I know that you help online shops accept payments in thirty countries, and that the Payments Platform team owns the transaction service.
      Katarina: Good. And where do you see yourself in five years?
      You: In five years, I see myself as a staff engineer. Next year I'm going to focus on system design. I might consider a management track later, but I'm not sure yet.
      Katarina: What would you like to learn in this role?
      You: I'd like to learn more about high-load systems and Go. I'd also like to share what I know about payments with my colleagues.
      Katarina: This is a senior engineer role, not a team lead role. Is that OK for you?
      You: Yes, that's fine. I'd like to focus on the architecture and on mentoring, and I don't have to manage people to do that.
      Katarina: Great. Thank you.
      You: Thank you. I'm looking forward to the next steps.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - "Причина — конкретная, не общие слова: the product, the engineering culture, их блог"
      - "Планы — формы going to и might: I'm going to focus on…; I might consider…; через пять лет — I see myself as…"
      - "Вклад и желание учиться — I'd like to learn…, I'd like to share…"
      - "Согласие с условием роли — Yes, that's fine + короткая причина"
  - type: speaking
    id: bank
    part: interview
    prompt: "Менеджер команды Mark спрашивает: «How do you handle a task when the requirements are unclear?» Ответьте за 90 секунд на своём материале: сначала проверьте, что поняли вопрос, затем назовите подход, приведите случай из практики и закончите итогом."
    seconds: 90
    model: "If I understand correctly, you're asking about a task where the requirements are unclear. In that case, I do three things. First, I list what I know and what I don't know. Then I ask the product owner a few specific questions to narrow the task down, for example, which users it affects and what success looks like. Finally, I share a short summary in writing, so that everyone agrees. Last year, a manager asked me to make a dashboard faster. That was vague, so I asked which page was slow. It turned out to be the monthly report, and we made it open in two seconds instead of twenty."
    criteria:
      - Начало с проверки вопроса — If I understand correctly, you're asking…
      - Назван подход по шагам со связками First, Then, Finally
      - Есть случай из практики с числом
      - Ответ укладывается в 90 секунд
