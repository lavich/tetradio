  - type: speaking
    id: stack
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Стек: Python, PostgreSQL, Redis, Docker и AWS. PostgreSQL выбрали из-за данных (реляционные, нужны строгие транзакции), команда его тоже знала. Недостаток: запись плохо масштабируется — добавили реплику, и проблем с тех пор не было. Kafka в продакшене не использовали, но год работали с ним в личном проекте; на работе — RabbitMQ. Вторая реплика звучит быстро, с сокращениями: переспросите по-деловому (Could you repeat the question?), затем ответьте. 6 реплик, вся ваша часть — 90–120 секунд.
    seconds: 120
    model: |-
      Katarina: Right, let's talk about your stack. Which technologies do you use day to day?
      You: Mostly Python, with PostgreSQL and Redis. I've also used Docker and AWS.
      Katarina: Got it. So, why'd you go for PostgreSQL over Mongo — was it the team, or the data, or both?
      You: Sorry, could you repeat the question? I missed the second part.
      Katarina: Sure. I asked if you picked PostgreSQL because of the team, because of the data, or for both reasons.
      You: Thanks. We chose PostgreSQL mainly because of the data: it is relational, and we needed strict transactions. The team knew it well, too.
      Katarina: Interesting. And what are the downsides of that choice?
      You: The main downside is scaling the writes. We added a replica, and it hasn't caused problems since.
      Katarina: OK. Do you have any experience with Kafka or other message queues?
      You: I haven't used Kafka in production, but I've used it in a side project for a year. At work, I've used RabbitMQ.
      Katarina: That's fine, we can teach that. Thanks.
      You: Thank you. I'm happy to learn it.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - "Быструю реплику не пропустили, переспросили по-деловому: Could you repeat the question? / Do you mean…?"
      - "Выбор технологии — критерий и довод: We chose PostgreSQL because of the data; один недостаток и что с ним сделали"
      - "Опыт — present perfect с not… in production: I haven't used Kafka in production, but I've used it in…"
      - Без пересказа вопросов рекрутера, каждый ответ отвечает на заданный вопрос и не повторяет его
