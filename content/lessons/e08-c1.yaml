    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Вилка 80–95 тысяч евро gross вам подходит, ваше ожидание — 90–95 тысяч gross, вы готовы обсуждать всё вознаграждение, включая опционы. Срок предупреждения — два месяца, но вы можете договориться с работодателем о более раннем выходе, поэтому могли бы начать в начале апреля. Вы живёте в Варшаве: часовой пояс совпадает с обязательными часами, переезжать не нужно, поездки в Лисбон раз в квартал вас устраивают. В конце задайте вопрос о команде и о первых трёх месяцах, затем попросите подтвердить детали письмом. 6 реплик, вся ваша часть — 90–120 секунд.
    seconds: 120
    model: |-
      Katarina: Hello Nadia, thanks for calling back. As I said in my message, the range is eighty to ninety-five thousand euros gross, plus stock options. Is that in line with your expectations?
      You: Thank you. That's roughly in line. I'm looking for something in the range of ninety to ninety-five thousand euros gross, and I'm open to discussing the whole compensation, including stock options.
      Katarina: Good. What is your notice period, and when could you start?
