  - type: speaking
    id: start
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia Volkova, бэкенд-разработчик из Варшавы. Звонит Katarina Lind, рекрутер Tidewell Software. У вас шесть лет опыта, четыре из них в платёжной компании; с прошлой весны вы тимлид команды карт: отвечаете за архитектуру и наставляете трёх разработчиков. Сейчас вы делаете сервис для карточных платежей: отвечаете за API, в этом квартале переносите его на новую базу данных. Вы ищете роль с большей ответственностью за архитектуру и уже прочитали описание вакансии. Для разговора у вас двадцать минут. 6 реплик, вся ваша часть — 60–90 секунд.
    seconds: 90
    model: |-
      Katarina: Hello Nadia, this is Katarina Lind from Tidewell Software. Thanks for making time. Is now a good time to talk?
      You: Hello Katarina, thanks for reaching out. Yes, I have about twenty minutes.
      Katarina: Perfect. The call will take about fifteen minutes. To start, could you tell me a little about yourself?
      You: Sure. I'm a backend developer with six years of experience, four of them in payments. Since last spring I've been the tech lead of the cards team, and I'm responsible for the architecture and for mentoring three developers.
      Katarina: Thanks. And what are you working on at the moment?
      You: I'm working on a service for card payments. I'm responsible for the API, and we're moving it to a new database this quarter.
      Katarina: That sounds interesting. What made you reply to my message?
      You: I'm looking for a role with more responsibility for the architecture, and your focus on payments matches my background.
      Katarina: I see. Did you have a chance to read the job description?
      You: Yes, I did. The transaction service is the part that interests me most.
      Katarina: Good. Let's talk about your experience in more detail.
      You: Of course, I'm ready.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - "Рассказ о себе — настоящее и прошлое: I'm a backend developer with… years of experience; Since last spring I've been…"
      - "Текущая работа — present continuous: I'm working on…, we're moving…"
      - "Причина отклика — конкретная: I'm looking for a role with more responsibility…"
      - Вежливо и спокойно, без долгих пауз
