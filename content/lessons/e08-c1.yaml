title: Пробный звонок рекрутера
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как устроена контрольная точка
    body: |-
      Это контрольная точка первой ступени курса — модули e01–e08. Один отклик на вакансию от письма рекрутера до обсуждения условий: письмо и описание вакансии, голосовое сообщение, звонок по частям (начало, опыт и проект, стек, мотивация, условия) и ответ рекрутеру. Около 60 минут. Делайте точку за один раз, без словаря, таблиц и карточек: результат покажет то, что уже усвоено. Новых карточек здесь нет — только пройденное в модулях; редкие слова в текстах подписаны, а в аудио для ответа они не нужны.

      **Чтение и аудирование** проверяются автоматически. Для каждого навыка считается доля правильных ответов и сравнивается с порогом **60 %** — по нему курс считает навык сданным. Каждое аудио звучит два раза. В заданиях на аудирование открывайте текст кнопкой «Открыть текст» только после ответов, иначе результат ничего не покажет; реплики перед ролевыми сценами открывайте после двух прослушиваний и держите перед глазами. В вопросах с выбором верен один вариант.

      **Звонок.** Сцен пять, в каждой сначала звучат только реплики рекрутера, по порядку. Послушайте их два раза, откройте текст и держите перед глазами. Затем запишите свою часть: ответьте на каждую реплику одной-тремя фразами и переходите к следующей. Ваша роль — Nadia Volkova, факты для ответов даны в каждом задании; можно говорить по ним или заменить своими. Все пять сцен вместе — звонок минут на пятнадцать с записью, как в программе.

      **Письмо и речь** — самопроверка: в итог они не входят. Сначала напишите текст и запишите ответ сами, только потом откройте образец и отметьте, какие критерии выполнены. Если выполнено меньше 60 % критериев, считайте навык пока не сданным.

      **Навык ниже порога** — повод повторить модули, названные в пояснениях к ошибкам: чтение — e02, e04, e05, e06 и e08 (письмо рекрутера, вакансия, тред о стеке и устройстве проекта), аудирование — e01, e02, e03, e05 и e08 (голосовое сообщение, вопросы в разных формулировках, условия), письмо — e07 и e08, речь — сцены из e05–e08 и банк ответов третьих уроков. Повторите их до второй ступени.

      **Темп.** Программа рассчитана на одно занятие в неделю: на весь курс уходит около года. Если все навыки не ниже порога и занятия даются легко, вторую ступень (e09–e16) можно проходить по два занятия в неделю — программа допускает это после экзамена по греческому, в мае 2027. Если навык ниже порога, сначала повторите его модули и оставьте прежний темп.
    table:
      columns:
        - часть
        - задания
        - время
      rows:
