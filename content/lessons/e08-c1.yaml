      - id: g2
        prompt: "I ___ as a backend developer since 2020."
        answer: have worked
        explanation: "Началось в прошлом и продолжается, since 2020, — present perfect: have worked (модуль e02)."
      - id: g3
        prompt: "I ___ on the cards team when the CTO asked me to lead the migration."
        answer: was working
        explanation: "Фон — past continuous, событие — past simple, связка when: was working… asked (модуль e03)."
      - id: g4
        prompt: "Our code ___ by two engineers before every release."
        answer: is reviewed
        explanation: "Код — то, что проверяют; кто проверяет, называет by: is reviewed by two engineers (модуль e06)."
      - id: g5
        prompt: "In our tests, Go used less memory ___ Java."
        answer: than
        explanation: "После сравнительной степени — than: less memory than (модуль e04)."
      - id: g6
        prompt: "Next year I'm ___ focus on system design."
        answer: going to
