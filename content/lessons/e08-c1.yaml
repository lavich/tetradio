    text: |-
      Subject: Next steps at Tidewell Software

      Dear Nadia,

      Thank you for the conversation today. The team liked your answers and would like to move you to the next stage.

      The next step is a take-home task. It should take about three hours, and you have five days to send us your solution. After that, we will invite you to a technical round with two engineers: it takes ninety minutes and is held by video call.

      Please let me know by Friday if this plan works for you, and which days next week suit you for the technical round. If you have any questions, I will be glad to help.

      Kind regards,
      Katarina Lind
      Recruiter, Tidewell Software
