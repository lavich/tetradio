  - type: reading
    id: email
    title: "Senior Backend Engineer at Tidewell Software"
    text: |-
      Subject: Senior Backend Engineer at Tidewell Software

      Dear Nadia,

      I came across your profile on LinkedIn, and I am writing about a Senior Backend Engineer role in the Payments Platform team at Tidewell Software. Your experience with payment systems and your work as a tech lead look like a very good match.

      Tidewell builds software that helps online shops accept payments in thirty countries. The team has nine engineers and is hiring a tenth person to own the transaction service. The role is permanent, and the team is remote-first: you work from home, and everyone meets in Lisbon once a quarter.

      I would like to tell you more about the conditions and hear about your experience. Would you be available for a short call on Thursday or Friday afternoon? If you are interested, could you send me your updated CV before the call?

      Kind regards,
      Katarina Lind
      Recruiter, Tidewell Software
    glosses:
      - { text: came across, russian: наткнулась на }
      - { text: a very good match, russian: вы очень подходите }
      - { text: accept payments, russian: принимать платежи }
      - { text: own, russian: отвечать за }
      - { text: transaction, russian: платёжная операция }
      - { text: once a quarter, russian: раз в квартал }
