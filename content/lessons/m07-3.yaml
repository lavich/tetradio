title: Объявление «продаю», моя комната и повторение
kind: lesson
items:
  - kind: phrase
    id: p085 # Πώς είναι το δωμάτιό σου;
  - kind: phrase
    id: p086 # Το δωμάτιό μου είναι μικρό αλλά ωραίο.
  - kind: phrase
    id: p090 # Πωλείται ψυγείο σε καλή κατάσταση.
blocks:
  - type: explanation
    id: phrases
    title: Какая у тебя комната?
    body: |-
      **Πώς είναι το δωμάτιό σου;** — «Какая у тебя комната?», дословно «Как есть твоя комната?». Πώς είναι…; спрашивает, какая вещь или место: Πώς είναι το σπίτι σου; Πώς είναι η κουζίνα;

      Ответ — прилагательные в нужном роде: **Το δωμάτιό μου είναι μικρό αλλά ωραίο.** — «Моя комната маленькая, но красивая». Δωμάτιο — среднего рода, поэтому μικρό и ωραίο. Помните второй тонос: το δωμάτιό μου, το δωμάτιό σου — ударение в δωμάτιο на третьем слоге от конца.

      **Πωλείται ψυγείο σε καλή κατάσταση.** — «Продаётся холодильник в хорошем состоянии». Это формула объявления: в начале **Πωλείται** [поли́тэ] и вещь без артикля. Η κατάσταση — «состояние», женского рода, поэтому σε **καλή** κατάσταση, σε πολύ καλή κατάσταση.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: explanation
    id: ad-how
    title: Как написать объявление «продаю»
    body: |-
      Объявление — короткий текст для доски объявлений или сайта. На экзамене описание вещи или места — частая письменная задача. Пишем 40–60 слов по плану ниже.

      **Πωλείται** — «продаётся» (одна вещь), **Πωλούνται** [полу́ндэ] — «продаются» (несколько вещей): Πωλείται καναπές. Πωλούνται δύο καρέκλες. Так же построено Νοικιάζεται διαμέρισμα из модуля 06. «Я продаю» — **πουλάω**: Πουλάω τον καναπέ, γιατί… — «Я продаю диван, потому что…».

      Опишите вещь двумя-тремя прилагательными и следите за родом: Πωλείται ντουλάπα, **άσπρη** και **μεγάλη**. Цена — **Κάνει** 100 ευρώ (одна вещь), **Κάνουν** 50 ευρώ (несколько). В конце — телефон и имя, **придуманное**, как на экзамене.

      Проверьте себя: прилагательное согласовано с вещью (ψυγείο — άσπρο, ντουλάπα — άσπρη, κρεβάτια — άσπρα), в словах из двух и больше слогов стоит тонос, в конце слов мужского рода — ς.
    table:
      columns:
        - что написать
        - как
      rows:
        - - что продаётся
          - Πωλείται ψυγείο. / Πωλούνται δύο καρέκλες.
        - - какое
          - Είναι άσπρο, μεγάλο και καθαρό.
        - - новое или старое
          - Είναι καινούργιο. / Είναι παλιό, αλλά δουλεύει.
        - - состояние
          - σε καλή κατάσταση / Δεν είναι χαλασμένο.
        - - почему продаёте
          - Πουλάω το ψυγείο, γιατί γυρίζω στη Ρωσία.
        - - цена
          - Κάνει 150 ευρώ. / Κάνουν 30 ευρώ.
        - - контакт
          - "Τηλέφωνο: 99 45 67 12, Μάρκος."
  - type: exercise
    id: ad-verb
    title: Продаётся или продаются
    instruction: Вставьте Πωλείται или Πωλούνται.
    format: gap
    bank:
      - Πωλείται
      - Πωλούνται
    items:
      - id: g1
        prompt: ___ ντουλάπα σε καλή κατάσταση.
        answer: Πωλείται
      - id: g2
        prompt: ___ τέσσερις καρέκλες.
        answer: Πωλούνται
        explanation: Стульев несколько — Πωλούνται.
      - id: g3
        prompt: ___ πλυντήριο, δύο χρονών.
        answer: Πωλείται
      - id: g4
        prompt: ___ δύο κρεβάτια για παιδιά.
        answer: Πωλούνται
      - id: g5
        prompt: ___ ψυγείο και φούρνος.
        answer: Πωλούνται
        explanation: Вещей две — ψυγείο και φούρνος, значит глагол во множественном числе.
  - type: exercise
    id: ad-agree
    title: Описываем вещь в объявлении
    instruction: Напишите прилагательное в нужной форме. Подсказка — в скобках.
    format: text
    items:
      - id: q1
        prompt: Πωλείται ντουλάπα. Είναι ___. (белый)
        answer:
          - άσπρη
      - id: q2
        prompt: Πωλούνται δύο κρεβάτια. Είναι ___. (новый)
        answer:
          - καινούργια
          - καινούρια
        explanation: Κρεβάτια — средний род, мн. ч.
      - id: q3
        prompt: Πωλείται καναπές σε ___ κατάσταση. (хороший)
        answer:
          - καλή
        explanation: Прилагательное согласуется с κατάσταση — женский род.
      - id: q4
        prompt: Πωλούνται τέσσερις καρέκλες. Είναι ___. (чистый)
        answer:
          - καθαρές
      - id: q5
        prompt: Πωλείται πλυντήριο. Δεν είναι ___. (сломанный)
        answer:
          - χαλασμένο
      - id: q6
        prompt: Πωλείται ξυπνητήρι. Είναι ___. (жёлтый)
        answer:
          - κίτρινο
      - id: q7
        prompt: Πωλούνται δύο καναπέδες. Είναι ___. (дешёвый)
        answer:
          - φτηνοί
        explanation: "Καναπέδες — мужской род, мн. ч.: -οι."
  - type: writing
    id: for-sale
    register: friendly
    prompt: "Вы переезжаете и продаёте вещи. Напишите объявление для доски объявлений в вашем доме (40–60 слов): что продаётся (одна или две вещи), какого цвета и размера, новое или старое, в каком состоянии, почему продаёте, цена, телефон и имя (придуманное)."
    words:
      min: 40
      max: 60
    model: "Πωλείται ψυγείο σε πολύ καλή κατάσταση. Είναι άσπρο, μεγάλο και καθαρό. Είναι δύο χρονών και δουλεύει πολύ καλά. Κάνει 150 ευρώ. Πωλούνται επίσης δύο μαύρες καρέκλες για την κουζίνα. Είναι παλιές, αλλά ωραίες. Οι καρέκλες κάνουν 30 ευρώ. Πουλάω τα πράγματα, γιατί γυρίζω στη Ρωσία. Τηλέφωνο: 99 45 67 12, Μάρκος."
    criteria:
      - "Начало — Πωλείται / Πωλούνται и вещь без артикля; Πωλούνται — если вещей несколько"
      - Вещь описана двумя-тремя прилагательными (цвет, размер, новое/старое, чистое)
      - Каждое прилагательное согласовано с вещью в роде и числе (ψυγείο — άσπρο, καρέκλες — μαύρες)
      - "Сказано о состоянии: σε καλή κατάσταση, δουλεύει, δεν είναι χαλασμένο"
      - "Есть цена (Κάνει / Κάνουν … ευρώ), телефон и придуманное имя"
      - 40–60 слов; тонос в словах из двух и больше слогов, ς в конце слов мужского рода; печатными буквами, не целиком заглавными
  - type: explanation
    id: speaking-how
    title: Как описать комнату
    body: |-
      Вторая часть устного экзамена — короткий монолог. Экзаменатор просит, например: «Περιγράψτε το δωμάτιό σας» — «Опишите вашу комнату». Говорите около минуты, без подготовки.

      Держитесь простого плана: какая комната (μεγάλο/μικρό, ωραίο) → что в ней есть (υπάρχει / υπάρχουν) → где что стоит (δίπλα στο, πάνω στο) → какого цвета вещи, новые или старые → что вы делаете в комнате. Одна вещь — одно-два предложения.

      Прилагательное — после είναι или между артиклем и существительным, всегда в роде вещи. Если забыли слово, опишите иначе: не знаете «письменный стол» — скажите τραπέζι.
    table:
      columns:
        - шаг
        - пример
      rows:
        - - какая комната
          - Το δωμάτιό μου είναι μικρό αλλά ωραίο.
        - - что в ней есть
          - Υπάρχει ένα κρεβάτι και μία ντουλάπα.
        - - где
          - Δίπλα στο παράθυρο είναι το κρεβάτι.
        - - какие вещи
          - Το κρεβάτι είναι καινούργιο και μπλε.
        - - что вы делаете
          - Εδώ διαβάζω και κοιμάμαι.
  - type: speaking
    id: my-room
    part: monologue
    prompt: Опишите свою комнату — спальню или гостиную. Скажите, большая она или маленькая, что в ней есть, где что стоит, какого цвета вещи, что новое и что старое, что вы делаете в этой комнате. Говорите около минуты и запишите себя.
    seconds: 90
    model: Το δωμάτιό μου είναι μικρό αλλά ωραίο. Έχει ένα μεγάλο παράθυρο και μία πόρτα για το μπαλκόνι. Δίπλα στο παράθυρο είναι το κρεβάτι μου. Είναι καινούργιο και μπλε. Δίπλα στο κρεβάτι υπάρχει μία μικρή ντουλάπα. Η ντουλάπα είναι άσπρη και πολύ παλιά. Στο δωμάτιο υπάρχουν επίσης ένα τραπέζι και δύο μαύρες καρέκλες. Πάνω στο τραπέζι είναι το ξυπνητήρι μου. Είναι κόκκινο! Το κλιματιστικό είναι παλιό, αλλά δουλεύει. Εδώ διαβάζω και κοιμάμαι. Κάθε Σάββατο καθαρίζω το δωμάτιο.
    criteria:
      - Говорили не меньше минуты, без долгих пауз
      - "Назвали 4–5 вещей в комнате: υπάρχει / υπάρχουν, είναι"
      - Сказали, где стоят хотя бы две вещи (δίπλα στο, πάνω στο, μέσα στο)
      - Прилагательные согласованы с вещью (το κρεβάτι — μπλε, καινούργιο; η ντουλάπα — άσπρη; οι καρέκλες — μαύρες)
      - Множественное число без ошибок (δύο καρέκλες, δύο παράθυρα)
      - Ударение на своём месте (καινούργιο, ξυπνητήρι, κλιματιστικό)
  - type: speaking
    id: home-questions
    part: interview
    prompt: |-
      Экзаменатор задаёт вопросы о вашем доме. Прочитайте каждый вопрос вслух, ответьте полным предложением и запишите ответы:
      Πώς είναι το σπίτι σας; Τι χρώμα είναι ο καναπές σας; Ποιος καθαρίζει το σπίτι;
    seconds: 45
    model: Το σπίτι μου είναι μικρό αλλά ωραίο. Έχει δύο δωμάτια και ένα μεγάλο μπαλκόνι. Ο καναπές μου είναι μπλε. Εγώ καθαρίζω το σπίτι κάθε Σάββατο.
    criteria:
      - Ответили на все три вопроса полными предложениями
      - "Говорили о себе: το σπίτι μου, ο καναπές μου, καθαρίζω (а не σας, καθαρίζετε)"
      - Цвет согласован с вещью (ο καναπές — μαύρος, άσπρος; μπλε не изменяется)
  - type: exercise
    id: review-plural
    title: Повторение — множественное число
    instruction: Вставьте слово во множественном числе. Подсказка — в скобках. Два слова лишние.
    format: gap
    bank:
      - μπαλκόνια
      - καρέκλες
      - κλειδιά
      - καναπέδες
      - κρεβάτια
      - ντουλάπες
      - ψυγεία
      - χρώματα
    items:
      - id: g1
        prompt: Στο σπίτι υπάρχουν δύο ___. (балкона)
        answer: μπαλκόνια
      - id: g2
        prompt: Στην κουζίνα υπάρχουν τέσσερις ___. (стула)
        answer: καρέκλες
      - id: g3
        prompt: Πού είναι τα ___ μου; (ключи)
        answer: κλειδιά
      - id: g4
        prompt: Στο σαλόνι υπάρχουν δύο ___. (дивана)
        answer: καναπέδες
      - id: g5
        prompt: Τα ___ στο υπνοδωμάτιο είναι μικρά. (кровати)
        answer: κρεβάτια
      - id: g6
        prompt: Οι ___ στο υπνοδωμάτιο είναι άσπρες. (шкафы)
        answer: ντουλάπες
  - type: exercise
    id: review-agree
    title: Повторение — согласование
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Η κουζίνα είναι ___.
        options:
          - ωραίος
          - ωραία
          - ωραίο
        answer: ωραία
        explanation: После гласной в женском роде -α.
      - id: q2
        prompt: Το ξυπνητήρι είναι ___.
        options:
          - κίτρινος
          - κίτρινη
          - κίτρινο
        answer: κίτρινο
      - id: q3
        prompt: ___ η ντουλάπα είναι δική μου.
        options:
          - Αυτός
          - Αυτή
          - Αυτό
        answer: Αυτή
      - id: q4
        prompt: Εκείνα τα κλειδιά είναι ___ σου;
        options:
          - δικός
          - δική
          - δικά
        answer: δικά
      - id: q5
        prompt: Οι καρέκλες στο μπαλκόνι είναι ___.
        options:
          - βρώμικοι
          - βρώμικες
          - βρώμικα
        answer: βρώμικες
      - id: q6
        prompt: Το δωμάτιό μου είναι μικρό αλλά ___.
        options:
          - ωραίος
          - ωραία
          - ωραίο
        answer: ωραίο
      - id: q7
        prompt: Ο καναπές είναι ___.
        options:
          - μπλε
          - μπλος
          - μπλες
        answer: μπλε
        explanation: Μπλε не изменяется ни по родам, ни по числам.
  - type: exercise
    id: review-match
    title: Повторение — фразы
    instruction: Соедините русскую фразу с греческой. Две греческие фразы лишние.
    format: match
    bank:
      - Πώς είναι το δωμάτιό σου;
      - Πωλείται ψυγείο σε καλή κατάσταση.
      - Τι χρώμα είναι;
      - Πού είναι τα κλειδιά μου;
      - Είναι καινούργιο ή παλιό;
      - Είναι δικό μου.
      - Τι είναι αυτό;
      - Πού είναι η κουζίνα;
    items:
      - id: m1
        prompt: Какая у тебя комната?
        answer: Πώς είναι το δωμάτιό σου;
      - id: m2
        prompt: Продаётся холодильник в хорошем состоянии.
        answer: Πωλείται ψυγείο σε καλή κατάσταση.
      - id: m3
        prompt: Какого это цвета?
        answer: Τι χρώμα είναι;
      - id: m4
        prompt: Где мои ключи?
        answer: Πού είναι τα κλειδιά μου;
      - id: m5
        prompt: Это новое или старое?
        answer: Είναι καινούργιο ή παλιό;
      - id: m6
        prompt: Это моё.
        answer: Είναι δικό μου.
