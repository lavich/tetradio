blocks:
  - type: explanation
    id: complexity-words
    title: Слова урока — рост времени, проверка, оценки
    body: |-
      Тексты урока разбирают решение задачи и показывают, как кандидат решает её вслух. Слова урока образуют три группы.

      **Рост времени.** Сложность называют словами. **Constant** — время или память не зависят от размера входа. **Linear** — время растёт пропорционально: вход вдвое больше, времени вдвое больше. **Logarithmic** — время растёт очень медленно: при удвоении входа добавляется один шаг. **Quadratic** — время растёт как квадрат: вход вдвое больше, времени вчетверо больше. Говорят **linear time**, **quadratic time**, **constant space**.

      **Проверка и ошибки.** **A test case** — вход и ожидаемый результат. **Debug** — искать и исправлять ошибки. **Reason about** — разбирать, как работает код, не запуская его. **An invariant** — условие, которое остаётся верным на каждом шаге цикла. **A counterexample** — случай, показывающий, что решение неверно. **An infinite loop** — цикл без выхода, **a stack overflow** — переполнение стека вызовов, часто из-за рекурсии без базового случая.

      **Решение и осторожные оценки.** **A helper function** — вспомогательная функция, **a placeholder** — заглушка, которую заменят позже. **Prune** — отсечь ненужные варианты перебора. **Readability** — читаемость кода. **Tentative** — предварительный ответ, который вы готовы уточнить. **Arguably** — «пожалуй, можно утверждать»: осторожная оценка, с которой можно спорить.
