        answer: Προτιμώ τσάι.
  - type: explanation
    id: menu-how
    title: Как читать меню
    body: |-
      В меню блюда стоят в именительном падеже, как названия: Μουσακάς, Χωριάτικη σαλάτα. Когда вы заказываете, слово переходит в винительный: Θέλω **έναν μουσακά** και **μια χωριάτικη σαλάτα**.

      Не нужно понимать каждое слово — ищите то, о чём спрашивают: раздел, название блюда, цену. Незнакомые слова переведены под текстом.
  - type: reading
    id: menu
    title: Ταβέρνα «Το Χωριό»
    text: |-
      Ταβέρνα «Το Χωριό» — Λεμεσός
      Ανοιχτά κάθε μέρα, 12:00–23:00

      Σαλάτες
      Χωριάτικη σαλάτα — 7 €
      Σαλάτα με χαλλούμι — 8 €

      Μεζέδες
      Χαλλούμι στο τηγάνι — 6 €
      Πατάτες τηγανητές — 4 €
      Τζατζίκι — 4 €

      Κυρίως πιάτα
      Κλέφτικο με πατάτες — 16 €
      Μουσακάς — 12 €
      Σουβλάκι χοιρινό (3 τεμάχια) — 10 €
      Κοτόπουλο στον φούρνο με πατάτες — 11 €
      Ψάρι της ημέρας — 18 €

      Γλυκά
      Γιαούρτι με μέλι — 5 €

      Ποτά
      Νερό (1 λίτρο) — 2 €
      Χυμός πορτοκάλι — 4 €
      Κρασί (ποτήρι) — 5 €
      Κυπριακός καφές — 2 €

      Μεζέδες για δύο άτομα (15 πιάτα) — 45 €
