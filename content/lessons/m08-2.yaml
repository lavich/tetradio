blocks:
  - type: explanation
    id: meals
    title: Завтрак, обед, ужин и глаголы о еде
    body: |-
      **Το πρωινό** — завтрак, **το μεσημεριανό** — обед, **το βραδινό** — ужин. «На завтрак» — **για πρωινό**: **Τι τρως για πρωινό;** — **Για πρωινό τρώω ψωμί με τυρί.** Так же — για μεσημεριανό, για βραδινό. Слово **το φαγητό** значит и «еда», и «блюдо»: Μου αρέσει το ελληνικό φαγητό.

      На Кипре и в Греции обедают поздно, около двух-трёх часов дня, а ужинают часто в девять-десять вечера.

      **Πεινάω** — «я голоден, хочу есть», **διψάω** — «хочу пить». Оба спрягаются как μιλάω: πεινάς, πεινάει, πεινάμε, πεινάτε, πεινάνε. **Προτιμώ** — «предпочитаю» — того же типа, но в 1-м лице обычно говорят προτιμώ, а в 3-м — προτιμά, προτιμούν (см. таблицу): Προτιμώ το τσάι. Προτιμάς ψάρι ή κρέας; **Μαγειρεύω** — «готовлю (еду)», обычный глагол на -ω: Μαγειρεύω κοτόπουλο.

      Две фразы выучите целиком. **Τι σου αρέσει να τρως;** — «Что ты любишь есть?» (να + глагол в нужном лице). **Θέλεις κάτι να πιεις;** — «Хочешь что-нибудь выпить?»: πιεις — особая форма от πίνω, её грамматику вы узнаете позже.
    table:
      columns:
        - лицо
        - πεινάω
        - προτιμώ
        - μαγειρεύω
      rows:
        - - εγώ
          - πεινάω
          - προτιμώ
          - μαγειρεύω
        - - εσύ
