  - type: exercise
    id: recipe-tf
    about: recipe
    title: Верно или неверно
    instruction: Прочитайте рецепт. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η συνταγή είναι για τέσσερα άτομα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Για δύο άτομα — на двоих. Четыре — это яйца.
      - id: q2
        prompt: Για την ομελέτα χρειαζόμαστε κατσαρόλα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μόνο ένα τηγάνι, όχι κατσαρόλα — только сковорода.
      - id: q3
        prompt: Τηγανίζουμε τις πατάτες δέκα λεπτά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Πρώτα μαγειρεύουμε τα αυγά και μετά τις πατάτες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Сначала (πρώτα) жарят картофель, потом (μετά) добавляют яйца.
      - id: q5
        prompt: Στην ομελέτα βάζουμε τυρί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Халлуми — это сыр (τυρί).
      - id: q7
        prompt: Η ομελέτα είναι φαγητό μόνο για πρωινό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Για πρωινό ή για βραδινό — и на завтрак, и на ужин.
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Диалог звучит два раза. В первый раз поймите ситуацию: кто говорит, где, о чём. Перед вторым прослушиванием прочитайте вопросы.

      В разговорах о еде ищите три сигнала: **μου αρέσει / δεν μου αρέσει**, **προτιμώ** и **δεν τρώω / δεν πίνω**. Будьте внимательны к ловушкам: человек может назвать блюдо, а потом сказать, что его не ест. В конце звучит **Πάμε;** — «Пойдём?» (форма πάω, модуль 02).
  - type: listening
    id: lunch
    title: Για μεσημεριανό
    plays: 2
    transcript:
      - speaker: Στέλιος
        text: Ελένη, είναι μία η ώρα. Πεινάς;
      - speaker: Ελένη
        text: Ναι, πεινάω πολύ! Πού τρώμε σήμερα;
      - speaker: Στέλιος
        text: Κοντά στη δουλειά υπάρχει μια καλή ταβέρνα. Έχει πολύ νόστιμα σουβλάκια.
      - speaker: Ελένη
        text: Σουβλάκια; Όχι, δεν τρώω κρέας.
      - speaker: Στέλιος
        text: Και κοτόπουλο δεν τρως;
      - speaker: Ελένη
        text: Όχι. Ψάρι τρώω, αλλά μόνο το βράδυ. Για μεσημεριανό προτιμώ μια σαλάτα ή χαλλούμι με ψωμί.
      - speaker: Στέλιος
        text: Η ταβέρνα έχει και σαλάτες και χαλλούμι στο τηγάνι.
      - speaker: Ελένη
        text: Ωραία! Μου αρέσει πολύ το χαλλούμι. Κι εσύ τι θέλεις;
      - speaker: Στέλιος
        text: Εγώ θέλω δύο σουβλάκια με πατάτες και έναν χυμό.
      - speaker: Ελένη
        text: Δεν πίνεις καφέ;
      - speaker: Στέλιος
        text: Όχι, δεν μου αρέσει ο καφές. Προτιμώ το τσάι, αλλά στην ταβέρνα πίνω πάντα χυμό.
      - speaker: Ελένη
        text: Εγώ πίνω μόνο νερό. Και μετά τρώμε ένα γλυκό;
      - speaker: Στέλιος
        text: Όχι, ευχαριστώ. Δεν μου αρέσουν πολύ τα γλυκά.
      - speaker: Ελένη
        text: Εγώ τρώω γλυκά κάθε μέρα! Πάμε;
      - speaker: Στέλιος
        text: Πάμε!
  - type: exercise
    id: lunch-choice
    about: lunch
    title: Выберите ответ
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Τι ώρα είναι;
        options:
          - Μία η ώρα.
          - Δύο η ώρα.
          - Εννέα το βράδυ.
        answer: Μία η ώρα.
      - id: q2
        prompt: Γιατί η Ελένη δεν θέλει σουβλάκια;
        options:
          - Δεν τρώει κρέας.
          - Δεν πεινάει.
          - Είναι ακριβά.
        answer: Δεν τρώει κρέας.
      - id: q3
        prompt: Πότε τρώει ψάρι η Ελένη;
        options:
          - Για πρωινό.
          - Για μεσημεριανό.
          - Το βράδυ.
        answer: Το βράδυ.
        explanation: Ψάρι τρώω, αλλά μόνο το βράδυ.
      - id: q4
        prompt: Τι θέλει ο Στέλιος;
        options:
          - Μια σαλάτα και νερό.
          - Δύο σουβλάκια με πατάτες και έναν χυμό.
          - Χαλλούμι με ψωμί και τσάι.
        answer: Δύο σουβλάκια με πατάτες και έναν χυμό.
      - id: q5
        prompt: Что Стелиос обычно предпочитает пить, когда он не в таверне?
        options:
          - кофе
          - чай
          - сок
        answer: чай
        explanation: "Προτιμώ το τσάι, αλλά στην ταβέρνα πίνω πάντα χυμό. Ловушка: сок он пьёт только в таверне, а кофе не любит."
      - id: q6
        prompt: Что пьёт Елени?
        options:
          - воду
          - сок
          - кофе
        answer: воду
        explanation: Εγώ πίνω μόνο νερό.
      - id: q7
        prompt: Кто любит сладкое?
        options:
          - Елени
          - Стелиос
          - оба
        answer: Елени
        explanation: Стелиос говорит «Δεν μου αρέσουν πολύ τα γλυκά», а Елени ест сладкое каждый день.
  - type: explanation
    id: gaps-how
    title: Задание с пропусками
    body: |-
      Это новое экзаменационное задание: в тексте шесть пропусков, а в списке — девять слов, три из них лишние. Каждое слово можно взять только один раз.

      Как решать. Сначала прочитайте весь текст, не заполняя пропуски. Потом для каждого пропуска спросите себя, какое слово здесь нужно: существительное, прилагательное, глагол или союз. Посмотрите на соседние слова: после πίνω, τρώω — винительный падеж, после μια — слово женского рода, после αρέσει — именительный. Лишние слова часто подходят по смыслу, но стоят не в той форме.
  - type: reading
    id: letter
    title: Από τη Λεμεσό
    text: |-
      Γεια σου, Νεφέλη!

      Πώς είσαι; Εγώ είμαι στη Λεμεσό με την οικογένειά μου. Εδώ τρώμε πολύ ωραία! Το πρωί πίνω (1) ___ με γάλα και τρώω ψωμί με μέλι. Για μεσημεριανό τρώμε συνήθως μια (2) ___ με ντομάτα και χαλλούμι. Το βράδυ πηγαίνουμε σε μια ταβέρνα κοντά στη θάλασσα. Ο άντρας μου ο Αντρέας τρώει πάντα (3) ___, γιατί του αρέσει πολύ το κρέας. Εγώ δεν τρώω πολύ κρέας, προτιμώ το (4) ___ — εδώ είναι πολύ φρέσκο. Τα παιδιά δεν τρώνε ψάρι, (5) ___ τρώνε πατάτες και σουβλάκια! Μετά τρώμε (6) ___ — μου αρέσει πολύ το γιαούρτι με μέλι.

      Τα λέμε!
      Χαρά
    glosses:
      - text: μέλι
        russian: мёд
      - text: φρέσκο
        russian: свежая
  - type: exercise
    id: letter-gap
    about: letter
    title: Пропуски
    instruction: Прочитайте сообщение и вставьте слова. Три слова лишние.
    format: gap
    bank:
      - τσάι
      - ο καφές
      - σαλάτα
      - κλέφτικο
      - ψάρι
      - αλλά
      - γλυκά
      - νόστιμος
      - πεινάω
    items:
      - id: g1
        prompt: (1) Το πρωί πίνω ___ με γάλα.
        answer: τσάι
        explanation: После πίνω нужен винительный падеж. «ο καφές» — именительный, здесь он не подходит.
      - id: g2
        prompt: (2) Για μεσημεριανό τρώμε συνήθως μια ___ με ντομάτα και χαλλούμι.
        answer: σαλάτα
        explanation: "μια — нужно слово женского рода: η σαλάτα."
      - id: g3
        prompt: (3) Ο Αντρέας τρώει πάντα ___, γιατί του αρέσει πολύ το κρέας.
        answer: κλέφτικο
        explanation: Андреас любит мясо, а клефтико — блюдо из баранины.
      - id: g4
        prompt: (4) Εγώ δεν τρώω πολύ κρέας, προτιμώ το ___ — εδώ είναι πολύ φρέσκο.
        answer: ψάρι
        explanation: Не мясо, а свежее — то есть рыба; артикль το подходит к το ψάρι.
      - id: g5
        prompt: (5) Τα παιδιά δεν τρώνε ψάρι, ___ τρώνε πατάτες και σουβλάκια!
        answer: αλλά
        explanation: Противопоставление «не едят рыбу, но едят…» — союз αλλά.
      - id: g6
        prompt: (6) Μετά τρώμε ___ — μου αρέσει πολύ το γιαούρτι με μέλι.
        answer: γλυκά
        explanation: Йогурт с мёдом — десерт, τα γλυκά.
