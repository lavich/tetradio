  - type: explanation
    id: tastes
    title: Вкусы и кипрские блюда
    body: |-
      **Νόστιμος** — вкусный, **γλυκός** — сладкий, **αλμυρός** — солёный, **καυτερός** — острый. Прилагательное согласуется с существительным (модуль 07): ο καφές είναι γλυκός, η σαλάτα είναι νόστιμη, το τυρί είναι αλμυρό. У γλυκός женский род — **γλυκιά**. **Τα γλυκά** — «сладости, десерты». Во фразе **Είναι πολύ νόστιμο!** — «Очень вкусно!» — средний род, как в русском «это вкусно».

      **Το κλέφτικο** — кипрское блюдо: баранина (часто с картофелем), которая долго томится в печи. **Ο μουσακάς** — запеканка из баклажанов, картофеля, фарша и белого соуса (бешамель). **Ο μεζές** — закуска; на Кипре **οι μεζέδες** в таверне — это целый ужин из 15–20 маленьких блюд. Το χαλλούμι жарят **στο τηγάνι** — на сковороде, суп и тушёное мясо готовят **στην κατσαρόλα** — в кастрюле.

      Мужские слова на -άς и -ές теряют ς в вин. п. ед. ч., а во мн. ч. получают -δες, как ο καφές: **τον μουσακά**, **τον μεζέ**; οι μεζέδες → τους μεζέδες.
    table:
      columns:
        - перевод
        - м. р.
        - ж. р.
        - ср. р.
      rows:
