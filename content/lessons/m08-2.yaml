      - id: m1
        prompt: завтрак
        answer: το πρωινό
      - id: m2
        prompt: ужин
        answer: το βραδινό
      - id: m3
        prompt: кастрюля
        answer: η κατσαρόλα
      - id: m4
        prompt: сковорода
        answer: το τηγάνι
      - id: m5
        prompt: помидор
        answer: η ντομάτα
      - id: m6
        prompt: картофель
        answer: η πατάτα
