  - type: exercise
    id: menu-choice
    about: menu
    title: Выбираем в меню
    instruction: Прочитайте меню и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Сколько стоит мусака?
        options:
          - 10 €
          - 12 €
          - 16 €
        answer: 12 €
      - id: q2
        prompt: Вы не едите мясо и рыбу. Какое блюдо вам подходит?
        options:
          - Χαλλούμι στο τηγάνι
          - Κλέφτικο με πατάτες
          - Σουβλάκι χοιρινό
          - Ψάρι της ημέρας
        answer: Χαλλούμι στο τηγάνι
        explanation: Халлуми — сыр. Клефтико и сувлаки — мясо, ψάρι — рыба.
      - id: q3
        prompt: Что в этом меню — десерт?
        options:
          - Γιαούρτι με μέλι
          - Τζατζίκι
          - Πατάτες τηγανητές
          - Χωριάτικη σαλάτα
        answer: Γιαούρτι με μέλι
        explanation: Оно в разделе Γλυκά — «сладкое, десерты». Цацики тоже из йогурта, но это μεζές — закуска.
      - id: q6
        prompt: Вы заказали клефтико и бокал вина. Сколько вы платите?
        options:
          - 19 €
          - 21 €
          - 23 €
        answer: 21 €
        explanation: Κλέφτικο — 16 €, κρασί (ποτήρι) — 5 €.
      - id: q7
        prompt: Двое друзей хотят мезе. Сколько они платят вместе?
        options:
          - 15 €
          - 45 €
          - 90 €
        answer: 45 €
        explanation: Μεζέδες για δύο άτομα — цена сразу на двоих.
  - type: reading
    id: recipe
    title: Ομελέτα με πατάτες
    text: |-
      Μια εύκολη συνταγή! Για δύο άτομα θέλουμε: τρεις πατάτες, τέσσερα αυγά, λίγο χαλλούμι, λάδι και αλάτι. Χρειαζόμαστε μόνο ένα τηγάνι, όχι κατσαρόλα.

      Πρώτα κόβουμε τις πατάτες σε μικρά κομμάτια. Βάζουμε λάδι στο τηγάνι και τηγανίζουμε τις πατάτες δέκα λεπτά. Σε ένα μπολ χτυπάμε τα αυγά με λίγο αλάτι. Μετά βάζουμε τα αυγά στο τηγάνι, πάνω στις πατάτες. Κόβουμε το χαλλούμι και το βάζουμε πάνω στην ομελέτα. Μαγειρεύουμε πέντε λεπτά ακόμα.

      Τρώμε την ομελέτα ζεστή, με ψωμί και μια σαλάτα με ντομάτα. Είναι ένα εύκολο και νόστιμο φαγητό για πρωινό ή για βραδινό!
    glosses:
      - text: συνταγή
        russian: рецепт
      - text: ομελέτα
        russian: омлет
      - text: δύο άτομα
        russian: два человека
