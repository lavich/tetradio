  - type: explanation
    id: clitics-acc
    title: Με, σε, τον… — «меня, тебя, его»
    body: |-
      Вы давно знаете фразы **Πώς σε λένε; — Με λένε Άννα.** и **Μπορώ να το δοκιμάσω;** Короткие σε, με, το — это местоимения «тебя, меня, его (это)». Их называют слабыми формами: своего ударения у них нет, они произносятся вместе с глаголом, как одно слово.

      Слабое местоимение заменяет дополнение в винительном падеже — «кого? что?»: Ξέρεις τον Νίκο; — Ναι, **τον** ξέρω. Βλέπεις τη Μαρία; — **Τη** βλέπω κάθε μέρα. Πού είναι το κλειδί; — Δεν **το** βρίσκω.

      Формы 3-го лица совпадают с артиклем винительного падежа (модуль 08): **τον, τη(ν), το; τους, τις, τα**. Род — как у слова, которое местоимение заменяет: ο καφές → τον, η σαλάτα → τη(ν), τα κλειδιά → τα. У τη(ν) то же правило ν, что у артикля: **Την ξέρω. Την περιμένω.**, но **Τη βλέπω.**

      **Место — перед глаголом**, хотя по-русски часто наоборот: **Σε περιμένω.** — «Жду тебя». Если есть δεν или να, местоимение стоит между ними и глаголом: Δεν **σε** καταλαβαίνω. Θέλω να **το** δω. Μπορώ να **σας** ρωτήσω κάτι; Частая ошибка — ставить местоимение после глагола, как в русском: не «Περιμένω σε», а **Σε περιμένω**.

      Не путайте: **με** — ещё и предлог «с»: Πάω **με** τον φίλο μου. Предлог стоит перед существительным, а местоимение — перед глаголом.
    table:
      columns:
        - лицо
        - ед. ч.
        - мн. ч.
      rows:
