          - τα — их
  - type: exercise
    id: acc-replace
    title: Кого? Что?
    instruction: Выберите слабое местоимение, которое заменяет в ответе слово из вопроса.
    format: choice
    items:
      - id: q1
        prompt: — Ξέρεις τον Γιώργο; — Ναι, ___ ξέρω.
        options:
          - τον
          - την
          - το
        answer: τον
        explanation: ο Γιώργος — мужской род, поэтому τον.
      - id: q2
        prompt: — Βλέπεις τη Σοφία; — Ναι, ___ βλέπω.
        options:
          - τον
          - τη
          - το
        answer: τη
        explanation: η Σοφία — женский род. Перед β буква ν выпадает — τη βλέπω.
      - id: q3
        prompt: — Πού είναι το κλειδί μου; — Δεν ___ βρίσκω.
        options:
          - τον
          - τη
          - το
        answer: το
      - id: q4
        prompt: — Θέλεις τα γλυκά; — Όχι, δεν ___ θέλω.
        options:
          - τους
          - τις
          - τα
        answer: τα
        explanation: τα γλυκά — средний род, мн. ч.
      - id: q5
        prompt: — Περιμένεις τις φίλες σου; — Ναι, ___ περιμένω.
        options:
          - τους
          - τις
          - τα
        answer: τις
      - id: q6
        prompt: — Ξέρετε τους συναδέλφους μου; — Όχι, δεν ___ ξέρουμε.
        options:
          - τους
          - τις
          - τα
        answer: τους
      - id: q7
        prompt: — Γιάννη, ___ ακούς; — Ναι, σε ακούω!
        options:
          - με
          - σε
          - μας
        answer: με
        explanation: "Ответ «σε ακούω» — «я тебя слышу». Значит, спрашивали «ты меня слышишь?» — με ακούς;"
      - id: q8
        prompt: — Μαρία, μας περιμένεις; — Ναι, ___ περιμένω.
        options:
          - σας
          - μας
          - σε
        answer: σας
        explanation: "Спросили «ты нас ждёшь?» — отвечают «да, я вас жду»: σας."
  - type: explanation
    id: clitics-gen
    title: Μου, σου, του… — «мне, тебе, ему» и повелительная форма
    body: |-
      Вторую группу слабых форм вы тоже знаете: το σπίτι **μου** — «мой дом», **Μου** αρέσει ο καφές — «мне нравится кофе». Это родительный падеж. После существительного он значит «чей» (мой, твой, его…), а **перед глаголом — «кому»**: **Σου** δίνω το κλειδί. — «Даю тебе ключ». **Της** έγραψα ένα μήνυμα. — «Я написал(а) ей сообщение» (το μήνυμα — сообщение). Τι **σου** είπε ο γιατρός; — «Что тебе сказал врач?»

      Место то же, что у με, σε: перед глаголом, после δεν и να: Δεν **μου** αρέσει. Πρέπει να **σου** πω κάτι.

      Когда нужны оба местоимения, сначала «кому», потом «что»: **Μου το** δίνεις; — «Дашь мне его?», как в Μπορείτε να **μου το** δείξετε; (модуль 12).

      **После повелительной формы** все слабые местоимения стоят **после** глагола (вы видели Φέρε μου, модуль 09): **Πες μου!** — «Скажи мне!», **Δώσε μου** το νερό. — «Дай мне воду». **Φέρε το!** — «Принеси его!». Очень частая фраза: **Πάρε με τηλέφωνο!** — «Позвони мне!» (дословно «возьми меня по телефону»), вежливо **Πάρτε με τηλέφωνο.**
    table:
