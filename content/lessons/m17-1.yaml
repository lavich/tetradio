  - type: exercise
    id: gen-choice
    title: Кому?
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Ο γιατρός ___ είπε να μείνω στο σπίτι.
        options:
          - μου
          - με
          - σου
        answer: μου
        explanation: "«Сказал мне» — кому? — родительный падеж μου. На «меня» указывает и να μείνω."
      - id: q2
        prompt: Γράφω στη Μαρία. → ___ γράφω ένα μήνυμα.
        options:
          - Της
          - Την
          - Του
        answer: Της
        explanation: "Пишу кому? — ей: της. Την — «её» (кого?)."
      - id: q3
        prompt: Δίνεις στον Νίκο το κλειδί; → ___ δίνεις το κλειδί;
        options:
          - Του
          - Τον
          - Της
        answer: Του
      - id: q4
        prompt: Θέλω να ___ πω κάτι. (тебе)
        options:
          - σου
          - σε
          - εσύ
        answer: σου
      - id: q5
        prompt: «Позвони мне завтра!»
        options:
          - Πάρε με τηλέφωνο αύριο!
          - Με πάρε τηλέφωνο αύριο!
          - Πάρε σε τηλέφωνο αύριο!
        answer: Πάρε με τηλέφωνο αύριο!
        explanation: После повелительной формы местоимение стоит после глагола.
      - id: q6
        prompt: «Скажи мне, что случилось!»
        options:
          - Πες μου τι έγινε!
          - Μου πες τι έγινε!
          - Πες με τι έγινε!
        answer: Πες μου τι έγινε!
        explanation: "«Мне» — кому? — μου; после повелительной формы — после глагола. Τι έγινε; — «что случилось?» (γίνομαι, модуль 15)."
  - type: exercise
    id: word-order
    title: Где стоит местоимение
    instruction: Выберите правильный порядок слов.
    format: choice
    items:
      - id: q1
        prompt: Я тебя не понимаю.
        options:
          - Δεν σε καταλαβαίνω.
          - Δεν καταλαβαίνω σε.
          - Σε δεν καταλαβαίνω.
        answer: Δεν σε καταλαβαίνω.
        explanation: Порядок — δεν + местоимение + глагол.
      - id: q2
        prompt: Я хочу его посмотреть (дом).
        options:
          - Θέλω να το δω.
          - Θέλω το να δω.
          - Θέλω να δω το.
        answer: Θέλω να το δω.
      - id: q3
        prompt: Дай мне воду!
        options:
          - Δώσε μου το νερό!
          - Μου δώσε το νερό!
          - Δώσε με το νερό!
        answer: Δώσε μου το νερό!
      - id: q4
        prompt: Я вас жду.
        options:
          - Σας περιμένω.
          - Περιμένω σας.
          - Εσάς περιμένω σας.
        answer: Σας περιμένω.
      - id: q5
        prompt: Можно вас кое о чём спросить?
        options:
          - Μπορώ να σας ρωτήσω κάτι;
          - Μπορώ σας να ρωτήσω κάτι;
          - Μπορώ να ρωτήσω σας κάτι;
        answer: Μπορώ να σας ρωτήσω κάτι;
  - type: explanation
    id: ponao
    title: Με πονάει — «у меня болит», и νιώθω
    body: |-
      По-гречески говорят «меня болит голова»: **Με πονάει το κεφάλι μου.** Тот, у кого болит, — слабое местоимение в **винительном** падеже: με, σε, τον, τη(ν)… Не путайте с μου αρέσει: там родительный. Правильно **με πονάει**, а не «μου πονάει».

      То, что болит, — подлежащее в именительном падеже, и глагол согласуется с ним: болит одно — **πονάει**, несколько — **πονάνε** (или πονούν): Με πονάει **το δόντι** μου. Με πονάνε **τα πόδια** μου. «Мой» в конце обычно говорят, но можно и без него: Με πονάει το κεφάλι.

      Спросить: **Πού σε πονάει;** — «Где у тебя болит?», вежливо Πού σας πονάει; О другом человеке: **Τον** πονάει ο λαιμός του. **Την** πονάει η πλάτη της.

      Сам глагол **πονάω** спрягается как μιλάω. **Πονάω πολύ.** — «Мне очень больно». **Πονάει;** — «Больно?»

      **Νιώθω** — «чувствую (себя)», обычный глагол на -ω: νιώθω, νιώθεις, νιώθει, νιώθουμε, νιώθετε, νιώθουν. **Πώς νιώθεις;** — «Как ты себя чувствуешь?» — **Νιώθω καλά.** / **Δεν νιώθω καλά.** — «Мне нехорошо». / **Νιώθω άσχημα.** — «Мне плохо» (άσχημος, модуль 07).
    table:
      columns:
        - у кого
        - болит одно
        - болит несколько
      rows:
        - - у меня
          - Με πονάει το κεφάλι μου.
          - Με πονάνε τα μάτια μου.
        - - у тебя
          - Σε πονάει το δόντι σου;
          - Σε πονάνε τα αυτιά σου;
        - - у него
          - Τον πονάει ο λαιμός του.
          - Τον πονάνε τα γόνατά του.
        - - у неё
          - Την πονάει η πλάτη της.
          - Την πονάνε τα πόδια της.
        - - у нас
          - Μας πονάει η κοιλιά μας.
          - Μας πονάνε τα χέρια μας.
        - - у вас
          - Σας πονάει το στομάχι σας;
          - Σας πονάνε οι ώμοι σας;
        - - у них
          - Τους πονάει το κεφάλι τους.
          - Τους πονάνε τα πόδια τους.
  - type: exercise
    id: ponao-gap
    title: Что болит
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - με
      - σε
      - τον
      - την
      - μου
      - πονάει
      - πονάνε
      - νιώθω
      - νιώθεις
    items:
      - id: g1
        prompt: Σήμερα ___ πονάει το κεφάλι μου.
        answer: με
      - id: g2
        prompt: Περπάτησα πολύ και τώρα με ___ τα πόδια μου.
        answer: πονάνε
        explanation: Болят τα πόδια — несколько, поэтому πονάνε.
      - id: g3
        prompt: — Πού ___ πονάει, Νίκο; — Εδώ, στο στομάχι.
        answer: σε
      - id: g4
        prompt: "Ο Πέτρος δεν είναι καλά: ___ πονάει ο λαιμός του."
        answer: τον
      - id: g5
        prompt: "Η Ελένη είναι στο κρεβάτι: ___ πονάει η πλάτη της."
        answer: την
        explanation: Перед π буква ν остаётся — την πονάει.
      - id: g6
        prompt: — Πώς ___ σήμερα; — Καλά, ευχαριστώ.
        answer: νιώθεις
      - id: g7
        prompt: Δεν ___ καλά, πάω σπίτι.
        answer: νιώθω
      - id: g8
        prompt: Με πονάει το γόνατό ___.
        answer: μου
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: У меня болит голова.
        answer:
          - Με πονάει το κεφάλι μου.
          - Με πονάει το κεφάλι.
          - Το κεφάλι μου με πονάει.
          - Έχω πονοκέφαλο.
      - id: q2
        prompt: Где у тебя болит?
        answer:
          - Πού σε πονάει;
      - id: q3
        prompt: У меня болят ноги.
        answer:
          - Με πονάνε τα πόδια μου.
          - Με πονάνε τα πόδια.
          - Με πονούν τα πόδια μου.
          - Με πονούν τα πόδια.
        explanation: "Болят τα πόδια — мн. ч.: πονάνε или πονούν."
      - id: q4
        prompt: У меня болит горло.
        answer:
          - Έχω πονόλαιμο.
          - Με πονάει ο λαιμός μου.
          - Με πονάει ο λαιμός.
      - id: q5
        prompt: Мне нехорошо.
        answer:
          - Δεν νιώθω καλά.
          - Δεν είμαι καλά.
      - id: q6
        prompt: Я тебя жду.
        answer:
          - Σε περιμένω.
          - Εγώ σε περιμένω.
