blocks:
  - type: explanation
    id: body
    title: Το σώμα — части тела
    body: |-
      **Το σώμα** — тело. Почти все части тела — обычные существительные, и множественное число строится по правилам модуля 07.

      **Средний род на -ι** — мн. ч. на -ια, как σπίτι → σπίτια: το κεφάλι → τα κεφάλια, το μάτι → τα μάτια, το δόντι → τα δόντια, το χέρι → τα χέρια, το πόδι → τα πόδια, το στομάχι → τα στομάχια. У **το αυτί** — «ухо» — ударение и во мн. ч. на конце: **τα αυτιά**.

      **Το σώμα** и **το στόμα** — «рот» — меняются как το όνομα → τα ονόματα: τα σώματα, τα στόματα. **Το δάχτυλο** и **το γόνατο** — мн. ч. на -α: τα δάχτυλα, τα γόνατα.

      Женский род: **η μύτη** — нос, **η πλάτη** — спина (мн. ч. -ες); **η κοιλιά** — живот, **η καρδιά** — сердце (мн. ч. οι κοιλιές, οι καρδιές). Мужской: **ο λαιμός** — и «шея», и «горло»; **ο ώμος** — плечо.

      Как в русском, **το χέρι** — и вся рука, и кисть; **το πόδι** — и нога, и ступня; **το δάχτυλο** — палец руки и ноги. **Η κοιλιά** — живот, **το στομάχι** — желудок; о боли в животе говорят и так, и так.

      **Второй тонос** (модуль 03, το όνομά μου): если ударение стоит на третьем слоге с конца, перед μου, σου, του… появляется второе ударение — **το γόνατό μου**, **το δάχτυλό σου**, **τα γόνατά του**. У το κεφάλι μου, το στομάχι μου второго тоноса нет: ударение там на предпоследнем слоге.

      **Боль и кашель.** **Ο πόνος** — боль. **Ο πονοκέφαλος** — головная боль (πόνος + κεφάλι), **ο πονόλαιμος** — боль в горле. С ними говорят **έχω** + винительный падеж, без -ς: **Έχω πονοκέφαλο. Έχω πονόλαιμο.** **Ο βήχας** — кашель, **βήχω** — кашлять (обычный глагол на -ω, аорист έβηξα): **Έχω βήχα. Βήχω όλη τη νύχτα.**
