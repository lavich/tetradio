title: Контрольная модуля e05
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 10–15 минут: чтение, аудирование, вопросы и косвенные вопросы, слова модуля и перевод фраз. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза; в вопросах к диалогу три варианта, верен один. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: blog
    title: My first video interview
    text: |-
      My first video interview

      Last month I had my first video interview for a backend position. The interviewer spoke fast, and my first reaction was to nod and hope for the best. Then I remembered the advice from my course and asked her to repeat the question.

      The next question was ambiguous: she asked how I would improve performance. I asked whether she meant the database or the API. She said the API, and the task became clear.

      Later she asked about the size of our user base. I did not remember the exact number, so I said, "Off the top of my head, about fifty thousand, but I can check."

      One question was a curveball: she asked how I would explain a database index to a child. I needed a moment, so I said, "That's a good question. Let me think about it for a second." The answer came easily after the pause.

      After the interview, I sent a short email with a follow-up on two details. The recruiter replied the next day.
    glosses:
      - { text: nod, russian: кивать }
      - { text: hope for the best, russian: надеяться на лучшее }
      - { text: user base, russian: число пользователей }
      - { text: index, russian: индекс базы данных }
      - { text: replied, russian: ответил }
  - type: exercise
    id: blog-tf
    about: blog
    graded: true
    title: Чтение
    instruction: Верно (True) или неверно (False)?
    format: choice
    items:
      - id: q1
        prompt: The interviewer spoke slowly.
        options: ["True", "False"]
        answer: "False"
        explanation: The interviewer spoke fast — интервьюер говорила быстро.
      - id: q2
        prompt: The writer asked the interviewer to repeat a question.
        options: ["True", "False"]
        answer: "True"
      - id: q3
        prompt: The question about performance was clear from the start.
        options: ["True", "False"]
        answer: "False"
        explanation: The question was ambiguous — вопрос допускал два толкования, и автор уточнил.
      - id: q4
        prompt: The writer gave the exact number of users.
        options: ["True", "False"]
        answer: "False"
        explanation: Off the top of my head, about fifty thousand — число названо навскидку.
      - id: q5
        prompt: The curveball question was about explaining a database index.
        options: ["True", "False"]
        answer: "True"
  - type: listening
    id: call
    title: How do you split a service?
    plays: 2
    transcript:
      - { speaker: Sarah, text: "Viktor, thanks for joining. I'll start with an open-ended one: how do you decide when a service should be split into smaller services?", audio: e05-test/call-1.mp3 }
      - { speaker: Viktor, text: "Sorry, could you repeat the question, please?", audio: e05-test/call-2.mp3 }
      - { speaker: Sarah, text: "Of course. How do you decide when a service should be split into smaller services?", audio: e05-test/call-3.mp3 }
      - { speaker: Viktor, text: "That's a good question. Let me think about it for a second. Do you mean a split in the code, or in the deployment?", audio: e05-test/call-4.mp3 }
      - { speaker: Sarah, text: "Both, really. Let's say the team is growing and the releases are getting slower.", audio: e05-test/call-5.mp3 }
      - { speaker: Viktor, text: "I see. In other words, the main problem is the release speed. In that case, a service is ready to be split when two teams keep changing it at the same time.", audio: e05-test/call-6.mp3 }
      - { speaker: Sarah, text: "Good. Could you give me an example from your own work?", audio: e05-test/call-7.mp3 }
      - { speaker: Viktor, text: "Last year we separated the payment module. Off the top of my head, the release time dropped from two weeks to three days.", audio: e05-test/call-8.mp3 }
      - { speaker: Sarah, text: "Thanks. One last thing: could you tell me what you would do differently?", audio: e05-test/call-9.mp3 }
      - { speaker: Viktor, text: "I would involve the other teams earlier. We had a misunderstanding about the API, and it cost us a week.", audio: e05-test/call-10.mp3 }
  - type: exercise
    id: call-q
    about: call
    graded: true
    title: Аудирование
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What does Sarah ask first?
        options:
          - when a service should be split into smaller services
          - which language the team uses
          - how many teams the company has
        answer: when a service should be split into smaller services
      - id: q2
        prompt: What does Viktor ask after he thinks for a second?
        options:
          - whether the split is in the code or in the deployment
          - how big the team is
          - which service Sarah means
        answer: whether the split is in the code or in the deployment
        explanation: Do you mean a split in the code, or in the deployment — вопрос с двумя вариантами.
      - id: q3
        prompt: What situation does Sarah describe?
        options:
          - a growing team and slower releases
          - a shrinking team and faster releases
          - a new team and no releases
        answer: a growing team and slower releases
      - id: q4
        prompt: When is a service ready to be split, according to Viktor?
        options:
          - when two teams keep changing it at the same time
          - when it has more than ten endpoints
          - when it is older than two years
        answer: when two teams keep changing it at the same time
      - id: q5
        prompt: How did the release time change after the payment module was separated?
        options:
          - from two weeks to three days
          - from three days to two weeks
          - from two days to three weeks
        answer: from two weeks to three days
      - id: q6
        prompt: What would Viktor do differently?
        options:
          - involve the other teams earlier
          - skip the payment module
          - start with a larger team
        answer: involve the other teams earlier
        explanation: I would involve the other teams earlier — вовлёк бы другие команды раньше.
  - type: exercise
    id: questions
    graded: true
    title: Вопросы и косвенные вопросы
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "How long ___ you been working there?"
        options: [have, did, do]
        answer: have
        explanation: Вопрос о периоде до сих пор — present perfect continuous.
      - id: q2
        prompt: "Who ___ the release last week? (вопрос к подлежащему)"
        options: [approved, did approved, did approve]
        answer: approved
        explanation: В вопросе к подлежащему вспомогательного глагола нет.
      - id: q3
        prompt: "Could you tell me what ___?"
        options: [you mean, do you mean, you do mean]
        answer: you mean
        explanation: В косвенном вопросе порядок слов как в утверждении.
      - id: q4
        prompt: "Do you know ___ the interview will be online? (ли)"
        options: [if, that, what]
        answer: if
        explanation: Вопрос «да или нет» вводится словом if или whether.
      - id: q5
        prompt: Какое предложение верно?
        options:
          - I would like to know how long the process takes.
          - I would like to know how long does the process take.
        answer: I would like to know how long the process takes.
      - id: q6
        prompt: Вы услышали все слова, но вопрос можно понять двумя способами. Какая фраза подходит?
        options:
          - Do you mean the frontend or the backend?
          - Could you speak a little more slowly?
          - Let me share my screen to show it.
        answer: Do you mean the frontend or the backend?
  - type: exercise
    id: words
    graded: true
    title: Слова модуля
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - clarify
      - nuance
      - vague
      - elaborate
      - follow-up
      - curveball
      - presumably
      - tangent
    items:
      - id: g1
        prompt: I did not understand the task, so I asked the manager to ___ the requirements. (уточнить)
        answer: clarify
      - id: g2
        prompt: "The answer was too ___: it had no numbers and no examples. (расплывчатый)"
        answer: vague
      - id: g3
        prompt: The interviewer asked a ___ question about my last project. (уточняющий)
        answer: follow-up
      - id: g4
        prompt: An unexpected question about a topic I did not mention was a ___. (неожиданный вопрос)
        answer: curveball
      - id: g5
        prompt: I went off on a ___, and the interviewer brought me back to the topic. (в побочную тему)
        answer: tangent
      - id: g6
        prompt: Could you ___ on that point? I would like more detail. (рассказать подробнее)
        answer: elaborate
