blocks:
  - type: explanation
    id: professions
    title: Кем вы работаете
    body: |-
      «Кем ты работаешь?» — **Τι δουλειά κάνεις;** (модуль 02), вежливо — **Τι δουλειά κάνετε;** Ответить можно по-разному:

      **Είμαι λογιστής.** — «Я бухгалтер». Артикля перед профессией нет, как в русском.

      **Δουλεύω ως λογίστρια σε μια εταιρεία.** — «Я работаю бухгалтером в компании». **Ως** значит «в качестве». После него профессия стоит в именительном падеже, а не в творительном, как в русском: ως λογίστρια, ως μάγειρας.

      **Εργάζομαι σε ένα εργοστάσιο.** — «Я работаю на заводе». Εργάζομαι значит то же, что δουλεύω, но звучит официальнее: так пишут в резюме и говорят на собеседовании. Спрягается как έρχομαι: εργάζομαι, εργάζεσαι, εργάζεται…

      Где работают: σε μια εταιρεία, σε ένα εργοστάσιο, σε ένα ξενοδοχείο, σε μια ταβέρνα, σε μια τράπεζα, σε ένα νοσοκομείο.

      Без работы: **Είμαι άνεργος / άνεργη** — «Я безработный / безработная». **Είμαι συνταξιούχος** — «Я на пенсии». О будущей профессии: **Θέλω να γίνω μάγειρας** — «Я хочу стать поваром». После γίνομαι («становиться») — тоже именительный падеж.

      **Род.** У многих профессий есть женская форма: ο λογιστής → η λογίστρια, ο διευθυντής → η διευθύντρια. У других слово одно, меняется только артикль: ο/η γραμματέας, ο/η υπάλληλος, ο/η συνάδελφος. Среди них и слова на -ος: **Η Ελένη είναι μηχανικός.** Окончание -ος с женским артиклем здесь нормально, как у η γιατρός (модуль 03).

      **Множественное число.** Слова на -ής получают -ές: οι λογιστές, οι διευθυντές. У ο γραμματέας форма особая: οι γραμματείς. Слова на -ος получают -οι: οι συνάδελφοι, οι μηχανικοί.
