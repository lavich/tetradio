  - type: explanation
    id: interesting
    title: Интересная работа
    body: |-
      Прилагательное **ενδιαφέρων** — «интересный» — склоняется по-особому: ενδιαφέρων (м. р.), **ενδιαφέρουσα** (ж. р.), **ενδιαφέρον** (ср. р.). Чаще всего вы скажете: **Η δουλειά μου είναι ενδιαφέρουσα.** — «Моя работа интересная». **Το επάγγελμά σου είναι ενδιαφέρον!** — «У тебя интересная профессия!»

      Обратите внимание: το επάγγελμα + μου → **το επάγγελμά μου**, со вторым знаком ударения, как το τηλέφωνό σου (модуль 04). Так же **οι συνάδελφοί μου** — во фразе «Μου αρέσουν οι συνάδελφοί μου» («Мне нравятся мои коллеги»).
    table:
      columns:
        - род
        - форма
        - пример
      rows:
        - - мужской
          - ενδιαφέρων
          - Ο διευθυντής μου είναι ενδιαφέρων άνθρωπος.
        - - женский
          - ενδιαφέρουσα
          - Η δουλειά μου είναι ενδιαφέρουσα.
        - - средний
          - ενδιαφέρον
          - Το επάγγελμά σου είναι ενδιαφέρον.
