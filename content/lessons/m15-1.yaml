  - type: exercise
    id: jobs-form
    title: Мужчина или женщина
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Η Ελένη δουλεύει σε μια τράπεζα. Είναι ___.
        options:
          - λογίστρια
          - λογιστής
          - λογιστές
        answer: λογίστρια
        explanation: О женщине — женская форма η λογίστρια.
      - id: q2
        prompt: Η αδελφή μου είναι ___ σε ένα εργοστάσιο.
        options:
          - μηχανικός
          - μηχανική
          - μηχανικοί
        answer: μηχανικός
        explanation: Женщина-инженер — η μηχανικός, с окончанием -ος. Η μηχανική — это «техника» как наука, а не профессия.
      - id: q3
        prompt: Η Σοφία είναι ___ σε μια μεγάλη εταιρεία.
        options:
          - διευθύντρια
          - διευθυντής
          - διευθυντές
        answer: διευθύντρια
      - id: q4
        prompt: Ο Πέτρος είναι ___ σε μια ταβέρνα.
        options:
          - μάγειρας
          - μαγείρισσα
          - μάγειρες
        answer: μάγειρας
      - id: q5
        prompt: Η γιαγιά μου είναι εβδομήντα χρονών και δεν δουλεύει. Είναι ___.
        options:
          - συνταξιούχος
          - συνταξιούχοι
          - συνταξιούχα
        answer: συνταξιούχος
        explanation: Слово одно для мужчин и женщин — η συνταξιούχος. Συνταξιούχοι — мн. ч., а формы «συνταξιούχα» нет.
      - id: q6
        prompt: Οι ___ μου είναι πολύ καλοί.
        options:
          - συνάδελφοι
          - συνάδελφος
          - συναδέλφους
        answer: συνάδελφοι
        explanation: Коллеги — подлежащее, мн. ч., именительный падеж — οι συνάδελφοι.
      - id: q7
        prompt: Η Μαρίνα είναι ___ και ψάχνει δουλειά.
        options:
          - άνεργη
          - άνεργος
          - άνεργο
        answer: άνεργη
        explanation: Άνεργος — прилагательное, у него три рода. О женщине — άνεργη.
      - id: q8
        prompt: Η δουλειά μου είναι πολύ ___.
        options:
          - ενδιαφέρουσα
          - ενδιαφέρων
          - ενδιαφέρον
        answer: ενδιαφέρουσα
        explanation: η δουλειά — женский род, поэтому ενδιαφέρουσα.
  - type: explanation
    id: past-irregular
    title: Прошедшее время частотных глаголов
    body: |-
      В модуле 14 вы строили аорист — прошедшее время законченного действия — у правильных глаголов: основа + σ, ξ или ψ + окончания: δουλεύω → **δούλεψα**, ταξιδεύω → ταξίδεψα, αγοράζω → αγόρασα.

      Но самые частые глаголы образуют прошедшее время по-своему: основу прошедшего времени нужно просто запомнить. Окончания у них те же, что у правильных: **-α, -ες, -ε, -αμε, -ατε, -αν**.

      Эти формы вы уже видели на карточках: αор. πήγα, αор. ήρθα… Теперь они нужны в речи — чтобы рассказать, где вы работали, когда приехали на Кипр, что делали вчера.

      **Είμαι** и **έχω** — особые. Аориста у них нет: **ήμουν** («я был, была») и **είχα** («у меня был, было») — их единственное прошедшее время.

      Ещё два знакомых глагола того же типа: βγαίνω → **βγήκα** («я вышел»), φεύγω → **έφυγα** («я ушёл, уехал»).
    table:
      columns:
        - настоящее
        - прошедшее (я)
        - перевод
      rows:
        - - είμαι
          - ήμουν
          - я был, была
        - - έχω
          - είχα
          - у меня был, была, было
        - - πηγαίνω (πάω)
          - πήγα
          - я пошёл, поехал; сходил, съездил
        - - έρχομαι
          - ήρθα
          - я пришёл, приехал
        - - βλέπω
          - είδα
          - я увидел, посмотрел
        - - λέω
          - είπα
          - я сказал
        - - κάνω
          - έκανα
          - я сделал
        - - τρώω
          - έφαγα
          - я поел, съел
        - - πίνω
          - ήπια
          - я выпил
        - - βρίσκω
          - βρήκα
          - я нашёл
        - - παίρνω
          - πήρα
          - я взял
        - - δίνω
          - έδωσα
          - я дал
  - type: explanation
    id: past-forms
    title: Формы и ударение
    body: |-
      **Ударение** — по правилу модуля 14: в аористе оно стоит на третьем слоге от конца, если в форме хватает слогов. У **έκανα, έφαγα, έδωσα** (как у правильных έγραψα) в формах «я, ты, он» впереди появляется **έ-**, чтобы ударению было куда встать: έ-κα-να, έ-φα-γα, έ-δω-σα. В формах «мы» и «вы» слогов уже три без него, и έ- исчезает: **κάναμε, κάνατε; φάγαμε; δώσαμε**. В форме «они» έ- остаётся: έκαναν, έφαγαν, έδωσαν.

      У **ήρθα, είδα, είπα, ήπια** начальная гласная — часть самой основы, она не исчезает никогда: ήρθαμε, είδαμε, είπαμε, ήπιαμε. У **πήγα, βρήκα, πήρα, βγήκα** никакого έ- нет, ударение всегда на основе: πήγαμε, βρήκαμε, πήραμε.

      В разговоре к форме «они» часто добавляют -ε: πήγανε, ήρθανε, είδανε. Тогда слогов становится больше, и έ- исчезает: έκαναν → **κάνανε**, έφαγαν → **φάγανε**.

      **Ήμουν** спрягается по-своему (см. таблицу). Форма одна для всех родов: Ο Νίκος ήταν…, Η Άννα ήταν…, Τα παιδιά ήταν… В разговоре говорят и ήμουνα, ήτανε.

      Отрицание и вопрос — как в настоящем времени: **Δεν πήγα** στη δουλειά. **Τι έκανες** χθες;
    table:
      columns:
        - лицо
        - ήμουν
        - είχα
        - πήγα
        - έκανα
        - ήρθα
      rows:
        - - εγώ
          - ήμουν
          - είχα
          - πήγα
          - έκανα
          - ήρθα
        - - εσύ
          - ήσουν
          - είχες
          - πήγες
          - έκανες
          - ήρθες
        - - αυτός, αυτή
          - ήταν
          - είχε
          - πήγε
          - έκανε
          - ήρθε
        - - εμείς
          - ήμασταν
          - είχαμε
          - πήγαμε
          - κάναμε
          - ήρθαμε
        - - εσείς
          - ήσασταν
          - είχατε
          - πήγατε
          - κάνατε
          - ήρθατε
        - - αυτοί, αυτές
          - ήταν
          - είχαν
          - πήγαν
          - έκαναν
          - ήρθαν
  - type: exercise
    id: past-match
    title: Настоящее и прошедшее
    instruction: Соедините глагол с формой прошедшего времени «я». Две формы лишние.
    format: match
    bank:
      - ήμουν
      - είχα
      - πήγα
      - ήρθα
      - είδα
      - είπα
      - έφαγα
      - ήπια
      - πήρα
      - βρήκα
    items:
      - id: m1
        prompt: είμαι
        answer: ήμουν
      - id: m2
        prompt: έχω
        answer: είχα
      - id: m3
        prompt: πηγαίνω
        answer: πήγα
      - id: m4
        prompt: έρχομαι
        answer: ήρθα
        explanation: ήρθα — «пришёл, приехал», πήγα — «пошёл, поехал».
      - id: m5
        prompt: βλέπω
        answer: είδα
      - id: m6
        prompt: λέω
        answer: είπα
        explanation: είδα (βλέπω) и είπα (λέω) отличаются одной буквой — δ или π.
      - id: m7
        prompt: τρώω
        answer: έφαγα
      - id: m8
        prompt: πίνω
        answer: ήπια
  - type: exercise
    id: past-person
    title: Какая форма
    instruction: Выберите правильную форму прошедшего времени.
    format: choice
    items:
      - id: q1
        prompt: Χθες (εγώ) ___ στη δουλειά με το λεωφορείο.
        options:
          - πήγα
          - πήγε
          - πήγαμε
        answer: πήγα
      - id: q2
        prompt: — Τι ___ (εσύ) το Σάββατο; — Πήγα στη θάλασσα.
        options:
          - έκανες
          - έκανε
          - κάνατε
        answer: έκανες
      - id: q3
        prompt: Ο διευθυντής ___ «Καλημέρα» σε όλους.
        options:
          - είπε
          - είπα
          - είπαν
        answer: είπε
      - id: q4
        prompt: Χθες εμείς ___ σουβλάκια στην ταβέρνα.
        options:
          - φάγαμε
          - έφαγαμε
          - έφαγε
        answer: φάγαμε
        explanation: В форме «мы» три слога, поэтому έ- исчезает — φάγαμε. Формы «έφαγαμε» нет.
      - id: q5
        prompt: Χθες οι συνάδελφοί μου ___ καφέ μετά τη δουλειά.
        options:
          - ήπιαν
          - ήπιε
          - ήπια
        answer: ήπιαν
      - id: q6
        prompt: Πέρσι η Άννα ___ δουλειά σε ένα ξενοδοχείο.
        options:
          - βρήκε
          - βρήκα
          - βρήκαν
        answer: βρήκε
      - id: q7
        prompt: Εσείς ___ στην Κύπρο πριν από τρία χρόνια;
        options:
          - ήρθατε
          - ήρθαμε
          - ήρθες
        answer: ήρθατε
      - id: q8
        prompt: Χθες (εγώ) δεν ___ χρόνο για μεσημεριανό.
        options:
          - είχα
          - είχε
          - είχαμε
        answer: είχα
      - id: q9
        prompt: Πέρσι ο Νίκος και η Μαρία ___ στη Λεμεσό.
        options:
          - ήταν
          - ήμασταν
          - ήσουν
        answer: ήταν
        explanation: Никос и Мария — «они». У ήμουν форма «они» совпадает с «он, она» — ήταν.
  - type: explanation
    id: now-then
    title: Сейчас или тогда
    body: |-
      **Настоящее время** — то, что происходит сейчас или обычно: **Τώρα δουλεύω** σε μια εταιρεία. **Κάθε μέρα πηγαίνω** στη δουλειά με το λεωφορείο.

      **Аорист** — законченное событие в прошлом: **Χθες πήγα** στη δουλειά με ταξί. **Πέρσι ήμουν** άνεργη. **Πριν από δύο χρόνια ήρθα** στην Κύπρο.

      Аорист подходит и для законченного отрезка времени: **Δούλεψα πέντε χρόνια ως μάγειρας.** — «Я пять лет проработал поваром» (и больше там не работаю). А если вы работаете и сейчас, по-гречески говорят в настоящем времени с **εδώ και**: **Δουλεύω εδώ και τρία χρόνια ως μάγειρας.** — «Я работаю поваром уже три года».

      Для «делал регулярно, много раз» в прошлом в греческом есть ещё одно время, его вы узнаете в модуле 22. Пока рассказывайте о прошлом аористом: что сделали, куда поехали, сколько лет где проработали.
    table:
      columns:
        - сейчас, обычно — настоящее
        - законченное в прошлом — аорист
      rows:
        - - σήμερα, τώρα
          - χθες, προχθές
        - - κάθε μέρα, συνήθως, πάντα
          - πέρσι, τον περασμένο μήνα, την περασμένη εβδομάδα
        - - εδώ και δύο χρόνια (и сейчас)
          - πριν από δύο χρόνια
        - - Δουλεύω ως μάγειρας.
          - Δούλεψα δύο χρόνια ως μάγειρας.
        - - Κάθε μέρα τρώω στη δουλειά.
          - Χθες έφαγα στο σπίτι.
        - - Συνήθως παίρνω άδεια τον Αύγουστο.
          - Πέρσι πήρα άδεια τον Ιούλιο.
  - type: exercise
    id: now-or-then
    title: Настоящее или прошедшее
    instruction: Выберите форму. Подсказка — слова времени.
    format: choice
    items:
      - id: q1
        prompt: Κάθε μέρα ___ στη δουλειά στις οκτώ.
        options:
          - πηγαίνω
          - πήγα
        answer: πηγαίνω
      - id: q2
        prompt: Χθες ___ στη δουλειά στις δέκα.
        options:
          - πηγαίνω
          - πήγα
        answer: πήγα
      - id: q3
        prompt: Τώρα ___ λογίστρια σε μια εταιρεία.
        options:
          - είμαι
          - ήμουν
        answer: είμαι
      - id: q4
        prompt: Πέρσι ___ άνεργη.
        options:
          - είμαι
          - ήμουν
        answer: ήμουν
      - id: q5
        prompt: Συνήθως τρώω στη δουλειά, αλλά χθες ___ στο σπίτι.
        options:
