blocks:
  - type: explanation
    id: job-words
    title: Условия работы
    body: |-
      **Η θέση** — должность, вакансия: Ψάχνω μια καινούργια θέση. **Μόνιμη θέση** — постоянная работа. **Ο μισθός** — зарплата, обычно за месяц: Ο μισθός είναι χίλια τριακόσια ευρώ **τον μήνα**.

      **Το ωράριο** — график, часы работы. **Πλήρες ωράριο** — полный рабочий день, **μειωμένο ωράριο** — неполный. В объявлениях пишут и так: **πλήρης απασχόληση** — полная занятость, **μερική απασχόληση** — частичная. Πλήρης — прилагательное с особыми формами (η πλήρης απασχόληση, το πλήρες ωράριο); запомните эти сочетания целиком: **Δουλεύω με πλήρες ωράριο. Δουλεύω με μερική απασχόληση.**

      **Η βάρδια** — смена: πρωινή βάρδια — утренняя, απογευματινή — дневная (после обеда), βραδινή — вечерняя. Δουλεύω με βάρδιες — «Я работаю посменно».

      **Ο εργοδότης** — работодатель. **Προσλαμβάνω** — «беру на работу», аорист **προσέλαβα**. Очень частая фраза: **Με προσέλαβαν!** — «Меня взяли на работу!» (με — «меня», как в Με λένε).

      **Ιδιωτικός** — частный: μια ιδιωτική εταιρεία. **Υπεύθυνος** — ответственный: Είμαι υπεύθυνη. Как существительное **ο υπεύθυνος, η υπεύθυνη** — тот, кто отвечает за работу, руководитель.

      **Η εμπειρία** — опыт: **Έχω τρία χρόνια εμπειρία στις πωλήσεις** («в продажах»; ο πωλητής — продавец, модуль 10). **Το βιογραφικό** — резюме. **Στέλνω** — «отправляю», аорист **έστειλα**: Έστειλα το βιογραφικό μου χθες.

      **Ζητείται σερβιτόρος.** — «Требуется официант» — так начинаются объявления о работе, как Νοικιάζεται и Πωλείται (модули 06–07). Если нужно несколько человек — **Ζητούνται** σερβιτόροι.
    table:
      columns:
        - по-гречески
        - перевод
      rows:
        - - πλήρες ωράριο, πλήρης απασχόληση
          - полный рабочий день
        - - μειωμένο ωράριο, μερική απασχόληση
          - неполный рабочий день
        - - πρωινή / απογευματινή / βραδινή βάρδια
          - утренняя / дневная / вечерняя смена
        - - μόνιμη θέση
          - постоянная работа
        - - ιδιωτική εταιρεία
          - частная компания
        - - ο μισθός τον μήνα
          - зарплата в месяц
        - - Ζητείται / Ζητούνται
          - требуется / требуются
        - - Με προσέλαβαν.
          - Меня взяли на работу.
