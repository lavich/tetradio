        answer: εμπειρία
  - type: explanation
    id: ad-how
    title: Как читать объявление о работе
    body: |-
      Объявления о работе (**αγγελίες εργασίας**) пишут коротко, часто без глаголов: «Μισθός: 1.500 €», «Πλήρης απασχόληση». Не нужно понимать каждое слово — ищите ответы на вопросы: какая работа (θέση) и где; какой график (ωράριο, βάρδιες); что нужно от вас (εμπειρία, γλώσσες); что предлагают (μισθός, μόνιμη θέση); как откликнуться.

      Два частых слова: **απαραίτητος** — «обязательный, необходимый» (Απαραίτητα τα αγγλικά — английский обязателен) и **στείλτε** — «пришлите» (Στείλτε το βιογραφικό σας). Остальные незнакомые слова переведены под текстом.
  - type: reading
    id: ads
    title: Αγγελίες εργασίας
    text: |-
      1. Ζητείται μάγειρας
      Το ξενοδοχείο «Γαλάζια Ακτή» στην Πάφο ζητάει μάγειρα ή μαγείρισσα για το εστιατόριο του ξενοδοχείου. Απαραίτητη εμπειρία: δύο χρόνια σε ξενοδοχείο ή ταβέρνα. Πλήρης απασχόληση, πρωινή και απογευματινή βάρδια. Μόνιμη θέση. Μισθός: 1.500 € τον μήνα. Στείλτε το βιογραφικό σας μέχρι τις 15 Μαρτίου.

      2. Ζητούνται σερβιτόροι
      Καφετέρια στο κέντρο της Λάρνακας ζητάει δύο σερβιτόρους ή σερβιτόρες για το καλοκαίρι (Ιούνιος – Σεπτέμβριος). Μερική απασχόληση: τέσσερις ώρες τη μέρα, απογευματινή βάρδια και τα σαββατοκύριακα. Δεν χρειάζεται εμπειρία. Απαραίτητα τα αγγλικά. Μισθός: 8 € την ώρα. Ελάτε για συνέντευξη κάθε πρωί από τις 10:00 μέχρι τις 12:00.

      3. Ιδιωτική εταιρεία στη Λευκωσία προσλαμβάνει γραμματέα
      Ωράριο: Δευτέρα – Παρασκευή, 8:00 – 16:00. Απαραίτητα: ελληνικά και αγγλικά, εμπειρία τουλάχιστον ένα χρόνο. Μισθός: 1.300 € τον μήνα. Στείλτε το βιογραφικό σας με email.
    glosses:
      - text: Γαλάζια Ακτή
        russian: «Голубой берег» (название отеля)
      - text: ζητάει
        russian: ищет, хочет найти
      - text: εστιατόριο
        russian: ресторан
      - text: Απαραίτητη
        russian: обязательный, необходимый
      - text: Στείλτε
        russian: пришлите
      - text: Καφετέρια
        russian: кафе
      - text: καλοκαίρι
        russian: лето
      - text: την ώρα
        russian: в час
      - text: Ελάτε
        russian: приходите
      - text: τουλάχιστον
        russian: не меньше, как минимум
  - type: exercise
    id: ads-tf
    about: ads
    title: Верно или неверно
    instruction: Прочитайте объявления. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το ξενοδοχείο ζητάει μάγειρα χωρίς εμπειρία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Απαραίτητη εμπειρία: δύο χρόνια — нужен опыт два года. Без опыта берут в кафе (объявление 2)."
      - id: q2
        prompt: Ο μάγειρας δουλεύει με πλήρες ωράριο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Πλήρης απασχόληση — то же, что πλήρες ωράριο.
      - id: q3
        prompt: Η θέση στο ξενοδοχείο είναι μόνο για το καλοκαίρι.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μόνιμη θέση — постоянная работа. Только на лето — вакансия в кафе.
      - id: q4
        prompt: Η καφετέρια ζητάει έναν σερβιτόρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ζητούνται σερβιτόροι… δύο σερβιτόρους ή σερβιτόρες — двоих.
      - id: q5
        prompt: Για συνέντευξη στην καφετέρια πηγαίνετε το πρωί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ελάτε για συνέντευξη κάθε πρωί από τις 10:00 μέχρι τις 12:00.
      - id: q6
        prompt: Η εταιρεία στη Λευκωσία ζητάει γραμματέα και για το Σάββατο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ωράριο — Δευτέρα – Παρασκευή, с понедельника по пятницу.
      - id: q7
        prompt: Ο γραμματέας πρέπει να μιλάει δύο γλώσσες.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Απαραίτητα: ελληνικά και αγγλικά."
  - type: exercise
    id: ads-who
    about: ads
    title: Какая вакансия подходит
    instruction: Прочитайте, что ищут эти люди, и выберите объявление.
    format: choice
    items:
      - id: q1
        prompt: Студентка хорошо говорит по-английски, опыта работы у неё нет. Она хочет работать летом несколько часов в день.
        options:
          - 1. Μάγειρας (Πάφος)
          - 2. Σερβιτόροι (Λάρνακα)
          - 3. Γραμματέας (Λευκωσία)
        answer: 2. Σερβιτόροι (Λάρνακα)
      - id: q2
        prompt: Мужчина пять лет работал поваром в таверне. Он ищет постоянную работу на полный день.
        options:
          - 1. Μάγειρας (Πάφος)
          - 2. Σερβιτόροι (Λάρνακα)
          - 3. Γραμματέας (Λευκωσία)
        answer: 1. Μάγειρας (Πάφος)
      - id: q3
        prompt: Женщина говорит по-гречески и по-английски, два года работала секретарём. По выходным она работать не хочет.
        options:
          - 1. Μάγειρας (Πάφος)
          - 2. Σερβιτόροι (Λάρνακα)
          - 3. Γραμματέας (Λευκωσία)
        answer: 3. Γραμματέας (Λευκωσία)
        explanation: В кафе работают и по выходным, а в компании — с понедельника по пятницу.
  - type: explanation
    id: interview-how
    title: На собеседовании
    body: |-
      На собеседовании говорят на «вы»: работодатель — с вами, и вы — с ним: **Πόσα χρόνια εμπειρία έχετε; Πότε μπορείτε να ξεκινήσετε;**

      Начать разговор или письмо можно так: **Είδα την αγγελία σας στο ίντερνετ.** — «Я увидел(а) ваше объявление в интернете». **Θα ήθελα να κάνω αίτηση για τη θέση.** — «Я хотел(а) бы подать заявку на эту должность» (η αίτηση — заявка, заявление).

      Об опыте и прошлой работе — аорист: **Δούλεψα δύο χρόνια σε ένα ξενοδοχείο. Πριν από ένα χρόνο ήρθα στην Κύπρο.** О том, что сейчас, — настоящее: **Τώρα δουλεύω… Μιλάω ελληνικά και αγγλικά.**

      Вопрос **Πού δουλέψατε πριν;** значит «Где вы работали раньше?» (πριν — «раньше, до этого»). В вопросе **Πότε μπορείτε να ξεκινήσετε;** после να стоит особая форма глагола ξεκινάω — ту же форму вы видели в θα ξεκινήσω; грамматику узнаете в модуле 16, а пока выучите фразу целиком. Ответить можно коротко: **Από τη Δευτέρα. Αμέσως.**
    table:
      columns:
        - вопрос
        - ответ
      rows:
        - - Πόσα χρόνια εμπειρία έχετε;
          - Έχω τρία χρόνια εμπειρία στις πωλήσεις.
        - - Πού δουλέψατε πριν;
          - Δούλεψα δύο χρόνια σε ένα ξενοδοχείο στη Λεμεσό.
        - - Τι γλώσσες μιλάτε;
          - Μιλάω ρωσικά, αγγλικά και λίγο ελληνικά.
        - - Πότε μπορείτε να ξεκινήσετε;
          - Από τη Δευτέρα.
        - - (вы спрашиваете) Πόσος είναι ο μισθός;
          - Χίλια τετρακόσια ευρώ τον μήνα.
  - type: exercise
    id: interview-match
    title: Вопрос и ответ
    instruction: Соедините вопрос работодателя с ответом. Два ответа лишние.
    format: match
    bank:
      - Έχω τρία χρόνια εμπειρία στις πωλήσεις.
      - Σε ένα ξενοδοχείο στη Λεμεσό.
      - Από τη Δευτέρα.
      - Χίλια τετρακόσια ευρώ τον μήνα.
      - Όχι, είμαι άνεργος εδώ και δύο μήνες.
      - Στο ίντερνετ.
      - Μιλάω ελληνικά και αγγλικά.
      - Είμαι τριάντα δύο χρονών.
    items:
      - id: m1
        prompt: Πόσα χρόνια εμπειρία έχετε;
        answer: Έχω τρία χρόνια εμπειρία στις πωλήσεις.
      - id: m2
        prompt: Πού δουλέψατε πριν;
        answer: Σε ένα ξενοδοχείο στη Λεμεσό.
      - id: m3
        prompt: Πότε μπορείτε να ξεκινήσετε;
        answer: Από τη Δευτέρα.
      - id: m4
        prompt: Τι γλώσσες μιλάτε;
        answer: Μιλάω ελληνικά και αγγλικά.
      - id: m5
        prompt: Δουλεύετε τώρα;
        answer: Όχι, είμαι άνεργος εδώ και δύο μήνες.
      - id: m6
        prompt: Πού είδατε την αγγελία μας;
        answer: Στο ίντερνετ.
  - type: explanation
    id: listen-how
    title: Как слушать собеседование
    body: |-
      Вы услышите собеседование в гостинице. Оно звучит два раза. В первый раз поймите, кто говорит и о какой работе. Перед вторым прослушиванием прочитайте вопросы.

      Следите за временем глаголов: **δούλεψα, ήρθα** — это прошлое, **δουλεύω τώρα** — настоящее. Ловушки в таких заданиях — числа и даты: общий опыт и годы на одном месте; день, когда человек может начать работу, и день, когда ему позвонят. В разговоре прозвучит **κύριε** — обращение «господин» (ο κύριος, модуль 09) и **Μπορώ να δουλέψω και στις δύο** — «Могу работать в обе (смены)»: после μπορώ να — особая форма, как в μπορώ να κλείσω (модуль 14).
  - type: listening
    id: interview
    title: Συνέντευξη στο ξενοδοχείο
    plays: 2
    transcript:
      - speaker: Ευαγγελία
        text: Καλημέρα σας, κύριε Ανδρέου. Είμαι η Ευαγγελία Πέτρου, η διευθύντρια του ξενοδοχείου.
      - speaker: Μάριος
        text: Καλημέρα σας. Χάρηκα πολύ.
      - speaker: Ευαγγελία
        text: Επίσης. Πώς βρήκατε την αγγελία μας;
      - speaker: Μάριος
        text: Ένας φίλος μου δουλεύει εδώ και μου είπε για τη θέση.
      - speaker: Ευαγγελία
        text: Ωραία. Πόσα χρόνια εμπειρία έχετε;
      - speaker: Μάριος
        text: Τέσσερα. Δούλεψα τρία χρόνια στη ρεσεψιόν σε ένα ξενοδοχείο στην Αθήνα και πέρσι ήρθα στην Κύπρο.
      - speaker: Ευαγγελία
        text: Και τι κάνετε τώρα;
      - speaker: Μάριος
        text: Τώρα δουλεύω σε ένα μικρό ξενοδοχείο στη Λεμεσό, αλλά μόνο με μερική απασχόληση. Θέλω μια μόνιμη θέση με πλήρες ωράριο.
      - speaker: Ευαγγελία
        text: Τι γλώσσες μιλάτε;
      - speaker: Μάριος
        text: Ελληνικά, αγγλικά και λίγο ρωσικά.
      - speaker: Ευαγγελία
        text: Πολύ καλά. Εδώ δουλεύουμε με βάρδιες. Η πρωινή βάρδια είναι από τις επτά μέχρι τις τρεις και η απογευματινή από τις τρεις μέχρι τις έντεκα.
      - speaker: Μάριος
        text: Μπορώ να δουλέψω και στις δύο, αλλά προτιμώ την πρωινή. Και πόσος είναι ο μισθός;
      - speaker: Ευαγγελία
        text: Χίλια τριακόσια ευρώ τον μήνα. Και το μεσημέρι τρώτε εδώ, στο ξενοδοχείο.
      - speaker: Μάριος
        text: Πολύ ωραία.
      - speaker: Ευαγγελία
        text: Πότε μπορείτε να ξεκινήσετε;
      - speaker: Μάριος
        text: Από την πρώτη Μαρτίου.
      - speaker: Ευαγγελία
        text: Ωραία. Σας παίρνω τηλέφωνο την Παρασκευή.
      - speaker: Μάριος
        text: Ευχαριστώ πολύ. Γεια σας!
  - type: exercise
    id: interview-choice
    about: interview
    title: Выберите ответ
    instruction: Прослушайте собеседование и выберите правильный ответ.
    format: choice
    items:
      - id: q1
