title: Контрольная модуля 02
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает около 15 минут: чтение, аудирование, грамматика, вопросы о себе и слова. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. В чтении и аудировании следите за словами **δεν, μόνο, λίγο, αλλά** — именно они часто меняют ответ.
  - type: reading
    id: sofia
    title: Η Σοφία
    text: |-
      Γεια σας! Με λένε Σοφία και είμαι Ελληνίδα, από τη Θεσσαλονίκη. Τώρα μένω στην Κύπρο, στη Λάρνακα, αλλά δουλεύω στη Λευκωσία. Μιλάω ελληνικά, αγγλικά και λίγο γαλλικά.

      Ο φίλος μου ο Ντμίτρι είναι Ρώσος, από τη Μόσχα. Αυτός μένει εδώ, στη Λάρνακα, και μαθαίνει ελληνικά. Καταλαβαίνει πολύ καλά, αλλά δεν γράφει καλά. Εμείς μιλάμε ελληνικά ή αγγλικά. Ρωσικά δεν ξέρω!
    glosses:
      - text: Θεσσαλονίκη
        russian: Салоники
      - text: γαλλικά
        russian: французский язык
  - type: exercise
    id: sofia-tf
    about: sofia
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Σοφία είναι από την Ελλάδα.
        options: [Σωστό, Λάθος]
        answer: Σωστό
        explanation: Είμαι Ελληνίδα, από τη Θεσσαλονίκη.
      - id: q2
        prompt: Η Σοφία δουλεύει στη Λάρνακα.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Живёт в Ларнаке, а работает — αλλά δουλεύω στη Λευκωσία — в Никосии.
      - id: q3
        prompt: Η Σοφία μιλάει πολύ καλά γαλλικά.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Λίγο γαλλικά — только немного.
      - id: q4
        prompt: Ο Ντμίτρι μένει στη Λάρνακα.
        options: [Σωστό, Λάθος]
        answer: Σωστό
        explanation: Αυτός μένει εδώ, στη Λάρνακα.
      - id: q5
        prompt: Ο Ντμίτρι γράφει πολύ καλά ελληνικά.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Καταλαβαίνει πολύ καλά, αλλά δεν γράφει καλά.
      - id: q6
        prompt: Η Σοφία και ο Ντμίτρι μιλάνε ρωσικά.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Μιλάμε ελληνικά ή αγγλικά. Ρωσικά δεν ξέρω — русского Софья не знает.
  - type: listening
    id: office
    title: Η αίτηση
    plays: 2
    transcript:
      - speaker: Γιώργος
        text: "Καλημέρα σας! Πώς σας λένε;"
      - speaker: Μαρία
        text: "Καλημέρα σας! Με λένε Μαρία Πετρόβα."
      - speaker: Γιώργος
        text: "Από ποια χώρα είστε, κυρία Πετρόβα;"
      - speaker: Μαρία
        text: "Από τη Ρωσία."
      - speaker: Γιώργος
        text: "Και πού μένετε; Στη Λευκωσία;"
      - speaker: Μαρία
        text: "Όχι, μένω στη Λάρνακα. Αλλά δουλεύω στη Λεμεσό."
      - speaker: Γιώργος
        text: "Τι γλώσσες μιλάτε;"
      - speaker: Μαρία
        text: "Μιλάω ρωσικά και αγγλικά. Ελληνικά καταλαβαίνω λίγο, αλλά δεν μιλάω."
      - speaker: Γιώργος
        text: "Δεν πειράζει. Ευχαριστώ, κυρία Πετρόβα. Γεια σας!"
      - speaker: Μαρία
        text: "Ευχαριστώ! Γεια σας!"
  - type: exercise
    id: office-choice
    about: office
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Από ποια χώρα είναι η Μαρία;
        options:
          - Από τη Ρωσία.
          - Από την Ελλάδα.
          - Από την Κύπρο.
        answer: Από τη Ρωσία.
      - id: q2
        prompt: Πού μένει η Μαρία;
        options:
          - Στη Λευκωσία.
          - Στη Λάρνακα.
          - Στη Λεμεσό.
        answer: Στη Λάρνακα.
        explanation: "Στη Λευκωσία; — Όχι, μένω στη Λάρνακα. Никосию называет Йоргос, а Мария отвечает «нет»."
      - id: q3
        prompt: Πού δουλεύει η Μαρία;
        options:
          - Στη Λάρνακα.
          - Στη Λεμεσό.
          - Στη Λευκωσία.
        answer: Στη Λεμεσό.
        explanation: Αλλά δουλεύω στη Λεμεσό.
      - id: q4
        prompt: Τι γλώσσες μιλάει η Μαρία;
        options:
          - Ρωσικά και αγγλικά.
          - Ρωσικά και ελληνικά.
          - Μόνο ρωσικά.
        answer: Ρωσικά και αγγλικά.
        explanation: Греческий она немного понимает, но не говорит — δεν μιλάω.
      - id: q5
        prompt: Как Йоргос и Мария говорят друг с другом?
        options:
          - на «ты»
          - на «вы»
        answer: на «вы»
        explanation: Πώς σας λένε; Πού μένετε; Γεια σας! — вежливые формы.
  - type: exercise
    id: articles
    graded: true
    title: Артикль
    instruction: Выберите артикль.
    format: choice
    items:
      - id: q1
        prompt: ___ γλώσσα
        options: [ο, η, το]
        answer: η
      - id: q2
        prompt: ___ Έλληνας
        options: [ο, η, το]
        answer: ο
      - id: q3
        prompt: ___ τηλέφωνο
        options: [ο, η, το]
        answer: το
      - id: q4
        prompt: ___ Κύπρος
        options: [ο, η, το]
        answer: η
        explanation: Κύπρος — женского рода, хотя кончается на -ος.
  - type: exercise
    id: grammar-gap
    graded: true
    title: Грамматика
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank: [μένω, μένεις, μιλάει, μαθαίνουμε, δουλεύετε, ξέρουν, δεν, στη]
    items:
      - id: g1
        prompt: — Πού ___; — Μένω στην Πάφο.
        answer: μένεις
      - id: g2
        prompt: Ο Νίκος ___ αγγλικά.
        answer: μιλάει
      - id: g3
        prompt: Εμείς ___ ελληνικά.
        answer: μαθαίνουμε
      - id: g4
        prompt: Κύριε Παύλο, πού ___;
        answer: δουλεύετε
        explanation: Вежливое обращение — форма «вы», -ετε.
      - id: g5
        prompt: Συγγνώμη, ___ καταλαβαίνω.
        answer: δεν
      - id: g6
        prompt: Η Άννα μένει ___ Λεμεσό.
        answer: στη
  - type: exercise
    id: ask
    graded: true
    title: Спросите и ответьте
    instruction: Напишите по-гречески. Не забудьте тонос.
    format: text
    items:
      - id: q1
        prompt: "Спросите друга: «Где ты живёшь?»"
        answer:
          - Πού μένεις;
          - Εσύ πού μένεις;
      - id: q2
        prompt: "Спросите экзаменатора, на «вы»: «На каких языках вы говорите?»"
        answer:
          - Τι γλώσσες μιλάτε;
          - Ποιες γλώσσες μιλάτε;
        explanation: На «вы» — окончание -άτε (μιλάτε).
      - id: q3
        prompt: Я живу на Кипре, но я из России.
        answer:
          - Μένω στην Κύπρο, αλλά είμαι από τη Ρωσία.
          - Μένω στην Κύπρο αλλά είμαι από τη Ρωσία.
          - Εγώ μένω στην Κύπρο, αλλά είμαι από τη Ρωσία.
        explanation: Перед κ ν остаётся — στην Κύπρο; перед ρ — τη Ρωσία, без ν.
  - type: exercise
    id: vocab-choice
    graded: true
    title: Слова и фразы
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Собеседник говорит слишком быстро.
        options:
          - Πιο αργά, παρακαλώ.
          - Τι σημαίνει αυτό;
          - Δεν πειράζει.
        answer: Πιο αργά, παρακαλώ.
      - id: q2
        prompt: — Τι γλώσσες μιλάς; —
        options:
          - Μιλάω ρωσικά και αγγλικά.
          - Μένω στη Λάρνακα.
          - Είμαι Ρωσίδα.
        answer: Μιλάω ρωσικά και αγγλικά.
      - id: q3
        prompt: Ή значит…
        options:
          - или
          - и
          - но
        answer: или
        explanation: Ή с тоносом — «или»; «и» — και, «но» — αλλά.
      - id: q4
        prompt: «Греческий язык» по-гречески —
        options:
          - τα ελληνικά
          - η Ελλάδα
          - ο Έλληνας
        answer: τα ελληνικά
      - id: q5
        prompt: Τι σημαίνει αυτό; значит…
        options:
          - Что это значит?
          - Как это по-гречески?
          - Ты понимаешь?
        answer: Что это значит?
      - id: q6
        prompt: Как сказать «Она гречанка»?
        options:
          - Είναι Ελληνίδα.
          - Είναι Έλληνας.
          - Είναι ελληνικά.
        answer: Είναι Ελληνίδα.
      - id: q7
        prompt: Εκεί значит…
        options:
          - там
          - здесь
          - только
        answer: там
        explanation: Εκεί — «там», εδώ — «здесь», μόνο — «только».
