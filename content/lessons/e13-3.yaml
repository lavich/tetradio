blocks:
  - type: explanation
    id: scheme
    title: Уточняющие вопросы к задаче в пяти шагах
    body: |-
      На собеседовании по инженерной части вам ставят задачу, и интервьюер смотрит, как вы выясняете условия, прежде чем решать. Единого верного набора вопросов нет: важно, чтобы вопросы были конкретными, шли от общего к частному и заканчивались итогом. Ответ укладывается примерно в две с половиной минуты.

      **1. Вступление.** Скажите, что сначала зададите вопросы: **Before I start, I'd like to ask a few questions.**

      **2. Пользователи.** Выясните, кто пользуется системой и сколько их: **Who are the people that will use this system?**

      **3. Нагрузка и данные.** Спросите про запросы, пик и объём данных: **How many requests do we expect per second?**

      **4. Качества и ограничения.** Уточните, что должно происходить при сбое, насколько важна свежесть данных, какие есть сроки: **Are there any constraints that I should know about?**

      **5. Итог.** Перескажите требования, назовите допущения и вынесите лишнее за рамки: **So, to summarise, we need a service that handles ten thousand requests a second.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - вступление
          - 10–15 секунд
          - Before I start, I'd like to ask a few questions.
        - - пользователи
          - 25–30 секунд
          - Who are the people that will use this system?
        - - нагрузка и данные
          - 35–40 секунд
          - What does the traffic look like at peak?
        - - качества и ограничения
          - 35–40 секунд
          - Is it okay if the data is slightly out of date?
        - - итог
          - 30–35 секунд
          - Let me confirm that I've understood the requirements.
  - type: explanation
    id: safe-questions
    title: Как задавать вопросы и называть допущения
    body: |-
      Вопросы к задаче показывают, что вы думаете о системе и о людях, которые на ней работают. Задавайте их спокойно и по существу: вы выясняете условия задачи. Если ответа нет, назовите допущение вслух и спросите, верно ли оно. Молчаливая догадка может привести к неверному решению.

      Не упрекайте постановщика за то, что чего-то не сказано, и не оценивайте задачу как неясную или плохую. Говорите о том, что вам нужно знать. Задачи на собеседовании вымышлены: используйте придуманные сервисы и числа; данные реальных систем и компаний не приводите.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - Why didn't you tell me about the deadline?
          - Is there a deadline that I should keep in mind?
          - вопрос без упрёка
        - - Your requirements are unclear.
          - Let me confirm that I've understood the requirements.
          - называют своё понимание
        - - I will just guess what you need.
          - I'm assuming that we don't need to handle payments.
          - допущение называют вслух
        - - That feature is obviously useless.
          - I'd leave that out of scope for now.
          - предлагают решение о границах
        - - I don't need to ask, I know what to build.
          - Before I start, I'd like to ask a few questions.
          - вопросы показывают внимание
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы начинаете и говорите, что сначала зададите вопросы. Какая фраза подходит?
        options:
          - Before I start, I'd like to ask a few questions.
          - Let me write down the requirements we agreed on.
          - Does that match what you had in mind?
        answer: Before I start, I'd like to ask a few questions.
        explanation: Фраза открывает разговор; остальные подводят итог или проверяют понимание.
      - id: q2
        prompt: Вы предлагаете отложить возможность, которая нужна немногим, до второй версии. Какая фраза подходит?
        options:
          - A feature that few people need can wait for version two.
          - Is there anything that I haven't asked about?
          - Does that match what you had in mind?
        answer: A feature that few people need can wait for version two.
        explanation: Фраза называет возможность и срок; остальные — вопросы о полноте и совпадении.
      - id: q3
        prompt: Вы фиксируете то, о чём договорились. Какая фраза подходит?
        options:
          - Let me write down the requirements we agreed on.
          - Before I start, I'd like to ask a few questions.
          - Does that match what you had in mind?
        answer: Let me write down the requirements we agreed on.
        explanation: Фраза говорит о записи договорённостей; остальные открывают разговор или проверяют итог.
      - id: q4
        prompt: Вы подводите итог и называете нагрузку сервиса. Какая фраза подходит?
        options:
          - So, to summarise, we need a service that handles ten thousand requests a second.
          - I'll start with the simplest version, which we can improve later.
          - Is there anything that I haven't asked about?
        answer: So, to summarise, we need a service that handles ten thousand requests a second.
        explanation: Фраза пересказывает требование с числом; остальные называют план или проверяют полноту.
      - id: q5
        prompt: Вы проверяете, не упустили ли вы вопросы. Какая фраза подходит?
        options:
          - Is there anything that I haven't asked about?
          - So, to summarise, we need a service that handles ten thousand requests a second.
          - A feature that few people need can wait for version two.
        answer: Is there anything that I haven't asked about?
        explanation: Фраза — вопрос о полноте; остальные подводят итог или отодвигают возможность.
      - id: q6
        prompt: Вы называете допущение, что платежи обрабатывать не нужно. Какая фраза подходит?
        options:
          - I'm assuming that we don't need to handle payments.
          - Let me write down the requirements we agreed on.
          - Does that match what you had in mind?
        answer: I'm assuming that we don't need to handle payments.
        explanation: Фраза называет допущение вслух; остальные записывают договорённости или проверяют итог.
  - type: exercise
    id: question-choice
    title: Формулировка для собеседования
    instruction: Выберите формулировку, которая подходит для уточнения задачи на собеседовании.
    format: choice
    items:
      - id: q1
        prompt: Вам поставили задачу, и вы хотите выяснить нагрузку.
        options:
          - How many requests do we expect per second?
          - I think the load will be high, so I will skip that question.
          - Why didn't you give me the numbers?
        answer: How many requests do we expect per second?
        explanation: Конкретный вопрос выясняет число; остальные варианты угадывают или упрекают постановщика.
      - id: q2
        prompt: Вы не знаете, есть ли срок.
        options:
          - Is there a deadline that I should keep in mind?
          - The deadline is probably unrealistic.
          - You haven't mentioned the deadline.
        answer: Is there a deadline that I should keep in mind?
        explanation: Вопрос без упрёка выясняет срок; остальные варианты оценивают или упрекают.
      - id: q3
        prompt: У вас нет ответа о пользователях, и вы называете допущение.
        options:
          - I'm assuming that the users are mostly in Europe; is that right?
          - The users are in Europe, I know it.
          - Everybody knows where the users are.
        answer: I'm assuming that the users are mostly in Europe; is that right?
        explanation: Допущение названо и проверяется вопросом; остальные варианты утверждают без основания.
      - id: q4
        prompt: Вы хотите убедиться, что правильно поняли условия.
        options:
          - Let me confirm that I've understood the requirements.
          - I understood everything, so I have no more questions.
          - The requirements are unclear, so I cannot start.
        answer: Let me confirm that I've understood the requirements.
        explanation: Фраза предлагает проверить понимание; остальные варианты прекращают разговор.
