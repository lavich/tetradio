  - type: writing
    id: requirements
    register: formal
    prompt: "Напишите коллеге список требований к вымышленному сервису (130–170 слов): назначение, пользователи с числами, функции, нагрузка, качества, ограничения и то, что вне объёма. Используйте не меньше пяти определительных придаточных (who, which, that, whose, where), среди них хотя бы одно с запятыми. Сервис и числа придумайте сами."
    words: { min: 130, max: 170 }
    model: |-
      Subject: Requirements for the file-sharing service

      Dear Anders,

      Below are the requirements for the file-sharing service that we discussed on Monday.

      Users: the service is for employees who work in several offices. About three thousand people will use it, and up to three hundred of them will be online at the same time.

      Functions: users can upload a file, share a link and delete it. Each team has its own storage, where members see only their own files.

      Quality: availability must be at least 99.9%. Files must never be lost, which is why every file is stored twice. Uploads, which should finish within ten seconds, have a hard limit of one gigabyte.

      Constraints: the first version is due in six weeks, and the data must stay in Europe. The service must work with the login system that the company already uses.

      Out of scope: a mobile app and file editing. Both can wait for version two.

      Please let me know if anything needs to change.

      Kind regards
    criteria:
      - 130–170 слов, есть тема письма, обращение, список требований по разделам и вежливое завершение
      - Не меньше пяти определительных придаточных (who, which, that, whose, where), среди них хотя бы одно non-defining с запятыми
      - Названы пользователи с числами, функции, нагрузка, качества (доступность, сохранность данных), ограничения и то, что вне объёма
      - "Запятые стоят верно: нет запятой перед defining, есть запятые с двух сторон у non-defining; в non-defining нет that"
      - Сервис и числа вымышлены, реальных систем и компаний нет
      - Формальный стиль без сокращений
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Тринадцатый ответ вашего **банка ответов** — реакция на задачу: уточняющие вопросы. К нему добавляется второй вопрос: **What would you want to know first?** Первый ответ занимает до 150 секунд, второй — до минуты.

      1) Разложите первый ответ по пяти шагам: вступление, пользователи, нагрузка и данные, качества и ограничения, итог. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: вопросы конкретные, есть числа и сроки, есть допущение, есть итог. 4) Для второго вопроса назовите, что вы выясняете первым, и объясните причину.

      Сцена в конце урока строится на постановке задачи. Реплики Anders записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: questions
    part: interview
    prompt: "Интервьюер говорит: «Here is the task: design a service that sends reminders to the users of a calendar app. What questions would you ask?» Задайте уточняющие вопросы за 150 секунд: пользователи, нагрузка, данные, качество, ограничения; в конце подведите итог."
    seconds: 150
    model: "Before I start, I'd like to ask a few questions. First, who are the people that will use the reminders? Do we need to support users who are offline, and how many users do we expect in the first year? Next, the load. How many reminders do we expect per second, and what does the traffic look like at peak? How much data are we talking about, and how long should we keep it? Then, quality. What should happen when the service is down? Is it okay if a reminder arrives a minute late, or is the timing critical? Finally, the constraints. Is there a deadline that I should keep in mind, and are there any constraints that I should know about, for example about where the data must be stored? Which requirements are must-haves, and which are nice-to-haves? So, to summarise, we need a reminder service that is reliable, handles the expected load and fits the deadline. I'm assuming that we don't need to handle text messages. Does that match what you had in mind?"
    criteria:
      - Вопросы идут по шагам — пользователи, нагрузка и данные, качества, ограничения
      - Вопросы конкретные, без упрёка и без догадок вместо вопросов
      - Использованы не меньше четырёх определительных придаточных или фраз урока
      - Назван итог и допущение
      - Сервис вымышлен, реальных систем нет
      - Ответ укладывается в 150 секунд
  - type: speaking
    id: first
    part: monologue
    prompt: "Интервьюер уточняет: «What would you want to know first?» Ответьте за 60 секунд: что вы выясните в первую очередь и почему."
    seconds: 60
    model: "I would want to know who the users are and how many of them there will be. Without that, I cannot estimate the load. After that, I would ask about the deadline and about any constraints, because they shape the whole design. I would also ask what is out of scope, so that I do not build a feature that nobody needs. Then I would write down the requirements and my assumptions, and confirm them before I start."
    criteria:
      - Названо, что выясняется первым, и причина
      - Названы срок или ограничения и вне объёма
      - Есть определительное придаточное
      - Названо, что требования записываются и подтверждаются
      - Ответ укладывается в 60 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
    transcript:
      - { speaker: Anders, text: "Thanks for joining. Here is the task: design a service that sends reminders to the users of a calendar app. You can ask me any questions that you need." }
      - { speaker: Anders, text: "Good questions. About fifty thousand people use the app, mostly for work, and around five thousand are online at the same time." }
      - { speaker: Anders, text: "At peak, we send about two hundred reminders a second. A reminder can be a minute late, but it must not be lost." }
      - { speaker: Anders, text: "The first version is due in five weeks, and the user data must stay in Europe. Is there anything else you would like to know?" }
      - { speaker: Anders, text: "Thank you. That was a clear summary of the requirements." }
  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании, задачу ставит Anders, старший инженер. Прослушайте его реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику задайте вопросы о пользователях. На вторую — о нагрузке и задержке сообщений. На третью — о сроке и ограничениях. На четвёртую подведите итог требований и назовите допущение. На последнюю поблагодарите. Вся ваша часть — 150 секунд, каждая реплика — две-четыре фразы.
    seconds: 150
    model: |-
      Anders: Thanks for joining. Here is the task: design a service that sends reminders to the users of a calendar app. You can ask me any questions that you need.
      You: Thank you. Before I start, I'd like to ask a few questions. Who are the people that will use the reminders, and how many users do we expect in the first year?
      Anders: Good questions. About fifty thousand people use the app, mostly for work, and around five thousand are online at the same time.
      You: I see. How many reminders do we expect per second? And is it okay if a reminder arrives a minute late?
      Anders: At peak, we send about two hundred reminders a second. A reminder can be a minute late, but it must not be lost.
      You: Understood. Is there a deadline that I should keep in mind? Are there any constraints that I should know about?
      Anders: The first version is due in five weeks, and the user data must stay in Europe. Is there anything else you would like to know?
      You: Let me confirm that I've understood the requirements. We need a service that handles two hundred reminders a second, loses none and keeps the data in Europe, ready in five weeks. I'm assuming that we don't need to handle text messages.
      Anders: Thank you. That was a clear summary of the requirements.
      You: Thank you for the task. If anything changes, I'm happy to update the list.
    criteria:
      - Ответили на все пять реплик по порядку, каждая — две-четыре фразы
      - В первой реплике заданы вопросы о пользователях и их числе
      - Во второй реплике есть вопросы о нагрузке и о допустимой задержке
      - В третьей реплике есть вопросы о сроке и ограничениях
      - В четвёртой реплике подведён итог с числами и названо допущение
      - В конце есть благодарность
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "If I had asked about the deadline, we ___ the delay. (прошлое, которого не было)"
        options: [would have avoided, would avoid, will avoid]
        answer: would have avoided
        explanation: Conditional 3 — would have и третья форма глагола.
      - id: q2
        prompt: "If the traffic doubled, I ___ more servers. (воображаемая ситуация)"
        options: [would add, will add, added]
        answer: would add
        explanation: Second conditional — if + past simple, would + базовая форма.
      - id: q3
        prompt: "«Can you give me a ballpark figure?» → She asked me ___."
        options:
          - whether I could give her a ballpark figure
          - could I give her a ballpark figure
          - whether could I give her a ballpark figure
        answer: whether I could give her a ballpark figure
        explanation: В косвенном вопросе порядок слов прямой, вопрос вводит whether или if.
      - id: q4
        prompt: "He ___ us not to deploy on Friday."
        options: [warned, said, suggested]
        answer: warned
        explanation: Warned + кому + not to + глагол; после said и suggested такой схемы нет.
      - id: q5
        prompt: "By the time I asked about the load, the team ___ the design for two weeks. (процесс шёл до момента)"
        options: [had been writing, wrote, will write]
        answer: had been writing
        explanation: Длительное действие до момента в прошлом — past perfect continuous.
      - id: q6
        prompt: "Unless you ___ the requirements, I will start with the simplest version."
        options: [change, don't change, changed]
        answer: change
        explanation: После unless стоит утвердительная форма настоящего времени.
