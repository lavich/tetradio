title: Контрольная модуля 10
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации в магазине. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: andreas
    title: Το μανάβικο του Αντρέα
    text: |-
      Το μανάβικο του Αντρέα
      Φρέσκα φρούτα και λαχανικά κάθε μέρα!

      Είμαι ο Αντρέας και το μανάβικό μου είναι στη Λεμεσό, δίπλα στον φούρνο της κυρίας Ελένης. Πουλάω μόνο ντόπια φρούτα και λαχανικά: ντομάτες, πιπεριές, καρότα, πατάτες. Το καλοκαίρι έχουμε και καρπούζια, πεπόνια και σταφύλια.

      Αυτή την εβδομάδα οι φράουλες είναι σε προσφορά: ένα κιλό κάνει τρία ευρώ αντί για τέσσερα. Για πελάτες με το δικό τους καλάθι — έκπτωση 10 %!

      Ανοιχτά από Δευτέρα έως Σάββατο, 7:00 – 14:00. Πληρώνετε με μετρητά ή με κάρτα.
    glosses:
      - text: καλοκαίρι
        russian: лето
      - text: αντί για
        russian: вместо
      - text: με το δικό τους καλάθι
        russian: со своей корзиной
      - text: Ανοιχτά
        russian: открыто
      - text: έως
        russian: до, по
  - type: exercise
    id: andreas-tf
    about: andreas
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Ο Αντρέας είναι πωλητής.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Το μανάβικο είναι δίπλα σε ένα ζαχαροπλαστείο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δίπλα στον φούρνο — рядом с пекарней.
      - id: q3
        prompt: Ο φούρνος είναι της κυρίας Ελένης.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ο φούρνος της κυρίας Ελένης — пекарня госпожи Элени (родительный падеж).
      - id: q4
        prompt: Ο Αντρέας πουλάει φρούτα από άλλες χώρες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πουλάω μόνο ντόπια φρούτα — только местные.
      - id: q5
        prompt: Αυτή την εβδομάδα οι φράουλες κάνουν τρία ευρώ το κιλό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Τρία ευρώ αντί για τέσσερα — четыре было раньше.
      - id: q6
        prompt: Αν έχετε καλάθι, έχετε έκπτωση.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Ο Αντρέας δουλεύει και την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Από Δευτέρα έως Σάββατο — в воскресенье закрыто.
  - type: listening
    id: errand
    title: Πας στο σούπερ μάρκετ;
    plays: 2
    transcript:
      - speaker: Λίνα
        text: Πέτρο, πας στο σούπερ μάρκετ;
        audio: m10-test/errand-1.mp3
      - speaker: Πέτρος
        text: Ναι, τώρα. Θέλεις κάτι;
        audio: m10-test/errand-2.mp3
      - speaker: Λίνα
        text: Ναι, αν μπορείς. Θέλω ένα κουτί γάλα και δύο μπουκάλια νερό.
        audio: m10-test/errand-3.mp3
      - speaker: Πέτρος
        text: Εντάξει. Γάλα, νερό… Και ψωμί;
        audio: m10-test/errand-4.mp3
      - speaker: Λίνα
        text: Όχι, ψωμί δεν θέλω. Αγοράζω πάντα ψωμί από τον φούρνο του κυρίου Γιάννη. Είναι πολύ φρέσκο.
        audio: m10-test/errand-5.mp3
      - speaker: Πέτρος
        text: Και φρούτα;
        audio: m10-test/errand-6.mp3
      - speaker: Λίνα
        text: Φρούτα αγοράζω το Σάββατο στη λαϊκή, εκεί είναι φτηνά. Αλλά αν οι φράουλες είναι σε προσφορά, θέλω ένα κουτί.
        audio: m10-test/errand-7.mp3
      - speaker: Πέτρος
        text: Εντάξει. Πληρώνω εγώ με κάρτα, δεν πειράζει.
        audio: m10-test/errand-8.mp3
      - speaker: Λίνα
        text: Όχι, όχι. Ορίστε δέκα ευρώ.
        audio: m10-test/errand-9.mp3
      - speaker: Πέτρος
        text: Ωραία. Τα ρέστα το βράδυ!
        audio: m10-test/errand-10.mp3
      - speaker: Λίνα
        text: Ευχαριστώ, Πέτρο! Τα λέμε!
        audio: m10-test/errand-11.mp3
  - type: exercise
    id: errand-choice
    about: errand
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού πάει ο Πέτρος;
        options:
          - Στο σούπερ μάρκετ.
          - Στη λαϊκή.
          - Στον φούρνο.
        answer: Στο σούπερ μάρκετ.
      - id: q2
        prompt: Τι θέλει η Λίνα από το σούπερ μάρκετ;
        options:
          - Ένα κουτί γάλα και δύο μπουκάλια νερό.
          - Ένα μπουκάλι γάλα και δύο μπουκάλια νερό.
          - Γάλα, νερό και ψωμί.
        answer: Ένα κουτί γάλα και δύο μπουκάλια νερό.
      - id: q3
        prompt: Πού αγοράζει ψωμί η Λίνα;
        options:
          - Στον φούρνο του κυρίου Γιάννη.
          - Στο σούπερ μάρκετ.
          - Στη λαϊκή.
        answer: Στον φούρνο του κυρίου Γιάννη.
      - id: q4
        prompt: Πότε αγοράζει φρούτα η Λίνα;
        options:
          - Το Σάββατο.
          - Κάθε μέρα.
          - Την Κυριακή.
        answer: Το Σάββατο.
      - id: q5
        prompt: Πότε θέλει η Λίνα φράουλες;
        options:
          - Αν είναι σε προσφορά.
          - Αν είναι ώριμες.
          - Μόνο το Σάββατο.
        answer: Αν είναι σε προσφορά.
      - id: q6
        prompt: Πώς πληρώνει η Λίνα;
        options:
          - Δίνει στον Πέτρο δέκα ευρώ.
          - Πληρώνει με κάρτα.
          - Πληρώνει το βράδυ.
        answer: Δίνει στον Πέτρο δέκα ευρώ.
        explanation: "Ловушка: картой хочет заплатить Петрос, но Лина сразу даёт ему δέκα ευρώ. Вечером он отдаст сдачу."
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Θέλω ένα κιλό ___.
        options:
          - πατάτες
          - από πατάτες
          - με πατάτες
        answer: πατάτες
        explanation: После меры продукт идёт без предлога — ένα κιλό πατάτες.
      - id: q2
        prompt: Δώστε μου τρία ___ νερό.
        options:
          - μπουκάλι
          - μπουκάλια
        answer: μπουκάλια
      - id: q3
        prompt: ___ κιλό τυρί, παρακαλώ.
        options:
          - Μισό
          - Μισή
          - Μισός
        answer: Μισό
      - id: q4
        prompt: Πόσο ___ τα σταφύλια;
        options:
          - κάνει
          - κάνουν
        answer: κάνουν
      - id: q5
        prompt: Ψάχνω ___ περίπτερο.
        options:
          - έναν
          - ένα
          - μία
        answer: ένα
        explanation: το περίπτερο — средний род.
      - id: q6
        prompt: Магазин Марии — το μαγαζί ___.
        options:
          - της Μαρίας
          - του Μαρίας
          - της Μαρία
        answer: της Μαρίας
      - id: q7
        prompt: Οι ντομάτες είναι πολύ ___.
        options:
          - φρέσκος
          - φρέσκο
          - φρέσκες
        answer: φρέσκες
      - id: q8
        prompt: Το καρπούζι κάνει ___ ευρώ.
        options:
          - τρία
          - τρεις
        answer: τρία
        explanation: ευρώ — средний род, поэтому τρία.
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - η έκπτωση
      - τα ρέστα
      - το ταμείο
      - η σακούλα
      - το χασάπικο
      - ο πελάτης
      - η τιμή
      - ο πωλητής
      - τα ψιλά
      - η λαϊκή
    items:
      - id: m1
        prompt: скидка
        answer: η έκπτωση
      - id: m2
        prompt: сдача
        answer: τα ρέστα
      - id: m3
        prompt: касса
        answer: το ταμείο
      - id: m4
        prompt: пакет (для покупок)
        answer: η σακούλα
      - id: m5
        prompt: мясная лавка
        answer: το χασάπικο
      - id: m6
        prompt: покупатель
        answer: ο πελάτης
      - id: m7
        prompt: цена
        answer: η τιμή
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Продавец спрашивает «Κάτι άλλο;», а вам больше ничего не нужно.
        options:
          - Τίποτα άλλο, ευχαριστώ.
          - Δεν έχω ψιλά.
          - Θέλετε σακούλα;
        answer: Τίποτα άλλο, ευχαριστώ.
      - id: q2
        prompt: Вы хотите узнать, есть ли скидка.
        options:
          - Έχει έκπτωση;
          - Πόσο κάνει;
          - Είναι σε προσφορά.
        answer: Έχει έκπτωση;
        explanation: Είναι σε προσφορά — это ответ продавца, а не вопрос.
      - id: q3
        prompt: Кассир спрашивает, как вы будете платить.
        options:
          - Πληρώνετε με κάρτα ή μετρητά;
          - Ορίστε τα ρέστα σας.
          - Κάτι άλλο;
        answer: Πληρώνετε με κάρτα ή μετρητά;
      - id: q4
        prompt: Вы на рынке и хотите два килограмма картошки.
        options:
          - Δώστε μου δύο κιλά πατάτες.
          - Δώστε μου δύο κιλό πατάτες.
          - Δώστε μου δύο κιλά από πατάτες.
        answer: Δώστε μου δύο κιλά πατάτες.
