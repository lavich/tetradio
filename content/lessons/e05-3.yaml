  - type: writing
    id: recruiter
    register: formal
    prompt: "Рекрутер Katarina Novak пригласила вас на собеседование на позицию Backend Developer и не указала формат, участников и подготовку. Напишите ей уточняющее письмо (80–120 слов): причина письма, три-четыре уточнения в косвенной форме, готовность помочь, благодарность."
    words: { min: 80, max: 120 }
    model: |-
      Dear Ms Novak,

      Thank you for the invitation to the interview for the Backend Developer position. I am writing to clarify a few points before the meeting. Could you tell me whether the interview will be online or at your office? I would also like to know who I will be speaking with and how long the conversation will last. Finally, could you let me know if I should prepare a short technical task or a presentation of my previous projects? I would be happy to send any documents in advance. Thank you for your time, and I look forward to hearing from you.

      Kind regards,
      Anna Petrova
    criteria:
      - 80–120 слов, есть обращение, причина письма, благодарность и подпись
      - Не меньше трёх уточнений в косвенной форме (whether, if, who, how long)
      - "После whether, if и вопросительного слова нет do, does, did; подлежащее стоит перед глаголом"
      - Знак вопроса стоит после фраз Could you…?, после I would like to know… стоит точка
      - Формальный стиль без сокращений и разговорных слов
  - type: explanation
    id: speaking-how
    title: Как записывать ответ
    body: |-
      Пятый ответ вашего **банка ответов** — How do you handle a task when the requirements are unclear? Этот вопрос проверяет, как вы работаете с неопределённостью, и тот же приём помогает на любом вопросе, который вы поняли не до конца.

      1) Начните с проверки: **If I understand correctly, you're asking about…** 2) Назовите подход в три шага: список известного и неизвестного, вопросы владельцу задачи, допущения и маленькая проверка. 3) Приведите случай из практики: что было неясно, какой вопрос вы задали, чем закончилось. 4) Завершите итогом. 5) Запишите ответ, переслушайте, сверьте с образцом и критериями.

      Сцена в конце урока повторяет собеседование: интервьюер говорит быстро, и вы просите повторить, выигрываете время и проверяете смысл. Реплики интервьюера записаны на предыдущей странице; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: unclear-task
    part: monologue
    prompt: "Интервьюер: «How do you handle a task when the requirements are unclear?» Ответьте за 90 секунд: сначала проверьте, как вы поняли вопрос, затем назовите подход, приведите случай из практики и закончите итогом."
    seconds: 90
    model: "If I understand correctly, you're asking about a task where the requirements are unclear. In that case, I do three things. First, I list what I know and what I do not know. Then I ask the product owner a few specific questions to narrow the task down, for example, which users this affects and what success looks like. If I cannot get an answer quickly, I write down my assumptions and share them in the ticket, so that everyone can correct me early. Finally, I build the smallest version that tests the riskiest assumption and show it in a short demo. Last quarter, for example, we received a vague request to improve search. I asked what exactly was slow, and it turned out that users meant the filters. We fixed them in two days instead of rewriting the search. To sum up, I clarify early, write down my assumptions, and check them with a small version."
    criteria:
      - "Ответ начинается с проверки вопроса: If I understand correctly… или Do you mean…?"
      - "Порядок: проверка — подход — случай из практики — итог"
      - Около 90 секунд, без долгих пауз
      - "Есть конкретный случай: что было неясно, какой вопрос задан, результат"
      - Косвенные вопросы построены с порядком слов утверждения
  - type: speaking
    id: example
    part: interview
    prompt: "Интервьюер уточняет: «Could you give me an example?» Ответьте за 30 секунд конкретным случаем: что было неясно, какой вопрос вы задали и чем закончилось."
    seconds: 30
    model: "Sure. Last year, a manager asked me to make the dashboard faster. That was vague, so I asked which page was slow and who used it. It turned out to be the monthly report, and only for large accounts. We added an index and a cache, and the report now opens in two seconds instead of twenty."
    criteria:
      - Есть один конкретный случай из практики
      - Названо, что было неясно и какой вопрос вы задали
      - Есть результат с числом или фактом
      - Ответ укладывается в 30 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
    transcript:
      - { speaker: Sarah, text: "Right, so, quick question: how would you roll out a breaking API change that three other teams depend on, and how would you tell them about it?" }
      - { speaker: Sarah, text: "Of course. How would you release a breaking API change when three other teams depend on that API?" }
      - { speaker: Sarah, text: "Okay. And could you tell me what you would do if one of those teams could not migrate on time?" }
      - { speaker: Sarah, text: "Right. Take your time." }
      - { speaker: Sarah, text: "Thank you, that is all from me. Do you have any questions about the next steps?" }
      - { speaker: Sarah, text: "Next you will speak with Mark, the engineering manager. Thank you for your time." }
  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на видеособеседовании. Интервьюер — Sarah. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую быструю реплику попросите повторить вопрос. На вторую выиграйте время одной фразой и ответьте. На третью проверьте, что поняли, и ответьте. В конце спросите, с кем будете говорить дальше, и поблагодарите. Вся ваша часть — 60–90 секунд, каждая реплика — одна-три фразы.
    seconds: 90
    model: |-
      Sarah: Right, so, quick question: how would you roll out a breaking API change that three other teams depend on, and how would you tell them about it?
      You: Sorry, could you repeat the question, please?
      Sarah: Of course. How would you release a breaking API change when three other teams depend on that API?
      You: That's a good question. Let me think about it for a second. I would keep the old version running and publish the new one next to it. Then I would give the teams a deadline and help them migrate.
      Sarah: Okay. And could you tell me what you would do if one of those teams could not migrate on time?
      You: Do you mean a team that misses the deadline completely? In that case, I would keep the old version for that team only, and agree on a new date.
      Sarah: Right. Take your time.
      You: Then I would also ask what blocks them, because sometimes we can remove the blocker together.
      Sarah: Thank you, that is all from me. Do you have any questions about the next steps?
      You: Yes. Could you tell me who I will be speaking with next?
      Sarah: Next you will speak with Mark, the engineering manager. Thank you for your time.
      You: Thank you for your time. I look forward to it.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - "Просьба повторить на первую реплику: Could you repeat the question, please?"
      - "Выигрыш времени перед ответом: Let me think about it for a second."
      - "Проверка смысла перед ответом на третью реплику: Do you mean…? или If I understand correctly…"
      - "Вопрос о следующем шаге построен косвенно: Could you tell me who I will be speaking with next?"
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "I ___ at this company since 2021."
        options: [have worked, worked, am working]
        answer: have worked
        explanation: Since 2021 — период до сих пор, нужен present perfect.
      - id: q2
        prompt: "The more we scaled, ___ more we needed monitoring."
        options: [the, a, that]
        answer: the
        explanation: В конструкции the … the … нужны оба the.
      - id: q3
        prompt: "Do you know where ___?"
        options: [the office is, is the office, does the office]
        answer: the office is
        explanation: Во вложенной части порядок слов как в утверждении.
      - id: q4
        prompt: "We were working on the migration when the requirements ___."
        options: [changed, have changed, were change]
        answer: changed
        explanation: Короткое действие внутри длительного — past simple.
      - id: q5
        prompt: "Python is ___ to learn than C++. (проще)"
        options: [easier, more easy, easy]
        answer: easier
      - id: q6
        prompt: "Sorry, I think I ___ the last word. (ослышался)"
        options: [misheard, mishear, mishearing]
        answer: misheard
        explanation: Misheard — форма прошедшего времени от mishear.
