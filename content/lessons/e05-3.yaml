title: Could you say that again? — письмо и речь
kind: lesson
items:
  - { kind: phrase, id: ep117 }
  - { kind: phrase, id: ep118 }
  - { kind: phrase, id: ep119 }
  - { kind: phrase, id: ep120 }
  - { kind: phrase, id: ep121 }
  - { kind: phrase, id: ep122 }
  - { kind: phrase, id: ep123 }
  - { kind: phrase, id: ep124 }
  - { kind: phrase, id: ep125 }
blocks:
  - type: explanation
    id: scheme
    title: "Схема: понять вопрос, проверить, ответить, предложить подробности"
    body: |-
      Когда вопрос непонятен или слишком быстр, ответ строится по четырём шагам, и каждый занимает одну-две фразы.

      **1. Понять вопрос.** Попросите повторить, разбить на части или показать: **Could you split the question into two parts? Could you type the question in the chat?** В видеозвонке можно показать свой материал: **Let me share my screen to show it.**

      **2. Проверить, что вы отвечаете на нужный вопрос.** Сообщите об этом интервьюеру: **I'd like to make sure I answer the right question.** Если вопрос понят неточно, назовите его своими словами: **If I understand correctly, you're asking about…**

      **3. Ответить.** Если тема выходит за ваш опыт, скажите об этом и покажите ход мысли: **That's a bit outside my experience, but here's how I'd approach it.**

      **4. Предложить продолжение.** **Please let me know if you need more detail.** Интервьюер решает, нужны ли подробности.

      В письме те же вопросы задаются в косвенной форме: **Could you tell me who I will be speaking with? Do you know if the interview will be online?** Начало письма объясняет причину: **I am writing to clarify a few points about the role.**
    table:
      columns:
        - шаг
        - язык
        - пример
      rows:
        - - понять вопрос
          - Could you split… / type… in the chat
          - Could you split the question into two parts?
        - - проверить вопрос
          - I'd like to make sure…
          - I'd like to make sure I answer the right question.
        - - ответить
          - outside my experience, here's how I'd approach it
          - That's a bit outside my experience, but here's how I'd approach it.
        - - предложить подробности
          - Please let me know if…
          - Please let me know if you need more detail.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: good-answer
    title: Подходящая реакция
    instruction: Выберите вариант, который подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: Интервьюер использовал незнакомый термин. Какая реакция подходит?
        options:
          - Could you tell me what you mean by that term?
          - I don't know it.
          - Yes, of course.
        answer: Could you tell me what you mean by that term?
        explanation: Уточняющий вопрос снимает риск ответить не на тот вопрос.
      - id: q2
        prompt: Вам нужно несколько секунд перед ответом. Какая фраза подходит?
        options:
          - That's a good question. Let me think about it for a second.
          - Please wait.
          - Hmm, hmm, hmm.
        answer: That's a good question. Let me think about it for a second.
      - id: q3
        prompt: Вопрос касается темы вне вашего опыта. С чего начать?
        options:
          - That's a bit outside my experience, but here's how I'd approach it.
          - I have never done that.
          - Next question, please.
        answer: That's a bit outside my experience, but here's how I'd approach it.
        explanation: Фраза называет границу опыта и сразу переходит к рассуждению.
      - id: q4
        prompt: Вопрос состоит из двух частей, и вы можете потерять вторую.
        options:
          - Could you split the question into two parts?
          - Could you give me an example?
          - Let me share my screen to show it.
        answer: Could you split the question into two parts?
      - id: q5
        prompt: Вы закончили ответ и хотите узнать, нужны ли подробности.
        options:
          - Please let me know if you need more detail.
          - That is all, goodbye.
          - Could you repeat the question, please?
        answer: Please let me know if you need more detail.
  - type: exercise
    id: grammar-fix
    title: Косвенные вопросы в письме
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: Какое предложение верно?
        options:
          - Could you tell me whether the interview will be online?
          - Could you tell me whether will the interview be online?
        answer: Could you tell me whether the interview will be online?
        explanation: Во вложенной части порядок слов как в утверждении.
      - id: q2
        prompt: "Could you let me know ___ I should bring a laptop? (нужно ли)"
        options: [if, that, what]
        answer: if
        explanation: Вопрос «да или нет» вводится словом if или whether.
      - id: q3
        prompt: "I would like to know who ___ on the panel. (кто будет)"
        options: [will be, will, is will]
        answer: will be
        explanation: После who идёт группа сказуемого целиком — will be.
      - id: q4
        prompt: "Как исправить предложение: «Could you tell me how long does the interview take?»"
        options:
          - how long the interview takes
          - how long the interview does take
          - how long takes the interview
        answer: how long the interview takes
        explanation: Вспомогательный does не нужен, глагол принимает окончание -s.
      - id: q5
        prompt: Какое предложение подходит для формального письма?
        options:
          - I would be grateful if you could confirm the format.
          - Tell me the format ASAP.
        answer: I would be grateful if you could confirm the format.
  - type: explanation
    id: writing-how
    title: Уточняющее письмо рекрутеру
    body: |-
      Письменная задача — письмо рекрутеру, 80–120 слов, в формальном стиле. Рекрутер прислал приглашение на собеседование, и в нём не хватает деталей. Письмо задаёт три-четыре уточнения и остаётся коротким.

      Схема: 1) обращение (**Dear Ms Novak,**); 2) причина письма — **I am writing to clarify a few points about…**; 3) вопросы в косвенной форме — **Could you tell me whether…? I would also like to know… Could you let me know if…?**; 4) готовность помочь — **I would be happy to send any documents in advance**; 5) благодарность и подпись — **Kind regards**.

      В формальном письме сокращения (*I'd, I'm*) не используются, поэтому пишите **I would, I am**. Каждый вопрос — одна мысль: формат, участники, длительность, подготовка.

      Проверьте себя: после *whether*, *if* и вопросительного слова нет *do / does / did*; знак вопроса стоит после фраз *Could you…?*, а после *I would like to know…* — точка.
