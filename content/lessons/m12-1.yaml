blocks:
  - type: explanation
    id: directions
    title: Направо, налево, прямо
    body: |-
      Чтобы объяснить дорогу, хватает нескольких слов. **Δεξιά** — направо и справа, **αριστερά** — налево и слева, **ευθεία** — прямо. Одно слово отвечает и на «куда?», и на «где?»: **Στρίψε δεξιά.** — «Поверни направо». **Η στάση είναι δεξιά.** — «Остановка справа». Часто говорят и **στα δεξιά σου / σας** — «по правую руку от тебя / от вас».

      Ориентиры на улице: **ο δρόμος** — улица, дорога; **η πλατεία** — площадь; **η γωνία** — угол; **το φανάρι** — светофор; **η διασταύρωση** — перекрёсток; **η στάση** — остановка. «На» по-гречески — предлог σε, как в модуле 06: **στη γωνία** — на углу, **στο φανάρι** — на светофоре, **στη διασταύρωση** — на перекрёстке, **στην πλατεία** — на площади.

      **Απέναντι από** + винительный падеж — «напротив»: **απέναντι από το σπίτι μου**. Это пара к знакомым δίπλα σε, κοντά σε (модуль 06). **Μέχρι** + винительный — «до»: **μέχρι την πλατεία**, **μέχρι το φανάρι**.

      Спросить дорогу: **Πώς πάω στο κέντρο;** — «Как мне пройти в центр?» (πάω — разговорная форма πηγαίνω, модуль 02; το κέντρο — центр). Ходить пешком — **περπατάω** (спрягается как μιλάω): **Περπατάω κάθε μέρα στην πλατεία.**
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Πήγαινε ευθεία.
          - Иди прямо.
        - - Στρίψε αριστερά στη γωνία.
          - Поверни налево на углу.
        - - Στρίψτε δεξιά στο φανάρι.
          - Поверните направо на светофоре.
        - - Συνέχισε μέχρι την πλατεία.
          - Продолжай (иди дальше) до площади.
        - - Η στάση είναι απέναντι από το σπίτι μου.
          - Остановка напротив моего дома.
  - type: explanation
    id: imperative
    title: Повелительное наклонение — «иди, поверни»
    body: |-
      Повелительное наклонение (η προστακτική) — это просьба или указание: «иди», «поверни», «покажи». У него две формы: на «ты» — одному знакомому человеку, и на «вы» — нескольким людям или вежливо незнакомому. Прохожему на улице, как и экзаменатору, говорят на «вы».

      **Как образовать.** Большинство форм строится от основы аориста — прошедшего времени, которое дано в карточке (έστριψα, συνέχισα, πέρασα). Уберите окончание -α и приращение έ-, если оно есть: έ**στριψ**α → στριψ-. На «ты» добавьте **-ε**, на «вы» — **-τε**: **στρίψε — στρίψτε**, **δείξε — δείξτε** (έδειξα). Если основа кончается на -σ, на «вы» получается -στε: **συνέχισε — συνεχίστε**, **πέρασε — περάστε**.

      **Ударение.** В этих формах на «ты» ударение стоит как можно дальше от конца — на третьем слоге с конца: **συνέχισε**, **πέρασε**. На «вы» — на предпоследнем: **συνεχίστε**, **περάστε**. Поэтому в συνέχισε и συνεχίστε тонос на разных слогах.

      **Неправильные формы** выучите целиком: **πήγαινε — πηγαίνετε** (иди — идите), **πάρε — πάρτε** (возьми, сверни на — от παίρνω), **ανέβα — ανεβείτε** (поднимись), **κατέβα — κατεβείτε** (спустись), **έλα — ελάτε** (приходи — из Έλα μέσα!, модуль 06).

      **Πάρε / πάρτε** в объяснении дороги значит «сверни на…»: **Πάρτε τον δεύτερο δρόμο αριστερά.** — «Сверните на вторую улицу налево». После повелительного дополнение — в винительном падеже, как после других глаголов: πέρασε **τον δρόμο**, ανέβα **τον δρόμο**, κατέβα **τον δρόμο μέχρι τη θάλασσα**.

      Запрет («не поворачивай») строится по-другому — его вы узнаете позже.
