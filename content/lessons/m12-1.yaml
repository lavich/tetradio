  - type: exercise
    id: imp-who
    title: На «ты» или на «вы»
    instruction: Выберите форму. Другу — на «ты», незнакомому человеку — на «вы».
    format: choice
    items:
      - id: q1
        prompt: "Вы объясняете дорогу подруге: «Поверни направо»."
        options:
          - Στρίψε δεξιά.
          - Στρίψτε δεξιά.
        answer: Στρίψε δεξιά.
      - id: q2
        prompt: "Пожилой мужчина спрашивает дорогу: «Идите прямо»."
        options:
          - Πήγαινε ευθεία.
          - Πηγαίνετε ευθεία.
        answer: Πηγαίνετε ευθεία.
        explanation: Незнакомому человеку — вежливо, на «вы».
      - id: q3
        prompt: "Другу: «Продолжай до площади»."
        options:
          - Συνέχισε μέχρι την πλατεία.
          - Συνεχίστε μέχρι την πλατεία.
        answer: Συνέχισε μέχρι την πλατεία.
      - id: q4
        prompt: "Туристке: «Перейдите улицу»."
        options:
          - Πέρασε τον δρόμο.
          - Περάστε τον δρόμο.
        answer: Περάστε τον δρόμο.
      - id: q5
        prompt: "Двум друзьям: «Поднимитесь на второй этаж»."
        options:
          - Ανέβα στον δεύτερο όροφο.
          - Ανεβείτε στον δεύτερο όροφο.
        answer: Ανεβείτε στον δεύτερο όροφο.
        explanation: Форма на «вы» нужна и для нескольких людей, даже друзей. Ο όροφος — этаж.
      - id: q6
        prompt: "Брату: «Покажи мне на карте»."
        options:
          - Δείξε μου στον χάρτη.
          - Δείξτε μου στον χάρτη.
        answer: Δείξε μου στον χάρτη.
        explanation: Ο χάρτης — карта (слово урока 2).
  - type: exercise
    id: imp-form
    title: Какая форма
    instruction: Выберите правильную форму повелительного наклонения.
    format: choice
    items:
      - id: q1
        prompt: Κύριε, ___ τον πρώτο δρόμο δεξιά.
        options:
          - πάρτε
          - πάρε
          - παίρνετε
        answer: πάρτε
        explanation: Κύριε — вежливое обращение, значит на «вы». Παίρνετε — настоящее время «вы берёте».
      - id: q2
        prompt: Νίκο, ___ ευθεία μέχρι το φανάρι.
        options:
          - συνέχισε
          - συνεχίστε
          - συνεχίζω
        answer: συνέχισε
      - id: q3
        prompt: Ελένη, ___ τον δρόμο μέχρι τη θάλασσα.
        options:
          - κατέβα
          - κατεβείτε
          - κατεβαίνω
        answer: κατέβα
      - id: q4
        prompt: Κυρία Μαρία, ___ στη γωνία.
        options:
          - στρίψτε
          - στρίψε
          - στρίβω
        answer: στρίψτε
      - id: q5
        prompt: Παιδιά, ___ στο σπίτι μου το Σάββατο!
        options:
          - ελάτε
          - έλα
          - έρχομαι
        answer: ελάτε
        explanation: Παιδιά — «ребята», несколько человек, поэтому ελάτε.
      - id: q6
        prompt: Άννα, ___ μου το κλειδί, σε παρακαλώ.
        options:
          - δείξε
          - δείξτε
          - δείχνω
        answer: δείξε
  - type: exercise
    id: imp-gap
    title: Объясняем дорогу
    instruction: Вставьте глагол. Вы объясняете дорогу незнакомому человеку — на «вы». Два слова лишние.
    format: gap
    bank:
      - Πηγαίνετε
      - στρίψτε
      - Περάστε
      - συνεχίστε
      - ανεβείτε
      - Πάρτε
      - στρίψε
      - Πέρασε
    items:
      - id: g1
        prompt: Από εδώ ___ ευθεία μέχρι το φανάρι.
        answer: Πηγαίνετε
        explanation: Вы начинаете объяснять дорогу — πηγαίνετε, «идите».
      - id: g2
        prompt: Στο φανάρι ___ αριστερά.
        answer: στρίψτε
      - id: g3
        prompt: ___ τον δρόμο — η στάση είναι απέναντι.
        answer: Περάστε
        explanation: Остановка на другой стороне — улицу нужно перейти. Πέρασε — на «ты», здесь не подходит.
      - id: g4
        prompt: Μετά την πλατεία ___ ευθεία στον ίδιο δρόμο.
        answer: συνεχίστε
        explanation: "Συνεχίστε — «продолжайте»: человек уже идёт и не поворачивает."
      - id: g5
        prompt: ___ τον δεύτερο δρόμο δεξιά.
        answer: Πάρτε
      - id: g6
        prompt: Το σπίτι μου είναι στον τρίτο όροφο — ___ με τα πόδια.
        answer: ανεβείτε
        explanation: με τα πόδια — пешком (здесь — по лестнице).
  - type: explanation
    id: genitive
    title: Родительный падеж — «чей? чего?»
    body: |-
      В модуле 10 вы встречали **το μαγαζί του Νίκου** — «магазин Никоса». Это родительный падеж (η γενική). Он отвечает на вопросы «чей?» и «чего?» и стоит **после** главного слова: **η στάση του λεωφορείου** — «остановка автобуса» (то λεωφορείο — автобус), **το κέντρο της πόλης** — «центр города», **το σπίτι της Μαρίας** — «дом Марии».

      Вы давно знаете родительный падеж — у местоимений: το σπίτι **μου**, **του**, **της** — «мой дом, его дом, её дом». Так же ставится и существительное: το σπίτι **του Νίκου**.

      **Артикль:** мужской и средний род — **του**, женский — **της**.

      **Окончания в ед. ч.** Мужской род на -ος и средний на -ο меняют окончание на **-ου**: ο δρόμος → του δρόμου, το κέντρο → του κέντρου, το λεωφορείο → του λεωφορείου. Остальные мужские слова теряют ς: ο πατέρας → του πατέρα, ο Γιάννης → του Γιάννη, ο καφές → του καφέ. Женские слова на -α и -η добавляют **ς**: η πλατεία → της πλατείας, η πόλη → της πόλης, η στάση → της στάσης, η Άννα → της Άννας. Средний род на -ι получает **-ιού**, и ударение переходит на конец: το σπίτι → του σπιτιού, το φανάρι → του φαναριού.

      У некоторых слов ударение сдвигается и в -ου: ο άνθρωπος → του ανθρώπου, το δωμάτιο → του δωματίου. Женские слова на -ος склоняются как мужские: η Λεμεσός → της Λεμεσού, η Πάφος → της Πάφου.
    table:
      columns:
        - именительный
        - родительный
        - пример
      rows:
        - - ο δρόμος
          - του δρόμου
          - στη γωνία του δρόμου — на углу улицы
        - - ο πατέρας
          - του πατέρα
          - το σπίτι του πατέρα μου — дом моего отца
        - - η πλατεία
          - της πλατείας
          - στο κέντρο της πλατείας — в центре площади
        - - η πόλη
          - της πόλης
          - το κέντρο της πόλης — центр города
        - - η στάση
          - της στάσης
          - το όνομα της στάσης — название остановки
        - - το λεωφορείο
          - του λεωφορείου
          - η στάση του λεωφορείου — автобусная остановка
        - - το σπίτι
          - του σπιτιού
          - η πόρτα του σπιτιού — дверь дома
  - type: exercise
    id: gen-article
    title: Του или της
    instruction: Выберите артикль родительного падежа.
    format: choice
    items:
      - id: q1
        prompt: Πού είναι η στάση ___ λεωφορείου;
        options:
          - του
          - της
        answer: του
        explanation: το λεωφορείο — средний род, поэтому του.
      - id: q2
        prompt: Μένω στο κέντρο ___ πόλης.
        options:
          - του
          - της
        answer: της
      - id: q3
        prompt: Αυτό είναι το κλειδί ___ Γιάννη.
        options:
          - του
          - της
        answer: του
        explanation: ο Γιάννης — мужской род.
      - id: q4
        prompt: Το τηλέφωνο ___ Ελένης είναι στο τραπέζι.
        options:
          - του
          - της
        answer: της
      - id: q5
        prompt: Το χρώμα ___ σπιτιού είναι άσπρο.
        options:
          - του
          - της
        answer: του
        explanation: "το σπίτι → του σπιτιού."
      - id: q6
        prompt: Περιμένω στη γωνία ___ πλατείας.
        options:
          - του
          - της
        answer: της
  - type: exercise
    id: gen-form
    title: Какая форма слова
    instruction: Выберите форму родительного падежа.
    format: choice
    items:
      - id: q1
        prompt: Το σπίτι του ___ είναι στη Λάρνακα.
        options:
          - Νίκος
          - Νίκου
          - Νίκο
        answer: Νίκου
        explanation: "На -ος → -ου: ο Νίκος → του Νίκου. Νίκο — винительный падеж."
      - id: q2
        prompt: Η στάση είναι στη γωνία του ___.
        options:
          - δρόμος
          - δρόμου
          - δρόμο
        answer: δρόμου
      - id: q3
        prompt: Το κέντρο της ___ είναι κοντά.
        options:
          - πόλη
          - πόλης
          - πόλεις
        answer: πόλης
        explanation: Женский род на -η добавляет ς. Πόλεις — множественное число.
      - id: q4
        prompt: Αυτή είναι η κόρη της ___.
        options:
          - Μαρία
          - Μαρίας
        answer: Μαρίας
      - id: q5
        prompt: Ξέρεις το τηλέφωνο του ___ σου;
        options:
          - πατέρας
          - πατέρα
          - πατέρου
        answer: πατέρα
        explanation: Мужской род не на -ος просто теряет ς — του πατέρα.
      - id: q6
        prompt: Η πόρτα του ___ είναι μπλε.
        options:
          - σπίτι
          - σπιτιού
          - σπίτιου
        answer: σπιτιού
        explanation: Средний род на -ι → -ιού, ударение на конце.
      - id: q7
        prompt: Το σπίτι μου είναι στο κέντρο της ___.
        options:
          - Λεμεσός
          - Λεμεσού
          - Λεμεσό
        answer: Λεμεσού
        explanation: Η Λεμεσός — женский род на -ος, склоняется как мужской — της Λεμεσού.
  - type: explanation
    id: ordinals
    title: Порядковые числительные — «первый, второй»
    body: |-
      **Πρώτος** — первый, **δεύτερος** — второй, **τρίτος** — третий. Это прилагательные: они меняются по родам и падежам, как μεγάλος (модуль 07): **ο πρώτος** δρόμος, **η δεύτερη** στάση, **το τρίτο** σπίτι. В винительном: Πάρτε **τον δεύτερο** δρόμο. Κατεβείτε στην **τρίτη** στάση.

      Дни недели вам помогут: **η Δευτέρα** — «второй день», **η Τρίτη** — «третий», **η Τετάρτη** — «четвёртый», **η Πέμπτη** — «пятый» (названия идут от старого счёта, где первым днём было воскресенье). Поэтому τέταρτος и πέμπτος запомнить легко. Не путайте **το τέταρτο** — четверть часа (модуль 04) и **το τέταρτο** σπίτι — четвёртый дом.

      На вывесках и в адресах числительное часто пишут цифрой с окончанием: **1ος** όροφος (ο πρώτος όροφος, ο όροφος — этаж), **2η** στάση, **3ο** κτίριο.

      **Этажи.** На Кипре и в Греции первый этаж — **το ισόγειο**, а **ο πρώτος όροφος** — это русский второй этаж (модуль 06).

      **Дата.** Порядковым бывает только первое число: **η πρώτη Μαΐου** — первое мая. Остальные даты — количественными: **είκοσι Οκτωβρίου** (модуль 04).
