          - It was amazing, wasn't it?
          - That was brilliant, wasn't it?
          - It was brilliant, wasn't it?
          - That was fantastic, wasn't it?
          - It was fantastic, wasn't it?
          - That was wonderful, wasn't it?
          - It was wonderful, wasn't it?
          - That was excellent, wasn't it?
          - It was excellent, wasn't it?
          - That was good, wasn't it?
          - It was good, wasn't it?
          - This was great, wasn't it?
          - This was amazing, wasn't it?
          - This was brilliant, wasn't it?
          - This was fantastic, wasn't it?
          - This was wonderful, wasn't it?
          - This was excellent, wasn't it?
