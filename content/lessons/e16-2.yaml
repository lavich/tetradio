blocks:
  - type: explanation
    id: offer-words
    title: Слова урока — условия оффера
    body: |-
      Тексты урока — письмо с предложением работы, конец собеседования и звонок рекрутера. Слова урока образуют три группы.

      **Деньги и условия.** **A pay review** — плановый пересмотр зарплаты; **performance review** из прежних модулей оценивает работу. **An annual increment** — ежегодное повышение оклада на оговорённый процент. **A signing bonus** — разовая выплата при выходе на работу. **A pension scheme** — пенсионная программа с взносами работодателя. **Annual leave** — оплачиваемый отпуск. **Private healthcare** — частная медицинская страховка. **A stipend** — фиксированная сумма на назначенную цель, например на домашний офис; сумма назначена заранее и не зависит от чеков. **Reimburse** — возместить траты по чекам. **A vesting schedule** — график, по которому сотрудник получает права на опционы; **stock options** из модуля `e08` — сам инструмент.

      **Срок и письменные условия.** **A written confirmation** — подтверждение условий письмом. **Expire** — истекать: **The offer expires on Friday.** **An extension** — продление срока. **Be subject to** — зависеть от выполнения условия: **The offer is subject to two references.** **A clause** — пункт договора.

      **Решение.** **Turn down** — отклонить предложение. **Sleep on it** — взять паузу на размышление. **A sticking point** — спорный пункт, который мешает договориться.
  - type: explanation
    id: offer-safety
    title: О чём этот урок и о чём нет
    body: |-
      Курс учит английскому языку. Он не заменяет юридическую и финансовую консультацию: условия договора, налоги и опционы проверяет специалист. Компании, цифры и условия в уроке придуманы и не описывают реальные предложения.

      Просьба о времени на решение и о письменном подтверждении условий — обычная часть разговора об оффере. Её формулируют спокойно, как вопрос, без ультиматумов и сравнения с другими предложениями.
