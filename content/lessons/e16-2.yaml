  - type: exercise
    id: terms-match
    title: Условия оффера
    instruction: Соедините определение с английским словом или выражением. Два варианта лишние.
    format: match
    bank:
      - a pay review
      - a signing bonus
      - an annual increment
      - a pension scheme
      - annual leave
      - private healthcare
      - a stipend
      - a vesting schedule
      - a clause
    items:
