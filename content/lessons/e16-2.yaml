        prompt: разовая выплата, которую получают при выходе на работу
        answer: a signing bonus
      - id: m2
        prompt: плановая встреча раз в год, после которой оклад может измениться
        answer: a pay review
      - id: m3
        prompt: ежегодное повышение оклада на заранее оговорённый процент
        answer: an annual increment
      - id: m4
        prompt: программа накоплений на старость, в которую вносят и работодатель, и работник
        answer: a pension scheme
      - id: m5
        prompt: оплачиваемые дни отдыха в году
        answer: annual leave
      - id: m6
        prompt: график, по которому сотрудник получает права на опционы
        answer: a vesting schedule
      - id: m7
        prompt: фиксированная сумма на домашний офис или обучение
        answer: a stipend
  - type: exercise
    id: conditions-gap
    title: Срок и условия в предложениях
    instruction: Вставьте слово или выражение. Два варианта лишние.
    format: gap
    bank:
      - reimburse
      - expire
      - an extension
      - be subject to
      - a written confirmation
      - turn down
      - sleep on it
      - a sticking point
      - a clause
    items:
      - id: g1
        prompt: The company will ___ your travel costs if you send the receipts. (возместить)
        answer: reimburse
      - id: g2
        prompt: The offer will ___ on Friday, so please reply before then. (истечёт)
        answer: expire
      - id: g3
        prompt: I need one more week, so I would like to ask for ___ of the deadline. (продление)
        answer: an extension
      - id: g4
        prompt: The offer will ___ a background check and two references. (зависеть от)
        answer: be subject to
      - id: g5
        prompt: Before I accept, I would like ___ of all the terms. (письменное подтверждение)
        answer: a written confirmation
      - id: g6
        prompt: Thank you, but the role is not right for me now, so I have to ___ the offer. (отклонить)
        answer: turn down
      - id: g7
        prompt: I do not want to answer today. I would like to ___ and reply tomorrow. (взять паузу на размышление)
        answer: sleep on it
  - type: explanation
    id: reading-how
    title: Как читать письмо с оффером
    body: |-
      Письмо с предложением обычно делится на разделы: должность и дата выхода, зарплата и премии, дополнительные условия, срок и условия вступления в силу. Сначала найдите срок ответа и условия, от которых зависит предложение (**subject to**), затем прочитайте разделы о деньгах и о дополнительных условиях. Цифры сравнивайте с тем, что вы обсуждали с рекрутером.

      Письмо вымышленное и служит примером. Слова вне списков переведены под текстом.
  - type: reading
    id: offer
    title: "Offer of employment: Senior Backend Engineer"
    text: |-
      Subject: Offer of employment: Senior Backend Engineer
      Pellmore Software · example

      Dear Ms Varga,

      We are pleased to offer you the position of Senior Backend Engineer in the Platform team. You will report to the Engineering Manager, and your start date is 1 April.

      Salary and bonus
      Your base salary is 78,000 a year, paid monthly. You will receive a signing bonus of 4,000 with your first salary. Your pay will be considered at the pay review in March each year, and a fixed annual increment of 3 percent applies from the second year.

      Benefits
      You will have 25 days of annual leave, a pension scheme to which the company adds 6 percent of your salary, private healthcare, and a home-office stipend of 600 a year. The company will reimburse your travel costs for the interview process within 30 days of receiving the receipts. You will also receive 4,000 options, with a four-year vesting schedule.

      Conditions
      This offer is subject to two references. It will expire on 14 March; if you need an extension, please write to us. The attached contract includes a clause about the notice period, and we will send a written confirmation of any detail that is unclear.

      Kind regards
      Pellmore Software, People Team
    glosses:
      - text: report to
        russian: подчиняться
      - text: paid monthly
        russian: выплачивается раз в месяц
      - text: considered
        russian: рассматривается
      - text: applies
        russian: действует
      - text: options
        russian: опционы на акции
      - text: references
        russian: рекомендации прежних работодателей
      - text: attached
        russian: приложенный
      - text: unclear
        russian: неясный
