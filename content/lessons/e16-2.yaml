  - type: exercise
    id: offer-language
    about: offer
    title: Слова письма
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: «This offer is subject to two references.» What does it mean?
        options:
          - Two references are optional.
          - The offer depends on receiving two references.
          - The offer already includes two references.
        answer: The offer depends on receiving two references.
        explanation: "Subject to — «зависит от»: предложение вступает в силу при выполнении условия."
      - id: q2
        prompt: «It will expire on 14 March.» What happens on 14 March?
        options:
          - The offer stops being valid.
          - The contract starts.
          - The pay review takes place.
        answer: The offer stops being valid.
        explanation: "Expire — «истекать»: после этой даты предложение недействительно."
      - id: q3
        prompt: «The company will reimburse your travel costs.» What will the company do?
        options:
          - Pay a fixed amount in advance.
          - Book the tickets for you.
          - Pay back the money you spent.
        answer: Pay back the money you spent.
        explanation: Reimburse — возместить потраченное по чекам.
      - id: q4
        prompt: «A four-year vesting schedule.» What does the schedule describe?
        options:
          - How often the salary is paid.
          - When the employee gets the right to the options.
          - How many days of leave there are.
        answer: When the employee gets the right to the options.
        explanation: Vesting schedule — график получения прав на опционы.
  - type: explanation
    id: listening-how
    title: Как слушать конец собеседования и звонок с оффером
    body: |-
      В первой записи Astrid заканчивает собеседование, а Nadia задаёт свои вопросы. Слушайте, о чём она спрашивает и как формулирует вопросы: **What have you been focusing on…?**, **How is success measured…?**, **What are the next steps…?** Во второй записи Katarina звонит Daniel с предложением: слушайте цифры, срок и условия, а также то, как Daniel просит время.

      Сначала послушайте запись целиком, затем ответьте на вопросы и проверьте себя при втором прослушивании. Транскрипт открывается после ответа.
  - type: listening
    id: end
    title: Nadia asks questions at the end of the interview
    plays: 2
    transcript:
      - speaker: Astrid
        text: That's everything from my side. Do you have any questions for us?
      - speaker: Nadia
        text: Yes, a few, thank you. What does a typical day look like for the team?
      - speaker: Astrid
        text: Mornings are usually quiet, so people can focus. We have a short stand-up at ten, and then most people work on their own tasks. Pairing and code reviews happen in the afternoon.
      - speaker: Nadia
        text: Mm-hm. And what have you been focusing on this quarter?
      - speaker: Astrid
        text: We've been working on a new billing service. We've also been reducing the time it takes to release, from two weeks to one.
      - speaker: Nadia
        text: That sounds interesting. How is success measured in this role?
      - speaker: Astrid
        text: In the first three months, we look at how well you understand the system and the team. After that, we agree on goals for each quarter, and we review them together.
      - speaker: Nadia
        text: I see. And how do you support engineers' growth?
      - speaker: Astrid
        text: Every engineer has a yearly budget for courses and conferences, and a one-to-one with their manager every two weeks.
      - speaker: Nadia
        text: Thank you. One more question. What would my first ninety days look like?
      - speaker: Astrid
        text: You'd shadow a colleague for two weeks, and then take a small task of your own. Your manager will write a plan for the first ninety days with you.
      - speaker: Nadia
        text: That's helpful. It was a pleasure speaking with you. What are the next steps, and when can I expect to hear back?
      - speaker: Astrid
        text: We'll decide by the end of next week, and I'll email you on Friday. Thank you for coming, Nadia.
  - type: exercise
    id: end-q
    about: end
    title: Что сказали в записи
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: When does the team have its stand-up?
        options:
          - at ten
          - at nine
          - at noon
        answer: at ten
      - id: q2
        prompt: What has the team been working on this quarter?
        options:
          - a new mobile app
          - a data migration
          - a new billing service
        answer: a new billing service
      - id: q3
        prompt: What has the team been reducing?
        options:
          - the size of the team
          - the time it takes to release
          - the number of meetings
        answer: the time it takes to release
      - id: q4
        prompt: What does the team look at in the first three months?
        options:
          - how well the engineer understands the system and the team
          - how many tasks the engineer finishes
          - how many releases the engineer makes
        answer: how well the engineer understands the system and the team
      - id: q5
        prompt: What does every engineer have for growth?
        options:
          - a free laptop every year
          - a private office
          - a yearly budget for courses and conferences
        answer: a yearly budget for courses and conferences
      - id: q6
        prompt: When will Astrid and the team make a decision?
        options:
          - in a month
          - by the end of next week
          - by tomorrow morning
        answer: by the end of next week
  - type: exercise
    id: end-language
    about: end
    title: Как задают вопросы в записи
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Astrid says «We've been working on a new billing service.» What does the tense show?
        options:
          - The work finished last year.
          - The work will start next quarter.
          - The work started earlier and is still going on.
        answer: The work started earlier and is still going on.
        explanation: "Have been working — present perfect continuous: действие началось раньше и продолжается."
      - id: q2
        prompt: Nadia asks «What have you been focusing on this quarter?» What does she ask about?
        options:
          - What the team did five years ago.
          - What the team has been doing since the start of the quarter.
          - What the team will do next year.
        answer: What the team has been doing since the start of the quarter.
        explanation: Вопрос в present perfect continuous касается периода от начала квартала до сегодня.
      - id: q3
        prompt: Nadia asks «What are the next steps, and when can I expect to hear back?» What does she want to know?
        options:
          - What happens after the interview and when she will get an answer.
          - Whether she should accept the job.
          - Which questions the team will ask next.
        answer: What happens after the interview and when she will get an answer.
        explanation: Next steps — следующие этапы; hear back — получить ответ.
  - type: listening
    id: call
    title: Katarina calls Daniel with an offer
    plays: 2
    transcript:
      - speaker: Katarina
        text: Hello, Daniel, it's Katarina from Brindle Analytics. Do you have a few minutes?
      - speaker: Daniel
        text: Yes, of course. Hello, Katarina.
      - speaker: Katarina
        text: I have good news. The team enjoyed meeting you, and we'd like to offer you the role of data engineer.
      - speaker: Daniel
        text: Thank you very much. I'm very pleased to receive the offer.
      - speaker: Katarina
        text: The base salary is eighty thousand a year. There's also a signing bonus of five thousand, twenty-five days of annual leave, and a pension scheme where the company adds six percent.
      - speaker: Daniel
        text: That sounds good. Could we go through the full package together? I'd like to understand the stock options.
      - speaker: Katarina
        text: Of course. You'd receive four thousand options with a four-year vesting schedule. That means you earn the right to them step by step, a quarter each year.
      - speaker: Daniel
        text: I see, thank you. Would there be any flexibility on the start date? My notice period is two months.
      - speaker: Katarina
        text: The start date can be as late as the first of May, so that works. The offer is subject to a background check, and it's open until next Friday.
      - speaker: Daniel
        text: Thank you. Could I confirm my decision by the end of next week? I'd like to sleep on it and read the contract carefully.
      - speaker: Katarina
        text: Of course. I can extend the offer by a few days if you need more time. I'll send the details in writing today.
      - speaker: Daniel
        text: That's perfect. Thank you for your time, Katarina.
  - type: exercise
    id: call-q
    about: call
    title: Что сказали в звонке
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What role does Katarina offer to Daniel?
        options:
          - backend engineer
          - engineering manager
          - data engineer
        answer: data engineer
      - id: q2
        prompt: What is the base salary?
        options:
          - ninety thousand a year
          - eighty thousand a year
          - seventy-five thousand a year
        answer: eighty thousand a year
      - id: q3
        prompt: How much is the signing bonus?
        options:
          - five thousand
          - fifteen thousand
          - fifty thousand
        answer: five thousand
      - id: q4
        prompt: What does Daniel ask about the start date?
        options:
          - whether he can start tomorrow
          - whether he can work from home
          - whether there is flexibility, because of his notice period
        answer: whether there is flexibility, because of his notice period
      - id: q5
        prompt: What is the offer subject to?
        options:
          - a second interview
          - a background check
          - a medical test
        answer: a background check
      - id: q6
        prompt: When does Daniel ask to confirm his decision?
        options:
          - by the end of next week
          - by tomorrow
          - on the same day
        answer: by the end of next week
  - type: exercise
    id: call-language
    about: call
    title: Как просят в звонке
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Daniel says «Could we go through the full package together?» What does he do?
        options:
          - He accepts the offer immediately.
          - He asks Katarina to review all the terms with him.
          - He refuses the offer.
        answer: He asks Katarina to review all the terms with him.
        explanation: Go through — разобрать по пунктам; full package — все условия вместе.
      - id: q2
        prompt: Daniel says «Would there be any flexibility on the start date?» What does he do?
        options:
          - He politely asks whether the date can change.
          - He demands a new date.
          - He says he cannot start.
        answer: He politely asks whether the date can change.
        explanation: Would there be any flexibility — вежливый вопрос о возможности изменить условие.
      - id: q3
        prompt: Daniel says «I'd like to sleep on it.» What does he mean?
        options:
          - He has already refused.
          - He is tired and wants to end the call.
          - He wants some time to think before he decides.
        answer: He wants some time to think before he decides.
        explanation: Sleep on it — взять паузу и обдумать, не решая сразу.
      - id: q4
        prompt: Katarina says «The offer is subject to a background check.» What does it mean?
        options:
          - The check has already happened.
          - The offer depends on completing a check.
          - The check is optional.
        answer: The offer depends on completing a check.
        explanation: Subject to — зависит от выполнения условия.
