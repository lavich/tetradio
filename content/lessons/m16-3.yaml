blocks:
  - type: explanation
    id: two-texts
    title: Два текста, как на экзамене
    body: |-
      С этого модуля письмо — как на экзамене: **два текста** примерно по 80 слов (на экзамене 80–100, всего 45 минут). Задание A — дружеский текст: письмо или сообщение другу. Задание B — «менее дружеский», официальный текст: письмо в школу, в гостиницу, на работу.

      Главное различие — обращение на «ты» или на «вы». В дружеском письме — εσύ: θέλεις, μπορείς, Κι εσύ;. В официальном — εσείς от начала до конца: θέλετε, μπορείτε, την απάντησή σας. Смешать «ты» и «вы» в одном письме — частая ошибка.

      **Αγαπητή κυρία Χριστοδούλου,** — «Уважаемая госпожа Христодулу,» (мужчине — Αγαπητέ κύριε Γεωργίου, модуль 14). После обращения — запятая, дальше текст с новой строки с заглавной буквы.

      Концовки: **Με εκτίμηση,** — «С уважением,» (модуль 14) — стандарт официального письма незнакомому человеку. **Με φιλικούς χαιρετισμούς,** — «С дружеским приветом,» — вежливо, но теплее: например, преподавательнице, которую вы уже знаете. Другу пишут Τα λέμε! или Φιλιά! («Целую!»).

      Подпись: на экзамене настоящее имя не пишут — подпишитесь вымышленным именем.
    table:
      columns:
        - что
        - другу
        - в школу
      rows:
        - - обращение
          - Γεια σου, Νίκο!
          - Αγαπητή κυρία Χριστοδούλου,
        - - зачем пишете
          - Τι κάνεις; Γράφτηκα σε ένα μάθημα!
          - Θα ήθελα πληροφορίες για τα μαθήματα ελληνικών.
        - - «ты» или «вы»
          - Θέλεις να…; Μπορείς να…;
          - Έχετε…; Μπορείτε να…;
        - - перед концом
          - Κι εσύ; Τι κάνεις;
          - Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.
        - - концовка
          - Τα λέμε! / Φιλιά!
          - Με εκτίμηση, / Με φιλικούς χαιρετισμούς,
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: register-choice
    title: Другу или в школу
    instruction: Выберите подходящий вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы пишете письмо директору языковой школы, госпоже Христодулу. Как начать?
        options:
          - Αγαπητή κυρία Χριστοδούλου,
          - Γεια σου, Ελένη!
          - Τι κάνεις;
        answer: Αγαπητή κυρία Χριστοδούλου,
      - id: q2
        prompt: Как закончить письмо другу?
        options:
          - Τα λέμε!
          - Με εκτίμηση,
          - Σας ευχαριστώ εκ των προτέρων.
        answer: Τα λέμε!
      - id: q4
        prompt: В конце официального письма вы просите ответить.
        options:
          - Περιμένω την απάντησή σας.
          - Περιμένω την απάντησή σου.
          - Τα λέμε αύριο!
        answer: Περιμένω την απάντησή σας.
        explanation: σου — на «ты»; в официальном письме — σας.
      - id: q5
        prompt: Вы пишете преподавательнице, с которой давно знакомы, — вежливо, но тепло. Как подписаться?
        options:
          - Με φιλικούς χαιρετισμούς,
          - Τα λέμε!
          - Καλή όρεξη!
        answer: Με φιλικούς χαιρετισμούς,
  - type: explanation
    id: friendly-how
    title: Письмо другу о курсе
    body: |-
      План из пяти шагов:

      1. Приветствие и вопрос о делах: Γεια σου, …! Τι κάνεις;
      2. Где и когда вы учитесь: Γράφτηκα σε…, Έχω μάθημα δύο φορές την εβδομάδα…
      3. Какие преподаватель и группа: Η καθηγήτριά μας…, Στην τάξη μας είμαστε…
      4. Что легко, что трудно, какая у вас цель: Η προφορά είναι εύκολη, αλλά…; Ο στόχος μου είναι να…
      5. Вопрос другу и прощание: Κι εσύ; Θέλεις να…; Τα λέμε!

      Покажите грамматику модуля: две-три конструкции с να (θέλω να, πρέπει να, μπορώ να, ο στόχος μου είναι να) и аорист о том, что уже было (γράφτηκα, άρχισα). Связывайте предложения: και, αλλά, γιατί, όταν.

      80 слов — это 8–10 коротких предложений. Обращение и подпись тоже считаются.

      Проверьте себя после письма. После να — форма в том же лице, что и первый глагол (θέλω να μάθω, θέλεις να μάθεις), без приращения έ-. Πρέπει не меняется. О привычке — настоящее время (πρέπει να γράφω κάθε μέρα). Тонос — во всех словах из двух и больше слогов, второй тонос — в η καθηγήτριά μας, το επίπεδό μου.
  - type: writing
    id: course-letter
    register: friendly
    prompt: "Ваш друг Никос пишет: «Άκουσα ότι μαθαίνεις ελληνικά σε μια σχολή! Πώς είναι τα μαθήματα; Τι είναι εύκολο και τι δύσκολο;» (Άκουσα — «я слышал».) Ответьте ему письмом около 80 слов: где и когда вы учитесь, какие преподаватель и группа, что легко и что трудно, какая у вас цель. Задайте ему вопрос."
    words:
      min: 70
      max: 100
    model: |-
      Γεια σου, Νίκο!

      Τι κάνεις; Γράφτηκα σε μια σχολή ξένων γλωσσών στη Λεμεσό! Έχω μάθημα ελληνικών δύο φορές την εβδομάδα, την Τρίτη και την Πέμπτη το βράδυ. Στην τάξη μας είμαστε έξι μαθητές. Η καθηγήτριά μας, η κυρία Άντρη, εξηγεί πολύ καλά τη γραμματική. Η προφορά δεν είναι δύσκολη, αλλά όταν γράφω, κάνω ακόμα πολλά λάθη. Ο στόχος μου είναι να δώσω εξετάσεις τον Μάιο, γιατί πρέπει να έχω πιστοποιητικό για τη δουλειά μου. Θέλεις να μιλάμε ελληνικά όταν βρισκόμαστε;

      Τα λέμε!
      Βέρα
    criteria:
      - Около 80 слов (70–100); дружеское приветствие и прощание, всё письмо на «ты»
      - Сказано, где и когда вы учитесь (γράφτηκα σε…, έχω μάθημα…)
      - Сказано о преподавателе или группе
      - Сказано, что легко и что трудно (αλλά, γιατί)
      - "Названа цель с να: θέλω να δώσω…, ο στόχος μου είναι να…"
      - Есть вопрос другу (Κι εσύ;, Θέλεις να…;)
      - "После να — форма в нужном лице без приращения (να μάθω, а не να έμαθα); πρέπει не изменяется; тонос во всех словах из двух и больше слогов"
  - type: explanation
    id: formal-how
    title: Письмо в школу
    body: |-
      План из пяти шагов:

      1. Обращение: **Αγαπητή κυρία Χριστοδούλου,** Если имени не знаете — Αγαπητέ κύριε / Αγαπητή κυρία,
      2. Зачем пишете и кто вы: **Θα ήθελα πληροφορίες για τα μαθήματα ελληνικών.** Είμαι από…, μένω στη…, μαθαίνω ελληνικά εδώ και…
      3. Ваш уровень, цель и когда вы можете заниматься: Το επίπεδό μου είναι Α2. Θέλω να δώσω εξετάσεις… Μπορώ να έρχομαι μόνο το βράδυ, γιατί…
      4. Два-три вопроса: **Πόσο κοστίζουν τα δίδακτρα;** Πότε αρχίζουν τα μαθήματα; Πρέπει να γράψω ένα τεστ; Мягче — **Θα ήθελα να μάθω αν** έχετε βραδινά μαθήματα — «Я хотел(а) бы узнать, есть ли у вас вечерние занятия» (μαθαίνω — ещё и «узнавать», αν — «ли», модуль 10).
      5. Концовка: **Σας ευχαριστώ εκ των προτέρων.** **Περιμένω την απάντησή σας.** Με εκτίμηση, — и вымышленная подпись.

      Обратите внимание: в Μπορώ να έρχομαι μόνο το βράδυ — настоящее время, потому что речь о регулярных занятиях, а в Πρέπει να γράψω ένα τεστ; — форма от аориста: тест один.
  - type: exercise
    id: formal-sentences
    title: Фразы для официального письма
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я хотел(а) бы получить информацию о курсах греческого.
        answer:
          - Θα ήθελα πληροφορίες για τα μαθήματα ελληνικών.
          - Θα ήθελα πληροφορίες για τα μαθήματα των ελληνικών.
      - id: q2
        prompt: Сколько стоит обучение?
        answer:
          - Πόσο κοστίζουν τα δίδακτρα;
          - Πόσο είναι τα δίδακτρα;
        explanation: Τα δίδακτρα — только мн. ч., поэтому κοστίζουν.
      - id: q4
        prompt: Могу ли я записаться в октябре?
        answer:
          - Μπορώ να γραφτώ τον Οκτώβριο;
          - Μπορώ να γραφτώ τον Οκτώβρη;
          - Μπορώ να εγγραφώ τον Οκτώβριο;
          - Μπορώ να εγγραφώ τον Οκτώβρη;
        explanation: "Γράφομαι → να γραφτώ. Месяц без предлога, с артиклем: τον Οκτώβριο (модуль 04)."
  - type: writing
    id: school-inquiry
    register: formal
    prompt: Вы нашли в интернете языковую школу «Ορίζοντες» в Никосии, но на сайте мало информации. Напишите письмо директору школы, госпоже Христодулу, около 80 слов. Представьтесь, назовите свой уровень и цель, скажите, когда вы можете заниматься, и задайте два-три вопроса (цена, начало занятий, тест). Попросите ответить.
    words:
      min: 70
      max: 100
    model: |-
      Αγαπητή κυρία Χριστοδούλου,

      Θα ήθελα πληροφορίες για τα μαθήματα ελληνικών στη σχολή σας. Είμαι από τη Ρωσία και μένω στη Λευκωσία. Μαθαίνω ελληνικά εδώ και έναν χρόνο και το επίπεδό μου είναι Α2. Τον Μάιο θέλω να δώσω εξετάσεις για το πιστοποιητικό ελληνομάθειας. Μπορώ να έρχομαι μόνο το βράδυ, γιατί δουλεύω μέχρι τις πέντε. Έχετε βραδινά μαθήματα; Πόσο κοστίζουν τα δίδακτρα; Πρέπει να γράψω ένα τεστ πριν από την εγγραφή;

      Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

      Με εκτίμηση,
      Ναταλία Ορλόβα
    criteria:
      - Около 80 слов (70–100); официальное обращение (Αγαπητή κυρία…,) и концовка (Με εκτίμηση,)
      - Всё письмо на «вы» (έχετε, μπορείτε, σας) — без форм на «ты»
      - Сказано, зачем вы пишете (Θα ήθελα πληροφορίες για…)
      - Названы уровень и цель (το επίπεδό μου…, θέλω να δώσω εξετάσεις…)
      - Два-три вопроса о курсе (Πόσο κοστίζουν τα δίδακτρα;, Πότε αρχίζουν…;, Πρέπει να…;)
      - Есть просьба ответить (Περιμένω την απάντησή σας.)
      - "После να — правильная форма (να δώσω, να γράψω; о регулярном — να έρχομαι); второй тонос: την απάντησή σας, το επίπεδό μου"
  - type: explanation
    id: speaking-how
    title: Монолог — почему я учу греческий
    body: |-
      Во второй части устного экзамена вас могут спросить: **Γιατί μαθαίνετε ελληνικά;** — «Почему вы учите греческий?». Отвечайте о себе, около минуты.

      План из пяти шагов: сколько вы учите язык (εδώ και…); зачем (γιατί…: работа, жизнь на Кипре, друзья, экзамен); как вы учитесь (σχολή, φροντιστήριο, κάθε μέρα διαβάζω…); что легко и что трудно; ваша цель (θέλω να…, πρέπει να…, ο στόχος μου είναι να…).

      Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: why-greek
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Γιατί μαθαίνετε ελληνικά; Πώς μαθαίνετε; Τι είναι εύκολο και τι δύσκολο;»
      Говорите около минуты по плану, запишите ответ.
    seconds: 90
    model: Μαθαίνω ελληνικά εδώ και έναν χρόνο. Μένω στην Κύπρο με την οικογένειά μου και θέλω να μιλάω με τους ανθρώπους εδώ, στο μαγαζί, στον γιατρό, στη δουλειά. Πρέπει να μάθω ελληνικά και για τη δουλειά μου, γιατί οι συνάδελφοί μου είναι Κύπριοι. Πηγαίνω σε ένα φροντιστήριο δύο φορές την εβδομάδα και κάθε μέρα διαβάζω λίγο στο σπίτι. Η γραμματική είναι δύσκολη και κάνω ακόμα λάθη, αλλά μου αρέσει η γλώσσα. Προσπαθώ να μιλάω ελληνικά κάθε μέρα. Ο στόχος μου είναι να περάσω τις εξετάσεις για το επίπεδο Α2 τον Μάιο.
    criteria:
      - Говорили около минуты, без долгих пауз
      - Сказали, сколько учите язык (εδώ και…)
      - Назвали хотя бы две причины (γιατί…)
      - Рассказали, как учите и что трудно
      - "Хотя бы две конструкции с να в правильной форме: θέλω να μιλάω, ο στόχος μου είναι να περάσω"
      - Ударение на своём месте (μαθαίνω, γραμματική, εξετάσεις, φροντιστήριο); γ в γλώσσα — мягкий щелевой звук, а не русское [г]
