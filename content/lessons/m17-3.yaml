title: «Заболел, не приду», ролевая игра и повторение
kind: lesson
items:
  - kind: phrase
    id: p223 # Τι έπαθες;
  - kind: phrase
    id: p224 # Περαστικά!
  - kind: phrase
    id: p225 # Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.
  - kind: phrase
    id: p226 # Πρέπει να ξεκουραστείς.
  - kind: phrase
    id: p229 # Είμαι καλύτερα τώρα.
blocks:
  - type: explanation
    id: sick-phrases
    title: Когда кто-то заболел
    body: |-
      **Τι έπαθες;** — «Что с тобой случилось?». Έπαθες — аорист от παθαίνω «претерпевать»; запомните фразу целиком. Вежливо — **Τι πάθατε;** Ответ: **Αρρώστησα.** **Έχω γρίπη.** **Με πονάει…**

      **Περαστικά!** — «Выздоравливай!», «Скорейшего выздоровления!» — так говорят каждому, кто болеет, и на «ты», и на «вы».

      **Πρέπει να ξεκουραστείς.** — «Тебе нужно отдохнуть». Ξεκουράζομαι — «отдыхать» (ξε- + κουράζομαι «уставать», модуль 15); после να — форма от аориста ξεκουράστηκα, как να γραφτώ (модуль 16).

      **Είμαι καλύτερα τώρα.** — «Мне уже лучше» (καλύτερα — «лучше»).

      **Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.** — «Сегодня не смогу прийти, я заболел». Женщина говорит άρρωστη.

      Предложить помощь: **Θέλεις να σου φέρω κάτι;** — «Принести тебе что-нибудь?» (φέρνω, έφερα → να φέρω). Попросить звонить: **Πάρε με τηλέφωνο!**
    table:
      columns:
        - ситуация
        - что сказать
      rows:
        - - узнать, что случилось
          - Τι έπαθες; Πού σε πονάει;
        - - пожелать выздоровления
          - Περαστικά!
        - - дать совет
          - Πρέπει να ξεκουραστείς.
        - - предложить помощь
          - Θέλεις να σου φέρω κάτι;
        - - сказать, что уже лучше
          - Είμαι καλύτερα τώρα.
        - - предупредить, что не придёте
          - Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Друг говорит «Έχω γρίπη». Что вы ему пожелаете?
        options:
          - Περαστικά!
          - Καλή όρεξη!
          - Στην υγειά μας!
        answer: Περαστικά!
        explanation: Στην υγειά μας! — тост, а не пожелание больному.
      - id: q2
        prompt: Подруга выглядит плохо. Вы спрашиваете, что случилось.
        options:
          - Τι έπαθες;
          - Τι δουλειά κάνεις;
          - Πόσο κάνει;
        answer: Τι έπαθες;
      - id: q3
        prompt: Вы болели, но теперь вам лучше.
        options:
          - Είμαι καλύτερα τώρα.
          - Δεν νιώθω καλά.
          - Είμαι κρυωμένος.
        answer: Είμαι καλύτερα τώρα.
      - id: q4
        prompt: Друг много работает и очень устал. Ваш совет?
        options:
          - Πρέπει να ξεκουραστείς.
          - Έκοψα το τσιγάρο.
          - Πέρασα τις εξετάσεις!
        answer: Πρέπει να ξεκουραστείς.
      - id: q5
        prompt: Вы пишете коллеге, что сегодня не придёте на работу.
        options:
          - Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.
          - Είμαι καλύτερα τώρα.
          - Περαστικά!
        answer: Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.
  - type: explanation
    id: friendly-how
    title: Сообщение другу — «заболел, не приду»
    body: |-
      Как и в модуле 16, пишем два текста — дружеский и официальный, примерно по 70–80 слов. Сначала сообщение другу, на «ты».

      План из пяти шагов:

      1. Приветствие и извинение: Γεια σου, …! Συγγνώμη, αλλά αύριο δεν μπορώ να έρθω…
      2. Что с вами и с какого времени: Αρρώστησα! Από την Πέμπτη έχω γρίπη: βήχω, έχω πονόλαιμο, με πονάει…
      3. Что вы делаете или что сказал врач: Πήγα στον γιατρό και μου είπε να μείνω στο κρεβάτι…
      4. Как вы себя чувствуете: Νιώθω λίγο καλύτερα, αλλά…
      5. Новое предложение и прощание: Θέλεις να πάμε για καφέ την άλλη εβδομάδα; Πάρε με τηλέφωνο! Φιλιά,

      Покажите грамматику модуля: με πονάει (винительный падеж!), νιώθω, слабые местоимения перед глаголом (μου είπε, σε περιμένω) и после повелительной формы (πάρε με, πες μου). О прошлом — аорист: αρρώστησα, πήγα, μου είπε.
  - type: writing
    id: sick-friend
    register: friendly
    prompt: "Ваша подруга Хара пишет: «Γεια! Αύριο το βράδυ πάμε όλοι μαζί στην ταβέρνα για τα γενέθλιά μου. Έρχεσαι;» (τα γενέθλια — день рождения.) Но вы заболели. Ответьте ей сообщением около 70–80 слов: извинитесь, скажите, что с вами и с какого времени, что сказал врач, как вы себя чувствуете, и предложите встретиться в другой день."
    words:
      min: 60
      max: 90
    model: |-
      Γεια σου, Χαρά!

      Συγγνώμη, αλλά αύριο δεν μπορώ να έρθω στην ταβέρνα. Αρρώστησα! Από την Πέμπτη έχω γρίπη: βήχω όλη τη νύχτα, έχω πονόλαιμο και με πονάει πολύ το κεφάλι μου. Χθες πήγα στον γιατρό και μου είπε να μείνω στο κρεβάτι τρεις μέρες. Τώρα νιώθω λίγο καλύτερα, αλλά είμαι ακόμα πολύ κουρασμένος. Δεν θέλω να αρρωστήσετε κι εσείς! Θέλεις να πάμε για καφέ την άλλη εβδομάδα; Πάρε με τηλέφωνο!

      Να περάσετε ωραία αύριο!
      Φιλιά,
      Μαξίμ
    criteria:
      - Около 70–80 слов (60–90); дружеское приветствие и прощание, всё сообщение на «ты»
      - Есть извинение и сказано, что вы не придёте (Συγγνώμη, αλλά δεν μπορώ να έρθω…)
      - Названы два-три симптома и с какого времени (Από την Πέμπτη…, έχω γρίπη, βήχω)
      - Сказано, что вы делаете или что сказал врач (μου είπε να…)
      - Есть предложение встретиться в другой день или просьба позвонить
      - "Με πονάει / με πονάνε — с винительным падежом, глагол согласован с частью тела; слабые местоимения перед глаголом, после повелительной формы — после: πάρε με; тонос во всех словах из двух и больше слогов"
  - type: explanation
    id: formal-how
    title: Сообщение на работу
    body: |-
      Второй текст — начальнику или преподавателю, на «вы» от начала до конца.

      1. Обращение: **Αγαπητέ κύριε …,** / **Αγαπητή κυρία …,**
      2. Зачем пишете: **Σας γράφω γιατί σήμερα δεν μπορώ να έρθω στη δουλειά** (в школу — στο μάθημα).
      3. Что с вами и что сказал врач: Είμαι άρρωστη: από χθες… Ο γιατρός μου είπε ότι πρέπει να μείνω στο σπίτι…
      4. Что вы просите или предлагаете: **Γι' αυτό θα ήθελα να πάρω άδεια ασθενείας μέχρι την Πέμπτη.** — «Поэтому я хотел(а) бы взять больничный до четверга» (γι' αυτό — «поэтому», η άδεια — отпуск, модуль 15; ασθενείας — «по болезни»; запомните выражение целиком).
      5. Концовка: **Σας ευχαριστώ για την κατανόηση.** — «Спасибо за понимание». **Με εκτίμηση,** и вымышленная подпись.

      В образце есть оборот **Τη σύσκεψη της Τετάρτης μπορεί να την κάνει η συνάδελφός μου.** — «Совещание в среду может провести моя коллега». Когда дополнение стоит в начале предложения, его повторяют слабым местоимением перед глаголом: τη σύσκεψη … **την** κάνει. Так говорят очень часто; самим строить такие фразы пока не обязательно.
  - type: exercise
    id: formal-sentences
    title: Фразы для официального сообщения
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Пишу вам, потому что сегодня не могу прийти на работу.
        answer:
          - Σας γράφω γιατί σήμερα δεν μπορώ να έρθω στη δουλειά.
          - Σας γράφω, γιατί σήμερα δεν μπορώ να έρθω στη δουλειά.
          - Σας γράφω γιατί δεν μπορώ να έρθω σήμερα στη δουλειά.
          - Σας γράφω, γιατί δεν μπορώ να έρθω σήμερα στη δουλειά.
      - id: q2
        prompt: Я больна. (пишет женщина)
        answer:
          - Είμαι άρρωστη.
      - id: q3
        prompt: Мне нужно остаться дома два дня.
        answer:
          - Πρέπει να μείνω στο σπίτι δύο μέρες.
          - Πρέπει να μείνω στο σπίτι δυο μέρες.
          - Πρέπει να μείνω σπίτι δύο μέρες.
          - Πρέπει να μείνω σπίτι δυο μέρες.
        explanation: "Μένω → θα μείνω, να μείνω."
      - id: q4
        prompt: Спасибо (вам) за понимание.
        answer:
          - Σας ευχαριστώ για την κατανόηση.
          - Ευχαριστώ για την κατανόηση.
  - type: writing
    id: sick-work
    register: formal
    prompt: Сегодня понедельник. Вы работаете в фирме в Лимасоле, но утром заболели и были у врача. Напишите своему начальнику, господину Эвангелу (κύριος Ευαγγέλου), сообщение около 70–80 слов. Объясните, почему не придёте, что с вами и что сказал врач, попросите больничный и скажите, кто может заменить вас на совещании в среду. Поблагодарите.
    words:
      min: 60
      max: 90
    model: |-
      Αγαπητέ κύριε Ευαγγέλου,

      Σας γράφω γιατί σήμερα δεν μπορώ να έρθω στη δουλειά. Είμαι άρρωστη: από χθες το βράδυ έχω πονοκέφαλο, βήχω και ζαλίζομαι. Σήμερα το πρωί πήγα στον γιατρό. Μου είπε ότι έχω γρίπη και ότι πρέπει να μείνω στο σπίτι τρεις μέρες. Γι' αυτό θα ήθελα να πάρω άδεια ασθενείας μέχρι την Πέμπτη. Τη σύσκεψη της Τετάρτης μπορεί να την κάνει η συνάδελφός μου, η κυρία Λοΐζου. Σας ευχαριστώ για την κατανόηση.

      Με εκτίμηση,
      Ιρίνα Σοκόλοβα
    criteria:
      - Около 70–80 слов (60–90); официальное обращение (Αγαπητέ κύριε…,) и концовка (Με εκτίμηση,)
      - Всё сообщение на «вы» (σας γράφω, σας ευχαριστώ) — без форм на «ты»
      - Сказано, почему вы пишете (Σας γράφω γιατί…)
      - Названы симптомы и что сказал врач (μου είπε ότι…)
      - Есть просьба или решение о работе (άδεια ασθενείας, кто заменит)
      - Есть благодарность (Σας ευχαριστώ για την κατανόηση.)
      - "Слабые местоимения на месте (μου είπε, σας γράφω); после πρέπει να — форма от аориста (να μείνω); второй тонос: η συνάδελφός μου"
  - type: explanation
    id: speaking-how
    title: Ролевая игра — друг заболел
    body: |-
      В третьей части устного экзамена вы разыгрываете ситуацию с другим экзаменуемым. Здесь ваш партнёр — друг, который заболел. Говорите на «ты».

      План: поздоровайтесь и спросите, что случилось (Τι έπαθες;); где болит и с какого времени (Πού σε πονάει; Από πότε;); ходил ли он к врачу (Πήγες στον γιατρό;); дайте совет (Πρέπει να…); предложите помощь (Θέλεις να σου φέρω κάτι;); пожелайте выздоровления (Περαστικά!) и попрощайтесь.

      Реплики друга в образце — только пример: слушайте партнёра и отвечайте на то, что он говорит.
  - type: speaking
    id: sick-roleplay
    part: roleplay
    prompt: |-
      Ролевая игра. Ваш друг Андреас не пришёл на занятие. Вы звоните ему. Он начинает: «Γεια σου… Δεν νιώθω καλά σήμερα.»

      Ваша роль: узнайте, что случилось, где болит и с какого времени; спросите, был ли он у врача; дайте один-два совета; предложите принести что-нибудь; пожелайте выздоровления и попрощайтесь. Говорите на «ты», произнесите реплики вслух и запишите.
    seconds: 90
    model: |-
      — Γεια σου… Δεν νιώθω καλά σήμερα.
      — Γεια σου, Αντρέα! Τι έπαθες;
      — Αρρώστησα. Βήχω και έχω πονόλαιμο.
      — Σε πονάει και το κεφάλι;
      — Ναι, με πονάει πολύ το κεφάλι μου και είμαι πολύ κουρασμένος.
      — Από πότε είσαι άρρωστος;
      — Από χθες το βράδυ.
      — Πήγες στον γιατρό;
      — Όχι ακόμα.
      — Πρέπει να πας αύριο. Και πρέπει να ξεκουραστείς! Θέλεις να σου φέρω κάτι; Φαγητό, χυμό;
      — Ναι, έναν χυμό, αν μπορείς.
      — Εντάξει, έρχομαι το απόγευμα. Περαστικά! Πάρε με τηλέφωνο, αν χρειάζεσαι κάτι.
      — Ευχαριστώ πολύ! Τα λέμε.
    criteria:
      - Поздоровались и попрощались на «ты»
      - Спросили, что случилось и где болит (Τι έπαθες; Πού σε πονάει;)
      - Спросили, с какого времени и был ли друг у врача (Από πότε…; Πήγες στον γιατρό;)
      - "Дали совет с πρέπει να: Πρέπει να ξεκουραστείς, πρέπει να πας στον γιατρό"
      - Предложили помощь (Θέλεις να σου φέρω κάτι;) и пожелали выздоровления (Περαστικά!)
      - "Слабые местоимения на месте: σε πονάει, σου φέρω, πάρε με; ударение в Περαστικά, κουρασμένος, άρρωστος"
  - type: exercise
    id: review-clitics
    title: Повторение — слабые местоимения
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - με
      - σε
      - τον
      - την
      - το
      - μου
      - σου
      - τους
      - πονάνε
    items:
      - id: g1
        prompt: — Πού είναι το κλειδί μου; — Δεν ___ βλέπω.
        answer: το
      - id: g2
        prompt: — Μαρία, μπορώ να ___ ρωτήσω κάτι; — Ναι, πες μου!
        answer: σε
      - id: g3
        prompt: — Νίκο, πες ___ τι έπαθες! Θέλω να ξέρω.
        answer: μου
      - id: g4
        prompt: Διάβασα όλη τη νύχτα και τώρα με ___ τα μάτια μου.
        answer: πονάνε
      - id: g5
        prompt: Ο Γιώργος είναι άρρωστος. Αύριο ___ παίρνω τηλέφωνο.
        answer: τον
      - id: g6
        prompt: Η Άννα έχει γρίπη και ___ πονάει ο λαιμός της.
        answer: την
      - id: g7
        prompt: Πού είναι ο Νίκος και ο Γιώργος; Δεν ___ βλέπω.
        answer: τους
