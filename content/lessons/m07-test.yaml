title: Контрольная модуля 07
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение объявлений, аудирование «описание → картинка», множественное число, согласование прилагательных, αυτός и δικός. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Запись звучит два раза. Картинки в аудировании заменены короткими описаниями по-русски; две из них лишние.
  - type: reading
    id: ads
    title: Αγγελίες
    text: |-
      1. Πωλείται μεγάλος καναπές, μπλε, σε καλή κατάσταση. Είναι πέντε χρονών, αλλά είναι πολύ καθαρός. Κάνει 120 ευρώ. Τηλέφωνο: 99 31 22 40, Γιώργος.

      2. Πωλούνται δύο κρεβάτια για παιδιά, άσπρα, σχεδόν καινούργια. Κάνουν 80 ευρώ και τα δύο. Τηλέφωνο: 96 18 55 03, Μαρίνα.

      3. Πωλείται πλυντήριο. Είναι παλιό και δεν δουλεύει πολύ καλά, αλλά είναι πολύ φτηνό: μόνο 30 ευρώ! Πωλείται επίσης ένα μικρό ψυγείο, κόκκινο και καινούργιο. Κάνει 200 ευρώ. Τηλέφωνο: 97 40 12 66, Άντρη.
    glosses:
      - text: σχεδόν
        russian: почти
      - text: και τα δύο
        russian: за обе вместе
  - type: exercise
    id: ads-tf
    about: ads
    graded: true
    title: Чтение
    instruction: Прочитайте объявления (η αγγελία — объявление). Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: "Αγγελία 1: ο καναπές είναι καινούργιος."
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είναι πέντε χρονών — диван не новый, ему пять лет.
      - id: q2
        prompt: "Αγγελία 1: ο καναπές είναι καθαρός."
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: "Αγγελία 2: τα κρεβάτια είναι μαύρα."
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κρεβάτια… άσπρα — кровати белые.
      - id: q4
        prompt: "Αγγελία 2: τα δύο κρεβάτια κάνουν 80 ευρώ."
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: "Αγγελία 3: το πλυντήριο δουλεύει πολύ καλά."
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν δουλεύει πολύ καλά — работает не очень хорошо.
      - id: q6
        prompt: "Αγγελία 3: το πλυντήριο είναι ακριβό."
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Είναι πολύ φτηνό: μόνο 30 ευρώ."
      - id: q7
        prompt: "Αγγελία 3: το ψυγείο είναι κόκκινο."
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: exercise
    id: ads-choice
    about: ads
    graded: true
    title: Кому позвонить
    instruction: Выберите, чей телефон нужен.
    format: choice
    items:
      - id: q1
        prompt: Вам нужна кровать для ребёнка.
        options:
          - Γιώργος
          - Μαρίνα
          - Άντρη
        answer: Μαρίνα
      - id: q2
        prompt: Вам нужен новый холодильник.
        options:
          - Γιώργος
          - Μαρίνα
          - Άντρη
        answer: Άντρη
        explanation: В объявлении 3 кроме стиральной машины продаётся ένα μικρό ψυγείο, κόκκινο και καινούργιο.
  - type: listening
    id: shop
    title: Τι θέλουν;
    plays: 2
    transcript:
      - speaker: Γιάννης
        text: "Θέλω μία μικρή ντουλάπα για το υπνοδωμάτιο. Άσπρη, παρακαλώ."
      - speaker: Μαρία
        text: "Ψάχνω δύο πράσινες καρέκλες για το μπαλκόνι."
      - speaker: Κώστας
        text: "Θέλω έναν μεγάλο καναπέ για το σαλόνι. Μαύρο, παρακαλώ."
      - speaker: Ελένη
        text: "Ψάχνω ένα φτηνό ψυγείο. Μικρό, γιατί η κουζίνα μου είναι πολύ μικρή."
      - speaker: Σάββας
        text: "Θέλω ένα κρεβάτι για το παιδί μου. Κόκκινο, όχι μπλε."
  - type: exercise
    id: shop-match
    about: shop
    graded: true
    title: Аудирование
    instruction: Пять покупателей говорят, что им нужно. Подберите к каждому картинку. Две картинки лишние.
    format: match
    bank:
      - маленький белый шкаф
      - большой белый шкаф
      - два зелёных стула
      - большой чёрный диван
      - маленький недорогой холодильник
      - большой дорогой холодильник
      - красная детская кровать
    items:
      - id: m1
        prompt: Γιάννης
        answer: маленький белый шкаф
        explanation: μία μικρή ντουλάπα… Άσπρη.
      - id: m2
        prompt: Μαρία
        answer: два зелёных стула
      - id: m3
        prompt: Κώστας
        answer: большой чёрный диван
        explanation: έναν μεγάλο καναπέ… μαύρο.
      - id: m4
        prompt: Ελένη
        answer: маленький недорогой холодильник
        explanation: ένα φτηνό ψυγείο. Μικρό…
      - id: m5
        prompt: Σάββας
        answer: красная детская кровать
        explanation: ένα κρεβάτι για το παιδί μου. Κόκκινο…
  - type: exercise
    id: plural-gap
    graded: true
    title: Множественное число
    instruction: Вставьте слово во множественном числе. Два слова лишние.
    format: gap
    bank:
      - φούρνοι
      - ντουλάπες
      - κλειδιά
      - ψυγεία
      - καναπέδες
      - χρώματα
      - καρέκλες
    items:
      - id: g1
        prompt: Τα ___ είναι πάνω στο τραπέζι. (ключи)
        answer: κλειδιά
      - id: g2
        prompt: Στην κουζίνα υπάρχουν δύο ___. (холодильника)
        answer: ψυγεία
      - id: g3
        prompt: Οι ___ στο σαλόνι είναι μεγάλοι. (диваны)
        answer: καναπέδες
      - id: g4
        prompt: Οι ___ στην κουζίνα είναι καινούργιοι. (духовки)
        answer: φούρνοι
      - id: g5
        prompt: Οι ___ στο υπνοδωμάτιο είναι άσπρες. (шкафы)
        answer: ντουλάπες
  - type: exercise
    id: agree-choice
    graded: true
    title: Согласование
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Το κρεβάτι είναι ___.
        options:
          - μικρός
          - μικρή
          - μικρό
        answer: μικρό
        explanation: Το κρεβάτι — средний род.
      - id: q2
        prompt: Η ντουλάπα είναι ___.
        options:
          - παλιός
          - παλιά
          - παλιό
        answer: παλιά
        explanation: Η ντουλάπα — женский род; у παλιός в женском роде -α.
      - id: q3
        prompt: Οι καρέκλες είναι ___.
        options:
          - κόκκινοι
          - κόκκινες
          - κόκκινα
        answer: κόκκινες
      - id: q4
        prompt: Τα παράθυρα είναι ___.
        options:
          - καθαροί
          - καθαρές
          - καθαρά
        answer: καθαρά
      - id: q5
        prompt: Ο φούρνος είναι ___.
        options:
          - χαλασμένος
          - χαλασμένη
          - χαλασμένο
        answer: χαλασμένος
      - id: q6
        prompt: Η κουζίνα είναι μικρή αλλά ___.
        options:
          - ωραίος
          - ωραία
          - ωραίο
        answer: ωραία
  - type: exercise
    id: aftos-dikos
    graded: true
    title: Этот, тот, чей
    instruction: Вставьте слово.
    format: gap
    bank:
      - αυτός
      - αυτή
      - αυτό
      - αυτά
      - δικό
      - δική
      - Ποιανού
    items:
      - id: g1
        prompt: ___ ο καναπές είναι πολύ ακριβός.
        answer: αυτός
      - id: g2
        prompt: ___ τα κλειδιά είναι μαύρα.
        answer: αυτά
      - id: g3
        prompt: — ___ είναι αυτή η καρέκλα; — Είναι δική μου.
        answer: Ποιανού
      - id: g4
        prompt: — Ποιανού είναι αυτό το ξυπνητήρι; — Είναι ___ μου.
        answer: δικό
        explanation: "Το ξυπνητήρι — средний род: δικό μου."
      - id: g5
        prompt: ___ η ντουλάπα είναι καινούργια.
        answer: αυτή
      - id: g6
        prompt: — Ποιανού είναι η ντουλάπα; — Είναι ___ μου.
        answer: δική
  - type: exercise
    id: phrases-choice
    graded: true
    title: Фразы
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: — Τι χρώμα είναι το ψυγείο; —
        options:
          - Είναι άσπρο.
          - Είναι στην κουζίνα.
          - Είναι δικό μου.
        answer: Είναι άσπρο.
      - id: q2
        prompt: — Πώς είναι το δωμάτιό σου; —
        options:
          - Είναι δίπλα στο μπάνιο.
          - Είναι μικρό αλλά ωραίο.
          - Είναι δικό μου.
        answer: Είναι μικρό αλλά ωραίο.
        explanation: Πώς είναι…; — «какой?»; ответ — прилагательные.
      - id: q3
        prompt: Стиральная машина сломалась. Вы пишете хозяину квартиры.
        options:
          - Το πλυντήριο δεν δουλεύει.
          - Το πλυντήριο είναι καθαρό.
          - Πωλείται πλυντήριο.
        answer: Το πλυντήριο δεν δουλεύει.
      - id: q4
        prompt: Вы продаёте три стула. Как начать объявление?
        options:
          - Πωλείται τρεις καρέκλες.
          - Πωλούνται τρεις καρέκλες.
          - Πωλούνται τρία καρέκλες.
        answer: Πωλούνται τρεις καρέκλες.
        explanation: Вещей несколько — Πωλούνται; καρέκλα женского рода — τρεις.
      - id: q5
        prompt: Что значит «Αυτό είναι πολύ ακριβό»?
        options:
          - Это очень дорого.
          - Это очень дёшево.
          - Это очень красиво.
        answer: Это очень дорого.
