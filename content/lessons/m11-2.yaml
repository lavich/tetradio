  - type: exercise
    id: shop-phrases
    title: В магазине
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: "Продавец спрашивает: «Τι νούμερο φοράτε;» У вас тридцать восьмой размер."
        options:
          - Φοράω νούμερο τριάντα οκτώ.
          - Είμαι τριάντα οκτώ χρονών.
          - Κάνει τριάντα οκτώ ευρώ.
        answer: Φοράω νούμερο τριάντα οκτώ.
      - id: q2
        prompt: Вам нравится пиджак, и вы хотите его примерить.
        options:
          - Μπορώ να το δοκιμάσω;
          - Μπορώ να το επιστρέψω;
          - Έχετε την απόδειξη;
        answer: Μπορώ να το δοκιμάσω;
      - id: q3
        prompt: Вы с брюками в руках ищете, где их примерить.
        options:
          - Πού είναι το δοκιμαστήριο;
          - Πού είναι το ταμείο;
          - Πού είναι η κουζίνα;
        answer: Πού είναι το δοκιμαστήριο;
      - id: q4
        prompt: Брюки вам тесноваты. Что вы скажете продавцу?
        options:
          - Μου είναι λίγο στενό. Το έχετε σε πιο μεγάλο νούμερο;
          - Μου είναι λίγο φαρδύ. Το έχετε σε πιο μικρό νούμερο;
          - Σου πάει πολύ!
        answer: Μου είναι λίγο στενό. Το έχετε σε πιο μεγάλο νούμερο;
      - id: q5
        prompt: Дома вы поняли, что платье не того цвета, и хотите взять другое.
        options:
          - Θα ήθελα να το αλλάξω.
          - Μπορώ να το δοκιμάσω;
          - Ποιο σας αρέσει περισσότερο;
        answer: Θα ήθελα να το αλλάξω.
      - id: q6
        prompt: Вы продавец. Покупатель хочет вернуть рубашку. Что вы спросите?
        options:
          - Έχετε την απόδειξη;
          - Τι χρώμα είναι;
          - Πού είναι το δοκιμαστήριο;
        answer: Έχετε την απόδειξη;
  - type: exercise
    id: pio-gap
    title: Больше, меньше, дешевле
    instruction: Вставьте подходящее сочетание. Два лишние.
    format: gap
    bank:
      - πιο φτηνό
      - πιο μεγάλο
      - πιο μικρό
      - πιο ελαφρύ
      - πιο σκούρο
      - πιο ακριβό
      - πιο βαρύ
    items:
      - id: g1
        prompt: Αυτό το σακάκι κοστίζει διακόσια ευρώ. Έχετε κάτι ___;
        answer: πιο φτηνό
      - id: g2
        prompt: Το τριάντα οκτώ μου είναι στενό. Το έχετε σε ___ νούμερο;
        answer: πιο μεγάλο
      - id: g3
        prompt: Το παντελόνι μου είναι πολύ φαρδύ. Θέλω ένα ___ νούμερο.
        answer: πιο μικρό
      - id: g4
        prompt: Το παλτό είναι πολύ βαρύ. Έχετε ένα ___ μπουφάν;
        answer: πιο ελαφρύ
      - id: g5
        prompt: Δεν μου αρέσει το ανοιχτό μπλε. Το έχετε σε ___ μπλε;
        answer: πιο σκούρο
        explanation: Противоположность ανοιχτό (светлый) — σκούρο (тёмный).
  - type: exercise
    id: pio-meaning
    title: Что это значит
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Το μαύρο φόρεμα είναι πιο ακριβό από το κόκκινο.
        options:
          - Чёрное платье дороже красного.
          - Красное платье дороже чёрного.
          - Чёрное и красное платья стоят одинаково.
        answer: Чёрное платье дороже красного.
        explanation: "πιο ακριβό από το κόκκινο — «дороже, чем красное»."
      - id: q2
        prompt: Η μπλε φούστα είναι πιο μακριά από την άσπρη.
        options:
          - Синяя юбка длиннее белой.
          - Белая юбка длиннее синей.
          - Синяя юбка короче белой.
        answer: Синяя юбка длиннее белой.
      - id: q3
        prompt: ___ φόρεμα σου αρέσει;
        options:
          - Ποιο
          - Πιο
        answer: Ποιο
        explanation: Вопрос «какое?» перед существительным — ποιο.
      - id: q4
        prompt: Αυτό το φόρεμα είναι ___ ωραίο.
        options:
          - ποιο
          - πιο
        answer: πιο
        explanation: «Более» перед прилагательным — πιο.
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Какой у вас размер?
        answer:
          - Τι νούμερο φοράτε;
      - id: q2
        prompt: Можно это примерить?
        answer:
          - Μπορώ να το δοκιμάσω;
      - id: q3
        prompt: Эти туфли очень удобные.
        answer:
          - Αυτά τα παπούτσια είναι πολύ άνετα.
          - Τα παπούτσια είναι πολύ άνετα.
        explanation: "τα παπούτσια — средний род, мн. ч.: άνετα."
      - id: q4
        prompt: У вас есть чек?
        answer:
          - Έχετε την απόδειξη;
          - Έχετε απόδειξη;
  - type: explanation
    id: rules-how
    title: Как читать правила магазина
    body: |-
      В правилах обмена и возврата ищите четыре вещи: **сколько дней** (μέσα σε… ημέρες), **что нужно** (την απόδειξη, την ετικέτα), **что нельзя** (δεν, όχι, μόνο) и **когда открыт магазин**.

      В задании «верно или неверно» будьте внимательны к словам **μόνο** (только) и **χωρίς** (без): одно слово меняет смысл всего предложения. Считайте дни: δεκατέσσερις ημέρες — это δύο εβδομάδες.
  - type: reading
    id: rules
    title: Αλλαγές και επιστροφές
    text: |-
      Κατάστημα ρούχων «Η μπλε πόρτα» — Λάρνακα

      Αλλαγές και επιστροφές

      Θέλετε να αλλάξετε ένα ρούχο; Δεν σας κάνει το νούμερο ή δεν σας αρέσει το χρώμα; Κανένα πρόβλημα! Η αλλαγή γίνεται μέσα σε δεκατέσσερις ημέρες. Μπορείτε να πάρετε άλλο νούμερο, άλλο χρώμα ή ένα άλλο ρούχο.

      Επιστροφή χρημάτων γίνεται μέσα σε επτά ημέρες. Για αγορές με κάρτα τα χρήματα επιστρέφουν στην κάρτα σας.

      Για αλλαγή και για επιστροφή χρειάζεστε πάντα την απόδειξη. Τα ρούχα πρέπει να είναι καθαρά και με την ετικέτα τους.

      Ρούχα σε έκπτωση: μόνο αλλαγή, όχι επιστροφή χρημάτων.
      Παπούτσια: αλλαγή μόνο αν είναι καθαρά και στο κουτί τους.
      Δεν κάνουμε αλλαγή σε εσώρουχα, κάλτσες και μαγιό.

      Ώρες: Δευτέρα–Σάββατο 9:00–20:00, Κυριακή κλειστά.
    glosses:
      - text: Κατάστημα
        russian: магазин (официальное слово)
      - text: Θέλετε να αλλάξετε
        russian: хотите обменять
      - text: Δεν σας κάνει
        russian: вам не подходит (по размеру)
      - text: Κανένα πρόβλημα
        russian: никаких проблем
      - text: γίνεται
        russian: делается, возможна
      - text: μέσα σε
        russian: в течение
      - text: ημέρες
        russian: дней (= μέρες)
      - text: Μπορείτε να πάρετε
        russian: вы можете взять
      - text: χρημάτων
        russian: денег
      - text: αγορές
        russian: покупок
      - text: τα χρήματα
        russian: деньги
      - text: επιστρέφουν
        russian: возвращаются
      - text: χρειάζεστε
        russian: вам нужна
      - text: ετικέτα
        russian: этикетка, бирка
      - text: τους
        russian: свой (дословно «их»)
      - text: εσώρουχα
        russian: нижнее бельё
      - text: μαγιό
        russian: купальник, плавки
      - text: κλειστά
        russian: закрыто
  - type: exercise
    id: rules-tf
    about: rules
    title: Верно или неверно
    instruction: Прочитайте правила магазина. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η αλλαγή γίνεται μέσα σε δύο εβδομάδες.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Δεκατέσσερις ημέρες — это две недели.
      - id: q2
        prompt: Επιστροφή χρημάτων γίνεται μέσα σε δεκατέσσερις ημέρες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Деньги возвращают только в течение семи дней (επτά ημέρες); четырнадцать дней — срок обмена.
      - id: q3
        prompt: Χωρίς απόδειξη μπορείτε να αλλάξετε ένα ρούχο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Χρειάζεστε πάντα την απόδειξη — чек нужен всегда.
      - id: q4
        prompt: Αν πληρώνετε με κάρτα, τα χρήματα επιστρέφουν σε μετρητά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τα χρήματα επιστρέφουν στην κάρτα σας — деньги возвращаются на карту.
      - id: q5
        prompt: Για ένα φόρεμα σε έκπτωση δεν υπάρχει επιστροφή χρημάτων.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Ρούχα σε έκπτωση: μόνο αλλαγή — вещи со скидкой можно только обменять."
      - id: q6
        prompt: Μπορείτε να αλλάξετε κάλτσες.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν κάνουμε αλλαγή σε … κάλτσες.
      - id: q7
        prompt: Το κατάστημα είναι ανοιχτό την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κυριακή κλειστά — в воскресенье закрыто.
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Диалог в магазине одежды звучит два раза. В первый раз поймите, что ищет покупательница. Перед вторым прослушиванием прочитайте вопросы.

      Записывайте цифры — размер и цены: в конце нужно будет посчитать сумму. Будьте внимательны к ловушкам: вещь может не подойти, и покупательница возьмёт другой размер или другой цвет.
  - type: listening
    id: shop
    title: Στο μαγαζί με τα ρούχα
    plays: 2
    transcript:
      - speaker: Πέτρος
        text: Καλημέρα σας! Τι ψάχνετε;
      - speaker: Δέσποινα
        text: Καλημέρα. Ψάχνω ένα παντελόνι για τη δουλειά, μαύρο ή γκρι.
      - speaker: Πέτρος
        text: Τι νούμερο φοράτε;
      - speaker: Δέσποινα
        text: Φοράω νούμερο τριάντα οκτώ.
      - speaker: Πέτρος
        text: Έχουμε αυτό το μαύρο παντελόνι. Είναι πολύ άνετο και κοστίζει σαράντα πέντε ευρώ. Και αυτό το γκρι είναι πιο φτηνό, τριάντα ευρώ.
      - speaker: Δέσποινα
        text: Μου αρέσει πιο πολύ το μαύρο. Μπορώ να το δοκιμάσω;
      - speaker: Πέτρος
        text: Ναι, το δοκιμαστήριο είναι εκεί, δίπλα στο ταμείο.
      - speaker: Δέσποινα
        text: Ευχαριστώ.
      - speaker: Πέτρος
        text: Πώς είναι;
      - speaker: Δέσποινα
        text: Μου είναι λίγο στενό. Το έχετε σε πιο μεγάλο νούμερο;
      - speaker: Πέτρος
        text: Ναι, σε σαράντα. Ορίστε.
      - speaker: Δέσποινα
        text: Αυτό είναι πολύ καλό. Θέλω και ένα πουκάμισο.
      - speaker: Πέτρος
        text: Αυτό το άσπρο πουκάμισο είναι πολύ ελαφρύ. Κοστίζει είκοσι ευρώ.
      - speaker: Δέσποινα
