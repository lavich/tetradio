blocks:
  - type: explanation
    id: sizes
    title: Обувь и размер
    body: |-
      **Τα παπούτσια** — «обувь», а **το παπούτσι** — один ботинок или туфля. Ещё: **οι μπότες** — сапоги, **τα σανδάλια** — сандалии, **οι κάλτσες** — носки. Обувь почти всегда во множественном числе: Τα παπούτσια μου είναι καινούργια.

      Размер в магазине — **το νούμερο**, и для одежды, и для обуви. Продавец спросит: **Τι νούμερο φοράτε;** — «Какой у вас размер?», дословно «Какой номер вы носите?». Ответ: **Φοράω νούμερο τριάντα οκτώ.** — «Я ношу тридцать восьмой». Можно короче: Φοράω τριάντα οκτώ. Размеры одежды пишут и буквами — S, M, L, XL — и читают их по-английски.

      **Το μέγεθος** — тоже «размер», но это слово для этикеток, сайтов и правил магазина: Μέγεθος: M. Множественное число неправильное — **τα μεγέθη**.

      Когда вещь не подходит: **Μου είναι λίγο στενό.** — «Мне немного тесно». Μου здесь — «мне», как в μου αρέσει. Прилагательное — в роде вещи: το παντελόνι μου είναι στενό, η φούστα μου είναι στενή, τα παπούτσια μου είναι στενά. Так же: Μου είναι μεγάλο / μικρό / φαρδύ.

      **Άνετος** — «удобный, свободный»: Τα σανδάλια είναι πολύ άνετα.
  - type: explanation
    id: pio
    title: Πιο + прилагательное — «более»
    body: |-
      Чтобы сказать «больше, меньше, дешевле, шире», по-гречески ставят **πιο** перед обычным прилагательным: **πιο μεγάλο** — больше, **πιο μικρό** — меньше, **πιο φτηνό** — дешевле, **πιο φαρδύ** — шире, **πιο σκούρο** — темнее.

      **Το έχετε σε πιο μεγάλο νούμερο;** — «Есть на размер больше?», дословно «Есть это в более большом номере?». Прилагательное стоит в роде вещи: μια πιο φτηνή φούστα, ένα πιο ελαφρύ μπουφάν.

      С чем сравнивают — после **από** в винительном падеже: Το μαύρο φόρεμα είναι **πιο ακριβό από** το κόκκινο. — «Чёрное платье дороже, чем красное». Пока эти фразы достаточно понимать; подробно сравнение — в модуле 20.

      **Πιο или ποιο?** Звучат одинаково — [пьо]. **Ποιο** — вопрос «какое?» перед существительным: Ποιο φόρεμα; **Πιο** — «более» перед прилагательным: πιο ωραίο.
  - type: explanation
    id: fitting
    title: Примерка, обмен, возврат
    body: |-
      **Δοκιμάζω** — «примерять», а о еде — «пробовать». **Μπορώ να το δοκιμάσω;** — «Можно это примерить?». **Πού είναι το δοκιμαστήριο;** — «Где примерочная?».

      **Θα ήθελα να το αλλάξω.** — «Я бы хотел(а) это обменять» (θα ήθελα — модуль 09). **Μπορώ να το επιστρέψω;** — «Можно это вернуть?». Продавец спросит: **Έχετε την απόδειξη;** — «У вас есть чек?».

      В этих фразах **το** — «это, его». Так говорят о вещи среднего рода (το παντελόνι, το φόρεμα) или о покупке вообще. Формы δοκιμάσω, αλλάξω, επιστρέψω после να вы разберёте в модуле 16; пока учите фразы целиком.

      Слова правил магазина: **η αλλαγή** — обмен, **αλλάζω** — менять, обменивать; **η επιστροφή** — возврат, **επιστρέφω** — возвращать, а также возвращаться (о деньгах или человеке); **επιστροφή χρημάτων** — возврат денег (τα χρήματα — официальное слово для τα λεφτά).

      **Η αλλαγή γίνεται μέσα σε δεκατέσσερις ημέρες.** — «Обмен возможен в течение четырнадцати дней». Γίνεται — «делается, происходит», μέσα σε — «в течение». **Η ημέρα** — официальная форма слова η μέρα; в правилах и объявлениях пишут ημέρες.
    table:
      columns:
        - кто
        - фраза
        - по-русски
      rows:
        - - продавец
          - Τι νούμερο φοράτε;
          - Какой у вас размер?
        - - покупатель
          - Μπορώ να το δοκιμάσω;
