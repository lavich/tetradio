blocks:
  - type: explanation
    id: quality-words
    title: Слова урока — качества системы, ограничения, данные
    body: |-
      Тексты урока описывают сервис уведомлений и разговор, в котором техническому специалисту ставят задачу. Слова урока образуют три группы.

      **Качества системы.** **Availability** — доступность: доля времени, когда система работает и отвечает. **Consistency** — согласованность: все читающие видят одни и те же актуальные данные. **Durability** — сохранность: записанные данные не пропадают при сбое. **Fault tolerance** — отказоустойчивость: система продолжает работать, когда отказала её часть. **Stale data** — устаревшие данные: значение уже изменилось, а пользователь видит прежнее.

      **Нагрузка и данные.** **Capacity planning** — расчёт ресурсов под ожидаемый рост нагрузки. **Real-time** — с задержкой в секунды или меньше; **batch processing** — данные накапливают и обрабатывают порциями. **Multi-tenant** — один экземпляр сервиса обслуживает многих клиентов, а их данные разделены. **A user base** — все, кто пользуется продуктом. **A source of truth** — одно место, данные которого считают верными. **Resource-intensive** — ресурсоёмкий.

      **Ограничения и обязательное.** **A hard limit** — число, которое нельзя превысить. **Table stakes** — обязательный минимум, без которого продукт не рассматривают. **A turnaround time** — время от начала до результата. **Backward compatible** — новая версия работает с тем, что создано для старой. **Compliance** — соответствие требованиям закона и стандартов.
