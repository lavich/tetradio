  - type: exercise
    id: na-build
    title: Форма после να
    instruction: Напишите форму глагола после να — от основы аориста, в нужном лице. Можно писать с να или без.
    format: text
    items:
      - id: q1
        prompt: Σήμερα πρέπει να ___ τις ασκήσεις. (εγώ · γράφω)
        answer:
          - γράψω
          - να γράψω
        explanation: έγραψα → γραψ- + -ω.
      - id: q2
        prompt: Θέλεις να ___ τον δάσκαλο; (ρωτάω)
        answer:
          - ρωτήσεις
          - να ρωτήσεις
        explanation: ρώτησα → ρωτησ- + -εις. Ударение на последнем слоге основы.
      - id: q3
        prompt: Μπορείτε να ___ αυτή τη λέξη, παρακαλώ; (εξηγώ)
        answer:
          - εξηγήσετε
          - να εξηγήσετε
        explanation: εξήγησα → εξηγησ- + -ετε.
      - id: q4
        prompt: Θέλουμε να ___ καλά ελληνικά. (μαθαίνω)
        answer:
          - μάθουμε
          - να μάθουμε
        explanation: "Неправильный аорист: έμαθα → να μάθω, να μάθουμε."
      - id: q5
        prompt: Η Άννα θέλει να ___ το βιβλίο στα ρωσικά. (μεταφράζω)
        answer:
          - μεταφράσει
          - να μεταφράσει
      - id: q6
        prompt: Δεν μπορώ να ___ αυτή τη λέξη! (θυμάμαι)
        answer:
          - θυμηθώ
          - να θυμηθώ
        explanation: Глагол на -μαι — окончание с ударением -ώ.
      - id: q7
        prompt: Αύριο πρέπει να ___ στις έξι. (εγώ · ξυπνάω)
        answer:
          - ξυπνήσω
          - να ξυπνήσω
      - id: q8
        prompt: Τα παιδιά πρέπει να ___ στις ερωτήσεις. (απαντάω)
        answer:
          - απαντήσουν
          - να απαντήσουν
        explanation: "Τα παιδιά — «они»: -ουν. Πρέπει не меняется, лицо показывает второй глагол."
  - type: exercise
    id: irregular-match
    title: Неправильные формы
    instruction: Соедините аорист с формой после να. Два варианта лишние.
    format: match
    bank:
      - να πάω
      - να έρθω
      - να δω
      - να πω
      - να φάω
      - να πιω
      - να βρω
      - να πάρω
      - να μάθω
    items:
      - id: m1
        prompt: πήγα
        answer: να πάω
      - id: m2
        prompt: ήρθα
        answer: να έρθω
      - id: m3
        prompt: είδα
        answer: να δω
        explanation: είδα — аорист от βλέπω.
      - id: m4
        prompt: είπα
        answer: να πω
        explanation: είπα — аорист от λέω.
      - id: m5
        prompt: έφαγα
        answer: να φάω
      - id: m6
        prompt: ήπια
        answer: να πιω
      - id: m7
        prompt: βρήκα
        answer: να βρω
  - type: explanation
    id: modals
    title: Θέλω, μπορώ, πρέπει, ξέρω, προσπαθώ + να
    body: |-
      **Θέλω να** — хочу; **μπορώ να** — могу, можно; **πρέπει να** — надо, нужно, должен; **ξέρω να** — умею; **προσπαθώ να** — стараюсь, пытаюсь.

      Θέλω, μπορώ, ξέρω и προσπαθώ изменяются по лицам. Προσπαθώ спрягается как μπορώ: προσπαθώ, προσπαθείς, προσπαθεί, προσπαθούμε, προσπαθείτε, προσπαθούν.

      **Πρέπει не изменяется никогда**: πρέπει να μάθω — «мне надо выучить», πρέπει να μάθεις — «тебе надо», πρέπει να μάθουμε — «нам надо». Кто должен, показывает второй глагол. Форм «πρέπω», «πρέπουμε» нет.

      **Ξέρω να** — «умею». Умение — не одно действие, поэтому после ξέρω να обычно стоит настоящее время: Ξέρω να κολυμπάω. Ξέρεις να οδηγείς; Сравните: Ξέρω ελληνικά — «знаю греческий», Ξέρω να γράφω στα ελληνικά — «умею писать по-гречески».

      **Μπορώ να** — и «могу», и вежливое «можно?»: Μπορώ να ρωτήσω κάτι; — «Можно спросить?» Μπορείτε να μου εξηγήσετε; — «Можете мне объяснить?» Короткие слова μου, σου, το стоят между να и глаголом: Μπορείτε **να το** επαναλάβετε;

      **Отрицание.** Δεν ставится перед первым глаголом: **Δεν** μπορώ να έρθω αύριο. **Δεν** πρέπει να ξεχάσεις. Если отрицается второй глагол, после να стоит **μην**: Προσπαθώ **να μην** κάνω λάθη — «Стараюсь не делать ошибок».
    table:
      columns:
        - глагол
        - пример
        - перевод
      rows:
        - - θέλω να
          - Θέλω να μάθω ελληνικά.
          - Я хочу выучить греческий.
        - - μπορώ να
          - Μπορείτε να το επαναλάβετε;
          - Можете повторить?
        - - πρέπει να
          - Πρέπει να μάθω ελληνικά για τη δουλειά μου.
          - Мне нужно выучить греческий для работы.
        - - ξέρω να
          - Ξέρω να μαγειρεύω.
          - Я умею готовить.
        - - προσπαθώ να
          - Προσπαθώ να μιλάω ελληνικά κάθε μέρα.
          - Я стараюсь говорить по-гречески каждый день.
        - - μου αρέσει να
          - Μου αρέσει να διαβάζω.
          - Я люблю читать.
  - type: exercise
    id: modal-choice
    title: Первый глагол
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Εσύ ___ να έρθεις αύριο;
        options:
          - μπορείς
          - μπορώ
          - μπορεί
        answer: μπορείς
      - id: q2
        prompt: Εμείς ___ να διαβάσουμε αυτό το βιβλίο.
        options:
          - πρέπει
          - πρέπουμε
          - πρέπεις
        answer: πρέπει
        explanation: Πρέπει не изменяется по лицам. «Мы» видно по второму глаголу — διαβάσουμε.
      - id: q3
        prompt: Η Ελένη ___ να οδηγεί;
        options:
          - ξέρει
          - ξέρεις
          - ξέρουν
        answer: ξέρει
      - id: q4
        prompt: Τα παιδιά ___ να μάθουν αγγλικά.
        options:
          - θέλουν
          - θέλει
          - θέλουμε
        answer: θέλουν
      - id: q5
        prompt: Εγώ ___ να μην κάνω λάθη.
        options:
          - προσπαθώ
          - προσπαθεί
          - προσπαθούν
        answer: προσπαθώ
      - id: q6
        prompt: Πρέπει ___ τον δάσκαλο.
        options:
          - να ρωτήσουμε
          - ρωτήσουμε
          - να ρωτήσαμε
        answer: να ρωτήσουμε
        explanation: Без να нельзя; после να не бывает прошедших окончаний (ρωτήσαμε — аорист).
  - type: exercise
    id: aspect
    title: Один раз или повтор
    instruction: Выберите форму. Ищите подсказку — слова повтора, привычка, умение или одно конкретное действие.
    format: choice
    items:
      - id: q1
        prompt: Κάθε μέρα προσπαθώ να ___ δέκα λέξεις.
        options:
          - μαθαίνω
          - μάθω
        answer: μαθαίνω
        explanation: Κάθε μέρα — повтор, поэтому настоящее время.
      - id: q2
        prompt: Αύριο έχω μάθημα. Σήμερα πρέπει να ___ όλη τη γραμματική.
        options:
          - επαναλαμβάνω
          - επαναλάβω
        answer: επαναλάβω
        explanation: Одно действие сегодня, до результата — форма от аориста.
      - id: q3
        prompt: Ξέρεις να ___;
        options:
          - μαγειρεύεις
          - μαγειρέψεις
        answer: μαγειρεύεις
        explanation: Ξέρω να — умение, после него настоящее время.
      - id: q4
        prompt: Μπορείς να μου ___ αυτή τη λέξη τώρα;
        options:
          - εξηγείς
          - εξηγήσεις
        answer: εξηγήσεις
      - id: q5
        prompt: Μου αρέσει να ___ βιβλία στα ελληνικά.
        options:
          - διαβάζω
          - διαβάσω
        answer: διαβάζω
        explanation: Μου αρέσει να — то, что вы любите делать вообще, поэтому настоящее время.
      - id: q6
        prompt: Μετά το μάθημα θέλω να ___ τον δάσκαλο για την άσκηση.
        options:
          - ρωτάω
          - ρωτήσω
        answer: ρωτήσω
      - id: q7
        prompt: Πρέπει να ___ ελληνικά συχνά, όχι μόνο στο μάθημα.
        options:
          - μιλάς
          - μιλήσεις
        answer: μιλάς
        explanation: Συχνά — повтор.
  - type: explanation
    id: class-words
    title: На занятии
    body: |-
      **«Учиться» — по-разному.** Русское «учить, учиться» переводится тремя глаголами. **Μαθαίνω** — учить, изучать язык, слова, что-то новое: Μαθαίνω ελληνικά. **Σπουδάζω** — учиться в вузе, изучать специальность: Σπούδασα στη Μόσχα — «Я училась (в университете) в Москве». **Διαβάζω** — читать, а также делать уроки, заниматься дома (модуль 05): Διαβάζω για το μάθημα.

      **Спросить и ответить.** Ρωτάω кого? — винительный падеж: ρωτάω **τον** δάσκαλο. Κάνω μια ερώτηση — «задаю вопрос». Απαντάω **σε** + вин. п.: απαντάω **στην** ερώτηση, απαντάω **στη** Μαρία. Оба глагола спрягаются как μιλάω: ρωτάς, ρωτάει; απαντάς, απαντάει. **Ξεχνάω** — «забываю» — тоже: ξεχνάς, ξεχνάει.

      **Εξηγώ** — «объясняю» — спрягается как μπορώ: εξηγείς, εξηγεί. **Θυμάμαι** — «помню, вспоминаю» — как κοιμάμαι (модуль 05): θυμάσαι, θυμάται. **Μεταφράζω** από τα ρωσικά **στα** ελληνικά — «перевожу с русского на греческий».

      **Το λάθος** — «ошибка» — среднего рода, с особым мн. ч.: **τα λάθη**. Κάνω λάθη — «делаю ошибки». **Το βιβλίο** — и книга, и учебник. **Η προφορά** — произношение, а также акцент. Слова на -ση, -ξη во мн. ч. получают -εις (модуль 07): η λέξη → οι λέξεις.

      Фразы на занятии: **Τι σημαίνει αυτή η λέξη;** — «Что значит это слово?» **Πώς το λένε αυτό στα ελληνικά;** — «Как это называется по-гречески?», буквально «как это говорят». Похожие фразы вы знаете с модуля 02: Τι σημαίνει αυτό; Πώς λέγεται αυτό στα ελληνικά;
    table:
      columns:
        - ед. ч.
        - мн. ч.
      rows:
        - - η λέξη
          - οι λέξεις
        - - η άσκηση
          - οι ασκήσεις
        - - η ερώτηση
          - οι ερωτήσεις
        - - η απάντηση
          - οι απαντήσεις
        - - το μάθημα
          - τα μαθήματα
        - - το λάθος
          - τα λάθη
        - - το λεξικό
          - τα λεξικά
