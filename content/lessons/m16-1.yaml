  - type: explanation
    id: na-forms
    title: Как построить форму после να
    body: |-
      Возьмите аорист (модули 14–15), уберите приращение — начальное έ- — и поставьте окончания настоящего времени: -ω, -εις, -ει, -ουμε, -ετε, -ουν. Прошедших окончаний -α, -ες, -ε после να не бывает.

      έγραψα → γραψ- → να **γράψω**; διάβασα → να **διαβάσω**; ρώτησα → να **ρωτήσω**; μετάφρασα → να **μεταφράσω**; ξέχασα → να **ξεχάσω**.

      У **επαναλαμβάνω** приращение стоит внутри слова: επα**νέ**λαβα → να **επαναλάβω**. Отсюда фраза Μπορείτε να το **επαναλάβετε**; — «Можете повторить?»

      **Ударение** не уходит к началу слова, как в аористе: оно стоит на последнем слоге основы во всех лицах. Έγραψα, но να **γρά**ψω, να **γρά**ψουμε; μίλησα, но να μι**λή**σω, να μι**λή**σουμε.

      **Подсказка на карточках.** С модуля 02 у глаголов в карточках записано будущее: μαθαίνω — θα μάθω, γράφω — θα γράψω. Форма после θα — та же, что после να: θα μάθω → να μάθω. Будущее время подробно — в модуле 19, а пока берите форму с карточки.

      **Глаголы на -μαι** получают окончания с ударением -ώ, -είς, -εί, -ούμε, -είτε, -ούν: θυμάμαι → να **θυμηθώ**, κοιμάμαι → να **κοιμηθώ**, γράφομαι → να **γραφτώ**. Их форму тоже смотрите на карточке.
    table:
      columns:
        - лицо
        - γράφω
        - μιλάω
        - θυμάμαι
      rows:
        - - εγώ
          - να γράψω
          - να μιλήσω
          - να θυμηθώ
        - - εσύ
          - να γράψεις
          - να μιλήσεις
          - να θυμηθείς
