          - να μιλήσουν
          - να θυμηθούν
  - type: explanation
    id: irregular
    title: Неправильные глаголы после να
    body: |-
      У частотных глаголов своя основа — её легко узнать по аористу из модуля 15. Окончания обычные: να πάω, να πας, να πάει…; να έρθω, να έρθεις, να έρθει…

      У **δω, πω, πιω, βρω** ударение в формах «мы» и «вы» стоит на окончании: να δούμε, να δείτε; να πούμε, να πείτε; να πιούμε, να πιείτε; να βρούμε, να βρείτε. Остальные формы произносятся в один слог и пишутся без тоноса: να δω, να δεις, να πει, να πιεις, να βρουν.

      **Одна форма на всё.** У είμαι, έχω и ξέρω аориста нет, поэтому после να стоит обычная форма: Θέλω **να είμαι** εκεί στις δέκα. Πρέπει **να έχω** χρόνο. У κάνω форма после να совпадает с настоящим: να κάνω.
    table:
      columns:
