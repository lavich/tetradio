blocks:
  - type: explanation
    id: na-intro
    title: Να + глагол — две формы
    body: |-
      Когда после **θέλω**, **μπορώ** или **πρέπει** идёт второй глагол, между ними стоит **να**: Θέλω **να μάθω** ελληνικά. Μπορώ **να ρωτήσω** κάτι; Πρέπει **να διαβάσω** αυτό το βιβλίο.

      Инфинитива («учить», «выучить») в греческом нет. Его заменяет να и глагол в лице — обычно в том же, что и первый глагол: Θέλ**ω** να μάθ**ω** — «я хочу выучить», Θέλ**εις** να μάθ**εις** — «ты хочешь выучить», Θέλ**ουμε** να μάθ**ουμε** — «мы хотим выучить».

      Такие фразы вы уже учили целиком: Μπορώ να δω το σπίτι; (модуль 06), Τι σου αρέσει να τρως; (08), Μπορώ να το δοκιμάσω; (11), Πού πρέπει να κατέβω; (13), Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο (14). Теперь разберём, как они устроены.

      **Две формы после να.** В русском после «хочу, надо, могу» стоит глагол совершенного или несовершенного вида: «надо выучить эти слова» — одно действие до результата; «надо учить слова каждый день» — процесс, повтор. В греческом то же различие:

      — **форма от основы аориста** (подчинительное наклонение, η υποτακτική) — одно законченное действие, результат: Πρέπει **να μάθω** αυτές τις λέξεις. Αύριο θέλω **να ρωτήσω** τον δάσκαλο.

      — **форма настоящего времени** — процесс, привычка, повтор: Πρέπει **να διαβάζω** κάθε μέρα. Μου αρέσει **να μαθαίνω** γλώσσες.

      **Как выбрать.** Если в предложении есть κάθε μέρα, πάντα, συχνά, συνήθως или речь о привычке, умении, о том, что вы любите делать вообще, — настоящее время. Если действие одно и конкретное (сегодня, завтра, сейчас, эти слова, этот вопрос) — форма от аориста. Она встречается чаще.

      В модуле 05 была фраза Πρέπει να ξυπνάω νωρίς — «мне надо (каждый день) рано просыпаться»: это привычка, поэтому настоящее время. А «завтра мне надо проснуться в шесть» — Αύριο πρέπει **να ξυπνήσω** στις έξι.
