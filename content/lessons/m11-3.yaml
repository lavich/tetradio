title: Что я ношу — письмо, речь и повторение
kind: lesson
items:
  - kind: word
    id: w398 # το καπέλο
  - kind: word
    id: w399 # η ζώνη
  - kind: word
    id: w411 # ταιριάζω
  - kind: word
    id: w414 # βγάζω
  - kind: word
    id: w421 # ψηλός
  - kind: word
    id: w424 # ντύνομαι
blocks:
  - type: explanation
    id: dressing
    title: Одеваться, снимать, сочетаться
    body: |-
      **Ντύνομαι** — «одеваться». Спрягается как σηκώνομαι (модуль 05): Το πρωί σηκώνομαι, ντύνομαι και πίνω καφέ. Не путайте: **φοράω** + вещь — «ношу что-то» (Φοράω ένα πουλόβερ), а **ντύνομαι** — «одеваюсь» без дополнения.

      **Βγάζω** — «снимать (одежду, обувь)»: Στο σπίτι βγάζω τα παπούτσια. Похоже на βγαίνω (модуль 05), но βγαίνω — «выходить»: Βγαίνω από το σπίτι στις οκτώ.

      **Ταιριάζω** — «подходить, сочетаться». Обычно в 3-м лице и с **με** + винительный падеж: Η ζώνη **ταιριάζει με** τα παπούτσια. — «Ремень подходит к туфлям». Το μαύρο **ταιριάζει με** όλα. — «Чёрный подходит ко всему». Несколько вещей — ταιριάζουν.

      Ещё два слова: **το καπέλο** — шляпа или кепка, **η ζώνη** — ремень, пояс.

      О внешности: **ψηλός** — высокий, **κοντός** — невысокий (вы знаете его как «короткий» о вещах). Η Ελένη είναι ψηλή. Ο Νίκος είναι κοντός.
    table:
      columns:
        - лицо
        - ντύνομαι — одеваться
      rows:
        - - εγώ
          - ντύνομαι
        - - εσύ
          - ντύνεσαι
        - - αυτός, αυτή
          - ντύνεται
        - - εμείς
          - ντυνόμαστε
        - - εσείς
          - ντύνεστε
        - - αυτοί, αυτές
          - ντύνονται
  - type: vocabulary
    id: words
    title: Слова урока
  - type: exercise
    id: verbs-gap
    title: Φοράω, ντύνομαι, βγάζω, ταιριάζει
    instruction: Вставьте глагол. Два слова лишние.
    format: gap
    bank:
      - ντύνομαι
      - ντύνεται
      - βγάζω
      - βγαίνω
      - ταιριάζει
      - φοράω
      - φοράει
      - ντυνόμαστε
    items:
      - id: g1
        prompt: Στο σπίτι δεν φοράω παπούτσια. ___ τα παπούτσια μου στην πόρτα.
        answer: βγάζω
        explanation: Βγάζω — «снимаю»; βγαίνω — «выхожу», после него не бывает дополнения τα παπούτσια.
      - id: g2
        prompt: Το πρωί σηκώνομαι, ___ και πίνω καφέ.
        answer: ντύνομαι
      - id: g3
        prompt: Η μαύρη ζώνη ___ με τα μαύρα παπούτσια.
        answer: ταιριάζει
      - id: g4
        prompt: Σήμερα εγώ ___ ένα γκρι παντελόνι και ένα άσπρο πουκάμισο.
        answer: φοράω
      - id: g5
        prompt: Η Μαρία ___ ένα κόκκινο καπέλο.
        answer: φοράει
      - id: g6
        prompt: Ο Νίκος σηκώνεται, ___ και βγαίνει από το σπίτι.
        answer: ντύνεται
  - type: exercise
    id: appearance
    title: Высокий или невысокий
    instruction: Выберите форму прилагательного.
    format: choice
    items:
      - id: q1
        prompt: Η Ελένη είναι πολύ ___.
        options:
          - ψηλός
          - ψηλή
          - ψηλό
        answer: ψηλή
      - id: q2
        prompt: Ο αδελφός μου είναι ___.
        options:
          - κοντός
          - κοντή
          - κοντό
        answer: κοντός
      - id: q3
        prompt: Τα παιδιά της είναι ___.
        options:
          - ψηλοί
          - ψηλές
          - ψηλά
        answer: ψηλά
        explanation: "τα παιδιά — средний род, мн. ч.: ψηλά."
      - id: q4
        prompt: Αυτή η φούστα είναι πολύ ___.
        options:
          - κοντός
          - κοντή
          - κοντό
        answer: κοντή
        explanation: О вещи κοντός значит «короткий».
  - type: explanation
    id: writing-how
    title: Как написать «что я ношу»
    body: |-
      С этого модуля письмо растёт: теперь это **60–80 слов**. План из шести шагов: поздоровайтесь; что вы носите на работе или на учёбе; что носите дома или в выходные; что носите летом и зимой; какие цвета любите и чего не любите носить; задайте вопрос и попрощайтесь.

      Для погоды возьмите готовые выражения (подробно — в модуле 19): **το καλοκαίρι** — летом, **τον χειμώνα** — зимой, **κάνει κρύο** — холодно, **κάνει ζέστη** — жарко.

      Связывайте предложения: **και**, **αλλά**, **γιατί**, **συνήθως**, **πάντα**, **όταν**.

      Проверьте себя. Φοράω + винительный падеж: φοράω **ένα** τζιν, **τη** μαύρη φούστα. Прилагательное — в роде и числе вещи: άνετα ρούχα, μια φαρδιά μπλούζα, ένα βαρύ παλτό. Μπλε, γκρι, καφέ не изменяются. Брюки и джинсы — единственное число: ένα παντελόνι, ένα τζιν.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - на работе
          - Στη δουλειά φοράω συνήθως…
        - - дома
          - Στο σπίτι προτιμώ… γιατί είναι άνετο.
        - - летом и зимой
          - Το καλοκαίρι φοράω… Τον χειμώνα φοράω…
        - - цвета
          - Μου αρέσει το μαύρο. / Μου αρέσουν τα σκούρα χρώματα.
        - - чего не любите
          - Δεν μου αρέσουν τα στενά ρούχα.
        - - вопрос другу
          - Κι εσύ; Τι φοράς συνήθως;
  - type: writing
    id: what-i-wear
    register: friendly
    prompt: "Ваша подруга-гречанка Ирини пишет: «Τι ρούχα φοράς συνήθως; Τι χρώματα σου αρέσουν;» Ответьте ей сообщением 60–80 слов: что вы носите на работе или на учёбе и дома, что носите летом и зимой, какие цвета любите, чего не любите носить; задайте ей вопрос."
    words:
      min: 60
      max: 80
    model: Γεια σου, Ειρήνη! Στη δουλειά φοράω συνήθως ένα σκούρο παντελόνι και ένα άσπρο πουκάμισο. Στο σπίτι προτιμώ ένα τζιν και ένα φαρδύ μπλουζάκι, γιατί είναι πολύ άνετα. Το καλοκαίρι φοράω ελαφριά ρούχα και σανδάλια. Τον χειμώνα φοράω ένα βαρύ παλτό και μπότες, γιατί κάνει κρύο. Μου αρέσουν τα σκούρα χρώματα, το μαύρο και το γκρι, γιατί ταιριάζουν με όλα. Δεν μου αρέσουν τα στενά ρούχα. Κι εσύ; Τι φοράς συνήθως; Τα λέμε!
    criteria:
      - 60–80 слов; дружеское приветствие и прощание на «ты» (Γεια σου! … Τα λέμε!)
      - Сказано, что вы носите в двух разных ситуациях (на работе или учёбе, дома)
      - Сказано, что вы носите летом и зимой (το καλοκαίρι, τον χειμώνα)
      - Названы любимые цвета и то, чего вы не любите носить (μου αρέσει / δεν μου αρέσουν)
      - "После φοράω — винительный падеж (ένα τζιν, τη μαύρη φούστα); брюки и джинсы — в единственном числе"
      - "Прилагательные согласованы с вещью (ένα βαρύ παλτό, ελαφριά ρούχα, μια φαρδιά μπλούζα); μπλε, γκρι, καφέ не изменяются"
      - Есть вопрос подруге; предложения связаны (και, αλλά, γιατί); тонос в словах из двух и больше слогов
  - type: explanation
    id: speaking-how
    title: Как описать человека на фото
    body: |-
      Во второй части устного экзамена вас могут попросить описать фотографию (η φωτογραφία). Говорите около минуты, без подготовки.

      План: кто на фото (Στη φωτογραφία υπάρχουν…) → какой человек, высокий или невысокий → что на нём надето и какого цвета → что с чем сочетается, идёт ли ему → нравится ли вам.

      О другом человеке — 3-е лицо: **φοράει**, а не φοράω. О нескольких вещах — τα παπούτσια του **είναι** μαύρα. Если не знаете слова, скажите проще: не помните «пиджак» — скажите ένα σκούρο ρούχο.
    table:
      columns:
        - шаг
        - пример
      rows:
        - - кто на фото
          - Στη φωτογραφία υπάρχουν μια γυναίκα και ένας άντρας.
        - - какой человек
          - Η γυναίκα είναι ψηλή.
        - - что на нём
          - Φοράει ένα μακρύ φόρεμα και άσπρα σανδάλια.
        - - что сочетается
          - Το σακάκι ταιριάζει με το παντελόνι.
        - - ваше мнение
          - Το φόρεμα της πάει πολύ.
  - type: speaking
    id: photo
    part: monologue
    prompt: |-
      Представьте фотографию. На ней двое на улице. Слева — высокая женщина: длинное светло-синее платье, белые сандалии, большая шляпа. Справа — невысокий мужчина: тёмно-синий пиджак, белая рубашка, серые брюки, чёрные туфли.
      Экзаменатор говорит: «Περιγράψτε τη φωτογραφία.» — «Опишите фотографию». Опишите людей по-гречески: какого они роста, что на них надето, какого цвета одежда, идёт ли им. Говорите около минуты и запишите себя.
    seconds: 90
    model: Στη φωτογραφία υπάρχουν δύο άνθρωποι, μια γυναίκα και ένας άντρας. Η γυναίκα είναι ψηλή. Φοράει ένα μακρύ ανοιχτό μπλε φόρεμα και άσπρα σανδάλια. Φοράει και ένα μεγάλο καπέλο. Το φόρεμα είναι πολύ ωραίο και της πάει πολύ. Ο άντρας είναι κοντός. Φοράει ένα σκούρο μπλε σακάκι, ένα άσπρο πουκάμισο και ένα γκρι παντελόνι. Τα παπούτσια του είναι μαύρα. Το σακάκι ταιριάζει με το παντελόνι. Μου αρέσουν τα ρούχα τους.
    criteria:
      - Говорили около минуты, без долгих пауз
      - Описали обоих людей — рост и три-четыре вещи у каждого
      - "О другом человеке — φοράει (не φοράω), είναι ψηλή / κοντός"
      - "Цвета согласованы с вещью (άσπρα σανδάλια, τα παπούτσια είναι μαύρα); μπλε и γκρι не изменяются; σκούρο μπλε, ανοιχτό μπλε"
      - "Брюки — ένα παντελόνι (ед. ч.)"
      - Ударение на своём месте (φόρεμα, σανδάλια, παντελόνι, πουκάμισο)
  - type: speaking
    id: exchange
    part: roleplay
    prompt: |-
      Ролевая игра. Вы купили брюки, но дома поняли, что они вам тесные. Вы приходите в магазин с чеком. Экзаменатор — продавец. Прочитайте реплики продавца вслух и ответьте на каждую; запишите себя:
      «Καλημέρα σας! Τι θέλετε;» — «Έχετε την απόδειξη;» — «Γιατί θέλετε να το αλλάξετε;» — «Τι νούμερο φοράτε;» — «Θέλετε να το δοκιμάσετε;»
      (να το αλλάξετε — «его обменять», να το δοκιμάσετε — «его примерить».)
    seconds: 60
    model: Καλημέρα. Θα ήθελα να αλλάξω αυτό το παντελόνι. — Ναι, έχω την απόδειξη. Ορίστε. — Μου είναι λίγο στενό. Το έχετε σε πιο μεγάλο νούμερο; — Φοράω συνήθως σαράντα. — Ναι, ευχαριστώ. Πού είναι το δοκιμαστήριο;
    criteria:
      - Ответили на все пять реплик, вежливо, на «вы»
      - "Сказали, что хотите обменять вещь (Θα ήθελα να το αλλάξω / να αλλάξω αυτό το παντελόνι)"
      - "Объяснили причину (Μου είναι λίγο στενό) и попросили другой размер (Το έχετε σε πιο μεγάλο νούμερο;)"
      - "Назвали размер (Φοράω σαράντα) и спросили о примерочной"
  - type: exercise
    id: review-forms
    title: Повторение — формы
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Αυτή η μπλούζα είναι πολύ ___.
        options:
          - ελαφρύς
          - ελαφριά
          - ελαφρύ
        answer: ελαφριά
      - id: q2
        prompt: Τα παντελόνια είναι πολύ ___.
        options:
          - φαρδιοί
          - φαρδιές
          - φαρδιά
        answer: φαρδιά
      - id: q3
        prompt: Οι φούστες σου είναι ___.
        options:
          - μακριοί
          - μακριές
          - μακριά
        answer: μακριές
      - id: q4
        prompt: Μου αρέσουν ___ παπούτσια.
        options:
          - τα μαύρα
          - τα μαύρο
          - τα μαύρες
        answer: τα μαύρα
      - id: q5
        prompt: ___ παπούτσια θέλεις, τα μαύρα ή τα άσπρα;
        options:
          - Ποιοι
          - Ποιες
          - Ποια
        answer: Ποια
      - id: q6
        prompt: Το παλτό είναι ___ βαρύ από το μπουφάν.
        options:
          - πιο
          - ποιο
        answer: πιο
  - type: exercise
    id: review-match
    title: Повторение — фразы модуля
    instruction: Соедините русскую фразу с греческой. Две греческие фразы лишние.
    format: match
    bank:
      - Τι νούμερο φοράτε;
      - Πού είναι το δοκιμαστήριο;
      - Το έχετε σε άλλο χρώμα;
      - Σου πάει πολύ!
      - Μπορώ να το επιστρέψω;
      - Ποιο σας αρέσει περισσότερο;
      - Μπορώ να το δοκιμάσω;
      - Έχετε την απόδειξη;
    items:
      - id: m1
        prompt: Какой у вас размер?
        answer: Τι νούμερο φοράτε;
      - id: m2
        prompt: Где примерочная?
        answer: Πού είναι το δοκιμαστήριο;
      - id: m3
        prompt: Есть в другом цвете?
        answer: Το έχετε σε άλλο χρώμα;
      - id: m4
        prompt: Тебе очень идёт!
        answer: Σου πάει πολύ!
      - id: m5
        prompt: Можно это вернуть?
        answer: Μπορώ να το επιστρέψω;
      - id: m6
        prompt: Какой вам больше нравится?
        answer: Ποιο σας αρέσει περισσότερο;
  - type: exercise
    id: review-mixed
    title: Повторение — модули 08–10
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Θέλω ___ καφέ, παρακαλώ.
        options:
          - έναν
          - ένας
          - ένα
        answer: έναν
        explanation: "Θέλω + винительный падеж: έναν καφέ."
      - id: q2
        prompt: Δεν μου ___ τα καυτερά φαγητά.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσουν
      - id: q3
        prompt: Πόσο ___ τα σταφύλια;
        options:
          - κάνει
          - κάνουν
        answer: κάνουν
        explanation: τα σταφύλια — мн. ч., поэтому κάνουν.
      - id: q4
        prompt: Ένα κιλό ___, παρακαλώ.
        options:
          - ντομάτες
          - ντομάτα
          - ντομάτας
        answer: ντομάτες
        explanation: После ένα κιλό — существительное во мн. ч. без предлога.
      - id: q5
        prompt: Πληρώνετε με κάρτα ή ___;
        options:
          - μετρητά
          - ρέστα
          - ψιλά
        answer: μετρητά
      - id: q6
        prompt: Τον ___, παρακαλώ.
        options:
          - λογαριασμό
          - λογαριασμός
          - λογαριασμοί
        answer: λογαριασμό
        explanation: Τον λογαριασμό — винительный падеж, без ς.
