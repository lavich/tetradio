blocks:
  - type: explanation
    id: present-a
    title: Настоящее время, группа A
    body: |-
      Инфинитива в греческом нет. В словаре глагол стоит в форме «я»: **διαβάζω** — «я читаю», а переводим его «читать». Окончание само показывает лицо, поэтому местоимение обычно не говорят: **Διαβάζω.** — «Я читаю».

      Глаголы делятся на две группы. У группы **A** ударение стоит на основе, а форма «я» кончается на безударное **-ω**: γράφω, μένω, δουλεύω — вы уже знаете их из модуля 02. Основа и ударение не меняются, меняется только окончание: **-ω, -εις, -ει, -ουμε, -ετε, -ουν**.

      Окончания -εις и -ει читаются [ис] и [и]: διαβάζεις [ðйава́зис], διαβάζει [ðйава́зи]. В форме «они» в разговоре часто добавляют -ε: διαβάζουν = διαβάζουνε — обе формы правильные.

      Одна форма настоящего времени переводится по-разному: **Διαβάζω.** — «Я читаю (сейчас)» и «Я читаю (обычно, каждый день)».
    table:
      columns:
        - лицо
        - окончание
        - διαβάζω — читать
        - περιμένω — ждать
      rows:
        - - εγώ
          - -ω
          - διαβάζω
          - περιμένω
        - - εσύ
          - -εις
          - διαβάζεις
          - περιμένεις
        - - αυτός, αυτή, αυτό
          - -ει
          - διαβάζει
          - περιμένει
        - - εμείς
          - -ουμε
          - διαβάζουμε
          - περιμένουμε
        - - εσείς
          - -ετε
          - διαβάζετε
          - περιμένετε
        - - αυτοί, αυτές, αυτά
          - -ουν(ε)
          - διαβάζουν(ε)
          - περιμένουν(ε)
  - type: explanation
    id: akouo
    title: ακούω и λέω — основа на гласную
    body: |-
      Если основа кончается на гласную, окончания короче: у «ты», «мы», «вы» и «они» выпадает гласная окончания (-εις → -ς, -ουμε → -με, -ετε → -τε, -ουν → -ν), а форма «он/она» остаётся обычной: ακούει, λέει. Так спрягаются **ακούω** — «слушать, слышать» и знакомый вам **λέω** — «говорить». Отсюда и фраза **Με λένε Άννα** — дословно «Меня называют Анной».

      Сравните: διαβάζ**εις** — ακού**ς**, διαβάζ**ουμε** — ακού**με**.
    table:
      columns:
        - лицо
        - ακούω
        - λέω
      rows:
        - - εγώ
          - ακούω
          - λέω
        - - εσύ
          - ακούς
          - λες
        - - αυτός, αυτή
          - ακούει
          - λέει
        - - εμείς
          - ακούμε
          - λέμε
        - - εσείς
          - ακούτε
          - λέτε
        - - αυτοί, αυτές
          - ακούν(ε)
          - λένε
  - type: explanation
    id: present-b
    title: Настоящее время, группа B
    body: |-
      У группы **B** ударение стоит на окончании. Самый частый тип — глаголы на **-άω**: ξυπνάω [ксипна́о] — «просыпаться», αγαπάω — «любить», μιλάω — «говорить» (модуль 02). Окончания: **-άω, -άς, -άει, -άμε, -άτε, -άνε**. Во всех формах есть ударное **ά**.

      У формы «я» есть короткий вариант: ξυπνάω = **ξυπνώ**, αγαπάω = αγαπώ. У «он/она» — тоже: ξυπνάει = ξυπνά. У «они» — ξυπνάνε = **ξυπνούν**. Все варианты правильные, в разговоре чаще длинные.

      Второй тип группы B знаком вам по словам **μπορώ** — «могу», ευχαριστώ, παρακαλώ. Его окончания: **-ώ, -είς, -εί, -ούμε, -είτε, -ούν**. Выучите пока формы μπορώ — они нужны каждый день: Δεν μπορώ. Μπορείς;
    table:
      columns:
        - лицо
        - ξυπνάω
        - αγαπάω
        - μπορώ
      rows:
        - - εγώ
          - ξυπνάω (ξυπνώ)
          - αγαπάω (αγαπώ)
          - μπορώ
        - - εσύ
          - ξυπνάς
          - αγαπάς
          - μπορείς
        - - αυτός, αυτή
          - ξυπνάει (ξυπνά)
          - αγαπάει (αγαπά)
          - μπορεί
        - - εμείς
          - ξυπνάμε
          - αγαπάμε
          - μπορούμε
        - - εσείς
          - ξυπνάτε
          - αγαπάτε
          - μπορείτε
        - - αυτοί, αυτές
          - ξυπνάνε (ξυπνούν)
          - αγαπάνε (αγαπούν)
          - μπορούν(ε)
  - type: explanation
    id: which-group
    title: Как узнать группу
    body: |-
      Посмотрите на форму «я» в словаре. Ударение **на основе**, в конце безударное -ω — группа A: δια**βά**ζω, **βλέ**πω, περι**μέ**νω, α**κού**ω. Ударение **на окончании** (-άω, -ώ) — группа B: ξυπν**ά**ω, αγαπ**ά**ω, μπορ**ώ**.

      **Αρχίζω** — и «начинать», и «начинаться», **τελειώνω** — «заканчивать(ся)»: Αρχίζω στις εννέα. — «Я начинаю в девять». Το μάθημα αρχίζει στις εννέα. — «Урок начинается в девять».

      **Βλέπω** — «видеть» и «смотреть»: βλέπω τηλεόραση — «смотрю телевизор». **Περιμένω** — «жду»: Περιμένω τη Μαρία. (Кого ждём — с артиклем τη(ν), как после από и σε: από τη Ρωσία.)
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: a-forms
    title: Формы группы A
    instruction: Выберите форму глагола.
    format: choice
    items:
      - id: q1
        prompt: Εγώ ___ ελληνικά κάθε μέρα. (διαβάζω)
        options:
          - διαβάζω
          - διαβάζει
          - διαβάζουμε
        answer: διαβάζω
      - id: q2
        prompt: Εσύ ___ τηλεόραση το βράδυ; (βλέπω)
        options:
          - βλέπει
          - βλέπεις
          - βλέπετε
        answer: βλέπεις
        explanation: "Εσύ — «ты»: окончание -εις. Βλέπει — «он/она смотрит»."
      - id: q3
        prompt: Η Άννα ___ τον φίλο της. (περιμένω)
        options:
          - περιμένω
          - περιμένεις
          - περιμένει
        answer: περιμένει
      - id: q4
        prompt: Εμείς ___ στη Λεμεσό. (μένω)
        options:
          - μένουμε
          - μένετε
          - μένουν
        answer: μένουμε
        explanation: "Εμείς — «мы»: -ουμε. -ετε — это «вы»."
      - id: q6
        prompt: Τα παιδιά ___ μουσική. (ακούω; μουσική — музыка)
        options:
          - ακούνε
          - ακούει
          - ακούμε
        answer: ακούνε
        explanation: "Τα παιδιά — «дети», это «они»: ακούν или ακούνε."
  - type: exercise
    id: a-write
    title: Пишем формы группы A
    instruction: Напишите глагол в нужной форме.
    format: text
    items:
      - id: q1
        prompt: (εσύ) διαβάζω
        answer:
          - διαβάζεις
        explanation: Окончание -εις пишется через ει, в конце — ς.
      - id: q2
        prompt: (αυτός) βλέπω
        answer:
          - βλέπει
      - id: q3
        prompt: (εμείς) περιμένω
        answer:
          - περιμένουμε
      - id: q4
        prompt: (αυτοί) αρχίζω
        answer:
          - αρχίζουν
          - αρχίζουνε
      - id: q5
        prompt: (εσείς) διαβάζω
        answer:
          - διαβάζετε
        explanation: "«Вы» — окончание -ετε: διαβάζετε."
      - id: q6
        prompt: (εσύ) ακούω
        answer:
          - ακούς
        explanation: У ακούω окончания короче — ακούς, без ει.
  - type: exercise
    id: b-forms
    title: Формы группы B
    instruction: Вставьте форму глагола ξυπνάω — «просыпаться».
    format: gap
    bank:
      - ξυπνάω
      - ξυπνάς
      - ξυπνάει
      - ξυπνάμε
      - ξυπνάτε
      - ξυπνάνε
    items:
      - id: g1
        prompt: Εγώ ___ στις επτά.
        answer: ξυπνάω
      - id: g2
        prompt: Τι ώρα ___ εσύ;
        answer: ξυπνάς
      - id: g3
        prompt: Ο Κώστας ___ στις έξι.
        answer: ξυπνάει
      - id: g4
        prompt: Εμείς ___ νωρίς.
        answer: ξυπνάμε
      - id: g5
        prompt: Τι ώρα ___ εσείς, κυρία Ελένη;
        answer: ξυπνάτε
        explanation: Вежливое обращение — форма «вы».
      - id: g6
        prompt: Τα παιδιά ___ στις οκτώ.
        answer: ξυπνάνε
  - type: exercise
    id: mixed-write
    title: A или B
    instruction: Напишите глагол в нужной форме. Сначала решите, группа A это или B.
    format: text
    items:
      - id: q1
        prompt: (εσύ) αγαπάω
        answer:
          - αγαπάς
        explanation: Группа B — ударение на окончании; «ты» — -άς.
      - id: q2
        prompt: (αυτή) μιλάω
        answer:
          - μιλάει
          - μιλά
      - id: q3
        prompt: (εμείς) μπορώ
        answer:
          - μπορούμε
        explanation: У μπορώ свой тип окончаний — -ούμε, как у ευχαριστούμε.
      - id: q4
        prompt: (αυτός) τελειώνω
        answer:
          - τελειώνει
        explanation: Ударение на основе (τελειώνω, не на -ω) — группа A, окончание -ει.
      - id: q5
        prompt: (αυτοί) μιλάω
        answer:
          - μιλάνε
          - μιλούν
          - μιλούνε
      - id: q6
        prompt: (εσύ) μπορώ
        answer:
          - μπορείς
      - id: q7
        prompt: (εσείς) ξυπνάω
        answer:
          - ξυπνάτε
  - type: explanation
    id: frequency
    title: Отрицание и наречия частоты
    body: |-
      **Δεν** ставится прямо перед глаголом: **Δεν** διαβάζω. **Δεν** καταλαβαίνω. Вопрос с отрицанием — той же фразой с интонацией: Δεν μπορείς;

      Наречия частоты обычно стоят в начале предложения, перед глаголом или сразу после него — все варианты правильные: **Συνήθως** ξυπνάω στις επτά = Ξυπνάω **συνήθως** στις επτά. **Πάντα** διαβάζω το βράδυ.

      **Ποτέ** — «никогда» — требует δεν, как в русском «никогда **не**»: **Δεν** ξυπνάω **ποτέ** νωρίς. Можно начать и с ποτέ: Ποτέ δεν ξυπνάω νωρίς. Без δεν такое предложение — ошибка; а короткий ответ без глагола возможен: — Ξυπνάς νωρίς; — Ποτέ!

      **Κάθε** — «каждый» — не меняется: κάθε μέρα, κάθε πρωί, κάθε βράδυ, κάθε Σάββατο. Время дня — с артиклем, без предлога: **το πρωί** — «утром», **το απόγευμα** — «днём, после обеда», **το βράδυ** — «вечером». Час — **στις** + число, как в модуле 04: στις επτά, στις οκτώ και μισή. В примерах ниже **μουσική** — «музыка».
    table:
      columns:
        - наречие
        - перевод
        - пример
      rows:
        - - πάντα
          - всегда
          - Πάντα διαβάζω το βράδυ.
        - - συνήθως
          - обычно
          - Συνήθως ξυπνάω στις επτά.
        - - συχνά
          - часто
          - Συχνά βλέπω τηλεόραση.
        - - μερικές φορές
          - иногда
          - Μερικές φορές ακούω μουσική.
        - - δεν … ποτέ
          - никогда не
          - Δεν ξυπνάω ποτέ νωρίς.
        - - κάθε μέρα
          - каждый день
          - Κάθε μέρα διαβάζω ελληνικά.
  - type: exercise
    id: adverbs-match
    title: Как часто
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - πάντα
      - συνήθως
      - συχνά
      - μερικές φορές
      - ποτέ
      - κάθε μέρα
      - νωρίς
      - τώρα
    items:
      - id: m1
        prompt: всегда
        answer: πάντα
      - id: m2
        prompt: обычно
        answer: συνήθως
      - id: m3
        prompt: часто
        answer: συχνά
      - id: m4
        prompt: иногда
        answer: μερικές φορές
      - id: m5
        prompt: никогда
        answer: ποτέ
      - id: m6
        prompt: каждый день
        answer: κάθε μέρα
        explanation: Κάθε не меняется — κάθε μέρα, κάθε πρωί.
  - type: exercise
    id: negation
    title: Переводим
    instruction: Переведите на греческий. Начните предложение со слов в скобках.
    format: text
    items:
      - id: q1
        prompt: Я никогда не смотрю телевизор. (Δεν…)
        answer:
          - Δεν βλέπω ποτέ τηλεόραση
          - Δεν βλέπω τηλεόραση ποτέ
        explanation: Ποτέ всегда вместе с δεν перед глаголом.
      - id: q2
        prompt: Обычно я читаю вечером. (Συνήθως…)
        answer:
          - Συνήθως διαβάζω το βράδυ
          - Συνήθως το βράδυ διαβάζω
        explanation: "«Вечером» — το βράδυ, с артиклем и без предлога."
      - id: q3
        prompt: Мы не понимаем. (Δεν…)
        answer:
          - Δεν καταλαβαίνουμε
      - id: q4
        prompt: Ты часто слушаешь музыку? (Ακούς…; музыка — μουσική)
        answer:
          - Ακούς συχνά μουσική
          - Ακούς μουσική συχνά
      - id: q5
        prompt: Анна не просыпается рано. (Η Άννα…)
        answer:
          - Η Άννα δεν ξυπνάει νωρίς
          - Η Άννα δεν ξυπνά νωρίς
      - id: q6
        prompt: Каждый день я занимаюсь греческим. (Κάθε μέρα…)
        answer:
          - Κάθε μέρα διαβάζω ελληνικά
          - Κάθε μέρα μαθαίνω ελληνικά
        explanation: "«Заниматься, учить уроки» — διαβάζω; μαθαίνω — «учить, изучать» — тоже подходит."
  - type: exercise
    id: frequency-choice
    title: Правильно или нет
    instruction: Выберите правильное предложение.
    format: choice
    items:
      - id: q1
        prompt: «Я никогда не просыпаюсь рано».
        options:
          - Ξυπνάω ποτέ νωρίς.
          - Δεν ξυπνάω ποτέ νωρίς.
          - Δεν ποτέ ξυπνάω νωρίς.
        answer: Δεν ξυπνάω ποτέ νωρίς.
        explanation: С ποτέ нужно δεν, и δεν стоит прямо перед глаголом.
      - id: q2
        prompt: «Утром я слушаю музыку».
        options:
          - Στο πρωί ακούω μουσική.
          - Το πρωί ακούω μουσική.
          - Πρωί ακούει μουσική.
        answer: Το πρωί ακούω μουσική.
        explanation: "«Утром» — το πρωί, без предлога."
      - id: q3
        prompt: «Каждый вечер мы смотрим телевизор».
        options:
          - Κάθε βράδυ βλέπουμε τηλεόραση.
          - Κάθε βράδυ βλέπετε τηλεόραση.
          - Κάθε βράδια βλέπουμε τηλεόραση.
        answer: Κάθε βράδυ βλέπουμε τηλεόραση.
        explanation: Κάθε не меняется и стоит с единственным числом; «мы» — -ουμε.
      - id: q4
        prompt: «Во сколько ты просыпаешься?»
        options:
          - Τι ώρα ξυπνάς;
          - Τι ώρα ξυπνάει;
          - Πότε ώρα ξυπνάς;
        answer: Τι ώρα ξυπνάς;
  - type: exercise
    id: questions
    title: Вопрос и ответ
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Συνήθως ξυπνάω στις επτά.
      - Κάθε μέρα διαβάζω ελληνικά.
      - Το βράδυ βλέπω τηλεόραση.
      - Όχι, δεν μπορώ.
      - Ναι, ακούμε.
      - Είμαι από τη Ρωσία.
      - Μένω στη Λάρνακα.
    items:
      - id: m1
        prompt: Τι ώρα ξυπνάς;
        answer: Συνήθως ξυπνάω στις επτά.
      - id: m2
        prompt: Τι κάνεις το βράδυ;
        answer: Το βράδυ βλέπω τηλεόραση.
        explanation: Τι κάνεις; здесь — «Что ты делаешь?», а не «Как дела?».
      - id: m3
        prompt: Μαθαίνεις ελληνικά;
        answer: Κάθε μέρα διαβάζω ελληνικά.
      - id: m4
        prompt: Μπορείς αύριο;
        answer: Όχι, δεν μπορώ.
      - id: m5
        prompt: Ακούτε;
        answer: Ναι, ακούμε.
        explanation: "Спрашивают «вы» (ακούτε) — отвечают «мы»: ακούμε."
