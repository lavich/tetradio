blocks:
  - type: explanation
    id: vowels
    title: Гласные и сочетания гласных
    body: |-
      Греческое чтение почти всегда предсказуемо: одна и та же буква или пара букв читается одинаково. Выучив правила этого урока, вы сможете прочитать вслух любое слово, даже незнакомое.

      Главная трудность — звук **[и]**: его пишут пятью способами (η, ι, υ, ει, οι). Звук **[э]** пишут двумя (ε, αι), звук **[о]** — двумя (ο, ω). На чтение это не влияет, только на правописание.

      Пара **ου** — это один звук **[у]**: πού [пу] — «где?». Пары **αυ** и **ευ** читаются [ав]/[эв] перед гласной и звонкой согласной (Ευρώπη [эвро́пи]) и [аф]/[эф] перед глухой — κ, π, τ, χ, φ, θ, σ, ξ, ψ (αυτός [афто́с], ευχαριστώ [эфхаристо́]).

      Если ударение стоит на **первой** букве пары или над второй стоят две точки (ϊ, ϋ), буквы читаются раздельно: τσάι [ца́и] — «чай», Κάιρο [ка́иро]. В паре с ударением на второй букве пара остаётся одним звуком: είμαι [и́мэ].
    table:
      columns:
        - буквы
        - звук
        - пример
      rows:
        - - α
          - "[а]"
          - καλά [кала́]
        - - ε, αι
          - "[э]"
          - είμαι [и́мэ]
        - - η, ι, υ, ει, οι
          - "[и]"
          - εσύ [эси́], εσείς [эси́с], οι [и]
        - - ο, ω
          - "[о]"
          - όχι [о́хьи], εγώ [эɣо́]
        - - ου
          - "[у]"
          - πού [пу]
        - - αυ
          - "[ав] / [аф]"
          - αυτός [афто́с]
        - - ευ
          - "[эв] / [эф]"
          - Ευρώπη [эвро́пи], ευχαριστώ [эфхаристо́]
  - type: explanation
    id: consonants
    title: Согласные, которые читаются не как в русском
    body: |-
      Большинство согласных читаются почти как русские: κ [к], λ [л], μ [м], ν [н], π [п], ρ [р, короткое, с одним ударом языка], σ/ς [с], τ [т], φ [ф]. Буква ς пишется только в конце слова: εσείς, αυτός.

      Три звука в русском нет. **δ** — как английское th в слове this, мы пишем его [ð]: δέκα [ðэ́ка]. **θ** — как th в think, [θ]: Αθήνα [аθи́на]. **γ** — мягкое, «фрикативное» г, как в украинском или южнорусском «ага»: εγώ [эɣо́]; перед [э] и [и] оно звучит как [й]: γεια [йа].

      Сочетание **γι** или **γει** перед гласной — один звук [й]: γεια [йа], γιατί [йати́]. После согласной звук [и] (здесь это οι) перед гласной сливается с ней: ποιος [пьос] — один слог.
    table:
      columns:
        - буква
        - звук
        - пример
      rows:
        - - β
          - "[в]"
          - Βέρα [вэ́ра]
        - - γ
          - "[ɣ]; перед е/и — [й]"
          - εγώ [эɣо́], γεια [йа]
        - - δ
          - "[ð] (англ. this)"
          - δέκα [ðэ́ка]
        - - ζ
          - "[з]"
          - ζώνη [зо́ни]
        - - θ
          - "[θ] (англ. think)"
          - Αθήνα [аθи́на]
        - - ξ
          - "[кс]"
          - έξι [э́кси]
        - - ψ
          - "[пс]"
          - ψάρι [пса́ри]
        - - χ
          - "[х]; перед е/и — мягкое [хь]"
          - όχι [о́хьи]
  - type: explanation
    id: combos
    title: Сочетания согласных
    body: |-
      Несколько пар согласных читаются как один звук. В начале слова μπ, ντ, γκ звучат как [б], [д], [г]; в середине слова — чаще [мб], [нд], [нг], хотя в быстрой речи носовой звук почти не слышен.

      **τσ** и **τζ** — один звук, а не два: πίτσα [пи́ца], τζατζίκι [дзадзи́ки].

      Удвоенная согласная читается как одна: εννέα [энэ́а], τέσσερα [тэ́сэра]. Исключение — **γγ**: [нг], Αγγλία [англи́а]. Слово συγγνώμη обычно произносят [сиɣно́ми].
    table:
      columns:
        - пара
        - звук
        - пример
      rows:
        - - μπ
          - "[б] / [мб]"
          - μπαρ [бар], Όλυμπος [о́лимбос]
        - - ντ
          - "[д] / [нд]"
          - ντομάτα [дома́та], πέντε [пэ́ндэ]
        - - γκ
          - "[г] / [нг]"
          - γκαράζ [гара́з], άγκυρα [а́нгира]
        - - γγ
          - "[нг]"
          - Αγγλία [англи́а]
        - - τσ
          - "[ц]"
          - πίτσα [пи́ца]
        - - τζ
          - "[дз]"
          - τζατζίκι [дзадзи́ки]
  - type: exercise
    id: read-vowels
    title: Читаем гласные
    instruction: Как читается слово? Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: πού (где?)
        options:
          - "[пу]"
          - "[поу]"
          - "[по]"
        answer: "[пу]"
        explanation: ου — один звук [у], а не два.
      - id: q2
        prompt: είμαι (я есть)
        options:
          - "[эи́май]"
          - "[и́мэ]"
          - "[эймай]"
        answer: "[и́мэ]"
        explanation: ει читается [и], αι — [э]. Ударение над ι показывает ударный слог, пара остаётся одним звуком.
      - id: q3
        prompt: εσείς (вы)
        options:
          - "[эсэ́ис]"
          - "[эсэ́йс]"
          - "[эси́с]"
        answer: "[эси́с]"
        explanation: ει — [и]. Конечная ς — обычное [с].
      - id: q4
        prompt: οι (артикль множественного числа)
        options:
          - "[ои]"
          - "[и]"
          - "[ой]"
        answer: "[и]"
        explanation: οι — ещё один способ записать [и].
      - id: q5
        prompt: ευχαριστώ (спасибо)
        options:
          - "[эухаристо́]"
          - "[эвхаристо́]"
          - "[эфхаристо́]"
        answer: "[эфхаристо́]"
        explanation: После ευ стоит глухая χ, поэтому [эф], а не [эв].
      - id: q6
        prompt: Ευρώπη (Европа)
        options:
          - "[эфро́пи]"
          - "[эвро́пи]"
          - "[эуро́пи]"
        answer: "[эвро́пи]"
        explanation: После ευ стоит звонкая ρ, поэтому [эв]. η в конце — [и].
      - id: q7
        prompt: αυτός (он)
        options:
          - "[афто́с]"
          - "[авто́с]"
          - "[ауто́с]"
        answer: "[афто́с]"
        explanation: τ — глухая, поэтому αυ читается [аф].
      - id: q8
        prompt: τσάι (чай)
        options:
          - "[цэ]"
          - "[ца́и]"
          - "[цай]"
        answer: "[ца́и]"
        explanation: Ударение стоит на α — первой букве пары, поэтому α и ι читаются раздельно.
  - type: exercise
    id: read-consonants
    title: Читаем согласные
    instruction: Как читается слово? Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: μπαρ (заведение)
        options:
          - "[мпар]"
          - "[бар]"
          - "[пар]"
        answer: "[бар]"
        explanation: μπ в начале слова — [б].
      - id: q2
        prompt: πέντε (пять)
        options:
          - "[пэ́ндэ]"
          - "[пэ́нтэ]"
          - "[пэ́тэ]"
        answer: "[пэ́ндэ]"
        explanation: ντ в середине слова — [нд].
      - id: q3
        prompt: ντομάτα (овощ)
        options:
          - "[нтома́та]"
          - "[тома́та]"
          - "[дома́та]"
        answer: "[дома́та]"
        explanation: ντ в начале слова — [д].
      - id: q4
        prompt: γκαράζ (место для машины)
        options:
          - "[гара́з]"
          - "[нкара́ж]"
          - "[кара́з]"
        answer: "[гара́з]"
        explanation: γκ в начале слова — [г]; ζ — [з], а не [ж].
      - id: q5
        prompt: πίτσα (блюдо)
        options:
          - "[пи́тша]"
          - "[пи́ца]"
          - "[пи́са]"
        answer: "[пи́ца]"
        explanation: τσ — один звук [ц].
      - id: q6
        prompt: τζατζίκι (соус из йогурта)
        options:
          - "[тзатзи́ки]"
          - "[жажи́ки]"
          - "[дзадзи́ки]"
        answer: "[дзадзи́ки]"
        explanation: τζ — один звук [дз].
      - id: q7
        prompt: γεια (привет)
        options:
          - "[йа]"
          - "[гэйа]"
          - "[гиа]"
        answer: "[йа]"
        explanation: γει перед гласной — один звук [й]; вместе с α получается [йа].
      - id: q8
        prompt: όχι (нет)
        options:
          - "[о́чи]"
          - "[о́хьи]"
          - "[о́ки]"
        answer: "[о́хьи]"
        explanation: χ — это [х], а не [ч] и не [к]. Перед [и] оно смягчается.
      - id: q9
        prompt: δέκα (десять)
        options:
          - "[ðэ́ка]"
          - "[дэ́ка]"
          - "[бэ́ка]"
        answer: "[ðэ́ка]"
        explanation: δ — не [д], а [ð], как th в английском this. Это частая ошибка русскоговорящих.
  - type: explanation
    id: stress
    title: Ударение и тонос
    body: |-
      В каждом слове из двух и больше слогов над ударной гласной стоит знак ударения — **тонос**: καλημέρα, όχι. Ударение падает только на один из трёх последних слогов. Читайте слово, опираясь на тонос, — и вы не ошибётесь.

      Слова из одного слога тоноса не имеют: γεια, ναι, οι. Исключения нужны, чтобы различать смысл: **πού** — «где?», а **που** — «который»; **πώς** — «как?», а **πως** — «что» (союз).

      Если в паре букв (ει, αι, ου, ευ…) ударная пара, тонос ставится над **второй** буквой: είμαι, πού. У заглавной буквы тонос стоит слева сверху: Άννα, Όχι. Слова, написанные целиком заглавными (на вывесках и табличках), пишутся без тоноса: ΚΑΛΗΜΕΡΑ.

      Вопросительный знак в греческом выглядит как русская точка с запятой: **Πώς σε λένε;** — «Как тебя зовут?».
    table:
      columns:
        - слово
        - слоги
        - чтение
      rows:
        - - καλημέρα
          - κα-λη-μέ-ρα
          - "[калимэ́ра]"
        - - όνομα
          - ό-νο-μα
          - "[о́нома]"
        - - παρακαλώ
          - πα-ρα-κα-λώ
          - "[паракало́]"
        - - είμαι
          - εί-μαι
          - "[и́мэ]"
        - - ευχαριστώ
          - ευ-χα-ρι-στώ
          - "[эфхаристо́]"
  - type: exercise
    id: read-stress
    title: Где ударение
    instruction: Прочитайте слово по тоносу. Как оно звучит?
    format: choice
    items:
      - id: q1
        prompt: όνομα (имя)
        options:
          - "[о́нома]"
          - "[оно́ма]"
          - "[онома́]"
        answer: "[о́нома]"
        explanation: Тонос над первой ο — ударный первый слог.
      - id: q2
        prompt: παρακαλώ (пожалуйста)
        options:
          - "[пара́кало]"
          - "[паракало́]"
          - "[парака́ло]"
        answer: "[паракало́]"
        explanation: Тонос над последней ω — ударение на конце.
      - id: q3
        prompt: Λάρνακα (Ларнака)
        options:
          - "[ларна́ка]"
          - "[ларнака́]"
          - "[ла́рнака]"
        answer: "[ла́рнака]"
        explanation: По-русски говорят «Ларна́ка», по-гречески ударение на первом слоге.
      - id: q4
        prompt: Λεμεσός (Лимасол)
        options:
          - "[лэмэсо́с]"
          - "[лэ́мэсос]"
          - "[лэмэ́сос]"
        answer: "[лэмэсо́с]"
      - id: q5
        prompt: τέσσερα (четыре)
        options:
          - "[тэсэра́]"
          - "[тэ́сэра]"
          - "[тэсэ́ра]"
        answer: "[тэ́сэра]"
        explanation: σσ читается как одна [с]; ударение — по тоносу, на первом слоге.
      - id: q7
        prompt: Какое слово значит «где?»
        options:
          - πού
          - που
        answer: πού
        explanation: Вопросительное «где?» пишется с тоносом — πού. Без тоноса που значит «который».
      - id: q8
        prompt: На табличке написано ΑΘΗΝΑ. Как это читается?
        options:
          - "[а́θина]"
          - "[аθи́на]"
          - "[аθина́]"
        answer: "[аθи́на]"
        explanation: Заглавными буквами пишут без тоноса, ударение нужно знать. В строчном написании — Αθήνα.
  - type: exercise
    id: write-stress
    title: Пишем с тоносом
    instruction: Перепишите слово по-гречески и поставьте тонос там, где он нужен. Подсказка — чтение в скобках.
    format: text
    items:
      - id: q1
        prompt: καλημερα [калимэ́ра]
        answer:
          - καλημέρα
      - id: q2
        prompt: ευχαριστω [эфхаристо́]
        answer:
          - ευχαριστώ
      - id: q3
        prompt: εσεις [эси́с]
        answer:
          - εσείς
        explanation: В паре ει тонос ставится над второй буквой — ί.
      - id: q4
        prompt: ειμαι [и́мэ]
        answer:
          - είμαι
        explanation: Ударная пара ει — тонос над ι.
      - id: q5
        prompt: αυτος [афто́с]
        answer:
          - αυτός
      - id: q6
        prompt: οχι [о́хьи]
        answer:
          - όχι
      - id: q7
        prompt: ποιος [пьос] — кто?
        answer:
          - ποιος
        explanation: ποιος — один слог, поэтому пишется без тоноса.
      - id: q8
        prompt: πως [пос] — как?
        answer:
          - πώς
        explanation: Вопросительное «как?» пишется с тоносом, хотя слово односложное, — чтобы отличать его от πως «что».
  - type: explanation
    id: greetings
    title: Приветствия и вежливые слова
    body: |-
      **Γεια σου!** — «Привет!» и «Пока!» одному человеку на «ты». **Γεια σας!** — «Здравствуйте!» и «До свидания!» на «вы» или нескольким людям.

      **Καλημέρα!** говорят примерно до обеда, **Καλησπέρα!** — со второй половины дня и вечером.

      Будьте внимательны: **ναι** значит «да», а **όχι** — «нет». Звучание ναι [нэ] похоже на русское «не» — это самая частая ловушка начинающих.

      **Ευχαριστώ** — «спасибо»; ответ — **Παρακαλώ** («пожалуйста», «не за что»). **Συγγνώμη** — «извините»: и когда просите прощения, и когда обращаетесь к незнакомому человеку.
    table:
      columns:
        - по-гречески
        - по-русски
        - когда
      rows:
        - - Γεια σου!
          - Привет! Пока!
          - на «ты»
        - - Γεια σας!
          - Здравствуйте! До свидания!
          - на «вы», нескольким
        - - Καλημέρα!
          - Доброе утро! Добрый день!
          - до обеда
        - - Καλησπέρα!
          - Добрый вечер!
          - после обеда
        - - Τι κάνεις;
          - Как дела?
          - на «ты»
        - - Καλά, ευχαριστώ. Κι εσύ;
          - Хорошо, спасибо. А ты?
          - ответ
        - - Πώς σε λένε;
          - Как тебя зовут?
          - на «ты»
        - - Με λένε Άννα.
          - Меня зовут Анна.
          - ответ
        - - Από πού είσαι;
          - Откуда ты?
          - на «ты»
  - type: explanation
    id: pronouns
    title: Личные местоимения
    body: |-
      Местоимение-подлежащее по-гречески обычно опускают: форма глагола уже показывает лицо. **Είμαι από τη Ρωσία** — «Я из России». Местоимение говорят, когда хотят подчеркнуть или противопоставить: **Εγώ είμαι από τη Ρωσία. Εσύ;** — «Я из России. А ты?».

      **Εσείς** — это и «вы» нескольким людям, и вежливое «Вы» одному человеку.

      У «он/она/оно» и «они» три рода: αυτός, αυτή, αυτό; αυτοί, αυτές, αυτά. Имена людей употребляются с артиклем: **ο** Νίκος (м. р.), **η** Άννα (ж. р.). Союз **και** [кэ] — «и»; перед гласной часто **κι**: κι εσύ.
    table:
      columns:
        - лицо
        - единственное число
        - множественное число
      rows:
        - - 1-е
          - εγώ — я
          - εμείς — мы
        - - 2-е
          - εσύ — ты
          - εσείς — вы
        - - 3-е
          - αυτός — он, αυτή — она, αυτό — оно
          - αυτοί, αυτές, αυτά — они
  - type: explanation
    id: eimai
    title: Глагол είμαι — «быть»
    body: |-
      В русском «есть» в настоящем времени пропускают, в греческом — никогда: **Είμαι η Άννα** — «Я Анна», **Είναι από την Κύπρο** — «Он с Кипра».

      Форма **είναι** одна и та же для «он/она/оно» и для «они» — отличить помогает контекст.

      Откуда человек: **από** + артикль + название. Запомните блоками: από **τη** Ρωσία, από **τη** Μόσχα, από **την** Κύπρο, από **την** Ελλάδα, από **την** Αθήνα. Буква ν у артикля остаётся перед гласной и перед κ, π, τ, ξ, ψ (и μπ, ντ, γκ, τσ, τζ); перед остальными согласными её обычно нет.

      Вопрос можно задать одной интонацией, не меняя порядка слов: **Είσαι από την Κύπρο;** — «Ты с Кипра?» — голос поднимается на последнем ударном слоге. Вопросительные слова: **Πώς;** — как?, **Πού;** — где?, **Ποιος; Ποια;** — кто? (о мужчине / о женщине): Ποιος είναι αυτός; Ποια είναι αυτή;
    table:
      columns:
        - лицо
        - форма
        - пример
      rows:
        - - εγώ
          - είμαι
          - Είμαι από τη Ρωσία.
        - - εσύ
          - είσαι
          - Είσαι από την Κύπρο;
        - - αυτός, αυτή, αυτό
          - είναι
          - Η Άννα είναι από τη Μόσχα.
        - - εμείς
          - είμαστε
          - Είμαστε από την Ελλάδα.
        - - εσείς
          - είστε
          - Πού είστε;
        - - αυτοί, αυτές, αυτά
          - είναι
          - Ο Νίκος και η Άννα είναι από την Κύπρο.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: eimai-forms
    title: Формы είμαι
    instruction: Выберите форму глагола είμαι.
    format: choice
    items:
      - id: q1
        prompt: Εγώ ___ η Ελένη.
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είμαι
        explanation: "Εγώ — «я», 1-е лицо: είμαι."
      - id: q2
        prompt: Εσύ ___ από την Κύπρο;
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είσαι
        explanation: "Εσύ — «ты»: είσαι. Не путайте с είστε — «вы»."
      - id: q3
        prompt: Ο Νίκος ___ από την Πάφο.
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είναι
      - id: q4
        prompt: Εμείς ___ από τη Λάρνακα.
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είμαστε
      - id: q5
        prompt: Εσείς ___ από τη Μόσχα;
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είστε
      - id: q6
        prompt: Η Μαρία και η Άννα ___ από την Ελλάδα.
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είναι
        explanation: "Мария и Анна — «они», а для «они» форма та же, что для «он/она»: είναι."
      - id: q7
        prompt: Εγώ και η Άννα ___ από τη Ρωσία.
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είμαστε
        explanation: «Я и Анна» — это «мы», значит είμαστε.
      - id: q8
        prompt: Αυτή ___ η φίλη μου.
        options:
          - είμαι
          - είσαι
          - είναι
          - είμαστε
          - είστε
        answer: είναι
        explanation: Αυτή — «она», 3-е лицо. (η φίλη μου — «моя подруга».)
  - type: exercise
    id: pronouns-gap
    title: Какое местоимение
    instruction: Вставьте местоимение. Подсказка — форма глагола.
    format: gap
    bank:
      - εγώ
      - εσύ
      - αυτός
      - αυτή
      - εμείς
      - εσείς
      - αυτοί
    items:
      - id: g1
        prompt: Είμαι από τη Ρωσία. Κι ___ είσαι από τη Ρωσία;
        answer: εσύ
      - id: g2
        prompt: Ο Νίκος; Ναι, ___ είναι από την Πάφο.
        answer: αυτός
      - id: g3
        prompt: Η Άννα; Ναι, ___ είναι από τη Μόσχα.
        answer: αυτή
        explanation: Анна — женщина, поэтому αυτή, а не αυτός.
      - id: g4
        prompt: Η Μαρία κι εγώ; Ναι, ___ είμαστε από την Κύπρο.
        answer: εμείς
      - id: g5
        prompt: Κύριε Παύλο, ___ είστε από την Αθήνα; (κύριε — господин)
        answer: εσείς
        explanation: Είστε и вежливое обращение «господин» — это «Вы».
      - id: g6
        prompt: Ο Νίκος και ο Κώστας; Ναι, ___ είναι από τη Λεμεσό.
        answer: αυτοί
        explanation: "Двое — «они»: αυτοί. Глагол тот же, είναι, поэтому смотрите на смысл."
      - id: g7
        prompt: Ναι, ___ είμαι η Άννα.
        answer: εγώ
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вечер. Вы входите в магазин.
        options:
          - Καλησπέρα!
          - Καλημέρα!
          - Ευχαριστώ!
        answer: Καλησπέρα!
        explanation: Вечером — Καλησπέρα. Καλημέρα говорят до обеда.
      - id: q2
        prompt: Утро. Вы встречаете соседа.
        options:
          - Καλησπέρα!
          - Καλημέρα!
          - Παρακαλώ!
        answer: Καλημέρα!
      - id: q3
        prompt: "Друг спрашивает: «Τι κάνεις;»"
        options:
          - Καλά, ευχαριστώ. Κι εσύ;
          - Με λένε Άννα.
          - Είμαι από τη Μόσχα.
        answer: Καλά, ευχαριστώ. Κι εσύ;
        explanation: Τι κάνεις; — «Как дела?».
      - id: q4
        prompt: "Вам говорят: «Ευχαριστώ!»"
        options:
          - Παρακαλώ.
          - Συγγνώμη.
          - Όχι.
        answer: Παρακαλώ.
        explanation: На «спасибо» отвечают Παρακαλώ — «пожалуйста, не за что».
      - id: q5
        prompt: Вы случайно толкнули человека.
        options:
          - Συγγνώμη!
          - Παρακαλώ!
          - Γεια σου!
        answer: Συγγνώμη!
      - id: q6
        prompt: Вы здороваетесь с пожилым незнакомым человеком.
        options:
          - Γεια σου!
          - Γεια σας!
        answer: Γεια σας!
        explanation: "С незнакомыми взрослыми — на «вы»: Γεια σας."
      - id: q7
        prompt: "Вас спрашивают: «Πώς σε λένε;»"
        options:
          - Με λένε Ελένη.
          - Είμαι από την Κύπρο.
          - Καλά, ευχαριστώ.
        answer: Με λένε Ελένη.
      - id: q8
        prompt: "Вас спрашивают: «Από πού είσαι;»"
        options:
          - Είμαι από τη Ρωσία.
          - Με λένε Άννα.
          - Ναι.
        answer: Είμαι από τη Ρωσία.
      - id: q9
        prompt: Что значит ναι?
        options:
          - да
          - нет
        answer: да
        explanation: Ναι звучит как русское «не», но значит «да». «Нет» — όχι.
  - type: exercise
    id: question-words
    title: Вопросительные слова
    instruction: Вставьте вопросительное слово.
    format: gap
    bank:
      - Πώς
      - Πού
      - Από πού
      - Ποιος
      - Ποια
      - Τι
    items:
      - id: g1
        prompt: — ___ σε λένε; — Με λένε Άννα.
        answer: Πώς
      - id: g2
        prompt: — ___ είσαι; — Είμαι από την Κύπρο.
        answer: Από πού
        explanation: Вопрос «откуда?» — από πού, дословно «из где?».
      - id: g3
        prompt: — ___ είσαι τώρα; — Στη Λάρνακα. (τώρα — сейчас, στη — в)
        answer: Πού
        explanation: Πού — «где?». Ответ «в Ларнаке» — это место.
      - id: g4
        prompt: — ___ είναι αυτός; — Ο Νίκος.
        answer: Ποιος
        explanation: О мужчине — ποιος, о женщине — ποια.
      - id: g5
        prompt: — ___ είναι αυτή; — Η Μαρία.
        answer: Ποια
        explanation: Αυτή — «она», поэтому ποια.
      - id: g6
        prompt: — ___ κάνεις; — Καλά, ευχαριστώ.
        answer: Τι
        explanation: Τι κάνεις; — устойчивая фраза «Как дела?», дословно «Что делаешь?».
