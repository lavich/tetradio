blocks:
  - type: explanation
    id: work-day
    title: Рабочие будни
    body: |-
      **Η σύσκεψη** — совещание: Κάθε Δευτέρα στις εννέα έχουμε σύσκεψη. **Οργανώνω** — «организую», аорист **οργάνωσα**: Οργάνωσα τη σύσκεψη.

      **Οι υπερωρίες** — сверхурочная работа; слово обычно во мн. ч.: **Κάνω υπερωρίες** — «Я работаю сверхурочно». Χθες έκανα δύο ώρες υπερωρίες.

      **Κουράζομαι** — «устаю», спрягается как έρχομαι; аорист **κουράστηκα** — «я устал(а)»: Χθες κουράστηκα πολύ. **Κουραστικός** — «утомительный»: Η δουλειά μου είναι κουραστική.

      **Κερδίζω** — «зарабатываю»: Κερδίζω χίλια πεντακόσια ευρώ τον μήνα. У этого глагола есть и значение «выигрывать» (модуль 20).

      **Απολύω** — «увольняю», аорист **απέλυσα**: Η εταιρεία απέλυσε πέντε συναδέλφους μου. Заметьте: в вин. п. мн. ч. у συνάδελφος ударение сдвигается — **τους συναδέλφους** (так же ο υπάλληλος → τους υπαλλήλους).

      **Σας στέλνω το βιογραφικό μου.** — «Отправляю вам своё резюме». Так заканчивают письмо работодателю.
    table:
      columns:
        - пример
        - перевод
      rows:
        - - Έχουμε σύσκεψη στις εννέα.
          - У нас совещание в девять.
        - - Κάνω πολλές υπερωρίες.
          - Я много работаю сверхурочно.
        - - Χθες κουράστηκα πολύ.
          - Вчера я очень устал(а).
        - - Η βάρδια είναι κουραστική.
          - Смена утомительная.
        - - Πόσα κερδίζεις τον μήνα;
          - Сколько ты зарабатываешь в месяц?
        - - Η εταιρεία απέλυσε δέκα υπαλλήλους.
          - Компания уволила десять сотрудников.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: work-day-choice
    title: Какое слово подходит
    instruction: Выберите подходящее слово.
    format: choice
    items:
      - id: q1
        prompt: Χθες δούλεψα δώδεκα ώρες και ___ πολύ.
        options:
          - κουράστηκα
          - κουράζομαι
          - κουραστικός
        answer: κουράστηκα
        explanation: Χθες — законченное событие, нужен аорист κουράστηκα.
      - id: q2
        prompt: Η δουλειά στο εργοστάσιο είναι πολύ ___.
        options:
          - κουραστική
          - κουραστικός
          - κουράστηκα
        answer: κουραστική
        explanation: η δουλειά — женский род.
      - id: q3
        prompt: Κάθε Δευτέρα στις εννέα έχουμε ___ με τον διευθυντή.
        options:
          - σύσκεψη
          - υπερωρία
          - άδεια
        answer: σύσκεψη
      - id: q4
        prompt: — Πόσα ___ τον μήνα; — Χίλια τετρακόσια ευρώ.
        options:
          - κερδίζεις
          - οργανώνεις
          - στέλνεις
        answer: κερδίζεις
      - id: q5
        prompt: Αυτή την εβδομάδα έκανα δέκα ώρες ___.
        options:
          - υπερωρίες
          - άδειες
          - εμπειρίες
        answer: υπερωρίες
      - id: q6
        prompt: Η εταιρεία δεν έχει λεφτά και ___ πέντε υπαλλήλους.
        options:
          - απέλυσε
          - προσέλαβε
          - οργάνωσε
        answer: απέλυσε
        explanation: Нет денег — сотрудников увольняют (απέλυσε), а не нанимают (προσέλαβε).
  - type: explanation
    id: letter-how
    title: Письмо работодателю
    body: |-
      Письмо в этом модуле — короткий рассказ о себе для работодателя, около 80 слов: так пишут вместе с резюме в ответ на объявление. Регистр официальный, как письмо в отель в модуле 14: на «вы», в начале **Αγαπητή κυρία…, / Αγαπητέ κύριε…,**, в конце **Με εκτίμηση,** и имя. На экзамене своё настоящее имя не пишут — придумайте другое.

      План из шести шагов: откуда вы узнали о вакансии и на какую должность пишете; кто вы (имя, возраст, откуда); прошлое — когда приехали на Кипр, где и кем работали; настоящее — что делаете сейчас, какие языки знаете; почему вы подходите и когда можете начать; резюме и прощание.

      Проверьте себя после письма. О прошлом — аорист (ήρθα, δούλεψα, ήμουν), о настоящем — настоящее время (τώρα δουλεύω, μιλάω). После **ως** и **είμαι** профессия — в именительном падеже и в вашем роде: ως γραμματέας, είμαι λογίστρια. Во всём письме — «вы»: σας, την αγγελία σας.
    table:
      columns:
        - шаг
        - как сказать
      rows:
        - - вакансия
          - Είδα την αγγελία σας στο ίντερνετ και θα ήθελα να κάνω αίτηση για τη θέση…
        - - кто вы
          - Με λένε…, είμαι … χρονών και είμαι από…
        - - прошлое
          - Ήρθα στην Κύπρο πριν από … χρόνια. Δούλεψα … χρόνια ως…
        - - сейчас
          - Τώρα δουλεύω… / Τώρα είμαι άνεργος (άνεργη). Μιλάω…
        - - почему вы
          - Είμαι υπεύθυνος (υπεύθυνη) και μου αρέσει να δουλεύω με ανθρώπους.
        - - когда начать
          - Μπορώ να ξεκινήσω αμέσως.
        - - конец
          - Σας στέλνω το βιογραφικό μου. Με εκτίμηση, …
  - type: reading
    id: application
    title: Για τη θέση στη ρεσεψιόν
    text: |-
      Αγαπητή κυρία Πέτρου,

      Είδα την αγγελία σας στο ίντερνετ και θα ήθελα να κάνω (1) ___ για τη θέση στη ρεσεψιόν. Με λένε Ιρίνα Βόλκοβα και είμαι από τη Ρωσία. (2) ___ στην Κύπρο πριν από τέσσερα χρόνια. Στη Ρωσία δούλεψα πέντε χρόνια ως υπάλληλος σε μια ιδιωτική (3) ___. Στη Λάρνακα δούλεψα δύο χρόνια σε ένα ξενοδοχείο, αλλά πέρσι το ξενοδοχείο έκλεισε. Τώρα είμαι (4) ___ και ψάχνω μια μόνιμη θέση. Μιλάω ρωσικά, αγγλικά και καλά ελληνικά, και έχω (5) ___ με τουρίστες από πολλές χώρες. Μπορώ να ξεκινήσω αμέσως. Σας (6) ___ το βιογραφικό μου.

      Με εκτίμηση,
      Ιρίνα Βόλκοβα
    glosses:
      - text: έκλεισε
        russian: закрылся (κλείνω → έκλεισα)
  - type: exercise
    id: application-gap
    about: application
    title: Пропуски в письме
    instruction: Письмо пишет женщина, Ирина. Вставьте слова. Три слова лишние.
    format: gap
    bank:
      - αίτηση
      - ήρθα
      - εταιρεία
      - άνεργη
      - εμπειρία
      - στέλνω
      - έρχομαι
      - άνεργος
      - βάρδια
    items:
      - id: g1
        prompt: (1) Θα ήθελα να κάνω ___ για τη θέση στη ρεσεψιόν.
        answer: αίτηση
        explanation: Κάνω αίτηση — подаю заявку.
      - id: g2
        prompt: (2) ___ στην Κύπρο πριν από τέσσερα χρόνια.
        answer: ήρθα
        explanation: Πριν από τέσσερα χρόνια — законченное событие, нужен аорист. Έρχομαι — настоящее время.
      - id: g3
        prompt: (3) Στη Ρωσία δούλεψα πέντε χρόνια ως υπάλληλος σε μια ιδιωτική ___.
        answer: εταιρεία
      - id: g4
        prompt: (4) Τώρα είμαι ___ και ψάχνω μια μόνιμη θέση.
        answer: άνεργη
        explanation: Пишет женщина — άνεργη. Άνεργος — о мужчине.
      - id: g5
        prompt: (5) Μιλάω ρωσικά, αγγλικά και καλά ελληνικά, και έχω ___ με τουρίστες από πολλές χώρες.
        answer: εμπειρία
      - id: g6
        prompt: (6) Σας ___ το βιογραφικό μου.
        answer: στέλνω
  - type: writing
    id: job-letter
    register: formal
    prompt: |-
      Вы увидели в интернете объявление: «Ζητείται υπάλληλος για ξενοδοχείο στη Λεμεσό. Πλήρης απασχόληση. Απαραίτητα ελληνικά και αγγλικά. Στείλτε το βιογραφικό σας στην κυρία Χαραλάμπους.»
      Напишите г-же Χαραλάμπους письмо около 80 слов: откуда вы узнали о вакансии; кто вы и когда приехали на Кипр; где и кем работали раньше (прошедшее время); что делаете сейчас и какие языки знаете; когда можете начать. Своё настоящее имя не пишите.
    words:
      min: 70
      max: 90
    model: |-
      Αγαπητή κυρία Χαραλάμπους,

      Είδα την αγγελία σας στο ίντερνετ και θα ήθελα να κάνω αίτηση για τη θέση στο ξενοδοχείο. Με λένε Όλγα, είμαι τριάντα δύο χρονών και είμαι από τη Ρωσία. Ήρθα στην Κύπρο πριν από τρία χρόνια. Στη Μόσχα δούλεψα έξι χρόνια ως γραμματέας σε μια ιδιωτική εταιρεία. Τώρα δουλεύω σε ένα σούπερ μάρκετ με μερική απασχόληση. Μιλάω ρωσικά, αγγλικά και ελληνικά. Είμαι υπεύθυνη και μου αρέσει να δουλεύω με ανθρώπους. Μπορώ να ξεκινήσω αμέσως. Σας στέλνω το βιογραφικό μου.

      Με εκτίμηση,
      Όλγα Μιρόνοβα
    criteria:
      - 70–90 слов; официальное обращение (Αγαπητή κυρία… / Αγαπητέ κύριε…) и прощание Με εκτίμηση с придуманным именем
      - Всё письмо на «вы» (σας, την αγγελία σας); нет форм на «ты»
      - Сказано, откуда вы узнали о вакансии и на какую должность пишете (Είδα την αγγελία…, θα ήθελα να κάνω αίτηση…)
      - "О прошлом — аорист: ήρθα, δούλεψα, ήμουν…; о настоящем — настоящее время: τώρα δουλεύω, μιλάω"
      - Профессия после ως и είμαι — в именительном падеже и в вашем роде (ως λογίστρια, είμαι υπάλληλος)
      - Сказано, когда вы можете начать; есть фраза о резюме (Σας στέλνω το βιογραφικό μου)
      - Предложения связаны (και, αλλά, γιατί); тонос во всех словах из двух и больше слогов
  - type: explanation
    id: speaking-how
    title: Монолог «Моя работа»
    body: |-
      Во второй части устного экзамена вы около минуты говорите сами. Экзаменатор обращается на «вы»: **Μιλήστε μας για τη δουλειά σας.** — «Расскажите нам о своей работе».

      Главное в этом модуле — два времени в одном рассказе. План из пяти шагов: кем вы работаете сейчас и где (Είμαι…, Δουλεύω ως… σε…); ваш график (Δουλεύω με πλήρες ωράριο, από τις… μέχρι τις…); что вам нравится и что нет (Η δουλειά μου είναι ενδιαφέρουσα, αλλά κουραστική. Μου αρέσουν οι συνάδελφοί μου.); где вы работали раньше (Πριν από… χρόνια δούλεψα…, Ήρθα στην Κύπρο…); что было недавно (Την περασμένη εβδομάδα είχα…, Πέρσι πήρα άδεια…).

      Если сейчас вы не работаете, скажите об этом (Τώρα δεν δουλεύω / Είμαι άνεργη / Είμαι συνταξιούχος), расскажите о прошлой работе и о том, кем хотите стать (Θέλω να γίνω…).

      Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: my-work
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Μιλήστε μας για τη δουλειά σας. Τι δουλειά κάνετε τώρα; Τι δουλειά κάνατε πριν;»
      Говорите около минуты по плану, в настоящем и прошедшем времени. Запишите ответ.
    seconds: 90
    model: Είμαι προγραμματιστής. Δουλεύω σε μια ιδιωτική εταιρεία στη Λεμεσό εδώ και δύο χρόνια. Δουλεύω με πλήρες ωράριο, από τις εννέα μέχρι τις πέντε. Η δουλειά μου είναι ενδιαφέρουσα, αλλά λίγο κουραστική. Μου αρέσουν οι συνάδελφοί μου. Στη Ρωσία δούλεψα πέντε χρόνια σε μια μεγάλη εταιρεία στη Μόσχα. Πριν από δύο χρόνια ήρθα στην Κύπρο με την οικογένειά μου και βρήκα αυτή τη δουλειά στο ίντερνετ. Την περασμένη εβδομάδα είχα πολλή δουλειά και έκανα υπερωρίες. Αλλά τον Αύγουστο πήρα άδεια και πήγαμε διακοπές στην Πάφο.
    criteria:
      - Говорили около минуты, без долгих пауз
      - "О том, что сейчас, — настоящее время: είμαι, δουλεύω, μου αρέσει"
      - "О прошлом — аорист, не меньше трёх неправильных глаголов: ήρθα, βρήκα, πήρα, ήμουν, είχα…"
      - Есть слова времени (τώρα, εδώ και… / πριν από…, πέρσι, την περασμένη εβδομάδα)
      - Профессия названа в вашем роде (λογιστής / λογίστρια)
      - "Ударение на своём месте: έκανα, но κάναμε; δούλεψα; ενδιαφέρουσα"
  - type: exercise
    id: review-past
    title: Повторение — прошедшее время (модули 14–15)
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Πέρσι (εμείς) ___ διακοπές στην Πάφο.
        options:
          - πήγαμε
          - πηγαίνουμε
          - πήγαν
        answer: πήγαμε
      - id: q2
        prompt: Χθες (εγώ) ___ το λεωφορείο και έφτασα αργά στη δουλειά.
        options:
          - έχασα
          - χάνω
          - έχασε
        answer: έχασα
      - id: q3
        prompt: Κάθε πρωί (εγώ) ___ τον καφέ μου στο καφενείο.
        options:
          - πίνω
          - ήπια
          - ήπιε
        answer: πίνω
        explanation: Κάθε πρωί — привычка, нужно настоящее время.
      - id: q4
        prompt: Χθες (εγώ) ___ πέντε ευρώ φιλοδώρημα στην ταβέρνα.
        options:
          - άφησα
          - αφήνω
          - άφησε
        answer: άφησα
      - id: q5
        prompt: Την περασμένη εβδομάδα (εγώ) ___ ένα καινούργιο μπουφάν.
        options:
          - αγόρασα
          - αγοράζω
          - αγόρασε
        answer: αγόρασα
      - id: q6
        prompt: Τι ώρα ___ το αεροπλάνο χθες;
        options:
          - έφτασε
          - φτάνει
          - έφτασα
        answer: έφτασε
      - id: q7
        prompt: Πέρσι (εσύ) ___ στη Λευκωσία ή στη Λεμεσό;
        options:
          - ήσουν
          - ήταν
          - είσαι
        answer: ήσουν
  - type: exercise
    id: review-situations
    title: Повторение — ситуации (модули 09–14)
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: В кафе вы заказываете кипрский кофе средней сладости.
        options:
          - Θα ήθελα έναν κυπριακό καφέ μέτριο.
          - Κρατήστε τα ρέστα.
          - Για εδώ ή για πακέτο;
        answer: Θα ήθελα έναν κυπριακό καφέ μέτριο.
      - id: q2
        prompt: Вы поели в таверне и хотите заплатить.
        options:
          - Τον λογαριασμό, παρακαλώ.
          - Τι μας προτείνετε;
          - Κερνάει το μαγαζί.
        answer: Τον λογαριασμό, παρακαλώ.
      - id: q3
        prompt: В магазине одежды вы хотите примерить брюки.
        options:
          - Μπορώ να το δοκιμάσω;
          - Μπορώ να το επιστρέψω;
          - Έχετε την απόδειξη;
        answer: Μπορώ να το δοκιμάσω;
      - id: q4
        prompt: Вы в незнакомом районе и спрашиваете, как добраться до центра.
        options:
          - Πώς πάω στο κέντρο;
          - Πού πρέπει να κατέβω;
          - Είναι πέντε λεπτά με τα πόδια.
        answer: Πώς πάω στο κέντρο;
      - id: q5
        prompt: В кассе вы покупаете билет туда и обратно.
        options:
          - Ένα εισιτήριο μετ' επιστροφής, παρακαλώ.
          - Έχασα το λεωφορείο.
          - Στο αεροδρόμιο, παρακαλώ.
        answer: Ένα εισιτήριο μετ' επιστροφής, παρακαλώ.
      - id: q6
        prompt: В письме в отель вы хотите подтвердить бронь.
        options:
          - Θα ήθελα να επιβεβαιώσω την κράτησή μου.
          - Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο.
          - Σας στέλνω το βιογραφικό μου.
        answer: Θα ήθελα να επιβεβαιώσω την κράτησή μου.
