  - type: explanation
    id: me-mechri
    title: Με το λεωφορείο, από… μέχρι…
    body: |-
      **Με** + транспорт — по-русски «на»: Πάω στη δουλειά **με το λεωφορείο** — «Езжу на работу на автобусе». Артикль можно ставить или нет: με το αυτοκίνητο и με αυτοκίνητο, με ταξί, με το αεροπλάνο, με το ποδήλατο. Пешком — **με τα πόδια** (модуль 12). Спросить: **Πώς πας στη δουλειά;** — «Как (на чём) ты добираешься до работы?».

      **Από … μέχρι …** — «от … до …». После обоих слов — винительный падеж с артиклем: **από τη** Λευκωσία **μέχρι τη** Λεμεσό, **από το** σπίτι **μέχρι τον** σταθμό. Μέχρι вы встречали во фразе Συνέχισε μέχρι την πλατεία (модуль 12). Так же говорят о времени: **από τις** οκτώ **μέχρι τις** πέντε — «с восьми до пяти».

      **Города Кипра.** Η Λευκωσία [лефкоси́а] — Никосия, столица. **Η Λεμεσός** и **η Πάφος** — женского рода, хотя кончаются на -ος; в винительном падеже теряют ς, как ο φίλος → τον φίλο: **στη Λεμεσό**, **από την Πάφο**. **Η Λάρνακα** — обычное слово на -α: στη Λάρνακα. Главный аэропорт острова — в Ларнаке, второй — в Пафосе.

      На Кипре нет железной дороги. Между городами ездят на машине, на автобусе или на такси; от Никосии до Лимасола около 80 километров. Движение на острове левостороннее.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Πάω στην Πάφο με το αυτοκίνητο.
          - Я еду в Пафос на машине.
        - - Φεύγω από τη Λεμεσό στις επτά.
          - Я уезжаю из Лимасола в семь.
        - - Το λεωφορείο για τη Λάρνακα φεύγει από εδώ.
          - Автобус на Ларнаку отправляется отсюда.
        - - Από τη Λευκωσία μέχρι τη Λεμεσό είναι ογδόντα χιλιόμετρα.
          - От Никосии до Лимасола восемьдесят километров.
        - - Ανεβαίνω στο λεωφορείο και κατεβαίνω στο κέντρο.
          - Я сажусь в автобус и выхожу в центре.
  - type: explanation
    id: time
    title: Сколько ехать и когда приедем
    body: |-
      Два помощника: **το λεπτό** — «минута» (мн. ч. **τα λεπτά**, вы встречали их во фразе Είναι πέντε λεπτά με τα πόδια) и **περίπου** — «примерно, около».

      **Τι ώρα φεύγει / φτάνει;** — «Во сколько отправляется / прибывает?». Ответ — **στις** + час (модуль 04): Στις οκτώ και μισή. В час — **στη μία**.

      **Πόση ώρα κάνει;** — «Сколько (времени) ехать?». Здесь κάνει значит не «стоит», а «занимает»: **Κάνει μία ώρα.** Κάνει σαράντα λεπτά. Κάνει περίπου δύο ώρες. Полчаса — **μισή ώρα** (μισός согласуется с ώρα).

      **Σε πόση ώρα φτάνουμε;** — «Через сколько мы приедем?». **Σε** + время значит «через»: **Σε δέκα λεπτά.** Не путайте: Κάνει δέκα λεπτά — «дорога занимает десять минут», Σε δέκα λεπτά — «через десять минут».

      **Κάθε πόση ώρα περνάει το λεωφορείο;** — «Как часто ходит автобус?» (περνάω — «проходить, проезжать», модуль 12). Ответ — **κάθε**: Κάθε μισή ώρα. Κάθε είκοσι λεπτά.

      **Πόσο μακριά είναι;** — «Далеко ли?». **Η απόσταση** — «расстояние»: Η απόσταση είναι εβδομήντα χιλιόμετρα. Или просто: Είναι εβδομήντα χιλιόμετρα.
    table:
      columns:
        - вопрос
        - ответ
      rows:
        - - Τι ώρα φεύγει το λεωφορείο;
          - Στις εννιά και τέταρτο.
        - - Πόση ώρα κάνει το λεωφορείο μέχρι την Πάφο;
          - Κάνει περίπου μία ώρα.
        - - Σε πόση ώρα φτάνουμε;
          - Σε είκοσι λεπτά.
        - - Κάθε πόση ώρα περνάει το λεωφορείο;
          - Κάθε μισή ώρα.
        - - Πόσο μακριά είναι η Λάρνακα;
          - Είναι σαράντα πέντε χιλιόμετρα.
        - - Πώς πας στη δουλειά;
          - Με το ποδήλατο.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: words-match
    title: Транспорт
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - το λεωφορείο
      - το αεροδρόμιο
      - το αεροπλάνο
      - το αυτοκίνητο
      - το ποδήλατο
      - το λιμάνι
      - ο οδηγός
      - ο επιβάτης
      - ο σταθμός
      - το χιλιόμετρο
    items:
      - id: m1
        prompt: автобус
        answer: το λεωφορείο
      - id: m2
        prompt: аэропорт
        answer: το αεροδρόμιο
      - id: m3
        prompt: самолёт
        answer: το αεροπλάνο
      - id: m4
        prompt: машина
        answer: το αυτοκίνητο
      - id: m5
        prompt: велосипед
        answer: το ποδήλατο
      - id: m6
        prompt: порт
        answer: το λιμάνι
      - id: m7
        prompt: водитель
        answer: ο οδηγός
      - id: m8
        prompt: пассажир
        answer: ο επιβάτης
  - type: exercise
    id: verb-forms
    title: Какая форма
    instruction: Выберите правильную форму глагола.
    format: choice
    items:
      - id: q1
        prompt: Το λεωφορείο ___ στις οκτώ.
        options:
          - φεύγει
          - φεύγω
          - φεύγουν
        answer: φεύγει
      - id: q2
        prompt: Εμείς ___ στη Λεμεσό στις δέκα.
        options:
          - φτάνουμε
          - φτάνετε
          - φτάνουν
        answer: φτάνουμε
      - id: q3
        prompt: — Πώς ___ στη δουλειά; — Με το λεωφορείο.
        options:
          - πας
          - πάω
          - πάνε
        answer: πας
      - id: q4
        prompt: Ο πατέρας μου ___ ταξί.
        options:
          - οδηγεί
          - οδηγώ
          - οδηγούν
        answer: οδηγεί
        explanation: Οδηγώ спрягается как μπορώ — μπορεί, οδηγεί.
      - id: q5
        prompt: Οι φίλοι μου ___ αύριο από την Πάφο.
        options:
          - έρχονται
          - έρχεται
          - ερχόμαστε
        answer: έρχονται
      - id: q6
        prompt: Εσείς τι ώρα ___ από τη δουλειά;
        options:
          - φεύγετε
          - φεύγεις
          - φεύγουμε
        answer: φεύγετε
      - id: q7
        prompt: Εγώ δεν ___ αυτοκίνητο.
        options:
          - οδηγώ
          - οδηγεί
          - οδηγείς
        answer: οδηγώ
  - type: exercise
    id: which-verb
    title: Какой глагол
    instruction: Вставьте глагол по смыслу. Два слова лишние.
    format: gap
    bank:
      - φεύγει
      - φτάνει
      - ανεβαίνω
      - κατεβαίνω
      - παίρνω
      - οδηγεί
      - γυρίζουμε
      - φτάνουμε
    items:
      - id: g1
        prompt: Το λεωφορείο ___ από τη Λευκωσία στις εννιά το πρωί και φτάνει στη Λεμεσό στις δέκα.
        answer: φεύγει
      - id: g2
        prompt: Το αεροπλάνο από τη Μόσχα ___ στη Λάρνακα στις τρεις.
        answer: φτάνει
        explanation: «Прибывает в Ларнаку» — φτάνει σε. Φεύγει — «отправляется», и с ним было бы από или για.
      - id: g3
        prompt: Στη στάση ___ στο λεωφορείο από την μπροστινή πόρτα. (μπροστινή — передняя)
        answer: ανεβαίνω
      - id: g4
        prompt: Εγώ ___ από το λεωφορείο στο κέντρο, κοντά στην πλατεία.
        answer: κατεβαίνω
      - id: g5
        prompt: Είναι δώδεκα το βράδυ και δεν υπάρχει λεωφορείο, γι' αυτό ___ ένα ταξί. (γι' αυτό — поэтому)
        answer: παίρνω
      - id: g6
        prompt: Ο Νίκος δεν έχει αυτοκίνητο, γιατί δεν ___.
        answer: οδηγεί
        explanation: У Никоса нет машины, потому что он не водит.
  - type: exercise
    id: prep-gap
    title: Предлог и артикль
    instruction: Вставьте предлог с артиклем. Два варианта лишние.
    format: gap
    bank:
      - με το
      - με τα
      - για τη
      - στο
      - στην
      - από το
      - μέχρι τις
      - στον
      - από τις
    items:
      - id: g1
        prompt: Πάω στη δουλειά ___ λεωφορείο.
        answer: με το
      - id: g2
        prompt: Το λεωφορείο ___ Λάρνακα φεύγει από τη Λευκωσία στις δέκα.
        answer: για τη
        explanation: Автобус «на Ларнаку» — για τη Λάρνακα; из Никосии он уже отправляется (από τη Λευκωσία).
      - id: g3
        prompt: Φτάνουμε ___ αεροδρόμιο στις πέντε.
        answer: στο
      - id: g4
        prompt: Το σούπερ μάρκετ είναι ανοιχτό από τις οκτώ ___ δέκα.
        answer: μέχρι τις
      - id: g5
        prompt: Κατεβαίνω ___ λεωφορείο στην πλατεία.
        answer: από το
        explanation: Выходить из автобуса — κατεβαίνω από το λεωφορείο.
      - id: g6
        prompt: Αύριο πηγαίνω ___ Πάφο με το αυτοκίνητο.
        answer: στην
        explanation: Перед π буква ν у την остаётся — στην Πάφο.
      - id: g7
        prompt: Ο Πέτρος πάει στη δουλειά ___ πόδια.
        answer: με τα
  - type: exercise
    id: time-match
    title: Вопрос и ответ
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Στις οκτώ και μισή.
      - Κάνει περίπου μία ώρα.
      - Σε δέκα λεπτά.
      - Κάθε είκοσι λεπτά.
      - Είναι εβδομήντα χιλιόμετρα.
      - Με το ποδήλατο.
      - Κάνει δύο ευρώ.
      - Είμαι από τη Λεμεσό.
    items:
      - id: m1
        prompt: Τι ώρα φεύγει το λεωφορείο;
        answer: Στις οκτώ και μισή.
      - id: m2
        prompt: Πόση ώρα κάνει το λεωφορείο μέχρι τη Λεμεσό;
        answer: Κάνει περίπου μία ώρα.
      - id: m3
        prompt: Σε πόση ώρα φτάνουμε;
        answer: Σε δέκα λεπτά.
        explanation: "Σε + время — «через»: через десять минут."
      - id: m4
        prompt: Κάθε πόση ώρα περνάει το λεωφορείο;
        answer: Κάθε είκοσι λεπτά.
      - id: m5
        prompt: Πόσο μακριά είναι η Πάφος;
        answer: Είναι εβδομήντα χιλιόμετρα.
      - id: m6
        prompt: Πώς πας στη δουλειά;
        answer: Με το ποδήλατο.
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я езжу на работу на автобусе.
        answer:
          - Πηγαίνω στη δουλειά με το λεωφορείο.
          - Πάω στη δουλειά με το λεωφορείο.
          - Πηγαίνω στη δουλειά με λεωφορείο.
          - Πάω στη δουλειά με λεωφορείο.
          - Εγώ πηγαίνω στη δουλειά με το λεωφορείο.
          - Εγώ πάω στη δουλειά με το λεωφορείο.
          - Στη δουλειά πηγαίνω με το λεωφορείο.
          - Στη δουλειά πάω με το λεωφορείο.
      - id: q2
        prompt: Во сколько прилетает самолёт?
        answer:
          - Τι ώρα φτάνει το αεροπλάνο;
          - Το αεροπλάνο τι ώρα φτάνει;
        explanation: Прибытие — φτάνω; έρχεται здесь тоже поймут, но о времени прибытия говорят φτάνει.
      - id: q3
        prompt: Мы приедем через двадцать минут.
        answer:
          - Φτάνουμε σε είκοσι λεπτά.
          - Σε είκοσι λεπτά φτάνουμε.
          - Θα φτάσουμε σε είκοσι λεπτά.
        explanation: О скором будущем, как и в модуле 04, можно говорить настоящим временем — φτάνουμε.
      - id: q4
        prompt: В аэропорт, пожалуйста. (таксисту)
        answer:
          - Στο αεροδρόμιο, παρακαλώ.
          - Στο αεροδρόμιο παρακαλώ.
      - id: q5
        prompt: От Никосии до Лимасола — восемьдесят километров.
        answer:
          - Από τη Λευκωσία μέχρι τη Λεμεσό είναι ογδόντα χιλιόμετρα.
          - Από τη Λευκωσία μέχρι τη Λεμεσό είναι 80 χιλιόμετρα.
          - Η απόσταση από τη Λευκωσία μέχρι τη Λεμεσό είναι ογδόντα χιλιόμετρα.
          - Η απόσταση από τη Λευκωσία μέχρι τη Λεμεσό είναι 80 χιλιόμετρα.
        explanation: Λεμεσός — женский род, в винительном без ς и с артиклем τη.
      - id: q6
        prompt: Этот автобус идёт в центр?
        answer:
          - Αυτό το λεωφορείο πάει στο κέντρο;
          - Αυτό το λεωφορείο πηγαίνει στο κέντρο;
      - id: q7
        prompt: Моя сестра не водит машину.
        answer:
          - Η αδελφή μου δεν οδηγεί.
          - Η αδερφή μου δεν οδηγεί.
          - Η αδελφή μου δεν οδηγεί αυτοκίνητο.
          - Η αδερφή μου δεν οδηγεί αυτοκίνητο.
      - id: q8
        prompt: Я выхожу в центре.
        answer:
          - Κατεβαίνω στο κέντρο.
          - Εγώ κατεβαίνω στο κέντρο.
