blocks:
  - type: explanation
    id: motion
    title: Куда, откуда, когда — глаголы движения
    body: |-
      Часть глаголов движения вы уже знаете: **πηγαίνω / πάω** — «идти, ехать» (модуль 02), **έρχομαι** — «приходить, приезжать» (05), **γυρίζω** и **επιστρέφω** — «возвращаться» (05, 11). Теперь добавим ещё два: **φεύγω** — «уходить, уезжать, отправляться» и **φτάνω** — «прибывать, приезжать, добираться». В настоящем времени оба спрягаются как обычные глаголы на -ω (γράφω, μένω).

      Направление показывают предлоги с винительным падежом (модуль 08):
      - куда — **σε**: Πάω **στη** Λεμεσό. Φτάνουμε **στο** αεροδρόμιο.
      - откуда — **από**: Φεύγω **από τη** Λευκωσία. Έρχομαι **από το** λιμάνι.
      - в какую сторону отправляется — **για**: Το λεωφορείο **για τη** Λάρνακα φεύγει στις δέκα — «Автобус на Ларнаку отправляется в десять».

      Русскому «приезжать» соответствуют два глагола. **Έρχομαι** — «приезжаю сюда, к вам»: Η μητέρα μου έρχεται από τη Ρωσία. **Φτάνω** — «добираюсь до места, прибываю», особенно когда важно время: Τι ώρα φτάνει το αεροπλάνο;

      Глаголы **ανεβαίνω** и **κατεβαίνω** из модуля 12 («подниматься», «спускаться») о транспорте значат «садиться» и «выходить»: **Ανεβαίνω στο λεωφορείο** — «Сажусь в автобус», **Κατεβαίνω από το λεωφορείο** — «Выхожу из автобуса», **Κατεβαίνω στο κέντρο** — «Выхожу в центре». «Сесть на автобус, взять такси» — **παίρνω** (модуль 04): Παίρνω το λεωφορείο. Παίρνω ένα ταξί.

      **Οδηγώ** — «водить (машину)» — спрягается как μπορώ: οδηγείς, οδηγεί… Водитель — **ο οδηγός** (и о женщине — **η οδηγός**), таксист — **ο ταξιτζής** (разговорное слово). Το ταξί не склоняется: το ταξί, τα ταξί.
    table:
      columns:
        - лицо
        - φεύγω
        - φτάνω
        - πάω
        - οδηγώ
      rows:
