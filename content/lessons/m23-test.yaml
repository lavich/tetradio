title: Контрольная модуля 23
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Разговор звучит два раза. В нём вы услышите **η ιστοσελίδα** — сайт. Главное в грамматике — официальный стиль: обращение и концовка письма, Θα ήθελα να… и Θα μπορούσατε να…;, формы на «вы» и аорист с приращением после приставки (υπέγραψα, παρέλαβα).
  - type: reading
    id: notice
    title: Ανακοίνωση
    text: |-
      ΑΝΑΚΟΙΝΩΣΗ

      Αγαπητοί πελάτες,

      Από τη Δευτέρα 2 Νοεμβρίου το ταχυδρομείο μας θα είναι ανοιχτό από τις 7:30 μέχρι τις 14:00.

      Τα δέματα και τις συστημένες επιστολές μπορείτε να τα παραλάβετε μόνο με την ταυτότητα ή το διαβατήριό σας. Αν δεν μπορείτε να έρθετε εσείς, κάποιος άλλος μπορεί να τα παραλάβει με ένα αντίγραφο της ταυτότητάς σας και την υπογραφή σας.

      Προσοχή: τα δέματα μένουν στο ταχυδρομείο μόνο δεκαπέντε μέρες. Μετά επιστρέφουν στον αποστολέα.

      Γραμματόσημα και φακέλους μπορείτε να αγοράσετε και από το μηχάνημα έξω από το ταχυδρομείο, όλο το εικοσιτετράωρο.

      Σας ευχαριστούμε!
    glosses:
      - text: ΑΝΑΚΟΙΝΩΣΗ
        russian: объявление
      - text: Αγαπητοί πελάτες
        russian: уважаемые клиенты
      - text: Προσοχή
        russian: внимание
      - text: το μηχάνημα
        russian: автомат
      - text: όλο το εικοσιτετράωρο
        russian: круглосуточно
  - type: exercise
    id: notice-tf
    about: notice
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Από τις 2 Νοεμβρίου το ταχυδρομείο κλείνει στις δύο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: 14:00 — два часа дня.
      - id: q2
        prompt: Για να παραλάβετε ένα δέμα, δεν χρειάζεστε ταυτότητα ή διαβατήριο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: …μόνο με την ταυτότητα ή το διαβατήριό σας.
      - id: q3
        prompt: Ένας φίλος σας μπορεί να παραλάβει το δέμα σας.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Другой человек может получить посылку с копией вашего удостоверения и вашей подписью.
      - id: q4
        prompt: Τα δέματα μένουν στο ταχυδρομείο έναν μήνα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Только пятнадцать дней.
      - id: q5
        prompt: Αν δεν παραλάβετε το δέμα, επιστρέφει στον αποστολέα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Γραμματόσημα μπορείτε να αγοράσετε μόνο όταν το ταχυδρομείο είναι ανοιχτό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Марки продаёт и автомат снаружи, у почты, — круглосуточно (όλο το εικοσιτετράωρο).
  - type: listening
    id: electricity
    title: Στο τηλέφωνο με την υπηρεσία ρεύματος
    plays: 2
    transcript:
      - speaker: Αντιγόνη
        text: Υπηρεσία ρεύματος, καλησπέρα σας. Με λένε Αντιγόνη.
      - speaker: Στέλιος
        text: Καλησπέρα σας. Θα ήθελα να ρωτήσω για τον λογαριασμό του ρεύματος. Είναι διακόσια δέκα ευρώ, αλλά συνήθως πληρώνω ογδόντα.
      - speaker: Αντιγόνη
        text: Το όνομά σας, παρακαλώ;
      - speaker: Στέλιος
        text: Στέλιος Ευαγγέλου.
      - speaker: Αντιγόνη
        text: Και τη διεύθυνσή σας;
      - speaker: Στέλιος
        text: Οδός Κύπρου 14, στη Λεμεσό.
      - speaker: Αντιγόνη
        text: Ναι, κύριε Ευαγγέλου. Ο λογαριασμός είναι για δύο μήνες, για τον Ιούλιο και τον Αύγουστο.
      - speaker: Στέλιος
        text: Α, καταλαβαίνω. Το καλοκαίρι έχουμε το κλιματιστικό ανοιχτό όλη μέρα.
      - speaker: Αντιγόνη
        text: Ναι, γι' αυτό ο λογαριασμός είναι πιο ακριβός.
      - speaker: Στέλιος
        text: Μέχρι πότε πρέπει να τον πληρώσω;
      - speaker: Αντιγόνη
        text: Η προθεσμία είναι μέχρι τις είκοσι Σεπτεμβρίου.
      - speaker: Στέλιος
        text: Και πού μπορώ να τον πληρώσω;
      - speaker: Αντιγόνη
        text: Με κάρτα στην ιστοσελίδα μας ή στο ταχυδρομείο.
      - speaker: Στέλιος
        text: Θα μπορούσατε να μου στείλετε τον λογαριασμό και με email;
      - speaker: Αντιγόνη
        text: Βεβαίως, θα σας τον στείλω σήμερα. Κάτι άλλο;
      - speaker: Στέλιος
        text: Όχι, ευχαριστώ πολύ. Καλησπέρα σας.
  - type: exercise
    id: electricity-notes
    about: electricity
    graded: true
    title: Аудирование — заметки
    instruction: Прослушайте разговор и запишите ответ — цифрой или одним-двумя словами (по-гречески или по-русски).
    format: text
    items:
      - id: n1
        prompt: Сколько Стелиос обычно платит за электричество (евро)?
        answer:
          - "80"
          - 80 €
          - 80€
          - 80 ευρώ
          - ογδόντα
          - ογδόντα ευρώ
          - 80 евро
        explanation: Διακόσια δέκα (210) — это новый счёт, а обычно он платит ογδόντα.
      - id: n2
        prompt: За сколько месяцев этот счёт?
        answer:
          - "2"
          - δύο
          - 2 μήνες
          - δύο μήνες
          - για δύο μήνες
          - два
          - 2 месяца
          - два месяца
          - за два месяца
          - за 2 месяца
      - id: n3
        prompt: Почему летом счёт больше? Что у Стелиоса летом включено весь день?
        answer:
          - κλιματιστικό
          - το κλιματιστικό
          - έχει κλιματιστικό
          - κλιματιστικό ανοιχτό
          - το κλιματιστικό ανοιχτό
          - кондиционер
          - из-за кондиционера
      - id: n4
        prompt: До какого числа нужно оплатить счёт?
        answer:
          - 20 Σεπτεμβρίου
          - μέχρι τις 20 Σεπτεμβρίου
          - είκοσι Σεπτεμβρίου
          - μέχρι τις είκοσι Σεπτεμβρίου
          - 20/9
          - 20/09
          - "20.09"
          - "20.9"
          - 20 Σεπτέμβρη
          - μέχρι τις 20 Σεπτέμβρη
          - до 20.09
          - двадцатое сентября
          - до двадцатого сентября
          - 20 сентября
          - до 20 сентября
      - id: n5
        prompt: В каком городе живёт Стелиос?
        answer:
          - Λεμεσός
          - Λεμεσό
          - στη Λεμεσό
          - Лимасол
          - Лимассол
          - в Лимасоле
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика и стиль
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы пишете письмо в банк госпоже Николау. Как начать?
        options:
          - Αξιότιμη κυρία Νικολάου,
          - Γεια σου, Ελένη!
          - Αγαπητή μου Ελένη,
        answer: Αξιότιμη κυρία Νικολάου,
      - id: q2
        prompt: Θα ___ να μου πείτε τι ώρα ανοίγει η τράπεζα;
        options:
          - μπορούσατε
          - μπορούσα
          - μπορείς
        answer: μπορούσατε
        explanation: Μου πείτε — «вы», поэтому и θα μπορούσατε — «вы». Θα μπορούσα — «я», μπορείς — «ты».
      - id: q3
        prompt: Για τον λογαριασμό ___ ακόμα η ταυτότητά σας.
        options:
          - χρειάζεται
          - χρειάζονται
          - χρειάζεστε
        answer: χρειάζεται
        explanation: Нужна одна вещь — η ταυτότητα (им. п.), поэтому χρειάζεται. Χρειάζονται — если нужно несколько вещей; χρειάζεστε — «вам нужно», но тогда было бы την ταυτότητά σας.
      - id: q4
        prompt: Χθες ___ την αίτηση στην τράπεζα.
        options:
          - υπέγραψα
          - θα υπογράψω
          - υπογράψω
        answer: υπέγραψα
        explanation: "Χθες — прошлое, аорист; приращение после приставки: υπ-έ-γραψα."
      - id: q5
        prompt: Αύριο (εγώ) θα ___ το διαβατήριό μου.
        options:
          - ανανεώσω
          - ανανέωσα
          - ανανεώσει
        answer: ανανεώσω
        explanation: Будущее — θα + форма от основы аориста; лицо «я».
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το δέμα
      - το γραμματόσημο
      - ο φάκελος
      - ο παραλήπτης
      - η προθεσμία
      - το επώνυμο
      - ο αποστολέας
      - η υπογραφή
      - το παράπονο
    items:
      - id: m1
        prompt: посылка
        answer: το δέμα
      - id: m2
        prompt: марка
        answer: το γραμματόσημο
      - id: m3
        prompt: конверт
        answer: ο φάκελος
      - id: m4
        prompt: получатель
        answer: ο παραλήπτης
      - id: m5
        prompt: срок
        answer: η προθεσμία
      - id: m6
        prompt: фамилия
        answer: το επώνυμο
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы на почте и хотите узнать, где взять бланк.
        options:
          - Πού μπορώ να βρω το έντυπο;
          - Πού είναι το ταχυδρομείο;
          - Πόσο κάνει το γραμματόσημο;
        answer: Πού μπορώ να βρω το έντυπο;
      - id: q2
        prompt: Вы в банке и хотите положить деньги на свой счёт.
        options:
          - Θα ήθελα να κάνω μια κατάθεση.
          - Θα ήθελα να κάνω μια ανάληψη.
          - Θα ήθελα να ανοίξω λογαριασμό.
        answer: Θα ήθελα να κάνω μια κατάθεση.
        explanation: Η κατάθεση — внести деньги, η ανάληψη — снять; счёт у вас уже есть.
      - id: q3
        prompt: Служащий говорит «Υπογράψτε εδώ, παρακαλώ». Что нужно сделать?
        options:
          - поставить подпись
          - заполнить бланк
          - показать удостоверение
        answer: поставить подпись
      - id: q4
        prompt: Вы пишете в службу и хотите сказать, что прилагаете копию паспорта.
        options:
          - Επισυνάπτω αντίγραφο του διαβατηρίου μου.
          - Ανανεώνω το διαβατήριό μου.
          - Παρέλαβα το διαβατήριό μου.
        answer: Επισυνάπτω αντίγραφο του διαβατηρίου μου.
        explanation: Επισυνάπτω — «прилагаю»; ανανεώνω — «продлеваю», παρέλαβα — «я получил(а)».
