title: Контрольная модуля 16
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Главное в грамматике — форма после να: один раз — от основы аориста, привычка и умение — настоящее время.
  - type: reading
    id: rena
    title: Πέρασα!
    text: |-
      Γεια σου, Κατερίνα!

      Πώς είσαι; Πέρασα τις εξετάσεις για το πιστοποιητικό Α2! Στις γραπτές εξετάσεις πήρα είκοσι δύο στα είκοσι πέντε και στις προφορικές δεκαεπτά. Η προφορά μου δεν είναι ακόμα πολύ καλή!

      Τώρα ο στόχος μου είναι το Β1. Θέλω να γραφτώ σε ένα βραδινό μάθημα στο πανεπιστήμιο, γιατί το πρωί δουλεύω. Τα δίδακτρα είναι λίγο ακριβά, διακόσια ευρώ τον μήνα, αλλά οι καθηγητές είναι πολύ καλοί.

      Κι εσύ; Πώς πάνε τα ισπανικά σου; Θέλεις να πάμε για καφέ το Σάββατο; Πρέπει να σου πω πολλά!

      Τα λέμε,
      Ρένα
    glosses:
      - text: στα είκοσι πέντε
        russian: из двадцати пяти
      - text: Πώς πάνε τα ισπανικά σου;
        russian: Как успехи в испанском?
  - type: exercise
    id: rena-tf
    about: rena
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Ρένα πέρασε τις εξετάσεις.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Στις προφορικές εξετάσεις η Ρένα πήρε είκοσι δύο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είκοσι δύο — за письменную часть, за устную — δεκαεπτά (17).
      - id: q3
        prompt: Η Ρένα λέει ότι η προφορά της είναι πολύ καλή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η προφορά μου δεν είναι ακόμα πολύ καλή.
      - id: q4
        prompt: Η Ρένα θέλει να έχει μάθημα το βράδυ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Βραδινό μάθημα, γιατί το πρωί δουλεύω.
      - id: q5
        prompt: Τα δίδακτρα στο πανεπιστήμιο είναι φτηνά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Λίγο ακριβά — дороговато.
      - id: q6
        prompt: Η Ρένα θέλει να δει την Κατερίνα το Σάββατο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Θέλεις να πάμε για καφέ το Σάββατο;
  - type: listening
    id: school-call
    title: Στο τηλέφωνο με τη σχολή
    plays: 2
    transcript:
      - speaker: Σταύρος
        text: Σχολή «Ορίζοντες», καλημέρα σας.
        audio: m16-test/school-call-1.mp3
      - speaker: Ιωάννα
        text: Καλημέρα σας. Θα ήθελα πληροφορίες για τα μαθήματα ελληνικών.
        audio: m16-test/school-call-2.mp3
      - speaker: Σταύρος
        text: Ναι, παρακαλώ. Σε ποιο επίπεδο είστε;
        audio: m16-test/school-call-3.mp3
      - speaker: Ιωάννα
        text: Δεν ξέρω. Μαθαίνω ελληνικά εδώ και έξι μήνες.
        audio: m16-test/school-call-4.mp3
      - speaker: Σταύρος
        text: Πρέπει να γράψετε ένα μικρό τεστ. Μπορείτε να έρθετε την Πέμπτη στις δέκα;
        audio: m16-test/school-call-5.mp3
      - speaker: Ιωάννα
        text: Την Πέμπτη δεν μπορώ, δουλεύω. Μπορώ να έρθω την Παρασκευή;
        audio: m16-test/school-call-6.mp3
      - speaker: Σταύρος
        text: Ναι, την Παρασκευή στις δέκα.
        audio: m16-test/school-call-7.mp3
      - speaker: Ιωάννα
        text: Και πόσο κοστίζουν τα δίδακτρα;
        audio: m16-test/school-call-8.mp3
      - speaker: Σταύρος
        text: Ενενήντα ευρώ τον μήνα, για δύο μαθήματα την εβδομάδα. Για τα βιβλία δεν πληρώνετε τίποτα.
        audio: m16-test/school-call-9.mp3
      - speaker: Ιωάννα
        text: Πολύ ωραία. Και πότε αρχίζουν τα μαθήματα;
        audio: m16-test/school-call-10.mp3
      - speaker: Σταύρος
        text: Στις δεκαπέντε Ιανουαρίου.
        audio: m16-test/school-call-11.mp3
      - speaker: Ιωάννα
        text: Ευχαριστώ πολύ! Γεια σας.
        audio: m16-test/school-call-12.mp3
      - speaker: Σταύρος
        text: Γεια σας, τα λέμε την Παρασκευή.
        audio: m16-test/school-call-13.mp3
  - type: exercise
    id: school-call-choice
    about: school-call
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Сколько Иоанна учит греческий?
        options:
          - полгода
          - год
          - два месяца
        answer: полгода
        explanation: Εδώ και έξι μήνες — уже шесть месяцев.
      - id: q2
        prompt: Что Иоанна должна сделать в школе?
        options:
          - написать небольшой тест
          - заплатить за книги
          - поговорить с преподавателем
        answer: написать небольшой тест
      - id: q3
        prompt: Когда Иоанна придёт в школу?
        options:
          - в пятницу в десять
          - в четверг в десять
          - в пятницу в двенадцать
        answer: в пятницу в десять
        explanation: В четверг она не может — работает.
      - id: q4
        prompt: Сколько стоит обучение?
        options:
          - 90 € в месяц
          - 60 € в месяц
          - 90 € в неделю
        answer: 90 € в месяц
      - id: q5
        prompt: Что сказано о книгах?
        options:
          - платить за них не нужно
          - они стоят 20 €
          - их надо купить в магазине
        answer: платить за них не нужно
        explanation: Για τα βιβλία δεν πληρώνετε τίποτα.
      - id: q6
        prompt: Когда начинаются занятия?
        options:
          - 15 января
          - 5 января
          - 15 июня
        answer: 15 января
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Θέλω να ___ ελληνικά.
        options:
          - μάθω
          - έμαθα
          - μάθει
        answer: μάθω
        explanation: После θέλω να нет прошедших форм; «я» — μάθω.
      - id: q2
        prompt: Μπορείτε να το ___, παρακαλώ;
        options:
          - επαναλάβετε
          - επανέλαβα
          - επαναλάβω
        answer: επαναλάβετε
      - id: q4
        prompt: Πρέπει να ___ συχνά ελληνικά με τους συναδέλφους μου.
        options:
          - μιλάω
          - μιλήσω
          - μίλησα
        answer: μιλάω
        explanation: Συχνά — повтор, поэтому настоящее время.
      - id: q5
        prompt: Εμείς πρέπει να ___ αυτό το βιβλίο για τις εξετάσεις.
        options:
          - διαβάσουμε
          - διαβάσει
          - διαβάσετε
        answer: διαβάσουμε
        explanation: Πρέπει не изменяется по лицам; «мы» показывает второй глагол.
      - id: q6
        prompt: Ξέρεις να ___;
        options:
          - οδηγείς
          - οδηγήσεις
          - οδήγησες
        answer: οδηγείς
        explanation: Ξέρω να — умение, после него настоящее время.
      - id: q7
        prompt: Δεν μπορώ να ___ πώς τη λένε.
        options:
          - θυμηθώ
          - θυμάμαι
          - θυμήθηκα
        answer: θυμηθώ
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите форму глагола после να — от основы аориста. Можно с να или без.
    format: text
    items:
      - id: q1
        prompt: Πρέπει να ___ μια άσκηση. (εγώ · γράφω)
        answer:
          - γράψω
          - να γράψω
      - id: q2
        prompt: Θέλεις να ___ στο μάθημα αύριο; (πηγαίνω)
        answer:
          - πας
          - να πας
        explanation: πήγα → να πάω, να πας.
      - id: q3
        prompt: Μπορείτε να ___ την Παρασκευή; (έρχομαι)
        answer:
          - έρθετε
          - να έρθετε
          - έλθετε
          - να έλθετε
      - id: q4
        prompt: Η Άννα πρέπει να ___ στις ερωτήσεις. (απαντάω)
        answer:
          - απαντήσει
          - να απαντήσει
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το μάθημα
      - η εξέταση
      - ο βαθμός
      - το λάθος
      - το λεξικό
      - το επίπεδο
      - η τάξη
      - το τετράδιο
      - ο στόχος
    items:
      - id: m1
        prompt: урок, занятие
        answer: το μάθημα
      - id: m2
        prompt: экзамен
        answer: η εξέταση
      - id: m3
        prompt: оценка, балл
        answer: ο βαθμός
      - id: m4
        prompt: ошибка
        answer: το λάθος
      - id: m5
        prompt: словарь
        answer: το λεξικό
      - id: m6
        prompt: уровень
        answer: το επίπεδο
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы не расслышали, что сказала преподавательница.
        options:
          - Μπορείτε να το επαναλάβετε, παρακαλώ;
          - Πέρασα τις εξετάσεις!
          - Τι δουλειά κάνεις;
        answer: Μπορείτε να το επαναλάβετε, παρακαλώ;
      - id: q2
        prompt: В тексте незнакомое греческое слово, и вы хотите узнать, что оно значит.
        options:
          - Τι σημαίνει αυτή η λέξη;
          - Πώς το λένε αυτό στα ελληνικά;
          - Πόσο κοστίζουν τα δίδακτρα;
        answer: Τι σημαίνει αυτή η λέξη;
        explanation: Πώς το λένε αυτό στα ελληνικά; — наоборот, когда вы не знаете греческого слова для вещи.
      - id: q3
        prompt: Как закончить письмо в языковую школу перед подписью?
        options:
          - Σας ευχαριστώ εκ των προτέρων.
          - Τα λέμε!
          - Γεια σου!
        answer: Σας ευχαριστώ εκ των προτέρων.
      - id: q4
        prompt: Друг спрашивает, как прошёл экзамен. Вы сдали!
        options:
          - Πέρασα τις εξετάσεις!
          - Θέλω να δώσω εξετάσεις.
          - Περιμένω την απάντησή σας.
        answer: Πέρασα τις εξετάσεις!
