  - type: exercise
    id: there-choice
    title: There is или there are
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "___ a lifeguard on duty today."
        options: [There's, There are, They are]
        answer: There's
        explanation: Один спасатель — there's (there is).
      - id: q2
        prompt: "___ two loungers left, but only one parasol."
        options: [There are, There is, They have]
        answer: There are
        explanation: Лежаков два — there are.
      - id: q3
        prompt: "___ any shade near here?"
        options: [Is there, Are there, Has there]
        answer: Is there
        explanation: Shade — неисчисляемое слово, глагол is.
      - id: q4
        prompt: "There ___ any loungers left, so we sat on the sand."
        options: ["aren't", "isn't", "don't"]
        answer: "aren't"
        explanation: Loungers — несколько, поэтому aren't; don't с there не используется.
      - id: q5
        prompt: Вы спрашиваете, есть ли сегодня сильное течение.
        options:
          - Is there a strong current today?
          - Has it a strong current today?
          - Is a strong current today?
        answer: Is there a strong current today?
        explanation: Вопрос о наличии — Is there…?
  - type: exercise
    id: permission-choice
    title: Можно, безопасно, стоит
    instruction: Выберите вариант, который звучит правильно.
    format: choice
    items:
      - id: q1
        prompt: Вы спрашиваете у спасателя, безопасно ли здесь купаться.
        options:
          - Is it safe to swim here?
          - Is it safe swim here?
          - It is safe to swim here?
        answer: Is it safe to swim here?
        explanation: Is it safe to + глагол; вопрос начинается с Is.
      - id: q2
        prompt: Вы вежливо просите два лежака.
        options:
          - Could we get two loungers, please?
          - Could we to get two loungers, please?
          - We could get two loungers, please?
        answer: Could we get two loungers, please?
        explanation: После could глагол без to; порядок слов вопроса — could + we.
      - id: q3
        prompt: Вы советуете другу снова нанести крем.
        options:
          - You should reapply sunscreen.
          - You should to reapply sunscreen.
          - You should reapplying sunscreen.
        answer: You should reapply sunscreen.
        explanation: После should — глагол без to.
      - id: q4
        prompt: Вы спрашиваете, можно ли сесть на свободный лежак.
        options:
          - Can we sit here?
          - Can we sitting here?
          - Do we can sit here?
        answer: Can we sit here?
        explanation: Can + we + глагол, без do.
      - id: q5
        prompt: Вы говорите знакомому, что не стоит плавать далеко одному.
        options:
          - You shouldn't swim far out on your own.
          - You don't should swim far out on your own.
          - You shouldn't to swim far out on your own.
        answer: You shouldn't swim far out on your own.
        explanation: Отрицание — shouldn't + глагол без to.
  - type: exercise
    id: water-safety-q
    title: Флаги и течение
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: You see red and yellow flags on the beach. Where should you swim?
        options:
          - between the flags
          - anywhere on the beach
          - behind the flags
        answer: between the flags
        explanation: Красно-жёлтые флаги отмечают участок под присмотром спасателей, плавают между ними.
      - id: q2
        prompt: There is one red flag on the beach. What does it usually mean?
        options:
          - Don't go in the water.
          - Swim between the flags.
          - This is a zone for boats.
        answer: Don't go in the water.
        explanation: Один красный флаг — в воду нельзя; зона досок и лодок отмечена чёрно-белым флагом.
      - id: q3
        prompt: A current is taking you away from the beach. What should you do first?
        options:
          - Swim along the beach, then back to the shore.
          - Swim straight against the current.
          - Swim out to sea.
        answer: Swim along the beach, then back to the shore.
        explanation: Не боритесь с течением — плывите вдоль берега, затем к берегу.
      - id: q4
        prompt: You are tired in the water and cannot swim back. What can you do?
        options:
          - Float on your back, raise your arm and call for help.
          - Swim faster against the current.
          - Dive under the waves.
        answer: Float on your back, raise your arm and call for help.
        explanation: Держитесь на воде на спине, поднимите руку и позовите на помощь.
      - id: q5
        prompt: You are not sure what the flags mean on this beach. Who is the best person to ask?
        options:
          - the lifeguard
          - another tourist
          - nobody, just go in
        answer: the lifeguard
        explanation: Значения различаются между пляжами; точный ответ знает спасатель.
