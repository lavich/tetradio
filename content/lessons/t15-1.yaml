blocks:
  - type: explanation
    id: there-is
    title: There is / there are — что есть на пляже
    body: |-
      Чтобы сказать, что где-то есть спасатель, тень, свободные лежаки или сильное течение, начинают с **there is** (одно или неисчисляемое) и **there are** (несколько): **There's a lifeguard on duty.** **There are two loungers left.** **There's a strong current today.** Сокращение there's звучит в речи чаще, чем there is.

      Отрицание — **There isn't…** и **There aren't…**; вариант с no означает то же самое: **There are no loungers left** — «свободных лежаков не осталось». Вопрос — **Is there…?** и **Are there…?**: **Is there any shade nearby?** **Are there any lifeguards on this beach?** Короткий ответ: **Yes, there is. / No, there isn't.** С неисчисляемыми словами (shade, sand, wind) ставят any или some, глагол — is.

      Типичная ошибка — «It has a lifeguard here» вместо **There's a lifeguard here**: по-английски наличие чего-то на месте передаёт there. Вторая — форма единственного числа при нескольких предметах: «There is two loungers» — нужно **There are two loungers**.
    table:
      columns:
        - что сказать
        - пример
      rows:
        - - одно или неисчисляемое
          - There's a lifeguard on duty.
        - - несколько
          - There are two loungers left.
        - - ничего нет
          - There aren't any loungers left.
        - - вопрос
          - Is there any shade nearby?
        - - погода и море
          - There's a strong current today.
  - type: explanation
    id: can-safe
    title: Можно ли, безопасно ли и что посоветовать
    body: |-
      Спросить разрешение — **Can we…?** (проще) и **Could we…?** (вежливее): **Can we swim here?** **Could we sit here?** **Could we get two loungers and a parasol?** Ответ: **Yes, of course.** или **I'm afraid not.** После can и could глагол без to.

      Спросить, безопасно ли что-то, — **Is it safe to + глагол?**: **Is it safe to swim here?** **Is it safe to leave our things here?** Ответ на такой вопрос надёжен только от человека, который знает место: спасателя, работника проката, персонала пляжа. Другой отдыхающий может ошибаться.

      Совет — **should**: **You should reapply sunscreen after swimming.** **You should swim between the flags.** Отрицание — **shouldn't**: **You shouldn't swim alone.** После should и shouldn't идёт глагол без to.

      Типичные ошибки: «Is it safe swim here?» без to, «Can we to sit here?» и «You should to reapply» с лишним to после can и should.
    table:
      columns:
        - задача
        - фраза
      rows:
        - - спросить разрешение
          - Could we sit here?
        - - спросить, безопасно ли
          - Is it safe to swim here?
        - - посоветовать
          - You should reapply sunscreen after swimming.
        - - не советовать
          - You shouldn't swim alone.
  - type: explanation
    id: water-safety
    title: Флаги, спасатели и течение
    body: |-
      Описанное ниже — самое распространённое, по табличкам британской спасательной службы RNLI и международной федерации спасателей ILS. Значения флагов различаются между странами и даже между пляжами, поэтому первым делом прочитайте табличку у входа на пляж или спросите спасателя (**a lifeguard**): **What do the flags mean?**

      Обычно так. Флаги **red and yellow** вместе отмечают участок под присмотром спасателей: плавают между ними — **Stay between the flags.** Один **red flag** — в воду нельзя. **Yellow flag** — осторожно, условия на воде требуют внимания. Чёрно-белый клетчатый флаг — зона досок и лодок, здесь не плавают. Если вы не уверены, спросите спасателя: **Is it safe to swim here?** Ответ надёжен от того, кто знает это место.

      Течение, которое уносит от берега, — **a rip current**. Оно часто незаметно: вода выглядит спокойной, иногда с полосой пены, которая идёт в сторону моря. Если вас уносит, не боритесь с течением: плывите **along the beach**, вдоль берега, пока течение не ослабнет, и затем к берегу. Если сил не хватает, держитесь на воде на спине, поднимите руку (**raise your arm**) и позовите на помощь: **Help**.

      С берега помощь вызывают по местному номеру экстренной службы: **112** в странах ЕС, **999** в Великобритании; на других курортах номер уточните на ресепшене или у спасателя. Попросите береговую охрану — **the coastguard**. Плавать лучше между флагами и не одному далеко от берега.
    table:
      columns:
        - флаг
        - что обычно значит
      rows:
        - - red and yellow
          - участок под присмотром спасателей, плавают между флагами
        - - один red
          - в воду нельзя
        - - yellow
          - осторожно
        - - чёрно-белый клетчатый
          - зона досок и лодок, не плавают
  - type: explanation
    id: beach-things
    title: Лежаки, зонт, крем и просьба присмотреть за вещами
    body: |-
      На платном пляже лежак — **a lounger**, зонт — **a parasol**; в США чаще говорят a beach chair и a beach umbrella. Цену и свободные места уточняют у работника пляжа: **Could we get two loungers and a parasol?** Если лежаков нет, скажут **There are no loungers left.** Тень — **shade**: **Is there any shade nearby?**

      Крем от солнца — **sunscreen** (в Британии часто sun cream). После купания его наносят снова — **reapply**: **You should reapply sunscreen after swimming.**

      Море описывают словами **shallow** (мелко), **choppy** (с волнами) и **the tide** (приливы и отливы: *high tide* — прилив, *low tide* — отлив). Спасатель на дежурстве — **a lifeguard on duty**.

      Чтобы пойти поплавать, можно попросить соседа по пляжу или работника пляжа: **Could you keep an eye on our things?** Просьба строится как другие вежливые просьбы с Could you…; ценные вещи можно взять с собой. Эту же просьбу учит карточка модуля t10.
