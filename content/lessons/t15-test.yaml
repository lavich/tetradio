    id: forecast-q
    about: forecast
    graded: true
    title: Аудирование — прогноз и план
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What is the weather going to be like on Saturday morning?
        options: [overcast, sunny, rainy]
        answer: overcast
        explanation: It's supposed to be overcast in the morning.
      - id: q2
        prompt: When is it going to clear up?
        options: [around noon, in the evening, at nine]
        answer: around noon
        explanation: It's going to clear up around noon.
      - id: q3
        prompt: How hot is it going to be in the afternoon?
        options: [thirty-four degrees, twenty-four degrees, thirty degrees]
        answer: thirty-four degrees
        explanation: Thirty-four degrees in the afternoon… scorching.
      - id: q4
        prompt: Why don't they go on the boat trip on Saturday morning?
        options:
          - The sea is going to be choppy.
          - The boat trip is fully booked.
          - It is going to rain.
        answer: The sea is going to be choppy.
        explanation: The wind is stronger in the morning, so the sea is going to be choppy.
      - id: q5
        prompt: What do they decide to do in the morning?
        options: [go to the market, go snorkelling, stay at the hotel]
        answer: go to the market
        explanation: We could go to the market in the morning, while it's cool.
      - id: q6
        prompt: When do they plan the boat trip?
        options: [on Sunday, on Saturday evening, on Friday]
        answer: on Sunday
        explanation: Let's do the boat trip on Sunday; Sunday is going to be calmer.
  - type: exercise
    id: grammar
    graded: true
    title: Пляж и погода
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: There ___ a lifeguard on duty today, so we can swim between the flags.
        options: [is, are, has]
        answer: is
        explanation: Один спасатель — there is.
      - id: q2
        prompt: There ___ any loungers left, so we sat on the sand.
        options: ["aren't", "isn't", "don't"]
        answer: "aren't"
        explanation: Loungers — несколько, поэтому aren't.
      - id: q3
        prompt: ___ it safe to swim at this beach?
        options: [Is, Does, Are]
        answer: Is
        explanation: Is it safe to + глагол.
      - id: q4
        prompt: You ___ reapply sunscreen after swimming.
        options: [should, should to, are should]
        answer: should
        explanation: После should глагол без to.
      - id: q5
        prompt: If it ___ tomorrow, we'll go to the spa.
        options: [rains, will rain, rain]
        answer: rains
        explanation: После if — настоящее время.
      - id: q6
        prompt: It's ___ to clear up by noon.
        options: [supposed, supposing, suppose]
        answer: supposed
        explanation: Be supposed to — «по прогнозу, должно».
      - id: q7
        prompt: Yesterday it was 29 degrees, and today it is 33. Today is ___ than yesterday.
        options: [hotter, more hot, hottest]
        answer: hotter
        explanation: Hot — короткое прилагательное; сравнение — hotter than.
