title: Контрольная модуля t15
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 10–15 минут: объявление отеля о дне с дождём и расписание трансфера, разговор со спасателем о флагах и течении, прогноз и план компании, грамматика пляжа и погоды, слова и фразы модуля. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Аудио звучит два раза; в вопросах с выбором верен один вариант. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: notice
    title: A hotel notice and a shuttle timetable
    text: |-
      PALM BAY RESORT — NOTICE FOR THURSDAY
      The forecast says rain from 10:00 and a strong wind in the evening. It is supposed to clear up at about 15:00.
      Boat trips: the snorkelling trip and the coast boat trip are moved to Friday at the same times. If you have a booking, you do not need to do anything.
      Indoor programme: yoga at 9:30 in the studio, cooking class at 11:00, film at 16:00 in the bar.
      Beach: please check the flags at the lifeguard hut before you swim. If there is a red flag, do not enter the water.
      Spa: open as usual, 10:00–19:00. Book at reception.

      SHUTTLE TO TOWN — €4 return, pay on the bus
      Hotel to town: 9:00, 11:00, 14:00, 17:00
      Town to hotel: 12:00, 15:00, 18:00, 21:00 (last shuttle)
    glosses:
      - { text: Indoor programme, russian: занятия в помещении }
      - { text: moved to, russian: перенесены на }
      - { text: hut, russian: домик }
      - { text: return, russian: туда и обратно }
  - type: exercise
    id: notice-q
    about: notice
    graded: true
    title: Чтение
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What time is it supposed to clear up on Thursday?
        options: [at about 15:00, at about 10:00, at about 21:00]
        answer: at about 15:00
        explanation: It is supposed to clear up at about 15:00; в 10:00 дождь начинается.
      - id: q2
        prompt: What happens to the boat trips?
        options:
          - They move to Friday.
          - They are cancelled.
          - They start later on Thursday.
        answer: They move to Friday.
        explanation: The snorkelling trip and the coast boat trip are moved to Friday at the same times.
      - id: q3
        prompt: What should guests with a booking do?
        options:
          - Nothing.
          - Rebook at reception.
          - Pay again at the hut.
        answer: Nothing.
        explanation: If you have a booking, you do not need to do anything.
      - id: q4
        prompt: Which activity starts at 11:00?
        options: [the cooking class, yoga, the film]
        answer: the cooking class
        explanation: Yoga в 9:30, фильм в 16:00.
      - id: q5
        prompt: What should you do before swimming on Thursday?
        options:
          - check the flags at the lifeguard hut
          - ask reception for a wetsuit
          - wait until 15:00
        answer: check the flags at the lifeguard hut
        explanation: Please check the flags at the lifeguard hut before you swim.
      - id: q6
        prompt: What time is the last shuttle from town to the hotel?
        options: ["21:00", "18:00", "17:00"]
        answer: "21:00"
        explanation: "Town to hotel: … 21:00 (last shuttle). 17:00 — последний рейс из отеля в город."
      - id: q7
        prompt: How much is the shuttle to town?
        options: [€4 for a return ticket, €4 each way, nothing]
        answer: €4 for a return ticket
        explanation: "€4 return — туда и обратно, платят в автобусе."
      - id: q8
        prompt: Is the spa open on Thursday?
        options:
          - Yes, as usual.
          - No, it is closed.
          - Only in the evening.
        answer: Yes, as usual.
        explanation: Spa — open as usual, 10:00–19:00.
  - type: listening
    id: flags
    title: A lifeguard explains the flags
    plays: 2
    transcript:
      - { speaker: Dario, text: "Good morning. Can I help you?" }
      - { speaker: Mila, text: "Hi. We'd like to swim this morning. Is it safe to swim here today?" }
      - { speaker: Dario, text: "Yes, but only between the red and yellow flags. That's the area we watch." }
      - { speaker: Mila, text: "What does the red flag at the far end mean?" }
      - { speaker: Dario, text: "It means don't go in the water there. There's a strong current by the rocks, but not here in the middle of the beach." }
      - { speaker: Mila, text: "I see. What should we do if a current takes us away from the beach?" }
      - { speaker: Dario, text: "Don't swim against it. Swim along the beach until it gets weaker, then come back to the shore. If you're tired, float on your back, raise your arm and shout for help. We'll see you." }
      - { speaker: Mila, text: "Good to know. Is it all right for our son? He's seven." }
      - { speaker: Dario, text: "The shallow area near the jetty is good for children, but they should stay with an adult." }
      - { speaker: Mila, text: "Until what time are you on duty?" }
      - { speaker: Dario, text: "Until six. After six there's no lifeguard, so please stay out of the water." }
      - { speaker: Mila, text: "Thank you very much." }
      - { speaker: Dario, text: "You're welcome. Enjoy your swim." }
  - type: exercise
    id: flags-q
    about: flags
    graded: true
    title: Аудирование — спасатель
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Where should Mila and her family swim?
        options: [between the red and yellow flags, anywhere on the beach, by the rocks]
        answer: between the red and yellow flags
        explanation: Only between the red and yellow flags — участок под присмотром.
      - id: q2
        prompt: What does the red flag at the far end mean?
        options:
          - Don't go in the water there.
          - Swim there with a guide.
          - It is a zone for boats.
        answer: Don't go in the water there.
        explanation: It means don't go in the water there.
      - id: q3
        prompt: Why is the area by the rocks different?
        options:
          - There is a strong current there.
          - It is too shallow.
          - There are no lifeguards.
        answer: There is a strong current there.
        explanation: There's a strong current by the rocks.
      - id: q4
        prompt: What should you do if a current takes you away from the beach?
        options:
          - Swim along the beach.
          - Swim against the current.
          - Swim out to sea.
        answer: Swim along the beach.
        explanation: Don't swim against it. Swim along the beach until it gets weaker.
      - id: q5
        prompt: Where is it good for Mila's son?
        options: [the shallow area near the jetty, the area by the rocks, the deep water]
        answer: the shallow area near the jetty
        explanation: The shallow area near the jetty is good for children.
      - id: q6
        prompt: Until what time is the lifeguard on duty?
        options: [six o'clock, five o'clock, seven o'clock]
        answer: six o'clock
        explanation: Until six. After six there's no lifeguard.
  - type: listening
    id: forecast
    title: The forecast and a plan for Saturday
    plays: 2
    transcript:
      - { speaker: Henrik, text: "Have you seen the forecast for Saturday?" }
      - { speaker: Selin, text: "Yes. It's supposed to be overcast in the morning, and it's going to clear up around noon." }
      - { speaker: Henrik, text: "And how hot is it going to be?" }
      - { speaker: Selin, text: "Thirty-four degrees in the afternoon. It's going to be scorching, hotter than today." }
      - { speaker: Henrik, text: "Then we shouldn't stay on the beach all afternoon. How about the boat trip in the morning?" }
      - { speaker: Selin, text: "The wind is stronger in the morning, so the sea is going to be choppy. It's going to be calmer in the evening." }
      - { speaker: Henrik, text: "OK. We could go to the market in the morning, while it's cool." }
      - { speaker: Selin, text: "Good idea. And after lunch we could go to the beach and sit in the shade." }
      - { speaker: Henrik, text: "And if it rains?" }
      - { speaker: Selin, text: "It isn't going to rain. But if it does, we'll go to the spa." }
      - { speaker: Henrik, text: "Fine. Let's do the boat trip on Sunday." }
      - { speaker: Selin, text: "Yes, Sunday is going to be calmer." }
