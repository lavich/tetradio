      - { speaker: Tess, text: "A gig on Friday? Sounds good. Who's playing?", audio: t14-c2/invite-lines-2.mp3 }
      - { speaker: Tess, text: "I'm up for it. What time does it kick off?", audio: t14-c2/invite-lines-3.mp3 }
