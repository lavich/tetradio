  - type: speaking
    id: invite-scene
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы встретили Тесс, с которой познакомились на новоселье у Лео. Ответьте, как дела, и пригласите её на концерт в пятницу: играет группа вашего знакомого, начало в девять, зал рядом с вокзалом. Скажите, что вам подходит и опоздание. Согласитесь обменяться контактами: у вас есть Instagram, номер телефона можно прислать позже. В конце пообещайте прислать адрес. 6 реплик, вся ваша часть — 40–60 секунд.
    seconds: 60
    model: |-
      Tess: Hi! Good to see you again. How's your week going?
      You: Good, thanks. Are you up for a gig on Friday? A friend of mine is in the band.
      Tess: A gig on Friday? Sounds good. Who's playing?
      You: A local band called The Lanterns. It's a small place near the station.
      Tess: I'm up for it. What time does it kick off?
      You: At nine. The first band starts a bit later, so there's no rush.
      Tess: Nine's a bit tricky. I'm seeing a friend until half past eight, so I might be running a bit late. Is that OK?
      You: That's fine. Just text me when you get there.
      Tess: Great. Shall we swap contacts? Are you on Instagram?
      You: Yes, I am. I'll send you my username now, and I can send you my number later.
      Tess: Found you. I'll add you. Text me the address, and I'll text you when I get there.
      You: I'll send it tonight. See you on Friday.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-две фразы
      - "Приглашение — Are you up for a gig on Friday?; время — At nine"
      - "На возможное опоздание ответили спокойно: That's fine. Just text me when you get there"
      - "Обмен контактами — Yes, I am; назвали ровно то, что готовы дать (имя в Instagram, номер позже)"
      - "Договорённость — I'll send it tonight; тон дружеский, без нажима"
  - type: reading
    id: profile
    title: Свидание — анкета и переписка
    text: |-
      ISLA, 29 — EDINBURGH
      Bio: I work in a bookshop. I love hiking and trying new food. Bad at karaoke, but I keep trying. Looking for someone genuine who can make me laugh. tbh I'm not sure what I'm looking for, so no pressure.
      Ask me about: my trip to Portugal.
      Profile verified.

      CHAT: ISLA AND NOAH

      Noah: Hi Isla! Your bio made me laugh. What's your go-to karaoke song?
      Isla: Ha, thanks. Anything by ABBA. hbu?
      Noah: Anything slow, so nobody can tell I can't sing. Fancy a drink sometime?
      Isla: I'd love to. Let's meet somewhere busy, and I'll text a friend where I am, if that's OK.
      Noah: Of course, that makes sense. How about the café by the station on Thursday at six?
      Isla: Thursday works. I'll make my own way there. See you at six.
    glosses:
      - { text: Bio, russian: "краткое описание о себе в анкете" }
      - { text: a bookshop, russian: "книжный магазин" }
