  - type: speaking
    id: bar-scene
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы пришли в бар с тремя друзьями и заказываете первый круг. Бармен — Дейв. Друзьям: две пинты pale ale и бокал красного вина. Себе — безалкогольный напиток, лимонад с лаймом (a lime and soda). Попросите открыть счёт (a tab), скажите, что столик у окна. В конце спокойно откажитесь от следующего круга: вы предпочитаете воду. 6 реплик, вся ваша часть — 40–60 секунд.
    seconds: 60
    model: |-
      Dave: Hi there. What can I get you?
      You: Hi. Two pints of pale ale and a glass of red wine, please.
      Dave: Sure. Anything for yourself?
      You: Just a soft drink for me, please. A lime and soda.
      Dave: Lime and soda, no problem. Are you paying now, or shall I open a tab?
      You: Could you open a tab, please?
      Dave: A tab it is. It's busy tonight, so the drinks might take a few minutes.
      You: No problem. We're at the table by the window.
      Dave: Here you go. By the way, last orders are at eleven. Shall I get you another round later?
      You: I'm good, thanks. I'll pass on the next round. I'd rather stick to water.
      Dave: Fair enough. Just shout if you change your mind.
      You: Thanks, I will. Cheers!
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-две фразы
      - "Заказ — вежливо, с please: Two pints of pale ale and a glass of red wine, please"
      - "Себе — безалкогольное: Just a soft drink for me; счёт — Could you open a tab, please?"
      - "Отказ от следующего круга — коротко и без извинений: I'm good, thanks / I'll pass on the next round / I'd rather stick to water"
      - Спокойный дружелюбный тон, без долгих пауз
  - type: reading
    id: hostel
    title: Знакомство — пост и чат хостела
    text: |-
      NOTICEBOARD — THE BUNK HOUSE, EDINBURGH

      Saturday: free walking tour at 10:00 from the lobby. Back by 12:30.
      Sunday: day trip to the Highlands, £35. Book at reception by 6 pm tonight.
      Every night at 8: social evening in the common room. Quiet hours start at 11 pm: please keep the noise down in the dorms.

      CHAT: DORM 4

      Ben: Anyone up for the walking tour tomorrow? I'm heading there at ten.
      Mei: Count me in. It's my first time in Edinburgh, and I've never done a walking tour.
      Sofia: I'm out, sorry. I'm doing the Highlands trip on Sunday, so I'm having a lazy day tomorrow.
      Ben: Fair enough. Are you two around tonight? There's a quiz in the common room.
      Mei: I'll be there. I've just got back from the shop, so I've got snacks.
      Sofia: Save me a seat. I'll come down after dinner.
      Ben: Will do. It starts at eight.
    glosses:
      - { text: the Highlands, russian: "горная часть Шотландии" }
      - { text: the lobby, russian: холл }
      - { text: Quiet hours, russian: "часы тишины" }
      - { text: keep the noise down, russian: "не шуметь" }
      - { text: I'm out, russian: "я не иду" }
      - { text: a lazy day, russian: "день без планов, отдых" }
      - { text: a quiz, russian: "викторина" }
      - { text: Will do, russian: "хорошо, сделаю" }
  - type: exercise
    id: hostel-q
    about: hostel
    graded: true
    title: Чтение — пост и чат хостела
    instruction: Прочитайте пост и чат и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What time does the free walking tour start?
        options: ["at 10:00", "at 12:30", "at 8:00"]
        answer: "at 10:00"
        explanation: "Free walking tour at 10:00 from the lobby; 12:30 — когда тур заканчивается, 8 — вечер в общей комнате (модуль t08)."
      - id: q2
        prompt: What does Mei say she has never done?
        options:
          - the walking tour
          - a trip to the Highlands
          - a quiz
        answer: the walking tour
        explanation: "It's my first time in Edinburgh, and I've never done a walking tour — в городе впервые, на экскурсии ещё не была: present perfect для опыта (модуль t08)."
      - id: q3
        prompt: Why is Sofia not joining the walking tour?
        options:
          - She wants a lazy day before her trip on Sunday.
          - She has already done the tour.
          - She has to work tomorrow.
        answer: She wants a lazy day before her trip on Sunday.
        explanation: "I'm out, sorry — я не иду; на воскресенье у неё поездка в Хайленды, поэтому завтра день без планов (модуль t09)."
      - id: q4
        prompt: When must you book the day trip to the Highlands?
        options:
          - by 6 pm tonight
          - by 10 am tomorrow
          - on Sunday morning
        answer: by 6 pm tonight
        explanation: "Book at reception by 6 pm tonight — на ресепшене до шести вечера сегодня (модуль t08)."
