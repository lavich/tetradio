  - type: speaking
    id: no-scene
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы на свидании с Ноа, вечер подходит к концу. Откажитесь от провожания до вокзала: вы доберётесь сами. Откажитесь ещё от одного напитка. На вопрос, хотите ли вы увидеться снова, ответьте «нет» коротко и доброжелательно, без подробных причин. Ответьте на пожелание Ноа и тепло попрощайтесь. 5 реплик, вся ваша часть — 30–50 секунд.
    seconds: 50
    model: |-
      Noah: I've had a really nice evening. Can I walk you to the station?
      You: Thanks, but I'll make my own way home.
      Noah: No worries, totally fine. Would you like another drink before you go?
      You: No, thanks, I'm good.
      Noah: Fair enough. Can I ask you something? Would you like to see me again?
      You: I had a really nice time, but I don't think we're a match. I hope that's OK.
      Noah: Thanks for telling me. I hope you get home safe.
      You: Thanks, you too. Thank you for the evening.
      Noah: Take care.
      You: Take care.
    criteria:
      - Ответили на все пять реплик по порядку, каждая — одна фраза или две
      - "Отказ от провожания — коротко: Thanks, but I'll make my own way home; причину не называли"
      - "Отказ от встречи — прямо и доброжелательно: I don't think we're a match / I'd rather not"
      - "Не извинялись многократно и не придумывали отговорок; тон спокойный"
      - "Закончили тепло: Thank you for the evening / Take care"
