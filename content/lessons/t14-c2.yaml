title: Вечер
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как устроена контрольная точка
    body: |-
      Это контрольная точка второй ступени курса — модули t08–t14. Один вечер подряд: бар с компанией, знакомство в хостеле, приглашение на вечеринку, свидание, а на следующий день — переписка. Около 70 минут. Делайте её за один раз, без словаря, таблиц и карточек: результат показывает, что уже усвоено. Новых карточек здесь нет — только пройденное в модулях; редкие слова в текстах подписаны.

      **Чтение и аудирование** проверяются автоматически. Для каждого навыка считается доля правильных ответов и сравнивается с порогом **60 %** — по нему курс считает навык сданным. Каждое аудио звучит два раза. Говорят быстро, с сокращениями (gonna, dunno) и разговорными оборотами; ловите главное, каждое слово понимать не нужно. В заданиях на аудирование открывайте текст кнопкой «Открыть текст» только после ответов, иначе результат ничего не покажет; реплики перед ролевыми сценами, наоборот, открывайте после двух прослушиваний и держите перед глазами. В вопросах с выбором верен один вариант.

      **Ролевые сцены.** Сцен пять, в каждой сначала звучат только реплики собеседника, по порядку. Послушайте их два раза, откройте текст и держите перед глазами. Затем запишите свою часть: прочитайте реплику, ответьте на неё одной-двумя фразами, переходите к следующей. В трёх сценах нужно отказать (от следующего круга, от провожания, от новой встречи), в одной — принять отказ. Отказ короткий, причину называть не нужно; ответ на отказ тоже короткий и без уговоров.

      **Письмо и речь** — самопроверка: в итог они не входят. Сначала напишите текст и запишите ответ сами, только потом откройте образец и отметьте, какие критерии выполнены. Если выполнено меньше 60 % критериев, считайте навык пока не сданным.

      **Навык ниже порога** — повод повторить модули, которые названы в пояснениях к ошибкам: чтение — t08, t09, t12 и t14 (хостел, анкеты, переписка), аудирование — t10, t11 и t13 (бар, голосовые, свидание), письмо — t11, t13 и t14 (переписка), речь — сцены из t10–t13 и банки фраз третьих уроков. После повторения пройдите точку ещё раз.

      **Темп.** Это последняя точка курса. Если все навыки не ниже порога, курс закончен; быструю речь в шумном баре помогает понимать практика вживую; к карточкам и голосовым сообщениям можно возвращаться понемногу. Если навык ниже порога, сначала повторите его модули в прежнем темпе.
    table:
      columns:
        - часть
        - задания
        - время
      rows:
        - - Бар
          - разговор в баре, заказ на компанию и отказ от раунда
          - 12 мин
        - - Знакомство
          - пост и чат хостела, small talk с переспросом
          - 12 мин
        - - Приглашение
          - голосовые Лео и Тесс, пригласить и обменяться контактами
          - 12 мин
        - - Свидание
          - анкета и переписка, разговор в кафе, сказать «нет», ответить на «нет»
          - 18 мин
        - - Беседа
          - пять вопросов по банку ответов ступени
          - 3 мин
        - - Следующий день
          - переписка, сообщение 60–100 слов, грамматика ступени
          - 15 мин
