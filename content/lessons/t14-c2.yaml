  - type: exercise
    id: bar-q
    about: bar
    graded: true
    title: Аудирование — бар
    instruction: Прослушайте разговор два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Why is Zoe having a soft drink?
        options:
          - She is driving.
          - She doesn't like wine.
          - She has a headache.
        answer: She is driving.
        explanation: "Hang on, I'm driving — за рулём: поэтому лимонад с лаймом (модуль t10)."
      - id: q2
        prompt: What does Jack order?
        options:
          - a pint of pale ale
          - a half of pale ale
          - a glass of red wine
        answer: a pint of pale ale
        explanation: "Dave называет pale ale на кране (on tap), Jack отвечает A pint, cheers — пинту (a pint) (модуль t10)."
      - id: q3
        prompt: How will the group pay?
        options:
          - on a tab
          - by card at the bar
          - separately, one by one
        answer: on a tab
        explanation: "Can we open a tab? — Sure, a tab it is: заказ записывают на счёт, платят в конце (модуль t10)."
      - id: q4
        prompt: When are last orders?
        options: [at eleven, at ten, at midnight]
        answer: at eleven
        explanation: "Eleven — последний заказ в одиннадцать; Dave принесёт напитки к столику (модуль t10)."
