  - type: explanation
    id: next-how
    title: Сообщение на следующий день
    body: |-
      Назавтра после вечера пишут короткое сообщение. Объём — 60–100 слов, регистр дружеский: короткие предложения и сокращения (I'm, I'd).

      Что нужно: поблагодарить за вечер (**I had a really nice time**), вспомнить одну подробность в past simple (**I got home after midnight**), предложить встречу и время (**I'm thinking of trying the new Thai place on Saturday at half past seven**), задать один вопрос (**Are you free?**) и оставить место для другого ответа (**If you'd rather do something else, just let me know**). Собеседник может сказать «нет».
  - type: writing
    id: next-day
    register: friendly
    prompt: "Вы ходили на концерт с Тесс (сцена 3) и обменялись контактами. Напишите ей на следующий день после концерта (60–100 слов): поблагодарите за вечер, вспомните одну подробность в past simple, предложите встретиться в субботу и назовите время, задайте один вопрос и оставьте ей возможность выбрать другое."
    words: { min: 60, max: 100 }
    model: |-
      Hi Tess, thanks for coming to the gig last night. I had a really nice time, and I'm glad you liked the band. The first act started late, so I got home after midnight, but it was fun. I'm thinking of trying the new Thai place near the station on Saturday at half past seven. Are you free? If you'd rather do something else, just let me know. I'll book a table once I hear from you. Text me when you can.
    criteria:
      - "60–100 слов; есть благодарность, подробность, предложение, время и один вопрос"
      - "Подробность вчерашнего вечера — past simple: I got home after midnight"
      - "Предложение с временем (I'm thinking of… on Saturday at half past seven), один вопрос (Are you free?) и место для другого ответа: If you'd rather…, just let me know"
      - "Дружеский регистр: короткие предложения, сокращения (I'm, I'd), фразы ступени"
      - "Без нажима: не просят ответить немедленно и не повторяют просьбу"
  - type: exercise
    id: grammar
    graded: true
    title: Язык ступени
    instruction: Вставьте слово. Три слова лишние.
    format: gap
    bank: [ever, do, have, isn't, gonna, rather, up, had, since, just, am, about, has]
    items:
      - id: g1
        prompt: "Have you ___ been to Lisbon? — No, never."
        answer: ever
        explanation: "Вопрос об опыте — Have you ever been…? (модуль t08)."
      - id: g2
        prompt: "I love live music. — So ___ I."
        answer: do
        explanation: "Согласие с утверждением — So do I; вспомогательный глагол повторяет время: love — present simple, поэтому do (модуль t08)."
      - id: g3
        prompt: "I've never tried haggis. — Neither ___ I."
        answer: have
        explanation: "Согласие с отрицанием — Neither have I: вспомогательный глагол из реплики, present perfect (модуль t08)."
      - id: g4
        prompt: "It's a great band, ___ it?"
        answer: isn't
        explanation: "Разделительный вопрос к утверждению с is — isn't it? (модуль t09)."
      - id: g5
        prompt: "We're ___ grab a drink. Do you want one?"
        answer: gonna
        explanation: "Gonna — разговорное going to; в письме и на работе — going to (модуль t09)."
      - id: g6
        prompt: "I'd ___ stay in than go out tonight."
        answer: rather
        explanation: "Would rather + глагол без to: I'd rather stay in (модули t10 и t13)."
      - id: g7
        prompt: "Are you ___ for a walk after dinner?"
        answer: up
        explanation: "Are you up for…? — приглашение: хотите, не против (модуль t11)."
      - id: g8
        prompt: "If I ___ more time, I'd stay another week."
        answer: had
        explanation: "Second conditional — if + past simple, would + инфинитив: If I had more time, I'd stay (модуль t13)."
      - id: g9
        prompt: "We haven't spoken ___ March."
        answer: since
        explanation: "Since называет начало периода: since March; for — его длину (модуль t14)."
      - id: g10
        prompt: "I landed an hour ago. I've ___ got back from Portugal."
        answer: just
        explanation: "Только что — just с present perfect: I've just got back (модуль t14)."
