  - type: speaking
    id: meet-scene
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы вечером в общей комнате хостела. За столом сидят Бен и Мэй, которых вы видите впервые. Поблагодарите за место, представьтесь и спросите, можно ли присоединиться, затем скажите, откуда вы родом. В Шотландии вы ещё не были, но давно хотели. Первую реплику Мэй про Arthur's Seat вы не успели понять — вежливо переспросите. Подъём в шесть утра для вас рано: предложите восемь. В конце попрощайтесь. 6 реплик, вся ваша часть — 40–60 секунд.
    seconds: 60
    model: |-
      Ben: Hi, there's a free seat here. I'm Ben, and this is Mei.
      You: Hi, nice to meet you. Mind if I join you?
      Mei: Hi! Where are you from originally?
      You: I'm from Kazan, in Russia. I'm travelling on my own for a week.
      Ben: Nice. Have you ever been to Scotland before?
      You: No, I've never been, but I've always wanted to come.
      Mei: We're gonna do the, er, the Arthur's Seat thing tomorrow, up at six, if you're up for it.
      You: Sorry, what? Could you say that again?
      Mei: Sure. We're going up Arthur's Seat tomorrow at six in the morning. Are you up for it?
      You: I'd love to, but six is a bit early for me. Could we say eight?
      Ben: Eight works for us. See you in the lobby, then.
      You: Great, see you then. It was nice meeting you.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-две фразы
      - "Просьба сесть и знакомство — Mind if I join you?; откуда — I'm from…"
      - "Опыт — present perfect: I've never been, but I've always wanted to…"
      - "Переспросили вежливо — Sorry, what? / Could you say that again? — и не стали гадать"
      - "Предложили другое время — Could we say eight? — и тепло попрощались: It was nice meeting you"
  - type: listening
    id: invite
    title: Приглашение — голосовые Лео и Тесс
    plays: 2
    transcript:
      - { speaker: Leo, text: "Hi Tess, it's Leo. We're having a few people over on Saturday, a housewarming, nothing fancy. It kicks off at eight, but come whenever.", audio: t14-c2/invite-1.mp3 }
      - { speaker: Leo, text: "Oh, and it's BYOB, so bring something to drink. If you're not drinking, juice is fine. Let me know by Thursday, yeah?", audio: t14-c2/invite-2.mp3 }
      - { speaker: Tess, text: "Hey Leo, got your message, thanks. I'm up for it, honestly, but I dunno about eight. I'm at a friend's birthday dinner until nine, so I'll be running a bit late.", audio: t14-c2/invite-3.mp3 }
      - { speaker: Tess, text: "Is it OK if I bring a plus-one? My cousin's in town. Anyway, count me in. Send me the address again, and I'll text you when I get there.", audio: t14-c2/invite-4.mp3 }
  - type: exercise
    id: invite-q
    about: invite
    graded: true
    title: Аудирование — голосовые сообщения
    instruction: Прослушайте голосовые сообщения два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What kind of party is it?
        options:
          - a housewarming
          - a farewell party
          - a gig
        answer: a housewarming
        explanation: "A housewarming, nothing fancy — новоселье без пышности; gig — концерт (модуль t11)."
      - id: q2
        prompt: What does Leo say about drinks?
        options:
          - Guests bring their own, and juice is fine.
          - Leo provides all the drinks.
          - There are no drinks at the party.
        answer: Guests bring their own, and juice is fine.
        explanation: "It's BYOB, so bring something to drink. If you're not drinking, juice is fine: каждый приносит своё, безалкогольное тоже подходит (модуль t11)."
      - id: q3
        prompt: Why will Tess be late?
        options:
          - She is at a friend's birthday dinner until nine.
          - She is at work until nine.
          - She is meeting her cousin at the station.
        answer: She is at a friend's birthday dinner until nine.
        explanation: "I'm at a friend's birthday dinner until nine, so I'll be running a bit late — до девяти она на дне рождения друга (модуль t11)."
      - id: q4
        prompt: Who does Tess want to bring?
        options: [her cousin, her flatmate, her boss]
        answer: her cousin
        explanation: "Is it OK if I bring a plus-one? My cousin's in town — приходит с двоюродным братом или сестрой (модуль t11)."
      - id: q5
        prompt: What does Tess ask Leo to send?
        options:
          - the address again
          - a photo of the flat
          - a list of guests
        answer: the address again
        explanation: "Send me the address again, and I'll text you when I get there — адрес ещё раз, а сообщение она пришлёт сама (модуль t11)."
  - type: listening
    id: invite-lines
