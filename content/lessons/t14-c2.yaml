  - type: speaking
    id: answer-scene
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы на свидании с Айлой и хотели предложить встретиться снова, но она говорит первой. Ваша задача — принять отказ спокойно: коротко, без «почему», без уговоров и без предложения «давай хотя бы…». Поблагодарите за то, что она сказала прямо, и за вечер, не настаивайте на проводах и пожелайте ей хорошо добраться. 5 реплик, вся ваша часть — 30–50 секунд.
    seconds: 50
    model: |-
      Isla: I've had a nice evening, thank you. Before you say anything, I need to be honest with you.
      You: Of course. Go ahead.
      Isla: I'm not feeling a spark, sorry. I don't think we're a match. I hope that's okay.
      You: No worries, totally fine. Thanks for telling me.
      Isla: Thank you for understanding. I really liked talking to you about Lisbon.
      You: Me too. I had a really nice time.
      Isla: I'm going to get a taxi now, thanks. I'll make my own way home.
      You: Sure. I hope you get home safe.
      Isla: You too. Take care.
      You: Take care. It was good to meet you.
    criteria:
      - Ответили на все пять реплик по порядку, каждая — одна фраза или две
      - "Отказ принят сразу: No worries, totally fine; без нажима, без «почему» и без повторной просьбы"
      - "Поблагодарили за сказанное прямо и за вечер: Thanks for telling me / I had a really nice time"
      - "Не настаивали на проводах: после её реплики про такси — только пожелание добраться"
      - Тон спокойный и дружелюбный, без обиды и без шуток про отказ
  - type: explanation
    id: talk-how
    title: Беседа по банку ответов
    body: |-
      Теперь беседа 2–3 минуты. Вам задают пять вопросов из банка ответов ступени; в третьих уроках модулей вы уже готовили свои версии. Отвечайте своими словами: открыть можно только опорные фразы. На каждый вопрос — одна-три фразы.

      В ответах пригодятся пять приёмов ступени: present perfect для опыта (**I've never been to…**), present continuous для планов (**I'm meeting… on Saturday**), **would rather**, second conditional (**If I could…, I'd…**) и готовые фразы связи (**Let's catch up properly soon**). Отвечайте о себе: если вопрос неудобен, скажите **I'd rather not say** и переходите к следующему.
  - type: speaking
    id: talk
    part: interview
    prompt: "Вам задают пять вопросов: «What have you been up to lately?», «Have you ever been to Scotland?», «What are you doing next weekend?», «Would you rather stay in or go out on a Friday?», «If you could live anywhere, where would it be?» Ответьте на каждый одной-тремя фразами: опыт — в present perfect, планы — в present continuous, выбор — с would rather, мечта — в second conditional. Весь ответ — 2–3 минуты."
    seconds: 180
    model: "I've been working a lot lately, but I've also started learning to play the guitar. No, I've never been to Scotland, but I'd love to go. Next weekend I'm meeting a friend on Saturday, and we're going for a walk by the river. On a Friday I'd rather stay in: I'm usually tired after the week, so I cook and watch a film. If I could live anywhere, I'd choose Lisbon. I'd have coffee by the sea every morning, and I'd still stay in touch with my friends by voice notes."
    criteria:
      - Ответили на все пять вопросов, каждый — одной-тремя фразами
      - "Опыт — present perfect: I've been working…, I've never been to…"
      - "План — present continuous: I'm meeting… on Saturday"
      - "Выбор — would rather + инфинитив без to; мечта — If I could…, I'd…"
      - Спокойный темп, без долгих пауз; на втором дубле — меньше повторов
  - type: reading
    id: morning
    title: Следующий день — переписка
    text: |-
      CHAT: LEO AND TESS, THE MORNING AFTER

      Leo: Morning! Thanks for coming last night. Did you get home OK?
      Tess: Yes, I got a taxi at midnight. I had a really nice time. Sorry I was late.
      Leo: No worries. You missed the karaoke, though. Zoe sang for ten minutes.
      Tess: Ha! I'm gutted. Next time I'll come early. What are you doing on Sunday? I'm free after two.
      Leo: I'm helping my sister move in the morning, but I'm free in the evening. Shall we say seven?
      Tess: Seven works. I'll bring the photos from the party.
      Leo: Great. Text me when you leave.
    glosses:
      - { text: move, russian: "переехать в другую квартиру" }
