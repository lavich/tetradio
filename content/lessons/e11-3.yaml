  - type: writing
    id: plan
    register: formal
    prompt: "Напишите план действий при вымышленном инциденте (80–120 слов): когда его открывают, первые шаги, кто и когда эскалирует, как сообщают заинтересованным сторонам, что делают после. Используйте if, unless и in case. Описывайте процесс, не называйте людей и компании."
    words: { min: 80, max: 120 }
    model: |-
      Incident plan: payment errors after a release. If the error rate rises above two percent after a release, the on-call engineer will open an incident and inform the team lead. First, the team will check the alerts and decide whether the change caused the problem. If it did, the team will roll it back or switch off the new feature with the kill switch. Unless the cause is clear within thirty minutes, the team lead will escalate the incident to the engineering manager. Stakeholders will receive an update every thirty minutes, in case the problem lasts longer. Afterwards, the team will write a postmortem and add a check to the pipeline.
    criteria:
      - 80–120 слов, есть условие открытия инцидента, первые шаги, эскалация, сообщение заинтересованным сторонам и шаги после
      - Использованы if с настоящим временем и will, unless и in case
      - Названы сроки или пороги (минуты, процент ошибок)
      - План описывает роли и процесс, без имён и обвинений
      - Формальный стиль без сокращений
      - Цифры вымышленные, названий компаний нет
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Одиннадцатый ответ вашего **банка ответов** — вопрос **What would you do if the release broke production?** К нему добавляется второй вопрос: **What would you do if two deadlines clashed?** Первый ответ занимает до двух минут, второй — до минуты.

      1) Разложите первый ответ по пяти шагам: вступление, масштаб, варианты и риск, решение и люди, что потом. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: названо первое действие, есть оценка риска, решение согласовано, нет поиска виноватого. 4) Для второго вопроса назовите, что вы уточните, как сопоставите риск и срок и с кем обсудите решение; используйте would и хотя бы одно из unless, in case, as long as.

      Сцена в конце урока строится на серии вопросов «а если…». Реплики записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: release
    part: interview
    prompt: "Интервьюер спрашивает: «What would you do if the release broke production?» Ответьте за 120 секунд: первое действие, масштаб, варианты и риск, с кем вы согласуете решение, что вы сделаете потом."
    seconds: 120
    model: "I'd take it one step at a time. First, I'd make sure I understand the impact: how many users are affected, and how severe the problem is. My first priority would be to limit the damage. If the release caused it, I would roll it back first, because that is the fastest way to restore the service. If I couldn't roll it back, I would turn the feature off with a kill switch or fix forward, but I wouldn't make that decision on my own. I'd let my manager and the stakeholders know what was happening, and I'd ask for a second opinion before I changed production again. Worst case, some users would see errors for an hour, so I would also keep a backup plan in case the first fix failed. Once things calmed down, I'd do a proper review: I'd write a postmortem and add a check to the pipeline so that it couldn't happen again. That's my plan, but I'm open to other ideas."
    criteria:
      - Назван первый шаг — выяснить масштаб и ограничить ущерб
      - Есть second conditional с would в главных частях
      - Названо наихудшее последствие или риск
      - Названо, с кем согласуется решение, кому и когда сообщают
      - Использована одна конструкция с unless, in case или as long as
      - Названо, что делают после, — разбор и изменение процесса
      - Использованы не меньше трёх фраз урока
      - Нет поиска виноватого, названий компаний и людей
      - Ответ укладывается в 120 секунд
  - type: speaking
    id: deadlines
    part: monologue
    prompt: "Интервьюер уточняет: «What would you do if two deadlines clashed?» Ответьте за 60 секунд: что вы уточните, как сопоставите риск и срок, с кем обсудите решение."
    seconds: 60
    model: "If two deadlines clashed, I'd ask which one matters more to the business and what would happen if the other one slipped. It would depend on how many users were affected. I'd weigh the risk against the deadline, and I'd explain the trade-off to my manager, so that the team could decide together. Unless both were equally urgent, I would start with the more important one and tell the other stakeholders early. If I couldn't deliver both, I'd cut back the scope instead of cutting corners."
    criteria:
      - Названо, что уточняется до решения
      - Есть second conditional и would
      - Названо, как сопоставляются риск и срок
      - Решение обсуждается с руководителем или командой
      - Есть unless, in case или as long as
      - Нет обвинения коллег
      - Ответ укладывается в 60 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
    transcript:
      - { speaker: Anders, text: "Thanks for joining. Let's try some what-if questions. What would you do if the release broke production?" }
      - { speaker: Anders, text: "Mm-hm. And what would you do if you couldn't roll it back?" }
      - { speaker: Anders, text: "I see. What would you do if two deadlines clashed?" }
      - { speaker: Anders, text: "Okay. And what would you do if you weren't sure which option was safer?" }
      - { speaker: Anders, text: "Thank you. That was a clear way of thinking it through." }
  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на техническом собеседовании, вопросы задаёт Anders, старший инженер. Прослушайте его реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику назовите первые шаги при сбое после релиза. На вторую скажите, что вы сделали бы, если откат невозможен. На третью — как выбрали бы между двумя сроками. На четвёртую — как вы действуете, когда не уверены в безопасном варианте. На последнюю поблагодарите. Вся ваша часть — 120 секунд, каждая реплика — две-четыре фразы.
    seconds: 120
    model: |-
      Anders: Thanks for joining. Let's try some what-if questions. What would you do if the release broke production?
      You: I'd make sure I understand the impact first. My first priority would be to limit the damage, so if the release caused it, I would roll it back. I'd also let my manager know what was happening.
      Anders: Mm-hm. And what would you do if you couldn't roll it back?
      You: I'd look for a safer option, like turning the feature off with a kill switch or fixing forward. If I couldn't fix it within an hour, I would escalate it. I wouldn't make that decision on my own.
      Anders: I see. What would you do if two deadlines clashed?
      You: I'd ask which one matters more to the business. It would depend on how many users were affected. Then I'd explain the trade-off to my manager and let the team decide.
      Anders: Okay. And what would you do if you weren't sure which option was safer?
      You: I'd ask for a second opinion and test the option on a small group of users first, in case something went wrong. As long as I could switch it off quickly, I would feel comfortable.
      Anders: Thank you. That was a clear way of thinking it through.
      You: Thank you for the questions. That's my plan, but I'm open to other ideas.
    criteria:
      - Ответили на все пять реплик по порядку, каждая — две-четыре фразы
      - В первой реплике названы масштаб, первый приоритет и сообщение руководителю
      - Во второй реплике названо альтернативное действие и эскалация
      - В третьей реплике решение сопоставлено с риском и согласовано с командой
      - В четвёртой реплике есть второе мнение или осторожный выпуск
      - Использованы would и одна конструкция с unless, in case или as long as
      - В конце есть благодарность
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "If I had asked for a review, we ___ the bug. (прошлое, которое не случилось)"
        options: [would have found, would find, will find]
        answer: would have found
        explanation: Conditional 3 — would have и третья форма глагола.
      - id: q2
        prompt: "We ___ on the migration for three weeks when the problem appeared. (процесс шёл до момента)"
        options: [had been working, have been working, will be working]
        answer: had been working
        explanation: Длительное действие до момента в прошлом — past perfect continuous.
      - id: q3
        prompt: "The incident ___ by the on-call engineer. (был замечен)"
        options: [was noticed, noticed, was noticing]
        answer: was noticed
        explanation: Действие совершается над инцидентом, поэтому нужен passive.
      - id: q4
        prompt: "I ___ at this company since 2022. (до сих пор)"
        options: [have worked, worked, am working]
        answer: have worked
        explanation: Since и связь с настоящим — present perfect.
      - id: q5
        prompt: "By the time I joined the call, the team ___ the cause. (уже нашла)"
        options: [had found, finds, was find]
        answer: had found
        explanation: Более раннее событие в прошлом стоит в past perfect — had и третья форма глагола.
      - id: q6
        prompt: "Could you tell me when ___ start? (вежливый вопрос)"
        options: [I could, could I, I can to]
        answer: I could
        explanation: В косвенном вопросе порядок слов как в утверждении.
