blocks:
  - type: explanation
    id: scheme
    title: Ответ на «а если…» в пяти шагах
    body: |-
      Вопрос **What would you do if the release broke production?** проверяет, как вы рассуждаете в нештатной ситуации. Единого верного ответа у него нет: интервьюер слушает порядок действий, оценку риска и то, с кем вы согласуете решение. Ответ укладывается примерно в две минуты и идёт по шагам, на каждом хватает одной-трёх фраз.

      **1. Вступление.** Скажите, что пойдёте по шагам: **I'd take it one step at a time.** Если нужны данные, назовите их: **Let me check one thing before I decide.**

      **2. Масштаб.** Сначала выясните, что произошло: **First, I'd make sure I understand the impact.** Затем назовите первый приоритет: **My first priority would be to limit the damage.**

      **3. Варианты и риск.** Назовите два-три варианта и сопоставьте их: **I'd weigh the risk against the deadline.** Назовите наихудший исход: **Worst case, we'd lose an hour of data.** Условия задайте через **as long as**, **unless** и **in case**: **As long as the data is correct, I'd go ahead.**

      **4. Решение и люди.** Скажите, с кем вы согласуете решение: **I'd ask for a second opinion before deciding.** Если решение не за вами, назовите, кому вы его передадите: **If I can't fix it quickly, I'll escalate it.**

      **5. Что потом.** Назовите, как вы закрываете тему: **I'd do a proper review once things calmed down.** Завершите открытым вопросом: **That's my plan, but I'm open to other ideas.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - вступление
          - 5–10 секунд
          - I'd take it one step at a time.
        - - масштаб
          - 20–25 секунд
          - First, I'd make sure I understand the impact.
        - - варианты и риск
          - 30–40 секунд
          - I'd weigh the risk against the deadline.
        - - решение и люди
          - 20–25 секунд
          - I'd ask for a second opinion before deciding.
        - - что потом
          - 15–20 секунд
          - I'd do a proper review once things calmed down.
  - type: explanation
    id: safe-decision
    title: Какое решение называть и как о нём говорить
    body: |-
      В вопросах «а если…» интервьюер проверяет, можно ли доверить вам решение в нештатной ситуации. Для этого в ответе есть действия, которые видны и проверяемы: вы сообщаете о проблеме, не скрываете её, согласуете решение с теми, кого оно касается, и оставляете запись о том, что решили. Ответ «я бы всё исправил тихо» таких действий не содержит.

      Говорите о процессе: сначала причина и масштаб, затем действия; вопрос о том, кто допустил сбой, не обсуждайте. Не обещайте невозможного (*I'd fix everything in five minutes*) и не описывайте героические ночи в одиночку. Если решение влияет на других, скажите, что вы вовлечёте дежурного и руководителя. Если данных не хватает, скажите об этом и назовите, что проверите.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - I'd fix it quietly and hope nobody notices
          - I'd tell my manager and the team what happened
          - проблему не скрывают
        - - I'd find out who broke it
          - I'd find out what allowed it to happen
          - говорят о процессе
        - - I'd stay up all night and do it alone
          - I'd ask the on-call engineer to help
          - решение разделяют с командой
        - - I'd just ship it, it will be fine
          - I'd weigh the risk and ask for a second opinion
          - риск оценивают до решения
        - - I'd skip the tests to save time
          - I'd cut back the scope and keep the tests
          - срок защищают сокращением объёма
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы начинаете отвечать на вопрос «а если…» и говорите, что пойдёте по шагам. Какая фраза подходит?
        options:
          - I'd take it one step at a time.
          - That's my plan, but I'm open to other ideas.
          - Worst case, we'd lose an hour of data.
        answer: I'd take it one step at a time.
        explanation: Ответ открывает фраза о порядке действий.
      - id: q2
        prompt: Вы называете первое действие — выяснить, как велик сбой. Какая фраза подходит?
        options:
          - First, I'd make sure I understand the impact.
          - As long as the data is correct, I'd go ahead.
          - It's a judgement call, but here's what I'd do.
        answer: First, I'd make sure I understand the impact.
        explanation: Первый шаг — выяснить масштаб последствий.
      - id: q3
        prompt: Вы называете наихудший исход. Какая фраза подходит?
        options:
          - Worst case, we'd lose an hour of data.
          - If it were up to me, I'd wait a day.
          - Let me check one thing before I decide.
        answer: Worst case, we'd lose an hour of data.
        explanation: Worst case с запятой вводит наихудший исход.
      - id: q4
        prompt: Вы говорите, что продолжили бы работу при условии, что данные верны. Какая фраза подходит?
        options:
          - As long as the data is correct, I'd go ahead.
          - I'd ask for a second opinion before deciding.
          - That's my plan, but I'm open to other ideas.
        answer: As long as the data is correct, I'd go ahead.
        explanation: As long as значит «при условии, что».
      - id: q5
        prompt: Вы говорите, что решение не только ваше, и просите мнение коллеги. Какая фраза подходит?
        options:
          - I'd ask for a second opinion before deciding.
          - It's a judgement call, but here's what I'd do.
          - If it were up to me, I'd wait a day.
        answer: I'd ask for a second opinion before deciding.
        explanation: Фраза называет действие до решения; в остальных вы уже называете своё решение.
      - id: q6
        prompt: Вы заканчиваете ответ и приглашаете к обсуждению. Какая фраза подходит?
        options:
          - That's my plan, but I'm open to other ideas.
          - Let me check one thing before I decide.
          - I'd take it one step at a time.
        answer: That's my plan, but I'm open to other ideas.
        explanation: Завершающая фраза — отдельный шаг ответа.
  - type: exercise
    id: decision-choice
    title: Формулировка для собеседования
    instruction: Выберите формулировку, которая подходит для ответа на собеседовании.
    format: choice
    items:
      - id: q1
        prompt: Вы описываете первый шаг при сбое после релиза.
        options:
          - I'd fix it quietly, and I'd hope nobody notices.
          - I'd tell my manager and the team what happened, and I'd limit the damage first.
          - I'd find out who made the change and ask them to fix it.
        answer: I'd tell my manager and the team what happened, and I'd limit the damage first.
        explanation: Образец называет сообщение о проблеме и первое действие; в остальных вариантах проблему скрывают или ищут виноватого.
      - id: q2
        prompt: Вы описываете, как вы принимаете рискованное решение.
        options:
          - I'd just ship it, because it will be fine.
          - I'd weigh the risk and ask for a second opinion.
          - I'd decide on my own, because asking takes too long.
        answer: I'd weigh the risk and ask for a second opinion.
        explanation: Образец показывает оценку риска и согласование; остальные варианты обходят оба шага.
      - id: q3
        prompt: Вы описываете, как защитите срок.
        options:
          - I'd skip the tests to save time.
          - I'd cut back the scope and keep the tests.
          - I'd work all night and do everything alone.
        answer: I'd cut back the scope and keep the tests.
        explanation: Образец сокращает объём работ и сохраняет проверки; в остальных вариантах страдает качество или здоровье команды.
      - id: q4
        prompt: Вы описываете, как закроете тему после инцидента.
        options:
          - I'd write a postmortem and add a check to the pipeline.
          - I'd forget about it, because the service works again.
          - I'd explain to everyone who caused it.
        answer: I'd write a postmortem and add a check to the pipeline.
        explanation: Образец называет разбор и изменение процесса; в остальных вариантах нет вывода или есть поиск виноватого.
