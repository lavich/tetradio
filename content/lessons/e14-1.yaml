  - type: exercise
    id: construction-choice
    title: Let me, I'm going to, I'll
    instruction: Выберите слово или фразу для пропуска.
    format: choice
    items:
      - id: q1
        prompt: "Вы объявляете план: сначала отсортируете входные данные."
        options:
          - I'm going to sort the input first.
          - I go to sort the input first.
          - I'm going to to sort the input first.
        answer: I'm going to sort the input first.
        explanation: План объявляют оборотом to be going to и глаголом в базовой форме; I go to — калька с русского, второе to лишнее.
      - id: q2
        prompt: ___ draw this on the board. (позвольте мне нарисовать)
        options:
          - Let me
          - Let me to
          - Let I
        answer: Let me
        explanation: После let стоит me и глагол без to.
      - id: q3
        prompt: I'm going to ___ with a brute-force solution.
        options:
          - start
          - to start
          - starting
        answer: start
        explanation: После going to стоит глагол в базовой форме.
      - id: q4
        prompt: ___ say the problem back in my own words. (позвольте мне пересказать)
        options:
          - Let me
          - I let
          - Let to me
        answer: Let me
        explanation: Let me + глагол — вежливое предупреждение о действии.
      - id: q5
        prompt: I'll think ___, so please stop me if you need to. (вслух)
        options:
          - out loud
          - on loud
          - loud out
        answer: out loud
        explanation: Устойчивое выражение think out loud — «думать вслух».
      - id: q6
        prompt: Let me ___ this with a small example. (проверить)
        options:
          - test
          - to test
          - testing
        answer: test
        explanation: После let me стоит глагол без to.
  - type: exercise
    id: hedge-choice
    title: Осторожные формулировки
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы не вполне уверены в сложности и говорите осторожно.
        options:
          - I think this runs in linear time.
          - This definitely runs in linear time.
          - I am completely sure that this runs in linear time.
        answer: I think this runs in linear time.
        explanation: I think смягчает утверждение; остальные варианты звучат как полная уверенность.
      - id: q2
        prompt: Вы точно знаете, что цикл проходит по каждому элементу один раз.
        options:
          - The loop visits each element once.
          - I think maybe the loop probably visits each element once.
          - The loop visits each element once or twice, I think.
        answer: The loop visits each element once.
        explanation: Известный факт называют прямо; остальные варианты смягчают то, в чём вы уверены.
      - id: q3
        prompt: Вы склоняетесь к хеш-таблице, но можете передумать.
        options:
          - I'd probably use a hash map here.
          - I'd probably to use a hash map here.
          - I probably would to use a hash map here.
        answer: I'd probably use a hash map here.
        explanation: Probably стоит между I'd и глаголом, после would глагол без to.
      - id: q4
        prompt: Вы думаете, что решение не оптимально.
        options:
          - I don't think this is optimal.
          - I think not this is optimal.
          - I not think this is optimal.
        answer: I don't think this is optimal.
        explanation: Отрицание переносят в главную часть; остальные варианты нарушают порядок слов.
      - id: q5
        prompt: Ответ зависит от размера данных.
        options:
          - It depends on the size of the input.
          - It depends of the size of the input.
          - It depends from the size of the input.
        answer: It depends on the size of the input.
        explanation: Depends сочетается с предлогом on.
      - id: q6
        prompt: Вы хотите, чтобы интервьюер мог вас остановить.
        options:
          - I'll think out loud, so please stop me if you need to.
          - I'll think out loud, so please don't stop me.
          - I'll think out loud, so you never stop me.
        answer: I'll think out loud, so please stop me if you need to.
        explanation: Фраза приглашает интервьюера вмешаться; остальные варианты запрещают это.
  - type: exercise
    id: approaches-match
    title: Подходы и структуры
    instruction: Соедините определение с английским словом или выражением. Два варианта лишние.
    format: match
    bank:
      - a brute-force solution
      - a greedy approach
      - a hash map
      - a linked list
      - a binary search
      - recursion
      - a base case
      - a sliding window
      - a heap
    items:
      - { id: m1, prompt: "решение, которое перебирает все варианты без оптимизации", answer: a brute-force solution }
      - { id: m2, prompt: "на каждом шаге выбирают наиболее выгодный на вид вариант и не пересматривают выбор", answer: a greedy approach }
      - { id: m3, prompt: "структура, в которой значение находят по ключу почти мгновенно", answer: a hash map }
      - { id: m4, prompt: "последовательность элементов, в которой каждый хранит ссылку на следующий", answer: a linked list }
      - { id: m5, prompt: "поиск в отсортированных данных, при котором диапазон каждый раз делят пополам", answer: a binary search }
      - { id: m6, prompt: "приём, при котором функция решает задачу, вызывая саму себя", answer: recursion }
      - { id: m7, prompt: "условие, при котором такие вызовы прекращаются", answer: a base case }
  - type: exercise
    id: techniques-gap
    title: Приёмы и ошибки
    instruction: Вставьте слово или выражение. Два варианта лишние.
    format: gap
    bank:
      - traverse
      - optimise
      - memoisation
      - backtracking
      - a pointer
      - a lookup
      - an off-by-one error
      - time complexity
      - auxiliary space
    items:
      - id: g1
        prompt: To print every element of a linked list, you have to ___ it from the first node to the last. (обойти)
        answer: traverse
      - id: g2
        prompt: The first version is slow, so I'm going to ___ it. (ускорить)
        answer: optimise
      - id: g3
        prompt: The function computes the same value many times, so ___ will save the results and make it faster. (мемоизация)
        answer: memoisation
      - id: g4
        prompt: The program tries a move and, if it leads nowhere, undoes it and tries the next one. This technique is called ___. (перебор с откатом)
        answer: backtracking
      - id: g5
        prompt: The loop runs from zero up to and including the length, so it runs one time too many. That is ___. (ошибка на единицу)
        answer: an off-by-one error
      - id: g6
        prompt: One variable holds the start of the range and another holds the end; each of them is ___. (указатель)
        answer: a pointer
      - id: g7
        prompt: Checking whether a word is already in the hash map is ___, and it takes about the same time for any size. (поиск по ключу)
        answer: a lookup
