blocks:
  - type: explanation
    id: think-aloud
    title: Let me и I'm going to — проговаривать решение
    body: |-
      На собеседовании по алгоритмам и структурам данных интервьюер оценивает и ход мысли, и ответ. Поэтому решение проговаривают: повторяют условие, разбирают пример, начинают с простого варианта, называют сложность, улучшают решение и проверяют его. Молчание оставляет интервьюера без сведений о том, как вы думаете, а проговаривание позволяет ему вовремя подсказать.

      **Let me + глагол** (без to) — «позвольте мне» или «дайте я»: вы предупреждаете о действии, которое выполняете прямо сейчас: **Let me draw this on the board.** **Let me take a small example first.**

      **I'm going to + глагол** — вы объявляете план, который уже решили выполнить: **I'm going to start with a brute-force solution.** **I'm going to sort the input first.**

      **I'll + глагол** — решение в момент речи: **I'll think out loud, so please stop me if you need to.** **I'd + глагол** — осторожное предложение: **I'd probably use a hash map here.**

      Эти конструкции звучат коротко и вежливо. Они помогают интервьюеру идти за вами и показывают, что вы управляете ходом решения.
    table:
      columns:
        - конструкция
        - когда
        - пример
      rows:
        - - let me + глагол
          - действие, которое вы делаете сейчас
          - Let me draw this on the board.
        - - I'm going to + глагол
          - план, который вы объявляете
          - I'm going to sort the input first.
        - - I'll + глагол
          - решение в момент речи
          - I'll think out loud, so please stop me if you need to.
        - - I'd + глагол
          - осторожное предложение
          - I'd probably use a hash map here.
  - type: explanation
    id: hedging
    title: Hedging — как показать степень уверенности
    body: |-
      Hedging — смягчение: слова и обороты, которые показывают, насколько вы уверены. На собеседовании они нужны, чтобы называть догадку догадкой. Интервьюер слышит, что вы отличаете проверенное от предположения.

      Три ступени. Когда вы уверены, говорите прямо: **The loop visits each element once.** Когда вы скорее уверены, чем нет, добавляйте **I think**, **I'd say**, **probably**, **as far as I can tell**: **I think this runs in linear time.** Когда сомневаетесь, говорите об этом: **I'm not sure that's optimal, but it works.** **It depends on how large the input can get.**

      **Probably** ставят после вспомогательного глагола и перед смысловым: **I'd probably use**, **It's probably linear.** **I think** и **I'd say** стоят в начале. Два смягчителя подряд допустимы (*I think it's probably linear*), три и больше сбивают слушателя: *I think maybe it could probably work*. Понятны **I think it works** и **It probably works**.

      Факты смягчать не нужно: размер примера, условие задачи и результат, который вы только что проверили, называют прямо. После осторожной оценки полезно проверить её примером: **I think this runs in linear time. Let me test this with an example.**
    table:
      columns:
        - уверенность
        - выражения
        - пример
      rows:
        - - высокая
          - прямое утверждение, I'm sure
          - I'm sure that the loop runs once for each element.
        - - средняя
          - I think, I'd say, probably, as far as I can tell
          - I'd say the worst case is quadratic.
        - - низкая
          - I'm not sure, it depends on, I'd guess
          - I'd guess it's somewhere between linear and quadratic.
  - type: explanation
    id: aloud-mistakes
    title: Типичные ошибки русскоговорящих
    body: |-
      **Let me to.** По-русски «позвольте мне объяснить» содержит инфинитив, и в английский переносят to: *Let me to explain.* После let me стоит глагол без to: **Let me explain.**

      **Go to вместо going to.** Русское «я иду делать» превращается в *I go to sort the input.* План объявляют с оборотом to be going to: **I'm going to sort the input.** После него глагол стоит в базовой форме, без второго to: *I'm going to to start* — ошибка.

      **Лишние смягчители.** Русская речь легко складывает «наверное, мне кажется, как бы». В английском смягчителей подряд не больше двух, чаще хватает одного: **I think this runs in linear time.**

      **Отрицание при think.** По-русски «я думаю, это не оптимально». В английском отрицание переносят в главную часть: **I don't think this is optimal.** Вариант *I think this is not optimal* допустим, но реже звучит в речи, а *I think not this is optimal* ошибочен.

      **Depends.** Русское «зависит от» передаёт **depends on**: *depends of* и *depends from* — ошибки. **It depends on the size of the input.**

      **Maybe и probably.** **Maybe** — «возможно», шансы примерно равны. **Probably** — «скорее всего», вы склоняетесь к варианту. Для выбора, к которому вы склоняетесь, нужен **probably**: **I'd probably use a hash map here.**
    table:
      columns:
        - ошибка
        - верно
        - правило
      rows:
        - - Let me to draw this.
          - Let me draw this.
          - после let me — глагол без to
        - - I go to sort the input.
          - I'm going to sort the input.
          - план — to be going to
        - - I'm going to to start with a brute-force solution.
          - I'm going to start with a brute-force solution.
          - after going to — один to
        - - I think maybe it probably works.
          - I think it works.
          - не больше двух смягчителей подряд
        - - It depends of the size.
          - It depends on the size.
          - depends on
        - - I think not this is optimal.
          - I don't think this is optimal.
          - отрицание переносят в главную часть
  - type: explanation
    id: algorithm-words
    title: Слова урока — подходы, структуры, сложность
    body: |-
      Слова урока образуют три группы.

      **Подходы.** **A brute-force solution** — решение «в лоб»: перебор всех вариантов. **A greedy approach** — на каждом шаге берут наиболее выгодный на вид вариант. **Recursion** — функция вызывает саму себя, **a base case** — условие, при котором вызовы прекращаются. **Backtracking** — перебор с откатом назад. **Memoisation** — хранение уже посчитанных результатов. **Optimise** — ускорить решение или сократить память.

      **Структуры и приёмы.** **A hash map** — значение находят по ключу, такой поиск называют **a lookup**. **A linked list** — элементы связаны ссылками. **A heap** — структура, из которой быстро берут наименьший или наибольший элемент. **A pointer** — позиция или адрес элемента. **A sliding window** — диапазон, который сдвигают по данным. **Traverse** — обойти структуру. **A binary search** — поиск в отсортированных данных с делением диапазона пополам.

      **Сложность и ошибки.** **Time complexity** — как растёт время с ростом входа, **auxiliary space** — дополнительная память. **An off-by-one error** — цикл выполняется на один раз больше или меньше. Формулы сложности вслух читают словами: *linear time*, *quadratic time*, *constant space*.
