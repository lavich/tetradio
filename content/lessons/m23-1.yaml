        explanation: Ольга живёт на Кипре, но она из России — гражданство российское.
  - type: explanation
    id: letter-read
    title: Письмо из банка
    body: |-
      Ольга подала заявку на счёт, и банк прислал ей официальное письмо. Прочитайте его. Обратите внимание, как оно устроено: обращение **Αξιότιμη κυρία…,**, всё на «вы» (σας, μπορείτε), в конце **Με εκτίμηση,** и подпись.

      Банк пишет о себе во мн. ч. — «мы»: **Σας ευχαριστούμε**, **έχουμε**, **επισυνάπτουμε**, **παρακαλούμε** (просим). Название банка в тексте вымышленное.
  - type: reading
    id: letter
    title: Μια επιστολή από την τράπεζα
    text: |-
      Τράπεζα «Αλκυόνη», κατάστημα Λάρνακας
      Λάρνακα, 5 Οκτωβρίου 2026

      Αξιότιμη κυρία Σοροκίνα,

      Σας ευχαριστούμε για την αίτησή σας για καινούργιο λογαριασμό. Έχουμε ήδη το αντίγραφο του διαβατηρίου σας. Για να ανοίξουμε τον λογαριασμό, χρειάζεται ακόμα ένας λογαριασμός ρεύματος ή νερού με τη διεύθυνσή σας στη Λάρνακα.

      Επισυνάπτουμε επίσης ένα έντυπο. Παρακαλούμε να το συμπληρώσετε με κεφαλαία γράμματα και να το υπογράψετε στο τέλος.

      Η προθεσμία είναι μέχρι τις 30 Οκτωβρίου. Μπορείτε να φέρετε το έντυπο και τον λογαριασμό στο κατάστημά μας ή να τα στείλετε με συστημένη επιστολή. Για την πρώτη κατάθεση δεν χρειάζεται ραντεβού. Μετά θα σας στείλουμε την κάρτα σας με το ταχυδρομείο.

      Με εκτίμηση,
      Ανδρέας Χριστοφόρου
    glosses:
      - text: κατάστημα Λάρνακας
        russian: отделение в Ларнаке (το κατάστημα — магазин; отделение банка)
      - text: Για να ανοίξουμε
        russian: чтобы (нам) открыть
      - text: Επισυνάπτουμε
        russian: прилагаем
      - text: Παρακαλούμε
        russian: просим
      - text: κεφαλαία γράμματα
        russian: заглавными (печатными) буквами
      - text: στο τέλος
        russian: в конце, внизу
      - text: συστημένη επιστολή
        russian: заказным письмом
