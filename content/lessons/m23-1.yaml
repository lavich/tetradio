blocks:
  - type: explanation
    id: formal-register
    title: Официальный стиль — на «вы»
    body: |-
      В учреждении — в банке, на почте, в любой службе (**η υπηρεσία**) — с незнакомыми людьми говорят и переписываются на «вы». Вы уже делали это в кафе (модуль 09), в гостинице (модуль 14) и в письме в языковую школу (модуль 16). Теперь соберём всё вместе.

      1. **Глагол — во 2-м лице мн. ч.**: έχετε, μπορείτε, θέλετε, χρειάζεστε. Местоимение — **σας**: Σας ευχαριστώ. Σας γράφω. Το όνομά σας; (второй тонос, как в την απάντησή σας).
      2. **Обращение по фамилии**: Καλημέρα σας, κυρία Νικολάου. Фамилии на -ου не изменяются. К мужчине — **κύριε** (звательная форма от ο κύριος): Ευχαριστώ, κύριε Γεωργίου.
      3. **Мягкая просьба** вместо прямого «хочу» и «дай»: **Θα ήθελα…** — «я хотел(а) бы» (модуль 09) и **Θα μπορούσατε να…;** — «не могли бы вы…?». Подробнее — ниже в уроке.
      4. **Служащие говорят повелительным на «вы»** (модуль 18): **Συμπληρώστε** — заполните, **Υπογράψτε** — подпишите, **Περιμένετε** — подождите. С παρακαλώ это вежливо.

      **Начало официального письма.** Самое официальное — **Αξιότιμε κύριε,** (уважаемый господин) и **Αξιότιμη κυρία,** (уважаемая госпожа). Если вы не знаете имени служащего, пишите без фамилии или оба варианта сразу: **Αξιότιμε κύριε / Αξιότιμη κυρία,**. Если знаете — с фамилией: Αξιότιμη κυρία Νικολάου,. Знакомое по модулям 14 и 16 **Αγαπητέ κύριε Γεωργίου,** тоже официально, но чуть теплее. Окончание -ε в Αξιότιμε и Αγαπητέ — звательная форма мужского рода, как в κύριε; у женского рода окончание -η не меняется. После обращения — запятая, текст — с новой строки.

      Конец письма — как в модуле 16: **Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας. Με εκτίμηση,** — и имя с фамилией.
    table:
      columns:
        - на «ты»
        - на «вы», официально
        - по-русски
      rows:
        - - Γεια σου!
          - Καλημέρα σας. / Γεια σας.
          - Привет! / Здравствуйте.
        - - Θέλω να ρωτήσω…
          - Θα ήθελα να ρωτήσω αν…
          - Хочу спросить… / Хотел(а) бы спросить, …ли…
        - - Στείλε μου το έντυπο.
          - Θα μπορούσατε να μου στείλετε το έντυπο;
          - Пришли мне бланк. / Не могли бы вы прислать мне бланк?
        - - Υπόγραψε εδώ.
          - Υπογράψτε εδώ, παρακαλώ.
          - Подпиши здесь. / Подпишите здесь, пожалуйста.
        - - Αγαπητή Μαρία,
          - Αξιότιμη κυρία Νικολάου,
          - Дорогая Мария, / Уважаемая госпожа Николау,
        - - Τα λέμε!
          - Με εκτίμηση,
          - Пока! / С уважением,
  - type: exercise
    id: register-choice
    title: На «ты» или на «вы»
    instruction: Выберите вариант, который подходит для учреждения.
    format: choice
    items:
      - id: q1
        prompt: Вы пишете в банк и не знаете, кто прочитает письмо. Как начать?
        options:
          - Αξιότιμε κύριε / Αξιότιμη κυρία,
          - Γεια σου!
          - Αγαπητή Μαρία,
        answer: Αξιότιμε κύριε / Αξιότιμη κυρία,
        explanation: Имени нет — пишем обращение без фамилии, сразу для мужчины и для женщины.
      - id: q2
        prompt: Вы хотите вежливо попросить служащую прислать вам бланк.
        options:
          - Θα μπορούσατε να μου στείλετε το έντυπο;
          - Στείλε μου το έντυπο.
          - Μπορείς να μου στείλεις το έντυπο;
        answer: Θα μπορούσατε να μου στείλετε το έντυπο;
        explanation: Два других варианта — на «ты» (στείλε, μπορείς).
      - id: q3
        prompt: Вы у окошка в банке. Как сказать, что вы хотите открыть счёт?
        options:
          - Θα ήθελα να ανοίξω λογαριασμό.
          - Θέλεις να ανοίξεις λογαριασμό;
          - Άνοιξα λογαριασμό.
        answer: Θα ήθελα να ανοίξω λογαριασμό.
        explanation: Θέλεις…; — вопрос на «ты» к собеседнику, Άνοιξα — «я открыл(а)» (уже в прошлом).
      - id: q4
        prompt: Как закончить письмо в службу?
        options:
          - Με εκτίμηση,
          - Τα λέμε!
          - Γεια σου!
        answer: Με εκτίμηση,
      - id: q5
        prompt: Служащий спрашивает «Το επώνυμό σας, παρακαλώ;». Что он хочет узнать?
        options:
          - вашу фамилию
          - ваш адрес
          - вашу подпись
        answer: вашу фамилию
        explanation: Το επώνυμο — фамилия, το όνομα — имя.
  - type: explanation
    id: documents
    title: Документы, бланки и банк
    body: |-
      В любой службе сначала спрашивают **документы**. Удостоверение личности — **η ταυτότητα**, паспорт — **το διαβατήριο** (модуль 14). Часто нужна **копия** — **το αντίγραφο**: αντίγραφο ταυτότητας, αντίγραφο διαβατηρίου. Все бумаги, которые нужно принести, — **τα δικαιολογητικά** (слово почти всегда во мн. ч.). **Απαραίτητος** — «необходимый»: Η ταυτότητα είναι απαραίτητη. Τα απαραίτητα δικαιολογητικά.

      Заявление или заявка — **η αίτηση** (мн. ч. οι αιτήσεις): κάνω αίτηση για + вин. п., как в модуле 15 (κάνω αίτηση για τη θέση). Бланк, анкета — **το έντυπο**. Его **заполняют** — **συμπληρώνω** (συμπλήρωσα, θα συμπληρώσω) — и **подписывают** — **υπογράφω**. Подпись — **η υπογραφή**.

      **Приращение внутри слова.** У некоторых глаголов с приставкой приращение аориста έ- стоит не в начале, а после приставки: υπο- + έγραψα → **υπέγραψα** (я подписал), κατα- + έθεσα → **κατέθεσα**. В будущем и после να приращения нет: θα υπογράψω, να καταθέσω. У επισυνάπτω — «прилагаю (к письму)» — приращения нет, меняется только ударение: **επισύναψα**, θα επισυνάψω.

      **В банке.** Счёт в банке — **ο λογαριασμός**, то же слово, что счёт в ресторане (модуль 09): **Θα ήθελα να ανοίξω λογαριασμό.** Внести деньги — **καταθέτω** (κατέθεσα, θα καταθέσω), а сама операция — **η κατάθεση**: κάνω κατάθεση στον λογαριασμό. Снятие денег — **η ανάληψη**: κάνω ανάληψη. У καταθέτω есть и второе значение — «подавать» документы: καταθέτω την αίτηση.

      Счёт за электричество — **ο λογαριασμός του ρεύματος** (του ρεύματος — род. п. от **το ρεύμα** «электричество»): **Πού μπορώ να πληρώσω τον λογαριασμό του ρεύματος;**

      Ещё три слова для официальной переписки: **η επιστολή** — письмо (официальное слово), **η προθεσμία** — срок: Η προθεσμία είναι μέχρι τις 30 Οκτωβρίου — «Срок — до 30 октября»; **η υπηρεσία** — служба, учреждение, а ещё «услуга» — отсюда название модуля Υπηρεσίες.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - η ταυτότητα, το αντίγραφο ταυτότητας
          - удостоверение личности, копия удостоверения
        - - τα δικαιολογητικά
          - необходимые документы
        - - κάνω αίτηση για…
          - подаю заявление на…
        - - συμπληρώνω — συμπλήρωσα — θα συμπληρώσω
          - заполнять
        - - υπογράφω — υπέγραψα — θα υπογράψω
          - подписывать
        - - καταθέτω — κατέθεσα — θα καταθέσω
          - вносить (деньги); подавать (документы)
        - - επισυνάπτω — επισύναψα — θα επισυνάψω
          - прилагать (к письму)
        - - κάνω κατάθεση / κάνω ανάληψη
          - вношу деньги / снимаю деньги
        - - ο λογαριασμός του ρεύματος
          - счёт за электричество
