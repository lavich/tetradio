  - type: explanation
    id: polite
    title: Θα ήθελα να… и Θα μπορούσατε να…;
    body: |-
      **Θα ήθελα** — вежливое «я хотел(а) бы» (модуль 09). После него — либо винительный падеж: **Θα ήθελα ένα έντυπο, παρακαλώ**, либо **να** + глагол; для одной конкретной просьбы это обычно форма от основы аориста, как после θέλω να (модуль 16): **Θα ήθελα να ανοίξω λογαριασμό. Θα ήθελα να κάνω μια ανάληψη.** Очень частое начало вопроса: **Θα ήθελα να ρωτήσω αν…** — «Я хотел(а) бы спросить, …ли…» (αν — «ли», модуль 10; так вы уже спрашивали в письме в школу в модуле 16: Θα ήθελα να μάθω αν…): Θα ήθελα να ρωτήσω αν η τράπεζα είναι ανοιχτή το Σάββατο.

      **Θα μπορούσατε να…;** — «Не могли бы вы…?». Μπορούσατε — прошедшая форма от μπορώ (такие формы — модуль 22), а θα + прошедшая форма даёт «могли бы». Образовывать её самим пока не нужно — учите блоком. После να — та же форма, что после μπορείτε να (модуль 09: Μπορείτε να μας φέρετε…;), то есть лицо «вы»: **Θα μπορούσατε να μου στείλετε το έντυπο; Θα μπορούσατε να μου πείτε…; Θα μπορούσατε να μιλήσετε πιο αργά;** Это вежливее, чем просто Μπορείτε να…;. О себе — **Θα μπορούσα να…;** — «Мог(ла) бы я…?»: Θα μπορούσα να πληρώσω με κάρτα;

      **Πού μπορώ να…;** — «Где можно…?»: Πού μπορώ να πληρώσω τον λογαριασμό του ρεύματος;

      **Χρειάζεται / χρειάζονται** — «нужен / нужны». Глагол согласуется с тем, что нужно: Χρειάζεται η ταυτότητά σας (одна вещь). **Τι δικαιολογητικά χρειάζονται;** (много).
    table:
      columns:
        - формула
        - что после неё
        - пример
      rows:
        - - Θα ήθελα
          - вин. п.
          - Θα ήθελα ένα έντυπο.
        - - Θα ήθελα να
          - форма от аориста, «я»
          - Θα ήθελα να ανοίξω λογαριασμό.
        - - Θα μπορούσατε να
          - форма от аориста, «вы»
          - Θα μπορούσατε να μου στείλετε το έντυπο;
        - - Πού μπορώ να
          - форма от аориста, «я»
          - Πού μπορώ να βρω το έντυπο;
        - - χρειάζεται / χρειάζονται
          - ед. ч. / мн. ч.
          - Τι δικαιολογητικά χρειάζονται;
  - type: exercise
    id: bank-gap
    title: В банке
    instruction: Вставьте слово. Три слова лишние.
    format: gap
    bank:
      - ανοίξω
      - στείλετε
      - χρειάζονται
      - Υπογράψτε
      - ανάληψη
      - άνοιξα
      - χρειάζεται
      - κατάθεση
    items:
      - id: g1
        prompt: Μένω στην Κύπρο από τον Μάιο και θα ήθελα να ___ λογαριασμό στην τράπεζά σας.
        answer: ανοίξω
        explanation: После θα ήθελα να — форма от основы аориста без приращения (άνοιξα → να ανοίξω).
      - id: g2
        prompt: Θα μπορούσατε να μου ___ το έντυπο στη διεύθυνσή μου;
        answer: στείλετε
        explanation: "Θα μπορούσατε — «вы», поэтому и после να лицо «вы»: να στείλετε."
      - id: g3
        prompt: — Τι δικαιολογητικά ___; — Η ταυτότητά σας και ένας λογαριασμός ρεύματος.
        answer: χρειάζονται
        explanation: Δικαιολογητικά — мн. ч., поэтому χρειάζονται. Χρειάζεται — для одной вещи.
      - id: g4
        prompt: ___ εδώ, κάτω από το όνομά σας, παρακαλώ.
        answer: Υπογράψτε
        explanation: Υπογράψτε — «подпишите»; κάτω από — «под».
      - id: g5
        prompt: Θέλω να πάρω εκατό ευρώ από τον λογαριασμό μου. Θα ήθελα να κάνω μια ___.
        answer: ανάληψη
        explanation: Взять деньги со счёта — снятие, η ανάληψη. Η κατάθεση — наоборот, внести.
  - type: explanation
    id: form
    title: Заполняем бланк
    body: |-
      В бланке (**το έντυπο**) просят ваши данные — **τα στοιχεία** (Τα στοιχεία μου — «мои данные»). Поля обычно подписаны короткими словами. Главные из них:

      - **Όνομα** — имя, **Επώνυμο** — фамилия;
      - **Διεύθυνση** — адрес: улица (**οδός** — «улица», в адресах) и номер дома; отдельно — **Πόλη** (город) и **Ταχυδρομικός κώδικας** — почтовый индекс (на Кипре — четыре цифры);
      - **Τηλέφωνο** — телефон (на Кипре — восемь цифр);
      - **Ημερομηνία γέννησης** — дата рождения (γέννησης — «рождения»), **Υπηκοότητα** — гражданство: ρωσική — российское, κυπριακή — кипрское;
      - **Αριθμός ταυτότητας / διαβατηρίου** — номер удостоверения / паспорта (ο αριθμός — номер);
      - внизу — **Ημερομηνία** и **Υπογραφή**: дата и подпись.

      Часто сверху написано **Συμπληρώστε με κεφαλαία γράμματα** — «Заполните заглавными (печатными) буквами». Имя и фамилию тогда пишут так: ΟΛΓΑ ΣΟΡΟΚΙΝΑ — заглавными буквами ударение не ставят.
  - type: reading
    id: olga
    title: Τα στοιχεία μου
    text: |-
      Με λένε Όλγα Σοροκίνα. Είμαι από τη Ρωσία, από το Καζάν, αλλά από το 2024 μένω στη Λάρνακα. Γεννήθηκα στις 3 Μαρτίου 1990. Η διεύθυνσή μου είναι Οδός Αφροδίτης 25, στη Λάρνακα, και ο ταχυδρομικός κώδικας είναι 6021. Το τηλέφωνό μου είναι 99 456 782. Δουλεύω σε μια εταιρεία και τώρα θέλω να ανοίξω λογαριασμό σε μια τράπεζα.
    glosses:
      - text: Καζάν
        russian: Казань
      - text: Γεννήθηκα
        russian: я родилась
