title: Контрольная модуля 08
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. После модуля 08 будет контрольная A1 по модулям 01–08 — пояснения после ответа подскажут, что повторить.
  - type: reading
    id: varvara
    title: Το φαγητό μου
    text: |-
      Είμαι η Βαρβάρα. Είμαι από τη Ρωσία, αλλά τώρα μένω στην Πάφο. Μου αρέσει πολύ το κυπριακό φαγητό!

      Για πρωινό πίνω ένα τσάι και τρώω γιαούρτι. Δεν πίνω καφέ το πρωί. Για μεσημεριανό τρώω συνήθως στη δουλειά μια σαλάτα ή ένα σουβλάκι. Το βράδυ μαγειρεύω εγώ.

      Ο άντρας μου ο Κώστας είναι Κύπριος. Δεν μαγειρεύει ποτέ, αλλά τρώει πολύ! Του αρέσουν το κλέφτικο και ο μουσακάς. Εγώ δεν τρώω πολύ κρέας — προτιμώ το ψάρι και τα λαχανικά.

      Το Σάββατο πηγαίνουμε σε μια ταβέρνα με τους φίλους μας και τρώμε μεζέδες. Εκεί πίνουμε λίγο κρασί. Στην υγειά μας!
    glosses:
      - text: κυπριακό
        russian: кипрская (еда)
      - text: Κύπριος
        russian: киприот
      - text: λαχανικά
        russian: овощи
  - type: exercise
    id: varvara-tf
    about: varvara
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Βαρβάρα είναι από την Κύπρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Она из России, а в Пафосе живёт сейчас.
      - id: q2
        prompt: Το πρωί η Βαρβάρα πίνει καφέ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Για πρωινό πίνω ένα τσάι. Δεν πίνω καφέ το πρωί.
      - id: q3
        prompt: Για μεσημεριανό η Βαρβάρα τρώει στη δουλειά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Ο Κώστας μαγειρεύει το βράδυ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το βράδυ μαγειρεύω εγώ — готовит Варвара, а Костас не готовит никогда.
      - id: q5
        prompt: Στον Κώστα αρέσει το κρέας.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ему нравятся клефтико и мусака — оба блюда с мясом.
      - id: q6
        prompt: Η Βαρβάρα προτιμά το ψάρι από το κρέας.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Δεν τρώω πολύ κρέας — προτιμώ το ψάρι.
      - id: q7
        prompt: Το Σάββατο τρώνε στο σπίτι.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το Σάββατο πηγαίνουμε σε μια ταβέρνα.
  - type: listening
    id: dinner
    title: Στο σπίτι του Μιχάλη
    plays: 2
    transcript:
      - speaker: Μιχάλης
        text: Καλώς ήρθες, Άννα! Έλα μέσα! Πεινάς;
      - speaker: Άννα
        text: Γεια σου, Μιχάλη! Ναι, λίγο.
      - speaker: Μιχάλης
        text: Σήμερα μαγειρεύω κοτόπουλο με πατάτες στον φούρνο. Σου αρέσει το κοτόπουλο;
      - speaker: Άννα
        text: Ναι, πολύ! Και η σαλάτα τι έχει;
      - speaker: Μιχάλης
        text: Ντομάτα και τυρί. Θέλεις κάτι να πιεις; Έχω κρασί, χυμό και νερό.
      - speaker: Άννα
        text: Κρασί όχι, ευχαριστώ. Θέλω έναν χυμό.
      - speaker: Μιχάλης
        text: Ωραία. Καλή όρεξη!
      - speaker: Άννα
        text: Ευχαριστώ, επίσης! Μμμ, το κοτόπουλο είναι πολύ νόστιμο!
      - speaker: Μιχάλης
        text: Ευχαριστώ! Και μετά έχουμε γλυκά.
      - speaker: Άννα
        text: Όχι, ευχαριστώ. Δεν τρώω γλυκά το βράδυ.
  - type: exercise
    id: dinner-choice
    about: dinner
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Τι μαγειρεύει ο Μιχάλης;
        options:
          - Κοτόπουλο με πατάτες.
          - Ψάρι με πατάτες.
          - Κλέφτικο.
        answer: Κοτόπουλο με πατάτες.
      - id: q2
        prompt: Τι έχει η σαλάτα;
        options:
          - Ντομάτα και τυρί.
          - Ντομάτα και αυγά.
          - Πατάτες και τυρί.
        answer: Ντομάτα και τυρί.
      - id: q3
        prompt: Τι πίνει η Άννα;
        options:
          - Κρασί.
          - Χυμό.
          - Νερό.
        answer: Χυμό.
        explanation: "Κρασί όχι, ευχαριστώ. Θέλω έναν χυμό. Ловушка: вино Михалис предлагает, но Анна отказывается."
      - id: q4
        prompt: Τι λέει η Άννα για το κοτόπουλο;
        options:
          - Είναι πολύ νόστιμο.
          - Είναι πολύ αλμυρό.
          - Δεν της αρέσει.
        answer: Είναι πολύ νόστιμο.
      - id: q5
        prompt: Γιατί η Άννα δεν θέλει γλυκά;
        options:
          - Δεν τρώει γλυκά το βράδυ.
          - Δεν της αρέσει το γιαούρτι.
          - Δεν πεινάει.
        answer: Δεν τρώει γλυκά το βράδυ.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Πίνω ___ κάθε πρωί.
        options:
          - τον καφέ
          - ο καφές
          - τον καφές
        answer: τον καφέ
        explanation: "После πίνω — винительный падеж: τον καφέ."
      - id: q2
        prompt: Μου αρέσει ___.
        options:
          - η σαλάτα
          - τη σαλάτα
        answer: η σαλάτα
        explanation: После αρέσει — именительный падеж.
      - id: q3
        prompt: Θέλω ___, παρακαλώ.
        options:
          - έναν χυμό
          - ένας χυμός
          - έναν χυμός
        answer: έναν χυμό
      - id: q4
        prompt: Τρώμε με ___ μας.
        options:
          - τους φίλους
          - οι φίλοι
          - τους φίλοι
        answer: τους φίλους
      - id: q5
        prompt: Η Μαρία μαγειρεύει ___.
        options:
          - τον μουσακά
          - ο μουσακάς
          - τον μουσακάς
        answer: τον μουσακά
      - id: q6
        prompt: Δεν μου ___ τα αυγά.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσουν
      - id: q7
        prompt: Σου ___ το χαλλούμι;
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσει
      - id: q8
        prompt: Θέλουμε δύο ___.
        options:
          - σουβλάκι
          - σουβλάκια
        answer: σουβλάκια
      - id: q9
        prompt: Η σαλάτα είναι πολύ ___.
        options:
          - νόστιμος
          - νόστιμη
          - νόστιμο
        answer: νόστιμη
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το ψωμί
      - το γάλα
      - το κρέας
      - το ψάρι
      - το αυγό
      - η πατάτα
      - το ποτήρι
      - το τηγάνι
      - πεινάω
      - διψάω
    items:
      - id: m1
        prompt: хлеб
        answer: το ψωμί
      - id: m2
        prompt: молоко
        answer: το γάλα
      - id: m3
        prompt: яйцо
        answer: το αυγό
      - id: m4
        prompt: картофель
        answer: η πατάτα
      - id: m5
        prompt: стакан
        answer: το ποτήρι
      - id: m6
        prompt: сковорода
        answer: το τηγάνι
      - id: m7
        prompt: хотеть пить
        answer: διψάω
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Все сели за стол и начинают есть.
        options:
          - Καλή όρεξη!
          - Στην υγειά μας!
          - Καλώς ήρθες!
        answer: Καλή όρεξη!
      - id: q2
        prompt: Вы поднимаете бокал вина.
        options:
          - Στην υγειά μας!
          - Καλή όρεξη!
          - Χάρηκα πολύ.
        answer: Στην υγειά μας!
      - id: q3
        prompt: Вы не едите мясо. Вам предлагают сувлаки.
        options:
          - Όχι, ευχαριστώ, δεν τρώω κρέας.
          - Ναι, είναι πολύ νόστιμο!
          - Θέλω δύο, παρακαλώ.
        answer: Όχι, ευχαριστώ, δεν τρώω κρέας.
      - id: q4
        prompt: В кафе вы хотите попросить воды.
        options:
          - Θέλω ένα ποτήρι νερό, παρακαλώ.
          - Θέλεις κάτι να πιεις;
          - Διψάς;
        answer: Θέλω ένα ποτήρι νερό, παρακαλώ.
