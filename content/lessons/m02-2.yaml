  - type: explanation
    id: small-words
    title: Маленькие слова
    body: |-
      **και** — «и», а в вопросе — «а»: Κι εσύ; — «А ты?». **αλλά** — «но»: Είμαι από τη Ρωσία, αλλά μένω στην Κύπρο. **ή** — «или»: Μιλάς αγγλικά ή ελληνικά; Пишите ή с тоносом: без него η — это артикль.

      **εδώ** — «здесь», **εκεί** — «там»: Μένω εδώ, στη Λεμεσό. Η Όλγα μένει στην Πάφο και δουλεύει εκεί.

      **λίγο** — «немного», **πολύ** — «очень; много», **μόνο** — «только»: Μιλάω λίγο ελληνικά. Ο Νίκος μιλάει πολύ καλά αγγλικά. Μιλάω μόνο ρωσικά. Вы услышите и **λίγα** ελληνικά — «немного греческого»; оба варианта верны.

      **με** — «с»: Μιλάω με τη Μαρία. Не путайте с με в Με λένε…: там это «меня». **για** — «для; о, про»: Μαθαίνω ελληνικά για τη δουλειά — «…для работы».

      **τι** — «что; какой»: Τι γλώσσες μιλάς; **Τι δουλειά κάνεις;** — «Кем ты работаешь?», дословно «Какую работу делаешь?». Названия профессий будут в модуле 03; пока можно ответить, где вы работаете: Δουλεύω στη Λευκωσία.
    table:
      columns:
        - слово
        - значение
        - пример
      rows:
        - - αλλά
          - но
          - Μένω στη Λάρνακα, αλλά δουλεύω στη Λευκωσία.
        - - ή
          - или
          - Ρωσικά ή αγγλικά;
        - - εδώ / εκεί
          - здесь / там
          - Μένω εδώ. Δουλεύω εκεί.
        - - λίγο / πολύ / μόνο
          - немного / очень / только
          - Μιλάω μόνο λίγο ελληνικά.
        - - με
          - с
          - με τη Μαρία
        - - για
          - для; о
          - για τη δουλειά
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: verbs-choice
    title: Формы глаголов
    instruction: Выберите форму глагола.
    format: choice
    items:
      - id: q1
        prompt: — Τι ___, Νίκο; — Ένα τσάι, παρακαλώ.
        options: [θέλεις, θέλει, θέλετε]
        answer: θέλεις
        explanation: К Никосу обращаются на «ты» — θέλεις.
      - id: q2
        prompt: — Ξέρεις πού μένει ο Νίκος; — Όχι, δεν ___.
        options: [ξέρω, ξέρεις, ξέρει]
        answer: ξέρω
        explanation: Отвечают о себе — «я не знаю».
      - id: q3
        prompt: Η Μαρία ___ «καλημέρα».
        options: [λέω, λες, λέει]
        answer: λέει
      - id: q4
        prompt: Εγώ ___ στη Λευκωσία.
        options: [πάω, πας, πάει]
        answer: πάω
      - id: q5
        prompt: Ο Νίκος και η Άννα ___ στην Πάφο.
        options: [πάει, πάμε, πάνε]
        answer: πάνε
        explanation: "«Они» — πάνε, как λένε."
      - id: q6
        prompt: — ___; (Можно войти?) — Ναι, παρακαλώ!
        options: [Μπορώ, Μπορείς, Μπορούν]
        answer: Μπορώ
        explanation: Μπορώ; — «Можно?», дословно «Могу?».
      - id: q7
        prompt: Εσείς ___ ελληνικά;
        options: [γράφετε, γράφουμε, γράφεις]
        answer: γράφετε
      - id: q8
        prompt: Εμείς ___ πολύ καλά αγγλικά.
        options: [ξέρουμε, ξέρετε, ξέρουν]
        answer: ξέρουμε
  - type: exercise
    id: small-gap
    title: Маленькие слова
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank: [τι, αλλά, ή, εδώ, εκεί, λίγο, πολύ, μόνο, με, για]
    items:
      - id: g1
        prompt: Είμαι από τη Ρωσία, ___ μένω στην Κύπρο.
        answer: αλλά
      - id: g2
        prompt: Μιλάς αγγλικά ___ ελληνικά;
        answer: ή
        explanation: «Или» — ή с тоносом.
      - id: g3
        prompt: — Μιλάς αγγλικά; — Όχι, ___ ρωσικά.
        answer: μόνο
      - id: g4
        prompt: — Μιλάς ελληνικά; — Ναι, ___. Τώρα μαθαίνω.
        answer: λίγο
        explanation: Человек только учит язык — значит, говорит «немного».
      - id: g5
        prompt: Εγώ δουλεύω εδώ, στη Λεμεσό, και η Άννα δουλεύει ___, στην Πάφο.
        answer: εκεί
        explanation: Говорящий — в Лимасоле (εδώ), Пафос — не там, где он, поэтому «там» — εκεί.
      - id: g6
        prompt: Μιλάω ελληνικά ___ τη Μαρία.
        answer: με
      - id: g7
        prompt: Μαθαίνω ελληνικά ___ τη δουλειά. (η δουλειά — работа)
        answer: για
      - id: g8
        prompt: Ο Νίκος μιλάει ___ καλά αγγλικά.
        answer: πολύ
  - type: reading
    id: olga
    title: Η αίτηση της Όλγας
    text: |-
      ΣΧΟΛΗ ΕΛΛΗΝΙΚΗΣ ΓΛΩΣΣΑΣ — ΛΕΜΕΣΟΣ
      ΑΙΤΗΣΗ

      Όνομα: Όλγα
      Επώνυμο: Σμιρνόβα
      Χώρα: Ρωσία
      Πόλη: Λεμεσός
      Γλώσσες: ρωσικά, αγγλικά

      Λίγα λόγια για σας:
      Είμαι από τη Ρωσία, από το Καζάν, αλλά τώρα μένω στην Κύπρο, στη Λεμεσό. Δουλεύω εκεί, σε ένα ξενοδοχείο. Στη δουλειά μιλάω αγγλικά. Ελληνικά ξέρω μόνο λίγο: καταλαβαίνω, αλλά δεν μιλάω καλά. Ο φίλος μου ο Αντρέας είναι Έλληνας, από την Αθήνα. Αυτός μιλάει λίγο ρωσικά, αλλά εμείς μιλάμε αγγλικά. Γι’ αυτό μαθαίνω ελληνικά!
    glosses:
      - text: ΣΧΟΛΗ ΕΛΛΗΝΙΚΗΣ ΓΛΩΣΣΑΣ
        russian: школа греческого языка
      - text: ΑΙΤΗΣΗ
        russian: заявление, анкета
      - text: Επώνυμο
        russian: фамилия
      - text: Λίγα λόγια για σας
        russian: несколько слов о себе (дословно «о вас»)
      - text: από το Καζάν
        russian: из Казани
      - text: σε ένα ξενοδοχείο
        russian: в гостинице
      - text: Στη δουλειά
        russian: на работе
      - text: Γι’ αυτό
        russian: поэтому
  - type: exercise
    id: olga-tf
    about: olga
    title: Верно или неверно
    instruction: Прочитайте анкету. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Όλγα είναι από τη Ρωσία.
        options: [Σωστό, Λάθος]
        answer: Σωστό
      - id: q2
        prompt: Η Όλγα μένει στο Καζάν.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Она из Казани, но τώρα μένω στη Λεμεσό — сейчас живёт в Лимасоле.
      - id: q3
        prompt: Η Όλγα δουλεύει στη Λεμεσό.
        options: [Σωστό, Λάθος]
        answer: Σωστό
        explanation: Δουλεύω εκεί — «там» значит в Лимасоле, о котором говорится в предыдущем предложении.
      - id: q4
        prompt: Στη δουλειά η Όλγα μιλάει ελληνικά.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Στη δουλειά μιλάω αγγλικά — на работе она говорит по-английски.
      - id: q5
        prompt: Η Όλγα μιλάει πολύ καλά ελληνικά.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Ξέρω μόνο λίγο… δεν μιλάω καλά — греческий она знает только немного.
      - id: q6
        prompt: Ο Αντρέας είναι από την Ελλάδα.
        options: [Σωστό, Λάθος]
        answer: Σωστό
        explanation: Είναι Έλληνας, από την Αθήνα — он грек из Афин.
      - id: q7
        prompt: Ο Αντρέας δεν μιλάει ρωσικά.
        options: [Σωστό, Λάθος]
        answer: Λάθος
        explanation: Αυτός μιλάει λίγο ρωσικά — немного говорит. На экзамене проверяют именно такие детали — λίγο, μόνο, δεν.
  - type: exercise
    id: olga-q
    about: olga
    title: Ответьте на вопросы
    instruction: Ответьте коротко по-гречески.
    format: text
    items:
      - id: q1
        prompt: В каком городе живёт Ольга?
        answer:
          - Λεμεσός
          - Λεμεσό
          - στη Λεμεσό
          - Μένει στη Λεμεσό
          - Στην Κύπρο, στη Λεμεσό
        explanation: В анкете — Πόλη — Λεμεσός, в тексте — μένω στη Λεμεσό.
      - id: q2
        prompt: На каком языке Ольга и Андреас говорят друг с другом?
        answer:
          - αγγλικά
          - τα αγγλικά
          - Μιλάνε αγγλικά
          - Μιλούν αγγλικά
          - στα αγγλικά
        explanation: Αλλά εμείς μιλάμε αγγλικά — Андреас немного знает русский, но говорят они по-английски.
  - type: listening
    id: school
    title: Στη σχολή
    plays: 2
    transcript:
      - speaker: Στέλιος
        text: "Γεια σου! Είμαι ο Στέλιος. Πώς σε λένε;"
        audio: m02-2/school-1.mp3
      - speaker: Αλεξάνδρα
        text: "Γεια σου! Με λένε Αλεξάνδρα."
        audio: m02-2/school-2.mp3
      - speaker: Στέλιος
        text: "Χάρηκα πολύ, Αλεξάνδρα. Από ποια χώρα είσαι;"
        audio: m02-2/school-3.mp3
      - speaker: Αλεξάνδρα
        text: "Επίσης! Είμαι από τη Ρωσία, από την Αγία Πετρούπολη. Εσύ είσαι από τη Λεμεσό;"
        audio: m02-2/school-4.mp3
      - speaker: Στέλιος
        text: "Όχι, είμαι από την Πάφο. Αλλά τώρα μένω και δουλεύω εδώ, στη Λεμεσό."
        audio: m02-2/school-5.mp3
      - speaker: Αλεξάνδρα
        text: "Κι εγώ μένω στη Λεμεσό, αλλά δουλεύω στη Λάρνακα."
        audio: m02-2/school-6.mp3
      - speaker: Στέλιος
        text: "Τι γλώσσες μιλάς;"
        audio: m02-2/school-7.mp3
      - speaker: Αλεξάνδρα
        text: "Μιλάω ρωσικά, αγγλικά και λίγο ελληνικά. Μαθαίνω ελληνικά εδώ. Κι εσύ;"
        audio: m02-2/school-8.mp3
      - speaker: Στέλιος
        text: "Εγώ μιλάω ελληνικά και αγγλικά. Και τώρα μαθαίνω ρωσικά!"
        audio: m02-2/school-9.mp3
      - speaker: Αλεξάνδρα
        text: "Ρωσικά; Ωραία! Μιλάς ρωσικά;"
        audio: m02-2/school-10.mp3
      - speaker: Στέλιος
        text: "Μόνο λίγο. Καταλαβαίνω, αλλά δεν μιλάω καλά."
        audio: m02-2/school-11.mp3
      - speaker: Αλεξάνδρα
        text: "Δεν πειράζει! Εγώ μιλάω λίγο ελληνικά, εσύ λίγο ρωσικά."
        audio: m02-2/school-12.mp3
      - speaker: Στέλιος
        text: "Ωραία! Τα λέμε, Αλεξάνδρα!"
        audio: m02-2/school-13.mp3
  - type: exercise
    id: school-choice
    about: school
    title: Выберите ответ
    instruction: Прослушайте диалог в языковой школе и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Από πού είναι ο Στέλιος;
        options:
          - Από την Πάφο.
          - Από τη Λεμεσό.
          - Από τη Λάρνακα.
        answer: Από την Πάφο.
        explanation: "Όχι, είμαι από την Πάφο. Ловушка: в Лимасоле он сейчас живёт и работает."
      - id: q2
        prompt: Από ποια χώρα είναι η Αλεξάνδρα;
        options:
          - Από την Ελλάδα.
          - Από τη Ρωσία.
          - Από την Κύπρο.
        answer: Από τη Ρωσία.
      - id: q3
        prompt: Πού δουλεύει η Αλεξάνδρα;
        options:
          - Στη Λεμεσό.
          - Στη Λάρνακα.
          - Στη Λευκωσία.
        answer: Στη Λάρνακα.
        explanation: Μένω στη Λεμεσό, αλλά δουλεύω στη Λάρνακα — живёт в Лимасоле, работает в Ларнаке.
      - id: q4
        prompt: Τι γλώσσες μιλάει η Αλεξάνδρα;
        options:
          - Ρωσικά, αγγλικά και λίγο ελληνικά.
          - Μόνο ρωσικά.
          - Ρωσικά, ελληνικά και λίγο αγγλικά.
        answer: Ρωσικά, αγγλικά και λίγο ελληνικά.
      - id: q5
        prompt: Τι μαθαίνει ο Στέλιος;
        options:
          - Αγγλικά.
          - Ρωσικά.
          - Ελληνικά.
        answer: Ρωσικά.
        explanation: Και τώρα μαθαίνω ρωσικά! Греческий учит Александра.
      - id: q6
        prompt: Как Стелиос знает русский?
        options:
          - очень хорошо
          - немного, понимает лучше, чем говорит
          - совсем не знает
        answer: немного, понимает лучше, чем говорит
        explanation: Μόνο λίγο. Καταλαβαίνω, αλλά δεν μιλάω καλά.
      - id: q7
        prompt: Как они говорят друг с другом?
        options:
          - на «ты»
          - на «вы»
        answer: на «ты»
        explanation: Γεια σου, Πώς σε λένε, Τι γλώσσες μιλάς — формы на «ты». Так обычно говорят между собой ровесники-студенты.
  - type: exercise
    id: replies
    title: Вопрос и ответ
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Μιλάω ρωσικά και λίγο αγγλικά.
      - Ναι, λίγο.
      - Δουλεύω στη Λευκωσία.
      - Ένα τσάι, παρακαλώ.
      - Όχι, δεν ξέρω.
      - Πάω στην Πάφο.
      - Ναι, παρακαλώ.
      - Με λένε Όλγα.
    items:
      - id: m1
        prompt: Τι γλώσσες μιλάς;
        answer: Μιλάω ρωσικά και λίγο αγγλικά.
      - id: m2
        prompt: Μιλάτε αγγλικά;
        answer: Ναι, λίγο.
        explanation: «Ναι, παρακαλώ» — ответ на Μπορώ; («Можно?»), а не на вопрос о языке.
      - id: m3
        prompt: Πού δουλεύεις;
        answer: Δουλεύω στη Λευκωσία.
      - id: m4
        prompt: Τι θέλεις;
        answer: Ένα τσάι, παρακαλώ.
      - id: m5
        prompt: Ξέρεις πού μένει η Άννα;
        answer: Όχι, δεν ξέρω.
      - id: m6
        prompt: Πού πας;
        answer: Πάω στην Πάφο.
        explanation: Πας — «ты идёшь, едешь», от πάω.
