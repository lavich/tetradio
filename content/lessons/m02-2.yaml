blocks:
  - type: explanation
    id: more-verbs
    title: Ещё глаголы — θέλω, ξέρω, λέω, πάω, μπορώ
    body: |-
      **Θέλω** — «хочу», **ξέρω** — «знаю, умею», **γράφω** — «пишу» спрягаются так же, как μένω: θέλεις, ξέρει, γράφουμε… **Τι θέλεις;** — «Что ты хочешь?» — Ένα τσάι, παρακαλώ. **Ξέρεις αγγλικά;** — «Ты знаешь английский?». **Δεν ξέρω.** — «Не знаю».

      **Λέω** — «говорю» — неправильный: λέω, λες, λέει, λέμε, λέτε, λένε. Форму λένε вы уже знаете: Πώς σε λένε; — дословно «Как тебя называют?». Разница с μιλάω: **μιλάω** — говорить на языке, разговаривать (μιλάω ελληνικά); **λέω** — сказать что-то (λέω «καλημέρα»).

      **Πηγαίνω** — «иду, еду». В разговоре чаще звучит краткая форма **πάω**: πάω, πας, πάει, πάμε, πάτε, πάνε. Куда — тоже с σε: **Πάω στη Λευκωσία.** — «Я еду в Никосию».

      **Μπορώ** — «могу». Ударение у него на окончании, как у μιλάω, но окончания с -ει- и -ου-: μπορώ, μπορείς, μπορεί, μπορούμε, μπορείτε, μπορούν. Пока используем его коротко: **Μπορώ;** — «Можно?» (например, войти). «Могу + глагол» — в модуле 16.
    table:
      columns:
        - лицо
        - λέω — говорить
        - πάω — идти
        - μπορώ — мочь
      rows:
