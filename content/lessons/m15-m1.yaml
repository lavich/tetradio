  - type: speaking
    id: my-area
    part: monologue
    prompt: |-
      Речь, часть B. Экзаменатор говорит: «Μιλήστε μας για την περιοχή σας.» (Μιλήστε μας — «расскажите нам».)
      Говорите около полутора минут без подготовки: где вы живёте; что есть рядом с домом и где это (напротив, рядом, на углу); как вы добираетесь до центра; куда ходите за покупками; что вам нравится и что нет. Запишите ответ.
    seconds: 90
    model: Μένω στη Λεμεσό, σε μια περιοχή κοντά στο κέντρο. Στον δρόμο μου υπάρχουν ένας φούρνος, ένα μικρό σούπερ μάρκετ και ένα φαρμακείο. Απέναντι από το σπίτι μου υπάρχει ένα πάρκο, και εκεί κάνω βόλτα το απόγευμα. Η στάση του λεωφορείου είναι στη γωνία, δίπλα στην τράπεζα. Για το κέντρο παίρνω το λεωφορείο ή περπατάω είκοσι λεπτά. Κάθε Σάββατο πηγαίνω στη λαϊκή, γιατί τα φρούτα εκεί είναι φρέσκα και φτηνά. Μου αρέσει πολύ η περιοχή μου, αλλά το πρωί έχει πολλή κίνηση.
    criteria:
      - Говорили около полутора минут, без долгих пауз
      - "Что есть рядом — υπάρχει + ед. ч., υπάρχουν + мн. ч. (υπάρχουν ένας φούρνος και ένα φαρμακείο)"
      - "Где это — наречия места с σε/από: δίπλα στην τράπεζα, απέναντι από το σπίτι, στη γωνία (модули 06, 12)"
      - "Родительный падеж в устойчивом сочетании: η στάση του λεωφορείου (модуль 12)"
      - "Как добираетесь: παίρνω το λεωφορείο / περπατάω … λεπτά; где покупки — στη λαϊκή, στο σούπερ μάρκετ"
      - Есть оценка с причиной или противопоставлением (μου αρέσει … γιατί …, αλλά …) и хотя бы одно наречие частоты (κάθε Σάββατο, συνήθως)
  - type: speaking
    id: shirt-exchange
    part: roleplay
    prompt: |-
      Речь, часть C — ролевая игра. На экзамене её играют два кандидата; у вас есть около 2 минут, чтобы прочитать роль. Прочитайте обе роли, затем сыграйте роль А (покупатель), а реплики продавца произнесите вслух сами или попросите кого-нибудь. Говорите на «вы» и запишите разговор.

      Роль А — покупатель. Вчера вы купили в магазине синюю рубашку (το πουκάμισο), размер 40. Дома оказалось, что она тесная. Вы хотите обменять её на размер больше; если синей нет — выберите другой цвет. Чек у вас с собой. Спросите, где примерочная; поблагодарите и попрощайтесь.

      Роль Б — продавец. Поздоровайтесь и спросите, чем помочь. Попросите чек. Синей рубашки размера 42 нет, есть белая и чёрная. Предложите примерить и скажите, где примерочная: слева, рядом с кассой.
    seconds: 120
    model: |-
      Б: Καλημέρα σας! Παρακαλώ;
      А: Καλημέρα σας. Χθες αγόρασα αυτό το μπλε πουκάμισο, αλλά μου είναι λίγο στενό. Θα ήθελα να το αλλάξω.
      Б: Εντάξει. Έχετε την απόδειξη;
      А: Ναι, ορίστε. Το έχετε σε πιο μεγάλο νούμερο; Φοράω σαράντα, θέλω σαράντα δύο.
      Б: Σε μπλε δεν έχουμε σαράντα δύο, συγγνώμη. Έχουμε σε άσπρο και σε μαύρο.
      А: Δεν πειράζει. Μπορώ να δοκιμάσω το άσπρο;
      Б: Ναι, ορίστε.
      А: Πού είναι το δοκιμαστήριο;
      Б: Αριστερά, δίπλα στο ταμείο.
      А: Ευχαριστώ πολύ! … Το άσπρο είναι άνετο. Το παίρνω.
      Б: Ωραία! Γεια σας!
      А: Γεια σας!
    criteria:
      - "Поздоровались и попрощались на «вы» (Καλημέρα σας! … Γεια σας!)"
      - "Объяснили проблему в прошедшем времени и с причиной: Χθες αγόρασα…, αλλά μου είναι στενό"
      - "Вежливая просьба: Θα ήθελα να το αλλάξω. Το έχετε σε πιο μεγάλο νούμερο; (модули 09, 11)"
      - "Размер и цвет: φοράω σαράντα; σε άσπρο, σε μαύρο; το άσπρο — средний род, как το πουκάμισο"
      - "Спросили про примерочную (Πού είναι το δοκιμαστήριο;) и ответили на вопрос о чеке (Ναι, ορίστε)"
      - Реплики продавца тоже прозвучали — диалог не оборвался; ударение на своём месте (πουκάμισο, απόδειξη, δοκιμαστήριο)
