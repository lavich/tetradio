  - type: writing
    id: holidays
    register: friendly
    prompt: |-
      Письмо, часть A (дружеский текст). Ваша подруга-гречанка Данаи пишет: «Γεια! Πώς ήταν οι διακοπές σου;»

      Ответьте ей, 80–100 слов: куда и когда вы ездили, с кем и на чём; где жили; что делали и что ели (три-четыре действия в прошедшем времени); что понравилось или не понравилось и почему; пригласите её встретиться — назовите день и время.
    words:
      min: 80
      max: 100
    model: Γεια σου, Δανάη! Οι διακοπές μου ήταν πολύ ωραίες. Τον Αύγουστο πήγα με τον άντρα μου στην Πάφο για πέντε μέρες. Πήγαμε με το λεωφορείο, γιατί δεν έχουμε αυτοκίνητο. Κλείσαμε ένα δίκλινο δωμάτιο σε ένα μικρό ξενοδοχείο κοντά στη θάλασσα. Κολυμπήσαμε πολύ και επισκεφτήκαμε το κάστρο και ένα παλιό χωριό. Το βράδυ φάγαμε ψάρι, χαλλούμι και μεζέδες σε μια ταβέρνα στο λιμάνι. Το ξενοδοχείο ήταν λίγο ακριβό, αλλά η θέα από το μπαλκόνι ήταν πολύ ωραία. Είσαι ελεύθερη την Κυριακή; Έλα για καφέ στο σπίτι μου στις πέντε! Τα λέμε!
    criteria:
      - 80–100 слов; дружеское обращение и прощание на «ты» (Γεια σου, …! … Τα λέμε!)
      - "Названо, куда и когда: στην Πάφο, τον Αύγουστο; с кем — με + винительный падеж (με τον άντρα μου)"
      - "Транспорт — με + артикль: με το λεωφορείο, με το αυτοκίνητο (модуль 13)"
      - "Не меньше четырёх глаголов в аористе с верным окончанием лица: πήγα / πήγαμε, κλείσαμε, κολυμπήσαμε, φάγαμε, επισκεφτήκαμε"
      - "В форме «мы» без έ- в начале, ударение на третьем слоге от конца: πήγαμε, φάγαμε, κολυμπήσαμε (модули 14–15)"
      - "Описание в прошлом через ήταν и согласованные прилагательные: οι διακοπές ήταν ωραίες, το ξενοδοχείο ήταν ακριβό"
      - Оценка с причиной или противопоставлением (γιατί, αλλά)
      - "Приглашение с днём и временем: την Κυριακή, στις πέντε; тонос во всех словах из двух и больше слогов"
  - type: writing
    id: job-letter
    register: formal
    prompt: |-
      Письмо, часть B (менее дружеский, ближе к официальному текст). Вы прочитали объявление:

      «Ζητείται υπάλληλος για το ζαχαροπλαστείο «Γλυκό σπίτι» στη Λάρνακα. Πρωινή ή απογευματινή βάρδια. Απαραίτητα: ελληνικά και αγγλικά. Στείλτε το βιογραφικό σας στην κυρία Χριστίνα Ευαγγέλου.»

      Напишите письмо госпоже Евангелу, 80–100 слов: зачем вы пишете и где увидели объявление; кто вы и где живёте; какие языки знаете; какой у вас опыт (в прошедшем времени); какую смену предпочитаете и почему; когда можете начать; что прикладываете резюме. Обращение и прощание — как в официальном письме. Подпишитесь вымышленным именем.
    words:
      min: 80
      max: 100
    model: |-
      Αγαπητή κυρία Ευαγγέλου,

      Σας γράφω για τη θέση στο ζαχαροπλαστείο σας. Είδα την αγγελία σας στο ίντερνετ. Με λένε Άννα Σεμιόνοβα, είμαι από τη Ρωσία και μένω στη Λάρνακα εδώ και δύο χρόνια. Μιλάω ρωσικά, αγγλικά και λίγο ελληνικά. Στη Μόσχα δούλεψα τρία χρόνια σε ένα μεγάλο ζαχαροπλαστείο, και πέρσι δούλεψα σε ένα καφενείο εδώ, στο κέντρο. Είμαι υπεύθυνη και μου αρέσει να δουλεύω με ανθρώπους. Προτιμώ την πρωινή βάρδια, γιατί το απόγευμα μαθαίνω ελληνικά. Μπορώ να ξεκινήσω τη Δευτέρα. Σας στέλνω το βιογραφικό μου.

      Με εκτίμηση,
      Άννα Σεμιόνοβα
    criteria:
      - 80–100 слов; официальное обращение с запятой (Αγαπητή κυρία Ευαγγέλου,) и прощание (Με εκτίμηση,) — фамилия на -ου не меняется
      - Всё письмо на «вы» (σας, Σας γράφω, Σας στέλνω) — ни одного σου или Γεια σου
      - "Сказано, зачем пишете и где видели объявление: Σας γράφω για τη θέση…, Είδα την αγγελία σας…"
      - "О себе: откуда, где живёте, сколько — εδώ και + настоящее время (μένω εδώ και δύο χρόνια)"
      - "Языки без артикля после μιλάω; опыт — аорист: δούλεψα τρία χρόνια σε…"
      - "Предпочтение с причиной: Προτιμώ την πρωινή βάρδια, γιατί…"
      - "Когда можете начать (Μπορώ να ξεκινήσω…) и резюме (Σας στέλνω το βιογραφικό μου.)"
      - Подпись вымышленным именем, не настоящим; тонос во всех словах из двух и больше слогов
  - type: speaking
    id: about-me
    part: interview
    prompt: |-
      Речь, часть A. Экзаменатор задаёт вопросы на «вы». Прочитайте каждый вопрос вслух, ответьте без подготовки одним-тремя предложениями и запишите ответы:
      Πώς σας λένε; Από πού είστε; Πού μένετε και με ποιον; Τι δουλειά κάνετε; Πώς πηγαίνετε στη δουλειά; Τι κάνατε το περασμένο σαββατοκύριακο;
    seconds: 120
    model: Με λένε Όλγα. Είμαι από τη Ρωσία, από το Καζάν. Τώρα μένω στη Λεμεσό με τον άντρα μου και την κόρη μας, σε ένα διαμέρισμα κοντά στο κέντρο. Είμαι προγραμματίστρια και δουλεύω σε μια ιδιωτική εταιρεία. Συνήθως πηγαίνω στη δουλειά με το λεωφορείο, γιατί δεν έχω αυτοκίνητο. Το περασμένο σαββατοκύριακο πήγαμε στη λαϊκή και αγοράσαμε φρούτα. Την Κυριακή ήρθαν οι φίλοι μας και φάγαμε μαζί στο σπίτι.
    criteria:
