title: Пробник M1 — экзамен A2
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как проходить пробник
    body: |-
      Это первый полный пробный экзамен A2 по модулям 01–15. Он устроен как экзамен ΚΕΓ: четыре навыка, в чтении и аудировании — все восемь типов заданий, в письме — два текста, в речи — три части. Лучше пройти его за один раз, как на экзамене: без словаря, таблиц и карточек, с перерывом не дольше 10 минут между письменной частью и речью.

      **Время — как на экзамене.** Чтение — 30 минут, аудирование — 25 минут, письмо — 45 минут, речь — около 12 минут. Поставьте таймер на каждую часть и не возвращайтесь к части, время которой вышло. Каждая запись в аудировании звучит два раза; транскрипт откроется после ответа.

      **Чтение и аудирование** проверяются автоматически: в каждом навыке 25 пунктов. Порог — **60 %**, то есть не меньше 15 правильных ответов в каждом навыке, как на экзамене, где нужно набрать 60 % в каждом навыке, а провал одного навыка означает провал всего экзамена.

      **Письмо и речь** — самопроверка по критериям курса, а не оценка экзаменатора: на экзамене их оценивают экзаменаторы по своей шкале. Сначала напишите текст и запишите ответ сами, только потом откройте образец и честно отметьте выполненные критерии. Меньше 60 % критериев — повод поработать над навыком. Пишите, как на экзамене, от руки строчными печатными буквами и не ставьте в работе своё настоящее имя — подпишитесь вымышленным. Если можете, покажите письмо и записи речи преподавателю или носителю языка.

      Навык ниже порога — повод повторить модули, которые названы в пояснениях к ошибкам.
    table:
      columns:
        - часть
        - задания
        - время
      rows:
        - - Чтение
          - верно/неверно; части предложений; выбор из четырёх; пропуски
          - 30 мин
        - - Аудирование
          - описания и картинки; выбор из трёх; верно/неверно; заметки
          - 25 мин
        - - Письмо
          - письмо другу и письмо работодателю, по 80–100 слов
          - 45 мин
        - - Речь
          - вопросы о себе, монолог, ролевая игра
          - ~12 мин
  - type: reading
    id: yulia
    title: Ένα μήνυμα από την Ιουλία
    text: |-
      Γεια σου, Νατάσα!

      Πώς είσαι; Εγώ είμαι πολύ καλά. Τον Σεπτέμβριο ήρθα στη Λευκωσία, γιατί βρήκα δουλειά εδώ. Δουλεύω ως λογίστρια σε μια μικρή εταιρεία στο κέντρο. Το ωράριο είναι από τις οκτώ μέχρι τις τέσσερις, και το Σάββατο δεν δουλεύω. Οι συνάδελφοί μου είναι πολύ καλοί, αλλά ο διευθυντής μιλάει μόνο ελληνικά. Έτσι μαθαίνω ελληνικά κάθε μέρα!

      Μένω σε ένα μικρό διαμέρισμα με ένα υπνοδωμάτιο. Δεν είναι κοντά στη δουλειά, και παίρνω το λεωφορείο. Η διαδρομή κάνει είκοσι λεπτά, αλλά όταν έχει κίνηση, κάνει μισή ώρα.

      Την περασμένη Κυριακή πήγα στη Λεμεσό με μια συνάδελφο. Κολυμπήσαμε στη θάλασσα και φάγαμε ψάρι σε μια ταβέρνα στο λιμάνι. Περάσαμε πολύ ωραία!

      Τον Δεκέμβριο παίρνω άδεια για δύο εβδομάδες και έρχομαι στη Μόσχα. Θέλω πολύ να δω την οικογένειά μου και τους φίλους μου. Πότε είσαι ελεύθερη;

      Φιλιά,
      Ιουλία
    glosses:
      - text: Έτσι
        russian: так что, поэтому
      - text: Φιλιά
        russian: целую (в конце письма)
  - type: exercise
    id: yulia-tf
    about: yulia
    graded: true
    title: Чтение 1 — верно или неверно
    instruction: Прочитайте сообщение. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Ιουλία ήρθε στη Λευκωσία για δουλειά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ήρθα στη Λευκωσία, γιατί βρήκα δουλειά εδώ.
      - id: q2
        prompt: Η Ιουλία δουλεύει σε μια μεγάλη εταιρεία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Σε μια μικρή εταιρεία — в маленькой. Μεγάλος ↔ μικρός (модуль 07).
      - id: q3
        prompt: Η Ιουλία μιλάει ρωσικά με τον διευθυντή της.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ο διευθυντής μιλάει μόνο ελληνικά — поэтому она и учит греческий каждый день.
      - id: q4
        prompt: Το διαμέρισμα της Ιουλίας είναι κοντά στη δουλειά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν είναι κοντά στη δουλειά — поэтому она ездит на автобусе.
      - id: q5
        prompt: Όταν έχει κίνηση, η διαδρομή κάνει τριάντα λεπτά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Όταν έχει κίνηση, κάνει μισή ώρα — полчаса, то есть 30 минут. Είκοσι λεπτά — без пробок (модули 04, 13)."
      - id: q6
        prompt: Στη Λεμεσό η Ιουλία και η συνάδελφός της έφαγαν κρέας.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Φάγαμε ψάρι — они ели рыбу (φάγαμε — аорист от τρώω, модуль 15).
      - id: q7
        prompt: Τον Δεκέμβριο η Ιουλία πηγαίνει στη Μόσχα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Έρχομαι στη Μόσχα — «приезжаю (к тебе) в Москву»: Наташа живёт в Москве, поэтому Юлия пишет έρχομαι, а не πηγαίνω (модуль 13)."
  - type: reading
    id: hotel
    title: Ξενοδοχείο «Ακτή»
    text: |-
      Καλώς ήρθατε στο ξενοδοχείο «Ακτή»!

      Σερβίρουμε πρωινό κάθε μέρα από τις επτά μέχρι τις δέκα, στον πρώτο όροφο. Η πισίνα είναι ανοιχτή από τις εννέα το πρωί μέχρι τις επτά το βράδυ.

      Η παραλία είναι μόνο πέντε λεπτά με τα πόδια: στρίψτε δεξιά έξω από το ξενοδοχείο και συνεχίστε ευθεία μέχρι τη θάλασσα.

      Το λεωφορείο για το κέντρο περνάει κάθε μισή ώρα από τη στάση απέναντι από το ξενοδοχείο. Εισιτήριο αγοράζετε από τον οδηγό.

      Κάθε Τετάρτη οργανώνουμε εκδρομή σε ένα παλιό χωριό με μια ιστορική εκκλησία. Η εκδρομή κοστίζει είκοσι ευρώ, και πληρώνετε στη ρεσεψιόν.

      Την τελευταία μέρα πρέπει να αφήσετε το δωμάτιο μέχρι τις δώδεκα. Αν η πτήση σας είναι το βράδυ, μπορείτε να αφήσετε τις βαλίτσες σας στη ρεσεψιόν.
  - type: exercise
    id: hotel-match
    about: hotel
    graded: true
    title: Чтение 2 — части предложений
    instruction: Прочитайте информацию для гостей отеля. Закончите каждое предложение по тексту. Два окончания лишние.
    format: match
    bank:
      - στις δέκα.
      - στις επτά το βράδυ.
      - στις εννέα το πρωί.
      - δεξιά έξω από το ξενοδοχείο.
      - αριστερά στο φανάρι.
      - κάθε τριάντα λεπτά.
      - από τον οδηγό.
      - στη ρεσεψιόν.
    items:
      - id: m1
        prompt: Το πρωινό τελειώνει…
        answer: στις δέκα.
        explanation: Πρωινό από τις επτά μέχρι τις δέκα. Στις εννέα το πρωί открывается бассейн, а не заканчивается завтрак.
      - id: m2
        prompt: Η πισίνα κλείνει…
        answer: στις επτά το βράδυ.
        explanation: "Ανοιχτή από τις εννέα το πρωί μέχρι τις επτά το βράδυ: в девять бассейн открывается, в семь закрывается."
      - id: m3
        prompt: Για την παραλία στρίβετε…
        answer: δεξιά έξω από το ξενοδοχείο.
        explanation: Στρίψτε δεξιά έξω από το ξενοδοχείο. Светофора (φανάρι) в тексте нет (модуль 12).
      - id: m4
        prompt: Το λεωφορείο για το κέντρο περνάει…
        answer: κάθε τριάντα λεπτά.
        explanation: Κάθε μισή ώρα — каждые полчаса, то есть каждые 30 минут.
      - id: m5
        prompt: Εισιτήριο για το λεωφορείο αγοράζετε…
        answer: από τον οδηγό.
        explanation: Εισιτήριο αγοράζετε από τον οδηγό — у водителя (модуль 13).
      - id: m6
        prompt: Για την εκδρομή πληρώνετε…
        answer: στη ρεσεψιόν.
        explanation: Η εκδρομή κοστίζει είκοσι ευρώ, και πληρώνετε στη ρεσεψιόν.
  - type: reading
    id: jacket
    title: Το καινούργιο μπουφάν του Σπύρου
    text: |-
      Την περασμένη Παρασκευή πήγα με τη γυναίκα μου, τη Ρούλα, για ψώνια στο κέντρο. Ήθελα ένα καινούργιο μπουφάν, γιατί το παλιό μου είναι πολύ στενό. Σε ένα μαγαζί στην πλατεία βρήκα ένα ωραίο σκούρο μπλε μπουφάν. Η τιμή ήταν ενενήντα ευρώ, αλλά είχε έκπτωση είκοσι ευρώ. Δεν το δοκίμασα, γιατί ήταν το νούμερό μου, το πενήντα δύο. Η Ρούλα αγόρασε ένα κόκκινο φόρεμα και σανδάλια. Μετά φάγαμε σουβλάκια δίπλα στην εκκλησία.

      Στο σπίτι όμως είδα ότι μου είναι μεγάλο. Τη Δευτέρα πήγα πάλι στο μαγαζί με την απόδειξη. Ο πωλητής είπε ότι δεν έχουν το μπλε σε πιο μικρό νούμερο. Έτσι πήρα ένα μαύρο μπουφάν, ένα νούμερο πιο μικρό. Δεν πλήρωσα τίποτα άλλο, γιατί η τιμή ήταν η ίδια.

      Σπύρος
    glosses:
      - text: Έτσι
        russian: так что, поэтому
  - type: exercise
    id: jacket-choice
    about: jacket
    graded: true
    title: Чтение 3 — выбор из четырёх
    instruction: Прочитайте текст и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Γιατί πήγε ο Σπύρος για ψώνια;
        options:
          - Γιατί το παλιό του μπουφάν είναι στενό.
          - Γιατί το παλιό του μπουφάν είναι μεγάλο.
          - Γιατί το μαγαζί είχε έκπτωση.
          - Γιατί δεν έχει κανένα μπουφάν.
        answer: Γιατί το παλιό του μπουφάν είναι στενό.
        explanation: Το παλιό μου είναι πολύ στενό. Большим оказалось новое, а о скидке он узнал уже в магазине.
      - id: q2
        prompt: Πόσο πλήρωσε ο Σπύρος για το μπουφάν;
        options:
          - 20 ευρώ.
          - 70 ευρώ.
          - 90 ευρώ.
          - 110 ευρώ.
        answer: 70 ευρώ.
        explanation: "Ενενήντα (90) минус έκπτωση είκοσι (20) — 70 евро. В понедельник он ничего не доплатил: Δεν πλήρωσα τίποτα άλλο (модули 04, 10)."
      - id: q3
        prompt: Τι αγόρασε η Ρούλα;
        options:
          - Ένα κόκκινο φόρεμα και σανδάλια.
          - Ένα μπλε φόρεμα και σανδάλια.
          - Ένα κόκκινο μπουφάν.
          - Μια φούστα και μια μπλούζα.
        answer: Ένα κόκκινο φόρεμα και σανδάλια.
        explanation: Синий (σκούρο μπλε) — куртка Спироса, а не платье Рулы.
      - id: q4
        prompt: Γιατί δεν δοκίμασε ο Σπύρος το μπουφάν στο μαγαζί;
        options:
          - Γιατί ήταν το νούμερό του.
          - Γιατί το δοκιμαστήριο ήταν κλειστό.
          - Γιατί δεν είχε χρόνο.
          - Γιατί η Ρούλα το δοκίμασε.
        answer: Γιατί ήταν το νούμερό του.
        explanation: Δεν το δοκίμασα, γιατί ήταν το νούμερό μου — он думал, что размер подойдёт.
      - id: q5
        prompt: Τι έκανε ο Σπύρος τη Δευτέρα;
        options:
          - Άλλαξε το μπουφάν.
          - Πήρε πίσω τα λεφτά του.
          - Αγόρασε και ένα δεύτερο μπουφάν.
          - Πήγε στο μαγαζί χωρίς την απόδειξη.
        answer: Άλλαξε το μπουφάν.
        explanation: "Он взял другую куртку и ничего не доплатил — это обмен (αλλάζω → άλλαξα), а не возврат (η επιστροφή): деньги назад (πίσω τα λεφτά) он не брал (модуль 11)."
      - id: q6
        prompt: Τι μπουφάν έχει τώρα ο Σπύρος;
        options:
          - Ένα σκούρο μπλε, πιο μικρό.
          - Ένα μαύρο, πιο μικρό.
          - Ένα μαύρο, πιο μεγάλο.
          - Ένα σκούρο μπλε, πιο μεγάλο.
        answer: Ένα μαύρο, πιο μικρό.
        explanation: Синей куртки меньшего размера не было, поэтому πήρα ένα μαύρο μπουφάν, ένα νούμερο πιο μικρό.
  - type: reading
    id: village
    title: Ένα μήνυμα από τη Χαρά
    text: |-
      Γεια σου, Ελπίδα!

      Πώς είσαι; Την περασμένη Κυριακή ο άντρας μου κι εγώ (1) ___ στο χωριό της γιαγιάς μου, κοντά στην Πάφο. Η γιαγιά μου είναι ογδόντα πέντε χρονών, αλλά μαγειρεύει ακόμα κάθε μέρα. Πήραμε το λεωφορείο από τη Λεμεσό στις οκτώ το πρωί. Το σπίτι της γιαγιάς είναι παλιό, αλλά έχει ένα (2) ___ μπαλκόνι με θέα στη θάλασσα. Η γιαγιά (3) ___ κλέφτικο για όλους μας — ήταν πολύ νόστιμο!

      Το απόγευμα περπατήσαμε (4) ___ την παλιά εκκλησία του χωριού. Είναι πολύ ωραία και έχει ένα μικρό μουσείο. Εκεί είδαμε πολλά παλιά πράγματα από το χωριό. Φύγαμε από το χωριό στις (5) ___ και μισή, (6) ___ τη Δευτέρα δουλεύουμε και οι δύο.

      Την επόμενη φορά έλα κι εσύ μαζί μας!

      Φιλιά,
      Χαρά
    glosses:
      - text: περπατήσαμε
        russian: мы прошли пешком (περπατάω → περπάτησα)
      - text: και οι δύο
        russian: оба
      - text: Φιλιά
        russian: целую (в конце письма)
  - type: exercise
    id: village-gap
    about: village
    graded: true
    title: Чтение 4 — пропуски
    instruction: Прочитайте сообщение и вставьте слова. Каждое слово — один раз; три слова лишние.
    format: gap
    bank:
      - πήγαμε
      - πηγαίνουμε
      - μεγάλο
      - μεγάλη
      - μαγείρεψε
      - μέχρι
      - τέσσερις
      - τέσσερα
      - γιατί
    items:
      - id: g1
        prompt: (1) Την περασμένη Κυριακή ο άντρας μου κι εγώ ___ στο χωριό της γιαγιάς μου.
        answer: πήγαμε
        explanation: "Την περασμένη Κυριακή — прошлое, а ο άντρας μου κι εγώ — «мы»: аорист πήγαμε. Πηγαίνουμε — настоящее время (модули 14–15)."
      - id: g2
        prompt: (2) Έχει ένα ___ μπαλκόνι με θέα στη θάλασσα.
        answer: μεγάλο
        explanation: "Το μπαλκόνι — средний род (ένα), поэтому μεγάλο. Μεγάλη — женский род: μια μεγάλη κουζίνα (модуль 07)."
      - id: g3
        prompt: (3) Η γιαγιά ___ κλέφτικο για όλους μας.
        answer: μαγείρεψε
        explanation: "Η γιαγιά — «она»: μαγείρεψε, аорист от μαγειρεύω (-εύω → -ψα, модуль 14). Πήγαμε — «мы» и не подходит по смыслу."
      - id: g4
        prompt: (4) Το απόγευμα περπατήσαμε ___ την παλιά εκκλησία του χωριού.
        answer: μέχρι
        explanation: "Μέχρι + винительный падеж — «до»: μέχρι την εκκλησία, как Συνέχισε μέχρι την πλατεία (модули 12–13)."
      - id: g5
        prompt: (5) Φύγαμε από το χωριό στις ___ και μισή.
        answer: τέσσερις
        explanation: "О времени — женский род (η ώρα): στις τέσσερις και μισή. Τέσσερα — средний род: τέσσερα λεπτά (модуль 04)."
      - id: g6
        prompt: (6) Φύγαμε… ___ τη Δευτέρα δουλεύουμε και οι δύο.
        answer: γιατί
        explanation: Причина, «потому что» — γιατί. Уехали рано, потому что в понедельник оба работают.
  - type: listening
    id: jobs
    title: Έξι άνθρωποι και οι δουλειές τους
    plays: 2
    transcript:
      - speaker: Στέλιος
        text: Δουλεύω σε μια ταβέρνα στη Λάρνακα, αλλά δεν είμαι σερβιτόρος. Είμαι όλη μέρα στην κουζίνα και μαγειρεύω ψάρι, μουσακά και κλέφτικο.
      - speaker: Ευτυχία
        text: Είμαι κομμώτρια. Έχω ένα μικρό μαγαζί δίπλα στην πλατεία. Σήμερα έχω πολλούς πελάτες και δεν έχω χρόνο για καφέ.
      - speaker: Αντρέας
        text: Οδηγώ λεωφορείο. Κάθε πρωί πηγαίνω από τη Λευκωσία μέχρι τη Λεμεσό με πολλούς επιβάτες, και το απόγευμα γυρίζω. Η διαδρομή κάνει μία ώρα.
      - speaker: Γιώργος
        text: Είμαι ηλεκτρολόγος. Σήμερα το πρωί πήγα σε ένα διαμέρισμα, γιατί το κλιματιστικό στο σαλόνι ήταν χαλασμένο. Τώρα δουλεύει πάλι.
      - speaker: Θεοδώρα
        text: Είμαι γιατρός στο νοσοκομείο της Πάφου. Δουλεύω με παιδιά, από τις οκτώ μέχρι τις τρεις. Η δουλειά μου είναι κουραστική, αλλά την αγαπάω.
      - speaker: Κώστας
        text: Κάθε Τετάρτη και κάθε Σάββατο είμαι στη λαϊκή. Πουλάω φρέσκα φρούτα από το χωριό μου — καρπούζια, πεπόνια και σταφύλια.
  - type: exercise
    id: jobs-match
    about: jobs
    graded: true
    title: Аудирование 1 — описания и картинки
    instruction: Прослушайте шесть человек два раза. Какая картинка подходит каждому? Две картинки лишние.
    format: match
    bank:
      - повар готовит на кухне ресторана
      - официант несёт тарелки к столику
      - парикмахер стрижёт клиентку
      - водитель за рулём автобуса
      - мастер чинит стиральную машину
      - электрик чинит кондиционер в квартире
      - врач осматривает ребёнка
