  - type: listening
    id: excursion
    title: Στο λεωφορείο της εκδρομής
    plays: 2
    transcript:
      - speaker: Σάββας
        text: Καλημέρα σας και καλώς ήρθατε στην εκδρομή μας! Με λένε Σάββα. Τώρα είναι εννέα και μισή, και σε μία ώρα περίπου φτάνουμε στο χωριό. Εκεί πρώτα πηγαίνουμε σε μια παλιά εκκλησία και σε ένα μικρό μουσείο. Στο μουσείο υπάρχουν πολλά παλιά πράγματα από το χωριό. Το μουσείο είναι κλειστό τη Δευτέρα, αλλά σήμερα είναι Τρίτη, και είναι ανοιχτό. Στη μία τρώμε μεσημεριανό σε μια ταβέρνα στην πλατεία του χωριού. Το φαγητό περιλαμβάνεται στην τιμή της εκδρομής, αλλά τα ποτά τα πληρώνετε εσείς. Μετά έχετε ελεύθερο χρόνο για βόλτα μέχρι τις τρεις. Στις τρεις το λεωφορείο φεύγει από τη στάση δίπλα στο ταχυδρομείο — και δεν περιμένει! Στη Λεμεσό φτάνουμε στις πέντε. Αν χρειάζεστε κάτι, είμαι εδώ μπροστά, δίπλα στον οδηγό.
