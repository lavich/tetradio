title: Контрольная модуля 12
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: party
    title: Έλα στο πάρτι!
    text: |-
      Γεια σου, Σοφία!

      Το Σάββατο στις οκτώ το βράδυ κάνω πάρτι στο καινούργιο μου διαμέρισμα. Μένω τώρα στη Λευκωσία, στην οδό Ερμού 12.

      Από το κέντρο πάρε το λεωφορείο 16 και κατέβα στην πέμπτη στάση, μπροστά στο νοσοκομείο. Από τη στάση πήγαινε ευθεία μέχρι το φανάρι. Στο φανάρι πέρασε τον δρόμο και στρίψε αριστερά. Μετά πάρε τον πρώτο δρόμο δεξιά — στη γωνία υπάρχει μια μικρή εκκλησία. Το κτίριό μου είναι το τρίτο αριστερά, ανάμεσα σε ένα φαρμακείο και μια τράπεζα. Μένω στον δεύτερο όροφο.

      Από τη στάση είναι πέντε λεπτά με τα πόδια. Αν χαθείς, πάρε με τηλέφωνο: 99 45 23 17.

      Τα λέμε!
      Χριστίνα
    glosses:
      - text: πάρτι
        russian: вечеринка
      - text: οδό
        russian: улица (в адресах; η οδός)
      - text: κατέβα στην πέμπτη στάση
        russian: выйди на пятой остановке
      - text: Αν χαθείς
        russian: если заблудишься
      - text: πάρε με τηλέφωνο
        russian: позвони мне
  - type: exercise
    id: party-tf
    about: party
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το πάρτι είναι την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το Σάββατο στις οκτώ το βράδυ.
      - id: q2
        prompt: Η Σοφία κατεβαίνει από το λεωφορείο μπροστά στο νοσοκομείο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Στο φανάρι η Σοφία στρίβει δεξιά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Στο φανάρι πέρασε τον δρόμο και στρίψε αριστερά. Направо — только следующая улица."
      - id: q4
        prompt: Στη γωνία του πρώτου δρόμου δεξιά υπάρχει μια εκκλησία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Το κτίριο της Χριστίνας είναι απέναντι από την τράπεζα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Здание между аптекой и банком (ανάμεσα σε ένα φαρμακείο και μια τράπεζα), а не напротив.
      - id: q6
        prompt: Η Χριστίνα μένει στον δεύτερο όροφο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Από τη στάση μέχρι το σπίτι της Χριστίνας είναι μακριά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πέντε λεπτά με τα πόδια — близко.
  - type: listening
    id: lost
    title: Χάθηκα!
    plays: 2
    transcript:
      - speaker: Λένα
        text: Γιώργο, γεια σου! Χάθηκα! Είμαι στη στάση του λεωφορείου, απέναντι από το δημαρχείο.
      - speaker: Γιώργος
        text: Δεν πειράζει, δεν είσαι μακριά. Βλέπεις μια τράπεζα;
      - speaker: Λένα
        text: Ναι, βλέπω μια τράπεζα δίπλα στο ταχυδρομείο.
      - speaker: Γιώργος
        text: Ωραία. Πήγαινε ευθεία μέχρι τον κυκλικό κόμβο.
      - speaker: Λένα
        text: Μέχρι τον κυκλικό κόμβο. Και εκεί;
      - speaker: Γιώργος
        text: Στον κυκλικό κόμβο πάρε την τρίτη έξοδο. Όχι την πρώτη! Η πρώτη πηγαίνει στο νοσοκομείο.
      - speaker: Λένα
        text: Την τρίτη. Εντάξει.
      - speaker: Γιώργος
        text: Μετά συνέχισε ευθεία μέχρι το πάρκο. Το σπίτι μου είναι απέναντι από το πάρκο, δίπλα σε ένα φαρμακείο.
      - speaker: Λένα
        text: Είναι μακριά από εδώ;
      - speaker: Γιώργος
        text: Όχι, είναι δέκα λεπτά με τα πόδια. Μένω στον τρίτο όροφο.
      - speaker: Λένα
        text: Στον τρίτο όροφο. Ωραία, έρχομαι!
      - speaker: Γιώργος
        text: Σε περιμένω!
  - type: exercise
    id: lost-choice
    about: lost
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού είναι η Λένα τώρα;
        options:
          - Στη στάση του λεωφορείου, απέναντι από το δημαρχείο.
          - Στη στάση του λεωφορείου, απέναντι από το πάρκο.
          - Στο ταχυδρομείο.
        answer: Στη στάση του λεωφορείου, απέναντι από το δημαρχείο.
      - id: q2
        prompt: Τι βλέπει η Λένα δίπλα στο ταχυδρομείο;
        options:
          - Μια τράπεζα.
          - Ένα φαρμακείο.
          - Ένα νοσοκομείο.
        answer: Μια τράπεζα.
      - id: q3
        prompt: Ποια έξοδο παίρνει η Λένα στον κυκλικό κόμβο;
        options:
          - Την πρώτη.
          - Τη δεύτερη.
          - Την τρίτη.
        answer: Την τρίτη.
        explanation: "Ловушка: первый съезд Йоргос называет, но он ведёт в больницу."
      - id: q4
        prompt: Πού είναι το σπίτι του Γιώργου;
        options:
          - Απέναντι από το πάρκο.
          - Δίπλα στο νοσοκομείο.
          - Δίπλα στην τράπεζα.
        answer: Απέναντι από το πάρκο.
      - id: q5
        prompt: Σε ποιον όροφο μένει ο Γιώργος;
        options:
          - Στον πρώτο.
          - Στον δεύτερο.
          - Στον τρίτο.
        answer: Στον τρίτο.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Κυρία, ___ ευθεία μέχρι την πλατεία.
        options:
          - πηγαίνετε
          - πήγαινε
          - πηγαίνω
        answer: πηγαίνετε
        explanation: Κυρία — вежливое обращение, на «вы».
      - id: q2
        prompt: Μαρία, ___ τον δρόμο στο φανάρι!
        options:
          - πέρασε
          - περάστε
          - περνάω
        answer: πέρασε
      - id: q3
        prompt: Κύριε, ___ δεξιά στη γωνία.
        options:
          - στρίψτε
          - στρίψε
          - στρίβετε
        answer: στρίψτε
        explanation: Στρίβετε — настоящее время «вы поворачиваете»; просьба — στρίψτε.
      - id: q4
        prompt: Η στάση ___ λεωφορείου είναι εδώ.
        options:
          - του
          - της
          - το
        answer: του
      - id: q5
        prompt: Το ταχυδρομείο είναι στο κέντρο της ___.
        options:
          - πόλη
          - πόλης
          - πόλεις
        answer: πόλης
      - id: q6
        prompt: Αυτό είναι το σπίτι του ___.
        options:
          - Νίκος
          - Νίκο
          - Νίκου
        answer: Νίκου
      - id: q7
        prompt: Πάρτε τον ___ δρόμο αριστερά.
        options:
          - δεύτερο
          - δεύτερη
          - δεύτερος
        answer: δεύτερο
      - id: q8
        prompt: Η τράπεζα είναι απέναντι από ___ φαρμακείο.
        options:
          - το
          - του
          - στο
        answer: το
        explanation: απέναντι από + винительный падеж — απέναντι από το φαρμακείο.
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το ταχυδρομείο
      - η τράπεζα
      - το φαρμακείο
      - η εκκλησία
      - το φανάρι
      - η διάβαση
      - η γωνία
      - το δημαρχείο
      - ο χάρτης
      - το μουσείο
    items:
      - id: m1
        prompt: почта
        answer: το ταχυδρομείο
      - id: m2
        prompt: банк
        answer: η τράπεζα
      - id: m3
        prompt: аптека
        answer: το φαρμακείο
      - id: m4
        prompt: светофор
        answer: το φανάρι
      - id: m5
        prompt: пешеходный переход
        answer: η διάβαση
      - id: m6
        prompt: мэрия
        answer: το δημαρχείο
      - id: m7
        prompt: карта
        answer: ο χάρτης
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы хотите спросить прохожего, где остановка автобуса.
        options:
          - Συγγνώμη, πού είναι η στάση του λεωφορείου;
          - Συγγνώμη, πώς σας λένε;
          - Συγγνώμη, είναι ελεύθερο αυτό το τραπέζι;
        answer: Συγγνώμη, πού είναι η στάση του λεωφορείου;
      - id: q2
        prompt: Вам объясняют дорогу, а вы хотите знать, долго ли идти.
        options:
          - Είναι μακριά από εδώ;
          - Πόσο κάνει;
          - Τι ώρα είναι;
        answer: Είναι μακριά από εδώ;
      - id: q3
        prompt: "Вы объясняете туристу: «Банк напротив почты»."
        options:
          - Η τράπεζα είναι απέναντι από το ταχυδρομείο.
          - Η τράπεζα είναι δίπλα στο ταχυδρομείο.
          - Η τράπεζα είναι μακριά από το ταχυδρομείο.
        answer: Η τράπεζα είναι απέναντι από το ταχυδρομείο.
      - id: q4
        prompt: "Вы объясняете: «Это пять минут пешком»."
        options:
          - Είναι πέντε λεπτά με τα πόδια.
          - Είναι πέντε και τέταρτο.
          - Κάνει πέντε ευρώ.
        answer: Είναι πέντε λεπτά με τα πόδια.
