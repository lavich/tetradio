blocks:
  - type: explanation
    id: phrases
    title: Встреча, извинение, прощание
    body: |-
      **Καλώς ήρθες!** — «Добро пожаловать!» одному человеку на «ты»; на «вы» или нескольким — **Καλώς ήρθατε!** Так встречают гостя дома, в офисе, в стране.

      На **Συγγνώμη!** («Извините!») обычно отвечают **Δεν πειράζει.** — «Ничего страшного». Δεν — отрицание «не».

      **Τα λέμε!** — «Увидимся!», дружеское прощание. Официально прощаются так: Γεια σας!
    table:
      columns:
        - реплика
        - ответ
      rows:
        - - Καλώς ήρθες!
          - Ευχαριστώ!
        - - Συγγνώμη!
          - Δεν πειράζει.
        - - Ευχαριστώ!
          - Παρακαλώ.
        - - Χάρηκα πολύ.
          - Επίσης.
        - - Τα λέμε!
          - Τα λέμε! / Γεια σου!
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrases-choice
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Подруга впервые приехала к вам в гости.
        options:
          - Καλώς ήρθες!
          - Δεν πειράζει!
          - Τα λέμε!
        answer: Καλώς ήρθες!
      - id: q2
        prompt: "Человек говорит вам: «Συγγνώμη!»"
        options:
          - Δεν πειράζει.
          - Επίσης.
          - Καλώς ήρθες!
        answer: Δεν πειράζει.
        explanation: На извинение отвечают Δεν πειράζει — «Ничего страшного».
      - id: q3
        prompt: Вы прощаетесь с другом до завтра.
        options:
          - Τα λέμε!
          - Καλημέρα!
          - Χάρηκα πολύ.
        answer: Τα λέμε!
      - id: q4
        prompt: Вы встречаете в аэропорту группу коллег.
        options:
          - Καλώς ήρθες!
          - Καλώς ήρθατε!
        answer: Καλώς ήρθατε!
        explanation: "Людей несколько — форма на «вы»: ήρθατε."
      - id: q5
        prompt: "Новый знакомый говорит: «Χάρηκα πολύ!»"
        options:
          - Επίσης!
          - Παρακαλώ!
          - Συγγνώμη!
        answer: Επίσης!
  - type: explanation
    id: writing-how
    title: Как написать о себе
    body: |-
      На экзамене письменная часть — это короткие тексты: дружеское письмо или сообщение. В этом модуле пишем 3–5 предложений по схеме ниже. Каждое предложение, кроме приветствия и прощания, — с глаголом: **Είμαι…**, **Με λένε…**.

      Правила экзамена стоит соблюдать с первого дня: пишите **печатными буквами, не целиком ЗАГЛАВНЫМИ** (заглавная — только в начале предложения и в именах, иначе пропадает тонос), ставьте тонос, **не пишите своё настоящее имя** — придумайте другое.

      Проверьте себя после письма: есть ли ς в конце слов (αυτός, εσείς), стоит ли тонос в словах из двух и больше слогов, есть ли «;» в вопросе.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - поздороваться
          - Γεια σου! / Καλημέρα!
        - - назвать имя
          - Με λένε … / Είμαι η … / Είμαι ο …
        - - сказать откуда
          - Είμαι από τη Ρωσία / από τη Μόσχα.
        - - сказать где сейчас
          - Τώρα είμαι στην Κύπρο / στη Λεμεσό.
        - - рассказать о друге
          - Ο φίλος μου ο … είναι από …
        - - попрощаться
          - Τα λέμε! / Γεια σου!
  - type: exercise
    id: sentences
    title: Предложения о себе
    instruction: Напишите по-гречески. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Меня зовут Вера.
        answer:
          - Με λένε Βέρα.
          - Με λένε Βέρα
          - Λέγομαι Βέρα.
          - Λέγομαι Βέρα
          - Ονομάζομαι Βέρα.
          - Ονομάζομαι Βέρα
      - id: q2
        prompt: Сейчас я на Кипре. (на Кипре — στην Κύπρο)
        answer:
          - Τώρα είμαι στην Κύπρο.
          - Τώρα είμαι στην Κύπρο
          - Είμαι τώρα στην Κύπρο.
          - Είμαι τώρα στην Κύπρο
          - Εγώ τώρα είμαι στην Κύπρο.
          - Εγώ τώρα είμαι στην Κύπρο
        explanation: Не пропускайте глагол — είμαι.
      - id: q3
        prompt: Мой друг с Кипра.
        answer:
          - Ο φίλος μου είναι από την Κύπρο.
          - Ο φίλος μου είναι από την Κύπρο
        explanation: μου стоит после слова — ο φίλος μου; перед κ артикль την сохраняет ν.
      - id: q4
        prompt: Моя подруга из Москвы.
        answer:
          - Η φίλη μου είναι από τη Μόσχα.
          - Η φίλη μου είναι από τη Μόσχα
      - id: q5
        prompt: Очень приятно!
        answer:
          - Χάρηκα πολύ!
          - Χάρηκα πολύ
          - Χάρηκα πολύ.
      - id: q6
        prompt: Как вас зовут?
        answer:
          - Πώς σας λένε;
          - Πώς σας λένε
        explanation: Вежливо — σας; σε — на «ты».
      - id: q7
        prompt: Откуда вы?
        answer:
          - Από πού είστε;
          - Από πού είστε
  - type: writing
    id: about-me
    register: friendly
    prompt: "Вы нашли в приложении собеседника для языкового обмена — грека с Кипра. Напишите ему первое сообщение, 3–5 предложений: поздоровайтесь, назовите имя (придуманное), скажите, откуда вы и где вы сейчас, попрощайтесь. Можно добавить предложение о друге или подруге."
    words:
      min: 12
      max: 45
    model: Γεια σου! Με λένε Βέρα. Είμαι από τη Ρωσία, από τη Μόσχα. Τώρα είμαι στην Κύπρο, στη Λεμεσό. Η φίλη μου η Όλγα είναι από την Πάφο. Τα λέμε!
    criteria:
      - Есть приветствие (Γεια σου! / Καλημέρα!) и дружеское прощание (Τα λέμε! / Γεια σου!), без форм на «вы» (не Γεια σας)
      - "Названо имя: Με λένε … или Είμαι η/ο …"
      - "Сказано, откуда вы: Είμαι από τη(ν) …"
      - "Сказано, где вы сейчас: Τώρα είμαι στη(ν) …"
      - В каждом предложении, кроме приветствия и прощания, есть глагол (είμαι, είναι, λένε)
      - Во всех словах из двух и больше слогов стоит тонос, в конце слов — ς
      - Написано печатными буквами, не целиком заглавными; имя не настоящее
  - type: explanation
    id: speaking-how
    title: Как отвечать на вопросы экзаменатора
    body: |-
      Первая часть устного экзамена — простые вопросы о себе. Экзаменатор обращается на «вы» (σας, είστε), а вы отвечаете о себе — в 1-м лице: **Πώς σας λένε;** → **Με λένε …**; **Από πού είστε;** → **Είμαι από …**.

      Отвечайте полным предложением, а не одним словом: не «Μόσχα», а «Είμαι από τη Μόσχα». Паузу можно заполнить: «Ε…» — так делают и греки.

      Запишите ответ на телефон, послушайте и сверьте с образцом и критериями. Обратите внимание на ударение и на δ, γ, χ.
    table:
      columns:
        - вопрос
        - как ответить
      rows:
        - - Πώς σας λένε;
          - Με λένε …
        - - Από πού είστε;
          - Είμαι από …
        - - Πού είστε τώρα;
          - Τώρα είμαι στην Κύπρο / στη …
        - - Τι κάνετε;
          - Καλά, ευχαριστώ.
  - type: speaking
    id: interview
    part: interview
    prompt: |-
      Экзаменатор задаёт вопросы. Прочитайте каждый вопрос вслух, затем ответьте без подготовки, запишите ответы:
      Καλημέρα σας! Τι κάνετε; Πώς σας λένε; Από πού είστε; Πού είστε τώρα;
    seconds: 60
    model: Καλημέρα σας! Καλά, ευχαριστώ. Με λένε Βέρα. Είμαι από τη Ρωσία, από τη Μόσχα. Τώρα είμαι στην Κύπρο, στη Λεμεσό.
    criteria:
      - Ответили на все четыре вопроса
      - Каждый ответ — полное предложение с глаголом
      - Ответили на приветствие (Καλημέρα σας!) и поблагодарили (Καλά, ευχαριστώ)
      - Правильные формы о себе — είμαι, με λένε (а не είστε, σας λένε)
      - Ударение на своём месте (ευχαριστώ, Ρωσία, Κύπρο), ευ в ευχαριστώ звучит [эф], а не [эв] или [эу]
  - type: speaking
    id: meet
    part: roleplay
    prompt: Ролевая игра. Вечер, вы на вечеринке в Лимасоле, рядом стоит незнакомый человек вашего возраста. Поздоровайтесь, представьтесь, спросите, как его зовут и откуда он, ответьте «Очень приятно» и попрощайтесь. Говорите на «ты». Скажите свою часть разговора вслух и запишите.
    seconds: 45
    model: Καλησπέρα! Είμαι η Βέρα. Πώς σε λένε; … Χάρηκα πολύ! Από πού είσαι; … Εγώ είμαι από τη Ρωσία. Τα λέμε!
    criteria:
      - Есть приветствие по времени суток (Καλησπέρα! вечером)
      - "Представились: Είμαι η/ο … или Με λένε …"
      - Задали два вопроса на «ты» — Πώς σε λένε; и Από πού είσαι; — с вопросительной интонацией
      - Сказали Χάρηκα πολύ и попрощались (Τα λέμε! или Γεια σου!)
  - type: exercise
    id: review-read
    title: Повторение — чтение
    instruction: Как читается слово?
    format: choice
    items:
      - id: q1
        prompt: συγγνώμη (извините)
        options:
          - "[сиɣно́ми]"
          - "[сугно́мэ]"
          - "[сиггно́ми]"
        answer: "[сиɣно́ми]"
        explanation: υ и η — [и]; γγν в этом слове обычно звучит как [ɣн].
      - id: q2
        prompt: καλησπέρα (добрый вечер)
        options:
          - "[калиспэ́ра]"
          - "[кали́спэра]"
          - "[калэспэ́ра]"
        answer: "[калиспэ́ра]"
      - id: q3
        prompt: επίσης (взаимно)
        options:
          - "[эпи́сис]"
          - "[эписи́с]"
          - "[эпи́сэс]"
        answer: "[эпи́сис]"
        explanation: ί и η — [и]; ударение по тоносу — на втором слоге.
      - id: q4
        prompt: μηδέν (ноль)
        options:
          - "[мидэ́н]"
          - "[миðэ́н]"
          - "[мэðэ́н]"
        answer: "[миðэ́н]"
        explanation: δ — [ð], как th в английском this.
      - id: q5
        prompt: ΛΕΥΚΩΣΙΑ (табличка на дороге)
        options:
          - "[лэфкоси́а]"
          - "[лэ́вкосиа]"
          - "[лэукоси́а]"
        answer: "[лэфкоси́а]"
        explanation: На табличках тоноса нет. ευ перед κ — [эф]; в строчном написании — Λευκωσία.
      - id: q6
        prompt: γιατί (почему)
        options:
          - "[гиати́]"
          - "[йати́]"
          - "[йа́ти]"
        answer: "[йати́]"
        explanation: γι перед гласной — [й].
  - type: exercise
    id: review-eimai
    title: Повторение — είμαι
    instruction: Вставьте форму είμαι.
    format: gap
    bank:
      - είμαι
      - είσαι
      - είναι
      - είμαστε
      - είστε
    items:
      - id: g1
        prompt: — Γεια σου! Εσύ ___ η Κατερίνα;
        answer: είσαι
      - id: g2
        prompt: — Εσύ είσαι η Κατερίνα; — Όχι, ___ η Όλγα.
        answer: είμαι
      - id: g3
        prompt: Ο Αντρέας και η Μαρίνα ___ φίλοι.
        answer: είναι
        explanation: "Андреас и Марина — «они»: είναι."
      - id: g4
        prompt: Κυρία Ελένη, ___ από την Αθήνα; (κυρία — госпожа)
        answer: είστε
        explanation: Вежливое обращение — форма «вы».
      - id: g5
        prompt: Εγώ και ο Μιχάλης ___ από τη Λάρνακα.
        answer: είμαστε
      - id: g6
        prompt: Η Όλγα ___ τώρα στην Πάφο.
        answer: είναι
  - type: exercise
    id: review-match
    title: Повторение — фразы
    instruction: Соедините русскую фразу с греческой. Две греческие фразы лишние.
    format: match
    bank:
      - Τα λέμε!
      - Δεν πειράζει.
      - Καλώς ήρθες!
      - Χάρηκα πολύ.
      - Από πού είσαι;
      - Πώς σας λένε;
      - Πώς σε λένε;
      - Καλησπέρα!
    items:
      - id: m1
        prompt: Увидимся!
        answer: Τα λέμε!
      - id: m2
        prompt: Ничего страшного.
        answer: Δεν πειράζει.
      - id: m3
        prompt: Добро пожаловать!
        answer: Καλώς ήρθες!
      - id: m4
        prompt: Очень приятно.
        answer: Χάρηκα πολύ.
      - id: m5
        prompt: Откуда ты?
        answer: Από πού είσαι;
      - id: m6
        prompt: Как вас зовут?
        answer: Πώς σας λένε;
        explanation: «Вас» — σας; «тебя» — σε.
  - type: exercise
    id: review-dialogue
    title: Повторение — диалог
    instruction: Дополните диалог. Две реплики лишние.
    format: gap
    bank:
      - Καλημέρα
      - Πώς σε λένε
      - Χάρηκα πολύ
      - Από πού είσαι
      - Επίσης
      - Τα λέμε
      - Συγγνώμη
    items:
      - id: g1
        prompt: "Νίκος: ___! Είμαι ο Νίκος."
        answer: Καλημέρα
      - id: g2
        prompt: "Νίκος: ___; — Άννα: Με λένε Άννα."
        answer: Πώς σε λένε
      - id: g3
        prompt: "Νίκος: ___, Άννα! — Άννα: Επίσης!"
        answer: Χάρηκα πολύ
      - id: g4
        prompt: "Νίκος: ___; — Άννα: Είμαι από τη Ρωσία."
        answer: Από πού είσαι
      - id: g5
        prompt: "Νίκος: Ωραία! ___! — Άννα: Γεια σου!"
        answer: Τα λέμε
        explanation: В конце разговора прощаются — Τα λέμε, «увидимся».
