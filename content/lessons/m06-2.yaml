  - type: exercise
    id: verbs-gap
    title: Глаголы урока
    instruction: Вставьте глагол. Подсказка — в скобках.
    format: gap
    bank:
      - ψάχνω
      - ψάχνεις
      - βρίσκω
      - βρίσκεις
      - πληρώνεις
      - πληρώνουμε
      - νοικιάζει
      - νοικιάζεται
    items:
      - id: g1
        prompt: Εγώ ___ διαμέρισμα με δύο δωμάτια. (ищу)
        answer: ψάχνω
      - id: g2
        prompt: Εσύ ___ σπίτι στη Λευκωσία; (ищешь)
        answer: ψάχνεις
      - id: g3
        prompt: Εμείς ___ το ενοίκιο κάθε μήνα. (платим)
        answer: πληρώνουμε
      - id: g4
        prompt: Στη Λάρνακα ___ δωμάτιο. (сдаётся)
        answer: νοικιάζεται
        explanation: Νοικιάζεται — формула объявления «сдаётся».
      - id: g5
        prompt: Ο κύριος Χρήστος ___ ένα διαμέρισμα. (сдаёт)
        answer: νοικιάζει
        explanation: "Хозяин сдаёт сам — νοικιάζει; квартира «сдаётся» — νοικιάζεται."
      - id: g6
        prompt: Δεν ___ διαμέρισμα κοντά στη θάλασσα. (я не нахожу)
        answer: βρίσκω
      - id: g7
        prompt: Πόσο ___ για το νερό; (ты платишь)
        answer: πληρώνεις
  - type: exercise
    id: pronouns-gap
    title: Κάτι, τίποτα, κάποιος, κανένας
    instruction: Вставьте слово. Подсказка — в скобках. Одно слово лишнее.
    format: gap
    bank:
      - κάτι
      - τίποτα
      - κάποιος
      - κανένας
      - κανένα
      - κάποια
    items:
      - id: g1
        prompt: Δεν υπάρχει ___ στο δωμάτιο. (ничего)
        answer: τίποτα
      - id: g2
        prompt: Υπάρχει ___ στο τραπέζι. (что-то)
        answer: κάτι
      - id: g3
        prompt: Είναι ___ στην πόρτα. (кто-то, мужчина)
        answer: κάποιος
      - id: g4
        prompt: Στο σπίτι δεν είναι ___. (никто)
        answer: κανένας
        explanation: С κανένας глагол стоит с δεν, как в русском «никого нет».
      - id: g5
        prompt: Στο δωμάτιο δεν υπάρχει ___ τραπέζι. (ни одного)
        answer: κανένα
        explanation: Το τραπέζι — средний род, поэтому κανένα.
  - type: exercise
    id: adjectives
    title: Лёгкий, трудный, плохой
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: — Είναι εύκολο; — Όχι, είναι ___.
        options:
          - δύσκολο
          - κακό
          - κοντά
        answer: δύσκολο
        explanation: Εύκολο — «легко», противоположность — δύσκολο.
      - id: q2
        prompt: Η δουλειά μου είναι ___. (трудная)
        options:
          - δύσκολος
          - δύσκολη
          - δύσκολο
        answer: δύσκολη
        explanation: Η δουλειά — женский род, окончание -η.
      - id: q3
        prompt: Το σπίτι δεν είναι ___. (плохой)
        options:
          - κακός
          - κακή
          - κακό
        answer: κακό
      - id: q4
        prompt: Ο δάσκαλος δεν είναι ___. (злой)
        options:
          - κακός
          - κακή
          - κακό
        answer: κακός
  - type: explanation
    id: ad-how
    title: Как читать объявление
    body: |-
      Объявления об аренде короткие и похожи друг на друга: город или район, **Νοικιάζεται** + что сдаётся, площадь, комнаты, что рядом, **ενοίκιο** и телефон. Глаголов мало — часто одни существительные.

      Сокращения: **τ.μ.** — квадратные метры (τετραγωνικά μέτρα), **τηλ.** — телефон. Цена может быть «с водой» — **με το νερό** — или без неё; тогда воду платит жилец.

      Задание на соединение частей предложения — такое же, как на экзамене: начало нужно соединить с концом по смыслу текста. Два конца лишние. Сначала найдите в тексте, о каком объявлении идёт речь, потом выбирайте.
  - type: reading
    id: ads
    title: Νοικιάζεται
    text: |-
      ΛΕΜΕΣΟΣ. Νοικιάζεται διαμέρισμα, 80 τ.μ., στον δεύτερο όροφο. Έχει δύο υπνοδωμάτια, σαλόνι, κουζίνα και μπάνιο. Στο σαλόνι υπάρχει μεγάλο μπαλκόνι. Το διαμέρισμα είναι με έπιπλα και είναι κοντά στη θάλασσα. Ενοίκιο: 750 ευρώ τον μήνα, με το νερό. Τηλ. 99 45 17 30, κύριος Ανδρέας.

      ΛΕΥΚΩΣΙΑ. Νοικιάζεται μικρό σπίτι με κήπο. Έχει ένα υπνοδωμάτιο, μπάνιο και σαλόνι με κουζίνα. Είναι χωρίς έπιπλα. Δίπλα στο σπίτι υπάρχει σχολείο. Ενοίκιο: 550 ευρώ τον μήνα. Το νερό πληρώνετε εσείς. Τηλ. 96 21 08 44, κυρία Μαρία.

      ΛΑΡΝΑΚΑ. Νοικιάζεται δωμάτιο για φοιτητή σε μεγάλο διαμέρισμα. Η κουζίνα και το μπάνιο είναι για δύο άτομα. Ενοίκιο: 300 ευρώ, με το νερό. Κοντά υπάρχει στάση λεωφορείου. Τηλ. 97 60 33 12.
    glosses:
      - text: τ.μ.
        russian: кв. м (τετραγωνικά μέτρα)
      - text: στον δεύτερο όροφο
        russian: на третьем этаже (этажи считают над ισόγειο — первым этажом)
      - text: μεγάλο
        russian: большой
      - text: μπαλκόνι
        russian: балкон
      - text: με έπιπλα
        russian: с мебелью
      - text: τον μήνα
        russian: в месяц
      - text: μικρό
        russian: маленький
      - text: με κήπο
        russian: с садом
      - text: σχολείο
        russian: школа
      - text: για φοιτητή
        russian: для студента
      - text: άτομα
        russian: человека
      - text: στάση λεωφορείου
        russian: автобусная остановка
  - type: exercise
    id: ads-match
    about: ads
    title: Соедините части
    instruction: Соедините начало и конец предложения по тексту. Два конца лишние.
    format: match
    bank:
      - έχει δύο υπνοδωμάτια.
      - είναι στο σαλόνι.
      - δεν έχει έπιπλα.
      - υπάρχει σχολείο.
      - ένα δωμάτιο για φοιτητή.
      - είναι τριακόσια ευρώ.
      - είναι πίσω από το σπίτι.
      - έχει τρία μπάνια.
    items:
      - id: m1
        prompt: Το διαμέρισμα στη Λεμεσό…
        answer: έχει δύο υπνοδωμάτια.
      - id: m2
        prompt: Το μπαλκόνι…
        answer: είναι στο σαλόνι.
        explanation: Στο σαλόνι υπάρχει μεγάλο μπαλκόνι. «Πίσω από το σπίτι» в тексте нет.
      - id: m3
        prompt: Το σπίτι στη Λευκωσία…
        answer: δεν έχει έπιπλα.
        explanation: Είναι χωρίς έπιπλα — «без мебели». Квартира в Лимасоле, наоборот, με έπιπλα.
      - id: m4
        prompt: Δίπλα στο σπίτι στη Λευκωσία…
        answer: υπάρχει σχολείο.
      - id: m5
        prompt: Στη Λάρνακα νοικιάζεται…
        answer: ένα δωμάτιο για φοιτητή.
      - id: m6
        prompt: Στη Λάρνακα το ενοίκιο…
        answer: είναι τριακόσια ευρώ.
        explanation: "300 — τριακόσια. В Лимасоле 750, в Никосии 550."
  - type: exercise
    id: ads-tf
    about: ads
    title: Верно или неверно
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το διαμέρισμα στη Λεμεσό είναι κοντά στη θάλασσα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Το σπίτι στη Λευκωσία έχει δύο υπνοδωμάτια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Έχει ένα υπνοδωμάτιο. Две спальни — у квартиры в Лимасоле.
      - id: q3
        prompt: Στη Λευκωσία το ενοίκιο είναι με το νερό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το νερό πληρώνετε εσείς — «воду платите вы», отдельно от аренды.
      - id: q4
        prompt: Ο κύριος Ανδρέας νοικιάζει το σπίτι στη Λευκωσία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κύριος Ανδρέας — телефон в объявлении о Лимасоле. В Никосии — κυρία Μαρία.
      - id: q5
        prompt: Στη Λάρνακα ο φοιτητής πληρώνει και το νερό χωριστά. (χωριστά — отдельно)
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ενοίκιο 300 ευρώ, με το νερό — вода уже в цене.
  - type: explanation
    id: listen-how
    title: Разговор с хозяином
    body: |-
      Сейчас вы услышите телефонный разговор: Деспина ищет квартиру, Христос её сдаёт. Они незнакомы, поэтому говорят на «вы»: Καλημέρα σας, νοικιάζετε, Γεια σας.

      В первый раз слушайте, какая квартира и где. Перед вторым прочитайте вопросы и ловите детали: где море, кто живёт внизу, сколько стоит аренда, когда встреча. Числа и время — самые частые вопросы экзамена.
  - type: listening
    id: landlord
    title: Στο τηλέφωνο
    plays: 2
    transcript:
      - speaker: Δέσποινα
        text: "Καλημέρα σας! Με λένε Δέσποινα. Ψάχνω ένα διαμέρισμα στην Πάφο. Νοικιάζετε διαμέρισμα;"
      - speaker: Χρήστος
        text: "Καλημέρα! Ναι. Το διαμέρισμα έχει δύο υπνοδωμάτια, σαλόνι, κουζίνα και μπάνιο."
      - speaker: Δέσποινα
        text: "Πού είναι; Είναι κοντά στη θάλασσα;"
      - speaker: Χρήστος
        text: "Ναι, πολύ κοντά. Η θάλασσα είναι πίσω από το σπίτι."
      - speaker: Δέσποινα
        text: "Ωραία! Το διαμέρισμα είναι πάνω ή κάτω;"
      - speaker: Χρήστος
        text: "Είναι πάνω. Κάτω μένω εγώ με την οικογένειά μου."
      - speaker: Δέσποινα
        text: "Υπάρχει τραπέζι στην κουζίνα;"
      - speaker: Χρήστος
        text: "Ναι, στην κουζίνα υπάρχει τραπέζι και στο σαλόνι υπάρχει τηλεόραση. Αλλά στα υπνοδωμάτια δεν υπάρχει τίποτα."
      - speaker: Δέσποινα
        text: "Πόσο είναι το ενοίκιο;"
      - speaker: Χρήστος
        text: "Εξακόσια ευρώ κάθε μήνα, μαζί με το νερό."
      - speaker: Δέσποινα
        text: "Μπορώ να δω το σπίτι;"
      - speaker: Χρήστος
        text: "Ναι. Αύριο το πρωί, στις δέκα;"
      - speaker: Δέσποινα
        text: "Το πρωί δεν μπορώ, δουλεύω. Το απόγευμα, στις έξι;"
      - speaker: Χρήστος
        text: "Καλά. Τα λέμε αύριο στις έξι."
      - speaker: Δέσποινα
        text: "Ευχαριστώ πολύ! Γεια σας!"
  - type: exercise
    id: landlord-tf
    about: landlord
    title: Верно или неверно
    instruction: Прослушайте разговор. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το διαμέρισμα είναι στη Λεμεσό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ψάχνω ένα διαμέρισμα στην Πάφο — квартира в Пафосе.
      - id: q2
        prompt: Το διαμέρισμα έχει δύο υπνοδωμάτια.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Η θάλασσα είναι μπροστά από το σπίτι.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η θάλασσα είναι πίσω από το σπίτι — море за домом.
      - id: q4
        prompt: Ο Χρήστος μένει κάτω.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Κάτω μένω εγώ με την οικογένειά μου.
      - id: q5
        prompt: Στα υπνοδωμάτια υπάρχουν τραπέζια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Стол есть только на кухне; στα υπνοδωμάτια δεν υπάρχει τίποτα.
      - id: q6
        prompt: Το ενοίκιο είναι μαζί με το νερό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: exercise
    id: landlord-choice
    about: landlord
    title: Выберите ответ
    instruction: Прослушайте разговор ещё раз и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πόσο είναι το ενοίκιο;
        options:
          - 500 ευρώ
          - 600 ευρώ
          - 650 ευρώ
        answer: 600 ευρώ
        explanation: Εξακόσια ευρώ — 600.
      - id: q2
        prompt: Когда Деспина посмотрит квартиру?
        options:
          - завтра в 10 утра
          - завтра в 6 вечера
          - сегодня в 6 вечера
        answer: завтра в 6 вечера
        explanation: Христос предлагает αύριο το πρωί, στις δέκα, но Деспина утром работает — договариваются на αύριο στις έξι.
      - id: q3
        prompt: Почему Деспина не может прийти утром?
        options:
          - она работает
          - она в Лимасоле
          - утром она смотрит другую квартиру
        answer: она работает
        explanation: Το πρωί δεν μπορώ, δουλεύω.
  - type: exercise
    id: words-match
    title: Слова урока
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - τα λεφτά
      - το νερό
      - τα πράγματα
      - το ενοίκιο
      - χωρίς
      - κάτι
      - τίποτα
      - κάποιος
      - πληρώνω
    items:
      - id: m1
        prompt: деньги
