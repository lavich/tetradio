  - type: explanation
    id: kati-tipota
    title: Что-то и ничего, кто-то и никто
    body: |-
      **Κάτι** — «что-то»: Υπάρχει κάτι στο τραπέζι. **Κάποιος** — «кто-то» (κάποια — о женщине): Είναι κάποιος στην πόρτα.

      **Τίποτα** — «ничего», **κανένας** — «никто, ни один». С ними глагол стоит с **δεν** — двойное отрицание, как в русском: **Δεν υπάρχει τίποτα.** — Ничего нет. **Δεν είναι κανένας στο σπίτι.** — Дома никого нет. Перед существительным κανένας меняет род: **κανένα** τραπέζι (ср.), **καμία** πόρτα (ж.).

      Короткий ответ — одно слово, без δεν: — Τι υπάρχει στο δωμάτιο; — **Τίποτα.** — Ποιος είναι στο σπίτι; — **Κανένας.**

      В вопросе без δεν τίποτα значит «что-нибудь»: **Θέλεις τίποτα;** — Хочешь чего-нибудь?

      Предлоги **με** и **χωρίς** — «с» и «без»: διαμέρισμα **με** δύο δωμάτια, ενοίκιο **με** το νερό, διαμέρισμα **χωρίς** έπιπλα (без мебели).

      Три прилагательных — **κακός** (плохой), **εύκολος** (лёгкий), **δύσκολος** (трудный) — меняют окончание по роду: -ος, -η, -ο. **Η δουλειά είναι δύσκολη. Το σπίτι δεν είναι κακό.** «Это легко / трудно» — **Είναι εύκολο / δύσκολο** (средний род).
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Υπάρχει κάτι στο τραπέζι.
          - На столе что-то есть.
        - - Στο δωμάτιο δεν υπάρχει τίποτα.
          - В комнате ничего нет.
        - - Είναι κάποιος στην πόρτα.
          - У двери кто-то есть.
        - - Δεν είναι κανένας στο σπίτι.
          - Дома никого нет.
        - - Ψάχνω ένα διαμέρισμα με δύο δωμάτια.
          - Я ищу квартиру с двумя комнатами.
        - - Είναι δύσκολο.
          - Это трудно.
