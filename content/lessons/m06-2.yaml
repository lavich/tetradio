blocks:
  - type: explanation
    id: renting
    title: Ищу, нахожу, снимаю, плачу
    body: |-
      Четыре глагола урока спрягаются как μένω и δουλεύω из модуля 02: **ψάχνω** — искать, **βρίσκω** — находить, **νοικιάζω** — снимать и сдавать, **πληρώνω** — платить.

      **Ψάχνω** — без предлога, как русское «ищу что»: **Ψάχνω διαμέρισμα.** — Я ищу квартиру. Не добавляйте «για».

      **Νοικιάζω** значит и «снимаю», и «сдаю»: Νοικιάζω ένα δωμάτιο — по смыслу понятно, кто вы — жилец или хозяин. **Νοικιάζεται** — «сдаётся»: это первая строка любого объявления об аренде, запомните её целиком. Хозяин квартиры по-гречески **ο ιδιοκτήτης**, но в разговоре чаще говорят просто по имени: ο κύριος Χρήστος.

      **Το ενοίκιο** — арендная плата: Πόσο είναι το ενοίκιο; — Сколько стоит аренда? Ответ — Εξακόσια ευρώ **τον μήνα** — «шестьсот евро в месяц». **Τα λεφτά** — «деньги», слово есть только во множественном числе: Τα λεφτά είναι στο τραπέζι.
    table:
      columns:
        - лицо
        - ψάχνω
        - πληρώνω
        - νοικιάζω
      rows:
        - - εγώ
          - ψάχνω
          - πληρώνω
          - νοικιάζω
        - - εσύ
