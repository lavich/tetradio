blocks:
  - type: explanation
    id: refuse
    title: Как вежливо отказаться
    body: |-
      Просто «Όχι» в ответ на приглашение звучит резко. Вежливый отказ строят из четырёх частей — так же на экзамене в ролевой игре и в письме:

      1. Сожаление: **Δυστυχώς…** — «к сожалению…» или **Λυπάμαι, αλλά…** — «Мне жаль, но…».
      2. Причина: **…δεν μπορώ, γιατί δουλεύω.** Είμαι **απασχολημένος** (απασχολημένη) — «я занят (занята)». **Έχω άλλο πρόγραμμα** — «у меня другие планы»: **το πρόγραμμα** — и расписание, и программа, и планы на день.
      3. Другой вариант: **Ίσως άλλη φορά.** — «Может, в другой раз». Или перенести: **Μπορούμε να το αναβάλουμε για την Κυριακή;** — «Можем перенести на воскресенье?».
      4. Благодарность: Ευχαριστώ για την πρόσκληση! (урок 3).

      **Λυπάμαι** спрягается как κοιμάμαι (модуль 05): λυπάμαι, λυπάσαι, λυπάται, λυπόμαστε, λυπάστε, λυπούνται. **Αναβάλλω** — «откладываю, переношу»: в настоящем две λ, а в форме от основы аориста (одно действие после να и θα) — одна: να **αναβάλουμε**, θα αναβάλω. Звучат обе одинаково — разница только на письме: να αναβάλλουμε с двумя λ значило бы «откладывать раз за разом». Аорист — **ανέβαλα**, с приращением внутри слова, как επανέλαβα (модуль 16).

      **Αρνούμαι** — «отказываюсь»: Αρνήθηκε την πρόσκληση. — «Он отказался от приглашения». Спрягается как ασχολούμαι (модуль 20): αρνούμαι, αρνείσαι, αρνείται…

      **Ο λόγος** — причина: Ποιος είναι ο λόγος; В официальном письме удобно **για προσωπικούς λόγους** — «по личным причинам». **Η δικαιολογία** — оправдание, отговорка: Αυτό είναι δικαιολογία! — «Это отговорка!». **Η διάθεση** — настроение, желание: **Δεν έχω διάθεση** για έξοδο απόψε. Так честно отказывают только близкому другу.

      **Насколько вы уверены.** **Σίγουρα** — «точно»: Σίγουρα θα έρθω! **Μάλλον** — «скорее всего»: Μάλλον θα αργήσω λίγο. **Ίσως** — «может быть»: Ίσως άλλη φορά. После ίσως часто ставят форму как после να, без θα: Ίσως έρθω και εγώ. Можно сказать и Ίσως θα έρθω — обе фразы правильные.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Δυστυχώς δεν μπορώ, γιατί δουλεύω.
          - "К сожалению, не могу: я работаю."
        - - Λυπάμαι, αλλά έχω άλλο πρόγραμμα.
          - Жаль, но у меня другие планы.
        - - Είμαι απασχολημένη το Σάββατο.
          - В субботу я занята.
        - - Μπορούμε να το αναβάλουμε για την Κυριακή;
          - Можем перенести на воскресенье?
        - - Ίσως άλλη φορά.
          - Может, в другой раз.
        - - Σίγουρα / Μάλλον θα έρθω.
          - Точно / Скорее всего приду.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: refuse-gap
    title: Отказ, причина, настроение
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - δυστυχώς
      - Λυπάμαι
      - απασχολημένη
      - διάθεση
      - δικαιολογία
      - λόγους
      - αναβάλουμε
      - αρνήθηκε
      - καλεσμένοι
    items:
      - id: g1
        prompt: Θέλω πολύ να έρθω, αλλά ___ δεν μπορώ.
        answer: δυστυχώς
      - id: g2
        prompt: — Έρχεσαι το Σάββατο; — ___ πολύ, αλλά δεν μπορώ.
        answer: Λυπάμαι
        explanation: Λυπάμαι πολύ, αλλά… — «Мне очень жаль, но…».
      - id: g3
        prompt: Η Ελένη είναι πολύ ___ αυτή την εβδομάδα — δουλεύει μέχρι αργά κάθε μέρα.
        answer: απασχολημένη
        explanation: Η Ελένη — женский род, απασχολημένη.
      - id: g4
        prompt: Είμαι πολύ κουρασμένος και δεν έχω ___ για πάρτι απόψε.
        answer: διάθεση
        explanation: Δεν έχω διάθεση — «нет настроения, не хочется».
      - id: g5
        prompt: Πάλι λες «έχω πονοκέφαλο»; Αυτό δεν είναι λόγος, είναι ___!
        answer: δικαιολογία
        explanation: Ο λόγος — настоящая причина, η δικαιολογία — отговорка.
      - id: g6
        prompt: Δεν μπορώ να έρθω στη συνάντηση για προσωπικούς ___.
        answer: λόγους
        explanation: Για προσωπικούς λόγους — «по личным причинам», вин. п. мн. ч. от ο λόγος.
      - id: g7
        prompt: Ο Νίκος είναι άρρωστος. Μπορούμε να ___ το πάρτι για την άλλη εβδομάδα;
        answer: αναβάλουμε
        explanation: "Одно действие после να — форма от основы аориста, с одной λ: να αναβάλουμε."
  - type: exercise
    id: sure-choice
    title: Точно, скорее всего, может быть
    instruction: Выберите слово по русскому переводу.
    format: choice
    items:
      - id: q1
        prompt: «Я точно приду!» — ___ θα έρθω!
        options:
          - Σίγουρα
          - Ίσως
          - Μάλλον
        answer: Σίγουρα
      - id: q2
        prompt: «Скорее всего, я немного опоздаю». — ___ θα αργήσω λίγο.
        options:
          - Μάλλον
          - Σίγουρα
          - Δυστυχώς
        answer: Μάλλον
  - type: explanation
    id: conjunctions
    title: Союзы — почему, поэтому, когда, если, но
    body: |-
      Союзы связывают две части фразы. На экзамене оценивают и связность текста: текст «Δεν μπορώ. Δουλεύω.» — из отдельных кусков, а «Δεν μπορώ, γιατί δουλεύω» — связный.

      **Γιατί** — и «почему?», и «потому что». Причина обычно идёт после главной части: Δεν μπορώ να έρθω, **γιατί** δουλεύω. Ответ на вопрос тоже часто начинают с γιατί: — Γιατί δεν ήρθες; — **Γιατί** ήμουν άρρωστη.

      **Επειδή** — «потому что, так как». В отличие от γιατί, его удобно ставить в начало фразы: **Επειδή** δουλεύω το Σάββατο, δεν μπορώ να έρθω. Можно и после главной части: Δεν μπορώ να έρθω, επειδή δουλεύω. Вопросом επειδή не бывает: «почему?» — только γιατί;

      **Γι' αυτό** — «поэтому» (= για αυτό): сначала причина, потом следствие. Δουλεύω το Σάββατο, **γι' αυτό** δεν μπορώ να έρθω.

      **Αλλά** и **όμως** — «но, однако». Αλλά стоит в начале второй части: Θέλω να έρθω, **αλλά** δεν μπορώ. Όμως может стоять и там же, и после первого слова: Η ιδέα είναι ωραία. Δεν έχω **όμως** χρόνο.

      **Όταν** — «когда» в рассказе, не вопрос (вопрос — πότε;): **Όταν** έχω χρόνο, βγαίνω με την παρέα μου. Если речь о будущем, после όταν обычно ставят форму как после να, без θα: **Όταν τελειώσω**, θα σου τηλεφωνήσω. — «Когда закончу, позвоню тебе».

      **Αν** — «если» (модули 10 и 19): **Αν** θέλεις, πάμε μαζί. О будущем — так же без θα: **Αν έρθεις**, θα χαρώ πολύ. Θα χαρώ — будущее от χαίρομαι, «я буду рад» (аорист вы знаете по Χάρηκα πολύ, модуль 01).

      Не путайте с **αν** в значении «ли» (модуль 16: Θα ήθελα να μάθω αν…). Там θα о будущем ставят как обычно: **Πες μου αν θα έρθεις.** — «Скажи, придёшь ли ты». Сравните: Αν έρθεις, θα χαρώ πολύ — «если придёшь».
    table:
      columns:
        - союз
        - значение
        - пример
      rows:
        - - γιατί
          - потому что; почему?
          - Δεν μπορώ, γιατί δουλεύω.
        - - επειδή
          - потому что, так как
          - Επειδή δουλεύω, δεν μπορώ.
        - - γι' αυτό
          - поэтому
          - Δουλεύω, γι' αυτό δεν μπορώ.
        - - αλλά, όμως
          - но, однако
          - Θέλω, αλλά δεν μπορώ.
        - - όταν
          - когда
          - Όταν τελειώσω, θα σου τηλεφωνήσω.
        - - αν
          - если
          - Αν θέλεις, πάμε μαζί.
  - type: exercise
    id: conj-choice
    title: Какой союз
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: ___ δουλεύω το Σάββατο, δεν μπορώ να έρθω στο πάρτι.
        options:
          - Επειδή
          - Γι' αυτό
          - Όμως
        answer: Επειδή
        explanation: Причина в начале фразы — επειδή.
      - id: q2
        prompt: Δουλεύω το Σάββατο, ___ δεν μπορώ να έρθω στο πάρτι.
        options:
          - γι' αυτό
          - επειδή
          - αν
        answer: γι' αυτό
        explanation: Сначала причина (работаю), потом следствие (не могу) — γι' αυτό.
      - id: q3
        prompt: — ___ δεν ήρθες στο πάρτι; — Γιατί ήμουν άρρωστη.
        options:
          - Γιατί
          - Επειδή
          - Όταν
        answer: Γιατί
        explanation: Вопрос «почему?» — только γιατί.
      - id: q4
        prompt: ___ τελειώσω τη δουλειά, θα σου τηλεφωνήσω.
        options:
          - Όταν
          - Πότε
          - Γιατί
        answer: Όταν
        explanation: Όταν — «когда» не в вопросе; πότε — только вопрос.
      - id: q5
        prompt: Όταν ___ στη Λεμεσό, θα σε πάρω τηλέφωνο. (я)
        options:
          - έρθω
          - ήρθα
          - έρθεις
        answer: έρθω
        explanation: О будущем после όταν — форма как после να (έρθω), лицо «я».
      - id: q6
        prompt: Η ιδέα είναι ωραία. Δεν έχω ___ χρόνο.
        options:
          - όμως
          - αλλά
          - γιατί
        answer: όμως
        explanation: После первого слова может стоять только όμως; αλλά и γιατί начинают часть фразы.
  - type: reading
    id: reply
    title: Απάντηση στη Στέλλα
    text: |-
      Γεια σου, Στέλλα!

      Ευχαριστώ πολύ για την (1) ___! Θέλω πολύ να έρθω μαζί σας στη θάλασσα την Κυριακή, (2) ___ δυστυχώς δεν είμαι ελεύθερη όλη μέρα. Την Κυριακή το πρωί δουλεύω, (3) ___ ο συνάδελφός μου αρρώστησε χθες. Τελειώνω στη μία, (4) ___ δεν μπορώ να έρθω νωρίς μαζί σας. Μπορώ όμως να έρθω με το αυτοκίνητο στις δύο, (5) ___ θέλετε. Πάρε με τηλέφωνο!

      Φιλιά,
      Ρίτα
  - type: exercise
    id: reply-gap
    about: reply
    title: Пропуски в ответе
    instruction: Прочитайте ответ Риты на приглашение и вставьте слова. Два слова лишние.
    format: gap
    bank:
      - πρόσκληση
      - αλλά
      - γιατί
      - γι' αυτό
      - αν
      - δικαιολογία
      - πότε
    items:
      - id: g1
        prompt: (1) Ευχαριστώ πολύ για την ___!
        answer: πρόσκληση
        explanation: Ευχαριστώ για την πρόσκληση — «спасибо за приглашение». Η δικαιολογία — отговорка, за неё не благодарят.
      - id: g2
        prompt: (2) Θέλω πολύ να έρθω μαζί σας στη θάλασσα την Κυριακή, ___ δυστυχώς δεν είμαι ελεύθερη όλη μέρα.
        answer: αλλά
        explanation: Хочу, но не могу — противопоставление, αλλά.
      - id: g3
        prompt: (3) Την Κυριακή το πρωί δουλεύω, ___ ο συνάδελφός μου αρρώστησε χθες.
        answer: γιατί
        explanation: Сначала следствие (работаю), потом причина (коллега заболел) — γιατί.
      - id: g4
        prompt: (4) Τελειώνω στη μία, ___ δεν μπορώ να έρθω νωρίς μαζί σας.
        answer: γι' αυτό
        explanation: Сначала причина (заканчиваю в час), потом следствие (не могу рано) — γι' αυτό.
      - id: g5
        prompt: (5) Μπορώ όμως να έρθω με το αυτοκίνητο στις δύο, ___ θέλετε.
        answer: αν
        explanation: Αν θέλετε — «если хотите». Πότε — только вопрос «когда?».
  - type: explanation
    id: reading-how
    title: Как читать приглашения
    body: |-
      В приглашении всегда есть ответы на пять вопросов: **кто** приглашает, **куда** (что за мероприятие), **когда** (день и время), **где** и **что нужно сделать** — ответить до какого-то дня, принести что-то, заказать место. Прочитайте три приглашения и найдите эти пять пунктов в каждом.

      Внимание к числам: в тексте рядом могут стоять дата, время и возраст. Незнакомые слова переведены под текстом.
  - type: reading
    id: invitations
    title: Τρεις προσκλήσεις
    text: |-
      1. Μήνυμα από τη Φανή

      Γεια σου, Όλγα! Την Παρασκευή το βράδυ βγαίνουμε με την παρέα για φαγητό σε μια ταβέρνα στη Λάρνακα. Θέλεις να έρθεις; Αν θέλεις, περνάω να σε πάρω στις οκτώ. Φανή

      2. Πρόσκληση από τον Μάριο

      Αγαπητοί φίλοι, το Σάββατο 21 Νοεμβρίου κλείνω τα σαράντα! Σας καλώ σε ένα πάρτι στο σπίτι μου, στις εννιά το βράδυ. Θα έχουμε φαγητό, μουσική και χορό. Μη φέρετε δώρα — θέλω μόνο την παρέα σας! Πείτε μου μέχρι την Τετάρτη αν θα έρθετε. Μάριος

      3. Πολιτιστικό Κέντρο «Ο Φάρος»

      Σας προσκαλούμε στην εκδήλωση «Καφές και κουβέντα». Κάθε Πέμπτη στις επτά το απόγευμα ξένοι και Κύπριοι βρίσκονται στο κέντρο για να μιλήσουν ελληνικά και να κάνουν καινούργιες γνωριμίες. Η είσοδος είναι δωρεάν. Επειδή οι θέσεις είναι λίγες, κλείστε θέση στο 24 650 213.
    glosses:
      - text: Μήνυμα
        russian: сообщение
      - text: κλείνω τα σαράντα
        russian: мне исполняется сорок
      - text: Μη φέρετε
        russian: не приносите
      - text: Πείτε μου
        russian: скажите мне
      - text: Φάρος
        russian: «Маяк» (название)
      - text: κουβέντα
        russian: разговор, беседа
      - text: Κύπριοι
        russian: киприоты
      - text: γνωριμίες
        russian: знакомства
      - text: είσοδος
        russian: вход
      - text: θέσεις
        russian: места
      - text: κλείστε θέση
        russian: забронируйте место
  - type: exercise
    id: invitations-tf
    about: invitations
    title: Верно или неверно
    instruction: Прочитайте приглашения. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Φανή βγαίνει με την παρέα της το Σάββατο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Την Παρασκευή το βράδυ. В субботу — вечеринка Мариоса.
      - id: q2
        prompt: Η Φανή μπορεί να περάσει να πάρει την Όλγα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Περνάω να σε πάρω στις οκτώ.
      - id: q3
        prompt: Το πάρτι του Μάριου είναι στο σπίτι του.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Ο Μάριος θέλει δώρα από τους καλεσμένους.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μη φέρετε δώρα — «не приносите подарков».
      - id: q5
        prompt: Οι καλεσμένοι πρέπει να απαντήσουν στον Μάριο μέχρι την Τετάρτη.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Η εκδήλωση στο κέντρο «Ο Φάρος» είναι μία φορά τον μήνα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κάθε Πέμπτη — каждую неделю.
      - id: q7
        prompt: Για την εκδήλωση πρέπει να πληρώσετε.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η είσοδος είναι δωρεάν — вход бесплатный.
  - type: exercise
    id: invitations-choice
    about: invitations
    title: Выберите ответ
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Сколько лет исполняется Мариосу?
        options:
          - "40"
          - "21"
          - "9"
        answer: "40"
        explanation: Κλείνω τα σαράντα. 21 — число месяца, 9 — время вечеринки.
      - id: q2
        prompt: Зачем люди приходят по четвергам в «Фарос»?
        options:
          - поговорить по-гречески и познакомиться
          - поучиться танцам
          - посмотреть греческий фильм
        answer: поговорить по-гречески и познакомиться
      - id: q3
        prompt: Почему в «Фарос» нужно звонить заранее?
        options:
          - мест мало
          - вход платный
          - центр открыт только по четвергам
        answer: мест мало
        explanation: Επειδή οι θέσεις είναι λίγες — «так как мест мало».
  - type: explanation
    id: listen-how
    title: Как слушать телефонный разговор
    body: |-
      На экзамене во второй части аудирования звучит разговор двух людей, и к нему — вопросы с тремя вариантами. Сначала прочитайте вопросы: они подскажут, что слушать. В первый раз поймите главное — кто звонит и зачем, на что человек соглашается и от чего отказывается. Во второй раз — детали: время, место, причины.

      Стелиос звонит Юлии. Вы услышите: **Έλα!** — так по телефону отвечают знакомым, «Да, привет!»; **Κρίμα!** — «Жаль!»; **πάρτι έκπληξη** — вечеринка-сюрприз; **Να φέρω κάτι;** — «Мне что-нибудь принести?» (να в вопросе, как Τι ώρα να περάσω;); **ο Πλάτανος** — «Платан», название таверны.
  - type: listening
    id: phone
    title: Στο τηλέφωνο
    plays: 2
    transcript:
      - speaker: Ιουλία
        text: Έλα, Στέλιο!
        audio: m21-2/phone-1.mp3
      - speaker: Στέλιος
        text: Γεια σου, Ιουλία! Σε παίρνω για να σε καλέσω. Την Παρασκευή είναι τα γενέθλια της Άντρης και κάνουμε ένα πάρτι έκπληξη στο σπίτι μου. Θέλεις να έρθεις;
        audio: m21-2/phone-2.mp3
      - speaker: Ιουλία
        text: Τι ωραία ιδέα! Δυστυχώς όμως την Παρασκευή δουλεύω μέχρι τις δέκα το βράδυ.
        audio: m21-2/phone-3.mp3
      - speaker: Στέλιος
        text: Κρίμα! Και το Σάββατο; Το μεσημέρι τρώμε όλοι μαζί σε μια ταβέρνα στη Λεμεσό.
        audio: m21-2/phone-4.mp3
      - speaker: Ιουλία
        text: Το Σάββατο είμαι ελεύθερη. Ευχαρίστως! Τι ώρα;
        audio: m21-2/phone-5.mp3
      - speaker: Στέλιος
        text: Στη μία. Αν θέλεις, περνάω να σε πάρω στις δώδεκα και μισή.
        audio: m21-2/phone-6.mp3
      - speaker: Ιουλία
        text: Ευχαριστώ, αλλά θα έρθω με το αυτοκίνητό μου, γιατί μετά πάω στους γονείς μου. Πού θα βρεθούμε;
        audio: m21-2/phone-7.mp3
      - speaker: Στέλιος
        text: Στην ταβέρνα «Ο Πλάτανος», δίπλα στο λιμάνι.
        audio: m21-2/phone-8.mp3
      - speaker: Ιουλία
        text: Ωραία. Να φέρω κάτι;
        audio: m21-2/phone-9.mp3
      - speaker: Στέλιος
        text: Όχι, τίποτα. Μόνο μην πεις τίποτα στην Άντρη για το πάρτι — είναι έκπληξη!
        audio: m21-2/phone-10.mp3
      - speaker: Ιουλία
        text: Σίγουρα! Και θα της πάρω ένα δώρο. Τα λέμε το Σάββατο!
        audio: m21-2/phone-11.mp3
  - type: exercise
    id: phone-choice
    about: phone
    title: Выберите ответ
    instruction: Прослушайте разговор и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Зачем звонит Стелиос?
        options:
          - пригласить Юлию
          - перенести встречу
          - попросить машину
        answer: пригласить Юлию
        explanation: Σε παίρνω για να σε καλέσω.
      - id: q2
        prompt: Что будет в пятницу?
        options:
          - вечеринка-сюрприз у Стелиоса дома
          - обед в таверне
          - день рождения Юлии
        answer: вечеринка-сюрприз у Стелиоса дома
        explanation: День рождения у Андри, а не у Юлии.
      - id: q3
        prompt: Почему Юлия не может прийти в пятницу?
        options:
          - она работает до десяти вечера
          - она едет к родителям
          - у неё нет настроения
        answer: она работает до десяти вечера
        explanation: К родителям она поедет в субботу, после обеда.
      - id: q4
        prompt: Во сколько встреча в субботу?
        options:
          - в 13:00
          - в 12:30
          - в 22:00
        answer: в 13:00
        explanation: Στη μία. В 12:30 Стелиос предлагал заехать за Юлией.
      - id: q5
        prompt: Почему Юлия поедет на своей машине?
        options:
          - после обеда она едет к родителям
          - у Стелиоса нет машины
          - таверна далеко от города
        answer: после обеда она едет к родителям
        explanation: Γιατί μετά πάω στους γονείς μου.
      - id: q6
        prompt: Где находится таверна?
        options:
          - рядом с портом
          - рядом с домом Стелиоса
          - в центре Никосии
        answer: рядом с портом
        explanation: Δίπλα στο λιμάνι.
      - id: q7
        prompt: Что обещает Юлия?
        options:
          - ничего не говорить Андри и купить ей подарок
          - прийти и в пятницу
          - заехать за Стелиосом
        answer: ничего не говорить Андри и купить ей подарок
        explanation: Σίγουρα! Και θα της πάρω ένα δώρο.
