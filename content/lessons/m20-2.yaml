blocks:
  - type: explanation
    id: hobbies
    title: Хобби и свободное время
    body: |-
      **Ο ελεύθερος χρόνος** — свободное время. Главный вопрос темы: **Τι κάνεις στον ελεύθερο χρόνο σου;** — «Что ты делаешь в свободное время?». Другой вариант — **Ποιο είναι το χόμπι σου;** Слово **το χόμπι** не изменяется: τα χόμπι μου — «мои хобби».

      Занятия: **το διάβασμα** — чтение (от διαβάζω), **η ζωγραφική** — рисование, живопись, **η φωτογραφία** — и фотография как хобби, и отдельный снимок (οι φωτογραφίες), **ο χορός** — танец, танцы, **η μουσική** — музыка, **το τραγούδι** — песня. Глаголы: **χορεύω** — танцевать (аор. χόρεψα), **τραγουδάω** — петь (τραγουδάς, τραγουδάει…, как μιλάω; аор. τραγούδησα).

      **Ασχολούμαι με** + винительный падеж — «заниматься чем-то»: **Ασχολούμαι με τη φωτογραφία.** — Με τι ασχολείσαι; Это глагол на -ούμαι: ударение всё время на окончании (таблица ниже). Будущее — θα ασχοληθώ.

      **Αγαπημένος** — любимый: **η αγαπημένη μου ταινία**, **το αγαπημένο μου τραγούδι**. **Βαρετός** — скучный (о фильме, книге, работе): Η ταινία ήταν βαρετή. А если скучно **вам** — глагол **βαριέμαι**: **Βαριέμαι!** — «Мне скучно!». Βαριέμαι να… — «мне лень…»: Βαριέμαι να μαγειρέψω σήμερα.
    table:
      columns:
        - лицо
        - ασχολούμαι — заниматься
        - βαριέμαι — скучать
      rows:
        - - εγώ
          - ασχολούμαι
          - βαριέμαι
        - - εσύ
          - ασχολείσαι
          - βαριέσαι
        - - αυτός, αυτή
          - ασχολείται
          - βαριέται
        - - εμείς
          - ασχολούμαστε
          - βαριόμαστε
        - - εσείς
          - ασχολείστε
          - βαριέστε
        - - αυτοί, αυτές
          - ασχολούνται
          - βαριούνται
  - type: explanation
    id: culture
    title: Кино, театр, концерт
    body: |-
      **Το σινεμά** — кино и кинотеатр, слово не изменяется. Часто говорят без предлога, как Πάω σπίτι: **Πάμε σινεμά απόψε;** — «Пойдём сегодня вечером в кино?» (можно и Πάμε στο σινεμά). В кино смотрят **ταινία** — фильм.

      О фильме или спектакле, который сейчас идёт, говорят **παίζει** — «идёт»: **Τι ταινία παίζει;** — «Какой фильм идёт?». Παίζει μια ελληνική ταινία.

      **Το θέατρο** — театр, **ο ηθοποιός** — актёр; то же слово с артиклем η — актриса: η ηθοποιός (мн. ч. οι ηθοποιοί). **Η συναυλία** — концерт.

      «Предпочитаю одно другому» — **προτιμώ** (модуль 08) … **από** …, оба слова в винительном падеже: **Προτιμώ το θέατρο από το σινεμά.** — «Я предпочитаю театр кино».
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Πάμε σινεμά απόψε;
          - Пойдём сегодня вечером в кино?
        - - Τι ταινία παίζει;
          - Какой фильм идёт?
        - - Προτιμώ το θέατρο από το σινεμά.
          - Я предпочитаю театр кино.
        - - η αγαπημένη μου ταινία
          - мой любимый фильм
