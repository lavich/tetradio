  - type: exercise
    id: programme-tf
    about: programme
    title: Верно или неверно
    instruction: Прочитайте программу. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Τα μαθήματα ζωγραφικής είναι μόνο για ανθρώπους με εμπειρία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν χρειάζεται εμπειρία — опыт не нужен.
      - id: q2
        prompt: Οι χοροί είναι δύο φορές την εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Τρίτη και Πέμπτη.
      - id: q3
        prompt: Για τη λέσχη φωτογραφίας δεν πληρώνετε.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Δωρεάν — бесплатно.
      - id: q4
        prompt: Την Παρασκευή βλέπουμε μια ταινία στα αγγλικά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Фильм греческий, по-английски только субтитры.
      - id: q5
        prompt: Το θέατρο για παιδιά είναι το Σάββατο το πρωί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Σάββατο, 11:00.
      - id: q6
        prompt: Στη συναυλία η χορωδία τραγουδάει καινούργια τραγούδια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Παλιά κυπριακά τραγούδια — старые песни.
      - id: q7
        prompt: Η βιβλιοθήκη είναι ανοιχτή και το απόγευμα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Только с 9:00 до 13:00.
  - type: exercise
    id: programme-match
    about: programme
    title: Кому что подходит
    instruction: Прочитайте о пяти людях и выберите для каждого занятие из программы. Два занятия лишние.
    format: match
    bank:
      - Ζωγραφική
      - Παραδοσιακοί χοροί
      - Λέσχη φωτογραφίας
      - Κινηματογραφική βραδιά
      - Θέατρο για παιδιά
      - Συναυλία
      - Βιβλιοθήκη
    items:
      - id: m1
        prompt: Η Χαρίκλεια έχει δύο παιδιά, πέντε και οκτώ χρονών. Το Σάββατο το πρωί θέλει να κάνουν κάτι όλοι μαζί.
        answer: Θέατρο για παιδιά
      - id: m2
        prompt: Ο Ανδρέας αγαπάει τη φύση και φωτογραφίζει λουλούδια και δέντρα. Δεν έχει πολλά λεφτά.
        answer: Λέσχη φωτογραφίας
        explanation: Фотоклуб бесплатный и выходит на природу.
      - id: m3
        prompt: Η Ρωξάνη θέλει να ακούσει παλιά κυπριακά τραγούδια. Δουλεύει όλη την εβδομάδα, αλλά την Κυριακή το βράδυ είναι ελεύθερη.
        answer: Συναυλία
      - id: m4
        prompt: Ο Θεόδωρος θέλει να ασχοληθεί με τη ζωγραφική, αλλά δεν ξέρει τίποτα ακόμα. Είναι ελεύθερος μόνο τις Δευτέρες.
        answer: Ζωγραφική
        explanation: Рисование — в понедельник, и опыт не нужен.
      - id: m5
        prompt: Η Λυδία και η κόρη της, δέκα χρονών, θέλουν να μάθουν να χορεύουν. Είναι ελεύθερες την Τρίτη και την Πέμπτη το απόγευμα.
        answer: Παραδοσιακοί χοροί
        explanation: Танцы — для всех возрастов, во вторник и четверг в 18:00.
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Два друга выбирают, куда пойти в субботу вечером. Они обсуждают три варианта, но выберут один. В первый раз поймите, какие это варианты и что в итоге решили. Во второй раз слушайте детали: почему варианты не подходят, цену, время.

      Вы услышите: **Όχι πάλι μπάσκετ!** — «Только не баскетбол опять!», **Καλά, καλά** — «Ладно, ладно», **Πάμε να τη δούμε;** — «Пойдём посмотрим на неё (на команду)?» (τη — «её», модуль 17).
  - type: listening
    id: saturday
    title: Τι θα κάνουμε το Σάββατο;
    plays: 2
    transcript:
      - speaker: Δάφνη
        text: Φοίβο, τι θα κάνουμε το Σάββατο το βράδυ; Πάμε σινεμά;
      - speaker: Φοίβος
        text: Τι ταινία παίζει;
      - speaker: Δάφνη
        text: Μια καινούργια ελληνική ταινία, με τον Άρη Ζαχαρίου. Είναι ο αγαπημένος μου ηθοποιός!
      - speaker: Φοίβος
        text: Ξέρω, αλλά οι ελληνικές ταινίες είναι λίγο βαρετές για μένα. Το Σάββατο η ομάδα μας παίζει μπάσκετ στο γήπεδο. Πάμε να τη δούμε;
      - speaker: Δάφνη
        text: Όχι πάλι μπάσκετ! Πήγαμε και την Κυριακή. Στο γήπεδο πάντα βαριέμαι.
      - speaker: Φοίβος
        text: Καλά, καλά. Και η συναυλία στο πάρκο; Τραγουδάει η Μυρτώ Αντωνίου.
      - speaker: Δάφνη
        text: Ωραία! Μου αρέσουν πολύ τα τραγούδια της. Πόσο κάνει το εισιτήριο;
      - speaker: Φοίβος
        text: Είκοσι ευρώ. Η συναυλία είναι πιο ακριβή από το σινεμά, αλλά είναι έξω, στο πάρκο, και θα κάνει καλό καιρό.
      - speaker: Δάφνη
        text: Τι ώρα αρχίζει;
      - speaker: Φοίβος
        text: Στις εννέα. Πριν από τη συναυλία μπορούμε να φάμε κάτι στην ταβέρνα δίπλα στο πάρκο.
      - speaker: Δάφνη
        text: Πολύ ωραία! Θα αγοράσω εγώ τα εισιτήρια απόψε στο ίντερνετ.
      - speaker: Φοίβος
        text: Ευχαριστώ! Τα λέμε το Σάββατο στις οκτώ, στην ταβέρνα.
  - type: exercise
    id: saturday-choice
    about: saturday
    title: Выберите ответ
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Что Дафна предлагает сначала?
        options:
          - пойти в кино
          - пойти на баскетбол
          - пойти на концерт
        answer: пойти в кино
      - id: q2
        prompt: Что Фивос думает о греческих фильмах?
        options:
          - они для него скучноваты
          - они слишком дорогие
          - в них хорошие актёры
        answer: они для него скучноваты
        explanation: Οι ελληνικές ταινίες είναι λίγο βαρετές για μένα. Хорошего актёра хвалит Дафна, а не Фивос.
      - id: q3
        prompt: Почему Дафна не хочет на баскетбол?
        options:
          - на стадионе ей всегда скучно
          - билеты слишком дорогие
          - матч начинается поздно
        answer: на стадионе ей всегда скучно
        explanation: Στο γήπεδο πάντα βαριέμαι.
      - id: q4
        prompt: Сколько стоит билет на концерт?
        options:
          - 20 €
          - 9 €
          - 12 €
        answer: 20 €
        explanation: Είκοσι ευρώ. Εννέα — это время начала.
      - id: q5
        prompt: Что Фивос говорит о концерте?
        options:
          - он дороже кино, но проходит в парке
          - он дешевле кино
          - он будет в кинотеатре
        answer: он дороже кино, но проходит в парке
        explanation: Η συναυλία είναι πιο ακριβή από το σινεμά, αλλά είναι έξω, στο πάρκο.
      - id: q6
        prompt: Что они сделают перед концертом?
        options:
          - поужинают в таверне
          - погуляют по парку
          - посмотрят фильм
        answer: поужинают в таверне
      - id: q7
        prompt: Кто купит билеты?
        options:
          - Дафна
          - Фивос
          - они купят их в парке
        answer: Дафна
        explanation: Θα αγοράσω εγώ τα εισιτήρια — говорит Дафна.
