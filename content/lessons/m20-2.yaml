  - type: exercise
    id: hobby-gap
    title: Что вы делаете в свободное время
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - ασχολείσαι
      - ασχολούμαι
      - χορεύει
      - τραγουδάει
      - βαριέμαι
      - βαρετή
      - αγαπημένο
      - χόμπι
      - διάβασμα
    items:
      - id: g1
        prompt: — Με τι ___ στον ελεύθερο χρόνο σου; — Με τη φωτογραφία.
        answer: ασχολείσαι
        explanation: Вопрос к «ты» — ασχολείσαι.
      - id: g2
        prompt: Η Ζωή ___ ένα τραγούδι για τη γιαγιά της.
        answer: τραγουδάει
      - id: g3
        prompt: Στην ταβέρνα ο Σάββας ___ ζεϊμπέκικο. (ζεϊμπέκικο — греческий танец)
        answer: χορεύει
      - id: g4
        prompt: Η ταινία ήταν πολύ ___ — κοιμήθηκα στο σινεμά! (κοιμήθηκα — я заснул)
        answer: βαρετή
        explanation: Η ταινία — женский род, βαρετή.
      - id: g5
        prompt: Δεν έχω τίποτα να κάνω και ___!
        answer: βαριέμαι
      - id: g6
        prompt: Ποιο είναι το ___ σου τραγούδι;
        answer: αγαπημένο
      - id: g7
        prompt: Έχω ένα καινούργιο ___ — ασχολούμαι με τη ζωγραφική.
        answer: χόμπι
  - type: explanation
    id: programme-how
    title: Как читать программу
    body: |-
      В программе культурного центра (πολιτιστικό κέντρο) у каждого занятия есть день, время, цена и то, для кого оно. На экзамене часто просят соединить людей с занятием: у каждого человека — своё условие (свободен только в понедельник, хочет что-то с детьми, у него мало денег). Сначала прочитайте, что нужно человеку, потом ищите в программе день и цену.

      **Δωρεάν** — бесплатно (модуль 16). Слова в родительном падеже вроде **λέσχη φωτογραφίας** — «фотоклуб» — читайте целиком, как Σχολή Ξένων Γλωσσών. Незнакомые слова переведены под текстом.
  - type: reading
    id: programme
    title: Πολιτιστικό Κέντρο «Η Γέφυρα»
    text: |-
      Πολιτιστικό Κέντρο «Η Γέφυρα» — Λάρνακα
      Πρόγραμμα Νοεμβρίου

      Δευτέρα, 19:00–21:00: Ζωγραφική για ενήλικες. Δεν χρειάζεται εμπειρία! 40 € τον μήνα.

      Τρίτη και Πέμπτη, 18:00–19:30: Παραδοσιακοί χοροί της Κύπρου. Για όλες τις ηλικίες. 30 € τον μήνα.

      Τετάρτη, 18:30: Λέσχη φωτογραφίας. Βγαίνουμε με τη φωτογραφική μηχανή στην πόλη και στη φύση. Δωρεάν.

      Παρασκευή, 20:30: Κινηματογραφική βραδιά. Μια ελληνική ταινία με αγγλικούς υπότιτλους. Εισιτήριο 5 €.

      Σάββατο, 11:00: Θέατρο για παιδιά — «Ο μικρός ψαράς». Εισιτήριο 6 € για παιδιά, 8 € για ενήλικες.

      Κυριακή 26 Νοεμβρίου, 20:00: Συναυλία. Η χορωδία του κέντρου τραγουδάει παλιά κυπριακά τραγούδια. Εισιτήριο 12 €.

      Κάθε μέρα, 9:00–13:00: Η βιβλιοθήκη μας είναι ανοιχτή — έλα να διαβάσεις ένα βιβλίο με έναν καφέ!

      Εγγραφές για τα μαθήματα στη γραμματεία του κέντρου ή στο τηλέφωνο 24 530 118.
    glosses:
      - text: Πολιτιστικό Κέντρο
        russian: культурный центр
      - text: Γέφυρα
        russian: «Мост» (название)
      - text: ενήλικες
        russian: взрослые
      - text: Παραδοσιακοί
        russian: традиционные
      - text: ηλικίες
        russian: возрасты
      - text: Λέσχη φωτογραφίας
        russian: фотоклуб
      - text: φωτογραφική μηχανή
        russian: фотоаппарат
      - text: Δωρεάν
        russian: бесплатно
      - text: Κινηματογραφική βραδιά
        russian: вечер кино
      - text: υπότιτλους
        russian: субтитры
      - text: ψαράς
        russian: рыбак
      - text: χορωδία
        russian: хор
      - text: κυπριακά
        russian: кипрские
      - text: βιβλιοθήκη
