  - type: writing
    id: experience
    register: formal
    prompt: "Напишите краткое резюме своего опыта для письма рекрутеру или профиля (60–90 слов): кто вы и сколько у вас опыта, нынешняя роль, предыдущий шаг, одно достижение и какую роль ищете."
    words: { min: 60, max: 90 }
    model: I'm a backend developer with seven years of experience. Since 2022, I have worked at a logistics company in Gdańsk, where I lead a team of four. Before that, I spent three years at a start-up that was acquired in 2021. I spearheaded the migration to a new platform and delivered it without downtime. I'm self-taught and hold a cloud certification. I'm now looking for a senior role in a product company.
    criteria:
      - 60–90 слов, от первого лица, без приветствия и подписи
      - "Есть части: кто вы и опыт, нынешняя роль, предыдущий шаг, достижение, какую роль ищете"
      - "Present perfect с for или since — только для продолжающегося (I've worked… for, since 2022); past simple — для закончившегося и с датами"
      - Рядом с ago и годом-моментом (in 2022) нет present perfect; since 2022 и for допустимы с продолжающимся периодом
      - "Названы даты или сроки; слов «давно» и «недавно» нет"
      - Хотя бы три слова или оборота модуля (promoted, acquired, spearhead, deliver, self-taught, tenure…)
  - type: explanation
    id: speaking-how
    title: Как записывать ответ
    body: |-
      Второй ответ вашего **банка ответов** — Walk me through your CV. Он повторяется почти на каждом собеседовании, поэтому его полезно закрепить.

      1) Выпишите ключевые слова для каждого шага — нынешняя роль, два прошлых места, причина, итог. Целый текст лучше не зачитывать: зачитанный ответ звучит как зачитанный. 2) Запишите ответ и уложитесь в 60 секунд. 3) Переслушайте и сверьте с образцом и критериями. 4) Запишите ещё раз.

      Если застряли, используйте связку: **Let me think… / So, going back to…**. Ошибка во времени, исправленная на ходу, допустима, а долгая пауза мешает слушателю.
  - type: speaking
    id: walk-through
    part: monologue
    prompt: "Интервьюер: «Could you walk me through your CV?» Ответьте за 60 секунд на своём материале: нынешняя роль, два прошлых шага с датами или сроками, причина перехода, итог."
    seconds: 60
    model: "Sure. I'll start with my current role. I've worked at a payments company for four years, and since last spring I've been the tech lead of the cards team. My role involves designing the architecture and mentoring three developers. Before that, I spent two years at a small start-up, where I joined as a junior and helped to scale up the platform. When the company was acquired, I decided to move on. Over the years, I've worked on every part of the stack. My biggest accomplishment so far is the migration of our card payments to a new platform, which we delivered without downtime. That's the path that brought me here, and that's why I'm interested in this role."
    criteria:
      - "Порядок: нынешняя роль — прошлые шаги — причина — итог с целью"
      - Около 60 секунд, без долгих пауз; связки Before that, Over the years, That's the path that brought me here
      - Present perfect для продолжающегося (for, since), past simple для закончившегося и с датами
      - Названы сроки и одно достижение, не больше трёх мест работы
      - Причина ухода нейтральная, без критики прежней компании
  - type: speaking
    id: how-long
    part: interview
    prompt: "Интервьюер уточняет: «How long have you been working there, and what has changed in that time?» Ответьте за 30 секунд: срок, что изменилось в команде или продукте и ваша роль."
    seconds: 30
    model: "I've worked there for four years. When I joined, we were a team of six with one product. Since then, we've grown to thirty people, and I've moved from developer to tech lead. What has changed most is the scale: we've launched two new products."
    criteria:
      - Срок назван с for или since и present perfect (I've worked there for…)
      - Изменения описаны present perfect (we've grown, I've moved), момент прихода — past simple (When I joined…)
      - Есть одна конкретная деталь — число людей, продуктов или должностей
      - Ответ закончен
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: I ___ in this team since January.
        options: ["'ve worked", worked, work]
        answer: "'ve worked"
        explanation: Since с продолжающимся периодом — present perfect.
      - id: q2
        prompt: We ___ the product two years ago.
        options: [launched, "'ve launched", launch]
        answer: launched
        explanation: Ago называет момент — past simple.
      - id: q3
        prompt: I haven't met the new tech lead ___.
        options: [yet, already, just]
        answer: yet
      - id: q4
        prompt: She was ___ off when the start-up ran out of money.
        options: [laid, lay, laying]
        answer: laid
        explanation: Be laid off — пассив, третья форма lay — laid — laid.
      - id: q5
        prompt: I have a certification ___ cloud architecture.
        options: [in, at, by]
        answer: in
      - id: q6
        prompt: The company ___ by a bigger firm last year.
        options: [was acquired, has been acquired, acquired]
        answer: was acquired
        explanation: Last year называет момент — past simple, а пассив требует was acquired.
