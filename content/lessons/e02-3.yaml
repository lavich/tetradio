blocks:
  - type: explanation
    id: formula
    title: "Схема ответа: от нынешней должности назад"
    body: |-
      **Walk me through your CV** — второй вопрос почти любого собеседования, после *Tell me about yourself*. Интервьюер уже видит резюме и хочет услышать, как вы сами объясняете свой путь: что вы выбирали, почему меняли работу и чего достигли. Ответ длится около минуты и идёт по четырём шагам.

      **1. Нынешняя роль** — present perfect с for или since: **I'll start with my current role. I've worked at a payments company for four years.**

      **2. Предыдущие шаги** — два или три, каждый в past simple с датой или сроком: **Before that, I spent two years at a start-up. I joined as a junior.** Для каждого — компания, должность, один результат.

      **3. Причина перехода** — одна нейтральная фраза без критики прежней компании: **I decided to move on after the acquisition. I left because I wanted more responsibility.**

      **4. Итог** — связка с целью: **That's the path that brought me here.**

      Для связок между шагами подходят *Before that, After that, Then, Over the years*; рассказ идёт от нынешней роли назад, поэтому итог связывает путь с целью. Все места работы подряд не перечисляют: два-три последних шага и то, что важно для позиции.
    table:
      columns:
        - шаг
        - время
        - пример
      rows:
        - - нынешняя роль
          - present perfect, for / since
          - I've been a developer for six years.
        - - предыдущие шаги
          - past simple, даты и ago
          - I switched to backend three years ago.
        - - причина
          - past simple
          - I decided to move on after the acquisition.
        - - итог
          - present simple
          - That's the path that brought me here.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: good-answer
    title: Подходящий ответ
    instruction: Выберите вариант, который подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: С чего начать ответ на «Walk me through your CV»?
        options:
          - I'll start with my current role.
          - I was born in 1992 in Kazan.
          - It's all in my CV, you can read it.
        answer: I'll start with my current role.
        explanation: Начинают с нынешней роли. Биография и ссылка на резюме не отвечают на вопрос.
      - id: q2
        prompt: Как завершить рассказ о пути?
        options:
          - That's the path that brought me here.
          - And so on.
          - That's all.
        answer: That's the path that brought me here.
      - id: q3
        prompt: Как объяснить уход из компании?
        options:
          - I decided to move on after the acquisition.
          - I didn't like my manager.
          - It was a terrible company.
        answer: I decided to move on after the acquisition.
        explanation: Причина называется нейтрально и коротко, прежняя компания не критикуется.
      - id: q4
        prompt: Сколько прошлых мест работы описывать за минуту?
        options:
          - два или три последних
          - все, начиная с первого
          - только нынешнее
        answer: два или три последних
  - type: exercise
    id: tense-fix
    title: Какое предложение верно
    instruction: Выберите верный вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы работали в банке с 2018 по 2020 год и больше там не работаете.
        options:
          - I've worked at the bank from 2018 to 2020.
          - I worked at the bank from 2018 to 2020.
          - I work at the bank from 2018 to 2020.
        answer: I worked at the bank from 2018 to 2020.
        explanation: Период закончился и назван полностью — past simple.
      - id: q2
        prompt: Вы пришли в компанию в 2019 году и работаете там до сих пор.
        options:
          - I've been with the company since 2019.
          - I'm with the company since 2019.
          - I was with the company since 2019.
        answer: I've been with the company since 2019.
        explanation: Since с продолжающимся периодом требует present perfect.
      - id: q3
        prompt: Вы перешли в бэкенд в 2021 году.
        options:
          - I've moved to backend in 2021.
          - I moved to backend in 2021.
          - I have been moving to backend in 2021.
        answer: I moved to backend in 2021.
        explanation: Год называет момент — past simple.
      - id: q4
        prompt: Вы рассказываете, что она пришла в команду в прошлом году.
        options:
          - She has joined the team last year.
          - She joined the team last year.
          - She has been joining the team last year.
        answer: She joined the team last year.
  - type: explanation
    id: writing-how
    title: Краткое резюме опыта
    body: |-
      Письменная задача — короткий текст об опыте, 60–90 слов: его вставляют в письмо рекрутеру или в раздел профиля. Это та же схема, что и в устном ответе, только плотнее: рекрутер читает такой текст за полминуты.

      Пишите от первого лица, без приветствия: 1) кто вы и сколько у вас опыта; 2) нынешняя роль — **Since 2022, I have worked…** или **I've been… for…**; 3) предыдущий шаг с датой или сроком — **Before that, I spent three years at…**; 4) одно достижение — **I spearheaded…, I delivered…**; 5) что ищете.

      Проверьте себя: present perfect с for и since только для продолжающегося, past simple — для закончившегося и с датами; рядом с *ago* и годом-моментом (*in 2022*) present perfect не стоит, *since 2022* допустимо; после предлогов — существительное или -ing.
