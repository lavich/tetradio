  - type: exercise
    id: adjectives
    title: Какая форма
    instruction: Выберите форму прилагательного.
    format: choice
    items:
      - id: q1
        prompt: Τι ώρα φεύγει το ___ λεωφορείο;
        options:
          - επόμενο
          - επόμενος
          - επόμενη
        answer: επόμενο
      - id: q2
        prompt: Κατεβαίνω στην ___ στάση.
        options:
          - επόμενη
          - επόμενο
          - επόμενος
        answer: επόμενη
        explanation: η στάση — женский род.
      - id: q3
        prompt: Η ___ πτήση για την Αθήνα είναι στις έντεκα το βράδυ.
        options:
          - τελευταία
          - τελευταίος
          - τελευταίο
        answer: τελευταία
        explanation: После гласной женский род кончается на -α — τελευταία, как ωραία (модуль 07).
      - id: q4
        prompt: Ο ___ επιβάτης κατεβαίνει στο λιμάνι.
        options:
          - τελευταίος
          - τελευταία
          - τελευταίο
        answer: τελευταίος
      - id: q5
        prompt: Τα ___ λεωφορεία πάνε από τη Λευκωσία στη Λεμεσό.
        options:
          - υπεραστικά
          - υπεραστικό
          - υπεραστικοί
        answer: υπεραστικά
        explanation: τα λεωφορεία — средний род мн. ч.
      - id: q6
        prompt: Στη Λευκωσία παίρνω ένα ___ λεωφορείο για το κέντρο.
        options:
          - αστικό
          - αστική
          - αστικός
        answer: αστικό
  - type: exercise
    id: delay-gap
    title: Задержка и пробки
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - καθυστερεί
      - καθυστέρηση
      - κίνηση
      - βιάζομαι
      - πληροφορίες
      - πύλη
      - ξεκινάει
      - γραμμή
      - αφίξεις
    items:
      - id: g1
        prompt: Η πτήση ___ μία ώρα.
        answer: καθυστερεί
        explanation: Нужен глагол — καθυστερεί. С существительным было бы έχει καθυστέρηση.
      - id: g2
        prompt: Το λεωφορείο έχει ___ είκοσι λεπτά.
        answer: καθυστέρηση
      - id: g3
        prompt: Σήμερα έχει πολλή ___ στον δρόμο για τη Λεμεσό.
        answer: κίνηση
      - id: g4
        prompt: Συγγνώμη, ___, γιατί το λεωφορείο φεύγει σε πέντε λεπτά!
        answer: βιάζομαι
      - id: g5
        prompt: Δεν ξέρω από πού φεύγει το λεωφορείο. Πάω στις ___.
        answer: πληροφορίες
      - id: g6
        prompt: Η πτήση για το Λονδίνο φεύγει από την ___ δεκατέσσερα.
        answer: πύλη
      - id: g7
        prompt: Το πρώτο λεωφορείο ___ από τον σταθμό στις έξι.
        answer: ξεκινάει
  - type: exercise
    id: phrases-choice
    title: Что сказать
    instruction: Выберите подходящую фразу.
    format: choice
    items:
      - id: q1
        prompt: Вы на остановке и хотите узнать, во сколько следующий автобус.
        options:
          - Τι ώρα φεύγει το επόμενο λεωφορείο;
          - Πόση ώρα κάνει το λεωφορείο;
          - Σε πόση ώρα φτάνουμε;
        answer: Τι ώρα φεύγει το επόμενο λεωφορείο;
      - id: q2
        prompt: Вы на автовокзале в Никосии и не знаете, откуда отправляется автобус в Ларнаку.
        options:
          - Από πού φεύγει το λεωφορείο για τη Λάρνακα;
          - Τι ώρα φτάνει το λεωφορείο στη Λάρνακα;
          - Αυτό το λεωφορείο πάει στο κέντρο;
        answer: Από πού φεύγει το λεωφορείο για τη Λάρνακα;
      - id: q3
        prompt: Вы хотите узнать, как часто ходит автобус.
        options:
          - Κάθε πόση ώρα περνάει το λεωφορείο;
          - Πόση ώρα κάνει το λεωφορείο;
          - Τι ώρα φεύγει το λεωφορείο;
        answer: Κάθε πόση ώρα περνάει το λεωφορείο;
      - id: q4
        prompt: Вы едете в незнакомый район и спрашиваете водителя, на какой остановке вам выйти.
        options:
          - Πού πρέπει να κατέβω;
          - Πού είναι η στάση του λεωφορείου;
          - Από πού φεύγει το λεωφορείο;
        answer: Πού πρέπει να κατέβω;
      - id: q5
        prompt: "Друг звонит и спрашивает: «Πού είσαι;». Вы на остановке, автобуса всё нет."
        options:
          - Είμαι στη στάση. Το λεωφορείο έχει καθυστέρηση.
          - Είμαι στο λεωφορείο. Κατεβαίνω στο κέντρο.
          - Είμαι στη στάση. Το λεωφορείο φεύγει τώρα.
        answer: Είμαι στη στάση. Το λεωφορείο έχει καθυστέρηση.
      - id: q6
        prompt: Водитель объясняет туристам, как садиться в автобус.
        options:
          - Ανεβαίνουμε στο λεωφορείο από την μπροστινή πόρτα.
          - Κατεβαίνουμε στην επόμενη στάση.
          - Παίρνουμε ταξί από το αεροδρόμιο.
        answer: Ανεβαίνουμε στο λεωφορείο από την μπροστινή πόρτα.
  - type: explanation
    id: reading-how
    title: Как читать расписание
    body: |-
      На экзамене часто дают короткий практический текст: расписание, объявление, табличку. Читать всё подряд не нужно. Сначала посмотрите на заголовки: какой маршрут, откуда и куда, какие дни. Потом прочитайте вопрос и ищите в тексте только нужную строку.

      В заголовках расписаний много родительного падежа (модуль 12): Διάρκεια **διαδρομής** — продолжительность поездки, το εκδοτήριο **του σταθμού** — касса вокзала, λεωφορεία **Λεμεσού** — автобусы Лимасола. Узнавайте слово по основе. Дни пишут через тире: Δευτέρα – Παρασκευή — «с понедельника по пятницу».
  - type: reading
    id: timetable
    title: "Υπεραστικά λεωφορεία: Λευκωσία – Λεμεσός"
    text: |-
      Υπεραστικά λεωφορεία
      Γραμμή Λευκωσία – Λεμεσός

      Αναχώρηση: Λευκωσία, σταθμός λεωφορείων (κέντρο)
      Άφιξη: Λεμεσός, Παλιό λιμάνι
      Διάρκεια διαδρομής: περίπου 1 ώρα και 15 λεπτά

      Αναχωρήσεις από τη Λευκωσία
      Δευτέρα – Παρασκευή: 06:00, 07:00, 08:30, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00
      Σάββατο: 07:00, 09:00, 12:00, 15:00, 18:00
      Κυριακή: 09:00, 13:00, 17:00

      Αναχωρήσεις από τη Λεμεσό
      Δευτέρα – Παρασκευή: 06:30, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 21:00
      Σάββατο – Κυριακή: 10:00, 14:00, 19:00

      Εισιτήριο
      Απλό: 5 €
      Μετ' επιστροφής: 8 €
      Εισιτήρια αγοράζετε στο εκδοτήριο του σταθμού ή από τον οδηγό.

      Αστικά λεωφορεία Λεμεσού
      Από το Παλιό λιμάνι πάρτε τη γραμμή 30 για το νοσοκομείο. Το λεωφορείο περνάει κάθε 20 λεπτά, από τις 06:00 μέχρι τις 23:00.

      Πληροφορίες: 22 45 67 80
    glosses:
      - text: σταθμός λεωφορείων
        russian: автовокзал
      - text: Διάρκεια διαδρομής
        russian: продолжительность поездки
      - text: Παλιό λιμάνι
        russian: Старый порт
      - text: Απλό
        russian: в одну сторону
      - text: Μετ' επιστροφής
        russian: туда и обратно
      - text: του σταθμού
        russian: (касса) вокзала
      - text: Αστικά λεωφορεία Λεμεσού
        russian: городские автобусы Лимасола
      - text: πάρτε
        russian: садитесь на (от παίρνω)
  - type: exercise
    id: timetable-choice
    about: timetable
    title: Выберите ответ
    instruction: Прочитайте расписание и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Во сколько в субботу первый автобус из Никосии?
        options:
          - "06:00"
          - "07:00"
          - "09:00"
          - "12:00"
        answer: "07:00"
      - id: q2
        prompt: Сколько едет автобус от Никосии до Лимасола?
        options:
          - 45 минут
          - около часа с четвертью
          - около двух часов
          - полчаса
        answer: около часа с четвертью
        explanation: Διάρκεια διαδρομής — περίπου 1 ώρα και 15 λεπτά.
      - id: q3
        prompt: Вы на автовокзале в Никосии, сегодня среда, 11:00. Когда следующий автобус в Лимасол?
        options:
          - в 10:00
          - в 12:00
          - в 14:00
          - в 16:00
        answer: в 12:00
        explanation: Среда — между Δευτέρα и Παρασκευή; после 10:00 следующий рейс — 12:00.
      - id: q4
        prompt: Сколько стоит билет туда и обратно?
        options:
          - 5 €
          - 8 €
          - 10 €
          - 13 €
        answer: 8 €
        explanation: Μετ' επιστροφής — 8 €. Два билета в одну сторону стоили бы 10 €.
      - id: q5
        prompt: Где можно купить билет?
        options:
          - в кассе вокзала или у водителя
          - только в кассе вокзала
          - только у водителя
          - в справочной
        answer: в кассе вокзала или у водителя
      - id: q6
        prompt: Вы приехали в Старый порт Лимасола, вам нужно в больницу. Как ехать?
        options:
          - на городском автобусе, линия 30
          - на междугороднем автобусе
          - на такси — автобуса туда нет
          - пешком, это пять минут
        answer: на городском автобусе, линия 30
  - type: exercise
    id: timetable-tf
    about: timetable
    title: Верно или неверно
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Την Κυριακή υπάρχουν τρία δρομολόγια από τη Λευκωσία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Κυριακή — 09:00, 13:00, 17:00.
      - id: q2
        prompt: Από Δευτέρα μέχρι Παρασκευή το τελευταίο λεωφορείο από τη Λευκωσία φεύγει στις έξι το απόγευμα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Последний рейс в будни — в 20:00, в восемь вечера. В 18:00 — предпоследний.
      - id: q3
        prompt: Το τελευταίο λεωφορείο από τη Λεμεσό, από Δευτέρα μέχρι Παρασκευή, φεύγει στις εννιά το βράδυ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: 21:00 — девять вечера.
      - id: q4
        prompt: Το λεωφορείο 30 περνάει κάθε μισή ώρα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κάθε 20 λεπτά — каждые двадцать минут.
      - id: q5
        prompt: Το υπεραστικό λεωφορείο φτάνει στο Παλιό λιμάνι της Λεμεσού.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: explanation
    id: listen-how
    title: Аудирование — объявления и заметки
    body: |-
      В аэропорту и на автовокзале объявления короткие и построены по одной схеме: **что** (рейс, автобус) → **куда или откуда** → **что случилось** (έχει καθυστέρηση) → **время** и **место** (πύλη, στάση). Время часто звучит по 24 часам: στις δεκαεννιά και σαράντα πέντε — 19:45.

      Перед первым прослушиванием прочитайте пункты заметок: вы будете знать, что ловить. Записывайте коротко — цифрами или словами. В объявлениях встретятся **Κυρίες και κύριοι** — «Дамы и господа» и **Ευχαριστούμε** — «Спасибо» (от лица аэропорта, «мы»). Во второй раз проверьте то, в чём не уверены.
  - type: listening
    id: announcements
    title: Στο αεροδρόμιο της Λάρνακας
    plays: 2
    transcript:
      - speaker: Ελένη
        text: Κυρίες και κύριοι, καλησπέρα σας. Η πτήση για την Αθήνα έχει καθυστέρηση σαράντα πέντε λεπτά. Η πτήση φεύγει στις δεκαεννιά και σαράντα πέντε από την πύλη δεκατέσσερα.
      - speaker: Ελένη
        text: Η πτήση από τη Θεσσαλονίκη φτάνει στις είκοσι και δέκα.
      - speaker: Αντρέας
        text: Πληροφορίες για τα λεωφορεία. Το λεωφορείο για τη Λευκωσία φεύγει σε πέντε λεπτά από τη στάση δύο, έξω από τις αφίξεις.
