blocks:
  - type: explanation
    id: timetable-words
    title: Рейсы, линии и расписание
    body: |-
      **Το δρομολόγιο** — один рейс автобуса по расписанию, **τα δρομολόγια** — расписание: Το επόμενο δρομολόγιο είναι στις τρεις. **Η γραμμή** — линия, номер маршрута: η γραμμή 30 (τριάντα), Παίρνω τη γραμμή 30. **Η διαδρομή** — путь, поездка: Η διαδρομή κάνει μία ώρα. У самолёта рейс — **η πτήση**, а выход на посадку — **η πύλη**.

      **Η αναχώρηση** — отправление, **η άφιξη** — прибытие; во мн. ч. — **οι αναχωρήσεις**, **οι αφίξεις** (так подписаны табло и залы аэропорта). В расписании стоят эти слова, а в разговоре чаще звучат глаголы: φεύγει, φτάνει. **Η διάρκεια** — продолжительность: Διάρκεια: 1 ώρα. **Ξεκινάω** — «отправляться, трогаться; начинать» — спрягается как ξυπνάω: Το λεωφορείο ξεκινάει από τον σταθμό.

      Автобусы на Кипре бывают **αστικά** — городские и **υπεραστικά** — междугородние (между Никосией, Лимасолом, Ларнакой и Пафосом). Прилагательное согласуется со словом: το αστικό λεωφορείο, τα υπεραστικά λεωφορεία, η υπεραστική γραμμή. Так же **επόμενος** — «следующий» и **τελευταίος** — «последний»: το επόμενο λεωφορείο, η επόμενη στάση, η τελευταία πτήση, ο τελευταίος επιβάτης.

      **Время по 24 часам.** В расписаниях пишут 17:45. В объявлениях его часто читают так же: **στις δεκαεπτά και σαράντα πέντε**. Часы — женского рода (οι ώρες), поэтому στις δεκατρείς, δεκατέσσερις, είκοσι μία, είκοσι τρεις. В обычном разговоре скажут проще: στις έξι παρά τέταρτο το απόγευμα.
    table:
      columns:
        - на табло
        - как читают
        - по-русски
      rows:
        - - "06:30"
          - στις έξι και μισή
          - в 6:30
        - - "13:00"
          - στις δεκατρείς
          - в 13:00, в час дня
        - - "14:15"
          - στις δεκατέσσερις και δεκαπέντε
          - в 14:15
        - - "17:45"
          - στις δεκαεπτά και σαράντα πέντε
          - в 17:45
        - - "20:10"
          - στις είκοσι και δέκα
          - в 20:10
        - - "23:30"
          - στις είκοσι τρεις και τριάντα
          - в 23:30
  - type: explanation
    id: delay
    title: Задержка, пробки и справочная
    body: |-
      **Η καθυστέρηση** — «задержка»: Το λεωφορείο **έχει καθυστέρηση** — «Автобус задерживается», Η πτήση έχει καθυστέρηση μία ώρα. Глагол **καθυστερώ** — «задерживаться, опаздывать» — спрягается как μπορώ: Η πτήση καθυστερεί σαράντα λεπτά.

      **Η κίνηση** — «движение»; **έχει κίνηση** — «пробки»: Σήμερα έχει πολλή κίνηση στον δρόμο. В разговоре часто слышно «πολύ κίνηση», но на письме — πολλή (πολύς, πολλή, πολύ — модуль 03).

      **Βιάζομαι** — «спешить, торопиться» — спрягается как έρχομαι: βιάζομαι, βιάζεσαι, βιάζεται. Συγγνώμη, βιάζομαι! Βιάζεσαι;

      **Η πληροφορία** — «сведения, информация»: Θέλω μια πληροφορία. **Οι πληροφορίες** — ещё и «справочная»: Πάω στις πληροφορίες.

      Две фразы выучите целиком. **Ανεβαίνουμε στο λεωφορείο από την μπροστινή πόρτα** — «Садимся в автобус через переднюю дверь» (μπροστινή — «передняя», от μπροστά): на Кипре в автобус входят спереди и платят или показывают билет водителю. **Πού πρέπει να κατέβω;** — «Где мне выходить?»: κατέβω — особая форма от κατεβαίνω после να, её вы разберёте в модуле 16.
