  - type: exercise
    id: hotel-choice
    title: В гостинице
    instruction: Выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Ваш номер στον πρώτο όροφο. На каком он этаже по-русски?
        options:
          - на первом
          - на втором
          - на третьем
        answer: на втором
        explanation: Первый этаж по-русски — ισόγειο; όροφοι считают над ним.
      - id: q2
        prompt: Вы едете одни. Какой номер вам нужен?
        options:
          - ένα μονόκλινο
          - ένα δίκλινο
        answer: ένα μονόκλινο
      - id: q3
        prompt: На сайте отеля написано «Δεν υπάρχουν διαθέσιμα δωμάτια». Что это значит?
        options:
          - Свободных номеров нет.
          - Все номера очень дорогие.
          - Завтрак не включён в стоимость.
        answer: Свободных номеров нет.
      - id: q4
        prompt: Στη ___ σας δίνουν το κλειδί του δωματίου.
        options:
          - ρεσεψιόν
          - πισίνα
          - παραλία
        answer: ρεσεψιόν
        explanation: Ключ от номера дают на ресепшн.
  - type: exercise
    id: reception
    title: Вопрос и ответ
    instruction: Соедините вопрос гостя и ответ администратора. Два ответа лишние.
    format: match
    bank:
      - Ναι, έχουμε ένα δίκλινο στον πρώτο όροφο.
      - Ογδόντα ευρώ τη νύχτα.
      - Ναι, το πρωινό περιλαμβάνεται.
      - Ναι, μπορείτε. Η ρεσεψιόν είναι ανοιχτή όλη τη μέρα.
      - Ευχαριστώ, κυρία Ιβάνοβα. Το διαβατήριό σας, παρακαλώ.
      - Στις οκτώ το πρωί.
      - Πέρσι, στην Πάφο.
    items:
      - id: m1
        prompt: Έχετε ελεύθερο δωμάτιο για δύο νύχτες;
        answer: Ναι, έχουμε ένα δίκλινο στον πρώτο όροφο.
      - id: m2
        prompt: Πόσο κάνει το δωμάτιο τη νύχτα;
        answer: Ογδόντα ευρώ τη νύχτα.
      - id: m3
        prompt: Το πρωινό περιλαμβάνεται στην τιμή;
        answer: Ναι, το πρωινό περιλαμβάνεται.
      - id: m4
        prompt: Μπορώ να αφήσω τις βαλίτσες μου εδώ;
        answer: Ναι, μπορείτε. Η ρεσεψιόν είναι ανοιχτή όλη τη μέρα.
      - id: m5
        prompt: Καλησπέρα σας. Έκανα κράτηση στο όνομα Ιβάνοβα.
        answer: Ευχαριστώ, κυρία Ιβάνοβα. Το διαβατήριό σας, παρακαλώ.
  - type: explanation
    id: letter-how
    title: Как читать письмо-подтверждение
    body: |-
      После бронирования гостиница присылает письмо — **επιβεβαίωση κράτησης**, «подтверждение бронирования». Это официальное письмо: оно начинается с **Αγαπητή κυρία…** / **Αγαπητέ κύριε…**, в нём везде «вы» (σας), а заканчивается оно формулой **Με εκτίμηση** — «С уважением». Как писать такое письмо самим, вы узнаете в уроке 3.

      В таком письме ищите пять вещей: какой номер, даты приезда и отъезда (**άφιξη**, **αναχώρηση** — модуль 13), цену, что входит в неё, и правила — до какого числа бронь можно отменить бесплатно. Числа и время внимательно сверяйте с вопросами: на экзамене ловушки часто именно в них.
  - type: reading
    id: confirmation
    title: Επιβεβαίωση κράτησης
    text: |-
      Θέμα: Επιβεβαίωση κράτησης

      Αγαπητή κυρία Ορλόβα,

      Σας ευχαριστούμε για την κράτησή σας στο ξενοδοχείο «Ορίζοντας». Με αυτό το μήνυμα επιβεβαιώνουμε την κράτηση:

      Δωμάτιο: ένα δίκλινο με θέα στη θάλασσα, στον τρίτο όροφο
      Άφιξη: Παρασκευή 16 Ιουλίου, από τις 14:00
      Αναχώρηση: Δευτέρα 19 Ιουλίου, μέχρι τις 11:00
      Τιμή: 90 ευρώ τη νύχτα, με πρωινό

      Το πρωινό είναι από τις 7:00 μέχρι τις 10:00, στον πρώτο όροφο. Η πισίνα είναι ανοιχτή κάθε μέρα από τις 9:00 μέχρι τις 19:00, και η παραλία είναι μόνο πέντε λεπτά με τα πόδια. Το ξενοδοχείο έχει ασανσέρ.

      Κάθε Σάββατο το πρωί υπάρχει ξενάγηση στο ιστορικό κέντρο της Πάφου. Η ξενάγηση είναι δωρεάν για τους πελάτες μας.

      Στη ρεσεψιόν, παρακαλούμε, δείξτε το διαβατήριό σας. Την ημέρα της αναχώρησης μπορείτε να αφήσετε τις αποσκευές σας στη ρεσεψιόν.

      Η ακύρωση είναι δωρεάν μέχρι τις 5 Ιουλίου. Μετά από αυτή την ημερομηνία η ακύρωση κοστίζει 90 ευρώ.

      Με εκτίμηση,
      Ανδρέας Χριστοδούλου
      Ρεσεψιόν, ξενοδοχείο «Ορίζοντας»
    glosses:
      - text: Θέμα
        russian: тема (письма)
      - text: Επιβεβαίωση
        russian: подтверждение (от επιβεβαιώνω)
      - text: Σας ευχαριστούμε
        russian: благодарим вас
      - text: «Ορίζοντας»
        russian: «Горизонт»
      - text: μήνυμα
        russian: сообщение, письмо
      - text: δωρεάν
        russian: бесплатно
      - text: παρακαλούμε
        russian: просим вас
      - text: δείξτε
        russian: покажите
      - text: Την ημέρα της αναχώρησης
        russian: в день отъезда
      - text: να αφήσετε
        russian: оставить
      - text: Μετά από αυτή την ημερομηνία
        russian: после этой даты
  - type: exercise
    id: confirmation-tf
    about: confirmation
    title: Верно или неверно
    instruction: Прочитайте письмо. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η κυρία Ορλόβα έκλεισε ένα μονόκλινο δωμάτιο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δωμάτιο — ένα δίκλινο, двухместный.
      - id: q2
        prompt: Η κυρία Ορλόβα μένει στο ξενοδοχείο τρεις νύχτες.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: С пятницы 16-го по понедельник 19-е — три ночи (с пятницы на субботу, с субботы на воскресенье, с воскресенья на понедельник).
      - id: q3
        prompt: Το πρωινό δεν περιλαμβάνεται στην τιμή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: 90 ευρώ τη νύχτα, με πρωινό — завтрак включён.
      - id: q4
        prompt: Η πισίνα είναι ανοιχτή στις εννέα το βράδυ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: "Бассейн открыт с 9:00 до 19:00. Ловушка: «εννέα» — это 9 утра, когда бассейн открывается."
      - id: q5
        prompt: Οι πελάτες του ξενοδοχείου δεν πληρώνουν για την ξενάγηση.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Η ξενάγηση είναι δωρεάν για τους πελάτες μας.
      - id: q6
        prompt: Τη Δευτέρα η κυρία Ορλόβα μπορεί να αφήσει τις βαλίτσες της στη ρεσεψιόν.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Понедельник — день отъезда (αναχώρηση), а в этот день багаж можно оставить на ресепшн.
      - id: q7
        prompt: Η ακύρωση στις 10 Ιουλίου είναι δωρεάν.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Бесплатно — только до 5 июля; позже отмена стоит 90 евро.
  - type: exercise
    id: confirmation-choice
    about: confirmation
    title: Цифры в письме
    instruction: Прочитайте письмо ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: На каком этаже номер госпожи Орловой — по русскому счёту?
        options:
          - на втором
          - на третьем
          - на четвёртом
          - на пятом
        answer: на четвёртом
        explanation: Στον τρίτο όροφο — третий этаж над ισόγειο, по-русски четвёртый.
      - id: q2
        prompt: До скольких нужно освободить номер в день отъезда?
        options:
          - до 10:00
          - до 11:00
          - до 14:00
          - до 19:00
        answer: до 11:00
      - id: q3
        prompt: Сколько госпожа Орлова заплатит за всё проживание?
        options:
          - 90 €
          - 180 €
          - 270 €
          - 360 €
        answer: 270 €
        explanation: Три ночи по 90 евро.
  - type: explanation
    id: listen-how
    title: Как слушать звонок в отель
    body: |-
      Сейчас вы услышите телефонный разговор: мужчина звонит в гостиницу и бронирует номер. Администратор и гость говорят на «вы» — это официальный разговор, как в четвёртом задании экзамена. Там нужно делать **заметки**: записать число, время, имя, одно слово.

      Прочитайте вопросы до прослушивания. В первый раз слушайте общий смысл, во второй — записывайте. Будьте внимательны: администратор может назвать два номера или две цены, а гость выберет один. Числа можно записывать цифрами.

      Администратор начинает разговор так: **Ξενοδοχείο «Κάστρο», καλημέρα σας.** В конце она говорит **Σας περιμένουμε** — «Ждём вас».
  - type: listening
    id: call
    title: Στο τηλέφωνο με το ξενοδοχείο
    plays: 2
    transcript:
      - speaker: Κατερίνα
        text: Ξενοδοχείο «Κάστρο», καλημέρα σας.
      - speaker: Ραφαήλ
        text: Καλημέρα σας. Έχετε ελεύθερο δωμάτιο για δύο νύχτες, την Παρασκευή και το Σάββατο;
      - speaker: Κατερίνα
        text: Μονόκλινο ή δίκλινο;
      - speaker: Ραφαήλ
        text: Δίκλινο. Είμαστε δύο, εγώ και η γυναίκα μου.
      - speaker: Κατερίνα
        text: Ένα λεπτό, παρακαλώ… Ναι, έχουμε ένα δίκλινο στον δεύτερο όροφο.
      - speaker: Ραφαήλ
        text: Πόσο κάνει το δωμάτιο τη νύχτα;
      - speaker: Κατερίνα
        text: Ογδόντα ευρώ. Έχουμε και ένα δίκλινο με θέα στη θάλασσα, στον τρίτο όροφο. Αυτό κάνει εκατό ευρώ.
      - speaker: Ραφαήλ
        text: Το πρωινό περιλαμβάνεται στην τιμή;
      - speaker: Κατερίνα
        text: Ναι, περιλαμβάνεται. Το πρωινό είναι από τις επτά μέχρι τις δέκα.
      - speaker: Ραφαήλ
        text: Και υπάρχει ασανσέρ; Η γυναίκα μου έχει πάντα πολλές βαλίτσες!
      - speaker: Κατερίνα
        text: Ναι, υπάρχει. Έχουμε και πισίνα.
      - speaker: Ραφαήλ
        text: Ωραία. Θα ήθελα να κλείσω το δίκλινο με θέα στη θάλασσα.
      - speaker: Κατερίνα
        text: Σε ποιο όνομα;
      - speaker: Ραφαήλ
        text: Ραφαήλ Αντωνίου.
      - speaker: Κατερίνα
        text: Ευχαριστώ, κύριε Αντωνίου. Στη ρεσεψιόν χρειαζόμαστε το διαβατήριό σας.
      - speaker: Ραφαήλ
        text: Και κάτι ακόμα. Την Κυριακή το λεωφορείο μας φεύγει στις πέντε το απόγευμα. Μπορώ να αφήσω τις βαλίτσες μου στη ρεσεψιόν;
      - speaker: Κατερίνα
        text: Ναι, μπορείτε. Αλλά το δωμάτιο πρέπει να είναι ελεύθερο μέχρι τις δώδεκα.
      - speaker: Ραφαήλ
        text: Ευχαριστώ πολύ!
      - speaker: Κατερίνα
        text: Παρακαλώ. Σας περιμένουμε την Παρασκευή!
  - type: exercise
    id: call-notes
    about: call
    title: Заметки
    instruction: Прослушайте разговор и запишите ответ — цифрой или одним-двумя словами по-гречески.
    format: text
    items:
      - id: n1
