  - type: explanation
    id: gaps-how
    title: Открытка из отпуска — пропуски
    body: |-
      Экзаменационное задание с пропусками, теперь — с аористом. В тексте шесть пропусков, в списке девять слов, три лишние.

      Для каждого пропуска решите две вещи. **Время:** есть ли слово прошлого — χθες, προχθές, πέρσι — или рассказ уже идёт о прошлом? Тогда нужен аорист, а не настоящее время. **Лицо:** кто делает — εγώ, ο Άρης, εμείς, οι τουρίστες? Окончание должно ему соответствовать. Лишние слова в этом задании — как раз «не то время» или «не то лицо».
  - type: reading
    id: postcard
    title: Από την Πάφο
    text: |-
      Γεια σου, Λένα!

      Είμαστε στην Πάφο από την Τετάρτη, στο ξενοδοχείο «Ορίζοντας». Χθες το πρωί εγώ (1) ___ δύο ώρες στη θάλασσα, και ο Άρης (2) ___ στην πισίνα με ένα βιβλίο. Το απόγευμα (3) ___ το κάστρο της Πάφου με ξενάγηση — εμείς οι δύο και δέκα τουρίστες από τη Γερμανία. Οι τουρίστες (4) ___ όλα τα μνημεία! Το βράδυ (5) ___ πολλά λεφτά σε μια ωραία ταβέρνα κοντά στο λιμάνι, αλλά το φαγητό ήταν πολύ νόστιμο.

      Αύριο φεύγουμε. Σήμερα το πρωί (6) ___ τις βαλίτσες μας, και τώρα χαλαρώνουμε στην παραλία.

      Τα λέμε!
      Νάσια
    glosses:
      - text: βιβλίο
        russian: книга
      - text: εμείς οι δύο
        russian: мы вдвоём
      - text: Γερμανία
        russian: Германия
      - text: ήταν
        russian: была, было
  - type: exercise
    id: postcard-gap
    about: postcard
    title: Пропуски
    instruction: Прочитайте открытку и вставьте глаголы. Три слова лишние.
    format: gap
    bank:
      - κολύμπησα
      - χαλάρωσε
      - επισκεφτήκαμε
      - φωτογράφισαν
      - ξοδέψαμε
      - ετοιμάσαμε
      - κολυμπάω
      - χαλαρώνει
      - ξόδεψες
    items:
      - id: g1
        prompt: (1) Χθες το πρωί εγώ ___ δύο ώρες στη θάλασσα.
        answer: κολύμπησα
        explanation: Χθες — аорист; εγώ — окончание -α. κολυμπάω — настоящее время.
      - id: g2
        prompt: (2) … και ο Άρης ___ στην πισίνα με ένα βιβλίο.
        answer: χαλάρωσε
        explanation: Ο Άρης — «он», окончание -ε; из форм аориста на -ε в списке только χαλάρωσε. χαλαρώνει — настоящее время, а речь о вчерашнем дне.
      - id: g3
        prompt: (3) Το απόγευμα ___ το κάστρο της Πάφου με ξενάγηση.
        answer: επισκεφτήκαμε
        explanation: Εμείς οι δύο — «мы», επισκέπτομαι → επισκεφτήκαμε.
      - id: g4
        prompt: (4) Οι τουρίστες ___ όλα τα μνημεία!
        answer: φωτογράφισαν
        explanation: Οι τουρίστες — «они», окончание -αν.
      - id: g5
        prompt: (5) Το βράδυ ___ πολλά λεφτά σε μια ωραία ταβέρνα.
        answer: ξοδέψαμε
        explanation: Пишет Нася о себе и Арисе — «мы». ξόδεψες — «ты», это о Лене, она в Пафосе не была.
      - id: g6
        prompt: (6) Σήμερα το πρωί ___ τις βαλίτσες μας.
        answer: ετοιμάσαμε
        explanation: τις βαλίτσες μας — «наши», значит, «мы».
