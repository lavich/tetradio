blocks:
  - type: explanation
    id: hotel
    title: Гостиница и номер
    body: |-
      **Το ξενοδοχείο** — гостиница, отель. Номер в гостинице — **το δωμάτιο** (модуль 06). **Το μονόκλινο** — одноместный номер, **το δίκλινο** — двухместный. Полностью говорят μονόκλινο δωμάτιο, δίκλινο δωμάτιο, но слово δωμάτιο часто опускают: Θέλω ένα δίκλινο.

      **Η ρεσεψιόν** — стойка регистрации. Слово не склоняется: η ρεσεψιόν, **στη ρεσεψιόν**, οι ρεσεψιόν. Так же **το ασανσέρ** — лифт: στο ασανσέρ, τα ασανσέρ. В официальных текстах лифт называют ο ανελκυστήρας.

      **Ο όροφος** — этаж. Внимание: **ισόγειο** — это наш первый этаж, а όροφοι считают над ним (как в модуле 06). Поэтому **στον πρώτο όροφο** — на втором этаже по-русски, **στον δεύτερο όροφο** — на третьем.

      **Οι αποσκευές** — багаж (обычно во мн. ч.), **η βαλίτσα** — чемодан, **το διαβατήριο** — паспорт. **Η πισίνα** — бассейн. **Η θέα** — вид: δωμάτιο **με θέα στη θάλασσα** — номер с видом на море.

      **Διαθέσιμος** — свободный, доступный; на сайтах отелей пишут διαθέσιμο δωμάτιο, διαθέσιμα δωμάτια. В разговоре чаще **ελεύθερος** (модуль 09): Έχετε ελεύθερο δωμάτιο;

      **Η κράτηση** — бронирование, бронь: **κάνω κράτηση**. Забронировать номер можно ещё проще: **κλείνω δωμάτιο** (κλείνω — «закрываю», а в гостинице — «бронирую»). **Επιβεβαιώνω** — подтверждать, **ακυρώνω** — отменять, **η ακύρωση** — отмена. Аорист правильный: επιβεβαίωσα, ακύρωσα, έκλεισα.

      **Ιστορικός** — исторический: **το ιστορικό κέντρο** — исторический центр. **Η ξενάγηση** — экскурсия с гидом.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - ένα μονόκλινο (δωμάτιο)
          - одноместный номер
        - - ένα δίκλινο (δωμάτιο)
          - двухместный номер
        - - δωμάτιο με θέα στη θάλασσα
          - номер с видом на море
        - - στη ρεσεψιόν
          - на ресепшн
        - - στον πρώτο όροφο
          - на втором этаже (по-русски)
        - - κάνω κράτηση / κλείνω δωμάτιο
          - бронирую номер
        - - ακυρώνω την κράτηση
          - отменяю бронь
  - type: explanation
    id: booking
    title: Как забронировать номер
    body: |-
      Эти фразы нужны и по телефону, и на ресепшн. Их лучше выучить целиком.

      **Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο.** — «Я хотел(а) бы забронировать двухместный номер». Θα ήθελα — вежливое «я бы хотел(а)» (модуль 09). После **θα ήθελα να** и **μπορώ να** глагол стоит в особой форме: **κλείσω**, **αφήσω**, **επιβεβαιώσω**. Она похожа на аорист — та же основа κλεισ-, но без έ- и с окончанием -ω. Как она устроена, вы узнаете в модуле 16, а пока берите её из фраз.

      **Πόσο κάνει το δωμάτιο τη νύχτα;** — τη νύχτα здесь значит «за ночь». **Το πρωινό περιλαμβάνεται στην τιμή;** — «Завтрак включён в стоимость?», περιλαμβάνεται — «включается». Ответ: Ναι, περιλαμβάνεται.

      **Έκανα κράτηση στο όνομα Ιβάνοβα.** — «Я бронировал(а) на имя Иванова». Έκανα — аорист от κάνω, неправильный (модуль 15). После στο όνομα фамилия не меняется.

      **Μπορώ να αφήσω τις βαλίτσες μου εδώ;** — «Можно оставить здесь мои чемоданы?»: так спрашивают, когда номер уже сдан, а до автобуса ещё несколько часов.
    table:
      columns:
        - ситуация
        - фраза
      rows:
        - - спросить о свободном номере
          - Έχετε ελεύθερο δωμάτιο για δύο νύχτες;
        - - забронировать
          - Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο.
        - - узнать цену
          - Πόσο κάνει το δωμάτιο τη νύχτα;
        - - спросить о завтраке
          - Το πρωινό περιλαμβάνεται στην τιμή;
        - - прийти на ресепшн
          - Έκανα κράτηση στο όνομα Ιβάνοβα.
        - - оставить багаж
          - Μπορώ να αφήσω τις βαλίτσες μου εδώ;
