          - "[эпта́] ([эфта́])"
        - - "8"
          - οκτώ (οχτώ)
          - "[окто́] ([охто́])"
        - - "9"
          - εννέα (εννιά)
          - "[энэ́а] ([эньа́])"
        - - "10"
          - δέκα
          - "[ðэ́ка]"
  - type: explanation
    id: friends
    title: Друг, подруга, имя
    body: |-
      У греческих существительных три рода, и артикль сразу его показывает: **ο** — мужской, **η** — женский, **το** — средний. Учите слово вместе с артиклем: ο φίλος, η φίλη, το όνομα.

      «Мой» и «твой» ставятся **после** слова: ο φίλος **μου** — «мой друг», η φίλη **σου** — «твоя подруга», ο φίλος **σας** — «ваш друг». Если ударение в слове стоит на третьем слоге от конца, с μου/σου/σας появляется второй тонос: το **όνομά** μου — «моё имя», το **τηλέφωνό** μου — «мой телефон».

      При знакомстве: **Χάρηκα πολύ.** — «Очень приятно.» Ответ: **Επίσης.** — «Взаимно». Вежливый вопрос — **Πώς σας λένε;** («Как вас зовут?»), дружеский — Πώς σε λένε;

      **Γιατί;** — «почему?»; в ответе то же слово значит «потому что»: — Γιατί είσαι στην Κύπρο; — Γιατί η Κύπρος είναι ωραία. **Τώρα** — «сейчас»: Τώρα είμαι στη Λεμεσό (στη — «в»).
    table:
      columns:
        - слово
        - перевод
        - мн. число
      rows:
        - - ο φίλος
          - друг
          - οι φίλοι
        - - η φίλη
          - подруга
          - οι φίλες
        - - το όνομα
          - имя
          - τα ονόματα
