  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Диалог звучит два раза, как на экзамене. В первый раз слушайте общий смысл: кто говорит, где, на «ты» или на «вы». Перед вторым прослушиванием прочитайте вопросы и слушайте нужные детали — имена, города, цифры.

      Текст диалога откроется после ответа. Прочитайте его вслух вместе с записью — это хорошая тренировка произношения.
  - type: listening
    id: party
    title: Στο πάρτι
    plays: 2
    transcript:
      - speaker: Αντρέας
        text: Καλησπέρα! Είμαι ο Αντρέας. Πώς σε λένε;
      - speaker: Μαρίνα
        text: Καλησπέρα! Με λένε Μαρίνα.
      - speaker: Αντρέας
        text: Χάρηκα πολύ, Μαρίνα.
      - speaker: Μαρίνα
        text: Επίσης! Από πού είσαι;
      - speaker: Αντρέας
        text: Είμαι από την Κύπρο, από τη Λευκωσία. Κι εσύ;
      - speaker: Μαρίνα
        text: Είμαι από τη Ρωσία, από τη Μόσχα. Αλλά τώρα είμαι στη Λεμεσό.
      - speaker: Αντρέας
        text: Ωραία! Και ποια είναι αυτή; Η φίλη σου;
      - speaker: Μαρίνα
        text: Ναι, η φίλη μου η Κατερίνα. Είναι από την Ελλάδα, από τη Θεσσαλονίκη.
      - speaker: Αντρέας
        text: Και το τηλέφωνό σου;
      - speaker: Μαρίνα
        text: Εννέα, εννέα, τέσσερα, επτά, δύο, μηδέν, έξι, πέντε.
  - type: exercise
    id: party-choice
    about: party
    title: Выберите ответ
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Από πού είναι ο Αντρέας;
        options:
          - Από τη Λευκωσία.
          - Από τη Λεμεσό.
          - Από τη Μόσχα.
        answer: Από τη Λευκωσία.
        explanation: Είμαι από την Κύπρο, από τη Λευκωσία. Лимасол — там, где сейчас Марина.
      - id: q2
        prompt: Πού είναι τώρα η Μαρίνα;
        options:
          - Στη Μόσχα.
          - Στη Λεμεσό.
          - Στη Λευκωσία.
        answer: Στη Λεμεσό.
        explanation: Марина из Москвы, но τώρα — «сейчас» — она в Лимасоле.
      - id: q3
        prompt: Кто такая Катерина?
        options:
          - подруга Марины
          - подруга Андреаса
          - сестра Марины
        answer: подруга Марины
        explanation: Η φίλη μου η Κατερίνα — говорит Марина.
      - id: q4
        prompt: Από πού είναι η Κατερίνα;
        options:
          - Από την Κύπρο.
          - Από τη Ρωσία.
          - Από την Ελλάδα.
        answer: Από την Ελλάδα.
      - id: q5
        prompt: Когда происходит разговор?
        options:
          - утром
          - вечером
        answer: вечером
        explanation: Они здороваются словом Καλησπέρα — «добрый вечер».
      - id: q6
        prompt: Как они говорят друг с другом?
        options:
          - на «ты»
          - на «вы»
        answer: на «ты»
        explanation: Πώς σε λένε; Από πού είσαι; Κι εσύ; — это формы на «ты».
