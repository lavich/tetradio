    title: Вопрос и ответ
    instruction: Соедините реплику и ответ. Два ответа лишние.
    format: match
    bank:
      - Με λένε Δήμητρα.
      - Είμαι από τη Μόσχα.
      - Επίσης.
      - Παρακαλώ.
      - Καλά, ευχαριστώ. Κι εσύ;
      - Ο φίλος μου ο Πέτρος.
