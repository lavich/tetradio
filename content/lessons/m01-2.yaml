  - type: reading
    id: irina
    title: Η Ιρίνα
    text: |-
      Γεια σας! Με λένε Ιρίνα. Είμαι από τη Ρωσία, από την Αγία Πετρούπολη. Τώρα είμαι στην Κύπρο, στη Λάρνακα.

      Ο φίλος μου ο Μιχάλης είναι από τη Λάρνακα. Η φίλη μου η Όλγα είναι από τη Μόσχα, αλλά τώρα είναι στην Πάφο. Εμείς είμαστε φίλοι.

      Γιατί είμαι στην Κύπρο; Γιατί η Κύπρος είναι πολύ ωραία!

      Το τηλέφωνό μου: εννέα, έξι, τρία, πέντε, μηδέν, δύο, οκτώ, ένα.
    glosses:
      - text: Αγία Πετρούπολη
        russian: Санкт-Петербург
      - text: στην
        russian: в (στην Κύπρο — на Кипре)
      - text: στη Λάρνακα
        russian: в Ларнаке
      - text: Ο φίλος μου
        russian: мой друг
      - text: αλλά
        russian: но
      - text: Πάφο
        russian: Пафос
      - text: φίλοι
        russian: друзья
      - text: πολύ ωραία
        russian: очень красивая
      - text: Το τηλέφωνό μου
        russian: мой телефон
  - type: exercise
    id: irina-tf
    about: irina
    title: Верно или неверно
    instruction: Прочитайте текст. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Ιρίνα είναι από τη Μόσχα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Από την Αγία Πετρούπολη — Ирина из Санкт-Петербурга. Из Москвы — Ольга.
      - id: q2
        prompt: Τώρα η Ιρίνα είναι στη Λάρνακα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Ο Μιχάλης είναι από την Κύπρο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Михалис из Ларнаки, а Ларнака — город на Кипре. На экзамене такие выводы встречаются часто.
      - id: q4
        prompt: Η Όλγα είναι τώρα στη Μόσχα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Αλλά τώρα είναι στην Πάφο — «но сейчас она в Пафосе».
      - id: q5
        prompt: Η Όλγα είναι η φίλη της Ιρίνας. (της Ιρίνας — Ирины)
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Η φίλη μου η Όλγα — «моя подруга Ольга», говорит Ирина.
      - id: q6
        prompt: Η Ιρίνα είναι στην Κύπρο, γιατί η Κύπρος είναι ωραία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Γιατί είμαι στην Κύπρο; Γιατί η Κύπρος είναι πολύ ωραία! — здесь γιατί значит и «почему», и «потому что».
