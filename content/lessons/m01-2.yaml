      - Όχι, είμαι από την Κύπρο.
    items:
      - id: m1
        prompt: Πώς σας λένε;
        answer: Με λένε Δήμητρα.
      - id: m2
        prompt: Από πού είστε;
        answer: Είμαι από τη Μόσχα.
      - id: m3
