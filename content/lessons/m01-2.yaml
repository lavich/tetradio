blocks:
  - type: explanation
    id: numbers
    title: Числа от 0 до 10
    body: |-
      Номер телефона по-гречески обычно читают парами цифр (96 35 02 81 — ενενήντα έξι, τριάντα πέντε…), но при уточнении диктуют и по одной цифре — поэтому числа от 0 до 10 нужны сразу, в первом модуле.

      У трёх чисел есть разговорные варианты, их вы услышите чаще книжных: **εφτά** вместо επτά, **οχτώ** вместо οκτώ, **εννιά** [эньа́] вместо εννέα. Понимать нужно оба варианта.

      Числа 1, 3 и 4 меняются по родам (ένας, μία; τρεις; τέσσερις) — это будет в следующих модулях. При счёте и в номерах телефона говорят ένα, τρία, τέσσερα.
    table:
      columns:
        - число
        - по-гречески
        - чтение
      rows:
        - - "0"
          - μηδέν
          - "[миðэ́н]"
        - - "1"
          - ένα
          - "[э́на]"
        - - "2"
          - δύο
