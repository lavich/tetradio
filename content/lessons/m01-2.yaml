  - type: exercise
    id: polite
    title: На «ты» или на «вы»
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы спрашиваете имя у пожилого господина.
        options:
          - Πώς σας λένε;
          - Πώς σε λένε;
        answer: Πώς σας λένε;
        explanation: С незнакомым взрослым — вежливо, σας.
      - id: q2
        prompt: Вы спрашиваете имя у ребёнка.
        options:
          - Πώς σας λένε;
          - Πώς σε λένε;
        answer: Πώς σε λένε;
      - id: q3
        prompt: Вы спрашиваете двух туристов, откуда они.
        options:
          - Από πού είσαι;
          - Από πού είστε;
        answer: Από πού είστε;
        explanation: "Людей двое — нужно «вы»: είστε."
      - id: q4
        prompt: Как правильно написать «моё имя»?
        options:
          - το όνομα μου
          - το όνομά μου
        answer: το όνομά μου
        explanation: Ударение в όνομα на третьем слоге от конца, поэтому с μου появляется второй тонос — όνομά μου.
  - type: exercise
    id: words-gap
    title: Слова урока
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - φίλος
      - φίλη
      - Καλά
      - τώρα
      - γιατί
      - Επίσης
      - όνομα
    items:
      - id: g1
        prompt: Ο Πέτρος είναι ο ___ μου.
        answer: φίλος
      - id: g2
        prompt: Η Όλγα είναι η ___ μου.
        answer: φίλη
        explanation: "Ольга — женщина: η φίλη, «подруга»."
      - id: g3
        prompt: — Τι κάνεις; — ___, ευχαριστώ.
        answer: Καλά
      - id: g4
        prompt: Η Όλγα ___ είναι στην Πάφο.
        answer: τώρα
      - id: g5
        prompt: — Και ___ είσαι στην Κύπρο; — Γιατί η Κύπρος είναι ωραία.
        answer: γιατί
        explanation: Γιατί в вопросе — «почему», в ответе — «потому что».
      - id: g6
        prompt: — Χάρηκα πολύ! — ___!
        answer: Επίσης
