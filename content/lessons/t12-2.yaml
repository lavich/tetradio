  - type: explanation
    id: safe-meeting
    title: Первая встреча — три правила безопасности
    body: |-
      Многие знакомства начинаются в приложении, и первую встречу с человеком, которого вы знаете только по переписке, строят по трём правилам.

      **Первое — людное место.** Выберите кафе, рынок или площадь, где вокруг много людей: **Let's meet somewhere busy.** Квартира и безлюдный парк для первой встречи не подходят.

      **Второе — дорога домой своя.** Приезжайте и уезжайте самостоятельно. Если собеседник предлагает подвезти или проводить, можно вежливо отказаться: **I'll make my own way home, thanks.** Причину называть не нужно, отказ принимается как есть.

      **Третье — кто-то из друзей знает, где вы.** Напишите другу, где вы будете, с кем и во сколько, и договоритесь, когда сообщите, что всё в порядке: **I'll text a friend where I am.**

      Обычно собеседник соглашается с этими правилами без споров: *Good idea, I do the same.* Если он возражает, торопит или настаивает, это red flag. Отказаться от встречи или закончить переписку можно в любой момент, причину называть необязательно.
    table:
      columns:
        - правило
        - что сказать
      rows:
        - - людное место
          - Let's meet somewhere busy.
        - - дорога домой своя
          - I'll make my own way home, thanks.
        - - друг знает, где вы
          - I'll text a friend where I am.
  - type: exercise
    id: safe-q
    title: Безопасная первая встреча
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "Maya and a new match agree to meet for the first time. Which place follows the first rule?"
        options:
          - a busy café in the town centre
          - his flat
          - a quiet park after dark
        answer: a busy café in the town centre
        explanation: Первое правило — людное место.
      - id: q2
        prompt: "After the coffee your match says: Let me drive you home. You want to get home on your own. What do you say?"
        options:
          - I'll make my own way home, thanks.
          - Count me in.
          - Let's meet somewhere busy.
        answer: I'll make my own way home, thanks.
        explanation: Второе правило — дорога домой своя; вежливый отказ без объяснений.
      - id: q3
        prompt: "Which message to a friend follows the third rule?"
        options:
          - I'm meeting a new match at the café by the river at three. I'll text you at five.
          - I'm running a bit late.
          - Count me in for Saturday.
        answer: I'm meeting a new match at the café by the river at three. I'll text you at five.
        explanation: Третье правило — друг знает, где вы, с кем и во сколько, и когда придёт сообщение.
      - id: q4
        prompt: "A match refuses to meet in a public place and says: Come to my flat, it's quieter. What does it tell you?"
        options:
          - It is a red flag. You can suggest another place or stop the chat.
          - It is a normal plan for a first meeting.
          - You should accept to be polite.
        answer: It is a red flag. You can suggest another place or stop the chat.
        explanation: Отказ от людного места — тревожный признак; предложить другое место или закончить переписку можно без объяснений.
  - type: explanation
    id: voice-how
    title: Голосовое сообщение в приложении
    body: |-
      Теперь голосовые сообщения Майи и Тео. Слушайте, кем работает Майя, в какой день она свободна, где и во сколько они договариваются встретиться и что она делает для безопасности. Звучит два раза, транскрипт откроется после ответа.

      В записи **on nights** — работать в ночную смену, **tricky** — неудобный, **a market** — рынок. **Wonderwall** — название песни.
  - type: listening
    id: voice
    title: Voice messages — Maya and Theo
    plays: 2
    transcript:
      - { speaker: Maya, text: "Hi Theo, it's Maya. Thanks for your voice message, it was nice to hear a real voice. Your bio made me laugh, by the way. I'm a nurse, and I'm on nights this week, so evenings are tricky for me. I'm free on Saturday, though.", audio: t12-2/voice-1.mp3 }
      - { speaker: Maya, text: "I'd love to hear more about your trip to Peru. And what's your go-to karaoke song? Mine is terrible, so no pressure. Fancy a coffee on Saturday morning? I know a café in the market. It's always busy, and I like that for a first meeting.", audio: t12-2/voice-2.mp3 }
      - { speaker: Theo, text: "Hi Maya, thanks for the message. Not gonna lie, my karaoke song is Wonderwall, and I'm sorry about that. Peru was amazing, I'll tell you more over coffee. Saturday morning works for me.", audio: t12-2/voice-3.mp3 }
      - { speaker: Theo, text: "Shall we say half past eleven, at the café in the market?", audio: t12-2/voice-4.mp3 }
      - { speaker: Maya, text: "Half past eleven is fine. I'll text a friend where I am, as I always do for a first meeting.", audio: t12-2/voice-5.mp3 }
      - { speaker: Theo, text: "Of course, that makes sense. I'll do the same. See you on Saturday.", audio: t12-2/voice-6.mp3 }
