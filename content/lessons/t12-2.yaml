blocks:
  - type: explanation
    id: words-more
    title: Ещё слова и фразы для знакомств
    body: |-
      **A spark** — ощущение взаимного интереса: *I didn't feel a spark.* **Unmatch** — удалить пару в приложении и закончить общение. **A first move** — первый шаг; **make the first move** значит написать первым или предложить встречу.

      Четыре слова описывают впечатление и прямоту. **Genuine** — искренний, настоящий: *She showed genuine interest.* **Come across as** — производить впечатление: *You come across as friendly.* **Upfront** — прямо и заранее: *Say it upfront, before you meet.* **Verified** — подтверждённый: у профиля с отметкой *verified* приложение проверило личность.

      Фразы. **Let's see how it goes.** — не торопить события и не обещать лишнего. **Thanks, but I'm not ready to meet yet.** — вежливый отказ от приглашения, причину называть не нужно. **I don't think we're a match, but good luck.** — спокойное окончание переписки. Собеседник отвечает коротко: *Fair enough. Good luck to you too.* Повторять просьбу после отказа не принято.

      Фразы о безопасности и голосовом сообщении разобраны ниже: **Let's meet somewhere busy.** **I'll text a friend where I am.** **I'll make my own way home, thanks.** **Could you send me a voice message?**
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: explanation
    id: profiles-how
    title: Как читать анкеты и переписки
    body: |-
      В анкете ищите четыре вещи: чем человек занимается, что любит (после love, enjoy, be into идёт форма на -ing), что ищет и что для него dealbreaker. В переписке читайте сообщения подряд: вопрос, ответ, встречный вопрос.

      Затем отвечайте на вопросы. Внимание на время и день встречи, на место и на то, что каждый из собеседников делает для безопасности.
  - type: reading
    id: profiles
    title: Alex's profile and a chat with Will
    text: |-
      ALEX, 31 — Leeds
      Bio: Primary school teacher. I'm into climbing, cooking and quiz nights. I'd love to meet someone genuine who laughs easily. I'm upfront about one thing: I take things slowly.

      CHAT WITH WILL — NEW MATCH

      Alex: Hi Will! Your bio says you love cooking for friends. What's your signature dish?
      Will: lol, ngl, it's just pasta. tbh I'm better at eating than cooking. hbu?
      Alex: I'm into climbing and trying new food
      Will: Sounds fun. Fancy a coffee sometime? There's a café by the river
      Alex: I'm up for coffee. Saturday afternoon?
      Will: Sounds good. Shall we say three?
      Alex: Three is fine. The café is always busy, and I like meeting somewhere busy the first time. I'll text a friend where I am, as I always do
      Will: Good idea, I do the same. See you on Saturday
    glosses:
      - { text: quiz nights, russian: "вечера викторин (в пабе)" }
      - { text: take things slowly, russian: "не торопить события" }
      - { text: signature dish, russian: "фирменное блюдо" }
