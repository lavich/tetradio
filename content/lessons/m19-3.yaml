blocks:
  - type: explanation
    id: plans
    title: Планы на выходные
    body: |-
      **Τι θα κάνεις το σαββατοκύριακο;** — «Что будешь делать на выходных?». Отвечают будущим временем: Θα πάω στο χωριό. Θα μείνω σπίτι και θα διαβάσω. Σχεδιάζουμε να πάμε στο Τρόοδος.

      **Η εξοχή** — загород, сельская местность: **στην εξοχή** — за городом. **Ο περίπατος** — прогулка, обычно пешком и подольше: **κάνω περίπατο** — «гуляю» (как κάνω βόλτα, модуль 05). **Ο κήπος** — сад, двор с садом: στον κήπο υπάρχουν **δέντρα** και **λουλούδια** (το δέντρο — дерево, το λουλούδι — цветок; мн. ч. τα δέντρα, τα λουλούδια).

      **Αν + будущее.** Αν — «если» (модуль 10). **Αν κάνει καλό καιρό, θα πάμε εκδρομή** — «Если будет хорошая погода, поедем за город». В части с αν θα **не ставится**, хотя по-русски мы говорим «если будет»: после αν — та же форма, что после να. Одно событие — форма от аориста: **Αν βρέξει**, θα μείνουμε σπίτι. У κάνω, έχω, είμαι форма одна: **αν κάνει** κρύο, **αν έχω** χρόνο, **αν είναι** ωραίος ο καιρός. А во второй части — обычное будущее с θα.

      **Ποια είναι η αγαπημένη σου εποχή;** — «Какое твоё любимое время года?». На «вы» — η αγαπημένη σας εποχή. Ответ: Η αγαπημένη μου εποχή είναι το φθινόπωρο.
    table:
      columns:
        - αν …
        - θα …
        - по-русски
      rows:
        - - Αν κάνει καλό καιρό,
          - θα πάμε εκδρομή.
          - Если будет хорошая погода, поедем за город.
        - - Αν βρέξει,
          - θα μείνουμε σπίτι.
          - Если пойдёт дождь, останемся дома.
        - - Αν έχω χρόνο,
          - θα έρθω κι εγώ.
          - Если будет время, я тоже приду.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: plans-gap
    title: За городом
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - εξοχή
      - περίπατο
      - κήπος
      - δέντρα
      - λουλούδια
      - βρέξει
      - βουνό
      - κρύο
    items:
      - id: g1
        prompt: Το σαββατοκύριακο θα πάμε στην ___, μακριά από την πόλη.
        answer: εξοχή
        explanation: Στην — женский род; η εξοχή.
      - id: g2
        prompt: Κάθε απόγευμα κάνω ___ στην παραλία.
        answer: περίπατο
        explanation: "Κάνω περίπατο — винительный: ο περίπατος → τον περίπατο."
      - id: g3
        prompt: Την άνοιξη ο ___ μας είναι πολύ ωραίος.
        answer: κήπος
      - id: g4
        prompt: Στο δάσος υπάρχουν πολλά ψηλά ___.
        answer: δέντρα
      - id: g5
        prompt: Η γιαγιά μου αγαπάει τα ___ και έχει πολλά στον κήπο της.
        answer: λουλούδια
      - id: g6
        prompt: Αν ___ αύριο, θα μείνουμε στο σπίτι.
        answer: βρέξει
        explanation: После αν — форма от аориста, без θα.
  - type: exercise
    id: if-future
    title: Αν и θα
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Αν ___ καλό καιρό, θα πάμε εκδρομή.
        options:
          - κάνει
          - θα κάνει
          - έκανε
        answer: κάνει
        explanation: В части с αν θα не ставится.
      - id: q2
        prompt: Αν βρέξει, ___ στο σπίτι.
        options:
          - θα μείνουμε
          - μείναμε
          - μείνουμε
        answer: θα μείνουμε
        explanation: Во второй части — обычное будущее с θα. Μείναμε — прошлое, а μείνουμε без θα или να само не употребляется.
      - id: q3
        prompt: Αν ___ χρόνο το Σάββατο, θα έρθω.
        options:
          - έχω
          - θα έχω
          - είχα
        answer: έχω
      - id: q4
        prompt: — Τι θα κάνεις το σαββατοκύριακο; — ___
        options:
          - Θα πάω στο χωριό με τους γονείς μου.
          - Πήγα στο χωριό με τους γονείς μου.
          - Πηγαίνω κάθε μέρα στη δουλειά.
        answer: Θα πάω στο χωριό με τους γονείς μου.
        explanation: Вопрос о будущем — ответ с θα. Πήγα — прошлое.
  - type: explanation
    id: summer-how
    title: Письмо другу о планах на лето
    body: |-
      Как в модуле 16, пишем **два текста** примерно по 80 слов: дружеское письмо на «ты» и официальное на «вы».

      План дружеского письма:

      1. Приветствие и вопрос о делах: Γεια σου, …! Τι κάνεις; Ευχαριστώ για το μήνυμά σου.
      2. Когда и куда вы поедете, с кем: Τον Αύγουστο θα πάμε…
      3. Какая там будет погода и почему вы выбрали это место: Εκεί ο καιρός είναι δροσερός…, γιατί στη Λευκωσία κάνει πολλή ζέστη.
      4. Что вы будете делать: одно событие — θα + форма от аориста (ένα Σάββατο θα πάμε…), повтор — θα + настоящее (κάθε πρωί θα κάνουμε περίπατο).
      5. Приглашение или вопрос другу и прощание: Θέλεις να έρθεις κι εσύ; Αν έρθεις, θα… Φιλιά!

      Проверьте себя: в будущем после θα — нет прошедших окончаний (θα πάμε, а не θα πήγαμε); в части с αν нет θα; тонос во всех словах из двух и больше слогов, второй тонос — в το μήνυμά σου.
  - type: writing
    id: summer-plans
    register: friendly
    prompt: "Ваша подруга Димитра из Салоник пишет: «Τι θα κάνεις το καλοκαίρι; Θα πας κάπου διακοπές;» (κάπου — «куда-нибудь».) Ответьте ей письмом около 80 слов: куда и когда вы поедете, с кем, какая там будет погода, что вы будете делать. Пригласите её или задайте вопрос."
    words:
      min: 70
      max: 100
    model: |-
      Γεια σου, Δήμητρα!

      Τι κάνεις; Ευχαριστώ για το μήνυμά σου. Τον Αύγουστο θα πάμε με τον άντρα μου στο Τρόοδος για δέκα μέρες, γιατί στη Λευκωσία κάνει πολλή ζέστη. Εκεί ο καιρός είναι δροσερός και τα βράδια κάνει λίγο κρύο. Θα μείνουμε σε ένα μικρό ξενοδοχείο με κήπο. Κάθε πρωί θα κάνουμε περίπατο στο δάσος και το απόγευμα θα διαβάζω στον κήπο. Ένα Σάββατο θα πάμε στην Πάφο, στη θάλασσα. Θέλεις να έρθεις κι εσύ; Αν έρθεις, θα κάνουμε μαζί μια εκδρομή!

      Φιλιά,
      Ελπίδα
    criteria:
      - Около 80 слов (70–100); дружеское приветствие и прощание, всё письмо на «ты»
      - Сказано, куда, когда и с кем вы поедете
      - Сказано, какая там погода (κάνει ζέστη / κρύο, ο καιρός είναι δροσερός…)
      - "Есть будущее обоих видов: одно событие (θα πάμε, θα μείνουμε) и повтор (κάθε πρωί θα κάνουμε…)"
      - Есть приглашение или вопрос подруге (Θέλεις να έρθεις;)
      - После θα нет прошедших окончаний; в части с αν нет θα; тонос во всех словах из двух и больше слогов
  - type: explanation
    id: formal-how
    title: Официальный запрос в гостиницу
    body: |-
      Второй текст — «менее дружеский»: вы пишете незнакомому человеку, всё письмо на «вы». План:

      1. Обращение: **Αγαπητέ κύριε Ιωάννου,** / **Αγαπητή κυρία…,** Если имени не знаете — Αγαπητέ κύριε / Αγαπητή κυρία,
      2. Зачем пишете: **Θα ήθελα πληροφορίες για…** (модуль 16).
      3. Ваши планы — будущим временем: Σχεδιάζουμε να έρθουμε…, Θα φτάσουμε την Παρασκευή το βράδυ και θα φύγουμε την Κυριακή.
      4. Два-три вопроса: Έχετε ένα δίκλινο δωμάτιο…; Πόσο κοστίζει…; Συνήθως χιονίζει τον Δεκέμβριο;
      5. Концовка: **Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας. Με εκτίμηση,** — и вымышленная подпись.

      Вопрос о погоде «вообще, обычно» — в настоящем времени: Συνήθως χιονίζει τον Δεκέμβριο; — «Обычно в декабре идёт снег?». О ваших планах — будущее.
  - type: writing
    id: hotel-inquiry
    register: formal
    prompt: Вы хотите провести зимние выходные в маленькой гостинице в горах Троодос. Напишите владельцу гостиницы, господину Иоанну, около 80 слов. Скажите, когда и с кем вы приедете и когда уедете, спросите о номере и цене и о погоде в это время (снег, прогулки в лесу). Попросите ответить.
    words:
      min: 70
      max: 100
    model: |-
      Αγαπητέ κύριε Ιωάννου,

      Θα ήθελα πληροφορίες για το ξενοδοχείο σας στο Τρόοδος. Σχεδιάζουμε να έρθουμε με τη γυναίκα μου το σαββατοκύριακο 12 και 13 Δεκεμβρίου. Θα φτάσουμε την Παρασκευή το βράδυ και θα φύγουμε την Κυριακή το απόγευμα. Θα έρθουμε με το αυτοκίνητο από τη Λευκωσία. Έχετε ένα δίκλινο δωμάτιο για δύο νύχτες; Πόσο κοστίζει με πρωινό; Συνήθως χιονίζει τον Δεκέμβριο; Μπορούμε να κάνουμε περίπατο στο δάσος, αν κάνει πολύ κρύο;

      Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

      Με εκτίμηση,
      Βίκτορ Σοκόλοφ
    criteria:
      - Около 80 слов (70–100); официальное обращение (Αγαπητέ κύριε…,) и концовка (Με εκτίμηση,)
      - Всё письмо на «вы» (έχετε, σας) — без форм на «ты»
      - Сказано, зачем вы пишете (Θα ήθελα πληροφορίες για…)
      - "Планы — будущим временем: θα φτάσουμε, θα φύγουμε, σχεδιάζουμε να έρθουμε"
      - Два-три вопроса (номер, цена, погода)
      - Есть просьба ответить (Περιμένω την απάντησή σας.)
      - "После θα и να — форма без приращения (θα φτάσουμε, а не θα φτάσαμε); второй тонос: την απάντησή σας"
  - type: explanation
    id: speaking-how
    title: Монолог — любимое время года
    body: |-
      Во второй части устного экзамена могут спросить: **Ποια είναι η αγαπημένη σας εποχή;** — «Какое ваше любимое время года?». Говорите около минуты.

      План из пяти шагов: какое время года вы любите; какая тогда погода (κάνει…, έχει…, βαθμοί); что вы обычно делаете в это время (настоящее время); какое время года вы не любите и почему (γιατί…); что вы будете делать в следующий раз (θα…).

      Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: fav-season
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Ποια είναι η αγαπημένη σας εποχή; Γιατί; Τι κάνετε τότε;» (τότε — «тогда».)
      Говорите около минуты по плану, запишите ответ.
    seconds: 90
    model: Η αγαπημένη μου εποχή είναι η άνοιξη. Στην Κύπρο η άνοιξη είναι πολύ ωραία. Δεν κάνει ακόμα πολλή ζέστη, έχει ήλιο και η θερμοκρασία είναι από είκοσι μέχρι είκοσι πέντε βαθμούς. Η φύση είναι πράσινη και έχει πολλά λουλούδια. Τα σαββατοκύριακα πηγαίνουμε με τους φίλους μας στην εξοχή και κάνουμε περίπατο στο δάσος. Το καλοκαίρι δεν μου αρέσει πολύ, γιατί κάνει πολλή ζέστη και δεν μπορώ να κοιμηθώ. Την επόμενη άνοιξη θα κάνουμε μια μεγάλη εκδρομή στο Τρόοδος με όλη την οικογένεια.
    criteria:
      - Говорили около минуты, без долгих пауз
      - Назвали любимое время года и объяснили почему (γιατί…)
      - "Описали погоду: κάνει ζέστη / κρύο, έχει ήλιο, βρέχει, βαθμοί"
      - Рассказали, что обычно делаете в это время (настоящее время)
      - "Сказали хотя бы одну фразу о будущем с θα: θα πάμε, θα κάνουμε"
      - "Ударение на своём месте (άνοιξη, καλοκαίρι, φθινόπωρο, θερμοκρασία); κ в καλοκαίρι перед αι [е] — мягкое, как русское «ке»: [калоке́ри]"
  - type: exercise
    id: review-future
    title: Повторение — будущее время
    instruction: Вставьте форму будущего. Два варианта лишние.
    format: gap
    bank:
      - θα κάνει
      - θα κολυμπάω
      - θα σου πω
      - θα δούμε
      - θα ξυπνάω
      - θα φορέσω
    items:
      - id: g1
        prompt: Αύριο ___ πολύ κρύο, πάρε το παλτό σου.
        answer: θα κάνει
      - id: g4
        prompt: Το καλοκαίρι ___ κάθε πρωί στην πισίνα.
        answer: θα κολυμπάω
        explanation: Κάθε πρωί — повтор, поэтому θα + настоящее время.
      - id: g5
        prompt: — Πού θα πας το καλοκαίρι; — Δεν ξέρω ακόμα, ___ αύριο.
        answer: θα σου πω
        explanation: Σου стоит между θα и глаголом.
      - id: g7
        prompt: Στο Τρόοδος, αν έχουμε χρόνο, ___ και τη λίμνη.
        answer: θα δούμε
        explanation: είδα → θα δω, θα δούμε — ударение на окончании.
