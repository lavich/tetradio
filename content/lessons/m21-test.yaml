title: Контрольная модуля 21
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации, в конце — повторение модулей 17–20. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Главное в грамматике — союзы (γιατί, επειδή, γι' αυτό, όταν, αν, αλλά), цель с για να и форма после να, αν и όταν.
  - type: reading
    id: lena
    title: Δεν μπορώ να έρθω
    text: |-
      Γεια σου, Μαρίνα!

      Ευχαριστώ πολύ για την πρόσκληση στο πάρτι σου το Σάββατο! Δυστυχώς όμως δεν μπορώ να έρθω, γιατί το Σάββατο φεύγω για την Αθήνα. Η κολλητή μου από το πανεπιστήμιο παντρεύεται και είμαι καλεσμένη στον γάμο της. Γυρίζω την Τρίτη το βράδυ.

      Λυπάμαι πολύ, γιατί ήθελα να γνωρίσω τους καινούργιους σου φίλους. Θέλεις να βρεθούμε την Πέμπτη για καφέ; Όταν γυρίσω, θα σου φέρω ένα μικρό δώρο από την Αθήνα. Αν δεν μπορείς την Πέμπτη, πες μου πότε είσαι ελεύθερη.

      Σου υπόσχομαι να έρθω στο επόμενο πάρτι!

      Φιλιά,
      Λένα
    glosses:
      - text: παντρεύεται
        russian: выходит замуж
      - text: γάμο
        russian: свадьба (вин. п.)
      - text: ήθελα να γνωρίσω
        russian: я хотела познакомиться с
  - type: exercise
    id: lena-tf
    about: lena
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Λένα δέχεται την πρόσκληση της Μαρίνας.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δυστυχώς όμως δεν μπορώ να έρθω.
      - id: q2
        prompt: Το Σάββατο η Λένα θα είναι στην Αθήνα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Η Λένα πάει στην Αθήνα για δουλειά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Она едет на свадьбу лучшей подруги.
      - id: q4
        prompt: Η Λένα γυρίζει την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Γυρίζω την Τρίτη το βράδυ.
      - id: q5
        prompt: Η Λένα προτείνει να βρεθούν την Πέμπτη.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Η Λένα θα φέρει ένα δώρο στη Μαρίνα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Θα σου φέρω ένα μικρό δώρο από την Αθήνα.
  - type: listening
    id: company
    title: Μια εκδήλωση της εταιρείας
    plays: 2
    transcript:
      - speaker: Κυρία Ανδρέου
        text: Καλημέρα, κύριε Φιλίππου. Την Παρασκευή η εταιρεία μας κλείνει είκοσι χρόνια και οργανώνουμε μια εκδήλωση στο ξενοδοχείο «Ακτή». Θα έρθετε;
      - speaker: Κύριος Φιλίππου
        text: Καλημέρα! Ευχαριστώ πολύ για την πρόσκληση. Τι ώρα αρχίζει;
      - speaker: Κυρία Ανδρέου
        text: Στις οκτώ το βράδυ. Θα έχουμε φαγητό και μουσική. Μπορείτε να έρθετε και με τη γυναίκα σας.
      - speaker: Κύριος Φιλίππου
        text: Δυστυχώς η γυναίκα μου δεν θα μπορέσει, γιατί την Παρασκευή είναι στη Λευκωσία για δουλειά. Εγώ όμως θα έρθω σίγουρα. Μάλλον θα αργήσω λίγο, επειδή έχω μια συνάντηση με έναν πελάτη στις επτά.
      - speaker: Κυρία Ανδρέου
        text: Δεν πειράζει. Παρακαλώ, στείλτε μου ένα μήνυμα μέχρι την Τετάρτη, για να κλείσουμε τα τραπέζια.
      - speaker: Κύριος Φιλίππου
        text: Εντάξει, θα σας στείλω σήμερα.
      - speaker: Κυρία Ανδρέου
        text: Και κάτι ακόμα. Θα έχουμε μια έκπληξη για τον διευθυντή, γι' αυτό μην του πείτε τίποτα!
      - speaker: Κύριος Φιλίππου
        text: Εντάξει, δεν θα πω τίποτα.
  - type: exercise
    id: company-choice
    about: company
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Почему компания устраивает мероприятие?
        options:
          - компании исполняется 20 лет
          - у директора день рождения
          - у компании новый клиент
        answer: компании исполняется 20 лет
        explanation: Η εταιρεία μας κλείνει είκοσι χρόνια.
      - id: q2
        prompt: Где будет мероприятие?
        options:
          - в гостинице
          - в офисе компании
          - в Никосии
        answer: в гостинице
        explanation: Στο ξενοδοχείο «Ακτή». В Никосии в пятницу будет жена г-на Филиппу.
      - id: q3
        prompt: Почему жена г-на Филиппу не придёт?
        options:
          - она будет в Никосии по работе
          - она больна
          - у неё встреча с клиентом
        answer: она будет в Никосии по работе
      - id: q4
        prompt: Почему г-н Филиппу, скорее всего, опоздает?
        options:
          - в семь у него встреча с клиентом
          - он едет из Никосии
          - он работает до восьми
        answer: в семь у него встреча с клиентом
        explanation: Επειδή έχω μια συνάντηση με έναν πελάτη στις επτά.
      - id: q5
        prompt: Что нужно сделать до среды?
        options:
          - отправить сообщение
          - купить подарок директору
          - заказать столик в гостинице
        answer: отправить сообщение
        explanation: Στείλτε μου ένα μήνυμα μέχρι την Τετάρτη. Столы закажет сама госпожа Андреу.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Πήγα στο φαρμακείο για να ___ ένα σιρόπι. (я)
        options:
          - πάρω
          - πήρα
          - πάρει
        answer: πάρω
        explanation: После για να — форма как после θέλω να (πάρω), даже если вся фраза о прошлом.
      - id: q2
        prompt: ___ ο Νίκος είναι άρρωστος, αναβάλλουμε το πάρτι.
        options:
          - Επειδή
          - Γι' αυτό
          - Αλλά
        answer: Επειδή
        explanation: Причина в начале фразы — επειδή.
      - id: q3
        prompt: Η Ελένη δουλεύει μέχρι αργά, ___ δεν έρχεται στη συναυλία.
        options:
          - γι' αυτό
          - γιατί
          - για να
        answer: γι' αυτό
        explanation: Сначала причина (работает допоздна), потом следствие — γι' αυτό.
      - id: q4
        prompt: Αν ___ νωρίς από τη δουλειά, θα περάσω να σε πάρω. (я)
        options:
          - φύγω
          - έφυγα
          - φύγει
        answer: φύγω
        explanation: После αν о будущем — форма как после να, лицо «я».
      - id: q5
        prompt: — ___ δεν ήρθες χθες; — Είχα πολλή δουλειά.
        options:
          - Γιατί
          - Επειδή
          - Πότε
        answer: Γιατί
        explanation: Вопрос «почему?» — только γιατί.
      - id: q6
        prompt: Θέλετε να ___ μαζί μας στην εκδήλωση; (вы)
        options:
          - έρθετε
          - έρθουμε
          - ήρθατε
        answer: έρθετε
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите глагол в нужной форме — одно слово.
    format: text
    items:
      - id: q1
        prompt: Σε παίρνω τηλέφωνο για να σε ___ στο πάρτι μου. (καλώ)
        answer:
          - καλέσω
      - id: q2
        prompt: Μπορούμε να ___ τη συνάντηση για την Πέμπτη; (αναβάλλω, εμείς)
        answer:
          - αναβάλουμε
        explanation: После να — одна λ.
      - id: q3
        prompt: Όταν ___ από τη δουλειά, θα σου τηλεφωνήσω. (γυρίζω, εγώ)
        answer:
          - γυρίσω
        explanation: О будущем после όταν — форма без θα, от основы аориста (γύρισα).
      - id: q4
        prompt: Χθες ο Νίκος ___ την πρόσκληση, γιατί ήταν απασχολημένος. (αρνούμαι, аорист)
        answer:
          - αρνήθηκε
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - η πρόσκληση
      - τα γενέθλια
      - το δώρο
      - η παρέα
      - η δικαιολογία
      - ο λόγος
      - η διάθεση
      - ο γνωστός
      - η γνωριμία
    items:
      - id: m1
        prompt: приглашение
        answer: η πρόσκληση
      - id: m2
        prompt: день рождения
        answer: τα γενέθλια
      - id: m3
        prompt: компания друзей
        answer: η παρέα
      - id: m4
        prompt: отговорка
        answer: η δικαιολογία
      - id: m5
        prompt: причина
        answer: ο λόγος
      - id: m6
        prompt: знакомый
        answer: ο γνωστός
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Друг приглашает вас в кино, но вечером вы работаете. Вежливо откажитесь.
        options:
          - Δυστυχώς δεν μπορώ, γιατί δουλεύω.
          - Ναι, ευχαρίστως!
          - Δεν έχω διάθεση.
        answer: Δυστυχώς δεν μπορώ, γιατί δουλεύω.
        explanation: Δεν έχω διάθεση — отказ без настоящей причины и не очень вежливый.
      - id: q3
        prompt: Вы хотите узнать, во сколько заехать за подругой.
        options:
          - Τι ώρα να περάσω να σε πάρω;
          - Τι ώρα είναι;
          - Τι ώρα ξυπνάς;
        answer: Τι ώρα να περάσω να σε πάρω;
      - id: q4
        prompt: Вас пригласили на вечеринку, и вы хотите поблагодарить.
        options:
          - Ευχαριστώ για την πρόσκληση!
          - Καλώς ήρθες!
          - Περαστικά!
        answer: Ευχαριστώ για την πρόσκληση!
  - type: exercise
    id: review
    graded: true
    title: Повторение — модули 17–20
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Η Λεμεσός είναι πιο μεγάλη από ___ Λάρνακα.
        options:
          - τη
          - η
          - της
        answer: τη
        explanation: После από — винительный падеж (модуль 20).
      - id: q2
        prompt: Αύριο ___ στη θάλασσα, αν κάνει καλό καιρό. (мы)
        options:
          - θα πάμε
          - πήγαμε
          - πήγατε
        answer: θα πάμε
        explanation: Αύριο — будущее с θα (модуль 19).
      - id: q3
        prompt: — Πού είναι τα κλειδιά; — ___ έχει η Μαρία.
        options:
          - Τα
          - Το
          - Τους
        answer: Τα
        explanation: Τα κλειδιά — средний род, мн. ч., поэтому τα (модуль 17).
      - id: q4
        prompt: ___ αργήσεις αύριο — η συνάντηση αρχίζει στις εννιά!
        options:
          - Μην
          - Δεν
          - Όχι
        answer: Μην
        explanation: Запрет — μην + форма как после να (модуль 18).
