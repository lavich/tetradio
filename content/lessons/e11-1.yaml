blocks:
  - type: explanation
    id: cond12
    title: First и second conditional — реальная возможность и воображаемая ситуация
    body: |-
      На собеседовании вопрос **What would you do if the release broke production?** предлагает воображаемую ситуацию. Для неё нужен second conditional: **if + past simple, would + базовая форма глагола.** Past simple здесь показывает, что ситуация воображаемая. **If the release broke production, I would roll it back first.**

      Когда вы говорите о реальной возможности и плане на неё, нужен first conditional: **if + present simple, will + базовая форма глагола.** **If I can't fix it quickly, I'll escalate it.** Часть с if называет условие, которое может наступить, главная часть — решение на этот случай.

      У глагола **be** в части с if после second conditional стоит **were** для всех лиц: **If I were in that position, I'd tell my manager straight away.** **If it were up to me, I'd wait a day.** Вместо **would** возможны **could** («смог бы») и **might** («возможно»): **If we had an alert, we could notice it earlier.**

      Части можно менять местами. Запятая нужна, когда часть с if стоит первой: **I would roll it back first if the release broke production.**
    table:
      columns:
        - тип
        - форма
        - пример
      rows:
        - - first conditional
          - if + present simple, will + базовая форма
          - If I can't fix it quickly, I'll escalate it.
        - - second conditional
          - if + past simple, would + базовая форма
          - If two deadlines clashed, I'd ask which one matters more.
        - - be в части с if
          - were для всех лиц
          - If I were in that position, I'd tell my manager.
        - - возможность
          - could или might вместо would
          - I might ask for a second opinion.
        - - вопрос интервьюера
          - What would you do if + past simple?
          - What would you do if the release broke production?
  - type: explanation
    id: unless-incase
    title: Unless, in case, as long as
    body: |-
      **Unless** значит «если не». Глагол после **unless** стоит в утвердительной форме: **Unless the fix is trivial, I wouldn't ship it on a Friday.** Это то же самое, что **If the fix isn't trivial, I wouldn't ship it on a Friday.** Отрицание в части с unless не добавляют.

      **In case** значит «на случай, если»: действие выполняется заранее, до того как что-то случилось. **I'd keep a backup plan in case something went wrong.** Резервный план нужен ещё до сбоя. Сравните с **if**: **If something went wrong, I'd use the backup plan** — план используют после сбоя.

      **As long as** значит «при условии, что»: **As long as the data is correct, I'd go ahead.** Действие допустимо, пока условие выполняется.

      После **unless**, **in case** и **as long as** будущее выражают формой настоящего времени (о ситуации в настоящем и будущем) или past simple (в воображаемой ситуации), без **will** и без **would** в этой же части.
    table:
      columns:
        - слово
        - смысл
        - пример
      rows:
        - - unless
          - если не
          - Unless the fix is trivial, I wouldn't ship it on a Friday.
        - - in case
          - на случай, если; действие заранее
          - I'd take a snapshot first, in case the rollback fails.
        - - as long as
          - при условии, что
          - As long as the data is correct, I'd go ahead.
        - - if
          - если; действие после события
          - If the rollback fails, I'd restore from the snapshot.
  - type: explanation
    id: cond-mistakes
    title: Типичные ошибки русскоговорящих
    body: |-
      **Would после if.** По-русски «бы» стоит в обеих частях: «Если бы релиз сломал продакшен, я бы откатил его». В английском **would** стоит только в главной части. Форма *If the release would break production* ошибочна: **If the release broke production, I would roll it back.**

      **Will после if, unless и in case.** *If I will see a problem, I will tell the team* и *in case something will go wrong* ошибочны: после этих слов стоит настоящее время. **If I see a problem, I will tell the team.** **In case something goes wrong…**

      **Отрицание после unless.** Форма *Unless the fix isn't trivial* содержит двойное отрицание и звучит неясно. Верно: **Unless the fix is trivial…**

      **In case вместо if.** Русское «в случае, если» подсказывает перевод *in case*, но **in case** описывает подготовку заранее. Для действия после события нужен **if**.
    table:
      columns:
        - ошибка
        - верно
        - правило
      rows:
        - - If the release would break production, I would roll it back.
          - If the release broke production, I would roll it back.
          - would стоит только в главной части
        - - If I will see a problem, I will tell the team.
          - If I see a problem, I will tell the team.
          - после if — настоящее время
        - - Unless the fix isn't trivial, I won't ship it.
          - Unless the fix is trivial, I won't ship it.
          - unless уже содержит отрицание
        - - I'll keep a backup in case something will go wrong.
          - I'll keep a backup in case something goes wrong.
          - после in case — настоящее время
  - type: explanation
    id: terms-words
    title: Слова урока о риске, решении и сбое
    body: |-
      Слова урока образуют три группы.

      **Риск и решение.** **A worst case** — наихудший вариант, **severity** — тяжесть последствий, **a gut feeling** — интуиция без обоснования. **Weigh up** — сопоставить варианты и риски, **come down to** — свестись к главному условию: **It comes down to how many users are affected.** **Feasible** — выполнимый при имеющихся сроках и ресурсах, **a decision-maker** — человек, который принимает решение, **escalate** — передать вопрос выше.

      **Действия при сбое.** **A contingency plan** — план на случай, если основной не сработает, он готовится заранее. **A kill switch** — выключатель, который отключает функцию за минуту. **Fix forward** — исправить сбой новым изменением вместо отката. **Rule out** — исключить версию причины. **Call off** — отменить запланированное, например релиз. **Firefighting** — работа над срочными проблемами вместо плановых задач.

      **Время и приоритеты.** **Park** — отложить вопрос, не обсуждая его сейчас. **Buy time** — выиграть время действием, которое откладывает проблему. **Fall through the cracks** — выпасть из поля зрения: о задаче, о которой никто не вспомнил. **A critical path** — цепочка зависимых задач, которая определяет срок.

      В ответе на «а если…» нужно показать порядок мысли: сначала масштаб, затем риск, затем решение и с кем оно согласовано.
