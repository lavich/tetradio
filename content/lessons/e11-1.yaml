    id: words
    title: Слова и фразы урока
  - type: exercise
    id: cond-choice
    title: First и second conditional
    instruction: Выберите вариант. Пояснение в скобках показывает смысл.
    format: choice
    items:
      - id: q1
        prompt: "If the release ___ production, I would roll it back first. (воображаемая ситуация)"
        options: [broke, has broken, would break]
        answer: broke
        explanation: В части с if после would стоит past simple.
      - id: q2
        prompt: "If the alert fires tonight, the on-call engineer ___ an incident. (реальная возможность)"
        options: [will open, opening, opened]
        answer: will open
        explanation: После if с настоящим временем в главной части стоит will; формы opening и opened здесь ошибочны.
      - id: q3
        prompt: "If I ___ the manager, I would tell the team straight away. (воображаемая ситуация)"
        options: [were, am, would be]
        answer: were
        explanation: После second conditional у глагола be стоит were для всех лиц.
      - id: q4
        prompt: "We ___ the release unless the fix passes the tests. (план)"
        options: [will not ship, would not shipped, did not ship]
        answer: will not ship
        explanation: Unless с настоящим временем соединяется с will в главной части.
      - id: q5
        prompt: "I would take a snapshot first ___ the rollback fails. (на всякий случай)"
        options: [in case, unless, as long as]
        answer: in case
        explanation: In case показывает подготовку заранее; unless и as long as по смыслу не подходят.
      - id: q6
        prompt: "I would go ahead ___ the data is correct. (при условии)"
        options: [as long as, in case, unless]
        answer: as long as
        explanation: As long as значит «при условии, что»; unless изменило бы смысл на обратный.
  - type: exercise
    id: forms-choice
    title: Какое предложение верно
    instruction: Выберите верное предложение.
    format: choice
    items:
      - id: q1
        prompt: Вы описываете воображаемую ситуацию.
        options:
          - If I would see a problem, I would tell the team.
          - If I saw a problem, I would tell the team.
          - If I saw a problem, I will tell the team.
        answer: If I saw a problem, I would tell the team.
        explanation: Second conditional — past simple в части с if и would в главной части.
      - id: q2
        prompt: Вы объясняете правило выпуска.
        options:
          - Unless the fix is trivial, I won't ship it.
          - Unless the fix isn't trivial, I won't ship it.
          - Unless the fix will be trivial, I won't ship it.
        answer: Unless the fix is trivial, I won't ship it.
        explanation: После unless стоит утвердительная форма настоящего времени.
      - id: q3
        prompt: Вы готовите запасной план.
        options:
          - I'll keep a backup in case something goes wrong.
          - I'll keep a backup in case something will go wrong.
          - I'll keep a backup in case of something goes wrong.
        answer: I'll keep a backup in case something goes wrong.
        explanation: После in case стоит настоящее время; will и of здесь лишние.
      - id: q4
        prompt: Вы отвечаете на вопрос интервьюера.
        options:
          - If I were in charge, I would wait a day.
          - If I would be in charge, I would wait a day.
          - If I will be in charge, I would wait a day.
        answer: If I were in charge, I would wait a day.
        explanation: В воображаемой ситуации у be стоит were; would остаётся в главной части.
      - id: q5
        prompt: Какой вопрос интервьюера построен верно?
        options:
          - What would you do if the release broke production?
          - What will you do if the release would break production?
          - What would you do if the release would break production?
        answer: What would you do if the release broke production?
        explanation: В вопросе would стоит один раз, а в части с if — past simple.
      - id: q6
        prompt: Вы называете условие, при котором продолжили бы работу.
        options:
          - As long as the data is correct, I'd go ahead.
          - As long as the data will be correct, I'd go ahead.
          - As long as the data would be correct, I'd go ahead.
        answer: As long as the data is correct, I'd go ahead.
        explanation: После as long as стоит настоящее время, без will и would.
  - type: exercise
    id: risk-match
    title: Риск и решение
    instruction: Соедините определение с английским словом или выражением. Два варианта лишние.
    format: match
    bank:
      - escalate
      - a contingency plan
      - a worst case
      - weigh up
      - come down to
      - severity
      - a gut feeling
      - feasible
      - a decision-maker
    items:
      - { id: m1, prompt: "наихудший вариант развития событий", answer: a worst case }
      - { id: m2, prompt: "запасной план на случай, если основной не сработает", answer: a contingency plan }
      - { id: m3, prompt: "передать вопрос руководителю или более опытному специалисту", answer: escalate }
      - { id: m4, prompt: "тяжесть последствий проблемы", answer: severity }
      - { id: m5, prompt: "интуитивное ощущение, которое не подкреплено доводами", answer: a gut feeling }
      - { id: m6, prompt: "человек, который принимает решение", answer: a decision-maker }
      - { id: m7, prompt: "осуществимый при имеющихся сроках и ресурсах", answer: feasible }
  - type: exercise
    id: action-gap
    title: Действия при сбое
    instruction: Вставьте слово или выражение. Один вариант лишний.
    format: gap
    bank:
      - a kill switch
      - fix forward
      - rule out
      - firefighting
      - call off
      - fall through the cracks
    items:
      - id: g1
        prompt: The new feature broke checkout, so we flipped ___ and turned it off for everyone within a minute. (аварийный выключатель)
        answer: a kill switch
      - id: g2
        prompt: Rolling back would take an hour, so the team chose to ___ and deployed a new change that repaired the bug. (исправить новым изменением)
        answer: fix forward
      - id: g3
        prompt: The error started after the deploy, but we needed to ___ a network problem before we blamed the code. (исключить)
        answer: rule out
      - id: g4
        prompt: Our team spent the whole week on ___ instead of planned work. (аврал)
        answer: firefighting
      - id: g5
        prompt: The risk was too high, so the manager decided to ___ the release. (отменить)
        answer: call off
  - type: exercise
    id: time-gap
    title: Время и приоритеты
    instruction: Вставьте слово или выражение. Один вариант лишний.
    format: gap
    bank:
      - park
      - buy time
      - fall through the cracks
      - a critical path
      - come down to
      - weigh up
      - escalate
    items:
      - id: g1
        prompt: We have ten minutes left, so let's ___ the naming discussion and come back to it next week. (отложить)
        answer: park
      - id: g2
        prompt: A quick workaround can ___ while the team prepares a proper fix. (выиграть время)
        answer: buy time
      - id: g3
        prompt: Without an owner, a small task can easily ___. (выпасть из поля зрения)
        answer: fall through the cracks
      - id: g4
        prompt: "This task has no slack: a delay here moves the whole date, so it is part of ___. (критический путь)"
        answer: a critical path
      - id: g5
        prompt: In the end, the decision will ___ how many users are affected. (свестись к)
        answer: come down to
      - id: g6
        prompt: Before choosing, the team will ___ the cost of each option against the risk. (взвесить)
        answer: weigh up
