  - type: speaking
    id: aloud
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Решайте вслух: повторите условие и разберите пример; назовите простое решение (для каждого слова посчитать повторы по списку) и его сложность словами; предложите хеш-таблицу (один проход); скажите, какое слово вернёт код при равенстве, и проверьте примером. Формулы произносите словами. 6 реплик, вся ваша часть — 3 минуты.
    seconds: 180
    model: |-
      Anders: Now a coding task. Given a list of words, return the word that appears most often. Please think out loud.
      You: Let me say the problem back in my own words. I get a list of words, and I need to return the most frequent one. Let me take a small example first: a, b, a returns a.
      Anders: Right. You can assume the list is not empty. What is your first idea?
      You: I'm going to start with a brute-force solution. For each word, I count how many times it appears in the whole list and keep the best one.
      Anders: OK. What is the time complexity of that?
      You: I think it runs in quadratic time, because for each word I go through the whole list. It uses constant extra memory.
      Anders: Could it be faster?
      You: I'd use a hash map. I go through the list once, count each word in the map and then pick the word with the highest count. That runs in linear time and uses linear extra memory.
      Anders: What happens if two words appear equally often?
      You: My code goes through the list in order and returns the first word with the highest count. Let me check with a, b, b, a: both appear twice, so it returns a.
      Anders: Thank you, that's clear.
      You: Thank you. In summary, it runs in linear time and uses linear extra memory. Does this approach make sense to you?
    criteria:
      - Ответили на все шесть реплик по порядку
      - "Условие своими словами и пример: Let me say the problem back…; Let me take a small example first"
      - "Простое решение, затем сложность словами: I'm going to start with a brute-force solution…; quadratic time"
      - "Улучшение с названной структурой: I'd use a hash map…; linear time"
      - "Крайний случай и итог: What happens if…; In summary…"
