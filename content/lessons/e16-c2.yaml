  - type: speaking
    id: offer
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia, вы прочитали письмо с оффером. Поблагодарите за предложение и попросите пройтись по опционам. Срок предупреждения два месяца, дата начала 5 апреля подходит. Попросите время до вечера вторника, чтобы прочитать контракт. В конце спросите, можно ли тратить бюджет на обучение на билеты на конференции, и попросите подтвердить письменно. Без давления и ссылок на другие предложения. 6 реплик, вся ваша часть — 2 минуты.
    seconds: 120
    model: |-
      Katarina: Hello Nadia, thanks for calling back. Did you have a chance to read the written offer?
      You: Yes, thank you. I'm very pleased to receive it, and I enjoyed meeting the team.
      Katarina: I'm glad to hear that. Is there anything you would like me to go through again?
      You: Yes. Could we go through the stock options together? I'd like to understand how the four years work.
      Katarina: Of course. The options vest in four equal parts, one at the end of each year. Does the start date, the fifth of April, work for you?
      You: That's clear, thank you. My notice period is two months, so the fifth of April works for me.
      Katarina: Good. The offer is open until next Wednesday at five. When would you like to give us your answer?
      You: Could I confirm my decision by Tuesday evening? I'd like to read the contract carefully.
      Katarina: That's fine. Is there anything else you'd like to ask?
      You: Yes. Could the learning budget also cover conference tickets? I'd be grateful if you could confirm that in writing.
      Katarina: Yes, conference tickets are covered, and I'll confirm it by email today. I look forward to your reply on Tuesday. Thank you for your time.
      You: Thank you, Katarina. I look forward to speaking again.
    criteria:
      - Ответили на все шесть реплик по порядку
      - "Благодарность за предложение: Thank you, I'm very pleased to receive it"
      - "Просьба пройтись по условиям: Could we go through… together?"
      - "Срок решения назван вежливо: Could I confirm my decision by…?"
      - "Просьба подтвердить письменно: I'd be grateful if you could confirm that in writing"
      - Нет давления и ссылок на другие предложения
  - type: explanation
    id: thanks-how
    title: Письмо после собеседования
    body: |-
      Напишите письмо нанимающему менеджеру на следующий день после собеседования: Письмо пишут на следующий день после собеседования, до оффера: **Dear Mr Karimi,** → благодарность за разговор → один запомнившийся момент (пилот вместо полного переписывания) → уточнение к своему ответу (**If I had had more time, I would have…**) → интерес к роли → вопрос о следующих шагах в косвенной форме (**Could you tell me what the next steps are?**) → **I look forward to hearing from you.** → **Kind regards,** и имя. Формальный стиль: полные формы, без сокращений и восклицаний.
  - type: writing
    id: thanks
    register: formal
    prompt: "Через день после собеседования напишите письмо Hassan Karimi (130–170 слов): благодарность за разговор в четверг, момент, который вам запомнился (пилот вместо полного переписывания сервиса), уточнение к ответу в техническом обсуждении (при большем времени вы добавили бы проверку на очень длинный список и можете прислать короткое решение), интерес к роли, вопрос о следующих шагах и сроке ответа, подпись — Nadia Volkova."
    words: { min: 130, max: 170 }
    model: |-
      Dear Mr Karimi,

      Thank you for the conversation on Thursday. I enjoyed learning more about the Payments Platform team, and I was glad to hear that the team prefers to make decisions together.

      One part of our discussion has stayed with me. You suggested starting with a small pilot instead of rewriting the whole payment service, and I think this is a sensible way to reduce the risk.

      I would also like to add one point to my answer in the technical discussion. If I had had more time, I would have added a test for a very long list. I have been thinking about it since then, and I can send you the short solution if you would like to see it.

      I remain very interested in the role. Could you tell me what the next steps are and when I can expect to hear from you?

      I look forward to hearing from you.

      Kind regards,
      Nadia Volkova
    criteria:
      - 130–170 слов, есть обращение, благодарность и подпись
      - Назван один момент разговора, который запомнился
      - "Уточнение к ответу с третьим условным: If I had had more time, I would have added…"
      - "Вопрос о следующих шагах в косвенной форме: Could you tell me what the next steps are…? (порядок слов как в утверждении)"
      - Формальный стиль без сокращений и разговорных слов
  - type: exercise
    id: grammar
    graded: true
    title: Язык ступени
    instruction: Вставьте слово или выражение. Три варианта лишние.
    format: gap
    bank: [had risen, had asked, had read, would roll, will escalate, told, whether, whose, which, have been preparing, that, who, said]
    items:
      - id: g1
        prompt: "By the time the on-call engineer saw the alert, the error rate ___ to twelve percent."
        answer: had risen
        explanation: "Событие раньше другого прошлого — past perfect: had risen (модули e09, e10)."
      - id: g2
        prompt: "If I ___ for a second review, we would have caught the error."
        answer: had asked
        explanation: "Нереальное прошлое — третий тип условных: If I had asked…, we would have caught (модуль e10)."
      - id: g3
        prompt: "I wish I ___ the logs more carefully."
        answer: had read
        explanation: "Сожаление о прошлом — wish + past perfect: I wish I had read (модуль e10)."
      - id: g4
        prompt: "If the release broke production, I ___ it back first."
        answer: would roll
        explanation: "Воображаемая ситуация — второй тип условных: If the release broke…, I would roll it back (модуль e11)."
      - id: g5
        prompt: "If I can't fix it quickly, I ___ it to my manager."
        answer: will escalate
        explanation: "Реальное условие — первый тип: If I can't fix it…, I will escalate it (модуль e11)."
      - id: g6
        prompt: "My manager ___ me that I was too quiet in meetings."
        answer: told
        explanation: "Глагол пересказа с адресатом — told me that…; said с адресатом без to не употребляется (модуль e12)."
      - id: g7
        prompt: "He asked me ___ I had tested the change."
        answer: whether
        explanation: "Вопрос да или нет в косвенной речи — whether (или if), порядок слов как в утверждении (модуль e12)."
      - id: g8
        prompt: "A user ___ account is locked cannot make a payment."
        answer: whose
        explanation: "Принадлежность — whose: a user whose account (модуль e13)."
      - id: g9
        prompt: "The payment service, ___ processes two million payments a day, is written in Python."
        answer: which
        explanation: "Уточнение о предмете между запятыми — which; that после запятой не ставят (модуль e13)."
      - id: g10
        prompt: "I ___ for this interview all week, so I feel ready."
        answer: have been preparing
        explanation: "Действие шло всю неделю и продолжается — present perfect continuous: have been preparing (модуль e16)."
