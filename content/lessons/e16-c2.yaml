      - { speaker: Ingrid, text: "In the second half, I'll ask a few questions that begin with 'what would you do if'. I'm interested in how you think, so there are no trick questions." }
      - { speaker: Ingrid, text: "Do you have any questions before we start? If not, let's begin." }
