  - type: reading
    id: invite
    title: "Final interviews at Tidewell Software"
    text: |-
      Subject: Final interviews at Tidewell Software

      Dear Nadia,

      Thank you for sending your solution to the take-home task. The team has reviewed it and would like to invite you to the final interviews, which will take place by video call on Thursday of next week.

      The day has four parts, all in Central European Time:

      10:00–10:30 · a conversation with me about you and your motivation
      10:45–11:30 · a behavioural interview with Ingrid Larsen, Head of Engineering
      12:00–13:00 · a technical discussion with Anders, a senior engineer, in a shared code editor
      13:30–14:00 · a final conversation with Hassan Karimi, the hiring manager, where you can ask your own questions

      Please prepare two examples from your work, one about a challenge and one about a mistake, and a few questions for the team. There is also a short case study attached; Ingrid may ask you about it.

      Could you confirm by Tuesday that the schedule works for you?

      Kind regards,
      Astrid Berg
      People team, Tidewell Software
    glosses:
      - { text: take-home task, russian: домашнее задание }
      - { text: reviewed, russian: просмотрела }
      - { text: a behavioural interview, russian: поведенческое интервью }
      - { text: a shared code editor, russian: общий редактор кода }
      - { text: case study, russian: разбор случая }
