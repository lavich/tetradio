  - type: speaking
    id: hypo
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Отвечайте условными предложениями и называйте, с кем согласуете решение. Ошибка перед релизом: сказать руководителю, оценить масштаб, малое исправление проверить, иначе перенести релиз. Продакт-менеджер настаивает: риск фактами, меньший релиз, решение инженерного менеджера. Два срока: что важнее, риск и срок, не решать в одиночку. Руководитель недоступен: безопасное действие и сообщение ему. Исправление в пятницу вечером: без крайней необходимости не выпускать, сначала снимок данных. 6 реплик, вся ваша часть — 2 минуты.
    seconds: 120
    model: |-
      Ingrid: Let's move on to some situations that could happen on the team. What would you do if you found a serious bug the day before a release?
      You: I'd tell my manager straight away and check how many users it would affect. If the fix were small, I'd make it and ask for a quick review. Otherwise, I'd suggest moving the release.
      Ingrid: And what if the product manager wanted to ship anyway?
      You: I'd explain the risk with facts, such as how many users it would affect, and suggest a smaller release. If we still disagreed, I'd ask the engineering manager to decide, and I'd support the decision.
      Ingrid: Now imagine two deadlines clashed in the same week. What would you do?
      You: I'd ask which one matters more and what happens if each one is late. I'd weigh the risk against the deadline and explain the trade-off to both teams. I wouldn't decide on my own.
      Ingrid: Suppose you had to decide something urgent and couldn't reach your manager. What would you do?
      You: I'd follow the runbook and take the safest action, for example, pause the release. Then I'd message my manager to say what I did and why.
      Ingrid: Would you ship a fix on a Friday afternoon?
      You: Unless the fix were trivial, I wouldn't. If I had to, I'd take a snapshot first, in case the rollback fails.
      Ingrid: Thank you. That gives me a clear picture of how you think.
      You: Thank you. I'm happy to go through another situation.
    criteria:
      - Ответили на все шесть реплик по порядку
      - "Условные предложения второго типа: If the fix were small, I'd make it…; I'd ask…"
      - "Первое действие и масштаб: I'd tell… straight away; check how many users it would affect"
      - "Риск и срок взвешены, решение согласовано: I wouldn't decide on my own; I'd ask the engineering manager to decide"
      - "Unless или in case в одном из ответов"
