title: Полное пробное собеседование
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как устроена контрольная точка
    body: |-
      Это контрольная точка второй ступени курса — модулей e09–e16, она же последняя в курсе. Один отклик на вакансию в Tidewell Software: от приглашения на финальные собеседования до ответа на оффер. Письма и голосовые сообщения, восемь сцен собеседования и письмо после него. Около 90 минут; перерыв удобнее делать между частями из таблицы. Выполняйте точку без словаря, таблиц и карточек. Новых карточек здесь нет, редкие слова в текстах подписаны.

      **Чтение и аудирование** проверяются автоматически. Для каждого навыка считается доля правильных ответов и сравнивается с порогом **60 %** — по нему курс считает навык сданным. Каждое аудио звучит два раза. В заданиях на аудирование открывайте текст кнопкой «Открыть текст» только после ответов, иначе результат ничего не покажет; реплики перед сценами открывайте после двух прослушиваний и держите перед глазами. В вопросах с выбором верен один вариант.

      **Сцены.** В каждой сначала звучат только реплики интервьюера, по порядку. Послушайте их два раза, откройте текст, затем запишите свою часть и отвечайте на каждую реплику по порядку. На вопросы о случае из работы отвечайте историей по схеме STAR. Ваша роль — Nadia Volkova: факты даны в каждом задании, можно говорить по ним или заменить своими. О коллегах и клиентах говорите без имён.

      **Письмо и речь** — самопроверка: в итог они не входят. Сначала напишите текст и запишите ответ сами, только потом откройте образец и отметьте, какие критерии выполнены. Если выполнено меньше 60 % критериев, считайте навык пока не сданным.

      **Навык ниже порога** — повод повторить модули, названные в пояснениях к ошибкам: чтение — e08–e11 и e16 (приглашение, кейс об инциденте, оффер), аудирование — e09–e14 и e16 (устройство раунда, постановка задачи, оффер), письмо — e13–e16, речь — сцены из e09–e16 и банк ответов третьих уроков. После повторения пройдите точку ещё раз.

      **Что дальше.** Если все навыки не ниже порога, программа пройдена. Материалы курса созданы и проверены моделями, без участия носителя: перед собеседованием в компании проведите пробное с носителем или преподавателем.
