  - type: speaking
    id: challenge
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Случай: в прошлом году партнёрский банк попросил запустить новый способ оплаты за шесть недель, а команда в это время исправляла надёжность сервиса карт. Задача: запустить способ оплаты и не ухудшить стабильность. Вы тимлид: спланировали работу, проверяли изменения, сами написали интеграцию с банком. Сначала выписали задачи и спросили, что важнее, две второстепенные функции отложили. Результат: запуск в срок, неудачных платежей на сорок процентов меньше. Вывод: поднимать конфликт целей сразу. 6 реплик, вся ваша часть — 2 минуты.
    seconds: 120
    model: |-
      Ingrid: Thanks for joining. Let's start with a situation from your work. Tell me about a time you faced a challenge.
      You: Last year, a partner bank asked us to launch a new payment method in six weeks. At the same time, we were fixing reliability problems in the card service, and nobody had time for both. My task was to deliver the launch without making the service less stable.
      Ingrid: Mm-hm. What was your role in it?
      You: I was the tech lead, so I planned the work and reviewed every change. I also wrote the integration with the bank myself.
      Ingrid: What did you do first?
      You: The first thing I did was list everything we had to do and ask which items mattered most. After that, I asked the product manager to help us prioritise, and we postponed two minor features.
      Ingrid: And what was the result? Do you have any numbers?
      You: We launched on schedule, and the number of failed payments dropped by forty percent.
      Ingrid: What did you learn from it?
      You: I learned to raise a conflict between goals early. Since then, I've asked for a priority decision as soon as two goals compete.
      Ingrid: Thank you. That's a clear example.
      You: Thank you. I have another example if that would help.
    criteria:
      - Ответили на все шесть реплик по порядку
      - "Ситуация и задача — past simple и past continuous: we were fixing…; My task was to…"
      - "Свой вклад и первые шаги: I was the tech lead…; The first thing I did was…"
      - Результат с числом
      - "Вывод с present perfect: Since then, I've asked…"
      - Без имён клиентов, внутренних цифр и оценок коллег
