  - type: speaking
    id: hr
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia Volkova, бэкенд-разработчик из Варшавы: шесть лет опыта, четыре из них в платёжной компании, с прошлой весны тимлид команды карт. Два месяца вы тестируете перенос платёжного сервиса на новую базу данных, запуск в следующем квартале. Почему Tidewell: публичные разборы инцидентов и сервис транзакций. Сильная сторона: разбиваете большие задачи на шаги (рискованный релиз разделили на пять небольших). Над чем работаете: делегирование. Вопросов о процессе нет. 6 реплик, вся ваша часть — 90–120 секунд.
    seconds: 120
    model: |-
      Astrid: Hello Nadia, this is Astrid from the People team. Thank you for joining. To start, could you tell me about yourself?
      You: Hello Astrid, thank you for having me. I'm a backend developer with six years of experience, four of them in payments. I've been the tech lead of the cards team since last spring, and I'm looking for a role with more responsibility for the architecture.
      Astrid: Thank you. And what have you been working on lately?
      You: I've been preparing the move of our payment service to a new database. We've been testing it for two months, and it goes live next quarter.
      Astrid: I see. Why Tidewell? What attracted you to the role?
      You: Two things. Your public postmortems show how the team learns from incidents, and I'd like to keep designing a service like the transaction service.
      Astrid: What would you say are your main strengths?
      You: My biggest strength is that I break problems down. Last year I split a risky release into five small ones, and we didn't roll back any of them.
      Astrid: And is there something you're working on improving?
      You: I'm working on delegating more. I used to take on too much, so now I ask a teammate to own each part, and we check in once a week.
      Astrid: Thank you, that's clear. Do you have any questions about the process?
      You: No, the letter was clear. Thank you.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - "О себе — настоящее и прошлое, срок через present perfect: I've been the tech lead since last spring"
      - "Причина выбора компании — конкретная, два довода: Your public postmortems…"
      - "Сильная сторона с примером и слабая сторона с тем, что вы делаете: I'm working on delegating more"
      - Вежливо и спокойно, без долгих пауз
