  - type: speaking
    id: req
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Задача: сервис статуса платежей. Задайте вопросы по порядку: пользователи и число запросов; насколько свежим должен быть статус; что делать при сбое; на какую нагрузку проектировать и входят ли возвраты. После пятой реплики подтвердите требования. Реплики Anders отвечают на вопросы в том же порядке. 6 реплик, вся ваша часть — 2–3 минуты.
    seconds: 150
    model: |-
      Anders: Let's try a design task. Design a service that shows customers the status of their payments in the app. Before you start, what would you like to know?
      You: Thank you. Who are the people that will use this service, and how many requests do we expect?
      Anders: The users are customers of online shops. We expect about two hundred thousand requests a day, and about two hundred a second at peak.
      You: How fresh should the status be? Is it okay if the data is slightly out of date?
      Anders: A status that is a few seconds old is fine, but not more than one minute.
      You: What should happen when the service is down?
      Anders: The app shows the last known status and a short message. Anything else?
      You: Should I design for the current load or for growth? And are refunds in scope?
      Anders: Design for twice the current load. Refunds are out of scope for the first version.
      You: Let me confirm that I've understood the requirements. The service shows payment status to customers, handles about two hundred requests a second at peak, accepts data that is up to one minute old, and shows the last known status when it is down.
      Anders: That's right. Please start with the simplest design, which we can improve later.
      You: Thank you. I'll start with the simplest version.
    criteria:
      - Ответили на все шесть реплик по порядку
      - "Вопросы о пользователях и нагрузке: Who are the people that will use this service…? How many requests…?"
      - "Вопросы о свежести данных, сбое и границах: How fresh…? What should happen when…? Are refunds in scope?"
      - "Итог требований перед началом: Let me confirm that I've understood the requirements"
