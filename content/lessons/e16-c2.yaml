  - type: speaking
    id: mistake
    part: roleplay
    prompt: |-
      Прослушайте реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      Вы — Nadia. Ошибка: год назад вы запустили миграцию базы данных, не проверив её на копии рабочих данных; таблица платежей была заблокирована десять минут, платежи шли медленно пятнадцать. Оповещение о медленных платежах сработало через две минуты. Ответственность ваша: вы сообщили команде и откатили изменение. Теперь миграции проверяют на копии и просматривают вдвоём. Фидбек: двое коллег на 360-оценке сказали, что ваши комментарии в код-ревью иногда слишком короткие. Сначала вы защищались, потом попросили пример и приняли замечание; теперь к комментарию пишете причину и ссылку. 6 реплик, вся ваша часть — 2 минуты.
    seconds: 120
    model: |-
      Ingrid: Now a different kind of question. Tell me about a mistake you made.
      You: A year ago, I ran a database migration without testing it on a copy of the production data. It locked the payments table for ten minutes, and payments were slow for fifteen. It was my mistake, and I take full responsibility.
      Ingrid: How did you find out about it?
      You: An alert about slow payments fired within two minutes. I informed the team straight away and rolled the change back.
      Ingrid: What would you do differently?
      You: If I had tested it on a copy first, I would have noticed the problem. I should have asked for a second review, too. Now every migration is tested on a copy and reviewed by a colleague.
      Ingrid: Thank you. And tell me about feedback you received that changed how you work.
      You: In a 360 review, two colleagues told me that my comments in code reviews were sometimes too short, and the authors didn't understand the reason.
      Ingrid: How did you react at first?
      You: At first I was a little defensive, but I asked for an example and took it on board. Since then, I explain the reason behind each comment and add a link to the documentation.
      Ingrid: Thanks, that's helpful.
      You: Thank you. It taught me to slow down when I'm under pressure.
    criteria:
      - Ответили на все шесть реплик по порядку
      - Ошибка названа прямо, своя доля ясна, коллеги не обвиняются
      - "Вывод и изменение практики: If I had tested it…, I would have noticed…; I should have asked…"
      - "Фидбек в косвенной речи: two colleagues told me that my comments were…"
      - Реакция и что изменилось после неё
  - type: reading
    id: case
    title: "Case study: the invoice release"
    text: |-
      Case study: the invoice release
      An example from Tidewell's interview pack. The company and the numbers are invented.

      On Friday at 15:00, the team released a new version of the invoice service. By 15:20, the error rate had risen from 0.5 to 12 percent, and about 2,000 customers could not download their invoices.

      The on-call engineer saw the alert at 15:25 and checked the logs. The release had renamed a column in the database, but the old code on two of the six servers still used the old name.

      A rollback was possible, but it would also have removed a security fix that was part of the same release. A small fix to the code would take about an hour. The engineering manager was on a flight and would land at 18:00.

      The engineer paused the release on the other servers, told the support team what to say to customers and wrote the fix. The invoices worked again at 16:30. On Monday, the team wrote a postmortem.

      Questions for discussion: What would you do first? Whom would you inform? Would you roll back or fix forward?
