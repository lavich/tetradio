  - type: explanation
    id: formal-how
    title: Письмо управляющему домом
    body: |-
      Задание B экзамена — официальный текст 80–100 слов. Сегодня это письмо управляющему: в доме две проблемы, и вы просите их решить.

      План:

      1. Обращение: **Αγαπητέ κύριε Μιχαηλίδη,** (фамилия на -ης в обращении — без -ς).
      2. Зачем пишете и кто вы: **Σας γράφω για** δύο προβλήματα στην πολυκατοικία. Μένω στο διαμέρισμα 7.
      3. Первая проблема и почему она важна: Ο ανελκυστήρας δεν λειτουργεί από… — с аористом и настоящим.
      4. Вторая проблема: Επίσης, … Ο θόρυβος μας ενοχλεί, γιατί…
      5. Просьба и вопрос: **Μπορείτε, σας παρακαλώ, να…;** Πότε θα…; Θα ήθελα να μάθω πόσα είναι τα κοινόχρηστα…
      6. Концовка: **Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας. Με εκτίμηση,** — и вымышленное имя.

      Полезно: **δυνατός** — громкий (δυνατή μουσική), **ο τεχνικός** — мастер, **Τέλος,** — «наконец» (последний пункт). Всё письмо — на «вы»: μπορείτε, σας. Жалуйтесь вежливо: факты и просьба, без упрёков.
  - type: writing
    id: manager-letter
    register: formal
    prompt: "Вы живёте в доме «Λεμονιά», квартира 7. Напишите письмо управляющему, господину Михаилидису (κύριος Μιχαηλίδης), 80–100 слов. Сообщите о двух проблемах: лифт до сих пор не работает, а поздно вечером из квартиры 5 слышна громкая музыка. Объясните, почему это вам мешает. Спросите, когда починят лифт и сколько в этом месяце общие расходы. Попросите ответить."
    words:
      min: 80
      max: 100
    model: |-
      Αγαπητέ κύριε Μιχαηλίδη,

      Σας γράφω για δύο προβλήματα στην πολυκατοικία. Μένω στο διαμέρισμα 7, στον τρίτο όροφο. Ο ανελκυστήρας δεν λειτουργεί από την περασμένη Δευτέρα. Η μητέρα μου είναι εβδομήντα χρονών και δεν μπορεί να ανεβαίνει τις σκάλες κάθε μέρα. Πότε θα έρθει ο τεχνικός; Επίσης, κάθε βράδυ μετά τις έντεκα ακούμε δυνατή μουσική από το διαμέρισμα 5. Ο θόρυβος μας ενοχλεί πολύ, γιατί ξυπνάμε νωρίς για τη δουλειά. Μπορείτε, σας παρακαλώ, να μιλήσετε με τους ενοίκους; Τέλος, θα ήθελα να μάθω πόσα είναι τα κοινόχρηστα αυτόν τον μήνα.

      Σας ευχαριστώ εκ των προτέρων.

      Με εκτίμηση,
      Ελένη Παύλου
    criteria:
      - 80–100 слов; официальное обращение (Αγαπητέ κύριε Μιχαηλίδη,) и концовка (Με εκτίμηση,)
      - Всё письмо на «вы» (μπορείτε, σας) — без форм на «ты»
      - Сказано, зачем вы пишете и где живёте (Σας γράφω για…, Μένω στο διαμέρισμα…)
      - Обе проблемы названы и объяснено, почему они мешают (γιατί…)
      - Есть вежливая просьба (Μπορείτε, σας παρακαλώ, να…;) и два вопроса — о лифте и о κοινόχρηστα
      - "Времена на месте: с тех пор, как сломалось, — δεν λειτουργεί από…; будущее — θα έρθει; после να — μιλήσετε"
      - "Падежи: στον διαχειριστή, τους ενοίκους (вин. п. мн. ч. с ударением на -οί-), τα κοινόχρηστα — мн. ч. (πόσα είναι)"
  - type: explanation
    id: interview-how
    title: Часть A — вопросы о себе
    body: |-
      В первой части устного экзамена экзаменатор задаёт простые вопросы о вас. Одна из частых тем — где вы живёте. Отвечайте не одним словом, а двумя-четырьмя предложениями: где, какой дом, с кем, что есть рядом, что нравится и что нет.

      Полезно: **ήσυχος** — тихий (μια ήσυχη περιοχή), **με τα πόδια** — пешком (модуль 12), **εδώ και δύο χρόνια** — уже два года (модуль 16).
  - type: speaking
    id: where-i-live
    part: interview
    prompt: |-
      Экзаменатор спрашивает: «Πού μένετε; Σε σπίτι ή σε διαμέρισμα; Πώς είναι η περιοχή σας; Τι σας αρέσει εκεί και τι δεν σας αρέσει;»
      Ответьте на все вопросы по порядку, около минуты. Запишите ответ.
    seconds: 90
    model: Μένω στη Λεμεσό, σε ένα διαμέρισμα σε μια πολυκατοικία κοντά στη θάλασσα. Το διαμέρισμά μας έχει δύο υπνοδωμάτια και ένα μικρό μπαλκόνι. Μένω εκεί με τον άντρα μου εδώ και δύο χρόνια. Η περιοχή είναι ήσυχη και έχει ένα σούπερ μάρκετ, ένα φαρμακείο και ένα πάρκο. Μου αρέσει, γιατί πηγαίνω στη δουλειά με τα πόδια. Δεν μου αρέσει ο θόρυβος από τον δρόμο το καλοκαίρι. Του χρόνου θέλουμε να νοικιάσουμε ένα πιο μεγάλο σπίτι.
    criteria:
      - Ответили на все четыре вопроса по порядку, полными предложениями
      - Сказали, в каком доме живёте и с кем (σε διαμέρισμα / σε σπίτι, με…)
      - Назвали, что есть рядом (υπάρχει / έχει…)
      - Сказали, что нравится и что нет, и почему (γιατί…)
      - Хотя бы одна фраза о будущем или о планах (θα…, θέλουμε να…)
      - "Второй тонос и ударение: το διαμέρισμά μας, πολυκατοικία, περιοχή"
