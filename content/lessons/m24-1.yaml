blocks:
  - type: explanation
    id: intro
    title: Последний модуль — повторение в деле
    body: |-
      Это последний модуль курса. Новой грамматики в нём нет: всё, что вы прошли, теперь работает вместе — как на экзамене и как в жизни на Кипре. Прочитать объявление в подъезде, позвонить в муниципалитет, написать управляющему домом, поговорить с соседом.

      Главный вопрос в каждом задании — какую форму глагола выбрать. Смотрите на всё предложение: когда это происходит, один раз или регулярно, и какое слово стоит перед глаголом.

      Глаголы модуля:

      - **πετάω** — выбрасывать: πέταξα, θα πετάξω, прошедшее длительное πετούσα. Второе значение — «летать».
      - **ενοχλώ** — мешать, беспокоить; спрягается как προτιμώ: ενοχλώ, ενοχλείς, ενοχλεί, ενοχλούμε, ενοχλείτε, ενοχλούν. Аорист ενόχλησα, будущее θα ενοχλήσω. **Σας ενοχλεί ο θόρυβος;** — Вам мешает шум?
      - **απαγορεύω** — запрещать: απαγόρευσα, θα απαγορεύσω. На табличках — **απαγορεύεται** «запрещается».
      - **μαζεύω** — собирать; о мусоре — «вывозить»: μάζεψα, θα μαζέψω. **Πότε μαζεύουν τα σκουπίδια;** — Когда вывозят мусор? (μαζεύουν — «они», как русское «вывозят» без подлежащего.)
    table:
      columns:
        - что в предложении
        - какая форма
        - пример
      rows:
        - - обычно, κάθε Δευτέρα, сейчас
          - настоящее
          - Κάθε Δευτέρα μαζεύουν τα σκουπίδια.
        - - χθες, πέρσι, την περασμένη εβδομάδα — один раз
          - аорист
          - Χθες πέταξα τα σκουπίδια στον κάδο.
        - - όταν ήμουν παιδί, παλιά — повторялось или длилось
          - παρατατικός
          - Παλιά πετούσαμε όλα τα σκουπίδια στον ίδιο κάδο.
        - - αύριο, του χρόνου
          - θα + форма от аориста
          - Αύριο θα πληρώσω τα κοινόχρηστα.
        - - θέλω να, πρέπει να, μπορώ να — один раз
          - να + форма от аориста
          - Πρέπει να τηλεφωνήσω στον διαχειριστή.
        - - πρέπει να… κάθε μήνα — регулярно
          - να + настоящее
          - Πρέπει να πληρώνουμε τα κοινόχρηστα κάθε μήνα.
        - - запрет
          - μην + форма, как после να
          - Μην πετάτε σκουπίδια στον δρόμο!
  - type: explanation
    id: notices
    title: Язык объявлений и табличек
    body: |-
      **Απαγορεύεται** — «запрещается». На табличках после него чаще всего стоит существительное с артиклем в именительном падеже: **Απαγορεύεται το κάπνισμα.** — Курить запрещено (το κάπνισμα — курение, от καπνίζω). **Απαγορεύεται η στάθμευση.** — Стоянка запрещена. Бывает и να + глагол: Απαγορεύεται να πετάτε σκουπίδια εδώ.

      **Ανακοίνωση προς τους ενοίκους** — «Объявление для жильцов»: так начинается объявление в подъезде. **Ο ένοικος** — жилец (мн. ч. οι ένοικοι, вин. п. τους ενοίκους), **προς** — «к, для» (официальный стиль). В **πολυκατοικία** — многоквартирном доме — есть **διαχειριστής**, управляющий. Он собирает **τα κοινόχρηστα** — общие расходы на дом: свет на лестнице, уборку, лифт. Спросить о них: **Πόσα είναι τα κοινόχρηστα;** — «Сколько составляют общие расходы?» (κοινόχρηστα — всегда мн. ч., поэтому πόσα). Лифт в объявлении — **ο ανελκυστήρας** (в разговоре το ασανσέρ, модуль 14): **Ο ανελκυστήρας δεν λειτουργεί.** Λειτουργεί — «работает» о механизме, официально; в разговоре говорят δεν δουλεύει.

      **Ο κανονισμός** — правила дома; **το πρόστιμο** — штраф: πληρώνω πρόστιμο.

      Город обслуживает **ο δήμος** — муниципалитет. В нём есть служба чистоты — **η υπηρεσία καθαριότητας** (υπηρεσία — служба; **η καθαριότητα** — чистота, уборка). Она вывозит **τα σκουπίδια** (обычно мн. ч.) и занимается **ανακύκλωση** — раздельным сбором: бумага, пластик и стекло идут в **κάδο ανακύκλωσης**. Ο κάδος — бак. Вопросы: **Πού είναι ο κάδος ανακύκλωσης;** **Ποιο είναι το τηλέφωνο του δήμου;**

      Проблемы в доме: **η βλάβη** — поломка, авария; **η διακοπή** — отключение: διακοπή νερού, διακοπή ρεύματος (το ρεύμα — электричество). Не путайте с **οι διακοπές** — отпуск (модуль 14): это то же слово во мн. ч., различайте по смыслу. **Ο θόρυβος** — шум: Ο θόρυβος με ενοχλεί.

      В объявлениях много родительного падежа (модули 10 и 12) — «чей, чего»: το τηλέφωνο του δήμου, η διακοπή του νερού, ο κανονισμός της πολυκατοικίας.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Απαγορεύεται το κάπνισμα.
          - Курить запрещено.
        - - Απαγορεύεται η στάθμευση.
          - Стоянка запрещена.
        - - Ο ανελκυστήρας δεν λειτουργεί.
          - Лифт не работает.
        - - διακοπή νερού / ρεύματος
          - отключение воды / электричества
        - - Πότε μαζεύουν τα σκουπίδια;
          - Когда вывозят мусор?
        - - Πόσα είναι τα κοινόχρηστα;
          - Сколько составляют общие расходы?
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: words-gap
    title: Дом и службы
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - σκουπίδια
      - κάδο
      - ανακύκλωση
      - κοινόχρηστα
      - διαχειριστή
      - θόρυβος
      - βλάβη
      - πρόστιμο
      - κανονισμό
    items:
      - id: g1
        prompt: Το βράδυ βγάζω τα ___ έξω, γιατί το πρωί περνάει το αυτοκίνητο του δήμου.
        answer: σκουπίδια
      - id: g2
        prompt: Τα άδεια μπουκάλια τα πετάμε στον ___ ανακύκλωσης. (άδεια — пустые)
        answer: κάδο
        explanation: "Στον — вин. п. мужского рода: ο κάδος → στον κάδο."
      - id: g3
        prompt: "Κάθε μήνα πληρώνουμε 30 ευρώ για τα ___: για τον ανελκυστήρα, το φως και την καθαριότητα. (το φως — свет)"
        answer: κοινόχρηστα
      - id: g4
        prompt: Ο ανελκυστήρας δεν λειτουργεί. Πρέπει να τηλεφωνήσουμε στον ___ της πολυκατοικίας.
        answer: διαχειριστή
        explanation: "Ο διαχειριστής → στον διαχειριστή (вин. п. без -ς)."
      - id: g5
        prompt: Ο ___ από τον δρόμο με ενοχλεί πολύ το βράδυ.
        answer: θόρυβος
      - id: g6
        prompt: Δεν έχουμε νερό από το πρωί. Ο διαχειριστής λέει ότι υπάρχει μια ___ στον δρόμο.
        answer: βλάβη
      - id: g7
        prompt: Αν αφήσετε το αυτοκίνητο μπροστά στην είσοδο, θα πληρώσετε ___. (η είσοδος — вход, подъезд)
        answer: πρόστιμο
  - type: explanation
    id: read-how
    title: Как читать объявление
    body: |-
      Управляющий повесил в подъезде объявление из пяти пунктов. На экзамене такой текст дают с заданием «верно/неверно». Сначала поймите, о чём каждый пункт: вода, лифт, мусор, деньги, правила. Потом читайте утверждения и ищите в тексте точное место — день, время, число.

      Ловушки обычно в деталях: «весь день» или «с 9 до 13», «перед домом» или «за домом», два раза в неделю или три. Незнакомые слова переведены под текстом.
  - type: reading
    id: notice
    title: Ανακοίνωση προς τους ενοίκους
    text: |-
      Πολυκατοικία «Λεμονιά»

      Ανακοίνωση προς τους ενοίκους

      Αγαπητοί ένοικοι,

      1. Την Πέμπτη, από τις 9:00 μέχρι τις 13:00, θα έχουμε διακοπή νερού, γιατί θα διορθώσουν μια βλάβη στον δρόμο.

      2. Ο ανελκυστήρας δεν λειτουργεί από χθες. Ο τεχνικός θα έρθει τη Δευτέρα. Μέχρι τότε, παρακαλώ, χρησιμοποιείτε τις σκάλες.

      3. Τα σκουπίδια τα μαζεύουν κάθε Δευτέρα και Πέμπτη το πρωί. Παρακαλώ, μην αφήνετε σακούλες έξω από τους κάδους. Χαρτί, πλαστικό και μπουκάλια πηγαίνουν στους μπλε κάδους ανακύκλωσης πίσω από την πολυκατοικία.

      4. Τα κοινόχρηστα του Νοεμβρίου είναι 35 ευρώ για κάθε διαμέρισμα. Μπορείτε να τα πληρώσετε σε μένα μέχρι τις 10 του μήνα.

      5. Σύμφωνα με τον κανονισμό της πολυκατοικίας, απαγορεύεται το κάπνισμα στις σκάλες και στον ανελκυστήρα. Επίσης, απαγορεύεται η στάθμευση μπροστά στην είσοδο.

      Ευχαριστώ για τη συνεργασία.
      Ο διαχειριστής,
      Σάββας Μιχαηλίδης
    glosses:
      - text: «Λεμονιά»
        russian: «Лимонное дерево» — название дома
      - text: θα διορθώσουν
        russian: будут чинить (διορθώνω — чинить, исправлять)
      - text: Ο τεχνικός
        russian: техник, мастер
      - text: Μέχρι τότε
        russian: до тех пор
      - text: χρησιμοποιείτε
        russian: пользуйтесь (χρησιμοποιώ)
      - text: τις σκάλες
        russian: лестница (η σκάλα)
      - text: Χαρτί, πλαστικό
        russian: бумага, пластик
      - text: σε μένα
        russian: мне
      - text: Σύμφωνα με
        russian: согласно
      - text: την είσοδο
        russian: вход, подъезд (η είσοδος)
      - text: τη συνεργασία
        russian: сотрудничество, понимание
  - type: exercise
    id: notice-tf
    about: notice
    title: Верно или неверно
    instruction: Прочитайте объявление. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Την Πέμπτη στις δέκα το πρωί δεν θα έχει νερό στην πολυκατοικία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Διακοπή νερού — από τις 9:00 μέχρι τις 13:00.
      - id: q2
        prompt: Η διακοπή νερού είναι για όλη τη μέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Только с 9 до 13.
      - id: q3
        prompt: Ο τεχνικός για τον ανελκυστήρα θα έρθει τη Δευτέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Τα σκουπίδια τα μαζεύουν τρεις φορές την εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κάθε Δευτέρα και Πέμπτη — два раза.
      - id: q5
        prompt: Οι κάδοι ανακύκλωσης είναι μπροστά στην είσοδο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πίσω από την πολυκατοικία — за домом.
      - id: q6
        prompt: Τον Νοέμβριο κάθε διαμέρισμα πληρώνει 35 ευρώ κοινόχρηστα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Οι ένοικοι μπορούν να αφήνουν το αυτοκίνητο μπροστά στην είσοδο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Απαγορεύεται η στάθμευση μπροστά στην είσοδο.
  - type: explanation
    id: cases
    title: Падежи и местоимения — коротко
    body: |-
      В бытовых текстах падеж подсказывает, кто что делает. После предлогов σε, από, για, με, μέχρι — винительный: στον διαχειριστή, από τον δρόμο, για τα κοινόχρηστα.

      Слабые местоимения (модуль 17) стоят перед глаголом, а после повелительного — после него: **Τα σκουπίδια τα μαζεύουν την Πέμπτη.** **Μου τηλεφώνησε ο διαχειριστής.** Πάρε με τηλέφωνο!
    table:
      columns:
        - падеж
        - когда
        - пример
      rows:
        - - именительный
          - кто делает; на табличках после απαγορεύεται
          - Ο θόρυβος με ενοχλεί. Απαγορεύεται η στάθμευση.
        - - винительный
          - что или кого; после предлогов
          - Πληρώνω τα κοινόχρηστα στον διαχειριστή.
        - - родительный
          - чей, чего
          - το τηλέφωνο του δήμου, ο κανονισμός της πολυκατοικίας
        - - слабое местоимение — «его, её, их»
          - τον, την, το, τους, τις, τα
          - — Πού είναι ο καναπές; — Τον πέταξα.
        - - слабое местоимение — «мне, тебе, ему…»
          - μου, σου, του, της, μας, σας, τους
          - Σας ενοχλεί η μουσική;
  - type: exercise
    id: mixed-choice
    title: Повторение грамматики
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Χθες ___ τα σκουπίδια στον κάδο.
        options:
          - πέταξα
          - θα πετάξω
          - πετάω
        answer: πέταξα
        explanation: Χθες — одно законченное действие в прошлом, аорист.
      - id: q2
        prompt: Πρέπει να ___ τα κοινόχρηστα μέχρι τις 10 του μήνα.
        options:
          - πληρώσετε
          - πληρώσατε
          - πληρώνατε
        answer: πληρώσετε
        explanation: После πρέπει να — форма от основы аориста с окончаниями настоящего; πληρώσατε и πληρώνατε — прошедшие формы, здесь они не подходят.
      - id: q3
        prompt: Συγγνώμη, σας ___ ο θόρυβος;
        options:
          - ενοχλεί
          - ενοχλούν
          - ενοχλώ
        answer: ενοχλεί
        explanation: Подлежащее — ο θόρυβος (он), поэтому ενοχλεί. Σας — «вам», дополнение.
      - id: q4
        prompt: — Πού είναι τα σκουπίδια; — ___ πέταξα στον κάδο.
        options:
          - Τα
          - Τις
          - Τους
        answer: Τα
        explanation: Τα σκουπίδια — средний род мн. ч., местоимение τα.
      - id: q5
        prompt: Έστειλα ένα μήνυμα ___ διαχειριστή για τη βλάβη.
        options:
          - στον
          - ο
          - τον
        answer: στον
        explanation: Στέλνω κάτι σε κάποιον — «кому» выражаем через σε + вин. п.
      - id: q6
        prompt: Ποιο είναι το τηλέφωνο ___;
        options:
          - του δήμου
          - ο δήμος
          - τον δήμο
        answer: του δήμου
        explanation: «Телефон чего/чей» — родительный падеж.
      - id: q7
        prompt: Όταν έμενα στη Μόσχα, ___ όλα τα σκουπίδια σε έναν μεγάλο κάδο στην αυλή. (η αυλή — двор)
        options:
          - πετούσαμε
          - θα πετάξουμε
          - πετάμε
        answer: πετούσαμε
        explanation: Όταν έμενα… — то, что повторялось в прошлом, παρατατικός.
      - id: q8
        prompt: Μην ___ σκουπίδια στον δρόμο!
        options:
          - πετάτε
          - πετάξατε
          - πετούσατε
        answer: πετάτε
        explanation: После μην — та же форма, что после να (μην πετάτε или μην πετάξετε); прошедшие формы не подходят.
  - type: explanation
    id: listen-how
    title: Как слушать — звонок в муниципалитет
    body: |-
      Марина звонит в службу чистоты муниципалитета: она хочет узнать, когда вывозят мусор, и выбросить старый диван. Разговор официальный — на «вы». Это как задание 4 экзамена: слушаете и записываете короткие ответы — день, время, цвет, номер телефона.

      Прочитайте вопросы до прослушивания. В первый раз поймите общий смысл, во второй — записывайте. Ответы можно писать по-гречески или по-русски, цифрами или словами.

      Вы услышите: **το προηγούμενο βράδυ** — накануне вечером, **το μέταλλο** — металл, **γυάλινος** — стеклянный, **το θέμα** — вопрос, дело.
  - type: listening
    id: city-call
    title: Τηλεφώνημα στον δήμο
    plays: 2
    transcript:
      - speaker: Υπάλληλος
        text: Δήμος, Υπηρεσία Καθαριότητας, καλημέρα σας.
      - speaker: Μαρίνα
        text: Καλημέρα σας. Με λένε Μαρίνα Λοΐζου και μένω στην οδό Ολύμπου. Θα ήθελα μια πληροφορία. Πότε μαζεύουν τα σκουπίδια στην περιοχή μας;
      - speaker: Υπάλληλος
        text: Στην περιοχή σας τα μαζεύουμε κάθε Τρίτη και Παρασκευή, από τις έξι μέχρι τις εννιά το πρωί. Βγάλτε τις σακούλες το προηγούμενο βράδυ, μετά τις οκτώ.
      - speaker: Μαρίνα
        text: Και η ανακύκλωση;
      - speaker: Υπάλληλος
        text: Η ανακύκλωση είναι κάθε Τετάρτη. Οι μπλε κάδοι είναι για χαρτί, πλαστικό και μέταλλο. Τα γυάλινα μπουκάλια τα πετάτε στους πράσινους κάδους στην πλατεία.
      - speaker: Μαρίνα
        text: Ευχαριστώ. Έχω και ένα άλλο θέμα. Έχω έναν παλιό καναπέ. Πού μπορώ να τον αφήσω;
      - speaker: Υπάλληλος
        text: Μην τον αφήσετε δίπλα στους κάδους! Πρέπει να κλείσετε ραντεβού. Μπορούμε να περάσουμε την επόμενη Πέμπτη. Τον βγάζετε έξω από το σπίτι σας το πρωί, πριν από τις επτά. Πείτε μου το τηλέφωνό σας, παρακαλώ.
      - speaker: Μαρίνα
        text: Ενενήντα εννιά, τετρακόσια τριάντα οκτώ, εκατόν εβδομήντα δύο.
      - speaker: Υπάλληλος
        text: Ωραία. Αν έχετε κι άλλες ερωτήσεις, το τηλέφωνο του δήμου είναι είκοσι πέντε, οκτακόσια ογδόντα, τριακόσια.
      - speaker: Μαρίνα
        text: Σας ευχαριστώ πολύ. Καλή σας μέρα.
