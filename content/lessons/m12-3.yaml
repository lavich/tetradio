blocks:
  - type: explanation
    id: tourist
    title: Если вы турист
    body: |-
      **Δεν είμαι από εδώ.** — «Я не местный» (буквально «я не отсюда»). Так начинают разговор с прохожим, а прохожий так же отвечает, если сам не знает дорогу: **Συγγνώμη, δεν ξέρω. Δεν είμαι από εδώ.**

      **Είναι μακριά από εδώ;** — «Это далеко отсюда?». **Μακριά από** + винительный — «далеко от», пара к κοντά σε: **μακριά από το κέντρο**, **κοντά στο κέντρο**. Ответ: **Είναι πέντε λεπτά με τα πόδια.** — «Это пять минут пешком» (λεπτά — минуты, με τα πόδια — пешком, буквально «ногами»).

      **Μπορείτε να μου το δείξετε στον χάρτη;** — «Можете показать мне это на карте?». После μπορείτε να — та же форма глагола, что в Μπορώ να το δοκιμάσω; (модуль 11): δείξετε — от δείχνω. **Μου** — «мне», **το** — «это». Обычный ответ — **Ναι, βέβαια.** — «Да, конечно».

      **Χάνομαι** — «теряюсь, заблуждаюсь»; спрягается как έρχομαι (χάνομαι, χάνεσαι, χάνεται…). **Χάθηκα!** — «Я заблудился!» (или «заблудилась») — это прошедшее время; пока выучите его как готовую фразу. Так же: **Χαθήκαμε!** — «Мы заблудились!».

      Если не поняли объяснение, выручат фразы модуля 02: **Πιο αργά, παρακαλώ.** **Άλλη μια φορά, παρακαλώ.**
    table:
      columns:
        - турист
        - прохожий
      rows:
        - - Συγγνώμη, πού είναι η τράπεζα;
          - Είναι στη γωνία, δίπλα στην εκκλησία.
        - - Είναι μακριά από εδώ;
          - Όχι, είναι πέντε λεπτά με τα πόδια.
        - - Μπορείτε να μου το δείξετε στον χάρτη;
          - Ναι, βέβαια. Είμαστε εδώ.
        - - Χάθηκα! Πώς πάω στο κέντρο;
          - Πηγαίνετε ευθεία μέχρι την πλατεία.
        - - Πού είναι η στάση του λεωφορείου;
          - Συγγνώμη, δεν ξέρω. Δεν είμαι από εδώ.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: situations
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы в чужом городе и не знаете, где находитесь.
        options:
          - Χάθηκα!
          - Δεν πειράζει.
          - Τα λέμε!
        answer: Χάθηκα!
      - id: q2
        prompt: Турист спрашивает вас дорогу, но вы сами здесь впервые.
        options:
          - Συγγνώμη, δεν ξέρω. Δεν είμαι από εδώ.
          - Πηγαίνετε ευθεία.
          - Είναι πέντε λεπτά με τα πόδια.
        answer: Συγγνώμη, δεν ξέρω. Δεν είμαι από εδώ.
      - id: q3
        prompt: Вы хотите знать, придётся ли долго идти.
        options:
          - Είναι μακριά από εδώ;
          - Πού είναι η τράπεζα;
          - Πώς σας λένε;
        answer: Είναι μακριά από εδώ;
      - id: q4
        prompt: У прохожего в руках карта, и вы просите показать место на ней.
        options:
          - Μπορείτε να μου το δείξετε στον χάρτη;
          - Μπορώ να το δοκιμάσω;
          - Τι σημαίνει αυτό;
        answer: Μπορείτε να μου το δείξετε στον χάρτη;
      - id: q5
        prompt: Прохожий объясняет слишком быстро.
        options:
          - Πιο αργά, παρακαλώ.
          - Χάθηκα!
          - Στρίψτε δεξιά.
        answer: Πιο αργά, παρακαλώ.
  - type: exercise
    id: dialogue-match
    title: Вопрос и ответ
    instruction: Соедините вопрос туриста и ответ прохожего. Два ответа лишние.
    format: match
    bank:
      - Είναι δίπλα στο ταχυδρομείο, απέναντι από το πάρκο.
      - Όχι, είναι δέκα λεπτά με τα πόδια.
      - Ναι, βέβαια. Είμαστε εδώ, και το μουσείο είναι εκεί.
      - Πηγαίνετε ευθεία μέχρι την πλατεία.
      - Στη γωνία, μπροστά στο φαρμακείο.
      - Ναι, είναι ανοιχτό μέχρι τις επτά.
      - Φοράω νούμερο τριάντα οκτώ.
      - Μένω στη Λεμεσό.
    items:
      - id: m1
        prompt: Συγγνώμη, πού είναι η τράπεζα;
        answer: Είναι δίπλα στο ταχυδρομείο, απέναντι από το πάρκο.
      - id: m2
        prompt: Είναι μακριά από εδώ;
        answer: Όχι, είναι δέκα λεπτά με τα πόδια.
      - id: m3
        prompt: Μπορείτε να μου το δείξετε στον χάρτη;
        answer: Ναι, βέβαια. Είμαστε εδώ, και το μουσείο είναι εκεί.
        explanation: Βέβαια — «конечно».
      - id: m4
        prompt: Χάθηκα! Πώς πάω στο κέντρο;
        answer: Πηγαίνετε ευθεία μέχρι την πλατεία.
      - id: m5
        prompt: Πού είναι η στάση του λεωφορείου;
        answer: Στη γωνία, μπροστά στο φαρμακείο.
      - id: m6
        prompt: Το ταχυδρομείο είναι ανοιχτό τώρα;
        answer: Ναι, είναι ανοιχτό μέχρι τις επτά.
  - type: explanation
    id: writing-how
    title: Как объяснить другу дорогу к себе
    body: |-
      С этого модуля сообщение длиннее — **60–80 слов**. Друг первый раз едет к вам в гости, и вы пишете, как вас найти. План из пяти шагов: поздоровайтесь и скажите, когда вы его ждёте; где вы живёте (город, район, рядом с чем); откуда начинать — остановка, площадь, большое здание; дорога в три-четыре шага; как найти дом (напротив чего, какой этаж) и прощание.

      Другу пишут на «ты»: **πήγαινε, στρίψε, συνέχισε, πέρασε, πάρε**. Связывайте шаги словами **μετά** — потом, **εκεί** — там, **και**. Удобно назвать время: **Είναι δέκα λεπτά με τα πόδια.** «Выйди на остановке…» — **Κατέβα στη στάση…**: κατεβαίνω значит и «выходить из транспорта» (подробнее — в модуле 13).

      Проверьте себя после письма. После **μέχρι, απέναντι από, κοντά σε, δίπλα σε** — винительный падеж: μέχρι **την** πλατεία, απέναντι από **το** πάρκο. «Чей? чего?» — родительный: η στάση **του λεωφορείου**, το κέντρο **της πόλης**. Порядковое числительное согласуется: **τον δεύτερο** δρόμο, **την τρίτη** στάση, **στον πρώτο** όροφο. Тонос — в каждом слове из двух и больше слогов.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - где вы живёте
          - Μένω στη Λάρνακα, κοντά στο κέντρο / σε μια ωραία περιοχή.
        - - откуда начинать
          - Από τη στάση του λεωφορείου … / Από την πλατεία …
        - - дорога
          - Πήγαινε ευθεία μέχρι … Στρίψε δεξιά στο φανάρι. Πάρε τον δεύτερο δρόμο αριστερά.
        - - где дом
          - Το σπίτι μου είναι απέναντι από … / ανάμεσα στο … και στο …
        - - этаж
          - Μένω στον πρώτο / δεύτερο / τρίτο όροφο.
        - - сколько идти
          - Είναι πέντε λεπτά με τα πόδια.
  - type: exercise
    id: sentences
    title: Предложения для письма
    instruction: Напишите по-гречески другу, на «ты». Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: От остановки иди прямо до площади.
        answer:
          - Από τη στάση πήγαινε ευθεία μέχρι την πλατεία.
          - Πήγαινε ευθεία από τη στάση μέχρι την πλατεία.
          - Από τη στάση του λεωφορείου πήγαινε ευθεία μέχρι την πλατεία.
      - id: q2
        prompt: На площади поверни налево.
        answer:
          - Στην πλατεία στρίψε αριστερά.
          - Στρίψε αριστερά στην πλατεία.
      - id: q3
        prompt: Сверни на третью улицу направо.
        answer:
          - Πάρε τον τρίτο δρόμο δεξιά.
          - Πάρε τον τρίτο δρόμο στα δεξιά.
          - Στρίψε στον τρίτο δρόμο δεξιά.
          - Στρίψε δεξιά στον τρίτο δρόμο.
      - id: q4
        prompt: Мой дом напротив парка.
        answer:
          - Το σπίτι μου είναι απέναντι από το πάρκο.
      - id: q5
        prompt: Я живу на втором этаже.
        answer:
          - Μένω στον δεύτερο όροφο.
          - Εγώ μένω στον δεύτερο όροφο.
        explanation: ο όροφος — этаж; στον δεύτερο όροφο — винительный после σε.
      - id: q6
        prompt: Это десять минут пешком.
        answer:
          - Είναι δέκα λεπτά με τα πόδια.
          - Είναι δέκα λεπτά με τα πόδια από εδώ.
  - type: writing
    id: to-me
    register: friendly
    prompt: "Ваша подруга Катерина первый раз едет к вам в гости в субботу на автобусе. Напишите ей сообщение 60–80 слов: где вы живёте, на какой остановке выйти и как дойти от неё до вашего дома (не меньше трёх шагов), что находится рядом с домом и на каком вы этаже."
    words:
      min: 60
      max: 80
    model: Γεια σου, Κατερίνα! Σε περιμένω το Σάββατο στις έξι. Μένω στη Λεμεσό, σε μια ωραία περιοχή κοντά στη θάλασσα. Κατέβα στη στάση του λεωφορείου μπροστά στο νοσοκομείο. Από εκεί πήγαινε ευθεία μέχρι το φανάρι. Στο φανάρι πέρασε τον δρόμο και στρίψε δεξιά. Συνέχισε μέχρι μια μικρή πλατεία με μια εκκλησία. Εκεί πάρε τον δεύτερο δρόμο αριστερά. Το σπίτι μου είναι το τρίτο δεξιά, απέναντι από ένα φαρμακείο. Μένω στον πρώτο όροφο. Είναι δέκα λεπτά με τα πόδια. Τα λέμε!
    criteria:
      - 60–80 слов; дружеское приветствие и прощание на «ты» (Γεια σου, …! … Τα λέμε!)
      - Сказано, где вы живёте (город, район или что рядом)
      - Названо, откуда начинать — остановка, площадь или здание
      - "Не меньше трёх шагов дороги в повелительном наклонении на «ты»: πήγαινε, στρίψε, συνέχισε, πέρασε, πάρε — а не на «вы»"
      - "Есть ориентир у дома (απέναντι από, δίπλα σε, ανάμεσα σε … και …) и этаж с порядковым числительным: στον πρώτο όροφο"
      - "После μέχρι, απέναντι από, σε — винительный падеж (μέχρι την πλατεία); порядковые числительные согласованы (τον δεύτερο δρόμο)"
      - Тонос во всех словах из двух и больше слогов
  - type: explanation
    id: roleplay-how
    title: Ролевая игра «турист — прохожий»
    body: |-
      В третьей части устного экзамена двое экзаменуемых разыгрывают ситуацию. Каждый получает карточку с ролью и около двух минут, чтобы её прочитать. Незнакомые люди говорят друг с другом на «вы»: **Συγγνώμη, κύριε / κυρία…**, **πηγαίνετε, στρίψτε, πάρτε**.

      **Турист:** привлеките внимание (Συγγνώμη…), скажите, что вы не местный, спросите дорогу, уточните, далеко ли, повторите маршрут, чтобы проверить себя, поблагодарите. **Прохожий:** скажите, далеко ли, объясните дорогу по шагам — три-четыре указания, назовите ориентир в конце.

      В приложении партнёра нет: скажите вслух свою часть и оставляйте паузы для ответов. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: tourist-role
    part: roleplay
    prompt: |-
      Ролевая игра. Вы турист в Лимасоле и ищете почту. Остановите прохожую и поздоровайтесь, скажите, что вы не местный, спросите, где почта и далеко ли это. Попросите показать на карте, повторите дорогу, которую она объяснила («прямо до светофора, потом направо»), поблагодарите и попрощайтесь. Говорите на «вы», скажите свою часть вслух и запишите.
    seconds: 60
    model: Καλημέρα σας! Συγγνώμη, κυρία, δεν είμαι από εδώ. Πού είναι το ταχυδρομείο; … Είναι μακριά από εδώ; … Ωραία. Μπορείτε να μου το δείξετε στον χάρτη; … Ευθεία μέχρι το φανάρι και μετά δεξιά; … Ευχαριστώ πολύ! Καλή σας μέρα!
    criteria:
      - Поздоровались и привлекли внимание (Καλημέρα σας! Συγγνώμη, κυρία…)
      - Сказали, что вы не местный (Δεν είμαι από εδώ.)
      - Спросили, где почта и далеко ли это (Πού είναι…; Είναι μακριά από εδώ;), с вопросительной интонацией
      - Попросили показать на карте (Μπορείτε να μου το δείξετε στον χάρτη;)
      - Повторили дорогу (ευθεία μέχρι το φανάρι, μετά δεξιά)
      - Всё на «вы»; поблагодарили и попрощались
  - type: speaking
    id: passerby-role
    part: roleplay
    prompt: |-
      Ролевая игра. Вы живёте в Ларнаке. Турист спрашивает вас: «Συγγνώμη, πού είναι το φαρμακείο;» Вы знаете дорогу: от вас — пять минут пешком; прямо до светофора, на светофоре направо, потом вторая улица налево; аптека на углу, напротив церкви. Ответьте туристу на «вы», объясните дорогу по шагам и попрощайтесь. Скажите вслух и запишите.
    seconds: 60
    model: Το φαρμακείο; Δεν είναι μακριά, είναι πέντε λεπτά με τα πόδια. Πηγαίνετε ευθεία μέχρι το φανάρι. Στο φανάρι στρίψτε δεξιά. Μετά πάρτε τον δεύτερο δρόμο αριστερά. Το φαρμακείο είναι στη γωνία, απέναντι από την εκκλησία. Παρακαλώ! Καλή σας μέρα!
    criteria:
      - Сказали, далеко ли (Είναι πέντε λεπτά με τα πόδια.)
      - "Объяснили дорогу в три-четыре шага в повелительном наклонении на «вы»: πηγαίνετε, στρίψτε, πάρτε — а не πήγαινε, στρίψε"
      - "Порядковое числительное согласовано: τον δεύτερο δρόμο"
      - "Назвали ориентир: στη γωνία, απέναντι από την εκκλησία"
      - Ударение на своём месте (ευθεία, φαρμακείο, στρίψτε, δεύτερο); ευ в ευθεία звучит [эф]
  - type: exercise
    id: review-grammar
    title: Повторение — модуль 12
    instruction: Вставьте слово. Пять слов лишние.
    format: gap
    bank:
      - λεωφορείου
      - λεωφορείο
      - της
      - στρίψε
      - στρίψτε
      - ανεβείτε
      - ανέβα
      - τρίτη
      - τρίτο
      - πόλης
      - πόλη
    items:
      - id: g1
        prompt: Πού είναι η στάση του ___;
        answer: λεωφορείου
      - id: g2
        prompt: Το σπίτι ___ Μαρίας είναι στη γωνία.
        answer: της
      - id: g3
        prompt: Νίκο, ___ δεξιά στο φανάρι!
        answer: στρίψε
        explanation: Νίκο — обращение к одному знакомому, на «ты».
      - id: g4
        prompt: Κυρία Ελένη, ___ στον δεύτερο όροφο, παρακαλώ.
        answer: ανεβείτε
      - id: g5
        prompt: Στον κυκλικό κόμβο πάρτε την ___ έξοδο.
        answer: τρίτη
        explanation: η έξοδος — женский род, хотя на -ος, как η λεωφόρος.
      - id: g6
        prompt: Μένω στο κέντρο της ___.
        answer: πόλης
  - type: exercise
    id: review-mixed
    title: Повторение — модули 08–11
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: "В кафенио: «Мне, пожалуйста, кипрский кофе средней сладости»."
        options:
          - Θα ήθελα έναν κυπριακό καφέ μέτριο.
          - Θέλεις κάτι να πιεις;
          - Κερνάει το μαγαζί.
        answer: Θα ήθελα έναν κυπριακό καφέ μέτριο.
      - id: q2
        prompt: В таверне вы хотите расплатиться.
        options:
          - Τον λογαριασμό, παρακαλώ.
          - Τον κατάλογο, παρακαλώ.
          - Καλή όρεξη!
        answer: Τον λογαριασμό, παρακαλώ.
      - id: q3
        prompt: На рынке вам нужен килограмм помидоров.
        options:
          - Ένα κιλό ντομάτες, παρακαλώ.
          - Ένα κιλό ντομάτα, παρακαλώ.
          - Ένα κιλό τις ντομάτες, παρακαλώ.
        answer: Ένα κιλό ντομάτες, παρακαλώ.
      - id: q4
        prompt: "Кассир спрашивает: «Πληρώνετε με κάρτα ή μετρητά;»"
        options:
          - Με κάρτα, παρακαλώ.
          - Τίποτα άλλο, ευχαριστώ.
          - Φοράω νούμερο σαράντα.
        answer: Με κάρτα, παρακαλώ.
      - id: q5
        prompt: В магазине одежды вы хотите примерить брюки.
        options:
          - Μπορώ να το δοκιμάσω;
          - Μπορώ να το επιστρέψω;
          - Πού είναι το ταμείο;
        answer: Μπορώ να το δοκιμάσω;
      - id: q6
        prompt: Μου αρέσει ___ φούστα.
        options:
          - η
          - τη
          - το
        answer: η
        explanation: После αρέσει — именительный падеж; η φούστα — женский род.
