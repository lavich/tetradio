title: Контрольная модуля t06
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 10–15 минут: этикетка лекарства и правила страховой, автоответчик клиники, разговор у врача, время и совет, слова и фразы модуля. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Аудио звучит два раза; в вопросах с выбором верен один вариант. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: label
    title: Medicine label and insurance rules
    text: |-
      OLD TOWN PHARMACY · 22 Canongate, Edinburgh
      Patient: Mr Tomasz Nowak · Date: 18/06
      NAPROXEN 250 mg TABLETS · 14 tablets
      Take ONE tablet TWICE a day with or after food.
      Do not take on an empty stomach.
      Do not take with other painkillers containing ibuprofen or aspirin.
      May cause drowsiness. If affected, do not drive.

      TRAVELWELL INSURANCE — HOW TO MAKE A MEDICAL CLAIM
      1. Keep all receipts for doctors, hospitals and medicine, including over-the-counter medicine.
      2. Ask the doctor for a copy of your prescription or a short medical report.
      3. Send your claim online within 30 days of returning home.
      4. If the treatment will cost more than £500, call our 24-hour helpline before you pay.
      5. We pay within 10 working days after we receive all the documents.
    glosses:
      - { text: containing, russian: содержащий }
      - { text: drowsiness, russian: сонливость }
      - { text: If affected, russian: если это проявилось }
      - { text: working days, russian: рабочих дней }
  - type: exercise
    id: label-q
    about: label
    graded: true
    title: Чтение
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: How many tablets should Tomasz take in one day?
        options: [two, one, fourteen]
        answer: two
        explanation: "Take ONE tablet TWICE a day — две в день."
      - id: q2
        prompt: When should he take them?
        options:
          - with or after a meal
          - before breakfast
          - only at night
        answer: with or after a meal
        explanation: "With or after food. Do not take on an empty stomach."
      - id: q3
        prompt: What can happen after taking the tablets?
        options:
          - He may feel sleepy.
          - He may feel hungry.
          - He may get a sore throat.
        answer: He may feel sleepy.
        explanation: "May cause drowsiness — может клонить в сон, поэтому If affected, do not drive."
      - id: q4
        prompt: What does Travelwell need from the doctor?
        options:
          - a copy of the prescription or a medical report
          - a letter to the airline
          - a photo of the medicine
        answer: a copy of the prescription or a medical report
      - id: q5
        prompt: When should you call the helpline before paying?
        options:
          - if the treatment costs more than £500
          - if you buy over-the-counter medicine
          - if you are back home
        answer: if the treatment costs more than £500
      - id: q6
        prompt: What is the latest you can send a claim?
        options:
          - 30 days after you get home
          - 10 working days after the treatment
          - before you leave the country
        answer: 30 days after you get home
        explanation: "Within 30 days of returning home — в течение 30 дней после возвращения."
  - type: listening
    id: practice
    title: Old Town Private Clinic — phone message
    plays: 2
    transcript:
      - { text: "Thank you for calling the Old Town Private Clinic. We are open from eight in the morning to six in the evening, Monday to Friday. If you are visiting Edinburgh and need to see a doctor, please press 2 to book an appointment. Appointments for visitors cost sixty-five pounds. For repeat prescriptions, please use our website. If you need medical advice when we are closed, call 111. If someone is seriously ill or injured, call 999 or go to A&E at the Royal Infirmary." }
  - type: exercise
    id: practice-q
    about: practice
    graded: true
    title: Аудирование — автоответчик клиники
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: When is the clinic open?
        options:
          - on weekdays, 8 am to 6 pm
          - every day, 8 am to 6 pm
          - Monday to Friday, 6 am to 8 pm
        answer: on weekdays, 8 am to 6 pm
        explanation: From eight in the morning to six in the evening, Monday to Friday.
      - id: q2
        prompt: What should a visitor do to book an appointment?
        options: [press 2, use the website, call 111]
        answer: press 2
      - id: q3
        prompt: What number should you call for advice at night?
        options: ["111", "999", "65"]
        answer: "111"
        explanation: "If you need medical advice when we are closed, call 111; 999 — только при серьёзной угрозе."
  - type: listening
    id: doctor
    title: At the doctor's
    plays: 2
    transcript:
      - { speaker: Okafor, text: "Good morning. What can I do for you today?" }
      - { speaker: Marco, text: "Hello. My ankle is still swollen. The pharmacist says, if it's not better in three or four days, I should see a doctor." }
      - { speaker: Okafor, text: "Right. How long have you had the problem?" }
      - { speaker: Marco, text: "Since last Sunday. So, five days now. I twisted it on a walk." }
      - { speaker: Okafor, text: "And have you been resting it?" }
      - { speaker: Marco, text: "Not really. I'm on holiday, so I walk a lot. Every day maybe ten kilometres." }
      - { speaker: Okafor, text: "Ah, that's why it isn't getting better. Let me have a look… Good news — I don't think it's broken. But it's a bad sprain. You'd better not walk long distances for a week. Take the bus or a taxi." }
      - { speaker: Marco, text: "OK. And the tablets from the chemist's? Ibuprofen." }
      - { speaker: Okafor, text: "You can keep taking them, three times a day after meals. But don't take them for more than another five days. Put ice on it twice a day, and keep your foot up in the evening." }
      - { speaker: Marco, text: "Sorry, how often the ice?" }
      - { speaker: Okafor, text: "Twice a day, about fifteen minutes each time. If it still hurts in a week, you should get an X-ray." }
  - type: exercise
    id: doctor-q
    about: doctor
    graded: true
    title: Аудирование — у врача
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: How long has Marco had the problem?
        options: [for five days, for three days, for a week]
        answer: for five days
        explanation: "Since last Sunday. So, five days now."
      - id: q2
        prompt: Why isn't his ankle getting better?
        options:
          - He has been walking a lot.
          - He hasn't taken any tablets.
          - It is broken.
        answer: He has been walking a lot.
        explanation: "I walk a lot. Every day maybe ten kilometres — врач: that's why it isn't getting better."
      - id: q3
        prompt: What does the doctor say about walking?
        options:
          - He shouldn't walk long distances for a week.
          - He should walk ten kilometres a day.
          - He can walk, but only with a bandage.
        answer: He shouldn't walk long distances for a week.
        explanation: "You'd better not walk long distances for a week."
      - id: q4
        prompt: How often should Marco put ice on his ankle?
        options: [twice a day, three times a day, every evening]
        answer: twice a day
        explanation: "Three times a day — это о таблетках; лёд — twice a day, about fifteen minutes."
      - id: q5
        prompt: When should he get an X-ray?
        options:
          - if it still hurts in a week
          - tomorrow
          - after five more days of tablets
        answer: if it still hurts in a week
  - type: exercise
    id: grammar
    graded: true
    title: Время и совет
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: I've had this cough ___ ten days.
        options: [for, since, during]
        answer: for
        explanation: Отрезок времени — for.
      - id: q2
        prompt: She's been feeling sick ___ the flight.
        options: [since, for, ago]
        answer: since
        explanation: The flight — начальная точка, since.
      - id: q3
        prompt: How long ___ the rash?
        options: [have you had, do you have, are you having]
        answer: have you had
        explanation: «Сколько уже длится» — present perfect; have в значении «иметь» без -ing.
      - id: q4
        prompt: I ___ coughing all night, and I'm really tired.
        options: ["'ve been", "'m", "'ve"]
        answer: "'ve been"
        explanation: Present perfect continuous — have been + -ing.
      - id: q5
        prompt: You'd better ___ to A&E — that cut looks deep.
        options: [go, to go, going]
        answer: go
        explanation: "'d better + глагол без to."
      - id: q6
        prompt: ___ I take it before or after meals?
        options: [Should, Had better, Must to]
        answer: Should
        explanation: Совета спрашивают через Should I…?; после must to не ставят.
  - type: exercise
    id: words
    graded: true
    title: Слова и фразы
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank: [prescription, side, dose, painkiller, swollen, dizzy, inhaler, empty, claim, rash, recipe]
    items:
      - { id: g1, prompt: "You can't buy antibiotics here without a ___ from a doctor.", answer: prescription }
      - { id: g2, prompt: "Are there any ___ effects? I need to drive tomorrow.", answer: side }
      - { id: g3, prompt: "I forgot to take the morning ___. Can I take it now?", answer: dose }
      - { id: g4, prompt: "I've got a terrible headache. Could you recommend a ___?", answer: painkiller }
      - { id: g5, prompt: "My knee is ___ and red after the fall.", answer: swollen }
      - { id: g6, prompt: "I feel ___ when I stand up too quickly.", answer: dizzy }
      - { id: g7, prompt: "I've got asthma, and I left my ___ at home.", answer: inhaler }
      - { id: g8, prompt: "Take it with food, never on an ___ stomach.", answer: empty }
      - { id: g9, prompt: "I'm making an insurance ___ for the doctor's fee.", answer: claim }
  - type: exercise
    id: translate
    graded: true
    title: Скажите по-английски
    instruction: Переведите на английский. Сокращения (I've, where's) можно писать и полностью.
    format: text
    items:
      - id: q1
        prompt: Как часто его принимать?
        answer:
          - How often should I take it?
          - How often do I take it?
          - How often do I need to take it?
          - How often should I take this?
          - How often do I have to take it?
          - How often should it be taken?
      - id: q2
        prompt: У меня аллергия на пенициллин.
        answer:
          - I'm allergic to penicillin.
          - I am allergic to penicillin.
          - I have a penicillin allergy.
          - I've got a penicillin allergy.
          - I have an allergy to penicillin.
          - I've got an allergy to penicillin.
      - id: q3
        prompt: Где ближайшее отделение неотложной помощи?
        answer:
          - Where's the nearest A&E?
          - Where is the nearest A&E?
          - Where's the nearest A and E?
          - Where's the nearest emergency department?
          - Where's the nearest accident and emergency?
          - Where's the nearest ER?
          - Where is the nearest emergency room?
          - Where's the nearest emergency room?
          - Where is the nearest A and E?
          - Where is the nearest emergency department?
          - Where is the nearest accident and emergency?
          - Where is the nearest ER?
          - Where's the nearest A&E department?
          - Where is the nearest A&E department?
