title: Анкета, переписка до приглашения, отказ и голосовое сообщение
kind: lesson
items: []
blocks:
  - type: explanation
    id: dating-bank
    title: Банк фраз — знакомство в приложении
    body: |-
      Для переписки в приложении нужны пять умений: начать, продолжить, пригласить, отказать вежливо и позаботиться о безопасности.

      **Начать:** **Hi! I liked your bio.** **What do you do for fun?** **Продолжить:** **I love hiking and trying new food. hbu?** / **I'd love to hear about it.** **Пригласить:** **Fancy a coffee sometime?** / **I'm up for coffee.** **Отказать:** **Thanks, but I'm not ready to meet yet.** / **I don't think we're a match, but good luck.** **Безопасность:** **Let's meet somewhere busy.** / **I'll text a friend where I am.** / **I'll make my own way home, thanks.**

      Отказ звучит коротко: благодарность, отказ, пожелание. Причину называть необязательно, повторять просьбу после отказа не принято. Ответ на отказ тоже короткий: *Fair enough. Good luck to you too.*
    table:
      columns:
        - умение
        - фраза
      rows:
        - - начать
          - Hi! I liked your bio. What do you do for fun?
        - - продолжить
          - I love hiking and trying new food. hbu?
        - - пригласить
          - Fancy a coffee sometime?
        - - отказать
          - Thanks, but I'm not ready to meet yet.
        - - закончить переписку
          - I don't think we're a match, but good luck.
        - - безопасность
          - Let's meet somewhere busy. I'll text a friend where I am.
  - type: exercise
    id: lines-match
    title: Реплика и ответ
    instruction: Подберите ответ на реплику. Два ответа лишние.
    format: match
    bank:
      - I'm up for coffee. Shall we say three?
      - Thanks, but I'd rather meet somewhere busy.
      - Thanks, I'll make my own way home.
      - Fair enough. Good luck to you too.
      - Doors open at eight.
      - Two pints, please.
    items:
      - { id: m1, prompt: "Fancy a coffee on Saturday?", answer: "I'm up for coffee. Shall we say three?" }
      - { id: m2, prompt: "Come to my place, it's quieter.", answer: "Thanks, but I'd rather meet somewhere busy." }
      - { id: m3, prompt: "Let me walk you home after the coffee.", answer: "Thanks, I'll make my own way home." }
      - { id: m4, prompt: "I don't think we're a match, but good luck.", answer: "Fair enough. Good luck to you too." }
  - type: explanation
    id: profile-how
    title: Анкета — кто вы, что любите, что ищете
    body: |-
      Вы пишете анкету для приложения знакомств. Объём — 60–100 слов, регистр дружеский: короткие предложения, сокращения (I'm, I'd), слова и фразы из модуля.

      Порядок: кто вы (работа и город) → два-три увлечения с формой на -ing (**I love hiking, I'm into cooking**) → одна фраза с to (**I'd love to travel more**) → что вы ищете, прямо и заранее (**tbh I'm upfront about…**) → вопрос для начала разговора (**Conversation starter: …**).

      Адрес, телефон, фамилию и место работы в анкету не пишут: достаточно города и профессии.
  - type: writing
    id: profile
    register: friendly
    prompt: "Вы пишете анкету для приложения знакомств (60–100 слов): кто вы, чем занимаетесь, два-три увлечения, что ищете и вопрос для начала разговора. Адрес, телефон и фамилию в анкете не указывайте."
    words: { min: 60, max: 100 }
    model: |-
      Hi, I'm Robin, a graphic designer from Leeds. I love hiking, and I'm really into trying new food, so I'm always looking for a good ramen place. I'd love to travel more this year, and Portugal is next on my list. I'm upfront about what I want: good conversation and a coffee somewhere busy to start with. I'm not great at karaoke, but I'm brave. Conversation starter: what's the best meal you've ever had?
    criteria:
      - 60–100 слов; есть кто вы, увлечения, что вы ищете и вопрос для начала разговора
      - "Дружеский регистр: короткие предложения, сокращения (I'm, I'd), фразы из модуля (I love hiking, I'd love to…, Conversation starter)"
      - "Герундий и инфинитив: love, be into, enjoy + -ing; would love + to; нет ошибок вроде I enjoy to cook"
      - Нет адреса, телефона, фамилии и места работы; назван только город и профессия
      - Один вопрос в конце, открытый, с what, where, how или which
  - type: explanation
    id: chat-text-how
    title: Переписка — от первого сообщения до приглашения и отказа
    body: |-
      Теперь переписка по шагам: первое сообщение, вопрос, приглашение, вежливый отказ и окончание переписки. Каждый шаг — одно предложение, регистр дружеский. Сокращения (I'm, it's) можно писать и полностью.
