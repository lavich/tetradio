  - type: explanation
    id: voice-write-how
    title: Голосовое сообщение — 30 секунд
    body: |-
      Вы отвечаете новому знакомому голосовым сообщением. За 30 секунд скажите три вещи: кто вы, что любите (две формы на -ing) и чего хотели бы (**I'd love to…**). Закончите одним вопросом. Говорите спокойно, короткими предложениями. Запишите, переслушайте, сверьте с критериями, запишите второй дубль.
  - type: speaking
    id: voice-message
    part: monologue
    prompt: "Вы отвечаете в приложении голосовым сообщением (около 30 секунд): назовите имя, скажите, что вы любите делать (две формы на -ing), что хотели бы сделать (I'd love to…), и задайте один вопрос. Запишите свою часть."
    seconds: 45
    model: "Hi Maya, it's Chris. Thanks for your message, it was nice to hear from you. I love hiking, and I'm really into trying new food, so I'm always looking for a new trail or a new restaurant. I'd love to see Portugal this year, and I'd love to hear about the places you like. What do you do for fun when you're not working?"
    criteria:
      - Около 30 секунд, три части — кто вы, что любите и хотели бы, вопрос
      - "Две формы на -ing (I love hiking, I'm into trying) и одна с to (I'd love to…)"
      - Один открытый вопрос в конце
      - Спокойный темп, короткие предложения
      - На втором дубле — меньше пауз и повторов
  - type: explanation
    id: reply-how
    title: Сцена — ответ на голосовые сообщения
    body: |-
      Теперь сцена: Майя отвечает вам голосовыми сообщениями. Сначала звучат только её сообщения, подряд, два раза. Затем откройте текст реплик кнопкой «Открыть текст» и держите его перед глазами.

      В задании речи включите запись и отвечайте на каждое сообщение по порядку: расскажите о себе, поддержите её предложение, согласитесь на время и место и отнеситесь к её правилу безопасности спокойно.
  - type: listening
    id: reply-lines
    title: Реплики собеседника — голосовые сообщения Майи
    plays: 2
    transcript:
      - { speaker: Maya, text: "Hi, it's Maya. Thanks for your message. I liked your bio. What do you do for fun?", audio: t12-3/reply-lines-1.mp3 }
      - { speaker: Maya, text: "Hiking sounds great. I love trying new places too. What's the best trail you've done?", audio: t12-3/reply-lines-2.mp3 }
      - { speaker: Maya, text: "I'd love to hear more about that one. Fancy a coffee on Saturday?", audio: t12-3/reply-lines-3.mp3 }
      - { speaker: Maya, text: "Wonderful. Shall we say eleven, at the café in the market? It's always busy, and I like meeting somewhere busy the first time.", audio: t12-3/reply-lines-4.mp3 }
      - { speaker: Maya, text: "Great. I'll text a friend where I am, as I always do. See you on Saturday.", audio: t12-3/reply-lines-5.mp3 }
  - type: speaking
    id: reply
    part: roleplay
    prompt: |-
      Вы отвечаете Майе голосовыми сообщениями. Прослушайте её сообщения на предыдущей странице; отвечайте на каждое по порядку и записывайте свою часть.
      Скажите, что любите ходить в походы и пробовать новую еду, и назовите любимую тропу. Согласитесь на кофе в субботу, на одиннадцать и на людное место. Отнеситесь к её правилу безопасности спокойно и попрощайтесь. Вся ваша часть — 40–60 секунд, каждая реплика — одна-две фразы.
    seconds: 60
    model: |-
      Maya: Hi, it's Maya. Thanks for your message. I liked your bio. What do you do for fun?
      You: Hi Maya. I love hiking and trying new food. What about you?
      Maya: Hiking sounds great. I love trying new places too. What's the best trail you've done?
      You: The coast path in Wales. It took three days.
      Maya: I'd love to hear more about that one. Fancy a coffee on Saturday?
      You: I'm up for coffee. Saturday is good for me.
      Maya: Wonderful. Shall we say eleven, at the café in the market? It's always busy, and I like meeting somewhere busy the first time.
      You: Eleven is fine, and the market is a good idea.
      Maya: Great. I'll text a friend where I am, as I always do. See you on Saturday.
      You: Of course, that makes sense. See you on Saturday.
    criteria:
      - Ответили на все пять сообщений по порядку, каждая реплика — одна-две фразы
      - "Рассказали о себе формами на -ing (I love hiking and trying new food) и задали встречный вопрос"
      - "Согласие на кофе, время и место: I'm up for coffee. Eleven is fine."
      - Правило безопасности принято спокойно, без вопросов и возражений
      - Дружеский тон, без восклицаний и спешки
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "I really enjoy ___ my friends."
        options: [cooking for, to cook for, cook for]
        answer: cooking for
        explanation: После enjoy идёт форма на -ing.
      - id: q2
        prompt: "I'd love ___ you at the café on Saturday."
        options: [to meet, meeting, meet]
        answer: to meet
        explanation: После would love идёт to и инфинитив.
      - id: q3
        prompt: "A new match says: Come to my flat, it's quieter. You want to follow the first rule."
        options:
          - Thanks, but I'd rather meet somewhere busy.
          - Count me in.
          - I'm running a bit late.
        answer: Thanks, but I'd rather meet somewhere busy.
        explanation: Первое правило — людное место; отказ вежливый и без объяснений.
      - id: q4
        prompt: "You do not want to continue the chat. Which message ends it politely?"
        options:
          - I don't think we're a match, but good luck.
          - Fancy a coffee sometime?
          - I'm up for coffee.
        answer: I don't think we're a match, but good luck.
        explanation: Спокойное окончание переписки без упрёков.
