blocks:
  - type: explanation
    id: bill
    title: Напитки, счёт и чаевые
    body: |-
      Первым делом официант спрашивает о напитках: **Can I get you any drinks?** Вода из-под крана, **tap water**, в Британии бесплатна: заведение с лицензией на алкоголь обязано дать её по закону, а в кафе её почти всегда дают и так. Просить её — обычное дело: **Just tap water, thanks.** Самое простое и недорогое вино в карте — **the house wine**: a glass of the house red.

      Кроме меню, почти везде есть **the specials** — блюда дня, их пишут на доске или называет официант. А **a takeaway** — еда навынос: Let's get a takeaway tonight.

      Счёт просят так: **Could we have the bill, please?** (в США — the check). Если каждый платит за своё — **Can we pay separately?** Если делите поровну — **split the bill**: Shall we split the bill? Не доели — **Could we get the rest boxed up?** Остатки упакуют в контейнер; разговорно его называют **a doggy bag**.

      Чаевые в Британии зависят от того, есть ли в счёте плата за обслуживание. Часто в нём уже есть **a service charge** — плата за обслуживание, обычно 12,5 %. Тогда сверху ничего не оставляют. Она добровольная (discretionary): если обслуживание не понравилось, её можно попросить убрать. Не уверены — спросите: **Is service included?** Если её нет, обычно оставляют около 10 %.

      Если что-то не так, говорят спокойно и коротко: **Excuse me, this isn't what I ordered.** **It's a bit too salty for me.** A bit too… смягчает жалобу.
