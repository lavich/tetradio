        - - εσείς
          - επισκεφτήκατε
        - - αυτοί, αυτές
          - επισκέφτηκαν
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: stem-choice
    title: Какая основа
    instruction: Напишите форму «я» в аористе. Сначала решите, какая буква нужна — σ, ξ или ψ. Не забудьте тонос.
    format: text
    items:
      - id: q1
        prompt: ετοιμάζω
        answer:
          - ετοίμασα
        explanation: -ζω → -σα.
      - id: q2
        prompt: ταξιδεύω
        answer:
          - ταξίδεψα
        explanation: "-εύω → -εψα: ευ превращается в εψ."
      - id: q3
        prompt: ψάχνω
        answer:
          - έψαξα
        explanation: χν перед окончанием → -ξα; форма из двух слогов получает έ-.
      - id: q4
        prompt: χαλαρώνω
        answer:
          - χαλάρωσα
        explanation: -ώνω → -ωσα.
      - id: q5
        prompt: κολυμπάω
        answer:
          - κολύμπησα
        explanation: Группа B (-άω) обычно получает -ησα.
      - id: q6
        prompt: ανοίγω
        answer:
          - άνοιξα
        explanation: γ перед окончанием → -ξα. Глагол начинается с гласной — έ- не нужно.
      - id: q7
        prompt: ξοδεύω
        answer:
          - ξόδεψα
        explanation: "-εύω → -εψα, как ταξίδεψα."
  - type: exercise
    id: augment
    title: Нужно ли έ-
    instruction: Выберите правильную форму. Смотрите на лицо и на слово времени.
    format: choice
    items:
      - id: q1
        prompt: Χθες ___ στη Μαρία. (εγώ — γράφω)
        options:
          - έγραψα
          - γράφω
          - γράψαμε
        answer: έγραψα
        explanation: Χθες — аорист; «я» — окончание -α, а без έ- форма была бы из двух слогов. γράψαμε — это «мы».
      - id: q2
        prompt: Εμείς ___ στον κύριο Γεωργίου. (γράφω)
        options:
          - γράψαμε
          - έγραψα
          - έγραψαν
        answer: γράψαμε
        explanation: "«Мы» — γράψαμε, без έ-: в форме уже три слога. έγραψα — «я», έγραψαν — «они»."
      - id: q3
        prompt: Προχθές ___ τα κλειδιά μου. (εγώ — ψάχνω)
        options:
          - έψαξα
          - ψάξαμε
          - ψάχνω
        answer: έψαξα
        explanation: τα κλειδιά μου — «мои», значит, «я»; короткий глагол получает έ-. ψάχνω — настоящее время.
      - id: q4
        prompt: Πέρσι ___ στην Ελλάδα. (εμείς — ταξιδεύω)
        options:
          - ταξιδέψαμε
          - ταξιδεύουμε
          - ταξίδεψα
        answer: ταξιδέψαμε
        explanation: Ударение — на третьем слоге от конца (τα-ξι-δέ-ψα-με). Длинным глаголам έ- не нужно. ταξιδεύουμε — настоящее время, ταξίδεψα — «я».
      - id: q5
        prompt: Χθες ο Νίκος ___ το παράθυρο. (ανοίγω)
        options:
          - άνοιξε
          - ανοίγει
          - ανοίξαμε
        answer: άνοιξε
        explanation: Глагол начинается с гласной — έ- нет. ανοίγει — настоящее время, а здесь χθες; ανοίξαμε — «мы».
      - id: q6
        prompt: ___ δωμάτιο στο ξενοδοχείο; (εσείς — κλείνω)
        options:
          - Κλείσατε
          - Έκλεισες
          - Έκλεισαν
        answer: Κλείσατε
        explanation: Форма «вы» — три слога, без έ-. Έκλεισες — «ты», Έκλεισαν — «они».
  - type: exercise
    id: forms-write
    title: Напишите аорист
    instruction: Напишите только глагол в аористе. Не забудьте тонос.
    format: text
    items:
      - id: q1
        prompt: Χθες ___ το κάστρο. (εγώ — φωτογραφίζω)
        answer:
          - φωτογράφισα
      - id: q2
        prompt: ___ τη βαλίτσα σου; (εσύ — ετοιμάζω)
        answer:
          - ετοίμασες
      - id: q3
        prompt: Χθες η Ελένη ___ στην παραλία. (χαλαρώνω)
        answer:
          - χαλάρωσε
      - id: q4
        prompt: Προχθές ___ στη θάλασσα. (εμείς — κολυμπάω)
        answer:
          - κολυμπήσαμε
        explanation: κολύμπησα, но в форме «мы» ударение сдвигается — κολυμπήσαμε.
      - id: q5
        prompt: Πόσα λεφτά ___ στις διακοπές; (εσείς — ξοδεύω)
        answer:
          - ξοδέψατε
      - id: q6
        prompt: Πέρσι οι γονείς μου ___ στη Ρωσία. (ταξιδεύω)
        answer:
          - ταξίδεψαν
          - ταξιδέψανε
        explanation: ταξίδεψαν, разговорный вариант — ταξιδέψανε.
      - id: q7
        prompt: Χθες το βράδυ ___ στην Άννα. (εγώ — γράφω)
        answer:
          - έγραψα
      - id: q8
        prompt: Χθες ___ ξενοδοχείο στην Πάφο. (εμείς — ψάχνω)
        answer:
          - ψάξαμε
        explanation: В форме «мы» три слога — без έ-.
  - type: exercise
    id: time-match
    title: Когда это было
    instruction: Соедините русское выражение с греческим. Два греческих лишние.
    format: match
    bank:
      - χθες
      - προχθές
      - πέρσι
      - την περασμένη εβδομάδα
      - τον περασμένο μήνα
      - πριν από τρεις μέρες
      - σήμερα
      - αύριο
    items:
      - id: m1
        prompt: вчера
        answer: χθες
      - id: m2
        prompt: позавчера
        answer: προχθές
      - id: m3
        prompt: в прошлом году
        answer: πέρσι
