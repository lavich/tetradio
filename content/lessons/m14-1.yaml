  - type: explanation
    id: travel
    title: Слова о поездке
    body: |-
      **Το ταξίδι** — поездка, путешествие; **ταξιδεύω** — путешествовать, ездить: Ταξιδεύω με το αεροπλάνο. **Η εκδρομή** — поездка на день, экскурсия: Η εκδρομή στο χωριό ήταν πολύ ωραία. **Οι διακοπές** — отпуск, каникулы; слово есть только во множественном числе: **στις διακοπές** — в отпуске, **πάω διακοπές** — еду в отпуск (без предлога).

      **Η θάλασσα** — море, **η παραλία** — пляж: κολυμπάω **στη θάλασσα**, χαλαρώνω **στην παραλία**. **Το αντηλιακό** — солнцезащитный крем. **Το αξιοθέατο** — достопримечательность, **το μνημείο** — памятник, **το κάστρο** — замок, крепость (например, το Κάστρο της Λεμεσού), **το χωριό** — деревня. **Ο τουρίστας** — турист, о женщине — **η τουρίστρια**.

      **Ετοιμάζω** — готовить, собирать: ετοιμάζω **τη βαλίτσα** — собираю чемодан. **Ξοδεύω** — тратить: ξοδεύω λεφτά. **Χαλαρώνω** — отдыхать, расслабляться. **Φωτογραφίζω** — фотографировать.

      **Επισκέπτομαι** — «посещать» — глагол на -μαι. У таких глаголов аорист другой: не -σα, а **-ηκα**, и в основе πτ меняется на **φτ**. Запомните формы из таблицы: **Επισκεφτήκαμε το κάστρο.** — «Мы посетили крепость». Пишут также через θ: επισκέφθηκα, επισκεφθήκαμε — это то же самое.

      Две фразы выучите целиком. **Πώς ήταν το ταξίδι σου;** — «Как прошла твоя поездка?»: ήταν — «был, была, было» (прошедшее время от είναι; неправильные формы — в модуле 15). Ответ: **Περάσαμε πολύ ωραία.** — «Мы отлично провели время» (περνάω → πέρασα, особый случай на -ασα).
    table:
      columns:
        - лицо
        - επισκέπτομαι — посещать
      rows:
