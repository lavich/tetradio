  - type: explanation
    id: stem
    title: Основа аориста — -σα, -ξα, -ψα
    body: |-
      Основа аориста получается из основы настоящего времени: конец основы меняется на **σ**, **ξ** или **ψ**. Какая буква — подсказывает конец глагола.

      **-σα.** Глаголы на **-ζω** и **-ώνω**: ετοιμάζω → ετοίμασα, φωτογραφίζω → φωτογράφισα, χαλαρώνω → χαλάρωσα, πληρώνω → πλήρωσα. Глаголы на **-άω / -ώ** (группа B) получают **-ησα**: κολυμπάω → κολύμπησα, μιλάω → μίλησα, οδηγώ → οδήγησα.

      **-ξα.** Глаголы, у которых перед окончанием **γ, χ, κ** (или **χν**): ανοίγω → άνοιξα, ψάχνω → έψαξα, δείχνω → έδειξα.

      **-ψα.** Глаголы, у которых перед окончанием **π, β, φ**, и все глаголы на **-εύω**: γράφω → έγραψα, στρίβω → έστριψα, ταξιδεύω → ταξίδεψα, ξοδεύω → ξόδεψα, δουλεύω → δούλεψα. В -εύω буквы ευ звучат [эв], а в аористе εψ — [эпс]: ταξιδεύω [таксиðэ́во] → ταξίδεψα [такси́ðэпса].

      Правило работает не всегда. Некоторые глаголы на -ζω получают -ξα: αλλάζω → άλλαξα, ταιριάζω → ταίριαξα. Некоторые на -άω — -ασα: περνάω → πέρασα, κερνάω → κέρασα. Глаголы на -νω (кроме -ώνω) в эти правила не входят: κλείνω → έκλεισα, φτάνω → έφτασα. Поэтому основу аориста проверяйте по карточке — она всегда указана в формах.
    table:
      columns:
        - глагол кончается на
        - аорист
        - примеры
      rows:
        - - -ζω, -ώνω
          - -σα
          - ετοιμάζω → ετοίμασα, χαλαρώνω → χαλάρωσα
        - - -άω, -ώ
          - -ησα
          - κολυμπάω → κολύμπησα, μιλάω → μίλησα
        - - -γω, -χω, -χνω, -κω
          - -ξα
          - ανοίγω → άνοιξα, ψάχνω → έψαξα
        - - -πω, -βω, -φω, -εύω
          - -ψα
          - γράφω → έγραψα, ξοδεύω → ξόδεψα
        - - особые случаи
          - смотрите карточку
          - αλλάζω → άλλαξα, περνάω → πέρασα, κλείνω → έκλεισα
  - type: explanation
    id: stress
    title: Ударение и έ- в начале
    body: |-
      **Главное правило: в аористе ударение стоит на третьем слоге от конца.** Поэтому оно «отъезжает» назад по сравнению с настоящим временем: ε-τοι-μά-ζω → ε-τοί-μα-σα, χα-λα-ρώ-νω → χα-λά-ρω-σα, ξο-δεύ-ω → ξό-δε-ψα.

      В формах «мы» и «вы» слогов на один больше, и ударение сдвигается на слог ближе к концу, чтобы остаться третьим от конца: ταξίδεψα, но ταξι-δέ-ψα-με; κολύμπησα, но κολυ-μπή-σα-τε.

      **Приращение έ-.** А что, если в форме всего два слога? У γράφω основа аориста γραψ- и окончание -α дают только два слога — третьего от конца нет. Тогда в начало добавляется **έ-**, и ударение падает на него: **έ-γρα-ψα**. Так же ψάχνω → **έψαξα**, κλείνω → **έκλεισα**, δείχνω → **έδειξα**, στρίβω → **έστριψα**, φτάνω → **έφτασα**.

      В формах «мы» и «вы» слогов уже три, и έ- **не нужно**: **γράψαμε**, **ψάξατε**, **κλείσαμε**. У «они» έ- есть (έγραψαν), а у разговорного варианта на -ανε его нет (γράψανε) — там снова три слога.

      Длинным глаголам έ- никогда не нужен: ταξίδεψα, ετοίμασα, κολύμπησα. Глаголы, которые начинаются с гласной, тоже обходятся без него: в их форме «я» уже три слога, и ударение просто стоит на третьем от конца — ανοίγω → **άνοιξα**, αλλάζω → **άλλαξα**, αγοράζω → **αγόρασα**.

      **Частые ошибки:** έ- в формах «мы» и «вы» (правильно **γράψαμε** — там уже три слога); форма «я» без έ- у короткого глагола (правильно **έγραψα**); ευ вместо εψ (правильно **ταξίδεψα**); ударение в формах «мы» и «вы» на том же слоге, что в форме «я» (правильно **ταξιδέψαμε**).
    table:
      columns:
        - лицо
        - γράφω
        - ψάχνω
        - κλείνω
        - ανοίγω
      rows:
        - - εγώ
          - έγραψα
          - έψαξα
          - έκλεισα
          - άνοιξα
        - - εσύ
          - έγραψες
          - έψαξες
          - έκλεισες
          - άνοιξες
        - - αυτός, αυτή
          - έγραψε
          - έψαξε
