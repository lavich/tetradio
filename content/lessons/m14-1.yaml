blocks:
  - type: explanation
    id: aorist
    title: Аорист — прошедшее время
    body: |-
      До сих пор все глаголы стояли в настоящем времени: **Ταξιδεύω** πολύ — «Я много путешествую». Чтобы рассказать, что было, нужен **аорист** (ο αόριστος) — главное прошедшее время греческого языка: **Πέρσι ταξίδεψα** στην Κρήτη — «В прошлом году я ездил(а) на Крит».

      Аорист называет действие, которое произошло и закончилось: **Χθες έγραψα** στη Μαρία — «Вчера я написал(а) Марии». Чаще всего он соответствует русскому совершенному виду («написал, купил, посетил»), но и о поездке целиком говорят аористом: **Κολυμπήσαμε** στη θάλασσα — «Мы плавали в море». Для долгих и повторявшихся действий в прошлом есть другое время, его вы узнаете в модуле 22. Пока рассказывайте о прошлом аористом.

      Как образуется аорист: у глагола особая **основа аориста**, а к ней — одни и те же окончания для всех правильных глаголов: **-α, -ες, -ε, -αμε, -ατε, -αν**. Основу вы уже видели в карточках: там, где написано «аор. ταξίδεψα», стоит форма «я» в аористе.

      Для «они» есть и разговорный вариант на **-ανε**: ταξίδεψαν = ταξιδέψανε. Отрицание и вопрос — как в настоящем времени: **Δεν** κολύμπησα. **Ταξίδεψες** πέρσι;
    table:
      columns:
        - лицо
