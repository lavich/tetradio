  - type: explanation
    id: time
    title: Когда — χθες, προχθές, πέρσι, πριν από
    body: |-
      С аористом чаще всего стоят слова прошедшего времени. Обычно их ставят в начало предложения: **Χθες** κολύμπησα στη θάλασσα. **Πέρσι** ταξιδέψαμε στην Ελλάδα.

      **Χθες** — «вчера», **προχθές** — «позавчера», **πέρσι** — «в прошлом году». Пишут и произносят также **χτες**, **προχτές** — это одно и то же. Части дня добавляются, как к σήμερα и αύριο: **χθες το πρωί**, **χθες το βράδυ**, **προχθές το απόγευμα**.

      **Ο περασμένος** — «прошлый». Это прилагательное, оно согласуется с существительным и стоит в винительном падеже (модуль 08) — как в τη Δευτέρα, το πρωί: **την περασμένη εβδομάδα** — на прошлой неделе, **τον περασμένο μήνα** — в прошлом месяце, **το περασμένο Σάββατο** — в прошлую субботу.

      **Πριν από** + винительный падеж (модуль 10) значит «назад», если после него — отрезок времени: **πριν από δύο μέρες** — два дня назад, **πριν από ένα χρόνο** — год назад, **πριν από τρία χρόνια** — три года назад. В разговоре από часто опускают: πριν δύο μέρες. Если после πριν από — событие, это «до, перед»: **πριν από το ταξίδι** — перед поездкой.

      Сравните настоящее время и аорист. **Κάθε μέρα κολυμπάω.** — «Я плаваю каждый день» (привычка). **Χθες κολύμπησα.** — «Вчера я поплавал(а)» (одно событие в прошлом).
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - χθες (χτες)
          - вчера
        - - χθες το βράδυ
          - вчера вечером
        - - προχθές (προχτές)
