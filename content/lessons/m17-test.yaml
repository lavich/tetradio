title: Контрольная модуля 17
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Главное в грамматике — слабые местоимения: με πονάει (винительный падеж), μου/σου — «мне/тебе», место перед глаголом и после повелительной формы.
  - type: reading
    id: stavroula
    title: Ήμουν άρρωστη!
    text: |-
      Γεια σου, Λένα!

      Συγγνώμη, δεν σου έγραψα όλη την εβδομάδα. Ήμουν άρρωστη! Τη Δευτέρα άρχισα να βήχω και την Τρίτη είχα γρίπη και πονοκέφαλο. Έμεινα τέσσερις μέρες στο κρεβάτι. Ο γιατρός μου είπε να πίνω πολύ νερό και τσάι και να ξεκουραστώ.

      Τώρα είμαι καλύτερα, αλλά νιώθω ακόμα λίγο κουρασμένη. Την Παρασκευή γύρισα στη δουλειά. Και ξέρεις κάτι; Έκοψα το τσιγάρο! Δεν κάπνισα όλη την εβδομάδα και τώρα δεν θέλω τσιγάρο.

      Θέλεις να περπατήσουμε στην παραλία την Κυριακή; Πάρε με τηλέφωνο!

      Φιλιά,
      Σταυρούλα
  - type: exercise
    id: stavroula-tf
    about: stavroula
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Σταυρούλα ήταν άρρωστη.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Η Σταυρούλα άρχισε να βήχει την Τρίτη.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Βήχω — с понедельника (Τη Δευτέρα), грипп — со вторника.
      - id: q3
        prompt: Η Σταυρούλα έμεινε δύο μέρες στο κρεβάτι.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τέσσερις μέρες — четыре дня.
      - id: q4
        prompt: Ο γιατρός της είπε να πίνει πολύ νερό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Τώρα η Σταυρούλα νιώθει πολύ καλά και δεν είναι κουρασμένη.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Νιώθω ακόμα λίγο κουρασμένη — ещё немного устала.
      - id: q6
        prompt: Η Σταυρούλα έκοψε το τσιγάρο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: listening
    id: call
    title: Δεν νιώθω καλά
    plays: 2
    transcript:
      - speaker: Ρούλα
        text: Γεια σου, Θανάση! Πού είσαι; Σε περιμένω στο καφενείο!
      - speaker: Θανάσης
        text: Γεια σου, Ρούλα. Συγγνώμη, σήμερα δεν μπορώ να έρθω. Δεν νιώθω καλά.
      - speaker: Ρούλα
        text: Τι έπαθες;
      - speaker: Θανάσης
        text: Με πονάει το στομάχι μου από το πρωί. Χθες το βράδυ έφαγα πολύ σε μια ταβέρνα.
      - speaker: Ρούλα
        text: Ζαλίζεσαι;
      - speaker: Θανάσης
        text: Λίγο, όταν σηκώνομαι. Και είμαι πολύ κουρασμένος.
      - speaker: Ρούλα
        text: Πρέπει να ξεκουραστείς. Θέλεις να σου φέρω κάτι από το φαρμακείο;
      - speaker: Θανάσης
        text: Όχι, ευχαριστώ. Η αδελφή μου έρχεται το απόγευμα.
      - speaker: Ρούλα
        text: Εντάξει. Περαστικά! Πάρε με τηλέφωνο αύριο.
      - speaker: Θανάσης
        text: Ευχαριστώ, Ρούλα. Τα λέμε!
  - type: exercise
    id: call-choice
    about: call
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Где Рула ждёт Танасиса?
        options:
          - в кафенио
          - в таверне
          - в аптеке
        answer: в кафенио
        explanation: Σε περιμένω στο καφενείο. В таверне Танасис был вчера.
      - id: q2
        prompt: Что болит у Танасиса?
        options:
          - желудок
          - голова
          - горло
        answer: желудок
      - id: q3
        prompt: Почему?
        options:
          - вчера вечером он много съел
          - он плохо спал
          - у него грипп
        answer: вчера вечером он много съел
        explanation: Χθες το βράδυ έφαγα πολύ σε μια ταβέρνα.
      - id: q4
        prompt: Когда у него кружится голова?
        options:
          - когда он встаёт
          - когда он ест
          - весь день
        answer: когда он встаёт
        explanation: Λίγο, όταν σηκώνομαι.
      - id: q5
        prompt: Кто придёт к Танасису?
        options:
          - его сестра
          - Рула
          - врач
        answer: его сестра
        explanation: Рула предлагает помощь, но Танасис отвечает «Όχι» — придёт сестра.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: — Ξέρεις τη Σοφία; — Ναι, ___ ξέρω.
        options:
          - την
          - του
          - τον
        answer: την
      - id: q2
        prompt: — Πού είναι τα κλειδιά; — Δεν ___ βρίσκω.
        options:
          - τα
          - τους
          - το
        answer: τα
      - id: q3
        prompt: ___ πονάει το κεφάλι μου.
        options:
          - Με
          - Μου
          - Μας
        answer: Με
        explanation: "С πονάω — винительный падеж: με πονάει."
      - id: q4
        prompt: Με ___ τα πόδια μου.
        options:
          - πονάει
          - πονάνε
          - πονάω
        answer: πονάνε
      - id: q5
        prompt: «Скажи мне!»
        options:
          - Πες μου!
          - Μου πες!
          - Πες με!
        answer: Πες μου!
      - id: q6
        prompt: Θέλω να ___ δω αύριο. (тебя)
        options:
          - σε
          - σου
          - εσύ
        answer: σε
      - id: q7
        prompt: "Η Μαρία δεν είναι καλά: ___ πονάει η κοιλιά της."
        options:
          - την
          - της
          - τον
        answer: την
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το κεφάλι
      - το δόντι
      - η πλάτη
      - το γόνατο
      - η καρδιά
      - το αυτί
      - ο βήχας
      - η γρίπη
      - ο ύπνος
    items:
      - id: m1
        prompt: голова
        answer: το κεφάλι
      - id: m2
        prompt: зуб
        answer: το δόντι
      - id: m3
        prompt: спина
        answer: η πλάτη
      - id: m4
        prompt: колено
        answer: το γόνατο
      - id: m5
        prompt: кашель
        answer: ο βήχας
      - id: m6
        prompt: сон
        answer: ο ύπνος
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Друг говорит «Έχω πονόλαιμο».
        options:
          - Περαστικά!
          - Καλή όρεξη!
          - Χάρηκα πολύ.
        answer: Περαστικά!
      - id: q2
        prompt: Вы хотите узнать, как друг себя чувствует.
        options:
          - Πώς νιώθεις;
          - Πού μένεις;
          - Πώς σε λένε;
        answer: Πώς νιώθεις;
      - id: q3
        prompt: Вы пишете начальнику, что сегодня не придёте.
        options:
          - Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.
          - Τα λέμε αύριο στις έξι.
          - Πέρασα τις εξετάσεις!
        answer: Σήμερα δεν μπορώ να έρθω, είμαι άρρωστος.
      - id: q4
        prompt: Вам предлагают торт, но вы на диете.
        options:
          - Όχι, ευχαριστώ, κάνω δίαιτα.
          - Καλή όρεξη!
          - Έκοψα το τσιγάρο.
        answer: Όχι, ευχαριστώ, κάνω δίαιτα.
      - id: q5
        prompt: Друг кашляет и очень устал. Ваш совет?
        options:
          - Πρέπει να ξεκουραστείς.
          - Είμαι καλύτερα τώρα.
          - Τι έπαθες;
        answer: Πρέπει να ξεκουραστείς.
