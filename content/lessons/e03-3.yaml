blocks:
  - type: explanation
    id: formula
    title: "Схема ответа: ситуация, роль, шаги, трудность, результат"
    body: |-
      **Tell me about a project you're proud of** — вопрос, на котором интервьюер проверяет сразу три вещи: можете ли вы объяснить сложное просто, что именно сделали сами и как справляетесь с трудностями. Ответ длится около минуты и идёт по пяти шагам.

      **1. Ситуация и цель** — одно-два предложения: **Let me tell you about a project I'm really proud of. The goal was to cut the checkout time in half.** Фон — past continuous или past perfect: *I was working on the payment team when…*

      **2. Ваша роль** — что сделали лично вы: **I took ownership of the whole migration. My part was designing the data model and the API.** «Мы» и «я» разделяйте: интервьюера интересует ваш вклад.

      **3. Шаги** — past simple со связками: **First, we talked to the users. Then we built a prototype.**

      **4. Трудность и решение** — одна: **We ran into a problem with the database. We solved it by splitting the table.** Трудность показывает, как вы думаете, поэтому её не скрывают.

      **5. Результат и вывод** — число и одна мысль о том, что вы изменили бы: **The result was a faster, more stable product. Looking back, I'd do the discovery phase differently.**
    table:
      columns:
        - шаг
        - время и связки
        - пример
      rows:
        - - ситуация и цель
          - past simple, past continuous для фона
          - The goal was to cut the checkout time in half.
        - - роль
          - past simple, I took, my part was
          - I took ownership of the whole migration.
        - - шаги
          - past simple, first, then, after that
          - First, we talked to the users.
        - - трудность
          - past simple, ran into, solved it by
          - We ran into a problem with the database.
        - - результат
          - past simple, числа, looking back
          - The result was a faster, more stable product.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: good-answer
    title: Подходящий ответ
    instruction: Выберите вариант, который подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: С чего начать ответ на «Tell me about a project you're proud of»?
        options:
          - Let me tell you about a project I'm really proud of.
          - I have worked on many projects, and all of them were fine.
          - Which project do you mean?
        answer: Let me tell you about a project I'm really proud of.
        explanation: Начало называет, о чём пойдёт рассказ. Общий ответ про все проекты не конкретен, встречный вопрос откладывает ответ.
      - id: q2
        prompt: Как назвать свой вклад в командном проекте?
        options:
          - My part was designing the data model and the API.
          - We did everything together.
          - The manager decided everything.
        answer: My part was designing the data model and the API.
        explanation: Интервьюеру нужен ваш конкретный вклад.
      - id: q3
        prompt: Как рассказать о трудности?
        options:
          - We ran into a problem with the database. We solved it by splitting the table.
          - There were no problems at all.
          - The database was terrible.
        answer: We ran into a problem with the database. We solved it by splitting the table.
        explanation: Трудность и способ её решения вместе показывают, как вы работаете.
      - id: q4
        prompt: Чем закончить ответ?
        options:
          - Looking back, I'd do the discovery phase differently.
          - And that's all, thank you.
          - I don't know what else to say.
        answer: Looking back, I'd do the discovery phase differently.
        explanation: Вывод о том, что вы бы изменили, показывает, что вы умеете учиться на проектах.
  - type: exercise
    id: tense-fix
    title: Какое предложение верно
    instruction: Выберите верный вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы работали над платёжным сервисом, когда изменились требования.
        options:
          - I was working on the payment service when the requirements changed.
          - I have worked on the payment service when the requirements changed.
          - I work on the payment service when the requirements changed.
        answer: I was working on the payment service when the requirements changed.
        explanation: Процесс шёл, когда случилось событие, — past continuous и past simple.
      - id: q2
        prompt: Команда уже сделала прототип до вашего прихода.
        options:
          - By the time I joined, the team had already built a prototype.
          - By the time I joined, the team already builds a prototype.
          - By the time I joined, the team has already built a prototype.
        answer: By the time I joined, the team had already built a prototype.
        explanation: С by the time раньше случившееся действие стоит в past perfect.
      - id: q3
        prompt: Вы запустили проект в марте после долгих трудностей.
        options:
          - Eventually, we launched in March.
          - Eventually, we have launched in March.
          - Eventually, we were launching in March.
        answer: Eventually, we launched in March.
        explanation: Шаг сюжета — past simple, а March называет момент.
      - id: q4
        prompt: Вы рассказываете, что решили проблему, разделив таблицу.
        options:
          - We solved it by splitting the table.
          - We solved it by split the table.
          - We solved it for splitting the table.
        answer: We solved it by splitting the table.
        explanation: После предлога by глагол принимает форму с -ing.
  - type: explanation
    id: writing-how
    title: Описание проекта для резюме
    body: |-
      Письменная задача — описание одного проекта, 60–100 слов, для раздела Experience или для письма рекрутеру. Схема та же, что в ответе, но плотнее: задача, роль, что сделано, результат с числом.

      Пишите от первого лица, без приветствия. Формулы: 1) что за проект и когда — **I led the backend of a returns portal in 2023**; 2) фон и ваша роль — **Support agents were handling… I designed…**; 3) шаги и порядок — **By the time we launched, we had tested it with…**; 4) результат — **cut… from… to…, reduced… by…**; 5) вывод — **I learned…**.

      Для формального текста подходят нейтральные слова: *delivered, reduced, led*. Оценочные слова вроде *amazing* и *great* в резюме не нужны: результат убедительнее выражается числом.

      Проверьте себя: past continuous только для фона, past perfect — для того, что было раньше точки отсчёта, остальное — past simple; у результата есть число и предлог *by* или *from … to*.
