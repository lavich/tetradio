  - type: writing
    id: project
    register: formal
    prompt: "Опишите один проект для резюме или письма рекрутеру (60–100 слов): что за проект, ваша роль, что сделали по шагам, результат с числом и вывод."
    words: { min: 60, max: 100 }
    model: I led the backend of a returns portal for an online shop in 2023. Support agents were handling about 300 return requests a week, and each request took two days. I designed the API and the data model, and we built a prototype in two weeks. By the time we went live in April, we had already tested it with ten customers. The portal cut the average return time from two days to four hours and reduced support requests by 60 percent. I learned how important early user feedback is.
    criteria:
      - 60–100 слов, от первого лица, без приветствия и подписи
      - "Есть части: что за проект и когда, ваша роль, шаги, результат с числом, вывод"
      - "Past continuous только для фона (were handling), past perfect — для того, что было раньше точки отсчёта (had tested), остальное — past simple"
      - "Результат выражен числом с предлогом by или from … to …; оценочных слов вроде amazing и great нет"
      - Хотя бы три слова или оборота модуля (scope, prototype, go live, hotfix, adoption, baseline, by the time, eventually…)
  - type: explanation
    id: speaking-how
    title: Как записывать ответ
    body: |-
      Третий ответ вашего **банка ответов** — Tell me about a project you're proud of. Его просят почти на каждом собеседовании, а хорошо выбранный проект годится и для других вопросов.

      1) Выберите проект, где ваша роль ясна и есть результат с числом. 2) Выпишите ключевые слова по пяти шагам схемы, не целый текст. 3) Запишите ответ и уложитесь в 60 секунд. 4) Переслушайте и сверьте с образцом и критериями. 5) Запишите ещё раз.

      Если потеряли мысль, используйте связку: **Let me think… / So, to go back…**. Исправленная на ходу ошибка во времени допустима, долгая пауза мешает слушателю.
  - type: speaking
    id: proud-project
    part: monologue
    prompt: "Интервьюер: «Tell me about a project you're proud of.» Ответьте за 60 секунд на примере своего проекта: цель, ваша роль, шаги со связками, трудность и решение, результат с числом."
    seconds: 60
    model: "Let me tell you about a project I'm really proud of. The goal was to cut the checkout time in half. I was working on the payment team when the product manager asked us to redesign the checkout. I took ownership of the whole migration. First, we talked to the users and found the main pain point. Then we built a prototype. By the time we showed it to the managers, we had already tested it with ten customers. We ran into a problem with the database, and we were running behind schedule for two weeks. We solved it by splitting the table. Eventually, we launched in March. The result was a faster, more stable product: checkout time went from six minutes to three. Looking back, I'd do the discovery phase differently. I'm proud of it because real users benefit from it every day."
    criteria:
      - "Порядок: цель — роль — шаги — трудность и решение — результат — вывод"
      - Около 60 секунд, без долгих пауз; связки First, Then, Eventually, Looking back
      - Past continuous для фона, past perfect для того, что было раньше, past simple для шагов
      - Названа ваша личная роль и один результат с числом
      - Трудность названа спокойно, без обвинений коллег и компании
  - type: speaking
    id: your-role
    part: interview
    prompt: "Интервьюер уточняет: «What was your personal contribution to that project?» Ответьте за 30 секунд: ваша роль, одна задача, которую вы сделали сами, и что это изменило."
    seconds: 30
    model: "I was the only backend developer on the project. My part was designing the data model and the API. I also set up the migration and led the weekly check-ins. Thanks to that, I could ship changes every week, and nobody was blocked for more than a day."
    criteria:
      - Роль названа одной фразой (I was…, My part was…)
      - Есть конкретная задача, сделанная лично, и её влияние на проект
      - Вклад отделён от командной работы — «я» и «мы» не смешаны
      - Названо, что изменила ваша работа
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "While I ___ the API, my colleague was writing the tests. (одновременно)"
        options: [was designing, designed]
        answer: was designing
        explanation: Параллельный процесс после while — past continuous.
      - id: q2
        prompt: By the time the client called, we ___ the bug.
        options: [had fixed, fixed]
        answer: had fixed
        explanation: Исправление закончилось раньше звонка — past perfect.
      - id: q3
        prompt: It's only a ___ until we release the real fix.
        options: [workaround, retrospective, kick-off]
        answer: workaround
      - id: q4
        prompt: After the failure, we held a ___ to understand what went wrong.
        options: [retrospective, roadmap, workaround]
        answer: retrospective
      - id: q5
        prompt: "Conversion went up ___ fifteen percent. (рост на пятнадцать процентов)"
        options: [by, to, for]
        answer: by
      - id: q6
        prompt: "___, we launched in March, after several delays. (в конце концов)"
        options: [Eventually, Meanwhile, At first]
        answer: Eventually
