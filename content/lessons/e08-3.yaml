  - type: writing
    id: reply
    register: formal
    prompt: "Вы получили письмо Katarina Lind из предыдущего урока. Напишите ответ рекрутеру (80–120 слов): благодарность, интерес к должности, ожидания по зарплате (вилка и gross или net), срок предупреждения, удобное время для звонка, вежливая просьба подтвердить его, подпись."
    words: { min: 80, max: 120 }
    model: |-
      Dear Ms Lind,

      Thank you for reaching out and for sharing the conditions. I am very interested in the Senior Backend Engineer role at Fennel Systems. My salary expectations are between ninety and a hundred thousand euros gross per year, and I am open to discussing the details. My notice period is two months, but I can negotiate an earlier start with my employer, so I could start in early March. I would be available for a call on Thursday or Friday afternoon. Could you please confirm the time by email? Thank you for your time. I look forward to hearing from you.

      Kind regards,
      Daniel Brooks
    criteria:
      - 80–120 слов, есть обращение, благодарность и подпись
      - Названа вилка зарплаты с пометкой gross или net
      - Указан срок предупреждения и возможная дата выхода
      - Есть вежливая просьба с could или would you mind
      - Названо удобное время для звонка
      - Формальный стиль без сокращений и разговорных слов
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Восьмой ответ вашего **банка ответов** — вопрос о зарплате: **What are your salary expectations?** Его задают на звонках рекрутера, и ответ состоит из трёх частей: вилка с пометкой gross или net, готовность обсуждать всё вознаграждение и просьба рассказать о роли подробнее. К нему добавляется второй вопрос о сроках и формате: **Could you tell me about your notice period and how you like to work?**

      1) Назовите вилку и сумму до вычета налогов или после. 2) Скажите, что обсуждаете всё вознаграждение: оклад, опционы и льготы. 3) Для второго вопроса назовите срок предупреждения, возможную дату выхода и желаемый формат работы. 4) Запишите ответ, переслушайте, сверьте с образцом и критериями.

      Сцена в конце урока повторяет звонок рекрутера целиком. Реплики рекрутера записаны на следующей странице; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: salary
    part: interview
    prompt: "Рекрутер спрашивает: «What are your salary expectations?» Ответьте за 60 секунд: вилка с пометкой gross или net, готовность обсуждать всё вознаграждение, вопрос о роли."
    seconds: 60
    model: "I'm looking for something in the range of ninety to a hundred thousand euros gross per year. That is based on six years of experience and on what I see for senior backend roles. I'm open to discussing the whole compensation, including stock options, so the base salary is negotiable. I'd also like to understand the role better before we agree on a final number."
    criteria:
      - Названа вилка с пометкой gross или net
      - Сказано, что обсуждается всё вознаграждение
      - Есть не меньше двух устойчивых фраз урока
      - Ответ укладывается в 60 секунд
  - type: speaking
    id: terms
    part: monologue
    prompt: "Рекрутер продолжает: «Could you tell me about your notice period and how you like to work?» Ответьте за 60 секунд: срок предупреждения, возможная дата выхода, формат работы и часовой пояс."
    seconds: 60
    model: "My notice period is two months, but I can negotiate an earlier start with my employer, so I could start in early March. I like a hybrid setup, with a couple of days in the office and the rest from home. I live in Manchester, so the time difference with Berlin is only one hour, and the overlap is not a problem."
    criteria:
      - Назван срок предупреждения и возможная дата выхода
      - Назван желаемый формат работы
      - Упомянут часовой пояс или пересечение рабочих часов
      - Ответ укладывается в 60 секунд
