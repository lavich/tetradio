blocks:
  - type: explanation
    id: scheme
    title: Звонок рекрутера в шести шагах
    body: |-
      Рекрутер звонит, чтобы выяснить три вещи: интересна ли вам должность, подходят ли ваши условия и когда вы можете двигаться дальше. Разговор идёт по шагам, и на каждом хватает одной-двух фраз.

      **1. Начало.** Рекрутер спрашивает, удобно ли говорить: **Is now a good time to talk?** Поблагодарите и ответьте: **Thanks for reaching out. Yes, I have about twenty minutes.**

      **2. Интерес.** Скажите, что вам интересно, и спросите о роли: **I'm open to new opportunities. Could you tell me more about the role?**

      **3. Деньги.** На вопрос **What salary range are you looking for?** назовите вилку и уточните, gross это или net: **I'm looking for something in the range of ninety to a hundred thousand gross.** Если не готовы называть цифру, попросите отложить: **Could we discuss compensation at a later stage?**

      **4. Сроки.** Назовите срок предупреждения и возможную дату выхода: **My notice period is two months. I can negotiate an earlier start with my employer.**

      **5. Формат.** Спросите о формате и часовом поясе: **Is the role remote or hybrid? Would I be working with a team in a different time zone?**

      **6. Следующий шаг.** Узнайте, как идёт процесс, и попросите детали письменно: **How long does the process usually take? Could you please confirm the details by email?** В конце: **Thank you for your time. I look forward to hearing from you.**
    table:
      columns:
        - шаг
        - язык
        - пример
      rows:
        - - начало
          - Thanks for…; Yes, I have…
          - Thanks for reaching out. Yes, I have about twenty minutes.
        - - интерес
          - I'm open to…; Could you tell me…?
          - I'm open to new opportunities.
        - - деньги
          - I'm looking for something in the range of…
          - I'm looking for something in the range of ninety to a hundred thousand.
        - - сроки
          - My notice period is…; I could start…
          - I could start in early March.
        - - формат
          - Is the role…?; Would I be working…?
          - Is the role remote or hybrid?
        - - следующий шаг
          - How long…?; Should I prepare…?
          - Should I prepare anything for the next round?
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: good-structure
    title: Подходящая реакция
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: "Рекрутер звонит и спрашивает: «Is now a good time to talk?» Какой ответ подходит?"
        options:
          - Yes, I have about twenty minutes.
          - My notice period is two months.
          - How long does the process usually take?
        answer: Yes, I have about twenty minutes.
        explanation: На вопрос о времени отвечают о времени.
      - id: q2
        prompt: Вы отвечаете рекрутеру, который написал вам первым. Какая фраза подходит для благодарности?
        options:
          - Thanks for reaching out.
          - I'd be happy to do a technical interview.
          - I'd like some time to review the details.
        answer: Thanks for reaching out.
        explanation: Reach out — написать или позвонить первым.
      - id: q3
        prompt: Вы хотите отложить разговор о деньгах. Какая фраза подходит?
        options:
          - Could we discuss compensation at a later stage?
          - What salary range are you looking for?
          - My notice period is two months.
        answer: Could we discuss compensation at a later stage?
      - id: q4
        prompt: Вы хотите сказать, что можете выйти на работу раньше срока. Какая фраза подходит?
        options:
          - I can negotiate an earlier start with my employer.
          - Should I prepare anything for the next round?
          - Is now a good time to talk?
        answer: I can negotiate an earlier start with my employer.
      - id: q5
        prompt: Вы хотите узнать, нужно ли готовиться к следующему этапу. Какая фраза подходит?
        options:
          - Should I prepare anything for the next round?
          - How long does the process usually take?
          - Could you please confirm the details by email?
        answer: Should I prepare anything for the next round?
      - id: q6
        prompt: Вы хотите получить условия в письменном виде. Какая фраза подходит?
        options:
          - Could you please confirm the details by email?
          - I'd like some time to review the details.
          - I'm open to new opportunities.
        answer: Could you please confirm the details by email?
        explanation: Просьба подтвердить условия по почте фиксирует их письменно.
  - type: exercise
    id: modals-fix
    title: Модальные глаголы в разговоре
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: "By my contract, I ___ give two months' notice. (обязанность)"
        options: [have to, has to, must to]
        answer: have to
        explanation: Обязанность из договора выражается глаголом have to.
      - id: q2
        prompt: "___ you mind sending me the offer letter?"
        options: [Would, Could, Should]
        answer: Would
        explanation: Устойчивая вежливая просьба — Would you mind + форма на -ing; Could you mind и Should you mind ошибочны.
      - id: q3
        prompt: "I'm sorry, I ___ to check my calendar first."
        options: [have, has, to have]
        answer: have
        explanation: После I стоит have, затем to; формы I has to и I to have to ошибочны.
      - id: q4
        prompt: "You ___ to relocate if you work remotely. (не обязаны)"
        options: [don't have, haven't, mustn't have]
        answer: don't have
        explanation: "Отрицание строится с do: don't have to."
      - id: q5
        prompt: "I'd ___ to discuss it with my manager first. (мне понадобится)"
        options: [need, needing, needed]
        answer: need
        explanation: После I'd (I would) стоит начальная форма need.
      - id: q6
        prompt: "Could you ___ me the details by email?"
        options: [send, to send, sending]
        answer: send
        explanation: После could стоит начальная форма глагола без to.
  - type: explanation
    id: writing-how
    title: Ответ рекрутеру
    body: |-
      Письменная задача — ответ на письмо Katarina Lind из предыдущего урока, 80–120 слов, в формальном стиле.

      Схема: 1) обращение (**Dear Ms Lind,**) и благодарность (**Thank you for reaching out**); 2) интерес к должности; 3) ожидания по зарплате: вилка и **gross** или **net**; 4) срок предупреждения и возможная дата выхода; 5) удобное время для звонка и просьба подтвердить его (**Could you please confirm…**); 6) завершение и подпись (**Kind regards**).

      В формальном письме сокращения (*I'd, don't*) не используются: пишите **I would, do not**. Проверьте себя: названа вилка с пометкой gross или net, указан срок предупреждения, есть вежливая просьба с **could**, письмо укладывается в 80–120 слов.
