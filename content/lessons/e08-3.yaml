  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вам звонит рекрутер Katarina из Fennel Systems. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику поблагодарите и подтвердите, что можно говорить. На вторую скажите, что ищете в новой роли. На третью назовите вилку и пометку gross или net. На четвёртую назовите срок предупреждения и дату выхода. На пятую ответьте о формате и часовом поясе. В конце задайте вопрос о процессе. Вся ваша часть — 120 секунд, каждая реплика — одна-три фразы.
    seconds: 120
    model: |-
      Katarina: Hello, this is Katarina from Fennel Systems. Thanks for taking my call. Is now a good time to talk?
      You: Hello Katarina, thanks for reaching out. Yes, I have about twenty minutes.
      Katarina: Great. Could you tell me what you are looking for in your next role?
      You: I'm open to new opportunities, and I would like to take more responsibility for system design. Could you tell me more about the role?
      Katarina: I see. What salary range are you looking for?
      You: I'm looking for something in the range of ninety to a hundred thousand euros gross, and I'm open to discussing the whole compensation.
      Katarina: Thank you. What is your notice period, and when could you start?
      You: My notice period is two months. I can negotiate an earlier start with my employer, so I could start in early March.
      Katarina: Would you be comfortable with a hybrid setup, with two days a week in our Berlin office?
      You: Yes, that works for me. I live in Manchester, so the time difference is only one hour, and the overlap is not a problem.
      Katarina: Good. The next steps are a take-home task and two interviews. Would you like to ask anything about the process?
      You: Yes. How long does the process usually take, and should I prepare anything for the next round?
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — одна-три фразы
      - Вилка названа с пометкой gross или net
      - Назван срок предупреждения и возможная дата выхода
      - Ответ о формате работы и часовом поясе дан по смыслу
      - Вопрос о процессе задан в конце с вежливой формой
      - Реплики рекрутера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "Could you tell me what the salary ___?"
        options: [is, is it, does it be]
        answer: is
        explanation: В косвенном вопросе порядок слов как в утверждении.
      - id: q2
        prompt: "The offer letter ___ to every candidate by the HR team. (отправляется)"
        options: [is sent, sends, is sending]
        answer: is sent
        explanation: Действие совершается над письмом, поэтому нужен passive.
      - id: q3
        prompt: "I was preparing for the interview when the recruiter ___."
        options: [called, has called, was call]
        answer: called
        explanation: Короткое действие внутри длительного — past simple.
      - id: q4
        prompt: "Our new service is ___ than the old one. (быстрее)"
        options: [faster, more fast, fastest]
        answer: faster
        explanation: Односложное прилагательное образует сравнительную степень с -er.
      - id: q5
        prompt: "I ___ a part-time master's degree in September. (договорённость)"
        options: [am starting, might to start, will to start]
        answer: am starting
        explanation: План с датой — present continuous.
      - id: q6
        prompt: "I ___ in this role for two years. (до сих пор)"
        options: [have been, am, was]
        answer: have been
        explanation: Срок for two years и связь с настоящим — present perfect.
