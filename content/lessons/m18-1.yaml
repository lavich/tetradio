  - type: exercise
    id: words-gap
    title: Врач, пациент, советы
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - εξετάζει
      - μετράω
      - ξάπλωσε
      - αποφεύγω
      - ανησυχείς
      - προσέχεις
      - σοβαρό
      - συνταγή
      - θερμόμετρο
    items:
      - id: g1
        prompt: Ο γιατρός ___ τον ασθενή στο ιατρείο.
        answer: εξετάζει
      - id: g2
        prompt: Κάθε βράδυ ___ τον πυρετό μου.
        answer: μετράω
      - id: g3
        prompt: Είσαι πολύ κουρασμένη — ___ λίγο στον καναπέ.
        answer: ξάπλωσε
        explanation: Совет одному знакомому человеку, один раз — повелительное наклонение на «ты» от аориста ξάπλωσα.
      - id: g4
        prompt: Κάνω δίαιτα και ___ τα γλυκά. (τα γλυκά — сладкое)
        answer: αποφεύγω
      - id: g5
        prompt: Μην ___! Ο γιατρός λέει ότι δεν είναι τίποτα.
        answer: ανησυχείς
      - id: g6
        prompt: Περαστικά, Μαρία! Να ___!
        answer: προσέχεις
        explanation: "Να προσέχεις! — «Береги себя!»: так прощаются с больным или с тем, кто уезжает."
      - id: g7
        prompt: — Είναι κάτι ___, γιατρέ; — Όχι, είναι ένα απλό κρυολόγημα. (απλό — простое)
        answer: σοβαρό
        explanation: "Κάτι σοβαρό — средний род: «что-то серьёзное»."
  - type: explanation
    id: prepei
    title: Πρέπει να — совет врача
    body: |-
      Вы знаете **πρέπει να** из модуля 16: «надо, нужно». Πρέπει не меняется, лицо показывает второй глагол: **Πρέπει να μείνεις** στο κρεβάτι — «Тебе надо остаться в постели», **Πρέπει να μείνετε** — «Вам надо…». Это главный способ дать совет: так говорят и врач, и друг.

      Форму после να выбирайте так же, как в модуле 16:

      — **один раз, конкретное действие** — форма от основы аориста: Πρέπει **να πάρεις** ένα χάπι τώρα (πήρα → να πάρω). Πρέπει **να μετρήσετε** τον πυρετό (μέτρησα → να μετρήσω). Πρέπει **να μείνεις** στο κρεβάτι δύο μέρες (έμεινα → να μείνω; два дня — это один законченный отрезок).

      — **регулярно, постоянно** — настоящее время: Πρέπει **να παίρνεις** ένα χάπι κάθε πρωί. Πρέπει **να πίνεις** πολλά υγρά (υγρά — жидкость). Πρέπει **να προσέχεις**.

      **Δεν πρέπει να** — «нельзя, не надо»: **Δεν πρέπει να πίνεις** καφέ — «Тебе нельзя пить кофе».

      Совет можно дать и одним **να** без πρέπει — это мягче: **Να προσέχεις!** — «Береги себя!», **Να παίρνεις** το σιρόπι το πρωί και το βράδυ. Так же строится пожелание **Να γίνεις γρήγορα καλά!** — «Поправляйся скорее!» (γίνομαι, модуль 15; вежливо — Να γίνετε γρήγορα καλά!).
    table:
      columns:
        - один раз — от аориста
        - регулярно — настоящее время
      rows:
        - - Πρέπει να πάρεις ένα χάπι τώρα.
          - Πρέπει να παίρνεις ένα χάπι κάθε πρωί.
        - - Πρέπει να πιεις ένα ποτήρι νερό.
          - Πρέπει να πίνεις πολλά υγρά.
        - - Πρέπει να μετρήσεις τον πυρετό.
          - Πρέπει να μετράς τον πυρετό κάθε βράδυ.
        - - Πρέπει να μείνεις στο κρεβάτι δύο μέρες.
          - Πρέπει να προσέχεις.
  - type: exercise
    id: prepei-write
    title: Что надо сделать
    instruction: Напишите форму глагола после να. Один раз — форма от аориста, регулярно — настоящее время. Можно с να или без.
    format: text
    items:
      - id: q1
        prompt: Πρέπει να ___ στο κρεβάτι δύο μέρες. (εσύ · μένω)
        answer:
          - μείνεις
          - να μείνεις
        explanation: έμεινα → να μείνω, να μείνεις.
      - id: q2
        prompt: Πρέπει να ___ πολύ νερό κάθε μέρα. (εσύ · πίνω)
        answer:
          - πίνεις
          - να πίνεις
        explanation: Κάθε μέρα — регулярно, поэтому настоящее время.
      - id: q3
        prompt: Πρέπει να ___ ένα χάπι τώρα. (εσείς · παίρνω)
        answer:
          - πάρετε
          - να πάρετε
        explanation: πήρα → να πάρω, να πάρετε.
      - id: q4
        prompt: Αύριο το πρωί πρέπει να ___ τον πυρετό. (εγώ · μετράω)
        answer:
          - μετρήσω
          - να μετρήσω
        explanation: μέτρησα → να μετρήσω; один раз — завтра утром.
      - id: q5
        prompt: Ο Νίκος είναι κουρασμένος. Πρέπει να ___ λίγο τώρα. (αυτός · ξαπλώνω)
        answer:
          - ξαπλώσει
          - να ξαπλώσει
        explanation: ξάπλωσα → να ξαπλώσω, να ξαπλώσει.
  - type: explanation
    id: imperative
    title: Два повелительных наклонения — πάρε и παίρνε
    body: |-
      В модуле 12 вы строили повелительное наклонение от основы аориста: στρίψε — στρίψτε, πάρε — πάρτε. Это просьба сделать что-то **один раз**: **Πάρε ένα χάπι.** — «Прими (сейчас) таблетку». **Ξαπλώστε εδώ, παρακαλώ.** — «Лягте здесь, пожалуйста» (врач пациенту).

      У греческого есть и второе повелительное — от основы **настоящего времени**. Оно значит «делай регулярно, постоянно, продолжай делать»: **Πίνε πολλά υγρά.** — «Пей много жидкости» (весь день, всю болезнь). **Παίρνε το σιρόπι κάθε πρωί.** — «Принимай сироп каждое утро». **Πρόσεχε!** — «Будь осторожен!». Русский тоже различает: «выпей» — «пей».

      **Как образовать.** На «ты» — основа настоящего + **-ε**, ударение как можно дальше от конца: πίν-ω → **πίνε**, παίρν-ω → **παίρνε**, προσέχ-ω → **πρόσεχε**, αποφεύγ-ω → **απόφευγε**. На «вы» — просто форма настоящего времени: **πίνετε, παίρνετε, προσέχετε, αποφεύγετε**.

      У некоторых глаголов формы от аориста нужно запомнить: πίνω (ήπια) → **πιες — πιείτε** («выпей — выпейте»), μένω (έμεινα) → **μείνε — μείνετε**. Остальные строятся по правилу модуля 12: μέτρησα → **μέτρησε — μετρήστε**, ξάπλωσα → **ξάπλωσε — ξαπλώστε**.

      Врач пациенту обычно говорит на «вы»: **Πάρτε, Πίνετε, Ξαπλώστε.** Другу — на «ты»: **Πάρε, Πίνε, Ξάπλωσε.**
    table:
      columns:
        - глагол
        - один раз — «ты»
        - один раз — «вы»
        - регулярно — «ты»
        - регулярно — «вы»
      rows:
        - - παίρνω
          - πάρε
          - πάρτε
          - παίρνε
          - παίρνετε
        - - πίνω
          - πιες
          - πιείτε
          - πίνε
          - πίνετε
        - - προσέχω
          - πρόσεξε
          - προσέξτε
          - πρόσεχε
          - προσέχετε
        - - αποφεύγω
          - απόφυγε
          - αποφύγετε
          - απόφευγε
          - αποφεύγετε
        - - ξαπλώνω
          - ξάπλωσε
          - ξαπλώστε
          - ξάπλωνε
          - ξαπλώνετε
  - type: exercise
    id: aspect-choice
    title: Один раз или регулярно
    instruction: Выберите форму повелительного наклонения.
    format: choice
    items:
      - id: q1
        prompt: Έχεις πονοκέφαλο; ___ ένα χάπι τώρα.
        options:
          - Πάρε
          - Παίρνε
        answer: Πάρε
        explanation: Τώρα — один раз, поэтому форма от аориста.
      - id: q2
        prompt: Έχεις πυρετό. ___ πολλά υγρά κάθε μέρα.
        options:
          - Πιες
          - Πίνε
        answer: Πίνε
        explanation: Κάθε μέρα — регулярно, поэтому форма от настоящего времени.
      - id: q3
        prompt: Врач пациенту (на «вы») — ___ τον πυρετό σας, παρακαλώ.
        options:
          - Μέτρησε
          - Μετρήστε
        answer: Μετρήστε
        explanation: "На «вы» — -στε: μετρήστε. Μέτρησε — на «ты»."
      - id: q4
        prompt: Ο γιατρός λέει — ___ εδώ, παρακαλώ, να σας εξετάσω.
        options:
          - Ξαπλώστε
          - Ξάπλωσε
          - Ξαπλώσει
        answer: Ξαπλώστε
        explanation: Врач говорит на «вы» (σας) — ξαπλώστε. Ξαπλώσει — не повелительное, а форма «он, она» после να.
      - id: q5
        prompt: ___ τα φάρμακά σου κάθε πρωί και κάθε βράδυ.
        options:
          - Πάρε
          - Παίρνε
        answer: Παίρνε
        explanation: Каждое утро и каждый вечер — регулярно.
      - id: q6
        prompt: Πάρε το χάπι και ___ ένα ποτήρι νερό.
        options:
          - πιες
          - πίνε
        answer: πιες
        explanation: Один стакан, один раз — πιες (от ήπια).
      - id: q7
        prompt: Другу, который поздно едет домой на машине — ___ στον δρόμο!
        options:
          - Πρόσεχε
          - Προσέχετε
        answer: Πρόσεχε
        explanation: Другу — на «ты». Προσέχετε — на «вы».
  - type: explanation
    id: min
    title: Запрет — μην
    body: |-
      Запрет по-гречески строится не повелительным наклонением, а так: **μην** + та же форма, что стоит после να, только без να. Сравните: Πρέπει να πίνεις νερό — **Μην πίνεις** αλκοόλ.

      — **Общий запрет, «вообще не делай»** — настоящее время: **Μην πίνεις** αλκοόλ με την αντιβίωση (η αντιβίωση — антибиотики). **Μην ανησυχείς!** — «Не волнуйся!» На «вы»: **Μην πίνετε, Μην ανησυχείτε.**

      — **«Смотри не сделай (в этот раз)»** — форма от аориста: **Μην ξεχάσεις** το σιρόπι! — «Не забудь сироп!» **Μην πας** στη δουλειά σήμερα. — «Не ходи сегодня на работу».

      **Частая ошибка.** После μην никогда не бывает формы повелительного наклонения: не «μην πάρε», а **μην πάρεις**; не «μην πίνε», а **μην πίνεις**. И «δεν πάρεις» тоже не говорят: δεν — для утверждений (Δεν πίνω καφέ — «Я не пью кофе»), μην — для запретов.

      Можно сказать и **Να μην** πίνεις αλκοόλ — это то же самое, чуть мягче.

      **Μην или μη?** Правило то же, что у την (модуль 01): ν остаётся перед гласной и перед κ, π, τ, ξ, ψ (и μπ, ντ, γκ, τσ, τζ) — **μην ανησυχείς, μην πίνεις, μην ξεχάσεις**; перед остальными согласными пишут **μη**: μη σταματήσετε, μη φύγεις. В речи эту разницу почти не слышно.
    table:
      columns:
        - надо
        - нельзя
      rows:
        - - Πίνε πολλά υγρά.
          - Μην πίνεις αλκοόλ.
        - - Να προσέχεις!
          - Μην ανησυχείς!
        - - Πάρε το σιρόπι.
          - Μην ξεχάσεις το σιρόπι!
        - - Μείνε στο σπίτι.
          - Μην πας στη δουλειά.
        - - Πίνετε πολύ νερό. (на «вы»)
          - Μην πίνετε καφέ. (на «вы»)
  - type: exercise
    id: min-choice
    title: Нельзя
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Μην ___ αλκοόλ με την αντιβίωση. (на «ты»)
        options:
          - πίνεις
          - πίνε
        answer: πίνεις
        explanation: После μην — форма, как после να (πίνεις), а не повелительное πίνε.
      - id: q2
        prompt: Μην ___, κυρία Ελένη, δεν είναι σοβαρό.
        options:
          - ανησυχείς
          - ανησυχείτε
          - ανησύχησε
        answer: ανησυχείτε
        explanation: К κυρία Ελένη обращаются на «вы» — ανησυχείτε.
      - id: q3
        prompt: Μην ___ να πάρεις το σιρόπι!
        options:
          - ξεχάσεις
          - ξέχασε
          - ξέχασες
        answer: ξεχάσεις
        explanation: "ξέχασα → να ξεχάσω → μην ξεχάσεις. Ξέχασε — повелительное, ξέχασες — прошедшее время: после μην они невозможны."
      - id: q4
        prompt: Είσαι άρρωστος — μην ___ στη δουλειά σήμερα.
        options:
          - πας
          - πήγαινε
          - πήγες
        answer: πας
        explanation: να πάω, να πας → μην πας.
      - id: q5
        prompt: Не принимай это лекарство без рецепта.
        options:
          - Μην πάρεις αυτό το φάρμακο χωρίς συνταγή.
          - Μην πάρε αυτό το φάρμακο χωρίς συνταγή.
          - Δεν πάρεις αυτό το φάρμακο χωρίς συνταγή.
        answer: Μην πάρεις αυτό το φάρμακο χωρίς συνταγή.
        explanation: Запрет — μην + πάρεις. После μην нет повелительного (πάρε), а δεν с запретом не употребляют.
      - id: q6
        prompt: Врач пациенту — «Не пейте кофе вечером».
        options:
          - Μην πίνετε καφέ το βράδυ.
          - Μην πίνεις καφέ το βράδυ.
          - Δεν πίνετε καφέ το βράδυ.
        answer: Μην πίνετε καφέ το βράδυ.
        explanation: Δεν πίνετε καφέ — «Вы не пьёте кофе» (утверждение). Μην πίνεις — на «ты».
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Выпей таблетку от боли. (боль — ο πόνος)
        answer:
          - Πάρε ένα χάπι για τον πόνο.
          - Πάρε ένα χάπι για τον πόνο σου.
        explanation: "По-гречески таблетку «берут»: παίρνω χάπι. «От боли» — για τον πόνο."
      - id: q2
        prompt: Пей много жидкости. (жидкость — τα υγρά)
        answer:
          - Πίνε πολλά υγρά.
        explanation: Регулярно, всё время — πίνε, от настоящего времени.
      - id: q3
        prompt: Не пей алкоголь с антибиотиками (με την αντιβίωση).
        answer:
