blocks:
  - type: explanation
    id: doctor-words
    title: У врача и в аптеке
    body: |-
      **Ο γιατρός** (модуль 03) принимает в **το ιατρείο** — это кабинет врача, приёмная. У слов одна основа: γιατρός — ιατρείο. Чтобы попасть к врачу, **κλείνω ραντεβού** — записываюсь на приём. **Το ραντεβού** не склоняется: ένα ραντεβού, δύο ραντεβού.

      **Ο ασθενής** — пациент (о женщине — η ασθενής). Склоняется особо: τον ασθενή, οι ασθενείς, τους ασθενείς. Врач **εξετάζει** τον ασθενή — осматривает пациента — и **μετράει** — измеряет: μετράει τον πυρετό. **Ο πυρετός** — температура, жар: **Έχω πυρετό** — «У меня температура». Температуру меряют **με το θερμόμετρο** — градусником.

      Врач выписывает **τη συνταγή** — рецепт (то же слово значит «рецепт блюда»). С рецептом идут в **το φαρμακείο** (модуль 12), где работает **ο φαρμακοποιός** или **η φαρμακοποιός** — фармацевт. Там покупают **το φάρμακο** — лекарство, например **το χάπι** — таблетку или **το σιρόπι** — сироп. Таблетку по-гречески «берут»: **παίρνω ένα χάπι** — «принимаю, пью таблетку».

      Советы врача: **ξαπλώνω** — ложиться, лежать; **προσέχω** — беречься, быть осторожным; **αποφεύγω** — избегать (αποφεύγω τον καφέ). Врач успокаивает: **Δεν είναι κάτι σοβαρό** — «Ничего серьёзного» (**σοβαρός** — серьёзный) и **Μην ανησυχείτε** — «Не волнуйтесь» (ανησυχώ — волноваться, спрягается как μπορώ: ανησυχώ, ανησυχείς, ανησυχεί…).
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Κλείνω ραντεβού με τον γιατρό.
          - Записываюсь к врачу.
        - - Ο γιατρός εξετάζει τον ασθενή.
          - Врач осматривает пациента.
        - - Μετράω τον πυρετό με το θερμόμετρο.
          - Меряю температуру градусником.
        - - Έχω πυρετό από χθες.
          - У меня температура со вчерашнего дня.
        - - Ο γιατρός γράφει μια συνταγή.
          - Врач выписывает рецепт.
        - - Παίρνω ένα χάπι.
          - Принимаю таблетку.
