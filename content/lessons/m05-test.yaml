title: Контрольная модуля 05
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, формы глаголов, слова и фразы. Таблицы и словарь не открывайте — так результат покажет, что уже усвоено.

      Монолог звучит два раза. Перед первым прослушиванием прочитайте вопросы.
  - type: reading
    id: despina
    title: Η Δέσποινα
    text: |-
      Η Δέσποινα είναι από την Πάφο, αλλά τώρα μένει και δουλεύει στη Λευκωσία. Ξυπνάει κάθε μέρα στις έξι, γιατί αρχίζει δουλειά στις επτά. Τελειώνει στις τρεις και γυρίζει σπίτι.

      Το απόγευμα συνήθως διαβάζει αγγλικά ή κάνει βόλτα. Μερικές φορές έρχεται η αδελφή της και βλέπουν μαζί τηλεόραση. Η Δέσποινα κοιμάται πάντα νωρίς, στις δέκα.

      Το Σάββατο δεν δουλεύει: σηκώνεται αργά και πηγαίνει στην Πάφο, στους γονείς της. Την Κυριακή το βράδυ γυρίζει πάλι στη Λευκωσία.
    glosses:
      - text: στη Λευκωσία
        russian: в Никосии
      - text: η αδελφή της
        russian: её сестра
      - text: στους γονείς της
        russian: к своим родителям
  - type: exercise
    id: despina-tf
    about: despina
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Δέσποινα μένει στην Πάφο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Она из Пафоса, но τώρα μένει — «сейчас живёт» — в Никосии.
      - id: q2
        prompt: Η Δέσποινα ξυπνάει νωρίς, γιατί αρχίζει δουλειά στις επτά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Το απόγευμα η Δέσποινα δουλεύει.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τελειώνει στις τρεις — работа кончается в три, а после обеда она читает или гуляет.
      - id: q4
        prompt: Η αδελφή της έρχεται κάθε μέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μερικές φορές — «иногда», а не каждый день.
      - id: q5
        prompt: Η Δέσποινα δεν κοιμάται ποτέ αργά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Κοιμάται πάντα νωρίς — «всегда ложится рано», значит, никогда не поздно.
      - id: q6
        prompt: Το Σάββατο η Δέσποινα σηκώνεται νωρίς.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το Σάββατο σηκώνεται αργά.
  - type: listening
    id: petros
    title: Ο Πέτρος
    plays: 2
    transcript:
      - speaker: Πέτρος
        text: Γεια σας! Είμαι ο Πέτρος, είμαι γιατρός και μένω στη Λεμεσό.
      - speaker: Πέτρος
        text: Τη Δευτέρα, την Τετάρτη και την Παρασκευή δουλεύω το πρωί. Ξυπνάω στις έξι και γυρίζω σπίτι στις τρεις.
      - speaker: Πέτρος
        text: Την Τρίτη και την Πέμπτη κοιμάμαι το απόγευμα και δουλεύω τη νύχτα.
      - speaker: Πέτρος
        text: Δεν έχω πολύ χρόνο, αλλά το Σάββατο κάνω πάντα βόλτα με τα παιδιά μου. Την Κυριακή έρχονται οι γονείς μου.
  - type: exercise
    id: petros-choice
    about: petros
    graded: true
    title: Аудирование
    instruction: Прослушайте монолог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Τι δουλειά κάνει ο Πέτρος;
        options:
          - Είναι γιατρός.
          - Είναι δάσκαλος.
          - Δεν δουλεύει.
        answer: Είναι γιατρός.
      - id: q2
        prompt: Πότε δουλεύει ο Πέτρος τη νύχτα;
        options:
          - Τη Δευτέρα και την Τετάρτη.
          - Την Τρίτη και την Πέμπτη.
          - Το Σάββατο.
        answer: Την Τρίτη και την Πέμπτη.
      - id: q3
        prompt: Τι ώρα γυρίζει σπίτι τη Δευτέρα;
        options:
          - Στις έξι.
          - Στις τρεις.
          - Στις δέκα.
        answer: Στις τρεις.
        explanation: В шесть он просыпается (ξυπνάω στις έξι), а домой возвращается в три.
      - id: q4
        prompt: Τι κάνει ο Πέτρος το Σάββατο;
        options:
          - Κάνει βόλτα με τα παιδιά του.
          - Δουλεύει τη νύχτα.
          - Κοιμάται το απόγευμα.
        answer: Κάνει βόλτα με τα παιδιά του.
      - id: q5
        prompt: Кто приходит к Петросу в воскресенье?
        options:
          - родители
          - друзья
          - дети
        answer: родители
        explanation: Την Κυριακή έρχονται οι γονείς μου.
  - type: exercise
    id: forms
    graded: true
    title: Формы глаголов
    instruction: Напишите глагол в нужной форме.
    format: text
    items:
      - id: q1
        prompt: (αυτός) ξυπνάω
        answer:
          - ξυπνάει
          - ξυπνά
      - id: q2
        prompt: (εμείς) διαβάζω
        answer:
          - διαβάζουμε
      - id: q3
        prompt: (εσύ) ακούω
        answer:
          - ακούς
      - id: q4
        prompt: (αυτοί) βλέπω
        answer:
          - βλέπουν
          - βλέπουνε
      - id: q5
        prompt: (εσείς) μιλάω
        answer:
          - μιλάτε
      - id: q6
        prompt: (εσύ) σηκώνομαι
        answer:
          - σηκώνεσαι
      - id: q7
        prompt: (αυτή) κοιμάμαι
        answer:
          - κοιμάται
      - id: q8
        prompt: (εσύ) μπορώ
        answer:
          - μπορείς
  - type: exercise
    id: negation
    graded: true
    title: Отрицание и частота
    instruction: Выберите правильное предложение.
    format: choice
    items:
      - id: q1
        prompt: «Я никогда не работаю по вечерам».
        options:
          - Δεν δουλεύω ποτέ το βράδυ.
          - Δουλεύω ποτέ το βράδυ.
          - Ποτέ δουλεύω το βράδυ.
        answer: Δεν δουλεύω ποτέ το βράδυ.
      - id: q2
        prompt: «Обычно мы встаём в восемь».
        options:
          - Συνήθως σηκωνόμαστε στις οκτώ.
          - Συνήθως σηκώνεται στις οκτώ.
          - Πάντα σηκωνόμαστε στις οκτώ.
        answer: Συνήθως σηκωνόμαστε στις οκτώ.
      - id: q3
        prompt: «Каждое утро я слушаю музыку».
        options:
          - Κάθε πρωί ακούω μουσική.
          - Κάθε πρωί ακούει μουσική.
          - Μερικές φορές ακούω μουσική το πρωί.
        answer: Κάθε πρωί ακούω μουσική.
  - type: exercise
    id: vocab-match
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - σηκώνομαι
      - γυρίζω
      - περιμένω
      - αρχίζω
      - μερικές φορές
      - μαζί
      - ποτέ
      - κλείνω
    items:
      - id: m1
        prompt: вставать
        answer: σηκώνομαι
      - id: m2
        prompt: возвращаться
        answer: γυρίζω
      - id: m3
        prompt: ждать
        answer: περιμένω
      - id: m4
        prompt: начинать
        answer: αρχίζω
      - id: m5
        prompt: иногда
        answer: μερικές φορές
      - id: m6
        prompt: вместе
        answer: μαζί
  - type: exercise
    id: phrases
    graded: true
    title: Фразы
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: "Друг спрашивает: «Τι ώρα ξυπνάς;»"
        options:
          - Συνήθως ξυπνάω στις επτά.
          - Το βράδυ βλέπω τηλεόραση.
          - Δεν έχω χρόνο.
        answer: Συνήθως ξυπνάω στις επτά.
      - id: q2
        prompt: Вас зовут в кафе, но вы очень заняты.
        options:
          - Συγγνώμη, δεν έχω χρόνο.
          - Καληνύχτα!
          - Κάθε μέρα διαβάζω ελληνικά.
        answer: Συγγνώμη, δεν έχω χρόνο.
      - id: q3
        prompt: Поздний вечер, вы прощаетесь с семьёй и идёте спать.
        options:
          - Καληνύχτα!
          - Καλημέρα!
          - Καλησπέρα!
        answer: Καληνύχτα!
        explanation: Καλησπέρα — приветствие вечером, а Καληνύχτα — прощание перед сном.
      - id: q4
        prompt: Как спросить друга, что он обычно делает утром?
        options:
          - Τι κάνεις συνήθως το πρωί;
          - Τι κάνετε συνήθως το πρωί;
          - Τι ώρα είναι το πρωί;
        answer: Τι κάνεις συνήθως το πρωί;
        explanation: "С другом — на «ты»: κάνεις."
