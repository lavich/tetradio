title: Контрольная модуля 06
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: объявление, телефонный разговор, грамматика и слова. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Разговор звучит два раза. После ответа пояснения подскажут, что повторить.
  - type: reading
    id: ad
    title: Νοικιάζεται διαμέρισμα
    text: |-
      ΛΕΥΚΩΣΙΑ, κοντά στο πανεπιστήμιο. Νοικιάζεται διαμέρισμα στον πρώτο όροφο. Έχει ένα υπνοδωμάτιο, σαλόνι, κουζίνα και μπάνιο. Η κουζίνα είναι μικρή, αλλά στο σαλόνι υπάρχει μεγάλο τραπέζι. Δίπλα στο υπνοδωμάτιο είναι το μπάνιο. Το διαμέρισμα είναι με έπιπλα, αλλά χωρίς τηλεόραση. Κάτω από το σπίτι υπάρχει σούπερ μάρκετ. Ενοίκιο: 500 ευρώ τον μήνα. Το νερό πληρώνετε εσείς. Τηλ. 99 32 51 07, κυρία Ελένη.
    glosses:
      - text: πανεπιστήμιο
        russian: университет
      - text: στον πρώτο όροφο
        russian: на втором этаже (этажи считают над ισόγειο — первым этажом)
      - text: μικρή
        russian: маленькая
      - text: μεγάλο
        russian: большой
      - text: με έπιπλα
        russian: с мебелью
      - text: σούπερ μάρκετ
        russian: супермаркет
      - text: τον μήνα
        russian: в месяц
  - type: exercise
    id: ad-tf
    about: ad
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το διαμέρισμα έχει δύο υπνοδωμάτια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Έχει ένα υπνοδωμάτιο.
      - id: q2
        prompt: Το μπάνιο είναι δίπλα στο υπνοδωμάτιο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Στο διαμέρισμα υπάρχει τηλεόραση.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Με έπιπλα, αλλά χωρίς τηλεόραση — телевизора нет.
      - id: q4
        prompt: Το ενοίκιο είναι μαζί με το νερό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το νερό πληρώνετε εσείς — воду жилец платит сам.
  - type: exercise
    id: ad-match
    about: ad
    graded: true
    title: Чтение — соединение частей
    instruction: Соедините начало и конец предложения по тексту. Два конца лишние.
    format: match
    bank:
      - είναι κοντά στο πανεπιστήμιο.
      - είναι μικρή.
      - υπάρχει μεγάλο τραπέζι.
      - είναι πεντακόσια ευρώ.
      - είναι πίσω από την κουζίνα.
      - είναι εξακόσια ευρώ.
    items:
      - id: m1
        prompt: Το διαμέρισμα…
        answer: είναι κοντά στο πανεπιστήμιο.
      - id: m2
        prompt: Η κουζίνα…
        answer: είναι μικρή.
      - id: m3
        prompt: Στο σαλόνι…
        answer: υπάρχει μεγάλο τραπέζι.
      - id: m4
        prompt: Το ενοίκιο…
        answer: είναι πεντακόσια ευρώ.
        explanation: "500 — πεντακόσια; εξακόσια — 600."
  - type: listening
    id: new-home
    title: Ένα σπίτι στη Λάρνακα
    plays: 2
    transcript:
      - speaker: Κώστας
        text: "Γεια σου, Ελένη! Πού είσαι;"
      - speaker: Ελένη
        text: "Γεια σου, Κώστα! Είμαι στο σπίτι μου, στη Λάρνακα. Τώρα μένω εδώ."
      - speaker: Κώστας
        text: "Ωραία! Πόσα δωμάτια έχει το σπίτι;"
      - speaker: Ελένη
        text: "Τρία δωμάτια: σαλόνι και δύο υπνοδωμάτια. Και κουζίνα και μπάνιο."
      - speaker: Κώστας
        text: "Είναι κοντά στη θάλασσα;"
      - speaker: Ελένη
        text: "Όχι, δεν είναι κοντά στη θάλασσα. Αλλά δίπλα μένει η φίλη μου η Άννα."
      - speaker: Κώστας
        text: "Και πόσο είναι το ενοίκιο;"
      - speaker: Ελένη
        text: "Επτακόσια ευρώ, μαζί με το νερό."
      - speaker: Κώστας
        text: "Υπάρχει τραπέζι στο σαλόνι;"
      - speaker: Ελένη
        text: "Όχι ακόμα. Στο σαλόνι δεν υπάρχει τίποτα! Έλα το Σάββατο."
      - speaker: Κώστας
        text: "Καλά. Τα λέμε το Σάββατο!"
  - type: exercise
    id: new-home-choice
    about: new-home
    graded: true
    title: Аудирование
    instruction: Прослушайте разговор и выберите правильный ответ.
    format: choice
    items:
      - id: q2
        prompt: Сколько спален в доме?
        options:
          - одна
          - две
          - три
        answer: две
        explanation: Τρία δωμάτια — это гостиная и δύο υπνοδωμάτια.
      - id: q3
        prompt: Кто живёт рядом с Элени?
        options:
          - подруга Анна
          - Костас
          - никто
        answer: подруга Анна
        explanation: Δίπλα μένει η φίλη μου η Άννα.
      - id: q4
        prompt: Сколько стоит аренда?
        options:
          - 700 евро вместе с водой
          - 700 евро без воды
          - 600 евро вместе с водой
        answer: 700 евро вместе с водой
        explanation: Επτακόσια ευρώ, μαζί με το νερό.
      - id: q5
        prompt: Что есть в гостиной?
        options:
          - ничего
          - стол
          - телевизор
        answer: ничего
        explanation: Στο σαλόνι δεν υπάρχει τίποτα.
      - id: q6
        prompt: Когда Костас придёт к Элени?
        options:
          - в субботу
          - в воскресенье
          - завтра
        answer: в субботу
  - type: exercise
    id: grammar-gap
    graded: true
    title: Грамматика
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - υπάρχει
      - υπάρχουν
      - είναι
      - στην
      - στη
      - σε
      - στον
    items:
      - id: g1
        prompt: Στο διαμέρισμα ___ δύο μπάνια.
        answer: υπάρχουν
      - id: g2
        prompt: Πού ___ η κουζίνα;
        answer: είναι
        explanation: Спрашиваем, где известная вещь, — είναι.
      - id: g3
        prompt: Στο υπνοδωμάτιο δεν ___ τραπέζι.
        answer: υπάρχει
      - id: g5
        prompt: Το σπίτι είναι κοντά ___ θάλασσα.
        answer: στη
        explanation: Η θάλασσα — женский род; перед θ ν не пишется.
      - id: g7
        prompt: Μένω ___ ένα μικρό διαμέρισμα.
        answer: σε
      - id: g8
        prompt: Είμαι ___ κουζίνα.
        answer: στην
        explanation: Перед κ ν остаётся — στην κουζίνα.
  - type: exercise
    id: place-match
    graded: true
    title: Где что
    instruction: Соедините русское выражение с греческим. Два греческих лишние.
    format: match
    bank:
      - πάνω από το τραπέζι
      - πάνω στο τραπέζι
      - κάτω από το τραπέζι
      - πίσω από την πόρτα
      - μπροστά στην πόρτα
      - δίπλα στο παράθυρο
      - έξω από το σπίτι
      - μέσα στο σπίτι
    items:
      - id: m1
        prompt: над столом
        answer: πάνω από το τραπέζι
      - id: m2
        prompt: под столом
        answer: κάτω από το τραπέζι
      - id: m3
        prompt: на столе
        answer: πάνω στο τραπέζι
      - id: m4
        prompt: за дверью
        answer: πίσω από την πόρτα
      - id: m5
        prompt: рядом с окном
        answer: δίπλα στο παράθυρο
      - id: m6
        prompt: в доме (внутри)
        answer: μέσα στο σπίτι
  - type: exercise
    id: vocab-choice
    graded: true
    title: Слова и фразы
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: На балконе дома висит табличка «Νοικιάζεται διαμέρισμα». Что это значит?
        options:
          - Сдаётся квартира.
          - Продаётся квартира.
          - Ищу квартиру.
        answer: Сдаётся квартира.
      - id: q3
        prompt: Гость стоит у двери. Что вы скажете?
        options:
          - Έλα μέσα!
          - Έλα έξω!
          - Είμαι μέσα.
        answer: Έλα μέσα!
      - id: q4
        prompt: В комнате пусто.
        options:
          - Στο δωμάτιο δεν υπάρχει τίποτα.
          - Στο δωμάτιο υπάρχει κάτι.
          - Στο δωμάτιο είναι κάποιος.
        answer: Στο δωμάτιο δεν υπάρχει τίποτα.
      - id: q5
        prompt: «Я ищу квартиру.»
        options:
          - Ψάχνω διαμέρισμα.
          - Βρίσκω διαμέρισμα.
          - Πληρώνω διαμέρισμα.
        answer: Ψάχνω διαμέρισμα.
        explanation: "Ψάχνω — искать, βρίσκω — найти, πληρώνω — платить."
      - id: q6
        prompt: Что противоположно слову εύκολο?
        options:
          - δύσκολο
          - κακό
          - κοντά
        answer: δύσκολο
