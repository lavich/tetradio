blocks:
  - type: explanation
    id: rental-words
    title: Прокат, экскурсии и курорт — что спросить
    body: |-
      На пляже с прокатом и экскурсиями цену называют за час, за полдня или за целый день: **What's the rate for a full day?** Узнайте, что входит в цену (маска, трубка, жилет), сколько длится экскурсия и где собираются. Для **snorkelling** — плавания с маской и трубкой — берут **a wetsuit**, если вода прохладная. Время можно сдвинуть: **Could we start a bit later?** Последний катер или автобус стоит уточнить заранее: **When does the last boat leave?**

      На курорте **all-inclusive** — «всё включено»: питание и напитки входят в цену, но спа, экскурсии и трансфер обычно оплачиваются отдельно. На руку надевают **a wristband**: его показывают у ресторана и бара. Чтобы приехать из аэропорта в отель, спрашивают о трансфере: **Is there a shuttle from the airport?** Для раннего выезда просят такси заранее: **Could you order us a taxi for six o'clock?**

      Погода влияет на планы: **What's the forecast for tomorrow?** Ответы — **It's overcast** (пасмурно), **It's scorching** (палящая жара), **It's supposed to clear up by noon** (по прогнозу, к полудню должно проясниться).

      Снаряжение для плавания выдают с инструктажем, и дальше от берега в одиночку не заплывают: эти правила есть в табличках проката.
    table:
      columns:
        - ситуация
        - фраза
      rows:
        - - цена
          - What's the rate for a full day?
        - - время
          - Could we start a bit later?
        - - последний рейс
          - When does the last boat leave?
        - - из аэропорта
          - Is there a shuttle from the airport?
        - - ранний выезд
          - Could you order us a taxi for six o'clock?
        - - погода
          - What's the forecast for tomorrow?
