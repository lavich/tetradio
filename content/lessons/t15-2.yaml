  - type: explanation
    id: reception-how
    title: Ресепшен курорта
    body: |-
      Стефан отдыхает в отеле «всё включено». За несколько дней до отъезда он подходит к ресепшену: потерян браслет, завтра в аэропорт прилетает его брат, в пятницу рано утром вылет. С ним говорит Яра. Послушайте: какой трансфер у брата, во сколько заказано такси и как Стефан записывается в спа.

      Стефан говорит короткими фразами. Яра отвечает по пунктам: что оплачивает отель, а что гость.
  - type: listening
    id: reception
    title: At the resort reception
    plays: 2
    transcript:
      - { speaker: Yara, text: "Good evening, Mr Weber. How can I help?", audio: t15-2/reception-1.mp3 }
      - { speaker: Stefan, text: "Good evening. I have three questions. First, I lost my wristband.", audio: t15-2/reception-2.mp3 }
      - { speaker: Yara, text: "No problem. Here is a new one. Please show it at the restaurants and at the pool bar.", audio: t15-2/reception-3.mp3 }
      - { speaker: Stefan, text: "Thank you. Second, my brother arrives tomorrow at noon. Is there a shuttle from the airport?", audio: t15-2/reception-4.mp3 }
      - { speaker: Yara, text: "Yes, but it isn't included in all-inclusive. The shuttle runs every two hours, and it costs fifteen euros per person. Is he arriving at terminal one?", audio: t15-2/reception-5.mp3 }
      - { speaker: Stefan, text: "Yes, I think so.", audio: t15-2/reception-6.mp3 }
      - { speaker: Yara, text: "Then the next shuttle after noon is at half past twelve. He should wait at the blue sign outside the arrivals hall.", audio: t15-2/reception-7.mp3 }
      - { speaker: Stefan, text: "Good. And third, we fly home on Friday at nine in the morning. Could you order us a taxi for six o'clock?", audio: t15-2/reception-8.mp3 }
      - { speaker: Yara, text: "Of course. Friday at six. The restaurant opens at seven, so I'll prepare a breakfast box for you.", audio: t15-2/reception-9.mp3 }
      - { speaker: Stefan, text: "That is very kind. Also, can I book a massage for tomorrow?", audio: t15-2/reception-10.mp3 }
      - { speaker: Yara, text: "The spa isn't included either. A massage is forty-five euros. I have a free slot at four o'clock.", audio: t15-2/reception-11.mp3 }
      - { speaker: Stefan, text: "Four is fine. Thank you.", audio: t15-2/reception-12.mp3 }
      - { speaker: Yara, text: "You're welcome. On Friday, please return your wristband to reception when you check out.", audio: t15-2/reception-13.mp3 }
