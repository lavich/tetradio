  - type: explanation
    id: boat-how
    title: Экскурсия на лодке — разговор у прокатного домика
    body: |-
      Элиф с мужем и дочерью девяти лет хочет поехать на экскурсию со снорклингом. В прокатном домике на пляже её встречает Никос. Послушайте разговор: сколько стоит экскурсия, что входит в цену, какую экскурсию они выбрали и где собираются.

      Элиф уточняет цену и просит гидрокостюм для дочери, а в конце просит присмотреть за вещами и спрашивает о лежаках и зонте на день. Никос называет все цены по порядку.
  - type: listening
    id: boat-trip
    title: At the rental hut
    plays: 2
    transcript:
      - { speaker: Nikos, text: "Good morning. How can I help?", audio: t15-2/boat-trip-1.mp3 }
      - { speaker: Elif, text: "Hi. We'd like to go on the snorkelling trip tomorrow. Is there space for two adults and a child?", audio: t15-2/boat-trip-2.mp3 }
      - { speaker: Nikos, text: "Yes, there is. How old is your daughter?", audio: t15-2/boat-trip-3.mp3 }
      - { speaker: Elif, text: "She's nine.", audio: t15-2/boat-trip-4.mp3 }
      - { speaker: Nikos, text: "Then it's thirty-five euros for each adult and twenty for your daughter. That's ninety euros altogether.", audio: t15-2/boat-trip-5.mp3 }
      - { speaker: Elif, text: "My daughter feels the cold. Could we get a wetsuit for her?", audio: t15-2/boat-trip-6.mp3 }
      - { speaker: Nikos, text: "Of course. It's six euros for the trip. What size does she need?", audio: t15-2/boat-trip-7.mp3 }
      - { speaker: Elif, text: "Small, I think. Which trip is better, the ten o'clock or the two o'clock?", audio: t15-2/boat-trip-8.mp3 }
      - { speaker: Nikos, text: "The ten o'clock. The sea is usually calmer in the morning, and the afternoon trip is busier.", audio: t15-2/boat-trip-9.mp3 }
      - { speaker: Elif, text: "Ten, then. Where do we meet?", audio: t15-2/boat-trip-10.mp3 }
      - { speaker: Nikos, text: "At the blue hut by the pier, fifteen minutes before. We start with a short safety briefing, and our guide stays with the group the whole time.", audio: t15-2/boat-trip-11.mp3 }
      - { speaker: Elif, text: "Good. Tomorrow, could you keep an eye on our things while we are on the boat?", audio: t15-2/boat-trip-12.mp3 }
      - { speaker: Nikos, text: "Sure. Put your bags behind the counter.", audio: t15-2/boat-trip-13.mp3 }
      - { speaker: Elif, text: "Thank you. And for today, what's the rate for a full day for loungers?", audio: t15-2/boat-trip-14.mp3 }
      - { speaker: Nikos, text: "A lounger is twelve euros, and a parasol is eight.", audio: t15-2/boat-trip-15.mp3 }
      - { speaker: Elif, text: "Two loungers and one parasol, please.", audio: t15-2/boat-trip-16.mp3 }
      - { speaker: Nikos, text: "That's thirty-two euros for the day. You can pay at the beach bar. Can I have your name for the trip?", audio: t15-2/boat-trip-17.mp3 }
      - { speaker: Elif, text: "Elif Demir.", audio: t15-2/boat-trip-18.mp3 }
      - { speaker: Nikos, text: "Thank you, Ms Demir. See you tomorrow at a quarter to ten.", audio: t15-2/boat-trip-19.mp3 }
  - type: exercise
    id: boat-q
    about: boat-trip
    title: Аудирование — прокатный домик
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: How much is the snorkelling trip for two adults and a child, without a wetsuit?
        options: [ninety euros, seventy euros, one hundred and five euros]
        answer: ninety euros
        explanation: "35 + 35 + 20 = 90; гидрокостюм — ещё шесть евро."
      - id: q2
        prompt: Why does Elif ask for a wetsuit?
        options:
          - Her daughter feels the cold.
          - The water is very deep.
          - The guide says it is necessary.
        answer: Her daughter feels the cold.
        explanation: My daughter feels the cold.
      - id: q3
        prompt: Which trip do they choose?
        options: [the ten o'clock trip, the two o'clock trip, both trips]
        answer: the ten o'clock trip
        explanation: Утром море обычно спокойнее, а дневная экскурсия многолюднее.
      - id: q4
        prompt: Where do they meet before the trip?
        options: [at the blue hut by the pier, at the beach bar, at the hotel]
        answer: at the blue hut by the pier
        explanation: At the blue hut by the pier, fifteen minutes before.
      - id: q5
        prompt: What does Elif ask Nikos to do with their things?
        options:
          - look after them at the hut
          - carry them to the boat
          - send them to the hotel
        answer: look after them at the hut
        explanation: Could you keep an eye on our things? Никос предлагает оставить сумки за стойкой.
      - id: q6
        prompt: How much does Elif pay for two loungers and a parasol for the day?
        options: [thirty-two euros, twenty-four euros, forty euros]
        answer: thirty-two euros
        explanation: "12 + 12 + 8 = 32; платит она в баре на пляже."
