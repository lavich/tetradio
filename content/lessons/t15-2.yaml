  - type: explanation
    id: hut-how
    title: Табличка пункта проката
    body: |-
      Ниже — табличка на пляже: цены на лежаки и лодки, экскурсия со снорклингом, катер вдоль берега и дайвинг-центр. Такие таблички читают по строкам: найдите своё занятие, затем цену, время и условия. Цифры идут через тире и двоеточие: **9:00–18:00** — с девяти до шести, **€12** — двенадцать евро.

      В разделе о безопасности стоят правила проката: инструктаж перед снаряжением, плавать недалеко от берега и не одному, следовать флагам и указаниям спасателей.
  - type: reading
    id: beach-hut
    title: Seaview Beach — rentals and trips
    text: |-
      SEAVIEW BEACH — RENTALS AND TRIPS
      Open every day 9:00–18:00 (weather permitting). Pay at the beach bar.

      Loungers and parasols
      Lounger: €8 for half a day (until 14:00), €12 for a full day
      Parasol: €5 for half a day, €8 for a full day

      Boats and water sports
      Pedal boat (up to 4 people): €25 per hour
      Kayak (for 2): €10 per hour
      Water skiing: €40 for 15 minutes, lifejacket and instructor included
      Deposit: your ID or €50. Please stay inside the yellow buoys.

      Snorkelling trip by boat
      Daily at 10:00 and 14:00, about two hours
      Meet at the blue hut by the pier 15 minutes before departure
      Adult €35, child (6–12) €20. Mask and snorkel included, wetsuit €6 per trip
      Children under 6 cannot join.

      Coast boat trip
      Every hour from 11:00 to 17:00, €18. The last boat leaves at 17:00.

      Diving centre
      Try dive for beginners (from age 12): €70, at 9:00 and 15:00. A short lesson in shallow water comes first.

      Safety
      Everyone gets a short safety briefing before using equipment. Please do not swim far from the beach on your own, and follow the flags and the lifeguards' instructions.
    glosses:
      - { text: weather permitting, russian: если позволит погода }
      - { text: lifejacket, russian: спасательный жилет }
      - { text: instructor, russian: инструктор }
      - { text: Deposit, russian: залог }
      - { text: buoys, russian: буи }
      - { text: departure, russian: отправление }
      - { text: Try dive, russian: пробное погружение }
      - { text: briefing, russian: инструктаж }
      - { text: equipment, russian: снаряжение }
  - type: exercise
    id: hut-q
    about: beach-hut
    title: Чтение — прокат
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: How much is a parasol for half a day?
        options: ["€5", "€8", "€12"]
        answer: "€5"
        explanation: "Parasol: €5 for half a day; €8 — за целый день."
      - id: q2
        prompt: You want a lounger until 4 p.m. Which price do you pay?
        options: ["€12", "€8", "€5"]
        answer: "€12"
        explanation: Половина дня — до 14:00, а до 16:00 нужен целый день, €12.
      - id: q3
        prompt: What time should you be at the blue hut for the 10:00 snorkelling trip?
        options: ["9:45", "10:15", "9:00"]
        answer: "9:45"
        explanation: "Meet… 15 minutes before departure — за пятнадцать минут до отправления."
      - id: q4
        prompt: How much does a snorkelling trip cost for an eight-year-old child?
        options: ["€20", "€35", "€6"]
        answer: "€20"
        explanation: "Child (6–12) €20; €6 — только аренда гидрокостюма."
      - id: q5
        prompt: What is included in the price of the snorkelling trip?
        options:
          - a mask and a snorkel
          - a mask, a snorkel and a wetsuit
          - a lunch on the boat
        answer: a mask and a snorkel
        explanation: "Mask and snorkel included, wetsuit €6 per trip — гидрокостюм за отдельную плату."
      - id: q6
        prompt: When does the last coast boat leave?
        options: ["17:00", "18:00", "14:00"]
        answer: "17:00"
        explanation: The last boat leaves at 17:00; в 18:00 пункт закрывается.
  - type: explanation
    id: hotel-how
    title: Карточка отеля «всё включено»
    body: |-
      Отель на курорте оставляет в номере карточку с правилами: что входит в цену, часы работы ресторана и бара, где спа, как заказать трансфер и во сколько выезжать. Читая карточку, ищите три вещи: что включено, что оплачивается отдельно и что нужно сделать заранее.

      Слово **Included** — «входит в цену», **Not included** — «оплачивается отдельно». **Local beer and wine** — местное пиво и вино.
  - type: reading
    id: hotel-card
    title: Palm Bay Resort — your all-inclusive stay
    text: |-
      PALM BAY RESORT — YOUR ALL-INCLUSIVE STAY

      Included
      Meals: breakfast 7:00–10:30, lunch 12:30–15:00 and dinner 18:30–21:30 in the main restaurant; snacks 11:00–17:00 at the pool café
      Drinks: water, juice, tea and coffee all day; local beer and wine at the pool bar 10:00–23:00
      Pool and beach: loungers, parasols and towels
      Daily activities: yoga, water polo, evening shows
      Not included: the spa, the dive centre, boat trips, room service and the airport shuttle

      Your wristband
      Please wear your wristband at all times and show it at the restaurants and the pool bar. If you lose it, ask reception for a new one.

      Pool and bar
      The pool is open 8:00–22:00. The bar stays open until 23:00. Please do not swim after drinking alcohol.

      Spa
      Open 10:00–19:00. Book at reception. Massages from €45.

      Airport shuttle
      Tickets from reception, €15 per person. For an early departure, tell reception the day before, and we will order a taxi and prepare a breakfast box for you.

      Check-out
      Check-out is at 11:00 on the day you leave. Please return your wristband to reception.
    glosses:
      - { text: water polo, russian: водное поло }
      - { text: room service, russian: еда и напитки в номер }
      - { text: breakfast box, russian: завтрак с собой }
      - { text: stays open, russian: работает }
      - { text: spa, russian: спа-центр }
      - { text: Massages, russian: массаж }
