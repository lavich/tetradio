blocks:
  - type: explanation
    id: phrases
    title: Выходные, время и сон
    body: |-
      **Τα σαββατοκύριακα δεν δουλεύω.** — «По выходным я не работаю». Το σαββατοκύριακο — «выходные» (суббота + воскресенье, одно слово). Во множественном числе с артиклем τα оно значит «по выходным, каждые выходные».

      **Δεν έχω χρόνο.** — «У меня нет времени». Так вежливо отказываются: — Πάμε βόλτα; — Συγγνώμη, δεν έχω χρόνο.

      **Πάω για ύπνο** — «иду спать, ложусь спать» (ο ύπνος — «сон»). Πάω — разговорная форма πηγαίνω: πάω, πας, πάει, πάμε, πάτε, πάνε. Сравните: **κοιμάμαι** — «сплю, засыпаю».
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Τα σαββατοκύριακα δεν δουλεύω.
          - По выходным я не работаю.
        - - Δεν έχω χρόνο.
          - У меня нет времени.
        - - Πάω για ύπνο στις έντεκα.
          - Я ложусь спать в одиннадцать.
        - - Καληνύχτα!
          - Спокойной ночи!
  - type: explanation
    id: open-close
    title: ανοίγω и κλείνω
    body: |-
      **Ανοίγω** — «открывать» и «открываться», **κλείνω** — «закрывать(ся)», как αρχίζω и τελειώνω из урока 1. Обе — группа A: ανοίγω, ανοίγεις, ανοίγει…

      Ανοίγω την πόρτα. — «Открываю дверь». Το σχολείο ανοίγει στις επτά και κλείνει στις δύο. — «Школа открывается в семь и закрывается в два».
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: verbs-gap
    title: Какой глагол
    instruction: Вставьте глагол. Одно слово лишнее.
    format: gap
    bank:
      - ανοίγει
      - κλείνει
      - αρχίζει
      - περιμένω
      - αγαπάω
    items:
      - id: g1
        prompt: Το φαρμακείο ___ στις οκτώ το πρωί και κλείνει στις οκτώ το βράδυ. (το φαρμακείο — аптека)
        answer: ανοίγει
      - id: g2
        prompt: Η τράπεζα ανοίγει στις οκτώ και ___ στις δύο. (η τράπεζα — банк)
        answer: κλείνει
      - id: g3
        prompt: Κάθε πρωί ___ το λεωφορείο στις επτά. (το λεωφορείο — автобус)
        answer: περιμένω
      - id: g4
        prompt: ___ πολύ την Κύπρο!
        answer: αγαπάω
        explanation: Αγαπάω — «люблю».
  - type: explanation
    id: writing-how
    title: Как написать о своём дне
    body: |-
      С этого модуля письменное задание — **40–60 слов**, как короткое письмо другу. Пишите о дне по порядку: утро → день → вечер → выходные. Связывайте предложения словами **και**, **αλλά**, **μετά**, **όταν**, **γιατί** — так текст звучит естественно, а не как список.

      В каждом предложении о себе — глагол в форме «я»: ξυπνάω, σηκώνομαι, βγαίνω, γυρίζω. Добавьте время (**στις** επτά, **το** βράδυ) и хотя бы два наречия частоты (συνήθως, πάντα, μερικές φορές, δεν… ποτέ).

      Дружеское письмо начинается обращением **Γεια σου, …!** и кончается прощанием **Τα λέμε!** и именем. Хороший тон — задать другу вопрос в конце: **Εσύ τι κάνεις συνήθως;** Имя придумайте, пишите печатными буквами, не целиком заглавными.

      Проверьте себя: окончание -ω у глаголов «я» (не -ει), δεν перед глаголом, тонос в словах из двух и больше слогов.
    table:
      columns:
        - часть
        - как
      rows:
        - - обращение
          - Γεια σου, Ελένη!
        - - утро
          - Συνήθως ξυπνάω στις … και σηκώνομαι στις …
        - - день
          - Βγαίνω από το σπίτι στις … Αρχίζω δουλειά στις …
        - - вечер
          - Το βράδυ διαβάζω ελληνικά ή βλέπω τηλεόραση.
        - - выходные
          - Τα σαββατοκύριακα δεν δουλεύω.
        - - вопрос и прощание
          - Εσύ τι κάνεις συνήθως; Τα λέμε!
  - type: exercise
    id: sentences
    title: Предложения о дне
    instruction: Переведите на греческий. Если в скобках дано начало, начните с него.
    format: text
    items:
      - id: q1
        prompt: Я встаю в семь.
        answer:
          - Σηκώνομαι στις επτά
          - Σηκώνομαι στις εφτά
          - Εγώ σηκώνομαι στις επτά
          - Εγώ σηκώνομαι στις εφτά
        explanation: "«Встаю» — σηκώνομαι; ξυπνάω — «просыпаюсь»."
      - id: q2
        prompt: Потом я выхожу из дома. (Μετά…)
        answer:
          - Μετά βγαίνω από το σπίτι
      - id: q3
        prompt: Вечером я возвращаюсь домой. (Το βράδυ…)
        answer:
          - Το βράδυ γυρίζω σπίτι
          - Το βράδυ γυρίζω στο σπίτι
        explanation: Γυρίζω σπίτι — «возвращаюсь домой», обычно без предлога.
      - id: q4
        prompt: По выходным я не работаю. (Τα σαββατοκύριακα…)
        answer:
          - Τα σαββατοκύριακα δεν δουλεύω
      - id: q5
        prompt: Я ложусь спать в одиннадцать.
        answer:
          - Πάω για ύπνο στις έντεκα
          - Πηγαίνω για ύπνο στις έντεκα
          - Κοιμάμαι στις έντεκα
      - id: q6
        prompt: У меня нет времени.
        answer:
          - Δεν έχω χρόνο
        explanation: Ο χρόνος — «время» как запас; после έχω — χρόνο, без ς.
      - id: q7
        prompt: Что ты обычно делаешь вечером?
        answer:
          - Τι κάνεις συνήθως το βράδυ
          - Τι κάνεις το βράδυ συνήθως
          - Συνήθως τι κάνεις το βράδυ
          - Τι κάνεις συνήθως τα βράδια
  - type: writing
    id: my-day
    register: friendly
    prompt: "Ваша греческая подруга Ελένη спрашивает в письме: «Πώς είναι η μέρα σου στην Κύπρο;» («Какой у тебя день на Кипре?»). Ответьте ей, 40–60 слов: во сколько вы просыпаетесь и встаёте, что делаете утром, днём и вечером, что делаете по выходным. В конце спросите о её дне и попрощайтесь."
    words:
      min: 40
      max: 60
    model: |-
      Γεια σου, Ελένη!
      Τι κάνεις; Συνήθως ξυπνάω στις επτά και σηκώνομαι στις επτά και μισή. Βγαίνω από το σπίτι στις οκτώ και αρχίζω δουλειά στις εννέα. Όταν γυρίζω σπίτι το απόγευμα, κάνω βόλτα. Το βράδυ διαβάζω ελληνικά ή βλέπω τηλεόραση. Τα σαββατοκύριακα δεν δουλεύω και δεν ξυπνάω ποτέ νωρίς! Εσύ τι κάνεις συνήθως;
      Τα λέμε!
      Ξένια
    criteria:
      - Есть дружеское обращение (Γεια σου, Ελένη!), прощание (Τα λέμε!) и придуманное имя
      - Рассказано об утре, дне, вечере и выходных — по порядку
      - Глаголы о себе — в форме «я» (ξυπνάω, σηκώνομαι, γυρίζω), а не «он/она» (ξυπνάει)
      - "Есть время: στις + час и το πρωί / το απόγευμα / το βράδυ"
      - Есть хотя бы два наречия частоты; ποτέ — вместе с δεν
      - Предложения связаны словами και, αλλά, μετά, όταν или γιατί
      - В конце есть вопрос подруге со знаком «;»
      - 40–60 слов, тонос в словах из двух и больше слогов
  - type: explanation
    id: speaking-how
    title: Первый монолог
    body: |-
      Во второй части устного экзамена вы говорите сами, около минуты, без подготовки: экзаменатор даёт тему, например «Μιλήστε για μια συνηθισμένη μέρα σας» — «Расскажите о своём обычном дне».

      Держитесь того же плана, что и в письме: **утро → день → вечер → выходные**. Минуту заполнят 8–10 коротких предложений. Не молчите: если забыли слово, скажите проще или заполните паузу — «Ε…». Лучше простое предложение без ошибки, чем длинное с остановками.

      Запишите монолог на телефон, прослушайте и сверьте с критериями. Если получилось меньше 45 секунд — добавьте, что делаете по выходным или с кем гуляете.
  - type: speaking
    id: my-day-talk
    part: monologue
    prompt: |-
      Монолог, 1 минута. Экзаменатор говорит: «Μιλήστε για μια συνηθισμένη μέρα σας» — «Расскажите о своём обычном дне». Опирайтесь на вопросы:
      Τι ώρα ξυπνάτε; Τι κάνετε το πρωί; Τι κάνετε το απόγευμα και το βράδυ; Τι ώρα πάτε για ύπνο; Τι κάνετε τα σαββατοκύριακα;
    seconds: 60
    model: Συνήθως ξυπνάω στις έξι και μισή, αλλά σηκώνομαι στις επτά. Βγαίνω από το σπίτι στις οκτώ και αρχίζω δουλειά στις εννέα. Τελειώνω στις πέντε. Όταν γυρίζω σπίτι, κάνω βόλτα με τη φίλη μου. Το βράδυ διαβάζω ελληνικά, γιατί τώρα μένω στην Κύπρο. Μετά βλέπω λίγο τηλεόραση. Δεν κοιμάμαι ποτέ αργά, πάω για ύπνο στις έντεκα. Τα σαββατοκύριακα δεν δουλεύω. Ξυπνάω αργά και μερικές φορές έρχονται οι φίλοι μου.
    criteria:
      - Говорили около минуты (не меньше 45 секунд) без длинных пауз
      - Рассказали об утре, дне, вечере и выходных
      - Назвали время хотя бы три раза (στις επτά, στις έντεκα…)
      - Использовали хотя бы три слова частоты или порядка (συνήθως, πάντα, μερικές φορές, δεν… ποτέ, μετά, όταν)
      - Формы о себе правильные — ξυπνάω, σηκώνομαι, κοιμάμαι, а не ξυπνάει, σηκώνεται
      - Ударение на своём месте — ξυπνάω, σηκώνομαι, τηλεόραση, απόγευμα
  - type: exercise
    id: review-forms
    title: Повторение — формы глаголов
    instruction: Выберите форму глагола.
    format: choice
    items:
      - id: q1
        prompt: Ο Στέλιος ___ στις επτά. (σηκώνομαι)
        options:
          - σηκώνομαι
          - σηκώνεσαι
          - σηκώνεται
        answer: σηκώνεται
      - id: q2
        prompt: Εμείς ___ ελληνικά. (μιλάω)
        options:
          - μιλάμε
          - μιλάτε
          - μιλάει
        answer: μιλάμε
      - id: q3
        prompt: Εσύ ___ τηλεόραση το βράδυ; (βλέπω)
        options:
          - βλέπει
          - βλέπεις
          - βλέπουμε
        answer: βλέπεις
      - id: q4
        prompt: Οι γονείς μου ___ την Κυριακή. (έρχομαι)
        options:
          - έρχεται
          - έρχονται
          - έρχομαι
        answer: έρχονται
        explanation: "Родители — «они»: έρχονται."
      - id: q5
        prompt: Συγγνώμη, εγώ δεν ___ αύριο. (μπορώ)
        options:
          - μπορώ
          - μπορεί
          - μπορείς
        answer: μπορώ
      - id: q6
        prompt: Τι ώρα ___ τα παιδιά; (κοιμάμαι)
        options:
          - κοιμάται
          - κοιμούνται
          - κοιμάμαι
        answer: κοιμούνται
        explanation: "Τα παιδιά — «они»: κοιμούνται."
  - type: exercise
    id: review-frequency
    title: Повторение — как часто
    instruction: Выберите греческое предложение с тем же смыслом.
    format: choice
    items:
      - id: q1
        prompt: Я иногда гуляю вечером.
        options:
          - Μερικές φορές κάνω βόλτα το βράδυ.
          - Πάντα κάνω βόλτα το βράδυ.
          - Δεν κάνω ποτέ βόλτα το βράδυ.
        answer: Μερικές φορές κάνω βόλτα το βράδυ.
      - id: q2
        prompt: Он всегда возвращается поздно.
        options:
          - Συχνά γυρίζει αργά.
          - Πάντα γυρίζει αργά.
          - Πάντα γυρίζει νωρίς.
        answer: Πάντα γυρίζει αργά.
      - id: q3
        prompt: Мы никогда не смотрим телевизор.
        options:
          - Δεν βλέπουμε ποτέ τηλεόραση.
          - Βλέπουμε ποτέ τηλεόραση.
          - Δεν βλέπετε ποτέ τηλεόραση.
        answer: Δεν βλέπουμε ποτέ τηλεόραση.
        explanation: Ποτέ — с δεν; «мы» — -ουμε, а -ετε — «вы».
      - id: q4
        prompt: Ты часто ждёшь автобус? (το λεωφορείο — автобус)
        options:
          - Περιμένεις συχνά το λεωφορείο;
          - Περιμένει συχνά το λεωφορείο;
          - Περιμένεις πάντα το λεωφορείο;
        answer: Περιμένεις συχνά το λεωφορείο;
  - type: exercise
    id: review-dialogue
    title: Повторение — диалог
    instruction: Дополните диалог. Два варианта лишние.
    format: gap
    bank:
      - Τι ώρα ξυπνάς
      - Τι κάνεις συνήθως το πρωί
      - δεν έχω χρόνο
      - πάω για ύπνο
      - τα σαββατοκύριακα
      - Τι ώρα είναι
      - Καλημέρα
    items:
      - id: g1
        prompt: — ___; — Συνήθως ξυπνάω στις επτά.
        answer: Τι ώρα ξυπνάς
      - id: g2
        prompt: — ___; — Το πρωί διαβάζω ελληνικά.
        answer: Τι κάνεις συνήθως το πρωί
      - id: g3
        prompt: — Πάμε για καφέ; — Συγγνώμη, ___. (Πάμε για καφέ; — Пойдём на кофе?)
        answer: δεν έχω χρόνο
      - id: g4
        prompt: — Είναι έντεκα, ___. Καληνύχτα! — Καληνύχτα!
        answer: πάω για ύπνο
      - id: g5
        prompt: — Δουλεύεις το Σάββατο; — Όχι, ___ δεν δουλεύω.
        answer: τα σαββατοκύριακα
