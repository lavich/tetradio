blocks:
  - type: explanation
    id: scheme
    title: Сильные и слабые стороны в пяти шагах
    body: |-
      Вопрос **What are your strengths and weaknesses?** задают почти на каждом собеседовании. Интервьюер проверяет, знаете ли вы себя и умеете ли работать над собой. Ответ укладывается примерно в 90 секунд.

      **1. Сильная сторона с примером.** Назовите качество и подтвердите его случаем: **My biggest strength is that I break problems down.**

      **2. Вторая сильная сторона.** Одна фраза: **I'm good at explaining technical ideas to non-technical people.**

      **3. Слабая сторона.** Выберите качество, которое не мешает главной работе роли, и назовите его спокойно: **I used to spend too long on small details.**

      **4. Что вы делаете.** Назовите шаг, который уже помогает: **Now I set a time limit for each task.**

      **5. Итог.** Свяжите ответ с ролью: **I think these strengths fit the role.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - сильная сторона и пример
          - 30 секунд
          - My biggest strength is that I break problems down.
        - - вторая сильная сторона
          - 15 секунд
          - I'm good at explaining technical ideas to non-technical people.
        - - слабая сторона
          - 15 секунд
          - I used to spend too long on small details.
        - - что вы делаете
          - 20 секунд
          - Now I set a time limit for each task.
        - - итог
          - 10 секунд
          - I think these strengths fit the role.
  - type: explanation
    id: safe-opinion
    title: Как говорить о слабости и о несогласии спокойно
    body: |-
      **Слабая сторона** — реальная, небольшая и с действием. Утверждение «у меня нет слабых сторон» звучит как уход от вопроса. Клише вроде *I work too hard* или *I'm a perfectionist* интервьюер слышит много раз и не получает сведений о вас. Сильнее звучит факт из практики и шаг, который вы сделали: **I used to spend too long on small details, so I now set a time limit.** Ответ без самообвинения: достаточно назвать склонность и то, что вы с ней делаете.

      **Несогласие с решением** строится в четыре шага: признайте довод, назовите сомнение или свой довод, предложите проверить его фактами и скажите, что поддержите решение команды. Цель такого ответа — показать, что вы можете спорить о решении и остаться в одной команде. Говорите о решении и его последствиях. Люди, которые его приняли, в ответе не оцениваются. Ситуации и данные в уроке придуманы: в своих ответах приводите обобщённые примеры без названий клиентов и внутренних данных прежних работодателей.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - I have no weaknesses.
          - One thing I'm working on is delegating more.
          - слабая сторона названа спокойно
        - - I work too hard. I'm a perfectionist.
          - I used to spend too long on small details, so I now set a time limit.
          - факт из практики и действие
        - - You are wrong about the cache.
          - I'm not sure that a cache is enough.
          - довод о решении
        - - Your team made a bad decision.
          - I'd put more weight on the maintenance cost.
          - довод вместо оценки
        - - I will never accept this.
          - Either way, I'll support the team's decision.
          - готовность работать вместе
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы предлагаете закончить спор, посмотрев на данные.
        options:
          - Let's look at the evidence.
          - Could we agree to disagree on this one?
          - I'm happy to be proven wrong.
        answer: Let's look at the evidence.
        explanation: Фраза предлагает обратиться к доказательствам; остальные оставляют спор открытым или признают возможную ошибку.
      - id: q2
        prompt: Спор не сходится, и вы предлагаете оставить каждого при своём мнении.
        options:
          - Could we agree to disagree on this one?
          - What would change your mind?
          - Either way, I'll support the team's decision.
        answer: Could we agree to disagree on this one?
        explanation: Фраза предлагает остаться при своих мнениях; остальные задают вопрос или обещают поддержку.
      - id: q3
        prompt: Вы хотите узнать, какой довод заставил бы собеседника передумать.
        options:
          - What would change your mind?
          - I'd argue that we should wait for more data.
          - In my opinion, a rewrite would be too risky.
        answer: What would change your mind?
        explanation: Фраза — вопрос о доводе; остальные высказывают собственное мнение.
      - id: q4
        prompt: Вы признаёте, что довод собеседника справедлив и нов для вас.
        options:
          - That's a fair point, and I hadn't thought of that.
          - I'd respectfully disagree.
          - Let's look at the evidence.
        answer: That's a fair point, and I hadn't thought of that.
        explanation: Фраза принимает довод; остальные возражают или предлагают проверку.
      - id: q5
        prompt: Решение принято не так, как вы предлагали, и вы заверяете, что будете работать по нему.
        options:
          - Either way, I'll support the team's decision.
          - I'm happy to be proven wrong.
          - As far as I'm concerned, readable code matters more than clever code.
        answer: Either way, I'll support the team's decision.
        explanation: Фраза обещает поддержку решения; остальные говорят о готовности ошибаться и о читаемости кода.
      - id: q6
        prompt: Вы высказываете своё мнение о переписывании системы с нуля.
        options:
          - In my opinion, a rewrite would be too risky.
          - As far as I'm concerned, readable code matters more than clever code.
          - I'd argue that we should wait for more data.
        answer: In my opinion, a rewrite would be too risky.
        explanation: Фраза говорит именно о переписывании; остальные о читаемом коде и об ожидании данных.
  - type: exercise
    id: answer-choice
    title: Формулировка для ответа
    instruction: Выберите формулировку, которая подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: Вы называете слабую сторону спокойно и говорите, что с ней делаете.
        options:
          - I used to spend too long on small details, so I now set a time limit.
          - I have no weaknesses.
          - I am bad at everything, to be honest.
        answer: I used to spend too long on small details, so I now set a time limit.
        explanation: Фраза называет склонность и действие; остальные отрицают вопрос или обвиняют себя.
      - id: q2
        prompt: Вы называете сильную сторону и подкрепляете её примером.
        options:
          - My biggest strength is that I break problems down; last year I split a migration into small steps.
          - My biggest strength is everything.
          - I am just very good, and that is all.
        answer: My biggest strength is that I break problems down; last year I split a migration into small steps.
        explanation: Фраза называет качество и случай; остальные ничего не подтверждают.
      - id: q3
        prompt: Вы не согласны с решением команды и приводите довод о самом решении.
        options:
          - I'm not sure that a cache is enough, because most queries are different.
          - Whoever chose a cache did not think.
          - This team is wrong.
        answer: I'm not sure that a cache is enough, because most queries are different.
        explanation: Фраза называет сомнение и причину; остальные оценивают людей.
      - id: q4
        prompt: Вы говорите, что готовы пересмотреть мнение после проверки.
        options:
          - I'm happy to be proven wrong.
          - I never change my mind.
          - It is not possible to prove me wrong.
        answer: I'm happy to be proven wrong.
        explanation: Фраза выражает готовность согласиться с доводом; остальные закрывают обсуждение.
