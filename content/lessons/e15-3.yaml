  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании с HR, Astrid задаёт вопросы и возражает вам. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику назовите две сильные стороны и одну слабую с действием. На вторую приведите пример. На третью вежливо не согласитесь с решением о релизах по четвергам. На четвёртую признайте довод и предложите проверку. На пятую скажите, что поддержите решение команды. На последнюю поблагодарите и задайте вопрос. Вся ваша часть — 150 секунд, каждая реплика — две-четыре фразы.
    seconds: 150
    model: |-
      Astrid: Welcome back. Let's talk about how you work. What are your strengths and weaknesses?
      You: Thank you for the question. My biggest strength is that I break problems down. I'm also good at explaining technical ideas to non-technical people. As for weaknesses, I used to spend too long on small details, so now I set a time limit for each task.
      Astrid: Thank you. Could you give me an example of the strength you mentioned?
      You: Last year, I split a large migration into small steps, each with its own test. That made the risk easy to see, and we finished on time.
      Astrid: Now a different topic. Our engineers decided to release only on Thursdays, even though some people prefer to release every day. Do you agree with that decision?
      You: I see your point about Thursdays, because a fixed day makes releases predictable. But I'm not sure that it is the safest option. In my opinion, smaller releases carry less risk, so I tend to think that releasing more often would help.
      Astrid: I see. But many engineers on the team prefer Thursdays, because it gives them time to fix problems before the weekend. How would you respond to that?
      You: That's a fair point, and I hadn't thought of that. Could we try small releases on other days for a month and look at the evidence?
      Astrid: That's a fair point. What would you do if the team still decided to keep Thursdays?
      You: Either way, I'll support the team's decision. I'd just ask to review the numbers together after a few months.
      Astrid: Thank you. That is a constructive way to talk about a disagreement. Do you have any questions for me?
      You: Thank you. Yes, I have one question: how does the team review its release process? I'd be glad to work with the team.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — две-четыре фразы
      - В первой реплике названы две сильные стороны и слабая сторона с действием
      - Во второй реплике есть пример
      - В третьей реплике несогласие вежливое и касается решения (I see your point, but…, I'm not sure that…)
      - В четвёртой реплике признан довод и предложена проверка фактами
      - В пятой реплике названа готовность поддержать решение команды
      - В конце есть благодарность, вопрос и готовность работать с командой
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: If the team ___ the cache, the search would be faster. (воображаемая ситуация)
        options:
          - added
          - adds
          - will add
        answer: added
        explanation: Second conditional — if + past simple, would + базовая форма.
      - id: q2
        prompt: «Do you agree with the plan?» → He asked me ___ I agreed with the plan.
        options:
          - whether
          - that
          - what
        answer: whether
        explanation: В косвенном вопросе без вопросительного слова стоит whether или if.
      - id: q3
        prompt: The engineer ___ proposed the change is on leave.
        options:
          - who
          - which
          - whose
        answer: who
        explanation: Для человека в определительном придаточном стоит who; which относится к вещам, whose требует существительного.
      - id: q4
        prompt: Вы не вполне уверены и говорите осторожно. Какая фраза подходит?
        options:
          - I'd say it depends on the size of the input.
          - It definitely depends of the size of the input.
          - I am completely sure it depends from the size.
        answer: I'd say it depends on the size of the input.
        explanation: I'd say смягчает утверждение; в остальных вариантах неверный предлог или полная уверенность.
      - id: q5
        prompt: If I had asked for a review, I ___ the bug. (прошлое, которого не было)
        options:
          - would have found
          - would find
          - had found
        answer: would have found
        explanation: Conditional 3 — would have и третья форма глагола.
      - id: q6
        prompt: Let me ___ the problem back in my own words.
        options:
          - say
          - to say
          - saying
        answer: say
        explanation: После let me стоит глагол без to.
