  - type: writing
    id: opinion
    register: formal
    prompt: "Напишите комментарий в обсуждении вымышленного RFC (130–170 слов): признайте довод автора, назовите сомнение, приведите довод и предложите шаг. Используйте не меньше трёх выражений урока (например, In my opinion, I would argue that, On balance, evidence). Предложение придумайте сами."
    words:
      min: 130
      max: 170
    model: |-
      Subject: Comment on the reporting RFC

      Dear all,

      Thank you for the RFC. I see your point that the current reporting module is hard to maintain, and I agree that the problem is real.

      However, I am not sure that a full rewrite is the right first step. In my opinion, a rewrite would be too risky, because the module has no automated tests and three teams depend on it. The last two migrations in our department also took longer than planned, which suggests that estimates for work like this are optimistic.

      I would argue that we should start with a smaller change. We could add tests for the most used reports and then replace one report at a time. On balance, this plan gives us the same result with less risk.

      I am happy to be proven wrong, and I am ready to help with either approach. Could we discuss the options at the next meeting?

      Kind regards
    criteria:
      - 130–170 слов, есть тема письма, обращение, согласие с частью довода, сомнение, довод и вежливое завершение
      - Довод автора признан до возражения (I see your point…)
      - Возражение сформулировано вежливо и касается самого решения
      - Приведён довод или факт, предложен смягчённый альтернативный шаг
      - Использованы не меньше трёх выражений урока
      - RFC и данные придуманы, реальных систем и компаний нет
      - Формальный стиль без сокращений
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Пятнадцатый ответ вашего **банка ответов** — **What are your strengths and weaknesses?** К нему добавляется второй вопрос о несогласии с решением: **Do you agree with that decision?** Первый ответ занимает до 90 секунд, второй — до минуты.

      1) Разложите первый ответ по пяти шагам: сильная сторона с примером, вторая сильная сторона, слабая сторона, что вы делаете, итог. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: у слабой стороны есть действие, нет самообвинения и клише. 4) Для второго вопроса назовите довод собеседника, своё сомнение, предложение проверить и готовность поддержать решение.

      Сцена в конце урока проходит на собеседовании с HR, Astrid спрашивает о сильных и слабых сторонах, затем возражает вам. Реплики Astrid записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: strengths
    part: interview
    prompt: "Интервьюер спрашивает: «What are your strengths and weaknesses?» Ответьте за 90 секунд: две сильные стороны (одну с примером), одна слабая сторона и то, что вы с ней делаете."
    seconds: 90
    model: "Thank you for the question. My biggest strength is that I break problems down. I am analytical: I start with the logs and the metrics. At my last job, we had to migrate a large service, and I split the work into small steps, each with its own test. That made the risk easy to see, and we finished on time. I am also pragmatic: I ship a simple fix first and improve it later. As for my weakness, I used to spend too long on small details. For example, I once spent a whole afternoon on a variable name in a pull request. Now I set a time limit for each task, and I ask a colleague to check the details at the end. It works well, and my last three releases were on schedule. I think these strengths fit the role, and I am working on the weakness."
    criteria:
      - Шаги идут по порядку — сильная сторона с примером, вторая сильная сторона, слабая сторона, действие, итог
      - Слабая сторона названа спокойно, есть то, что вы с ней делаете
      - Нет клише («я перфекционист») и самообвинения
      - Использованы не меньше двух слов урока (например, analytical, systematic, pragmatic)
      - Пример придуман, названий компаний и внутренних цифр нет
      - Ответ укладывается в 90 секунд
  - type: speaking
    id: decision
    part: monologue
    prompt: "Интервьюер спрашивает: «Our team has decided to keep the current database. Do you agree with that decision?» Ответьте за 60 секунд: признайте довод, назовите сомнение, предложите проверить и скажите, что поддержите решение команды."
    seconds: 60
    model: I see your point about keeping it. Moving the data would take months, and the team knows the current database well. But I am not sure that it will handle the growth we expect. In my opinion, it is worth testing it with the expected load before we commit. If the test shows that it copes, I would happily support the decision. If it does not, I would suggest a gradual move to a second database, one service at a time. Either way, I will support the team's decision.
    criteria:
      - Довод признан до возражения
      - Сомнение названо вежливо (I'm not sure that…, In my opinion…) и касается решения
      - Предложена проверка фактами
      - Есть готовность поддержать решение команды
      - Нет оценки людей, которые приняли решение
      - Ответ укладывается в 60 секунд
