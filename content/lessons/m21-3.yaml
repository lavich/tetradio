title: Приглашение и вежливый отказ — два письма, интервью, ролевая игра
kind: lesson
items:
  - { kind: word, id: w793 } # η φιλία
  - { kind: word, id: w807 } # ο γνωστός
  - { kind: word, id: w808 } # η έξοδος
  - { kind: word, id: w813 } # υπόσχομαι
  - { kind: word, id: w824 } # η γνωριμία
  - { kind: word, id: w826 } # ο κολλητός
  - { kind: phrase, id: p284 } # Ευχαριστώ για την πρόσκληση!
  - { kind: phrase, id: p285 } # Θα χαρώ πολύ αν έρθεις.
blocks:
  - type: explanation
    id: friends
    title: Друзья, знакомые, обещания
    body: |-
      **Ο φίλος, η φίλη** — друг, подруга (модуль 01). Самый близкий друг в разговоре — **ο κολλητός, η κολλητή**: Η Μαρίνα είναι η κολλητή μου από το σχολείο. **Ο γνωστός, η γνωστή** — знакомый, знакомая: Δεν είναι φίλος μου, είναι ένας γνωστός μου από τη δουλειά. (Как прилагательное γνωστός значит ещё и «известный».)

      **Η φιλία** — дружба: Ευχαριστώ για τη φιλία σου! **Η γνωριμία** — знакомство; **κάνω γνωριμίες** — «знакомлюсь с людьми»: Στο μάθημα ελληνικών έκανα πολλές γνωριμίες.

      **Η έξοδος** — выход: вы знаете её по фразе Στον κυκλικό κόμβο πάρτε την τρίτη έξοδο (модуль 12). Ещё это «вечер вне дома, выход в город»: Η πρώτη μας έξοδος με την παρέα ήταν σε μια ταβέρνα. Это слово женского рода на -ος, как η λεωφόρος: η έξοδος, την έξοδο, οι έξοδοι.

      **Υπόσχομαι** — «обещаю», спрягается как δέχομαι: υπόσχομαι, υπόσχεσαι, υπόσχεται, υποσχόμαστε, υπόσχεστε, υπόσχονται. Что обещаете — **να** + глагол: **Σου υπόσχομαι να έρθω την άλλη φορά.** Коротко: **Το υπόσχομαι!** — «Обещаю!». Аорист — υποσχέθηκα.

      Две фразы для писем. **Ευχαριστώ για την πρόσκληση!** — «Спасибо за приглашение!»; на «вы» — Σας ευχαριστώ για την πρόσκληση. **Θα χαρώ πολύ αν έρθεις.** — «Буду очень рад(а), если ты придёшь»; на «вы» — αν έρθετε. После αν «если» — форма как после να, без θα (урок 2).
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - η κολλητή μου
          - моя лучшая подруга
        - - ένας γνωστός μου
          - мой знакомый
        - - κάνω γνωριμίες
          - знакомлюсь с людьми
        - - Σου υπόσχομαι να έρθω.
          - Обещаю тебе, что приду.
        - - Ευχαριστώ για την πρόσκληση!
          - Спасибо за приглашение!
        - - Θα χαρώ πολύ αν έρθεις.
          - Буду очень рад(а), если ты придёшь.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: friends-choice
    title: Друг, знакомый, обещание
    instruction: Выберите подходящее слово.
    format: choice
    items:
      - id: q1
        prompt: Η Άννα είναι η ___ μου — είμαστε φίλες από το σχολείο.
        options:
          - κολλητή
          - γνωστή
          - καλεσμένη
        answer: κολλητή
        explanation: Подруги со школы — лучшая подруга; γνωστή — просто знакомая.
      - id: q2
        prompt: Δεν τον ξέρω καλά, είναι ένας ___ μου από τη δουλειά.
        options:
          - γνωστός
          - κολλητός
          - φίλος
        answer: γνωστός
        explanation: Не знаю его хорошо — значит, знакомый, не друг.
      - id: q3
        prompt: Στο μάθημα ελληνικών κάνω πολλές ___. (знакомлюсь с людьми)
        options:
          - γνωριμίες
          - δικαιολογίες
          - εξόδους
        answer: γνωριμίες
      - id: q4
        prompt: Θα έρθω την άλλη φορά — σου το ___!
        options:
          - υπόσχομαι
          - υπόσχεσαι
          - δέχομαι
        answer: υπόσχομαι
        explanation: Обещаю я — υπόσχομαι; Σου το υπόσχομαι — «Обещаю тебе».
      - id: q5
        prompt: Το Σάββατο έχουμε ___ με την παρέα — σινεμά και μετά ταβέρνα.
        options:
          - έξοδο
          - φιλία
          - γνωστό
        answer: έξοδο
        explanation: Η έξοδος — вечер вне дома; после έχουμε — вин. п. την έξοδο.
  - type: explanation
    id: friendly-how
    title: Письмо A — приглашение другу
    body: |-
      Задание A экзамена — дружеский текст 80–100 слов. Приглашение — частая тема: другу пишут о празднике, выходе в город, поездке.

      План из пяти шагов:

      1. Приветствие: Γεια σου, …! Τι κάνεις;
      2. Повод и приглашение: Το Σάββατο είναι τα γενέθλιά μου και θέλω να σε καλέσω σε ένα πάρτι…
      3. Когда, где и что будет: Αρχίζουμε στις οκτώ… Θα έχουμε φαγητό και μουσική…
      4. Как добраться или помощь: Επειδή το σπίτι μου είναι μακριά, μπορώ να περάσω να σε πάρω… / Αν θέλεις, φέρε και…
      5. Просьба ответить и прощание: Πες μου μέχρι την Πέμπτη αν μπορείς. Θα χαρώ πολύ αν έρθεις! Τα λέμε! или Φιλιά!

      Покажите грамматику модуля: Θέλω να σε καλέσω…, для чего — για να или να (περνάω να σε πάρω), и два-три союза — επειδή, γιατί, αν, όταν, αλλά.

      Проверьте себя. После αν «если» и όταν о будущем — форма без θα: αν έρθεις (но Πες μου αν θα έρθεις — «придёшь ли»). Τα γενέθλιά μου — с двумя ударениями. Всё письмо — на «ты».
  - type: writing
    id: party-invite
    register: friendly
    prompt: "В субботу 14 ноября у вас день рождения. Напишите другу Андреасу (Αντρέας) письмо 80–100 слов: пригласите его на праздник, скажите, где и во сколько он будет и что вы будете делать, предложите заехать за ним или объясните, как добраться, и попросите ответить до какого-то дня. Используйте хотя бы два союза (επειδή, γιατί, αν, όταν, αλλά) и одно να или για να со значением цели."
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Αντρέα!

      Τι κάνεις; Το Σάββατο 14 Νοεμβρίου είναι τα γενέθλιά μου και θέλω να σε καλέσω σε ένα πάρτι στο σπίτι μου, στη Λάρνακα. Αρχίζουμε στις οκτώ το βράδυ. Θα έχουμε φαγητό, μουσική και χορό, και θα έρθουν και οι συνάδελφοί μου από τη δουλειά. Επειδή το σπίτι μου είναι μακριά από το κέντρο, μπορώ να περάσω να σε πάρω στις επτά και μισή. Αν θέλεις, φέρε και τη Σοφία. Δώρα δεν χρειάζονται! Πες μου μέχρι την Πέμπτη αν μπορείς να έρθεις. Θα χαρώ πολύ αν έρθεις!

      Φιλιά,
      Βέρα
    criteria:
      - 80–100 слов; дружеское приветствие и прощание (Γεια σου…! — Τα λέμε! / Φιλιά,), всё письмо на «ты»
      - Есть приглашение (Θέλω να σε καλέσω… / Θέλεις να έρθεις…;) и повод
      - "Сказано, когда, где и что будет: день, время, место"
      - Есть предложение помочь или объяснение, как добраться (περνάω να σε πάρω…)
      - Есть просьба ответить (Πες μου μέχρι…)
      - "Не меньше двух союзов (επειδή, γιατί, αν, όταν, αλλά) и να / για να со значением цели"
      - После αν «если» и όταν — форма без θα (αν έρθεις); τα γενέθλιά μου — два ударения
  - type: explanation
    id: formal-how
    title: Письмо B — вежливый отказ
    body: |-
      Задание B — менее дружеский, ближе к официальному текст 80–100 слов. Отказаться от официального приглашения — от директора школы, начальника, организации — нужно особенно вежливо: поблагодарить, пожалеть, объяснить причину и сказать что-то хорошее.

      План из пяти шагов:

      1. Обращение: **Αγαπητή κυρία Χριστοδούλου,** / Αγαπητέ κύριε…, (модули 14 и 16).
      2. Благодарность: **Σας ευχαριστώ πολύ για την πρόσκληση** στην εκδήλωση…
      3. Отказ и причина: **Λυπάμαι πολύ, αλλά δυστυχώς δεν θα μπορέσω να έρθω** (θα μπορέσω — будущее от μπορώ), **γιατί** / **επειδή** … Если причину называть не хотите — **για προσωπικούς λόγους**.
      4. Что-то хорошее и другой раз: Η σχολή σας είναι πολύ καλή… **Αν οργανώσετε και άλλη εκδήλωση, θα χαρώ πολύ να έρθω.** Можно пожелать: **Σας εύχομαι μια ωραία βραδιά.** — «Желаю вам приятного вечера» (εύχομαι — желаю, η βραδιά — вечер).
      5. Концовка: **Με εκτίμηση,** или теплее, если вы знакомы, — **Με φιλικούς χαιρετισμούς,** — и вымышленная подпись.

      Всё письмо — на «вы»: σας, έρθετε, οργανώσετε. Не пишите здесь Γεια σου, Δεν έχω διάθεση или Κρίμα — это для друзей.
    table:
      columns:
        - другу
        - официально
      rows:
        - - Γεια σου, Αντρέα!
          - Αγαπητή κυρία Χριστοδούλου,
        - - Ευχαριστώ για την πρόσκληση!
          - Σας ευχαριστώ πολύ για την πρόσκληση.
        - - Δυστυχώς δεν μπορώ, γιατί δουλεύω.
          - Λυπάμαι πολύ, αλλά δυστυχώς δεν θα μπορέσω να έρθω, γιατί…
        - - Ίσως άλλη φορά.
          - Αν οργανώσετε και άλλη εκδήλωση, θα χαρώ πολύ να έρθω.
        - - Τα λέμε! / Φιλιά,
          - Με εκτίμηση, / Με φιλικούς χαιρετισμούς,
  - type: exercise
    id: formal-sentences
    title: Фразы для вежливого отказа
    instruction: Переведите на греческий, обращаясь на «вы». Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Большое спасибо за приглашение.
        answer:
          - Σας ευχαριστώ πολύ για την πρόσκληση.
          - Σας ευχαριστώ πολύ για την πρόσκλησή σας.
          - Ευχαριστώ πολύ για την πρόσκληση.
          - Ευχαριστώ πολύ για την πρόσκλησή σας.
        explanation: Την πρόσκλησή σας — второй тонос, как την απάντησή σας.
      - id: q2
        prompt: К сожалению, я не смогу прийти.
        answer:
          - Δυστυχώς δεν θα μπορέσω να έρθω.
          - Δυστυχώς, δεν θα μπορέσω να έρθω.
          - Δυστυχώς δεν θα μπορέσω να έλθω.
          - Δυστυχώς δεν μπορώ να έρθω.
          - Δυστυχώς, δεν μπορώ να έρθω.
        explanation: Θα μπορέσω — будущее от μπορώ (см. карточку); можно и просто δεν μπορώ.
      - id: q3
        prompt: по личным причинам
        answer:
          - για προσωπικούς λόγους
      - id: q4
        prompt: Буду очень рад(а), если вы придёте.
        answer:
          - Θα χαρώ πολύ αν έρθετε.
          - Θα χαρώ πολύ, αν έρθετε.
          - Θα χαρώ πολύ αν έλθετε.
          - Αν έρθετε, θα χαρώ πολύ.
          - Αν έρθετε θα χαρώ πολύ.
          - Αν έλθετε, θα χαρώ πολύ.
        explanation: После αν — έρθετε, без θα.
  - type: writing
    id: decline-invite
    register: formal
    prompt: "Директор вашей языковой школы «Ορίζοντες», госпожа Христодулу (κυρία Χριστοδούλου), прислала приглашение: «Η σχολή μας κλείνει δέκα χρόνια! Σας προσκαλούμε σε μια εκδήλωση την Παρασκευή 20 Νοεμβρίου στις επτά το απόγευμα.» (κλείνει δέκα χρόνια — ей исполняется десять лет). Вы не можете прийти. Напишите ей письмо 80–100 слов: поблагодарите, вежливо откажитесь и объясните причину, скажите что-нибудь хорошее о школе и о том, что придёте в другой раз."
    words:
      min: 80
      max: 100
    model: |-
      Αγαπητή κυρία Χριστοδούλου,

      Σας ευχαριστώ πολύ για την πρόσκλησή σας στην εκδήλωση την Παρασκευή. Λυπάμαι πολύ, αλλά δυστυχώς δεν θα μπορέσω να έρθω. Επειδή ένας συνάδελφός μου είναι άρρωστος, αυτή την εβδομάδα δουλεύω μέχρι τις εννιά το βράδυ, γι' αυτό δεν μπορώ να φύγω νωρίς. Η σχολή σας είναι πολύ καλή: όταν ήρθα στην Κύπρο, δεν ήξερα ελληνικά, και τώρα μιλάω με τους συναδέλφους μου στα ελληνικά. Αν οργανώσετε και άλλη εκδήλωση, θα χαρώ πολύ να έρθω. Σας εύχομαι μια ωραία βραδιά.

      Με φιλικούς χαιρετισμούς,
      Ναταλία Ορλόβα
    criteria:
      - 80–100 слов; официальное обращение (Αγαπητή κυρία…,) и концовка (Με εκτίμηση, / Με φιλικούς χαιρετισμούς,)
      - Всё письмо на «вы» (σας, οργανώσετε) — без Γεια σου и форм на «ты»
      - Есть благодарность за приглашение (Σας ευχαριστώ πολύ για την πρόσκληση…)
      - Есть вежливый отказ (Λυπάμαι πολύ, αλλά δυστυχώς δεν θα μπορέσω…) и причина с γιατί / επειδή / γι' αυτό
      - Сказано что-то хорошее и предложен другой раз (Αν οργανώσετε…, θα χαρώ…)
      - "Не меньше трёх союзов; после αν — форма без θα; второй тонос: την πρόσκλησή σας"
  - type: explanation
    id: speaking-how
    title: Интервью и ролевая игра
    body: |-
      **Интервью.** В первой части устного экзамена задают простые вопросы о вас. Тема «друзья» — одна из самых частых: **Έχετε φίλους στην Κύπρο;** **Πού βρίσκεστε με τους φίλους σας;** **Τι κάνετε μαζί;** Отвечайте не одним словом, а двумя-тремя фразами, и объясните почему — γιατί, επειδή.

      **Ролевая игра.** В третьей части вы говорите с другим экзаменуемым по карточке с ролью. Приглашение — классическая ситуация: один приглашает, другой не может в этот день, вместе вы находите другой день и договариваетесь о времени и месте. Нужно: пригласить (Θέλεις να…;), вежливо отказаться с причиной (Δυστυχώς δεν μπορώ, γιατί…), предложить другое (Τι λες για την Κυριακή;), согласиться (Ευχαρίστως! Καλή ιδέα!) и договориться (Πού θα βρεθούμε; Τι ώρα να περάσω να σε πάρω;).

      Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: friends-interview
    part: interview
    prompt: |-
      Экзаменатор спрашивает: «Έχετε φίλους στην Κύπρο; Πού βρίσκεστε με τους φίλους σας και τι κάνετε μαζί;»
      Ответьте четырьмя-шестью фразами, объясните хотя бы одно «почему». Запишите ответ.
    seconds: 60
    model: Ναι, έχω μερικούς καλούς φίλους στην Κύπρο. Η κολλητή μου είναι η Σβετλάνα — είναι κι αυτή από τη Ρωσία. Έκανα και πολλές γνωριμίες στο μάθημα ελληνικών. Με την παρέα μου βρισκόμαστε συνήθως το Σάββατο το βράδυ σε μια ταβέρνα ή σε ένα καφενείο. Το καλοκαίρι πάμε μαζί στη θάλασσα. Από Δευτέρα μέχρι Παρασκευή δεν βγαίνουμε συχνά, γιατί όλοι δουλεύουμε πολύ. Όταν κάποιος έχει γενέθλια, κάνουμε πάρτι στο σπίτι.
    criteria:
      - Ответили на все вопросы — есть ли друзья, где встречаетесь, что делаете вместе
      - Не меньше четырёх фраз, без долгих пауз
      - Объяснили почему (γιατί…, επειδή…) и использовали όταν или αν
      - Слова модуля — η παρέα, ο κολλητός / η κολλητή, οι γνωριμίες, τα γενέθλια
      - "Ударение на своём месте: γνωριμίες, γενέθλια, παρέα"
  - type: speaking
    id: invitation
    part: roleplay
    prompt: |-
      Ролевая игра. Вы звоните другу и приглашаете его на концерт в культурном центре в субботу вечером. Друг отвечает: «Δυστυχώς το Σάββατο δεν μπορώ, γιατί έχουμε τα γενέθλια της μητέρας μου».

      Ваша роль: пожалейте, узнайте, свободен ли он в воскресенье, предложите концерт в воскресенье, договоритесь о времени и месте, предложите за ним заехать. Говорите на «ты», произнесите реплики обеих ролей вслух и запишите.
    seconds: 120
    model: |-
      — Γεια σου, Πέτρο! Σε παίρνω για να σε καλέσω. Θέλεις να πάμε στη συναυλία στο πολιτιστικό κέντρο το Σάββατο το βράδυ;
      — Δυστυχώς το Σάββατο δεν μπορώ, γιατί έχουμε τα γενέθλια της μητέρας μου.
      — Κρίμα! Και την Κυριακή; Είσαι ελεύθερος; Η συναυλία είναι και την Κυριακή στις οκτώ.
      — Την Κυριακή, ναι. Ευχαρίστως! Πόσο κάνει το εισιτήριο;
      — Δέκα ευρώ. Αν θέλεις, αγοράζω εγώ τα εισιτήρια στο ίντερνετ.
      — Καλή ιδέα! Πού θα βρεθούμε;
      — Επειδή το κέντρο είναι μακριά από το σπίτι σου, περνάω να σε πάρω με το αυτοκίνητο. Στις επτά και μισή;
      — Συμφωνώ! Ευχαριστώ για την πρόσκληση!
      — Τίποτα! Τα λέμε την Κυριακή.
    criteria:
      - Пригласили (Θέλεις να πάμε…;) и объяснили, куда и когда
      - Отреагировали на отказ (Κρίμα! / Λυπάμαι…) и предложили другой день
      - Договорились о времени, месте и о том, кто за кем заедет (περνάω να σε πάρω)
      - "Хотя бы два союза: γιατί, επειδή, αν, όταν, αλλά"
      - Использовали фразы согласия (Ευχαρίστως! Καλή ιδέα! Συμφωνώ!)
      - Весь разговор на «ты»; ударение на своём месте (ευχαρίστως, συναυλία, εισιτήρια)
  - type: exercise
    id: review
    title: Повторение — модули 17–20
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - θα βρέξει
      - καλύτερος
      - την
      - Μην
      - να μάθω
      - πιο
    items:
