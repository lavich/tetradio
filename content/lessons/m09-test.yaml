title: Контрольная модуля 09
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, вежливые формы, слова и ситуации в кафе. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза; в каждом вопросе три варианта, верен один. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: chrysa
    title: Το νέο καφενείο
    text: |-
      Γεια σου, Ιρίνα!

      Ξέρεις το νέο καφενείο «Η Γωνιά»; Είναι κοντά στο σπίτι μου, δίπλα στον φούρνο. Πηγαίνω εκεί κάθε πρωί πριν από τη δουλειά. Ο κυπριακός καφές είναι πολύ ωραίος — εγώ πίνω πάντα έναν σκέτο. Έχουν και νόστιμα γλυκά, αλλά είναι λίγο ακριβά. Η σερβιτόρα, η κυρία Μαρούλα, είναι πολύ ευγενική και μιλάει και αγγλικά.

      Τις καθημερινές το καφενείο ανοίγει στις επτά, αλλά το Σάββατο ανοίγει στις δέκα. Πάμε μαζί το Σάββατο; Εγώ κερνάω!

      Τα λέμε,
      Χρύσα
    glosses:
      - text: νέο
        russian: новое
      - text: Η Γωνιά
        russian: «Уголок»
      - text: πριν από
        russian: перед, до
      - text: ευγενική
        russian: вежливая
      - text: Τις καθημερινές
        russian: по будням
  - type: exercise
    id: chrysa-tf
    about: chrysa
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το καφενείο είναι κοντά στο σπίτι της Χρύσας.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Η Χρύσα πηγαίνει στο καφενείο μόνο το Σάββατο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πηγαίνω εκεί κάθε πρωί — каждое утро перед работой.
      - id: q3
        prompt: Η Χρύσα πίνει τον καφέ της γλυκό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Εγώ πίνω πάντα έναν σκέτο — без сахара.
      - id: q4
        prompt: Τα γλυκά είναι φτηνά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είναι λίγο ακριβά — немного дорогие.
      - id: q5
        prompt: Η σερβιτόρα μιλάει αγγλικά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Το Σάββατο το καφενείο ανοίγει στις επτά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: В семь — по будням, а в субботу — в десять.
      - id: q7
        prompt: Το Σάββατο κερνάει η Ιρίνα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Εγώ κερνάω! — угощает Хриса, автор письма.
  - type: listening
    id: takeaway
    title: Καφές για πακέτο
    plays: 2
    transcript:
      - speaker: Μάριος
        text: Καλημέρα σας! Πείτε μου.
      - speaker: Νατάσα
        text: Καλημέρα. Θα ήθελα δύο κυπριακούς καφέδες, έναν μέτριο και έναν γλυκό.
      - speaker: Μάριος
        text: Για εδώ ή για πακέτο;
      - speaker: Νατάσα
        text: Για πακέτο, παρακαλώ. Ο φίλος μου είναι ήδη έξω.
      - speaker: Μάριος
        text: Θέλετε και ένα γλυκό; Σήμερα έχουμε πολύ ωραία γλυκά.
      - speaker: Νατάσα
        text: Όχι, ευχαριστώ. Μόνο ένα νερό. Πόσο κάνει;
      - speaker: Μάριος
        text: Οι δύο καφέδες τέσσερα ευρώ και το νερό ένα. Πέντε ευρώ.
      - speaker: Νατάσα
        text: Ορίστε δέκα.
      - speaker: Μάριος
        text: Και πέντε ρέστα. Ορίστε και οι καφέδες σας, ένας μέτριος και ένας σκέτος.
      - speaker: Νατάσα
        text: Συγγνώμη, αλλά ο φίλος μου θέλει γλυκό, όχι σκέτο.
      - speaker: Μάριος
        text: Α, συγγνώμη! Αμέσως!
      - speaker: Νατάσα
        text: Δεν πειράζει. Ευχαριστώ, γεια σας!
  - type: exercise
    id: takeaway-choice
    about: takeaway
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πόσους καφέδες παραγγέλνει η Νατάσα;
        options:
          - Έναν.
          - Δύο.
          - Τρεις.
        answer: Δύο.
      - id: q2
        prompt: Где они будут пить кофе?
        options:
          - на улице — кофе с собой
          - в кафе
          - дома у Натасы
        answer: на улице — кофе с собой
        explanation: Για πακέτο, παρακαλώ. Ο φίλος μου είναι ήδη έξω.
      - id: q3
        prompt: Τι παίρνει ακόμα η Νατάσα;
        options:
          - Ένα νερό.
          - Ένα γλυκό.
          - Τίποτα.
        answer: Ένα νερό.
        explanation: "Ловушка: сладкое предлагает Мариос, но Натаса отказывается — Όχι, ευχαριστώ. Μόνο ένα νερό."
      - id: q4
        prompt: Сколько стоит заказ?
        options:
          - 5 €
          - 10 €
          - 4 €
        answer: 5 €
        explanation: Два кофе — 4 €, вода — 1 €. Натаса даёт 10 € и получает 5 € сдачи.
      - id: q5
        prompt: В чём проблема?
        options:
          - Один кофе без сахара, а другу нужен сладкий.
          - Кофе холодный.
          - Сдача неправильная.
        answer: Один кофе без сахара, а другу нужен сладкий.
        explanation: Ένας μέτριος και ένας σκέτος — а заказан был γλυκός.
  - type: exercise
    id: polite
    graded: true
    title: Вежливые формы
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Θα ήθελα ___, παρακαλώ.
        options:
          - έναν καφέ
          - ένας καφές
          - τον καφές
        answer: έναν καφέ
        explanation: После θα ήθελα — винительный падеж.
      - id: q2
        prompt: Κύριε ___, θέλετε κάτι άλλο;
        options:
          - Πέτρο
          - Πέτρος
          - Πέτρε
        answer: Πέτρο
        explanation: При обращении ο Πέτρος → Πέτρο.
      - id: q3
        prompt: Официанту, на «вы». ___ μου ένα κουτάλι, παρακαλώ.
        options:
          - Φέρτε
          - Φέρε
          - Φέρνω
        answer: Φέρτε
        explanation: Φέρτε — «принесите» (на «вы»), φέρε — «принеси» (на «ты»).
      - id: q4
        prompt: Μπορώ να ___ ένα τσάι;
        options:
          - έχω
          - έχεις
          - έχετε
        answer: έχω
        explanation: "«Можно мне…?» — оба глагола в форме «я»: μπορώ να έχω."
      - id: q5
        prompt: Θα θέλαμε δύο ___ σκέτους.
        options:
          - κυπριακούς
          - κυπριακοί
          - κυπριακό
        answer: κυπριακούς
        explanation: Два кофе — мн. ч. мужского рода, винительный падеж — κυπριακούς σκέτους.
      - id: q6
        prompt: Οι πατάτες είναι ___.
        options:
          - τηγανητές
          - τηγανητοί
          - τηγανητό
        answer: τηγανητές
        explanation: "οι πατάτες — женский род, мн. ч.: τηγανητές."
      - id: q7
        prompt: Официанту, на «вы». — Τι μας ___; — Το ψητό ψάρι.
        options:
          - προτείνετε
          - προτείνεις
          - προτείνουμε
        answer: προτείνετε
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - ο κατάλογος
      - ο λογαριασμός
      - το φιλοδώρημα
      - το πιρούνι
      - το μαχαίρι
      - το επιδόρπιο
      - ο σερβιτόρος
      - το κουτάλι
      - η κανάτα
      - το φλιτζάνι
    items:
      - id: m1
        prompt: меню
        answer: ο κατάλογος
      - id: m2
        prompt: счёт
        answer: ο λογαριασμός
      - id: m3
        prompt: чаевые
        answer: το φιλοδώρημα
      - id: m4
        prompt: вилка
        answer: το πιρούνι
      - id: m5
        prompt: нож
        answer: το μαχαίρι
      - id: m6
        prompt: десерт
        answer: το επιδόρπιο
      - id: m7
        prompt: официант
        answer: ο σερβιτόρος
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы вошли в таверну и видите пустой столик.
        options:
          - Είναι ελεύθερο αυτό το τραπέζι;
          - Τον λογαριασμό, παρακαλώ.
          - Κερνάει το μαγαζί.
        answer: Είναι ελεύθερο αυτό το τραπέζι;
      - id: q2
        prompt: Вы поели и хотите заплатить.
        options:
          - Τον λογαριασμό, παρακαλώ.
          - Τι μας προτείνετε;
          - Για εδώ ή για πακέτο;
        answer: Τον λογαριασμό, παρακαλώ.
      - id: q3
        prompt: "Официант спрашивает «Μαζί ή χωριστά;». Каждый из вас платит за себя."
        options:
          - Χωριστά, παρακαλώ.
          - Μαζί.
          - Για πακέτο.
        answer: Χωριστά, παρακαλώ.
      - id: q4
        prompt: Вам принесли холодную еду.
        options:
          - Συγγνώμη, αλλά το φαγητό είναι κρύο.
          - Είναι πολύ νόστιμο!
          - Καλή όρεξη!
        answer: Συγγνώμη, αλλά το φαγητό είναι κρύο.
      - id: q5
        prompt: Вы хотите кипрский кофе без сахара.
        options:
          - Έναν κυπριακό σκέτο, παρακαλώ.
          - Έναν κυπριακό γλυκό, παρακαλώ.
          - Ένα τσάι σκέτο, παρακαλώ.
        answer: Έναν κυπριακό σκέτο, παρακαλώ.
