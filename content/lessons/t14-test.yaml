          - "I am thinking of coming over in spring."
          - "I am thinking of coming to see you in the spring."
          - "I am thinking of coming to see you in spring."
          - "I am thinking of coming to visit in the spring."
          - "I am thinking of coming to visit in spring."
          - "I am thinking of visiting you in the spring."
          - "I am thinking of visiting you in spring."
          - "I'm thinking of coming to visit you in the spring."
          - "I'm thinking of coming to visit you in spring."
          - "I'm thinking of coming over to see you in the spring."
          - "I'm thinking of visiting in the spring."
