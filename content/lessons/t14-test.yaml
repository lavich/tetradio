          - "When you're next in London, let me know."
          - "When you are next in London, let me know."
          - "Let me know next time you're in London."
          - "Let me know next time you are in London."
        explanation: После when стоит present simple, без will.
      - id: q4
        prompt: "Я думаю приехать к вам весной. (thinking of)"
        answer:
          - "I'm thinking of coming over in the spring."
          - "I'm thinking of coming over in spring."
          - "I'm thinking of coming to see you in the spring."
          - "I'm thinking of coming to see you in spring."
          - "I'm thinking of coming to visit in the spring."
          - "I'm thinking of coming to visit in spring."
          - "I'm thinking of visiting you in the spring."
          - "I'm thinking of visiting you in spring."
