          - "I bought our tickets yesterday."
          - "I bought tickets yesterday."
          - "I got the tickets yesterday."
          - "I got my tickets yesterday."
          - "I got our tickets yesterday."
          - "I got tickets yesterday."
          - "Yesterday I bought the tickets."
          - "Yesterday I bought my tickets."
