  - type: exercise
    id: where
    title: Куда идти
    instruction: Выберите магазин.
    format: choice
    items:
      - id: q1
        prompt: Πάω ___ για ψωμί.
        options:
          - στον φούρνο
          - στο χασάπικο
          - στο μανάβικο
        answer: στον φούρνο
      - id: q2
        prompt: Θέλω ένα κιλό κρέας. Πάω ___.
        options:
          - στο ζαχαροπλαστείο
          - στο χασάπικο
          - στο περίπτερο
        answer: στο χασάπικο
      - id: q3
        prompt: Αγοράζω ντομάτες και πατάτες ___.
        options:
          - στο μανάβικο
          - στον φούρνο
          - στο ζαχαροπλαστείο
        answer: στο μανάβικο
        explanation: Ντομάτες και πατάτες — λαχανικά, их продаёт το μανάβικο.
      - id: q4
        prompt: Αύριο είναι τα γενέθλια της Άννας. Πάω ___ για γλυκά. (τα γενέθλια της Άννας — день рождения Анны)
        options:
          - στο ζαχαροπλαστείο
          - στο χασάπικο
          - στο μανάβικο
        answer: στο ζαχαροπλαστείο
  - type: exercise
    id: quantity-choice
    title: Сколько
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Θέλω ένα κιλό ___, παρακαλώ.
        options:
          - ντομάτες
          - από ντομάτες
          - με ντομάτες
        answer: ντομάτες
        explanation: После меры продукт идёт сразу, без предлога — ένα κιλό ντομάτες.
      - id: q2
        prompt: Ένα ___ νερό, παρακαλώ.
        options:
          - μπουκάλι
          - κιλό
          - γραμμάριο
        answer: μπουκάλι
        explanation: Воду покупают бутылками — ένα μπουκάλι νερό.
      - id: q3
        prompt: Δώστε μου δύο ___ πατάτες.
        options:
          - κιλό
          - κιλά
        answer: κιλά
        explanation: После δύο — мн. ч. το κιλό → τα κιλά.
      - id: q4
        prompt: ___ κιλό φράουλες, παρακαλώ.
        options:
          - Μισό
          - Μισή
          - Μισός
        answer: Μισό
        explanation: το κιλό — средний род, поэтому μισό.
      - id: q5
        prompt: Αγοράζω τρία ___ γάλα.
        options:
          - κουτί
          - κουτιά
        answer: κουτιά
        explanation: "Средний род на -ι во мн. ч. — -ια: το κουτί → τα κουτιά."
      - id: q6
        prompt: Θέλω διακόσια ___ τυρί.
        options:
          - γραμμάριο
          - γραμμάρια
        answer: γραμμάρια
      - id: q7
        prompt: Θέλω ___ καρπούζι.
        options:
          - έναν
          - μία
          - ένα
        answer: ένα
        explanation: το καρπούζι — средний род, ένα.
      - id: q8
        prompt: Ψάχνω ___ καλό φούρνο εδώ κοντά.
        options:
          - έναν
          - ένας
          - ένα
        answer: έναν
        explanation: "ο φούρνος — мужской род, после ψάχνω — винительный падеж: έναν καλό φούρνο (перед κ буква ν остаётся)."
  - type: explanation
    id: prices
    title: Πόσο κάνει; Πόσο κοστίζει; — цены
    body: |-
      **Πόσο κάνει;** — «Сколько стоит?» (модуль 04). Если вещей несколько, глагол во множественном числе: **Πόσο κάνουν οι ντομάτες;** Будьте внимательны: по-русски «виноград» — одно слово в единственном числе, а по-гречески обычно говорят **τα σταφύλια** — мн. ч. (ένα σταφύλι — одна гроздь): **Πόσο κάνουν τα σταφύλια;** Так же οι φράουλες — «клубника».

      **Κοστίζω** — «стоить» — значит то же, но звучит чуть официальнее, его часто видно в рекламе и слышно в супермаркете: **Πόσο κοστίζει το καρπούζι;** — **Κοστίζει πέντε ευρώ.** Мн. ч. — **κοστίζουν**. В разговоре на рынке чаще κάνει.

      Цена «за килограмм» — **το κιλό** с артиклем: **Οι ντομάτες κάνουν δύο ευρώ το κιλό.** Узнать всю сумму: **Πόσο κάνουν όλα μαζί;** — «Сколько всё вместе?».

      **Το ευρώ** не склоняется и среднего рода: ένα ευρώ, τρία ευρώ, τέσσερα ευρώ. Центы — **τα λεπτά** (модуль 04). В греческих ценах запятая: 2,50 € — **δύο ευρώ και πενήντα λεπτά**, в разговоре просто **δύο και πενήντα**. Меньше евро — только λεπτά: 0,80 € — ογδόντα λεπτά.
    table:
