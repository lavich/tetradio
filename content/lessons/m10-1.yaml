  - type: explanation
    id: genitive
    title: Το μαγαζί του Νίκου — родительный падеж (узнавание)
    body: |-
      На вывесках и в разговоре вы часто услышите: **το μαγαζί του Νίκου** — «магазин Никоса», **ο φούρνος της Μαρίας** — «пекарня Марии». Это родительный падеж (η γενική): он отвечает на вопрос «чей?». Пока его достаточно **узнавать**; подробно — в модуле 12.

      Владелец стоит **после** вещи, с артиклем: **του** — если это мужчина, **της** — если женщина. Слова μου, σου, του, της (модуль 03) — тоже родительный падеж: το μαγαζί **του** — «его магазин», но το μαγαζί **του Νίκου** — «магазин Никоса». А ещё вы встречали его в датах: είκοσι **Οκτωβρίου** (модуль 04) и в το διαμέρισμα **της Ελένης** (модуль 06).

      Как меняются имена в единственном числе. Мужские на **-ος → -ου**: ο Νίκος → του Νίκου. Мужские на **-ας, -ης** теряют ς: ο Κώστας → του Κώστα, ο Γιάννης → του Γιάννη. Женские на **-α, -η** получают ς: η Μαρία → της Μαρίας, η Ελένη → της Ελένης. Иногда при -ου ударение сдвигается ближе к концу, как Οκτώβριος → Οκτωβρίου.

      Чтобы найти владельца, отбросьте артикль и верните имя: της Άννας → η Άννα, του Αντρέα → ο Αντρέας.
    table:
      columns:
        - кто
        - чей магазин
      rows:
        - - ο Νίκος
          - το μαγαζί του Νίκου
        - - ο Κώστας
          - το μανάβικο του Κώστα
        - - ο Γιάννης
          - το περίπτερο του Γιάννη
        - - η Μαρία
          - ο φούρνος της Μαρίας
        - - η Ελένη
          - το ζαχαροπλαστείο της Ελένης
  - type: exercise
    id: genitive-choice
    title: Чей магазин
    instruction: Выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Το χασάπικο του Αντρέα. Кто хозяин?
        options:
          - ο Αντρέας
          - η Αντρέα
          - ο Αντρέου
        answer: ο Αντρέας
        explanation: "του — хозяин мужчина; -ας теряет ς: ο Αντρέας → του Αντρέα."
      - id: q2
        prompt: Ο φούρνος της Άννας. Кто хозяйка?
        options:
          - η Άννα
          - η Άννας
          - ο Άννος
        answer: η Άννα
        explanation: Женское имя на -α в родительном получает ς — της Άννας.
      - id: q4
        prompt: Магазин Марии
        options:
          - το μαγαζί της Μαρίας
          - το μαγαζί του Μαρίας
          - το μαγαζί της Μαρία
        answer: το μαγαζί της Μαρίας
      - id: q5
        prompt: Киоск Костаса
        options:
          - το περίπτερο του Κώστα
          - το περίπτερο της Κώστα
          - το περίπτερο του Κώστας
        answer: το περίπτερο του Κώστα
      - id: q6
        prompt: Ο Γιάννης έχει ένα μανάβικο. Το μανάβικό του είναι κοντά στο σπίτι μου. Что значит «το μανάβικό του»?
        options:
          - его овощная лавка
          - овощная лавка для него
          - наша овощная лавка
        answer: его овощная лавка
        explanation: του сразу после слова, без имени, — «его». Второй тонос (μανάβικό του) — как в τηλέφωνό μου.
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Килограмм помидоров, пожалуйста.
        answer:
          - Ένα κιλό ντομάτες, παρακαλώ.
          - Ένα κιλό ντομάτες παρακαλώ.
          - Θέλω ένα κιλό ντομάτες, παρακαλώ.
          - Θέλω ένα κιλό ντομάτες παρακαλώ.
          - Θα ήθελα ένα κιλό ντομάτες, παρακαλώ.
          - Θα ήθελα ένα κιλό ντομάτες παρακαλώ.
      - id: q2
        prompt: Сколько стоит виноград?
        answer:
          - Πόσο κάνουν τα σταφύλια;
