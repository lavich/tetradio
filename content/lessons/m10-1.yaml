  - type: explanation
    id: quantity
    title: Ένα κιλό ντομάτες — количество без предлога
    body: |-
      По-русски говорят «килограмм помидоров» — второе слово в родительном падеже. По-гречески продукт просто ставят **после меры, без предлога и без артикля**: **ένα κιλό ντομάτες**, **ένα μπουκάλι νερό**, **ένα κουτί γάλα**. Так же, как ένα ποτήρι νερό из модуля 08.

      То, что считают штуками, после меры обычно стоит во множественном числе: ένα κιλό **ντομάτες**, **πατάτες**, **φράουλες**. Жидкости и то, что не считают (νερό, γάλα, κρασί, τυρί, κρέας), — в единственном: ένα λίτρο γάλα, μισό κιλό τυρί.

      Меры: **το κιλό** — килограмм, **το γραμμάριο** — грамм, **το λίτρο** — литр, **το μπουκάλι** — бутылка, **το κουτί** — коробка, пачка, банка. Все они среднего рода, поэтому число — в среднем роде: ένα κιλό, **τρία** κιλά, **τέσσερα** μπουκάλια. Мн. ч.: κιλά, γραμμάρια, λίτρα, μπουκάλια, κουτιά.

      «Полкило» — **μισό κιλό**: μισός согласуется со словом, как прилагательное (μισό κιλό, μισό λίτρο, но μισή ώρα). Полтора килограмма — ενάμισι κιλό: это слово пока узнавайте.

      **Неопределённый артикль** ένας, μία (μια), ένα — это и «один», и «какой-то»: Θέλω **ένα** καρπούζι. Υπάρχει **ένα** μανάβικο εδώ κοντά. В винительном падеже меняется только мужской род: **έναν** φούρνο. Во множественном числе неопределённого артикля нет: Θέλω ντομάτες. — «Я хочу помидоров» (сколько-то).

      Вежливая просьба в магазине — мера + продукт + παρακαλώ: **Ένα κιλό ντομάτες, παρακαλώ.** Или **Δώστε μου δύο κιλά πατάτες.** — «Дайте мне два килограмма картошки». Δώστε — вежливая форма просьбы от δίνω (давать); другу скажут δώσε μου. Запомните фразу целиком, как φέρε μου из модуля 09.
    table:
      columns:
        - мера
        - пример
        - перевод
      rows:
        - - ένα κιλό
          - ένα κιλό ντομάτες
          - килограмм помидоров
        - - δύο κιλά
          - δύο κιλά πατάτες
          - два килограмма картошки
        - - μισό κιλό
          - μισό κιλό φράουλες
          - полкило клубники
        - - διακόσια γραμμάρια
          - διακόσια γραμμάρια τυρί
