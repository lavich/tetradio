blocks:
  - type: explanation
    id: shops
    title: Магазины — где что покупают
    body: |-
      **Το μαγαζί** — любой магазин или лавка. Кроме супермаркета (**το σούπερ μάρκετ** — слово не склоняется: τα σούπερ μάρκετ), на Кипре и в Греции много маленьких магазинов, у каждого — свой товар:

      **ο φούρνος** — пекарня (вы знаете это слово как «духовка», модуль 07): ψωμί. **Το ζαχαροπλαστείο** — кондитерская: γλυκά. **Το χασάπικο** — мясная лавка: κρέας, κοτόπουλο. **Το μανάβικο** — овощная лавка: **τα φρούτα** (фрукты) и **τα λαχανικά** (овощи) — эти два слова пока просто узнавайте. **Το περίπτερο** — киоск на улице: вода, сок, мелочи; на Кипре киоски работают допоздна.

      «Иду в магазин» — **πάω στο / στον …** (σε + винительный падеж, модуль 08): Πάω στο σούπερ μάρκετ. Πάω στον φούρνο. «За чем-то» — **για** + слово без артикля: **Πάω στον φούρνο για ψωμί.** — «Я иду в пекарню за хлебом».

      **Αγοράζω** — «покупаю» что-то, после него дополнение: Αγοράζω ψωμί. **Ψωνίζω** — «делаю покупки», обычно без дополнения: Ψωνίζω στο σούπερ μάρκετ το Σάββατο. Оба глагола спрягаются как γράφω.
    table:
