      - { text: health page, russian: "страница проверки состояния" }
      - { text: pull request, russian: "запрос на слияние изменений" }
  - type: exercise
    id: readme-tf
    about: readme
    title: Чтение
    instruction: Верно (True) или неверно (False)?
    format: choice
    items:
      - id: q1
        prompt: Orders API accepts orders from the web shop and the mobile app.
        options: ["True", "False"]
        answer: "True"
      - id: q2
        prompt: The payload is validated by the orders service.
        options: ["True", "False"]
        answer: "False"
        explanation: There, the user is authenticated and the payload is validated — проверка выполняется на шлюзе.
      - id: q3
        prompt: The order is saved in PostgreSQL before the event is published.
        options: ["True", "False"]
        answer: "True"
        explanation: The orders service saves the order in PostgreSQL. After that, it publishes an event.
      - id: q4
        prompt: Both consumers send confirmation emails.
        options: ["True", "False"]
        answer: "False"
        explanation: One sends a confirmation email, and the other updates the stock — один отправляет письмо, другой обновляет остатки.
      - id: q5
        prompt: Product data is read from the database when Redis is not available.
        options: ["True", "False"]
        answer: "True"
      - id: q6
        prompt: Secrets are stored in the repository.
        options: ["True", "False"]
        answer: "False"
        explanation: Secrets are never stored in the repository — секретные данные в репозитории не хранятся.
