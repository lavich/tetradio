        answer: third-party
      - id: g8
        prompt: A new file in storage is the ___ that starts the processing function. (событие, которое запускает)
        answer: trigger
  - type: explanation
    id: reading-how
    title: Как читать README
    body: |-
      README отвечает на четыре вопроса: что делает проект, как он устроен, как его запустить и как вносить изменения. Читая текст, ищите ответ на каждый из них в своём разделе: описание — в начале, устройство — в разделе об архитектуре, запуск — в списке шагов.

      В описании устройства преобладает passive: **The queue is read by two consumers. The data is cached in Redis.** Из такого предложения понятно, что происходит с данными, а исполнитель стоит после **by**, если он назван. Связки **First, Then, After that, Finally** показывают порядок шагов.

      Названия технологий (*Go, Redis, PostgreSQL*) и команды (`docker compose up`) в тексте не переводятся. Слова вне списков переведены под текстом.
  - type: reading
    id: readme
    title: "README: Orders API"
    text: |-
      Orders API

      Orders API accepts orders from the web shop and the mobile app. It is written in Go and runs in containers.

      Architecture

      Every request first goes through the API gateway. There, the user is authenticated and the payload is validated. Then the gateway routes the request to the orders service.

      The orders service saves the order in PostgreSQL. After that, it publishes an event to the message queue and returns the response to the client. The queue is read by two consumers: one sends a confirmation email, and the other updates the stock. If a consumer fails, the message is retried, because both handlers are idempotent.

      Product data is cached in Redis for ten minutes. If Redis is not available, the data is read directly from the database.

      Running locally

      1. Copy .env.example to .env.
      2. Run docker compose up.
      3. Open the health page. If you see "ok", all services are running.

      Configuration

      The service is configured with environment variables. Secrets are never stored in the repository.

      Contributing

      Open a pull request against main. All changes are reviewed by one maintainer and checked by the CI pipeline before they are merged.
    glosses:
      - { text: accepts, russian: принимает }
      - { text: confirmation, russian: подтверждение }
      - { text: the stock, russian: "остатки на складе" }
      - { text: Secrets, russian: "секретные данные: пароли и ключи" }
      - { text: environment variables, russian: переменные окружения }
      - { text: maintainer, russian: "сопровождающий проекта" }
