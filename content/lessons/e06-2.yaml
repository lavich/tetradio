blocks:
  - type: explanation
    id: system-words
    title: Слова для надёжности и запуска
    body: |-
      Слова урока описывают, как части системы общаются друг с другом и что происходит при сбое.

      **Сообщения.** **A producer** отправляет сообщения в очередь, **a consumer** читает их и обрабатывает. **Serialise** — превратить объект в строку или байты для передачи. **A trigger** — событие, которое запускает обработку. Вызов **synchronous**, когда вызывающий ждёт ответа, и **asynchronous**, когда он продолжает работу.

      **Надёжность.** **A retry** — повторная попытка после сбоя, **fail over** — переключиться на резервную систему, **a circuit breaker** — прекращает вызовы к сервису, который сбоит. **Rate limiting** ограничивает число запросов от одного клиента за период. **Idempotent** — повторный вызов даёт тот же результат, поэтому повтор не создаёт дубль. **Throughput** — число запросов, которое система обрабатывает за секунду.

      **Запуск и наблюдение.** **A container** — приложение вместе со всеми зависимостями, **an orchestrator** запускает и перезапускает контейнеры на многих серверах. **Stateless** — сервис не хранит данные между запросами, поэтому любой экземпляр обработает следующий запрос. **A shard** — часть большой базы данных, **a third-party service** — сервис другой компании, **observability** — логи, метрики и трассировки показывают, что происходит в системе.
