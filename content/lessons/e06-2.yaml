        explanation: All changes are reviewed by one maintainer and checked by the CI pipeline — проверяют и человек, и CI.
  - type: exercise
    id: readme-grammar
    about: readme
    title: Passive в тексте
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "«The queue is read by two consumers.» Кто выполняет действие?"
        options: [two consumers, the queue, the orders service]
        answer: two consumers
        explanation: После by стоит исполнитель.
      - id: q2
        prompt: Какое предложение из текста стоит в passive?
        options:
          - The payload is validated.
          - The gateway routes the request.
          - The orders service saves the order.
        answer: The payload is validated.
        explanation: Is и V3 — validated; в двух других предложениях подлежащее само выполняет действие.
      - id: q3
        prompt: "«Secrets are never stored in the repository.» Где стоит never?"
        options: [после are, перед are, в конце предложения]
        answer: после are
        explanation: Наречие стоит между are и V3.
      - id: q4
        prompt: Каким словом начинается предложение о маршрутизации запроса к orders service?
        options: [Then, Finally, Once]
        answer: Then
  - type: explanation
    id: listening-how
    title: Объяснение архитектуры
    body: |-
      Коллега объясняет устройство системы тому, кто пришёл в команду, и идёт по пути запроса: каждый шаг — отдельное предложение со связкой. Слушайте глаголы в passive (*is authenticated, is routed, is published*): они называют шаги, а слова *Because, so, if* объясняют причину.

      Послушайте, как Samir рассказывает Isabel о системе заказов. Сначала целиком, затем ответьте на вопросы, проверяя себя при втором прослушивании. Транскрипт открывается после ответа.
  - type: listening
    id: walkthrough
    title: A walk through the system
    plays: 2
    transcript:
      - { speaker: Samir, text: "Welcome to the team, Isabel. Let me describe how an order moves through the system." }
      - { speaker: Samir, text: "First, the request is sent to the API gateway. There, the user is authenticated and the payload is validated." }
      - { speaker: Isabel, text: "And what happens if the validation fails?" }
      - { speaker: Samir, text: "Then the request is rejected, and the client gets an error right away. If everything is fine, the request is routed to the orders service." }
      - { speaker: Isabel, text: "Is the data stored there?" }
      - { speaker: Samir, text: "Yes. The order is saved in PostgreSQL. After that, an event is published to the queue." }
      - { speaker: Isabel, text: "Why do you use a queue here?" }
      - { speaker: Samir, text: "The email provider is a third-party service, and it can be slow. With the queue, the order is confirmed in under two hundred milliseconds, and the email is sent later by a consumer." }
      - { speaker: Isabel, text: "What happens if the provider is down?" }
      - { speaker: Samir, text: "The consumer retries the message three times. If it still fails, the message is moved to a separate queue, and an alert is sent to the on-call engineer." }
      - { speaker: Isabel, text: "Can the same email be sent twice?" }
      - { speaker: Samir, text: "No. The handler is idempotent, so a retry does not create a duplicate." }
  - type: exercise
    id: walkthrough-q
    about: walkthrough
    title: Что рассказал Samir
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Where is the payload validated?
        options: [at the API gateway, in the orders service, at the email provider]
        answer: at the API gateway
      - id: q2
        prompt: What happens when the validation fails?
        options:
          - The request is rejected and the client gets an error.
          - The request is retried three times.
          - The request is moved to a separate queue.
        answer: The request is rejected and the client gets an error.
      - id: q3
        prompt: Where is the order saved?
        options: [PostgreSQL, Redis, the queue]
        answer: PostgreSQL
      - id: q4
        prompt: Why does the system use a queue?
        options:
          - The email provider can be slow.
          - The database is too small.
          - The gateway cannot route requests.
        answer: The email provider can be slow.
        explanation: Слова the email provider is a third-party service, and it can be slow объясняют причину.
      - id: q5
        prompt: How fast is the order confirmed?
        options:
          - in under two hundred milliseconds
          - in about two seconds
          - after the email is sent
        answer: in under two hundred milliseconds
      - id: q6
        prompt: What happens after three failed attempts?
        options:
          - The message is moved to a separate queue, and an alert is sent.
          - The message is deleted.
          - The order is cancelled.
        answer: The message is moved to a separate queue, and an alert is sent.
      - id: q7
        prompt: Why is the same email not sent twice?
        options:
          - The handler is idempotent.
          - There is only one consumer.
          - The queue deletes old messages.
        answer: The handler is idempotent.
        explanation: Idempotent — повторный вызов даёт тот же результат, поэтому повтор не создаёт дубль.
  - type: exercise
    id: walkthrough-phrases
    about: walkthrough
    title: Фразы из разговора
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - authenticated
      - routed
      - published
      - retries
      - idempotent
      - alert
      - cached
      - throttled
    items:
      - { id: g1, prompt: "The user is ___ at the gateway. (проходит аутентификацию)", answer: authenticated }
      - { id: g2, prompt: "The request is ___ to the orders service. (направляется)", answer: routed }
      - { id: g3, prompt: "After that, an event is ___ to the queue. (публикуется)", answer: published }
      - { id: g4, prompt: "The consumer ___ the message three times. (повторяет попытку)", answer: retries }
      - { id: g5, prompt: "The handler is ___, so a retry does not create a duplicate. (идемпотентный)", answer: idempotent }
      - { id: g6, prompt: "An ___ is sent to the on-call engineer. (оповещение)", answer: alert }
