          - Run docker compose up.
          - Open the health page.
        answer: Copy .env.example to .env.
      - id: q4
        prompt: How is the service configured?
        options:
          - with environment variables
          - with a file in the repository
          - with command-line flags
        answer: with environment variables
      - id: q5
        prompt: Who reviews the changes before they are merged?
        options: [one maintainer, the CI pipeline only, two maintainers]
