  - type: explanation
    id: age
    title: Сколько тебе лет?
    body: |-
      Возраст по-гречески называют с глаголом **είμαι**, а не «иметь»: **Είμαι τριάντα πέντε χρονών.** — «Мне тридцать пять лет», дословно «я — тридцати пяти лет». Слово χρονών не меняется: είκοσι χρονών, πενήντα χρονών. Если ясно, что речь о возрасте, его можно опустить: Ο γιος μου είναι οκτώ.

      Вопрос: **Πόσων χρονών είσαι;** — «Сколько тебе лет?», вежливо — **Πόσων χρονών είστε;** О другом человеке: **Πόσων χρονών είναι ο γιος σου;** — **Είναι οκτώ χρονών.** В разговоре слышно и Πόσο χρονών είσαι; — понимать нужно оба варианта.

      Числа, которые кончаются на 1, 3 и 4, перед χρονών меняют форму: τριάντα **ενός**, σαράντα **τριών**, πενήντα **τεσσάρων** χρονών. Если это ваш возраст, запомните свою форму целиком; в упражнениях модуля таких чисел нет.
    table:
      columns:
        - вопрос
        - ответ
      rows:
        - - Πόσων χρονών είσαι;
          - Είμαι είκοσι οκτώ χρονών.
        - - Πόσων χρονών είστε;
          - Είμαι εξήντα πέντε χρονών.
        - - Πόσων χρονών είναι η κόρη σου;
          - Είναι δώδεκα χρονών.
        - - Πόσων χρονών είναι οι γονείς σου;
          - Ο πατέρας μου είναι εβδομήντα και η μητέρα μου εξήντα οκτώ.
  - type: explanation
    id: status
    title: Семейное положение, профессии, «много» и «мало»
    body: |-
      **Παντρεμένος** — «женат», о женщине **παντρεμένη** — «замужем»: Ο Νίκος είναι παντρεμένος. Η Άννα είναι παντρεμένη. «Разведён» — **διαζευγμένος**, «разведена» — **διαζευγμένη**; в разговоре чаще говорят χωρισμένος, χωρισμένη. «Не женат», «не замужем» — **Δεν είμαι παντρεμένος (παντρεμένη).**

      Профессию называют **без артикля**: **Είμαι γιατρός.** Η μητέρα μου είναι **δασκάλα**. Ο γιατρός — «врач»; о женщине — η γιατρός: слово то же, меняется только артикль. Ο δάσκαλος — «учитель», η δασκάλα — «учительница». О профессии спрашивают **Τι δουλειά κάνεις;** (модуль 02). **Κάνω** — «делать»: Τι κάνεις; — «Как дела?», дословно «Что делаешь?».

      **Πολύς** — «многий», **λίγος** — «немногий», **άλλος** — «другой» согласуются с существительным, как прилагательные: **πολλά** παιδιά, **πολλοί** φίλοι, **λίγοι** άνθρωποι, η **άλλη** κόρη μου. Наречия πολύ и λίγο из модуля 02 не меняются: Μιλάω λίγο αγγλικά. Ο άνθρωπος — «человек», οι άνθρωποι — «люди».
    table:
