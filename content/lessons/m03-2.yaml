  - type: exercise
    id: age-gap
    title: Возраст
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - Πόσων
      - Είμαι
      - είναι
      - χρονών
      - έχω
    items:
      - id: g1
        prompt: — ___ χρονών είσαι; — Είμαι είκοσι οκτώ.
        answer: Πόσων
      - id: g2
        prompt: — Πόσων χρονών είσαι; — ___ τριάντα έξι χρονών.
        answer: Είμαι
        explanation: Возраст — с είμαι, а не с έχω, как бы ни хотелось сказать «имею лет».
      - id: g3
        prompt: Η γιαγιά μου ___ ογδόντα πέντε χρονών.
        answer: είναι
      - id: g4
        prompt: Ο γιος μου είναι δέκα ___.
        answer: χρονών
      - id: g5
        prompt: — Πόσων χρονών ___ τα παιδιά σου; — Έξι και εννέα.
        answer: είναι
        explanation: "Τα παιδιά — «они»: είναι."
  - type: exercise
    id: status-gap
    title: Кто какой
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - παντρεμένη
      - παντρεμένος
      - γιατρός
      - δασκάλα
      - πολλά
      - πολλοί
      - λίγοι
      - άλλη
    items:
      - id: g1
        prompt: — Είσαι παντρεμένη; — Ναι, είμαι ___.
        answer: παντρεμένη
      - id: g2
        prompt: Ο Κώστας δεν είναι ___, δεν έχει γυναίκα.
        answer: παντρεμένος
        explanation: О мужчине — παντρεμένος, о женщине — παντρεμένη.
      - id: g3
        prompt: Η Ελένη είναι ___ στο νοσοκομείο. (νοσοκομείο — больница)
        answer: γιατρός
        explanation: О женщине-враче — η γιατρός; профессия после είναι — без артикля.
      - id: g4
        prompt: Έχουμε ___ παιδιά — πέντε!
        answer: πολλά
        explanation: Τα παιδιά — средний род мн. ч., поэтому πολλά.
      - id: g5
        prompt: Στο πάρτι είναι ___ άνθρωποι, μόνο πέντε.
        answer: λίγοι
        explanation: Μόνο πέντε — «только пять», значит, людей мало.
      - id: g6
        prompt: Έχω δύο κόρες. Η μία μένει στη Λεμεσό και η ___ στην Αθήνα.
        answer: άλλη
        explanation: Η μία… η άλλη — «одна… другая».
  - type: reading
    id: lina
    title: Η Λίνα γράφει
    text: |-
      Γεια σου, Μαρίνα!

      Τι κάνεις; Στη φωτογραφία είναι η οικογένειά μου. Είμαι τριάντα οκτώ χρονών και μένω στη Λάρνακα. Είμαι παντρεμένη. Ο άντρας μου ο Αντρέας είναι σαράντα δύο χρονών και είναι γιατρός. Έχουμε δύο παιδιά, έναν γιο και μία κόρη. Ο γιος μας ο Στέλιος είναι δώδεκα χρονών και η κόρη μας η Δάφνη είναι επτά.

      Οι γονείς μου μένουν στη Ρωσία, στο Σότσι. Η μητέρα μου είναι δασκάλα, ο πατέρας μου δεν δουλεύει τώρα. Η αδελφή μου η Όλγα μένει στη Μόσχα. Δεν είναι παντρεμένη.

      Ο Αντρέας είναι από την Κύπρο και όλη η οικογένεια μιλάει ελληνικά. Αλλά τα παιδιά μιλάνε και ρωσικά!

      Κι εσύ; Έχεις αδέλφια; Γράψε μου!

      Φιλιά,
      Λίνα
    glosses:
      - text: Στη φωτογραφία
        russian: на фотографии
      - text: στο Σότσι
        russian: в Сочи
      - text: όλη η οικογένεια
        russian: вся семья
      - text: μιλάνε και ρωσικά
        russian: говорят и по-русски
      - text: Γράψε μου
        russian: напиши мне
      - text: Φιλιά
        russian: целую (дословно «поцелуи»)
  - type: exercise
    id: lina-tf
    about: lina
    title: Верно или неверно
    instruction: Прочитайте письмо. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Λίνα μένει στη Λάρνακα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Ο Αντρέας είναι δάσκαλος.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ο Αντρέας είναι γιατρός. Учительница — мама Лины.
      - id: q3
        prompt: Η Λίνα έχει τρία παιδιά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Έχουμε δύο παιδιά, έναν γιο και μία κόρη — двое детей.
      - id: q4
        prompt: Η Δάφνη είναι η κόρη της Λίνας. (της Λίνας — Лины)
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Η κόρη μας η Δάφνη — «наша дочь Дафни», пишет Лина.
      - id: q5
        prompt: Οι γονείς της μένουν στην Κύπρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Οι γονείς μου μένουν στη Ρωσία, στο Σότσι. Ловушка — на Кипре живёт сама Лина.
      - id: q6
        prompt: Η αδελφή της είναι παντρεμένη.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Про Ольгу сказано Δεν είναι παντρεμένη — «не замужем». Замужем сама Лина.
      - id: q7
        prompt: Τα παιδιά μιλάνε μόνο ελληνικά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τα παιδιά μιλάνε και ρωσικά — «и по-русски». Μόνο — «только».
  - type: exercise
    id: lina-q
    about: lina
    title: Ответьте на вопросы
    instruction: Ответьте цифрами или одним греческим словом.
    format: text
    items:
      - id: q1
        prompt: Сколько лет Андреасу? Напишите цифрами.
        answer:
          - "42"
        explanation: Σαράντα δύο — 40 + 2.
      - id: q2
        prompt: Сколько лет Стелиосу? Напишите цифрами.
        answer:
          - "12"
        explanation: Δώδεκα — 12. Не путайте с δύο — 2.
      - id: q3
        prompt: Кем работает мама Лины? Одно слово по-гречески.
        answer:
          - δασκάλα
        explanation: Η μητέρα μου είναι δασκάλα — «учительница».
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Катерина показывает Никосу фотографию семьи. Разговор звучит два раза. В первый раз слушайте, о ком идёт речь: αυτός, αυτή, η μητέρα μου, ο άντρας μου… Перед вторым прослушиванием прочитайте утверждения и ловите детали — возраст, профессии, «да» и «нет».

      Будьте внимательны к отрицанию: **δεν** в начале ответа меняет смысл всей фразы.
  - type: listening
    id: photo
    title: Η φωτογραφία
    plays: 2
    transcript:
      - speaker: Νίκος
        text: Ωραία φωτογραφία! Είναι η οικογένειά σου;
        audio: m03-2/photo-1.mp3
      - speaker: Κατερίνα
        text: Ναι. Αυτή είναι η μητέρα μου και αυτός είναι ο πατέρας μου.
        audio: m03-2/photo-2.mp3
      - speaker: Νίκος
        text: Πόσων χρονών είναι οι γονείς σου;
        audio: m03-2/photo-3.mp3
      - speaker: Κατερίνα
        text: Η μητέρα μου είναι εξήντα δύο χρονών και ο πατέρας μου εβδομήντα.
        audio: m03-2/photo-4.mp3
      - speaker: Νίκος
        text: Και ποιος είναι αυτός; Ο αδελφός σου;
        audio: m03-2/photo-5.mp3
      - speaker: Κατερίνα
        text: Όχι, δεν έχω αδελφό. Αυτός είναι ο άντρας μου, ο Γιάννης. Είναι δάσκαλος.
        audio: m03-2/photo-6.mp3
      - speaker: Νίκος
        text: Α, είσαι παντρεμένη! Έχετε παιδιά;
        audio: m03-2/photo-7.mp3
      - speaker: Κατερίνα
        text: Ναι, έχουμε μία κόρη, τη Σοφία. Είναι έξι χρονών.
        audio: m03-2/photo-8.mp3
      - speaker: Νίκος
        text: Και αυτή; Η αδελφή σου;
        audio: m03-2/photo-9.mp3
      - speaker: Κατερίνα
        text: Ναι, η αδελφή μου η Ελένη. Είναι γιατρός στη Λευκωσία. Κι εσύ, Νίκο; Έχεις αδέλφια;
        audio: m03-2/photo-10.mp3
      - speaker: Νίκος
        text: Ναι, έχω δύο αδελφές. Αλλά δεν είμαι παντρεμένος!
        audio: m03-2/photo-11.mp3
  - type: exercise
    id: photo-tf
    about: photo
    title: Верно или неверно
    instruction: Прослушайте разговор. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Κατερίνα έχει έναν αδελφό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Όχι, δεν έχω αδελφό — мужчина на фото её муж, а не брат.
      - id: q2
        prompt: Ο πατέρας της είναι εβδομήντα χρονών.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Ο Γιάννης είναι γιατρός.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ο Γιάννης είναι δάσκαλος. Врач — сестра Катерины, Елени.
      - id: q4
        prompt: Η Κατερίνα και ο Γιάννης έχουν ένα παιδί.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Έχουμε μία κόρη — одна дочь, София.
      - id: q5
        prompt: Η Ελένη είναι γιατρός.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Ο Νίκος είναι παντρεμένος.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Αλλά δεν είμαι παντρεμένος — «но я не женат».
  - type: exercise
    id: photo-choice
    about: photo
    title: Числа в разговоре
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Сколько лет маме Катерины?
        options:
          - "52"
          - "62"
          - "72"
        answer: "62"
        explanation: Εξήντα δύο — 62. Εξήντα — 60, εβδομήντα — 70.
      - id: q2
        prompt: Сколько лет Софии?
        options:
          - "6"
          - "7"
          - "16"
        answer: "6"
