blocks:
  - type: explanation
    id: numbers
    title: Числа от 11 до 100
    body: |-
      11 и 12 — отдельные слова: **έντεκα**, **δώδεκα**. С 13 до 19 — «десять + число» одним словом: δεκατρία, δεκατέσσερα, δεκαπέντε, δεκαέξι, δεκαεπτά (δεκαεφτά), δεκαοκτώ (δεκαοχτώ), δεκαεννέα (δεκαεννιά).

      Десятки: είκοσι, τριάντα, σαράντα, πενήντα, εξήντα, εβδομήντα, ογδόντα, ενενήντα; 100 — εκατό. Почти все десятки кончаются на **-ντα** [-нда]. Составное число пишется через пробел, без «и»: **είκοσι πέντε** — 25, **σαράντα δύο** — 42, **ογδόντα οκτώ** — 88.

      Не путайте похожие числа: **έξι** (6) — **εξήντα** (60); **εξήντα** (60) — **εβδομήντα** (70); **οκτώ** (8) — **ογδόντα** (80); **εννέα** (9) — **ενενήντα** (90); **δύο** (2) — **δώδεκα** (12).

      Теперь понятно, как на Кипре диктуют телефон — парами: 96 35 02 81 — ενενήντα έξι, τριάντα πέντε, μηδέν δύο, ογδόντα ένα.
