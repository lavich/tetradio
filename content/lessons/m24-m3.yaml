title: Пробник M3 — экзамен A2
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как проходить пробник
    body: |-
      Это последний полный пробный экзамен A2, по модулям 01–24. До экзамена ΚΕΓ (11 мая 2027) остаётся около двух недель, поэтому пройдите пробник **в точности как экзамен**: за один раз, без словаря, таблиц и карточек, с перерывом не дольше 10 минут между письменной частью и речью. Лучше в первой половине дня, когда вы свежие, — на экзамене письменная часть тоже идёт утром подряд.

      **Время — как на экзамене.** Чтение — 30 минут, аудирование — 25 минут, письмо — 45 минут: вместе 1 ч 40 мин, как письменная часть экзамена. Речь — около 12 минут. Поставьте таймер на каждую часть и не возвращайтесь к части, время которой вышло. Каждая запись в аудировании звучит два раза; транскрипт откроется после ответа.

      **Чтение и аудирование** проверяются автоматически: в каждом навыке 25 пунктов. Порог — **60 %**, то есть не меньше **15 из 25** в каждом навыке. На экзамене так же: нужно 60 % в каждом из четырёх навыков, и провал одного навыка означает провал всего экзамена — сильное чтение не спасёт слабое аудирование.

      **Письмо и речь** — самопроверка по критериям курса, а не оценка экзаменатора: на экзамене их оценивают экзаменаторы по своей шкале. Сначала напишите текст и запишите ответ сами, только потом откройте образец и честно отметьте выполненные критерии. Меньше 60 % критериев — навык ниже порога. Пишите, как на экзамене, от руки **строчными печатными буквами** и не ставьте в работе своё настоящее имя — подпишитесь вымышленным. Если можете, покажите письма и записи речи преподавателю или носителю языка.

      Запишите результат по каждому навыку: он понадобится в конце пробника, чтобы найти слабый навык и решить, как проходить два последних занятия.
    table:
      columns:
        - часть
        - задания
        - время
      rows:
        - - Чтение
          - верно/неверно; части предложений; выбор из четырёх; пропуски
          - 30 мин
        - - Аудирование
          - описания и картинки; выбор из трёх; верно/неверно; заметки
          - 25 мин
        - - Письмо
          - письмо подруге и письмо в языковую школу, по 80–100 слов
          - 45 мин
        - - Речь
          - вопросы о себе, монолог, ролевая игра
          - ~12 мин
  - type: reading
    id: nikolas
    title: Ένα μήνυμα από τον Νικόλα
    text: |-
      Γεια σου, Μαρίνα!

      Πώς είσαι; Συγγνώμη, δεν σου έγραψα, γιατί την περασμένη εβδομάδα ήμουν άρρωστος. Τη Δευτέρα είχα πυρετό, βήχα και πονόλαιμο. Την Τρίτη πήγα στον προσωπικό μου γιατρό. Μου είπε ότι έχω γρίπη, όχι κρυολόγημα. Αντιβίωση δεν μου έδωσε, αλλά μου είπε: «Πρέπει να μείνεις στο κρεβάτι τρεις μέρες και να πίνεις πολλά υγρά.» Έτσι δεν πήγα στη δουλειά, και έχασα και το μάθημα ελληνικών.

      Τώρα είμαι καλύτερα, αλλά νιώθω ακόμα λίγο κουρασμένος.

      Η πρόγνωση λέει ότι το Σάββατο θα κάνει καλό καιρό, γι' αυτό θα πάω με τον αδελφό μου στο Τρόοδος. Θα περπατήσουμε δύο ώρες στο δάσος και θα φάμε σε μια ταβέρνα στο χωριό. Αν βρέξει, θα πάμε την Κυριακή. Θέλεις να έρθεις μαζί μας; Θα φύγουμε με το αυτοκίνητο στις οκτώ το πρωί. Πάρε ένα μπουφάν, γιατί στο βουνό κάνει κρύο!

      Τα λέμε,
      Νικόλας
    glosses:
      - text: Έτσι
        russian: так что, поэтому
      - text: έχασα
        russian: я пропустил (χάνω → έχασα)
  - type: exercise
    id: nikolas-tf
    about: nikolas
    graded: true
    title: Чтение 1 — верно или неверно
    instruction: Прочитайте сообщение. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Ο Νικόλας ήταν άρρωστος την περασμένη εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Δεν σου έγραψα, γιατί την περασμένη εβδομάδα ήμουν άρρωστος.
      - id: q2
        prompt: Ο γιατρός είπε ότι ο Νικόλας έχει κρυολόγημα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Έχω γρίπη, όχι κρυολόγημα — у него грипп, а не простуда (модуль 17).
      - id: q3
        prompt: Ο γιατρός έδωσε στον Νικόλα αντιβίωση.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Αντιβίωση δεν μου έδωσε — антибиотик врач не дал (модуль 18).
      - id: q4
        prompt: Ο γιατρός είπε στον Νικόλα να πίνει πολλά υγρά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Совет врача: …και να πίνεις πολλά υγρά. После «είπε να» — тот же совет в косвенной речи (модули 16, 18)."
      - id: q5
        prompt: Την περασμένη εβδομάδα ο Νικόλας πήγε στο μάθημα ελληνικών.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Έχασα και το μάθημα ελληνικών — он пропустил урок греческого.
      - id: q6
        prompt: Ο Νικόλας είναι ακόμα λίγο κουρασμένος.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Τώρα είμαι καλύτερα, αλλά νιώθω ακόμα λίγο κουρασμένος — лучше, но ещё немного устал.
      - id: q7
        prompt: Αν βρέξει το Σάββατο, ο Νικόλας και ο αδελφός του θα πάνε στο Τρόοδος την Κυριακή.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Αν βρέξει, θα πάμε την Κυριακή — если будет дождь, поедут в воскресенье (αν + θα, модули 19, 21)."
  - type: reading
    id: delfini
    title: Κέντρο «Δελφίνι» — γυμναστήριο και πισίνα
    text: |-
      Καλώς ήρθατε στο κέντρο «Δελφίνι»!

      Το κέντρο είναι ανοιχτό από τη Δευτέρα μέχρι το Σάββατο, από τις έξι το πρωί μέχρι τις δέκα το βράδυ. Την Κυριακή είναι ανοιχτό μόνο το πρωί και κλείνει στις δύο το μεσημέρι. Τα Χριστούγεννα, την Πρωτοχρονιά και το Πάσχα το κέντρο είναι κλειστό.

      Η ρεσεψιόν και η πισίνα είναι στο ισόγειο, και το γυμναστήριο στον πρώτο όροφο.

      Για αρχάριους έχουμε μαθήματα κολύμπι την Τρίτη και την Πέμπτη, στις επτά το βράδυ. Μαθήματα τένις έχουμε κάθε Σάββατο πρωί.

      Για την εγγραφή φέρτε στη ρεσεψιόν την ταυτότητά σας και μια φωτογραφία. Η τιμή είναι σαράντα ευρώ τον μήνα, και για φοιτητές τριάντα.

      Πριν από την πισίνα πρέπει να κάνετε ντους. Μην τρώτε και μην πίνετε καφέ δίπλα στην πισίνα.
  - type: exercise
    id: delfini-match
    about: delfini
    graded: true
    title: Чтение 2 — части предложений
    instruction: Прочитайте информацию спортивного центра. Закончите каждое предложение по тексту. Два окончания лишние.
    format: match
    bank:
      - στις δύο το μεσημέρι.
      - στις δέκα το βράδυ.
      - στον πρώτο όροφο.
      - στο ισόγειο.
      - την Τρίτη και την Πέμπτη.
      - κάθε Σάββατο πρωί.
      - την ταυτότητά σας και μια φωτογραφία.
      - τριάντα ευρώ τον μήνα.
    items:
      - id: m1
        prompt: Την Κυριακή το κέντρο κλείνει…
        answer: στις δύο το μεσημέρι.
        explanation: Την Κυριακή… κλείνει στις δύο το μεσημέρι. Στις δέκα το βράδυ центр закрывается с понедельника по субботу.
      - id: m2
        prompt: Το γυμναστήριο είναι…
        answer: στον πρώτο όροφο.
        explanation: "Το γυμναστήριο στον πρώτο όροφο — по-русски это второй этаж. Στο ισόγειο (первый этаж по-русски) — ресепшен и бассейн (модуль 06)."
      - id: m3
        prompt: Τα μαθήματα κολύμπι για αρχάριους είναι…
        answer: την Τρίτη και την Πέμπτη.
        explanation: "Για αρχάριους… μαθήματα κολύμπι την Τρίτη και την Πέμπτη, στις επτά (για αρχάριους — модуль 20). Ловушка: κάθε Σάββατο πρωί — это теннис, а не плавание."
      - id: m4
        prompt: Η ρεσεψιόν είναι…
        answer: στο ισόγειο.
        explanation: Η ρεσεψιόν και η πισίνα είναι στο ισόγειο.
      - id: m5
        prompt: Για την εγγραφή φέρνετε…
        answer: την ταυτότητά σας και μια φωτογραφία.
        explanation: Για την εγγραφή φέρτε… την ταυτότητά σας και μια φωτογραφία.
      - id: m6
        prompt: Για έναν φοιτητή η τιμή είναι…
        answer: τριάντα ευρώ τον μήνα.
        explanation: "Σαράντα ευρώ τον μήνα, και για φοιτητές τριάντα — студенты платят 30 евро в месяц."
  - type: reading
    id: wallet
    title: Το πορτοφόλι μου
    text: |-
      Την περασμένη Τρίτη πήρα το λεωφορείο για τη δουλειά, όπως κάθε πρωί. Όταν έφτασα στο γραφείο, είδα ότι δεν είχα το πορτοφόλι μου. Μάλλον το ξέχασα στο λεωφορείο. Μέσα ήταν η ταυτότητά μου, η κάρτα της τράπεζας και σαράντα ευρώ.

      Πρώτα τηλεφώνησα στην τράπεζα, και μπλόκαραν την κάρτα μου. Μετά πήρα τηλέφωνο στην εταιρεία των λεωφορείων. Μια υπάλληλος μου είπε: «Ένας οδηγός βρήκε ένα πορτοφόλι στη γραμμή δεκαπέντε. Είναι εδώ, στον σταθμό.»

      Το απόγευμα, μετά τη δουλειά, πήγα στον σταθμό. Όλα ήταν μέσα, ακόμα και τα λεφτά! Πόσο χάρηκα! Την Πέμπτη αγόρασα ένα κουτί γλυκά για τον οδηγό, τον κύριο Χαράλαμπο, και του είπα ένα μεγάλο ευχαριστώ.

      Σβετλάνα
    glosses:
      - text: πορτοφόλι
        russian: кошелёк
      - text: μπλόκαραν
        russian: заблокировали
      - text: ακόμα και
        russian: даже
  - type: exercise
    id: wallet-choice
    about: wallet
    graded: true
    title: Чтение 3 — выбор из четырёх
    instruction: Прочитайте текст и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού ήταν η Σβετλάνα, όταν είδε ότι δεν είχε το πορτοφόλι;
        options:
          - Στο λεωφορείο.
          - Στη στάση.
          - Στο γραφείο.
          - Στην τράπεζα.
        answer: Στο γραφείο.
        explanation: "Όταν έφτασα στο γραφείο, είδα ότι δεν είχα το πορτοφόλι μου. Кошелёк, скорее всего, остался в автобусе (μάλλον το ξέχασα στο λεωφορείο), но заметила она это уже в офисе (όταν + аорист, модуль 21)."
      - id: q2
        prompt: Τι ήταν μέσα στο πορτοφόλι;
        options:
          - Η ταυτότητα, η κάρτα και σαράντα ευρώ.
          - Η ταυτότητα και πενήντα ευρώ.
          - Το διαβατήριο, η κάρτα και σαράντα ευρώ.
          - Μόνο η ταυτότητα και η κάρτα.
        answer: Η ταυτότητα, η κάρτα και σαράντα ευρώ.
        explanation: Μέσα ήταν η ταυτότητά μου, η κάρτα της τράπεζας και σαράντα ευρώ. Паспорта (διαβατήριο) в кошельке не было (модуль 23).
      - id: q3
        prompt: Τι έκανε πρώτα η Σβετλάνα;
        options:
          - Τηλεφώνησε στην τράπεζα.
          - Τηλεφώνησε στην εταιρεία των λεωφορείων.
          - Πήγε στον σταθμό.
          - Γύρισε στη στάση.
        answer: Τηλεφώνησε στην τράπεζα.
        explanation: "Πρώτα τηλεφώνησα στην τράπεζα… Μετά πήρα τηλέφωνο στην εταιρεία — сначала банк, потом автобусная компания (πρώτα… μετά, модуль 22)."
      - id: q4
        prompt: Ποιος βρήκε το πορτοφόλι;
        options:
          - Μια υπάλληλος της εταιρείας.
          - Ένας οδηγός.
          - Ένας επιβάτης.
          - Ένας συνάδελφος της Σβετλάνας.
        answer: Ένας οδηγός.
        explanation: "Ένας οδηγός βρήκε ένα πορτοφόλι στη γραμμή δεκαπέντε. Служащая только рассказала об этом по телефону."
      - id: q5
        prompt: Πότε πήγε η Σβετλάνα στον σταθμό;
        options:
          - Την Τρίτη το πρωί.
          - Την Τρίτη το απόγευμα.
          - Την Τετάρτη το απόγευμα.
          - Την Πέμπτη το πρωί.
        answer: Την Τρίτη το απόγευμα.
        explanation: "Всё случилось во вторник: Το απόγευμα, μετά τη δουλειά, πήγα στον σταθμό. В четверг она купила сладости."
      - id: q6
        prompt: Τι έκανε η Σβετλάνα την Πέμπτη;
        options:
          - Έδωσε στον οδηγό σαράντα ευρώ.
          - Αγόρασε γλυκά για τον οδηγό.
          - Πήγε στην τράπεζα για μια καινούργια κάρτα.
          - Έφαγε γλυκά με τον οδηγό στον σταθμό.
        answer: Αγόρασε γλυκά για τον οδηγό.
        explanation: Την Πέμπτη αγόρασα ένα κουτί γλυκά για τον οδηγό… και του είπα ένα μεγάλο ευχαριστώ (του — ему, модуль 17).
  - type: reading
    id: bank-letter
    title: Μια επιστολή από την τράπεζα «Λεμονιά»
    text: |-
      Αξιότιμη κυρία Βολκόβα,

      Σας ευχαριστούμε για την (1) ___ σας και για τα δικαιολογητικά σας. Ο καινούργιος σας λογαριασμός είναι (2) ___ από σήμερα, και η κάρτα σας σας περιμένει στην τράπεζα. Με την κάρτα μπορείτε να πληρώνετε στα μαγαζιά και στο ίντερνετ.

      Μπορείτε να την (3) ___ από την τράπεζά μας στην οδό Κυριαζή δεκαπέντε, από τη Δευτέρα μέχρι την Παρασκευή, από τις οκτώ και μισή μέχρι τις (4) ___ το απόγευμα. Πρέπει να φέρετε την ταυτότητα ή το διαβατήριό σας.

      (5) ___ δεν μπορείτε να έρθετε αυτές τις ώρες, θα σας στείλουμε την κάρτα με συστημένη επιστολή στη διεύθυνσή σας.

      Για πληροφορίες, μπορείτε να μας στείλετε ένα email ή να μας πάρετε (6) ___ στο 22 45 18 30.

      Με εκτίμηση,
      Ανδρέας Λοΐζου
      Τράπεζα «Λεμονιά»
    glosses:
      - text: σας περιμένει
        russian: ждёт вас
  - type: exercise
    id: bank-letter-gap
    about: bank-letter
    graded: true
    title: Чтение 4 — пропуски
    instruction: Прочитайте письмо из банка и вставьте слова. Каждое слово — один раз; три слова лишние.
    format: gap
    bank:
      - αίτηση
      - αιτήσεις
      - ανοιχτός
      - ανοιχτή
      - παραλάβετε
      - τρεις
      - τρία
      - Αν
      - τηλέφωνο
    items:
      - id: g1
        prompt: (1) Σας ευχαριστούμε για την ___ σας.
        answer: αίτηση
        explanation: "Την — артикль единственного числа, поэтому η αίτηση, а не οι αιτήσεις: одна заявка на один счёт (модуль 23)."
      - id: g2
        prompt: (2) Ο καινούργιος σας λογαριασμός είναι ___ από σήμερα.
        answer: ανοιχτός
        explanation: "Ο λογαριασμός — мужской род: ανοιχτός. Ανοιχτή — женский род: η τράπεζα είναι ανοιχτή (модули 07, 12)."
      - id: g3
        prompt: (3) Μπορείτε να την ___ από την τράπεζά μας.
        answer: παραλάβετε
        explanation: "Μπορείτε να + форма на «вы»: να την παραλάβετε — получить её (карту). Παραλαμβάνω → παρέλαβα, после να — παραλάβω (модуль 23)."
      - id: g4
        prompt: (4) …από τις οκτώ και μισή μέχρι τις ___ το απόγευμα.
        answer: τρεις
        explanation: "О времени — женский род (η ώρα): μέχρι τις τρεις. Τρία — средний род: τρία ευρώ (модуль 04)."
      - id: g5
        prompt: (5) ___ δεν μπορείτε να έρθετε αυτές τις ώρες, θα σας στείλουμε την κάρτα.
        answer: Αν
        explanation: "Условие «если» — αν: Αν δεν μπορείτε…, θα σας στείλουμε… (αν + θα, модули 19, 21)."
      - id: g6
        prompt: (6) …ή να μας πάρετε ___ στο 22 45 18 30.
        answer: τηλέφωνο
        explanation: "Παίρνω τηλέφωνο — звонить: να μας πάρετε τηλέφωνο — позвонить нам (как Πάρε με τηλέφωνο, модули 15, 17). Другие слова банка сюда не встают."
  - type: listening
    id: clothes
    title: Τι φοράνε σήμερα;
    plays: 2
    transcript:
      - speaker: Κατερίνα
        text: Σήμερα πηγαίνω σε έναν γάμο. Φοράω ένα μακρύ κόκκινο φόρεμα και μαύρα παπούτσια. Το φόρεμα το αγόρασα χθες στο κέντρο!
      - speaker: Χρίστος
        text: Σήμερα έχω συνέντευξη για μια καινούργια δουλειά, γι' αυτό φοράω σκούρο παντελόνι, άσπρο πουκάμισο και σακάκι. Συνήθως φοράω τζιν και μπλουζάκι.
      - speaker: Μυρτώ
        text: Πηγαίνω στο γυμναστήριο, όπως κάθε Τρίτη. Φοράω ένα άνετο παντελόνι, ένα μπλουζάκι και άνετα παπούτσια.
      - speaker: Κυριάκος
        text: Κάνει πολλή ζέστη, και πάμε με τα παιδιά στην παραλία. Φοράω το μαγιό μου, ένα μπλουζάκι και ένα καπέλο για τον ήλιο.
      - speaker: Στέλλα
        text: Έξω βρέχει και κάνει κρύο, μόνο δώδεκα βαθμούς. Φοράω το παλτό μου και μπότες, και παίρνω και την ομπρέλα μου.
      - speaker: Φώτης
        text: Σήμερα είμαι στο σπίτι όλη μέρα. Φοράω ένα παλιό τζιν και ένα πουλόβερ. Παπούτσια δεν φοράω!
  - type: exercise
    id: clothes-match
    about: clothes
    graded: true
    title: Аудирование 1 — описания и картинки
    instruction: Прослушайте шесть человек два раза. Какая картинка подходит каждому? Две картинки лишние.
    format: match
    bank:
      - женщина в длинном красном платье
      - женщина в синем платье
      - мужчина в брюках, белой рубашке и пиджаке
      - женщина в спортивной одежде
      - мужчина на пляже в плавках и шляпе
      - женщина в пальто и сапогах, с зонтом
      - женщина в пальто и сапогах, идёт снег
      - мужчина дома в джинсах и свитере, без обуви
    items:
      - id: m1
        prompt: Κατερίνα
        answer: женщина в длинном красном платье
        explanation: "Ένα μακρύ κόκκινο φόρεμα — длинное красное платье (μακρύς — модуль 11). Синее платье (μπλε) в записи не звучит."
      - id: m2
        prompt: Χρίστος
        answer: мужчина в брюках, белой рубашке и пиджаке
        explanation: "Σκούρο παντελόνι, άσπρο πουκάμισο και σακάκι — сегодня собеседование. Ловушка: джинсы он носит обычно (συνήθως), а не сегодня."
      - id: m3
        prompt: Μυρτώ
        answer: женщина в спортивной одежде
        explanation: Πηγαίνω στο γυμναστήριο… άνετο παντελόνι, μπλουζάκι, άνετα παπούτσια — удобная одежда для спортзала.
      - id: m4
        prompt: Κυριάκος
        answer: мужчина на пляже в плавках и шляпе
        explanation: Πάμε… στην παραλία. Φοράω το μαγιό μου… και ένα καπέλο για τον ήλιο (το μαγιό — купальник или плавки, модуль 11).
      - id: m5
        prompt: Στέλλα
        answer: женщина в пальто и сапогах, с зонтом
        explanation: "Έξω βρέχει… παίρνω και την ομπρέλα μου — идёт дождь, а не снег (βρέχει / χιονίζει, модуль 19)."
      - id: m6
        prompt: Φώτης
        answer: мужчина дома в джинсах и свитере, без обуви
        explanation: Είμαι στο σπίτι… ένα παλιό τζιν και ένα πουλόβερ. Παπούτσια δεν φοράω!
  - type: listening
    id: pharmacy
    title: Στο φαρμακείο
    plays: 2
    transcript:
      - speaker: Ηλίας
        text: Καλημέρα σας. Παρακαλώ;
      - speaker: Βέρα
        text: Καλημέρα. Έχω μια συνταγή από τον γιατρό για τον άντρα μου.
      - speaker: Ηλίας
        text: Να δω… Είναι αντιβίωση. Η συνταγή είναι από το ΓεΣΥ, γι' αυτό πληρώνετε μόνο ένα ευρώ.
      - speaker: Βέρα
        text: Ωραία. Πώς την παίρνει;
      - speaker: Ηλίας
        text: Ένα χάπι κάθε δώδεκα ώρες, το πρωί και το βράδυ, μετά το φαγητό. Για επτά μέρες.
      - speaker: Βέρα
        text: Κι αν σε τρεις μέρες είναι καλύτερα; Μπορεί να σταματήσει;
      - speaker: Ηλίας
        text: Όχι, πρέπει να την πάρει και τις επτά μέρες.
      - speaker: Βέρα
        text: Εντάξει. Έχετε και κάτι για μένα; Έχω πονόλαιμο από χθες.
      - speaker: Ηλίας
        text: Έχετε πυρετό;
      - speaker: Βέρα
        text: Όχι, πυρετό δεν έχω.
      - speaker: Ηλίας
        text: Τότε πάρτε αυτά τα χάπια για τον λαιμό, ένα κάθε τρεις ώρες. Και πίνετε ζεστό τσάι με μέλι.
      - speaker: Βέρα
        text: Πόσο κάνουν;
      - speaker: Ηλίας
        text: Πέντε ευρώ και πενήντα. Με την αντιβίωση, έξι και πενήντα.
      - speaker: Βέρα
        text: Ορίστε. Ευχαριστώ πολύ.
      - speaker: Ηλίας
        text: Περαστικά και στους δύο σας!
  - type: exercise
    id: pharmacy-choice
    about: pharmacy
    graded: true
    title: Аудирование 2 — выбор из трёх
    instruction: Прослушайте диалог два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Για ποιον είναι η αντιβίωση;
        options:
          - Για τη Βέρα.
          - Για τον άντρα της Βέρας.
          - Για την κόρη της Βέρας.
        answer: Για τον άντρα της Βέρας.
        explanation: "Έχω μια συνταγή από τον γιατρό για τον άντρα μου. Для себя Вера покупает только таблетки для горла."
      - id: q2
        prompt: Πόσο πληρώνει η Βέρα για την αντιβίωση;
        options:
          - 1 ευρώ.
          - 5,50 ευρώ.
          - 6,50 ευρώ.
        answer: 1 ευρώ.
        explanation: "Η συνταγή είναι από το ΓεΣΥ, γι' αυτό πληρώνετε μόνο ένα ευρώ (модуль 18). 5,50 — таблетки для горла, 6,50 — всё вместе."
      - id: q3
        prompt: Πότε παίρνει ο άντρας της το χάπι;
        options:
          - Το πρωί και το βράδυ, μετά το φαγητό.
          - Το πρωί και το βράδυ, πριν από το φαγητό.
          - Κάθε τρεις ώρες.
        answer: Το πρωί και το βράδυ, μετά το φαγητό.
        explanation: "Κάθε δώδεκα ώρες, το πρωί και το βράδυ, μετά το φαγητό. Κάθε τρεις ώρες — таблетки Веры."
      - id: q4
        prompt: Τι λέει ο φαρμακοποιός για την αντιβίωση;
        options:
          - Αν ο άντρας της είναι καλύτερα, μπορεί να σταματήσει.
          - Πρέπει να την πάρει και τις επτά μέρες.
          - Σε τρεις μέρες πρέπει να πάει πάλι στον γιατρό.
        answer: Πρέπει να την πάρει και τις επτά μέρες.
        explanation: "Μπορεί να σταματήσει; — Όχι, πρέπει να την πάρει και τις επτά μέρες: антибиотик пьют весь курс (модуль 18)."
      - id: q5
        prompt: Τι πρόβλημα έχει η Βέρα;
        options:
          - Έχει πυρετό.
          - Έχει πονόλαιμο.
          - Έχει πονοκέφαλο.
        answer: Έχει πονόλαιμο.
        explanation: "Έχω πονόλαιμο από χθες. Температуры нет: πυρετό δεν έχω (модуль 17)."
      - id: q6
        prompt: Τι της λέει ο φαρμακοποιός να πίνει;
        options:
          - Ζεστό τσάι με μέλι.
          - Ζεστό γάλα.
          - Πολύ νερό.
        answer: Ζεστό τσάι με μέλι.
        explanation: Και πίνετε ζεστό τσάι με μέλι — повелительное наклонение на «вы», совет на каждый день (модуль 18).
  - type: listening
    id: easter-message
    title: Ένα μήνυμα από τη Δέσποινα
    plays: 2
    transcript:
      - speaker: Δέσποινα
        text: Γεια σου, Ζωή! Η Δέσποινα είμαι. Σου αφήνω ένα μήνυμα. Θέλεις να έρθεις μαζί μας στο χωριό για το Πάσχα; Θα φύγουμε το Σάββατο στις δέκα το πρωί με το αυτοκίνητο του Άκη. Η διαδρομή κάνει μία ώρα. Θα έρθει και ο αδελφός μου με τη γυναίκα του. Το βράδυ θα πάμε όλοι στην εκκλησία για την Ανάσταση. Την Κυριακή η μαμά μου θα μαγειρέψει κλέφτικο, και θα φάμε στον κήπο. Η πρόγνωση λέει ότι το Σάββατο θα βρέξει, αλλά την Κυριακή θα έχει ήλιο. Το βράδυ στο χωριό κάνει κρύο, γι' αυτό πάρε ένα πουλόβερ. Θα φύγουμε από το χωριό τη Δευτέρα το απόγευμα. Δώρο δεν χρειάζεται! Πάρε με τηλέφωνο μέχρι την Πέμπτη, γιατί πρέπει να το πω στη μαμά μου. Φιλιά!
  - type: exercise
    id: easter-message-tf
    about: easter-message
