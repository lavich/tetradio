  - type: writing
    id: birthday-party
    register: friendly
    prompt: |-
      Письмо, часть A (дружеский текст). В прошлую субботу у вас был день рождения, и вы устроили праздник дома. Ваша подруга Ставрула (Σταυρούλα) не пришла: она болела. Она пишет: «Χρόνια πολλά! Συγγνώμη που δεν ήρθα στο πάρτι σου. Πώς ήταν;»

      Ответьте ей, 80–100 слов: поблагодарите за поздравление и пожелайте ей выздоровления; расскажите, когда и где был праздник и кто пришёл; что вы ели и делали — три-четыре действия в прошедшем времени, и одно фоном или повтором в παρατατικός; какой подарок понравился больше всего и от кого; предложите встретиться и назовите день.
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Σταυρούλα!

      Ευχαριστώ πολύ για τις ευχές σου! Είσαι καλύτερα; Περαστικά! Το πάρτι ήταν πολύ ωραίο. Το Σάββατο το βράδυ ήρθαν στο σπίτι μας δώδεκα φίλοι και συνάδελφοι. Ο άντρας μου μαγείρεψε κλέφτικο, κι εγώ ετοίμασα σαλάτες και ένα μεγάλο γλυκό. Φάγαμε στον κήπο, γιατί έκανε ζέστη. Μετά όλοι χορεύαμε μέχρι τη μία. Πήρα πολλά δώρα, αλλά το πιο ωραίο ήταν ένα βιβλίο για την Κύπρο από τη Μαρία. Όλοι ρώτησαν για σένα! Θέλεις να βρεθούμε την Πέμπτη για καφέ; Θα σου φέρω και γλυκό!

      Φιλιά,
      Ελένα
    criteria:
      - 80–100 слов; дружеское обращение и прощание на «ты» (Γεια σου, …! … Φιλιά,), подпись вымышленным именем
      - "Ответ на её письмо: спасибо за поздравление и пожелание выздоровления — Ευχαριστώ για τις ευχές σου! Περαστικά! (модули 17, 22)"
      - "Не меньше трёх глаголов в аористе с верной формой, среди них неправильные: ήρθαν, φάγαμε, πήρα (модуль 15), и на -εψα / -ασα: μαγείρεψε, ετοίμασα (модуль 14)"
      - "Фон или повтор в прошлом — παρατατικός: όλοι χορεύαμε μέχρι τη μία (модуль 22); законченные действия — аорист, времена не перепутаны"
      - "Есть причина и противопоставление: γιατί έκανε ζέστη, αλλά…"
      - "Превосходная степень: το πιο ωραίο (δώρο) ήταν… (модуль 20); от кого — από τη Μαρία (από + винительный падеж)"
      - "Предложение встретиться с днём: Θέλεις να βρεθούμε την Πέμπτη…; (модуль 21)"
      - Тонос во всех словах из двух и больше слогов; дни и время без ошибок (το Σάββατο, την Πέμπτη, μέχρι τη μία)
  - type: writing
    id: course-change
    register: formal
    prompt: |-
      Письмо, часть B (менее дружеский, ближе к официальному текст). Вы записались на курс греческого в языковой школе «Ίκαρος»: группа Β1, по вторникам и четвергам в 18:00. С июня вы будете работать в новой фирме во вторую смену, до восьми вечера, и не сможете приходить на занятия.

      Напишите письмо директору школы, господину Антониу (ο κύριος Αντωνίου), 80–100 слов: кто вы и в какую группу записаны; что изменилось и почему вы не можете ходить в эти дни; вежливо попросите перевести вас в утреннюю или субботнюю группу; спросите, нужно ли доплатить; как с вами связаться; поблагодарите и попросите ответить. Обращение и прощание — как в официальном письме. Подпишитесь вымышленным именем.
    words:
      min: 80
      max: 100
    model: |-
      Αξιότιμε κύριε Αντωνίου,

      Σας γράφω για το μάθημα ελληνικών στη σχολή σας. Τον Μάρτιο γράφτηκα στο τμήμα Β1, κάθε Τρίτη και Πέμπτη στις έξι το απόγευμα. Δυστυχώς από τον Ιούνιο θα δουλεύω σε μια καινούργια εταιρεία με απογευματινή βάρδια, μέχρι τις οκτώ, γι' αυτό δεν θα μπορώ να έρχομαι. Θα μπορούσατε να με γράψετε σε ένα πρωινό τμήμα ή σε ένα τμήμα το Σάββατο; Θα ήθελα επίσης να ρωτήσω αν πρέπει να πληρώσω κάτι ακόμα. Το τηλέφωνό μου είναι 99 87 65 43. Σας ευχαριστώ εκ των προτέρων και περιμένω την απάντησή σας.

      Με εκτίμηση,
      Άννα Σεμιόνοβα
    criteria:
      - 80–100 слов; официальное обращение с запятой (Αξιότιμε κύριε Αντωνίου, — у фамилии на -ου звательная форма та же) и прощание (Με εκτίμηση,)
      - Всё письмо на «вы» (Σας γράφω, στη σχολή σας, Θα μπορούσατε) — ни одного σου или Γεια σου
      - "Сказано, зачем пишете и в какой вы группе: Σας γράφω για…; γράφτηκα στο τμήμα Β1 (аорист, модуль 16), κάθε Τρίτη και Πέμπτη στις έξι"
      - "Что изменилось и почему — будущее время и следствие: θα δουλεύω…, γι' αυτό δεν θα μπορώ να έρχομαι (повтор — от основы настоящего, модули 19, 21)"
      - "Вежливая просьба — не повелительное наклонение: Θα μπορούσατε να με γράψετε…; (модуль 23)"
      - "Вопрос об оплате: Θα ήθελα να ρωτήσω αν… (модуль 23)"
      - "Как связаться — телефон цифрами; концовка официального письма: Σας ευχαριστώ εκ των προτέρων, Περιμένω την απάντησή σας (модуль 16)"
      - Подпись вымышленным именем; тонос во всех словах из двух и больше слогов
  - type: speaking
    id: about-me
    part: interview
    prompt: |-
      Речь, часть A. Экзаменатор задаёт вопросы на «вы». Прочитайте каждый вопрос вслух, ответьте без подготовки одним-тремя предложениями и запишите ответы:
      Πού μένετε; Ποια είναι η αγαπημένη σας εποχή και γιατί; Τι κάνατε το Πάσχα; Ποιο είναι το αγαπημένο σας φαγητό; Μαγειρεύετε; Τι κάνετε συνήθως το πρωί; Τι θα κάνετε μετά τις εξετάσεις;
    seconds: 120
    model: Μένω στη Λευκωσία, σε ένα διαμέρισμα κοντά στο πανεπιστήμιο. Η αγαπημένη μου εποχή είναι η άνοιξη, γιατί δεν κάνει κρύο και δεν κάνει πολλή ζέστη. Το Πάσχα πήγαμε στο χωριό του άντρα μου. Το βράδυ πήγαμε στην εκκλησία, και την Κυριακή τσουγκρίσαμε αυγά. Το αγαπημένο μου φαγητό είναι ο μουσακάς. Μαγειρεύω συχνά, αλλά μουσακά κάνω μόνο την Κυριακή, γιατί θέλει πολλή ώρα. Το πρωί ξυπνάω στις επτά, κάνω ένα ντους και πίνω τον καφέ μου στο μπαλκόνι. Μετά τις εξετάσεις θα πάω μια εβδομάδα στην Πάφο για να ξεκουραστώ.
    criteria:
      - Ответили на все вопросы; о Пасхе, еде и утре — не одним словом, а с подробностью (τσουγκρίσαμε αυγά, μόνο την Κυριακή, στις επτά)
      - "Формы о себе: μένω, μαγειρεύω, ξυπνάω, πήγαμε, θα πάω — а не μένετε, κάνατε (так спрашивает экзаменатор)"
      - "Три времени на своих местах: настоящее о доме, еде и утре, аорист о Пасхе (πήγαμε, τσουγκρίσαμε), будущее после экзаменов (θα πάω, модуль 19)"
      - "Причина и цель: γιατί… (о сезоне, о мусаке), για να ξεκουραστώ (модуль 21)"
      - "Как часто и когда: συχνά, μόνο την Κυριακή, στις επτά (модули 05, 20)"
      - Ударение на своём месте (μουσακάς, εκκλησία, εξετάσεις); ответы связаны (και, αλλά, μετά)
  - type: speaking
    id: life-in-cyprus
    part: monologue
    prompt: |-
      Речь, часть B. Экзаменатор говорит: «Μιλήστε μας για τη ζωή σας στην Κύπρο. Τι σας αρέσει και τι είναι δύσκολο;» (Μιλήστε μας — «расскажите нам».)
      Говорите около полутора минут без подготовки: как давно вы здесь и где жили раньше; как было там — два-три предложения в παρατατικός; что вам нравится на Кипре и почему; что трудно; сравните жизнь здесь и там (πιο … από). Запишите ответ.
    seconds: 90
    model: Ζω στη Λεμεσό εδώ και δύο χρόνια. Πριν έμενα στη Μόσχα. Εκεί πήγαινα στη δουλειά μία ώρα με το λεωφορείο, και τον χειμώνα έκανε πολύ κρύο. Εδώ η ζωή είναι πιο ήσυχη από τη Μόσχα. Μου αρέσει πολύ ο καιρός, γιατί έχει ήλιο σχεδόν κάθε μέρα, και μου αρέσουν η θάλασσα και τα φρούτα. Οι γείτονές μου είναι πολύ φιλικοί, και την Κυριακή πίνουμε καφέ μαζί στον κήπο. Δύσκολο για μένα είναι το καλοκαίρι, γιατί κάνει πολλή ζέστη. Επίσης, τα λεωφορεία δεν έρχονται συχνά, γι' αυτό χρειάζομαι αυτοκίνητο. Τώρα μαθαίνω ελληνικά, γιατί θέλω να μιλάω με τους ανθρώπους εδώ.
    criteria:
      - Говорили около полутора минут, без долгих пауз
      - "Как давно — εδώ και + настоящее время: Ζω στη Λεμεσό εδώ και δύο χρόνια (модуль 16)"
      - "Прошлое как фон и привычка — παρατατικός: έμενα, πήγαινα, έκανε κρύο (модуль 22), а не аорист"
      - "Сравнение: πιο ήσυχη από τη Μόσχα (πιο … από + винительный падеж, модуль 20)"
      - "Нравится — с согласованием: μου αρέσει ο καιρός, μου αρέσουν η θάλασσα και τα φρούτα (модуль 08)"
      - "Причина и следствие: γιατί…, γι' αυτό… (модуль 21); слова модуля 24: οι γείτονες, φιλικοί, η ζωή"
  - type: speaking
    id: post-parcel
    part: roleplay
    prompt: |-
      Речь, часть C — ролевая игра. На экзамене её играют два кандидата; у вас есть около 2 минут, чтобы прочитать роль. Прочитайте обе роли, затем сыграйте роль А (клиент), а реплики служащего произнесите вслух сами или попросите кого-нибудь. Говорите на «вы» и запишите разговор.

      Роль А — клиент на почте. Вы хотите отправить посылку маме в Москву: у неё скоро день рождения. Узнайте цену и за сколько дней посылка дойдёт. Спросите, что нужно сделать. Заплатите картой, поблагодарите и попрощайтесь.

      Роль Б — служащий почты. Поздоровайтесь и спросите, чем помочь. Взвесьте посылку: два килограмма. Цена — 32 евро, посылка дойдёт за 10–12 дней. Попросите заполнить бланк: адрес получателя и адрес отправителя, — и подписать. Оплата картой возможна. Дайте чек.
    seconds: 120
    model: |-
      Б: Καλημέρα σας! Παρακαλώ;
      А: Καλημέρα σας. Θα ήθελα να στείλω αυτό το δέμα στη Μόσχα, στη μητέρα μου. Σε δύο εβδομάδες έχει γενέθλια.
      Б: Βεβαίως. Να το ζυγίσω… Είναι δύο κιλά.
      А: Πόσο κάνει;
      Б: Τριάντα δύο ευρώ.
      А: Σε πόσες μέρες θα φτάσει;
      Б: Σε δέκα ή δώδεκα μέρες, περίπου.
      А: Εντάξει. Τι πρέπει να κάνω;
      Б: Συμπληρώστε αυτό το έντυπο, παρακαλώ: τη διεύθυνση του παραλήπτη και τη δική σας, του αποστολέα. Και υπογράψτε εδώ.
      А: … Ορίστε. Μπορώ να πληρώσω με κάρτα;
      Б: Ναι, βέβαια. Ορίστε η απόδειξή σας.
      А: Ευχαριστώ πολύ. Καλή σας μέρα!
      Б: Καλή σας μέρα!
    criteria:
      - "Поздоровались и попрощались на «вы» (Καλημέρα σας! … Καλή σας μέρα!)"
      - "Вежливая просьба: Θα ήθελα να στείλω αυτό το δέμα… (модули 09, 23); куда и кому — στη Μόσχα, στη μητέρα μου"
      - "Два вопроса о главном: Πόσο κάνει; Σε πόσες μέρες θα φτάσει; — и поняли ответ (32 евро, 10–12 дней)"
      - "Спросили, что делать (Τι πρέπει να κάνω;), и выполнили: заполнили бланк — ο παραλήπτης, ο αποστολέας, υπογράφω (модуль 23)"
      - "Оплата: Μπορώ να πληρώσω με κάρτα; — με + винительный падеж"
      - Реплики служащего тоже прозвучали — диалог не оборвался; ударение на своём месте (δέμα, έντυπο, αποστολέας, απόδειξη)
  - type: explanation
    id: weak-skill
    title: Два занятия на слабый навык
    body: |-
      После пробника в курсе остаются два занятия — они идут сразу за M3: **«Слабый навык: чтение и аудирование»** и **«Слабый навык: письмо и речь»**. Новых тем в них нет: стратегии для каждого типа экзаменационного задания, новые короткие задания в формате экзамена, типичные ошибки и самопроверка письма и речи.

      **Как выбрать слабый навык.** Выпишите результаты трёх пробников по каждому навыку: M1 (после модуля 15), M2 и M3. Для чтения и аудирования это баллы из 25, для письма и речи — доля выполненных критериев. Дальше по порядку:

      1. Навык ниже 15 из 25 (или ниже 60 % критериев) в M3 — он и есть слабый.
      2. Если в M3 всё выше порога, берите навык с наименьшим запасом, особенно если он не рос от M1 к M3.
      3. Если запас везде одинаковый, берите письмо или речь: самопроверка по критериям мягче экзаменатора.

      Пройдите оба занятия. Если слабое чтение или аудирование, первое занятие проходите медленно: сначала 10 минут разберите ошибки M3 в этом навыке, потом стратегии, задания и все пояснения; если оба навыка в порядке — как быструю репетицию с таймером, пояснения только к ошибкам. Во втором занятии все делают оба письма за 45 минут и три части речи, а для слабого письма или речи в конце названа дополнительная работа. Подробно — в начале каждого занятия.

      **Если нужно больше практики** — заново сделайте задания из уроков курса. Всё — с таймером, как на экзамене.

      **Чтение.** Тексты с заданиями: «Здоровье, образ жизни и жалобы» (m17-2), «Инструкция к лекарству и звонок в клинику» (m18-2), «Прогноз погоды» (m19-2), «Хобби, кино и культурный центр» (m20-2, там есть и соединение), «Отказ и причина…» (m21-2, три приглашения), «Официальный стиль, документы и банк» (m23-1, письмо из банка), «Дом и службы…» (m24-1, объявление для жильцов), «Соседи, объявления и праздник в деревне…» (m24-2, доска объявлений — тоже соединение). Чтение из контрольных модулей 16–24 подряд — 30 минут на все девять текстов. Пропуски: «Повторение — будущее время» (m19-3), «Повторение — модули 17–19» (m20-3), «Повторение — модули 17–20» (m21-3). И чтение из M1 и M2.

      **Аудирование.** Заметки: «Στο τηλέφωνο με την κλινική» (m18-2), «Στο ταχυδρομείο» (m23-2), цифры в контрольной 19 (m19-test), «Στο τηλέφωνο με την υπηρεσία ρεύματος» (m23-test), «Τηλεφώνημα στον δήμο» (m24-1), заметки M1 и M2. Диалоги и монологи: «Τι θα κάνουμε το Σάββατο;» (m20-2), «Στο τηλέφωνο» (m21-2), прогноз «Ο καιρός σήμερα και αύριο» (m19-2), «Ο Κατακλυσμός στη Λάρνακα» (m22-2), «Η καινούργια γειτόνισσα» (m24-2), аудирование из контрольных 16–24.

      **Письмо.** Дружеский текст (A): письма из «Планы, два письма и любимый сезон» (m19-3), «Два письма, монолог, ролевая игра и повторение» (m20-3, сравнить два хобби), «Приглашение и вежливый отказ…» (m21-3, приглашение), «Пасха и Катаклизмос…» (m22-2, письмо о празднике) и «Соседи, объявления и праздник в деревне…» (m24-2, письмо о новом доме); перепишите по критериям письмо A из M3. Официальный текст (B): запрос в школу (m16-3), запись к врачу (m18-3), письмо в спортивный клуб (m20-3), вежливый отказ (m21-3), «Почта, официальное письмо и разговор в банке» (m23-2), письмо управляющему домом (m24-1). В конце напишите два письма за 45 минут подряд, как на экзамене: строчными печатными буквами, от руки, без настоящего имени.

      **Речь.** Вопросы и монолог: интервью «Приглашение и вежливый отказ…» (m21-3), «Дом и службы…» (m24-1) и части A из M1, M2 и M3; монологи «Два письма, монолог и повторение» (m16-3, почему я учу греческий), «Планы, два письма и любимый сезон» (m19-3), «Два письма, монолог, ролевая игра и повторение» (m20-3), «Пасха и Катаклизмос…» (m22-2), «Соседи, объявления и праздник в деревне…» (m24-2, о своём районе). Ролевые игры: «Заболел, не приду…» (m17-3), в аптеке (m18-3), куда пойти (m20-3), приглашение (m21-3), в банке (m23-2), шум у соседей (m24-2), ролевые игры M1, M2 и M3. Записывайте себя и слушайте запись по критериям.

      **Последняя неделя перед экзаменом (3–10 мая).** Каждый день карточки повторения — 15–20 минут, без пропусков. Нового материала не берите: ни новых слов, ни новых тем. Если есть силы, каждый день делайте одно короткое задание слабого навыка: один текст, одно аудирование, одно письмо или одну запись речи. За день до экзамена (10 мая) отдыхайте: только карточки, ранний сон. Приготовьте документы, которые требует экзаменационный центр (удостоверение личности с фотографией), и ручку. В день экзамена, 11 мая, приходите заранее.
