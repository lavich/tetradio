  - type: writing
    id: may-visit
    register: friendly
    prompt: |-
      Письмо, часть A (дружеский текст). Ваша подруга-гречанка Александра пишет: «Γεια! Τον Μάιο θα έρθω στην Κύπρο για μια εβδομάδα. Τι καιρό κάνει τότε; Τι θα κάνουμε μαζί;»

      Ответьте ей, 80–100 слов: обрадуйтесь приезду; опишите погоду в мае (солнце, градусы, море, вечер); скажите, где она будет жить; предложите два-три плана в будущем времени — куда пойдёте, что будете есть; посоветуйте, что взять с собой; спросите, когда прилетает самолёт, и предложите встретить.
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Αλεξάνδρα!

      Χαίρομαι πολύ που θα έρθεις. Τον Μάιο ο καιρός στην Κύπρο είναι καλός. Συνήθως έχει ήλιο και είκοσι πέντε βαθμούς, αλλά το βράδυ είναι δροσερό. Η θάλασσα είναι ακόμα λίγο κρύα. Θα μείνεις στο σπίτι μου, στο μικρό υπνοδωμάτιο. Την πρώτη μέρα θα κάνουμε βόλτα στο κέντρο της Λεμεσού και θα φάμε μεζέδες στο λιμάνι. Το σαββατοκύριακο θα πάμε με το αυτοκίνητο στο Τρόοδος, γιατί την άνοιξη εκεί έχει πολλά λουλούδια. Φέρε ένα πουλόβερ και άνετα παπούτσια! Τι ώρα φτάνει η πτήση σου; Θα έρθω να σε πάρω από το αεροδρόμιο.

      Φιλιά,
      Όλγα
    criteria:
      - 80–100 слов; дружеское обращение и прощание на «ты» (Γεια σου, …! … Φιλιά,), подпись вымышленным именем
      - "Погода по-гречески, как в модуле 19: έχει ήλιο, κάνει κρύο / ζέστη, είκοσι πέντε βαθμούς; прилагательное согласовано с существительным (η θάλασσα είναι κρύα, το βράδυ είναι δροσερό)"
      - "Не меньше трёх глаголов в будущем времени с θα и верным окончанием: θα μείνεις, θα κάνουμε, θα φάμε, θα πάμε (модуль 19)"
      - "После θα у однократного действия — форма от основы аориста: θα πάμε, θα φάμε, а не θα πηγαίνουμε"
      - "Совет — повелительное наклонение на «ты»: Φέρε…, Πάρε… (модуль 18)"
      - "Есть причина или противопоставление: γιατί…, αλλά…"
      - "Вопрос о рейсе и предложение встретить: Τι ώρα φτάνει η πτήση σου; Θα έρθω να σε πάρω… (σε — слабое местоимение перед глаголом, модуль 17)"
      - Тонос во всех словах из двух и больше слогов; города в родительном падеже без ошибок (το κέντρο της Λεμεσού)
  - type: writing
    id: landlord
    register: formal
    prompt: |-
      Письмо, часть B (менее дружеский, ближе к официальному текст). Вы снимаете квартиру у господина Михаилидиса (ο κύριος Μιχαηλίδης). В квартире две поломки: не работает кондиционер в спальне и сломана стиральная машина.

      Напишите ему письмо, 80–100 слов: кто вы и какую квартиру снимаете; что сломалось и с какого времени; почему это проблема; вежливо попросите прислать мастера; когда вы бываете дома и как с вами связаться; поблагодарите. Обращение и прощание — как в официальном письме. Подпишитесь вымышленным именем.
    words:
      min: 80
      max: 100
    model: |-
      Αξιότιμε κύριε Μιχαηλίδη,

      Σας γράφω για το διαμέρισμά σας στη Λάρνακα. Μένω εκεί από τον Σεπτέμβριο. Δυστυχώς έχω δύο προβλήματα. Το κλιματιστικό στο υπνοδωμάτιο δεν δουλεύει από την περασμένη Δευτέρα, και τώρα κάνει πολλή ζέστη τη νύχτα. Επίσης, το πλυντήριο είναι χαλασμένο εδώ και μία εβδομάδα, και δεν έχω καθαρά ρούχα. Θα μπορούσατε να στείλετε έναν ηλεκτρολόγο; Είμαι στο σπίτι κάθε μέρα μετά τις πέντε και όλο το Σάββατο. Το τηλέφωνό μου είναι 99 12 34 56. Σας ευχαριστώ εκ των προτέρων και περιμένω την απάντησή σας.

      Με εκτίμηση,
      Ίγκορ Πετρόφ
    criteria:
      - 80–100 слов; официальное обращение с запятой (Αξιότιμε κύριε Μιχαηλίδη, — фамилия в звательной форме без -ς) и прощание (Με εκτίμηση,)
      - Всё письмо на «вы» (Σας γράφω, το διαμέρισμά σας, Θα μπορούσατε) — ни одного σου или Γεια σου
      - "Сказано, зачем пишете и о какой квартире: Σας γράφω για το διαμέρισμά σας…"
      - "Обе поломки названы и есть «с какого времени»: δεν δουλεύει από την περασμένη Δευτέρα, είναι χαλασμένο εδώ και μία εβδομάδα (εδώ και + настоящее время)"
      - "Вежливая просьба — не повелительное наклонение: Θα μπορούσατε να στείλετε…; или Θα ήθελα να… (модуль 23)"
      - "Когда вы дома и как связаться: κάθε μέρα μετά τις πέντε, το τηλέφωνό μου είναι…; число телефона цифрами"
      - "Концовка официального письма: Σας ευχαριστώ εκ των προτέρων, Περιμένω την απάντησή σας (модуль 16)"
      - Подпись вымышленным именем; тонос во всех словах из двух и больше слогов
  - type: speaking
    id: about-me
    part: interview
    prompt: |-
      Речь, часть A. Экзаменатор задаёт вопросы на «вы». Прочитайте каждый вопрос вслух, ответьте без подготовки одним-тремя предложениями и запишите ответы:
      Πού μένετε; Πώς είναι το σπίτι σας; Τι κάνετε στον ελεύθερο χρόνο σας; Ποια είναι η αγαπημένη σας εποχή και γιατί; Τι κάνατε το Πάσχα; Τι θα κάνετε το καλοκαίρι;
    seconds: 120
    model: Μένω στη Λευκωσία, σε ένα διαμέρισμα κοντά στο πανεπιστήμιο. Το διαμέρισμά μου έχει δύο υπνοδωμάτια, ένα σαλόνι με μπαλκόνι και μια μικρή κουζίνα. Στον ελεύθερο χρόνο μου πηγαίνω στο γυμναστήριο δύο φορές την εβδομάδα και διαβάζω βιβλία. Η αγαπημένη μου εποχή είναι η άνοιξη, γιατί δεν κάνει κρύο και δεν κάνει πολλή ζέστη. Το Πάσχα πήγαμε στο χωριό του άντρα μου. Το βράδυ πήγαμε στην εκκλησία, και την Κυριακή τσουγκρίσαμε αυγά. Το καλοκαίρι θα πάω στη Ρωσία, για να δω την οικογένειά μου.
    criteria:
      - Ответили на все шесть вопросов; о доме, досуге и Пасхе — не одним словом, а с подробностью (δύο υπνοδωμάτια, δύο φορές την εβδομάδα, τσουγκρίσαμε αυγά)
      - "Формы о себе: μένω, πηγαίνω, πήγαμε, θα πάω — а не μένετε, κάνατε (так спрашивает экзаменатор)"
      - "Три времени на своих местах: настоящее о доме и досуге, аорист о Пасхе (πήγαμε, τσουγκρίσαμε), будущее о лете (θα πάω, модуль 19)"
      - "Причина и цель: γιατί… (о сезоне), για να δω… (о лете, модуль 21)"
      - "Как часто: δύο φορές την εβδομάδα, κάθε Σάββατο, συνήθως (модуль 20)"
      - Ударение на своём месте (υπνοδωμάτιο, γυμναστήριο, οικογένεια); ответы связаны (και, αλλά, μετά)
  - type: speaking
    id: my-health
    part: monologue
    prompt: |-
      Речь, часть B. Экзаменатор говорит: «Μιλήστε μας για την υγεία σας. Τι κάνετε για να είστε καλά;» (Μιλήστε μας — «расскажите нам».)
      Говорите около полутора минут без подготовки: какой спорт или движение есть в вашей неделе и как часто; что вы едите и пьёте; как спите и что делаете, когда устали или нервничаете; что делаете, когда заболели; что хотите изменить. Запишите ответ.
    seconds: 90
    model: Προσπαθώ να ζω υγιεινά. Κάθε πρωί περπατάω μισή ώρα στο πάρκο, και δύο φορές την εβδομάδα κολυμπάω στην πισίνα. Τρώω πολλά φρούτα και σαλάτες, αλλά λίγο κρέας. Πίνω πολύ νερό και λιγότερο καφέ από πριν, μόνο δύο φλιτζάνια την ημέρα. Δεν καπνίζω — πέρσι έκοψα το τσιγάρο. Κοιμάμαι επτά ώρες, γιατί ο ύπνος είναι πολύ σημαντικός. Όταν έχω άγχος από τη δουλειά, ακούω μουσική ή μιλάω με τους φίλους μου. Όταν αρρωσταίνω, πηγαίνω στον προσωπικό μου γιατρό. Θέλω να πηγαίνω πιο συχνά στο γυμναστήριο, αλλά δεν έχω πολύ ελεύθερο χρόνο.
    criteria:
      - Говорили около полутора минут, без долгих пауз
      - "Как часто — не меньше двух выражений: κάθε πρωί, δύο φορές την εβδομάδα, συνήθως (модуль 20)"
      - "Слова здоровья из модулей 17–18: υγιεινά, ο ύπνος, το άγχος, καπνίζω / έκοψα το τσιγάρο, αρρωσταίνω, ο προσωπικός γιατρός"
      - "Сравнение: λιγότερο καφέ από πριν, πιο συχνά (πιο / λιγότερο … από, модуль 20)"
      - "Союзы времени и причины: όταν…, γιατί… (модуль 21); одно действие в прошлом — аорист (πέρσι έκοψα)"
      - "Желание на будущее: θέλω να + глагол (θέλω να πηγαίνω…, модуль 16), с αλλά"
  - type: speaking
    id: post-parcel
    part: roleplay
    prompt: |-
      Речь, часть C — ролевая игра. На экзамене её играют два кандидата; у вас есть около 2 минут, чтобы прочитать роль. Прочитайте обе роли, затем сыграйте роль А (клиент), а реплики служащего произнесите вслух сами или попросите кого-нибудь. Говорите на «вы» и запишите разговор.

      Роль А — клиент на почте. Вы хотите отправить посылку маме в Москву: у неё скоро день рождения. Узнайте цену и за сколько дней посылка дойдёт. Спросите, что нужно сделать. Заплатите картой, поблагодарите и попрощайтесь.

      Роль Б — служащий почты. Поздоровайтесь и спросите, чем помочь. Взвесьте посылку: два килограмма. Цена — 32 евро, посылка дойдёт за 10–12 дней. Попросите заполнить бланк: адрес получателя и адрес отправителя, — и подписать. Оплата картой возможна. Дайте чек.
    seconds: 120
    model: |-
      Б: Καλημέρα σας! Παρακαλώ;
      А: Καλημέρα σας. Θα ήθελα να στείλω αυτό το δέμα στη Μόσχα, στη μητέρα μου. Σε δύο εβδομάδες έχει γενέθλια.
      Б: Βεβαίως. Να το ζυγίσω… Είναι δύο κιλά.
      А: Πόσο κάνει;
      Б: Τριάντα δύο ευρώ.
      А: Σε πόσες μέρες θα φτάσει;
      Б: Σε δέκα ή δώδεκα μέρες, περίπου.
      А: Εντάξει. Τι πρέπει να κάνω;
      Б: Συμπληρώστε αυτό το έντυπο, παρακαλώ: τη διεύθυνση του παραλήπτη και τη δική σας, του αποστολέα. Και υπογράψτε εδώ.
      А: … Ορίστε. Μπορώ να πληρώσω με κάρτα;
      Б: Ναι, βέβαια. Ορίστε η απόδειξή σας.
      А: Ευχαριστώ πολύ. Καλή σας μέρα!
      Б: Καλή σας μέρα!
    criteria:
      - "Поздоровались и попрощались на «вы» (Καλημέρα σας! … Καλή σας μέρα!)"
      - "Вежливая просьба: Θα ήθελα να στείλω αυτό το δέμα… (модули 09, 23); куда и кому — στη Μόσχα, στη μητέρα μου"
      - "Два вопроса о главном: Πόσο κάνει; Σε πόσες μέρες θα φτάσει; — и поняли ответ (32 евро, 10–12 дней)"
      - "Спросили, что делать (Τι πρέπει να κάνω;), и выполнили: заполнили бланк — ο παραλήπτης, ο αποστολέας, υπογράφω (модуль 23)"
      - "Оплата: Μπορώ να πληρώσω με κάρτα; — με + винительный падеж"
      - Реплики служащего тоже прозвучали — диалог не оборвался; ударение на своём месте (δέμα, έντυπο, αποστολέας, απόδειξη)
  - type: explanation
    id: weak-skill
    title: Два занятия на слабый навык
    body: |-
      После пробника в программе остаются два занятия. Новых тем в них нет: только работа над навыком, который сейчас слабее всех.

      **Как выбрать навык.** Выпишите результаты трёх пробников по каждому навыку: M1 (после модуля 15), M2 и M3. Для чтения и аудирования это баллы из 25, для письма и речи — доля выполненных критериев. Дальше по порядку:

      1. Навык ниже 15 из 25 (или ниже 60 % критериев) в M3 — он и есть слабый. Если таких два, отдайте по одному занятию каждому.
      2. Если в M3 всё выше порога, берите навык с наименьшим запасом, особенно если он не рос от M1 к M3.
      3. Если запас везде одинаковый, берите письмо или речь: самопроверка по критериям мягче экзаменатора.

      В каждом занятии сначала 10 минут разбирайте ошибки M3 в этом навыке: откройте пояснения, найдите в тексте или транскрипте слова, которые давали ответ, и повторите модули, на которые ссылаются пояснения. Потом делайте задания ниже. Всё — с таймером, как на экзамене.

      **Чтение.** *Занятие 1:* тексты с заданиями из уроков: «Здоровье, образ жизни и жалобы» (m17-2), «Инструкция к лекарству и звонок в клинику» (m18-2), «Прогноз погоды» (m19-2), «Хобби, кино и культурный центр» (m20-2, там есть и соединение), «Отказ и причина…» (m21-2, три приглашения), «Официальный стиль, документы и банк» (m23-1, письмо из банка). *Занятие 2:* чтение из контрольных модулей 16–23 подряд, 30 минут на все восемь текстов; потом упражнения на пропуски: «Повторение — будущее время» (m19-3), «Повторение — модули 17–19» (m20-3), «Повторение — модули 17–20» (m21-3). В пропусках сначала проверяйте род, число и время, потом смысл. Наконец, заново сделайте чтение из M1 и M2.

      **Аудирование.** *Занятие 1 — заметки:* «Στο τηλέφωνο με την κλινική» (m18-2), «Στο ταχυδρομείο» (m23-2), цифры в контрольной 19 (m19-test), «Στο τηλέφωνο με την υπηρεσία ρεύματος» (m23-test), заметки M1. Перед записью прочитайте все пункты и угадайте, что там будет: число, день, время. При первом прослушивании пишите цифрами, при втором проверяйте. *Занятие 2 — диалоги и монологи:* «Τι θα κάνουμε το Σάββατο;» (m20-2), «Στο τηλέφωνο» (m21-2), прогноз «Ο καιρός σήμερα και αύριο» (m19-2), «Ο Κατακλυσμός στη Λάρνακα» (m22-2), аудирование из контрольных 16–22. Ищите ловушки: в записи часто звучат два дня, два времени или две цены, и правильный вариант — только один из них.

      **Письмо.** *Занятие 1 — дружеский текст (A):* письма из «Планы, два письма и любимый сезон» (m19-3), «Два письма, монолог, ролевая игра и повторение» (m20-3, сравнить два хобби) и «Приглашение и вежливый отказ…» (m21-3, приглашение); 20 минут на письмо, потом подсчитайте слова и пройдитесь по критериям. Перепишите по критериям письмо A из M3. *Занятие 2 — официальный текст (B):* запрос в школу (m16-3), запись к врачу (m18-3), письмо в спортивный клуб (m20-3), вежливый отказ (m21-3), «Почта, официальное письмо и разговор в банке» (m23-2). Выучите наизусть рамку: Αξιότιμε κύριε… / Αξιότιμη κυρία…, Σας γράφω για να…, Θα ήθελα να…, Θα μπορούσατε να…;, Σας ευχαριστώ εκ των προτέρων, Περιμένω την απάντησή σας, Με εκτίμηση. В конце напишите два письма за 45 минут подряд, как на экзамене: строчными печатными буквами, от руки, без настоящего имени.

      **Речь.** *Занятие 1 — вопросы и монолог:* интервью «Приглашение и вежливый отказ…» (m21-3) и части A из M1 и M3; монологи «Два письма, монолог и повторение» (m16-3, почему я учу греческий), «Планы, два письма и любимый сезон» (m19-3), «Два письма, монолог, ролевая игра и повторение» (m20-3), «Пасха и Катаклизмос…» (m22-2). Записывайте себя, говорите полторы минуты без пауз, потом слушайте запись по критериям. *Занятие 2 — ролевые игры:* «Заболел, не приду…» (m17-3), в аптеке (m18-3), куда пойти (m20-3), приглашение (m21-3), в банке (m23-2), ролевые игры M1 и M3. Две минуты читайте роль и играйте обе роли вслух. Ни одна реплика не должна обрываться: если слово забылось, скажите его другими словами.

      **Последняя неделя перед экзаменом (3–10 мая).** Каждый день карточки повторения — 15–20 минут, без пропусков. Нового материала не берите: ни новых слов, ни новых тем. Если есть силы, каждый день делайте одно короткое задание слабого навыка: одно аудирование или одно письмо. За день до экзамена отдыхайте: только карточки, ранний сон. Приготовьте документы, которые требует экзаменационный центр (удостоверение личности с фотографией), и ручку. В день экзамена приходите заранее.
