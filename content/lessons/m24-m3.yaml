        answer: Σωστό
        explanation: Θέλεις να έρθεις μαζί μας στο χωριό για το Πάσχα; (модули 21, 22)
      - id: q2
        prompt: Θα πάνε στο χωριό με το λεωφορείο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Με το αυτοκίνητο του Άκη — на машине Акиса.
      - id: q3
        prompt: Το Σάββατο το βράδυ θα πάνε στην εκκλησία.
