      - speaker: Ναταλία
        text: Ωραία. Ένας συνάδελφός μου όμως δεν τρώει κρέας.
      - speaker: Λάμπρος
        text: Δεν πειράζει. Για τον συνάδελφό σας θα έχουμε ψάρι.
      - speaker: Ναταλία
