          - Τρεις.
          - Πέντε.
        answer: Τρεις.
        explanation: "Τρεις φορές την ημέρα, μετά το φαγητό. Δύο φορές — таблетки Веры, πέντε — возраст девочки."
      - id: q4
        prompt: Τι πρέπει να κάνει η Βέρα, αν σε τρεις μέρες το παιδί βήχει ακόμα;
        options:
          - Να πάει στον γιατρό.
          - Να πάρει άλλο σιρόπι.
          - Να έρθει πάλι στο φαρμακείο.
        answer: Να πάει στον γιατρό.
        explanation: Αν σε τρεις μέρες βήχει ακόμα, πρέπει να πάτε στον γιατρό (αν + настоящее время, модуль 21).
      - id: q5
        prompt: Γιατί αγοράζει η Βέρα και χάπια;
        options:
