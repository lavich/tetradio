      - id: q6
        prompt: Η Ζωή πρέπει να πάρει τηλέφωνο τη Δέσποινα μέχρι την Πέμπτη.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Πάρε με τηλέφωνο μέχρι την Πέμπτη — позвони мне до четверга.
  - type: listening
