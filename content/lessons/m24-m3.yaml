          - Έχει πονοκέφαλο.
        answer: Βήχει πολύ τη νύχτα.
        explanation: "Температура была в воскресенье, τώρα δεν έχει. Головная боль (πονοκέφαλος) — у самой Веры, а не у ребёнка."
      - id: q3
        prompt: Πόσες φορές την ημέρα παίρνει το παιδί το σιρόπι;
        options:
