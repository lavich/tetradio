        explanation: Το βράδυ θα πάμε όλοι στην εκκλησία για την Ανάσταση — пасхальная служба в субботу вечером (модуль 22).
      - id: q4
        prompt: Η πρόγνωση λέει ότι την Κυριακή θα βρέξει.
        options:
