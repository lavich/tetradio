  - type: exercise
    id: pharmacy-choice
    about: pharmacy
    graded: true
    title: Аудирование 2 — выбор из трёх
    instruction: Прослушайте диалог два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Για ποιον είναι το σιρόπι;
        options:
          - Για τη Βέρα.
          - Για την κόρη της Βέρας.
          - Για τον γιο της Βέρας.
        answer: Για την κόρη της Βέρας.
        explanation: "Για εσάς; — Όχι, για την κόρη μου. Для себя Вера покупает только таблетки от головной боли."
      - id: q2
        prompt: Τι πρόβλημα έχει το παιδί τώρα;
        options:
