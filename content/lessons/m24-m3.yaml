          - Γιατί έχει πονοκέφαλο.
          - Γιατί ο γιατρός της έδωσε συνταγή.
        answer: Γιατί έχει πονοκέφαλο.
        explanation: Έχετε και κάτι για τον πονοκέφαλο; Για μένα. О рецепте (συνταγή) в разговоре речи нет (модуль 18).
