      - speaker: Λάμπρος
        text: Ταβέρνα «Ο Πλάτανος», καλησπέρα σας.
      - speaker: Ναταλία
        text: Καλησπέρα σας. Με λένε Ναταλία Ορλόβα. Θα ήθελα να κλείσω ένα τραπέζι για την Παρασκευή το βράδυ.
      - speaker: Λάμπρος
        text: Βεβαίως. Για πόσα άτομα;
      - speaker: Ναταλία
        text: Για δεκατέσσερα. Είμαστε συνάδελφοι από μια εταιρεία.
      - speaker: Λάμπρος
