      - speaker: Ναταλία
        text: Ενενήντα επτά, τριάντα έξι, σαράντα πέντε, είκοσι ένα.
      - speaker: Λάμπρος
        text: Ενενήντα επτά, τριάντα έξι, σαράντα πέντε, είκοσι ένα. Ευχαριστώ, κυρία Ορλόβα. Σας περιμένουμε την Παρασκευή στις εννέα!
