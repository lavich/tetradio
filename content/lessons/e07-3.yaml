  - type: writing
    id: cover-letter
    register: formal
    prompt: "Вы откликаетесь на вакансию Senior Backend Engineer в Brightlane (тексты предыдущего урока). Напишите сопроводительное письмо менеджеру по найму Ms Hall (80–120 слов): цель письма, опыт, конкретная причина выбора компании, планы с формами going to и might, подпись."
    words: { min: 80, max: 120 }
    model: |-
      Dear Ms Hall,

      I am writing to apply for the Senior Backend Engineer position at Brightlane. I have worked on payment systems for six years, and I have led two migrations. What attracted me to your company is the product: I have used your payment pages for two years. Your mission resonates with me, and I would like to work on something with real impact. Next year, I am going to focus on system design, and I might move into a lead role later. I will do my best to contribute from day one.

      Kind regards,
      Anna Petrova
    criteria:
      - 80–120 слов, есть обращение, цель письма и подпись
      - Названа конкретная причина выбора компании, например продукт или миссия
      - Есть не меньше двух форм будущего, например going to и might
      - Описан опыт в одном-двух предложениях
      - Формальный стиль без сокращений и разговорных слов
  - type: explanation
    id: speaking-how
    title: Как записывать ответ
    body: |-
      Седьмой ответ вашего **банка ответов** — Why do you want to join us? К нему добавляется второй вопрос: Where do you see yourself in five years? Они задаются подряд и проверяют, связаны ли ваши планы с компанией.

      1) Начните с причины, относящейся именно к этой компании. 2) Скажите, что вы даёте команде. 3) Назовите рост, который хотите получить. 4) Для вопроса о пяти годах назовите направление через **I see myself as…** и добавьте **might** для открытых планов. 5) Запишите ответ, переслушайте, сверьте с образцом и критериями.

      Сцена в конце урока повторяет эту часть собеседования: интервьюер задаёт вопросы о мотивации и планах. Реплики интервьюера записаны на предыдущей странице; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: why-join
    part: monologue
    prompt: "Интервьюер: «Why do you want to join us?» Ответьте за 90 секунд: конкретная причина, ваш вклад, чего вы хотите достичь, связь целей с компанией."
    seconds: 90
    model: "Honestly, the culture is what drew me to you. I have been following your engineering blog for a while, and I read your public postmortems. I liked how open they were. I have also used your product for two years, so I would like to work on something with real impact. I think I would be a good fit for the team, and I will do my best to contribute from day one. In the short term, I want to learn your domain. I am also excited about the chance to work on a larger scale. My goals line up with where the company is heading, and that is the main reason I want to join you."
    criteria:
      - Ответ начинается с конкретной причины, которая относится именно к этой компании
      - Назван вклад в команду и ближайшая цель
      - Цели связаны с планами компании
      - Есть не меньше двух устойчивых фраз урока
      - Около 90 секунд, без долгих пауз
  - type: speaking
    id: five-years
    part: interview
    prompt: "Интервьюер продолжает: «Where do you see yourself in five years?» Ответьте за 60 секунд: направление, ближайший шаг, открытый вариант."
    seconds: 60
    model: "In five years, I see myself as a tech lead. Next year, I am going to focus on system design, and I am starting a part-time master's degree in September. I might consider a management track later, but I am not sure yet. Whatever I choose, I would like to grow inside a team like yours."
    criteria:
      - Названо направление через I see myself as
      - Есть твёрдый план с going to или present continuous
      - Есть открытый вариант с might
      - Ответ укладывается в 60 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
    transcript:
      - { speaker: Sarah, text: "Thank you for coming in. Why do you want to join us?", audio: e07-3/scene-lines-1.mp3 }
      - { speaker: Sarah, text: "That is interesting. What do you know about our product?", audio: e07-3/scene-lines-2.mp3 }
      - { speaker: Sarah, text: "And where do you see yourself in five years?", audio: e07-3/scene-lines-3.mp3 }
      - { speaker: Sarah, text: "What are you looking for in your next team?", audio: e07-3/scene-lines-4.mp3 }
      - { speaker: Sarah, text: "Thank you. Do you have any questions for us?", audio: e07-3/scene-lines-5.mp3 }
  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании в Brightlane. Интервьюер — Sarah. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику назовите причину, на вторую расскажите, как знаете продукт. На третью опишите, кем видите себя через пять лет. На четвёртую скажите, какую команду ищете. В конце задайте вопрос о планах команды. Вся ваша часть — 120 секунд, каждая реплика — две-четыре фразы.
    seconds: 120
    model: |-
      Sarah: Thank you for coming in. Why do you want to join us?
      You: Honestly, the culture is what drew me to you. I have been following your engineering blog for a while, and I liked how open your postmortems were. I think I would be a good fit for the team, and I will do my best to contribute from day one.
      Sarah: That is interesting. What do you know about our product?
      You: I have used it for two years as a customer, so I know the payment pages well. It is built for small shops, and I would like to work on something with real impact.
      Sarah: And where do you see yourself in five years?
      You: In five years, I see myself as a tech lead. Next year, I am going to focus on system design, and I might consider a management track later. My goals line up with where the company is heading.
      Sarah: What are you looking for in your next team?
      You: I am looking for a team that invests in its engineers. In the short term, I want to learn your domain, and I am excited about the chance to work on a larger scale.
      Sarah: Thank you. Do you have any questions for us?
      You: Yes. I would like to understand the team's roadmap. What is the team going to build over the next year?
    criteria:
      - Ответили на все пять реплик по порядку, каждая — две-четыре фразы
      - Первая причина конкретная и относится к компании
      - Планы на пять лет — направление через I see myself as и открытый вариант с might
      - Есть твёрдый план с going to или present continuous
      - Вопрос о планах команды задан в конце
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "I ___ at this company since 2021."
        options: [have worked, worked, am working]
        answer: have worked
        explanation: Since 2021 — период до сих пор, нужен present perfect.
      - id: q2
        prompt: "Could you tell me what the team ___ next year?"
        options: [is going to build, is it going to build, does it build]
        answer: is going to build
        explanation: В косвенном вопросе порядок слов как в утверждении; план — going to.
      - id: q3
        prompt: "The system ___ by two engineers in 2022. (была построена)"
        options: [was built, is built, built]
        answer: was built
        explanation: Прошедшее время и исполнитель после by — passive в past.
      - id: q4
        prompt: "I was working on the migration when the requirements ___."
        options: [changed, have changed, were change]
        answer: changed
        explanation: Короткое действие внутри длительного — past simple.
      - id: q5
        prompt: "TypeScript is ___ than plain JavaScript. (безопаснее)"
        options: [safer, more safe, safest]
        answer: safer
        explanation: Односложное прилагательное образует сравнительную степень с -er.
      - id: q6
        prompt: "I'm leaving because I ___ my role. (перерос; результат важен сейчас)"
        options: [have outgrown, will outgrow, outgrowing]
        answer: have outgrown
        explanation: Результат до настоящего момента — present perfect.
