blocks:
  - type: explanation
    id: scheme
    title: Ответ о мотивации и планах в пяти шагах
    body: |-
      На вопросы **Why do you want to join us?** и **Where do you see yourself in five years?** интервьюер ищет причину, которая относится именно к этой компании, и план, который с ней связан. Ответ строится как короткий маршрут, и каждый шаг занимает одну-две фразы.

      **1. Причина.** Назовите конкретное: продукт, культуру, технологию. **Honestly, the culture is what drew me to you. I've used your product for two years.**

      **2. Что вы даёте.** Скажите, как будете полезны: **I think I'd be a good fit for the team. I'll do my best to contribute from day one.**

      **3. Что хотите получить.** Назовите рост, который соответствует компании: **In the short term, I want to learn your domain. I'm excited about the chance to work on a larger scale.**

      **4. Направление на пять лет.** Используйте **I see myself as…**, твёрдые планы выражайте формами **going to** и present continuous, открытые — **might**: **In five years, I see myself as a tech lead. I might consider a management track later.**

      **5. Связь с компанией.** **My goals line up with where the company is heading.** В конце можно задать вопрос: **I'd like to understand the team's roadmap.**
    table:
      columns:
        - шаг
        - язык
        - пример
      rows:
        - - причина
          - the … is what drew me to you
          - Honestly, the culture is what drew me to you.
        - - вклад
          - I think I'd be a good fit; I'll do my best to…
          - I'll do my best to contribute from day one.
        - - рост
          - In the short term, I want to…
          - In the short term, I want to learn your domain.
        - - пять лет
          - I see myself as…; I might…
          - In five years, I see myself as a tech lead.
        - - связь
          - My goals line up with…
          - My goals line up with where the company is heading.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: good-structure
    title: Подходящая реакция
    instruction: Выберите вариант, который подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: Интервьюер спрашивает «Why do you want to join us?». Какой ответ начинается с конкретной причины?
        options:
          - Honestly, the culture is what drew me to you.
          - I need a job.
          - Because you pay well.
        answer: Honestly, the culture is what drew me to you.
        explanation: Первая фраза называет причину, которая относится именно к этой компании.
      - id: q2
        prompt: Вы хотите сказать, что сможете приносить пользу сразу. Какая фраза подходит?
        options:
          - I'll do my best to contribute from day one.
          - I'd like to understand the team's roadmap.
          - In five years, I see myself as a tech lead.
        answer: I'll do my best to contribute from day one.
      - id: q3
        prompt: Вы объясняете, как ваши цели связаны с планами компании. Какая фраза подходит?
        options:
          - My goals line up with where the company is heading.
          - I'm going to focus on system design.
          - Why do you want to join us?
        answer: My goals line up with where the company is heading.
      - id: q4
        prompt: Вы хотите сказать, что подойдёте команде. Какая фраза подходит?
        options:
          - I think I'd be a good fit for the team.
          - In the short term, I want to learn your domain.
          - I'm leaving on good terms.
        answer: I think I'd be a good fit for the team.
      - id: q5
        prompt: В конце разговора вы хотите спросить о планах команды. Какая фраза подходит?
        options:
          - I'd like to understand the team's roadmap.
          - I'm excited about the chance to work on a larger scale.
          - Where do you see yourself in five years?
        answer: I'd like to understand the team's roadmap.
      - id: q6
        prompt: Вы говорите о том, чего хотите достичь в ближайшее время. Какая фраза подходит?
        options:
          - In the short term, I want to learn your domain.
          - In five years, I see myself as a tech lead.
          - I might consider a management track later.
        answer: In the short term, I want to learn your domain.
  - type: exercise
    id: future-fix
    title: Будущее в ответах
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: "In five years, I ___ myself as a tech lead."
        options: [see, will see, am seeing]
        answer: see
        explanation: Фраза I see myself as… стоит в present simple.
      - id: q2
        prompt: "Next year, I ___ focus on system design. (решённый план)"
        options: [am going to, might to, will to]
        answer: am going to
        explanation: После am going нужен to; после might и will to не нужен.
      - id: q3
        prompt: "When I ___ the team, I will read the documentation first."
        options: [join, will join, would join]
        answer: join
        explanation: После when будущее выражается present simple.
      - id: q4
        prompt: "I'm not sure yet, so I ___ stay in backend. (возможно)"
        options: [might, am going to, will to]
        answer: might
        explanation: Решение не принято, поэтому might.
      - id: q5
        prompt: "If the offer ___ good, I will accept it."
        options: [is, will be, would be]
        answer: is
        explanation: После if будущее выражается present simple.
      - id: q6
        prompt: "I ___ a certification exam on 12 June. (дата назначена)"
        options: [am taking, might taking, will to take]
        answer: am taking
        explanation: План с датой — present continuous.
  - type: explanation
    id: writing-how
    title: Сопроводительное письмо
    body: |-
      Письменная задача — сопроводительное письмо к отклику на вакансию Senior Backend Engineer в Brightlane из предыдущего урока, 80–120 слов, в формальном стиле.

      Схема: 1) обращение (**Dear Ms Hall,**) и цель письма (**I am writing to apply for…**); 2) опыт в одном-двух предложениях; 3) причина выбора компании; 4) планы с формами **going to** и **might**; 5) завершение и подпись (**Kind regards**).

      В формальном письме сокращения (*I'm, I'll*) не используются: пишите **I am, I will**. Проверьте себя: названа конкретная причина, есть не меньше двух форм будущего, письмо укладывается в 80–120 слов.
