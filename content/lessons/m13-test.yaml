title: Контрольная модуля 13
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Разговор на кассе звучит два раза. Ошибки не страшны: пояснения после ответа подскажут, что повторить.
  - type: reading
    id: irina
    title: Κάθε μέρα στον δρόμο
    text: |-
      Με λένε Ιρίνα. Μένω στη Λάρνακα, αλλά δουλεύω στη Λευκωσία. Δεν οδηγώ, γι' αυτό πηγαίνω στη δουλειά με το υπεραστικό λεωφορείο. Το λεωφορείο ξεκινάει από τη στάση κοντά στο σπίτι μου στις επτά και δέκα και φτάνει στη Λευκωσία στις οκτώ. Η διαδρομή κάνει πενήντα λεπτά, αλλά όταν έχει κίνηση, κάνει μία ώρα και κάτι. Στο λεωφορείο δεν βιάζομαι: διαβάζω ή κοιμάμαι λίγο.

      Στη Λευκωσία παίρνω ένα αστικό λεωφορείο, τη γραμμή 16, και κατεβαίνω στην τρίτη στάση, απέναντι από τη δουλειά μου. Το βράδυ γυρίζω με το λεωφορείο των έξι.

      Το Σάββατο ο άντρας μου οδηγεί και πάμε με το αυτοκίνητο στην Πάφο, στους γονείς του. Η απόσταση είναι εκατόν σαράντα χιλιόμετρα και κάνουμε μιάμιση ώρα.
    glosses:
      - text: γι' αυτό
        russian: поэтому
      - text: μία ώρα και κάτι
        russian: час с небольшим
      - text: με το λεωφορείο των έξι
        russian: на шестичасовом автобусе
      - text: μιάμιση ώρα
        russian: полтора часа
  - type: exercise
    id: irina-tf
    about: irina
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Ιρίνα πηγαίνει στη δουλειά με το αυτοκίνητο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν οδηγώ — она ездит на междугороднем автобусе.
      - id: q2
        prompt: Το λεωφορείο φεύγει από τη Λάρνακα στις επτά και δέκα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ξεκινάει… στις επτά και δέκα — отправляется в 7:10.
      - id: q3
        prompt: Όταν έχει κίνηση, η διαδρομή κάνει πενήντα λεπτά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Пятьдесят минут — обычно; в пробки — μία ώρα και κάτι, час с небольшим.
      - id: q4
        prompt: Στη Λευκωσία η Ιρίνα πηγαίνει στη δουλειά με τα πόδια.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: В Никосии она садится на городской автобус, линия 16.
      - id: q5
        prompt: Η Ιρίνα κατεβαίνει απέναντι από τη δουλειά της.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Το Σάββατο πηγαίνουν στην Πάφο με το λεωφορείο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Ο άντρας μου οδηγεί — в субботу они едут на машине.
      - id: q7
        prompt: Στο λεωφορείο η Ιρίνα διαβάζει ή κοιμάται.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: listening
    id: ticket
    title: Στο εκδοτήριο
    plays: 2
    transcript:
      - speaker: Σταύρος
        text: Καλημέρα σας. Παρακαλώ;
      - speaker: Χρύσα
        text: Καλημέρα. Ένα εισιτήριο για τη Λεμεσό, παρακαλώ.
      - speaker: Σταύρος
        text: Απλό ή μετ' επιστροφής;
      - speaker: Χρύσα
        text: Απλό. Αύριο γυρίζω με τον αδελφό μου, με το αυτοκίνητο.
      - speaker: Σταύρος
        text: Πέντε ευρώ.
      - speaker: Χρύσα
        text: Ορίστε. Τι ώρα φεύγει το επόμενο λεωφορείο;
      - speaker: Σταύρος
        text: Στις δώδεκα. Έχετε σαράντα λεπτά.
      - speaker: Χρύσα
        text: Εντάξει. Πόση ώρα κάνει μέχρι τη Λεμεσό;
      - speaker: Σταύρος
        text: Περίπου μία ώρα και δέκα λεπτά. Φτάνει στη μία και δέκα.
      - speaker: Χρύσα
        text: Και από πού φεύγει;
      - speaker: Σταύρος
        text: Από τη στάση πέντε, δίπλα στο καφέ.
      - speaker: Χρύσα
        text: Ευχαριστώ. Και στη Λεμεσό υπάρχει λεωφορείο για το νοσοκομείο;
      - speaker: Σταύρος
        text: Ναι, η γραμμή τριάντα. Περνάει κάθε είκοσι λεπτά.
      - speaker: Χρύσα
        text: Ευχαριστώ πολύ! Γεια σας.
  - type: exercise
    id: ticket-choice
    about: ticket
    graded: true
    title: Аудирование
    instruction: Прослушайте разговор и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Τι εισιτήριο παίρνει η Χρύσα;
        options:
          - Απλό.
          - Μετ' επιστροφής.
          - Δύο απλά.
        answer: Απλό.
        explanation: Обратно она едет на машине с братом, поэтому билет в одну сторону.
      - id: q2
        prompt: Πόσο κάνει το εισιτήριο;
        options:
          - Πέντε ευρώ.
          - Οκτώ ευρώ.
          - Δώδεκα ευρώ.
        answer: Πέντε ευρώ.
      - id: q3
        prompt: Τι ώρα φεύγει το επόμενο λεωφορείο;
        options:
          - Στις δώδεκα.
          - Στις έντεκα.
          - Στη μία και δέκα.
        answer: Στις δώδεκα.
        explanation: В 13:10 (στη μία και δέκα) автобус прибывает в Лимасол.
      - id: q4
        prompt: Πόση ώρα κάνει η διαδρομή;
        options:
          - Περίπου μία ώρα και δέκα λεπτά.
          - Σαράντα λεπτά.
          - Είκοσι λεπτά.
        answer: Περίπου μία ώρα και δέκα λεπτά.
        explanation: "Ловушка: сорок минут — столько Хрисе ждать автобуса (Έχετε σαράντα λεπτά)."
      - id: q5
        prompt: Από πού φεύγει το λεωφορείο;
        options:
          - Από τη στάση πέντε.
          - Από τη στάση τρία.
          - Από τη γραμμή τριάντα.
        answer: Από τη στάση πέντε.
      - id: q6
        prompt: Κάθε πόση ώρα περνάει η γραμμή τριάντα στη Λεμεσό;
        options:
          - Κάθε είκοσι λεπτά.
          - Κάθε σαράντα λεπτά.
          - Κάθε μία ώρα.
        answer: Κάθε είκοσι λεπτά.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Το αεροπλάνο ___ στη Λάρνακα στις πέντε.
        options:
          - φτάνει
          - φτάνω
          - φτάνουν
        answer: φτάνει
      - id: q2
        prompt: Πάω στη δουλειά ___ το ποδήλατο.
        options:
          - με
          - σε
          - από
        answer: με
        explanation: На чём — με + транспорт.
      - id: q3
        prompt: Από τη Λάρνακα μέχρι ___ κάνει μία ώρα.
        options:
          - τη Λευκωσία
          - η Λευκωσία
          - στη Λευκωσία
        answer: τη Λευκωσία
        explanation: После μέχρι — винительный падеж с артиклем, без σε.
      - id: q4
        prompt: Μένω ___ Λεμεσό.
        options:
          - στη
          - στο
          - στον
        answer: στη
        explanation: Λεμεσός — женского рода, несмотря на -ος.
      - id: q5
        prompt: Ο Γιώργος ___ πολύ καλά.
        options:
          - οδηγεί
          - οδηγούν
          - οδηγώ
        answer: οδηγεί
      - id: q6
        prompt: Κατεβαίνουμε στην ___ στάση.
        options:
          - επόμενη
          - επόμενο
          - επόμενος
        answer: επόμενη
      - id: q7
        prompt: Είμαστε κοντά, φτάνουμε ___ δέκα λεπτά.
        options:
          - σε
          - στις
          - με
        answer: σε
        explanation: "Σε + время — «через»: через десять минут."
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το εισιτήριο
      - το εκδοτήριο
      - η πτήση
      - η καθυστέρηση
      - η κίνηση
      - βιάζομαι
      - χάνω
      - η πύλη
      - η άφιξη
      - αργώ
    items:
      - id: m1
        prompt: билет
        answer: το εισιτήριο
      - id: m2
        prompt: билетная касса
        answer: το εκδοτήριο
      - id: m3
        prompt: рейс самолёта
        answer: η πτήση
      - id: m4
        prompt: задержка
        answer: η καθυστέρηση
      - id: m5
        prompt: движение, пробки
        answer: η κίνηση
      - id: m6
        prompt: торопиться
        answer: βιάζομαι
      - id: m7
        prompt: терять
        answer: χάνω
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы садитесь в такси, вам нужно в порт.
        options:
          - Στο λιμάνι, παρακαλώ.
          - Από πού φεύγει το ταξί;
          - Κάθε πόση ώρα περνάει;
        answer: Στο λιμάνι, παρακαλώ.
      - id: q2
        prompt: Вы опаздываете на полчаса и пишете другу.
        options:
          - Θα αργήσω μισή ώρα.
          - Κάνει μισή ώρα.
          - Κάθε μισή ώρα.
        answer: Θα αργήσω μισή ώρα.
      - id: q3
        prompt: Пока вы покупали кофе, автобус ушёл.
        options:
          - Έχασα το λεωφορείο.
          - Το λεωφορείο αργεί.
          - Ανεβαίνω στο λεωφορείο.
        answer: Έχασα το λεωφορείο.
      - id: q4
        prompt: У кассы вам нужен билет туда и обратно.
        options:
          - Ένα εισιτήριο μετ' επιστροφής, παρακαλώ.
          - Ένα απλό εισιτήριο, παρακαλώ.
          - Πού πρέπει να κατέβω;
        answer: Ένα εισιτήριο μετ' επιστροφής, παρακαλώ.
