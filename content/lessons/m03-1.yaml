          - сестра
          - οι αδελφές
        - - ο γιος
          - сын
          - οι γιοι
        - - η κόρη
          - дочь
          - οι κόρες
        - - το παιδί
          - ребёнок
          - τα παιδιά
        - - ο άντρας
          - мужчина; муж
          - οι άντρες
