blocks:
  - type: explanation
    id: family
    title: Члены семьи
    body: |-
      Слова семьи учим сразу с артиклем — он показывает род: **ο** πατέρας (м. р.), **η** μητέρα (ж. р.), **το** παιδί (ср. р.). Часто пара «он — она» различается только окончанием: ο αδελφός — η αδελφή. Но бывают и разные слова: ο παππούς — η γιαγιά, ο γιος — η κόρη.

      **Ο άντρας** — и «мужчина», и «муж»; **η γυναίκα** — и «женщина», и «жена». Что имеется в виду, ясно из контекста: ο άντρας μου — «мой муж», η γυναίκα μου — «моя жена».

      **Οι γονείς** — «родители»; единственное число ο γονιός встречается редко. **Τα αδέλφια** — «братья и сёстры» вместе. В разговоре эти слова часто пишут и произносят через ρ: αδερφός, αδερφή, αδέρφια — оба написания правильные.

      **Το παιδί** — «ребёнок», **τα παιδιά** — «дети». Дома говорят ο μπαμπάς — «папа» и η μαμά — «мама».
    table:
      columns:
        - слово
        - перевод
        - мн. число
      rows:
        - - ο πατέρας
          - отец
          - οι πατέρες
        - - η μητέρα
          - мать
          - οι μητέρες
        - - ο γονιός
          - родитель
