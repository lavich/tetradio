  - type: explanation
    id: possessive
    title: Мой, твой, его — μου, σου, του
    body: |-
      «Мой, твой, его…» по-гречески — короткие слова, которые стоят **после** существительного. Перед существительным при этом остаётся артикль: **ο πατέρας μου** — «мой отец», дословно «отец мой». Без артикля нельзя: не «πατέρας μου», а «ο πατέρας μου».

      В отличие от русских «мой — моя — мои», эти слова не меняются: ο γιος **μου**, η κόρη **μου**, τα παιδιά **μου**.

      «Его» и «её» зависят от того, **чей** это человек, как и в русском: η μητέρα **του** — «его мать» (мать Никоса), η μητέρα **της** — «её мать» (мать Анны). **Σας** — и «ваш» нескольким людям, и вежливое «Ваш».

      Русского «свой» в греческом нет — берут слово того же лица: Μένω με τη μητέρα **μου** — «Я живу со своей мамой»; Η Άννα μένει με τη μητέρα **της** — «Анна живёт со своей мамой» (με — «с»).

      Представляя семью, «это» согласуйте с тем, о ком говорите: **Αυτός** είναι ο πατέρας μου. **Αυτή** είναι η μητέρα μου. **Αυτοί** είναι οι γονείς μου. **Αυτά** είναι τα παιδιά μου.
    table:
      columns:
        - лицо
        - слово
        - пример
      rows:
        - - я
          - μου — мой
          - ο πατέρας μου
        - - ты
          - σου — твой
          - η μητέρα σου
        - - он
          - του — его
          - ο γιος του
        - - она
          - της — её
          - η κόρη της
        - - мы
          - μας — наш
          - τα παιδιά μας
        - - вы
          - σας — ваш, Ваш
          - ο παππούς σας
        - - они
          - τους — их
          - οι γονείς τους
  - type: explanation
    id: accent
    title: Второй тонос — η οικογένειά μου
    body: |-
      Существительное и μου/σου/του… произносятся как одно слово. Если ударение в существительном стоит на **третьем слоге от конца**, то вместе с μου оно оказалось бы на четвёртом от конца — а в греческом так не бывает. Поэтому появляется второе ударение, на последнем слоге существительного, и пишется **второй тонос**: η οικογένεια → **η οικογένειά μου**, το όνομα → **το όνομά σου**. Второе ударение в речи обычно звучит даже сильнее первого.

      Если ударение на последнем или предпоследнем слоге, ничего не меняется: ο πατέρας μου, η μητέρα μου, ο αδελφός μου, το παιδί μου.

      Проверка простая: посчитайте слоги от конца. Οι-κο-γέ-νει-α — ударный третий от конца, значит, οικογένειά μου. Μη-τέ-ρα — ударный второй от конца, значит, μητέρα μου без второго тоноса.
    table:
      columns:
        - слово
        - с притяжательным
        - перевод
      rows:
        - - η οικογένεια
          - η οικογένειά μου
          - моя семья
        - - το όνομα
          - το όνομά σου
          - твоё имя
        - - το τηλέφωνο
          - το τηλέφωνό του
          - его телефон
        - - ο δάσκαλος (учитель)
          - ο δάσκαλός μας
          - наш учитель
        - - η μητέρα
          - η μητέρα μου
          - моя мать — без второго тоноса
        - - ο αδελφός
          - ο αδελφός της
          - её брат — без второго тоноса
  - type: explanation
    id: echo
    title: Глагол έχω — «иметь», «у меня есть»
    body: |-
      **Έχω** — «иметь». Им же переводят «у меня есть»: **Έχω μία αδελφή.** — «У меня есть сестра». Отдельного «у меня» нет — лицо видно по окончанию глагола. Έχω спрягается как μένω из модуля 02: -ω, -εις, -ει, -ουμε, -ετε, -ουν. В 3-м лице мн. ч. в разговоре часто говорят **έχουνε**.

      Отрицание — **δεν** перед глаголом: **Δεν έχω παιδιά.** — «У меня нет детей». Вопрос — интонацией: **Έχεις αδέλφια;** — «У тебя есть братья или сёстры?» Вежливо — **Έχετε παιδιά;**

      После έχω существительное часто стоит без артикля: Έχω δύο παιδιά. Слова мужского рода после έχω теряют конечное -ς, а ένας превращается в **έναν**: ο αδελφός → Έχω **έναν αδελφό**; ο γιος → Έχω **έναν γιο**. Это винительный падеж, подробно он будет в модуле 08, а пока запомните эти сочетания целиком. Во мн. ч. окончание тоже меняется: δύο αδελφούς, δύο γιους — пока просто узнавайте эти формы.

      Женский и средний род после έχω не меняются: Έχω **μία** κόρη (часто пишут и говорят μια), Έχω **ένα** παιδί.
    table:
      columns:
        - лицо
        - έχω
        - пример
      rows:
        - - εγώ
          - έχω
          - Έχω έναν αδελφό.
        - - εσύ
          - έχεις
          - Έχεις παιδιά;
        - - αυτός, αυτή
          - έχει
          - Η Άννα έχει δύο κόρες.
        - - εμείς
          - έχουμε
          - Έχουμε ένα παιδί.
        - - εσείς
          - έχετε
          - Έχετε αδέλφια;
        - - αυτοί, αυτές
          - έχουν (έχουνε)
          - Οι γονείς μου έχουν τρία παιδιά.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: family-match
    title: Кто есть кто
    instruction: Соедините русское слово с греческим. Три слова лишние.
    format: match
    bank:
      - ο πατέρας
      - η μητέρα
      - ο γιος
      - η κόρη
      - η γιαγιά
      - ο παππούς
      - ο αδελφός
      - η αδελφή
      - η γυναίκα
      - ο άντρας
      - το παιδί
    items:
      - id: m1
        prompt: отец
        answer: ο πατέρας
      - id: m2
        prompt: мать
        answer: η μητέρα
      - id: m3
        prompt: сын
        answer: ο γιος
      - id: m4
        prompt: дочь
        answer: η κόρη
        explanation: Η κόρη — «дочь». Не путайте с η κυρία — «госпожа».
      - id: m5
        prompt: бабушка
        answer: η γιαγιά
      - id: m6
        prompt: дедушка
        answer: ο παππούς
      - id: m7
        prompt: брат
        answer: ο αδελφός
      - id: m8
        prompt: жена
        answer: η γυναίκα
        explanation: Η γυναίκα — и «женщина», и «жена».
  - type: exercise
    id: family-gap
    title: Семья в предложениях
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - αδελφός
      - γυναίκα
      - κόρη
      - γιαγιά
      - γονείς
      - παιδιά
      - άντρας
    items:
      - id: g1
        prompt: Ο Πέτρος είναι ο ___ μου και η Μαρία είναι η αδελφή μου.
        answer: αδελφός
      - id: g2
        prompt: Ο Νίκος είναι ο άντρας μου και εγώ είμαι η ___ του.
        answer: γυναίκα
      - id: g3
        prompt: Ο Στέλιος είναι ο γιος μας και η Δάφνη είναι η ___ μας.
        answer: κόρη
      - id: g4
        prompt: Ο παππούς μου και η ___ μου μένουν στη Λάρνακα.
        answer: γιαγιά
      - id: g5
        prompt: Ο πατέρας μου και η μητέρα μου είναι οι ___ μου.
        answer: γονείς
        explanation: Οι γονείς — «родители», мн. ч. от ο γονιός.
      - id: g6
        prompt: Ο Στέλιος και η Δάφνη είναι τα ___ μας.
        answer: παιδιά
        explanation: "Сын и дочь вместе — τα παιδιά, «дети»."
  - type: exercise
    id: possessive-gap
    title: Чей?
    instruction: Вставьте μου, σου, του, της, μας, σας или τους. Одно слово лишнее.
    format: gap
    bank:
      - μου
      - σου
      - του
      - της
      - μας
      - σας
      - τους
    items:
      - id: g1
        prompt: Εγώ είμαι η Άννα και αυτός είναι ο άντρας ___.
        answer: μου
      - id: g2
        prompt: — Ποια είναι αυτή; Η αδελφή ___; — Ναι, η αδελφή μου η Μαρία.
        answer: σου
        explanation: Вопрос к собеседнику на «ты» — «твоя сестра?», η αδελφή σου.
      - id: g3
        prompt: Ο Νίκος είναι από την Πάφο, αλλά η γυναίκα ___ είναι από τη Ρωσία.
        answer: του
        explanation: Жена Никоса — «его жена», του.
      - id: g4
        prompt: Η Ελένη είναι στην Κύπρο, αλλά οι γονείς ___ μένουν στην Αθήνα.
        answer: της
        explanation: "Родители Елени — «её родители»: της."
      - id: g5
        prompt: Εγώ και ο Γιώργος έχουμε δύο παιδιά. Τα παιδιά ___ είναι στη Λάρνακα.
        answer: μας
        explanation: "Я и Йоргос — «мы», дети наши: μας."
      - id: g6
        prompt: Ο Πέτρος και η Άννα είναι από τη Μόσχα. Η κόρη ___ μένει στη Λεμεσό.
        answer: τους
        explanation: "Дочь Петра и Анны — «их дочь»: τους."
  - type: exercise
    id: accent-choice
    title: Второй тонос
    instruction: Выберите правильное написание.
    format: choice
    items:
      - id: q1
        prompt: моя семья
        options:
          - η οικογένεια μου
          - η οικογένειά μου
        answer: η οικογένειά μου
        explanation: Οι-κο-γέ-νει-α — ударение на третьем слоге от конца, поэтому с μου нужен второй тонос.
      - id: q2
        prompt: моя мать
        options:
          - η μητέρα μου
          - η μητέρά μου
        answer: η μητέρα μου
        explanation: Μη-τέ-ρα — ударение на предпоследнем слоге, второй тонос не нужен.
      - id: q3
        prompt: твоё имя
        options:
          - το όνομα σου
          - το όνομά σου
        answer: το όνομά σου
      - id: q4
        prompt: его телефон
        options:
          - το τηλέφωνό του
          - το τηλέφωνο του
          - το τηλεφωνό του
        answer: το τηλέφωνό του
        explanation: Первое ударение остаётся на месте (τηλέφωνο), к нему добавляется второе — τηλέφωνό του.
      - id: q5
        prompt: их семья
        options:
          - η οικογένεια τους
          - η οικογένειά τους
        answer: η οικογένειά τους
      - id: q6
        prompt: ваш учитель (ο δάσκαλος — учитель)
        options:
          - ο δάσκαλος σας
          - ο δάσκαλός σας
        answer: ο δάσκαλός σας
        explanation: Δά-σκα-λος — ударение на третьем слоге от конца.
      - id: q7
        prompt: мой отец
        options:
          - ο πατέρας μου
          - ο πατέράς μου
        answer: ο πατέρας μου
        explanation: Πα-τέ-ρας — ударение на предпоследнем слоге, второй тонос не нужен.
  - type: exercise
    id: echo-forms
    title: Формы έχω
    instruction: Вставьте форму глагола έχω.
    format: gap
    bank:
      - έχω
      - έχεις
      - έχει
      - έχουμε
      - έχετε
      - έχουν
    items:
      - id: g1
        prompt: Εγώ ___ έναν αδελφό.
        answer: έχω
      - id: g2
        prompt: Εσύ ___ αδέλφια;
        answer: έχεις
      - id: g3
        prompt: Η Μαρία ___ δύο κόρες.
        answer: έχει
      - id: g4
        prompt: Εμείς ___ ένα παιδί.
        answer: έχουμε
      - id: g5
        prompt: Κύριε Πέτρο, ___ παιδιά; (κύριε — господин)
        answer: έχετε
        explanation: Вежливое обращение — форма «вы», έχετε.
      - id: g6
        prompt: Οι γονείς μου ___ τρία παιδιά.
        answer: έχουν
      - id: g7
        prompt: Ο Νίκος δεν ___ αδέλφια.
        answer: έχει
        explanation: "Никос — «он»: έχει. Δεν стоит перед глаголом."
  - type: exercise
    id: echo-object
    title: Έχω έναν… или ένα…?
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Έχω ___ αδελφό.
        options:
          - ένας
          - έναν
          - ένα
        answer: έναν
        explanation: После έχω мужской род — έναν αδελφό (без -ς на конце слова).
      - id: q2
        prompt: Έχω ___ κόρη.
        options:
          - έναν
          - μία
          - ένα
        answer: μία
        explanation: Η κόρη — женский род, поэтому μία.
      - id: q3
        prompt: Έχουμε ___ παιδί.
        options:
          - έναν
          - μία
          - ένα
        answer: ένα
        explanation: Το παιδί — средний род, поэтому ένα.
      - id: q4
        prompt: Έχω έναν ___. (сын)
        options:
          - γιος
          - γιο
        answer: γιο
        explanation: После έχω мужской род теряет -ς — έναν γιο.
      - id: q5
        prompt: У меня нет детей.
        options:
          - Δεν έχω παιδιά.
          - Έχω δεν παιδιά.
          - Δεν έχω τα παιδιά.
        answer: Δεν έχω παιδιά.
        explanation: Δεν — перед глаголом; после έχω в таком предложении артикля нет.
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Это моя семья.
        answer:
          - Αυτή είναι η οικογένειά μου.
        explanation: Η οικογένεια — женский род, поэтому αυτή; с μου — второй тонос.
      - id: q2
        prompt: У меня есть брат и сестра.
        answer:
          - Έχω έναν αδελφό και μία αδελφή.
          - Έχω έναν αδελφό και μια αδελφή.
          - Έχω έναν αδερφό και μία αδερφή.
          - Έχω έναν αδερφό και μια αδερφή.
        explanation: Брат после έχω — έναν αδελφό, сестра — μία αδελφή.
      - id: q3
        prompt: У тебя есть дети?
        answer:
          - Έχεις παιδιά;
          - Εσύ έχεις παιδιά;
      - id: q4
        prompt: У меня нет детей.
        answer:
          - Δεν έχω παιδιά.
          - Εγώ δεν έχω παιδιά.
      - id: q5
        prompt: Это мой муж.
        answer:
          - Αυτός είναι ο άντρας μου.
        explanation: Ο άντρας — мужской род, поэтому αυτός.
      - id: q6
        prompt: Её дочь сейчас в Лимасоле. (στη Λεμεσό — в Лимасоле)
        answer:
          - Η κόρη της είναι τώρα στη Λεμεσό.
          - Τώρα η κόρη της είναι στη Λεμεσό.
          - Η κόρη της τώρα είναι στη Λεμεσό.
        explanation: Не пропускайте артикль (η κόρη) и глагол (είναι).
      - id: q7
        prompt: Наши дети в Греции. (στην Ελλάδα — в Греции)
        answer:
          - Τα παιδιά μας είναι στην Ελλάδα.
