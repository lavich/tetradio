blocks:
  - type: explanation
    id: feedback-words
    title: Слова урока о фидбеке и развитии
    body: |-
      Тексты урока описывают код-ревью и рассказ кандидата о команде. Слова урока образуют три группы.

      **Манера фидбека.** **Constructive** — конструктивный: замечание помогает улучшить работу. **Candid** — откровенный: человек говорит прямо о том, что думает. **Tactful** — тактичный: человек говорит деликатно, с учётом чувств собеседника. **Sugar-coat** — смягчать неприятную правду так, что она искажается. **Actionable** — применимый: из замечания понятно, что делать. **Criticism** — критика; слово неисчисляемое: *some criticism*.

      **Реакция и отношения.** **Defensive** — защищающийся: человек оправдывается в ответ на замечание. **Take on board** — принять к сведению и учесть. **Acknowledge** — признать: согласиться, что что-то верно или произошло. **Commend** — отметить похвалой, дать положительную оценку. **Approachable** — доступный: к такому человеку легко обратиться. **Rapport** — взаимопонимание, тёплые рабочие отношения.

      **Развитие.** **A blind spot** — слепое пятно: то, чего человек не замечает в своей работе. **A growth area** — зона роста: навык, который стоит развивать. **A sounding board** — собеседник, на котором проверяют идею. **Step on someone's toes** — задеть чужую зону ответственности. **A 360 review** — оценка 360: отзывы от руководителя, коллег и подчинённых.
