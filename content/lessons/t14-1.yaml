blocks:
  - type: explanation
    id: news-tenses
    title: Новости — past simple и present perfect
    body: |-
      Когда друзья давно не виделись, они рассказывают новости. Время глагола зависит от того, названо ли время события.

      **Past simple** — событие в названный момент прошлого: **I moved to Leeds in May.** **We met two years ago.** Маркеры: **yesterday, last week, in May, two years ago, when**.

      **Present perfect** (have или has + третья форма глагола) — событие без названного времени, результат которого важен сейчас: **I've started a new job.** **I've just got back from Portugal.** Маркеры: **just, already, yet, ever, never, recently, so far**. С **since** и **for** present perfect говорит о том, что продолжается до сих пор: **I've lived here since March.**

      На вопрос **What have you been up to?** отвечают двумя шагами: общая новость в present perfect, затем подробности в past simple: **I've moved to Leeds. I found a flat in May, and I started work in June.**

      Две частые ошибки. Первая — present perfect с названным временем: I've moved in May. Нужно **I moved in May.** Вторая — past simple с since: I lived here since March. Нужно **I've lived here since March.**
    table:
      columns:
        - что рассказать
        - время
        - пример
      rows:
        - - событие в названный момент
          - past simple
          - I moved to Leeds in May.
        - - событие без названного времени
          - present perfect
          - I've started a new job.
        - - только что
          - just + present perfect
          - I've just got back from Portugal.
        - - продолжается до сих пор
          - since / for + present perfect
          - I've lived here since March.
  - type: explanation
    id: retelling
    title: Разговорный пересказ и планы
    body: |-
      В разговоре друзья пересказывают, что кто сказал, и передают реакцию. Вместо **said** часто говорят **was like** и **goes**: **She was like, "No way!"** **He goes, "I'm not joking."** Обе формы передают реакцию и интонацию. **Was like** — прошедшее время, **goes** ставят в рассказе, который ведут как будто на глазах: *So I show him the photo, and he goes, "Is that real?"* В письме, на работе и в официальных ситуациях используют **said**, **replied**, **told me**.

      Планы рассказывают тремя способами. **Present continuous** — договорённость, билет уже куплен: **I'm flying out on the third.** **Going to** — намерение: **I'm going to visit Ben.** **Thinking of + -ing** — идея, решение не принято: **I'm thinking of coming over in the spring.**

      Две частые ошибки. Первая — was like в письме клиенту или преподавателю. Вместо неё **She said that she could not come.** Вторая — will для договорённости с билетом: I will fly out on the third. Нужно **I'm flying out on the third.**
    table:
      columns:
        - что сказать
        - форма
        - пример
      rows:
        - - реакция в пересказе
          - was like / goes
          - She was like, "No way!"
        - - пересказ в письме
          - said / replied
          - She said that she could not come.
        - - договорённость
          - present continuous
          - I'm flying out on the third.
        - - намерение
          - going to
          - I'm going to visit Ben.
        - - идея
          - thinking of + -ing
          - I'm thinking of coming over in the spring.
  - type: explanation
    id: touch-words
    title: Слова для связи с друзьями
    body: |-
      **Stay in touch** — поддерживать связь: переписываться и звонить. **Drift apart** — отдалиться: перестать общаться постепенно, без ссоры. **A catch-up** — встреча или разговор, чтобы узнать новости: *We had a long catch-up on Sunday.* **A voice note** — голосовое сообщение, которое записывают и отправляют в чат.

      **A reunion** — встреча людей, которые давно не виделись: *a school reunion*. **A throwback** — напоминание о прошлом, чаще старое фото: *a throwback photo*. **Nostalgic** — вспоминающий прошлое с тёплой грустью. **Patchy** — прерывистый; так говорят о связи: *patchy signal*.

      Фразы урока. **What have you been up to?** — вопрос при встрече после перерыва. **It's been ages!** — мы давно не виделись. **I've just got back from Portugal.** — новость о возвращении. **A lot has happened since we last spoke.** — начало рассказа о новостях. **You'll never guess what happened.** — начало истории. **Let's catch up properly soon.** — предложение встретиться или созвониться.
