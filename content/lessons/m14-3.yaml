blocks:
  - type: explanation
    id: formal
    title: Официальное письмо
    body: |-
      До сих пор вы писали друзьям. На экзамене во второй части письма нужен «менее дружеский» текст 80–100 слов: письмо в гостиницу, в языковую школу, в муниципалитет. Сегодня — первое такое письмо.

      **Обращение.** Мужчине — **Αγαπητέ κύριε** + фамилия, женщине — **Αγαπητή κυρία** + фамилия. Здесь звательный падеж: ο κύριος → **κύριε**, αγαπητός → **αγαπητέ** (у имён тоже: ο Μάριος → Μάριε, ο Νίκος → Νίκο). У женщины ничего не меняется. Фамилии на -ου и -ους (Γεωργίου, Νικολάου, Χαραλάμπους) и женские фамилии не меняются: Αγαπητέ κύριε Γεωργίου, Αγαπητή κυρία Χαραλάμπους. Если имени не знаете — **Αγαπητέ κύριε / Αγαπητή κυρία,**. После обращения — запятая, текст начинается с новой строки.

      **Первое предложение — зачем вы пишете:** **Σας γράφω για να κάνω μια κράτηση.** — «Пишу вам, чтобы забронировать номер». Или: Σας γράφω για την κράτησή μου.

      **Всё письмо — на «вы».** Σας, θα ήθελα, έχετε, μπορείτε. Никаких Γεια σου, Τι κάνεις;, Τα λέμε! Вместо θέλω — вежливое **θα ήθελα**.

      **Главное:** даты, какой номер, на сколько ночей; два-три вопроса — фразы урока 2 (Πόσο κάνει…; Το πρωινό περιλαμβάνεται…;). Если бронь уже есть: **Θα ήθελα να επιβεβαιώσω την κράτησή μου.** — «Я хотел(а) бы подтвердить своё бронирование» (κράτησή μου — второй тонос, модуль 03).

      **Концовка:** **Σας ευχαριστώ πολύ.** Затем **Με εκτίμηση,** — «С уважением» — и на следующей строке имя. На экзамене своё настоящее имя писать нельзя — подпишитесь придуманным.
    table:
      columns:
        - другу
        - в гостиницу
      rows:
        - - Γεια σου, Νίκο!
          - Αγαπητέ κύριε Γεωργίου,
        - - Τι κάνεις; Σου γράφω για…
          - Σας γράφω για να κάνω μια κράτηση.
        - - Θέλω…
          - Θα ήθελα…
        - - Μπορείς…; Έχεις…;
          - Μπορείτε…; Έχετε…;
        - - Ευχαριστώ!
          - Σας ευχαριστώ πολύ.
        - - Τα λέμε!
          - Με εκτίμηση,
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: formal-choice
    title: Письмо в гостиницу
    instruction: Выберите, что подходит для официального письма.
    format: choice
    items:
      - id: q1
        prompt: Начало письма администратору, господину Георгиу.
        options:
          - Αγαπητέ κύριε Γεωργίου,
          - Γεια σου, Γεωργίου!
          - Καλώς ήρθες!
        answer: Αγαπητέ κύριε Γεωργίου,
      - id: q2
        prompt: Письмо госпоже Хараламбус.
        options:
          - Αγαπητή κυρία Χαραλάμπους,
          - Αγαπητέ κυρία Χαραλάμπους,
          - Αγαπητή κύριε Χαραλάμπους,
        answer: Αγαπητή κυρία Χαραλάμπους,
        explanation: Женщине — Αγαπητή κυρία; αγαπητέ и κύριε — только мужчине.
      - id: q3
        prompt: Письмо господину Николау.
        options:
          - Αγαπητέ κύριε Νικολάου,
          - Αγαπητός κύριος Νικολάου,
          - Αγαπητέ κύριος Νικολάου,
        answer: Αγαπητέ κύριε Νικολάου,
        explanation: "При обращении — звательный падеж: αγαπητέ, κύριε. Фамилия на -ου не меняется."
      - id: q4
        prompt: Вы не знаете, кто прочитает письмо.
        options:
          - Αγαπητέ κύριε / Αγαπητή κυρία,
          - Γεια σας, φίλοι!
          - Αγαπητή ρεσεψιόν,
        answer: Αγαπητέ κύριε / Αγαπητή κυρία,
      - id: q5
        prompt: Первое предложение письма.
        options:
          - Σας γράφω για να κάνω μια κράτηση.
          - Σου γράφω για να κάνω μια κράτηση.
          - Τι κάνεις; Θέλω ένα δωμάτιο.
        answer: Σας γράφω για να κάνω μια κράτηση.
        explanation: В официальном письме — «вы», σας; σου — «тебе».
      - id: q6
        prompt: Вы хотите подтвердить бронь.
        options:
          - Θα ήθελα να επιβεβαιώσω την κράτησή μου.
          - Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο.
          - Μπορώ να αφήσω τις βαλίτσες μου εδώ;
        answer: Θα ήθελα να επιβεβαιώσω την κράτησή μου.
      - id: q7
        prompt: Вежливый вопрос в письме.
        options:
          - Το πρωινό περιλαμβάνεται στην τιμή;
          - Έχεις πρωινό;
          - Πεινάς;
        answer: Το πρωινό περιλαμβάνεται στην τιμή;
      - id: q8
        prompt: Конец официального письма.
        options:
          - Με εκτίμηση,
          - Τα λέμε!
          - Γεια σου!
        answer: Με εκτίμηση,
  - type: exercise
    id: letter-gap
    title: Письмо по частям
    instruction: Вставьте слова в письмо. Два слова лишние.
    format: gap
    bank:
      - Αγαπητή
      - γράφω
      - κλείσω
      - διαθέσιμο
      - περιλαμβάνεται
      - εκτίμηση
      - Αγαπητέ
      - θέλω
    items:
      - id: g1
        prompt: ___ κυρία Ιωάννου,
        answer: Αγαπητή
        explanation: κυρία — женщина, поэтому Αγαπητή.
      - id: g2
        prompt: Σας ___ για να κάνω μια κράτηση.
        answer: γράφω
      - id: g3
        prompt: Θα ήθελα να ___ ένα μονόκλινο δωμάτιο για δύο νύχτες.
        answer: κλείσω
        explanation: После θα ήθελα να — особая форма κλείσω, как во фразе урока 2.
      - id: g4
        prompt: Αν είναι ___, θα ήθελα ένα δωμάτιο με θέα στη θάλασσα.
        answer: διαθέσιμο
        explanation: Речь о номере (το δωμάτιο) — средний род, διαθέσιμο.
      - id: g5
        prompt: Το πρωινό ___ στην τιμή;
        answer: περιλαμβάνεται
      - id: g6
        prompt: Με ___,
        answer: εκτίμηση
  - type: explanation
    id: writing-how
    title: Как написать письмо-бронирование
    body: |-
      Письмо — 70–90 слов. План: обращение; зачем пишете (Σας γράφω για να…); что бронируете — какой номер, даты, сколько ночей; одно-два предложения о себе или о поездке; два-три вопроса; благодарность и концовка.

      Даты пишите так: **από τις 10 μέχρι τις 13 Αυγούστου** — «с 10 по 13 августа» (месяц в родительном падеже, модуль 04). Добавьте хотя бы одну форму аориста: **Διάβασα** για το ξενοδοχείο σας στο ίντερνετ. / **Πέρσι ταξίδεψα** στην Πάφο.

      Проверьте себя. Обращение и концовка — официальные, с запятой. Везде «вы»: σας, έχετε, μπορείτε. Вопросы заканчиваются знаком «;». Аорист — с ударением на третьем слоге от конца. Тонос — во всех словах из двух и больше слогов, второй тонос — в κράτησή μου, διαβατήριό μου.
    table:
      columns:
        - часть письма
        - как
      rows:
        - - обращение
          - Αγαπητέ κύριε … / Αγαπητή κυρία …,
        - - цель
          - Σας γράφω για να κάνω μια κράτηση.
        - - что нужно
          - Θα ήθελα να κλείσω ένα μονόκλινο / δίκλινο δωμάτιο για … νύχτες.
        - - даты
          - από τις … μέχρι τις … Ιουλίου
        - - пожелание
          - Αν είναι διαθέσιμο, θα ήθελα ένα δωμάτιο με θέα στη θάλασσα.
        - - вопросы
          - Πόσο κάνει το δωμάτιο τη νύχτα; Το πρωινό περιλαμβάνεται στην τιμή;
        - - конец
          - Σας ευχαριστώ πολύ. Με εκτίμηση, …
  - type: writing
    id: booking-letter
    register: formal
    prompt: "Вы хотите провести три ночи в августе в гостинице «Ορίζοντας» в Пафосе. Напишите письмо управляющему гостиницей, господину Георгиу (κύριος Γεωργίου), 70–90 слов: скажите, зачем пишете, какой номер и на какие даты вам нужен, с кем вы едете, и задайте два-три вопроса (цена, завтрак, бассейн или багаж). Подпишитесь придуманным именем."
    words:
      min: 70
      max: 90
    model: |-
      Αγαπητέ κύριε Γεωργίου,

      Σας γράφω για να κάνω μια κράτηση. Διάβασα για το ξενοδοχείο σας στο ίντερνετ. Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο για τρεις νύχτες, από τις 10 μέχρι τις 13 Αυγούστου. Ταξιδεύω με τον άντρα μου. Αν είναι διαθέσιμο, θα ήθελα ένα δωμάτιο με θέα στη θάλασσα.

      Πόσο κάνει το δωμάτιο τη νύχτα; Το πρωινό περιλαμβάνεται στην τιμή; Μπορούμε να αφήσουμε τις βαλίτσες μας στη ρεσεψιόν την τελευταία μέρα;

      Σας ευχαριστώ πολύ.

      Με εκτίμηση,
      Ιρίνα Σοκόλοβα
    criteria:
      - 70–90 слов; официальное обращение с запятой (Αγαπητέ κύριε Γεωργίου,) и концовка Με εκτίμηση, + придуманное имя
      - В первом предложении сказано, зачем вы пишете (Σας γράφω για να κάνω μια κράτηση.)
      - Названы тип номера (μονόκλινο/δίκλινο), число ночей и даты (από τις … μέχρι τις … + месяц в родительном падеже)
      - Сказано, с кем вы едете или что вам важно в номере (θέα, πισίνα)
      - Два-три вопроса, каждый со знаком «;»
      - "Всё письмо на «вы»: σας, θα ήθελα, έχετε, μπορείτε; нет Γεια σου, Τι κάνεις;, Τα λέμε"
      - Есть хотя бы одна форма аориста с правильным ударением (διάβασα, ταξίδεψα, έκλεισα); тонос во всех словах из двух и больше слогов
  - type: explanation
    id: speaking-how
    title: Монолог «Моя поездка»
    body: |-
      Во второй части устного экзамена вас могут попросить рассказать о поездке: **Μιλήστε μας για ένα ταξίδι σας.** — «Расскажите нам о какой-нибудь своей поездке». Теперь вы говорите в прошедшем времени.

      План из шести шагов. **Когда:** Πέρσι / Τον Αύγουστο / Πριν από δύο χρόνια… **Куда и с кем:** Πέρσι **πήγαμε** διακοπές στην Πάφο με τον άντρα μου. Πήγα — «я поехал(а)», πήγαμε — «мы поехали»: неправильный аорист от πηγαίνω (модуль 15), пока берите его из фразы. **Как добрались и где жили:** Ταξιδέψαμε με το αυτοκίνητο. Κλείσαμε ένα δωμάτιο σε ένα ξενοδοχείο κοντά στη θάλασσα. **Что делали:** κολυμπήσαμε, επισκεφτήκαμε το κάστρο, φωτογράφισα, χαλαρώσαμε. **Сколько потратили:** Ξοδέψαμε πολλά / λίγα λεφτά. **Как было:** Το ταξίδι ήταν πολύ ωραίο. Περάσαμε πολύ ωραία!

      Говорите о себе: «я» — -α (ταξίδεψα), «мы» — -αμε (ταξιδέψαμε). Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом.
  - type: speaking
    id: my-trip
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Μιλήστε μας για ένα ταξίδι σας. Πού πήγατε; Τι κάνατε εκεί;» («Расскажите нам о своей поездке. Куда вы ездили? Что вы там делали?»)
      Говорите около минуты по плану, запишите ответ.
    seconds: 90
    model: Πέρσι τον Αύγουστο πήγαμε διακοπές στην Πάφο, εγώ, ο άντρας μου και τα παιδιά μας. Ταξιδέψαμε με το αυτοκίνητο από τη Λευκωσία. Κλείσαμε ένα δωμάτιο σε ένα ξενοδοχείο κοντά στη θάλασσα, με πισίνα και θέα στη θάλασσα. Κολυμπήσαμε πολύ και χαλαρώσαμε στην παραλία. Επισκεφτήκαμε το κάστρο της Πάφου και ένα μικρό χωριό. Εγώ φωτογράφισα πολλά μνημεία. Ένα βράδυ δοκιμάσαμε το κλέφτικο σε μια ταβέρνα κοντά στο λιμάνι. Ξοδέψαμε πολλά λεφτά, αλλά περάσαμε πολύ ωραία!
    criteria:
      - Говорили около минуты, без долгих пауз
      - Сказали, когда была поездка (πέρσι, τον Αύγουστο, πριν από… χρόνια)
      - Сказали, куда и с кем ездили (πήγαμε… με…)
      - "Назвали три-четыре действия в аористе: κολυμπήσαμε, επισκεφτήκαμε, φωτογράφισα, χαλαρώσαμε…"
      - Сказали, как было (ήταν ωραίο, περάσαμε πολύ ωραία)
      - "Ударение в аористе — на третьем слоге от конца: ταξίδεψα, но ταξιδέψαμε; ευ в ταξιδεύω → εψ [эпс]"
  - type: exercise
    id: review-aorist
    title: Повторение — аорист
    instruction: Вставьте глагол в аористе. Три слова лишние.
    format: gap
    bank:
      - έγραψα
      - ταξίδεψαν
      - κλείσαμε
      - ακύρωσε
      - πλήρωσες
      - ξόδεψε
      - ψάξαμε
      - έγραψαμε
      - εκλείσαμε
      - ταξιδεύουν
    items:
      - id: g1
        prompt: Χθες ___ στο ξενοδοχείο και επιβεβαίωσα την κράτηση.
        answer: έγραψα
        explanation: επιβεβαίωσα — «я», значит, и έγραψα.
      - id: g2
        prompt: Πέρσι ο Νίκος και η Ελένη ___ στην Ελλάδα.
        answer: ταξίδεψαν
        explanation: Πέρσι — аорист; ταξιδεύουν — настоящее время.
      - id: g3
        prompt: Προχθές εμείς ___ ένα δίκλινο δωμάτιο στην Πάφο.
        answer: κλείσαμε
        explanation: В форме «мы» три слога — без έ-. «εκλείσαμε» — ошибка.
      - id: g4
        prompt: Η Μαρία ___ την κράτησή της την περασμένη εβδομάδα.
        answer: ακύρωσε
      - id: g5
        prompt: Εσύ πόσο ___ για το δωμάτιο;
        answer: πλήρωσες
      - id: g6
        prompt: Στις διακοπές ο Άρης ___ πολλά λεφτά.
        answer: ξόδεψε
      - id: g7
        prompt: Χθες το βράδυ ___ τα κλειδιά μας δύο ώρες!
        answer: ψάξαμε
        explanation: τα κλειδιά μας — «наши», значит, «мы»; без έ-.
  - type: exercise
    id: review-mixed
    title: Повторение — модули 09–13
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы поели в таверне и хотите заплатить.
        options:
          - Τον λογαριασμό, παρακαλώ.
          - Καλή όρεξη!
          - Τι μας προτείνετε;
        answer: Τον λογαριασμό, παρακαλώ.
      - id: q2
        prompt: Вы пришли на остановку, а автобус уже уехал.
        options:
          - Έχασα το λεωφορείο.
          - Χάθηκα!
          - Στο αεροδρόμιο, παρακαλώ.
        answer: Έχασα το λεωφορείο.
        explanation: Χάθηκα — «я заблудился», а не «опоздал».
      - id: q3
        prompt: Вы ищете автобусную остановку.
        options:
          - Πού είναι η στάση του λεωφορείου;
          - Πόσο κάνουν τα σταφύλια;
          - Πού είναι το δοκιμαστήριο;
        answer: Πού είναι η στάση του λεωφορείου;
      - id: q4
        prompt: В магазине вам понравилась рубашка, и вы хотите её примерить.
        options:
          - Μπορώ να το δοκιμάσω;
          - Μπορώ να το επιστρέψω;
          - Έχετε την απόδειξη;
        answer: Μπορώ να το δοκιμάσω;
      - id: q5
        prompt: — Πληρώνετε με κάρτα ή μετρητά; — …
        options:
          - Με κάρτα.
          - Μαζί.
          - Στο κέντρο.
        answer: Με κάρτα.
