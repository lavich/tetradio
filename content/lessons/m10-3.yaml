blocks:
  - type: explanation
    id: phrases
    title: У кассы
    body: |-
      **Θέλετε σακούλα;** — «Вам нужен пакет?». Ответ: **Ναι, μία, παρακαλώ.** или **Όχι, ευχαριστώ.** (σακούλα — женский род, поэтому μία).

      **Είναι πολύ ακριβό.** — «Это очень дорого». Средний род — как в «это дорого»: говорим о покупке вообще. О конкретной вещи прилагательное согласуется с ней: Το καρπούζι είναι ακριβό. Οι φράουλες είναι ακριβές. Τα σταφύλια είναι ακριβά. Наоборот — **φτηνό**, «дёшево» (модуль 07).

      **Δεν έχω ψιλά.** — «У меня нет мелочи»: так говорят, когда платят крупной купюрой. Продавец отвечает, например, Δεν πειράζει («Ничего страшного»), а потом даёт сдачу: **Ορίστε τα ρέστα σας.** — «Вот ваша сдача».
    table:
      columns:
        - продавец
        - покупатель
      rows:
        - - Κάτι άλλο;
          - Τίποτα άλλο, ευχαριστώ.
        - - Θέλετε σακούλα;
          - Ναι, μία, παρακαλώ. / Όχι, ευχαριστώ.
        - - Πληρώνετε με κάρτα ή μετρητά;
          - Μετρητά. Δεν έχω ψιλά, συγγνώμη.
        - - Ορίστε τα ρέστα σας.
          - Ευχαριστώ! Γεια σας!
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: phrases-choice
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Кассир спрашивает, нужен ли вам пакет. Как он это говорит?
        options:
          - Θέλετε σακούλα;
          - Κάτι άλλο;
          - Έχει έκπτωση;
        answer: Θέλετε σακούλα;
      - id: q2
        prompt: Покупки стоят 3 €, а у вас только купюра 50 €.
        options:
          - Δεν έχω ψιλά.
          - Κρατήστε τα ρέστα.
          - Είναι σε προσφορά.
        answer: Δεν έχω ψιλά.
        explanation: Κρατήστε τα ρέστα — «сдачи не надо»; с 50 € за покупку в 3 € так не говорят.
      - id: q3
        prompt: Продавец называет цену, и вам кажется, что это слишком много.
        options:
          - Είναι πολύ ακριβό.
          - Είναι πολύ νόστιμο.
          - Τίποτα άλλο, ευχαριστώ.
        answer: Είναι πολύ ακριβό.
      - id: q4
        prompt: Продавец отдаёт вам сдачу.
        options:
          - Ορίστε τα ρέστα σας.
          - Πληρώνετε με κάρτα ή μετρητά;
          - Θέλετε σακούλα;
        answer: Ορίστε τα ρέστα σας.
      - id: q5
        prompt: Οι φράουλες κάνουν δέκα ευρώ το κιλό! Είναι πολύ ___.
        options:
          - ακριβές
          - ακριβό
          - ακριβός
        answer: ακριβές
        explanation: "О клубнике — οι φράουλες, женский род мн. ч.: ακριβές. Είναι πολύ ακριβό — когда говорите «это» в целом."
  - type: explanation
    id: an-prin
    title: Αν и πριν
    body: |-
      **Αν** — «если»: **Αν θέλεις, πάμε μαζί.** — «Если хочешь, пойдём вместе». **Αν οι ντομάτες είναι φρέσκες, αγοράζω δύο κιλά.** — «Если помидоры свежие, я беру два кило». После αν пока ставьте настоящее время.

      Второе значение αν — «ли» в косвенном вопросе: **Δεν ξέρω αν έχει φράουλες σήμερα.** — «Не знаю, есть ли сегодня клубника». По-русски «ли» стоит после глагола, по-гречески αν — в начале этой части предложения.

      **Πριν από** + винительный падеж — «до, перед»: **πριν από τις εννιά** — до девяти часов, **πριν από τη δουλειά** — перед работой, **πριν από το φαγητό** — перед едой. В разговоре από иногда опускают: πριν τις εννιά. Противоположность — **μετά από**: μετά από τη δουλειά — после работы.
    table:
      columns:
        - греческий
        - перевод
      rows:
        - - Αν θέλεις, πάμε μαζί.
          - Если хочешь, пойдём вместе.
        - - Αν χρειάζεσαι κάτι, μου λες.
          - Если тебе что-то нужно, скажи мне.
        - - Δεν ξέρω αν είναι ανοιχτό.
          - Не знаю, открыто ли.
        - - Πάω πριν από τις εννιά.
          - Я иду туда до девяти (раньше девяти).
        - - Ψωνίζω μετά από τη δουλειά.
          - Я делаю покупки после работы.
  - type: exercise
    id: an-prin-gap
    title: Маленькие слова
    instruction: Вставьте слово. Каждое слово — один раз, два слова лишние.
    format: gap
    bank:
      - αν
      - πριν
      - για
      - με
      - μετά
      - ή
      - γιατί
    items:
      - id: g1
        prompt: ___ θέλεις, πάμε μαζί στη λαϊκή το Σάββατο.
        answer: αν
      - id: g2
        prompt: Η λαϊκή κλείνει στις δώδεκα. Πρέπει να πάμε ___ από τις δώδεκα.
        answer: πριν
        explanation: Рынок закрывается в двенадцать — идти надо до этого.
      - id: g3
        prompt: Πάω στο περίπτερο ___ νερό.
        answer: για
        explanation: "για + продукт без артикля — «за»: για νερό, για ψωμί."
      - id: g4
        prompt: Πληρώνω ___ κάρτα.
        answer: με
      - id: g5
        prompt: Το πρωί δεν έχω χρόνο, ψωνίζω πάντα ___ από τη δουλειά.
        answer: μετά
        explanation: Утром времени нет — значит, после работы.
  - type: exercise
    id: an-prin-write
    title: Скажите по-гречески
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Не знаю, есть ли сегодня клубника.
        answer:
          - Δεν ξέρω αν έχει φράουλες σήμερα.
          - Δεν ξέρω αν έχει σήμερα φράουλες.
          - Δεν ξέρω αν υπάρχουν φράουλες σήμερα.
          - Δεν ξέρω αν σήμερα έχει φράουλες.
          - Δεν ξέρω αν υπάρχουν σήμερα φράουλες.
        explanation: "«Есть» о товаре — έχει (как в Έχει έκπτωση;) или υπάρχουν; клубника — мн. ч. φράουλες."
      - id: q2
        prompt: Если хочешь, пойдём вместе.
        answer:
          - Αν θέλεις, πάμε μαζί.
          - Αν θέλεις πάμε μαζί.
      - id: q3
        prompt: Перед работой я иду в пекарню.
        answer:
          - Πριν από τη δουλειά πάω στον φούρνο.
          - Πριν από τη δουλειά πηγαίνω στον φούρνο.
          - Πάω στον φούρνο πριν από τη δουλειά.
          - Πηγαίνω στον φούρνο πριν από τη δουλειά.
          - Πριν τη δουλειά πάω στον φούρνο.
          - Πάω στον φούρνο πριν τη δουλειά.
          - Πριν τη δουλειά πηγαίνω στον φούρνο.
          - Πηγαίνω στον φούρνο πριν τη δουλειά.
      - id: q4
        prompt: Есть скидка?
        answer:
          - Έχει έκπτωση;
          - Υπάρχει έκπτωση;
  - type: explanation
    id: list-how
    title: Список покупок и сообщение соседке
    body: |-
      **Список покупок** (η λίστα με τα ψώνια) пишут коротко: количество + продукт, без предлога и без артикля. Числа можно писать цифрами: 2 κιλά πατάτες, 1 μπουκάλι νερό, μισό κιλό τυρί, 300 γραμμάρια χαλλούμι. Если количество не важно — только продукт: ψωμί, αυγά.

      В сообщении соседке (40–60 слов) план такой: поздоровайтесь; ответьте на её вопросы — когда и во сколько вы идёте (**πριν από τις…**), что покупаете (продукты с количеством), что сколько стоит (**… ευρώ το κιλό**); предложите помощь или пойти вместе (**Αν θέλεις…**, **Αν χρειάζεσαι κάτι, μου λες**); попрощайтесь.

      Проверьте себя после письма: после меры — продукт без από (ένα κιλό ντομάτες); после δύο, τρία — мн. ч. меры (δύο κιλά, τρία μπουκάλια); ευρώ — средний род (τρία, τέσσερα ευρώ); прилагательные в роде и числе существительного (φρέσκα φρούτα, ντόπιες ντομάτες).
  - type: exercise
    id: shopping-list
    title: Список покупок
    instruction: Напишите пункт списка по-гречески. Число можно написать цифрой или словом.
    format: text
    items:
      - id: l1
        prompt: 1 кг помидоров
        answer:
          - ένα κιλό ντομάτες
          - 1 κιλό ντομάτες
      - id: l2
        prompt: 2 бутылки воды
        answer:
          - δύο μπουκάλια νερό
          - 2 μπουκάλια νερό
        explanation: После двух — мн. ч. μπουκάλια; вода — без предлога и артикля.
      - id: l3
        prompt: полкило клубники
        answer:
          - μισό κιλό φράουλες
      - id: l4
        prompt: 1 пачка молока
        answer:
          - ένα κουτί γάλα
          - 1 κουτί γάλα
      - id: l5
        prompt: 300 г сыра
        answer:
          - τριακόσια γραμμάρια τυρί
          - 300 γραμμάρια τυρί
          - 300 γρ. τυρί
          - 300 γρ τυρί
      - id: l6
        prompt: 3 кг картошки
        answer:
          - τρία κιλά πατάτες
          - 3 κιλά πατάτες
        explanation: τρία — средний род, как το κιλό; картофель — мн. ч. πατάτες.
  - type: writing
    id: neighbour
    register: friendly
    prompt: "Ваша соседка Ρένα пишет вам: «Γεια σου! Πας στη λαϊκή το Σάββατο; Τι ώρα πας; Τι αγοράζεις εκεί;» Ответьте ей сообщением 40–60 слов: скажите, когда и во сколько вы идёте и почему в это время; какие продукты покупаете (минимум три, с количеством); сколько что-нибудь стоит; предложите пойти вместе или купить ей что-нибудь."
    words:
      min: 40
      max: 60
    model: Γεια σου, Ρένα! Ναι, πάω στη λαϊκή κάθε Σάββατο. Είναι κοντά στο σπίτι μας. Πάω νωρίς, πριν από τις εννιά, γιατί μετά δεν έχει φρέσκα φρούτα. Αγοράζω συνήθως δύο κιλά ντομάτες, ένα κιλό πατάτες και μισό κιλό φράουλες. Οι ντομάτες κάνουν μόνο ένα ευρώ το κιλό! Αν θέλεις, πάμε μαζί. Αν χρειάζεσαι κάτι, μου λες. Τα λέμε!
    criteria:
      - 40–60 слов; дружеское приветствие и прощание на «ты» (Γεια σου, …! Τα λέμε!)
      - "Ответили на все три вопроса: когда, во сколько, что покупаете"
      - Не меньше трёх продуктов с количеством — без предлога и артикля (δύο κιλά ντομάτες, ένα μπουκάλι νερό)
      - Названа хотя бы одна цена (… ευρώ το κιλό); число перед ευρώ в среднем роде (τρία, τέσσερα)
      - Есть предложение с αν (Αν θέλεις…) и время с πριν από (πριν από τις εννιά)
      - Прилагательные согласованы с существительными (φρέσκα φρούτα, ντόπιες ντομάτες); тонос во всех словах из двух и больше слогов
  - type: speaking
    id: shopping-interview
    part: interview
    prompt: |-
      Первая часть устного экзамена — вопросы о вас. Экзаменатор спрашивает о покупках: «Πού ψωνίζετε συνήθως; Πότε ψωνίζετε; Τι αγοράζετε κάθε εβδομάδα; Πληρώνετε με κάρτα ή μετρητά; Προτιμάτε το σούπερ μάρκετ ή τη λαϊκή; Γιατί;»
      Прочитайте вопросы вслух и ответьте на каждый одной-двумя фразами, без пауз. Запишите ответ.
    seconds: 60
    model: Συνήθως ψωνίζω στο σούπερ μάρκετ κοντά στο σπίτι μου, αλλά φρούτα αγοράζω στη λαϊκή. Ψωνίζω το Σάββατο το πρωί. Κάθε εβδομάδα αγοράζω ψωμί, γάλα, τυρί, ντομάτες και πατάτες. Στο σούπερ μάρκετ πληρώνω με κάρτα, στη λαϊκή με μετρητά. Προτιμώ τη λαϊκή, γιατί τα φρούτα είναι φρέσκα και φτηνά.
    criteria:
      - Ответили на все пять вопросов, на каждый — одной-двумя фразами
      - "Говорили о себе: ψωνίζω, αγοράζω, πληρώνω, προτιμώ (а не ψωνίζετε, προτιμάτε)"
      - "Место — σε + артикль: στο σούπερ μάρκετ, στη λαϊκή; продукты — без артикля (ψωμί, ντομάτες)"
      - Объяснили выбор (γιατί…)
      - Ударение на своём месте (ψωνίζω, λαϊκή, μετρητά)
  - type: explanation
    id: roleplay-how
    title: Ролевая игра «покупатель — продавец»
    body: |-
      В третьей части устного экзамена двое экзаменуемых разыгрывают сценку по карточкам; на чтение карточки дают около двух минут. Вы играете покупателя, а экзаменатор или второй экзаменуемый — продавца. Говорите на «вы»: продавец и покупатель незнакомы.

      Продавец ведёт разговор вопросами — Τι θέλετε; Κάτι άλλο; Θέλετε σακούλα; Πληρώνετε με κάρτα ή μετρητά; — а вы отвечаете коротко и вежливо. Чтобы сказать всё, что написано в карточке, держите в голове порядок: поздороваться → попросить товар с количеством → спросить цену → поторговаться → заплатить → поблагодарить и попрощаться.

      Если не расслышали цену — **Πόσο;** или **Άλλη μια φορά, παρακαλώ.** (модуль 02). Попросите кого-нибудь прочитать реплики продавца из образца или прочитайте их сами, а свои реплики скажите по памяти и запишите.
  - type: speaking
    id: market-roleplay
    part: roleplay
    prompt: |-
      Карточка покупателя. Вы на рынке (στη λαϊκή). Поздоровайтесь с продавцом. Купите 1 кг помидоров и полкило клубники. Спросите, сколько стоит виноград, скажите, что это дорого, и спросите о скидке. Ответьте, нужен ли вам пакет. Заплатите наличными: у вас нет мелочи, только 20 €. Поблагодарите и попрощайтесь.
      Говорите на «вы». Запишите свою часть разговора.
    seconds: 120
    model: |-
      Πωλητής: Καλημέρα σας! Τι θέλετε;
      Εσείς: Καλημέρα σας! Ένα κιλό ντομάτες, παρακαλώ.
      Πωλητής: Ορίστε. Κάτι άλλο;
      Εσείς: Μισό κιλό φράουλες. Και πόσο κάνουν τα σταφύλια;
      Πωλητής: Τρία ευρώ το κιλό.
      Εσείς: Είναι πολύ ακριβά. Έχει έκπτωση;
      Πωλητής: Για σας, τα δύο κιλά πέντε ευρώ.
      Εσείς: Εντάξει, δύο κιλά, παρακαλώ. Τίποτα άλλο, ευχαριστώ. Πόσο κάνουν όλα μαζί;
      Πωλητής: Εννιά ευρώ. Θέλετε σακούλα;
      Εσείς: Ναι, μία, παρακαλώ. Δεν έχω ψιλά, συγγνώμη. Έχω μόνο είκοσι ευρώ.
      Πωλητής: Δεν πειράζει. Ορίστε τα ρέστα σας, έντεκα ευρώ.
      Εσείς: Ευχαριστώ πολύ! Γεια σας!
    criteria:
      - Поздоровались и попрощались вежливо (Καλημέρα σας! … Γεια σας!), всё время на «вы»
      - Попросили два товара с количеством без предлога (ένα κιλό ντομάτες, μισό κιλό φράουλες)
      - Спросили цену во множественном числе — Πόσο κάνουν τα σταφύλια;
      - Сказали, что дорого, и спросили о скидке (Είναι πολύ ακριβό/ακριβά. Έχει έκπτωση;)
      - Ответили на вопросы продавца (Κάτι άλλο; Θέλετε σακούλα;) и сказали Δεν έχω ψιλά
      - Ударение на своём месте (ντομάτες, φράουλες, σακούλα, έκπτωση); ντ в ντομάτες звучит [д]
  - type: exercise
    id: review-mixed
    title: Повторение — модули 06–10
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q2
        prompt: Μου ___ οι φράουλες.
        options:
          - αρέσει
          - αρέσουν
        answer: αρέσουν
        explanation: Οι φράουλες — мн. ч. и подлежащее, поэтому αρέσουν (модуль 08).
      - id: q3
        prompt: Πάω ___ φούρνο για ψωμί.
        options:
          - στο
          - στον
          - στη
        answer: στον
      - id: q4
        prompt: Αγοράζω ___ στο σούπερ μάρκετ.
        options:
          - χυμό
          - χυμός
        answer: χυμό
        explanation: После αγοράζω — винительный падеж, без ς.
      - id: q7
        prompt: Οι πωλητές ___ φρούτα στη λαϊκή.
        options:
          - πουλάει
          - πουλάνε
          - πουλάμε
        answer: πουλάνε
        explanation: "πουλάω спрягается как μιλάω: αυτοί πουλάνε (или πουλούν)."
