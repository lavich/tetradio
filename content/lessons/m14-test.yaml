title: Контрольная модуля 14
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, аорист, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. В заданиях на аорист пишите только глагол и не забывайте тонос.
  - type: reading
    id: blog
    title: Τρεις μέρες στη Λεμεσό
    text: |-
      Γεια σας! Είμαι η Αλίνα. Την περασμένη εβδομάδα ταξίδεψα στη Λεμεσό με τη φίλη μου την Κατερίνα. Κλείσαμε ένα δίκλινο δωμάτιο σε ένα μικρό ξενοδοχείο στο κέντρο. Το δωμάτιο ήταν μικρό, αλλά καθαρό, και η παραλία ήταν πολύ κοντά.

      Την Πέμπτη επισκεφτήκαμε το Κάστρο της Λεμεσού και το παλιό λιμάνι. Η Κατερίνα φωτογράφισε όλα τα αξιοθέατα! Την Παρασκευή κολυμπήσαμε στη θάλασσα και χαλαρώσαμε στην παραλία. Εγώ αγόρασα ένα αντηλιακό σε ένα περίπτερο κοντά στην παραλία — πολύ ακριβό!

      Το Σάββατο το πρωί ετοιμάσαμε τις βαλίτσες μας και γυρίσαμε στη Λευκωσία με το λεωφορείο. Ξοδέψαμε πολλά λεφτά, αλλά περάσαμε πολύ ωραία!
    glosses:
      - text: ήταν
        russian: был, была
      - text: γυρίσαμε
        russian: вернулись (γυρίζω)
  - type: exercise
    id: blog-tf
    about: blog
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Αλίνα ταξίδεψε στη Λεμεσό με τον άντρα της.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Με τη φίλη μου την Κατερίνα — с подругой.
      - id: q2
        prompt: Το ξενοδοχείο ήταν κοντά στην παραλία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Το δωμάτιο ήταν μεγάλο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το δωμάτιο ήταν μικρό, αλλά καθαρό.
      - id: q4
        prompt: Την Πέμπτη επισκέφτηκαν το κάστρο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Η Αλίνα φωτογράφισε όλα τα αξιοθέατα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Фотографировала Катерина.
      - id: q6
        prompt: Η Αλίνα αγόρασε ένα αντηλιακό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Γύρισαν στη Λευκωσία με το αυτοκίνητο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Με το λεωφορείο — на автобусе.
  - type: listening
    id: after-trip
    title: Πώς ήταν το ταξίδι σου;
    plays: 2
    transcript:
      - speaker: Δανάη
        text: Γεια σου, Μάριε! Πώς ήταν το ταξίδι σου;
      - speaker: Μάριος
        text: Γεια σου, Δανάη! Περάσαμε πολύ ωραία. Ταξιδέψαμε στην Κρήτη για πέντε μέρες.
      - speaker: Δανάη
        text: Στην Κρήτη; Και πού κλείσατε ξενοδοχείο;
      - speaker: Μάριος
        text: Σε ένα μικρό ξενοδοχείο στα Χανιά, δίπλα στη θάλασσα.
      - speaker: Δανάη
        text: Κολυμπήσατε;
      - speaker: Μάριος
        text: Εγώ κολύμπησα πολύ, αλλά η Σοφία όχι. Εκείνη χαλάρωσε στην πισίνα του ξενοδοχείου.
      - speaker: Δανάη
        text: Επισκεφτήκατε αξιοθέατα;
      - speaker: Μάριος
        text: Ναι, ένα παλιό κάστρο και ένα ωραίο χωριό κοντά στα Χανιά. Η Σοφία φωτογράφισε όλο το χωριό!
      - speaker: Δανάη
        text: Και ξοδέψατε πολλά λεφτά;
      - speaker: Μάριος
        text: Όχι πολλά. Το ξενοδοχείο ήταν φτηνό, πενήντα ευρώ τη νύχτα.
      - speaker: Δανάη
        text: Ωραία! Εγώ πέρσι ξόδεψα πολλά λεφτά στην Πάφο.
      - speaker: Μάριος
        text: Την άλλη φορά πάμε μαζί!
  - type: exercise
    id: after-trip-choice
    about: after-trip
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού ταξίδεψε ο Μάριος;
        options:
          - Στην Κρήτη.
          - Στην Πάφο.
          - Στη Λεμεσό.
        answer: Στην Κρήτη.
        explanation: В Пафос в прошлом году ездила Данаи.
      - id: q2
        prompt: Πόσες μέρες ήταν το ταξίδι;
        options:
          - Τρεις μέρες.
          - Πέντε μέρες.
          - Δύο εβδομάδες.
        answer: Πέντε μέρες.
      - id: q3
        prompt: Τι έκανε η Σοφία;
        options:
          - Χαλάρωσε στην πισίνα.
          - Κολύμπησε πολύ στη θάλασσα.
          - Ετοίμασε τις βαλίτσες.
        answer: Χαλάρωσε στην πισίνα.
        explanation: Плавал много Мариос, а София — нет.
      - id: q4
        prompt: Τι φωτογράφισε η Σοφία;
        options:
          - Το χωριό.
          - Το κάστρο.
          - Το ξενοδοχείο.
        answer: Το χωριό.
      - id: q5
        prompt: Сколько стоила гостиница за ночь?
        options:
          - 15 €
          - 50 €
          - 500 €
        answer: 50 €
        explanation: Πενήντα ευρώ τη νύχτα.
  - type: exercise
    id: grammar
    graded: true
    title: Аорист и время
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Χθες εγώ ___ στη θάλασσα.
        options:
          - κολύμπησα
          - κολυμπάω
          - κολυμπήσαμε
        answer: κολύμπησα
      - id: q2
        prompt: Πέρσι εμείς ___ στην Ελλάδα.
        options:
          - ταξιδέψαμε
          - ταξίδεψαμε
          - εταξιδέψαμε
        answer: ταξιδέψαμε
        explanation: Ударение на третьем слоге от конца; длинным глаголам έ- не нужно.
      - id: q3
        prompt: Η Άννα ___ στον κύριο Γεωργίου.
        options:
          - έγραψε
          - γράψε
          - έγραψα
        answer: έγραψε
        explanation: Форма из двух слогов получает έ-; «она» — окончание -ε.
      - id: q4
        prompt: Εσύ ___ τα κλειδιά σου χθες;
        options:
          - έψαξες
          - ψάξες
          - ψάχνεις
        answer: έψαξες
      - id: q5
        prompt: Ο Νίκος ταξίδεψε στη Ρωσία ___ δύο εβδομάδες.
        options:
          - πριν από
          - την περασμένη
          - τον περασμένο
        answer: πριν από
        explanation: πριν από δύο εβδομάδες — «две недели назад».
      - id: q6
        prompt: Ταξιδέψαμε στην Πάφο ___ μήνα.
        options:
          - τον περασμένο
          - την περασμένη
          - το περασμένο
        answer: τον περασμένο
        explanation: ο μήνας — мужской род.
  - type: exercise
    id: aorist-write
    graded: true
    title: Напишите аорист
    instruction: Напишите только глагол в аористе.
    format: text
    items:
      - id: q1
        prompt: Πέρσι ___ στην Κρήτη. (εγώ — ταξιδεύω)
        answer:
          - ταξίδεψα
      - id: q2
        prompt: Χθες ___ το κάστρο. (εμείς — φωτογραφίζω)
        answer:
          - φωτογραφίσαμε
      - id: q3
        prompt: Γιατί ___ την κράτηση; (εσείς — ακυρώνω)
        answer:
          - ακυρώσατε
      - id: q4
        prompt: Προχθές ___ ένα μονόκλινο δωμάτιο. (εγώ — κλείνω)
        answer:
          - έκλεισα
        explanation: «κλείσα» — два слога, поэтому έ-.
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - το διαβατήριο
      - η βαλίτσα
      - η παραλία
      - το κάστρο
      - το χωριό
      - η ρεσεψιόν
      - η πισίνα
      - το αντηλιακό
      - το μνημείο
    items:
      - id: m1
        prompt: паспорт
        answer: το διαβατήριο
      - id: m2
        prompt: чемодан
        answer: η βαλίτσα
      - id: m3
        prompt: пляж
        answer: η παραλία
      - id: m4
        prompt: крепость
        answer: το κάστρο
      - id: m5
        prompt: деревня
        answer: το χωριό
      - id: m6
        prompt: стойка регистрации
        answer: η ρεσεψιόν
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы звоните в гостиницу и хотите номер на двоих.
        options:
          - Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο.
          - Θα ήθελα να κλείσω ένα μονόκλινο δωμάτιο.
          - Πώς ήταν το ταξίδι σου;
        answer: Θα ήθελα να κλείσω ένα δίκλινο δωμάτιο.
      - id: q2
        prompt: Вы пришли на ресепшн, бронь у вас уже есть.
        options:
          - Έκανα κράτηση στο όνομα Σοκόλοβα.
          - Έχετε ελεύθερο δωμάτιο για δύο νύχτες;
          - Με εκτίμηση,
        answer: Έκανα κράτηση στο όνομα Σοκόλοβα.
      - id: q3
        prompt: Друг вернулся из отпуска. Вы спрашиваете о поездке.
        options:
          - Πώς ήταν το ταξίδι σου;
          - Πόσο κάνει το δωμάτιο τη νύχτα;
          - Σας γράφω για να κάνω μια κράτηση.
        answer: Πώς ήταν το ταξίδι σου;
      - id: q4
        prompt: Так заканчивают официальное письмо.
        options:
          - Με εκτίμηση,
          - Τα λέμε!
          - Αγαπητέ κύριε Γεωργίου,
        answer: Με εκτίμηση,
