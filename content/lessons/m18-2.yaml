  - type: reading
    id: leaflet
    title: Οδηγίες χρήσης
    text: |-
      ΒΑΚΤΙΛΙΝ 500 mg — 21 χάπια
      Αντιβίωση. Χρειάζεται συνταγή γιατρού.

      Δόση για ενήλικες: ένα χάπι τρεις φορές την ημέρα, κάθε οκτώ ώρες, για επτά ημέρες. Για τα παιδιά τη δόση τη λέει ο γιατρός.

      Πώς το παίρνετε: Παίρνετε το χάπι μετά το φαγητό, με ένα ποτήρι νερό. Καταπίνετε το χάπι ολόκληρο. Πρέπει να παίρνετε το φάρμακο όλες τις ημέρες της θεραπείας, ακόμα κι αν νιώθετε καλύτερα. Μη σταματήσετε τη θεραπεία χωρίς τον γιατρό σας.

      Αν ξεχάσετε μια δόση, πάρτε την αμέσως. Αν είναι σχεδόν ώρα για την επόμενη δόση, περιμένετε. Μην πάρετε ποτέ δύο δόσεις μαζί.

      Προσοχή:
      — Μην παίρνετε το φάρμακο, αν είστε αλλεργικοί στην πενικιλίνη.
      — Μην πίνετε αλκοόλ όσο παίρνετε αντιβίωση.
      — Αν είστε έγκυος, ρωτήστε πρώτα τον γιατρό σας.

      Παρενέργειες: Μερικές φορές πονάει το στομάχι ή έχετε διάρροια. Αν έχετε εξάνθημα ή δύσκολη αναπνοή, σταματήστε το φάρμακο και πηγαίνετε αμέσως στα επείγοντα.

      Φυλάσσετε το φάρμακο μακριά από τα παιδιά.
    glosses:
