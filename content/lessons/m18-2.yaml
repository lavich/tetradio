blocks:
  - type: explanation
    id: leaflet-words
    title: Как принимать лекарство
    body: |-
      В каждой упаковке лежат **οδηγίες χρήσης** — инструкция по применению (**η οδηγία** — указание, во мн. ч. — инструкция). Главное в ней — **η δόση**: сколько и как часто принимать. Спросить об этом в аптеке: **Πόσες φορές την ημέρα;** — «Сколько раз в день?». **Η ημέρα** — то же, что η μέρα, только официальнее; в инструкциях пишут ημέρα.

      Как часто: **μία φορά / δύο φορές την ημέρα** — один раз / два раза в день; **κάθε οκτώ ώρες** — каждые восемь часов; **για επτά ημέρες** — в течение семи дней.

      Когда: **πριν από το φαγητό** — до еды, **μετά το φαγητό** — после еды, **με το φαγητό** — во время еды. **Νηστικός** — голодный, натощак (утром ничего не ели): Παίρνετε το χάπι νηστικοί.

      Как: таблетку **καταπίνω** — глотаю (аор. κατάπια; κατάπιε — «проглоти»); **οι σταγόνες** — капли (η σταγόνα — капля): σταγόνες για τα μάτια; **η κρέμα** — крем, мазь; **η ένεση** — укол (κάνω ένεση).

      **Η αντιβίωση** — курс антибиотиков: **παίρνω αντιβίωση** — «принимаю антибиотики». Это **θεραπεία** — лечение, и его нельзя бросать раньше срока, даже если стало лучше. Антибиотики продают только по рецепту.

      Предупреждения: **οι παρενέργειες** — побочные действия (η παρενέργεια); **η αλλεργία** — аллергия. «У меня аллергия на…» — **Είμαι αλλεργικός** (женщина — **αλλεργική**) **σε** + вин. п.: Είμαι αλλεργικός στην πενικιλίνη.

      В инструкциях указания даются на «вы»: **Πάρτε**, **Μην πάρετε**, **Μην πίνετε** — или просто настоящим временем: **Παίρνετε** το χάπι μετά το φαγητό — «Принимайте таблетку после еды».
    table:
      columns:
        - в инструкции
        - по-русски
      rows:
        - - τρεις φορές την ημέρα
          - три раза в день
        - - κάθε οκτώ ώρες
          - каждые восемь часов
        - - για πέντε ημέρες
          - в течение пяти дней
        - - πριν από το φαγητό
          - до еды
        - - μετά το φαγητό
          - после еды
        - - νηστικός
          - натощак
        - - Μην πάρετε δύο δόσεις μαζί.
          - Не принимайте две дозы вместе.
