  - type: exercise
    id: leaflet-tf
    about: leaflet
    title: Верно или неверно
    instruction: Прочитайте инструкцию. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Το ΒΑΚΤΙΛΙΝ το αγοράζετε στο φαρμακείο χωρίς συνταγή.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Χρειάζεται συνταγή γιατρού — нужен рецепт врача, как для всех антибиотиков.
      - id: q2
        prompt: Οι ενήλικες παίρνουν τρία χάπια την ημέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Ένα χάπι τρεις φορές την ημέρα.
      - id: q3
        prompt: Παίρνετε το χάπι πριν από το φαγητό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μετά το φαγητό — после еды.
      - id: q4
        prompt: Όταν νιώθετε καλύτερα, μπορείτε να σταματήσετε τη θεραπεία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Надо принимать все дни лечения, ακόμα κι αν νιώθετε καλύτερα, и не прекращать без врача.
      - id: q5
        prompt: Παίρνετε το φάρμακο επτά ημέρες.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Για επτά ημέρες; в упаковке 21 таблетка — 3 × 7.
      - id: q6
        prompt: Αν είστε αλλεργικός στην πενικιλίνη, δεν πρέπει να πάρετε το ΒΑΚΤΙΛΙΝ.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Αν έχετε δύσκολη αναπνοή, πρέπει να πάτε αμέσως στα επείγοντα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: exercise
    id: leaflet-choice
    about: leaflet
    title: Выберите ответ
    instruction: Прочитайте инструкцию ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Первую таблетку вы приняли в 7:00. Когда принимать следующие две в этот день?
        options:
          - в 15:00 и в 23:00
          - в 12:00 и в 19:00
          - в 10:00 и в 13:00
          - только в 19:00
        answer: в 15:00 и в 23:00
        explanation: Κάθε οκτώ ώρες — 7 + 8 = 15, 15 + 8 = 23.
      - id: q2
        prompt: Вы забыли дневную таблетку и вспомнили через час. Что делать?
        options:
          - принять её сразу
          - принять вечером две таблетки
          - больше не принимать лекарство
          - позвонить в неотложку
        answer: принять её сразу
        explanation: Αν ξεχάσετε μια δόση, πάρτε την αμέσως. Две дозы вместе принимать нельзя.
      - id: q3
        prompt: Как принимать таблетку?
        options:
          - проглотить целиком, запив стаканом воды
          - разжевать
          - растворить в стакане воды
          - натощак, без воды
        answer: проглотить целиком, запив стаканом воды
        explanation: Καταπίνετε το χάπι ολόκληρο, με ένα ποτήρι νερό.
      - id: q4
        prompt: Что делать, если появилась сыпь?
        options:
          - прекратить приём и сразу ехать в неотложку
          - принять две дозы
          - продолжать лечение
          - пить больше воды
        answer: прекратить приём и сразу ехать в неотложку
        explanation: Σταματήστε το φάρμακο και πηγαίνετε αμέσως στα επείγοντα.
  - type: explanation
    id: clinic-words
    title: Клиника, анализы, неотложка
    body: |-
      **Η κλινική** — клиника; на Кипре так чаще всего называют частную больницу или медицинский центр. Государственная больница — **το νοσοκομείο** (модуль 12). **Τα επείγοντα** — отделение неотложной помощи; слово бывает только во мн. ч.: **πηγαίνω στα επείγοντα**. В кипрских больницах на табличке пишут **ΤΑΕΠ**. Скорая помощь — телефон **112**.

      **Ο οδοντίατρος** (и **η οδοντίατρος**) — стоматолог: **Πάω στον οδοντίατρο.**

      **Το σύμπτωμα** — симптом; во мн. ч. ударение сдвигается, как у το όνομα — τα ονόματα: **τα συμπτώματα**. Врач спрашивает: **Από πότε έχετε αυτά τα συμπτώματα;** — «С какого времени у вас эти симптомы?».

      **Η πίεση** — давление: ο γιατρός **μετράει την πίεση**. Давление по-гречески называют двумя числами без нулей: 120 на 80 — **δώδεκα με οκτώ**. **Η ανάλυση** — анализ: **κάνω αναλύσεις αίματος** — «сдаю анализ крови» (το αίμα — кровь). На анализ крови часто идут **νηστικοί** — натощак.

      Записаться по телефону: **Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό.** Спросить время: **Τι ώρα είναι ελεύθερος ο γιατρός;** (о женщине-враче — ελεύθερη η γιατρός).
    table:
      columns:
        - пациент
        - в клинике
      rows:
        - - Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό.
          - Τι έχετε;
        - - Έχω πυρετό από χθες.
          - Από πότε έχετε αυτά τα συμπτώματα;
        - - Τι ώρα είναι ελεύθερος ο γιατρός;
          - Στις δέκα ή στις πέντε.
        - - Είμαι αλλεργικός στην πενικιλίνη.
          - Ωραία, το γράφω.
  - type: exercise
    id: words-gap
    title: Клиника и анализы
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - νηστικός
      - οδοντίατρο
      - επείγοντα
      - πίεση
      - καταπιώ
      - συμπτώματα
      - θεραπεία
      - κλινική
    items:
      - id: g1
        prompt: Αύριο ο Γιώργος κάνει αναλύσεις αίματος. Πρέπει να πάει ___ — χωρίς πρωινό και χωρίς καφέ.
        answer: νηστικός
      - id: g2
        prompt: Με πονάει ένα δόντι, πρέπει να πάω στον ___.
        answer: οδοντίατρο
        explanation: "После στον — винительный падеж: ο οδοντίατρος → στον οδοντίατρο."
      - id: g3
        prompt: Τη νύχτα ο μικρός Νίκος είχε πολύ ψηλό πυρετό και πήγαμε στα ___ του νοσοκομείου.
        answer: επείγοντα
      - id: g4
        prompt: Ο γιατρός μετράει την ___ μου — δώδεκα με οκτώ, όλα καλά.
        answer: πίεση
      - id: g5
        prompt: Αυτό το χάπι είναι πολύ μεγάλο, δεν μπορώ να το ___.
        answer: καταπιώ
        explanation: κατάπια → να καταπιώ.
      - id: g6
        prompt: — Από πότε έχετε αυτά τα ___; — Από τη Δευτέρα.
        answer: συμπτώματα
  - type: explanation
    id: listen-how
    title: Как слушать звонок в клинику
    body: |-
      Сейчас вы услышите, как мужчина звонит в клинику и записывается к врачу. Это официальный разговор на «вы», как в четвёртом задании экзамена: нужно сделать **заметки** — записать день, время, число, одно-два слова.

      Прочитайте вопросы до прослушивания. В первый раз слушайте общий смысл, во второй — записывайте. Будьте внимательны: секретарь предлагает два времени, а пациент выбирает одно.

      Вы услышите: **Τι έχετε;** — «Что с вами?»; **τριάντα οκτώ και μισό** — 38,5 (температуру говорят так или τριάντα οκτώ και πέντε); **αναλύσεις αίματος** — анализ крови; **φέρτε τις μαζί σας** — «принесите их с собой»; **αν ο πυρετός ανέβει** — «если температура поднимется» (ανεβαίνω, модуль 12).
  - type: listening
    id: call
    title: Στο τηλέφωνο με την κλινική
    plays: 2
    transcript:
      - speaker: Χρυσταλλένη
        text: Κλινική «Λεμονιά», καλημέρα σας.
      - speaker: Σωτήρης
        text: Καλημέρα σας. Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό, τον κύριο Χαραλάμπους.
      - speaker: Χρυσταλλένη
        text: Ναι, παρακαλώ. Τι έχετε;
      - speaker: Σωτήρης
        text: Έχω πυρετό και βήχα.
      - speaker: Χρυσταλλένη
        text: Από πότε έχετε αυτά τα συμπτώματα;
      - speaker: Σωτήρης
        text: Έχω πυρετό από χθες το βράδυ. Σήμερα το πρωί είχα τριάντα οκτώ και μισό.
      - speaker: Χρυσταλλένη
        text: Καταλαβαίνω. Σήμερα ο γιατρός δεν είναι ελεύθερος. Μπορείτε να έρθετε αύριο, την Τετάρτη;
      - speaker: Σωτήρης
        text: Ναι. Τι ώρα είναι ελεύθερος ο γιατρός;
      - speaker: Χρυσταλλένη
        text: Στις δέκα το πρωί ή στις πέντε και μισή το απόγευμα.
      - speaker: Σωτήρης
        text: Το πρωί δουλεύω. Προτιμώ στις πέντε και μισή.
      - speaker: Χρυσταλλένη
        text: Εντάξει. Το όνομά σας, παρακαλώ;
      - speaker: Σωτήρης
        text: Σωτήρης Νικολάου.
      - speaker: Χρυσταλλένη
        text: Έχετε κάποια αλλεργία, κύριε Νικολάου;
      - speaker: Σωτήρης
        text: Ναι, είμαι αλλεργικός στην πενικιλίνη.
      - speaker: Χρυσταλλένη
        text: Ωραία, το γράφω. Αν έχετε αναλύσεις αίματος, φέρτε τις μαζί σας.
      - speaker: Σωτήρης
        text: Έχω, από τον Μάρτιο. Πόσο κοστίζει το ραντεβού;
      - speaker: Χρυσταλλένη
        text: Σαράντα πέντε ευρώ.
      - speaker: Σωτήρης
        text: Και τι να κάνω μέχρι αύριο;
      - speaker: Χρυσταλλένη
        text: Πίνετε πολλά υγρά και ξεκουραστείτε. Αν ο πυρετός ανέβει πάνω από τριάντα εννέα, μην περιμένετε — πηγαίνετε στα επείγοντα.
      - speaker: Σωτήρης
        text: Ευχαριστώ πολύ. Γεια σας.
      - speaker: Χρυσταλλένη
        text: Να γίνετε γρήγορα καλά! Γεια σας.
  - type: exercise
    id: call-notes
    about: call
    title: Заметки
    instruction: Прослушайте разговор и запишите ответ — цифрой или одним-двумя словами по-гречески.
    format: text
    items:
      - id: n1
        prompt: В какой день недели приём? Напишите по-гречески.
        answer:
          - Τετάρτη
          - την Τετάρτη
          - αύριο την Τετάρτη
          - αύριο, την Τετάρτη
        explanation: Μπορείτε να έρθετε αύριο, την Τετάρτη;
      - id: n2
        prompt: Во сколько приём?
        answer:
          - "17:30"
          - "17.30"
          - "5:30"
          - "5.30"
          - πέντε και μισή
          - στις πέντε και μισή
          - "στις 5:30"
          - "στις 17:30"
        explanation: В десять утра Сотирис работает — он выбрал στις πέντε και μισή το απόγευμα.
      - id: n3
        prompt: Какая была температура сегодня утром?
        answer:
          - "38,5"
          - "38.5"
