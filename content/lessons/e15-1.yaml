blocks:
  - type: explanation
    id: disagree
    title: Согласие и несогласие — вежливо и по делу
    body: |-
      На собеседовании и в обсуждении RFC почти всегда есть момент, когда вы видите вопрос иначе, чем собеседник. Интервьюер слушает не только довод, но и то, как вы возражаете: уважительно ли, готовы ли выслушать, умеете ли остаться в одной команде после спора. Поэтому несогласие смягчают: сначала признают довод, затем называют свой.

      **I see your point, but…** — «понимаю вашу мысль, но…»: довод признан, дальше идёт ваш. **I partly agree, but…** и **That's true, although…** — согласие с частью и оговорка. **I'm not sure that…** — сомнение вместо прямого «вы неправы»: **I'm not sure that's the right option.**

      Своё мнение вводят оборотами **In my opinion…**, **As far as I'm concerned…**, **I tend to think that…** («я склонен думать»), **I'd argue that…** («я бы утверждал»). Прямое несогласие звучит вежливо с **I'd respectfully disagree.**

      Говорите о решении. **I'm not sure that this design handles peak load** относится к дизайну, а замечание о том, что кто-то «не подумал о нагрузке», относится к человеку. Довод о решении интервьюер обсуждает, довод о человеке закрывает разговор.
    table:
      columns:
        - степень
        - выражение
        - пример
      rows:
        - - согласие
          - I agree. · That's a fair point.
          - I agree, and I'd add one more risk.
        - - согласие с частью
          - I partly agree, but… · That's true, although…
          - That's true, although it comes with a cost.
        - - сомнение
          - I'm not sure that… · I tend to think that…
          - I tend to think that testing comes first.
        - - несогласие
          - I'd respectfully disagree. · I'd argue that…
          - I'd argue that we should wait for more data.
  - type: explanation
    id: softening
    title: Модальные глаголы и смягчение
    body: |-
      Вежливый спор строится на модальных глаголах и осторожных оборотах. **Could** и **would** делают предложение мягче приказа: **We could consider a smaller change.** **It would be safer to wait.** **Might** и **may** оставляют место сомнению: **That might be risky.** Оборот **It seems to me that…** показывает, что это ваше впечатление, и установленным фактом его никто не считает.

      Союзы **but** и **although** связывают довод собеседника с вашим. После **but** стоит то, что вы хотите сказать на самом деле: **I see your point, but I'd approach it differently.** Перед **but** обычно ставят запятую. **Although** начинает придаточное: **That's true, although it comes with a cost.**

      Смягчение не отменяет позицию. Если вы не согласны, назовите это: **I'd respectfully disagree** понятно, а **well, maybe, in some way, it could be so** оставляет собеседника без ответа. Одного смягчителя достаточно, а вывод должен звучать ясно.
    table:
      columns:
        - слово
        - роль
        - пример
      rows:
        - - could / would
          - мягкое предложение
          - We could try a smaller change first.
        - - might / may
          - возможность, сомнение
          - That might be risky for the release.
        - - it seems to me that
          - ваше впечатление
          - It seems to me that the timeline is tight.
        - - but / although
          - довод и контраргумент
          - I accept the risk, but the timeline concerns me.
  - type: explanation
    id: opinion-mistakes
    title: Типичные ошибки русскоговорящих
    body: |-
      **I'm not agree.** По-русски «я не согласен» строится с прилагательным, и в английском добавляют be: *I'm not agree.* Agree — глагол: **I don't agree.** **I agree** и **I disagree** без be.

      **Agree to вместо agree with.** С человеком и мнением — **agree with**: **I agree with you.** **I agree with the plan.** Предлог *to* стоит с предложением или условием: **I agree to the deadline.**

      **By my opinion.** Русское «по моему мнению» часто даёт *by my opinion*. Верно **in my opinion**.

      **Good in вместо good at.** Навык называют с at и формой на -ing: **I'm good at explaining technical ideas.** Варианты *good in explain* и *good at explain* ошибочны.

      **Tend taking.** После **tend to** стоит глагол без -ing: **I tend to take on too much.**

      **Ответ без глагола.** Сильную сторону называют полным предложением: **My biggest strength is that I break problems down.** Вариант *My strength: breaking problems* допустим в списке, но в устном ответе звучит обрывочно.
    table:
      columns:
        - ошибка
        - верно
        - правило
      rows:
        - - I'm not agree with you.
          - I don't agree with you.
          - agree — глагол
        - - I agree to you.
          - I agree with you.
          - agree with + человек или мнение
        - - By my opinion, it is risky.
          - In my opinion, it is risky.
          - in my opinion
        - - I'm good in explain ideas.
          - I'm good at explaining ideas.
          - good at + -ing
        - - I tend taking too much.
          - I tend to take on too much.
          - tend to + глагол
  - type: explanation
    id: trait-words
    title: Слова урока — качества и склонности
    body: |-
      Слова урока описывают, как человек работает и общается. Они образуют три группы.

      **Стиль работы.** **Level-headed** — сохраняет спокойствие в трудной ситуации. **Detail-oriented** — замечает мелкие неточности. **Self-motivated** — берётся за дело без напоминаний. **Analytical** — разбирает проблему на части и опирается на данные, **systematic** — действует по порядку и по плану. **Pragmatic** — выбирает то, что работает в реальных условиях. **Conscientious** — внимательно выполняет обязанности. **Resilient** — быстро восстанавливается после неудач. **Curious** — хочет понять, почему всё устроено именно так.

      **Общение.** **Empathetic** — понимает чувства другого. **Outgoing** — общительный, **reserved** — сдержанный. **Assertive** — прямо и вежливо отстаивает позицию. **Open-minded** — готов пересмотреть мнение. **A team player** — действует в интересах команды.

      **Склонности, над которыми работают.** **Impatient** — нетерпеливый. **Overcommit** — брать на себя больше, чем можно выполнить. **Micromanage** — контролировать каждую мелочь в работе других. Слабые стороны называют спокойно и сразу говорят, что вы с ними делаете: подробности — в уроке `e15-3`.
