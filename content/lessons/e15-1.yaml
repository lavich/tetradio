  - type: exercise
    id: opinion-choice
    title: Согласие, сомнение, смягчение
    instruction: Выберите слово или фразу для пропуска.
    format: choice
    items:
      - id: q1
        prompt: I ___ with you about the deadline. (я согласен)
        options:
          - agree
          - am agree
          - agrees
        answer: agree
        explanation: Agree — глагол, be не нужен; после I стоит форма без -s.
      - id: q2
        prompt: I'm not sure ___ this is the right option.
        options:
          - that
          - what
          - about
        answer: that
        explanation: После not sure придаточное вводит that; what и about здесь не подходят.
      - id: q3
        prompt: I tend ___ that testing comes first. (я склонен думать)
        options:
          - to think
          - thinking
          - think
        answer: to think
        explanation: После tend стоит to и глагол в базовой форме.
      - id: q4
        prompt: I'm good ___ explaining technical ideas. (хорош в)
        options:
          - at
          - to
          - on
        answer: at
        explanation: Навык называют сочетанием good at и формой на -ing.
      - id: q5
        prompt: That's true, ___ it comes with a cost. (хотя)
        options:
          - although
          - despite
          - so
        answer: although
        explanation: Although вводит придаточное; despite требует существительного или формы на -ing, а so меняет смысл.
      - id: q6
        prompt: ___ my opinion, a rewrite would be too risky. (на мой взгляд)
        options:
          - In
          - By
          - At
        answer: In
        explanation: Устойчивое выражение — in my opinion.
  - type: exercise
    id: polite-choice
    title: Вежливое несогласие
    instruction: Выберите формулировку, которая подходит для спокойного обсуждения решения.
    format: choice
    items:
      - id: q1
        prompt: Вы сомневаетесь, что кэш решит проблему.
        options:
          - I'm not sure that a cache is enough.
          - You obviously do not understand caching.
          - A cache is a silly idea.
        answer: I'm not sure that a cache is enough.
        explanation: Фраза называет сомнение и говорит о решении; остальные оценивают человека и идею.
      - id: q2
        prompt: Вы признаёте довод, но хотите предложить другой путь.
        options:
          - I see your point, but I'd approach it differently.
          - I see your point, so I'll stop talking.
          - I do not see any point in this.
        answer: I see your point, but I'd approach it differently.
        explanation: But вводит свой довод после признания чужого; остальные закрывают разговор.
      - id: q3
        prompt: Вы согласны только с частью довода и хотите назвать опасение.
        options:
          - I partly agree, but I have a concern.
          - I fully agree, but I have a concern.
          - I partly agree, so I have no concern.
        answer: I partly agree, but I have a concern.
        explanation: Partly agree совпадает с оговоркой; второй вариант говорит о полном согласии, третий отрицает опасение.
      - id: q4
        prompt: Вы хотите вежливо сказать, что не согласны.
        options:
          - I'd respectfully disagree.
          - I will never accept this.
          - That is wrong, and everyone knows it.
        answer: I'd respectfully disagree.
        explanation: Фраза называет несогласие вежливо; остальные давят и обобщают.
      - id: q5
        prompt: Вы не согласны с решением команды и приводите довод о самом решении.
        options:
          - I'd put more weight on the maintenance cost.
          - Whoever chose this did not think.
          - This team always decides badly.
        answer: I'd put more weight on the maintenance cost.
        explanation: Фраза предлагает довод о стоимости; остальные критикуют людей.
  - type: exercise
    id: traits-match
    title: Качества и склонности
    instruction: Соедините определение с английским словом. Два слова лишние.
    format: match
    bank:
      - level-headed
      - detail-oriented
      - self-motivated
      - empathetic
      - reserved
      - impatient
      - micromanage
      - assertive
      - open-minded
    items:
      - { id: m1, prompt: "сохраняет спокойствие и ясно мыслит, когда всё идёт не по плану", answer: level-headed }
      - { id: m2, prompt: "замечает мелкие неточности, например пропущенную проверку в коде", answer: detail-oriented }
      - { id: m3, prompt: "берётся за работу сам, без напоминаний и внешнего давления", answer: self-motivated }
      - { id: m4, prompt: понимает чувства другого человека, answer: empathetic }
      - { id: m5, prompt: говорит мало и редко показывает чувства, answer: reserved }
      - { id: m6, prompt: "раздражается, когда дело идёт медленнее, чем хотелось бы", answer: impatient }
      - { id: m7, prompt: контролировать каждую мелочь в работе других людей, answer: micromanage }
  - type: exercise
    id: traits-gap
    title: Качества в предложениях
    instruction: Вставьте слово или выражение. Два варианта лишние.
    format: gap
    bank:
      - analytical
      - systematic
      - pragmatic
      - resilient
      - curious
      - conscientious
      - a team player
      - overcommit
      - outgoing
    items:
      - id: g1
        prompt: Before she decides, she studies the logs and the metrics, so her colleagues call her ___. (аналитичная)
        answer: analytical
      - id: g2
        prompt: He always checks one module at a time, in the same order, so his approach is ___. (системный)
        answer: systematic
      - id: g3
        prompt: There is no time for a perfect design, so a ___ engineer ships the simple fix first. (практичный)
        answer: pragmatic
      - id: g4
        prompt: "After the failed release, she learned from it and kept going: she is ___. (устойчивая к неудачам)"
        answer: resilient
      - id: g5
        prompt: He keeps asking why the service behaves this way, because he is ___. (любознательный)
        answer: curious
      - id: g6
        prompt: She checks the work twice before she hands it over, because she is ___. (добросовестная)
        answer: conscientious
      - id: g7
        prompt: "He shares what he knows and helps with other people's tasks: he is ___. (командный игрок)"
        answer: a team player
