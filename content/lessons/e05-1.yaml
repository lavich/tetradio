blocks:
  - type: explanation
    id: questions
    title: Прямые вопросы — порядок слов
    body: |-
      На собеседовании вопросы звучат быстро, и понять их помогает структура. В прямом вопросе вспомогательный глагол стоит перед подлежащим: **Do you use Docker? Have you worked with Kafka? Can you explain it?** В present simple и past simple вспомогательный глагол — **do, does, did**, а основной остаётся в начальной форме: **Did you design the API?**

      Вопрос с вопросительным словом строится по схеме «вопросительное слово + вспомогательный глагол + подлежащее + глагол»: **What do you mean? Why did you choose Go? How long have you worked there?** Предлог остаётся в конце: **Which team did you work with?**

      Если вопросительное слово само является подлежащим, вспомогательного глагола нет: **Who owns the service? What caused the error?** Сравните: *What did you cause?* — здесь *what* дополнение, и вспомогательный глагол нужен.

      Типичные ошибки русскоговорящих — пропустить вспомогательный глагол (*What you mean?*) и добавить лишний в вопросе к подлежащему (*Who did own the service?*).
    table:
      columns:
        - тип вопроса
        - схема
        - пример
      rows:
        - - общий (да или нет)
          - вспомогательный + подлежащее + глагол
          - Did you design the API?
        - - с вопросительным словом
          - вопросительное слово + вспомогательный + подлежащее + глагол
          - Why did you choose Go?
        - - к подлежащему
          - вопросительное слово + глагол
          - Who owns the service?
        - - с предлогом
          - вопросительное слово + вспомогательный + подлежащее + глагол + предлог
          - Which team did you work with?
  - type: explanation
    id: indirect
    title: Косвенные вопросы
    body: |-
      Вежливый вопрос встраивается во вводную фразу: **Could you tell me…, Do you know…, I'd like to know…** Внутри такого вопроса порядок слов как в утверждении: подлежащее, затем глагол, без **do, does, did**. Сравните: *What do you mean?* — **Could you tell me what you mean?**

      Для вопроса «да или нет» используются **if** или **whether**: **Do you know if the interview will be online?** Время глагола сохраняется, а окончание **-s** в третьем лице возвращается: *How does it scale?* — **I'd like to know how it scales.** Вопросительное слово остаётся: **where, when, who, how long**.

      Знак вопроса зависит от вводной фразы. После вопроса (**Could you tell me…? Do you know…?**) он стоит, после утверждения (**I'd like to know…, I was wondering…**) нет.

      Типичная ошибка русскоговорящих — повторить вопросительный порядок слов внутри: *Could you tell me what do you mean?* Подлежащее после вопросительного слова идёт перед глаголом: **what you mean**.
    table:
      columns:
        - прямой вопрос
        - косвенный вопрос
      rows:
        - - What do you mean by scale?
          - Could you tell me what you mean by scale?
        - - Where is the office?
          - Do you know where the office is?
        - - Did you receive my CV?
          - Could you tell me if you received my CV?
        - - How does it scale?
          - I'd like to know how it scales.
  - type: explanation
    id: clarify-moves
    title: Переспросить, уточнить, пересказать
    body: |-
      На собеседовании вопрос бывает непонятен по трём причинам: его не расслышали, слова незнакомы или смысл допускает два толкования. Для каждой причины есть своя фраза.

      **Повторить.** Вопрос не расслышали: **Could you repeat the question, please? Could you speak a little more slowly?**

      **Уточнить.** Слова понятны, смысл нет: **Could you clarify the question? Could you tell me what you mean by "scale"? Could you give me an example?**

      **Перефразировать.** Нужны другие слова: **Could you put that another way?**

      **Проверить понимание.** Вы называете, как поняли вопрос: **If I understand correctly, you're asking about caching. Do you mean the frontend or the backend?** Интервьюер подтверждает или поправляет, и вы отвечаете на нужный вопрос.

      Слова урока образуют три группы. **Действия.** **Clarify** — уточнить, **elaborate on** — рассказать подробнее, **rephrase** — переформулировать, **refer to** — иметь в виду, **narrow down** — сузить круг вариантов, **go over** — пройтись по пунктам. **Вопрос и ответ.** **A follow-up** — уточняющий вопрос по ответу, **a nuance** — тонкое различие, **a misunderstanding** — недоразумение, **ambiguous** — допускает два толкования, **vague** — расплывчатый. **Связки и оговорки.** **In other words** — другими словами, **straightforward** — простой, без подвоха, **specifically** — именно, **to be precise** — если быть точным, **presumably** — предположительно, **off the top of my head** — навскидку, **to the best of my knowledge** — насколько мне известно.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: direct-choice
    title: Прямые вопросы
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: "___ you work with Kafka at your last company?"
        options: [Did, Does, Are]
        answer: Did
        explanation: Вопрос о прошлом в past simple начинается с did, основной глагол остаётся в начальной форме.
      - id: q2
        prompt: "What ___ the deployment to fail yesterday? (вопрос к подлежащему)"
        options: [caused, did caused, does caused]
        answer: caused
        explanation: Вопросительное слово what — подлежащее, поэтому вспомогательного глагола нет.
      - id: q3
        prompt: "Why ___ you choose this framework last year?"
        options: [did, do, are]
        answer: did
        explanation: Прошлое время требует did.
      - id: q4
        prompt: "How long ___ you been working there?"
        options: [have, did, do]
        answer: have
        explanation: Have you been working — present perfect continuous, вопрос о периоде до сих пор.
      - id: q5
        prompt: "Who ___ the deployment pipeline? (вопрос к подлежащему)"
        options: [owns, does owns, do own]
        answer: owns
        explanation: В вопросе к подлежащему глагол стоит сразу после who и принимает окончание -s.
      - id: q6
        prompt: "Which team ___ you work with?"
        options: [did, were, have]
        answer: did
        explanation: "Вопрос с предлогом строится как обычный: вспомогательный did, подлежащее, глагол, предлог в конце."
  - type: exercise
    id: indirect-choice
    title: Косвенные вопросы
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: "Could you tell me what ___?"
        options: [you mean, do you mean, you do mean]
        answer: you mean
        explanation: В косвенном вопросе порядок слов как в утверждении, без do.
      - id: q2
        prompt: "Do you know ___ the interview starts? (когда)"
        options: [when, when does, does when]
        answer: when
        explanation: После when идёт подлежащее и глагол в обычном порядке.
      - id: q3
        prompt: "Could you tell me ___ you received my CV? (получили ли)"
        options: [if, that, what]
        answer: if
        explanation: Вопрос «да или нет» во вложенной части вводится словом if или whether.
      - id: q4
        prompt: "I'd like to know how long the process ___."
        options: [takes, does it take, take]
        answer: takes
        explanation: Глагол остаётся в обычном порядке, и в третьем лице возвращается -s.
      - id: q5
        prompt: Какое предложение верно?
        options:
          - Could you tell me where the office is?
          - Could you tell me where is the office?
        answer: Could you tell me where the office is?
        explanation: Внутри косвенного вопроса подлежащее стоит перед глаголом.
      - id: q6
        prompt: В какой записи знак вопроса поставлен верно?
        options:
          - I'd like to know what you mean.
          - I'd like to know what you mean?
        answer: I'd like to know what you mean.
        explanation: Вводная фраза — утверждение, поэтому точка.
  - type: exercise
    id: moves-choice
    title: Что сказать
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы не расслышали последнюю часть вопроса.
        options:
          - Could you repeat the question, please?
          - Could you give me an example?
          - Do you mean the frontend or the backend?
        answer: Could you repeat the question, please?
      - id: q2
        prompt: Вы поняли все слова, но не знаете, что интервьюер вкладывает в слово scale.
        options:
          - Could you tell me what you mean by "scale"?
          - Could you speak a little more slowly?
          - Could you repeat the question, please?
        answer: Could you tell me what you mean by "scale"?
        explanation: Повтор не поможет, если неясен смысл слова.
      - id: q3
        prompt: Интервьюер говорит быстро, слова знакомы, но вы не успеваете за ним.
        options:
          - Could you speak a little more slowly?
          - If I understand correctly, you're asking about caching.
          - Could you give me an example?
        answer: Could you speak a little more slowly?
      - id: q4
        prompt: Вопрос можно отнести и к фронтенду, и к бэкенду, и вы хотите выбрать одно.
        options:
          - Do you mean the frontend or the backend?
          - Could you speak a little more slowly?
          - Could you repeat the question, please?
        answer: Do you mean the frontend or the backend?
      - id: q5
        prompt: Вы называете своими словами, как поняли вопрос, и просите подтвердить.
        options:
          - If I understand correctly, you're asking about caching.
          - Could you repeat the question, please?
          - Could you speak a little more slowly?
        answer: If I understand correctly, you're asking about caching.
      - id: q6
        prompt: Вопрос звучит абстрактно, и вам нужна конкретная ситуация, чтобы ответить.
        options:
          - Could you give me an example?
          - Could you speak a little more slowly?
          - Could you repeat the question, please?
        answer: Could you give me an example?
  - type: exercise
    id: words-match
    title: Слова урока
    instruction: Соедините русское слово с английским. Два английских слова лишние.
    format: match
    bank:
      - vague
      - ambiguous
      - rephrase
      - elaborate on
      - to the best of my knowledge
      - off the top of my head
      - narrow down
      - in other words
      - a nuance
      - presumably
    items:
      - { id: m1, prompt: "расплывчатый, без конкретики", answer: vague }
      - { id: m2, prompt: "допускающий два толкования", answer: ambiguous }
      - { id: m3, prompt: "переформулировать вопрос", answer: rephrase }
      - { id: m4, prompt: "рассказать подробнее, развить мысль", answer: elaborate on }
      - { id: m5, prompt: "насколько мне известно", answer: to the best of my knowledge }
      - { id: m6, prompt: "навскидку, без проверки данных", answer: off the top of my head }
      - { id: m7, prompt: "сузить круг вариантов", answer: narrow down }
      - { id: m8, prompt: "вводная фраза: за ней идёт та же мысль, сказанная проще", answer: in other words }
  - type: exercise
    id: words-gap
    title: Уточнение и пересказ
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - elaborate
      - ambiguous
      - vague
      - rephrase
      - knowledge
      - misunderstanding
      - presumably
      - nuance
      - specifically
      - follow-up
    items:
      - id: g1
        prompt: Could you ___ on that point? I would like to hear more detail. (рассказать подробнее)
        answer: elaborate
      - id: g2
        prompt: The requirement is ___, because it can mean two different things. (двусмысленное)
        answer: ambiguous
      - id: g3
        prompt: The answer was ___, with no numbers and no examples. (расплывчатый)
        answer: vague
      - id: g4
        prompt: Let me ___ the question so that it is easier to answer. (переформулировать)
        answer: rephrase
      - id: g5
        prompt: To the best of my ___, the server runs in Frankfurt. (насколько мне известно)
        answer: knowledge
      - id: g6
        prompt: Sorry, I think there was a ___. We understood the task in different ways. (недоразумение)
        answer: misunderstanding
      - id: g7
        prompt: ___, the old service is still running, but nobody has checked yet. (предположительно)
        answer: presumably
      - id: g8
        prompt: There is one important ___ in the contract, so read it carefully. (тонкое различие)
        answer: nuance
