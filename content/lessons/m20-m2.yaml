  - type: writing
    id: may-visit
    register: friendly
    prompt: |-
      Письмо, часть A (дружеский текст). Ваша подруга Лукия из Афин пишет: «Τον Μάιο θα έρθω στην Κύπρο για μία εβδομάδα! Τι καιρό θα κάνει; Τι να φέρω; Τι θα κάνουμε μαζί;»

      Ответьте ей, 80–100 слов: какая в мае погода (в будущем времени); что ей взять с собой (два-три совета в повелительном наклонении); где она будет жить; что вы будете делать вместе — два-три плана с днём; одно сравнение (πιο … από); спросите, когда она прилетает.
    words:
      min: 80
      max: 100
    model: Γεια σου, Λουκία! Τι ωραία νέα! Τον Μάιο ο καιρός στην Κύπρο είναι πολύ καλός. Θα έχει ήλιο και θα κάνει ζέστη, περίπου είκοσι οκτώ βαθμούς, αλλά τα βράδια είναι πιο δροσερά. Φέρε μαγιό και ένα καπέλο, και πάρε ένα μπουφάν για το βράδυ. Θα μείνεις στο σπίτι μου. Έχω ένα μικρό υπνοδωμάτιο για σένα. Το Σάββατο θα πάμε στην Πάφο. Είναι πιο μικρή από τη Λεμεσό, αλλά έχει πολύ ωραίες παραλίες. Την Κυριακή θα πάμε στο Τρόοδος για περίπατο στο δάσος. Πότε φτάνεις; Θα έρθω να σε πάρω από το αεροδρόμιο. Φιλιά, Άννα
    criteria:
      - 80–100 слов; дружеское обращение и прощание на «ты» (Γεια σου, …! … Φιλιά,)
      - "Погода в будущем: θα έχει ήλιο, θα κάνει ζέστη, … βαθμούς (модуль 19)"
      - "Советы в повелительном наклонении на «ты»: Φέρε…, Πάρε…; вещи в винительном падеже (ένα καπέλο, ένα μπουφάν)"
      - "Не меньше трёх форм будущего с основой аориста: θα πάμε, θα μείνεις, θα έρθω (модуль 19)"
      - "Сравнение по правилу πιο + прилагательное + από + винительный падеж: πιο μικρή από τη Λεμεσό; род прилагательного — как у существительного (η Πάφος — μικρή)"
      - "Слабое местоимение перед глаголом: να σε πάρω (модуль 17); планы с днём: το Σάββατο, την Κυριακή"
      - Есть вопрос подруге (Πότε φτάνεις;) и связки αλλά, γιατί или και
      - Подпись вымышленным именем; тонос во всех словах из двух и больше слогов
  - type: writing
    id: landlord-letter
    register: formal
    prompt: |-
      Письмо, часть B (менее дружеский, ближе к официальному текст). Вы снимаете квартиру у господина Сотириу (κύριος Σωτηρίου). С воскресенья в спальне не работает кондиционер, а на улице жара. Кроме того, сломан холодильник на кухне.

      Напишите хозяину письмо, 80–100 слов: зачем вы пишете; что не работает и с какого времени; почему это срочно; попросите прислать электрика или мастера; когда вы бываете дома; как с вами связаться. Обращение и прощание — как в официальном письме. Подпишитесь вымышленным именем.
    words:
      min: 80
      max: 100
    model: |-
      Αγαπητέ κύριε Σωτηρίου,

      Σας γράφω για το κλιματιστικό και το ψυγείο στο διαμέρισμα. Από την Κυριακή το κλιματιστικό στο υπνοδωμάτιο δεν δουλεύει. Αυτή την εβδομάδα κάνει πολλή ζέστη, και τη νύχτα δεν κοιμόμαστε καλά. Επίσης, το ψυγείο στην κουζίνα είναι χαλασμένο, και το φαγητό δεν μένει φρέσκο. Μπορείτε, παρακαλώ, να στείλετε έναν ηλεκτρολόγο αυτή την εβδομάδα; Είμαι στο σπίτι κάθε μέρα μετά τις πέντε το απόγευμα και το Σάββατο όλη μέρα. Το τηλέφωνό μου είναι 99 123 456. Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

      Με εκτίμηση,
      Όλγα Ιβάνοβα
    criteria:
      - 80–100 слов; официальное обращение с запятой (Αγαπητέ κύριε Σωτηρίου,) и прощание (Με εκτίμηση,) — фамилия на -ου не меняется
      - Всё письмо на «вы» (Σας γράφω, Μπορείτε…;) — ни одного σου или Γεια σου
      - "Сказано, зачем пишете: Σας γράφω για…"
      - "Что сломано и с какого времени: Από την Κυριακή … δεν δουλεύει; χαλασμένο согласовано с родом (το ψυγείο — χαλασμένο)"
      - "Почему срочно — причина через και или γιατί: κάνει πολλή ζέστη…"
      - "Вежливая просьба: Μπορείτε, παρακαλώ, να…; или Θα ήθελα να… (модули 09, 16)"
      - "Когда вы дома и как связаться: μετά τις πέντε, το Σάββατο; το τηλέφωνό μου είναι…"
      - "Официальные формулы из модуля 16: Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.; подпись вымышленным именем"
  - type: speaking
    id: interview
    part: interview
    prompt: |-
      Речь, часть A. Экзаменатор задаёт вопросы на «вы». Прочитайте каждый вопрос вслух, ответьте без подготовки одним-тремя предложениями и запишите ответы:
      Από πότε μένετε στην Κύπρο; Πού μαθαίνετε ελληνικά και πόσες φορές την εβδομάδα; Γιατί θέλετε να δώσετε εξετάσεις; Τι κάνετε για την υγεία σας; Τι κάνετε στον ελεύθερο χρόνο σας; Τι θα κάνετε το καλοκαίρι;
    seconds: 120
    model: Μένω στην Κύπρο εδώ και τρία χρόνια. Μαθαίνω ελληνικά σε μια σχολή στη Λάρνακα, δύο φορές την εβδομάδα. Θέλω να δώσω εξετάσεις, γιατί χρειάζομαι το πιστοποιητικό για τη δουλειά μου. Για την υγεία μου περπατάω κάθε μέρα μισή ώρα και τρώω πολλά φρούτα. Στον ελεύθερο χρόνο μου διαβάζω και πηγαίνω στο γυμναστήριο, αλλά προτιμώ το κολύμπι από το γυμναστήριο. Το καλοκαίρι θα πάω στη Ρωσία για δύο εβδομάδες και θα δω την οικογένειά μου.
    criteria:
      - Ответили на все шесть вопросов; хотя бы три ответа — с подробностью или причиной (γιατί χρειάζομαι…, αλλά προτιμώ…)
      - "Формы о себе: μένω, μαθαίνω, θέλω, κάνω — а не μένετε, μαθαίνετε (так спрашивает экзаменатор)"
      - "Сколько времени: εδώ και + настоящее время (Μένω εδώ και τρία χρόνια); частота: δύο φορές την εβδομάδα, κάθε μέρα"
      - "Цель: Θέλω να δώσω… / Πρέπει να μάθω… — после να форма от основы аориста (модуль 16)"
      - "Сравнение или предпочтение: προτιμώ … από …, πιο … από (модуль 20)"
      - "О лете — будущее: θα πάω, θα δω, θα μείνω; не настоящее время (модуль 19)"
  - type: speaking
    id: my-home
    part: monologue
    prompt: |-
      Речь, часть B. Экзаменатор говорит: «Μιλήστε μας για το σπίτι σας.» (Μιλήστε μας — «расскажите нам».)
      Говорите около полутора минут без подготовки: где ваш дом или квартира; сколько и какие комнаты; что где стоит; что вам нравится и что нет; сравните с прежним жильём; что вы хотели бы изменить или купить. Запишите ответ.
    seconds: 90
    model: Μένω σε ένα διαμέρισμα στη Λευκωσία, στον τρίτο όροφο. Έχει δύο υπνοδωμάτια, ένα σαλόνι, μια κουζίνα και ένα μπάνιο. Στο σαλόνι υπάρχουν ένας μεγάλος καναπές και μια τηλεόραση, και δίπλα στο παράθυρο υπάρχει ένα μικρό τραπέζι. Η κουζίνα είναι μικρή, αλλά έχει ένα καινούργιο ψυγείο. Μου αρέσει πολύ το μπαλκόνι, γιατί έχει θέα στο βουνό. Το παλιό μου σπίτι στη Μόσχα ήταν πιο μεγάλο από αυτό, αλλά εδώ έχουμε πιο πολύ ήλιο. Δεν μου αρέσει ότι το μπάνιο είναι πολύ μικρό. Θέλω να αγοράσω δύο καρέκλες για το μπαλκόνι.
    criteria:
      - Говорили около полутора минут, без долгих пауз
      - "Что есть: υπάρχει + ед. ч., υπάρχουν + мн. ч.; число и название комнат (δύο υπνοδωμάτια, ένα σαλόνι)"
      - "Где что стоит: δίπλα στο παράθυρο, στον τρίτο όροφο (модули 06, 12)"
      - "Описание согласованными прилагательными: η κουζίνα είναι μικρή, ένα καινούργιο ψυγείο (модуль 07)"
      - "Сравнение с прежним жильём: ήταν πιο μεγάλο από…; прошедшее ήταν для прежнего дома (модули 15, 20)"
      - "Оценка с причиной (μου αρέσει … γιατί …, δεν μου αρέσει …) и желание: Θέλω να αγοράσω… (модуль 16)"
  - type: speaking
    id: concert-tickets
    part: roleplay
    prompt: |-
      Речь, часть C — ролевая игра. На экзамене её играют два кандидата; у вас есть около 2 минут, чтобы прочитать роль. Прочитайте обе роли, затем сыграйте роль А (покупатель), а реплики кассира произнесите вслух сами или попросите кого-нибудь. Говорите на «вы» и запишите разговор.

      Роль А — покупатель. Вы с подругой хотите пойти на концерт в субботу. Вы у кассы (το ταμείο): попросите два билета. Если на субботу нет — возьмите на другой день. Спросите, во сколько начало и сколько стоит билет. Вы учитесь в университете — спросите о скидке для студентов (подруга не студентка). Узнайте общую сумму, заплатите картой, поблагодарите и попрощайтесь.

      Роль Б — кассир. Поздоровайтесь и спросите, чем помочь. На субботу билетов нет, есть на воскресенье. Концерт начинается в девять вечера. Билет стоит 20 евро, для студентов — 15. Назовите общую сумму и спросите, как будут платить: картой или наличными.
    seconds: 120
    model: |-
      Б: Καλησπέρα σας! Παρακαλώ;
      А: Καλησπέρα σας. Θα ήθελα δύο εισιτήρια για τη συναυλία το Σάββατο.
      Б: Συγγνώμη, για το Σάββατο δεν έχουμε άλλα εισιτήρια. Έχουμε για την Κυριακή.
      А: Δεν πειράζει, την Κυριακή. Τι ώρα αρχίζει η συναυλία;
      Б: Στις εννέα το βράδυ.
      А: Πόσο κοστίζει ένα εισιτήριο;
      Б: Είκοσι ευρώ.
      А: Είμαι φοιτήτρια. Έχετε έκπτωση για φοιτητές;
      Б: Ναι, για φοιτητές το εισιτήριο κάνει δεκαπέντε ευρώ.
      А: Ωραία. Ένα εισιτήριο για μένα με έκπτωση και ένα για τη φίλη μου χωρίς έκπτωση. Πόσο κάνουν όλα μαζί;
      Б: Τριάντα πέντε ευρώ. Πληρώνετε με κάρτα ή με μετρητά;
      А: Με κάρτα, παρακαλώ.
      Б: Ορίστε τα εισιτήριά σας.
      А: Ευχαριστώ πολύ! Καλό βράδυ!
    criteria:
      - "Поздоровались и попрощались на «вы» (Καλησπέρα σας! … Καλό βράδυ!)"
      - "Вежливая просьба: Θα ήθελα δύο εισιτήρια για… (модуль 09); количество — δύο εισιτήρια, мн. ч."
      - "Согласились на другой день: Δεν πειράζει, την Κυριακή — день в винительном падеже с артиклем"
      - "Спросили время и цену: Τι ώρα αρχίζει…; Πόσο κοστίζει / Πόσο κάνουν όλα μαζί; (модули 04, 10)"
      - "Спросили о скидке: Έχετε έκπτωση για φοιτητές; о себе — φοιτητής / φοιτήτρια в своём роде (модуль 16)"
      - "Способ оплаты — με κάρτα / με μετρητά; реплики кассира тоже прозвучали, диалог не оборвался"
