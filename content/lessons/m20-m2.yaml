  - type: listening
    id: saturday-night
    title: Τι θα κάνουμε το Σάββατο;
    plays: 2
    transcript:
      - speaker: Λευτέρης
        text: Γεια σου, Ραφαέλα! Τι θα κάνεις το Σάββατο το βράδυ;
      - speaker: Ραφαέλα
        text: Τίποτα ακόμα. Γιατί;
      - speaker: Λευτέρης
        text: Πάμε σινεμά; Παίζει μια καινούργια ταινία στο σινεμά δίπλα στο λιμάνι.
      - speaker: Ραφαέλα
        text: Σινεμά πήγα την Τετάρτη. Πάμε καλύτερα σε μια συναυλία; Το Σάββατο έχει συναυλία στο πάρκο.
      - speaker: Λευτέρης
        text: Στο πάρκο; Η πρόγνωση λέει ότι το Σάββατο θα βρέξει.
      - speaker: Ραφαέλα
        text: Α, τότε όχι. Και το θέατρο; Στο θέατρο της πλατείας παίζουν πολύ καλοί ηθοποιοί. Το εισιτήριο κοστίζει δεκαπέντε ευρώ.
      - speaker: Λευτέρης
        text: Είναι πιο ακριβό από το σινεμά, αλλά εντάξει, μου αρέσει το θέατρο. Τι ώρα αρχίζει;
      - speaker: Ραφαέλα
        text: Στις οκτώ και μισή. Θα κλείσω δύο εισιτήρια στο ίντερνετ.
      - speaker: Λευτέρης
        text: Ωραία. Θα έρθω να σε πάρω με το αυτοκίνητο στις οκτώ.
      - speaker: Ραφαέλα
        text: Πολύ ωραία! Και μετά πάμε για φαγητό;
      - speaker: Λευτέρης
        text: Εντάξει, αλλά όχι μέχρι αργά. Την Κυριακή στις εννέα το πρωί παίζω τένις.
  - type: exercise
    id: saturday-night-choice
    about: saturday-night
    graded: true
    title: Аудирование 2 — выбор из трёх
    instruction: Прослушайте диалог два раза и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Γιατί η Ραφαέλα δεν θέλει να πάει σινεμά;
        options:
          - Πήγε σινεμά την Τετάρτη.
          - Δεν της αρέσουν οι ταινίες.
          - Το σινεμά είναι μακριά.
        answer: Πήγε σινεμά την Τετάρτη.
        explanation: Σινεμά πήγα την Τετάρτη — в кино она уже ходила на этой неделе.
      - id: q2
        prompt: Γιατί δεν πάνε στη συναυλία;
        options:
          - Γιατί θα βρέξει.
          - Γιατί είναι ακριβή.
          - Γιατί ο Λευτέρης βαριέται τη μουσική.
        answer: Γιατί θα βρέξει.
        explanation: Концерт в парке, а Η πρόγνωση λέει ότι το Σάββατο θα βρέξει (модуль 19).
      - id: q3
        prompt: Πόσο κοστίζει ένα εισιτήριο για το θέατρο;
        options:
          - Πέντε ευρώ.
          - Δεκαπέντε ευρώ.
          - Τριάντα ευρώ.
        answer: Δεκαπέντε ευρώ.
        explanation: "Το εισιτήριο κοστίζει δεκαπέντε ευρώ. Ловушка: 30 евро стоят два билета, а спрашивают про один."
      - id: q4
        prompt: Τι ώρα αρχίζει το θέατρο;
        options:
          - Στις οκτώ.
          - Στις οκτώ και μισή.
          - Στις εννέα.
        answer: Στις οκτώ και μισή.
        explanation: "Спектакль — στις οκτώ και μισή. Στις οκτώ Лефтерис заедет за Рафаэлой, στις εννέα он в воскресенье играет в теннис."
      - id: q5
        prompt: Πώς θα πάνε στο θέατρο;
        options:
          - Με το αυτοκίνητο του Λευτέρη.
          - Με το λεωφορείο.
          - Με τα πόδια.
        answer: Με το αυτοκίνητο του Λευτέρη.
        explanation: Θα έρθω να σε πάρω με το αυτοκίνητο — «заеду за тобой на машине» (σε — слабое местоимение, модуль 17).
      - id: q6
        prompt: Τι θα κάνει ο Λευτέρης την Κυριακή το πρωί;
        options:
          - Θα πάει σινεμά.
          - Θα παίξει τένις.
          - Θα πάει για φαγητό.
        answer: Θα παίξει τένις.
        explanation: Την Κυριακή στις εννέα το πρωί παίζω τένις — поэтому в субботу он не хочет сидеть допоздна. За едой они пойдут в субботу после театра.
  - type: listening
    id: weekend-forecast
    title: Ο καιρός για το σαββατοκύριακο
    plays: 2
    transcript:
      - speaker: Κυριάκος
        text: Καλημέρα σας! Είναι επτά και μισή, Παρασκευή πρωί, και πάμε στον καιρό για το σαββατοκύριακο. Το Σάββατο ο καιρός θα είναι πολύ ωραίος σε όλη την Κύπρο. Θα έχει ήλιο, και η θερμοκρασία θα φτάσει τους είκοσι οκτώ βαθμούς στη Λευκωσία και τους είκοσι πέντε στη Λεμεσό και στην Πάφο. Στις παραλίες δεν θα φυσάει. Αν θέλετε να κολυμπήσετε, το Σάββατο είναι η καλύτερη μέρα! Την Κυριακή ο καιρός θα αλλάξει. Από το πρωί θα έχει σύννεφα, και το απόγευμα θα βρέξει στη Λάρνακα και στη Λευκωσία. Στο Τρόοδος θα έχει καταιγίδες, και η θερμοκρασία θα είναι μόνο δώδεκα βαθμοί. Αν σχεδιάζετε εκδρομή στο βουνό, πάρτε μαζί σας ένα μπουφάν και οδηγείτε προσεκτικά. Τη Δευτέρα θα έχει πάλι ήλιο. Καλό σαββατοκύριακο!
