title: Пробник M2 — экзамен A2
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Как проходить пробник
    body: |-
      Это второй полный пробный экзамен A2 — по модулям 01–20. Формат тот же, что на экзамене ΚΕΓ и в пробнике M1: четыре навыка, в чтении и аудировании — все восемь типов заданий, в письме — два текста, в речи — три части. Тексты и ситуации новые: дом, здоровье, погода и планы, учёба, досуг. Лучше пройти пробник за один раз, как на экзамене: без словаря, таблиц и карточек, с перерывом не дольше 10 минут между письменной частью и речью.

      **Время — как на экзамене.** Чтение — 30 минут, аудирование — 25 минут, письмо — 45 минут, речь — около 12 минут. Поставьте таймер на каждую часть и не возвращайтесь к части, время которой вышло. Каждая запись в аудировании звучит два раза; транскрипт откроется после ответа.

      **Чтение и аудирование** проверяются автоматически: в каждом навыке 25 пунктов. Порог — **60 %**, то есть не меньше 15 правильных ответов в каждом навыке. На экзамене провал одного навыка означает провал всего экзамена, поэтому важен самый слабый навык, а не сумма.

      **Письмо и речь** — самопроверка по критериям курса, а не оценка экзаменатора: на экзамене их оценивают экзаменаторы по своей шкале. Сначала напишите текст и запишите ответ сами, только потом откройте образец и честно отметьте выполненные критерии. Меньше 60 % критериев — навык ниже порога. Пишите от руки строчными печатными буквами и не ставьте в работе своё настоящее имя — подпишитесь вымышленным. Если можете, покажите письма и записи речи преподавателю или носителю языка.

      **Сравните с M1.** Запишите результат каждого навыка рядом с результатом пробника M1 (порог — в таблице ниже). Навык, который остался ниже порога или вырос меньше других, — главный навык для модулей 21–24: в каждом из них делайте его задания первыми и повторяйте модули, которые названы в пояснениях к вашим ошибкам.
    table:
      columns:
        - часть
        - задания
        - время
        - порог
      rows:
        - - Чтение
          - верно/неверно; части предложений; выбор из четырёх; пропуски
          - 30 мин
          - 15 из 25
        - - Аудирование
          - описания и картинки; выбор из трёх; верно/неверно; заметки
          - 25 мин
          - 15 из 25
        - - Письмо
          - письмо подруге и письмо хозяину квартиры, по 80–100 слов
          - 45 мин
          - 60 % критериев
        - - Речь
          - вопросы о себе, монолог, ролевая игра
          - ~12 мин
          - 60 % критериев
  - type: reading
    id: village-house
    title: Ένα μήνυμα από τη Σοφία
    text: |-
      Γεια σου, Ρίτα!

      Πώς είσαι; Έχω νέα! Τον Ιανουάριο φύγαμε από το διαμέρισμα στη Λάρνακα, και τώρα μένουμε σε ένα χωριό, είκοσι λεπτά από την πόλη. Το σπίτι μας δεν είναι καινούργιο, αλλά είναι πιο μεγάλο από το διαμέρισμα: έχει τρία υπνοδωμάτια, μια μεγάλη κουζίνα και έναν κήπο με δέντρα. Και το ενοίκιο είναι το ίδιο, επτακόσια ευρώ τον μήνα!

      Ο Αντρέας πηγαίνει στη δουλειά με το αυτοκίνητο. Εγώ δουλεύω από το σπίτι τρεις μέρες την εβδομάδα, και τις άλλες δύο μέρες πηγαίνω με το λεωφορείο. Στο χωριό έχει ησυχία, αλλά δεν υπάρχει σούπερ μάρκετ, μόνο ένας φούρνος και ένα καφενείο. Για ψώνια πηγαίνουμε στην πόλη το Σάββατο.

      Τον Απρίλιο θα κάνουμε ένα πάρτι για τους φίλους μας. Σε περιμένουμε! Έλα και με τα παιδιά! Αν κάνει καλό καιρό, θα φάμε έξω, στον κήπο, κάτω από τα δέντρα.

      Φιλιά,
      Σοφία
    glosses:
      - text: δουλεύω από το σπίτι
        russian: работаю из дома (удалённо)
      - text: Φιλιά
        russian: целую (в конце письма)
  - type: exercise
    id: village-house-tf
    about: village-house
    graded: true
    title: Чтение 1 — верно или неверно
    instruction: Прочитайте сообщение. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Σοφία μένει ακόμα σε ένα διαμέρισμα στη Λάρνακα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τον Ιανουάριο φύγαμε από το διαμέρισμα — теперь они живут в деревне, в двадцати минутах от города (φύγαμε — аорист от φεύγω, модуль 15).
      - id: q2
        prompt: Το σπίτι στο χωριό είναι πιο μεγάλο από το διαμέρισμα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: "Είναι πιο μεγάλο από το διαμέρισμα: три спальни, большая кухня и сад (πιο … από — модуль 20)."
      - id: q3
        prompt: Το σπίτι είναι καινούργιο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το σπίτι μας δεν είναι καινούργιο — новое для них только место, а не дом.
      - id: q4
        prompt: Τώρα το ενοίκιο είναι πιο ακριβό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το ενοίκιο είναι το ίδιο — та же самая аренда, 700 евро в месяц (модули 06, 11).
      - id: q5
        prompt: Δύο μέρες την εβδομάδα η Σοφία παίρνει το λεωφορείο για τη δουλειά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Три дня она работает из дома, και τις άλλες δύο μέρες πηγαίνω με το λεωφορείο — ездит на работу на автобусе (муж ездит на машине).
      - id: q6
        prompt: Στο χωριό υπάρχει φούρνος.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Супермаркета нет, μόνο ένας φούρνος και ένα καφενείο (υπάρχει — модуль 06).
      - id: q7
        prompt: Αν κάνει καλό καιρό, θα φάνε στον κήπο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Αν κάνει καλό καιρό, θα φάμε έξω, στον κήπο (αν + настоящее, θα + будущее — модуль 19).
  - type: reading
    id: syrup
    title: Σιρόπι για τον βήχα
    text: |-
      ΦΑΡΙΝΟΛ — σιρόπι για τον βήχα, 200 ml
      Δεν χρειάζεται συνταγή γιατρού.

      Δόση: Ενήλικες και παιδιά πάνω από δώδεκα χρονών: δέκα ml τρεις φορές την ημέρα. Παιδιά από έξι μέχρι δώδεκα χρονών: πέντε ml δύο φορές την ημέρα. Το σιρόπι δεν είναι για παιδιά κάτω από έξι χρονών.

      Πώς το παίρνετε: Πίνετε το σιρόπι μετά το φαγητό. Μην το παίρνετε περισσότερο από επτά ημέρες. Αν ο βήχας δεν σταματήσει σε μια εβδομάδα ή αν έχετε και πυρετό, πηγαίνετε στον γιατρό σας.

      Προσοχή: Μετά τη δόση μπορεί να ζαλίζεστε. Γι' αυτό μην οδηγείτε για μία ώρα μετά τη δόση. Μην πίνετε αλκοόλ με το φάρμακο.

      Κρατάτε το σιρόπι σε δροσερό μέρος, όχι στο ψυγείο. Όταν ανοίξετε το μπουκάλι, το σιρόπι είναι καλό για έναν μήνα.
    glosses:
      - text: σταματήσει
        russian: прекратится (σταματάω → σταμάτησα)
      - text: μέρος
        russian: место
      - text: Κρατάτε
        russian: храните (κρατάω — держать, хранить)
  - type: exercise
    id: syrup-match
    about: syrup
    graded: true
    title: Чтение 2 — части предложений
    instruction: Прочитайте инструкцию к сиропу. Закончите каждое предложение по тексту. Два окончания лишние.
    format: match
    bank:
      - δέκα ml.
      - πέντε ml.
      - δεκαπέντε ml.
      - για παιδιά κάτω από έξι χρονών.
      - μετά το φαγητό.
      - πριν από το φαγητό.
      - πηγαίνετε στον γιατρό σας.
      - να οδηγείτε.
    items:
      - id: m1
        prompt: Οι ενήλικες παίρνουν κάθε φορά…
        answer: δέκα ml.
        explanation: "Ενήλικες και παιδιά πάνω από δώδεκα χρονών: δέκα ml τρεις φορές την ημέρα. Δεκαπέντε ml в тексте нет."
      - id: m2
        prompt: Ένα παιδί εννέα χρονών παίρνει κάθε φορά…
        answer: πέντε ml.
        explanation: "Девять лет — между шестью и двенадцатью: πέντε ml δύο φορές την ημέρα (από … μέχρι — модуль 13)."
      - id: m3
        prompt: Το σιρόπι δεν είναι…
        answer: για παιδιά κάτω από έξι χρονών.
        explanation: Το σιρόπι δεν είναι για παιδιά κάτω από έξι χρονών — детям младше шести его не дают (κάτω από — модуль 06).
      - id: m4
        prompt: Πίνετε το σιρόπι…
        answer: μετά το φαγητό.
        explanation: Πίνετε το σιρόπι μετά το φαγητό — после еды, а не до (πριν από).
      - id: m5
        prompt: Αν έχετε βήχα και πυρετό,…
        answer: πηγαίνετε στον γιατρό σας.
        explanation: Αν … έχετε και πυρετό, πηγαίνετε στον γιατρό σας (модуль 18).
      - id: m6
        prompt: Για μία ώρα μετά τη δόση δεν πρέπει…
        answer: να οδηγείτε.
        explanation: "Μπορεί να ζαλίζεστε. Γι' αυτό μην οδηγείτε: μην + глагол = δεν πρέπει να + глагол (модули 16, 18)."
  - type: reading
    id: snow
    title: Χιόνι στο Τρόοδος
    text: |-
      Την περασμένη Παρασκευή η πρόγνωση είπε ότι θα χιονίσει στο Τρόοδος. Τα παιδιά μου ήθελαν πολύ να δουν χιόνι, και έτσι το Σάββατο το πρωί πήγαμε στο βουνό με το αυτοκίνητο. Φύγαμε από τη Λεμεσό στις επτά και φτάσαμε σε μιάμιση ώρα. Στο βουνό είχε ήλιο και έκανε πολύ κρύο, μόνο δύο βαθμούς, αλλά χιόνι δεν είχε. Το μεσημέρι φάγαμε σε μια ταβέρνα, δίπλα στο τζάκι, και μετά κάναμε έναν περίπατο στο δάσος. Το βράδυ μείναμε σε ένα μικρό ξενοδοχείο στο βουνό.

      Την Κυριακή το πρωί ανοίξαμε το παράθυρο και είδαμε ότι όλα ήταν άσπρα! Χιόνισε όλη τη νύχτα. Τα παιδιά έπαιξαν στο χιόνι δύο ώρες. Το απόγευμα γυρίσαμε στη Λεμεσό, κουρασμένοι αλλά πολύ ευχαριστημένοι.

      Λεωνίδας
    glosses:
      - text: έτσι
        russian: так что, поэтому
      - text: ευχαριστημένοι
        russian: довольные
  - type: exercise
    id: snow-choice
    about: snow
    graded: true
    title: Чтение 3 — выбор из четырёх
    instruction: Прочитайте текст и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Γιατί πήγε η οικογένεια στο Τρόοδος;
        options:
          - Γιατί τα παιδιά ήθελαν να δουν χιόνι.
          - Γιατί έκανε πολλή ζέστη στη Λεμεσό.
          - Γιατί ήθελαν να φάνε σε μια ταβέρνα.
          - Γιατί ήθελαν να δουν ένα παλιό χωριό.
        answer: Γιατί τα παιδιά ήθελαν να δουν χιόνι.
        explanation: Τα παιδιά μου ήθελαν πολύ να δουν χιόνι, και έτσι… πήγαμε στο βουνό. В таверне они поели, но поехали не ради неё.
      - id: q2
        prompt: Πόση ώρα έκανε η διαδρομή από τη Λεμεσό;
        options:
          - Μισή ώρα.
          - Μία ώρα.
          - Μιάμιση ώρα.
          - Δύο ώρες.
        answer: Μιάμιση ώρα.
        explanation: "Φτάσαμε σε μιάμιση ώρα — за полтора часа. Στις επτά — время выезда, а не длительность (σε πόση ώρα — модуль 13)."
      - id: q3
        prompt: Τι καιρό έκανε στο βουνό το Σάββατο;
        options:
          - Είχε ήλιο και έκανε κρύο.
          - Είχε ήλιο και έκανε ζέστη.
          - Χιόνισε όλη μέρα.
          - Έβρεξε όλη μέρα.
        answer: Είχε ήλιο και έκανε κρύο.
        explanation: "Είχε ήλιο και έκανε πολύ κρύο, μόνο δύο βαθμούς, αλλά χιόνι δεν είχε. Снег пошёл только ночью (модуль 19)."
      - id: q4
        prompt: Τι έκαναν το Σάββατο μετά το φαγητό στην ταβέρνα;
        options:
          - Έπαιξαν στο χιόνι.
          - Έκαναν έναν περίπατο στο δάσος.
          - Γύρισαν στη Λεμεσό.
          - Πήγαν σε ένα μουσείο.
        answer: Έκαναν έναν περίπατο στο δάσος.
        explanation: Φάγαμε σε μια ταβέρνα…, και μετά κάναμε έναν περίπατο στο δάσος. В снегу дети играли и в Лимасол вернулись только в воскресенье.
      - id: q5
        prompt: Πότε χιόνισε;
        options:
          - Την Παρασκευή.
          - Το Σάββατο το πρωί.
          - Το Σάββατο τη νύχτα.
          - Την Κυριακή το απόγευμα.
        answer: Το Σάββατο τη νύχτα.
        explanation: "В субботу снега не было; в воскресенье утром всё было белым: Χιόνισε όλη τη νύχτα — всю ночь с субботы на воскресенье."
      - id: q6
        prompt: Τι έκαναν τα παιδιά την Κυριακή το πρωί;
        options:
          - Έπαιξαν στο χιόνι.
          - Έκαναν έναν περίπατο στο δάσος.
          - Έφαγαν δίπλα στο τζάκι.
          - Έμειναν στο αυτοκίνητο.
        answer: Έπαιξαν στο χιόνι.
        explanation: Τα παιδιά έπαιξαν στο χιόνι δύο ώρες. Прогулка по лесу и обед у камина были в субботу (έπαιξα — аорист от παίζω, модуль 20).
  - type: reading
    id: greek-course
    title: Ένα μήνυμα από τη Μαρίνα
    text: |-
      Γεια σου, Κάτια!

      Ευχαριστώ για το μήνυμά σου! Από τον Οκτώβριο μαθαίνω ελληνικά σε μια σχολή στη Λεμεσό. Έχουμε μάθημα δύο φορές την εβδομάδα, την Τρίτη και την Πέμπτη το βράδυ. Στην τάξη μας είμαστε μόνο οκτώ μαθητές. Ο καθηγητής μας, ο κύριος Φίλιππος, εξηγεί πολύ καλά. Πριν από τις εξετάσεις θα (1) ___ δώσει πολλές ασκήσεις για το σπίτι. Για μένα η γραμματική είναι πιο εύκολη (2) ___ την προφορά.

      Τον Μάιο (3) ___ δώσω εξετάσεις για το επίπεδο Α2. Πρέπει να (4) ___ πολλές λέξεις, γι' αυτό κάθε πρωί στο λεωφορείο επαναλαμβάνω δέκα καινούργιες λέξεις. Το (5) ___ δύσκολο για μένα είναι η προφορική εξέταση.

      Αν περάσω τις εξετάσεις, θα κάνω ένα πάρτι στο σπίτι μου. Θα (6) ___ κι εσύ;

      Φιλιά,
      Μαρίνα
    glosses:
      - text: Φιλιά
        russian: целую (в конце письма)
  - type: exercise
    id: greek-course-gap
    about: greek-course
    graded: true
    title: Чтение 4 — пропуски
    instruction: Прочитайте сообщение и вставьте слова. Каждое слово — один раз; три слова лишние.
    format: gap
    bank:
      - μας
      - από
      - όσο
      - θα
      - μάθω
      - πιο
      - χειρότερη
      - έρθεις
      - ήρθες
    items:
      - id: g1
        prompt: (1) Πριν από τις εξετάσεις θα ___ δώσει πολλές ασκήσεις για το σπίτι.
        answer: μας
        explanation: "Кому даст? «Нам» — слабое местоимение μας стоит перед глаголом, после θα: θα μας δώσει (модули 17, 19)."
      - id: g2
        prompt: (2) Για μένα η γραμματική είναι πιο εύκολη ___ την προφορά.
        answer: από
        explanation: "Πιο + прилагательное + από + винительный падеж: πιο εύκολη από την προφορά. Όσο идёт только после τόσο (модуль 20)."
      - id: g3
        prompt: (3) Τον Μάιο ___ δώσω εξετάσεις για το επίπεδο Α2.
        answer: θα
        explanation: "Τον Μάιο — будущее: θα + форма от основы аориста, θα δώσω — «сдам» (модуль 19)."
      - id: g4
        prompt: (4) Πρέπει να ___ πολλές λέξεις.
        answer: μάθω
        explanation: "Πρέπει να + форма от основы аориста, лицо «я» — как в тексте επαναλαμβάνω: πρέπει να μάθω (модуль 16)."
      - id: g5
        prompt: (5) Το ___ δύσκολο για μένα είναι η προφορική εξέταση.
        answer: πιο
        explanation: "Превосходная степень — артикль + πιο: το πιο δύσκολο — «самое трудное» (модуль 20). Χειρότερη — женский род и уже сама сравнительная форма."
      - id: g6
        prompt: (6) Θα ___ κι εσύ;
        answer: έρθεις
        explanation: "После θα — форма от основы аориста с окончаниями настоящего: θα έρθεις — «ты придёшь». Ήρθες — прошедшее время, после θα не ставится (модули 16, 19)."
  - type: listening
    id: free-time
    title: Τι κάνουν στον ελεύθερο χρόνο τους;
    plays: 2
    transcript:
      - speaker: Ευαγγελία
        text: Το χόμπι μου είναι η ζωγραφική. Κάθε Κυριακή πηγαίνω στο πάρκο με τα χρώματά μου. Μου αρέσουν πολύ τα δέντρα και τα λουλούδια.
      - speaker: Μιχάλης
        text: Κάθε πρωί, πριν από τη δουλειά, κάνω τρέξιμο στην παραλία, πέντε χιλιόμετρα. Δεν κολυμπάω, γιατί το νερό είναι ακόμα κρύο.
      - speaker: Χρυστάλλα
        text: Αγαπάω τη μουσική. Κάθε Πέμπτη το βράδυ τραγουδάω με μια ομάδα στο πολιτιστικό κέντρο. Είμαστε είκοσι άνθρωποι.
      - speaker: Νεοκλής
        text: Είμαι φοιτητής και δεν έχω πολύ ελεύθερο χρόνο. Όταν έχω, παίζω μπάσκετ με τους φίλους μου στο γήπεδο κοντά στο πανεπιστήμιο.
      - speaker: Ελπίδα
        text: Τον αθλητισμό τον βαριέμαι, και δεν μου αρέσει η τηλεόραση. Προτιμώ το διάβασμα. Κάθε βράδυ διαβάζω ένα βιβλίο στο μπαλκόνι μου.
      - speaker: Παναγιώτης
        text: Η φωτογραφία είναι το αγαπημένο μου χόμπι. Τα σαββατοκύριακα πηγαίνω στο βουνό και φωτογραφίζω τα δέντρα και τα ποτάμια.
