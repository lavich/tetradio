blocks:
  - type: explanation
    id: scheme
    title: "Схема описания архитектуры в пяти шагах"
    body: |-
      Описание архитектуры строится как короткий маршрут, и каждый шаг занимает одну-две фразы.

      **1. Обзор.** Назовите масштаб и число частей: **Let me describe the architecture at a high level. It's a fairly standard setup. The system consists of three main parts.**

      **2. Путь запроса.** Ведите слушателя по шагам и связывайте их: **Let me trace a request through the system. First, … After that, an event is published to the queue. Finally, the response is sent back to the client.** Глаголы стоят в passive.

      **3. Ответственная часть.** Назовите сервис, от которого зависит остальное, и скажите, как он защищён: **The most critical part is the payment service.**

      **4. Предложение нарисовать.** **I can draw it if that helps.** Интервьюер решает, нужна ли схема.

      **5. Завершение.** **That covers the main flow.** После этого интервьюер задаёт уточняющие вопросы.
    table:
      columns:
        - шаг
        - язык
        - пример
      rows:
        - - обзор
          - at a high level, consists of
          - The system consists of three main parts.
        - - путь запроса
          - First, … After that, … Finally, …
          - After that, an event is published to the queue.
        - - ответственная часть
          - The most critical part is…
          - The most critical part is the payment service.
        - - предложить схему
          - I can draw it if…
          - I can draw it if that helps.
        - - завершить
          - That covers…
          - That covers the main flow.
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: good-structure
    title: Подходящая реакция
    instruction: Выберите вариант, который подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: Интервьюер просит описать систему. С чего начать?
        options:
          - Let me describe the architecture at a high level.
          - It is complicated.
          - Which part do you want first?
        answer: Let me describe the architecture at a high level.
        explanation: Обзор задаёт рамку, и слушатель видит, сколько частей будет в рассказе.
      - id: q2
        prompt: Вы переходите от обзора к пути запроса. Какая фраза подходит?
        options:
          - Let me trace a request through the system.
          - That covers the main flow.
          - I can draw it if that helps.
        answer: Let me trace a request through the system.
        explanation: Фраза называет следующий шаг рассказа.
      - id: q3
        prompt: Вы описали путь запроса и хотите закончить. Какая фраза подходит?
        options:
          - That covers the main flow.
          - The system consists of three main parts.
          - Let me describe the architecture at a high level.
        answer: That covers the main flow.
      - id: q4
        prompt: Схема сложна, и слова не передают её целиком. Какая фраза подходит?
        options:
          - I can draw it if that helps.
          - Please wait.
          - The payment service was built.
        answer: I can draw it if that helps.
      - id: q5
        prompt: Вы называете сервис, от которого зависит остальное. Какая фраза подходит?
        options:
          - The most critical part is the payment service.
          - It's a fairly standard setup.
          - After that, an event is published to the queue.
        answer: The most critical part is the payment service.
  - type: exercise
    id: passive-fix
    title: Passive и связки в описании
    instruction: Выберите вариант.
    format: choice
    items:
      - id: q1
        prompt: Какое предложение верно?
        options:
          - After that, an event is published to the queue.
          - After that, an event published to the queue.
        answer: After that, an event is published to the queue.
        explanation: Нужны is и V3.
      - id: q2
        prompt: "The system ___ of three main parts. (состоит)"
        options: [consists, is consisted, consist]
        answer: consists
        explanation: Consist — глагол без passive, поэтому consists of.
      - id: q3
        prompt: "The first version ___ by two engineers. (была построена)"
        options: [was built, built, was build]
        answer: was built
        explanation: Исполнитель введён словом by, значит нужен passive — was built.
      - id: q4
        prompt: "___, the response is sent back to the client. (последний шаг)"
        options: [Finally, First, After]
        answer: Finally
      - id: q5
        prompt: "I would like to know how the request ___. (направляется)"
        options: [is routed, is it routed, does it route]
        answer: is routed
        explanation: В косвенном вопросе порядок слов как в утверждении, поэтому is routed.
  - type: explanation
    id: writing-how
    title: Описание устройства проекта
    body: |-
      Письменная задача — короткое описание архитектуры вашего проекта, 80–120 слов, в формальном стиле. Менеджер по найму просит прислать его перед техническим собеседованием.

      Схема: 1) обращение (**Dear Mr Weber,**); 2) обзор — **consists of** и число частей; 3) путь запроса — **First, … After that, … Finally, …** с глаголами в passive; 4) ответственная часть и как она защищена; 5) подпись (**Kind regards**).

      В формальном тексте сокращения (*it's, I'd*) не используются, поэтому пишите **it is, I would**. Проверьте себя: в описании есть не меньше трёх глаголов в passive, у каждого есть **is / are / was / were** и V3, а связки идут по порядку.
