  - type: writing
    id: architecture
    register: formal
    prompt: "Менеджер по найму Mr Weber просит прислать до технического собеседования короткое описание архитектуры вашего проекта. Напишите ему (80–120 слов): обзор с числом частей, путь запроса со связками First, After that, Finally и глаголами в passive, ответственная часть, подпись."
    words: { min: 80, max: 120 }
    model: |-
      Dear Mr Weber,

      Thank you for your request about my current project. It is an online booking platform that consists of three main parts: an API gateway, a booking service and a notification service. First, every request is sent to the gateway, where the user is authenticated and the payload is validated. After that, the booking is saved in PostgreSQL, and an event is published to a message queue. Finally, a confirmation email is sent by the notification service. The most critical part is the booking service, so it runs in three containers and is monitored around the clock.

      Kind regards,
      Anna Petrova
    criteria:
      - 80–120 слов, есть обращение, обзор и подпись
      - Назван масштаб — число частей, например consists of three main parts
      - Путь запроса описан связками First, After that, Finally в правильном порядке
      - Не меньше трёх глаголов в passive, у каждого есть is / are / was / were и V3
      - Названа ответственная часть и сказано, как она защищена
      - Формальный стиль без сокращений и разговорных слов
  - type: explanation
    id: speaking-how
    title: Как записывать ответ
    body: |-
      Шестой ответ вашего **банка ответов** — Describe the architecture of your project. Вопрос проверяет, можете ли вы вести слушателя по системе и называть границы частей.

      1) Начните с обзора: **at a high level, consists of**. 2) Проведите запрос по системе с тремя-четырьмя шагами и связками, глаголы — в passive. 3) Назовите ответственную часть и объясните, почему она важна для системы. 4) Предложите нарисовать схему и закончите итогом. 5) Запишите ответ, переслушайте, сверьте с образцом и критериями.

      Сцена в конце урока повторяет системный раздел собеседования: интервьюер просит нарисовать систему и задаёт уточняющие вопросы. Реплики интервьюера записаны на предыдущей странице; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: describe
    part: monologue
    prompt: "Интервьюер: «Describe the architecture of your project. Could you start with the big picture?» Ответьте за 90 секунд: обзор, путь запроса в три-четыре шага со связками, ответственная часть, итог."
    seconds: 90
    model: "Sure. Let me describe the architecture at a high level. It is a fairly standard setup, and the system consists of three main parts: an API gateway, an orders service and a notification service. Let me trace a request through the system. First, the request is sent to the gateway, where the user is authenticated and the payload is validated. After that, the request is routed to the orders service, and the order is saved in PostgreSQL. Then an event is published to the message queue, and the response is returned to the client. Finally, the notification service reads the event and sends a confirmation email. The most critical part is the orders service, because everything else depends on it. It is stateless, so it runs in several containers, and a load balancer distributes the traffic. I can draw it if that helps. That covers the main flow."
    criteria:
      - "Ответ начинается с обзора: at a high level, consists of и число частей"
      - Путь запроса — три-четыре шага со связками First, After that, Finally в порядке
      - Не меньше трёх глаголов в passive с is / are
      - Названа ответственная часть и причина
      - Около 90 секунд, без долгих пауз
  - type: speaking
    id: critical-part
    part: interview
    prompt: "Интервьюер уточняет: «Which part of the system is the most critical, and why?» Ответьте за 30 секунд: назовите часть, причину и как она защищена."
    seconds: 30
    model: "The most critical part is the orders service, because every request goes through it. It is stateless, so it runs in three containers, and the traffic is distributed by a load balancer. If one container fails, the others keep working, and an alert is sent to the on-call engineer."
    criteria:
      - Названа одна часть системы и причина
      - Есть способ защиты, например несколько контейнеров или оповещение
      - Есть passive с is / are
      - Ответ укладывается в 30 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
