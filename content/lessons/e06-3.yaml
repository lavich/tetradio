  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на техническом собеседовании. Интервьюер — Mark. Прослушайте его реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику опишите систему в общих чертах и проведите запрос по шагам. На вторую назовите хранилище. На третью объясните, что происходит при сбое базы. На четвёртую назовите причину очереди. В конце задайте вопрос о системе компании. Вся ваша часть — 90 секунд, каждая реплика — две-четыре фразы.
    seconds: 90
    model: |-
      Mark: Let's move to system design. Could you draw the architecture of the last system you worked on and walk me through how a request is handled?
      You: Sure. Let me describe it at a high level. The system consists of three main parts: a gateway, an orders service and a notification service. First, the request is sent to the gateway, where the user is authenticated. After that, it is routed to the orders service. Finally, the response is sent back to the client.
      Mark: Okay, I can see the gateway and the service. Where is the data stored?
      You: The data is stored in PostgreSQL, and product data is cached in Redis for ten minutes.
      Mark: And what happens if the database is not available?
      You: The service fails over to a replica, which is used for reading. Writes are retried three times, and an alert is sent to the on-call engineer.
      Mark: I see. Why did you add a queue between the services?
      You: Because the email provider is slow. With a queue, the order is confirmed immediately, and the email is sent later by a consumer.
      Mark: Thank you, that is clear. Do you have any questions about our system?
      You: Yes. Could you tell me how requests are distributed between your services?
    criteria:
      - Ответили на все пять реплик по порядку, каждая — две-четыре фразы
      - "Описание системы: обзор и три шага со связками First, After that, Finally"
      - "Не меньше трёх глаголов в passive: is stored, is sent, is routed"
      - "Ответ о сбое называет конкретное действие: переключение, повтор или оповещение"
      - Вопрос о системе компании построен косвенно
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "I ___ with this system since 2021."
        options: [have worked, worked, am working]
        answer: have worked
        explanation: Since 2021 — период до сих пор, нужен present perfect.
      - id: q2
        prompt: "The more we scaled, ___ more we needed monitoring."
        options: [the, a, that]
        answer: the
        explanation: В конструкции the … the … нужны оба the.
      - id: q3
        prompt: "Could you tell me where the data ___?"
        options: [is stored, is it stored, does it store]
        answer: is stored
        explanation: В косвенном вопросе порядок слов как в утверждении, а passive требует is и V3.
      - id: q4
        prompt: "We were working on the migration when the requirements ___."
        options: [changed, have changed, were change]
        answer: changed
        explanation: Короткое действие внутри длительного — past simple.
      - id: q5
        prompt: "Go is ___ than Java at startup. (быстрее)"
        options: [faster, more fast, fastest]
        answer: faster
      - id: q6
        prompt: "The data ___ without downtime last month. (была перенесена)"
        options: [was migrated, migrated, is migrated]
        answer: was migrated
        explanation: Last month — прошедшее время, исполнитель не назван, поэтому was и V3.
