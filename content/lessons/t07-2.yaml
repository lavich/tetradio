blocks:
  - type: explanation
    id: flight-problems
    title: Когда рейс сорвался
    body: |-
      Если первый рейс опоздал и вы не успели на пересадку, вы **miss a connection**: **I've missed my connecting flight.** Если оба рейса в одной брони, авиакомпания должна вас **rebook** — переоформить на другой рейс: **Can you rebook me on the next flight?**

      Иногда авиакомпания продаёт больше билетов, чем мест в самолёте: рейс **overbooked**. Сначала ищут добровольцев полететь позже, а если их нет, кому-то отказывают в посадке — это **denied boarding**.

      При долгой задержке выдают **a meal voucher** — талон на еду в кафе терминала. А главный вопрос — **Am I entitled to compensation?**: **be entitled to** — «иметь право на» то, что положено по правилам. Всё, что компания даёт сверх правил, — **a goodwill gesture**, жест доброй воли: ваучер, бесплатный ужин, место получше.

      Если с вами обошлись плохо, говорите спокойно и твёрдо: **I'd like to make a complaint.** **Could I speak to the manager, please?** **I'm not happy with how this was handled.** **What can you do to put this right?** Повышать голос не нужно — твёрдость в словах, а не в тоне.
