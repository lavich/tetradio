  - type: writing
    id: summary
    register: formal
    prompt: "Напишите пересказ обсуждения для коллеги, который не пришёл на встречу (80–120 слов): что предложили, что объяснили, что признали, о чём договорились и что нужно сделать. Используйте не меньше четырёх глаголов пересказа и сдвиг времён. Пересказывайте обсуждение по существу, без оценки людей."
    words: { min: 80, max: 120 }
    model: |-
      Subject: Summary of the design review

      Dear colleague,

      I am writing to summarise yesterday's design review, since you could not attend. The team lead explained that the release had moved to the end of the month. The reviewers pointed out that the API documentation was incomplete, and they recommended adding examples. One engineer suggested splitting the migration into two stages, and everyone agreed. The product owner admitted that the requirements had changed twice, and she said that she would send a clear list by Friday. We asked you to review the migration plan by Wednesday.

      Please let me know if you have any questions.

      Kind regards
    criteria:
      - 80–120 слов, есть тема письма, обращение, пересказ обсуждения, просьба к коллеге и вежливое завершение
      - Использованы не меньше четырёх глаголов пересказа (explained, pointed out, suggested, admitted, recommended, said)
      - Времена сдвинуты (had moved, would send); если в обсуждении звучало tomorrow, вместо него стоит the next day
      - Названо, что решено и что нужно сделать коллеге, со сроком
      - Пересказ идёт по существу, без оценки и имён участников
      - Формальный стиль без сокращений
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Двенадцатый ответ вашего **банка ответов** — вопрос **Tell me about feedback you received**. К нему добавляется второй вопрос: **How do you give feedback?** Первый ответ занимает до двух минут, второй — до 45 секунд.

      1) Разложите первый ответ по пяти шагам: вступление, что сказали, реакция, что изменили, вывод. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: замечание названо по существу, есть пересказ с told или pointed out, названо, что вы изменили, нет оценки людей. 4) Для второго вопроса назовите, как вы строите комментарий, как отмечаете мелочи и как говорите прямо и деликатно.

      Сцена в конце урока строится на вопросах о команде и фидбеке. Реплики записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: feedback
    part: interview
    prompt: "Интервьюер спрашивает: «Tell me about feedback you received.» Ответьте за 120 секунд: какое замечание вы получили, что вам сказали, как вы отреагировали, что изменили."
    seconds: 120
    model: "One piece of feedback changed how I work. I'd like to talk about it. On my first big project, I was building an export feature. After the first code review, my line manager told me that my pull requests were too large and hard to review. She also pointed out that I explained my decisions too quickly in design reviews. At first I was a little defensive, because I had worked hard on the code. But she gave me two clear examples, and I realised that the feedback was fair. I took it on board. I started splitting my changes into smaller pull requests and wrote a short description for each one. Before every design review, I prepared one slide with the reasons behind my decision. As a result, my pull requests were approved much faster, and the team told me that the reviews had become easier. Since then, I have asked for feedback early, after every release."
    criteria:
      - Замечание названо по существу, о работе, без имён и оценки человека
      - Есть пересказ со сдвигом времён и глаголом told или pointed out
      - Названа первая реакция и то, как вы уточнили или учли замечание
      - Названо конкретное изменение и его результат
      - Использованы не меньше трёх фраз урока
      - Нет обвинения коллег и руководства
      - Ответ укладывается в 120 секунд
  - type: speaking
    id: give
    part: monologue
    prompt: "Интервьюер уточняет: «How do you give feedback?» Ответьте за 45 секунд: как вы строите комментарий, что отмечаете и как говорите."
    seconds: 45
    model: "When I give feedback, I focus on the code, not the person. I describe what I noticed, explain the reason behind my comment and suggest a change. I mark small comments as nitpicks, so that nobody thinks they are blockers. If a discussion needs more than a few comments, I suggest a short call. I try to be candid but tactful, and I always mention what works well."
    criteria:
      - Названо, что комментарий о коде и содержит причину и предложение
      - Есть способ отметить мелочь или сложность
      - Названо, как сочетаются прямота и деликатность
      - Нет оценки людей и примеров с именами
      - Ответ укладывается в 45 секунд
  - type: listening
    id: scene-lines
    title: Реплики собеседника
    plays: 2
    transcript:
      - { speaker: Ingrid, text: "Thanks for joining. I'd like to ask about teamwork. How would you describe the team you worked in?", audio: e12-3/scene-lines-1.mp3 }
      - { speaker: Ingrid, text: "Mm-hm. Tell me about a piece of feedback you received.", audio: e12-3/scene-lines-2.mp3 }
      - { speaker: Ingrid, text: "I see. And what did you do after that?", audio: e12-3/scene-lines-3.mp3 }
      - { speaker: Ingrid, text: "Okay. How do you give feedback to a colleague?", audio: e12-3/scene-lines-4.mp3 }
      - { speaker: Ingrid, text: "Thank you. That was a clear picture of how you work with others.", audio: e12-3/scene-lines-5.mp3 }
  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании, вопросы задаёт Ingrid, руководитель разработки. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику опишите команду, в которой вы работали. На вторую перескажите полученный отзыв. На третью скажите, что вы сделали после него. На четвёртую — как вы даёте фидбек. На последнюю поблагодарите. Вся ваша часть — 120 секунд, каждая реплика — две-четыре фразы.
    seconds: 120
    model: |-
      Ingrid: Thanks for joining. I'd like to ask about teamwork. How would you describe the team you worked in?
      You: It was a team of six engineers with a product owner and a scrum master. We had a stand-up every morning and a demo at the end of each sprint. Our working agreement said that we would review every pull request within a day.
      Ingrid: Mm-hm. Tell me about a piece of feedback you received.
      You: One teammate once told me that I explained things too quickly. He pointed out that people in the design review had needed more time to follow my reasoning.
      Ingrid: I see. And what did you do after that?
      You: At first I was a little defensive, but I asked for an example and took it on board. Now I add a short summary to every design doc, and I ask for feedback early.
      Ingrid: Okay. How do you give feedback to a colleague?
      You: I focus on the code, not the person. I describe what I noticed, explain the reason and suggest a change. I mark small comments as nitpicks.
      Ingrid: Thank you. That was a clear picture of how you work with others.
      You: Thank you for the questions. I value direct feedback, so I'm happy to hear any follow-up.
    criteria:
      - Ответили на все пять реплик по порядку, каждая — две-четыре фразы
      - В первой реплике названы состав команды и её практики
      - Во второй реплике есть пересказ со сдвигом времён и глаголом told, pointed out или suggested
      - В третьей реплике названы реакция и действие после отзыва
      - В четвёртой реплике названо, как строится фидбек о коде
      - В конце есть благодарность
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "I wish I ___ the logs more carefully. (сожаление о прошлом)"
        options: [had read, read, have read]
        answer: had read
        explanation: Wish о прошлом требует past perfect.
      - id: q2
        prompt: "If the release broke production, I ___ it back first. (воображаемая ситуация)"
        options: [would roll, will roll, rolled]
        answer: would roll
        explanation: Second conditional — if + past simple, would + базовая форма.
      - id: q3
        prompt: "If we had set up an alert, we ___ the problem sooner. (прошлое, которого не было)"
        options: [would have noticed, would notice, will notice]
        answer: would have noticed
        explanation: Conditional 3 — would have и третья форма глагола.
      - id: q4
        prompt: "The incident happened when we ___ on the migration for three weeks. (процесс шёл до момента)"
        options: [had been working, have been working, will be working]
        answer: had been working
        explanation: Длительное действие до момента в прошлом — past perfect continuous.
      - id: q5
        prompt: "I ___ on the payment service when the requirements changed. (фон рассказа)"
        options: [was working, have worked, will work]
        answer: was working
        explanation: Длительное действие на фоне события в прошлом — past continuous.
      - id: q6
        prompt: "Unless the fix ___ trivial, I wouldn't ship it on a Friday."
        options: [is, will be, isn't]
        answer: is
        explanation: После unless стоит утвердительная форма настоящего времени.
