blocks:
  - type: explanation
    id: scheme
    title: Ответ о фидбеке в пяти шагах
    body: |-
      Вопрос **Tell me about feedback you received** проверяет, как вы работаете с замечаниями. Единого верного ответа у него нет: интервьюер слушает, какое замечание вы выбрали, как отреагировали и что изменили. Ответ укладывается примерно в две минуты и идёт по шагам, на каждом хватает одной-трёх фраз.

      **1. Вступление.** Назовите замечание одной фразой: **One piece of feedback changed how I work.** Скажите, когда оно прозвучало и по какой работе.

      **2. Что сказали.** Перескажите замечание глаголом пересказа и со сдвигом времён: **One teammate once told me that I explained things too quickly.**

      **3. Реакция.** Опишите первую реакцию и решение: **At first I was defensive, but then I took it on board.** Сообщите, что вы уточнили: пример, причину.

      **4. Что изменили.** Назовите конкретное действие и результат: **Now I ask for feedback early.**

      **5. Вывод.** Свяжите опыт с тем, как вы работаете и даёте фидбек сами: **In code reviews, I focus on the code, not the person.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - вступление
          - 10–15 секунд
          - One piece of feedback changed how I work.
        - - что сказали
          - 20–25 секунд
          - One teammate once told me that I explained things too quickly.
        - - реакция
          - 20–25 секунд
          - At first I was defensive, but then I took it on board.
        - - что изменили
          - 30–35 секунд
          - Now I ask for feedback early.
        - - вывод
          - 15–20 секунд
          - I value direct feedback because it saves time.
  - type: explanation
    id: safe-feedback
    title: Как говорить о фидбеке и коллегах
    body: |-
      Рассказ о фидбеке показывает, как вы относитесь к работе с людьми. Интервьюер слушает, называете ли вы замечание по существу, принимаете ли свою долю и меняете ли что-то после него. Выбирайте замечание о работе или коде, называйте действие и результат.

      Коллег и руководителей по имени не называйте и их характер не оценивайте: говорите о том, что было сказано и что вы сделали. Если вы не согласны с отзывом, скажите, как выяснили причину: попросили пример, обсудили с командой. Отзыв, который вы проигнорировали, примером не служит. Фидбек, который даёте вы, тоже касается работы: что вы заметили, почему это важно, что предлагаете.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - My teammate was rude about my code.
          - A teammate pointed out that my pull request was too large.
          - называют слова коллеги по существу
        - - My manager never gave me feedback, so it wasn't my fault.
          - I asked for feedback after every release.
          - называют свои действия
        - - I disagreed with the comment, so I ignored it.
          - I asked for an example and decided what to change.
          - согласие или несогласие проверяют
        - - The reviewer was wrong about everything.
          - The feedback was fair, and I started working on it.
          - отзыв оценивают по существу
        - - I told him his code was terrible.
          - I explain the reason behind my comments.
          - фидбек о работе и с причиной
