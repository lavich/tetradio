  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы начинаете рассказ о фидбеке и называете замечание одной фразой. Какая фраза подходит?
        options:
          - One piece of feedback changed how I work.
          - We review how the sprint went at the end of each cycle.
          - Our team agreed to review every pull request within a day.
        answer: One piece of feedback changed how I work.
        explanation: Рассказ открывает фраза о замечании; остальные описывают практики команды.
      - id: q2
        prompt: Вы пересказываете замечание коллеги о том, что вы быстро объясняете. Какая фраза подходит?
        options:
          - One teammate once told me that I explained things too quickly.
          - I work well with people who disagree with me.
          - Now I ask for feedback early.
        answer: One teammate once told me that I explained things too quickly.
        explanation: Told me that и past simple пересказывают чужие слова; в остальных вариантах говорит сам рассказчик.
      - id: q3
        prompt: Вы говорите, что раньше принимали критику на свой счёт. Какая фраза подходит?
        options:
          - I used to take criticism personally.
          - I value direct feedback because it saves time.
          - Now I ask for feedback early.
        answer: I used to take criticism personally.
        explanation: Used to описывает прежнюю привычку.
      - id: q4
        prompt: Вы говорите, что теперь просите обратную связь раньше. Какая фраза подходит?
        options:
          - Now I ask for feedback early.
          - I used to take criticism personally.
          - In code reviews, I focus on the code, not the person.
        answer: Now I ask for feedback early.
        explanation: Now называет изменение после замечания.
      - id: q5
        prompt: Вы называете ритуал команды в конце спринта. Какая фраза подходит?
        options:
          - We review how the sprint went at the end of each cycle.
          - One teammate once told me that I explained things too quickly.
          - I value direct feedback because it saves time.
        answer: We review how the sprint went at the end of each cycle.
        explanation: Фраза описывает регулярный разбор спринта.
      - id: q6
        prompt: Вы объясняете, как даёте фидбек на код-ревью. Какая фраза подходит?
        options:
          - In code reviews, I focus on the code, not the person.
          - I work well with people who disagree with me.
          - Our team agreed to review every pull request within a day.
        answer: In code reviews, I focus on the code, not the person.
        explanation: Фраза говорит о предмете комментариев на ревью.
  - type: exercise
    id: feedback-choice
    title: Формулировка для собеседования
    instruction: Выберите формулировку, которая подходит для ответа на собеседовании.
    format: choice
    items:
      - id: q1
        prompt: Вы рассказываете, как отреагировали на жёсткий отзыв.
        options:
          - I was defensive at first, then I asked for an example and took the comments on board.
          - I decided that the reviewer was wrong and ignored the comments.
          - I complained to my manager about the reviewer.
        answer: I was defensive at first, then I asked for an example and took the comments on board.
        explanation: Образец называет свою реакцию и действие; остальные варианты игнорируют отзыв или переносят вину.
      - id: q2
        prompt: Вы описываете, как даёте фидбек коллеге.
        options:
          - I describe what I noticed, explain why it matters and suggest a change.
          - I tell people exactly what I think of them.
          - I mention problems only in front of the whole team.
        answer: I describe what I noticed, explain why it matters and suggest a change.
        explanation: Образец говорит о работе и содержит причину и предложение; остальные варианты оценивают человека или ставят его в неловкое положение.
      - id: q3
        prompt: Вы рассказываете о коллеге, который указал на проблему в вашей работе.
        options:
          - A teammate pointed out that my change was too large, and I split it.
          - A teammate was rude about my change, so I stopped talking to him.
          - A teammate always criticises my work.
        answer: A teammate pointed out that my change was too large, and I split it.
        explanation: Образец называет замечание по существу и действие; в остальных вариантах нет изменения или есть оценка человека.
      - id: q4
        prompt: Вы говорите о правилах команды.
        options:
          - Our team agreed to review every pull request within a day.
          - Nobody follows the rules in my team.
          - My manager decides who is right.
        answer: Our team agreed to review every pull request within a day.
        explanation: Образец называет общее правило; остальные варианты жалуются на команду или руководителя.
