  - type: explanation
    id: lifestyle
    title: Υγεία — здоровый образ жизни
    body: |-
      **Η υγεία** — здоровье. Вы знаете тост **Στην υγειά μας!** (модуль 08): там разговорная форма υγειά с ударением на конце, а в тексте о здоровье пишут **η υγεία**.

      Два похожих прилагательных. **Υγιής** — «здоровый» о человеке: **Ο παππούς μου είναι υγιής.** Склонение особое: ο υγιής, η υγιής, το υγιές; мн. ч. **οι υγιείς**. **Υγιεινός, υγιεινή, υγιεινό** — «полезный для здоровья» о еде и образе жизни: **υγιεινό φαγητό, υγιεινή διατροφή**. Человек — υγιής, еда — υγιεινή.

      **Η διατροφή** — питание. **Η γυμναστική** — физкультура, зарядка, спорт для здоровья: **κάνω γυμναστική**. **Ο ύπνος** — сон (Πάω για ύπνο, модуль 05): **Χρειάζομαι οκτώ ώρες ύπνο.**

      **Καπνίζω** — курить. **Έκοψα το τσιγάρο.** — «Я бросил(а) курить»: το τσιγάρο — сигарета, κόβω (аорист έκοψα) — «резать, прекращать». **Αδυνατίζω** — худеть, **παχαίνω** — полнеть; аорист у них разный: **αδυνάτισα**, но **πάχυνα**. **Κάνω δίαιτα.** — «Я на диете».
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Είμαι υγιής.
          - Я здоров(а).
        - - Τρώω υγιεινά.
          - Я питаюсь правильно.
        - - Κάνω γυμναστική κάθε πρωί.
          - Каждое утро делаю зарядку.
        - - Έχω άγχος.
          - У меня стресс.
        - - Δεν καπνίζω.
          - Я не курю.
        - - Αδυνάτισα δύο κιλά.
          - Я похудел(а) на два килограмма.
        - - Πάχυνα λίγο.
          - Я немного поправился (поправилась).
