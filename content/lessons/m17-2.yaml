  - type: exercise
    id: article-tf
    about: article
    title: Верно или неверно
    instruction: Прочитайте статью. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Όταν κάποιος είναι συνέχεια κουρασμένος, συνήθως είναι άρρωστος.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Συνήθως δεν είναι άρρωστοι, αλλά δεν ζουν σωστά.
      - id: q2
        prompt: Αν θέλετε να αδυνατίσετε, πρέπει να κάνετε δύσκολη δίαιτα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν χρειάζεται δύσκολη δίαιτα — достаточно есть мало сладкого.
      - id: q3
        prompt: Αν δεν έχετε χρόνο για γυμναστική, μπορείτε να περπατάτε κάθε μέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Περπατάτε μισή ώρα κάθε μέρα.
      - id: q4
        prompt: Ο γιατρός λέει ότι χρειαζόμαστε επτά με οκτώ ώρες ύπνο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Όταν δεν κοιμόμαστε αρκετά, δεν τρώμε γλυκά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Наоборот — τρώμε πιο πολλά γλυκά, «едим больше сладкого».
      - id: q6
        prompt: Το άγχος είναι κακό για την καρδιά.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q7
        prompt: Ο γιατρός λέει ότι είναι εύκολο να κόψετε το τσιγάρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν είναι εύκολο — «это нелегко».
  - type: exercise
    id: article-choice
    about: article
    title: Выберите ответ
    instruction: Прочитайте статью ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Что врач советует есть?
        options:
          - много фруктов, овощей и рыбы
          - много мяса и мало овощей
          - только салаты
        answer: много фруктов, овощей и рыбы
        explanation: Τρώτε πολλά φρούτα και λαχανικά, ψάρι και λίγο κρέας.
      - id: q2
        prompt: Как часто врач советует делать зарядку (γυμναστική)?
        options:
          - три раза в неделю
          - каждый день по полчаса
          - раз в неделю
        answer: три раза в неделю
        explanation: Каждый день по полчаса — это ходьба для тех, у кого нет времени на зарядку.
      - id: q3
        prompt: Что помогает не заболеть зимой?
        options:
          - часто мыть руки
          - много спать
          - пить много чая
        answer: часто мыть руки
  - type: explanation
    id: listen-how
    title: Как слушать жалобы
    body: |-
      В первом задании экзаменационного аудирования к описанию подбирают картинки; в приложении картинки заменены короткими описаниями по-русски. Две картинки лишние, и они похожи на верные: например, девочка в одном описании держится за щёку, в другом — за живот.

      Сначала прочитайте все описания. В первый раз слушайте, о ком речь, во второй — что именно болит: после με, σε, τον, την + πονάει называют часть тела.

      Вы услышите вопрос **Τι έχετε;** — «Что с вами?» (дословно «что у вас?») и аорист **έφαγε** — «съела» (τρώω, έφαγα).
  - type: listening
    id: family
    title: Όλοι είμαστε άρρωστοι!
    plays: 2
    transcript:
      - speaker: Δέσποινα
        text: Γεια σου, Ελένη! Τι κάνεις; Έρχεστε το Σάββατο για φαγητό;
      - speaker: Ελένη
        text: Γεια σου, Δέσποινα. Όχι, δεν μπορούμε. Όλοι είμαστε άρρωστοι!
      - speaker: Δέσποινα
        text: Όλοι; Τι έχετε;
      - speaker: Ελένη
        text: Ο Κώστας έχει γρίπη. Είναι στο κρεβάτι από την Τετάρτη και βήχει όλη τη νύχτα.
      - speaker: Δέσποινα
        text: Και τα παιδιά;
      - speaker: Ελένη
        text: Η Μαρίνα πήγε χθες στο ζαχαροπλαστείο με τις φίλες της και έφαγε πολλά γλυκά. Σήμερα την πονάει ένα δόντι.
      - speaker: Δέσποινα
        text: Την πονάει και η κοιλιά της;
      - speaker: Ελένη
        text: Όχι, η κοιλιά της είναι εντάξει. Μόνο το δόντι. Αύριο πάμε στον γιατρό.
      - speaker: Δέσποινα
        text: Και ο Στέλιος;
      - speaker: Ελένη
        text: Ο Στέλιος πήγε εκδρομή με το σχολείο. Περπάτησε δεκαπέντε χιλιόμετρα, και τώρα τον πονάει το γόνατό του.
      - speaker: Δέσποινα
        text: Δεκαπέντε χιλιόμετρα; Πολλά είναι! Και η γιαγιά;
      - speaker: Ελένη
        text: Η γιαγιά καθάρισε όλο το σπίτι, και τώρα την πονάει η πλάτη της.
      - speaker: Δέσποινα
        text: Κι εσύ; Πώς νιώθεις;
      - speaker: Ελένη
        text: Εγώ δεν έχω γρίπη, αλλά είμαι πολύ κουρασμένη. Κάνω όλες τις δουλειές στο σπίτι, και σήμερα με πονάει το κεφάλι μου.
      - speaker: Δέσποινα
        text: Πρέπει να πας νωρίς για ύπνο σήμερα! Αν θέλεις, αύριο σου φέρνω φαγητό.
      - speaker: Ελένη
        text: Ευχαριστώ πολύ, Δέσποινα! Ερχόμαστε το άλλο Σάββατο, εντάξει;
      - speaker: Δέσποινα
        text: Εντάξει! Γεια σου!
  - type: exercise
    id: family-match
    about: family
    title: Кто что чувствует
    instruction: Прослушайте разговор. Какая картинка подходит к каждому члену семьи? Две картинки лишние.
    format: match
    bank:
      - мужчина лежит в кровати и кашляет
      - девочка держится за щёку — болит зуб
      - девочка держится за живот
      - мальчик держится за колено
      - пожилая женщина держится за спину
      - пожилая женщина держится за колено
      - женщина держится за голову
    items:
      - id: m1
        prompt: Костас, муж Елены
        answer: мужчина лежит в кровати и кашляет
        explanation: Έχει γρίπη… είναι στο κρεβάτι και βήχει όλη τη νύχτα.
      - id: m2
        prompt: Марина, дочь
        answer: девочка держится за щёку — болит зуб
        explanation: "Την πονάει ένα δόντι. Ловушка: Деспина спрашивает про живот, но Елена отвечает «Όχι»."
      - id: m3
        prompt: Стелиос, сын
        answer: мальчик держится за колено
        explanation: Τον πονάει το γόνατό του.
      - id: m4
        prompt: бабушка
        answer: пожилая женщина держится за спину
        explanation: Την πονάει η πλάτη της.
      - id: m5
        prompt: Елена
        answer: женщина держится за голову
        explanation: Με πονάει το κεφάλι μου.
  - type: exercise
    id: family-choice
    about: family
    title: Выберите ответ
    instruction: Прослушайте разговор ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: С какого дня Костас лежит в кровати?
        options:
          - со среды
          - с четверга
          - с субботы
        answer: со среды
        explanation: Από την Τετάρτη. Суббота — день, когда их ждали в гости.
      - id: q2
        prompt: Почему у Марины болит зуб?
        options:
          - она съела много сладкого
          - она много ходила
          - у неё грипп
        answer: она съела много сладкого
      - id: q3
        prompt: Сколько километров прошёл Стелиос?
        options:
          - 15 км
          - 5 км
          - 50 км
        answer: 15 км
        explanation: Δεκαπέντε χιλιόμετρα.
      - id: q4
        prompt: Что Деспина предлагает сделать сама?
        options:
          - принести завтра еду
          - сходить с Мариной к врачу
          - убрать дом
        answer: принести завтра еду
        explanation: Αύριο σου φέρνω φαγητό. К врачу Елена завтра идёт с Мариной сама.
