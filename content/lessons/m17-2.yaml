  - type: exercise
    id: health-gap
    title: Здоровье и самочувствие
    instruction: Вставьте слово. Одно слово лишнее.
    format: gap
    bank:
      - άρρωστη
      - κουρασμένος
      - υγιεινό
      - υγιής
      - ζαλίζομαι
      - καπνίζει
      - αδυνάτισε
      - πάχυνε
      - πλένομαι
    items:
      - id: g1
        prompt: Η Σοφία δεν ήρθε στο μάθημα, γιατί είναι ___.
        answer: άρρωστη
      - id: g2
        prompt: Σήμερα δούλεψα δώδεκα ώρες και είμαι πολύ ___.
        answer: κουρασμένος
      - id: g3
        prompt: Η σαλάτα με ψάρι είναι ένα ___ φαγητό.
        answer: υγιεινό
        explanation: О еде — υγιεινός; το φαγητό — средний род.
      - id: g4
        prompt: Ο παππούς μου είναι ογδόντα χρονών, αλλά είναι ακόμα ___ — δεν είναι ποτέ άρρωστος.
        answer: υγιής
        explanation: О человеке — υγιής.
      - id: g5
        prompt: Όταν δεν τρώω πρωινό, ___.
        answer: ζαλίζομαι
      - id: g6
        prompt: Ο Νίκος ___ πολύ — ένα πακέτο τσιγάρα κάθε μέρα.
        answer: καπνίζει
      - id: g7
        prompt: Η Άννα έκανε δίαιτα και ___ πέντε κιλά.
        answer: αδυνάτισε
        explanation: После диеты худеют — αδυνάτισε. Πάχυνε — «поправилась».
      - id: g8
        prompt: Κάθε πρωί σηκώνομαι και ___ με κρύο νερό.
        answer: πλένομαι
  - type: explanation
    id: article-how
    title: Как читать статью
    body: |-
      Статья о здоровье в журнале или на сайте обычно устроена просто: вступление и несколько советов, у каждого — свой заголовок. Сначала прочитайте заголовки: они подскажут, где искать ответ. Потом читайте абзац, о котором спрашивает задание.

      В советах много повелительных форм на «вы» (модуль 12): **κάντε** — «делайте» (κάνω, έκανα), **βρείτε** — «найдите» (βρίσκω, βρήκα), **κόψτε** — «бросьте» (κόβω, έκοψα). Совет дают и настоящим временем: **Τρώτε πολλά φρούτα** — «Ешьте много фруктов» — форма та же, что «вы едите».
  - type: reading
    id: article
    title: Πέντε συμβουλές για καλή υγεία
    text: |-
      Ο γιατρός Μάριος Αντωνίου απαντάει στους αναγνώστες μας.

      Πολλοί άνθρωποι μου λένε: «Γιατρέ, είμαι συνέχεια κουρασμένος» ή «Με πονάει συχνά το κεφάλι μου». Συνήθως δεν είναι άρρωστοι, αλλά δεν ζουν σωστά. Αν θέλετε να είστε υγιείς, σας δίνω πέντε απλές συμβουλές.

      Διατροφή. Τρώτε πολλά φρούτα και λαχανικά, ψάρι και λίγο κρέας. Το πρωινό είναι πολύ σημαντικό: χωρίς πρωινό πολλοί άνθρωποι ζαλίζονται το μεσημέρι. Αν θέλετε να αδυνατίσετε, δεν χρειάζεται δύσκολη δίαιτα. Τρώτε λίγα γλυκά!

      Γυμναστική. Κάντε γυμναστική τρεις φορές την εβδομάδα. Αν δεν έχετε χρόνο, περπατάτε μισή ώρα κάθε μέρα.

      Ύπνος. Χρειαζόμαστε επτά με οκτώ ώρες ύπνο. Όταν δεν κοιμόμαστε αρκετά, τρώμε πιο πολλά γλυκά και παχαίνουμε.

      Άγχος. Το άγχος είναι κακό για την καρδιά και για το στομάχι. Βρείτε λίγο χρόνο για τον εαυτό σας: μια βόλτα, μουσική, ένας καφές με φίλους.

      Τσιγάρο. Αν καπνίζετε, κόψτε το! Δεν είναι εύκολο, αλλά μετά από δύο-τρεις μήνες νιώθετε πολύ καλύτερα.

      Και κάτι ακόμα: τον χειμώνα πολλοί άνθρωποι έχουν γρίπη ή κρυολόγημα. Πλένετε συχνά τα χέρια σας — έτσι δεν αρρωσταίνετε εύκολα.
    glosses:
      - text: συμβουλές
        russian: советы
      - text: αναγνώστες
        russian: читатели
      - text: συνέχεια
