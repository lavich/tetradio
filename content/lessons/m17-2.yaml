blocks:
  - type: explanation
    id: illness
    title: Болеть, простыть, устать
    body: |-
      **Άρρωστος, άρρωστη** — больной, больная: **Είμαι άρρωστος.** **Αρρωσταίνω** — заболевать; чаще всего вы скажете его в аористе: **Αρρώστησα!** — «Я заболел(а)!»

      **Το κρυολόγημα** — простуда, **η γρίπη** — грипп: **Έχω γρίπη.** «Я простужен(а)» — **Είμαι κρυωμένος** (женщина — **κρυωμένη**).

      **Κουρασμένος** — уставший, от κουράζομαι «уставать» (модуль 15): **Είμαι πολύ κουρασμένη.** Как прилагательное, оно меняется по родам: κουρασμένος, κουρασμένη, κουρασμένο.

      **Ζαλίζομαι** — «у меня кружится голова», глагол на -μαι, как έρχομαι: **Όταν δεν τρώω πρωινό, ζαλίζομαι.** Так же спрягается **πλένομαι** — «умываться, мыться»: **Το πρωί σηκώνομαι και πλένομαι.**

      **Το άγχος** — стресс, тревога: **Έχω άγχος για τις εξετάσεις.**
    table:
