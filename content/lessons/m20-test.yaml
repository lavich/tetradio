title: Контрольная модуля 20
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. Главное в грамматике — сравнение: πιο … από + винительный падеж, καλύτερος и χειρότερος, ο πιο … и τόσο … όσο. После контрольной — пробный экзамен M2: повторите заодно будущее время с θα и слабые местоимения.
  - type: reading
    id: orestis
    title: Ένα καινούργιο άθλημα
    text: |-
      Γεια σου, Σοφία!

      Πώς είσαι; Από τον Σεπτέμβριο ασχολούμαι με ένα καινούργιο άθλημα: παίζω μπάσκετ σε μια μικρή ομάδα στη Λάρνακα. Παίζουμε δύο φορές την εβδομάδα, την Τρίτη και την Παρασκευή το βράδυ.

      Πέρσι έκανα κολύμπι, αλλά το μπάσκετ μου αρέσει περισσότερο. Το κολύμπι είναι πιο υγιεινό, αλλά το μπάσκετ είναι πιο ενδιαφέρον και δεν βαριέμαι ποτέ. Στην ομάδα δεν είμαι ο καλύτερος παίκτης — είμαι ο πιο κοντός από όλους! Αλλά προσπαθώ πολύ.

      Την Κυριακή παίζουμε τον πρώτο μας αγώνα, στις έξι το απόγευμα. Θέλεις να έρθεις; Μετά θα πάμε όλοι μαζί για φαγητό.

      Τα λέμε,
      Ορέστης
  - type: exercise
    id: orestis-tf
    about: orestis
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Ο Ορέστης παίζει μπάσκετ από τον Σεπτέμβριο.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q2
        prompt: Η ομάδα του παίζει τρεις φορές την εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δύο φορές — во вторник и в пятницу.
      - id: q3
        prompt: Στον Ορέστη αρέσει περισσότερο το κολύμπι από το μπάσκετ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Το μπάσκετ μου αρέσει περισσότερο.
      - id: q4
        prompt: Ο Ορέστης λέει ότι το κολύμπι είναι πιο υγιεινό.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Ο Ορέστης είναι ο πιο ψηλός παίκτης της ομάδας.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Είμαι ο πιο κοντός από όλους — самый невысокий.
      - id: q6
        prompt: Ο πρώτος αγώνας είναι την Κυριακή το απόγευμα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: listening
    id: weekend
    title: Μετά το σαββατοκύριακο
    plays: 2
    transcript:
      - speaker: Ισμήνη
        text: Καλημέρα, Νεοκλή! Είδες τον αγώνα χθες;
      - speaker: Νεοκλής
        text: Όχι, ήμουν στο θέατρο με τη γυναίκα μου. Ποιος κέρδισε;
      - speaker: Ισμήνη
        text: Η ομάδα μας έχασε, δύο μηδέν. Οι παίκτες ήταν πολύ κουρασμένοι.
      - speaker: Νεοκλής
        text: Α, όχι! Το θέατρο ήταν πολύ ωραίο. Οι ηθοποιοί ήταν πολύ καλοί.
      - speaker: Ισμήνη
        text: Εγώ προτιμώ το σινεμά. Το θέατρο είναι πιο ακριβό και συχνά βαριέμαι.
      - speaker: Νεοκλής
        text: Τι θα κάνεις αυτό το Σάββατο;
      - speaker: Ισμήνη
        text: Το πρωί θα πάω στο γυμναστήριο. Πάω κάθε Σάββατο. Το βράδυ θα ξεκουραστώ στο σπίτι.
      - speaker: Νεοκλής
        text: Θέλεις να έρθεις μαζί μας στη συναυλία στο πάρκο; Το εισιτήριο κάνει μόνο δέκα ευρώ.
      - speaker: Ισμήνη
        text: Γιατί όχι; Τι ώρα αρχίζει;
      - speaker: Νεοκλής
        text: Στις εννέα. Σε περιμένουμε μπροστά στο πάρκο στις εννέα παρά τέταρτο.
      - speaker: Ισμήνη
        text: Ωραία, τα λέμε εκεί!
  - type: exercise
    id: weekend-choice
    about: weekend
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Где Неоклис был вчера?
        options:
          - в театре
          - на матче
          - в кино
        answer: в театре
      - id: q2
        prompt: Как закончился матч?
        options:
          - их команда проиграла
          - их команда выиграла
          - матча не было
        answer: их команда проиграла
        explanation: Η ομάδα μας έχασε, δύο μηδέν.
      - id: q3
        prompt: Что Исмини говорит о театре?
        options:
          - он дороже кино
          - он дешевле кино
          - он интереснее кино
        answer: он дороже кино
        explanation: Το θέατρο είναι πιο ακριβό.
      - id: q4
        prompt: Что Исмини делает каждую субботу утром?
        options:
          - ходит в спортзал
          - отдыхает дома
          - ходит в кино
        answer: ходит в спортзал
        explanation: Отдыхать дома она собирается вечером.
      - id: q5
        prompt: Сколько стоит билет на концерт?
        options:
          - 10 €
          - 9 €
          - 12 €
        answer: 10 €
        explanation: Δέκα ευρώ. Εννέα — время начала.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q2
        prompt: Το μπάσκετ είναι πιο ενδιαφέρον ___ το τένις.
        options:
          - από
          - όσο
          - πιο
        answer: από
      - id: q3
        prompt: Ο Κώστας είναι πιο μεγάλος από ___.
        options:
          - ο Νίκος
          - τον Νίκο
          - του Νίκου
        answer: τον Νίκο
        explanation: После από — винительный падеж.
      - id: q5
        prompt: Η Άννα είναι ___ μαθήτρια της τάξης. (самая лучшая)
        options:
          - η καλύτερη
          - καλύτερη
          - η πιο καλύτερη
        answer: η καλύτερη
      - id: q6
        prompt: Η Ελένη δεν είναι τόσο ψηλή όσο ___.
        options:
          - η αδελφή της
          - την αδελφή της
          - της αδελφής της
        answer: η αδελφή της
        explanation: После όσο — тот же падеж, что у Η Ελένη, то есть именительный. После από было бы την αδελφή της.
      - id: q7
        prompt: Ο Νίκος τρώει ___ από μένα. (больше)
        options:
          - περισσότερο
          - πιο
          - περισσότερος
        answer: περισσότερο
        explanation: «Больше» при глаголе — наречие περισσότερο (или πιο πολύ); πιο одно не стоит, а περισσότερος — прилагательное.
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите прилагательное в нужной форме — одно слово.
    format: text
    items:
      - id: q1
        prompt: Αυτή η ταινία είναι ___ από εκείνη. (καλός — «лучше»)
        answer:
          - καλύτερη
      - id: q2
        prompt: Οι καφέδες εδώ είναι πιο ___ από τους καφέδες στο κέντρο. (φτηνός)
        answer:
          - φτηνοί
          - φθηνοί
      - id: q3
        prompt: Τα παπούτσια μου είναι πιο ___ από τα δικά σου. (καινούργιος)
        answer:
          - καινούργια
          - καινούρια
      - id: q4
        prompt: Ο Πέτρος είναι ο ___ παίκτης της ομάδας. (κακός — «самый плохой»)
        answer:
          - χειρότερος
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - η ταινία
      - η συναυλία
      - ο ηθοποιός
      - το γήπεδο
      - η ομάδα
      - ο αγώνας
      - το τραγούδι
      - ο παίκτης
      - το χόμπι
    items:
      - id: m1
        prompt: фильм
        answer: η ταινία
      - id: m2
        prompt: концерт
        answer: η συναυλία
      - id: m3
        prompt: актёр
        answer: ο ηθοποιός
      - id: m4
        prompt: стадион
        answer: το γήπεδο
      - id: m5
        prompt: команда
        answer: η ομάδα
      - id: m6
        prompt: песня
        answer: το τραγούδι
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы хотите узнать, какой фильм идёт в кино.
        options:
          - Τι ταινία παίζει;
          - Ποιος κέρδισε;
          - Ποιο είναι το χόμπι σου;
        answer: Τι ταινία παίζει;
      - id: q2
        prompt: Друг спрашивает «Πάμε σινεμά απόψε;», а вы устали и хотите побыть дома.
        options:
          - Όχι, απόψε θέλω να ξεκουραστώ.
          - Ναι, πάμε!
          - Ποια ομάδα υποστηρίζεις;
        answer: Όχι, απόψε θέλω να ξεκουραστώ.
      - id: q3
        prompt: Вам интересно, за какую команду болеет коллега.
        options:
          - Ποια ομάδα υποστηρίζεις;
          - Ποιος κέρδισε;
          - Πού είναι το γήπεδο;
        answer: Ποια ομάδα υποστηρίζεις;
      - id: q4
        prompt: Вы хотите сказать, что у вас мало свободного времени.
        options:
          - Δεν έχω πολύ ελεύθερο χρόνο.
          - Έχω πολύ ελεύθερο χρόνο.
          - Τι κάνεις στον ελεύθερο χρόνο σου;
        answer: Δεν έχω πολύ ελεύθερο χρόνο.
