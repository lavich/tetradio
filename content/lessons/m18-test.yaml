title: Контрольная модуля 18
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, грамматика, слова и ситуации. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Диалог звучит два раза. В нём вы услышите **βάζω** — «кладу, закапываю» (о каплях) и **Για να δω** — «Посмотрим». Главное в грамматике — вид повелительного наклонения (один раз — πάρε, регулярно — πίνε) и запрет μην + форма, как после να.
  - type: reading
    id: katerina
    title: Ήμουν στον γιατρό
    text: |-
      Γεια σου, Αντρέα!

      Ήμουν σήμερα στον γιατρό. Με εξέτασε και είπε ότι δεν είναι κάτι σοβαρό — έχω γρίπη. Αντιβίωση δεν χρειάζομαι. Μου έγραψε ένα σιρόπι για τον βήχα, τρεις φορές την ημέρα, και χάπια για τον πυρετό. Πρέπει να μείνω στο σπίτι τρεις μέρες και να πίνω πολλά υγρά. Μου έδωσε και ιατρική βεβαίωση για τη δουλειά.

      Μπορείς να περάσεις από το φαρμακείο μετά τη δουλειά; Η συνταγή είναι στο ΓεΣΥ — ο φαρμακοποιός τη βρίσκει με την ταυτότητά μου. Φέρε και έναν χυμό, σε παρακαλώ. Αλλά μην αγοράσεις γλυκά — ο γιατρός λέει να τα αποφεύγω!

      Φιλιά,
      Κατερίνα
    glosses:
      - text: να περάσεις από
        russian: зайти в
      - text: ταυτότητά
        russian: удостоверение личности (η ταυτότητα)
  - type: exercise
    id: katerina-tf
    about: katerina
    graded: true
    title: Чтение
    instruction: Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Η Κατερίνα έχει κάτι σοβαρό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Δεν είναι κάτι σοβαρό — έχω γρίπη.
      - id: q2
        prompt: Ο γιατρός της έγραψε αντιβίωση.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Αντιβίωση δεν χρειάζομαι.
      - id: q3
        prompt: Η Κατερίνα παίρνει το σιρόπι τρεις φορές την ημέρα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Η Κατερίνα πρέπει να μείνει στο σπίτι μία εβδομάδα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Τρεις μέρες.
      - id: q5
        prompt: Ο γιατρός έδωσε στην Κατερίνα ιατρική βεβαίωση.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q6
        prompt: Ο φαρμακοποιός βρίσκει τη συνταγή με την ταυτότητα της Κατερίνας.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Рецепт ΓεΣΥ электронный — в аптеке его находят по удостоверению личности.
  - type: listening
    id: doctor
    title: Στο ιατρείο
    plays: 2
    transcript:
      - speaker: Κυριάκος
        text: Καλημέρα, κυρία Μαρίνα. Ελάτε. Τι έχετε;
      - speaker: Μαρίνα
        text: Καλημέρα, γιατρέ. Με πονάει πολύ το αυτί μου.
      - speaker: Κυριάκος
        text: Από πότε;
      - speaker: Μαρίνα
        text: Από την Κυριακή. Τη νύχτα δεν κοιμάμαι καλά.
      - speaker: Κυριάκος
        text: Έχετε πυρετό;
      - speaker: Μαρίνα
        text: Λίγο. Χθες το βράδυ είχα τριάντα οκτώ.
      - speaker: Κυριάκος
        text: Για να δω… Ναι, το αυτί σας είναι κόκκινο. Δεν είναι κάτι σοβαρό, αλλά χρειάζεστε θεραπεία. Σας γράφω σταγόνες για το αυτί.
      - speaker: Μαρίνα
        text: Πώς τις βάζω;
      - speaker: Κυριάκος
        text: Τρεις σταγόνες δύο φορές την ημέρα, το πρωί και το βράδυ, για πέντε μέρες.
      - speaker: Μαρίνα
        text: Χρειάζομαι αντιβίωση;
      - speaker: Κυριάκος
        text: Όχι, δεν χρειάζεται. Αν πονάτε πολύ, πάρτε ένα χάπι για τον πόνο. Και μην κολυμπάτε στη θάλασσα αυτή την εβδομάδα.
      - speaker: Μαρίνα
        text: Μπορώ να πάω στη δουλειά;
      - speaker: Κυριάκος
        text: Ναι, μπορείτε. Αν σε πέντε μέρες σας πονάει ακόμα, ελάτε πάλι.
      - speaker: Μαρίνα
        text: Οι σταγόνες καλύπτονται από το ΓεΣΥ;
      - speaker: Κυριάκος
        text: Ναι. Με τη συνταγή πληρώνετε στο φαρμακείο μόνο ένα ευρώ.
      - speaker: Μαρίνα
        text: Ευχαριστώ πολύ, γιατρέ.
      - speaker: Κυριάκος
        text: Να γίνετε γρήγορα καλά!
  - type: exercise
    id: doctor-choice
    about: doctor
    graded: true
    title: Аудирование
    instruction: Прослушайте диалог и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Что болит у Марины?
        options:
          - ухо
          - горло
          - голова
        answer: ухо
      - id: q2
        prompt: С какого дня?
        options:
          - с воскресенья
          - с субботы
          - с понедельника
        answer: с воскресенья
        explanation: Από την Κυριακή.
      - id: q3
        prompt: Что выписал врач?
        options:
          - капли для уха
          - антибиотики
          - сироп
        answer: капли для уха
        explanation: Σας γράφω σταγόνες για το αυτί. Антибиотики не нужны.
      - id: q4
        prompt: Как применять лекарство?
        options:
          - три капли два раза в день, пять дней
          - две капли три раза в день, пять дней
          - три капли два раза в день, три дня
        answer: три капли два раза в день, пять дней
      - id: q5
        prompt: Что врач запретил?
        options:
          - плавать в море
          - ходить на работу
          - принимать таблетку от боли
        answer: плавать в море
        explanation: Μην κολυμπάτε στη θάλασσα αυτή την εβδομάδα. На работу ходить можно, таблетку от боли — тоже.
      - id: q6
        prompt: Сколько Марина заплатит в аптеке?
        options:
          - 1 €
          - ничего
          - 10 €
        answer: 1 €
        explanation: Με τη συνταγή πληρώνετε μόνο ένα ευρώ.
  - type: exercise
    id: grammar
    graded: true
    title: Грамматика
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Έχεις πυρετό; ___ στο κρεβάτι σήμερα!
        options:
          - Μείνε
          - Μείνεις
          - Έμεινες
        answer: Μείνε
        explanation: Совет другу — повелительное наклонение μείνε. Μείνεις без να (или μην) не употребляется, έμεινες — прошедшее время.
      - id: q2
        prompt: ___ πολύ νερό κάθε μέρα.
        options:
          - Πίνε
          - Πιες
          - Ήπιες
        answer: Πίνε
        explanation: Κάθε μέρα — регулярно, поэтому πίνε.
      - id: q3
        prompt: Κύριε Γιώργο, μην ___!
        options:
          - ανησυχείτε
          - ανησυχείς
          - ανησύχησε
        answer: ανησυχείτε
        explanation: К κύριε Γιώργο — на «вы».
      - id: q4
        prompt: Μην ___ αλκοόλ με την αντιβίωση! (на «ты»)
        options:
          - πίνεις
          - πίνε
          - ήπιες
        answer: πίνεις
        explanation: После μην — форма, как после να, а не повелительное.
      - id: q5
        prompt: Πρέπει να ___ ένα χάπι τώρα. (εσύ)
        options:
          - πάρεις
          - πάρε
          - πήρες
        answer: πάρεις
      - id: q6
        prompt: Ο πυρετός είναι σαράντα. Πρέπει ___ πάτε στα επείγοντα αμέσως.
        options:
          - να
          - μην
          - δεν
        answer: να
      - id: q7
        prompt: ___ πρέπει να πίνετε καφέ.
        options:
          - Δεν
          - Μην
          - Να
        answer: Δεν
        explanation: "Δεν πρέπει να… — «нельзя». Πρέπει не меняется по лицам, а отрицание при нём — δεν: μην ставят перед формой, как после να (μην πίνετε)."
  - type: exercise
    id: forms
    graded: true
    title: Напишите форму
    instruction: Напишите форму повелительного наклонения.
    format: text
    items:
      - id: q1
        prompt: ___ ένα χάπι τώρα. (παίρνω · на «вы» · один раз)
        answer:
          - Πάρτε
      - id: q2
        prompt: ___ πολλά υγρά. (πίνω · на «ты» · регулярно)
        answer:
          - Πίνε
      - id: q3
        prompt: ___ εδώ, παρακαλώ. (ξαπλώνω · на «вы» · один раз)
        answer:
          - Ξαπλώστε
      - id: q4
        prompt: ___ τον πυρετό τώρα. (μετράω · на «ты» · один раз)
        answer:
          - Μέτρησε
  - type: exercise
    id: words
    graded: true
    title: Слова
    instruction: Соедините русское слово с греческим. Три греческих слова лишние.
    format: match
    bank:
      - ο φαρμακοποιός
      - η συνταγή
      - το ραντεβού
      - ο οδοντίατρος
      - τα επείγοντα
      - η παρενέργεια
      - η ασφάλεια
      - η δόση
      - το θερμόμετρο
    items:
      - id: m1
        prompt: фармацевт
        answer: ο φαρμακοποιός
      - id: m2
        prompt: рецепт
        answer: η συνταγή
      - id: m3
        prompt: запись на приём
        answer: το ραντεβού
      - id: m4
        prompt: стоматолог
        answer: ο οδοντίατρος
      - id: m5
        prompt: отделение неотложной помощи
        answer: τα επείγοντα
      - id: m6
        prompt: побочное действие
        answer: η παρενέργεια
  - type: exercise
    id: situations
    graded: true
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Вы звоните в клинику, чтобы записаться.
        options:
          - Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό.
          - Να γίνεις γρήγορα καλά!
          - Πόσες φορές την ημέρα;
        answer: Θα ήθελα να κλείσω ένα ραντεβού με τον γιατρό.
      - id: q2
        prompt: Друг заболел. Что вы ему пожелаете?
        options:
          - Να γίνεις γρήγορα καλά!
          - Μην ανησυχείτε!
          - Καλή όρεξη!
        answer: Να γίνεις γρήγορα καλά!
        explanation: Μην ανησυχείτε — на «вы», а с другом говорят на «ты».
      - id: q3
        prompt: Фармацевт даёт вам лекарство. Вы хотите узнать, сколько раз его принимать.
        options:
          - Πόσες φορές την ημέρα;
          - Από πότε έχετε αυτά τα συμπτώματα;
          - Τι ώρα είναι ελεύθερος ο γιατρός;
        answer: Πόσες φορές την ημέρα;
      - id: q4
        prompt: Врач спрашивает об аллергии. У вас (вы — мужчина) аллергия на пенициллин.
        options:
          - Είμαι αλλεργικός στην πενικιλίνη.
          - Έχω πυρετό από χθες.
          - Χρειάζεται συνταγή γι' αυτό το φάρμακο;
        answer: Είμαι αλλεργικός στην πενικιλίνη.
