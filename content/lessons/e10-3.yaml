  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: "Вы начинаете ответ на вопрос «Tell me about a mistake you made». Какая фраза подходит?"
        options:
          - I'd like to talk about a time I broke production.
          - We rolled the change back within ten minutes.
          - Since then, I haven't made the same mistake.
        answer: I'd like to talk about a time I broke production.
        explanation: Рассказ открывает фраза-вступление.
      - id: q2
        prompt: Вы называете свою долю ответственности. Какая фраза подходит?
        options:
          - It was my mistake, and I take full responsibility.
          - We added a check to the deployment pipeline.
          - The outage lasted about forty minutes.
        answer: It was my mistake, and I take full responsibility.
        explanation: Прямое признание решения вашим — отдельный шаг ответа.
      - id: q3
        prompt: Вы называете вывод — не торопиться под давлением. Какая фраза подходит?
        options:
          - It taught me to slow down when I'm under pressure.
          - I assumed it was safe, and I was wrong.
          - We made sure it couldn't happen again.
        answer: It taught me to slow down when I'm under pressure.
        explanation: Вывод из случая вводят словами It taught me…
      - id: q4
        prompt: Вы говорите, что с того случая вы не повторяли эту ошибку. Какая фраза подходит?
        options:
          - Since then, I haven't made the same mistake.
          - Let me give you an example.
          - The root cause turned out to be a missing index.
        answer: Since then, I haven't made the same mistake.
        explanation: Связь прошлого случая с настоящим передаёт since then и present perfect.
      - id: q5
        prompt: Вы говорите, что теперь перепроверяете изменения перед развёртыванием. Какая фраза подходит?
        options:
          - I've learned to double-check before I deploy.
          - If I had tested it first, I would have caught the bug.
          - I wish I had read the logs more carefully.
        answer: I've learned to double-check before I deploy.
        explanation: Привычка, появившаяся после случая, — I've learned to…
      - id: q6
        prompt: Вы говорите, что сегодня, зная больше, созвали бы встречу раньше. Какая фраза подходит?
        options:
          - Knowing what I know now, I would have called a meeting sooner.
          - It's better to admit a mistake than to hide it.
          - I informed the team as soon as I noticed.
        answer: Knowing what I know now, I would have called a meeting sooner.
        explanation: Фраза Knowing what I know now… вводит оценку прошлого решения.
  - type: exercise
    id: blame-choice
    title: Формулировка для собеседования
    instruction: Выберите формулировку, которая подходит для ответа на собеседовании.
    format: choice
    items:
      - id: q1
        prompt: Вы описываете причину сбоя.
        options:
          - My manager never listened, so the outage was his fault.
          - The review was skipped, and I merged the change without a second check.
          - My teammate forgot to test it, so I had to fix everything.
        answer: The review was skipped, and I merged the change without a second check.
        explanation: Образец говорит о процессе и называет свою долю; в двух других вариантах виноват другой человек.
      - id: q2
        prompt: Вы оцениваете своё решение.
        options:
          - I am terrible at deployments.
          - I misjudged the risk of the change.
          - Everyone makes mistakes, so it does not matter.
        answer: I misjudged the risk of the change.
        explanation: Фраза называет конкретное решение; оценка себя в целом и отказ от разбора не показывают вывода.
      - id: q3
        prompt: Вы описываете последствия.
        options:
          - The client lost a very large sum because of it.
          - A large customer was affected for about an hour.
          - The customer was careless and caused it.
        answer: A large customer was affected for about an hour.
        explanation: Последствия названы фактом, без внутренних цифр и без обвинения клиента.
      - id: q4
        prompt: Вы заканчиваете рассказ.
        options:
          - It was nobody's fault, so nothing changed.
          - It was my mistake, and we added a check to the pipeline.
          - I worked all night and saved the whole project.
        answer: It was my mistake, and we added a check to the pipeline.
        explanation: Окончание называет вашу долю и изменение процесса; в остальных нет вывода или есть рассказ о подвиге.
