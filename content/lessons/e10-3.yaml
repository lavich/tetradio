  - type: explanation
    id: safe-mistake
    title: Какую ошибку выбрать и как о ней говорить
    body: |-
      Для ответа подходит ошибка, которую можно исправить и разобрать: пропущенная проверка, неверная оценка срока, сбой после релиза. Случаи, в которых пострадали люди, нарушены закон, безопасность данных или соглашение о неразглашении, для собеседования не выбирают.

      Говорите о процессе. Свою долю называйте прямо, действия коллег по имени не оценивайте, названия клиентов и внутренние цифры не приводите. Критерий ответа — вывод и изменение практики. Самоуничижение и рассказ о подвиге («я всю ночь спасал компанию») в ответ не входят; интервьюеру нужны факты и то, что вы изменили.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - my colleague forgot to review it
          - the review was skipped
          - говорят о процессе
        - - I'm terrible at deployments
          - I misjudged the risk of the change
          - называют решение
        - - it was nobody's fault
          - it was my mistake, and we added a check
          - доля названа прямо, процесс изменён
        - - I worked all night and saved the project
          - We rolled the change back within ten minutes
          - факты без героизации
        - - a named client lost a large sum
          - a large customer was affected for about an hour
          - без названий и внутренних цифр
