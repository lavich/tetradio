blocks:
  - type: explanation
    id: scheme
    title: Ответ об ошибке в шести шагах
    body: |-
      Вопрос **Tell me about a mistake you made** проверяет, как вы относитесь к ошибке: называете ли свою долю, что делаете, чтобы исправить, и что меняете. Ответ укладывается примерно в две минуты и идёт по шагам, на каждом хватает одной-трёх фраз.

      **1. Вступление.** Назовите случай одной фразой: **I'd like to talk about a time I broke production.** Можно начать с итога: **The biggest mistake I made was not asking for a review.**

      **2. Что произошло.** Факты в past simple: **I changed a query and merged it without a review.** Решение, которое оказалось неверным, называют прямо: **I assumed it was safe, and I was wrong.**

      **3. Ваша доля.** Скажите прямо, что решение было вашим: **It was my mistake, and I take full responsibility.** Одной фразы достаточно.

      **4. Что вы сделали.** Действия по порядку: **I informed the team as soon as I noticed. We rolled the change back within ten minutes.**

      **5. Что изменилось.** Конкретное изменение процесса: **We added a check to the deployment pipeline. These days, I never deploy without a rollback plan.**

      **6. Вывод.** Что вы вынесли: **It taught me to slow down when I'm under pressure.** Если уместно, добавьте, что сделали бы иначе: **Knowing what I know now, I would have called a meeting sooner.** Завершите тем, что изменилось с тех пор: **Since then, I haven't made the same mistake.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - вступление
          - 5 секунд
          - I'd like to talk about a time I broke production.
        - - что произошло
          - 30 секунд
          - I assumed it was safe, and I was wrong.
        - - ваша доля
