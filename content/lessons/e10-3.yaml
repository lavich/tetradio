  - type: writing
    id: postmortem
    register: formal
    prompt: "Напишите краткий постмортем вымышленного сбоя (80–120 слов): что произошло, влияние, причина, шаги исправления. Описывайте процесс, не называйте людей и компании."
    words: { min: 80, max: 120 }
    model: |-
      Summary: On Thursday evening, our notification service sent duplicate emails to about three thousand users for twenty minutes. Impact: no data was lost, and support received eleven tickets. Root cause: a retry setting was changed without a review, so many messages were sent twice. Timeline: the change was deployed at 18:10, the alert fired at 18:22, and the team rolled the change back at 18:30. Corrective actions: we added a review requirement for configuration changes and a check that blocks duplicate retries. If the alert had been stricter, we would have noticed sooner. Nobody was blamed; the process allowed the change to reach users.
    criteria:
      - 80–120 слов, есть итог, влияние, причина, хронология и шаги исправления
      - События описаны в past simple, действия над системой — в passive
      - Есть одна конструкция conditional 3 или should have
      - Причина названа через процесс, без имён и обвинений
      - Формальный стиль без сокращений
      - Цифры вымышленные, названий клиентов и компаний нет
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Десятый ответ вашего **банка ответов** — вопрос об ошибке: **Tell me about a mistake you made.** К нему добавляется уточнение интервьюера: **What would you do differently?** Первый ответ занимает до двух минут, второй — до 45 секунд.

      1) Выберите одну поправимую ошибку и разложите её по шести шагам: вступление, что произошло, ваша доля, действия, изменение, вывод. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: ваша доля названа прямо, причина описана через процесс, есть изменение практики. 4) Для второго вопроса назовите один-два шага, которые вы сделали бы иначе, с конструкцией would или would have.

      Сцена в конце урока повторяет вопросы интервьюера. Реплики записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: mistake
    part: interview
    prompt: "Интервьюер спрашивает: «Tell me about a mistake you made.» Ответьте за 120 секунд: что произошло, ваша доля, действия, что изменилось и вывод."
    seconds: 120
    model: "I'd like to talk about a time I broke production. At my previous company, I was working on a reporting service when I changed a database query late on a Friday afternoon. I assumed it was safe, and I merged it without asking for a review. That was my mistake, and I take full responsibility. The query was slow on real data, so the service responded slowly for about forty minutes. An alert fired, and I informed the team as soon as I noticed. We rolled the change back within ten minutes of the decision, and I wrote the first draft of the postmortem the next day. The root cause was the process: nothing required a review for database changes, and the staging environment had much less data than production. If I had asked for a review, a colleague would have seen the problem. We added a check to the deployment pipeline, and we made a review mandatory for queries on large tables. It taught me to slow down when I'm under pressure. These days, I never deploy without a rollback plan, and I haven't made the same mistake since then."
    criteria:
      - Назван случай, факты в past simple
      - Своя доля названа прямо, с I
      - Причина описана через процесс, без обвинения коллег
      - Действия идут по порядку, названо, кого и когда известили
      - Есть изменение практики и вывод
      - Использована одна конструкция conditional 3, should have или wish
      - Использованы не меньше трёх фраз урока
      - Нет названий клиентов и компаний, выручки и внутренних цифр
      - Ответ укладывается в 120 секунд
  - type: speaking
    id: differently
    part: monologue
    prompt: "Интервьюер уточняет: «What would you do differently?» Ответьте за 45 секунд: один-два шага, которые вы сделали бы иначе."
    seconds: 45
    model: "In hindsight, I would ask for a review before merging, and I would not merge late on a Friday. I would also add a sanity check to the pipeline from the start, so the process would not depend on me remembering it. If I had known how little data the staging environment had, I would have tested on a larger copy."
    criteria:
      - Названы один-два конкретных шага
      - Есть конструкция would или would have
      - Шаги касаются процесса и своих действий
      - Нет обвинения коллег
      - Ответ укладывается в 45 секунд
