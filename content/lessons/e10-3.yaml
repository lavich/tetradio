  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании, вопросы задаёт Ingrid, руководитель разработки. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику назовите случай и расскажите, что произошло и какова ваша доля. На вторую назовите последствия. На третью скажите, что изменилось и что вы вынесли. На четвёртую назовите, что сделали бы иначе. На последнюю поблагодарите. Вся ваша часть — 120 секунд, каждая реплика — две-четыре фразы.
    seconds: 120
    model: |-
      Ingrid: Thanks for joining. Let's talk about mistakes. Tell me about a mistake you made at work.
      You: I'd like to talk about a time I broke production. I changed a database query late on a Friday and merged it without a review. I assumed it was safe, and I was wrong. It was my mistake, and I take full responsibility.
      Ingrid: Mm-hm. What was the impact?
      You: The service was slow for about forty minutes, and some users saw errors. No data was lost. I informed the team as soon as I noticed, and we rolled the change back.
      Ingrid: I see. What did you change afterwards, and what did you learn?
      You: We made a review mandatory for database changes and added a check to the pipeline. It taught me to slow down when I'm under pressure.
      Ingrid: Thank you. Last question: what would you do differently?
      You: I would ask for a review first, and I would not merge on a Friday afternoon. If I had asked, a colleague would have seen the problem.
      Ingrid: Thank you. That was a clear answer.
      You: Thank you for the questions. It was useful to talk it through.
    criteria:
      - Ответили на все пять реплик по порядку, каждая — две-четыре фразы
      - В первой реплике названы случай, факты и своя доля
      - Последствия названы фактом, без внутренних цифр и обвинений
      - Названо изменение процесса и вывод
      - В четвёртой реплике есть конструкция would или would have
      - В конце есть благодарность
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "The incident ___ by the on-call engineer within ten minutes. (был замечен)"
        options: [was noticed, noticed, was noticing]
        answer: was noticed
        explanation: Действие совершается над инцидентом, поэтому нужен passive.
      - id: q2
        prompt: "I ___ in this team since 2022. (до сих пор)"
        options: [have been, was, am]
        answer: have been
        explanation: Since и связь с настоящим — present perfect.
      - id: q3
        prompt: "You ___ ask for a review before you merge. (совет)"
        options: [should, to should, would to]
        answer: should
        explanation: Совет выражается глаголом should; после него нет to.
      - id: q4
        prompt: "By the time I noticed the problem, the job ___ twice. (запустилась раньше)"
        options: [had run, will run, runs]
        answer: had run
        explanation: Более раннее событие стоит в past perfect — had и третья форма глагола.
      - id: q5
        prompt: "Could you tell me what ___ after the rollback?"
        options: [happened, did happen, it happened]
        answer: happened
        explanation: В косвенном вопросе порядок слов как в утверждении, без did.
      - id: q6
        prompt: "Next quarter we ___ the on-call rotation. (уже решено)"
        options: [are changing, might to change, will to change]
        answer: are changing
        explanation: План с решением — present continuous.
