        prompt: Пишу вам, чтобы спросить о бланке.
        answer:
          - Σας γράφω για να ρωτήσω για το έντυπο.
          - Σας γράφω για να σας ρωτήσω για το έντυπο.
          - Σας γράφω για να ρωτήσω για ένα έντυπο.
          - Σας γράφω για να ρωτήσω σχετικά με το έντυπο.
        explanation: Ρωτάω για + вин. п. — «спрашиваю о…».
      - id: q2
        prompt: Я хотел(а) бы спросить, можно ли оплатить счёт картой.
        answer:
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω τον λογαριασμό με κάρτα.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω με κάρτα τον λογαριασμό.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω τον λογαριασμό με την κάρτα.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω το λογαριασμό με κάρτα.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω με κάρτα το λογαριασμό.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω τον λογαριασμό μου με κάρτα.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω το λογαριασμό με την κάρτα.
          - Θα ήθελα να ρωτήσω αν μπορώ να πληρώσω το λογαριασμό μου με κάρτα.
      - id: q3
        prompt: Прилагаю копию удостоверения личности.
        answer:
          - Επισυνάπτω αντίγραφο της ταυτότητάς μου.
          - Επισυνάπτω ένα αντίγραφο της ταυτότητάς μου.
          - Επισυνάπτω αντίγραφο ταυτότητας.
          - Επισυνάπτω ένα αντίγραφο ταυτότητας.
          - Επισυνάπτω αντίγραφο της ταυτότητας.
        explanation: "Второй тонос: ταυτότητα + μου → της ταυτότητάς μου."
  - type: writing
    id: address-change
    register: formal
    prompt: "Вы переехали. Напишите письмо (80–100 слов) в службу, которая присылает вам счета за электричество (η υπηρεσία ρεύματος). Представьтесь; скажите, с какого числа вы живёте по новому адресу, и дайте адрес полностью (улица и номер, индекс, город); попросите изменить адрес в вашем счёте (αλλάζω — менять, модуль 11); спросите, нужны ли ещё документы; попросите прислать бланк и скажите, что прилагаете копию удостоверения личности."
    words:
      min: 80
      max: 100
    model: |-
      Αξιότιμε κύριε / Αξιότιμη κυρία,

      Με λένε Όλγα Σοροκίνα. Σας γράφω για τον λογαριασμό του ρεύματος. Από τις 3 Νοεμβρίου μένω σε καινούργιο σπίτι και θα ήθελα να αλλάξω τη διεύθυνση στον λογαριασμό μου. Η καινούργια διεύθυνσή μου είναι: Οδός Ερμού 12, 6023 Λάρνακα. Θα ήθελα επίσης να ρωτήσω αν χρειάζονται άλλα δικαιολογητικά. Θα μπορούσατε να μου στείλετε το έντυπο με email; Επισυνάπτω αντίγραφο της ταυτότητάς μου. Αν χρειάζεστε κάτι άλλο, το τηλέφωνό μου είναι 99 456 782.

      Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας.

      Με εκτίμηση,
      Όλγα Σοροκίνα
    criteria:
      - 80–100 слов; официальное обращение (Αξιότιμε κύριε / Αξιότιμη κυρία,) и концовка (Με εκτίμηση, + имя и фамилия)
      - Всё письмо на «вы» (σας, στείλετε, χρειάζεστε) — нет Γεια σου, Τι κάνεις;, Τα λέμε!
      - Сказано, кто вы и зачем пишете (Με λένε…, Σας γράφω για…)
      - "Дата переезда и полный адрес: улица и номер, индекс, город"
      - "Хотя бы две вежливые формулы: Θα ήθελα να…, Θα ήθελα να ρωτήσω αν…, Θα μπορούσατε να…;"
      - Сказано, что приложено (Επισυνάπτω αντίγραφο…)
      - "После να — форма от основы аориста (να αλλάξω, να ρωτήσω, να στείλετε); второй тонос: τη διεύθυνσή μου, της ταυτότητάς μου, την απάντησή σας"
  - type: explanation
    id: speaking-how
    title: Ролевая игра — в банке
    body: |-
      В третьей части устного экзамена вы разыгрываете ситуацию с другим экзаменуемым. Здесь один из вас — клиент банка, другой — служащий. Прочитайте обе роли и сыграйте обе по очереди: так вы выучите фразы и клиента, и служащего.

      **Клиент**: Θα ήθελα να ανοίξω λογαριασμό. Τι δικαιολογητικά χρειάζονται; Θα μπορούσα να… (φέρω, πληρώσω)…; Θα ήθελα να ρωτήσω και κάτι άλλο… Πότε θα έχω την κάρτα μου;

      **Служащий**: Καλημέρα σας. Μπορώ να σας βοηθήσω; Χρειάζεται / χρειάζονται… Συμπληρώστε αυτό το έντυπο, παρακαλώ. Υπογράψτε εδώ. Η προθεσμία είναι…

      Обе стороны говорят на «вы». Полезно: **Ορίστε** — «Вот, пожалуйста» (модуль 10), **Βεβαίως** — «Конечно», **περίπου** — «примерно». Запишите разговор и сверьте с образцом и критериями.
  - type: speaking
    id: bank-roleplay
    part: roleplay
    prompt: |-
      Ролевая игра «В банке». Прочитайте обе роли, потом сыграйте диалог вслух (сначала за клиента, потом за служащего) и запишите.

      Роль A — клиент. Вы недавно живёте на Кипре и хотите открыть счёт. Поздоровайтесь и скажите, что вам нужно; спросите, какие документы нужны; дайте паспорт и скажите, что счёта за электричество у вас с собой нет, — спросите, можно ли принести его завтра; спросите, когда будет карта и можно ли сегодня внести деньги; попрощайтесь.

      Роль B — служащий. Поздоровайтесь и спросите, чем помочь; назовите документы (паспорт или удостоверение и счёт за электричество или воду с адресом); скажите срок — одна неделя; попросите заполнить бланк (фамилия, адрес, индекс) и подписать; скажите, что карту пришлют по адресу примерно через десять дней; ответьте, что внести деньги можно завтра, когда клиент принесёт счёт (сегодня счёт ещё не открыт).
