blocks:
  - type: explanation
    id: post
    title: На почте
    body: |-
      На почте (**στο ταχυδρομείο**, модуль 12) отправляют письма и посылки. Конверт — **ο φάκελος** (мн. ч. οι φάκελοι; это же слово значит «папка» для документов), марка — **το γραμματόσημο**, посылка — **το δέμα** (мн. ч. τα δέματα, как το πρόγραμμα — τα προγράμματα). Официальное письмо — **η επιστολή** (урок 1). Заказное письмо — **συστημένη επιστολή** (συστημένος, -η, -ο): его отдают только под подпись.

      Отправитель — **ο αποστολέας** (мн. ч. οι αποστολείς), получатель — **ο παραλήπτης** (мн. ч. οι παραλήπτες). Получать посылку или документ — **παραλαμβάνω**. В аористе приращение стоит после приставки, как у υπέγραψα: παρα- + έλαβα → **παρέλαβα**; будущее — θα παραλάβω. В разговоре о посылке можно сказать и проще — **πήρα**: Πήρα το δέμα.

      **Ανανεώνω** — продлевать, обновлять (ανανέωσα, θα ανανεώσω): Πρέπει να ανανεώσω το διαβατήριό μου. **Επίσημος** — официальный (επίσημος, επίσημη, επίσημο): επίσημη επιστολή, επίσημο έντυπο. **Το παράπονο** — жалоба (мн. ч. τα παράπονα): Θα ήθελα να κάνω ένα παράπονο. Έχω ένα παράπονο.

      Если не знаете, где взять бланк, спросите: **Πού μπορώ να βρω το έντυπο;**
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - ο φάκελος, οι φάκελοι
          - конверт; папка
        - - το γραμματόσημο
          - марка
        - - το δέμα, τα δέματα
          - посылка
        - - συστημένη επιστολή
          - заказное письмо
        - - ο αποστολέας — ο παραλήπτης
          - отправитель — получатель
        - - παραλαμβάνω — παρέλαβα — θα παραλάβω
          - получать (посылку, документ)
        - - ανανεώνω — ανανέωσα — θα ανανεώσω
          - продлевать, обновлять
        - - Θα ήθελα να κάνω ένα παράπονο.
          - Я хотел(а) бы подать жалобу.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: post-gap
    title: На почте
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - γραμματόσημο
      - δέμα
      - συστημένη
      - αποστολέας
      - παρέλαβα
      - ανανεώσω
      - παραλήπτης
      - παράπονο
    items:
      - id: g1
        prompt: Θέλω να στείλω αυτόν τον φάκελο στην Ελλάδα. Πόσο κάνει το ___;
        answer: γραμματόσημο
        explanation: На конверт наклеивают марку — το γραμματόσημο.
      - id: g2
        prompt: Το ___ είναι βαρύ, γιατί μέσα έχει βιβλία και ρούχα.
        answer: δέμα
      - id: g3
        prompt: Θέλω να στείλω μια ___ επιστολή, γιατί μέσα είναι το διαβατήριό μου.
        answer: συστημένη
        explanation: Важный документ отправляют заказным письмом — συστημένη επιστολή (ж. р., как η επιστολή).
      - id: g4
        prompt: Ο ___ είναι ο άνθρωπος που στέλνει το δέμα.
        answer: αποστολέας
        explanation: Тот, кто отправляет, — ο αποστολέας; тот, кто получает, — ο παραλήπτης.
      - id: g5
        prompt: Χθες ___ ένα δέμα από τη μητέρα μου.
        answer: παρέλαβα
        explanation: Χθες — прошлое, аорист παρέλαβα (приращение после приставки).
      - id: g6
        prompt: Το διαβατήριό μου ισχύει μόνο μέχρι τον Μάιο. Πρέπει να το ___. (ισχύει — действителен)
        answer: ανανεώσω
        explanation: "После πρέπει να — форма от основы аориста: να ανανεώσω."
  - type: explanation
    id: listen-how
    title: Как слушать официальный разговор
    body: |-
      Сейчас вы услышите разговор на почте. Это официальный диалог на «вы», как в четвёртом задании экзамена: нужно сделать **заметки** — записать город, число, одно-два слова.

      Сначала прочитайте все семь вопросов. В первый раз слушайте общий смысл, во второй — записывайте. Будьте внимательны: в разговоре звучат несколько чисел — вес посылки, дни, две суммы и время. Запишите то, о чём спрашивают.

      Вы услышите: **Πώς μπορώ να σας βοηθήσω;** — «Чем могу вам помочь?»; **Βεβαίως** — «Конечно»; **Να το ζυγίσω** — «Сейчас взвешу» (ζυγίζω, модуль 10); **η ταχεία αποστολή** — срочное отправление; **τα δικά σας** — «ваши (данные)»; **Όλα μαζί** — «всё вместе».
