  - type: explanation
    id: letter-how
    title: Официальное письмо — план
    body: |-
      Задание B письменного экзамена — **официальный текст** 80–100 слов: письмо или email в учреждение. План из шести шагов:

      1. **Обращение**: Αξιότιμε κύριε / Αξιότιμη κυρία, — если имени нет; Αξιότιμη κυρία Νικολάου, — если есть.
      2. **Кто вы и зачем пишете**: Με λένε… **Σας γράφω για** τον λογαριασμό του ρεύματος. / **Σας γράφω για να ρωτήσω…**
      3. **Суть**: что случилось и что вам нужно — Θα ήθελα να… (αλλάξω, ανανεώσω, ανοίξω…).
      4. **Вопрос**: **Θα ήθελα να ρωτήσω αν** χρειάζονται άλλα δικαιολογητικά.
      5. **Просьба и приложение**: **Θα μπορούσατε να μου στείλετε** το έντυπο; **Επισυνάπτω** αντίγραφο της ταυτότητάς μου.
      6. **Концовка**: Σας ευχαριστώ εκ των προτέρων. Περιμένω την απάντησή σας. Με εκτίμηση, — имя и фамилия.

      Проверьте себя. Всё письмо — на «вы»: σας, μπορείτε, χρειάζεστε. Никаких Γεια σου, Τι κάνεις;, Τα λέμε!. После θα ήθελα να, θα μπορούσατε να — для одной просьбы обычно форма от основы аориста (να ρωτήσω, να στείλετε). Второй тонос: τη διεύθυνσή μου, της ταυτότητάς μου, την απάντησή σας.
  - type: exercise
    id: formal-sentences
    title: Фразы для официального письма
    instruction: Переведите на греческий. Знак в конце можно не ставить.
    format: text
    items:
