blocks:
  - type: explanation
    id: easter
    title: Πάσχα — Пасха
    body: |-
      Православная Пасха — главный праздник года на Кипре и в Греции. Её дата чаще всего не совпадает с католической. Многие едут на праздник в родную деревню, к семье. Спросить об этом: **Πού θα κάνετε Πάσχα;** — «Где вы будете встречать Пасху?». Ответ: Θα κάνουμε Πάσχα στο χωριό.

      **Η Μεγάλη Εβδομάδα** — Страстная неделя, последняя неделя перед Пасхой. В эти дни желают **Καλή Ανάσταση!**, а до праздника вообще — **Καλό Πάσχα!**. Красят яйца в красный цвет (**βάφουμε κόκκινα αυγά**), на Кипре пекут **φλαούνες** — пасхальные пироги с сыром.

      **Η Ανάσταση** — Воскресение и ночная пасхальная служба. В субботу поздно вечером многие идут в церковь, у каждого в руках **λαμπάδα** — пасхальная свеча. В полночь звучит **Χριστός ανέστη!** — «Христос воскресе!», и отвечают **Αληθώς ανέστη!** — «Воистину воскресе!». Так здороваются и поздравляют друг друга ещё около сорока дней — до Вознесения.

      После службы и в воскресенье **τσουγκρίζουμε αυγά** — бьёмся крашеными яйцами: один говорит «Χριστός ανέστη!», другой — «Αληθώς ανέστη!». Чьё яйцо не разбилось, тот выиграл. В воскресенье — большой семейный обед, часто — мясо на вертеле (**η σούβλα**), музыка, танцы.

      **Γιορτινός** — праздничный: **το γιορτινό τραπέζι** — праздничный стол, γιορτινά ρούχα — праздничная одежда. **Το γλέντι** — застолье, гулянье с музыкой и танцами.
    table:
      columns:
        - когда
        - что говорят
      rows:
        - - до Пасхи
          - Καλό Πάσχα!
        - - в Страстную неделю
          - Καλή Ανάσταση! Καλό Πάσχα!
        - - с пасхальной полуночи — около сорока дней
          - Χριστός ανέστη! — Αληθώς ανέστη!
        - - любой праздник
          - Χρόνια πολλά!
  - type: explanation
    id: kataklysmos
    title: Катаклизмос, выходные и парады
    body: |-
      **Ο Κατακλυσμός** — кипрский праздник воды (κατακλυσμός — «потоп»). Его отмечают в дни Пятидесятницы (Троицы) — на пятидесятый день от Пасхи; понедельник после неё — выходной. Праздник проходит у моря, в прибрежных городах, самый известный — в Ларнаке: несколько дней концертов, ярмарки, игр и соревнований в воде, люди в шутку обливают друг друга водой.

      **Η αργία** — праздничный выходной: Η Καθαρά Δευτέρα είναι αργία. **Το έθιμο** — обычай (мн. ч. τα έθιμα): τα έθιμα του Πάσχα — пасхальные обычаи. **Η παράδοση** — традиция: Είναι παράδοση να τρώμε βασιλόπιτα την Πρωτοχρονιά.

      **Η παρέλαση** — парад. В национальные праздники (например, 25 марта и 28 октября) школьники на Кипре и в Греции проходят парадом: **Τα παιδιά κάνουν παρέλαση.**

      Ещё один вопрос о традициях: **Πώς γιορτάζετε τα Χριστούγεννα;** — «Как вы празднуете Рождество?» (у вас в семье, в вашей стране).
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: easter-gap
    title: Пасха и другие праздники
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - Ανάσταση
      - λαμπάδα
      - τσουγκρίζουμε
      - έθιμα
      - παρέλαση
      - γλέντι
      - βασιλόπιτα
      - γιορτινός
    items:
      - id: g1
        prompt: Το Μεγάλο Σάββατο το βράδυ πάμε στην εκκλησία για την ___.
        answer: Ανάσταση
      - id: g2
        prompt: Στην εκκλησία, τη νύχτα του Πάσχα, κάθε παιδί κρατάει μια ___. (κρατάει — держит)
        answer: λαμπάδα
      - id: g3
        prompt: Μετά την Ανάσταση ___ κόκκινα αυγά.
        answer: τσουγκρίζουμε
      - id: g4
        prompt: Το Πάσχα έχει πολλά ωραία ___ — τα κόκκινα αυγά, τις φλαούνες, τη σούβλα.
        answer: έθιμα
        explanation: "Πολλά ωραία — мн. ч. среднего рода: τα έθιμα."
      - id: g6
        prompt: Στις 25 Μαρτίου οι μαθητές κάνουν ___ στο κέντρο της πόλης.
        answer: παρέλαση
      - id: g7
        prompt: Μετά το φαγητό είχαμε μεγάλο ___ με μουσική και χορό.
        answer: γλέντι
        explanation: "Μεγάλο — средний род: το γλέντι."
  - type: explanation
    id: read-how
    title: Как читать рассказ о празднике
    body: |-
      Стелла рассказывает, как её семья встретила Пасху в деревне. Сначала прочитайте текст целиком и поймите, где и когда это было. Потом следите за словами порядка — **πρώτα, έπειτα, στο τέλος**: на экзамене часто спрашивают, что было раньше, а что позже.

      Смотрите и на время глаголов: аорист (πήγαμε, φάγαμε) — события, παρατατικός (πηγαίναμε, κρατούσαν, χορεύαμε) — то, что повторялось или длилось. Незнакомые слова переведены под текстом.
  - type: reading
    id: easter-village
    title: Το Πάσχα στο χωριό
    text: |-
      Πέρσι κάναμε Πάσχα στο χωριό της γιαγιάς μου, κοντά στη Λεμεσό. Όταν ήμουν παιδί, πηγαίναμε εκεί κάθε χρόνο, αλλά τα τελευταία χρόνια μέναμε στη Λευκωσία για το Πάσχα.

      Τη Μεγάλη Εβδομάδα η γιαγιά έβαψε κόκκινα αυγά και φτιάξαμε όλοι μαζί φλαούνες. Το Μεγάλο Σάββατο το βράδυ πήγαμε στην εκκλησία. Όλοι κρατούσαν λαμπάδες. Στις δώδεκα ο παπάς είπε «Χριστός ανέστη!» και όλοι απάντησαν «Αληθώς ανέστη!». Έξω, στην αυλή, άναψαν μια μεγάλη φωτιά.

      Την Κυριακή πρώτα τσουγκρίσαμε αυγά — το δικό μου αυγό κέρδισε! Έπειτα ο θείος μου έψησε σούβλα. Φάγαμε, ήπιαμε και στο τέλος όλοι τραγουδούσαμε και χορεύαμε μέχρι το βράδυ. Ήταν ένα πραγματικό γλέντι. Του χρόνου θα πάμε πάλι!

      Στέλλα
    glosses:
      - text: τα τελευταία χρόνια
        russian: в последние годы
      - text: έβαψε
        russian: покрасила (βάφω — красить)
      - text: φτιάξαμε
        russian: сделали, приготовили (φτιάχνω)
      - text: φλαούνες
        russian: флаунес, кипрские пасхальные пироги с сыром
      - text: κρατούσαν
        russian: держали (κρατάω)
      - text: παπάς
        russian: священник
      - text: αυλή
        russian: двор
      - text: άναψαν
        russian: зажгли (ανάβω)
      - text: φωτιά
        russian: огонь, костёр
      - text: το δικό μου
        russian: моё
      - text: θείος
        russian: дядя
      - text: έψησε σούβλα
        russian: зажарил мясо на вертеле (ψήνω)
      - text: πραγματικό
        russian: настоящий
      - text: Του χρόνου
        russian: в следующем году
  - type: exercise
    id: easter-tf
    about: easter-village
    title: Верно или неверно
    instruction: Прочитайте рассказ. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Πέρσι η Στέλλα έκανε Πάσχα στη Λευκωσία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πέρσι κάναμε Πάσχα στο χωριό — в деревне бабушки. В Лефкосии они встречали Пасху в последние годы до этого.
      - id: q2
        prompt: Όταν ήταν παιδί, η Στέλλα πήγαινε στο χωριό κάθε Πάσχα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Πηγαίναμε εκεί κάθε χρόνο — παρατατικός, привычка.
      - id: q3
        prompt: Τα κόκκινα αυγά τα έβαψε η μητέρα της Στέλλας.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η γιαγιά έβαψε κόκκινα αυγά — бабушка.
      - id: q5
        prompt: Ο παπάς είπε «Αληθώς ανέστη!».
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Священник сказал «Χριστός ανέστη!», а люди ответили «Αληθώς ανέστη!».
      - id: q6
        prompt: Την Κυριακή πρώτα έφαγαν και μετά τσούγκρισαν αυγά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πρώτα τσουγκρίσαμε αυγά, έπειτα — σούβλα.
      - id: q7
        prompt: Στο τέλος όλοι τραγουδούσαν και χόρευαν.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: explanation
    id: listen-how
    title: Как слушать
    body: |-
      Андреас из Ларнаки рассказывает о Катаклизмосе: как праздновал в детстве и как — в этом году. Монолог звучит два раза. В первый раз поймите, где он живёт и с кем ходил на праздник. Во второй — следите за порядком событий (πρώτα, έπειτα, στο τέλος) и за тем, что было «каждый год», а что — «в этом году».

      Вы услышите: **φέτος** — в этом году, **τα παιχνίδια** — игры, **ρίχναμε νερό ο ένας στον άλλον** — брызгали друг на друга водой, **γελούσαμε** — смеялись, **τα μεσάνυχτα** — полночь, **υπέροχος** — чудесный.
  - type: listening
    id: kataklysmos-talk
    title: Ο Κατακλυσμός στη Λάρνακα
    plays: 2
    transcript:
      - speaker: Ανδρέας
        text: Γεια σας! Με λένε Ανδρέα και μένω στη Λάρνακα. Η αγαπημένη μου γιορτή είναι ο Κατακλυσμός. Είναι ένα κυπριακό έθιμο. Τον γιορτάζουμε πενήντα μέρες μετά το Πάσχα, και η Δευτέρα είναι αργία.
        audio: m22-2/kataklysmos-talk-1.mp3
      - speaker: Ανδρέας
        text: Όταν ήμουν παιδί, κάθε χρόνο πήγαινα στην παραλία με τους γονείς μου. Εκεί είχε μουσική, φαγητό και παιχνίδια στη θάλασσα. Εμείς τα παιδιά ρίχναμε νερό ο ένας στον άλλον και γελούσαμε πολύ.
        audio: m22-2/kataklysmos-talk-2.mp3
      - speaker: Ανδρέας
        text: Φέτος πήγα με τη γυναίκα μου και την κόρη μας. Πρώτα κάναμε μια βόλτα στην παραλία. Έπειτα είδαμε μια συναυλία. Στο τέλος φάγαμε σουβλάκια σε μια ταβέρνα δίπλα στη θάλασσα. Η κόρη μου ήθελε να μείνουμε μέχρι τα μεσάνυχτα! Ο Κατακλυσμός είναι μια υπέροχη παράδοση.
        audio: m22-2/kataklysmos-talk-3.mp3
  - type: exercise
    id: kataklysmos-tf
    about: kataklysmos-talk
    title: Верно или неверно
    instruction: Прослушайте монолог. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Ο Ανδρέας μένει στη Λεμεσό.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Μένω στη Λάρνακα.
      - id: q2
        prompt: Ο Κατακλυσμός είναι πριν από το Πάσχα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πενήντα μέρες μετά το Πάσχα — после Пасхи.
      - id: q3
        prompt: Τη Δευτέρα του Κατακλυσμού οι περισσότεροι δεν δουλεύουν. (του Κατακλυσμού — Катаклизмоса; οι περισσότεροι — большинство)
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Η Δευτέρα είναι αργία — выходной.
      - id: q4
        prompt: Όταν ήταν παιδί, ο Ανδρέας πήγε στη γιορτή μόνο μία φορά.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Κάθε χρόνο πήγαινα — каждый год (παρατατικός).
      - id: q5
        prompt: Φέτος ο Ανδρέας πήγε στη γιορτή με την οικογένειά του.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Με τη γυναίκα μου και την κόρη μας.
      - id: q6
        prompt: Φέτος πρώτα είδαν μια συναυλία και μετά έκαναν βόλτα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Πρώτα βόλτα, έπειτα συναυλία.
      - id: q7
        prompt: Στο τέλος έφαγαν σε μια ταβέρνα.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
  - type: explanation
    id: letter-how
    title: Письмо другу о празднике
    body: |-
      Задание A экзамена — дружеское письмо 80–100 слов. Друг спрашивает, как вы провели праздник. Расскажите по порядку.

      План:

      1. Приветствие и благодарность: Γεια σου, …! Ευχαριστώ για τις ευχές σου!
      2. Какой праздник, где и с кем: Τα Χριστούγεννα πήγαμε στους φίλους μας στη Λεμεσό.
      3. Что было по порядку — аорист и слова порядка: **Πρώτα… Έπειτα… Στο τέλος…**
      4. Описание, фон — ήταν, είχε, один-два παρατατικός: Όλοι τραγουδούσαν. Ήταν πολύ ωραία.
      5. Ваше впечатление: **Πέρασα πολύ ωραία!** (модуль 14)
      6. Вопрос другу, пожелание и прощание: Εσύ πώς πέρασες; Καλή χρονιά! Φιλιά, …

      Проверьте себя: события — в аористе (στολίσαμε, φάγαμε, ανοίξαμε), а в παρατατικός — только то, что длилось или повторялось. Τα Χριστούγεννα и τα κάλαντα — мн. ч.: Τα Χριστούγεννα ήταν… Подпишитесь вымышленным именем.
  - type: writing
    id: holiday-letter
    register: friendly
    prompt: "Ваш друг Фотис (Φώτης) из Салоник пишет: «Χρόνια πολλά! Πώς πέρασες τις γιορτές; Τι κάνατε τα Χριστούγεννα και την Πρωτοχρονιά;» Ответьте ему письмом 80–100 слов: где и с кем вы были, что делали по порядку (πρώτα, έπειτα, στο τέλος), какие обычаи видели и как вам понравилось. Спросите, как праздновал он, и поздравьте его."
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Φώτη!

      Ευχαριστώ για τις ευχές σου! Οι γιορτές ήταν πολύ ωραίες. Τον Δεκέμβριο στολίσαμε το δέντρο και το σπίτι. Την παραμονή των Χριστουγέννων ήρθαν παιδιά και μας είπαν τα κάλαντα. Τα Χριστούγεννα πήγαμε στους φίλους μας στη Λεμεσό. Πρώτα φάγαμε στο γιορτινό τραπέζι. Έπειτα ανοίξαμε τα δώρα. Στο τέλος όλοι τραγουδούσαν ελληνικά τραγούδια — εγώ τα ήξερα μόνο λίγο! Την Πρωτοχρονιά κόψαμε τη βασιλόπιτα και εγώ βρήκα το φλουρί! Πέρασα πολύ ωραία. Εσύ πώς πέρασες; Πού θα κάνεις Πάσχα; Έλα στην Κύπρο!

      Καλή χρονιά!
      Φιλιά,
      Λένα
    criteria:
      - 80–100 слов; дружеское приветствие и прощание, всё письмо на «ты»
      - Сказано, где и с кем вы праздновали
      - "События по порядку: πρώτα, έπειτα или μετά, στο τέλος"
      - "События — в аористе (στολίσαμε, φάγαμε, ανοίξαμε); хотя бы один παρατατικός для фона или привычки (τραγουδούσαν, ήξερα)"
      - Назван хотя бы один обычай (δέντρο, κάλαντα, βασιλόπιτα)
      - Есть впечатление (Πέρασα πολύ ωραία), вопрос другу и поздравление (Καλή χρονιά!, Χρόνια πολλά!)
      - "Τα Χριστούγεννα, τα κάλαντα — мн. ч.; κόψαμε, βρήκα — формы аориста без ошибок"
  - type: explanation
    id: speaking-how
    title: Монолог «Как я провёл праздник»
    body: |-
      Во второй части устного экзамена просят рассказать о себе — например, о празднике. План на одну минуту:

      1. Какой праздник вы любите и почему: Η αγαπημένη μου γιορτή είναι… γιατί…
      2. Где и с кем вы были в этом году.
      3. Что делали по порядку: Πρώτα… Έπειτα… Στο τέλος…
      4. Обычай — один-два: τσουγκρίζουμε αυγά, πετάμε χαρταετό, κόβουμε τη βασιλόπιτα.
      5. Как было раньше или как празднуют у вас на родине — с παρατατικός: Όταν ήμουν παιδί, …
      6. Планы с θα: Του χρόνου θα…

      Полезно: **πετάω χαρταετό** — запускать воздушного змея (πετούσαν — запускали), **νηστίσιμα φαγητά** — постная еда, **οι ελιές** — оливки. Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: my-holiday
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Ποια είναι η αγαπημένη σας γιορτή; Πώς την περάσατε φέτος;»
      Говорите около минуты по плану: что делали по порядку, какие обычаи, как было раньше. Запишите ответ.
    seconds: 90
    model: Η αγαπημένη μου γιορτή στην Κύπρο είναι η Καθαρά Δευτέρα, γιατί όλοι είναι έξω, στην εξοχή. Είναι αργία, και φέτος πήγαμε με τους φίλους μας σε ένα χωριό στο Τρόοδος. Πρώτα κάναμε μια μεγάλη βόλτα. Έπειτα φάγαμε νηστίσιμα φαγητά — ψωμί, ελιές και σαλάτες. Τα παιδιά πετούσαν χαρταετούς όλο το απόγευμα. Στο τέλος παίξαμε μουσική και όλοι χορεύαμε. Όταν ήμουν παιδί, στη Ρωσία δεν είχαμε αυτό το έθιμο, αλλά τώρα μου αρέσει πολύ. Του χρόνου θα πάμε πάλι στο βουνό.
    criteria:
      - Говорили около минуты, без долгих пауз
      - Назвали праздник и сказали, почему он вам нравится (γιατί…)
      - "Рассказали по порядку: πρώτα, έπειτα или μετά, στο τέλος — события в аористе"
      - Назвали хотя бы один обычай праздника
      - "Хотя бы один παρατατικός: как было раньше или что длилось (όταν ήμουν παιδί…, πετούσαν, χορεύαμε)"
      - Сказали о планах с θα (Του χρόνου θα…)
      - Ударение на своём месте (Καθαρά Δευτέρα, αργία, έθιμο, χορεύαμε)
