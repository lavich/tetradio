title: Контрольная модуля 04
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 12–15 минут: чтение, аудирование, числа, время и даты. Словарь и таблицы не открывайте — так результат покажет, что уже усвоено.

      Разговор звучит два раза; в нём встретится **σινεμά** — «кино». В заметках время и номера пишите цифрами. Ошибки не страшны: пояснения после ответа подскажут, что повторить.
  - type: reading
    id: party
    title: Ένα μήνυμα
    text: |-
      Γεια σου, Κατερίνα!

      Την Παρασκευή, 12 Μαρτίου, έχω γενέθλια και κάνω πάρτι στο σπίτι μου, στη Λεμεσό. Το πάρτι αρχίζει στις οκτώ και μισή το βράδυ. Έρχονται είκοσι άνθρωποι: φίλοι από τη δουλειά και η οικογένειά μου. Ο αδελφός μου ο Πέτρος έρχεται από την Αθήνα.

      Το Σάββατο το πρωί δουλεύω, αλλά το απόγευμα είμαι ελεύθερη. Πάμε για καφέ στις πέντε;

      Το καινούργιο μου τηλέφωνο: 96 23 58 04.

      Τα λέμε!
      Χριστίνα
    glosses:
      - text: έχω γενέθλια
        russian: у меня день рождения
      - text: κάνω πάρτι
        russian: устраиваю вечеринку
      - text: στο σπίτι μου
        russian: у меня дома
      - text: αρχίζει
        russian: начинается
      - text: Έρχονται
        russian: придут
      - text: τη δουλειά
        russian: работа
      - text: έρχεται
        russian: приезжает
      - text: καινούργιο
        russian: новый
  - type: exercise
    id: party-choice
    about: party
    graded: true
    title: Чтение
    instruction: Прочитайте сообщение и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Η Χριστίνα έχει γενέθλια…
        options:
          - την Παρασκευή.
          - το Σάββατο.
          - την Πέμπτη.
          - την Κυριακή.
        answer: την Παρασκευή.
      - id: q2
        prompt: Τι ώρα αρχίζει το πάρτι;
        options:
          - Στις 20:30.
          - Στις 18:30.
          - Στις 20:00.
          - Στις 21:30.
        answer: Στις 20:30.
        explanation: Στις οκτώ και μισή το βράδυ — 20:30.
      - id: q3
        prompt: Πόσοι άνθρωποι έρχονται στο πάρτι;
        options:
          - "12"
          - "20"
          - "30"
          - "8"
        answer: "20"
        explanation: είκοσι — 20. 12 — это число, дата праздника.
      - id: q4
        prompt: Το Σάββατο η Χριστίνα είναι ελεύθερη…
        options:
          - το πρωί.
          - το απόγευμα.
          - το βράδυ.
          - όλη τη μέρα.
        answer: το απόγευμα.
        explanation: Το Σάββατο το πρωί δουλεύω, αλλά το απόγευμα είμαι ελεύθερη.
      - id: q5
        prompt: Το τηλέφωνο της Χριστίνας είναι…
        options:
          - 96 23 58 04
          - 96 32 58 04
          - 69 23 58 04
          - 96 23 85 04
        answer: 96 23 58 04
  - type: listening
    id: call
    title: Πάμε σινεμά;
    plays: 2
    transcript:
      - speaker: Μιχάλης
        text: Γεια σου, Δέσποινα! Τι κάνεις;
      - speaker: Δέσποινα
        text: Καλά, Μιχάλη. Κι εσύ;
      - speaker: Μιχάλης
        text: Καλά. Είσαι ελεύθερη την Πέμπτη το βράδυ; Πάμε σινεμά;
      - speaker: Δέσποινα
        text: Την Πέμπτη δεν μπορώ, δουλεύω. Αλλά την Παρασκευή είμαι ελεύθερη.
      - speaker: Μιχάλης
        text: Ωραία! Την Παρασκευή στις οκτώ και μισή;
      - speaker: Δέσποινα
        text: Στις οκτώ και μισή δεν μπορώ. Στις εννιά παρά τέταρτο;
      - speaker: Μιχάλης
        text: Εντάξει. Πόσο κάνει το σινεμά;
      - speaker: Δέσποινα
        text: Επτά ευρώ. Πού βρισκόμαστε;
      - speaker: Μιχάλης
        text: Στο καφέ «Μύρτο», στη Λάρνακα. Και έχω άλλο τηλέφωνο τώρα. Ενενήντα επτά, δεκαέξι, ογδόντα, τριάντα τρία.
      - speaker: Δέσποινα
        text: Ενενήντα επτά, δεκαέξι, ογδόντα, τριάντα τρία. Εντάξει. Τα λέμε την Παρασκευή!
  - type: exercise
    id: call-notes
    about: call
    graded: true
    title: Аудирование — заметки
    instruction: Прослушайте разговор два раза и запишите коротко.
    format: text
    items:
      - id: n1
        prompt: День встречи
        answer:
          - Παρασκευή
          - την Παρασκευή
          - пятница
          - в пятницу
        explanation: В четверг Деспина работает, встреча — την Παρασκευή.
      - id: n2
        prompt: Время встречи
        answer:
          - "20:45"
          - "8:45"
          - "20.45"
          - "8.45"
          - εννιά παρά τέταρτο
          - στις εννιά παρά τέταρτο
        explanation: Στις οκτώ και μισή Деспина не может; договорились στις εννιά παρά τέταρτο — 20:45.
      - id: n3
        prompt: Сколько стоит кино, евро
        answer:
          - "7"
          - 7 ευρώ
          - 7 €
          - 7€
          - επτά
          - εφτά
          - επτά ευρώ
          - εφτά ευρώ
      - id: n4
        prompt: Новый телефон Михалиса
        answer:
          - "97168033"
          - 97 16 80 33
        explanation: ενενήντα επτά 97, δεκαέξι 16, ογδόντα 80, τριάντα τρία 33.
  - type: exercise
    id: call-choice
    about: call
    graded: true
    title: Аудирование — выбор
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Почему Деспина не может в четверг?
        options:
          - Она работает.
          - Она в Афинах.
          - У неё занятие.
        answer: Она работает.
        explanation: Την Πέμπτη δεν μπορώ, δουλεύω.
      - id: q2
        prompt: Где они встречаются?
        options:
          - в кафе в Ларнаке
          - в кинотеатре в Лимасоле
          - дома у Михалиса
        answer: в кафе в Ларнаке
  - type: exercise
    id: numbers-gap
    graded: true
    title: Числа и роды
    instruction: Вставьте число. Два варианта лишние.
    format: gap
    bank:
      - ένας
      - μία
      - τρεις
      - τρία
      - τέσσερις
      - διακόσια
      - διακόσιες
      - εκατόν
    items:
      - id: g1
        prompt: Έχω ___ παιδιά. (3)
        answer: τρία
        explanation: Το παιδί — средний род.
      - id: g2
        prompt: Η Άννα έχει ___ αδελφές. (3)
        answer: τρεις
      - id: g3
        prompt: Είναι ___ η ώρα. (1:00)
        answer: μία
        explanation: Η ώρα — женский род.
      - id: g4
        prompt: Ο Πέτρος είναι ___ φίλος μου. (1)
        answer: ένας
      - id: g5
        prompt: Το βιβλίο κάνει ___ ευρώ. (200; το βιβλίο — книга)
        answer: διακόσια
        explanation: Ευρώ — среднего рода, поэтому διακόσια.
      - id: g6
        prompt: Είναι ___ και τέταρτο. (4:15)
        answer: τέσσερις
  - type: exercise
    id: numbers-read
    graded: true
    title: Большие числа
    instruction: Напишите число цифрами.
    format: text
    items:
      - id: q1
        prompt: τετρακόσια πενήντα
        answer:
          - "450"
      - id: q2
        prompt: εκατόν δεκαπέντε
        answer:
          - "115"
      - id: q3
        prompt: εννιακόσια ογδόντα
        answer:
          - "980"
      - id: q4
        prompt: επτακόσια τρία
        answer:
          - "703"
  - type: exercise
    id: time-choice
    graded: true
    title: Время
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "9:30"
        options:
          - εννιά και μισή
          - δέκα και μισή
          - εννιά και τέταρτο
        answer: εννιά και μισή
      - id: q2
        prompt: "6:45"
        options:
          - επτά παρά τέταρτο
          - έξι παρά τέταρτο
          - έξι και τέταρτο
        answer: επτά παρά τέταρτο
      - id: q3
        prompt: "3:00"
        options:
          - Είναι τρεις.
          - Είναι τρία.
          - Είναι τρίτη.
        answer: Είναι τρεις.
      - id: q4
        prompt: «в час»
        options:
          - στη μία
          - στις ένα
          - στο ένα
        answer: στη μία
  - type: exercise
    id: dates-choice
    graded: true
    title: Дни и даты
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: «Сегодня 1 мая.»
        options:
          - Σήμερα είναι πρώτη Μαΐου.
          - Σήμερα είναι μία Μάιος.
          - Σήμερα είναι ένα Μαΐου.
        answer: Σήμερα είναι πρώτη Μαΐου.
      - id: q2
        prompt: «в четверг»
        options:
          - την Πέμπτη
          - την Παρασκευή
          - στις Πέμπτη
        answer: την Πέμπτη
        explanation: Πέμπτη — четверг, Παρασκευή — пятница.
      - id: q3
        prompt: Какой день после Τρίτη?
        options:
          - Τετάρτη
          - Πέμπτη
          - Δευτέρα
        answer: Τετάρτη
      - id: q4
        prompt: «Сегодня двадцатое октября.»
        options:
          - Σήμερα είναι είκοσι Οκτωβρίου.
          - Σήμερα είναι είκοσι Οκτώβριος.
          - Σήμερα είναι στις είκοσι Οκτωβρίου.
        answer: Σήμερα είναι είκοσι Οκτωβρίου.
  - type: exercise
    id: questions-gap
    graded: true
    title: Вопросы
    instruction: Вставьте вопросительное слово. Одно лишнее.
    format: gap
    bank:
      - Πότε
      - Πόσο
      - Τι ώρα
      - Πόσες
      - Πού
    items:
      - id: g1
        prompt: — ___ κάνει; — Είκοσι ευρώ.
        answer: Πόσο
      - id: g2
        prompt: — ___ είναι; — Είναι δύο και δέκα.
        answer: Τι ώρα
      - id: g3
        prompt: — ___ βρισκόμαστε; — Την Κυριακή.
        answer: Πότε
      - id: g4
        prompt: — ___ μέρες έχει η εβδομάδα; — Επτά.
        answer: Πόσες
        explanation: Η μέρα — женский род, οι μέρες — поэтому πόσες.
