      - id: q3
        prompt: Как сказать «Сейчас три часа»?
        options:
          - Είναι τρεις.
          - Είναι τρία.
        answer: Είναι τρεις.
        explanation: О времени — женский род, τρεις. Τρία — при счёте и о словах среднего рода.
      - id: q4
        prompt: «в шесть»
        options:
          - στις έξι
          - στη έξι
          - στο έξι
        answer: στις έξι
      - id: q5
        prompt: «в час»
        options:
          - στη μία
          - στις μία
          - στο ένα
        answer: στη μία
        explanation: Один час — единственное число, поэтому στη, а не στις.
