        - - "800"
          - οκτακόσια (οχτακόσια)
        - - "900"
          - εννιακόσια
        - - "1000"
          - χίλια
  - type: explanation
    id: agreement
    title: Один, три, четыре — по родам
    body: |-
      Большинство чисел не меняется: δύο, πέντε, δέκα, είκοσι, εκατό — одинаково для любого слова. Но **1, 3 и 4** согласуются с существительным в роде, как прилагательные.

      **Один:** ένας φίλος (м. р.), μία (μια) φίλη (ж. р.), ένα παιδί (ср. р.). **Три:** τρεις — для мужского и женского рода, τρία — для среднего. **Четыре:** τέσσερις — м. и ж. р., τέσσερα — ср. р. При счёте «раз, два, три» и в номерах телефона используют форму среднего рода: ένα, τρία, τέσσερα.

      То же правило работает внутри больших чисел: δεκατρείς φίλες, είκοσι μία μέρες, τριάντα τέσσερα παιδιά.

      **Сотни и тысяча** тоже меняются по родам: διακόσιοι φίλοι, διακόσιες φίλες, διακόσια παιδιά; χίλιοι, χίλιες, χίλια. Слово **ευρώ** — среднего рода и не склоняется, поэтому цены всегда в среднем роде: ένα ευρώ, τρία ευρώ, τριακόσια ευρώ.
