          - επτά παρά δέκα
          - εφτά παρά δέκα
          - Είναι επτά παρά δέκα
          - Είναι εφτά παρά δέκα
        explanation: «Без десяти семь» — επτά παρά δέκα.
  - type: explanation
    id: days
    title: Дни недели
    body: |-
      Греческие дни недели считаются от воскресенья: **Δευτέρα** — «второй» день (понедельник), **Τρίτη** — «третий» (вторник), **Τετάρτη** — «четвёртый» (среда), **Πέμπτη** — «пятый» (четверг). Осторожно: Πέμπτη похожа на «пятницу», но это четверг. Дальше — **Παρασκευή** (пятница), **Σάββατο** (суббота, средний род!) и **Κυριακή** (воскресенье). Пишутся с заглавной буквы.

      **«В понедельник»** — без предлога, только артикль: **τη** Δευτέρα, **την** Τρίτη, **το** Σάββατο. Правило ν вы знаете из модуля 01: ν остаётся перед гласной и перед κ, π, τ (την Τρίτη, την Πέμπτη, την Κυριακή), перед δ его нет (τη Δευτέρα).

      Вопрос о дне: **Τι μέρα είναι σήμερα;** — «Какой сегодня день?». Ответ без артикля: **Σήμερα είναι Τρίτη.** **Αύριο** — «завтра»: Αύριο είναι Τετάρτη.
    table:
      columns:
        - день
        - «в …»
        - по-русски
      rows:
        - - η Δευτέρα
          - τη Δευτέρα
          - понедельник
        - - η Τρίτη
          - την Τρίτη
          - вторник
        - - η Τετάρτη
          - την Τετάρτη
          - среда
        - - η Πέμπτη
          - την Πέμπτη
          - четверг
        - - η Παρασκευή
          - την Παρασκευή
          - пятница
        - - το Σάββατο
          - το Σάββατο
          - суббота
        - - η Κυριακή
          - την Κυριακή
          - воскресенье
  - type: exercise
    id: days-order
    title: Какой день пропущен
    instruction: Вставьте день недели. Три дня лишние.
    format: gap
    bank:
      - Δευτέρα
      - Τρίτη
      - Τετάρτη
      - Πέμπτη
      - Παρασκευή
      - Σάββατο
      - Κυριακή
