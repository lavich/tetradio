  - type: exercise
    id: questions-gap
    title: Какой вопрос
    instruction: Вставьте вопросительное слово. Одно лишнее.
    format: gap
    bank:
      - Τι ώρα
      - Πότε
      - Πόσο
      - Πόσα
      - Πόσες
      - Τι
      - Πού
      - Ποιος
    items:
      - id: g1
        prompt: — ___ είναι; — Είναι πέντε και μισή.
        answer: Τι ώρα
      - id: g2
        prompt: — ___ είναι το πάρτι; — Το Σάββατο.
        answer: Πότε
        explanation: Ответ — день, поэтому вопрос «когда?».
      - id: g3
        prompt: — ___ κάνει; — Δέκα ευρώ.
        answer: Πόσο
      - id: g4
        prompt: — ___ παιδιά έχεις; — Δύο.
        answer: Πόσα
        explanation: Το παιδί — средний род, поэтому πόσα.
      - id: g5
        prompt: — ___ μέρα είναι σήμερα; — Πέμπτη.
        answer: Τι
      - id: g6
        prompt: — ___ αδελφές έχεις; — Τρεις.
        answer: Πόσες
        explanation: Η αδελφή — женский род, поэтому πόσες.
      - id: g7
        prompt: — ___ μένεις; — Στη Λάρνακα.
        answer: Πού
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос.
    format: text
    items:
      - id: q1
        prompt: Который час?
        answer:
          - Τι ώρα είναι;
      - id: q2
        prompt: Половина четвёртого.
        answer:
          - Είναι τρεις και μισή.
          - Τρεις και μισή.
        explanation: Греки называют текущий час — «три и половина».
      - id: q3
        prompt: Без четверти восемь.
        answer:
          - Είναι οκτώ παρά τέταρτο.
          - Είναι οχτώ παρά τέταρτο.
          - Οκτώ παρά τέταρτο.
          - Οχτώ παρά τέταρτο.
      - id: q4
        prompt: Какой сегодня день недели?
        answer:
          - Τι μέρα είναι σήμερα;
          - Τι μέρα έχουμε σήμερα;
          - Τι μέρα είναι;
      - id: q5
        prompt: Завтра суббота.
        answer:
          - Αύριο είναι Σάββατο.
          - Είναι Σάββατο αύριο.
      - id: q6
        prompt: В среду в пять.
        answer:
          - Την Τετάρτη στις πέντε.
          - Στις πέντε την Τετάρτη.
        explanation: «В среду» — την Τετάρτη (без предлога), «в пять» — στις πέντε.
      - id: q7
        prompt: У меня три сестры.
        answer:
          - Έχω τρεις αδελφές.
          - Έχω τρεις αδερφές.
        explanation: Η αδελφή — женский род, поэтому τρεις.
