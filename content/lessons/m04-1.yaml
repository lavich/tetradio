        options:
          - τρεις
          - τρία
        answer: τρεις
        explanation: Η αδελφή — женский род, поэтому τρεις.
      - id: q3
        prompt: Είναι ___ φίλη μου.
        options:
          - ένας
          - μία
          - ένα
        answer: μία
        explanation: Η φίλη — женский род.
      - id: q4
        prompt: Ο Κώστας είναι ___ φίλος μου.
        options:
          - ένας
          - μία
          - ένα
        answer: ένας
      - id: q5
        prompt: Έχω ___ φίλες στη Λεμεσό.
        options:
          - τέσσερις
          - τέσσερα
        answer: τέσσερις
      - id: q6
        prompt: Κάνει ___ ευρώ. (κάνει — стоит)
        options:
          - τριακόσιοι
          - τριακόσιες
          - τριακόσια
        answer: τριακόσια
        explanation: Ευρώ — среднего рода, поэтому цены всегда в среднем роде.
      - id: q7
        prompt: Εδώ μένουν ___ άνθρωποι.
        options:
          - χίλιοι
          - χίλιες
          - χίλια
        answer: χίλιοι
        explanation: Ο άνθρωπος — мужской род, οι άνθρωποι — мн. ч.
      - id: q8
        prompt: Στη σχολή είναι ___ γυναίκες. (13; η σχολή — школа)
        options:
          - δεκατρείς
          - δεκατρία
        answer: δεκατρείς
        explanation: Η γυναίκα — женский род. 13 оканчивается на «три», поэтому тоже меняется.
  - type: explanation
    id: time
    title: Который час
    body: |-
      **Τι ώρα είναι;** — «Который час?», дословно «Какой час есть?». Ответ: **Είναι** + число. Слово **η ώρα** — женского рода, поэтому 1, 3 и 4 стоят в женской форме: Είναι **μία**. Είναι **τρεις**. Είναι **τέσσερις**. Остальные числа не меняются: Είναι δύο, πέντε, δώδεκα.

      Минуты **после** часа — через **και** («и»): πέντε και δέκα — 5:10, πέντε και **τέταρτο** — 5:15, πέντε και **μισή** — 5:30. Μισή — в женском роде, потому что речь о ώρα.

      Минуты **до** часа — через **παρά** («без»): έξι παρά είκοσι — 5:40, έξι παρά τέταρτο — 5:45.

      Главная ловушка — половина. Русское «половина четвёртого» называет следующий час, греческое **τρεις και μισή** — текущий: «три и половина». Считайте так: 3:30 — это τρεις και μισή.

      **Во сколько?** — **στις** + число: στις πέντε — «в пять», στις τρεις και μισή — «в половине четвёртого». Один час — единственное число: **στη μία** — «в час».
    table:
      columns:
        - время
        - по-гречески
      rows:
        - - "1:00"
          - Είναι μία.
        - - "3:00"
          - Είναι τρεις.
        - - "4:15"
          - Είναι τέσσερις και τέταρτο.
        - - "3:30"
          - Είναι τρεις και μισή.
        - - "7:10"
          - Είναι επτά και δέκα.
        - - "8:45"
          - Είναι εννιά παρά τέταρτο.
        - - "12:40"
          - Είναι μία παρά είκοσι.
        - - в 1:00
          - στη μία
        - - в 6:30
          - στις έξι και μισή
