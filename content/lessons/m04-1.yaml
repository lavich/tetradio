blocks:
  - type: explanation
    id: hundreds
    title: Числа до 1000
    body: |-
      Вспомним числа до 100. От 13 до 19 — «десять + число» одним словом: δεκατρία, δεκατέσσερα, δεκαπέντε, δεκαέξι, δεκαεπτά (δεκαεφτά), δεκαοκτώ (δεκαοχτώ), δεκαεννέα (δεκαεννιά). Десятки и единицы стоят рядом, **без «и»**: 35 — τριάντα πέντε, 99 — ενενήντα εννιά.

      **Сто — εκατό.** Если за сотней идёт ещё число, говорят **εκατόν**: 105 — εκατόν πέντε, 150 — εκατόν πενήντα. Просто «сто евро» — εκατό ευρώ.

      Сотни от 200 до 900 строятся по одному образцу: число + **-κόσια**. Большое число читается слева направо, тоже без «и»: 345 — τριακόσια σαράντα πέντε, 999 — εννιακόσια ενενήντα εννιά.

      **Тысяча — χίλια.** Дальше пока только узнавать: 2000 — δύο χιλιάδες, год 2027 — δύο χιλιάδες είκοσι επτά.
    table:
      columns:
        - число
        - по-гречески
      rows:
        - - "100"
          - εκατό
        - - "101"
          - εκατόν ένα
