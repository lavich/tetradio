        prompt: Δευτέρα, ___, Τετάρτη
        answer: Τρίτη
      - id: g2
        prompt: Τετάρτη, ___, Παρασκευή
        answer: Πέμπτη
        explanation: Πέμπτη — четверг, «пятый» день, если считать от воскресенья.
      - id: g3
        prompt: Παρασκευή, ___, Κυριακή
        answer: Σάββατο
      - id: g4
        prompt: Σάββατο, ___, Δευτέρα
        answer: Κυριακή
  - type: exercise
    id: days-choice
    title: Дни и «в какой день»
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Πέμπτη — это…
        options:
          - среда
          - четверг
          - пятница
        answer: четверг
        explanation: Пятница — Παρασκευή. Πέμπτη — «пятый» день от воскресенья, то есть четверг.
      - id: q2
        prompt: Τρίτη — это…
        options:
          - вторник
          - среда
          - третье число
        answer: вторник
      - id: q3
        prompt: «в субботу»
        options:
          - το Σάββατο
          - τη Σάββατο
          - την Σάββατο
        answer: το Σάββατο
        explanation: Σάββατο — среднего рода, артикль το.
      - id: q4
        prompt: «во вторник»
        options:
          - την Τρίτη
          - τη Τρίτη
          - το Τρίτη
        answer: την Τρίτη
        explanation: Перед τ буква ν у артикля остаётся.
      - id: q5
        prompt: "— Τι μέρα είναι σήμερα; —"
        options:
          - Σήμερα είναι Κυριακή.
          - Σήμερα είναι τρεις.
          - Στις πέντε.
        answer: Σήμερα είναι Κυριακή.
        explanation: Τι μέρα — «какой день (недели)». Σήμερα είναι τρεις — ответ о времени, а не о дне.
  - type: explanation
    id: questions
    title: Вопросительные слова
    body: |-
      **Τι;** — «что?» и «какой?»: Τι μέρα είναι σήμερα; **Τι ώρα;** — «который час?» и «во сколько?»: Τι ώρα είναι; — Είναι πέντε. Τι ώρα είναι το πάρτι; — Στις οκτώ.

      **Πότε;** — «когда?»: Πότε είναι το πάρτι; — Το Σάββατο.

      **Πόσο;** — «сколько?» о цене: **Πόσο κάνει;** — «Сколько стоит?» (κάνει — «стоит», от κάνω). О количестве πόσος меняется по родам, как прилагательное: **Πόσοι** φίλοι; **Πόσες** αδελφές; **Πόσα** παιδιά;

      Вы уже знаете **Πού;** — «где?», **Πώς;** — «как?», **Ποιος; Ποια;** — «кто?». Вопросительные слова пишутся с тоносом, кроме односложных τι и ποιος.
