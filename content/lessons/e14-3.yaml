  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы на собеседовании по алгоритмам, задачу ставит Anders, старший инженер. Прослушайте его реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику перескажите условие своими словами и задайте уточняющий вопрос. На вторую разберите небольшой пример и предложите решение в лоб. На третью назовите время и память словами. На четвёртую примите подсказку и улучшите решение. На пятую назовите крайний случай. На последнюю поблагодарите. Вся ваша часть — 180 секунд, каждая реплика — две-четыре фразы.
    seconds: 180
    model: |-
      Anders: Thanks for joining. Here is the problem. Given a text, return the first letter that appears only once. Please think out loud. I may ask questions along the way.
      You: Thank you. Let me say the problem back in my own words. I get a text, and I return the first letter that appears exactly once. What should I return if there is no such letter?
      Anders: Return nothing if there is no such letter. Please go ahead with a first solution.
      You: Let me take a small example first. In "aabcb", the answer is c. I'm going to start with a brute-force solution. For each letter, I count how many times it appears in the text, and I return the first letter with a count of one.
      Anders: What is the time complexity of that, and how much extra space does it need?
      You: I think it runs in quadratic time, because for each letter I scan the whole text. As far as I can tell, the extra space is constant.
      Anders: Can you do better? Here is a hint. Think about counting the letters.
      You: That's a helpful hint; let me try it. I'd probably use a hash map from each letter to its count. I go through the text once to count, and once more to find the first letter with a count of one. This runs in linear time and needs auxiliary space for the map.
      Anders: Which edge case would you test first?
      You: Let me look at the edge cases. I would start with an empty text, and then a text where every letter appears twice.
      Anders: Thank you. That was a clear explanation of your thinking.
      You: Thank you for the problem. With more time, I'd add tests for these cases.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — две-четыре фразы
      - В первой реплике условие пересказано и задан уточняющий вопрос, например о тексте без таких букв
      - Во второй реплике есть пример и простое решение
      - В третьей реплике время и память названы словами
      - В четвёртой реплике принята подсказка и предложено улучшение
      - В пятой реплике назван крайний случай
      - В конце есть благодарность
      - Реплики интервьюера не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: If the input were sorted, I ___ a binary search. (воображаемая ситуация)
        options:
          - would use
          - will use
          - used
        answer: would use
        explanation: Second conditional — if + past simple, would + базовая форма.
      - id: q2
        prompt: Unless the list ___ sorted, a binary search will not work.
        options:
          - is
          - is not
          - was
        answer: is
        explanation: После unless стоит утвердительная форма настоящего времени; unless уже содержит отрицание.
      - id: q3
        prompt: «Is the list sorted?» → He asked me ___.
        options:
          - whether the list was sorted
          - was the list sorted
          - whether was the list sorted
        answer: whether the list was sorted
        explanation: В косвенном вопросе порядок слов прямой, вопрос вводит whether или if.
      - id: q4
        prompt: She advised me ___ the problem aloud.
        options:
          - to repeat
          - repeat
          - repeating
        answer: to repeat
        explanation: Advised + кому + to + глагол.
      - id: q5
        prompt: If I had traced the loop, I ___ the bug earlier. (прошлое, которого не было)
        options:
          - would have found
          - would find
          - will find
        answer: would have found
        explanation: Conditional 3 — would have и третья форма глагола.
      - id: q6
        prompt: The function ___ I wrote yesterday has a bug.
        options:
          - that
          - what
          - who
        answer: that
        explanation: Для вещи в определительном придаточном стоит that или which; what не вводит определительное придаточное, who относится к людям.
