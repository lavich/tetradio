  - type: writing
    id: solution
    register: formal
    prompt: "Напишите коллеге описание решения вымышленной задачи (130–170 слов): задача, простое решение, улучшенное решение, сложность по времени и памяти словами, проверка. Назовите не меньше трёх слов урока (например, a binary search, linear, constant, a test case). Задачу придумайте сами."
    words:
      min: 130
      max: 170
    model: |-
      Subject: Search in a sorted list

      Dear Anders,

      Below is a description of my solution to the search task from Tuesday.

      The task is to check whether a number is in a sorted list. The first version, a brute-force solution, reads the list from the start and compares each number with the target. It is simple, but it runs in linear time.

      The second version uses a binary search. It keeps two pointers, which mark the part of the list that can still contain the number, and it compares the target with the middle element. Each step removes half of the list, so the solution runs in logarithmic time. It needs only constant extra space.

      My first version contained an off-by-one error. I found it with test cases for an empty list, a list with one number and a number at the end. After the fix, all the test cases passed.

      Please let me know if you have any questions.

      Kind regards
    criteria:
      - 130–170 слов, есть тема письма, обращение, описание по частям и вежливое завершение
      - Названы задача, простое решение и улучшенное решение
      - Время и память названы словами (linear, logarithmic, quadratic, constant), без формул и сокращений вроде O
      - Описана проверка — тестовые примеры и крайние случаи
      - Использованы не меньше трёх слов урока
      - Задача вымышлена, реальных систем и компаний нет
      - Формальный стиль без сокращений
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Четырнадцатый ответ вашего **банка ответов** — решение задачи вслух. К нему добавляется второй вопрос: **What is the time complexity of your solution, and could it be faster?** Первый ответ занимает до 180 секунд, второй — до минуты.

      1) Разложите первый ответ по шести шагам: условие, пример, простое решение, сложность, улучшение, проверка и итог. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: шаги идут по порядку, сложность названа словами, есть осторожные оценки и проверка. 4) Для второго вопроса назовите время и память, цену решения и то, что можно улучшить.

      Сцена в конце урока строится на задаче, которую ставит Anders и прерывает вопросами. Реплики Anders записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: aloud
    part: interview
    prompt: "Интервьюер говорит: «Given a list of numbers, how would you check whether it contains a duplicate?» Решите задачу вслух за 180 секунд: условие своими словами, пример, простое решение, сложность, улучшение, крайние случаи; в конце подведите итог."
    seconds: 180
    model: I'll think out loud, so please stop me if you need to. Let me say the problem back in my own words. I get a list of numbers, and I need to return true if any number appears twice. Let me ask one question. Can the list be empty? I will assume that it can, and I return false in that case. Let me take a small example first. Three, one, three. The answer is true. I'm going to start with a brute-force solution. I compare every number with every number after it. I think this runs in quadratic time, because of the two nested loops, and it uses constant extra space. Let me see if I can do better. I'd probably use a hash map that stores the numbers that I have already seen. I go through the list once, and for each number I do a lookup. If the number is there, I return true. A lookup takes constant time on average, so as far as I can tell this runs in linear time. It needs auxiliary space that grows with the list. It depends on how large the list can get. For a short list, the first version is arguably fine and easier to read. Now, let me look at the edge cases, an empty list, a list with one number, and a list where the duplicate is at the very end. With more time, I'd add tests for these cases. In summary, the hash map solution runs in linear time and uses linear extra space. Does this approach make sense to you?
    criteria:
      - Шаги идут по порядку — условие, пример, простое решение, сложность, улучшение, крайние случаи, итог
      - Использованы let me и I'm going to не меньше трёх раз
      - Сложность названа словами (linear, quadratic, constant), без формул
      - Есть осторожные оценки — I think, probably, as far as I can tell или it depends on
      - Названы цена улучшения (дополнительная память) и крайние случаи
      - Задача вымышлена, реальных систем нет
      - Ответ укладывается в 180 секунд
