blocks:
  - type: explanation
    id: scheme
    title: Решение задачи вслух в шести шагах
    body: |-
      На собеседовании по алгоритмам вы решаете задачу и говорите, что делаете. Единого верного порядка нет, но интервьюеру проще идти за вами, когда шаги повторяются от задачи к задаче. Ответ укладывается примерно в три минуты.

      **1. Условие.** Перескажите задачу своими словами и задайте вопрос: **Let me say the problem back in my own words.**

      **2. Пример.** Разберите небольшой пример и назовите ответ на нём: **Let me take a small example first.**

      **3. Простое решение.** Начните с решения «в лоб»: **I'm going to start with a brute-force solution.**

      **4. Сложность.** Назовите время и память словами и отметьте, насколько вы уверены: **I think this runs in linear time.**

      **5. Улучшение.** Предложите вариант быстрее и назовите его цену: **Let me see if I can do better. That would take extra memory, though.**

      **6. Проверка и итог.** Пройдите крайние случаи и подведите итог: **Let me look at the edge cases. In summary, it runs in linear time and uses constant space.**
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - условие
          - 20 секунд
          - Let me say the problem back in my own words.
        - - пример
          - 25 секунд
          - Let me take a small example first.
        - - простое решение
          - 40 секунд
          - I'm going to start with a brute-force solution.
        - - сложность
          - 25 секунд
          - I think this runs in linear time.
        - - улучшение
          - 45 секунд
          - Let me see if I can do better.
        - - проверка и итог
          - 25 секунд
          - In summary, it runs in linear time and uses constant space.
  - type: explanation
    id: safe-aloud
    title: Как говорить, когда решение не складывается
    body: |-
      Задачу на собеседовании можно решить не сразу. Важно, как вы себя ведёте: называете, что вам неясно, проверяете догадки примером и используете подсказки интервьюера. Если вы застряли, скажите, на каком шаге, и вернитесь к простому решению. Если нашли ошибку, назовите её и исправьте вслух: **I think I've found the bug.**

      Подсказку интервьюера принимают спокойно: **That's a helpful hint; let me try it.** Не оценивайте условие как неясное или плохое, говорите о том, что вам нужно уточнить. Задачи урока придуманы для курса; в своих ответах используйте придуманные примеры и данные, код и данные реальных систем и компаний не приводите.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - This is obvious.
          - Let me test this with an example.
          - догадку проверяют примером
        - - I have no idea.
          - I'm not sure yet, but I'm going to start with a brute-force solution.
          - называют шаг, с которого начнёте
        - - (молчание)
          - I'll think out loud, so please stop me if you need to.
          - интервьюер видит ход мысли
        - - Your problem is confusing.
          - Let me say the problem back in my own words.
          - называют своё понимание условия
        - - It is linear, definitely.
          - I think this runs in linear time, but let me check it with an example.
          - оценку подают как оценку
