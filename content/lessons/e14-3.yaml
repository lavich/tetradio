  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы хотите проверить пустой список и список из одного элемента. Какая фраза подходит?
        options:
          - Let me look at the edge cases.
          - In summary, it runs in linear time and uses constant space.
          - Does this approach make sense to you?
        answer: Let me look at the edge cases.
        explanation: Фраза переходит к крайним случаям; остальные подводят итог или проверяют понимание.
      - id: q2
        prompt: Вы нашли ошибку в своём коде. Какая фраза подходит?
        options:
          - I think I've found the bug.
          - I'm going to refactor this to make it cleaner.
          - So the idea is to keep two pointers.
        answer: I think I've found the bug.
        explanation: Фраза называет найденную ошибку; остальные говорят о переработке или об идее решения.
      - id: q3
        prompt: "Вы объясняете идею решения: две позиции в списке. Какая фраза подходит?"
        options:
          - So the idea is to keep two pointers.
          - Let me go through the loop one iteration at a time.
          - I'm slightly unsure about this part, so I'll test it.
        answer: So the idea is to keep two pointers.
        explanation: Фраза называет идею; остальные описывают проверку цикла или сомнение.
      - id: q4
        prompt: Вы не вполне уверены в одной части и хотите проверить её. Какая фраза подходит?
        options:
          - I'm slightly unsure about this part, so I'll test it.
          - Let me look at the edge cases.
          - With more time, I'd add tests for the edge cases.
        answer: I'm slightly unsure about this part, so I'll test it.
        explanation: Фраза называет сомнение и действие; остальные переходят к крайним случаям или к тестам на будущее.
      - id: q5
        prompt: Вы подводите итог по времени и памяти. Какая фраза подходит?
        options:
          - In summary, it runs in linear time and uses constant space.
          - Does this approach make sense to you?
          - I'm going to refactor this to make it cleaner.
        answer: In summary, it runs in linear time and uses constant space.
        explanation: Фраза называет время и память; остальные проверяют понимание или говорят о переработке.
      - id: q6
        prompt: Вы проверяете, понятен ли ход мысли интервьюеру. Какая фраза подходит?
        options:
          - Does this approach make sense to you?
          - I think I've found the bug.
          - Let me go through the loop one iteration at a time.
        answer: Does this approach make sense to you?
        explanation: Фраза — вопрос интервьюеру; остальные говорят об ошибке и о проверке цикла.
  - type: exercise
    id: aloud-choice
    title: Формулировка для решения вслух
    instruction: Выберите формулировку, которая подходит для собеседования по алгоритмам.
    format: choice
    items:
      - id: q1
        prompt: Вам дали задачу, и вы хотите, чтобы интервьюер видел ход мысли.
        options:
          - I'll think out loud, so please stop me if you need to.
          - I'll solve it in silence and show you the result.
          - Please do not interrupt me.
        answer: I'll think out loud, so please stop me if you need to.
        explanation: Фраза предлагает следить за мыслью и вмешиваться; остальные закрывают разговор.
      - id: q2
        prompt: Вы не знаете, оптимальное ли у вас решение.
        options:
          - I'm not sure that's optimal, but it works.
          - This is the best possible solution, I know it.
          - There is no better solution.
        answer: I'm not sure that's optimal, but it works.
        explanation: Фраза называет сомнение и результат; остальные утверждают без проверки.
      - id: q3
        prompt: Интервьюер подсказал идею.
        options:
          - That's a helpful hint; let me try it.
          - I already knew that.
          - That hint does not matter.
        answer: That's a helpful hint; let me try it.
        explanation: Подсказку принимают и сразу пробуют; остальные ответы отвергают помощь.
      - id: q4
        prompt: Вы выбираете структуру данных и осторожно называете причину.
        options:
          - I'd probably use a hash map, because a lookup is fast.
          - A hash map is the only possible choice.
          - A hash map, and there is nothing to discuss.
        answer: I'd probably use a hash map, because a lookup is fast.
        explanation: Выбор назван осторожно и с причиной; остальные закрывают обсуждение.
