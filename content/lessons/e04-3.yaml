blocks:
  - type: explanation
    id: formula
    title: "Схема ответа: решение, критерии, проверка, недостаток, вывод"
    body: |-
      **Why did you choose X over Y?** — вопрос, на котором интервьюер проверяет, как вы принимаете технические решения: по фактам или по моде. Ответ длится около минуты и идёт по пяти шагам.

      **1. Решение** — одно предложение: **We chose Go over Java for the new service.** Сразу называются оба варианта.

      **2. Критерии** — один-два главных: **It comes down to team experience. We compared them in terms of performance and maintenance cost.**

      **3. Проверка** — факт вместо мнения: **We tested both on a real workload. Go was almost as fast as Java, and the code was a lot less verbose.**

      **4. Недостаток выбора** — один, названный спокойно: **Its main weakness is the learning curve.** Интервьюер ожидает его услышать: так видно, что вы взвесили оба варианта.

      **5. Вывод** — условие или оценка: **For a team our size, it was the pragmatic choice. If I could choose again, I'd pick the same stack.**
    table:
      columns:
        - шаг
        - язык
        - пример
      rows:
        - - решение
          - choose X over Y, go with X
          - We chose Go over Java for the new service.
        - - критерии
          - it comes down to, in terms of
          - It comes down to team experience.
        - - проверка
          - test, benchmark, as … as, than
          - Go was almost as fast as Java.
        - - недостаток
          - the main drawback / weakness is
          - Its main weakness is the learning curve.
        - - вывод
          - for a team our size, if I could choose again
          - For a team our size, it was the pragmatic choice.
