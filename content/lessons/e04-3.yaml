  - type: exercise
    id: good-answer
    title: Подходящий ответ
    instruction: Выберите вариант, который подходит для собеседования.
    format: choice
    items:
      - id: q1
        prompt: С чего начать ответ на «Why did you choose X over Y?»
        options:
          - We chose Go over Java for the new service.
          - I always choose what is popular.
          - It was my manager's decision, so I can't say.
        answer: We chose Go over Java for the new service.
        explanation: Начало называет оба варианта и решение. Ссылка на моду и отказ отвечать не показывают, как вы рассуждали.
      - id: q2
        prompt: Как назвать главный критерий?
        options:
          - It comes down to team experience.
          - It just felt right.
          - Everybody uses it.
        answer: It comes down to team experience.
        explanation: Критерий, который можно проверить, показывает, что решение было обдуманным.
      - id: q3
        prompt: Как показать, что выбор проверен?
        options:
          - We tested both on a real workload.
          - I read a blog post about it.
          - We didn't have time to compare them.
        answer: We tested both on a real workload.
        explanation: Замер на реальной нагрузке сильнее, чем мнение из статьи.
      - id: q4
        prompt: Как назвать недостаток своего выбора?
        options:
          - Its main weakness is the learning curve.
          - It has no weaknesses.
          - I'd rather not talk about it.
        answer: Its main weakness is the learning curve.
        explanation: Один названный недостаток показывает, что вы взвесили оба варианта.
  - type: exercise
    id: grammar-fix
    title: Какое предложение верно
    instruction: Выберите верный вариант.
    format: choice
    items:
      - id: q1
        prompt: Вы сравниваете скорость двух версий.
        options:
          - It's almost as fast as the old version.
          - It's almost as faster as the old version.
          - It's almost as fast than the old version.
        answer: It's almost as fast as the old version.
        explanation: Между двумя as прилагательное стоит в исходной форме.
      - id: q2
        prompt: Вы говорите, что Python проще C++.
        options:
          - Python is much easier to learn than C++.
          - Python is much more easier to learn than C++.
          - Python is much easier to learn then C++.
        answer: Python is much easier to learn than C++.
        explanation: Один показатель сравнения и слово than.
      - id: q3
        prompt: Вы объясняете, что потребность в типах росла вместе с проектом.
        options:
          - The more we scaled, the more we needed a typed language.
          - The more we scaled, more we needed a typed language.
          - More we scaled, the more we needed a typed language.
        answer: The more we scaled, the more we needed a typed language.
        explanation: В обеих частях нужно the и сравнительная степень.
      - id: q4
        prompt: Вы называете выбранный инструмент и отвергнутый.
        options:
          - I chose Go over Java.
          - I chose Go than Java.
          - I chose Go against Java.
        answer: I chose Go over Java.
        explanation: Choose X over Y — устойчивое сочетание для «выбрать X вместо Y».
  - type: explanation
    id: writing-how
    title: Сравнение двух инструментов
    body: |-
      Письменная задача — сравнение двух инструментов, 60–100 слов, для внутренней заметки или описания проекта. Схема та же, что в устном ответе, но плотнее: что сравнивали, критерии, результат замера, решение, недостаток.

      Пишите от первого лица множественного числа или безлично, без приветствия. Формулы: 1) **Our team compared two tools for…**; 2) критерии и замер — **In our benchmark, … was almost / twice as fast as…**; 3) преимущество второго варианта — **… has a larger ecosystem, which is its main advantage**; 4) решение — **We chose X over Y because…**; 5) недостаток — **Its main drawback is…**.

      Формальный текст использует нейтральные слова: *compared, evaluated, chose*. Оценки вроде *awesome* и *terrible* не нужны: сравнение выражается числом и критерием.

      Проверьте себя: после *as … as* стоит исходная форма, после сравнительной степени — *than*; в *the more … the more* есть оба *the*; решение названо через *chose X over Y*.
