  - type: writing
    id: tools
    register: formal
    prompt: "Сравните два инструмента, которыми вы пользуетесь (60–100 слов): что сравнивали, критерии, результат замера, решение и один недостаток."
    words: { min: 60, max: 100 }
    model: Our team compared two build tools, Vite and Webpack. Vite is much faster to start, and its configuration is more concise. Webpack has a larger ecosystem of plugins, which is its main advantage. In our benchmark, the development server started three times faster with Vite, and the production build was almost as fast as with Webpack. The more the project grew, the more we noticed the difference. We chose Vite over Webpack because speed and simple configuration matter most to our team. Its main drawback is a smaller choice of plugins.
    criteria:
      - 60–100 слов, без приветствия и подписи
      - "Есть части: что сравнивали, критерии, результат замера, решение, недостаток"
      - "После as … as — исходная форма прилагательного, после сравнительной степени — than"
      - "Решение названо через chose X over Y; есть хотя бы одна конструкция the more … the more или as … as"
      - Оценочных слов вроде awesome и terrible нет, сравнение выражено критерием или числом
  - type: explanation
    id: speaking-how
    title: Как записывать ответ
    body: |-
      Четвёртый ответ вашего **банка ответов** — Why did you choose X over Y? К нему же сводятся вопросы о стеке, фреймворке и базе данных.

      1) Выберите решение, которое вы можете объяснить: оба варианта, критерий, результат проверки. 2) Выпишите ключевые слова по пяти шагам схемы, не целый текст. 3) Запишите ответ и уложитесь в 60 секунд. 4) Переслушайте и сверьте с образцом и критериями. 5) Запишите ещё раз.

      Уточняющий вопрос о недостатках проверяет, как вы взвесили оба варианта. Назовите один недостаток, объясните, как вы с ним справились, и закончите кратко.
  - type: speaking
    id: why-over
    part: monologue
    prompt: "Интервьюер: «Why did you choose X over Y?» Ответьте за 60 секунд на примере своего решения: оба варианта, критерий, результат проверки, недостаток, вывод."
    seconds: 60
    model: "We chose Go over Java for the new service. It comes down to team experience and running cost. We compared them in terms of performance and maintenance cost, and we tested both on a real workload. Go was almost as fast as Java, but it used much less memory, and the code was a lot less verbose. The more traffic we got, the more that mattered. The main drawback is a smaller ecosystem. For a team our size, it was the pragmatic choice. If I could choose again, I'd pick the same stack."
    criteria:
      - "Порядок: решение — критерий — проверка — недостаток — вывод"
      - Около 60 секунд, без долгих пауз; названы оба варианта
      - "As … as, than и the more … the more употреблены по форме: исходная форма после as … as, than после сравнительной степени"
      - "Есть результат проверки: замер, число или факт"
      - Недостаток назван спокойно, без обвинений в адрес технологии или коллег
  - type: speaking
    id: downsides
    part: interview
    prompt: "Интервьюер уточняет: «What are the downsides of that choice?» Ответьте за 30 секунд: один недостаток, как вы с ним справились, и что сейчас."
    seconds: 30
    model: "The main drawback is the ecosystem: Go has fewer ready-made libraries than Java, so we wrote some parts ourselves. We reduced the risk with a short style guide and by pairing newcomers with experienced colleagues on those parts. So far, it hasn't caused serious problems."
    criteria:
      - Назван один конкретный недостаток
      - Объяснено, как команда справилась с ним
      - Есть итог на сегодня одной фразой
      - Ответ укладывается в 30 секунд
  - type: exercise
    id: review-mixed
    title: Повторение модуля
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "The ___ the team, the harder the communication. (больше)"
        options: [bigger, more big, biggest]
        answer: bigger
        explanation: Короткое прилагательное — -er, и в конструкции the … , the … нужно the.
      - id: q2
        prompt: The new tool is twice as fast ___ the old one.
        options: [as, than, to]
        answer: as
      - id: q3
        prompt: "The old API is ___, so we should not use it in new code. (устарел)"
        options: [deprecated, lightweight, concise]
        answer: deprecated
        explanation: Deprecated — устаревший, не рекомендуемый к использованию.
      - id: q4
        prompt: "We ran a ___ to compare both tools on the same data. (замер)"
        options: [benchmark, drawback, tooling]
        answer: benchmark
      - id: q5
        prompt: "This tool is ___ our needs: a much simpler one would be enough. (слишком мощный)"
        options: [overkill for, reliable for, intuitive for]
        answer: overkill for
        explanation: Overkill for — избыточный для задачи.
      - id: q6
        prompt: "I chose Go ___ Java. (вместо)"
        options: [over, than, against]
        answer: over
