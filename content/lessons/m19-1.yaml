blocks:
  - type: explanation
    id: future-intro
    title: Θα + глагол — две формы будущего
    body: |-
      Будущее время строится просто: **θα** + глагол. Θα не изменяется и произносится без ударения, слитно со следующим словом: θα πάω [θа па́о].

      После θα, как и после να (модуль 16), бывают **две формы** — и различие между ними то же, что в русском между «сделаю» и «буду делать»:

      — **θα + форма от основы аориста** — одно действие, результат, «сделаю»: Αύριο **θα γράψω** ένα μήνυμα στη Μαρία. Το Σάββατο **θα πάμε** στη θάλασσα. Эта форма встречается чаще.

      — **θα + настоящее время** — процесс, повтор, привычка, «буду делать»: Από τη Δευτέρα **θα ξυπνάω** νωρίς κάθε μέρα. Το καλοκαίρι **θα κολυμπάω** κάθε πρωί.

      **Форма та же, что после να.** Если вы знаете να μάθω, να πάω, να δω, то знаете и θα μάθω, θα πάω, θα δω. На карточках глаголов будущее записано с модуля 02: μαθαίνω — θα μάθω, γράφω — θα γράψω.

      **Как выбрать.** Слова κάθε μέρα, κάθε Σάββατο, πάντα, συχνά, συνήθως, долгий срок (όλο το καλοκαίρι) — подсказка к настоящему времени. Одно конкретное действие — завтра, в субботу, это письмо, эти фотографии — к форме от аориста. Но одно слово αύριο ещё не решает: Αύριο **θα διαβάσω** αυτό το βιβλίο — «завтра прочитаю», Αύριο **θα διαβάζω** όλη μέρα — «завтра буду читать весь день». Смотрите на всё предложение.

      **Σχεδιάζω** — «планирую» — сам стоит в настоящем времени, а план идёт после να: Σχεδιάζουμε να πάμε στην Πάφο τον Αύγουστο.
    table:
      columns:
        - глагол
        - после να (модуль 16)
        - θα + … (сделаю)
        - θα + настоящее (буду делать)
      rows:
        - - γράφω
          - να γράψω
          - θα γράψω
          - θα γράφω
        - - διαβάζω
          - να διαβάσω
          - θα διαβάσω
          - θα διαβάζω
        - - κολυμπάω
          - να κολυμπήσω
          - θα κολυμπήσω
          - θα κολυμπάω
        - - μαθαίνω
          - να μάθω
          - θα μάθω
          - θα μαθαίνω
        - - πηγαίνω, πάω
          - να πάω
          - θα πάω
          - θα πηγαίνω
        - - βλέπω
          - να δω
          - θα δω
          - θα βλέπω
  - type: explanation
    id: future-forms
    title: Лица, отрицание, θα πρέπει
    body: |-
      Окончания обычные: -ω, -εις, -ει, -ουμε, -ετε, -ουν. Ударение — как после να: θα μιλήσω, θα μιλήσουμε; θα δω, θα δεις, но θα δούμε, θα δείτε.

      **Одна форма на всё** у глаголов без аориста — είμαι, έχω, ξέρω: **θα είμαι** εκεί στις δέκα, **θα έχω** χρόνο. У κάνω обе формы совпадают: **θα κάνω**. Поэтому о погоде: θα κάνει κρύο, θα κάνει ζέστη.

      **Отрицание** — δεν перед θα: **Δεν θα έρθω** αύριο. Порядок «θα δεν» невозможен. **Вопрос** — интонацией: Θα έρθεις το Σάββατο;

      **Короткие слова** μου, σου, το, τον… стоят между θα и глаголом: **Θα σου πω** αύριο. **Θα το** κάνω.

      **Θα πρέπει να** — «нужно будет, придётся», а ещё мягкий совет — «стоит, следовало бы»: Αύριο **θα πρέπει να** ξυπνήσω στις έξι. Θα κάνει κρύο, **θα πρέπει να** πάρεις ένα πουλόβερ. Πρέπει и здесь не изменяется: θα πρέπει να πάμε, θα πρέπει να πάτε.
    table:
      columns:
        - лицо
        - θα + … (один раз)
        - θα + настоящее
        - неправильный
      rows:
        - - εγώ
          - θα γράψω
          - θα γράφω
          - θα έρθω
        - - εσύ
          - θα γράψεις
          - θα γράφεις
          - θα έρθεις
        - - αυτός, αυτή
          - θα γράψει
          - θα γράφει
          - θα έρθει
        - - εμείς
          - θα γράψουμε
          - θα γράφουμε
          - θα έρθουμε
        - - εσείς
          - θα γράψετε
          - θα γράφετε
          - θα έρθετε
        - - αυτοί, αυτές
          - θα γράψουν
          - θα γράφουν
          - θα έρθουν
  - type: exercise
    id: future-build
    title: Сделаю
    instruction: Напишите будущее время одного действия — θα + форма от основы аориста. Можно писать с θα или без.
    format: text
    items:
      - id: q1
        prompt: Αύριο ___ στη Λάρνακα. (εμείς · πηγαίνω)
        answer:
          - θα πάμε
          - πάμε
        explanation: πήγα → να πάω → θα πάω, θα πάμε.
      - id: q2
        prompt: Το Σάββατο ___ τη γιαγιά μου. (εγώ · βλέπω)
        answer:
          - θα δω
          - δω
        explanation: είδα → θα δω. Одна короткая форма, без тоноса.
      - id: q3
        prompt: Πότε ___ από το ταξίδι; (εσύ · γυρίζω)
        answer:
          - θα γυρίσεις
          - γυρίσεις
      - id: q4
        prompt: Το βράδυ ___ ψάρι στην ταβέρνα. (εμείς · τρώω)
        answer:
          - θα φάμε
          - φάμε
        explanation: έφαγα → θα φάω, θα φάμε.
      - id: q5
        prompt: Ο Νίκος ___ στις οκτώ. (έρχομαι)
        answer:
          - θα έρθει
          - έρθει
      - id: q6
        prompt: Θα σου ___ ένα μήνυμα. (εγώ · στέλνω)
        answer:
          - στείλω
          - θα στείλω
        explanation: έστειλα → θα στείλω. Σου стоит между θα и глаголом.
      - id: q7
        prompt: Πάρε ομπρέλα, αύριο ___! (βρέχει) (ομπρέλα — зонт)
        answer:
          - θα βρέξει
          - βρέξει
        explanation: έβρεξε → θα βρέξει. «Будет дождь» — одно событие.
      - id: q8
        prompt: Τον Ιανουάριο ___ στο Τρόοδος. (χιονίζει)
        answer:
          - θα χιονίσει
          - χιονίσει
        explanation: χιόνισε → θα χιονίσει.
  - type: exercise
    id: aspect
    title: Сделаю или буду делать
    instruction: Выберите форму после θα. Ищите подсказку — повтор и привычка или одно законченное действие.
    format: choice
    items:
      - id: q1
        prompt: Από τη Δευτέρα θα ___ κάθε πρωί στις έξι.
        options:
          - ξυπνάω
          - ξυπνήσω
        answer: ξυπνάω
        explanation: Κάθε πρωί — повтор, поэтому настоящее время.
      - id: q2
        prompt: Αύριο το πρωί θα ___ το μήνυμα και μετά θα το στείλω.
        options:
          - γράφω
          - γράψω
        answer: γράψω
        explanation: Одно действие до результата — сообщение будет готово, и его отправят.
      - id: q3
        prompt: Το καλοκαίρι θα μένουμε στο χωριό και θα ___ κάθε μέρα στη θάλασσα.
        options:
          - κολυμπάμε
          - κολυμπήσουμε
        answer: κολυμπάμε
        explanation: Κάθε μέρα и всё лето — повтор.
      - id: q4
        prompt: — Θα έρθεις το Σάββατο; — Ναι, θα ___ στις εννιά.
        options:
          - έρχομαι
          - έρθω
        answer: έρθω
        explanation: Один приход в одно время — форма от аориста.
      - id: q5
        prompt: Αύριο θα σου ___ τις φωτογραφίες από το ταξίδι.
        options:
          - δείχνω
          - δείξω
        answer: δείξω
      - id: q6
        prompt: Στη νέα μου δουλειά θα ___ συχνά ελληνικά.
        options:
          - μιλάω
          - μιλήσω
        answer: μιλάω
        explanation: Συχνά — повтор.
      - id: q7
        prompt: Αυτόν τον χειμώνα θα ___ ελληνικά κάθε βράδυ.
        options:
          - διαβάζω
          - διαβάσω
        answer: διαβάζω
        explanation: Κάθε βράδυ, всю зиму — привычка.
  - type: exercise
    id: neg-prepei
    title: Δεν θα, θα πρέπει
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: — Θα έρθεις αύριο; — Όχι, ___.
        options:
          - δεν θα έρθω
          - θα δεν έρθω
          - δεν έρθω
        answer: δεν θα έρθω
        explanation: Δεν стоит перед θα; без θα это уже не будущее.
      - id: q2
        prompt: Αύριο θα κάνει κρύο. Θα ___ να πάρεις παλτό.
        options:
          - πρέπει
          - πρέπεις
          - πρέπω
        answer: πρέπει
        explanation: Πρέπει не изменяется и после θα.
      - id: q3
        prompt: Αύριο ___ στη δουλειά νωρίς. (εγώ)
        options:
          - θα πάω
          - θα πήγα
          - θα πάμε
        answer: θα πάω
        explanation: После θα не бывает прошедших окончаний (πήγα); «я» — πάω.
  - type: explanation
    id: weather
    title: Τι καιρό κάνει;
    body: |-
      **Τι καιρό κάνει σήμερα;** — «Какая сегодня погода?». Отвечают тремя способами.

      **Κάνει** + существительное: **κάνει κρύο** — холодно, **κάνει ζέστη** — жарко, тепло, **κάνει καλό καιρό** — хорошая погода. «Очень»: **Κάνει πολλή ζέστη** — здесь πολύ согласуется с η ζέστη женского рода: πολλή, с двумя λ. Но **κάνει πολύ κρύο** — το κρύο среднего рода.

      **Έχει** + существительное: **έχει ήλιο** — солнечно, **έχει λιακάδα** — солнечная погода, **έχει συννεφιά** — облачно, пасмурно, **έχει αέρα** — ветрено. Существительное — в винительном падеже: ο ήλιος → έχει ήλιο, ο αέρας → έχει αέρα.

      **Безличные глаголы**: **βρέχει** — идёт дождь, **χιονίζει** — идёт снег, **φυσάει** — дует ветер. Это одно слово, без подлежащего, и только в форме «он»: по-русски «идёт дождь», по-гречески просто βρέχει.

      Будущее — как у всех глаголов: **θα βρέξει**, **θα χιονίσει**, **θα φυσήξει**, **θα κάνει κρύο**, **θα έχει ήλιο**. О долгом процессе — настоящее время после θα: Αύριο **θα βρέχει** όλη μέρα — «завтра весь день будет идти дождь». Прошедшее пока достаточно узнавать: Χθες **έβρεξε**, **χιόνισε**, **φύσηξε**, **έκανε** κρύο.

      **Кому холодно.** Κάνει κρύο — о погоде: «на улице холодно». О себе — глагол **κρυώνω** — «мне холодно», он изменяется по лицам: κρυώνεις; — «тебе холодно?». «Мне жарко» — **ζεσταίνομαι**. А **κρύος** — прилагательное «холодный»: κρύο νερό, κρύος καφές. «Я холодный» (είμαι κρύος) о погоде не говорят.

      **Ο καιρός** — «погода»; ο αέρας — и «ветер», и «воздух»; η βροχή — дождь, το χιόνι — снег, ο ήλιος — солнце.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Κάνει κρύο. / Κάνει ζέστη.
          - Холодно. / Жарко.
        - - Κάνει πολλή ζέστη.
          - Очень жарко.
        - - Έχει ήλιο. / Έχει συννεφιά.
          - Солнечно. / Облачно.
        - - Βρέχει. / Χιονίζει. / Φυσάει.
          - Идёт дождь. / Идёт снег. / Дует ветер.
        - - Αύριο θα βρέξει.
          - Завтра будет дождь.
        - - Κρυώνω. / Ζεσταίνομαι.
          - Мне холодно. / Мне жарко.
  - type: explanation
    id: seasons
    title: Времена года и градусы
    body: |-
      **Η εποχή** — время года. **Ο χειμώνας** — зима, **η άνοιξη** — весна, **το καλοκαίρι** — лето, **το φθινόπωρο** — осень.

      «Зимой, летом» — винительный падеж с артиклем, без предлога, как τον Μάιο (модуль 04): **τον χειμώνα**, **την άνοιξη**, **το καλοκαίρι**, **το φθινόπωρο**. Το καλοκαίρι πηγαίνουμε στη θάλασσα.

      На Кипре лето длинное и жаркое: в Никосии в июле и августе бывает 40 градусов. Зима мягкая, дожди — в основном зимой, а снег идёт только в горах Троодос.

      **Градусы.** **Πόσους βαθμούς έχει;** — «Сколько градусов?». — **Έχει τριάντα πέντε βαθμούς.** Ο βαθμός вы знаете из модуля 16 как «оценку, балл»; о погоде это «градус». После έχει — винительный: βαθμούς. **Η θερμοκρασία** — температура: Η θερμοκρασία είναι είκοσι βαθμοί (после είναι — именительный: βαθμοί). **Κάτω από το μηδέν** — ниже нуля.

      Числа на 3 и 4 — в мужском роде: τρεις βαθμούς, δεκατέσσερις βαθμούς (как τρεις φίλοι, модуль 04).
    table:
      columns:
        - εποχή
        - когда
        - μήνες
      rows:
        - - ο χειμώνας
          - τον χειμώνα
          - Δεκέμβριος, Ιανουάριος, Φεβρουάριος
        - - η άνοιξη
          - την άνοιξη
          - Μάρτιος, Απρίλιος, Μάιος
        - - το καλοκαίρι
          - το καλοκαίρι
          - Ιούνιος, Ιούλιος, Αύγουστος
        - - το φθινόπωρο
          - το φθινόπωρο
          - Σεπτέμβριος, Οκτώβριος, Νοέμβριος
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: weather-match
    title: Слова урока
    instruction: Соедините русское слово с греческим. Два греческих слова лишние.
    format: match
    bank:
      - ο καιρός
      - το χιόνι
      - η βροχή
      - ο αέρας
      - ο ήλιος
      - η συννεφιά
      - το κρύο
      - η θερμοκρασία
      - η εποχή
      - το καλοκαίρι
    items:
      - id: m1
        prompt: погода
        answer: ο καιρός
      - id: m2
        prompt: снег
        answer: το χιόνι
      - id: m3
        prompt: дождь
        answer: η βροχή
      - id: m4
        prompt: ветер
        answer: ο αέρας
      - id: m5
        prompt: солнце
        answer: ο ήλιος
      - id: m6
        prompt: облачность
        answer: η συννεφιά
      - id: m7
        prompt: холод
        answer: το κρύο
      - id: m8
        prompt: температура
        answer: η θερμοκρασία
  - type: exercise
    id: weather-gap
    title: Какая погода
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - βρέχει
      - χιονίζει
      - φυσάει
      - ζέστη
      - κρύο
      - συννεφιά
      - θερμοκρασία
      - ήλιο
      - λιακάδα
    items:
      - id: g1
        prompt: Πάρε ομπρέλα, ___ πολύ! Όλοι οι δρόμοι έχουν νερό. (ομπρέλα — зонт)
        answer: βρέχει
      - id: g2
        prompt: Στο Τρόοδος ___ και όλα τα βουνά είναι άσπρα. (βουνά — горы)
        answer: χιονίζει
      - id: g3
        prompt: ___ πολύ σήμερα — κλείσε το παράθυρο!
        answer: φυσάει
      - id: g4
        prompt: Τον Αύγουστο στη Λευκωσία κάνει πολλή ___ — σαράντα βαθμούς!
        answer: ζέστη
        explanation: Πολλή — женский род, как η ζέστη.
      - id: g5
        prompt: Τον Ιανουάριο στη Μόσχα κάνει πολύ ___.
        answer: κρύο
      - id: g6
        prompt: Σήμερα δεν έχει ήλιο, έχει ___.
        answer: συννεφιά
      - id: g7
        prompt: Η ___ σήμερα είναι είκοσι πέντε βαθμοί.
        answer: θερμοκρασία
  - type: exercise
    id: seasons-choice
    title: Сезоны и градусы
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: Τι εποχή είναι τον Οκτώβριο;
        options:
          - Φθινόπωρο.
          - Άνοιξη.
          - Καλοκαίρι.
        answer: Φθινόπωρο.
      - id: q2
        prompt: Как сказать «зимой»?
        options:
          - τον χειμώνα
          - ο χειμώνας
          - τη χειμώνα
        answer: τον χειμώνα
        explanation: Винительный с артиклем, без предлога. Ο χειμώνας — мужской род, поэтому τον.
      - id: q3
        prompt: — Πόσους βαθμούς έχει; — ___
        options:
          - Έχει τριάντα βαθμούς.
          - Είναι τριάντα χρονών.
          - Κάνει τριάντα ευρώ.
        answer: Έχει τριάντα βαθμούς.
      - id: q4
        prompt: В комнате работает кондиционер. Всем нормально, а вам холодно. Что вы скажете?
        options:
          - Κρυώνω.
          - Είμαι κρύος.
          - Χιονίζει.
        answer: Κρυώνω.
        explanation: Κρυώνω — «мне холодно». Είμαι κρύος — «я холодный»; χιονίζει — «идёт снег».
  - type: exercise
    id: translate
    title: Скажите по-гречески
    instruction: Переведите на греческий. Не забудьте тонос; знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Какая сегодня погода?
        answer:
          - Τι καιρό κάνει σήμερα;
          - Σήμερα τι καιρό κάνει;
          - Πώς είναι ο καιρός σήμερα;
      - id: q2
        prompt: Очень жарко.
        answer:
          - Κάνει πολλή ζέστη.
        explanation: Η ζέστη — женский род, поэтому πολλή, а не πολύ.
      - id: q3
        prompt: Завтра будет дождь.
        answer:
          - Αύριο θα βρέξει.
          - Θα βρέξει αύριο.
          - Αύριο θα βρέχει.
          - Θα βρέχει αύριο.
        explanation: Обычно — θα βρέξει. Θα βρέχει — «будет идти (долго, весь день)» — тоже верно.
      - id: q4
