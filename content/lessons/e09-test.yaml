title: Контрольная модуля e09
kind: test
items: []
blocks:
  - type: explanation
    id: intro
    title: Перед контрольной
    body: |-
      Контрольная занимает 10–15 минут: чтение, аудирование, прошедшие времена и схема STAR, слова модуля и перевод фраз. Словарь и таблицы не открывайте: так результат покажет, что уже усвоено.

      Диалог звучит два раза; в вопросах к диалогу три варианта, верен один. Пояснения после ответа подскажут, что повторить.
  - type: reading
    id: guide
    title: "How we run behavioral interviews at Larkfield Systems"
    text: |-
      How we run behavioral interviews at Larkfield Systems

      A behavioral interview lasts about fifty minutes. The interviewer asks three or four questions that begin with "Tell me about a time…", and the candidate answers with a real example from their work.

      We listen for four things. First, the situation: was it clear what was happening and why it mattered? Second, the task: what exactly was the candidate responsible for? Third, the actions: what did the candidate do, and in which order? Fourth, the result: how did it end, and what did the candidate learn?

      Candidates often say "we" all the time. We ask follow-up questions such as "What was your role in it?" to find out what the candidate did personally. A complete answer names the candidate's own steps and also credits the team.

      We do not ask candidates to name clients or to share internal figures. A short description in general terms is enough.

      After the interview, the panel writes short notes about the answers, not about the person. The notes use the same four parts, and every note includes one example from the interview.
    glosses:
      - { text: mattered, russian: "имела значение" }
      - { text: personally, russian: лично }
      - { text: credits, russian: "отдаёт должное" }
      - { text: panel, russian: "группа интервьюеров" }
      - { text: notes, russian: заметки }
  - type: exercise
    id: guide-tf
    about: guide
    graded: true
    title: Чтение
    instruction: Верно (True) или неверно (False)?
    format: choice
    items:
      - id: q1
        prompt: A behavioral interview lasts about fifty minutes.
        options: ["True", "False"]
        answer: "True"
      - id: q2
        prompt: Candidates answer with an example from their real work.
        options: ["True", "False"]
        answer: "True"
      - id: q3
        prompt: The interviewers listen only for the actions of the candidate.
        options: ["True", "False"]
        answer: "False"
        explanation: "We listen for four things — слушают четыре части: ситуацию, задачу, действия и результат."
      - id: q4
        prompt: Follow-up questions help the interviewer find out what the candidate did personally.
        options: ["True", "False"]
        answer: "True"
      - id: q5
        prompt: Candidates must name their clients.
        options: ["True", "False"]
        answer: "False"
        explanation: We do not ask candidates to name clients — названия клиентов не нужны.
      - id: q6
        prompt: The panel's notes describe the personality of the candidate.
        options: ["True", "False"]
        answer: "False"
        explanation: The panel writes notes about the answers, not about the person — заметки описывают ответы кандидата.
  - type: listening
    id: call
    title: A behavioral interview
    plays: 2
    transcript:
      - { speaker: Mark, text: "Welcome, Camille. Let's begin. Tell me about a time you had to deal with two urgent requests at once.", audio: e09-test/call-1.mp3 }
      - { speaker: Camille, text: "Last year, I was working on a payment feature when two urgent requests arrived on the same day. The product owner wanted a bug fixed before the release, and the support team needed a report for a customer meeting.", audio: e09-test/call-2.mp3 }
      - { speaker: Mark, text: "Okay. What was your task?", audio: e09-test/call-3.mp3 }
      - { speaker: Camille, text: "My task was to decide what to do first. I was the only person who knew both parts of the system, so I was double-booked.", audio: e09-test/call-4.mp3 }
      - { speaker: Mark, text: "And what did you do?", audio: e09-test/call-5.mp3 }
      - { speaker: Camille, text: "I asked both people for the deadline and the reason behind it. The bug could cause wrong payments, so it came first. I explained this to the support team, and I offered to send a short draft of the report by noon. I also asked a colleague to check the numbers.", audio: e09-test/call-6.mp3 }
      - { speaker: Mark, text: "How did it turn out?", audio: e09-test/call-7.mp3 }
      - { speaker: Camille, text: "We fixed the bug before the release, and the support team received the report an hour before the meeting. Nobody was unhappy, because I had set expectations early.", audio: e09-test/call-8.mp3 }
      - { speaker: Mark, text: "Did you change anything in your process afterwards?", audio: e09-test/call-9.mp3 }
      - { speaker: Camille, text: "Yes. Since then, I have asked for the deadline and the reason every time, and I have kept a short list of open requests for the team.", audio: e09-test/call-10.mp3 }
      - { speaker: Mark, text: "Thank you, Camille. That was clear.", audio: e09-test/call-11.mp3 }
  - type: exercise
    id: call-q
    about: call
    graded: true
    title: Аудирование
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What did the product owner want?
        options:
          - a bug fixed before the release
          - a new feature
          - a report for a customer
        answer: a bug fixed before the release
      - id: q2
        prompt: What did the support team need?
        options:
          - a report for a customer meeting
          - a bug fix
          - a new server
        answer: a report for a customer meeting
      - id: q3
        prompt: Why was Camille double-booked?
        options:
          - She was the only person who knew both parts of the system.
          - She was on holiday.
          - She had two managers.
        answer: She was the only person who knew both parts of the system.
      - id: q4
        prompt: Why did the bug come first?
        options:
          - It could cause wrong payments.
          - The product owner was senior.
          - It was easier to fix.
        answer: It could cause wrong payments.
      - id: q5
        prompt: When did the support team receive the report?
        options: [an hour before the meeting, after the meeting, on the next day]
        answer: an hour before the meeting
      - id: q6
        prompt: What does Camille do now?
        options:
          - She asks for the deadline and the reason every time.
          - She refuses urgent requests.
          - She works longer hours.
        answer: She asks for the deadline and the reason every time.
  - type: exercise
    id: grammar
    graded: true
    title: Прошедшие времена и схема STAR
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: "I ___ on a report when the call started. (я был занят в тот момент)"
        options: [was working, were working, was work]
        answer: was working
        explanation: Действие в процессе передаёт past continuous; после I нужна форма was, затем -ing.
      - id: q2
        prompt: "By the time the interview started, I ___ my answers. (подготовил раньше)"
        options: [had prepared, have prepared, was prepare]
        answer: had prepared
        explanation: Более раннее событие стоит в past perfect — had и третья форма глагола.
      - id: q3
        prompt: "We ___ for an answer for two weeks when the client finally replied. (длилось до этого момента)"
        options: [had been waiting, are waiting, was wait]
        answer: had been waiting
        explanation: Период до события из прошлого передаёт past perfect continuous.
      - id: q4
        prompt: "I opened the ticket, and then I ___ the team. (по порядку)"
        options: [told, telling, had tell]
        answer: told
        explanation: События, которые идут одно за другим, стоят в past simple.
      - id: q5
        prompt: "When I joined, the team ___ a prototype. (прототип был готов раньше)"
        options: [had built, has build, was build]
        answer: had built
        explanation: Более раннее событие стоит в past perfect; форма had built.
      - id: q6
        prompt: "Фраза «As a result, we shipped on time» относится к части…"
        options: [Result, Task, Situation]
        answer: Result
        explanation: As a result вводит итог, то есть часть Result.
  - type: exercise
    id: words
    graded: true
    title: Слова модуля
    instruction: Вставьте слово или выражение. Два варианта лишние.
    format: gap
    bank:
      - a tight deadline
      - double-booked
      - friction
      - mediate
      - compromise
      - take the initiative
      - delegate
      - a status report
    items:
      - id: g1
        prompt: The engineer had two meetings at ten o'clock. He was ___. (занят двумя делами)
        answer: double-booked
      - id: g2
        prompt: We had only two days left, so it was ___. (жёсткий срок)
        answer: a tight deadline
      - id: g3
        prompt: There was constant ___ between the two teams, but no single argument. (трения)
        answer: friction
      - id: g4
        prompt: Neither side could win, so each of them gave up something. They had to ___. (уступить друг другу)
        answer: compromise
      - id: g5
        prompt: Nobody asked me, but I decided to ___ and write the plan. (проявить инициативу)
        answer: take the initiative
      - id: g6
        prompt: Every Friday, the lead sends ___ to the stakeholders. (отчёт о ходе работ)
        answer: a status report
