blocks:
  - type: explanation
    id: places
    title: Соседи, город и деревня
    body: |-
      **Ο γείτονας** — сосед, **η γειτόνισσα** — соседка (мн. ч. οι γείτονες). **Η γειτονιά** — округа, «наш район» вокруг дома; иногда и сами соседи: Όλη η γειτονιά ήρθε στο πάρτι. Новых соседей встречают словами **Καλώς ήρθατε στη γειτονιά!** (на «ты» — Καλώς ήρθες, модуль 01).

      Кипр делится на **επαρχίες** — административные районы: η επαρχία Λεμεσού, η επαρχία Πάφου (название — в родительном падеже). Город — это **δήμος** (первый урок модуля), а многие деревни — **κοινότητες**, общины со своим советом. **Ο κάτοικος** — житель: οι κάτοικοι του χωριού (вин. п. мн. ч. — τους κατοίκους, ударение сдвигается). **Ο πολίτης** — гражданин; в официальных объявлениях: Ο δήμος ενημερώνει τους πολίτες… — «Муниципалитет сообщает гражданам…». **Ο Κύπριος**, η Κύπρια — киприот, киприотка; прилагательное — κυπριακός (κυπριακός καφές, модуль 09).

      **Το πανηγύρι** — сельский праздник с ярмаркой: музыка, танцы, еда, лотки на площади. Часто его устраивают в день святого, которому посвящена церковь деревни.

      Жильё: **η μονοκατοικία** — частный дом на одну семью, **η πολυκατοικία** — многоквартирный дом. **Επιπλωμένος** — меблированный: επιπλωμένο διαμέρισμα (τα έπιπλα — мебель). **Ο ιδιοκτήτης**, η ιδιοκτήτρια — хозяин, владелец: ему платят ενοίκιο. **Η αγγελία** — частное объявление: αγγελία για ενοικίαση — объявление о сдаче; официальное объявление — ανακοίνωση. **Ο ηλιακός** — солнечный водонагреватель на крыше; на Кипре он стоит на крыше большинства домов.

      Если дома что-то случилось: **Έχουμε διακοπή ρεύματος.** — У нас отключили электричество. **Έχω ένα πρόβλημα με το νερό.** — У меня проблема с водой.
    table:
      columns:
        - по-гречески
        - по-русски
      rows:
        - - Καλώς ήρθατε στη γειτονιά!
          - Добро пожаловать в наш район!
        - - οι κάτοικοι του χωριού
          - жители деревни
        - - Ενοικιάζεται επιπλωμένο διαμέρισμα.
          - Сдаётся меблированная квартира.
        - - Ο ηλιακός δεν δουλεύει.
          - Водонагреватель не работает.
        - - Έχουμε διακοπή ρεύματος.
          - У нас отключили электричество.
        - - Έχω ένα πρόβλημα με το νερό.
          - У меня проблема с водой.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: words-gap
    title: Соседи и жильё
    instruction: Вставьте слово. Два слова лишние.
    format: gap
    bank:
      - γείτονες
      - γειτονιά
      - κάτοικοι
      - πανηγύρι
      - ηλιακός
      - επιπλωμένο
      - ιδιοκτήτη
      - μονοκατοικία
    items:
      - id: g1
        prompt: Το χωριό μας είναι μικρό. Οι ___ του χωριού είναι μόνο διακόσιοι.
        answer: κάτοικοι
      - id: g2
        prompt: Δεν έχουμε ζεστό νερό, γιατί ο ___ στην ταράτσα έχει βλάβη. (η ταράτσα — плоская крыша)
        answer: ηλιακός
      - id: g3
        prompt: "Το διαμέρισμα είναι ___: έχει κρεβάτι, καναπέ, τραπέζι και καρέκλες."
        answer: επιπλωμένο
        explanation: "Το διαμέρισμα — средний род: επιπλωμένο."
      - id: g4
        prompt: Το ενοίκιο το πληρώνω στον ___ κάθε μήνα.
        answer: ιδιοκτήτη
        explanation: "Ο ιδιοκτήτης → στον ιδιοκτήτη."
      - id: g5
        prompt: Την Κυριακή στο χωριό έχει ___ με μουσική, φαγητό και χορό.
        answer: πανηγύρι
      - id: g6
        prompt: Οι ___ στον δεύτερο όροφο είναι πολύ φιλικοί. (φιλικός — дружелюбный)
        answer: γείτονες
  - type: explanation
    id: board-how
    title: Как читать доску объявлений
    body: |-
      На доске объявлений (ο πίνακας ανακοινώσεων) в муниципалитете восемь коротких объявлений, а ниже — шесть человек, которым что-то нужно. Это задание «соединить» экзамена: два объявления лишние.

      Сначала прочитайте, что нужно каждому человеку, и подчеркните главное: что ищет, где, когда. Потом ищите объявление, где совпадает всё, а не одно слово. Например, если человеку нужна мебель, объявление «без мебели» не подходит, даже если там есть слово «дом».
  - type: reading
    id: board
    title: Ο πίνακας ανακοινώσεων
    text: |-
      Α. Ενοικιάζεται επιπλωμένο διαμέρισμα με ένα υπνοδωμάτιο, σε πολυκατοικία στο κέντρο της Λάρνακας. Ενοίκιο 650 ευρώ τον μήνα. Τηλέφωνο ιδιοκτήτη: 99 551 204.

      Β. Ενοικιάζεται μονοκατοικία με κήπο σε χωριό της επαρχίας Λεμεσού, είκοσι λεπτά από την πόλη. Τρία υπνοδωμάτια, χωρίς έπιπλα. Ιδανική για οικογένεια με παιδιά.

      Γ. Ο δήμος ενημερώνει τους πολίτες: την Κυριακή, από τις 9:00 μέχρι τις 13:00, μπορείτε να φέρετε παλιά ρούχα και βιβλία στο δημαρχείο. Θα τα δώσουμε σε οικογένειες που τα χρειάζονται.

      Δ. Η κοινότητα σας προσκαλεί στο πανηγύρι του Αγίου Γεωργίου, το Σάββατο από τις έξι το απόγευμα, στην πλατεία του χωριού: μουσική, χοροί και παραδοσιακά φαγητά.

      Ε. Μαθήματα ελληνικών για ξένους κατοίκους της περιοχής, κάθε Τρίτη στις επτά το βράδυ, στο πολιτιστικό κέντρο του δήμου. Για αρχάριους.

      ΣΤ. Ψάχνω κάποιον να προσέχει τη γάτα μου μία εβδομάδα τον Αύγουστο. Μένω στη γειτονιά, στην πολυκατοικία «Λεμονιά». Άννα, 96 332 190.

      Ζ. Πωλείται ηλιακός, σχεδόν καινούργιος, 200 λίτρα, σε καλή τιμή, επειδή μετακομίζουμε.

      Η. Ο διαχειριστής ενημερώνει: αύριο, από τις 8:00 μέχρι τις 12:00, θα έχουμε διακοπή ρεύματος στην πολυκατοικία.
    glosses:
      - text: Ενοικιάζεται
        russian: сдаётся (официально; в разговоре — νοικιάζεται, модуль 06)
      - text: χωρίς έπιπλα
        russian: без мебели
      - text: Ιδανική
        russian: идеальная
      - text: ενημερώνει
        russian: сообщает, информирует
      - text: που τα χρειάζονται
        russian: которым они нужны
      - text: σας προσκαλεί
        russian: приглашает вас
      - text: του Αγίου Γεωργίου
        russian: святого Георгия (род. п.)
      - text: παραδοσιακά
        russian: традиционные
      - text: πολιτιστικό κέντρο
        russian: культурный центр
      - text: αρχάριους
        russian: начинающих
      - text: να προσέχει τη γάτα μου
        russian: присматривать за моей кошкой
      - text: σχεδόν
        russian: почти
      - text: επειδή μετακομίζουμε
        russian: потому что мы переезжаем (μετακομίζω)
  - type: exercise
    id: board-match
    about: board
    title: Какое объявление?
    instruction: Какое объявление нужно каждому человеку? Два объявления лишние.
    format: match
    bank:
      - Α
      - Β
      - Γ
      - Δ
      - Ε
      - ΣΤ
      - Ζ
      - Η
    items:
      - id: m1
        prompt: Η Όλγα ήρθε μόνη της στην Κύπρο και δεν έχει έπιπλα. Ψάχνει ένα μικρό σπίτι στην πόλη.
        answer: Α
        explanation: Επιπλωμένο διαμέρισμα με ένα υπνοδωμάτιο στο κέντρο. В объявлении Β — дом без мебели в деревне.
      - id: m2
        prompt: Ο Πέτρος και η Λίνα έχουν τρία παιδιά και θέλουν να μείνουν έξω από την πόλη.
        answer: Β
        explanation: Μονοκατοικία με κήπο σε χωριό, για οικογένεια με παιδιά.
      - id: m3
        prompt: Ο Κώστας θέλει να δώσει τα παλιά ρούχα των παιδιών του σε άλλες οικογένειες.
        answer: Γ
      - id: m4
        prompt: Η Μαρία θέλει να ακούσει κυπριακή μουσική και να φάει παραδοσιακό φαγητό το Σάββατο.
        answer: Δ
        explanation: Πανηγύρι το Σάββατο — μουσική και παραδοσιακά φαγητά.
      - id: m5
        prompt: Ο Ιγκόρ μένει στην περιοχή και θέλει να μάθει ελληνικά. Είναι ελεύθερος τα βράδια.
        answer: Ε
      - id: m6
        prompt: Ο ηλιακός του Νίκου είναι πολύ παλιός και ο Νίκος θέλει να αγοράσει άλλον.
        answer: Ζ
        explanation: Πωλείται ηλιακός. Объявления ΣΤ и Η остаются лишними.
  - type: explanation
    id: listen-how
    title: Как слушать — новая соседка
    body: |-
      Ирина только что переехала в дом «Λεμονιά» — тот самый, где висело объявление в первом уроке. На лестнице её встречает соседка Эфтихия. Разговор дружеский, но соседки ещё мало знакомы, поэтому говорят на «вы». Это задание 2 экзамена: выбор из трёх вариантов.

      Прочитайте вопросы до прослушивания. Будьте внимательны: в разговоре звучат разные дни и время — выбирайте то, о чём спрашивают.

      Вы услышите: **Πώς σας φαίνεται…;** — Как вам…?, **καμιά φορά** — иногда, **την άλλη φορά** — в следующий раз, **Τέλεια!** — Отлично!, **η διάθεση** — настроение.
  - type: listening
    id: new-neighbour
    title: Η καινούργια γειτόνισσα
    plays: 2
    transcript:
      - speaker: Ευτυχία
        text: Καλημέρα! Εσείς είστε η καινούργια γειτόνισσα; Είμαι η Ευτυχία, από το διαμέρισμα απέναντι. Καλώς ήρθατε στη γειτονιά!
      - speaker: Ιρίνα
        text: Καλημέρα σας! Ευχαριστώ πολύ! Με λένε Ιρίνα. Ήρθαμε την περασμένη εβδομάδα με τον άντρα μου.
      - speaker: Ευτυχία
        text: Πώς σας φαίνεται η γειτονιά;
      - speaker: Ιρίνα
        text: Πολύ ωραία και ήσυχη. Αλλά χθες το βράδυ είχαμε διακοπή ρεύματος και δεν ξέραμε τι να κάνουμε!
      - speaker: Ευτυχία
        text: Α, ναι, αυτό γίνεται καμιά φορά το καλοκαίρι, όταν όλοι έχουν ανοιχτά τα κλιματιστικά. Την άλλη φορά τηλεφωνήστε στον διαχειριστή, τον κύριο Σάββα. Είναι πολύ καλός άνθρωπος.
      - speaker: Ιρίνα
        text: Ευχαριστώ. Και κάτι άλλο. Πότε μαζεύουν τα σκουπίδια;
      - speaker: Ευτυχία
        text: Κάθε Δευτέρα και Πέμπτη το πρωί. Ο κάδος ανακύκλωσης είναι πίσω από την πολυκατοικία. Α, και την Κυριακή έχει πανηγύρι στο χωριό μου, κοντά στη Λεμεσό. Θέλετε να έρθετε μαζί μας; Έχει μουσική, χορό και πολύ φαγητό!
      - speaker: Ιρίνα
        text: Ευχαρίστως! Τι ώρα φεύγετε;
      - speaker: Ευτυχία
        text: Στις πέντε το απόγευμα, με το αυτοκίνητό μας.
      - speaker: Ιρίνα
        text: Τέλεια! Να φέρω κάτι;
      - speaker: Ευτυχία
        text: Όχι, τίποτα! Μόνο καλή διάθεση!
  - type: exercise
    id: new-neighbour-choice
    about: new-neighbour
    title: Выбор из трёх
    instruction: Прослушайте разговор и выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: Πού μένει η Ευτυχία;
        options:
          - Στο διαμέρισμα απέναντι.
          - Στον πάνω όροφο.
          - Σε μια μονοκατοικία.
        answer: Στο διαμέρισμα απέναντι.
      - id: q2
        prompt: Πότε ήρθε η Ιρίνα στην πολυκατοικία;
        options:
          - Την περασμένη εβδομάδα.
          - Χθες το βράδυ.
          - Πριν από έναν χρόνο.
        answer: Την περασμένη εβδομάδα.
        explanation: Χθες το βράδυ — это когда отключили электричество.
      - id: q3
        prompt: Τι πρόβλημα είχε η Ιρίνα χθες;
        options:
          - Δεν είχε ρεύμα.
          - Δεν είχε νερό.
          - Ο θόρυβος την ενόχλησε.
        answer: Δεν είχε ρεύμα.
      - id: q4
        prompt: Αν δεν έχει πάλι ρεύμα, τι πρέπει να κάνει η Ιρίνα;
        options:
          - Να τηλεφωνήσει στον διαχειριστή.
          - Να τηλεφωνήσει στον δήμο.
          - Να κλείσει το κλιματιστικό.
        answer: Να τηλεφωνήσει στον διαχειριστή.
        explanation: Την άλλη φορά τηλεφωνήστε στον διαχειριστή. Кондиционеры Эфтихия упоминает только как причину.
      - id: q5
        prompt: Πότε μαζεύουν τα σκουπίδια;
        options:
          - Δευτέρα και Πέμπτη.
          - Τρίτη και Παρασκευή.
          - Κάθε μέρα.
        answer: Δευτέρα και Πέμπτη.
      - id: q6
        prompt: Τι θα κάνουν την Κυριακή;
        options:
          - Θα πάνε σε ένα πανηγύρι.
          - Θα φάνε στο σπίτι της Ευτυχίας.
          - Θα πάνε στη θάλασσα.
        answer: Θα πάνε σε ένα πανηγύρι.
  - type: explanation
    id: friendly-how
    title: Письмо другу о новом доме
    body: |-
      Задание A экзамена — дружеское письмо 80–100 слов. Подруга узнала, что вы переехали, и спрашивает, как дела. Это письмо — хорошее повторение всего курса: настоящее (описание дома), аорист (что было), будущее (планы), сравнение и приглашение.

      План:

      1. Приветствие и благодарность: Γεια σου, …! Ευχαριστώ για το μήνυμά σου!
      2. Куда вы переехали и когда: **μετακομίσαμε** — мы переехали (μετακομίζω), τον περασμένο μήνα.
      3. Какой дом — со сравнением: Το σπίτι είναι πιο μεγάλο από…, έχει…
      4. Какая округа и какие соседи: Η γειτονιά είναι… Οι γείτονές μας είναι…
      5. Одна проблема: …δεν λειτουργεί / έχουμε ένα πρόβλημα με…
      6. Приглашение и прощание: Θέλεις να έρθεις…; Θα σου αρέσει! Φιλιά, …

      Проверьте второй тонос: το μήνυμά σου, οι γείτονές μας, το σπίτι μας (без второго — ударение на предпоследнем слоге).
  - type: writing
    id: new-home
    register: friendly
    prompt: "Ваша подруга Данаи (Δανάη) пишет: «Έμαθα ότι μετακομίσατε! Πώς είναι το καινούργιο σπίτι και η γειτονιά; Γνωρίσατε τους γείτονες;» (γνωρίσατε — познакомились). Ответьте ей письмом 80–100 слов: куда и когда вы переехали, какой дом (сравните со старым), какая округа и соседи, какая есть проблема. Пригласите подругу в гости."
    words:
      min: 80
      max: 100
    model: |-
      Γεια σου, Δανάη!

      Ευχαριστώ για το μήνυμά σου! Ναι, τον περασμένο μήνα μετακομίσαμε σε μια μονοκατοικία σε ένα χωριό κοντά στη Λάρνακα. Το σπίτι είναι πιο μεγάλο από το παλιό μας διαμέρισμα και έχει κήπο. Η γειτονιά είναι πολύ ήσυχη. Οι γείτονές μας είναι Κύπριοι και είναι πολύ φιλικοί. Την πρώτη μέρα ήρθε η γειτόνισσα με γλυκά! Ένα πρόβλημα είναι ότι ο ηλιακός είναι παλιός και το πρωί δεν έχουμε πολύ ζεστό νερό. Τον Σεπτέμβριο έχει πανηγύρι στο χωριό. Θέλεις να έρθεις; Θα σου αρέσει!

      Φιλιά,
      Μαρίνα
    criteria:
      - 80–100 слов; дружеское приветствие и прощание, всё письмо на «ты»
      - Сказано, куда и когда вы переехали (μετακομίσαμε… τον περασμένο μήνα)
      - Описан дом и есть хотя бы одно сравнение (πιο μεγάλο από…)
      - Сказано об округе и соседях, названа одна проблема
      - "Разные времена: настоящее (είναι, έχει), аорист (μετακομίσαμε, ήρθε), будущее (θα σου αρέσει)"
      - Есть приглашение (Θέλεις να έρθεις…;)
      - "Второй тонос: το μήνυμά σου, οι γείτονές μας; согласование: η γειτονιά — ήσυχη, οι γείτονες — φιλικοί"
  - type: explanation
    id: speaking-how
    title: Монолог и ролевая игра
    body: |-
      **Монолог.** Во второй части экзамена могут попросить: **Μιλήστε για τη γειτονιά σας.** План: где вы живёте; что есть рядом; кто ваши соседи; как вы познакомились (аорист); что нравится и что нет; планы (θα…, θέλουμε να…). Полезно: **κυρίως** — в основном, **όπως** — как (όπως εγώ — как я).

      **Ролевая игра.** В третьей части вы разговариваете с другим экзаменуемым. Сегодня — вежливая жалоба соседу на шум. Нужно извиниться за беспокойство (**Συγγνώμη για την ενόχληση.**), объяснить проблему, попросить (**Μπορείτε να κάνετε λίγη ησυχία, παρακαλώ;**), выслушать ответ и закончить разговор дружелюбно. Соседям, с которыми вы мало знакомы, говорят «вы».

      Полезно: **Τι συμβαίνει;** — Что случилось?, **ακούγεται** — слышно, **δυνατά** — громко, **Έχετε δίκιο.** — Вы правы. Не заучивайте текст — держите в голове план. Запишите себя и сверьте с образцом и критериями.
