  - type: speaking
    id: scene
    part: roleplay
    prompt: |-
      Вы получаете по телефону предложение от Katarina из Brindle Analytics. Прослушайте её реплики на предыдущей странице; отвечайте на каждую по порядку и записывайте свою часть.
      На первую реплику поблагодарите и скажите, что рады предложению. На вторую попросите пройтись по условиям (например, по пенсионной программе). На третью спросите, есть ли гибкость в дате выхода. На четвёртую попросите время до конца следующей недели. На пятую поблагодарите и скажите, что хотите получить условия письменно. На последнюю поблагодарите и вежливо завершите разговор. Вся ваша часть — 150 секунд, каждая реплика — две-четыре фразы.
    seconds: 150
    model: |-
      Katarina: Hello, this is Katarina from Brindle Analytics. Thank you for your time during the interviews. I'm pleased to tell you that we'd like to offer you the role of backend engineer. What do you think?
      You: Thank you very much for the offer; I'm very pleased to receive it. I enjoyed meeting the team, and I'm glad to hear this.
      Katarina: The package is a base salary of seventy-five thousand a year, a signing bonus of five thousand, twenty-five days of annual leave, and a pension scheme with six percent from the company. Is there anything you would like me to go through again?
      You: Yes, thank you. Could we go through the pension scheme together? I'd like to understand how the six percent works and when it starts.
      Katarina: Let me also mention the start date. We would like you to begin on the first of April. Does that work for you?
      You: My notice period is two months, so the first of April is close. Would there be any flexibility on the start date?
      Katarina: Thank you. The offer is open until next Wednesday. When would you like to give us your answer?
      You: Could I confirm my decision by the end of next week? I'd like to read everything carefully.
      Katarina: I'll send the full details in writing today, so you can read them calmly. Is there anything else you would like to ask?
      You: Thank you. I'd be grateful for a written confirmation of the terms, including the start date. That is all for now.
      Katarina: Thank you. It was a pleasure speaking with you, and I look forward to your reply.
      You: Thank you, Katarina. It was a pleasure speaking with you too.
    criteria:
      - Ответили на все шесть реплик по порядку, каждая — две-четыре фразы
      - В первой реплике есть благодарность за предложение
      - Во второй реплике есть просьба пройтись по условиям (Could we go through…)
      - В третьей реплике есть вежливый вопрос о гибкости даты (Would there be any flexibility…)
      - В четвёртой реплике названа просьба о сроке (Could I confirm my decision by…)
      - В пятой реплике есть просьба о письменных деталях
      - В конце есть благодарность и вежливое завершение
      - Нет давления и ссылок на предложения других компаний
      - Реплики собеседника не пересказаны, ответ идёт по смыслу
  - type: exercise
    id: review-mixed
    title: Повторение модулей
    instruction: Выберите правильный вариант.
    format: choice
    items:
      - id: q1
        prompt: If I had read the contract more carefully, I ___ the clause earlier. (прошлое, которого не было)
        options:
          - would have noticed
          - would notice
          - had noticed
        answer: would have noticed
        explanation: Conditional 3 — would have и третья форма глагола.
      - id: q2
        prompt: «Have you read the offer letter?» → He asked me ___ I had read the offer letter.
        options:
          - that
          - what
          - whether
        answer: whether
        explanation: В косвенном вопросе без вопросительного слова стоит whether или if.
      - id: q3
        prompt: The recruiter ___ called me yesterday sent the offer.
        options:
          - whose
          - who
          - which
        answer: who
        explanation: Для человека в определительном придаточном стоит who; which относится к вещам, whose требует существительного.
      - id: q4
        prompt: I have been working in this team ___ 2021.
        options:
          - since
          - for
          - during
        answer: since
        explanation: После since называют момент начала; for требует периода, а during не сочетается с have been.
      - id: q5
        prompt: If I were you, I ___ ask for the details in writing.
        options:
          - will
          - had
          - would
        answer: would
        explanation: Second conditional — if + past simple, would + базовая форма.
      - id: q6
        prompt: Let me ___ you a few questions before I decide.
        options:
          - asking
          - ask
          - to ask
        answer: ask
        explanation: После let me стоит глагол без to.
