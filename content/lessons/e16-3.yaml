  - type: writing
    id: reply
    register: formal
    prompt: "Напишите письмо с ответом на предложение (130–170 слов): поблагодарите, задайте вопрос об одном из условий, попросите срок для ответа и письменное подтверждение условий. Предложение и цифры придумайте сами; давления и ссылок на другие предложения в письме нет. Используйте не меньше трёх выражений урока (например, Thank you for the offer, Could we go through, Could I confirm my decision, written confirmation)."
    words:
      min: 130
      max: 170
    model: |-
      Subject: Reply to the offer for the Data Engineer role

      Dear Ms Larsen,

      Thank you very much for the offer. I am very pleased to receive it, and I enjoyed meeting the team during the interviews.

      I have read the details carefully, and I have two questions about the package. Could we go through the pension scheme together? I would like to understand how the company's contribution works and when it starts.

      I would also like to ask about the start date. My notice period is two months, so I would like to know whether there is any flexibility on the date in your letter.

      Could I confirm my decision by the end of next week? I would like to read the contract carefully, and I would be grateful for a written confirmation of the terms before I reply.

      Thank you for your time and for the clear information. I look forward to hearing from you.

      Kind regards
    criteria:
      - 130–170 слов, есть тема письма, обращение, благодарность, вопрос об условии, просьба о сроке и вежливое завершение
      - Благодарность стоит в начале письма
      - Вопрос об условии задан спокойно (Could we go through…, Would there be any flexibility…)
      - Срок ответа и письменное подтверждение запрошены вежливо (Could I confirm my decision…, written confirmation)
      - Нет ультиматумов, давления и ссылок на предложения других компаний
      - Использованы не меньше трёх выражений урока
      - Предложение и цифры придуманы, реальных компаний нет
      - Формальный стиль без сокращений
  - type: explanation
    id: speaking-how
    title: Как записывать ответы
    body: |-
      Шестнадцатый ответ вашего **банка ответов** — **Do you have any questions for us?** К нему добавляется второй вопрос — ответ на предложение: **We would like to offer you the role. What do you think?** Первый ответ занимает до двух минут, второй — до минуты.

      1) Разложите первый ответ по пяти шагам: благодарность, вопрос о работе команды, вопрос об успехе и росте, вопрос о трудностях или процессе, следующие шаги. 2) Запишите ответ вслух и уложитесь во время. 3) Переслушайте и сверьте с образцом и критериями: вопросы о работе команды, без вопросов об отпуске и деньгах на этом этапе. 4) Для второго ответа назовите благодарность, просьбу пройтись по условиям и срок решения.

      Сцена в конце урока проходит по телефону: Katarina звонит с предложением и спрашивает, что вы думаете. Реплики Katarina записаны ниже, перед сценой; вы слушаете их по порядку и отвечаете вслух.
  - type: speaking
    id: questions
    part: interview
    prompt: "Интервьюер заканчивает собеседование словами: «Thank you for your answers. Do you have any questions for us?» Ответьте за 2 минуты: поблагодарите, задайте три–четыре вопроса о работе команды, об успехе в роли, о том, чем команда занимается сейчас, и о следующих шагах, завершите разговор."
    seconds: 120
    model: Thank you. Yes, I have a few questions. First, what does a typical day look like for the team? I would like to understand how the work is organised. Second, how is success measured in this role? I am interested in what you would expect from me in the first three months. Third, what has the team been focusing on this quarter? I have been working on similar services for three years, so I would like to know where I could help most. Finally, what are the next steps, and when can I expect to hear back? Thank you very much. It was a pleasure speaking with you.
    criteria:
      - "Шаги идут по порядку: благодарность, три–четыре вопроса, следующие шаги, завершение"
      - Вопросы касаются работы команды, успеха в роли, текущих задач, трудностей или роста
      - "Нет вопросов об отпуске и деньгах: они относятся к разговору о предложении"
      - Есть не меньше одного вопроса с present perfect continuous или с вводной частью Could you tell me…
      - Ответ укладывается в 2 минуты
  - type: speaking
    id: offer
    part: monologue
    prompt: "Рекрутер говорит: «We would like to offer you the role. What do you think?» Ответьте за 60 секунд: поблагодарите, попросите пройтись по условиям, назовите срок решения и попросите детали письменно."
    seconds: 60
    model: Thank you very much. I am very pleased to receive the offer, and I enjoyed meeting the team. Could we go through the full package together, especially the pension scheme and the start date? Could I confirm my decision by the end of next week? And could you send the details in writing? Thank you again for the offer.
    criteria:
      - Есть благодарность за предложение
      - Просьба пройтись по условиям сформулирована вопросом
      - Назван срок решения (Could I confirm my decision by…)
      - Есть просьба о письменных деталях
      - Нет давления и ссылок на предложения других компаний
      - Ответ укладывается в 60 секунд
