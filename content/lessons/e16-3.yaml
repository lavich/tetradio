blocks:
  - type: explanation
    id: scheme
    title: Вопросы интервьюеру в пяти шагах
    body: |-
      Вопрос **Do you have any questions for us?** задают почти на каждом собеседовании. Интервьюер смотрит, насколько вам интересна работа и умеете ли вы слушать. Ответ укладывается примерно в две минуты.

      **1. Благодарность.** **Thank you. Yes, I have a few questions.**

      **2. Вопрос о работе команды.** **What does a typical day look like for the team?**

      **3. Вопрос об успехе и росте.** **How is success measured in this role?** **How do you support engineers' growth?**

      **4. Вопрос о текущей работе, трудностях или процессе.** **What has the team been focusing on this quarter?** **What are the biggest challenges the team is facing?**

      **5. Следующие шаги и завершение.** **What are the next steps, and when can I expect to hear back?** **It was a pleasure speaking with you.**

      Три–четыре вопроса достаточно. Выбирайте вопросы, ответы на которые вы не нашли в описании вакансии и на сайте компании.
    table:
      columns:
        - шаг
        - примерное время
        - язык
      rows:
        - - благодарность
          - 10 секунд
          - Thank you. Yes, I have a few questions.
        - - работа команды
          - 20 секунд
          - What does a typical day look like for the team?
        - - успех и рост
          - 30 секунд
          - How is success measured in this role?
        - - текущая работа и трудности
          - 30 секунд
          - What has the team been focusing on this quarter?
        - - следующие шаги и завершение
          - 20 секунд
          - What are the next steps, and when can I expect to hear back?
  - type: explanation
    id: offer-reply
    title: "Ответ на предложение: принять, попросить время или отказаться"
    body: |-
      После предложения есть три спокойных ответа. **Принять:** **I'm happy to accept the offer as it stands.** **Попросить время или уточнить условия:** **Could I confirm my decision by the end of next week?** **Could we go through the full package together?** **Отказаться:** **After careful consideration, I've decided to decline.** Во всех трёх случаях начинайте с благодарности: **Thank you for the offer; I'm very pleased to receive it.**

      Вопрос об условиях задают как вопрос, без требований: **Would there be any flexibility on the base salary?** Фраза не обещает ничего взамен и не сравнивает предложение с другими, поэтому разговор остаётся ровным. Ссылки на предложения других компаний, ультиматумы и сроки для работодателя в такой разговор не входят.

      Курс учит английскому языку. Он не заменяет юридическую и финансовую консультацию: условия договора проверяет специалист. Цифры в уроке придуманы.
    table:
      columns:
        - вместо
        - скажите
        - почему
      rows:
        - - I have to decide today.
          - Could I confirm my decision by the end of next week?
          - просьба о сроке
        - - Is this the best you can do?
          - Could we go through the full package together?
          - вопрос о подробностях
        - - Pay more, or I will say no.
          - Would there be any flexibility on the base salary?
          - вопрос без давления
        - - No.
          - After careful consideration, I've decided to decline.
          - отказ с благодарностью и объяснением
        - - OK, I take it.
          - I'm happy to accept the offer as it stands.
          - согласие названо полностью и вежливо
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrase-choice
    title: Подходящая фраза
    instruction: Выберите фразу, которая подходит к ситуации.
    format: choice
    items:
      - id: q1
        prompt: Вы прощаетесь и благодарите интервьюера за разговор.
        options:
          - It was a pleasure speaking with you.
          - After careful consideration, I've decided to decline.
          - Would there be any flexibility on the base salary?
        answer: It was a pleasure speaking with you.
        explanation: Фраза благодарит за разговор; остальные отказываются или спрашивают об условиях.
      - id: q2
        prompt: Вы хотите узнать, что происходит после собеседования и когда ждать ответа.
        options:
          - Is there anything else you'd like to know about me?
          - Thank you for the offer; I'm very pleased to receive it.
          - What are the next steps, and when can I expect to hear back?
        answer: What are the next steps, and when can I expect to hear back?
        explanation: Фраза спрашивает о следующих этапах и сроке; остальные предлагают задать вопрос о вас и благодарят за оффер.
      - id: q3
        prompt: Вы благодарите за полученное предложение.
        options:
          - I'm happy to accept the offer as it stands.
          - Thank you for the offer; I'm very pleased to receive it.
          - It was a pleasure speaking with you.
        answer: Thank you for the offer; I'm very pleased to receive it.
        explanation: Первая фраза благодарит именно за предложение; вторая завершает разговор, третья принимает условия.
      - id: q4
        prompt: Вы просите время, чтобы сообщить решение.
        options:
          - Could I confirm my decision by the end of next week?
          - I'm happy to accept the offer as it stands.
          - After careful consideration, I've decided to decline.
        answer: Could I confirm my decision by the end of next week?
        explanation: Фраза просит срок; остальные уже содержат решение.
      - id: q5
        prompt: Вы хотите вместе разобрать все условия предложения.
        options:
          - Would there be any flexibility on the base salary?
          - What are the next steps, and when can I expect to hear back?
          - Could we go through the full package together?
        answer: Could we go through the full package together?
        explanation: Go through the full package — разобрать все условия; вторая фраза касается одного условия, третья — этапов.
      - id: q6
        prompt: Вы спокойно отказываетесь после раздумий.
        options:
          - Could I confirm my decision by the end of next week?
          - After careful consideration, I've decided to decline.
          - I'm happy to accept the offer as it stands.
        answer: After careful consideration, I've decided to decline.
        explanation: Фраза сообщает об отказе; остальные принимают предложение или просят срок.
  - type: exercise
    id: answer-choice
    title: Формулировка для разговора об оффере
    instruction: Выберите формулировку, которая подходит для спокойного разговора.
    format: choice
    items:
      - id: q1
        prompt: Вы просите обсудить базовую зарплату без давления.
        options:
          - Raise the salary, or I will refuse.
          - Other companies pay me more, so you must pay more.
          - Would there be any flexibility on the base salary?
        answer: Would there be any flexibility on the base salary?
        explanation: Первая фраза задаёт вопрос; остальные ставят условие и ссылаются на других работодателей.
      - id: q2
        prompt: Вы просите время на решение.
        options:
          - You must wait until I decide.
          - Could I confirm my decision by the end of next week?
          - I will answer today or never.
        answer: Could I confirm my decision by the end of next week?
        explanation: Фраза просит срок вежливо; остальные ставят ультиматум.
      - id: q3
        prompt: Вы отказываетесь вежливо.
        options:
          - After careful consideration, I've decided to decline. Thank you for your time.
          - No. This offer is bad.
          - I will never work for you.
        answer: After careful consideration, I've decided to decline. Thank you for your time.
        explanation: Первая фраза объясняет решение и благодарит; остальные грубы.
      - id: q4
        prompt: Вы принимаете предложение и просите письменные детали.
        options:
          - I accept, but I will not read the contract.
          - I accept if you add more money by tomorrow.
          - I'm happy to accept the offer as it stands; could you send the details in writing?
        answer: I'm happy to accept the offer as it stands; could you send the details in writing?
        explanation: Первая фраза принимает условия и просит письмо; остальные пренебрегают договором или ставят условие.
