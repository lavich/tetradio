blocks:
  - type: explanation
    id: work-words
    title: Слова о работе команды
    body: |-
      Тексты урока описывают, как один человек организует работу нескольких. Слова урока образуют три группы.

      **Организация.** **Delegate** — передать часть своей работы другому человеку, **coordinate** — согласовывать действия нескольких людей или команд, **facilitate** — вести обсуждение так, чтобы высказались все и пришли к решению, **set expectations** — заранее договориться, что будет сделано и к какому сроку, **a status report** — короткий отчёт о ходе работ, **a point of contact** — человек, к которому обращаются по вопросу.

      **Люди.** **Persuade** — доводами склонить человека к решению, **buy-in** — согласие людей, от которых зависит решение, **resourceful** — находчивый, **single-handedly** — без помощи других. В ответе о командной работе слово **single-handedly** звучит редко: чаще говорят **we**.

      **Дела и ресурсы.** **Stay on top of** — успевать следить за задачами и сроками, **follow through** — выполнить обещанное, **wrap up** — закончить встречу, разговор или этап работы, **loop in** — добавить человека в переписку, чтобы он был в курсе, **workload** — объём работы на человека или команду, **bandwidth** — свободные время и силы на новую задачу. **Consequently** — вводное слово перед следствием: **The interview is a conversation. Consequently, you do not need slides.**
