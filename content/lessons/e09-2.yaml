        answer: a time she disagreed with a colleague
      - id: q2
        prompt: What were Camille and her colleague building?
        options: [a notifications service, a payment page, a mobile app]
        answer: a notifications service
      - id: q3
        prompt: What did the colleague want to use?
        options: [a message queue, a database table, a cache]
        answer: a message queue
      - id: q4
