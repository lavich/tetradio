        options: [six weeks, two weeks, three months]
        answer: six weeks
      - id: q5
        prompt: How did Camille test the two ideas?
        options:
          - They built a small prototype of each version.
          - They asked other teams to vote.
          - They read the documentation.
        answer: They built a small prototype of each version.
      - id: q6
        prompt: What did the team add later?
        options: [the queue, a second database, a mobile client]
        answer: the queue
  - type: exercise
    id: interview-star
    about: interview
    title: Какая это часть STAR
    instruction: Выберите часть схемы, к которой относится фраза из записи.
    format: choice
    items:
      - id: q1
        prompt: "«We were building the first version when we disagreed about the design.»"
        options: [Situation, Task, Action, Result]
        answer: Situation
        explanation: "Фраза описывает обстановку: что происходило, когда возникло разногласие."
      - id: q2
        prompt: "«My task was to deliver a working version in six weeks.»"
        options: [Situation, Task, Action, Result]
        answer: Task
        explanation: Фраза My task was… называет ответственность кандидата.
      - id: q3
        prompt: "«We built a small prototype of each version in two days.»"
        options: [Situation, Task, Action, Result]
        answer: Action
        explanation: Фраза описывает шаг, который сделали Camille и коллега.
      - id: q4
        prompt: "«We shipped on time, and we added the queue later.»"
        options: [Situation, Task, Action, Result]
        answer: Result
        explanation: Фраза описывает итог и следующий шаг.
