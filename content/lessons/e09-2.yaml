  - type: explanation
    id: reading-how
    title: Как читать рассказ по схеме STAR
    body: |-
      Текст по схеме STAR читается по частям. Найдите, где кончается ситуация и начинаются действия: слова **My task was…** отделяют задачу, **The first thing I did was…** открывает действия, **As a result…** вводит итог. В действиях следите за местоимениями: **I** показывает ваш личный вклад, **we** — результат команды.

      Времена подсказывают порядок. Past simple двигает рассказ вперёд, past continuous описывает фон (**we were preparing…**), past perfect указывает на то, что было раньше (**we had already lost a week**). Слова вне списков переведены под текстом.
  - type: reading
    id: blog
    title: "A STAR answer in four steps"
    text: |-
      A STAR answer in four steps

      Behavioral questions ask about the past: "Tell me about a time you faced a challenge." Interviewers use them because the way you handled a real situation shows how you work. A clear answer is short, specific and told in order. Here is an example from a candidate for a backend role.

      Situation. At my previous company, we were preparing two releases at the same time, and we had a very tight deadline. Two teams needed the same engineer, so he was double-booked, and nobody owned the problem. By the time I noticed it, we had already lost a week.

      Task. My task was to get the release out on time, and I had to coordinate the work across both teams.

      Action. The first thing I did was talk to everyone involved. Then I wrote a short plan and set expectations about who would do what. I asked my manager to help us prioritise, and I set up a daily call so that nobody was out of sync. I kept the stakeholders in the loop with a short status report every Friday.

      Result. As a result, we shipped on time. We cut the review time from three days to one. In the end, both teams agreed on a plan, and since then we have used the same process for every release.

      Notice three things. The story follows the four parts in order. Past simple moves it forward, past continuous describes the background, and past perfect shows what had happened earlier. The candidate says I for personal actions and we for the team's results: a story in which one person did everything single-handedly sounds less realistic than a story about teamwork.
    glosses:
      - { text: Behavioral, russian: поведенческие }
      - { text: handled, russian: справились с }
      - { text: specific, russian: конкретный }
      - { text: noticed, russian: заметил }
      - { text: "out of sync", russian: "не успевать за остальными" }
      - { text: Notice, russian: заметьте }
      - { text: background, russian: фон }
      - { text: realistic, russian: правдоподобно }
  - type: exercise
    id: blog-tf
    about: blog
    title: Чтение
    instruction: Верно (True) или неверно (False)?
    format: choice
    items:
      - id: q1
        prompt: Interviewers ask behavioral questions because the way a candidate handled a real situation shows how they work.
        options: ["True", "False"]
        answer: "True"
      - id: q2
        prompt: In the example, the candidate had plenty of time before the deadline.
        options: ["True", "False"]
        answer: "False"
        explanation: We had a very tight deadline — срок был жёсткий, и неделя уже была потеряна.
      - id: q3
        prompt: The candidate noticed the problem after the team had already lost a week.
        options: ["True", "False"]
        answer: "True"
      - id: q4
        prompt: The candidate asked both teams to hire another engineer.
        options: ["True", "False"]
        answer: "False"
        explanation: В тексте кандидат написал план, попросил помощи с приоритетами у руководителя и назначил ежедневный созвон.
      - id: q5
        prompt: The candidate sent a status report every Friday.
        options: ["True", "False"]
        answer: "True"
      - id: q6
        prompt: In the end, a review still took three days.
        options: ["True", "False"]
        answer: "False"
        explanation: We cut the review time from three days to one — время ревью сократили до одного дня.
  - type: exercise
    id: blog-find
    about: blog
    title: Где это сказано
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: What was the candidate's task?
        options:
          - to get the release out on time
          - to hire a new engineer
          - to write a new process for HR
        answer: to get the release out on time
      - id: q2
        prompt: What did the candidate do first?
        options:
          - talked to everyone involved
          - wrote a status report
          - asked the manager for another engineer
        answer: talked to everyone involved
      - id: q3
        prompt: How often did the candidate send a status report?
        options: [every Friday, every day, every month]
        answer: every Friday
      - id: q4
        prompt: How long did a review take at the end?
        options: [one day, three days, two weeks]
        answer: one day
      - id: q5
        prompt: What does the text advise about I and we?
        options:
          - I for personal actions, we for the team's results
          - we for all the actions
          - I for the team's results
        answer: I for personal actions, we for the team's results
  - type: exercise
    id: blog-grammar
    about: blog
    title: Времена в рассказе
    instruction: Выберите правильный ответ.
    format: choice
    items:
      - id: q1
        prompt: "«We were preparing two releases at the same time.» Почему здесь past continuous?"
        options:
          - действие было в процессе, это фон рассказа
          - действие закончилось раньше других
          - действие следует за предыдущим по порядку
        answer: действие было в процессе, это фон рассказа
        explanation: Past continuous описывает то, что происходило в то время.
      - id: q2
        prompt: "«By the time I noticed it, we had already lost a week.» Почему здесь past perfect?"
        options:
          - потеря недели произошла раньше момента, когда это заметили
          - это фон рассказа
          - это план на будущее
        answer: потеря недели произошла раньше момента, когда это заметили
        explanation: Past perfect показывает событие, которое случилось раньше другого события прошлого.
      - id: q3
        prompt: "«Two teams needed the same engineer.» В каком времени глагол needed?"
        options: [past simple, past perfect, past continuous]
        answer: past simple
        explanation: Needed — вторая форма, past simple.
      - id: q4
        prompt: Какое предложение текста относится к части Result?
        options:
          - As a result, we shipped on time.
          - My task was to get the release out on time.
          - I set up a daily call so that nobody was out of sync.
        answer: As a result, we shipped on time.
        explanation: Фраза As a result вводит итог.
  - type: reading
    id: email
    title: "Your behavioral interview on Thursday"
    text: |-
      Subject: Your behavioral interview on Thursday

      Dear Camille,

      Thank you for your time on the phone. Your next step is a behavioral interview with me and one engineer. It lasts forty-five minutes, and we wrap up with your questions to us.

      I will ask about four situations: a disagreement with a colleague, a tight deadline, a time you delegated work, and a time you persuaded a team to change a plan. Please prepare one example for each, in STAR format. Describe the work in general terms: please do not name clients or share internal figures.

      The interview is a conversation, so you do not need slides or code. Your point of contact for scheduling is Pavel Dvorak from HR. If your workload is heavy this week, tell him, and we can move the call to Friday. We would like you to be comfortable, and consequently there is no need to rush your preparation.

      Kind regards,
      Ingrid Larsen
      Engineering Manager
    glosses:
      - { text: situations, russian: ситуации }
      - { text: general terms, russian: "общих чертах" }
      - { text: internal figures, russian: "внутренние цифры" }
      - { text: comfortable, russian: "спокойно" }
      - { text: rush, russian: торопиться }
