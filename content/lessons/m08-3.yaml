blocks:
  - type: explanation
    id: phrases
    title: За столом
    body: |-
      **Καλή όρεξη!** — «Приятного аппетита!» Говорят перед едой; обычный ответ — **Ευχαριστώ, επίσης!** («Спасибо, и вам/тебе!»).

      **Στην υγειά μας!** — «За наше здоровье!» — тост, когда поднимают бокалы. Можно и **Στην υγειά σου!** (за тебя) или **Στην υγειά σας!** (за вас).

      **Είμαι χορτοφάγος.** — «Я вегетарианец» или «Я вегетарианка»: слово одно для обоих родов, меняется только артикль (ο/η χορτοφάγος). Если вы не едите мясо, но едите рыбу, скажите **Δεν τρώω κρέας.** Вежливо отказаться: **Όχι, ευχαριστώ.**
    table:
      columns:
        - реплика
        - ответ
      rows:
        - - Καλή όρεξη!
          - Ευχαριστώ, επίσης!
        - - Στην υγειά μας!
          - Στην υγειά μας!
        - - Θέλεις σουβλάκι;
          - Όχι, ευχαριστώ. Είμαι χορτοφάγος.
        - - Είναι πολύ νόστιμο!
          - Ευχαριστώ!
  - type: vocabulary
    id: words
    title: Фразы урока
  - type: exercise
    id: phrases-choice
    title: Что сказать
    instruction: Выберите подходящую реплику.
    format: choice
    items:
      - id: q1
        prompt: Все сели за стол, еда на тарелках.
        options:
          - Καλή όρεξη!
          - Καλώς ήρθες!
          - Τα λέμε!
        answer: Καλή όρεξη!
      - id: q2
        prompt: Друзья поднимают бокалы с вином.
        options:
          - Στην υγειά μας!
          - Καλή όρεξη!
          - Χάρηκα πολύ.
        answer: Στην υγειά μας!
      - id: q3
        prompt: Вам предлагают клефтико, а вы не едите ни мяса, ни рыбы.
        options:
          - Όχι, ευχαριστώ. Είμαι χορτοφάγος.
          - Ναι, είναι πολύ νόστιμο!
          - Θέλω δύο, παρακαλώ.
        answer: Όχι, ευχαριστώ. Είμαι χορτοφάγος.
      - id: q4
        prompt: "Вам говорят: «Καλή όρεξη!»"
        options:
          - Ευχαριστώ, επίσης!
          - Δεν πειράζει.
          - Στην υγειά μας!
        answer: Ευχαριστώ, επίσης!
  - type: explanation
    id: writing-how
    title: Как написать другу о еде
    body: |-
      Как и в модулях 05–07, это 40–60 слов — короткое сообщение другу. План из пяти шагов: поздоровайтесь и поблагодарите (Γεια σου, …! Ευχαριστώ πολύ!); напишите в двух-трёх предложениях, что вы любите есть и пить; скажите, чего не любите или не едите; добавьте, что обычно едите на завтрак или на ужин; задайте вопрос другу и попрощайтесь (Κι εσύ; Τα λέμε!).

      Связывайте предложения: **και** — и, **αλλά** — но, **γιατί** — потому что, **συνήθως**, **πάντα**, **δεν … ποτέ**.

      Проверьте себя после письма. После **αρέσει** — именительный падеж: μου αρέσει **ο** μουσακάς. После **τρώω, πίνω, θέλω, προτιμώ, μαγειρεύω** — винительный: προτιμώ **τον** χυμό, πίνω **καφέ**. Несколько вещей — **αρέσουν**. Прилагательное — в роде существительного. Тонос — в каждом слове из двух и больше слогов.
    table:
      columns:
        - что сказать
        - как
      rows:
        - - что любите
          - Μου αρέσει ο/η/το … / Μου αρέσουν οι/τα …
        - - что любите делать
          - Μου αρέσει να μαγειρεύω / να τρώω …
        - - что не любите
          - Δεν μου αρέσει … / Δεν τρώω … / Δεν πίνω …
        - - что предпочитаете
          - Προτιμώ τον/τη/το …
        - - что едите на завтрак
          - Για πρωινό τρώω … και πίνω …
        - - почему
          - … γιατί είναι νόστιμο / γλυκό / καυτερό.
        - - вопрос другу
          - Κι εσύ; Τι σου αρέσει να τρως;
  - type: exercise
    id: sentences
    title: Предложения о еде
    instruction: Напишите по-гречески. Знак в конце можно не ставить.
    format: text
    items:
      - id: q1
        prompt: Я люблю греческие блюда.
        answer:
          - Μου αρέσουν τα ελληνικά φαγητά.
          - Μου αρέσουν πολύ τα ελληνικά φαγητά.
        explanation: τα φαγητά — мн. ч., поэтому αρέσουν; ελληνικά — прилагательное среднего рода мн. ч.
      - id: q2
        prompt: На завтрак я пью кофе с молоком.
        answer:
          - Για πρωινό πίνω καφέ με γάλα.
          - Πίνω καφέ με γάλα για πρωινό.
        explanation: καφέ — винительный падеж, без ς.
      - id: q3
        prompt: Я не люблю острую еду.
        answer:
          - Δεν μου αρέσει το καυτερό φαγητό.
          - Δεν μου αρέσουν τα καυτερά φαγητά.
      - id: q4
        prompt: Я готовлю курицу с картошкой.
        answer:
          - Μαγειρεύω κοτόπουλο με πατάτες.
          - Εγώ μαγειρεύω κοτόπουλο με πατάτες.
          - Μαγειρεύω το κοτόπουλο με πατάτες.
      - id: q5
        prompt: Что ты любишь есть?
        answer:
          - Τι σου αρέσει να τρως;
      - id: q6
        prompt: Я предпочитаю рыбу.
        answer:
          - Προτιμώ το ψάρι.
          - Προτιμώ ψάρι.
          - Εγώ προτιμώ το ψάρι.
          - Εγώ προτιμώ ψάρι.
      - id: q7
        prompt: Он хочет салат с халлуми.
        answer:
          - Θέλει μια σαλάτα με χαλλούμι.
          - Θέλει μία σαλάτα με χαλλούμι.
          - Θέλει σαλάτα με χαλλούμι.
          - Θέλει μια σαλάτα με χαλούμι.
          - Θέλει μία σαλάτα με χαλούμι.
          - Θέλει σαλάτα με χαλούμι.
          - Αυτός θέλει μια σαλάτα με χαλλούμι.
          - Αυτός θέλει μία σαλάτα με χαλλούμι.
          - Αυτός θέλει σαλάτα με χαλλούμι.
          - Αυτός θέλει μια σαλάτα με χαλούμι.
          - Αυτός θέλει μία σαλάτα με χαλούμι.
          - Αυτός θέλει σαλάτα με χαλούμι.
  - type: writing
    id: food-message
    register: friendly
    prompt: "Ваша подруга-гречанка Данаи зовёт вас на ужин в субботу и пишет: «Τι σου αρέσει να τρως; Υπάρχει κάτι που δεν τρως;» Ответьте ей сообщением 40–60 слов: поблагодарите, напишите, что вы любите есть и пить, чего не едите или не любите, и задайте ей вопрос."
    words:
      min: 40
      max: 60
    model: Γεια σου, Δανάη! Ευχαριστώ πολύ! Μου αρέσουν τα ελληνικά φαγητά, και πιο πολύ ο μουσακάς. Τρώω ψάρι και κοτόπουλο, αλλά δεν μου αρέσει το καυτερό φαγητό. Επίσης δεν πίνω κρασί, προτιμώ χυμό ή νερό. Για γλυκό μου αρέσει το γιαούρτι με μέλι. Κι εσύ; Τι σου αρέσει να μαγειρεύεις; Τα λέμε το Σάββατο!
    criteria:
      - 40–60 слов; дружеское приветствие и прощание на «ты» (Γεια σου! … Τα λέμε!)
      - "Сказано, что вы любите: μου αρέσει + одна вещь, μου αρέσουν + несколько; после αρέσει — именительный падеж (ο μουσακάς, οι σαλάτες)"
      - Сказано, чего вы не едите или не любите (δεν τρώω…, δεν μου αρέσει…)
      - "После τρώω, πίνω, θέλω, προτιμώ — винительный падеж: τον χυμό, έναν καφέ, τη σαλάτα, καφέ без ς"
      - Названы хотя бы одно блюдо и один напиток
      - Есть вопрос подруге (Κι εσύ; Τι σου αρέσει…;)
      - Предложения связаны (και, αλλά, γιατί); тонос во всех словах из двух и больше слогов; прилагательные согласованы с существительными
  - type: explanation
    id: speaking-how
    title: Монолог о еде
    body: |-
      Во второй части устного экзамена вы говорите сами около минуты. Экзаменатор обращается на «вы»: **Τι σας αρέσει να τρώτε;** — «Что вы любите есть?». Отвечайте о себе, в 1-м лице.

      План из пяти шагов: что вы любите есть и пить; что едите на завтрак, обед или ужин; что не любите; любимое кипрское или греческое блюдо и почему (γιατί είναι νόστιμο); готовите ли вы сами (μαγειρεύω συνήθως… / δεν μαγειρεύω ποτέ).

      Не заучивайте текст наизусть — держите в голове план и говорите простыми предложениями. Запишите себя и сверьте с образцом и критериями.
  - type: speaking
    id: monologue
    part: monologue
    prompt: |-
      Экзаменатор говорит: «Μιλήστε μας για το φαγητό. Τι σας αρέσει να τρώτε και να πίνετε; Τι δεν σας αρέσει;» (Μιλήστε μας — «расскажите нам».)
      Говорите около минуты по плану, запишите ответ.
    seconds: 90
    model: Μου αρέσουν πολύ τα ελληνικά φαγητά. Για πρωινό πίνω καφέ με γάλα και τρώω ψωμί με τυρί ή ένα γιαούρτι. Για μεσημεριανό τρώω συνήθως μια σαλάτα, γιατί δουλεύω και δεν έχω χρόνο. Το βράδυ μαγειρεύω κοτόπουλο ή ψάρι με πατάτες. Στην ταβέρνα προτιμώ τους μεζέδες και το κλέφτικο, γιατί είναι πολύ νόστιμο. Μου αρέσει και το χαλλούμι. Δεν μου αρέσουν τα καυτερά φαγητά και δεν πίνω πολύ κρασί. Τα γλυκά μου αρέσουν πολύ!
    criteria:
      - Говорили около минуты, без долгих пауз
      - "Сказали, что любите и чего не любите: μου αρέσει / μου αρέσουν / δεν μου αρέσει"
      - Рассказали, что едите на завтрак, обед или ужин (για πρωινό…)
      - Назвали хотя бы одно кипрское или греческое блюдо и объяснили почему (γιατί…)
      - "Формы о себе: τρώω, πίνω, προτιμώ, μαγειρεύω — а не τρώτε, πίνετε"
      - Ударение на своём месте (φαγητό, πρωινό, χαλλούμι, νόστιμο); γ в φαγητό звучит [й], а не [г]
  - type: exercise
    id: review-acc
    title: Повторение — винительный падеж
    instruction: Вставьте артикль. Все фразы — из модулей 02–08. Два слова лишние.
    format: gap
    bank:
      - τον
      - τη
      - την
      - το
      - τους
      - τις
      - τα
      - έναν
      - ο
      - οι
    items:
      - id: g1
        prompt: Έχω ___ αδελφό και μία αδελφή.
        answer: έναν
      - id: g2
        prompt: Πώς λένε ___ αδελφό σου;
        answer: τον
      - id: g3
        prompt: Δεν μπορώ ___ Τρίτη.
        answer: την
        explanation: Перед τ буква ν у την остаётся.
      - id: g4
        prompt: Ψάχνω ___ κλειδιά μου.
        answer: τα
        explanation: "τα κλειδιά — средний род мн. ч.: τα и в именительном, и в винительном."
      - id: g5
        prompt: Πληρώνω ___ ενοίκιο κάθε μήνα.
        answer: το
      - id: g6
        prompt: Περιμένω ___ φίλες μου στο σπίτι.
        answer: τις
      - id: g7
        prompt: Το Σάββατο βλέπω ___ φίλους μου.
        answer: τους
      - id: g8
        prompt: Αγαπάω ___ μητέρα μου.
        answer: τη
        explanation: Перед μ буква ν выпадает — τη μητέρα.
  - type: exercise
    id: review-mixed
    title: Повторение — модули 01–07
    instruction: Выберите правильную форму.
    format: choice
    items:
      - id: q1
        prompt: Εμείς ___ από τη Ρωσία.
        options:
          - είμαστε
          - είστε
          - είναι
        answer: είμαστε
      - id: q2
        prompt: Στην κουζίνα ___ ένα μεγάλο ψυγείο.
        options:
          - υπάρχει
          - υπάρχουν
          - είμαι
        answer: υπάρχει
        explanation: Одна вещь — υπάρχει, несколько — υπάρχουν. Как αρέσει/αρέσουν.
      - id: q3
        prompt: Το διαμέρισμά μου είναι ___.
        options:
          - μικρός
          - μικρή
          - μικρό
        answer: μικρό
        explanation: το διαμέρισμα — средний род.
      - id: q4
        prompt: Η Άννα ___ στη Λάρνακα.
        options:
          - μένει
          - μένω
          - μένουν
        answer: μένει
      - id: q5
        prompt: — Τι ώρα ___ συνήθως; — Στις επτά.
        options:
          - ξυπνάς
          - ξυπνάω
          - ξυπνάει
        answer: ξυπνάς
      - id: q6
        prompt: Οι γονείς μου ___ ένα σπίτι στην Πάφο.
        options:
          - έχει
          - έχουν
          - έχουμε
        answer: έχουν
      - id: q7
        prompt: Εγώ δεν ___ πολύ καλά ελληνικά.
        options:
          - μιλάω
          - μιλάει
          - μιλάνε
        answer: μιλάω
  - type: exercise
    id: review-match
    title: Повторение — вопросы и ответы
    instruction: Соедините вопрос и ответ. Два ответа лишние.
    format: match
    bank:
      - Είμαι από τη Ρωσία.
      - Μένω στη Λεμεσό.
      - Ναι, έχω μία αδελφή.
      - Είναι τρεις και μισή.
      - Κάνει είκοσι ευρώ.
      - Ψωμί με τυρί.
      - Ναι, ένα τσάι, παρακαλώ.
      - Με λένε Άννα.
      - Είναι πάνω στο τραπέζι.
    items:
      - id: m1
        prompt: Από πού είσαι;
        answer: Είμαι από τη Ρωσία.
      - id: m2
        prompt: Πού μένεις;
        answer: Μένω στη Λεμεσό.
      - id: m3
        prompt: Έχεις αδέλφια;
        answer: Ναι, έχω μία αδελφή.
      - id: m4
        prompt: Τι ώρα είναι;
        answer: Είναι τρεις και μισή.
      - id: m5
        prompt: Πόσο κάνει;
        answer: Κάνει είκοσι ευρώ.
      - id: m6
        prompt: Τι τρως για πρωινό;
        answer: Ψωμί με τυρί.
      - id: m7
        prompt: Θέλεις κάτι να πιεις;
        answer: Ναι, ένα τσάι, παρακαλώ.
