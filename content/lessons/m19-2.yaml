        answer: η καταιγίδα
  - type: explanation
    id: forecast-how
    title: Как читать прогноз
    body: |-
      В прогнозе ищите три вещи: **где** (город, горы, море), **когда** (το πρωί, το απόγευμα, το βράδυ, αύριο, το Σάββατο) и **что** (дождь, солнце, ветер, градусы). Задания часто ловят именно на «когда»: дождь будет, но не утром, а вечером.

      Прочитайте прогноз по Кипру на пятницу. Незнакомые слова переведены под текстом.
  - type: reading
    id: forecast
    title: Η πρόγνωση του καιρού
    text: |-
      Η πρόγνωση του καιρού για την Παρασκευή, 14 Νοεμβρίου

      Αύριο ο καιρός θα αλλάξει. Μετά από μια ηλιόλουστη εβδομάδα, από το πρωί θα έχει σύννεφα σε όλη την Κύπρο.

      Λευκωσία: Το πρωί θα έχει ομίχλη, το απόγευμα θα βρέξει. Η θερμοκρασία θα φτάσει τους 19 βαθμούς.

      Λεμεσός και Λάρνακα: Ο ουρανός θα είναι συννεφιασμένος όλη μέρα, αλλά δεν θα βρέξει. Θα φυσάει αέρας από τη θάλασσα και θα έχει πολλή υγρασία. Θερμοκρασία: 22 βαθμοί.

      Πάφος: Θα είναι μια βροχερή μέρα. Από τις δώδεκα μέχρι τις τρεις θα έχει καταιγίδες. Θερμοκρασία: 20 βαθμοί.

      Τρόοδος: Θα κάνει πολύ κρύο. Το βράδυ θα χιονίσει στα ψηλά βουνά. Η θερμοκρασία θα είναι από 0 μέχρι 4 βαθμούς. Αν πάτε στο βουνό, θα πρέπει να οδηγείτε προσεκτικά.

      Σαββατοκύριακο: Το Σάββατο θα έχει πάλι λιακάδα και η θερμοκρασία θα ανέβει. Η Κυριακή θα είναι μια ηλιόλουστη και δροσερή μέρα, ωραία για βόλτα στη φύση.
    glosses:
      - text: Μετά από
        russian: после
      - text: προσεκτικά
        russian: осторожно
      - text: θα ανέβει
        russian: поднимется
  - type: exercise
    id: forecast-tf
    about: forecast
    title: Верно или неверно
    instruction: Прочитайте прогноз. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Αύριο θα έχει ήλιο σε όλη την Κύπρο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Από το πρωί θα έχει σύννεφα σε όλη την Κύπρο. Солнечной была прошедшая неделя.
      - id: q2
        prompt: Στη Λευκωσία θα βρέξει το πρωί.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Утром — туман (ομίχλη), дождь — после обеда (το απόγευμα).
      - id: q3
        prompt: Στη Λεμεσό δεν θα βρέξει.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q4
        prompt: Στη Λάρνακα θα φυσάει.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Θα φυσάει αέρας από τη θάλασσα — это сказано о Лимассоле и Ларнаке.
      - id: q5
        prompt: Στην Πάφο θα έχει καταιγίδες το βράδυ.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Грозы — с двенадцати до трёх, днём.
      - id: q6
        prompt: Στο Τρόοδος θα χιονίσει.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
        explanation: Το βράδυ θα χιονίσει στα ψηλά βουνά.
      - id: q7
        prompt: Την Κυριακή θα κάνει πολλή ζέστη.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Η Κυριακή θα είναι μια ηλιόλουστη και δροσερή μέρα — солнечно, но прохладно.
  - type: exercise
    id: forecast-choice
    about: forecast
    title: Выберите ответ
    instruction: Прочитайте прогноз ещё раз и выберите ответ.
    format: choice
    items:
      - id: q1
        prompt: Где в пятницу будет теплее всего?
        options:
          - в Лимассоле и Ларнаке
          - в Никосии
          - в Пафосе
          - в Троодосе
        answer: в Лимассоле и Ларнаке
        explanation: 22 градуса. В Никосии — 19, в Пафосе — 20, в Троодосе — от 0 до 4.
      - id: q2
        prompt: Что советуют тем, кто поедет в горы?
        options:
          - вести машину осторожно
          - взять зонт
          - не ездить в горы
          - выехать рано утром
        answer: вести машину осторожно
        explanation: Θα πρέπει να οδηγείτε προσεκτικά.
      - id: q3
        prompt: В пятницу в час дня вы хотите погулять по пляжу в Пафосе. Что вас ждёт?
        options:
          - гроза
          - туман
          - снег
          - солнце
        answer: гроза
        explanation: Από τις δώδεκα μέχρι τις τρεις θα έχει καταιγίδες.
  - type: explanation
    id: listen-how
    title: Как слушать прогноз
    body: |-
      Это третье задание аудирования на экзамене: один человек говорит около минуты, а вы решаете, верны ли утверждения. Запись звучит два раза.

      В первый раз поймите общую картину: какой день, жарко или холодно. Перед вторым прослушиванием прочитайте утверждения и слушайте детали — город, число градусов, сегодня или завтра. Числа звучат словами: σαράντα — 40, τριάντα τρεις — 33, είκοσι έξι — 26.
  - type: listening
    id: radio
    title: Ο καιρός σήμερα και αύριο
    plays: 2
    transcript:
      - speaker: Μάριος
        text: Καλημέρα σας! Είναι οκτώ η ώρα και πάμε στην πρόγνωση του καιρού.
      - speaker: Μάριος
        text: Σήμερα, Τετάρτη, θα έχει ήλιο σε όλη την Κύπρο και θα κάνει πολλή ζέστη. Στη Λευκωσία η θερμοκρασία θα φτάσει τους σαράντα βαθμούς. Στη Λεμεσό και στην Πάφο θα έχει τριάντα τρεις βαθμούς.
      - speaker: Μάριος
        text: Στη Λάρνακα θα έχει πολλή υγρασία. Το απόγευμα θα φυσάει λίγο στις παραλίες. Στο Τρόοδος ο καιρός θα είναι δροσερός, με είκοσι έξι βαθμούς.
      - speaker: Μάριος
        text: Από τις δώδεκα μέχρι τις τέσσερις θα πρέπει να μένετε μέσα και να πίνετε πολύ νερό.
      - speaker: Μάριος
        text: Αύριο, Πέμπτη, ο καιρός θα αλλάξει. Θα έχει σύννεφα και το απόγευμα θα έχει καταιγίδες στο Τρόοδος. Στη Λευκωσία η θερμοκρασία θα είναι τριάντα πέντε βαθμοί.
      - speaker: Μάριος
        text: Καλή σας μέρα!
  - type: exercise
    id: radio-tf
    about: radio
    title: Верно или неверно
    instruction: Прослушайте прогноз. Верно (Σωστό) или неверно (Λάθος)?
    format: choice
    items:
      - id: q1
        prompt: Σήμερα θα βρέξει στη Λευκωσία.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Сегодня солнце по всему Кипру.
      - id: q2
        prompt: Στη Λευκωσία σήμερα θα έχει σαράντα βαθμούς.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q3
        prompt: Στο Τρόοδος σήμερα θα έχει τριάντα τρεις βαθμούς.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: 33 градуса — в Лимассоле и Пафосе. В Троодосе — είκοσι έξι, 26.
      - id: q4
        prompt: Στη Λάρνακα θα έχει πολλή υγρασία.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
      - id: q5
        prompt: Από τις δώδεκα μέχρι τις τέσσερις είναι καλή ώρα για βόλτα στον ήλιο.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Θα πρέπει να μένετε μέσα — в эти часы лучше оставаться дома.
      - id: q6
        prompt: Αύριο δεν θα έχει σύννεφα.
        options:
          - Σωστό
          - Λάθος
        answer: Λάθος
        explanation: Αύριο ο καιρός θα αλλάξει. Θα έχει σύννεφα.
      - id: q7
        prompt: Αύριο θα έχει καταιγίδες στο Τρόοδος.
        options:
          - Σωστό
          - Λάθος
        answer: Σωστό
