blocks:
  - type: explanation
    id: forecast-words
    title: Слова прогноза
    body: |-
      **Η πρόγνωση του καιρού** — прогноз погоды. Прогноз говорит о будущем, поэтому почти все глаголы в нём — с θα: θα έχει ήλιο, θα βρέξει, θα φυσάει, **ο καιρός θα αλλάξει** — «погода изменится».

      **Небо.** **Ο ουρανός** — небо, **το σύννεφο** — облако, туча (мн. ч. τα σύννεφα). Θα έχει σύννεφα = θα έχει συννεφιά — «будет облачно». **Η ομίχλη** — туман, **η καταιγίδα** — гроза, буря (мн. ч. οι καταιγίδες), **η υγρασία** — влажность: θα έχει πολλή υγρασία.

      **Прилагательные погоды** согласуются с существительным, как все прилагательные на -ος (модуль 07):

      — **βροχερός** — дождливый: μια βροχερή μέρα, ένας βροχερός μήνας;
      — **συννεφιασμένος** — облачный, пасмурный: ο ουρανός είναι συννεφιασμένος;
      — **ηλιόλουστος** — солнечный: ένα ηλιόλουστο πρωί, μια ηλιόλουστη εβδομάδα;
      — **δροσερός** — прохладный, свежий (о приятной прохладе): ένα δροσερό βράδυ, δροσερό νερό.

      **Το σαββατοκύριακο** — выходные, суббота и воскресенье. «На выходных» — без предлога, как «летом»: **το σαββατοκύριακο** θα έχει ήλιο.

      **Числа в прогнозе** часто пишут цифрами: 22 βαθμοί, από 0 μέχρι 4 βαθμούς. Читайте их словами: είκοσι δύο βαθμοί, από μηδέν μέχρι τέσσερις βαθμούς. **Έχει τριάντα πέντε βαθμούς** — «тридцать пять градусов».
    table:
      columns:
        - мужской род
        - женский род
        - средний род
      rows:
        - - βροχερός
          - βροχερή
