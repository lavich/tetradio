  - type: explanation
    id: nature
    title: Природа
    body: |-
      **Η φύση** — природа. **Το βουνό** — гора (τα βουνά — горы), **το δάσος** — лес (мн. ч. τα δάση, как το λάθος → τα λάθη), **η λίμνη** — озеро, **το ποτάμι** — река.

      **Το Τρόοδος** — горы в центре Кипра, там леса, реки и зимой снег: **Θα χιονίσει στο Τρόοδος** — «В Троодосе пойдёт снег». Название среднего рода: στο Τρόοδος, από το Τρόοδος.

      Κάνω βόλτα στη φύση — гуляю на природе. Στο βουνό — в горах, στο δάσος — в лесу.
  - type: vocabulary
    id: words
    title: Слова и фразы урока
  - type: exercise
    id: adj-agree
    title: Какая погода
    instruction: Выберите форму прилагательного.
    format: choice
    items:
      - id: q1
        prompt: Σήμερα είναι μια ___ μέρα — βρέχει από το πρωί.
        options:
          - βροχερή
          - βροχερός
          - βροχερό
        answer: βροχερή
        explanation: Η μέρα — женский род (μια), поэтому βροχερή.
      - id: q2
        prompt: Ο ουρανός είναι ___ — δεν βλέπω τον ήλιο.
        options:
          - συννεφιασμένος
          - συννεφιασμένη
          - συννεφιασμένο
        answer: συννεφιασμένος
      - id: q3
        prompt: Αύριο θα είναι ένα ___ πρωί, με πολύ ήλιο.
        options:
          - ηλιόλουστο
          - ηλιόλουστη
          - ηλιόλουστος
        answer: ηλιόλουστο
        explanation: Το πρωί — средний род (ένα).
      - id: q4
        prompt: Στο βουνό τα βράδια είναι ___ — πάρε ένα πουλόβερ.
        options:
          - δροσερά
          - δροσερές
          - δροσεροί
        answer: δροσερά
        explanation: Τα βράδια — средний род, мн. ч.
      - id: q5
        prompt: Ο Δεκέμβριος είναι ένας ___ μήνας στην Κύπρο — βρέχει συχνά.
        options:
          - βροχερός
          - βροχερή
          - βροχερό
        answer: βροχερός
  - type: exercise
