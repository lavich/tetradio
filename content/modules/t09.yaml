crib:
  title: разговор
  rows:
    - [не может быть, No way!]
    - [принимаю довод, Fair enough.]
    - [не расслышал, "Sorry, what?"]
    - [не понял объяснение, You lost me.]
    - [вернуть разговор, "Sorry, you were saying?"]
    - [мне пора, "Anyway, I'd better get going."]
    - [прощание, Catch you later.]
  note: "Хвостик после утверждения отрицательный, после отрицания — утвердительный; эхо повторяет вспомогательный глагол"
