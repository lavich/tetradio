number: 1
title: Γνωριμία
subtitle: Знакомство
status: published
goal: прочитать любое слово вслух с ударением; поздороваться, представиться, спросить имя и откуда человек
grammar:
  - чтение буквосочетаний (ου, αι, ει/οι, μπ, ντ, γκ, τσ, τζ), ударение и тонос, είμαι (все лица), личные местоимения, вопрос интонацией и πώς/πού/ποιος
sessions: 3
lessons:
  - m01-1
  - m01-2
  - m01-3
  - m01-test
crib:
  title: είμαι — быть
  rows:
    - [εγώ, είμαι]
    - [εμείς, είμαστε]
    - [εσύ, είσαι]
    - [εσείς, είστε]
    - [αυτός, είναι]
    - [αυτοί, είναι]
  note: ου [у] · αι [э] · ει, οι [и] · μπ [б] · ντ [д] · γκ [г] · τσ [ц]
