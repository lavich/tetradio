crib:
  title: переписка
  rows:
    - ["о том, что нравится", I love hiking.]
    - [вежливое желание, "I'd love to hear about it."]
    - [продолжить разговор, What do you do for fun?]
    - [встречный вопрос, hbu?]
    - [честно, tbh / ngl]
    - [пригласить, Fancy a coffee sometime?]
    - [отказать вежливо, "Thanks, but I'm not ready to meet yet."]
    - [безопасность, Let's meet somewhere busy.]
  note: "После love, enjoy, be into — форма на -ing, после would love и hope — to и инфинитив. Первая встреча: людное место, дорога домой своя, друг знает, где вы"
