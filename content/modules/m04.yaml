number: 4
title: Αριθμοί, ώρα, ημερομηνίες
subtitle: Числа, время, даты
status: published
goal: назвать и понять время, дату, цену, телефон; договориться о встрече
grammar:
  - числительные до 1000 и согласование (ένας/μία/ένα, τρεις/τρία), вопросительные слова (τι, πότε, πόσο, τι ώρα), дни и месяцы
sessions: 3
lessons:
  - m04-1
  - m04-2
  - m04-3
  - m04-test
crib:
  title: Τι ώρα είναι; — время
  rows:
    - ["1:00", είναι μία]
    - ["3:00", είναι τρεις]
    - ["…:15", και τέταρτο]
    - ["…:30", και μισή]
    - ["…:45", παρά τέταρτο]
    - ["…:40", παρά είκοσι]
    - ["в 1:00", στη μία]
    - ["в 3:00", στις τρεις]
  note: "по родам: ένας, μία, ένα · τρεις, τρία · τέσσερις, τέσσερα"
