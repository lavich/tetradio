crib:
  title: заказ
  rows:
    - [заказ, "I'd like…"]
    - [решил сейчас, "I'll have…"]
    - [просьба, "Could we get…?"]
    - [о составе — any, "Any nuts in it?"]
    - [неисчисляемое, some / a bit of]
    - [слишком, too salty]
    - [недостаточно, not hot enough]
    - [каждый за своё, "Pay separately?"]
  note: "в просьбе — some: Could we get some bread?"
