crib:
  title: бар
  rows:
    - [спросить заказ, What are you having?]
    - [моя очередь, It's my round.]
    - [заплатить, I'll get this.]
    - [предложить ещё, Shall I get you another?]
    - [отказаться, "I'm good, thanks."]
