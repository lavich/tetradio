# Шаблон текста для беглого чтения: content/readings/<курс>/<id>.yaml
# `id` начинается с r- и не меняется: это ключ отметки «прочитано». `after` — урок, после прохождения которого
# текст открыт; словарь проверки — карточки и глоссы уроков курса до него включительно. Без глосс текста знакомо
# должно быть не меньше 95 % слов: незнакомое слово заменяется словом из уроков, а не прячется под глоссу.
# Глосса — `{ text: слово в тексте, russian: перевод }`; имена собственные — в `names`.
id: r-example
title: Η Άννα
after: m01-1
series: example
text: |-
  Γεια! Καλημέρα! Είμαι η Άννα. Είμαι από τη Ρωσία.
glosses: []
names: [Άννα, Ρωσία]
provenance:
