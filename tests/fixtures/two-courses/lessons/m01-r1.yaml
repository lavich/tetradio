title: Слабый навык (пример)
kind: lesson
items: []
blocks:
  - type: explanation
    id: recap
    title: Повторим είμαι
    body: "Во множественном числе: Εμείς είμαστε φίλοι — «Мы друзья»."
  - type: exercise
    id: again
    instruction: Ещё раз — форма είμαι.
    format: choice
    items:
      - id: q1
        prompt: Εμείς ___ φίλοι.
        options: [είμαστε, είναι]
        answer: είμαστε
  - type: exercise
    id: pairs
    title: Кто и какая форма
    instruction: Соедините местоимение с формой είμαι. Одна форма лишняя.
    format: match
    bank: [είμαι, είσαι, είναι, είμαστε]
    items:
      - id: m1
        prompt: εγώ
        answer: είμαι
      - id: m2
        prompt: εσύ
        answer: είσαι
      - id: m3
        prompt: εμείς
        answer: είμαστε
        explanation: εμείς — мы.
