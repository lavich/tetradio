title: Слабый навык (пример)
kind: lesson
items:
  - { kind: word, id: grafo }
  - { kind: word, id: mporo }
  - { kind: word, id: agapao }
  - { kind: word, id: rotao }
  - { kind: word, id: erxomai }
  - { kind: word, id: troo }
  - { kind: word, id: vrexei }
blocks:
  - type: explanation
    id: recap
    title: Повторим είμαι
    body: "Во множественном числе: Εμείς είμαστε φίλοι — «Мы друзья»."
  - type: explanation
    id: verbs
    title: Глаголы (пример)
    body: "Γράφω. Μπορείς; Αγαπάμε. Ρωτάς. Έρχεται. Τρώμε. Βρέχει."
  - type: vocabulary
    id: words
    title: Слова урока
  - type: exercise
    id: again
    instruction: Ещё раз — форма είμαι.
    format: choice
    items:
      - id: q1
        prompt: Εμείς ___ φίλοι.
        options: [είμαστε, είναι]
        answer: είμαστε
  - type: exercise
    id: pairs
    title: Кто и какая форма
    instruction: Соедините местоимение с формой είμαι. Одна форма лишняя.
    format: match
    bank: [είμαι, είσαι, είναι, είμαστε]
    items:
      - id: m1
        prompt: εγώ
        answer: είμαι
      - id: m2
        prompt: εσύ
        answer: είσαι
      - id: m3
        prompt: εμείς
        answer: είμαστε
        explanation: εμείς — мы.
