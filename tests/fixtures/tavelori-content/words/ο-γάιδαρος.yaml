id: w42-12
greek: ο γάιδαρος
russian: осёл
ipa: "/o ˈɣaiðaros/"
verified: true
source: "Список слов к уроку 4.2; фонетика, примеры и иллюстрации подготовлены Lexi."
image: ο-γάιδαρος.svg
reading:
  - text: "γά"
    ipa: "ˈɣa"
    explanation: "γ перед а, о, у — мягкий звонкий гортанный звук, не русское г"
  - text: "άι"
    ipa: "ˈai"
    explanation: "ударение на α разбивает αι: читается раздельно, а-и"
  - text: "δ"
    ipa: "ð"
    explanation: "δ — звонкий межзубный звук, как английское th в «this»"
examples:
  - greek: "Ο γάιδαρος κουβαλάει ξύλα."
    russian: "Осёл везёт дрова."
    target: "γάιδαρος"
