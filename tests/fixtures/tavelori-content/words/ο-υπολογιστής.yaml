id: w14-16
greek: ο υπολογιστής
russian: компьютер
ipa: "/o ipoloʝiˈstis/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: ο-υπολογιστής.svg
reading:
  - text: "υ"
    ipa: "i"
    explanation: "υ читается как и, а не как русское у"
  - text: "γι"
    ipa: "ʝi"
    explanation: "γ перед ι звучит мягко, почти как й"
examples:
  - greek: "Ο υπολογιστής μου είναι γρήγορος."
    russian: "Мой компьютер быстрый."
    target: "υπολογιστής"
    source: "Слова 4 (список слов преподавателя), с. 2"
