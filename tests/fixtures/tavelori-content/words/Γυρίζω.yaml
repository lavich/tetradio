id: w22-09
greek: Γυρίζω
russian: поворачиваться, возвращаться
ipa: "/ʝiˈrizo/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: γυρίζω.svg
reading:
  - text: "υ"
    ipa: "i"
    explanation: "υ читается как и, а не как русское у"
  - text: "ζ"
    ipa: "z"
    explanation: "ζ — всегда звонкое з"
examples:
