id: w22-18
greek: Γρήγορος
russian: быстрый
ipa: "/ˈɣriɣoros/"
verified: true
source: "Набор класса A2 — 26-27; фонетика, примеры и иллюстрации подготовлены Lexi."
image: γρήγορος.svg
reading:
  - text: "ή"
    ipa: "i"
    explanation: "η читается как и — в греческом несколько букв для звука и"
  - text: "γο"
    ipa: "ɣo"
    explanation: "γ перед ο — звонкий гортанный, как украинское «г»"
examples:
  - greek: "Ο αδελφός μου είναι πολύ γρήγορος."
    russian: "Мой брат очень быстрый."
    target: "γρήγορος"
